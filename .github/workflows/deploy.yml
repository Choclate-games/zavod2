# Автообновление фабрики на мини-ПК.
#
# ВАЖНО про триггеры. Репозиторий публичный, а раннер self-hosted и стоит на
# домашней машине. Поэтому здесь НЕТ и не должно появиться `pull_request`:
# иначе любой человек с форком присылает PR и выполняет свой код на мини-ПК.
# `push` в main умеет делать только тот, у кого есть доступ на запись, и с
# форков он не срабатывает — это единственный безопасный триггер для такой
# схемы.
#
# Как устроен деплой. Job подключается по ssh к хосту ключом, которому на той
# стороне разрешена ровно одна команда (docker/deploy-command.sh), и держит
# соединение до конца: весь вывод деплоя идёт сюда живьём, код возврата
# скрипта — это код возврата шага.
#
# Раньше было иначе: job трогал файл-триггер, systemd запускал деплой где-то в
# стороне, а job опрашивал файлы со статусом. Схема теряла сигнал в обе
# стороны — пропущенный триггер (`.path` глух, пока сервис работает) и отчёт
# со старой версии скрипта. И то и другое выглядело одинаково: зелёная
# галочка при не обновившемся сайте.
#
# Docker-сокет раннеру по-прежнему не даётся. Правило CI-инфраструктуры
# мини-ПК (код из workflow не управляет демоном Docker хоста) в силе:
# изменился способ подать сигнал, а не объём прав.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      # Игры фабрики в git не едут (см. .gitignore), но каталоги остаются в
      # фильтре: коммит игры, сделанный руками, не повод пересобирать образ
      # посреди работы фабрики.
      - 'workspace/**'
      - 'output/**'
      - 'zip_projects/**'
      - 'knowledge_archive/**'
      - '**/*.md'
  workflow_dispatch:

# Быстрые пуши подряд не должны запускать два деплоя внахлёст. Отменять
# начатый не даём: он уже мог дойти до docker build.
concurrency:
  group: zavod2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, zavod2]
    timeout-minutes: 60

    env:
      # Умолчания — под текущий мини-ПК. Переопределяются переменными
      # репозитория (Settings → Variables), а не правкой файла.
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'host.docker.internal' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'oem' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      KEY_FILE: /home/runner/.ssh/zavod2-deploy

    steps:
      - uses: actions/checkout@v4

      - name: Ключ до мини-ПК
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::Нет секрета DEPLOY_SSH_KEY — деплою нечем постучаться на мини-ПК."
            echo "::error::Завести один раз: на мини-ПК выполнить cd /opt/zavod2 && bash docker/setup-deploy.sh"
            echo "::error::Скрипт напечатает ключ; вставить его в Settings → Secrets → Actions → DEPLOY_SSH_KEY."
            exit 1
          fi
          install -d -m 700 "$(dirname "$KEY_FILE")"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "Ключ на месте: $(ssh-keygen -l -f "$KEY_FILE" | cut -d' ' -f1-2)"

      - name: Связь с мини-ПК
        # Отдельным шагом и до тестов: если ключ протух или хост недоступен,
        # узнать об этом надо за три секунды, а не после пяти минут тестов.
        run: |
          ssh -i "$KEY_FILE" -T \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes -o ConnectTimeout=15 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" ping \
          || {
            echo "::error::Мини-ПК не отвечает по ssh ($DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PORT)."
            echo "::error::Проверить на машине: sudo systemctl status ssh · docker exec zavod2-runner getent hosts host.docker.internal"
            echo "::error::Перенастроить: cd /opt/zavod2 && bash docker/setup-deploy.sh"
            exit 1
          }

      - name: Тесты
        # AUTH_ENABLED=0 — тестам не нужен пароль; в контейнере фабрики он
        # всё равно принудительно включён из compose.yml.
        env:
          AUTH_ENABLED: '0'
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip --quiet
          pip install --quiet -r requirements.txt pytest
          python -m pytest -q -p no:cacheprovider

      - name: Проверка входа
        # Отдельным шагом и намеренно: если вход сломан, деплой должен встать
        # здесь, а не после того, как открытая наружу фабрика уже поднялась.
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import os
          from app.web import auth

          h = auth.hash_password('deploy-selfcheck-password')
          assert auth.verify_password('deploy-selfcheck-password', h)
          assert not auth.verify_password('wrong', h)
          assert auth.read_token(auth.issue_token('admin', h, 60), h) == 'admin'
          assert auth.read_token(auth.issue_token('admin', h, -1), h) is None

          # Главное: с AUTH_ENABLED=1 и пустым хешем сервер обязан отказаться
          # подниматься, а не встать открытым.
          os.environ['AUTH_ENABLED'] = '1'
          os.environ['AUTH_PASSWORD_HASH'] = ''
          try:
              auth.AuthSettings.from_env()
          except auth.AuthError:
              print('ok: без пароля сервер не поднимется')
          else:
              raise SystemExit('ПРОВАЛ: пустой AUTH_PASSWORD_HASH прошёл проверку')
          PY

      - name: Деплой на мини-ПК
        # Одна команда, и она же — весь деплой. Скрипт на хосте печатает свои
        # шаги маркерами ::group::, поэтому здесь видно каждый: очередь, опись
        # игр, обновление кода, сборку, перезапуск, проверку.
        #
        # ServerAlive — про долгую тихую сборку образа: без проб соединение
        # успевало отвалиться там, где docker несколько минут тянет слои.
        run: |
          ssh -i "$KEY_FILE" -T \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "deploy $GITHUB_SHA"

      - name: Убрать ключ
        if: always()
        run: rm -f "$KEY_FILE"
