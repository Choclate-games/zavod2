# Автообновление фабрики на мини-ПК.
#
# ВАЖНО про триггеры. Репозиторий публичный, а раннер self-hosted и стоит на
# домашней машине. Поэтому здесь НЕТ и не должно появиться `pull_request`:
# иначе любой человек с форком присылает PR и выполняет свой код на мини-ПК.
# `push` в main умеет делать только тот, у кого есть доступ на запись, и с
# форков он не срабатывает — это единственный безопасный триггер для такой
# схемы.
name: Deploy

on:
  push:
    branches: [main]
    # Сгенерированные игры едут в git вместе с кодом (правило репозитория),
    # то есть коммит очередной игры — это тоже push в main. Пересобирать и
    # перезапускать контейнер посреди работы фабрики из-за этого не надо.
    paths-ignore:
      - 'workspace/**'
      - 'output/**'
      - 'zip_projects/**'
      - 'knowledge_archive/**'
      - '**/*.md'
  workflow_dispatch:

# Быстрые пуши подряд не должны запускать два деплоя внахлёст. Отменять
# начатый не даём: он уже мог дойти до docker build.
concurrency:
  group: zavod2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, zavod2]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Тесты
        # AUTH_ENABLED=0 — тестам не нужен пароль; в контейнере фабрики он
        # всё равно принудительно включён из compose.yml.
        env:
          AUTH_ENABLED: '0'
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip --quiet
          pip install --quiet -r requirements.txt pytest
          python -m pytest -q -p no:cacheprovider

      - name: Проверка входа
        # Отдельным шагом и намеренно: если вход сломан, деплой должен встать
        # здесь, а не после того, как открытая наружу фабрика уже поднялась.
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import os
          from app.web import auth

          h = auth.hash_password('deploy-selfcheck-password')
          assert auth.verify_password('deploy-selfcheck-password', h)
          assert not auth.verify_password('wrong', h)
          assert auth.read_token(auth.issue_token('admin', h, 60), h) == 'admin'
          assert auth.read_token(auth.issue_token('admin', h, -1), h) is None

          # Главное: с AUTH_ENABLED=1 и пустым хешем сервер обязан отказаться
          # подниматься, а не встать открытым.
          os.environ['AUTH_ENABLED'] = '1'
          os.environ['AUTH_PASSWORD_HASH'] = ''
          try:
              auth.AuthSettings.from_env()
          except auth.AuthError:
              print('ok: без пароля сервер не поднимется')
          else:
              raise SystemExit('ПРОВАЛ: пустой AUTH_PASSWORD_HASH прошёл проверку')
          PY

      - name: Триггер деплоя
        # Единственное, что job делает с хостом. Дальше systemd-юнит
        # zavod2-deploy.path видит запись и запускает docker/deploy.sh уже вне
        # раннера — поэтому /var/run/docker.sock раннеру не нужен.
        id: trigger
        run: |
          mkdir -p /deploy
          # Метку времени запоминаем ДО записи триггера: по ней следующий шаг
          # отличает исход своего деплоя от исхода предыдущего, оставшегося в
          # файле с прошлого пуша.
          echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
          printf '%s %s\n' "$GITHUB_SHA" "$(date -Is)" > /deploy/trigger
          echo "Деплой запрошен для $GITHUB_SHA"

      - name: Дождаться деплоя
        # Без этого шага зелёная галочка означала бы «файл записан», а не
        # «фабрика обновилась»: деплой идёт на хосте, вне GitHub, и его падение
        # (например, на `git merge --ff-only`) до Actions не доходило вообще.
        # Живой случай: мерж уехал в main, галочка зелёная, на экране фабрики
        # полтора часа висела предыдущая версия.
        #
        # Молчание хоста считается провалом, а не «наверное, всё хорошо».
        # Снисходительность здесь была бы той же самой дырой с другой стороны:
        # зелёная галочка, за которой ничего не проверено. Хост, который не
        # умеет отчитываться, — это тоже повод покраснеть: значит на нём лежит
        # deploy.sh старее того, что в main, и починить это надо, а не пережить.
        env:
          TRIGGERED_AT: ${{ steps.trigger.outputs.at }}
          # Сборка образа с нуля на четырёх ядрах — минуты; плюс деплой может
          # ждать освобождения лока от предыдущего (там потолок в полчаса).
          WAIT_SECONDS: '2700'
        run: |
          field() { grep -m1 "^$1=" /deploy/status 2>/dev/null | cut -d= -f2- || true; }

          show_log() {
            echo "::group::Лог деплоя на хосте"
            tail -n 200 /deploy/last.log 2>/dev/null || echo "(лога нет — деплой не начинался)"
            echo "::endgroup::"
          }

          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sha="$(field sha)"; outcome="$(field outcome)"
            started="$(field started)"; step="$(field step)"; code="$(field code)"

            # Свой деплой узнаём двумя способами. Первый — он задеплоил ровно
            # наш коммит. Второй — успешный деплой, стартовавший после нашего
            # триггера: он делал `git fetch` уже после нашего пуша, значит наш
            # коммит в него вошёл (в main только fast-forward). Второй случай
            # реальный: deploy.sh догоняет пуши, прилетевшие во время сборки,
            # и один прогон закрывает сразу несколько.
            if [ -n "${started:-}" ] && [ "${started:-0}" -ge "${TRIGGERED_AT:-0}" ] 2>/dev/null; then
              if [ "$outcome" = "ok" ]; then
                echo "✅ Фабрика обновлена, версия $sha"
                exit 0
              fi
              if [ "$outcome" = "fail" ]; then
                echo "::error::Деплой упал на шаге «$step» (код $code). Версия на машине: $sha"
                show_log
                exit 1
              fi
            fi
            sleep 10
          done

          echo "::error::Деплой не отчитался за $WAIT_SECONDS с. Триггер записан, но systemd на хосте его не отработал — проверьте: journalctl -u zavod2-deploy"
          show_log
          exit 1
