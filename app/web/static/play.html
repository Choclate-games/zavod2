<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🎮 Игра</title>
<style>
  :root {
    --bar-bg: #12161f;
    --bar-line: #232b3a;
    --text: #eef2f8;
    --muted: #8ea3c0;
    --accent: #00d0e0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: #0a0e17;
    color: var(--text);
    font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }

  /* ── Верхняя полоска ─────────────────────────────────────────────── */
  #bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--bar-line);
    user-select: none;
  }
  #bar.hidden { display: none; }
  #title {
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 30vw;
  }
  #url {
    color: var(--muted);
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1 1 auto;
    min-width: 0;
  }
  .b {
    background: #1b2231;
    color: var(--text);
    border: 1px solid var(--bar-line);
    border-radius: 7px;
    padding: 4px 9px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .b:hover { border-color: #3a465e; background: #222b3d; }
  .b.on { background: var(--accent); border-color: var(--accent); color: #04222a; font-weight: 700; }
  .sep { width: 1px; height: 20px; background: var(--bar-line); margin: 0 2px; }

  /* Счётчик FPS */
  #fps {
    display: flex;
    align-items: baseline;
    gap: 5px;
    padding: 3px 9px;
    border: 1px solid var(--bar-line);
    border-radius: 7px;
    background: #10151f;
    font-family: ui-monospace, Consolas, monospace;
    cursor: pointer;
    white-space: nowrap;
  }
  #fps.off { opacity: .4; }
  #fps-val { font-size: 14px; font-weight: 700; color: #46d17f; min-width: 26px; text-align: right; }
  #fps.warn #fps-val { color: #ffcb4a; }
  #fps.bad  #fps-val { color: #ff6b6b; }
  #fps-sub { font-size: 10px; color: var(--muted); }

  /* Полоска спрятана — остаётся маленький язычок, чтобы вернуть её */
  #peek {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: none;
    border-radius: 0 0 8px 8px;
    padding: 2px 14px;
    opacity: .45;
  }
  #peek:hover { opacity: 1; }
  body.bar-off #peek { display: block; }

  /* ── Сцена с игрой ───────────────────────────────────────────────── */
  #stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0c;
    padding: 0;
  }
  #stage.framed { padding: 10px; }
  #frame {
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
    display: block;
  }
  #stage.framed #frame {
    width: var(--w);
    height: var(--h);
    max-width: 100%;
    max-height: 100%;
    border: 2px solid #2a3346;
    border-radius: 16px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
  }
  #empty {
    color: var(--muted);
    text-align: center;
    padding: 40px;
  }
</style>
</head>
<body>
  <div id="bar">
    <span id="title">🎮</span>
    <span class="sep"></span>
    <button class="b on" data-size="full">🖥 Full</button>
    <button class="b" data-size="1024x768">💻 1024</button>
    <button class="b" data-size="768x1024">📱 768</button>
    <button class="b" data-size="375x667">📱 375</button>
    <button class="b" id="rotate" title="Повернуть">🔄 Поворот</button>
    <span class="sep"></span>
    <div id="fps" title="Кадры в секунду. Клик — сброс замера.
Точное значение приходит от самой игры, если она шлёт postMessage {type:'factory-fps', fps}.">
      <span id="fps-val">—</span><span id="fps-sub">fps</span>
    </div>
    <span class="sep"></span>
    <button class="b" id="reload" title="Перезагрузить игру">↻</button>
    <button class="b" id="raw" title="Открыть игру без полоски">↗</button>
    <span id="url"></span>
    <button class="b" id="hide" title="Скрыть полоску">✕</button>
  </div>
  <button class="b" id="peek" title="Показать полоску">▾</button>
  <div id="stage"><iframe id="frame" allow="autoplay; fullscreen; gamepad; xr-spatial-tracking" allowfullscreen></iframe></div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var url = q.get("url") || "";
  var slug = q.get("slug") || "";
  var frame = document.getElementById("frame");
  var stage = document.getElementById("stage");
  var bar = document.getElementById("bar");

  document.title = "🎮 " + (slug || "Игра");
  document.getElementById("title").textContent = "🎮 " + (slug || "Игра");
  document.getElementById("url").textContent = url;

  if (!/^https?:\/\//i.test(url)) {
    stage.innerHTML = '<div id="empty">URL игры не передан — откройте игру из вкладки «Играть».</div>';
    return;
  }
  frame.src = url;

  // ── Размер вьюпорта ──────────────────────────────────────────────
  var size = null;      // null = Full
  var rotated = false;

  function apply() {
    if (!size) {
      stage.classList.remove("framed");
      return;
    }
    var w = size[0], h = size[1];
    if (rotated) { var t = w; w = h; h = t; }
    stage.style.setProperty("--w", w + "px");
    stage.style.setProperty("--h", h + "px");
    stage.classList.add("framed");
  }

  document.querySelectorAll("[data-size]").forEach(function (btn) {
    btn.onclick = function () {
      document.querySelectorAll("[data-size]").forEach(function (b) { b.classList.remove("on"); });
      btn.classList.add("on");
      var v = btn.dataset.size;
      size = v === "full" ? null : v.split("x").map(Number);
      rotated = false;
      apply();
      try { localStorage.setItem("factory_play_size", v); } catch (e) {}
    };
  });

  document.getElementById("rotate").onclick = function () {
    if (!size) return;
    rotated = !rotated;
    apply();
  };

  // ── Прочие кнопки ────────────────────────────────────────────────
  document.getElementById("reload").onclick = function () {
    frame.src = url;
    resetFps();
  };
  document.getElementById("raw").onclick = function () {
    window.open(url, "_blank", "noopener");
  };
  document.getElementById("hide").onclick = function () {
    document.body.classList.add("bar-off");
    bar.classList.add("hidden");
  };
  document.getElementById("peek").onclick = function () {
    document.body.classList.remove("bar-off");
    bar.classList.remove("hidden");
  };

  // ── Счётчик FPS ──────────────────────────────────────────────────
  //
  // Игра живёт в iframe на другом порту, дотянуться до её кадров напрямую
  // нельзя. Считаем кадры самой вкладки через requestAnimationFrame: игра и
  // обёртка делят один процесс рендеринга, поэтому просадки видно честно.
  // Если игра сама шлёт postMessage {type:"factory-fps", fps}, показываем её
  // цифры — они точнее, и подпись меняется на «game».
  var fpsBox = document.getElementById("fps");
  var fpsVal = document.getElementById("fps-val");
  var fpsSub = document.getElementById("fps-sub");
  var frames = 0, since = performance.now(), worst = 0, fromGame = 0;

  function paintFps(fps, low) {
    fpsVal.textContent = String(fps);
    fpsSub.textContent = low ? "fps · min " + low : "fps";
    fpsBox.classList.toggle("warn", fps < 50 && fps >= 25);
    fpsBox.classList.toggle("bad", fps < 25);
  }

  function tick(now) {
    frames++;
    var dt = now - since;
    if (dt >= 500) {
      var fps = Math.round(frames * 1000 / dt);
      if (!worst || fps < worst) worst = fps;
      if (!fromGame || now - fromGame > 2000) paintFps(fps, worst);
      frames = 0;
      since = now;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.type !== "factory-fps" || typeof d.fps !== "number") return;
    fromGame = performance.now();
    var fps = Math.round(d.fps);
    if (!worst || fps < worst) worst = fps;
    paintFps(fps, worst);
    fpsSub.textContent = "fps · game";
  });

  // Клик по счётчику (и перезагрузка игры) — сбросить накопленный минимум
  function resetFps() {
    worst = 0;
    frames = 0;
    fromGame = 0;
    since = performance.now();
  }
  fpsBox.onclick = resetFps;

  // Запомненный размер из прошлой сессии
  try {
    var saved = localStorage.getItem("factory_play_size");
    if (saved) {
      var btn = document.querySelector('[data-size="' + saved + '"]');
      if (btn) btn.click();
    }
  } catch (e) {}
})();
</script>
</body>
</html>
