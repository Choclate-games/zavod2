# Model configurations for AI providers

providers:
  local:
    name: "Local Expert Knowledge Engine"
    description: "Rule-based & knowledge-graph reasoning engine with deep game development heuristics"
    default_model: "expert-heuristic-v1"
    supports_structured: true
    supports_image: true
  openai:
    name: "OpenAI"
    api_key_env: "OPENAI_API_KEY"
    default_model: "gpt-4o"
    fallback_model: "gpt-4o-mini"
    image_model: "dall-e-3"
    temperature: 0.7
    max_tokens: 4096
  anthropic:
    name: "Anthropic"
    api_key_env: "ANTHROPIC_API_KEY"
    default_model: "claude-3-5-sonnet-20241022"
    fallback_model: "claude-3-5-haiku-20241022"
    temperature: 0.7
    max_tokens: 4096
  google:
    name: "Google Gemini"
    api_key_env: "GEMINI_API_KEY"
    default_model: "gemini-1.5-pro"
    fallback_model: "gemini-1.5-flash"
    temperature: 0.7
    max_tokens: 4096

agent_settings:
  idea_analyzer:
    temperature: 0.5
  game_designer:
    temperature: 0.7
  mechanics_architect:
    temperature: 0.6
  renderer_selector:
    temperature: 0.3
  technical_architect:
    temperature: 0.4
  playgama_specialist:
    temperature: 0.3
  monetization_designer:
    temperature: 0.5
  art_director:
    temperature: 0.8
  ux_designer:
    temperature: 0.6
  preview_designer:
    temperature: 0.8
  critic:
    temperature: 0.2
  prompt_compiler:
    temperature: 0.3
