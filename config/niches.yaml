# Ниши с доказанным спросом на площадках фабрики.
#
# Зачем файл существует
# ---------------------
# Генератор идей умеет искать незанятое — и это оказалось не тем, что нужно.
# Незанятая ниша чаще всего пуста ровно потому, что спроса в ней нет: шесть
# «свежих» идей подряд оказались симуляторами производственных процедур.
# Теперь отбор идёт наоборот: берётся ниша, в которую УЖЕ играют массово, и к
# ней придумывается своя оболочка и свой поворот.
#
# Это список КАТЕГОРИЙ СПРОСА, а не список идей. Игру по-прежнему придумывает
# модель — здесь только сказано, вокруг какого желания её строить. Каталогом
# готовых концептов этот файл быть не должен: именно каталог когда-то и делал
# фабрику однообразной.
#
# Откуда список: это вечнозелёные категории Яндекс Игр, Playgama, VK Play и
# CrazyGames — то, что стабильно держится в подборках и что игроки ищут сами.
# Живой статистики площадок у фабрики нет и цифр здесь нет намеренно: врать
# долями процента хуже, чем честно назвать категорию. Правьте файл под то, что
# видите в своей аналитике, — генератор читает его на каждый запрос.
#
# Поля
# ----
#   desire      — какое желание игрока эта ниша обслуживает. Главное поле.
#   saturated   — что в ней сделано до дыр. Повтор этого = ещё одна из полусотни.
#   angles      — куда обычно НЕ ходят внутри ниши: сырьё для поворота.
#   keywords    — слова, которые обязаны попасть в prompt_seed. По ним
#                 app/anticliche.py понимает, что нишу заказали намеренно, и
#                 снимает запрет с соответствующего шаблона. Без них критик
#                 фабрики зарубит орду и карты апгрейда как протёкший шаблон.

niches:
  - name: Гонки и дрифт
    desire: разогнаться, войти в занос и удержать его на грани срыва
    saturated: ночной город с неоном, тюнинг-гараж, светофорные заезды
    angles: [нестандартный транспорт, поверхность вместо асфальта, груз, который нельзя растрясти]
    keywords: [гонк, дрифт, занос, заезд]

  - name: Шутер от первого лица
    desire: точно стрелять и чувствовать отдачу, попадание, хедшот
    saturated: контртеррористы на пыльной карте, тир по мишеням, военный склад
    angles: [необычное оружие, среда, которая мешает стрелять, цель кроме убийства]
    keywords: [шутер, стрельб, оружи, выстрел, от первого лица]

  - name: Снайпер и дальний выстрел
    desire: один выстрел, задержка дыхания, замедление и попадание издалека
    saturated: военный заказ на крыше, поправка на ветер как весь геймплей
    angles: [цель не человек, выстрел меняет мир, наблюдение важнее выстрела]
    keywords: [снайпер, выстрел, прицел, дальн]

  - name: Рост и поглощение (io)
    desire: быть маленьким, сожрать всё вокруг и стать огромным
    saturated: дыра в асфальте, змейка, шарики на плоскости
    angles: [что поглощается, среда с вертикалью, поглощённое меняет способности]
    keywords: [расти, поглощ, io, съедать, увеличив]

  - name: Паркур и бег по крышам
    desire: не останавливаться, попадать в ритм прыжков, срезать красиво
    saturated: серые крыши мегаполиса, бесконечный раннер по трём полосам
    angles: [среда вместо города, груз в руках, маршрут, который строит игрок]
    keywords: [паркур, прыж, бег, крыш, трасс]

  - name: Разрушение
    desire: обрушить большое и аккуратно собранное, увидеть, как оно складывается
    saturated: чугунное ядро по панельке, взрывчатка по кубикам
    angles: [чем рушат, что именно рушат, обрушение как головоломка]
    keywords: [разруш, обруш, ломать, снос]

  - name: Хоррор-выживание и побег
    desire: спрятаться, услышать шаги и выбраться, пока не нашли
    saturated: бабка с молотком в частном доме, подвал с фонариком
    angles: [преследователь не человек, светлое место вместо тёмного, звук как механика]
    keywords: [хоррор, страшн, побег, прятат, преследов]

  - name: Стелс и ограбление
    desire: пройти мимо охраны и унести то, что стерегут
    saturated: конусы зрения на плане этажа, вентиляция, сейф с таймером
    angles: [красть на виду, толпа вместо охраны, унести то, что не помещается]
    keywords: [стелс, ограблен, кража, красть, незамет]

  - name: Tower defense и оборона
    desire: построить оборону и смотреть, как она перемалывает поток
    saturated: башни вдоль дорожки, волны по расписанию, продажа башни за 70%
    angles: [оборона движется, укрепляют то, что дорого, поток идёт не по дорожке]
    keywords: [оборон, башн, tower, волн, защищать]

  - name: Выживание против орды
    desire: стоять против массы, чувствовать, как растёт сила
    saturated: автоатака и три карты апгрейда, зомби на пустой поляне
    angles: [орда не враги, оружие одно и растёт, укрытие вместо бега]
    keywords: [орда, выживан, survivor, волн, толп]

  - name: Мердж и слияние
    desire: складывать одинаковое и получать заметно лучшее
    saturated: сетка 5x5 с цифрами, фермерские овощи, оружие уровня N+1
    angles: [слияние с физикой, слияние живого, результат меняет сцену]
    keywords: [мердж, merge, слиян, объедин]

  - name: Idle и прогрессия
    desire: видеть, как число и сцена растут даже без тебя
    saturated: кликер по кнопке, счётчик валюты в углу, три вкладки апгрейдов
    angles: [растёт мир, а не цифра, прогресс виден в кадре, офлайн меняет сцену]
    keywords: [idle, кликер, прогресс, накоплен, ферм]

  - name: Строительство и обустройство
    desire: сделать своё место и увидеть, что оно работает
    saturated: изометрическая ферма, база с ресурсами трёх видов
    angles: [строит то, чем сразу пользуется, постройка живёт своей жизнью]
    keywords: [строит, построй, база, обустр, ферм]

  - name: Физическая песочница и рэгдолл
    desire: устроить нелепую катастрофу и посмотреть, что получится
    saturated: манекен с горки, ragdoll-арена без цели
    angles: [цель для катастрофы, тело как инструмент, повтор трюка на точность]
    keywords: [физик, рэгдолл, ragdoll, песочниц, трюк]

  - name: Полёт и падение
    desire: нестись впритирку к земле и не разбиться
    saturated: вингсьют в каньоне, кольца по маршруту
    angles: [летит не человек, посадка важнее полёта, полёт с грузом]
    keywords: [полёт, летат, пикиров, планир, падени]

  - name: Кулинария и поток заказов
    desire: успевать в нарастающем темпе и не запороть заказ
    saturated: бургерная с тремя ингредиентами, кофейня с очередью
    angles: [готовят не еду, кухня физическая, заказчик мешает]
    keywords: [готов, кухн, заказ, ресторан, кулинар]

  - name: Мотокросс и трюки на транспорте
    desire: вытянуть сальто и приземлиться на колёса
    saturated: байк на холмах в 2D, трасса из трамплинов
    angles: [транспорт не байк, трюк с грузом, приземление как головоломка]
    keywords: [трюк, мотокросс, сальто, транспорт, прыж]

  - name: Арена на выживание с соперниками
    desire: остаться последним и видеть, как выбывают остальные
    saturated: королевская битва с сужающимся кругом, безликие боты
    angles: [выбывание не смертью, соперники со своим характером, арена меняется]
    keywords: [арена, соперник, последн, битв, турнир]
