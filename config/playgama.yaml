# Playgama Bridge — factory defaults (DATA ONLY)
#
# This file deliberately contains NO API signatures, method names or code.
# The API contract lives in exactly one place:
#
#     knowledge/playgama/*.md   (see knowledge/README.md)
#     knowledge/CRITICAL_RULES.md
#
# Rationale: this file used to carry its own copy of the SDK surface, drifted to
# the deprecated Bridge v1 contract (storageType arguments, singular
# `bridge.leaderboard`, GAME_READY straight after initialize) and then taught
# those mistakes to every generated package. Duplicating the API is what caused
# that, so it is not duplicated any more. Add facts to knowledge/, not here.

playgama:
  sdk_name: "Playgama Bridge"
  npm_package: "@playgama/bridge"
  version: "2.x"
  knowledge_entrypoint: "knowledge/playgama/bridge_api_reference.md"

  # --- Откуда ставится сам мост -------------------------------------------
  # В реестре npm лежит апстримовский Playgama Bridge. Студия живёт на форке:
  # там настоящая авторизация VK, платежи через VKWebAppShowOrderBox, OK поверх
  # VK Bridge, GameMonetize, Android, свой экран загрузки и интервал
  # межстраничной в 80 секунд. Пока игры ставили пакет из реестра, ни одна из
  # этих правок до них не доезжала.
  #
  # Имя пакета то же самое: переименование означало бы переписанные импорты в
  # каждой игре, в базе знаний и в скиллах. Форк собирается тем же именем и
  # раздаётся тарболом из релиза, репозиторий публичный — токен не нужен.
  #
  # Читает это app/bridge_package.py, он же единственный источник адреса для
  # компилятора промпта, приёмки и экрана настроек. Поднять версию можно и без
  # правки файла — переменной BRIDGE_PACKAGE_SOURCE.
  package:
    name: "@playgama/bridge"
    source: "https://github.com/EdikN/bridge/releases/download/v2.0.2-fork.1/playgama-bridge-2.0.2-fork.1.tgz"
    repo: "EdikN/bridge"
    tag: "v2.0.2-fork.1"
    docs: "https://github.com/EdikN/bridge/blob/main/docs/npm-package.md"

  supported_platforms:
    - yandex
    - vk
    - ok
    - crazy_games
    - playgama
    - msn
    - android

  # --- Advertising policy (design decisions, not API) ---------------------
  advertising:
    interstitial:
      # Game-side floor. Must be >= the platform's configured minimum, otherwise
      # requests are refused and each refusal restarts the clock.
      min_gap_seconds: 90
      allowed_moments:
        - "run/match finished, when the player taps to leave the result screen"
        - "level complete"
        - "returning to the main menu"
        - "closing a shop or inventory overlay"
      forbidden_moments:
        - "the first seconds of a session"
        - "during active gameplay"
        - "over a screen the player is still reading"
        - "immediately after a purchase"
      pattern: "arm on the earning event, flush on the leave click"

    rewarded:
      # Reward is granted by the 'rewarded' state event only — see
      # knowledge/playgama/ads_integration.md
      default_placements:
        - id: "revive_run"
          name: "Second Chance Revive"
          benefit: "Restore 50% HP + 3s invulnerability, once per run"
        - id: "double_end_gold"
          name: "Double Run Spoils"
          benefit: "2x gold earned in the current session"
        - id: "free_upgrade_reroll"
          name: "Reroll Upgrade Choices"
          benefit: "Reroll the current 3 cards with a guaranteed Rare+"
        - id: "daily_chest_bonus"
          name: "Claim Extra Daily Chest"
          benefit: "Unlock a premium gear crate"

    banner:
      shown_on: ["main menu", "shop", "result screens"]
      hidden_on: ["active gameplay"]
      single_request_platforms: ["vk", "ok"]   # one request per session, never refresh

  # --- Save policy -------------------------------------------------------
  storage:
    # ONE key holding ONE JSON object. Multiple top-level keys break atomicity
    # and are the split-brain bug this factory keeps re-fixing.
    save_key_template: "{slug}_save_v1"
    contains:
      - "progression (currency, unlocks, records)"
      - "premium/purchase ownership"
      - "settings (music, sfx, mute, language)"
    write_policy: "debounce 1.5s, flush immediately on pagehide/visibilitychange"
    local_storage_role: "mirror only — it is partitioned third-party storage in the platform iframe"

  # --- Leaderboards ------------------------------------------------------
  leaderboards:
    id_rules:
      - "letters and digits only — Yandex rejects underscores"
      - "must be registered in the platform console before publishing; the bridge fails silently otherwise"
      - "always add an explicit per-platform override, even when identical"
    default_boards:
      - "globalhighscore"
      - "highestwave"

  # --- Payments ----------------------------------------------------------
  payments:
    rules:
      - "consume by product id, never by purchase token"
      - "check unprocessed purchases every launch: grant first, consume second"
      - "prices always come from the platform catalog, never hardcoded"
      - "VK requires numeric item ids as config overrides"
      - "when payments are unsupported, paid items render as free — no locks, no prices"

  # --- Compliance --------------------------------------------------------
  compliance:
    audio_api: "Web Audio API only — an <audio> element trips Yandex 1.6.1.6 / 1.6.2.5"
    page_lock_required: true
    safe_area_required: true
    reference: "knowledge/compliance/yandex_moderation.md"
