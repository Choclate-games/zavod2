_readme: 'Чек-листы документов базы знаний. Генерируются командой `python -m app.cli checklists` и едут
  в мастер-промпт рядом с адресом документа. Правится файл не здесь, а в самом документе: допишите в него
  пункты `- [ ]`, и они перебьют этот кэш. Поле sha — хеш документа на момент генерации: если он разошёлся,
  чек-лист устарел.'
documents:
  CRITICAL_RULES.md:
    sha: ffa82199ec7f10cc
    items:
    - game_ready отправлен один раз и только когда меню интерактивно
    - Гость играет полностью, авторизация не стоит стеной перед игрой
    - Сохранение идёт через один сервис и переживает перезагрузку и битые данные
    - Награда за rewarded выдана по событию, а не по промису, и до списания ресурса
    - 'Интерфейс построен на флагах поддержки: недоступного на площадке в DOM нет'
    - Страница не скроллится, контекстное меню по долгому нажатию не открывается
    - Звук только через Web Audio, мьют и пауза приходят от площадки и обрабатываются
    - Значения интерфейса живут в theme.css, эмодзи вместо иконок нет, alert() нет
    - Тач-управление на Pointer Events, слой вставлен в документ и скрыт вне игры
    - Транспорт на Rapier с лучевым контроллером, самодельной физики нет
    - Сборка пересобрана перед выкладкой, dist/ не устаревший
    - DEVLOG.md и CHANGELOG.md обновлены в конце сессии
    - Ориентация и захват указателя обработаны, размеры пересчитываются после поворота
  audio/procedural_sound_synthesizer.md:
    sha: f12d1ffb52503ccd
    items:
    - AudioContext создаётся лениво, по первому pointerdown/keydown, а не в конструкторе
    - 'Все звуки идут через один мастер-гейн: громкость и мьют трогают только его'
    - Свёрнутая вкладка приглушает звук через visibilitychange (suspend/resume контекста)
    - Осцилляторы и узлы отключаются после затухания, а не копятся за сессию
    - 'Каждое действие игрока имеет свой звук: выстрел, попадание, подбор, кнопка интерфейса'
    - Непрерывный звук (двигатель, ветер) — один осциллятор с меняющейся частотой, а не рестарт каждый
      кадр
    - 'Звук интерфейса отличается от звука мира: клик не путается с событием игры'
  audio/web_audio_and_muting.md:
    sha: 5f40e38bc1e8bfa3
    items:
    - 'Звук только через Web Audio API: ни одного <audio> или <video> — это отказ модерации, а не мелочь'
    - В панели уведомлений телефона и в системном плеере игра не появляется
    - Один мастер-гейн — единственное, чего касаются мьют, приглушение и флаг площадки
    - Мьют сделан гейном, а не паузой контекста
    - 'Загрузка не ждёт разблокировки звука: меню интерактивно при suspended-контексте, game_ready не
      задерживается'
    - Пауза и мьют приходят от площадки двумя независимыми событиями, оба обработаны
    - 'Состояние мьюта лежит в сохранении игры, а не в конструкторе движка: кнопка не сбрасывается после
      перезагрузки'
  compliance/qa_checklist.md:
    sha: 5cba15898928ef3e
    items:
    - Сборка проверена в настоящем черновике площадки, а не только на локальном dev-сервере
    - 'Проверены два профиля отдельно: гость и авторизованный — у них разные пути в авторизации, сохранении
      и платежах'
    - 'Проверено, что игровой цикл реально стартовал: рендер-колбэки зарегистрированы, а не только показан
      HUD'
    - Показатели сняты с запущенной игры с SDK в документе, а не прикинуты на глаз
    - 'dist/ пересобран перед загрузкой: устаревшая сборка — самая частая причина «почему правка не работает»'
    - Находки разделены на блокеры (игра не стартует), мажоры (деньги без товара, двойная награда, реклама
      в запрещённый момент) и заметки
  mechanics/base_building.md:
    sha: 82247e15ee4386a0
    items:
    - Проекция постройки показывает валидность цветом до подтверждения
    - Постановка сопровождается звуком и пылью, а не появлением объекта из воздуха
    - У повреждённых строений видна полоса здоровья
    - Постройка, ремонт и апгрейд доступны в одном жесте, без вложенных меню
    - 'Панель строительства читается на телефоне: не больше нескольких крупных кнопок сразу'
    - Стоимость и нехватка ресурса видны в момент выбора, а не после нажатия
  mechanics/card_synergy.md:
    sha: bca20e90674301b8
    items:
    - У предметов есть теги, и они показаны игроку в момент выбора
    - 'Порог синергии виден счётчиком: игрок понимает, сколько не хватает'
    - Срабатывание синергии в бою имеет свой эффект и звук
    - Магазин подсказывает, какой предмет продолжает уже собранную связку
    - Синергия меняет поведение, а не только процент урона
    - Игрок без опыта в жанре замечает синергию сам, без чтения справки
  mechanics/chain_reaction.md:
    sha: bc7c6ba407444100
    items:
    - 'У взрыва две зоны: эпицентр с полным уроном и внешняя с квадратичным спадом'
    - Вторичная детонация идёт с задержкой около 0.12 с — волна взрывов, а не схлопывание в один кадр
    - Импульс разлёта зависит от расстояния до эпицентра
    - 'Цепочка читается глазом: видно, что этот взрыв поджёг следующий'
    - Число одновременных взрывов ограничено, иначе кадр проседает на самой зрелищной сцене
    - Урон по игроку от собственной цепочки считается по тем же правилам, что и по врагам
  mechanics/checkpoint_lap_racing.md:
    sha: af2cf19bbdb72277
    items:
    - 'Трасса размечена упорядоченными чекпойнтами: круги, позиция, респавн и срезы — из одной структуры'
    - 'Прогресс не мозолит глаза, пока всё правильно: он проявляется только при ошибке'
    - Время по секторам показано относительно личного рекорда цветом
    - Финальный круг объявлен отдельно
    - «Не туда» появляется в течение секунды после разворота
    - Респавн ставит на гоночную линию с кратковременной потерей сцепления — это не бесплатный сброс
    - Чекпойнты стоят достаточно часто, чтобы респавн не отбрасывал далеко
  mechanics/cooking_flow.md:
    sha: 6d58df0c8ba4bf3d
    items:
    - 'Ингредиент проходит состояния явно: сырой → нарезан → готов → сгорел'
    - Передержка наказывает, и до неё есть видимый и слышимый сигнал
    - У клиента шкала терпения, убывающая плавно
    - Сдача в зелёной зоне даёт больше и продлевает серию, в красной — меньше и серию сбрасывает
    - Уход клиента имеет последствие, а не просто исчезновение заказа
    - 'Несколько заказов идут параллельно: игрок распределяет внимание, а не выполняет по одному'
  mechanics/cover_and_suppression.md:
    sha: 32d3d7dbdbc61472
    items:
    - Точки укрытия размечены заранее, а не ищутся рейкастом в кадре
    - 'У укрытия есть нормаль: обход с фланга его обесценивает'
    - Подавление снижает точность и готовность высунуться, а не здоровье
    - Подавленный противник пригибается, кричит и стреляет вслепую — иначе игрок читает это как случайный
      разброс
    - Подавление игрока показано виньеткой и увеличенным качанием оружия
    - 'Слот укрытия занят одним бойцом: двое не втискиваются в одну точку'
  mechanics/drift_scoring.md:
    sha: b6915cd79bd1983b
    items:
    - Занос считается по реальному углу скольжения, а не по нажатию газа
    - Очки копятся пропорционально скорости и углу и банкуются при чистом выравнивании
    - Разворот, удар о стену и полная остановка обрывают несданную цепочку
    - Счёт тикает в реальном времени с растущим тоном
    - Плотность дыма и след покрышек привязаны к тому же скольжению, что и очки
    - Звук «зачтено» и звук «потеряно» невозможно перепутать
    - Угол выше примерно 50° не даёт очков, иначе выгодно крутиться на месте
    - 'Механика имеет смысл только при управляемом заносе: физика позволяет держать скольжение'
  mechanics/drone_swarm.md:
    sha: cfd0ff7248048b26
    items:
    - 'Рой держится на трёх векторах: разделение, выравнивание, сплочённость'
    - Есть притяжение к цели, иначе рой красиво летает и ничего не делает
    - Соседи ищутся по пространственной сетке, а не полным перебором
    - 'Рой не слипается в точку и не рассыпается: веса подобраны и проверены на глаз'
    - Дроны огибают препятствия, а не проходят сквозь них
    - Рой в 200+ единиц рисуется инстансингом и держит кадр
  mechanics/evidence_board.md:
    sha: a596d516058d55a5
    items:
    - Улики — узлы графа, связь протягивается жестом игрока
    - Верная связь открывает новую зацепку и подтверждается звуком
    - Ложная связь тратит ограниченный ресурс, а не просто ничего не делает
    - Таблица истинности сценария задана данными, а не условиями в коде
    - 'Доска читается на телефоне: узлы не наезжают друг на друга'
    - Игрок может отменить связь, не начиная расследование заново
  mechanics/fluid_buoyancy.md:
    sha: aaf2cc362ab8b96e
    items:
    - Выталкивающая сила считается по погружённому объёму, а не по факту касания воды
    - Есть гидродинамическое сопротивление, иначе тело разгоняется в воде бесконечно
    - Волны задаются суммой синусоид, и корпус наклоняется по нормали поверхности
    - 'Качка не переходит в раскачку до переворота: демпфирование подобрано'
    - 'Тела разной плотности ведут себя по-разному: что-то тонет, что-то всплывает'
    - Вход в воду сопровождается всплеском и сменой звука
  mechanics/formation_movement.md:
    sha: a40273ec1adee144
    items:
    - Приказ на N юнитов раскладывается в N слотов вокруг точки назначения
    - Строй ориентирован по направлению движения, а не по сторонам света
    - 'Назначение слотов идёт по близости: юниты не пересекают пути друг друга'
    - Слот на скале или воде откатывается к ближайшей проходимой точке
    - Темп по самому медленному можно отключить — иначе это раздражает
    - Призрачные метки слотов показаны примерно секунду после приказа
    - По прибытии юниты доворачиваются в общее направление
  mechanics/frame_data_combat.md:
    sha: a2f0b7f6e73a427d
    items:
    - 'Каждый приём описан четырьмя числами в кадрах: старт, активные, восстановление, стан'
    - Безопасность приёма выводится арифметикой, а не подбирается на ощупь
    - 'В таблице есть продвижение вперёд на старте: без него бойцы стоят вне досягаемости и ничего не
      происходит'
    - Дистанция ИИ считается из реального охвата приёма, а не зашита числом
    - Hit-stop замораживает обоих на несколько кадров — главный источник ощущения удара
    - Искра блока визуально отличается от искры попадания
    - Потерянное здоровье показано отложенной «призрачной» полосой
    - 'Есть отладочная отрисовка хитбоксов за флагом: без неё файтинг не сбалансировать'
  mechanics/grid_building.md:
    sha: 3c9aa1d843aab870
    items:
    - Постройка привязывается к сетке с фиксированным шагом
    - Валидация проверяет и занятость клетки, и ресурсы, и запрет зон спавна и патрулей
    - Энергосеть считается графом связности, и подключение обновляется сразу
    - Отключённая от питания турель визуально отличается от работающей
    - Снос возвращает часть ресурсов, и это видно до подтверждения
    - 'Сетка не мешает камере: игрок видит, куда ставит, без вращения сцены'
  mechanics/juggle_combo.md:
    sha: f608857e84d2ed56
    items:
    - Есть подбрасывающий приём, переводящий бой в воздух
    - Урон каждого следующего попадания снижается — длинная связка эффектна, но не смертельна сама по
      себе
    - Счётчик связки растёт с повышением тона
    - Hit-stop укорачивается по ходу связки, и последовательность ускоряется
    - Камера уходит вверх за подброшенным, оба бойца остаются в кадре
    - Финишер даёт жёсткое падение и выброс пыли
    - Без снижения урона одно открытие не должно снимать всю полосу здоровья
  mechanics/mining_drill.md:
    sha: 6f97e3a1fde096e4
    items:
    - Породы отличаются прочностью и износом бура, а не только цветом
    - Ценная жила даёт выброс лута при разрушении
    - Бур нагревается при непрерывной работе и остывает в покое
    - Перегрев заклинивает бур на несколько секунд с выбросом пара — есть сигнал до этого момента
    - Прочность породы видна игроку до начала бурения
    - Насадки более высокого уровня открывают породы, недоступные раньше
  mechanics/parry.md:
    sha: d0c0327154974743
    items:
    - Окно парирования узкое и задано числом, а не ощущением
    - У атаки врага есть читаемый замах, по которому парирование и делается
    - На телефоне есть отдельная кнопка парирования с буфером ввода
    - Успех даёт вспышку, металлический звон и короткий hit-stop
    - Успешное парирование ломает стойку врага или отправляет его в стаггер, а не просто гасит урон
    - После парирования открывается окно контратаки
    - Парирование не ставится в игру, где по игроку одновременно летят сотни снарядов
  mechanics/physics_destruction.md:
    sha: 688edd7282e3d3c6
    items:
    - У разрушаемых объектов есть физическое здоровье и меш разрушения, а не мгновенное исчезновение
    - 'Обломки берутся из пула инстансов: создание мешей в кадре даёт рывки сборщика мусора'
    - Разрушение сопровождается тяжёлым звуком, тряской камеры и кольцом пыли
    - Врага можно столкнуть в опасную зону или обрушить на него конструкцию — арена работает как оружие
    - Обломки живут ограниченное время и убираются, а не копятся до конца боя
    - Число одновременных обломков ограничено бюджетом кадра
  mechanics/ragdoll.md:
    sha: 741de13fc67a0d6b
    items:
    - 'Вариант рэгдолла выбран осознанно: Rapier для взаимодействия с миром, верле — там, где физического
      мира нет'
    - Живым персонажем управляет автомат состояний, физика включается только на смерть
    - Тело падает от импульса вдоль удара, а не в заранее записанную позу
    - Оружие выпадает из рук с сохранением мирового трансформа
    - 'Труп удаляется по таймеру: isSleeping() у рэгдолла на Rapier не срабатывает'
    - dispose() снимает и тела, и суставы — иначе течёт память WASM
    - 'Суставы имеют пределы: локоть и колено сгибаются, но не складываются в ноль'
    - Корпус держат раскосины, иначе тело складывается вдвое
  mechanics/rhythm_sync.md:
    sha: b36a4ecc922cdbf3
    items:
    - Время берётся из AudioContext.currentTime, а не из rAF — иначе троттлинг рассыпает синхронизацию
    - Доля такта считается от BPM и позиции в треке, а не накоплением дельт
    - 'Окна попадания заданы числами: идеально до 65 мс, хорошо до 140 мс'
    - Промах сбрасывает множитель, и это видно и слышно немедленно
    - Визуальный маркер приходит в такт со звуком на реальном устройстве, а не только в теории
    - Задержка вывода звука учтена калибровкой, а не проигнорирована
  mechanics/rubberband_opposition.md:
    sha: e0e0a4b81d4f31e1
    items:
    - Подстройка идёт параметрами вождения, а не телепортацией соперника
    - 'Отклонение скорости держится в пределах примерно ±10%: дальше игрок замечает помощь и победа обесценивается'
    - Отстающий бот никогда не превышает лучший круг игрока за сессию
    - 'Видимые средства догона предпочтены невидимым: воздушный мешок, ускоритель на трассе'
    - Отрыв в секундах показан игроку, чтобы напряжение читалось
    - 'Гонка остаётся напряжённой и в начале, и в конце: нет ни недосягаемого ИИ, ни победы с первого
      круга'
  mechanics/special_move_input.md:
    sha: f4197712790022d1
    items:
    - Один и тот же приём доступен и с клавиатуры движением, и с телефона кнопкой
    - Способ ввода не меняет набор доступных приёмов
    - 'Есть буфер ввода: команда, введённая чуть раньше окончания приёма, не теряется'
    - Распознавание движения подтверждается вспышкой до начала приёма
    - Кнопка недоступного приёма гаснет, но не исчезает
    - 'В игре есть список приёмов: движения без него не обнаруживаются'
    - Специальных кнопок на телефоне не больше трёх
  mechanics/stealth_detection.md:
    sha: eeac7731a05b4041
    items:
    - У охранника конус зрения с конкретным углом и дальностью, а не круговое восприятие
    - Дешёвая проверка угла и расстояния идёт каждый кадр, дорогой рейкаст — только для прошедших фильтр
      и с ограниченной частотой
    - Преграды полностью блокируют видимость
    - 'Шум зависит от способа передвижения: красться, идти, бежать, стрелять — разные радиусы'
    - Шум переводит охранника в проверку и разворачивает к источнику
    - Шкала подозрения имеет три состояния с видимым маркером над головой
    - В тени подозрение накапливается заметно медленнее
    - Игрок понимает, что его заметили, до того как по нему открыли огонь
  mechanics/tower_targeting_priority.md:
    sha: 79d08a0568797870
    items:
    - У башни есть выбор приоритета цели, а не одна зашитая логика
    - 'Есть гистерезис: башня держит текущую цель, пока та жива и в радиусе, и не дёргается между врагами'
    - Радиус показан только у выбранной башни
    - Пока башня стреляет, к цели идёт тонкая линия — видно, кого она бьёт
    - 'Приоритет по умолчанию разумный: игра работает, даже если игрок ничего не настроил'
    - Иконка приоритета видна на карточке башни
  mechanics/unit_selection_and_orders.md:
    sha: 38a82967b91824a1
    items:
    - Рамка выделения решается одним фрустумом, а не рейкастом по каждому юниту
    - Боевые юниты имеют приоритет над рабочими при выделении рамкой
    - 'Работают модификаторы: добавить к выделению, снять, выбрать всех того же типа двойным кликом'
    - Группы привязываются к цифрам и восстанавливаются
    - Приказы ставятся в очередь и хранятся у юнита
    - Под выделенными юнитами есть кольца на земле
    - Приказ подтверждается меткой в точке назначения и голосом юнита
    - Очередь путевых точек нарисована пунктиром, пока группа выделена
    - 'На телефоне есть свой путь: тап по юниту, иконка группы, «выделить всех на экране»'
  mechanics/upgrade_choices.md:
    sha: 81b98c062fb7afa2
    items:
    - Выбор появляется на повышении уровня и ставит игру на паузу или замедление
    - Вариантов три, и они взвешены, а не равновероятны
    - Редкость показана рамкой карты и отличается на глаз
    - Есть перекат и отказ, и оба имеют цену
    - Выбор немедленно отражается на HUD и всплывающим текстом над игроком
    - 'Раздача умеет заканчиваться: вернуть меньше трёх вариантов — нормально'
    - Апгрейд меняет поведение оружия, а не только проценты
  mechanics/vehicle_physics.md:
    sha: b73b2a73a3292394
    items:
    - 'Транспорт только на Rapier с лучевым контроллером: самодельная аналитическая физика запрещена'
    - Ландшафт — trimesh-коллайдер, машина по нему не проваливается
    - Лучи колёс отфильтрованы группами и видят только землю, не кузов и не груз
    - 'Подвеска настоящая лучевая: кузов кренится в поворотах и приседает при торможении'
    - 'Знак руления проверен на живой машине: клавиша вправо поворачивает вправо'
    - Позиция меша интерполируется между шагами физики
    - Поведение машины проверено скриптом в Node до показа игроку
  mechanics/wave_contract.md:
    sha: de311cfc44653a1e
    items:
    - 'Волна объявлена данными: бюджет, состав, интервал спавна, бонус за ранний вызов'
    - Бюджет растёт нелинейно, а не прибавлением фиксированного числа
    - Каждая пятая волна вводит новый тип угрозы
    - Перед волной показан её состав силуэтами и числами
    - Кнопка раннего вызова показывает убывающий бонус кольцом обратного отсчёта
    - Новый тип угрозы объявляется отдельно и один раз объясняется строкой
    - Волны воспроизводимы и проверяются без рендера
  mechanics/wave_survival.md:
    sha: d04e534b1c8d71e3
    items:
    - Волна начинается баннером и звуком, её начало нельзя пропустить
    - 'Виден прогресс волны: сколько осталось врагов или времени'
    - Между волнами есть передышка или окно улучшений
    - 'Состав волны меняется, а не только количество: появляются дальнобойные и тяжёлые цели'
    - Элитный враг приходит периодически и отличается силуэтом
    - Зачистка волны вознаграждается фанфарой и потоком валюты
    - Граница между волнами — естественное место для рекламы, и она не рвёт бой
  monetization/in_app_purchases.md:
    sha: 949039d70b06155c
    items:
    - Товар выдаётся ДО списания покупки, а не после
    - Список расходуемых товаров — одна экспортированная константа, а не копии по файлам
    - Незакрытые покупки разбираются на старте и выдаются игроку
    - 'Цены не зашиты в код: каталог тянется асинхронно, до его прихода показывается запасной текст'
    - Загрузка игры не ждёт каталога
    - Покупка гостем ведёт через вход с сохранённым намерением, а не выдаётся бесплатно
    - 'Там, где платежей нет, платный контент не показывается запертым: он просто открыт, без цен и замков'
  monetization/interstitial_best_practices.md:
    sha: 61c8f8c94633e803
    items:
    - Межстраничная реклама не показывается посреди игрового процесса — только в паузах между сессиями
    - В первые две минуты первого запуска рекламы нет
    - Звук глушится, когда реклама открылась
    - Физика и таймеры цикла заморожены на время показа, иначе игрок вернётся к трупу
    - Между показами выдержан интервал, счёт ведётся от конца прошлого показа
    - 'Возврат из рекламы не даёт скачка dt: накопитель сброшен'
  monetization/rewarded_ads_patterns.md:
    sha: 1f622a804fdb51aa
    items:
    - Игра проходима без единого просмотра рекламы
    - Награда выдаётся только по событию 'rewarded', подписка снимается после
    - Есть защита от двойного нажатия кнопки просмотра
    - Кнопка визуально сообщает, что за ней реклама, ещё до нажатия
    - Предложение показывается всегда, когда действие уместно, а не по случайному числу
    - Помощь рекламой ограничена долей типичного дохода за сессию и не покрывает дорогую покупку
    - 'У покупателя «без рекламы» rewarded остаётся: убирают прерывания, а не возможности'
    - У каждого места показа есть предел за забег или кулдаун
  patterns/arena_combat_loop.md:
    sha: f09ea7cccc15147a
    items:
    - 'Волна заканчивается сама и видно, что она кончилась: пауза, счёт, следующая'
    - 'Враги отличаются поведением, а не только здоровьем: скирмишер, щитоносец и брут требуют разных
      ответов'
    - Опасности арены участвуют в бою, а не служат декорацией
    - Между волнами есть фаза покупки, и потраченное видно в следующем бою
    - 'Выносливость ограничивает натиск: бесконечное закликивание не работает'
    - На пятой волне появляется мини-босс, требующий другого приёма, а не большего урона
    - Смерть даёт итог забега с накопленной валютой, а не пустой экран
    - 'Есть внятная причина запустить второй забег: другая сборка оружия или сложность'
  patterns/builder_defense_loop.md:
    sha: 8b70f6fcd214cfd6
    items:
    - Фаза строительства и фаза защиты разделены явно, игрок понимает, в какой он сейчас
    - Атака идёт с нескольких направлений, одна линия обороны не закрывает всё
    - Летающие и подкапывающиеся враги обесценивают один тип защиты и заставляют перестраиваться
    - Разведанные ресурсы и открытые чертежи видны игроку в момент получения
    - Дерево исследований меняет поведение обороны, а не только числа
    - Осадный враг проходит базовые стены — стена перестаёт быть универсальным ответом
    - Поражение — падение ядра базы, и видно, что именно пробило оборону
  patterns/fighting_match_loop.md:
    sha: a54ab59793e1f86b
    items:
    - Задержка реакции соперника масштабируется сложностью, а ошибки запланированы, а не случайны
    - Здоровье восстанавливается только между раундами
    - 'Позиция — ресурс: в углу связки длиннее'
    - Финальный удар раунда показан замедлением и реакцией зрителей
    - Шкала спецприёма переносится между раундами
    - К третьему бою соперник наказывает небезопасные приёмы стабильно
    - Финальный соперник меняет поведение на низком здоровье, а не только числа
    - 'Поражение даёт статистику: длиннейшая связка и доля наказаний'
  patterns/physics_arcade_loop.md:
    sha: f56a2a01f3d4c60e
    items:
    - 'Материалы ведут себя по-разному: дерево, камень и стекло ломаются не одинаково'
    - Счёт зависит и от доли разрушения, и от остатка снарядов
    - 'Уровень заканчивается двумя способами: зачистка со звёздами или кончившиеся снаряды'
    - Особые снаряды меняют подход, а не просто наносят больше урона
    - 'Цепные реакции читаются: игрок видит, что его выстрел запустил обвал'
    - Есть причина перепройти уровень — три звезды или место в таблице
  patterns/racing_event_loop.md:
    sha: 05f7b44c707211ec
    items:
    - Соперники едут через тот же контроллер, что и игрок, а не по рельсам
    - 'Подтягивание соперников честное: они не телепортируются и не тормозят у финиша'
    - Смена покрытия наказывает лишнюю скорость, и это видно по поведению машины
    - Контакт со стеной имеет последствия внутри гонки, но не требует рестарта
    - Позиция, круги и разбивка по секторам показаны относительно личного рекорда
    - Нитро зарабатывается ездой, а не ожиданием
    - Апгрейды в гараже ощущаются на трассе
    - 'Есть повод на второй заезд: свой призрак или круг без касаний'
  patterns/roguelike_loop.md:
    sha: 5a664ee4dc877244
    items:
    - Карта забега ветвится, и выбор узла — настоящее решение, а не оформление
    - Смерть окончательна, лечение ограничено
    - Реликвии меняют механику, а не прибавляют проценты
    - Синергии между предметами существуют и заметны игроку
    - Переход биома меняет правила, а не только палитру
    - Итог забега показывает урон, реликвии и причину смерти
    - 'Есть причина на следующий забег: ежедневное зерно или ступень сложности'
  patterns/rts_skirmish_loop.md:
    sha: 8d35bea390f12fdf
    items:
    - Экономика, производство и бой конкурируют за внимание игрока — это и есть сложность
    - Множители типов брони делают любую однородную армию победимой
    - Соперник расширяется по таймеру и наказывает неприкрытых рабочих
    - Юниты держат строй и отступают повреждёнными, а не бегут по одному
    - На четвёртой минуте случается первый рейд, на восьмой — контр-состав
    - Итог матча показывает кривую дохода и стоимость армии во времени
    - Поражение объясняет, где именно игрок отстал
  patterns/score_attack_loop.md:
    sha: bac193333a08c571
    items:
    - Множитель держится рискованными действиями и падает при простое
    - Скорость растёт непрерывно, запас на ошибку сокращается
    - Режим ярости даёт короткую неуязвимость и всплеск очков, и это читается по экрану
    - 'Проигрыш мгновенный и понятный: игрок видит, обо что он ударился'
    - Результат уходит в таблицу лидеров сразу после смерти
    - 'Рестарт мгновенный, без загрузки: «ещё один раз» не упирается в экран ожидания'
  patterns/survivor_loop.md:
    sha: d2560840181a2221
    items:
    - Игрок управляет только движением, атака идёт сама по ближайшему врагу
    - Плотность орды растёт по минутам, и это видно на экране
    - Боссы приходят в фиксированные минуты, а не случайно
    - Опыт и сундуки собираются движением, притяжение читается как магнит
    - Выбор апгрейда меняет поведение оружия, а не только числа
    - Забег имеет конец по времени, а не только по смерти
    - Открытие нового персонажа даёт другой старт, а не другой цвет
  patterns/tower_defense_loop.md:
    sha: 436953c045f05804
    items:
    - Между волнами есть окно на постройку, и его длительность постоянна
    - У башни настраивается приоритет цели, и это влияет на исход
    - Ранний вызов волны даёт бонус — темп в руках игрока
    - Каждая пятая волна вводит новый тип угрозы, обесценивающий один удобный ответ
    - Протечка стоит жизней, а не мгновенного поражения
    - Воздух на пятой волне обесценивает только наземные башни
    - Босс меняет правила аурой, а не масштабом чисел
    - Итог показывает, где именно были протечки
  platform_builds/android_capacitor.md:
    sha: c43911b3ee463d3c
    items:
    - 'Имя пакета и ориентация выбраны до первой сборки: менять их позже дорого'
    - Каталог android/ закоммичен — удалённая сборка его не восстановит
    - 'npm run build выполнен перед каждым cap sync: оболочка пакует dist/ как есть'
    - Иконка сгенерирована инструментом из assets/icon.png, а не разложена руками
    - 'Баннер — нативный слой поверх WebView: игра не резервирует полосу второй раз'
    - Резерв пересчитывается после оседания раскладки, а не в момент события
    - Код версии увеличен перед каждой загрузкой
  playgama/bridge_api_reference.md:
    sha: efae7910bd186364
    items:
    - 'Игровой код не трогает window.bridge напрямую: всё через один сервис-обёртку с try/catch'
    - Каждый вызов безопасен на площадке, где функции нет, и на голом dev-сервере без SDK
    - 'Используется v2-API: bridge.leaderboards (множественное число), а не v1-имена'
    - Тип хранилища не выбирается вручную по isAuthorized — v2 делает это сам
    - Интерфейс построен на флагах поддержки, а не на предположении, что функция есть
    - Награда за rewarded берётся из события, а не из промиса
    - Колбэк каждого события вызывается один раз с текущим значением сразу при подписке
    - game_ready не отправляется сразу после initialize — только когда меню интерактивно
  playgama/platform_matrix.md:
    sha: 6f652ad0936f613a
    items:
    - 'Одна сборка на все площадки: различия — через bridge.platform.id и флаги поддержки, а не отдельные
      сборки'
    - 'Яндекс: authorize() вызывается только из действия игрока, у гостей тоже есть id и name'
    - 'VK/OK: авторизация молчаливая, игра работает в аккаунте с первого кадра'
    - 'VK/OK: баннер поднимается один раз за сессию, без обновления по таймеру'
    - 'CrazyGames: на время Basic Launch реклама выключена флагом на стороне игры'
    - 'Android: баннер — нативный слой, игра не резервирует полосу повторно'
    - 'Ни одна платформенная ветка не ломает игру там, где функции нет: она просто не показывается'
  playgama/social_features.md:
    sha: 27e53fba0a6a633b
    items:
    - Кнопка неподдерживаемого действия не рендерится вовсе, а не прячется стилем
    - Точка входа в соцфункции скрыта целиком, когда доступных действий нет
    - Вызов социального метода идёт синхронно внутри обработчика нажатия, иначе площадка его отклонит
    - Награда за действие выдаётся после вызова, а не до
    - 'Отказ игрока не показывается как ошибка: закрытие диалога неотличимо от сбоя'
    - Идентификатор сообщества берётся из конфига моста, а не зашит в коде игры
    - 'Предложение не появляется каждую сессию: есть «позже» и «больше не показывать», оба соблюдаются'
    - Прогресс никогда не заперт за социальным действием — площадки это отклоняют
    - Состояние соцфункций лежит в сохранении игры, а не в localStorage
  references/brotato.md:
    sha: 51a145bd7825664e
    items:
    - Волна короткая и заканчивается видимой вехой, а не тянется без отметок
    - 'Выбор в магазине — обмен: усиление одного стоит ослабления другого'
    - Перекат и блокировка предложений в магазине существуют и понятны
    - Разные персонажи меняют правила забега, а не только стартовое оружие
    - Рестарт мгновенный, без экрана загрузки
    - 'Арена не плоская: в ней есть укрытия и физические предметы, а не пустая сетка'
  references/dome_keeper.md:
    sha: df775ad2ca7636bc
    items:
    - В игре две контрастные фазы, и переход между ними ощущается сменой темпа
    - Есть звуковое предупреждение о приближении угрозы, и его слышно из другой фазы
    - 'Бюджет времени реален: игрок успевает вернуться, но без запаса'
    - Ресурсы переносятся с ограничением, и апгрейд переноски даётся рано
    - Возврат к базе не превращается в медленное перетаскивание
    - Обе фазы дают прогресс, ни одна не является наказанием
  references/gladihoppers.md:
    sha: 21e28fee02b2cff2
    items:
    - 'Удар имеет физический вес: вес оружия влияет на скорость и отбрасывание'
    - Смена стойки меняет доступные удары, а не анимацию
    - 'Есть буфер ввода: нажатие чуть раньше не теряется'
    - 'Управление не «плавает»: персонаж останавливается, когда игрок отпускает'
    - Отбрасывание считается физикой, а не подменой анимации
    - Между боями есть мета-прогресс, иначе выигранный бой ничего не оставляет
  references/slay_the_spire.md:
    sha: d61b2e193470996a
    items:
    - Намерение противника показано до хода игрока — бой становится задачей, а не лотереей
    - Ресурс хода ограничен и заставляет выбирать между атакой и защитой
    - Синергии предметов складываются каскадом и видны игроку
    - Путь по карте ветвится, и выбор узла — решение
    - Описания короткие и читаются на телефоне без увеличения
    - Добавление карты в колоду — осознанный выбор, отказаться тоже можно
  references/toribash.md:
    sha: 92d5e76ee2bb9852
    items:
    - Передача импульса и центр масс работают по-настоящему, а не имитируются анимацией
    - Игрок видит последствие своего решения до подтверждения хода
    - 'Управление упрощено до пригодного на телефоне: не десятки суставов, а несколько понятных рычагов'
    - Каждое движение влияет на равновесие, а не только на позу
    - Результат схватки читается по картинке, без чисел
    - Сцена минималистична, чтобы физика была видна
  references/vampire_survivors.md:
    sha: a4c9e88f44c6b3de
    items:
    - 'Вход без трения: игрок начинает играть за секунды, без обучения'
    - Атака автоматическая, игрок отвечает только за позицию
    - Формула эволюции оружия понятна и предсказуема
    - Повышение уровня даёт немедленный звук и вспышку, а не тихую цифру
    - Выбор из трёх апгрейдов меняет поведение, а не проценты
    - 'Фон не повторяется однообразной плиткой: в поздней игре есть на что смотреть'
    - В поздней игре остаётся активное уклонение, а не только автобой
  stack/bitecs.md:
    sha: 21eb94335a6c3959
    items:
    - ECS берётся ради множества однотипных сущностей; при менее чем сотне объектов обычные классы читаются
      лучше
    - Ссылка на меш обнуляется при удалении сущности, иначе меш остаётся в памяти
    - Результат query() не кэшируется между кадрами
    - Орда рисуется одним InstancedMesh, а не объектами сцены
    - Смерть обрабатывается ОДНОЙ системой, иначе один враг даёт два взрыва и двойной опыт
    - Порядок систем в кадре зафиксирован и осознан — это часть геймплея
    - Столкновения орды идут через равномерную сетку, а не полным перебором
    - onRemove вызывается до освобождения eid — данные читаются там, а не после
  stack/postprocessing.md:
    sha: d277457f5798a34e
    items:
    - 'renderer.render() больше не вызывается: только composer.render()'
    - toneMapping на рендерере выставлен в NoToneMapping, иначе цвет сжимается дважды
    - Набор эффектов пересобирается на смене тира качества, а не каждый кадр
    - На мобильном SSAO и DoF не включаются никогда, bloom — только малым ядром
    - Импульсные эффекты (удар, оглушение) меняют прозрачность прохода, а не пересобирают конвейер
    - Депт-зависимые эффекты получают буфер глубины, иначе они молча ничего не делают
    - Постобработка — первое, что отключается при просадке кадра
  stack/rapier3d.md:
    sha: 96bc29f649dbc0e5
    items:
    - 'Физика только на Rapier: свои «скорости», Cannon-es и ammo.js в проект не тянутся'
    - 'Шаг мира фиксированный: world.timestep не подменяется на dt'
    - cuboid() получает ПОЛУразмеры — коробка 1×1×1 это cuboid(0.5, 0.5, 0.5)
    - 'trimesh используется только для статичных тел: динамический проваливается сквозь мир'
    - Группы столкновений заданы с обеих сторон — иначе контакта не будет
    - Триггеры сделаны сенсорами, а не проверкой дистанции в update()
    - Синхронизация мешей идёт ПОСЛЕ world.step(), иначе кадр рисует прошлое состояние
    - «На земле» определяется контроллером персонажа, а не по velocity.y === 0
    - Рейкаст исключает собственное тело стрелка
    - Рестарт уровня — телепорт тел, а не пересборка мира
    - Физика проверена скриптом в Node до того, как её увидит игрок
  stack/recast_navigation.md:
    sha: 3dbe4b6932363166
    items:
    - 'Свой A* по сетке не пишется: навигация — recast, и только если в игре есть ходящие NPC'
    - walkableHeight, walkableClimb и walkableRadius посчитаны в ячейках от реальных размеров агента
    - Любая внешняя координата приводится к навмешу перед использованием
    - 'Путь пересчитывается по событию, а не каждый кадр: на полусотне агентов это съедает кадр'
    - Высота берётся из навмеша, а не рейкастом по земле — иначе NPC дрожит
    - Толпа ведётся через Crowd, а не самописным расталкиванием по радиусам
    - 'Источник позиции агента один: либо Crowd, либо steering, но не оба'
    - Динамические препятствия обновляются не каждый кадр, и агенты перестраиваются после обновления
    - В список мешей навмеша попали все преграды, включая стеклянные и невидимые
  stack/three_mesh_bvh.md:
    sha: be1e7f70df2a115d
    items:
    - Расширения прототипов подключаются в отдельном модуле, который импортируют все потребители
    - BVH строится на экране загрузки, а не при первом выстреле
    - Статика уровня слита в один меш, и BVH построен по нему, а не по каждому камню
    - Луч, сфера и бокс переводятся в локальное пространство геометрии перед запросом
    - Урон по области и обзор считаются через shapecast, а не перебором объектов
    - disposeBoundsTree() вызывается рядом с geometry.dispose()
    - Построение в воркере имеет дедлайн, а не ждёт бесконечно
  stack/yuka_ai.md:
    sha: af401b6bcbb49613
    items:
    - 'Yuka держит свои позиции: связка с графикой через setRenderComponent и matrixAutoUpdate = false'
    - Движение собрано из готовых steering-поведений, а не из своей математики
    - 'Веса поведений расставлены осознанно: «не слипаться» важнее, чем «догнать»'
    - Состояния — StateMachine с enter/execute/exit, а не строковое поле
    - Поведение снимается в exit состояния, иначе оно накапливается
    - Восприятие обновляется до entityManager.update(), иначе агент реагирует на прошлый кадр
    - 'Память о цели инициализирована до чтения: запись появляется не сама'
    - Дорогие проверки восприятия разрежены по кадрам, а не выполняются всеми агентами каждый кадр
  threejs/adaptive_quality.md:
    sha: 0c7191bc0ee2832c
    items:
    - Целевой кадр зафиксирован (60 или частота панели, если она ниже), качество подгоняется под него
    - '120 FPS не преследуется: это батарея и мигание качества на 60-герцовой панели'
    - Игра стартует на полном качестве и опускается, а не стартует урезанной и ползёт вверх
    - 'Подъём качества не решается по среднему времени кадра: под vsync свободного запаса по нему не видно'
    - Частота панели определяется как минимальный чистый интервал rAF за первые ~60 замеров
    - 'Регулятор сходится: качество не скачет вверх-вниз по кругу'
    - Тени перенастраиваются на лету, без пересоздания сцены
    - Автотюнер проверен на реалистичных временах кадра, а не на синтетических 8 мс
  threejs/horde_survivor_core.md:
    sha: b60bf56d40149ea6
    items:
    - Орда — это ECS и инстансинг, а не объекты сцены
    - frustumCulled = false на инстансированной орде
    - Урон по площади считается с учётом плотности толпы, а не общим DPS
    - 'Урон орбитального оружия привязан ко времени, а не к кадру: иначе на 60 FPS он в 60 раз больше
      задуманного'
    - 'Здоровье и число врагов растут линейно, а не множителем: множитель даёт спираль смерти к третьей
      минуте'
    - Скорость врагов не превышает скорость игрока — кайт остаётся возможным
    - 'Раздача карточек умеет заканчиваться: вернуть меньше трёх вариантов — нормально'
    - Кристаллы притягиваются с ускорением, а не с постоянной скоростью
  threejs/juice_and_vfx_pool.md:
    sha: fbba462129440c77
    items:
    - Частицы живут в пуле на InstancedMesh, без аллокаций в кадре
    - 'Гравитация, время жизни и размер — параметры частицы, а не константы пула: иначе дым падает как
      искры'
    - Искры, гильзы и кровь летят направленным конусом вдоль нормали или выстрела, а не разлетаются шаром
    - Аддитивные искры и полупрозрачный дым — два меша и два пула, а не один материал
    - 'Затухание сделано цветом через setColorAt: прозрачность живёт в общем материале'
    - frustumCulled = false на мешах с мировыми инстансами — иначе эффекты пропадают при отвороте камеры
    - Активные частицы пишутся в буфер подряд, mesh.count выставляется в конце, а неактивные не прячутся
      в (0,-999,0)
    - Шейк камеры затухает сам и не оставляет камеру смещённой
  threejs/melee_combat_and_ragdoll.md:
    sha: e757fd3a8e1dece0
    items:
    - Боёвка считается в кадрах фиксированного шага, а не в секундах
    - 'Связка держится на трёх механизмах сразу: окно отмены, буфер ввода, память связки'
    - Память связки тратится только в простое, иначе долгий приём сам себя обрывает
    - После финишера связка начинается заново — игрок не зацикливает сильнейший приём
    - Hit-stop — счётчик кадров, а не setTimeout, и замирает всё, включая шаг физики
    - Поражение считается сектором вокруг бойца, а не прямоугольным хитбоксом
    - У парирования три исхода, а не два, и парировать во время своего приёма нельзя
    - 'У толпы врагов есть токены атаки: одновременно бьют не все'
    - Стан врага короче полного цикла его приёма — иначе получается бесконечный лок
    - 'Труп удаляется по таймеру, а не по isSleeping(): у рэгдолла на Rapier сон не наступает'
    - dispose() рэгдолла снимает и суставы, и тела
    - Оружие выпадает из рук трупа с сохранением мирового трансформа
  threejs/mobile_shaders.md:
    sha: 683f46aee6df46a7
    items:
    - Для толп используются Lambert или Phong, а не Physical
    - Тяжёлая постобработка на мобильном отключена или заменена дешёвой
    - Нормали для освещения считаются в вершинном шейдере, где это возможно
    - Текстуры не больше необходимого разрешения, атласы вместо россыпи файлов
    - 'Прозрачных материалов минимум: каждый — отдельный проход сортировки'
    - Шейдер проверен на реальном телефоне, а не только в десктопном браузере
  threejs/orthographic_2d_and_pointer_input.md:
    sha: e4989c4b2776b939
    items:
    - Счёт идёт в игровых единицах, а не в пикселях
    - Фиксируется видимая высота мира, ширина следует за соотношением сторон
    - Критичный по геймплею контент помещается в безопасный прямоугольник самого узкого экрана
    - Экранные координаты переводятся в мир через NDC и Raycaster, а не ручной формулой
    - Перетаскивание переживает выход пальца за пределы элемента
    - Камера пересобирается на resize, и объекты не растягиваются
  threejs/performance_guide.md:
    sha: 26758f5b8fa64980
    items:
    - Повторяющиеся объекты (враги, снаряды, обломки, трава) — через InstancedMesh, а не отдельными мешами
    - Статичное окружение слито в общую геометрию
    - В кадре меньше 50 000 активных треугольников
    - Геометрии, материалы и текстуры освобождаются при смене сцены
    - Один направленный свет с тенями; заполняющий — ambient или hemisphere, а не россыпь точечных
    - Карта теней не больше 1024 на мобильном
    - pixelRatio ограничен 1.5 на мобильном
    - 'Дельта времени ограничена сверху: возврат из свёрнутой вкладки не взрывает физику'
  threejs/physics_integration.md:
    sha: dfbd5b178241baf1
    items:
    - 'Движок выбран под задачу: Rapier для тысяч тел, рэгдоллов и рейкастов, Cannon-es для простых аркадных
      столкновений'
    - 'Порядок кадра: силы → шаг мира → синхронизация мешей, а не наоборот'
    - Позиция меша интерполируется между физическими шагами, иначе видно дрожание
    - Суставы рэгдолла имеют пределы углов, линейное и угловое затухание — без этого он трясётся
    - 'Тела и суставы освобождаются явно: память WASM не собирается сборщиком мусора'
    - Шаг физики фиксированный, а накопитель ограничен сверху
  threejs/procedural_mesh_builder.md:
    sha: a63bf586a0a48486
    items:
    - Модели собираются процедурно в коде, без внешних GLTF
    - 'Силуэт читается на расстоянии: персонаж отличается от врага формой, а не только цветом'
    - Геометрия переиспользуется между экземплярами, а не создаётся заново на каждый объект
    - metalness ≤ 0.4 или задан scene.environment — иначе металл выглядит чёрным
    - Анимация персонажа идёт поворотами костей или групп, а не подменой мешей
    - 'Число материалов ограничено: каждый новый материал — отдельный draw call'
  threejs/stealth_and_vision_cones.md:
    sha: 2cb9edd1c8ec9cd2
    items:
    - 'Проверка видимости двухступенчатая: сначала дешёвый отбор, рейкаст — только для прошедших'
    - Буфер меша конуса выделяется один раз, а не пересоздаётся каждый кадр
    - 'Вершины конуса пишутся в тех же координатах, в которых он висит: мировых или локальных, но не вперемешку'
    - 'Есть период прощения: мелькнувший в углу конуса игрок не становится подозрительным'
    - Подозрение растёт монотонно и падает при потере цели
    - Шум переводит охранника в проверку, но сам по себе тревогу не поднимает — тревога только глазами
    - 'Поворот головы ограничен угловой скоростью: конус не телепортируется'
    - Стоять на краю дальности конуса вечно нельзя — есть верхняя граница времени до обнаружения
