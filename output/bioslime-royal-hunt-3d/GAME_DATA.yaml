  - Застревание слизи внутри геометрии замковых стен при быстром росте
  - Потеря фокуса WebAudio при входящем звонке на смартфоне
  - Смещение экранных координат тача при изменении ориентации экрана
roadmap:
- phase_number: 1
  title: Базовый прототип и шейдер слизи
  duration_days: 2
  tasks:
  - Настройка сборки Vite + Three.js + TypeScript
  - Создание GLSL шейдера деформации желеобразной сферы (Wobble & Squash)
  - Реализация базового контроллера перемещения (клавиатура + виртуальный джойстик)
  milestone_deliverable: Управляемая капля слизи с сочной физикой колыхания на 3D-плоскости
- phase_number: 2
  title: Физика поглощения, рост и разрушения
  duration_days: 2
  tasks:
  - Интеграция Rapier3D и Spatial Hash Grid для быстрого поиска объектов
  - Создание механики заглатывания мелких NPC и динамического масштабирования меша
  - Добавление разрушаемых заборов и микро-декораций с разлетом щепок
  milestone_deliverable: Игрок может расти от поглощения пейзан и крушить декорации
- phase_number: 3
  title: Враги, волны и боевая система мутаций
  duration_days: 3
  tasks:
  - Создание системы AI-спавна стражников, лучников и рыцарей
  - Реализация древа мутаций (ядовитые споры, миньоны, панцирь, шипы)
  - Окно повышения уровня с генерацией случайных триплетов карточек
  milestone_deliverable: Полноценный боевой цикл выживания с авто-атаками и прокачкой
- phase_number: 4
  title: Интеграция Playgama Bridge, мета-прогресс и полишинг
  duration_days: 2
  tasks:
  - Подключение @playgama/bridge (Rewarded, Interstitial, Cloud Save, Leaderboards)
  - Создание экрана мета-лаборатории для прокачки генов за собранную ДНК
  - 'Финальная полировка сочности: скрин-шейк, партиклы, звуковые эффекты'
  milestone_deliverable: Готовая к публикации игра с полным циклом мета-игры и монетизации
- phase_number: 5
  title: QA, оптимизация и релиз
  duration_days: 1
  tasks:
  - Тестирование на мобильных устройствах, профилирование draw calls и памяти
  - Настройка адаптивного DPI и локализации (RU/EN)
  - Финальная сборка и публикация на платформы Yandex Games и VK
  milestone_deliverable: Релизный билд, успешно прошедший премодерацию платформ
risks:
- risk: Падение производительности на мобильных устройствах при 400+ активных NPC
    на экране
  category: technical
  severity: High
  mitigation: Использование Three.js InstancedMesh для всех однотипных врагов, объединение
    данных в текстурные массивы и куллинг объектов за пределами камеры.
- risk: Визуальные артефакты вершинного шейдера слизи при экстремальных значениях
    скорости
  category: technical
  severity: Medium
  mitigation: Жесткий клампинг (clamping) максимальной амплитуды деформации в GLSL-коде.
- risk: Игрок становится слишком большим и игра теряет челлендж
  category: gameplay
  severity: Medium
  mitigation: Динамический спавн гигантских катапульт, магов с замедляющими полями
    и осадных големов, пропорциональных размеру игрока.
skills:
- skill_id: threejs_slime_shader
  name: Процедурный шейдер деформации слизи на Three.js
  filename: skills/threejs_slime_shader.md
  purpose: Обеспечение физически правдоподобного эффекта колыхания, сквоша и подповерхностного
    свечения слизи на базе кастомного ShaderMaterial.
  when_to_use: При создании меша главного персонажа, миньонов-слизней и эффекта поглощения.
  rules:
  - Вычислять смещение вершин в вертексном шейдере на основе 3D Simplex Noise и вектора
    скорости.
  - Использовать нормали для создания эффекта полупрозрачного френелевского свечения
    на гранях.
  architecture: 'Custom ShaderMaterial с uniform-переменными: uTime, uVelocity, uSquashFactor,
    uColorPrimary, uColorCore.'
  implementation_guidance: Передавать вектор ускорения из физического контроллера
    в материал каждый кадр с плавной экспоненциальной интерполяцией (lerp).
  common_mistakes:
  - Пересчет нормалей на CPU вместо GPU (убивает производительность)
  - Отсутствие ограничения амплитуды шума, приводящее к самопересечению полигонов
  checklist:
  - Проверить работу на мобильном WebGL 1.0/2.0
  - Убедиться в отсутствии лагов при быстром изменении масштаба меша
- skill_id: game_skill
  name: 'Биослизь: Королевская Охота 3D Domain Architecture'
  filename: GAME_SKILL.md
  purpose: 'Defines domain rules, state machine, and core gameplay loop for Биослизь:
    Королевская Охота 3D.'
  when_to_use: Use when writing or modifying core game state, loop coordination, and
    progression.
  rules:
  - Strict TypeScript strict mode without any 'any' types.
  - Fixed 60Hz delta accumulator with delta clamping.
  - Decoupled state management via typed EventBus.
  - Zero runtime object allocations inside the 60Hz game loop.
  architecture: 'Decoupled 3-layer architecture: Application/Platform -> Engine/Systems
    -> Rendering/UI.'
  implementation_guidance: Instantiate Game instance from main.ts, bootstrap PlaygamaService,
    and start GameLoop.
  common_mistakes:
  - Do not instantiate Three.js meshes or heavy objects inside tick loops.
  - Do not bypass the EventBus for cross-system communications.
  checklist:
  - Game initializes cleanly and loads within 3 seconds.
  - EventBus routes inputs and system events without memory leaks.
  - Audio auto-pauses and unpauses cleanly with browser focus changes.
- skill_id: gameplay_skill
  name: Combat, Physics & Movement Systems
  filename: GAMEPLAY_SKILL.md
  purpose: Defines standards for physics simulation, combat mechanics, and tactile
    player feedback.
  when_to_use: Use when writing character controllers, weapon systems, collision listeners,
    and juice/VFX.
  rules:
  - Clamp delta time to maximum 100ms to prevent physics tunneling.
  - Use continuous collision detection (CCD) for fast projectiles.
  - Apply hitstop (40ms time dilation) on impactful strikes.
  - Always synchronize physics rigid body transforms to mesh representations.
  architecture: Physics engine (Rapier3D/Matter.js) stepped on fixed 60Hz timestep,
    meshes interpolated.
  implementation_guidance: Use EventBus to emit 'entity:hit', 'combat:parry', 'wave:cleared'
    events for sound and VFX triggers.
  common_mistakes:
  - Never modify transform matrices directly on physics-controlled entities.
  - Do not hardcode magic numbers for damage or velocities without centralized configuration.
  checklist:
  - Player movement is responsive with no input lag.
  - Hits produce satisfying sensory feedback (VFX spark, screen shake, audio impact).
  - Ragdoll or death animations trigger smoothly without physics jitter.
- skill_id: renderer_skill
  name: THREEJS WebGL Performance Guide
  filename: RENDERER_SKILL.md
  purpose: Optimization and visual standards for THREEJS WebGL pipeline.
  when_to_use: Use when configuring scenes, cameras, lighting, materials, instanced
    meshes, and particle systems.
  rules:
  - Keep active draw calls strictly under 80.
  - Use InstancedMesh for debris, bullets, and crowd mobs.
  - Clamp pixel ratio to Math.min(window.devicePixelRatio, 1.5) on mobile.
  - Share material instances across identical geometry.
  architecture: Scene graph with pre-allocated sprite and mesh pools, dynamic shadow
    frustum optimization.
  implementation_guidance: Initialize renderer with antialias enabled on desktop,
    powerPreference 'high-performance'.
  common_mistakes:
  - Do not construct new Geometries, Textures, or Materials in the render loop.
  - Do not leave unused GPU assets without calling .dispose().
  checklist:
  - Maintains solid 60 FPS on desktop and >= 50 FPS on mobile.
  - No WebGL context loss errors on tab switches.
  - Shadow map renders crisp without artifact acne.
- skill_id: playgama_skill
  name: Playgama Bridge SDK Integration
  filename: PLAYGAMA_SKILL.md
  purpose: Defines implementation patterns for @playgama/bridge (Ads, Cloud Storage,
    Leaderboards, Lifecycle).
  when_to_use: Use when implementing advertising triggers, cloud save/load, and portal
    lifecycle hooks.
  rules:
  - Always await bridge.initialize() before showing any ads or loading storage.
  - Mute Howler audio master and pause game loop while ads are active.
  - Handle ad errors gracefully without blocking the player's progression.
  - Auto-save player progress on wave complete and game over.
  architecture: Singleton PlaygamaService wrapper exposing strongly-typed promises
    for Ads, Storage, and Leaderboards.
  implementation_guidance: Call bridge.advertisement.showRewardedVideo() with proper
    reward callbacks and error handling.
  common_mistakes:
  - Never show Interstitials during active gameplay without user expectation.
  - Never assume internet connection is permanent—support local offline fallback.
  checklist:
  - Rewarded video grants exact promised reward upon completion.
  - Leaderboard score submits and displays correctly.
  - Game auto-pauses when browser tab loses visibility.
