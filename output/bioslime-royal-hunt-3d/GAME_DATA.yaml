definition_of_done:
- Процедурный шейдер слизи стабильно работает с плавной деформацией при движении и
  ударах.
- Механика поглощения четко масштабирует слизь от мелкого размера до гиганта с зумом
  камеры.
- Реализованы как минимум 5 уникальных мутаций с видимыми визуальными эффектами и
  авто-атаками.
