raw_prompt: Создай 3D игру на Three.js в стиле Agar.io meets Vampire Survivors. Игрок
  — процедурно деформируемая слизь со специальным шейдером, поглощающая мелких NPC
  и растущая в объеме. По мере роста открываются мутации (выпуск ядовитых спор, клонирование
  миньонов, бронированный панцирь). Реализуй физику поглощения, разрушаемые микро-декорации,
  сочный сквош-эффект и таймер выживания против королевской гвардии.
title: 'Биослизь: Королевская Охота 3D'
slug: bioslime-royal-hunt-3d
genre: 3D Roguelite Экшен / Выживание
subgenre: Agar-поглощение массы + Survivors Bullet Heaven
renderer: threejs
renderer_reason: User explicitly specified 'threejs'.
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web & Mobile)
orientation: landscape
target_audience: Игроки 12–35 лет, любящие динамичные аркады роста массы (Agar.io,
  Hole.io), авто-экшены выживания (Vampire Survivors, Brotato) и физические разрушения.
core_loop: Поглощение мелких крестьян и разрушение микро-декораций -> Набор биомассы
  и увеличение размера слизи -> Выбор случайных мутаций при повышении уровня -> Отражение
  накатывающих волн королевской гвардии и боссов -> Накопление очков ДНК и перманентная
  прокачка генома в лаборатории.
hook: Управляйте живой желеобразной массой с процедурным шейдером, которая начинает
  размером с яблоко, а к 10-й минуте вырастает в гигантского титана, проглатывающего
  королевскую конницу и башни замка целиком!
player_fantasy: Вы — неудержимая первобытная биомасса, вырвавшаяся из алхимической
  лаборатории, которая мутирует на ходу, адаптируется к атакам целой королевской армии
  и поглощает все живое на своем пути.
session_model: 7–10 минутные сессии выживания по таймеру с динамически нарастающей
  сложностью, волнами элитных рыцарей и мгновенным выбором мутаций.
unique_value_proposition: Уникальный синтез физики роста массы из Agar.io и богатого
  билдостроения Vampire Survivors, усиленный процедурной 3D-деформацией слизи, сочным
  сквош-эффектом и полным разрушением интерактивного средневекового окружения.
vision: Создать эталонный веб-хит в жанре 3D-выживания, где тактильное удовольствие
  от физики поглощения и желеобразного шейдера сочетается с реиграбельностью лучших
  представителей roguelite-экшенов.
elevator_pitch: 'Vampire Survivors встречает Agar.io в средневековом 3D-сеттинге:
  вы играете за разумную каплю слизи с сочной физикой деформации. Пожирайте крестьян,
  стражников и заборы, отращивайте шипы, ядовитые железы и армию миньонов, чтобы сокрушить
  королевскую гвардию и выжить до рассвета!'
win_conditions: Продержаться 10 минут против непрерывных волн королевской армии и
  одолеть прибывшего на 10-й минуте Королевского Инквизитора в бронированном големе.
lose_conditions: Потеря всего запаса биомассы (HP падает до нуля под шквальным уроном
  королевских лучников, магов и рыцарей).
progression_summary: 'Внутри забега: набор биомассы открывает мутации 3 уровней редкости
  (обычные, редкие, легендарные эволюции). Мета-прогресс: за собранную ДНК в меню
  открываются постоянные пассивные таланты (базовая скорость, вязкость, урон ядом,
  начальный радиус) и новые архетипы слизи.'
difficulty_curve: 'Экспоненциальная кривая эскалации: первые 2 минуты — мирный сбор
  ресурсов и слабые пейзане; 3–5 минуты — отряды копейщиков и лучников; 6–8 минуты
  — рыцарская кавалерия и осадные катапульты; 9–10 минуты — элитная инквизиция с магами
  подавления и финальный босс-голем.'
scores:
  fun: 9
  originality: 8
  replayability: 9
  development_cost: 7
  visual_appeal: 9
  mobile_fit: 9
  monetization: 9
  platform_fit: 9
  overall_score: 8.7
  justification: Концепт сочетает проверенную виральность io-механик роста с аддиктивностью
    мета-прогрессии roguelite. Процедурный шейдер слизи и физика разрушений создают
    сильный визуальный хук для кликабельности и удержания.
references:
- name: Agar.io / Hole.io
  genre: Mass Absorption Arcade
  mechanics:
  - Рост масштаба объекта по мере поглощения
  - 'Соотношение размера: поглощение только тех, кто меньше игрока'
  - Изменение скорости движения в зависимости от массы
  lessons: Физическое масштабирование и ощущение могущества при росте создают мощнейший
    дофаминовый отклик.
  what_to_avoid: Избегать скучного пассивного блуждания без боевого давления и четких
    целей.
- name: Vampire Survivors
  genre: Roguelite Bullet Heaven
  mechanics:
  - Таймер выживания с накатывающими волнами врагов
  - Выбор одного из 3-4 случайных апгрейдов при левелапе
  - Автоматическое применение активных атак и эволюция оружия
  lessons: Четкий ритм наград и взрывные синергии билдов удерживают игрока на сотни
    сессий.
  what_to_avoid: Не перегружать экран нечитаемыми вспышками, ухудшающими обзор на
    мобильных экранах.
- name: Carrion
  genre: Reverse Horror / Monster Sim
  mechanics:
  - Управление аморфной биомассой с тентаклями
  - Пожирание людей для восстановления массы и здоровья
  - Физическое взаимодействие с окружением
  lessons: Анимация щупалец и деформация тела создают непревзойденное ощущение игры
    за монстра.
  what_to_avoid: Слишком сложное управление — для гипер-веб игры управление должно
    быть однокнопочным/джойстиком.
mechanics:
- name: Процедурный желеобразный шейдер и сквош-эффект
  category: visual_physics
  priority: core
  description: Кастомный GLSL шейдер деформирует вершины сферы игрока на основе вектора
    скорости, инерции и столкновений с объектами, создавая сочный эффект желе.
  player_interaction: При движении и поворотах слизь сплющивается, вытягивается в
    направлении рывка и колышется при остановке.
  feedback: Импульсная деформация при ударах, частицы всплеска слизи, тактильная отдача
    (вибрация) на мобильных устройствах.
  technical_complexity: Medium
  strengths:
  - Мгновенный вау-эффект и премиальный вид даже с базовой геометрией
  - Высокая производительность за счет вычислений на GPU
  weaknesses:
  - Требует точной настройки физических коэффициентов упругости, чтобы избежать артефактов
    растяжения сетки
- name: Физическое поглощение и динамический рост
  category: progression
  priority: core
  description: Игрок поглощает любых NPC и объекты, чей объем меньше 85% текущего
    объема игрока. При поглощении масса слизи увеличивается, а камера плавно отдаляется.
  player_interaction: Наезд на мелких NPC засасывает их внутрь полупрозрачного тела
    слизи с последующим перевариванием.
  feedback: Звук сочного хлюпанья, кратковременный импульс расширения меша, вылетающие
    сферы биомассы и цифры опыта.
  technical_complexity: Medium
  strengths:
  - Непрерывное визуальное и геймплейное ощущение прогресса силы
  - Интуитивная оценка опасности врагов по их относительному размеру
  weaknesses:
  - Необходимость динамической перенастройки коллайдера Rapier3D и дистанции спавна
    врагов
- name: Система био-мутаций (Триплеты улучшений)
  category: combat
  priority: core
  description: 'При заполнении шкалы биомассы игра ставится на микро-паузу и предлагает
    3 случайные мутации: ядовитые споры, миньоны-слизняки, бронированный панцирь,
    шипы, кислотный след.'
  player_interaction: Выбор карточки тапом или кликом мыши, мгновенное визуальное
    изменение модели слизи.
  feedback: Вспышка мутации, появление новых суб-мешей (панцирные пластины, споровые
    наросты, летающие споры вокруг).
  technical_complexity: Medium
  strengths:
  - Огромная вариативность билдов и высокая реиграбельность
  - Прямое влияние на стиль прохождения (сплэш-урон, суммоны, защита)
  weaknesses:
  - Требует тщательной балансировки параметров урона и кулдаунов
- name: Разрушение микро-декораций
  category: environment
  priority: secondary
  description: Заборы, палатки, бочки, телеги и небольшие деревянные сторожевые вышки
    разрушаются на физические осколки при столкновении с выросшей слизью.
  player_interaction: Таран препятствий на достаточной массе для расчистки арены и
    получения дополнительной биомассы.
  feedback: Разлет щепок с физикой частиц, звук треска дерева, экранный шейк (screen
    shake).
  technical_complexity: Medium
  strengths:
  - Дает игроку глубокое чувство всесокрушающей силы
  - Предотвращает застревание на узких участках карты
  weaknesses:
  - Необходимо ограничивать число активных физических осколков для стабильных 60 FPS
- name: Авто-атаки мутаций и клонирование миньонов
  category: combat
  priority: core
  description: 'Оружие и способности активируются автоматически по таймерам: выброс
    ядовитых облаков, выстрел шипами в ближайших рыцарей, отпочкование автономных
    мини-слизней.'
  player_interaction: Игрок фокусируется на позиционировании, маневрировании и сборе
    биомассы.
  feedback: Трассеры снарядов, зеленые ядовитые лужи на земле, рой мелких слизней,
    атакующих врагов вокруг.
  technical_complexity: High
  strengths:
  - Идеально подходит для мобильного управления одной рукой
  - Создает захватывающее зрелище хаоса на экране
  weaknesses:
  - Нагрузка на поиск ближайших целей (требуется оптимизация через Spatial Hash Grid)
gameplay_systems:
- name: Система физики массы и пространственной сетки
  purpose: Обеспечение быстрых коллизий поглощения и детекции целей для 300+ одновременных
    NPC на арене без просадки частоты кадров.
  input: Координаты, радиус и текущая масса игрока, миньонов, врагов и разрушаемых
    объектов.
  rules:
  - Если Mass(Player) > Mass(Target) * 1.15, цель затягивается в центр слизи и уничтожается
    с передачей опыта.
  - Если Mass(Player) <= Mass(Target), цель наносит контактный урон и отталкивает
    игрока.
  - 'Скорость перемещения игрока вычисляется по формуле: BaseSpeed * (1 / (CurrentMass^0.18)).'
  state:
  - player_mass
  - player_radius
  - spatial_hash_buckets
  - active_absorb_animations
  interactions: Взаимодействует с системой спавна волн, шейдером деформации и менеджером
    опыта.
  feedback: Плавное интерполированное изменение радиуса коллайдера и масштаба меша,
    динамический зум камеры.
  edge_cases:
  - Мгновенное поглощение пачки из 50 мелких NPC не должно приводить к скачку физического
    движка.
  - Камера не должна выходить за пределы скайбокса при максимальном росте.
- name: Система био-мутаций и синергий
  purpose: Управление генерацией улучшений, инвентарем способностей слизи и расчетом
    комбинированных эффектов.
  input: Текущий уровень биомассы, активные мутации игрока, пул доступных улучшений.
  rules:
  - При заполнении шкалы опыта выдается 3 неповторяющиеся мутации.
  - Мутация 'Ядовитые споры' + 'Панцирь' на максимальном уровне эволюционируют в 'Чумную
    цитадель' (ядовитая аура вокруг брони).
  - Мутация 'Клонирование' порождает до 6 миньонов, каждый наследует 20% текущих характеристик
    игрока.
  state:
  - player_level
  - current_biomass
  - biomass_to_next_level
  - active_perks_map
  - evolutions_unlocked
  interactions: Запускает UI модального окна выбора мутации, активирует таймеры авто-атак
    и шейдерные эффекты.
  feedback: Звуковой фанфар повышения уровня, партикловые ауры на персонаже.
  edge_cases:
  - Если игрок достиг максимума всех мутаций, предлагаются восстанавливающие 'Сгустки
    биомассы' (+25% HP и золото).
- name: AI-директор эскалации королевской гвардии
  purpose: Генерация сбалансированных волн противников с учетом текущего времени выживания
    и силы игрока.
  input: Игровое время (0:00 - 10:00), текущий размер игрока, плотность врагов на
    арене.
  rules:
  - Спавн происходит по внешнему кольцу видимости камеры через InstancedMesh.
  - Каждые 60 секунд тип спавнящихся отрядов обновляется на более тяжелый класс.
  - На 3:00, 6:00 и 9:00 спавнятся мини-боссы (Капитан Рыцарей, Королевский Архимаг,
    Инквизитор).
  state:
  - game_timer
  - current_wave_index
  - spawn_budget_pool
  - active_boss_ref
  interactions: Передает новые инстансы в рендерер и систему коллизий.
  feedback: Звук боевого рога при старте новой волны, красное предупреждение на экране
    при выходе босса.
  edge_cases:
  - При падении FPS ниже 45 AI-директор объединяет мелких крестьян в более сильных
    элитных пехотинцев для снижения числа объектов.
- name: Мета-лаборатория генетической модификации
  purpose: Обеспечение долгосрочного удержания игрока через прокачку постоянных характеристик
    за собранные очки ДНК.
  input: Заработанные очки ДНК за забеги, уровни приобретенных генов.
  rules:
  - 'Игрок покупает уровни генов: Плотность цитоплазмы (+HP), Хемотаксис (+Скорость),
    Пищеварительные ферменты (+Урон яда), Магнетизм биомассы (+Радиус сбора).'
  - Стоимость каждого следующего уровня гена возрастает на 35%.
  state:
  - total_dna_currency
  - gene_levels_dictionary
  - unlocked_slime_skins
  interactions: Синхронизируется с облачными сохранениями Playgama Cloud Save.
  feedback: Анимация колбы с бурлящей жидкостью при улучшении гена, звуковой сигнал
    успешной мутации.
  edge_cases:
  - Корректная обработка оффлайн-режима с локальным сохранением в IndexedDB/LocalStorage.
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.170.0
  physics_engine: Rapier3D (@dimforge/rapier3d-compat 0.13.x)
  state_manager: Reactive EventBus / State Store
  audio_engine: Howler.js / WebAudio API
  target_fps: 60
  max_draw_calls: 65
  max_triangles_or_sprites: 48000
  bundle_size_budget_mb: 3.8
  layers:
  - name: Rendering Layer
    details: Three.js WebGLRenderer, кастомный GLSL Material для слизи с вертексным
      смещением шумом Simplex, InstancedMesh для 500+ NPC и декалей
  - name: Physics & Spatial Layer
    details: Rapier3D WASM для твердых тел и разрушаемых объектов + Spatial Hash Grid
      для молниеносной проверки поглощения радиусами
  - name: Game Logic & ECS Layer
    details: 'Легковесная компонентная архитектура: SlimeController, MutationManager,
      EnemyWaveDirector, LootMagnetSystem'
  - name: Platform & SDK Layer
    details: 'Playgama Bridge интеграция: реклама, сохранение прогресса, авторизация,
      лидерборды, локализация'
  - name: UI Layer
    details: Адаптивный HTML5/CSS3 интерфейс с аппаратным ускорением transform/opacity
      поверх WebGL Canvas
  modules:
  - name: SlimeShaderModule
    description: GLSL шейдер с uniform-параметрами скорости, вектора инерции, подповерхностного
      рассеивания (SSS) и пульсации
  - name: AbsorptionPhysicsModule
    description: Расчет сил притяжения, эффекта заглатывания массы и интерполяции
      роста коллайдера
  - name: MutationTreeModule
    description: Реестр мутаций, логика авто-каста снарядов, споровых облаков и контроллер
      ИИ миньонов
  - name: DestructionManager
    description: Пул физических фрагментов для разрушения телег, заборов и палаток
      при столкновениях
  - name: BridgeAdapter
    description: Обертка над @playgama/bridge для показа Interstitial/Rewarded рекламы
      и сохранения прогресса
monetization:
  strategy_summary: 'Мягкая гибридная модель: ненавязчивая межстраничная реклама с
    умным таймером, высокоценная вознаграждаемая реклама (Rewarded Video) для воскрешения
    и умножения ДНК, а также косметика и стартовые наборы без пейволла.'
  rewarded_placements:
  - id: revive_run
    name: Второе Дыхание Слизи
    benefit: Мгновенное воскрешение на месте гибели с ударной волной отталкивания
      и 3 секундами неуязвимости
    cooldown_or_limit: 1 раз за забег
    trigger_moment: Экран гибели при наличии оставшегося времени на таймере
  - id: double_dna_reward
    name: Двойной Генетический Урожай
    benefit: Удвоение всех собранных очков ДНК за завершенный или проигранный забег
    cooldown_or_limit: После каждого забега
    trigger_moment: Экран итоговой статистики матча
  - id: reroll_mutations
    name: Генетический Реролл
    benefit: Бесплатная замена всех 3 предложенных карт мутаций на новые
    cooldown_or_limit: 2 раза за забег
    trigger_moment: Окно выбора мутаций при повышении уровня
  interstitial_placements:
  - trigger_event: Возврат в главное меню после завершения матча
    cooldown_seconds: 90
    conditions: Показывается только если игрок сыграл забег длительностью более 60
      секунд и не смотрел Rewarded видео за последние 45 секунд
  in_app_purchases:
  - sku: starter_pack_alpha
    name: Набор 'Альфа-Мутант'
    description: Разблокирует скин 'Магматическая Слизь', +500 ДНК и постоянный бонус
      +10% к стартовой массе
    price_tier: Tier 1 ($1.99 / 149 YAN)
