[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-game-prompt-factory"
version = "1.0.0"
description = "AI Game Prompt Factory: Automated game design specification and AI developer prompt generation pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AI Game Prompt Factory Team" }
]
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.5",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pillow>=11.0.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
game-factory = "app.cli:app"
