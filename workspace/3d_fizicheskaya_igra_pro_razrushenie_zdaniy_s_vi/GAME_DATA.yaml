mechanics:
- name: Векторный Срез Опорного Пилона (Shear Plane Cut)
  category: Двигатель (первичный импульс и инициация физического процесса уровня)
  priority: core
  description: Вместо абстрактного метания снарядов игрок работает как хирург-конструктор,
    управляя направляющим клином и геометрией физического соскальзывания многотонного
    монолита.
  player_interaction: 'Тач: жест drag-and-drop поперек опорной колонны; Мышь: зажатие
    ЛКМ на пилоне, протягивание вектора среза и отпускание.'
  feedback: 'Визуал / VFX: Яркая бирюзовая лазерная сетка на пилоне при наведении;
    при срезе — сноп белых искр, процедурные декали трещин бетона и взрывное кольцо
    пыли радиусом 8.0 м.; Звук (Web Audio): При натяжении вектора — повышающийся тон
    лазерной калибровки (800–1600 Гц), в момент среза — сухой гидравлический удар
    (200 Гц) с саб-басовым хвостом (45 Гц).; Камера: Резкий микровстрях (шейк амплитудой
    0.15 м, затухание 0.25 с) в момент срабатывания клина с легким динамическим зумом
    FOV (от 60° до 55° на 0.3 с).; UI / Тактильность: Вибрация haptic feedback (импульс
    ''heavy'' 40 мс на мобильных), счетчик оставшихся зарядов анимированно уменьшается
    с цифры 1 на 0 с красной вспышкой.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Траекторное Прогнозирование Центров Масс (Center-of-Mass Arc Predictor)
  category: Источник снижения риска и тактический калькулятор (позволяет игроку планировать
    сложный каскад до спуска курка)
  priority: secondary
  description: Прогнозирует не полет снаряда в пустоте, а сложное 3D-вращение твердого
    тела с меняющимся центром масс относительно точки опоры.
  player_interaction: Пассивный расчет в реальном времени при удерживании пальца/мыши
    в процессе прицеливания среза.
  feedback: 'Визуал / VFX: Неоновый пунктирный лазер дуги центров тяжести, голографический
    силуэт башни в точке удара и проекция круга поражения на фасаде цели.; Звук (Web
    Audio): Мягкий гармонический гул сонара (440 Гц), переходящий в высокий чистый
    тон подтверждения (880 Гц) при наведении на критический узел.; Камера: Плавный
    отъезд камеры назад на +15% по оси Z для демонстрации всего расчетного коридора
    падения здания.; UI / Тактильность: Микропульсация маркера прицела в точке удара
    и индикатор прогнозируемого урона (''KINETIC COLLAPSE LIKELY: 98%'').'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Кинетический Каскадный Резонанс (Kinetic Chain Domino)
  category: chain_physics
  priority: core
  description: Физическая передача массы, гравитационного рычага и кинетического импульса
    от падающей первой башни к стоящим рядом зданиям, вызывающая цепное обрушение
    всего сектора.
  player_interaction: 'Физический триггер: инициируется автоматически при первом столкновении
    падающих масс в симуляции Rapier3D.'
  feedback: 'Визуал / VFX: Деформация мешей в точке удара, вылетающие стеклянные панели
    (до 150 частиц Three.js instanced mesh), взрывные клубы пыли и обрушение перекрытий.;
    Звук (Web Audio): Низкочастотный глухой удар столкновения (55 Гц), звон бьющегося
    армированного стекла (2500–5000 Гц) и скрежет сминаемых стальных балок.; Камера:
    Пропорциональный кинетический шейк экрана (сила зависит от переданной энергии,
    до 0.4 м), замедление времени (Hitstop/Slowmo 0.3x на 0.4 секунды в момент ключевого
    соударения).; UI / Тактильность: Нарастающий счетчик комбо ''x2 CASCADE! -> x3
    MEGASHOCK!'' с золотым сиянием и сильная продолжительная вибрация на мобильных
    устройствах.'
  technical_complexity: High
  strengths:
  - Максимальный зрелищный вау-эффект и эмоциональный катарсис от масштабного разрушения
  - Бесконечная вариативность физических исходов
  weaknesses:
  - Высокая нагрузка на CPU при одновременном расчете десятков сочленений в Rapier3D
- name: Сейсмический Клин Задержки (Delayed Fracture Seeding)
  category: tactical_planning
  priority: supporting
  description: 'Тактическая механика предварительного надпила опор удаленного здания:
    игрок устанавливает таймерный микрозаряд, который подрубает колонну ровно в момент
    удара первой башни.'
  player_interaction: 'Тач: двойной тап по колонне удаленного здания для установки
    заряда; Мышь: клик ПКМ/иконка клина на панели + выбор таймера на диске задержки.'
  feedback: 'Визуал / VFX: Желто-оранжевый голографический маячок на колонне с пульсирующим
    цифровым таймером; при детонации — локальный кумулятивный выброс пламени и появление
    трещин.; Звук (Web Audio): Ритмичный часовой писк таймера (1000 Гц с ускорением
    темпа перед взрывом) и звонкий сухой щелчок кумулятивного микроподрыва.; Камера:
    Локальный микро-зум на целевую колонну за 0.2 с до детонации (picture-in-picture
    тактическое окно в углу экрана).; UI / Тактильность: Круговой прогресс-бар таймера
    над зданием и короткий двойной тактильный отклик (haptic double-tap) при детонации.'
  technical_complexity: Medium
  strengths:
  - Привносит глубину планирования из жанра саперных симуляторов
  - Позволяет сносить сложные нелинейные архитектурные ансамбли
  weaknesses:
  - Требует четкого визуального онбординга на продвинутых уровнях
gameplay_systems:
- name: Система Расчета Плоскости Среза (Cutting & Impulse System)
  purpose: Преобразование пользовательского свайпа в трехмерную плоскость рассечения
    колонны и приложение физического импульса смещения.
  input: Координаты точки касания на меше колонны, 2D-вектор протяжки свайпа, глубина
    луча камеры.
  rules:
  - Срез разрешен только в подсвеченных уязвимых зонах опорных колонн
  - Угол среза ограничен диапазоном от -60° до +60° от горизонтали
  - Сила толчка клина пропорциональна длине свайпа до достижения максимума
  state:
  - Idle
  - Aiming
  - Triggered
  - CoolingDown
  interactions: Связывает пользовательский ввод с созданием динамического шарнира
    в Rapier3D.
  feedback: Неоновый лазерный луч, нарастающий свист гидравлики, вспышка плазменной
    резки и резкий глухой удар.
  edge_cases:
  - Свайп за пределы экрана аннулирует прицел без траты заряда
  - Слишком короткий свайп (<10px) игнорируется как случайное касание
- name: Система Детекции Каскада и Разрушений (Domino Chain Evaluation System)
  purpose: Отслеживание передачи кинетической энергии между зданиями, фиксация процента
    уничтоженного объема и завершение уровня.
  input: События коллизий жестких тел в Rapier3D, координаты вершин мешей, скорость
    линейного и углового движения.
  rules:
  - Здание считается разрушенным, если его центр масс опустился ниже 30% от начальной
    высоты или угол наклона превысил 45°
  - Уровень переходит в фазу оценки после полной остановки движения всех тел (LinearVelocity
    < 0.05)
  - 100% зачистка площади дает 3 звезды при использовании <=1 заряда
  state:
  - Monitoring
  - CascadeActive
  - Settling
  - Completed
  interactions: Передает итоговый процент сноса и потраченные заряды в модуль начисления
    наград и лидербордов.
  feedback: Динамический круговой счетчик зачистки на HUD, комбо-множители при цепных
    ударах, финальный победный аккорд.
  edge_cases:
  - Застревание обломка в бесконечном дрожании отсекается таймером принудительного
    затухания через 8 секунд после последнего удара
- name: Система Траекторного Прогнозирования (Center-of-Mass Arc Predictor)
  purpose: Расчет и визуализация теоретической дуги падения вершины башни до момента
    физического среза.
  input: Текущие координаты центра масс выбранного здания, вектор и высота среза,
    константа гравитации сцены.
  rules:
  - Прогноз рассчитывается методом аналитической баллистики жесткого тела вокруг точки
    среза
  - Дуга упирается в ближайший коллайдер соседнего здания с подсветкой точки контакта
  state:
  - Hidden
  - Projecting
  - WarningInvalid
  interactions: Получает данные от гизмо прицеливания и обновляет буфер вершин шейдерной
    лазерной линии Three.js.
  feedback: Бирюзовая пунктирная светящаяся линия в воздухе с пульсирующей меткой
    Impact Zone.
  edge_cases:
  - При экстремально крутом угле среза дуга переключается в режим предупреждения о
    риске вертикального опадания
core_design:
  signature_moment: 'Момент, когда на 14-м уровне «Нео-Сибуя» игрок рассекает диагональным
    клином 45° опору центрального 70-этажного небоскрёба: время замедляется на 0.25x,
    камера даёт кинематографичный наезд на трескающийся бетон, верхушка башни с громоподобным
    металлическим стоном сносит стеклянный купол торгового центра, тот падает на две
    жилые башни-близнецы, и весь квартал из 5 зданий за 7.2 секунды аккуратно схлопывается
    внутрь защитного периметра под перезвон идеального комбо «100% SECTOR COLLAPSE».'
  genre_template_rejected: Отвергаем шаблон «беспорядочный кликер взрывов» (размещение
    десятков динамитных шашек по всему фасаду, как в Demolition Company / спам бомбами)
    и «аркадную рогатку» (выстрел шаром-тараном по постройке). В нашей игре разрушение
    — это не хаотичный спам снарядов, а детерминированная тактическая геометрия одного
    точного кинетического надреза (1–2 клина на уровень), где гравитация и масса самих
    зданий выступают главным оружием каскада.
  what_makes_it_different: В отличие от традиционных физических разрушалок с отстрелом
    блоков, здесь игрок манипулирует векторной плоскостью среза и смещением 3D-центра
    масс (Center-of-Mass). Здания обладают реалистичным тензором инерции и монолитностью,
    не рассыпаясь в кашу сразу, а падая как гигантские жесткие рычаги-домино, которые
    передают сотни тысяч тонн кинетической энергии соседним конструкциям, требуя расчета
    угла падения, высоты среза и времени детонации сейсмических микрозадержек.
  micro_loop:
  - step: ML-01_TARGET_INSPECTION
    player_action: Вращение орбитальной тактической камеры вокруг целевого небоскреба
      (зажатие ПКМ или свайп двумя пальцами) для поиска уязвимого опорного узла.
    game_response: Подсветка силового каркаса здания голографической сеткой стресс-нагрузки
      и отображение доступных зон рассечения пилонов.
    decision: Выбор между низким срезом у фундамента (максимальный опрокидывающий
      рычаг) или срезом на 1/3 высоты (ускоренный крен верхушки).
    duration: 2.0–5.0 с
  - step: ML-02_VECTOR_SLICE_AIM
    player_action: Жест drag-to-cut (протягивание линии среза мышью/пальцем) поперек
      опорной колонны с фиксацией угла наклона клина.
    game_response: Отрисовка светящейся плоскости среза и проецирование диегетической
      дуги смещения центра масс с точкой контакта со вторым зданием.
    decision: Юстировка угла скоса среза (от 15° до 60°) для точного задания вектора
      скольжения и направления падения башни.
    duration: 1.5–3.0 с
  - step: ML-03_HYDRAULIC_TRIGGER
    player_action: Отпускание пальца / ЛКМ для детонации гидравлического клина и подтверждения
      среза.
    game_response: Срабатывание пиропатрона клина, появление разлома в бетоне, импульсный
      сдвиг опорной секции и освобождение физического тела в симуляторе Rapier3D.
    decision: Запуск основного каскада сейчас или переход к установке таймерного сейсмо-микрозаряда
      на соседнем здании (если доступен второй заряд).
    duration: 0.2–0.5 с
  - step: ML-04_CASCADE_OBSERVATION
    player_action: Пассивное наблюдение кинематографичной физической цепной реакции
      обрушения с возможностью приближения камеры к эпицентру столкновения.
    game_response: Здание кренится, бьет соседнюю высотку по принципу домино, счетчик
      разрушения сектора динамически растет от 0% до 100% с аудио-нарастанием басов.
    decision: 'Оценка траектории падения: продолжается ли каскад или обломки застревают
      на демпферной опоре.'
    duration: 4.0–8.0 с
  meso_loop:
  - step: MESO-01_CONTRACT_BRIEFING
    player_action: 'Изучение тактического плана квартала: расположение зданий, красные
      зоны защитного периметра и количество выделенных клиньев (1–2 шт).'
    game_response: 'Отображение изометрической панорамы квартала, условий контракта
      (цель: ≥95% сноса, сопутствующий ущерб 0%) и начального счета.'
    decision: 'Формирование тактического маршрута каскада: какое здание будет инициатором-домино,
      а какие упадут рикошетом.'
    duration: 3.0–8.0 с
  - step: MESO-02_TACTICAL_EXECUTION
    player_action: Последовательная разметка среза опорного пилона и расстановка вспомогательных
      сейсмо-зарядов задержки.
    game_response: Синхронизация таймеров взрывателей и запуск единого цикла обрушения.
    decision: Корректировка тайминга срабатывания вспомогательного заряда (от 0.5
      с до 3.0 с) под скорость падения первой башни.
    duration: 5.0–15.0 с
  - step: MESO-03_DAMAGE_EVALUATION
    player_action: Ожидание полной остановки физических тел (Rapier3D sleep state)
      и фиксация финального процента разрушения сектора.
    game_response: Подсчет итогового сноса, проверка чистоты защитного периметра,
      начисление от 1 до 3 звезд и инженерных очков демонтажа.
    decision: Принять результат и перейти к следующему кварталу или нажать мгновенный
      рестарт (клавиша R / кнопка за 0.1 с) для идеального 100% сноса.
    duration: 2.0–4.0 с
  macro_loop:
  - step: MACRO-01_DISTRICT_PROGRESSION
    player_action: Выбор контракта на глобальной карте мегаполиса (от спальных жилых
      массивов до хай-тек деловых сити с подвесными мостами).
    game_response: Разблокировка новых районов с уникальной архитектурной геометрией,
      материалами (стекло, железобетон, композит) и усложненными периметрами.
    decision: Выбор порядка зачистки районов мегаполиса и повторное прохождение старых
      уровней на 3 звезды для разблокировки мастер-лицензии.
    duration: 10.0–20.0 с
  - step: MACRO-02_TOOLKIT_EXPANSION
    player_action: Получение допуска к специализированным инженерным инструментам
      (лазерный коллиматор угла, микрозаряды преднапряжения, импульсные гидро-домкраты).
    game_response: Интеграция новых модификаторов среза в инвентарь уровня без нарушения
      физической чистоты головоломки.
    decision: Выбор оптимального набора инструментов под тип зданий следующего мега-квартала.
    duration: 5.0–15.0 с
  - step: MACRO-03_ARCHITECTURAL_MASTERY
    player_action: Прохождение финального мега-уровня района (снос ансамбля из 6–8
      связанных небоскребов одним идеальным клином).
    game_response: Торжественная панорама очищенного горизонта мегаполиса, присвоение
      ранга «Главный Архитектор Демонтажа».
    decision: Переход в хардкорный режим «Ограниченный допуск» (отключение лазерного
      предпросмотра дуги) или режим свободной песочницы.
    duration: 30.0–60.0 с
  loop_diagram: "+-----------------------------------------------------------------------------------+\n\
    |                        СЕЙСМО-ДОМИНО: СИСТЕМА ТОЧЕЧНОГО СНОСА              \
    \       |\n+-----------------------------------------------------------------------------------+\n\
