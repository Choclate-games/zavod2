  tension_curve: 'Напряжение строится по принципу взведенной пружины: Фаза 1 (Штиль
    и расчет, 0–5 с) — тихий эмбиент, игрок вдумчиво крутит камеру и целится лазерным
    срезом; Фаза 2 (Спуск курка, 5–6 с) — резкий щелчок клина, взрыв пиропатрона,
    замирание звука на 0.2 с (pre-impact silence); Фаза 3 (Пик кинетической кульминации,
    6–11 с) — оглушительный низкочастотный гул, замедленный крен гиганта, лавинообразное
    крушение соседних башен, экранотряска и нарастание торжественного аккорда; Фаза
    4 (Катарсис и разрядка, 11–13 с) — оседание пылевого облака, глухой финальный
    стук последнего обломка, чистый звон победных звезд и счетчика 100%.'
  core_formulas:
  - F_shear = M_building * g * sin(theta_cut) + F_wedge_impulse — Сила начального
    соскальзывания срезанного блока по наклонной плоскости (Н), где M_building — масса
    блока (кг), g = 9.81 м/с², theta_cut — угол среза (градусы), F_wedge_impulse =
    850 кН.
  - tau_torque = M_building * g * (H_com * sin(alpha_tilt)) — Опрокидывающий гравитационный
    момент здания (Н·м), где H_com — высота центра масс (м), alpha_tilt — текущий
    угол отклонения оси башни от вертикали (градусы).
  - E_impact = 0.5 * I_rot * omega^2 + 0.5 * M_building * v_com^2 — Кинетическая энергия
    удара падающей башни в соседнее сооружение (Дж), где I_rot — момент инерции башни
    относительно точки вращения (кг·м²), omega — угловая скорость (рад/с), v_com —
    линейная скорость центра масс (м/с).
  - Damage_received = E_impact / R_structural_integrity — Расчет повреждения несущего
    каркаса принимающего здания; при Damage_received >= 1.0 (порог 15.0 МДж) здание
    теряет устойчивость и переходит в динамическое падение.
  - Score_contract = (Collapse_ratio * 1000) + (Unused_charges * 500) - (Debris_perimeter_breach
    * 250) + (Chain_combo_multiplier * 300) — Итоговый расчет очков за контракт демонтажа
    квартала.
  run_progression:
  - '1. Заряд 1 (Первичный клин): Игрок расходует основной тяжелый гидравлический
    клин (усилие 850 кН), превращая статичный 60-этажный небоскреб в кинетический
    таран массой 45 000 тонн.'
  - '2. Мультипликатор кинетической цепи (Kinetic Chain Multiplier): Каждое последующее
    обрушенное здание в непрерывной цепной реакции домино увеличивает суммарный кинетический
    импульс сектора на +25% за счет суммирования падающих масс.'
  - '3. Вспомогательный сейсмо-клин задержки (Secondary Delay Fracture): Активация
    второго микрозаряда на удаленной башне с выставленным таймингом подрезает ее опору
    ровно за 0.3 с до удара первой башни, снижая требуемую энергию сноса на 60%.'
  - '4. Резонансный коллапс основания (Resonance Base Shatter): При накоплении суммарной
    кинетической энергии каскада свыше 120 МДж фундаментные плиты квартала резонируют,
    автоматически разрушая мелкие технические пристройки без дополнительных клиньев.'
  meta_progression:
  - '1. Лицензии на районы мегаполиса: Прохождение кварталов открывает доступ к 5
    биомам (Спальный район «Бетонные соты» -> Финансовый даунтаун «Стеклянный пик»
    -> Портовые элеваторы -> Индустриальный технопарк -> Сверхвысотный кластер «Нео-Сибуя»).'
  - '2. Калибровка тактического проектора: Открытие улучшений интерфейса прогнозирования
    (индикатор радиуса разлета осколков, маркер гарантированного импульса разрушения,
    тепловая карта устойчивости балок).'
  - '3. Арсенал инженерных надпилов: Получение новых типов подсечек (срез двойным
    клином «V-образная вырубка» для строго вертикального схлопывания, направленный
    кумулятивный срез для быстрого бокового опрокидывания).'
  - '4. Рейтинг «Золотой Каскад»: Сбор 3 звезд во всех 30 контрактах открывает режим
    испытаний «Реверс-Снос» (снос башен в строго заданной последовательности с 1 клином).'
  mechanics:
  - name: Векторный Срез Опорного Пилона (Shear Plane Cut)
    role_in_loop: Двигатель (первичный импульс и инициация физического процесса уровня)
    player_decision: Выбор точной высоты среза на пилоне (от 0.5 до 12.0 м от земли)
      и угла скоса лезвия (от 15.0° до 60.0°) для управления направлением и скоростью
      соскальзывания фундамента.
    input_mapping: 'Тач: жест drag-and-drop поперек опорной колонны; Мышь: зажатие
      ЛКМ на пилоне, протягивание вектора среза и отпускание.'
    states:
    - 'IDLE_TARGETING: опора не выбрана, курсор сканирует геометрию зданий'
    - 'DRAGGING_PLANE: игрок тянет линию, рендерится лазерная плоскость рассечения
      и угловой транспортир'
    - 'LOCKED_PREVIEW: вектор зафиксирован, активен расчет дуги центра масс'
    - 'DETONATION: спуск гидравлического ножа, разрыв связей RigidBody в Rapier3D'
    - 'COMPLETED: клин отработан, расход заряда -1'
    parameters:
    - name: Угол наклона плоскости среза (Cut Angle)
      value: 35.0 градусов
      tuning_note: При угле менее 15° блок клинит и он оседает на месте; при угле
        более 60° блок соскальзывает слишком быстро без набора вращательного момента,
        падая вертикально вместо крена на соседнее здание.
    - name: Импульс выталкивания клина (Wedge Ejection Impulse)
      value: 850.0 кН
      tuning_note: Если занизить до 300 кН, массивная башня осядет обратно на фундамент;
        если завысить до 2000 кН, башня неестественно отскочит как легкая коробка,
        нарушив кинематографичность.
    - name: Высота точки среза от нулевой отметки (Cut Height Range)
      value: 2.5 м (диапазон 0.5–15.0 м)
      tuning_note: Срез у самой земли дает максимальное плечо опрокидывания, но медленный
        старт; срез на высоте 10 м дает быстрый излом верхушки, но оставляет высокий
        стоячий пенек, мешающий каскаду.
    - name: Время активации гидравлического лезвия (Blade Cut Duration)
      value: 0.18 с
      tuning_note: Если сделать дольше 0.4 с, теряется ощущение хлесткого сокрушительного
        удара; если мгновенно (0.0 с), игрок не успевает заметить визуальный вход
        лезвия в бетон.
    feedback_layers:
    - 'Визуал / VFX: Яркая бирюзовая лазерная сетка на пилоне при наведении; при срезе
      — сноп белых искр, процедурные декали трещин бетона и взрывное кольцо пыли радиусом
      8.0 м.'
    - 'Звук (Web Audio): При натяжении вектора — повышающийся тон лазерной калибровки
      (800–1600 Гц), в момент среза — сухой гидравлический удар (200 Гц) с саб-басовым
      хвостом (45 Гц).'
    - 'Камера: Резкий микровстрях (шейк амплитудой 0.15 м, затухание 0.25 с) в момент
      срабатывания клина с легким динамическим зумом FOV (от 60° до 55° на 0.3 с).'
    - 'UI / Тактильность: Вибрация haptic feedback (импульс ''heavy'' 40 мс на мобильных),
      счетчик оставшихся зарядов анимированно уменьшается с цифры 1 на 0 с красной
      вспышкой.'
    failure_mode: 'Неверный выбор угла (например, срез сделан в противоположную от
      соседнего здания сторону): башня валится в пустую зону или за защитный периметр,
      игрок видит красную траекторию с предупреждением ''CRITICAL TRAJECTORY DEVIATION''.'
    mastery_curve: Новичок на 30-й секунде делает случайный горизонтальный срез и
      удивляется оседанию башни на месте; эксперт на 10-м уровне срезает колонну под
      углом ровно 42.5° на высоте 4.2 м, заставляя башню закрутиться винтом и снести
      сразу два боковых строения.
    counterplay: Игра усложняет задачу введением железобетонных армированных сердечников
      (требуют угла среза не менее 40°) и асимметричных фундаментов, сопротивляющихся
      опрокидыванию.
    synergies:
    - Передает рассчитанный вектор среза в 'Траекторное Прогнозирование Центров Масс'
      для мгновенной отрисовки дуги падения.
    - Задает начальную скорость и массу тарана для 'Кинетического Каскадного Резонанса'.
    why_unique: Вместо абстрактного метания снарядов игрок работает как хирург-конструктор,
      управляя направляющим клином и геометрией физического соскальзывания многотонного
      монолита.
    pseudocode: "function onShearCutUpdate(pointerState, selectedPillar) {\n  if (!pointerState.isDragging)\
      \ return;\n  const cutPlane = calculatePlane(selectedPillar, pointerState.startPos,\
      \ pointerState.currentPos);\n  const angle = calculateClampAngle(cutPlane.normal,\
      \ 15.0, 60.0);\n  TrajectoryPredictor.updateArc(selectedPillar, cutPlane.height,\
      \ angle);\n  if (pointerState.isReleased && cutCharges > 0) {\n    cutCharges\
      \ -= 1;\n    PhysicsEngine.splitRigidBody(selectedPillar.buildingId, cutPlane);\n\
      \    PhysicsEngine.applyImpulseAtPoint(selectedPillar.body, cutPlane.impulseVector.multiplyScalar(850.0),\
      \ cutPlane.contactPoint);\n    VFX.spawnSparksAndDust(cutPlane.contactPoint);\n\
      \    Audio.playHydraulicImpact();\n  }\n}"
  - name: Траекторное Прогнозирование Центров Масс (Center-of-Mass Arc Predictor)
    role_in_loop: Источник снижения риска и тактический калькулятор (позволяет игроку
      планировать сложный каскад до спуска курка)
    player_decision: 'Считывание расчетной дуги падения: попадает ли верхушка башни
      в уязвимую зону следующего здания и не пересекает ли траектория красную черту
      охранного периметра.'
    input_mapping: Пассивный расчет в реальном времени при удерживании пальца/мыши
      в процессе прицеливания среза.
    states:
    - 'INACTIVE: срез не активен, проектор выключен'
    - 'CALCULATING: итеративный расчет дуги центра масс на 2.5 секунды вперед'
    - 'CLEAR_HIT: прогнозируется успешное попадание в соседнее здание (зеленый маркер
      прицела)'
    - 'PERIMETER_WARNING: дуга пересекает запретную зону (мигающий красный маркер
      ''HAZARD'')'
    parameters:
    - name: Длина симулируемой дуги прогноза (Prediction Horizon)
      value: 2.5 с (до первого расчетного контакта)
      tuning_note: Если сделать более 4.0 с, игра раскроет всю цепочку домино заранее
        и убьет интригу наблюдения; если менее 1.0 с, игрок не поймет, долетит ли
        верхушка до соседнего здания.
    - name: Количество дискретных точек траектории (Arc Sample Steps)
      value: 32 точки
      tuning_note: 32 точки обеспечивают гладкую лазерную кривую с минимальной нагрузкой
        на CPU (менее 0.5 мс на кадр); при 8 точках дуга выглядит угловато и не дает
        точного прицеливания.
    - name: Погрешность физического разброса (Simulation Noise Gap)
      value: ±5.0 % от точки падения
      tuning_note: Легкая диегетическая погрешность сохраняет азарт и живость физики;
        если прогноз 100% точен как рельсы, игра превращается в сухой чертеж.
    feedback_layers:
    - 'Визуал / VFX: Неоновый пунктирный лазер дуги центров тяжести, голографический
      силуэт башни в точке удара и проекция круга поражения на фасаде цели.'
    - 'Звук (Web Audio): Мягкий гармонический гул сонара (440 Гц), переходящий в высокий
      чистый тон подтверждения (880 Гц) при наведении на критический узел.'
    - 'Камера: Плавный отъезд камеры назад на +15% по оси Z для демонстрации всего
      расчетного коридора падения здания.'
    - 'UI / Тактильность: Микропульсация маркера прицела в точке удара и индикатор
      прогнозируемого урона (''KINETIC COLLAPSE LIKELY: 98%'').'
    failure_mode: Игрок игнорирует красный мигающий индикатор выхода за периметр,
      отпускает срез и обломки башни сносят защищенный исторический памятник — мгновенный
      штраф и провал контракта.
    mastery_curve: Новичок оценивает только попадание по первой цели; мастер использует
      прогноз, чтобы рассчитать рикошетный вектор, направляя вторую башню по касательной
      в третью.
    counterplay: Ветер на верхних этажах высотных кварталов и переменная плотность
      конструкций зданий слегка деформируют дугу падения, требуя поправки на снос.
    synergies:
    - Получает входные данные угла и высоты от 'Векторного Среза Опоры'.
    - Верифицирует кинетические условия для гарантированного запуска 'Кинетического
      Каскадного Резонанса'.
    why_unique: Прогнозирует не полет снаряда в пустоте, а сложное 3D-вращение твердого
      тела с меняющимся центром масс относительно точки опоры.
    pseudocode: "function updateTrajectoryPrediction(building, cutParams) {\n  if\
      \ (!cutParams.isActive) { TrajectoryArc.hide(); return; }\n  const com = building.getCenterOfMass();\n\
      \  const initialTorque = calculateTiltTorque(building.mass, cutParams.angle,\
      \ cutParams.height);\n  const trajectoryPoints = PhysicsSimulator.predictRigidBodyArc(building,\
      \ initialTorque, 32, 2.5);\n  const impactTarget = detectFirstCollision(trajectoryPoints);\n\
      \  const violatesPerimeter = checkPerimeterOverlap(trajectoryPoints);\n  TrajectoryArc.render(trajectoryPoints,\
      \ violatesPerimeter ? Color.RED : Color.CYAN);\n  UI.showImpactPrediction(impactTarget,\
      \ violatesPerimeter);\n}"
  - name: Кинетический Каскадный Резонанс (Kinetic Chain Domino)
    role_in_loop: Источник награды и кульминация геймплея (главный генератор зрелища
      и очков победы)
    player_decision: 'Геометрический выбор цепочки передачи импульса: направить тяжелое
      80-метровое здание в основание легкого или запустить веерное падение трех башен
      от одного центрального толчка.'
    input_mapping: 'Физический триггер: инициируется автоматически при первом столкновении
      падающих масс в симуляции Rapier3D.'
    states:
    - 'STANDBY: конструкции статичны, связки не напряжены'
    - 'COLLISION_IMPACT: детекция контакта между падающим телом и статичным зданием'
    - 'ENERGY_TRANSFER: перерасчет кинетической энергии, разрушение несущих узлов
      цели'
    - 'CASCADE_CHAIN_REACTION: одновременное движение 2+ зданий, рост комбо-счетчика'
    - 'SETTLED: физические тела уснули (linear/angular velocity < 0.05 м/с), фиксация
      зачистки'
    parameters:
    - name: Порог кинетической энергии для излома опоры (Fracture Kinetic Threshold)
      value: 15.0 МДж
      tuning_note: При пороге ниже 5 МДж здания падают от легкого касания как картонные
        коробки; при пороге выше 35 МДж каскад обрывается на первом же здании, делая
        цепную реакцию невозможной.
    - name: Коэффициент передачи импульса при ударе (Impulse Transfer Restitution)
      value: 0.42 (неупругий удар с пластической деформацией)
      tuning_note: При значении >0.7 здания отскакивают как резиновые мячи; при значении
        <0.2 падающая башня мгновенно вязнет в цели и останавливает весь каскад.
    - name: Время детекции остановки симуляции (Settle Check Timeout)
      value: 6.5 с
      tuning_note: Оптимальное окно для полного завершения каскада без затягивания
        ожидания перехода к экрану победы.
    - name: Множитель очков за непрерывную цепь (Domino Chain Multiplier)
      value: 1.5x за каждое следующее здание в цепочке
      tuning_note: Мотивирует игрока строить длинные каскады 1 -> 2 -> 3 -> 4 вместо
        простых параллельных сносов.
    feedback_layers:
    - 'Визуал / VFX: Деформация мешей в точке удара, вылетающие стеклянные панели
      (до 150 частиц Three.js instanced mesh), взрывные клубы пыли и обрушение перекрытий.'
    - 'Звук (Web Audio): Низкочастотный глухой удар столкновения (55 Гц), звон бьющегося
      армированного стекла (2500–5000 Гц) и скрежет сминаемых стальных балок.'
    - 'Камера: Пропорциональный кинетический шейк экрана (сила зависит от переданной
      энергии, до 0.4 м), замедление времени (Hitstop/Slowmo 0.3x на 0.4 секунды в
      момент ключевого соударения).'
    - 'UI / Тактильность: Нарастающий счетчик комбо ''x2 CASCADE! -> x3 MEGASHOCK!''
      с золотым сиянием и сильная продолжительная вибрация на мобильных устройствах.'
    failure_mode: 'Удар пришелся по касательной верхушки: переданная энергия составила
      всего 8 МДж (ниже порога 15 МДж), цель лишь покачнулась и устояла — цепь оборвалась,
      разрушение сектора 45% (поражение).'
    mastery_curve: Новичок радуется случайному падению двух соседних башен; мастер
      рассчитывает передачу кинетического рычага так, что падающее здание переламывается
      надвое и сносит два противоположных крыла квартала.
    counterplay: Наличие на уровнях зданий с сейсмо-демпферами и широкими базами,
      гасящими до 50% кинетического импульса при прямом ударе.
    synergies:
    - Использует начальный кинетический импульс от 'Векторного Среза Опорного Пилона'.
    - Активирует критические зоны, предварительно ослабленные 'Сейсмическим Клином
      Задержки'.
    why_unique: Разрушение базируется на честной передаче массы и углового момента
      огромных жестких тел в 3D (Rapier3D), а не на заранее запеченной анимации или
      спавне мелких бессильных осколков.
    pseudocode: "function onBuildingCollision(event) {\n  const { bodyA, bodyB, contactPoint,\
      \ impulse } = event;\n  const kineticEnergy = 0.5 * bodyA.mass * Math.pow(bodyA.velocity.length(),\
      \ 2);\n  if (kineticEnergy >= 15.0e6) {\n    bodyB.fractureSupportPillars();\n\
      \    bodyB.applyImpulseAtPoint(impulse.multiplyScalar(0.42), contactPoint);\n\
      \    ComboManager.registerChainHit(bodyB.id);\n    VFX.spawnDebrisCloud(contactPoint,\
      \ kineticEnergy);\n    Audio.playMassiveImpactSound(kineticEnergy);\n    CameraRig.triggerHitstop(0.3,\
      \ 0.4);\n  } else {\n    bodyB.absorbShock(kineticEnergy);\n    Audio.playDeflectedHitSound();\n\
      \  }\n}"
  - name: Сейсмический Клин Задержки (Delayed Fracture Seeding)
    role_in_loop: Тормоз/страховка и инструмент тонкого тактического тайминга (supporting/tactical
      planning)
    player_decision: Установка вспомогательного микрозаряда на опору 3-го или 4-го
      здания с выбором задержки детонатора (от 0.5 до 3.0 с), чтобы подрубить его
      в момент подлета первой башни.
    input_mapping: 'Тач: двойной тап по колонне удаленного здания для установки заряда;
      Мышь: клик ПКМ/иконка клина на панели + выбор таймера на диске задержки.'
    states:
    - 'ARMED: микрозаряд установлен на опорной балке, таймер выставлен'
    - 'COUNTDOWN: отсчет времени запускается синхронно со спуском первичного клина'
    - 'MICRO_DETONATION: подрыв ослабляющего клина, снятие 60% прочности пилона'
    - 'COLLAPSE_ASSIST: здание мгновенно складывается даже от слабого касательного
      удара'
    parameters:
    - name: Диапазон таймера детонатора (Timer Delay Window)
      value: 1.8 с (настройка от 0.5 до 3.0 с)
      tuning_note: Если дать таймер >5.0 с, теряется синхронизация с каскадом; если
        фиксировать таймер жестко без выбора, игрок теряет контроль над планированием
        цепи.
    - name: Снижение порога разрушения опоры (Support Integrity Reduction)
      value: -60.0 % к требуемой кинетической энергии
      tuning_note: При снижении на 90% здание падает само без удара (исчезает смысл
        каскада); при снижении на 20% микрозаряд почти бесполезен.
    - name: Лимит микрозарядов на уровень (Micro-Charge Ammo)
      value: 1 заряд (на уровнях 10–30)
      tuning_note: Ограничение в 1 заряд заставляет игрока тщательно выбирать самое
        критическое 'бутылочное горлышко' в архитектурном ансамбле.
    feedback_layers:
    - 'Визуал / VFX: Желто-оранжевый голографический маячок на колонне с пульсирующим
      цифровым таймером; при детонации — локальный кумулятивный выброс пламени и появление
      трещин.'
    - 'Звук (Web Audio): Ритмичный часовой писк таймера (1000 Гц с ускорением темпа
      перед взрывом) и звонкий сухой щелчок кумулятивного микроподрыва.'
    - 'Камера: Локальный микро-зум на целевую колонну за 0.2 с до детонации (picture-in-picture
      тактическое окно в углу экрана).'
    - 'UI / Тактильность: Круговой прогресс-бар таймера над зданием и короткий двойной
      тактильный отклик (haptic double-tap) при детонации.'
    failure_mode: Таймер выставлен слишком рано (здание подрубилось до прилета каскада
      и упало не в ту сторону) или слишком поздно (первая башня уже ударилась о монолитную
      опору и разбилась впустую) — рассинхронизация цепи.
    mastery_curve: Новичок забывает про тайминг и ставит случайную задержку; мастер
      выставляет задержку с точностью до 0.1 с под расчетное время подлета обломков
      из траекторного прогноза.
    counterplay: Здания повышенной этажности создают эффект аэродинамического экрана,
      замедляя падение первой башни и требуя точной перекалибровки времени задержки.
    synergies:
    - Работает в связке с 'Траекторным Прогнозированием Центров Масс' (берет время
      расчетного подлета первой башни).
    - Обеспечивает 100% срабатывание 'Кинетического Каскадного Резонанса' на сложных
      многосекционных зданиях.
    why_unique: Позволяет игроку дирижировать многоэтапным разрушением во времени,
      превращая физическую задачу в симфонию точно рассчитанных микродетонаций.
    pseudocode: "function onTimerTick(delta, activeCharges) {\n  for (let charge of\
      \ activeCharges) {\n    if (!charge.isArmed) continue;\n    charge.remainingTime\
      \ -= delta;\n    UI.updateChargeTimerDisplay(charge.id, charge.remainingTime);\n\
      \    if (charge.remainingTime <= 0) {\n      charge.isArmed = false;\n     \
      \ PhysicsEngine.weakenPillarSupport(charge.targetPillarId, 0.60);\n      VFX.spawnMicroExplosion(charge.position);\n\
      \      Audio.playShapedChargeDetonation();\n    }\n  }\n}"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 80
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - description: Three.js Scene, Isometric Camera Controller, Post-processing (ACESFilmicToneMapping,
      Bloom), Custom Shaders for Stress Holograms.
    name: Presentation Layer
  - description: Rapier3D WASM Physics Engine, RigidBody Hierarchy, Joint Breakage
      Manager, Impulse Transfer Engine.
    name: Simulation Layer
  - description: Cutting Plane Solver, Level Contract State Machine, Domino Chain
      Detector, Score & Stars Calculator.
    name: Gameplay Logic Layer
  - description: Playgama Bridge SDK, Yandex Ads / Cloud Save / Leaderboards Adapters,
      Sound Manager (Web Audio API).
    name: Bridge & Platform Layer
  modules:
  - name: CuttingSystem
    path: src/core/cutting/CuttingSystem.ts
    responsibility: Обработка жеста drag-to-cut, расчет плоскости рассечения и передача
      импульса в физический мир.
  - name: DestructionManager
    path: src/core/physics/DestructionManager.ts
    responsibility: Управление связями жестких тел Rapier3D, деление мешей на сегменты
      при критической нагрузке.
  - name: LevelManager
    path: src/core/level/LevelManager.ts
    responsibility: Загрузка архитектурных профилей уровней, отслеживание условий
      победы и расчет процента сноса.
  - name: TrajectoryVisualizer
    path: src/core/visuals/TrajectoryVisualizer.ts
    responsibility: Отрисовка диегетической лазерной дуги предпросмотра центра масс
      и зон столкновений.
  - name: VfxPool
    path: src/core/vfx/VfxPool.ts
    responsibility: Пулинг систем частиц для пыли, искр и осколков стекла на InstancedMesh.
monetization:
  strategy_summary: 'Честная ненавязчивая гибридная модель: межстраничная реклама
    с кулдауном между уровнями, Rewarded Video за дополнительный спасительный клин
    при 85-95% сносе, продажа косметических визуальных тем (лазеры, архитектура).'
  rewarded_placements:
  - id: extra_charge_revive
    name: Дополнительный Инженерный Клин
    benefit: +1 аварийный заряд клина для завершения почти зачищенного уровня (когда
      зачищено >=85%)
    cooldown_or_limit: 1 раз за попытку уровня
    trigger_moment: Появление окна DefeatModal при нехватке нескольких процентов до
      победы
  - id: trajectory_guide_boost
    name: Супер-Предпросмотр Каскада
    benefit: Полноразмерная проекция падения всех зданий цепочки на 1 попытку
    cooldown_or_limit: Не чаще 1 раза за 3 уровня
    trigger_moment: Кнопка помощи на сложных уровнях (начиная с 10 уровня)
  interstitial_placements:
  - trigger_event: level_completed
    cooldown_seconds: 90
    conditions: Показывается только между уровнями, не чаще 1 раза в 90 секунд, пропускается
      после первых 3 уровней онбординга
  in_app_purchases:
  - sku: no_ads_pack
    name: Отключение Рекламы + Золотой Пакет
    description: Полное отключение межстраничной рекламы и эксклюзивный янтарный скин
      лазера
    price_tier: Tier 2 ($1.99 / 199 YAN)
    reward: Отключение баннеров и интерстишелов, скин 'Янтарный Плазморез'
  - sku: all_sectors_unlock
    name: Пропуск в Закрытые Сектора
    description: Мгновенный доступ ко всем 30 уровням и режиму Песочницы
    price_tier: Tier 3 ($2.99 / 299 YAN)
    reward: Разблокировка всех уровней кампании и режима Sandbox
  fairness_rules:
  - Все 30 уровней полностью проходимы на 3 звезды без единой рекламы и доната
  - Никаких пейволлов на сложность и искусственно непроходимых головоломок
  - Никакой рекламы во время процесса прицеливания и падения зданий
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - game_distribution
  - crazy_games
  - standalone_web
  initialization_flow:
  - Инициализация Playgama Bridge при старте игры
  - Проверка доступности платформенных сервисов (Storage, Ads, Leaderboards)
  - Загрузка сохраненного прогресса игрока из облака (Cloud Save)
  - Скрытие нативного сплэш-экрана платформы
  cloud_save_keys:
  - seismo_unlocked_levels
  - seismo_level_stars
  - seismo_high_scores
  - seismo_unlocked_skins
  - seismo_settings
  leaderboards:
  - global_total_stars
  - fastest_clearance_record
  - max_domino_combo
  ads_integration:
    banner_enabled: false
    interstitial_enabled: true
    preload_rewarded: true
    rewarded_enabled: true
  lifecycle_hooks:
  - 'onPause: остановка физического цикла Rapier3D и глушение Web Audio при показе
    рекламы или сворачивании вкладки'
  - 'onResume: возобновление физики и аудиопотока после закрытия рекламы'
  - 'onSaveState: автосохранение прогресса после каждого пройденного уровня'
art:
  style_name: Архитектурный нео-модерн и брутализм в лучах золотого часа (Stylized
    Architectural Demolition)
  camera_perspective: Изометрическая тактическая 3D-камера (Orthographic / Low-FOV
    Perspective)
  camera_fov: 45
  camera_pitch_angle: 45
  environment_theme: Закатный финансовый квартал мегаполиса с зеркальными высотками,
    строительными кранами на горизонте и залитыми теплым солнцем улицами
  character_proportions: Без персонажей на экране — масштаб сцены задается соотношением
    гигантских небоскребов (80–120м), ширины улиц и дорожной разметки
  lighting_setup: 'Низкое закатное солнце (DirectionalLight теплый янтарный #FFA726),
    мягкий бирюзовый рассеянный свет неба (HemisphereLight #4DD0E1 / #263238), неоновые
    акценты строительных лазеров (#00E5FF)'
  color_palette:
    dust_cloud: '#CFD8DC'
    glass_reflection: '#78909C'
    laser_cyan: '#00E5FF'
    primary_concrete: '#37474F'
    stress_danger: '#FF1744'
    sunset_amber: '#FF9100'
    ui_accent_gold: '#FFC107'
    ui_dark_plate: '#1A202C'
  vfx_list:
  - Лазерная плоскость реза с анимированным градиентом энергии
  - Разлёт сверкающих стеклянных панелей (InstancedMesh particles)
  - Клубы густой объемной бетонной пыли при падении башен
  - Искры плазменной резки и гидравлический выхлоп при активации клина
  - Голографическая сетка напряжения на колоннах, меняющая цвет от циана к красному
  ui_theme: Минималистичный высокотехнологичный инженерный HUD (Dark Sci-Fi Blueprint
