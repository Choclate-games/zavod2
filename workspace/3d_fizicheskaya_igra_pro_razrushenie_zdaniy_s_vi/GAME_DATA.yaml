roadmap:
- phase_number: 1
  title: Прототип физики и жеста среза (Core Physics Prototype)
  duration_days: 3
  tasks:
  - Интеграция Rapier3D WASM в Three.js
  - Реализация контроллера жеста drag-to-cut
  - Создание базовой процедурной башни с разрушаемыми опорами
  - Проверка передачи импульса домино
  milestone_deliverable: Рабочий прототип сноса 3 башен одним свайпом в браузере.
- phase_number: 2
  title: Геймплейные системы и контент уровней (Gameplay & Level Design)
  duration_days: 4
  tasks:
  - Архитектурный редактор уровней и сборка 25 уровней
  - Система расчета процента зачистки и начисления звезд
  - Траекторный предпросмотр центра масс
  - Механика микрозаряда задержки
  milestone_deliverable: 25 проходимых уровней кампании с полной системой прогрессии.
- phase_number: 3
  title: Арт, визуал и оптимизация (Art, VFX & Performance)
  duration_days: 3
  tasks:
  - Настройка освещения 'золотой час' и шейдеров бетона/стекла
  - Система частиц бетонной пыли и разлета стекол на InstancedMesh
  - Оптимизация фреймрейта до 60 FPS на мобильных устройствах
  - Аудио-оформление Web Audio API
  milestone_deliverable: Полностью стилизованный и оптимизированный билд с красивым
    визуалом.
- phase_number: 4
  title: Интеграция платформы и релиз (Platform & Release)
  duration_days: 2
  tasks:
  - Интеграция Playgama Bridge (Ads, Saves, Leaderboards)
  - Полировка мобильного тач-управления и Safe Area
  - QA-тестирование по чек-листу
  - Финальный деплой на Yandex Games и Web
  milestone_deliverable: Релизная сборка, готовая к публикации.
risks:
- risk: Просадки производительности на бюджетных смартфонах при одновременном разрушении
    нескольких башен
  category: technical
  severity: High
  mitigation: Ограничение количества активных динамических осколков через пулинг;
    статическое объединение упавших обломков; отключение тяжелых пост-эффектов на
    мобильных.
- risk: Непредсказуемость честной физической симуляции (физический рандом), приводящая
    к разным результатам при одинаковом срезе
  category: gameplay
  severity: Medium
  mitigation: Фиксированный шаг физического тика (Fixed Timestep 60Hz) и включение
    Continuous Collision Detection (CCD) для ключевых узлов.
- risk: Утомляемость игрока от неудачных попыток на сложных уровнях с 1 зарядом
  category: design
  severity: Low
  mitigation: Мгновенный бесшовный рестарт по клику за 0.1 секунды без экранов загрузки
    и наличие подсказки траектории за просмотр Rewarded Video.
skills:
- skill_id: rapier3d-destruction-pipeline
  name: Пайплайн Физического Разрушения в Rapier3D
  filename: skills/rapier3d_destruction.md
  purpose: Руководство по созданию многосегментных разрушаемых зданий, управлению
    соединениями и оптимизации симуляции жестких тел на WASM.
  when_to_use: При разработке физики небоскребов, расчете точек слома и обработке
    столкновений каскада.
  rules:
  - Использовать фиксированный физический шаг 1/60с
  - Ограничивать количество активных RigidBody до 60 на сцену
  - Применять CCD для высокоскоростных фрагментов шпилей
  architecture: Модульная иерархия RigidBody с отслеживанием сил реакции опор
  implementation_guidance: Прикладывать импульс среза строго в плоскости подсечки
    с учетом нормали клина
  common_mistakes:
  - Создание сотен микроколлайдеров вместо оптимизированных составных боксов
  - Забывание перевода упавших тел в спящий режим
  checklist:
  - Включен ли CCD?
  - Протестирован ли FPS на мобильном Safari?
  - Очищаются ли коллайдеры при перезапуске?
  knowledge_refs:
  - mechanics/physics_destruction.md
  - tech/threejs_optimization.md
- skill_id: drag-cut-controller
  name: Контроллер Жеста Подсечки (Drag-to-Cut Controller)
  filename: skills/drag_cut_controller.md
  purpose: Стандарт реализации интуитивного сенсорного и мышиного управления срезом
    опорных узлов.
  when_to_use: При программировании пользовательского ввода, гизмо прицеливания и
    предпросмотра траектории.
  rules:
  - Отзывчивость в первый же кадр
  - Плавное сглаживание вектора протяжки
  - Наличие тактильного виброотклика
  architecture: 'State Machine жеста: Hover -> PointerDown -> Dragging -> Release
    -> Execute'
  implementation_guidance: Проецировать экранный луч (Raycast) на плоскость опорной
    колонны для вычисления 3D-точки реза
  common_mistakes:
  - Слишком чувствительный порог срабатывания
  - Конфликт между жестом среза и вращением камеры
  checklist:
  - Работает ли жест одной рукой?
  - Есть ли deadzone 10px?
  - Отображается ли дуга падения?
  knowledge_refs:
  - ux/mobile_touch_feel.md
  - patterns/physics_arcade_loop.md
- skill_id: playgama-yandex-webgl-deploy
  name: Интеграция Playgama Bridge и Оптимизация WebGL
  filename: skills/playgama_webgl_deploy.md
  purpose: Стандарт развертывания веб-билда с поддержкой рекламы, облачных сохранений
    и стабильного фреймрейта.
  when_to_use: При интеграции SDK платформ и подготовке релизного бандла.
  rules:
  - Размер бандла до 4.5 МБ
  - Корректная пауза физики и звука при показе рекламы
  - Изолированное хранение сейвов
  architecture: Событийно-ориентированный адаптер платформы с фоллбэком на LocalStorage
  implementation_guidance: Инициализировать Playgama SDK до загрузки тяжелых 3D-ассетов
  common_mistakes:
  - Неотжатые звуки во время интерстишела
  - Блокировка UI при медленном ответе сети
  checklist:
  - Проверено ли восстановление WebGL-контекста?
  - Работают ли сохранения прогресса?
  - Соблюден ли кулдаун рекламы 90с?
  knowledge_refs:
  - tech/threejs_optimization.md
- skill_id: game_skill
  name: 'Сейсмо-Домино: Точечный Снос Domain Architecture'
  filename: GAME_SKILL.md
  purpose: 'Defines domain rules, state machine, and core gameplay loop for Сейсмо-Домино:
    Точечный Снос.'
  when_to_use: Use when writing or modifying core game state, loop coordination, and
    progression.
  rules:
  - Strict TypeScript strict mode without any 'any' types.
  - Fixed 60Hz delta accumulator with delta clamping.
  - Decoupled state management via typed EventBus.
  - Zero runtime object allocations inside the 60Hz game loop.
  architecture: 'Decoupled 3-layer architecture: Application/Platform -> Engine/Systems
    -> Rendering/UI.'
  implementation_guidance: Instantiate Game instance from main.ts, bootstrap PlaygamaService,
    and start GameLoop.
  common_mistakes:
  - Do not instantiate Three.js meshes or heavy objects inside tick loops.
  - Do not bypass the EventBus for cross-system communications.
  checklist:
  - Game initializes cleanly and loads within 3 seconds.
  - EventBus routes inputs and system events without memory leaks.
  - Audio auto-pauses and unpauses cleanly with browser focus changes.
  knowledge_refs: []
- skill_id: gameplay_skill
  name: Combat, Physics & Movement Systems
  filename: GAMEPLAY_SKILL.md
  purpose: Defines standards for physics simulation, combat mechanics, and tactile
    player feedback.
  when_to_use: Use when writing character controllers, weapon systems, collision listeners,
    and juice/VFX.
  rules:
  - Clamp delta time to maximum 100ms to prevent physics tunneling.
  - Use continuous collision detection (CCD) for fast projectiles.
  - Apply hitstop (40ms time dilation) on impactful strikes.
  - Always synchronize physics rigid body transforms to mesh representations.
  architecture: Physics engine (Rapier3D/Matter.js) stepped on fixed 60Hz timestep,
    meshes interpolated.
  implementation_guidance: Use EventBus to emit 'entity:hit', 'combat:parry', 'wave:cleared'
    events for sound and VFX triggers.
  common_mistakes:
  - Never modify transform matrices directly on physics-controlled entities.
  - Do not hardcode magic numbers for damage or velocities without centralized configuration.
  checklist:
  - Player movement is responsive with no input lag.
  - Hits produce satisfying sensory feedback (VFX spark, screen shake, audio impact).
  - Ragdoll or death animations trigger smoothly without physics jitter.
  knowledge_refs: []
- skill_id: renderer_skill
  name: THREEJS WebGL Performance Guide
  filename: RENDERER_SKILL.md
  purpose: Optimization and visual standards for THREEJS WebGL pipeline.
  when_to_use: Use when configuring scenes, cameras, lighting, materials, instanced
    meshes, and particle systems.
  rules:
  - Keep active draw calls strictly under 80.
  - Use InstancedMesh for debris, bullets, and crowd mobs.
  - Clamp pixel ratio to Math.min(window.devicePixelRatio, 1.5) on mobile.
  - Share material instances across identical geometry.
  architecture: Scene graph with pre-allocated sprite and mesh pools, dynamic shadow
    frustum optimization.
  implementation_guidance: Initialize renderer with antialias enabled on desktop,
    powerPreference 'high-performance'.
  common_mistakes:
  - Do not construct new Geometries, Textures, or Materials in the render loop.
  - Do not leave unused GPU assets without calling .dispose().
  - Do not tune quality from raw frame time — under vsync every frame reads as budget-length.
  - Do not launch in reduced quality and climb up; start optimistic and step down.
  checklist:
  - Maintains solid 60 FPS on desktop and >= 50 FPS on mobile.
  - No WebGL context loss errors on tab switches.
  - Shadow map renders crisp without artifact acne.
  - The quality auto-tuner converges and locks instead of oscillating.
  knowledge_refs:
  - threejs/performance_guide.md
