raw_prompt: 3D физическая игра про разрушение зданий с видом от третьего лица на квартал
  высотных небоскребов. Игрок прицеливается и запускает гидравлические клинья или
  таранные заряды кликом мыши или тапом по экрану, выбирая правильный угол и высоту
  подсечки опорной колонны. На экране отображаются монолитные башни с сеткой уязвимых
  узлов, траектория падения здания и физика обрушения конструкций в реальном времени.
  Цель уровня — обрушить первую башню так, чтобы она по принципу домино снесла все
  остальные высотки в секторе с минимальным количеством ударов.
title: 'Сейсмо-Домино: Точечный Снос'
slug: 3d_fizicheskaya_igra_pro_razrushenie_zdaniy_s_vi
genre: 3D Физическая Головоломка / Тактический Снос
subgenre: Каскадный Снос / Симулятор Цепных Реакций
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web)
orientation: landscape
target_audience: Игроки 12–45 лет, ценящие тактические физические головоломки, кинематографичные
  разрушения, физику цепных реакций (домино) и мгновенный медитативный вау-эффект
  без таймеров спешки.
core_loop: Осмотр квартала и выбор узла опоры -> Прицеливание среза жестом drag-to-cut
  с анализом дуги падения -> Запуск клина и активация физики Rapier3D -> Наблюдение
  каскадного обрушения домино -> 100% зачистка сектора и получение 3 звезд.
hook: Ты делаешь один точный срез у основания 60-этажной башни, она медленно кренится
  на закатном солнце, со звоном сминает соседний небоскрёб, и за 6 секунд весь финансовый
  квартал складывается в идеальный каскад обломков без единого лишнего движения.
player_fantasy: Вы — элитный инженер-подрывник высотного демонтажа будущего, способный
  взглядом рассчитать точку приложения силы и одним ювелирным срезом обрушить целый
  мегаполис строго по законам гравитации и кинетической энергии.
session_model: 'Дискретный уровень-контракт: 25–30 уровней длительностью по 15–45
  секунд каждый с лимитом в 1–2 заряда на квартал и целью 100% зачистки площади.'
unique_value_proposition: Честная физика разрушения жестких тел (Rapier3D) с расчетом
  центра масс и цепными реакциями домино, упакованная в управление одним свайпом (drag-to-cut)
  и премиальный визуальный стиль закатного брутализма.
vision: Создать эталонную браузерную 3D-головоломку о тактическом сносе, сочетающую
  интеллектуальную глубину инженерного расчета, визуальный катарсис кинематографичного
  крушения небоскребов и идеальную эргономику мобильного тач-управления.
elevator_pitch: '«Сейсмо-Домино: Точечный Снос» — это тактическая 3D физическая головоломка,
  где игрок одним точным свайпом подсекает основание гигантского небоскреба, запуская
  разрушительную цепную реакцию домино по всему финансовому кварталу.'
win_conditions: Достижение 100% (или не менее 95%) обрушения всех целевых зданий в
  секторе в пределах лимита зарядов (1–2 гидравлических клина).
lose_conditions: Исчерпание лимита зарядов (0 клиньев) при степени разрушения сектора
  менее 90% или падение обломков за пределы защитного периметра.
progression_summary: Кампания из 30 уровней в 5 уникальных архитектурных районах мегаполиса
  с ростом сложности от простых парных башен до многоуровневых ансамблей с таймерными
  микрозарядами.
difficulty_curve: 'Плавная синусоида: легкий онбординг (уровни 1–3) -> комплексные
  геометрические задачи (уровни 4–8) -> катарсис на эпическом квартале (уровень 9)
  -> ввод новых препятствий и связок.'
