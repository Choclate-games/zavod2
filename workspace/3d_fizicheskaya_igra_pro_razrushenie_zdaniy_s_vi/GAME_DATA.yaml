definition_of_done:
- Реализовано отзывчивое управление срезом опор в один жест (drag-to-cut) для мыши
  и тач-экранов.
- Интегрирована честная симуляция физики жестких тел в Rapier3D с поддержкой каскадных
  столкновений домино.
- Создана кампания из 25–30 уникальных уровней-головоломок с лимитом зарядов и 3-звездочной
  системой оценки.
- Отрисован стилизованный визуал 'золотого часа' с эффектами бетонной пыли, осколков
  стекла и лазерных направляющих.
- Обеспечен стабильный фреймрейт 60 FPS на целевых мобильных и десктопных браузерах.
- Полностью интегрирован Playgama Bridge SDK с поддержкой облачных сохранений, таблицы
  лидеров и ненавязчивой рекламы.
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Осмотр квартала и выбор узла опоры -> Прицеливание среза
  жестом drag-to-cut с анализом дуги падения -> Запуск клина и активация физики Rapier3D
  -> Наблюдение каскадного обрушения домино -> 100% зачистка сектора и получение 3
  звезд..'
- 'Реализованы механики проекта: Векторный Срез Опорного Пилона (Shear Plane Cut),
  Траекторное Прогнозирование Центров Масс (Center-of-Mass Arc Predictor), Кинетический
  Каскадный Резонанс (Kinetic Chain Domino), Сейсмический Клин Задержки (Delayed Fracture
  Seeding).'
- Условие успеха (Достижение 100% (или не менее 95%) обрушения всех целевых зданий
  в секторе в пределах лимита зарядов (1–2 гидравлических клина).) и условие проигрыша
  (Исчерпание лимита зарядов (0 клиньев) при степени разрушения сектора менее 90%
  или падение обломков за пределы защитного периметра.) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Сейсмо-Домино: Точечный Снос».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Дополнительный Инженерный Клин,
  Супер-Предпросмотр Каскада); interstitial соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
direction:
  options:
  - id: D1
    name: 'Сейсмо-Домино: Точечный Снос'
    pitch: Пространственная физическая головоломка, где игрок одним точным срезом
      опорной колонны запускает разрушительную цепную реакцию обрушения всего квартала
      высоток.
    core_verb: Подсекать
    genre_family: 3D Физическая пространственная головоломка / Тактический симулятор
      сноса
    session_shape: Дискретный уровень-контракт (20–30 уровней с лимитом в 1–2 заряда
      на квартал, цель — 100% зачистка площади с 3-звёздочной оценкой за минимальное
      число срезов)
    camera: Изометрическая тактическая 3D-камера под углом 45° с высоты птичьего полёта
      над кварталом, плавно фокусирующаяся на эпицентре удара и сопровождающая фронт
      каскадного падения башен.
    control_scheme: 'ПК: наведение курсора мыши на колонну -> зажатие ЛКМ и протяжка
      вектора среза -> отпускание ЛКМ для активации клина. ПКМ / Пробел — вращение
      камеры вокруг квартала. Мобильные: тап по уязвимому узлу -> свайп-протяжка угла
      подсечки с тактильным виброоткликом -> отрыв пальца для запуска клина. Свайп
      двумя пальцами — вращение камеры.'
    world: Индустриальный мегаполис в стиле брутализма и архитектурного нео-модерна
      на закате (золотой час). Стекло, монолитные железобетонные каркасы, неоновые
      строительные лазеры, голографическая сетка напряжения на колоннах, клубы бетонной
      пыли и осколков.
    spectacle: Огромный 80-этажный зеркальный небоскрёб кренится под углом 15 градусов
      от одного диагонального среза у основания, его шпиль с грохотом врубается в
      середину соседней башни, вызывая цепной раскол и обрушение пяти высоток по дуге.
    why_not_generic: 'Соединяет mechanics/chain_reaction.md (кинетические цепные реакции
      массы и импульса) и mechanics/physics_destruction.md (многосегментное разрушение
      жестких тел на узлах) по паттерну patterns/physics_arcade_loop.md. В отличие
      от примитивного кликера по кубикам, здесь физика жестких сочленений и распределения
      центра масс башни определяет направление падения: игрок работает как инженер-подрывник,
      управляя вектором кинетической энергии через высоту и угол подсечки.'
    biggest_risk: Баланс физической детерминированности и погрешности падения башен
      в Rapier3D, чтобы головоломка решалась закономерно и стабильно от повтора к
      повтору.
    production_cost: 'Средний: процедурная сборка модульных башен из InstancedMesh/RigidBody
      в Rapier3D и алгоритм расчёта импульса среза, без тяжелых персонажей и ИИ.'
    knowledge_hints:
    - stack/rapier3d.md
    - mechanics/physics_destruction.md
    - mechanics/chain_reaction.md
    - patterns/physics_arcade_loop.md
    - threejs/juice_and_vfx_pool.md
    - threejs/performance_guide.md
    - threejs/procedural_mesh_builder.md
    - ux/touch_controls.md
  - id: D2
    name: 'Тайм-Атака: Каскадный Демонтаж'
    pitch: Адреналиновый тайминг-экшен, где игрок отстреливает таранные заряды по
      падающим конструкциям в воздухе, удерживая непрерывный ритм комбо-разрушения
      квартала.
    core_verb: Таймить
    genre_family: 3D Физическая аркада на реакцию и тайминг / Кинетический комбо-чейзер
    session_shape: 'Спринтерский забег по районам (динамическая сессия 45–60 секунд:
      непрерывный конвейер кварталов, где нужно удерживать множитель разрушения без
      затухания цепной реакции)'
    camera: Динамическая кинематографическая камера от третьего лица с уровня улицы
      или соседней крыши, следующая на рельсах за фронтом взрывов и летящими обломками.
    control_scheme: 'ПК: перемещение курсора мыши для наведения таранной пушки ->
      клик ЛКМ в момент идеального окна тайминга (Great/Perfect) на летящих узлах.
      Колесо мыши — быстрое зумирование. Мобильные: ритмичные тапы по вспыхивающим
      резонансным узлам на падающих монолитах в такт падению; удержание пальца — усиленный
      залп.'
    world: Киберпанк-мегаполис с неоновыми билбордами и голограммами корпораций в
      дождливую полночь. Фиолетово-бирюзовая палитра, мокрый асфальт с отражениями,
      ослепительные вспышки электромагнитных импульсов и снопы электрических искр.
    spectacle: Башня падает в рапиде (slow-mo), игрок впечатывает второй таранный
      заряд точно в шпиль в момент пролёта над перекрёстком, шпиль срывается как бильярдный
      шар и сносит сразу три высотки с неоновыми вывесками.
    why_not_generic: Соединяет mechanics/chain_reaction.md (кинетические цепные реакции)
      и mechanics/rhythm_sync.md (синхронизация тайминга и резонансных импульсов)
      по паттерну patterns/score_attack_loop.md. Это не статический расчет, а реактивный
      экшен, где игрок «жонглирует» многотонными падающими блоками в воздухе, придавая
      им дополнительное ускорение повторными попаданиями в критические фазы движения.
    biggest_risk: Высокая нагрузка на производительность при одновременном расчете
      физики десятков движущихся тел на высокой скорости и риск рассинхронизации тайминга
      на слабых мобильных устройствах.
    production_cost: 'Высокий: требует сложной динамической камеры, системы замедления
      времени (slow-mo/hit-stop), комбо-системы и глубокой оптимизации физики под
      стабильные 60 FPS.'
    knowledge_hints:
    - stack/rapier3d.md
    - mechanics/chain_reaction.md
    - mechanics/rhythm_sync.md
    - patterns/score_attack_loop.md
    - threejs/juice_and_vfx_pool.md
    - threejs/adaptive_quality.md
    - stack/postprocessing.md
  - id: D3
    name: 'Городской Ликвидатор: Контракты на Снос'
    pitch: Тактический инженерный симулятор, где игрок калибрует расстановку разнотипных
      зарядов и таймеры задержки детонации для безопасного направленного сноса квартала
      с защитой исторической застройки.
    core_verb: Калибровать
    genre_family: 3D Тактический инженерный симулятор сноса / Экономическая головоломка
    session_shape: Смена инженера-подрывника (3 последовательных контракта разной
      сложности с ограниченным бюджетом оборудования и штрафами за падение обломков
      в запретные зоны)
    camera: Инженерно-орбитальный 3D-ракурс с высоты квартала с возможностью переключения
      в режим рентген-сканирования внутренних напряжений несущих опор.
    control_scheme: 'ПК: клик ЛКМ по узлу для монтажа заряда -> ползунком на панели
      настраивается угол среза и таймер задержки детонатора -> кнопка «ПУСК» активирует
      последовательность. Зажатие СКМ — панорамирование. Мобильные: тап по колонне
      открывает радиальное меню выбора типа заряда -> круговой жест настраивает угол
      подсечки -> тап по кнопке детонатора запускает снос.'
    world: Ретрофутуристический дизельпанк 1970-х годов. Бежево-оранжевая и индустриально-серая
      палитра, аналоговые стрелочные приборы, монолитные железобетонные здания советского
      модернизма, желтые ленты оцепления и меловая строительная пыль.
    spectacle: Каркас 50-этажного здания-книжки медленно ломается пополам по трём
      размеченным точкам, срезанная верхняя половина соскальзывает как по рельсам
      и с филигранной точностью срезает соседнюю башню, не задев памятник в парке
      между ними.
    why_not_generic: Соединяет mechanics/physics_destruction.md (разрушение конструкций)
      и mechanics/evidence_board.md (граф распределения структурных нагрузок и напряжений)
      по паттерну patterns/physics_arcade_loop.md. Игрок анализирует физический граф
      здания, находя критические точки опоры, при разрушении которых масса верхних
      этажей выполняет работу за заряды.
    biggest_risk: Перегруженность интерфейса и риск ухода в сухой инженерный CAD-калькулятор,
      снижающий доступность для казуальной веб-аудитории.
    production_cost: 'Средний: стандартный физический пайплайн разрушения, но с увеличенным
      объёмом работы над UI планирования, отображением зон напряжений и логикой контрактов.'
    knowledge_hints:
    - stack/rapier3d.md
    - mechanics/physics_destruction.md
    - mechanics/evidence_board.md
    - patterns/physics_arcade_loop.md
    - threejs/procedural_mesh_builder.md
    - threejs/performance_guide.md
    - ux/ui_implementation.md
  selected_id: D1
  selected_name: 'Сейсмо-Домино: Точечный Снос'
  selection_reason: 'Вариант D1 («Сейсмо-Домино: Точечный Снос») выбран как идеальное
    воплощение заказа для веб- и мобильных платформ. Он предлагает мгновенную читаемость
    с первой секунды (правило «один свайп — грандиозный каскад»), идеальное управление
    в один жест (drag-to-cut) без виртуальных кнопок и джойстиков, и максимальный
    визуальный вау-эффект от физической цепной реакции в Rapier3D. Формат компактных
    уровней-головоломок обеспечивает стабильные 60 FPS в браузере и естественные точки
    для показа рекламы между уровнями.'
  rejected_reasons:
  - 'D2 (Тайм-Атака: Каскадный Демонтаж) отвергнут, так как требует от игрока нервного
    отстрела быстро падающих обломков в реальном времени. На мобильных устройствах
    это приводит к мискликам из-за перекрытия экрана пальцами, а одновременный расчет
    высокоскоростных коллизий десятков падающих тел создает просадки FPS, разрушая
    медитативный кайф от точного инженерного сноса.'
  - 'D3 (Городской Ликвидатор: Контракты на Снос) отвергнут из-за перегруженной фазы
    планирования и высокого порога входа. Необходимость вручную выставлять таймеры
    задержки детонации для десятка зарядов и следить за запретными зонами смещает
    фокус в сухой CAD-симулятор, убивая первую осмысленную секунду игры в браузере.'
  what_it_is_not:
  - Шутер или тир от первого лица с ручным отстрелом окон и мелких элементов
  - Случайный хаотичный кликер без расчета физики центра масс и вектора падения
  - Виртуальный экранный джойстик для перемещения камеры или персонажа
  - Выбор карточек случайных апгрейдов (+10% к силе взрыва) посреди уровня
  - Серые нетекстурированные кубы и примитивные боксы без стилизованной архитектуры
    и освещения
  - Таймер обратного отсчета с мгновенным проигрышем при истечении времени в фазе
    прицеливания
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - 'Честная физика жестких тел на WASM Rapier3D: башни падают под действием гравитации,
    массы и импульса среза, а не по заранее запеченной анимации.'
  - 'Принцип домино как главное условие победы: игрок обязан обрушить весь сектор
    каскадом через падение первой башни за минимальное число зарядов (1–2 удара).'
  - 'Управление срезом в один жест: выбор точки подсечки и угла клина через протяжку
    (drag/swipe) с мгновенным отображением вектора среза и траекторного предпросмотра.'
  - 'Читаемость узлов нагрузки: монолитные башни отображают цветовую сетку критических
    точек напряжения на опорных колоннах без захламления экрана сложным интерфейсом.'
  signature_scene: 'Широкоугольный кинематографический кадр с нижней точки улицы на
    залитый закатным солнцем финансовый квартал: 80-этажный зеркальный небоскрёб из
    стекла и стали с ярко-бирюзовой голографической сеткой у основания накренился
    под углом 25 градусов после среза гидравлическим клином. Его сверкающий шпиль
    в клубах искр и бетонного дыма вонзается в середину соседней башни, вызывая раскол
    фасада и разлёт стеклянных панелей, подсвеченных оранжевыми лучами сквозь пылевую
    завесу, в то время как по третьей высотке на заднем плане уже бежит трещина от
    падающих обломков.'
  avoid_references:
  - Angry Birds (плоская 2D-баллистика по статичным блокам)
  - Teardown (микро-демонтаж от первого лица кувалдой и воксельной взрывчаткой)
  - Besiege (тяжелый конструктор осадных машин вместо прямого тактического сноса)
  - Building Destroyer / City Smash (гиперказуальный кликер без расчета центра масс
    и физики домино)
knowledge_plan:
  selections:
  - path: patterns/physics_arcade_loop.md
    role: core
    reason: Определяет структуру дискретных уровней с оценкой на 3 звезды, лимитом
      зарядов и фазами прицеливания, физического сноса и подсчета ущерба.
  - path: mechanics/chain_reaction.md
    role: core
    reason: Реализует передачу кинетического импульса и цепную реакцию обрушения соседних
      небоскребов по принципу домино.
  - path: mechanics/physics_destruction.md
    role: core
    reason: Задает правила разрушения монолитных конструкций, динамического разделения
      опорных пилонов и поведения обломков в симуляции.
  - path: threejs/physics_integration.md
    role: core
    reason: Связывает визуальные меши небоскребов с физическими твердыми телами Rapier3D
      и обеспечивает точную синхронизацию трансформаций.
  - path: stack/rapier3d.md
    role: core
    reason: Предоставляет физический движок для симуляции падения многотонных монолитов,
      расчет центров масс и контактных импульсов столкновения.
  - path: threejs/procedural_mesh_builder.md
    role: core
    reason: Генерирует процедурные стилизованные модели небоскребов, опорных пилонов
      и элементов финансового квартала без внешних 3D-ассетов.
  - path: threejs/performance_guide.md
    role: core
    reason: Предотвращает просадки FPS на мобильных устройствах при одновременном
      обрушении десятков башен и спавне обломков через InstancedMesh.
  - path: threejs/game_map_and_world_design.md
    role: supporting
    reason: Отвечает за процедурную компоновку кварталов, расстановку зданий на уровнях
      и организацию окружения вокруг зоны сноса.
  - path: threejs/adaptive_quality.md
    role: supporting
    reason: Автоматически снижает нагрузку на рендер и физику при пиковых каскадных
      разрушениях, сохраняя стабильный фреймрейт.
  - path: threejs/mobile_shaders.md
    role: supporting
    reason: Оптимизирует материалы зданий и обломков под мобильные GPU, исключая дорогостоящие
      шейдеры.
  - path: threejs/juice_and_vfx_pool.md
    role: supporting
    reason: Реализует шейк камеры при ударах, пул частиц пыли, искр и обломков с минимальным
      количеством draw calls.
  - path: stack/three_mesh_bvh.md
    role: supporting
    reason: Обеспечивает мгновенный и точный рейкастинг жеста среза drag-to-cut по
      сложной геометрии опорных колонн зданий.
  - path: stack/postprocessing.md
    role: supporting
    reason: Создает атмосферное освещение на закате, кинематографический блум и эффекты
      ударной волны при падении небоскребов.
  - path: audio/procedural_sound_synthesizer.md
    role: supporting
    reason: Синтезирует процедурные звуки скрежета металла, грохота бетона и победных
      фанфар через Web Audio API без внешних файлов.
  - path: audio/web_audio_and_muting.md
    role: supporting
    reason: Обеспечивает корректную обработку политик автовоспроизведения браузера
      и глушение звука при сворачивании вкладки.
  - path: monetization/interstitial_best_practices.md
    role: supporting
    reason: Регламентирует показ межстраничной рекламы исключительно в естественных
      паузах между завершенными уровнями сноса.
  - path: monetization/rewarded_ads_patterns.md
    role: supporting
    reason: Интегрирует просмотр рекламы за вознаграждение для получения дополнительного
      сейсмического клина или права на переигровку уровня.
  - path: threejs/procedural_character_rig.md
    role: supporting
    reason: Ось «bodies» не была закрыта выбором куратора. То, чем игрок управляет
      и во что он попадает, должно быть телом с ригом и реакцией на удар, а не кубом
      с полоской здоровья.
  rejected:
  - mechanics/ragdoll.md
  - mechanics/mining_drill.md
  - mechanics/grid_building.md
  - mechanics/upgrade_choices.md
  - stack/bitecs.md
  - threejs/orthographic_2d_and_pointer_input.md
  - patterns/score_attack_loop.md
  rejection_reason: Перечисленные документы описывают рэгдолл персонажей, бурение
    пород, строительство, случайные апгрейды, ECS и 2D-рендер, что противоречит концепту
