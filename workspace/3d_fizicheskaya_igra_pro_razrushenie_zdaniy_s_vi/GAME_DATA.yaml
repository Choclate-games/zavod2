  Camera perspective: Изометрическая тактическая 3D-камера (Orthographic / Low-FOV
  Perspective). Environment: Закатный финансовый квартал мегаполиса с зеркальными
  высотками, строительными кранами на горизонте и залитыми теплым солнцем улицами.
  Central Action: Ты делаешь один точный срез у основания 60-этажной башни, она медленно
  кренится на закатном солнце, со звоном сминает соседний небоскрёб, и за 6 секунд
  весь финансовый квартал складывается в идеальный каскад обломков без единого лишнего
  движения. — the moment is caught mid-action, with clear cause and effect readable
  in a single frame. Visible in-game HUD overlay: Индикатор оставшихся зарядов клиньев
  (иконки заряженных гидравлических поршней), Круговой прогресс-бар процента зачистки
  сектора (0% -> 100%), Диегетический вектор среза с отображением угла наклона в градусах,
  Кнопка быстрого рестарта уровня (Instant Reset); touch controls at the bottom corners.
  Lighting: Низкое закатное солнце (DirectionalLight теплый янтарный #FFA726), мягкий
  бирюзовый рассеянный свет неба (HemisphereLight #4DD0E1 / #263238), неоновые акценты
  строительных лазеров (#00E5FF). Color palette: #CFD8DC, #78909C, #00E5FF, #37474F,
  #FF1744, #FF9100, #FFC107, #1A202C. High visual clarity, readable silhouettes, immersive
  WebGL game aesthetics.'
