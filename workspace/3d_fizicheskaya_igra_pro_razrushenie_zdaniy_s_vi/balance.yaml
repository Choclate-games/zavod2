_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: 3d_fizicheskaya_igra_pro_razrushenie_zdaniy_s_vi
performance:
  target_fps: 60
  max_draw_calls: 80
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: 'Дискретный уровень-контракт: 25–30 уровней длительностью по 15–45 секунд
    каждый с лимитом в 1–2 заряда на квартал и целью 100% зачистки площади.'
  win: Достижение 100% (или не менее 95%) обрушения всех целевых зданий в секторе
    в пределах лимита зарядов (1–2 гидравлических клина).
  lose: Исчерпание лимита зарядов (0 клиньев) при степени разрушения сектора менее
    90% или падение обломков за пределы защитного периметра.
  difficulty_curve: 'Плавная синусоида: легкий онбординг (уровни 1–3) -> комплексные
    геометрические задачи (уровни 4–8) -> катарсис на эпическом квартале (уровень
    9) -> ввод новых препятствий и связок.'
mechanics:
  vektornyy_srez_opornogo_pilona_shear_plane_cut:
    name: Векторный Срез Опорного Пилона (Shear Plane Cut)
    parameters:
      ugol_naklona_ploskosti_sreza_cut_angle:
        value: 35.0 градусов
        note: При угле менее 15° блок клинит и он оседает на месте; при угле более
          60° блок соскальзывает слишком быстро без набора вращательного момента,
          падая вертикально вместо крена на соседнее здание.
      impuls_vytalkivaniya_klina_wedge_ejection_impulse:
        value: 850.0 кН
        note: Если занизить до 300 кН, массивная башня осядет обратно на фундамент;
          если завысить до 2000 кН, башня неестественно отскочит как легкая коробка,
          нарушив кинематографичность.
      vysota_tochki_sreza_ot_nulevoy_otmetki_cut_height_:
        value: 2.5 м (диапазон 0.5–15.0 м)
        note: Срез у самой земли дает максимальное плечо опрокидывания, но медленный
          старт; срез на высоте 10 м дает быстрый излом верхушки, но оставляет высокий
          стоячий пенек, мешающий каскаду.
      vremya_aktivatsii_gidravlicheskogo_lezviya_blade_c:
        value: 0.18 с
        note: Если сделать дольше 0.4 с, теряется ощущение хлесткого сокрушительного
          удара; если мгновенно (0.0 с), игрок не успевает заметить визуальный вход
          лезвия в бетон.
  traektornoe_prognozirovanie_tsentrov_mass_center_o:
    name: Траекторное Прогнозирование Центров Масс (Center-of-Mass Arc Predictor)
    parameters:
      dlina_simuliruemoy_dugi_prognoza_prediction_horizo:
        value: 2.5 с (до первого расчетного контакта)
        note: Если сделать более 4.0 с, игра раскроет всю цепочку домино заранее и
          убьет интригу наблюдения; если менее 1.0 с, игрок не поймет, долетит ли
          верхушка до соседнего здания.
      kolichestvo_diskretnyh_tochek_traektorii_arc_sampl:
        value: 32 точки
        note: 32 точки обеспечивают гладкую лазерную кривую с минимальной нагрузкой
          на CPU (менее 0.5 мс на кадр); при 8 точках дуга выглядит угловато и не
          дает точного прицеливания.
      pogreshnost_fizicheskogo_razbrosa_simulation_noise:
        value: ±5.0 % от точки падения
        note: Легкая диегетическая погрешность сохраняет азарт и живость физики; если
          прогноз 100% точен как рельсы, игра превращается в сухой чертеж.
  kineticheskiy_kaskadnyy_rezonans_kinetic_chain_dom:
    name: Кинетический Каскадный Резонанс (Kinetic Chain Domino)
    parameters:
      porog_kineticheskoy_energii_dlya_izloma_opory_frac:
        value: 15.0 МДж
        note: При пороге ниже 5 МДж здания падают от легкого касания как картонные
          коробки; при пороге выше 35 МДж каскад обрывается на первом же здании, делая
          цепную реакцию невозможной.
      koeffitsient_peredachi_impulsa_pri_udare_impulse_t:
        value: 0.42 (неупругий удар с пластической деформацией)
        note: При значении >0.7 здания отскакивают как резиновые мячи; при значении
          <0.2 падающая башня мгновенно вязнет в цели и останавливает весь каскад.
      vremya_detektsii_ostanovki_simulyatsii_settle_chec:
        value: 6.5 с
        note: Оптимальное окно для полного завершения каскада без затягивания ожидания
          перехода к экрану победы.
      mnozhitel_ochkov_za_nepreryvnuyu_tsep_domino_chain:
        value: 1.5x за каждое следующее здание в цепочке
        note: Мотивирует игрока строить длинные каскады 1 -> 2 -> 3 -> 4 вместо простых
          параллельных сносов.
  seysmicheskiy_klin_zaderzhki_delayed_fracture_seed:
    name: Сейсмический Клин Задержки (Delayed Fracture Seeding)
    parameters:
      diapazon_taymera_detonatora_timer_delay_window:
        value: 1.8 с (настройка от 0.5 до 3.0 с)
        note: Если дать таймер >5.0 с, теряется синхронизация с каскадом; если фиксировать
          таймер жестко без выбора, игрок теряет контроль над планированием цепи.
      snizhenie_poroga_razrusheniya_opory_support_integr:
        value: -60.0 % к требуемой кинетической энергии
        note: При снижении на 90% здание падает само без удара (исчезает смысл каскада);
          при снижении на 20% микрозаряд почти бесполезен.
      limit_mikrozaryadov_na_uroven_micro_charge_ammo:
        value: 1 заряд (на уровнях 10–30)
        note: Ограничение в 1 заряд заставляет игрока тщательно выбирать самое критическое
          'бутылочное горлышко' в архитектурном ансамбле.
