qa:
  functional_tests:
  - Проверка корректности передачи импульса катапульты рэгдоллу при всех углах от
    0° до 75°
  - Тестирование срабатывания Break Joint троса при пороговой скорости удара >= 15
    м/с
  - Проверка логики начисления очков за каждый разрушенный объект интерьера
  - Тестирование функции мгновенного перезапуска (сброс позиций всех RigidBody без
    утечек памяти)
  performance_benchmarks:
  - Стабильные 60 FPS на средних смартфонах (Snapdragon 680 / Helio G99) в момент
    взрыва торта и люстры
  - Потребление памяти JS Heap не более 120 МБ после 50 последовательных перезапусков
  - Количество Draw Calls в Three.js не превышает 75 в кульминационной фазе погрома
  cross_browser_matrix:
  - Google Chrome (Desktop / Android) — WebGL 2.0, Pointer Events
  - Safari (iOS 15+) — WebKit WebGL, Safe Area Insets, Touch Events
  - Yandex Browser (Desktop / Mobile) — интеграция Playgama SDK
  - Firefox / Edge (Desktop) — поддержка Wasm Rapier3D
  common_bug_checklist:
  - Застревание конечностей рэгдолла внутри мешей столов (предотвращение туннелирования
    через CCD в Rapier)
  - Бесконечный полёт каскадёра за пределы зала (добавление невидимых баунсеров и
    kill-plane)
  - Наложение звуков Slow-Mo при быстром клике рестарта
  - Просадка FPS от накопления недеактивированных физических коллайдеров стекла
