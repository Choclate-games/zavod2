- phase_number: 2
  title: Разрушаемый банкетный зал и люстры
  duration_days: 2
  tasks:
  - Моделирование интерьера, люстр на Break Joint и 5-ярусного торта
  - Инстансинг пирамид бокалов шампанского
  - Система расчёта урона и Slow-Mo камеры
  milestone_deliverable: Полноценный каскадный погром зала с разрушением люстр и торта
    в Slow-Mo.
- phase_number: 3
  title: Массовка NPC, VFX, сочность и звук
  duration_days: 2
  tasks:
  - Система паники и разбегания гостей
  - Инстанс-партиклы крема, искр и стекла
  - Интеграция звукового движка Howler.js
  - HUD и экраны результатов
  milestone_deliverable: Полная вертикальная демо-версия (Juice & Polish) с сочным
