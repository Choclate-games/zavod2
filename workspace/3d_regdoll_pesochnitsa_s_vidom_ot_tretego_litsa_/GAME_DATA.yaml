mechanics:
- name: Натяжение свадебной катапульты (Sling Tension & Launch)
  category: Двигатель баллистической фазы и первоначальный выбор угла/энергии атаки
  priority: core
  description: В отличие от статичных 2D-рогаток, натяжение учитывает 3D-вектор возвышения
    и горизонтального отклонения, передавая рэгдоллу не точку, а крутящий момент тела
    (spin torque) в зависимости от асимметрии хвата.
  player_interaction: 'Тач/Мышь: Drag назад от катапульты для натяжения ленты и регулировки
    угла (0°–75°); Release пальца/ЛКМ — выстрел каскадера; Клавиатура: Пробел (зажатие
    и отпускание) + Стрелки Вверх/Вниз для точного угла.'
  feedback: 'Визуал/VFX: Растяжение 3D-меша эластичной ленты катапульты; сноп белых
    конфетти и вспышка порохового дыма при спуске; конденсационный след за смокингом.;
    Звук (Web Audio): Нарастающий низкочастотный скрип натягиваемого троса (pitch
    shift 80->240 Гц), затем резкий хлесткий звук спуска с эхом по залу (snap + whoosh).;
    Камера: Плавное отдаление камеры назад при натяжении (FOV 60° -> 70°), затем резкий
    рывок вперед с эффектом радиального размытия (Radial Blur 0.25 с) при выстреле.;
    UI/Тактильность: Нарастающая тактильная вибрация на мобильных устройствах (Dual-pulse
    haptic); динамический секторный индикатор натяжения с градиентом от зеленого к
    ярко-красному.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Аэродинамическое пилотирование рэгдоллом (Aerodynamic Body Gliding)
  category: Инструмент микроконтроля траектории в воздухе и балансирования между скоростью
    и дальностью
  priority: secondary
  description: 'В большинстве рэгдолл-игр полет неуправляем после старта. Здесь рэгдолл
    является аэродинамической поверхностью: наклон костей меняет физические силы Lift/Drag
    в Rapier3D в реальном времени.'
  player_interaction: 'Тач/Мышь: Непрерывный Drag/Hold курсора в полете: свайп Вверх
    — подъем носа (планирование), свайп Вниз — пикирование, свайп Влево/Вправо — крен
    и горизонтальный вираж; Клавиатура: Клавиши W/S (тангаж) и A/D (крен).'
  feedback: 'Визуал/VFX: Потоки воздуха огибают смокинг каскадера (белые аэродинамические
    трейлы от кончиков пальцев и фалд фрака); трепетание ткани смокинга по физике
    ткани.; Звук (Web Audio): Динамический шум набегающего воздушного потока (White
    Noise с полосовым фильтром 400–3200 Гц), меняющий частоту в зависимости от скорости
    пикирования.; Камера: Камера плавно наклоняется в сторону крена персонажа (Roll
    Tilt +/-12°); при входе в пике камера слегка приближается к спине каскадера.;
    UI/Тактильность: Индикатор вектора атаки и высоты (авиационный авиагоризонт в
    минималистичном стиле аркады); тонкая вибрация при приближении к критическому
    углу сваливания.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Кинетический таран троса и фокус Slow-Mo (Cable Snap & Slow-Mo Focus)
  category: Кульминационный триггер успеха, сброс кинетической энергии и запуск физического
    обрушения
  priority: secondary
  description: Вместо триггерной скриптовой анимации падения, разрыв осуществляется
    через удаление физического 6-DOF джойнта в Rapier3D, обеспечивая честную динамику
    наклона и падения тяжелого твердого тела.
  player_interaction: 'Автоматический контакт тела на скорости > 15 м/с; Дополнительный
    тач/клик в окне Slow-Mo: ''Stunt Pose Adjust'' (доворот корпуса для направления
    последующего отскока тела).'
  feedback: 'Визуал/VFX: Вспышка в точке разрыва троса с разлетом 60 золотых искр
    и разрывом стальных волокон троса; эффект хроматической аберрации (Chromatic Aberration)
    на краях экрана.; Звук (Web Audio): Оглушительный металлический звон рвущегося
    троса (Heavy Cable Snap) с фильтром Low-Pass во время Slow-Mo и резким глухим
    ''SUB-BASS DROP'' (50 Гц).; Камера: Мгновенный кинематографический наезд (Dolly
    Zoom / FOV сжатие 75° -> 45°) с фокусировкой на разрывающемся узле крепления.;
    UI/Тактильность: Глубокая тяжелая вибрация (Heavy Impact Haptic 0.4 с); появление
    надписи ''CABLE DESTROYED!'' золотыми объемными буквами с бегущими очками (+$15,000).'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Каскадная цепная детонация банкета (Banquet Cascade Chain Reaction)
  category: Главный источник визуального катарсиса, очков ущерба и комбо-множителя
  priority: secondary
  description: Каждый бокал и ярус торта — не плоский спрайт, а физический rigid-body
    объект с расчетом импульса передачи, что создает уникальный физический хаос в
    каждой отдельной попытке.
  player_interaction: Пассивное физическое наблюдение; Однократный активный тач/клик
    'Stunt Kick' во время контакта каскадера со столом для придания дополнительного
    импульса опрокидывания.
  feedback: 'Визуал/VFX: Взрывное облако розового крема (300 частиц с физикой налипания
    на пол и экран); тысячи хрустальных осколков и брызг золотого шампанского; разлом
    столов на 3D-сегменты.; Звук (Web Audio): Сочный влажный ''SPLAT-BOOM'' при ударе
    в торт, затем непрерывная симфония хрустального перезвона разлетающихся сотен
    бокалов и треск ломающегося дуба.; Камера: Мощный направленный шейк (Screen Shake
    амплитудой 18 пикселей и затуханием 0.8 с); капли крема на короткое время залепляют
    объектив камеры.; UI/Тактильность: Пулеметная очередь легких виброоткликов (по
    одному на каждые 10 разбитых бокалов); взрывной счетчик долларов ($), нарастающий
    с анимацией ''кассового аппарата'' (Cha-Ching!).'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Паника банкетной массовки и цепная давка (Guest Panic Stampede & Physics Bowling)
  category: Живой динамический множитель хаоса, дополнительный источник страхового
    ущерба и комедийных гэгов
  priority: secondary
  description: 'NPC — не статичные спрайты со скриптом, а гибридные агенты: они имеют
    NavMesh для бегства, но мгновенно переключаются в полноценный физический рэгдолл
    при импульсном воздействии, создавая органичный физический боулинг.'
  player_interaction: Косвенное управление через направление ударов и разлета обломков
    мебели; Прямой контакт тела каскадера с гостями во время скольжения по полу.
  feedback: 'Визуал/VFX: Гости комично взмахивают руками, теряют парики, цилиндры
    и туфли; разлет брызг вина из их бокалов; следы крема на смокингах и платьях.;
    Звук (Web Audio): Хоровой комедийный вопль паники (''О Боже мой!'', ''Мое платье!''),
    глухие удары тел о паркет и звон падающих столовых приборов.; Камера: Динамические
    маркеры паники над головами гостей (!), при сбитии 5+ гостей одновременно — микро-пауза
    (Hitstop 0.05 с).; UI/Тактильность: Всплывающие комичные плашки статусов над сбитыми
    гостями (''RUINED ARMANI! +$8,000'', ''WEDDING RUINED! +$25,000''); частый виброотклик
    при серии сбитий.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
gameplay_systems:
- name: Система физического разрушения и обрушения конструкций (Structural Destruction
    System)
  purpose: Расчет механических напряжений в подвесах люстр, разрушение соединений
    Break Joint и передача кинетического импульса окружению.
  input: Вектор столкновения рэгдолла (скорость, масса, угол) с коллайдерами тросов
    и банкетной мебели.
  rules:
  - Если скорость удара тела каскадёра >= 15 м/с, шарнир троса рвётся мгновенно (Joint.break())
  - Падающая люстра передает импульс всем динамическим объектам в радиусе 3.5 метров
  - Объекты с малой массой (бокалы, посуда) разлетаются с дополнительным импульсом
    разброса x2
  state:
  - INTACT (целая люстра на тросе)
  - TENSION_STRESSED (натяжение при касании)
  - SNAPPED (обрыв троса)
  - COLLAPSING (свободное падение)
  - SETTLED (покой на обломках)
  interactions: Взаимодействует с SlowMoController для замедления времени и с ScoringSystem
    для начисления очков погрома.
  feedback: Сноп золотых искр, звук разрыва металла, сотрясение экрана (Screen Shake
    0.4s), инстанс-осколки хрусталя.
  edge_cases:
  - 'Касательный удар на скорости < 12 м/с: люстра раскачивается по синусоиде без
    обрыва с постепенным затуханием'
  - 'Застревание люстры на верхушке колонны: приложение компенсирующего вращающего
    момента через 1.2 секунды'
- name: Система аэродинамического рэгдолла (Ragdoll Aerodynamics System)
  purpose: Симуляция физического планирования персонажа в воздухе под действием свайпов
    игрока.
  input: Координаты свайпа/мыши (deltaX, deltaY), текущая скорость и угол тангажа/крена
    рэгдолла.
  rules:
  - Подъёмная сила прямо пропорциональна углу атаки туловища (в диапазоне от 0° до
    35°)
  - При угле атаки > 45° наступает срыв потока (stall) и переход в крутое пикирование
  - Крен корпуса влево/вправо создает поперечную силу для огибания колонн зала
  state:
  - LAUNCHED (вылет из катапульты)
  - GLIDING (управляемое планирование)
  - DIVING (пикирование с разгоном)
  - IMPACT_LOCKED (контакт с преградой)
  - REST (полная остановка на полу)
  interactions: Получает данные от InputManager, прикладывает силы в Rapier3D RigidBody,
    управляет трансформацией костей.
  feedback: Динамическая анимация позы каскадёра, вихревые трейлы за конечностями,
    модуляция высоты звука ветра.
  edge_cases:
  - 'Падение скорости ниже 4 м/с: отключение подъёмной силы и переход в неуправляемое
    падение'
  - 'Преждевременное касание пола: перевод всех суставов в пассивный режим с упругими
    отскоками'
- name: Система поведения банкетной массовки (NPC Crowd Panic System)
  purpose: 'Создание комичного живого окружения: реакция гостей на полёт каскадёра,
    падающие люстры и брызги торта.'
  input: Координаты эпицентра разрушения, вектор полёта рэгдолла, радиус опасной зоны
    (6.0 метров).
  rules:
  - При приближении каскадёра ближе 4.0 метров NPC принимают позу комичного ужаса
    (hands on head)
  - При падении люстры в радиусе 6.0 метров NPC разбегаются в противоположные стороны
    от эпицентра
  - Прямое попадание каскадёра или волны крема сбивает NPC с ног с переходом в рэгдолл-падение
  state:
  - CELEBRATING (чинное застолье)
  - ALARMED (панический испуг)
  - FLEEING (бегство к выходам)
  - KNOCKED_DOWN (сбит телом/обломками)
  - CAKE_COVERED (испачкан кремом торта)
  interactions: Увеличивает множитель комбо в ScoringSystem при панике гостей, триггерит
    крики в AudioManager.
  feedback: Анимации комичного ужаса, хоровые визги гостей ('А-а-а, мой фрак!'), брызги
    крема на одежде NPC.
  edge_cases:
  - 'Блокировка пути столом: NPC комично переваливается через стол или спотыкается
    о стул'
- name: Система подсчёта ущерба и комбо (Damage & Combo Scoring System)
  purpose: Учёт каждого разрушенного элемента банкетного зала, расчёт чека за погром
    в долларах ($) и определение звёздного рейтинга.
  input: События разрушений от DestructionManager и NPCMobManager.
  rules:
  - Каждый разбитый бокал = +$250; секция торта = +$1,000; стол = +$5,000; люстра
    = +$50,000
  - Цепная реакция (2+ разрушения за 1 секунду) активирует множитель комбо от x1.5
    до x4.0
  - 'Пороги звёзд: 1 звезда = $50,000; 2 звезды = $120,000; 3 звезды = $250,000'
  state:
  - IDLE (ожидание пуска)
  - COUNTING (активный подсчёт разрушений)
  - COMBO_ACTIVE (множитель комбо активен)
  - FINAL_EVALUATION (подведение итогов раунда)
  interactions: Обновляет счетчик HUD в реальном времени, отправляет рекорд в Playgama
    Leaderboards и сохраняет баланс.
  feedback: Всплывающие золотые цифры над объектами ($+5000), анимация одометра в
    HUD, праздничные фанфары при получении звёзд.
  edge_cases:
  - 'Ущерб превысил $500,000: выдача специального бейджа ''TOTAL WEDDING ANNIHILATION''
    с бонусом +50% к валюте'
core_design:
  signature_moment: Момент, когда каскадёр в смокинге с растопыренными руками на полной
    скорости пробивает телом стальной трос 3-тонной хрустальной люстры, время замирает
    в Slow-Mo 0.2x с веером золотых искр, трос с оглушительным лязгом рвётся, и махина
    падает прямо в верхушку пятиъярусного свадебного торта, взрывая 30-метровое облако
    розового крема и сбивая ударной волной каскад из 500 бокалов шампанского под панические
    вопли и аплодисменты разбегающихся гостей-миллиардеров.
  genre_template_rejected: Пассивный полет снаряда без руления в воздухе (шаблон классического
    Angry Birds / Crush the Castle) и статичные карточки прокачки параметров (+5%
    к силе катапульты между уровнями). В 3D рэгдолл-играх пассивный снаряд превращает
    геймплей в слепую рулетку прицеливания. Вместо этого мы даем прямое физическое
    пилотирование позой каскадера (аэродинамическое сопротивление и подъемная сила)
    в реальном времени, превращая полет в динамичный 3D-свинг через банкетный зал,
    а прогрессию строим на открытии уникальных катапульт с разной физикой отдачи и
    банкетных локаций с интерактивной архитектурой.
  what_makes_it_different: 'В отличие от FlatOut / Pain (где рэгдолл хаотично кувыркается
    после аварии) и Angry Birds (где траектория зафиксирована после пуска), здесь
    игрок — активный аэродинамический пилот собственного тела: наклон вперед переводит
    падение в скоростное пикирование для пробития тяжелых тросов, разведение рук дает
    планирование для облета колонн, а точечный удар по джойнтам люстр запускает многоуровневую
    домино-цепную реакцию с деформацией тортов, пирамид бокалов и физической паникой
    рэгдолл-гостей с динамическим подсчетом финансового ущерба в реальном времени.'
  micro_loop:
  - step: Прицеливание катапульты (Drag & Aim)
    player_action: Зажимает каскадера в ложе рогатки, оттягивает курсор назад и настраивает
      угол возвышения и вектор натяжения
    game_response: Отображает динамическую дугу траектории (первые 30% пути), натягивает
      пружины катапульты с виброоткликом и нарастающим звуком скрипа тросов
    decision: Выбрать агрессивный пологий угол для прямого тарана нижнего яруса или
      высокую дугу для пикирования на подвесы верхней люстры
    duration: 1.5–3.0 с
  - step: Выстрел и вход в баллистику (Launch)
    player_action: Отпускает палец/кнопку мыши в точке максимального натяжения
    game_response: Мгновенный импульс катапульты 32 м/с, хлопок фейерверка/пробки,
      резкий рывок камеры за персонажем (FOV 60->80)
    decision: Оценить чистоту траектории и наличие препятствий (люстры, официанты,
      гирлянды) на стартовом отрезке
    duration: 0.2–0.5 с
  - step: Аэродинамическое пилотирование телом (Air Gliding & Steer)
    player_action: Двигает курсор/палец вверх-вниз и влево-вправо, меняя угол атаки
      корпуса каскадера и растопыривание конечностей
    game_response: Физический рэгдолл генерирует подъемную силу или пикирующее ускорение;
      частицы ветра огибают смокинг, меняется свист воздуха
    decision: Нырнуть под арку для набора скорости (ударная масса) или задрать корпус
      вверх для планирования к дальнему тросу
    duration: 2.0–5.0 с
  - step: Кинетический таран троса и фокус Slow-Mo (Joint Breaker)
    player_action: Направляет корпус каскадера точно в узел крепления стального троса
      люстры на скорости > 15 м/с
    game_response: Срабатывает разрыв Joint, вспыхивает сноп золотых искр, время замедляется
      до 0.2x на 1.5 с, камера дает кинематографичный наезд на надлом троса
    decision: Скорректировать финальный наклон тела каскадера, чтобы после удара о
      трос отскочить во второй объект (пирамиду бокалов)
    duration: 1.0–1.5 с
  - step: Каскадный физический погром и комбо-цепь (Chain Collapse)
    player_action: Наблюдает за цепной реакцией и может совершить один финальный пинок
      ногами (Stunt Kick) при падении на стол
    game_response: Люстра крушит торт, взрывная волна крема разносит 500 бокалов,
      столы ломаются, гости разбегаются с рэгдолл-физикой, на экране бегут цифры ущерба
      ($)
    decision: Активировать аварийный толчок в торт для максимизации радиуса разлета
      крема или в основание стола
    duration: 4.0–8.0 с
  - step: Фиксация ущерба и расчет рейтинга (Tally & Star Rating)
    player_action: Оценивает сумму ущерба и нажимает кнопку 'Следующий зал' или 'Перезапуск
      в 1 клик'
    game_response: Калькулятор суммирует ущерб, выдает чек с печатью 'APPROVED VANDALISM',
      начисляет звезды (1-3) и банкетные доллары
    decision: Перейти на следующий уровень или мгновенно переиграть для выбивания
      3 звезд ($250,000+)
    duration: 2.0–3.0 с
  meso_loop:
  - step: Разведка банкетного зала (Hall Inspection)
    player_action: Панорамирует камеру по банкетному залу, изучая расположение 2-3
      люстр, свадебного торта, VIP-столов и траекторий движения официантов
    game_response: Интерфейс подсвечивает уязвимые узлы тросов люстр (зеленые маркеры
      стресса) и ценные разрушаемые объекты с их стоимостью
    decision: 'Определить приоритетную цель: уронить центральную люстру в торт или
      сбить боковой подвес для создания маятника-тарана'
    duration: 3.0–5.0 с
  - step: Выбор снаряжения и пусковой установки (Loadout Choice)
    player_action: Выбирает тип катапульты (Пружинная, Шампанская Пушка, Фейерверк-Лончер)
      и скин каскадера (Фрак-вингсьют, Золотой смокинг)
    game_response: 'Меняет физические характеристики пуска: стартовый импульс, аэродинамическое
      сопротивление и коэффициент отскока тела'
    decision: Взять фейерверк-пушку с высоким импульсом для дальнего троса или вингсьют
      с повышенной маневренностью
    duration: 2.0–4.0 с
  - step: Серия запусков каскадеров (Attempt Execution)
    player_action: Совершает от 1 до 3 запусков каскадера (в зависимости от условий
      зала), накапливая суммарный ущерб банкету
    game_response: 'Состояние зала сохраняет предыдущие разрушения: разбитые столы
      создают трамплины, оборванные тросы раскачивают уцелевшие сегменты'
    decision: Добить недоразрушенные структуры повторным выстрелом или направить следующий
      запуск в нетронутую банкетную зону
    duration: 15.0–30.0 с
  - step: Подведение итогов зала и награждение (Hall Clearance)
    player_action: Завершает уровень при достижении порога $50,000+, получает звезды
      и бонус за стиль (комбо-множитель)
    game_response: Финальный салют из брызг шампанского, показ лучшего момента (Instant
      Replay замедленного удара), разблокировка следующего узла карты
    decision: Забрать награду и идти дальше или потратить 20 секунд на идеальное 3-звездочное
      прохождение
    duration: 3.0–5.0 с
  macro_loop:
  - step: Продвижение по карте элитных свадеб (VIP Wedding Tour)
    player_action: 'Выбирает локацию на карте свадебных событий: от деревенского шатра
      до Королевского бального зала и Пентхауса небоскреба'
    game_response: Открывает доступ к новым уникальным архитектурным конструкциям
      (многоярусные подвесы, стеклянные купола, фонтаны шампанского)
    decision: Двигаться по основной сюжетной ветке свадеб или пройти челлендж-банкет
      с ограниченным натяжением катапульты
    duration: 10.0–20.0 с
  - step: Мастерская каскадера и инвестиции в погром (Stunt Workshop)
    player_action: Тратит заработанные страховые доллары на апгрейд катапульт (мощность
      натяжения, угол поворота) и покупку смокингов с гаджетами
    game_response: Визуально модифицирует рогатку (золотые пружины, гидравлика) и
      разблокирует пассивные физические перки (Тяжелые лакированные туфли +20% к тарану)
    decision: Инвестировать в чистую кинетическую силу пушки или в управляемость каскадера
      в воздухе
    duration: 15.0–30.0 с
  - step: Коллекционирование трофеев и вирусных моментов (Stunt Hall of Fame)
    player_action: Просматривает фотоальбом эпичных крашей, делится GIF-анимацией
      погрома торта и открывает секретные испытания
    game_response: Начисляет престижные кубки саботажника, открывает режим 'Бесконечный
      банкет' (Endless Banquet Chaos)
    decision: Попробовать побить мировой рекорд ущерба в открытом зале или завершить
      оставшиеся VIP-свадьбы
    duration: 20.0–40.0 с
  loop_diagram: "+-------------------------------------------------------------------------+\n\
    |                  БАНКЕТНЫЙ КРАШ: СВАДЕБНЫЙ САБОТАЖ                      |\n\
    +-------------------------------------------------------------------------+\n\
    \                                    |\n                                    v\n\
    \            +-----------------------------------------------+\n            |\
    \  1. ОСМОТР ЗАЛА И ПРИЦЕЛИВАНИЕ КАТАПУЛЬТЫ     |\n            |  (Оценка тросов\
    \ люстры, торта и траекторий)   |\n            +-----------------------------------------------+\n\
    \                                    |\n                         [Drag & Release:\
    \ Сила/Угол]\n                                    v\n            +-----------------------------------------------+\n\
    \            |  2. ВЫСТРЕЛ И АЭРОДИНАМИЧЕСКИЙ ПОЛЕТ          |\n            |\
    \  (Управление позой смокинга: пике / планер)  |\n            +-----------------------------------------------+\n\
    \                                    |\n                        [Удар в трос на\
    \ V > 15 м/с]\n                                    v\n            +-----------------------------------------------+\n\
    \            |  3. РАЗРЫВ ТРОСА И КИНЕМАТОГРАФИЧНЫЙ SLOW-MO  |\n            |\
    \  (Время 0.2x, сноп золотых искр, фокус камеры)|\n            +-----------------------------------------------+\n\
    \                                    |\n                        [Гравитационное\
    \ падение люстры]\n                                    v\n            +-----------------------------------------------+\n\
    \            |  4. КАСКАДНЫЙ ПОГРОМ И ЦЕПНАЯ РЕАКЦИЯ         |\n            |\
    \  (Взрыв торта, разлет 500 бокалов, паника NPC)|\n            +-----------------------------------------------+\n\
    \                                    |\n                        [Сумма ущерба\
    \ > $50k / $250k]\n                                    v\n            +-----------------------------------------------+\n\
    \            |  5. ПОДСЧЕТ УЩЕРБА, ЗВЕЗДЫ И ВЫПЛАТА ($)      |\n            |\
    \  (Чек саботажа, апгрейд катапульт и смокингов)|\n            +-----------------------------------------------+\n\
    \                                    |\n             +----------------------+-----------------------+\n\
    \             |                                              |\n      [Рестарт\
    \ в 1 клик]                            [Новый банкетный зал]\n             | \
    \                                             |\n             +--------------------->\
    \ <----------------------+"
  tension_curve: 'Кривая напряжения построена по формуле ''Задержка дыхания -> Взрывной
    катарсис -> Удовлетворительное созерцание разрушений'':

    0-3 с (Низкое/Концентрация): Игрок статично изучает геометрию зала, натягивает
    тетиву катапульты — звук нарастающего натяжения пружин создает предвкушение.

    3-6 с (Высокое/Адреналин): Полет каскадера в воздухе. Игрок судорожно подруливает
    корпусом, маневрируя между раскачивающимися люстрами и колоннами, боясь задеть
    декорации раньше времени.

    6-7.5 с (Пиковое/Эйфория): Точное попадание в стальной трос. Вспышка Slow-Mo (0.2x),
    оглушительный металлический лязг и сноп золотых искр сбрасывают напряжение в чистый
    восторг.

    7.5-14 с (Катарсис/Релаксация): Физический домино-эффект. Люстра падает в торт,
    пирамиды бокалов разлетаются с хрустальным перезвоном, гости разлетаются в стороны.
    Игрок с упоением наблюдает за взрывным ростом счетчика ущерба ($).

    14-17 с (Удовлетворение/Награда): Фиксация рекорда, штамп звездного рейтинга и
    мгновенный триггер желания повторить с еще большей разрушительностью.'
  core_formulas:
  - 'Стартовая скорость катапульты: V_launch = V_base * (PullDistance / MaxPull)^1.35
    + CatapultBonus [где V_base = 32.0 м/с, MaxPull = 2.5 м, CatapultBonus = 0..12
    м/с]'
  - 'Аэродинамическая подъемная и прижимная сила: F_lift = 0.5 * rho * V^2 * S * Cl(alpha);
    F_drag = 0.5 * rho * V^2 * S * Cd(alpha) [где rho = 1.225 кг/м^3, S = 0.85 м^2
    (площадь смокинга), alpha = угол атаки от -45° (пике) до +35° (планирование),
    Cl(alpha) = 1.2 * sin(2*alpha), Cd(alpha) = 0.3 + 0.9 * sin^2(alpha)]'
  - 'Условие разрушения троса люстры (Joint Break): BreakStress = (m_stuntman * V_impact
    * cos(theta)) / ContactArea; JointSnaps = true ЕСЛИ BreakStress >= 18000 Н (порог
    разрыва 18 кН, что достигается при V_impact >= 15.0 м/с при массе каскадера 80
    кг)'
  - 'Ударная волна взрыва торта (Cake Blast Radius & Force): R_blast = 3.5 м * (M_chandelier
    / 1000 кг)^0.4; F_blast = (E_impact * 0.65) / (Distance + 0.5)^2 [где E_impact
    = 0.5 * M_chandelier * V_fall^2, крем разлетается на 12-18 м, сбивая с ног всех
    NPC в радиусе R_blast]'
  - 'Итоговый финансовый ущерб ($) и комбо-множитель: TotalDamage = (Sum(ItemBaseCost_i
    * SpeedMultiplier_i) + CrowdPanicBonus) * ComboMultiplier; ComboMultiplier = 1.0
    + 0.15 * Min(ConsecutiveCollisions, 15) [где Бокал = $120, Свадебный торт = $15,000,
    Хрустальная люстра = $45,000, VIP-стол = $8,500, Смокинг жениха = $12,000]'
  - 'Порог звездного рейтинга: Stars = 3 при TotalDamage >= $250,000; Stars = 2 при
    TotalDamage >= $120,000; Stars = 1 при TotalDamage >= $50,000; Stars = 0 (Поражение)
    при TotalDamage < $20,000'
  run_progression:
  - 'Динамический комбо-множитель скорости (Kinetic Momentum Build): каждое последовательное
    разрушение объекта без остановки рэгдолла увеличивает скорость скольжения каскадера
    на +8% (до капа +60%), превращая его во вторичный катящийся снаряд.'
  - 'Каскадный резонанс разрушений (Chain Stress Weakening): падение первой люстры
    передает вибрацию через потолочные балки, снижая порог прочности соседних тросов
    на 35% для последующих рикошетов.'
  - 'Волна паники гостей (Stampede Escalation): с каждым разрушенным столом радиус
    паники гостей увеличивается на +1.5 м, провоцируя цепные падения NPC друг на друга
    и увеличивая бонус хаоса ($200 за каждое столкновение гостей).'
  - 'Аварийный толчок каскадера (Adrenaline Stunt Kick): при первом касании банкетного
    стола на скорости ниже 6 м/с игроку дается 0.4 с на один ''Каскадерский пинок'',
    придающий импульс 450 Н в выбранном направлении для финального опрокидывания торта.'
  meta_progression:
  - 'Арсенал катапультных установок (8 типов): разблокировка рогаток с уникальной
    физикой — от базовой ''Свадебной Резинки'' до ''Гидравлической Шампань-Пушки''
    (импульс +40%, угол до 85°) и ''Фейерверк-Лончера'' (дополнительный реактивный
    импульс в полете).'
  - 'Гардероб экстремального смокинга (12 костюмов): открытие смокингов с аэродинамическими
    характеристиками — ''Фрак-Вингсьют'' (+50% планирование), ''Тяжелый Бархатный
    Смокинг'' (+40% кинетическая масса пробития), ''Смокинг с блестками'' (+100% искр
    и +25% к очкам стиля).'
  - 'Карта банкетных залов (5 элитных локаций): прохождение линейно-узловой кампании
    (''Свадебный Шатер'' -> ''Королевский Бальный Зал'' -> ''Пентхаус Небоскреба''
    -> ''Президентский Прием'' -> ''Новогодний Корпоратив Олигархов'') с новыми разрушаемыми
    элементами (фонтаны шоколада, ледяные скульптуры, стеклянные мосты).'
  - 'Каскадерские лицензии и контракты (Stunt Mastery Perks): постоянные пассивные
    перки за звезды — ''Усиленный Slow-Mo'' (время замедления увеличивается с 1.5
    с до 2.5 с), ''Магнитный бокал'' (увеличение радиуса захвата очков от брызг шампанского
    на +30%).'
  mechanics:
  - name: Натяжение свадебной катапульты (Sling Tension & Launch)
    role_in_loop: Двигатель баллистической фазы и первоначальный выбор угла/энергии
      атаки
    player_decision: 'Выбрать силу натяжения (скорость vs точность) и стартовый угол
      возвышения: крутая дуга для атаки верхних подвесов люстр или настильная траектория
      для сбития нижних декораций и пролета под арками.'
    input_mapping: 'Тач/Мышь: Drag назад от катапульты для натяжения ленты и регулировки
      угла (0°–75°); Release пальца/ЛКМ — выстрел каскадера; Клавиатура: Пробел (зажатие
      и отпускание) + Стрелки Вверх/Вниз для точного угла.'
    states:
    - 'IDLE: Каскадер сидит в ложе катапульты, анимация покачивания смокинга'
    - 'TENSION_AIM: Игрок оттягивает резинку, отрисовывается траекторный луч, катапульта
      скрипит'
    - 'MAX_STRETCH: Достигнуто предельное натяжение 2.5 м, максимальная вибрация и
      натяг ленты'
    - 'RELEASE_FIRE: Мгновенное высвобождение энергии пружин, импульс 32 м/с передается
      рэгдоллу'
    - 'COOLDOWN: Сброс катапульты в исходное положение за 0.8 с'
    parameters:
    - name: MaxPullDistance
      value: 2.5 м
      tuning_note: Если увеличить до 4.0 м — катапульта перетягивает экран, игрок
        теряет обзор зала; если уменьшить до 1.2 м — пропадает ощущение упругого сопротивления
        и мощи броска.
    - name: BaseLaunchVelocity
      value: 32.0 м/с
      tuning_note: Если увеличить выше 45.0 м/с — каскадер пролетает зал за 0.3 с
        без возможности подруливания; если снизить ниже 20.0 м/с — телу не хватает
        кинетической энергии пробить трос люстры (порог 15 м/с).
    - name: AimTrajectoryLength
      value: 30.0 % пути
      tuning_note: Если дать 100% дуги — исчезает челлендж прицеливания и пространственное
        чутье; если убрать дугу (<10%) — игрок стреляет вслепую и раздражается частыми
        промахами.
    - name: MaxElevationAngle
      value: 75.0 градусов
      tuning_note: Если разрешить 90° — каскадер врезается в потолок прямо над катапультой;
        если ограничить 45° — невозможно достать люстры верхнего яруса.
    - name: TensionResistanceCurve
      value: Экспонента 1.35
      tuning_note: Если сделать линейной (1.0) — нет ощущения нарастающей упругости
        жгута; если выше 2.0 — последние 20% натяжения требуют слишком резкого движения
        мыши.
    feedback_layers:
    - 'Визуал/VFX: Растяжение 3D-меша эластичной ленты катапульты; сноп белых конфетти
      и вспышка порохового дыма при спуске; конденсационный след за смокингом.'
    - 'Звук (Web Audio): Нарастающий низкочастотный скрип натягиваемого троса (pitch
      shift 80->240 Гц), затем резкий хлесткий звук спуска с эхом по залу (snap +
      whoosh).'
    - 'Камера: Плавное отдаление камеры назад при натяжении (FOV 60° -> 70°), затем
      резкий рывок вперед с эффектом радиального размытия (Radial Blur 0.25 с) при
      выстреле.'
    - 'UI/Тактильность: Нарастающая тактильная вибрация на мобильных устройствах (Dual-pulse
      haptic); динамический секторный индикатор натяжения с градиентом от зеленого
      к ярко-красному.'
    failure_mode: Недостаточное натяжение жгута (<40%) приводит к тому, что каскадер
      не долетает до тросов и плюхается на пустой паркет; игрок видит вялую траекторию
      и красный индикатор 'LOW VELOCITY'.
    mastery_curve: Новичок на 30-й секунде целится наугад по центру и стреляет на
      100% силы, часто врезаясь в верхние карнизы; мастер на 10-м забеге использует
      выверенное 65% натяжение под углом 38.5° для пролета в узкую арку между колоннами
      прямо к главному узлу крепления.
    counterplay: Качающиеся банкетные люстры-маятники, пролетающие праздничные дроны-фотографы
      и выдвигающиеся декоративные арки блокируют прямые траектории выстрела.
    synergies:
    - Задает стартовый кинетический импульс для механики Аэродинамического пилотирования
      рэгдоллом.
    - Определяет точку входа в зал для инициации Каскадной цепной детонации банкета.
    why_unique: В отличие от статичных 2D-рогаток, натяжение учитывает 3D-вектор возвышения
      и горизонтального отклонения, передавая рэгдоллу не точку, а крутящий момент
      тела (spin torque) в зависимости от асимметрии хвата.
    pseudocode: "function tickSlingLaunch(input: DragInput, dt: number): void {\n\
      \  if (state === SlingState.AIMING) {\n    pullDist = clamp(input.dragVector.length(),\
      \ 0.0, MAX_PULL_DISTANCE);\n    launchAngle = calculateAngle(input.dragVector);\n\
      \    trajectoryPreview.update(launchAngle, pullDist * PULL_FORCE_COEFF, 0.3);\n\
      \    audioEngine.setTensionPitch(lerp(80, 240, pullDist / MAX_PULL_DISTANCE));\n\
      \  } else if (state === SlingState.FIRING) {\n    const launchVel = (pullDist\
      \ / MAX_PULL_DISTANCE) ** 1.35 * BASE_LAUNCH_VEL;\n    ragdoll.applyImpulseToHips(input.aimDirection.multiplyScalar(launchVel\
      \ * ragdoll.mass));\n    ragdoll.applyTorque(Vector3.random().multiplyScalar(PULL_SPIN_TORQUE));\n\
      \    cameraEffects.triggerRadialBlur(0.25);\n    state = SlingState.IN_FLIGHT;\n\
      \  }\n}"
  - name: Аэродинамическое пилотирование рэгдоллом (Aerodynamic Body Gliding)
    role_in_loop: Инструмент микроконтроля траектории в воздухе и балансирования между
      скоростью и дальностью
    player_decision: Наклонить корпус вниз для разгона в пике (жертвуя высотой ради
      пробивной массы) или задрать корпус вверх и расставить руки для планирования
      (жертвуя скоростью ради облета колонн и дальности).
    input_mapping: 'Тач/Мышь: Непрерывный Drag/Hold курсора в полете: свайп Вверх
      — подъем носа (планирование), свайп Вниз — пикирование, свайп Влево/Вправо —
      крен и горизонтальный вираж; Клавиатура: Клавиши W/S (тангаж) и A/D (крен).'
    states:
    - 'BALLISTIC_FREEFALL: Свободный полет каскадера без вмешательства игрока (нейтральное
      сопротивление Cd=0.5)'
    - 'NOSE_DIVE_ACCEL: Каскадер вытягивается ''стрелой'' вниз (Cd=0.2, разгон до
      42 м/с, рост пробивной массы)'
    - 'WINGSUIT_GLIDE: Каскадер растопыривает руки и полы смокинга (Cl=1.2, подъемная
      сила, планирование)'
    - 'BANKED_TURN: Каскадер наклоняет корпус вбок для огибания колонны (боковая сила
      14 м/с^2)'
    - 'TUMBLING_STALL: Сваливание при критическом угле атаки (>45°), потеря управляемости
      на 0.6 с'
    parameters:
    - name: MaxGlideLiftCoeff
      value: 1.2 ед
      tuning_note: Если завысить (>2.0) — каскадер превращается в самолет и бесконечно
        парит под потолком; если занизить (<0.5) — планирование неощутимо, игрок падает
        камнем.
    - name: DiveMaxSpeed
      value: 42.0 м/с
      tuning_note: Если увеличить (>55 м/с) — физика Rapier3D может туннелировать
        сквозь тонкие тросы; если снизить (<30 м/с) — пикирование не дает преимущества
        в пробитии.
    - name: SteerResponsiveness
      value: 0.12 с
      tuning_note: Если сделать мгновенной (0.0 с) — рэгдолл дергается неестественно
        и теряет вес; если сделать медленной (>0.35 с) — игрок не успевает облетать
        внезапно возникшие колонны.
    - name: CriticalStallAngle
      value: 45.0 градусов
      tuning_note: Если угол сваливания слишком мал (25°) — игрок постоянно входит
        в штопор при попытке подняться; если сваливание отключить — нет наказания
        за чрезмерный задир носа.
    - name: AirResistanceSmoothing
      value: 0.85 ед/с
      tuning_note: Если коэффициент сглаживания мал (<0.4) — порывы ветра вызывают
        визуальный джиттер конечностей рэгдолла; если велик (>0.95) — реакция на ввод
        становится ватной.
    feedback_layers:
    - 'Визуал/VFX: Потоки воздуха огибают смокинг каскадера (белые аэродинамические
      трейлы от кончиков пальцев и фалд фрака); трепетание ткани смокинга по физике
      ткани.'
    - 'Звук (Web Audio): Динамический шум набегающего воздушного потока (White Noise
      с полосовым фильтром 400–3200 Гц), меняющий частоту в зависимости от скорости
      пикирования.'
    - 'Камера: Камера плавно наклоняется в сторону крена персонажа (Roll Tilt +/-12°);
      при входе в пике камера слегка приближается к спине каскадера.'
    - 'UI/Тактильность: Индикатор вектора атаки и высоты (авиационный авиагоризонт
      в минималистичном стиле аркады); тонкая вибрация при приближении к критическому
      углу сваливания.'
    failure_mode: Задир носа выше 45° приводит к сваливанию (Stall) — каскадер теряет
      горизонтальную скорость, начинает беспомощно кувыркаться и падает мимо люстры
      прямо на пустые стулья.
    mastery_curve: 'Новичок хаотично водит мышью из стороны в сторону, теряя скорость
      и падая на полпути; мастер применяет технику ''S-нырка'': ныряет вниз для набора
      40 м/с, затем резко планирует вверх, пробивая дальний трос снизу вверх.'
    counterplay: Конвекционные потоки горячего воздуха над свечами банкетных столов
      подбрасывают каскадера вверх, а кондиционеры банкетного зала сдувают его в сторону.
    synergies:
    - Позволяет точно скорректировать точку контакта для Кинетического тарана троса.
    - Дает возможность выбрать оптимальную траекторию входа в торт для максимизации
      Каскадной цепной детонации.
    why_unique: 'В большинстве рэгдолл-игр полет неуправляем после старта. Здесь рэгдолл
      является аэродинамической поверхностью: наклон костей меняет физические силы
      Lift/Drag в Rapier3D в реальном времени.'
    pseudocode: "function tickBodyGliding(steerInput: Vector2, ragdoll: PhysicsRagdoll,\
      \ dt: number): void {\n  const currentVel = ragdoll.getLinearVelocity();\n \
      \ const speed = currentVel.length();\n  const pitchAngle = clamp(steerInput.y\
      \ * MAX_PITCH_DEG, -45, 45);\n  const rollAngle = steerInput.x * MAX_ROLL_DEG;\n\
      \  if (Math.abs(pitchAngle) >= STALL_ANGLE_DEG && currentVel.y > 0) {\n    ragdoll.applyAngularImpulse(Vector3.random().multiplyScalar(STALL_TORQUE));\n\
      \    return;\n  }\n  const liftForce = 0.5 * AIR_DENSITY * (speed ** 2) * WING_AREA\
      \ * Math.sin(pitchAngle * DEG2RAD);\n  const dragForce = 0.5 * AIR_DENSITY *\
      \ (speed ** 2) * WING_AREA * (0.3 + 0.9 * Math.sin(pitchAngle * DEG2RAD) **\
      \ 2);\n  const steerSideForce = new Vector3(rollAngle * STEER_SIDE_COEFF, 0,\
      \ 0);\n  ragdoll.applyForceToAllBodies(new Vector3(0, liftForce - dragForce,\
      \ 0).add(steerSideForce));\n  audioEngine.updateWindPitch(speed / DIVE_MAX_SPEED);\n\
      }"
  - name: Кинетический таран троса и фокус Slow-Mo (Cable Snap & Slow-Mo Focus)
    role_in_loop: Кульминационный триггер успеха, сброс кинетической энергии и запуск
      физического обрушения
    player_decision: 'Выбрать какой именно трос многоточечного подвеса перебить: центральный
      (мгновенный обрыв вниз) или крайний (создание раскачивающегося маятника-тарана,
      сносящего стены и декорации).'
    input_mapping: 'Автоматический контакт тела на скорости > 15 м/с; Дополнительный
      тач/клик в окне Slow-Mo: ''Stunt Pose Adjust'' (доворот корпуса для направления
      последующего отскока тела).'
    states:
    - 'TARGET_APPROACH: Сближение с тросом на дистанцию < 2.0 м, предварительный расчет
      точки удара'
    - 'IMPACT_SNAP: Контакт тела с физическим джойнтом троса, проверка порога разрушения
      (>=18 кН)'
    - 'SLOW_MO_HERO: Замедление времени до 0.2x на 1.5 с, сноп золотых искр, фокусная
      камера'
    - 'CABLE_WHIP: Разрыв джойнта, стальной трос сворачивается пружиной, люстра кренится
      и падает'
    - 'REBOUND_RAGDOLL: Отскок каскадера от точки удара с сохранением 40% импульса
      для продолжения погрома'
    parameters:
    - name: SnapVelocityThreshold
      value: 15.0 м/с
      tuning_note: Если снизить (<8 м/с) — трос рвется от любого легкого касания,
        теряется ощущение прочности стальных креплений; если поднять (>25 м/с) — 80%
        попыток заканчиваются глухим ударом без обрыва.
    - name: SlowMoTimeScale
      value: 0.20 ед
      tuning_note: Если замедлить еще сильнее (<0.05x) — геймплей зависает и сбивается
        темп аркады; если сделать 0.5x — игрок не успевает рассмотреть детали взрыва
        троса и смаковать момент.
    - name: SlowMoDurationReal
      value: 1.50 с
      tuning_note: Если длительность больше 3.0 с — затягивает сессию и утомляет при
        частых рестартах; если меньше 0.6 с — мозг не успевает переключить внимание
        на кинематографичность.
    - name: JointBreakForce
      value: 18000.0 Н
      tuning_note: Если увеличить до 35 кН — потребуются идеальные вертикальные пике;
        если уменьшить до 5 кН — люстры падают сами от сквозняка.
    - name: ReboundMomentumRetain
      value: 0.40 ед
      tuning_note: Если каскадер теряет весь импульс (0.0) — он падает мешком вертикально
        вниз; если сохраняет 0.8 — нереалистично отскакивает как резиновый мяч.
    feedback_layers:
    - 'Визуал/VFX: Вспышка в точке разрыва троса с разлетом 60 золотых искр и разрывом
      стальных волокон троса; эффект хроматической аберрации (Chromatic Aberration)
      на краях экрана.'
    - 'Звук (Web Audio): Оглушительный металлический звон рвущегося троса (Heavy Cable
      Snap) с фильтром Low-Pass во время Slow-Mo и резким глухим ''SUB-BASS DROP''
      (50 Гц).'
    - 'Камера: Мгновенный кинематографический наезд (Dolly Zoom / FOV сжатие 75° ->
      45°) с фокусировкой на разрывающемся узле крепления.'
    - 'UI/Тактильность: Глубокая тяжелая вибрация (Heavy Impact Haptic 0.4 с); появление
      надписи ''CABLE DESTROYED!'' золотыми объемными буквами с бегущими очками (+$15,000).'
    failure_mode: Касание троса на недостаточной скорости (<15 м/с) приводит к тому,
      что трос не рвется, каскадер комично ударяется лицом о металл и сползает вниз,
      получая надпись 'TOO SLOW!'.
    mastery_curve: Новичок перебивает первый попавшийся трос и люстра падает на пустой
      пол; мастер наносит удар по касательной в крайний шарнир, закручивая 3-тонную
      люстру в гигантский маятник, сносящий балкон с оркестром.
    counterplay: Тросы некоторых люстр укреплены титановыми муфтами (требуют скорости
      > 28 м/с) или окружены раскачивающимися гирляндами, гасящими скорость каскадера.
    synergies:
    - Активируется точностью Аэродинамического пилотирования.
    - Запускает лавину гравитационного обрушения в механике Каскадной детонации банкета.
    why_unique: Вместо триггерной скриптовой анимации падения, разрыв осуществляется
      через удаление физического 6-DOF джойнта в Rapier3D, обеспечивая честную динамику
      наклона и падения тяжелого твердого тела.
    pseudocode: "function tickCableSnap(contact: PhysicsContact, timeManager: TimeScaleManager):\
      \ void {\n  if (contact.isCableJoint && contact.relativeVelocity >= SNAP_VELOCITY_THRESHOLD)\
      \ {\n    const impactForce = contact.calculateImpulse() / contact.dt;\n    if\
      \ (impactForce >= JOINT_BREAK_FORCE_N) {\n      physicsWorld.removeJoint(contact.jointId);\n\
      \      vfxSystem.spawnSparkBurst(contact.point, 60, Palette.GOLDEN_SPARKS);\n\
      \      timeManager.triggerSlowMo(0.2, 1.5);\n      cameraSystem.triggerDollyZoom(contact.point,\
      \ 1.5);\n      audioEngine.playSubBassDrop();\n      scoreSystem.addScore(15000,\
      \ \"CABLE_DESTROYED\");\n      ragdoll.applyImpulse(contact.normal.multiplyScalar(contact.relativeVelocity\
      \ * 0.4 * ragdoll.mass));\n    }\n  }\n}"
  - name: Каскадная цепная детонация банкета (Banquet Cascade Chain Reaction)
    role_in_loop: Главный источник визуального катарсиса, очков ущерба и комбо-множителя
    player_decision: Спровоцировать попадание падающей люстры точно в многоярусный
      торт (для круговой ударной волны крема) или в край банкетного стола (для запуска
      эффекта 'домино' по пирамидам бокалов).
    input_mapping: Пассивное физическое наблюдение; Однократный активный тач/клик
      'Stunt Kick' во время контакта каскадера со столом для придания дополнительного
      импульса опрокидывания.
    states:
    - 'COLLAPSE_INIT: Люстра теряет опору и ускоряется под действием гравитации (g
      = 9.81 м/с^2)'
    - 'CAKE_IMPACT_CRUSH: Люстра сминает свадебный торт, генерируя радиальную ударную
      волну крема'
    - 'GLASS_PYRAMID_DOMINO: Волна обломков опрокидывает пирамиды из 500 бокалов с
      цепным разлетом'
    - 'TABLE_SPLIT: Столы ломаются пополам под весом люстры, подбрасывая посуду и
      блюда'
    - 'DAMAGE_COMBO_TALLY: Фиксация цепных разрушений, рост комбо-множителя от x1.0
      до x3.5'
    parameters:
    - name: CakeBlastRadius
      value: 3.5 м
      tuning_note: Если увеличить (>6.0 м) — крем сбивает вообще всё на уровне за
        один клик, пропадает ценность точного попадания; если уменьшить (<1.8 м) —
        взрыв торта выглядит неубедительно и не достает до столов.
    - name: GlassShatterCount
      value: 500 шт
      tuning_note: Если заспавнить 2000 частиц — проседает FPS на мобильных браузерах
        ниже 30; если сделать 50 шт — теряется ощущение роскошной грандиозной пирамиды.
    - name: ChainReactionWindow
      value: 0.45 с
      tuning_note: Если тайм-аут комбо слишком мал (<0.2 с) — серия прерывается между
        падением бокалов и столов; если больше 1.5 с — комбо превращается в автоматическое
        без чувства динамики.
    - name: TableFractureForce
      value: 4500.0 Н
      tuning_note: Если столы слишком прочные (15 кН) — люстра просто лежит на них
        как на полке; если слишком мягкие (500 Н) — они исчезают от легкого толчка
        каскадера.
    - name: MaxComboMultiplier
      value: 3.5 x
      tuning_note: Если поднять до 10x — баланс очков ломается и перекрывает любые
        другие действия; если ограничить 1.5x — игрок не мотивирован строить сложные
        цепочки.
    feedback_layers:
    - 'Визуал/VFX: Взрывное облако розового крема (300 частиц с физикой налипания
      на пол и экран); тысячи хрустальных осколков и брызг золотого шампанского; разлом
      столов на 3D-сегменты.'
    - 'Звук (Web Audio): Сочный влажный ''SPLAT-BOOM'' при ударе в торт, затем непрерывная
      симфония хрустального перезвона разлетающихся сотен бокалов и треск ломающегося
      дуба.'
    - 'Камера: Мощный направленный шейк (Screen Shake амплитудой 18 пикселей и затуханием
      0.8 с); капли крема на короткое время залепляют объектив камеры.'
    - 'UI/Тактильность: Пулеметная очередь легких виброоткликов (по одному на каждые
      10 разбитых бокалов); взрывной счетчик долларов ($), нарастающий с анимацией
      ''кассового аппарата'' (Cha-Ching!).'
    failure_mode: Люстра падает на пустой проход между столами, не задевая торт и
      пирамиды бокалов — игрок видит глухой удар о ковер и минимальный чек ущерба
      (<$15,000).
    mastery_curve: Новичок роняет люстру прямо вниз, задевая один стол; мастер направляет
      люстру так, чтобы она срезала торт, отрикошетила в центральную пирамиду бокалов
      и столкнула второй подвес соседней люстры.
    counterplay: Бронированные VIP-буфеты и массивные мраморные колонны поглощают
      кинетическую энергию обломков и останавливают цепную реакцию.
    synergies:
    - Принимает импульс от Кинетического тарана троса.
    - Инициирует панику и разлет гостей в механике Паники банкетной массовки.
    why_unique: Каждый бокал и ярус торта — не плоский спрайт, а физический rigid-body
      объект с расчетом импульса передачи, что создает уникальный физический хаос
      в каждой отдельной попытке.
    pseudocode: "function tickBanquetCascade(collision: CollisionEvent, comboTracker:\
      \ ComboTracker): void {\n  if (collision.target.type === TargetType.WEDDING_CAKE\
      \ && collision.impactEnergy > MIN_CAKE_ENERGY) {\n    vfxSystem.spawnCreamExplosion(collision.point,\
      \ CAKE_BLAST_RADIUS);\n    cameraEffects.triggerScreenShake(18.0, 0.8);\n  \
      \  cameraEffects.addScreenSplatterTexture(\"cream_splat.png\", 2.0);\n    audioEngine.playCreamSplatBoom();\n\
      \    const nearbyObjects = physicsWorld.queryRadius(collision.point, CAKE_BLAST_RADIUS);\n\
      \    nearbyObjects.forEach(obj => {\n      const dist = obj.position.distanceTo(collision.point);\n\
      \      const blastDir = obj.position.clone().sub(collision.point).normalize();\n\
      \      obj.applyImpulse(blastDir.multiplyScalar((CAKE_BLAST_RADIUS - dist) *\
      \ BLAST_POWER));\n      comboTracker.registerDestruction(obj.costValue);\n \
      \   });\n  }\n}"
  - name: Паника банкетной массовки и цепная давка (Guest Panic Stampede & Physics
      Bowling)
    role_in_loop: Живой динамический множитель хаоса, дополнительный источник страхового
      ущерба и комедийных гэгов
    player_decision: Направить разлет обломков люстры и торта в самое густое скопление
      гостей (VIP-зона жениха и невесты) для запуска массовой давки или загнать гостей
      под падающую вторую люстру.
    input_mapping: Косвенное управление через направление ударов и разлета обломков
      мебели; Прямой контакт тела каскадера с гостями во время скольжения по полу.
    states:
    - 'SIPPING_CHAMPAGNE: Гости чинно стоят с бокалами, анимируют светские беседы'
    - 'TERROR_ALERT: Взрыв торта/обрыв люстры в радиусе 8 м, гости бросают бокалы
      и кричат'
    - 'RAGDOLL_BOWLING: Прямой контакт с обломком или каскадером переводит NPC в рэгдолл-режим'
    - 'STAMPEDE_CHAIN: Падающие рэгдолл-гости сбивают с ног стоящих соседей по принципу
      кегельбана'
    - 'FLEEING_EXIT: Уцелевшие гости в панике бегут к выходам, опрокидывая стулья
      и канделябры'
    parameters:
    - name: PanicTriggerRadius
      value: 8.0 м
      tuning_note: Если сделать слишком большим (>15 м) — все гости на карте разбегаются
        мгновенно до падения обломков; если меньше 4 м — гости стоят как истуканы
        рядом с рушащейся люстрой.
    - name: NPCRagdollThresholdImpulse
      value: 250.0 Н*с
      tuning_note: Если порог мал (50 Н*с) — гости падают от летящей крошки торта;
        если завысить (1000 Н*с) — гости стоят неподвижно, когда в них врезается стол.
    - name: GuestChainPushForce
      value: 180.0 Н
      tuning_note: Если сила толчка велика (>400 Н) — один падающий гость сбивает
        весь зал как кегли; если мала (<50 Н) — цепной эффект боулинга не возникает.
    - name: GuestDamageValue
      value: $5000.0 за VIP-наряд
      tuning_note: Если завысить — погром мебели станет невыгоден по сравнению со
        сбиванием людей; если занизить — сбивание гостей не ощущается ценным.
    - name: MaxPanicNPCsPerLevel
      value: 40 чел
      tuning_note: Если заспавнить 150 NPC — физические рэгдоллы перегрузят CPU браузера;
        если меньше 15 — зал выглядит пустым и безжизненным.
    feedback_layers:
    - 'Визуал/VFX: Гости комично взмахивают руками, теряют парики, цилиндры и туфли;
      разлет брызг вина из их бокалов; следы крема на смокингах и платьях.'
    - 'Звук (Web Audio): Хоровой комедийный вопль паники (''О Боже мой!'', ''Мое платье!''),
      глухие удары тел о паркет и звон падающих столовых приборов.'
    - 'Камера: Динамические маркеры паники над головами гостей (!), при сбитии 5+
      гостей одновременно — микро-пауза (Hitstop 0.05 с).'
    - 'UI/Тактильность: Всплывающие комичные плашки статусов над сбитыми гостями (''RUINED
      ARMANI! +$8,000'', ''WEDDING RUINED! +$25,000''); частый виброотклик при серии
      сбитий.'
    failure_mode: Все обломки падают в пустой угол зала, ни один гость не испуган
      и не задет — игра выдает язвительный комментарий 'Чопорные гости даже не заметили
      саботажа'.
    mastery_curve: Новичок сбивает 1-2 гостей случайно; мастер направляет каскадера
      скользить на животе по главному столу президиума, выбивая 'Страйк' из жениха,
      невесты и всех свидетелей.
    counterplay: Охрана банкета в тяжелых костюмах может заблокировать скольжение
      каскадера, остановив его движение своим весом.
    synergies:
    - Завершает комбо-цепь Каскадной детонации банкета.
    - Добавляет финальный прирост финансового ущерба для достижения 3 звезд.
    why_unique: 'NPC — не статичные спрайты со скриптом, а гибридные агенты: они имеют
      NavMesh для бегства, но мгновенно переключаются в полноценный физический рэгдолл
      при импульсном воздействии, создавая органичный физический боулинг.'
    pseudocode: "function tickGuestPanic(npc: GuestAgent, explosionSource: Vector3,\
      \ dt: number): void {\n  const dist = npc.position.distanceTo(explosionSource);\n\
      \  if (dist <= PANIC_TRIGGER_RADIUS && npc.state === GuestState.IDLE) {\n  \
      \  npc.triggerPanicReaction(explosionSource);\n    audioEngine.playRandomGuestScream();\n\
      \  }\n  if (npc.isHitByPhysicsBody && npc.impactImpulse >= NPC_RAGDOLL_THRESHOLD)\
      \ {\n    npc.convertToRagdoll();\n    vfxSystem.spawnItemDrop(npc.position,\
      \ \"flying_wig.gltf\");\n    scoreSystem.addScore(GUEST_OUTFIT_DAMAGE, \"RUINED_VIP_OUTFIT\"\
      );\n    physicsWorld.applyRadialPushToNearbyNPCs(npc.position, 1.5, GUEST_CHAIN_PUSH_FORCE);\n\
      \  }\n}"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 75
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - description: RAF loop, FixedUpdate (60 Hz Rapier3D physics step), Delta time clamping,
      State Machine
    name: Core & GameLoop
  - description: Rapier3D World, Active Ragdoll Joint Constraints, Breakable Cables,
      Continuous Collision Detection
    name: Physics & Simulation
  - description: Three.js Scene, InstancedMesh для бокалов и подвесок люстр, Dynamic
      Lighting, Shadow Maps
    name: Rendering & Scene Graph
  - description: Particle Pools (крем, искры, стекло), Screen Shake Controller, Slow-Mo
      TimeScaler
    name: VFX & Juice Engine
  - description: Pointer Events Touch/Mouse unified handler, DOM/Canvas HUD, Damage
      Counter Odometer
    name: UI & Input Overlay
  - description: Playgama Bridge SDK, Cloud Saves, Rewarded/Interstitial Ads Manager,
      Leaderboard Sync
    name: Platform & Storage
  modules:
  - description: Обработка жеста натяжения рогатки, расчет стартового импульса и отрисовка
      траектории
    name: CatapultController
    path: src/controllers/CatapultController.ts
  - description: Аэродинамический расчёт подъёмной силы и сопротивления рэгдолла на
      основе угла атаки
    name: RagdollSteering
    path: src/physics/RagdollSteering.ts
  - description: Мониторинг механических напряжений в подвесах люстр, триггер Break
      Joint и расчёт урона
    name: DestructionManager
    path: src/physics/DestructionManager.ts
  - description: Управление шкалой времени timeScale (1.0 -> 0.2 -> 1.0) и динамическим
      фокусом камеры
    name: SlowMoController
    path: src/camera/SlowMoController.ts
  - description: Логика комичной паники и физического разбегания гостей при обрушении
      конструкций
    name: NPCMobManager
    path: src/entities/NPCMobManager.ts
  - description: Высокопроизводительный пул инстанс-частиц для осколков хрусталя,
      крема и капель шампанского
    name: InstancedVFXPool
    path: src/vfx/InstancedVFXPool.ts
monetization:
  strategy_summary: 'Гибридная ненавязчивая модель для веб-платформ: Rewarded Video
    для удвоения очков/наличных и активации супер-катапульты, Interstitial реклама
    строго в паузах между удачными перезапусками с таймером охлаждения 90 секунд,
    косметические IAP для отключения рекламы и эксклюзивных скинов.'
  rewarded_placements:
  - id: double_cash
    name: Удвоить свадебный куш
    benefit: Удваивает заработанные доллары погрома ($) за успешный запуск
    cooldown_or_limit: Без лимита, доступно на экране победы
    trigger_moment: Экран завершения раунда при наборе 2 или 3 звёзд
  - id: super_catapult
    name: Шампанская Супер-Пушка
    benefit: Даёт 1 запуск с удвоенной мощностью катапульты и взрывным бутоньеркой
    cooldown_or_limit: 1 раз за 3 попытки
    trigger_moment: Экран подготовки к запуску после неудачной попытки
  - id: unlock_skin_trial
    name: 'Пробный заезд: Невеста-Торпеда'
    benefit: Временный доступ к премиум-костюму с увеличенным планированием на 1 уровень
    cooldown_or_limit: 1 раз за игровую сессию
    trigger_moment: Экран выбора скинов в гардеробе
  interstitial_placements:
  - trigger_event: Переход между банкетными залами или после каждого 4-го перезапуска
    cooldown_seconds: 90
    conditions: Не показывать во время прицеливания или полёта каскадёра; только на
      спокойном экране результатов
  in_app_purchases:
  - sku: no_ads_vip
    name: 'VIP Гость: Без Рекламы'
    description: Полное отключение межстраничной рекламы + золотой смокинг саботажника
    price_tier: Tier 2 ($1.99 / 199 YAN)
    reward: Отключение Interstitial + Скин 'Золотой Смокинг' + 50,000$
  - sku: starter_pack_saboteur
    name: 'Набор Диверсанта: Все Катапульты'
    description: Мгновенная разблокировка 4 продвинутых катапульт и 3 скинов
    price_tier: Tier 3 ($3.99 / 399 YAN)
    reward: Катапульты 'Шампанская Пушка' и 'Ракетный Трамплин' + 3 костюма
  fairness_rules:
  - 'Никаких пейволлов: 100% залов и катапульт можно открыть игровым путём за заработанные
    доллары погрома ($)'
  - Никакой рекламы в момент активного геймплея (во время натяжения, полёта или slow-mo)
  - Минимальный интервал между полноэкранными баннерами — не менее 90 секунд
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - game distribution
  - web
  initialization_flow:
  - 1. bridge.initialize() при старте HTML5 страницы
  - 2. bridge.storage.get() загрузка прогресса (открытые залы, катапульты, рекордные
    очки)
  - 3. bridge.advertisement.showBanner() показ нижнего ненавязчивого баннера
  - 4. bridge.game.ready() сигнал готовности Three.js сцены и скрытие загрузчика
  cloud_save_keys:
  - player_unlocked_halls_bitmask
  - player_selected_hall_id
  - player_unlocked_catapults
  - player_selected_catapult_id
  - player_unlocked_skins
  - player_selected_skin_id
  - player_total_cash
  - hall_highscores_map
  leaderboards:
  - global_destruction_score (Суммарный нанесённый ущерб)
  - hall_1_wedding_crash_record (Рекорд погрома в Свадебном Шатре)
  ads_integration:
    banner_handler: bridge.advertisement.showBanner() с автопозиционированием вне
      safe-area HUD
    interstitial_handler: bridge.advertisement.showInterstitial() с таймером кулдауна
      90 сек
    rewarded_handler: bridge.advertisement.showRewardedVideo() с колбэками onRewarded
      / onClose
  lifecycle_hooks:
  - 'bridge.on(''visibility_change'', (state) => { state === ''hidden'' ? Game.pause()
    : Game.resume(); })'
  - bridge.on('sound_state_change', (muted) => { AudioManager.setMuted(muted); })
art:
  style_name: Стилизованный Неоклассицизм / Праздничный Рококо-Гламур
  camera_perspective: 3D Third-Person Dynamic Chase / Slow-Mo Impact Cam
  camera_fov: 55
  camera_pitch_angle: 25
  environment_theme: Роскошный свадебный банкетный зал пятизвездочного отеля с высокими
    арочными сводами, золотой лепниной, бордовыми драпировками, хрустальными трёхъярусными
    люстрами, сервированными столами и пятиъярусным тортом.
  character_proportions: Стилизованные пропорции (немного удлиненные конечности для
    выразительного рэгдолла, комичная пластика смокинга и бабочки).
  lighting_setup: 'Тёплый золотистый банкетный свет: Directional Light от витражных
    окон (тёплый желтый), Ambient Light цвета шампанского, точечные Point Lights внутри
    люстр и канделябров с мягким затуханием.'
  color_palette:
    champagne_cream: '#F7E7CE'
    crystal_cyan_spark: '#A4D8E8'
    gold_luxury: '#D4AF37'
