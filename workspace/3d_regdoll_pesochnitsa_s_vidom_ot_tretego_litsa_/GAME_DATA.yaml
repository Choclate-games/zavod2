  selected_id: D1
  selected_name: 'Банкетный Краш: Свадебный Саботаж'
  selection_reason: 'Направление D1 («Банкетный Краш: Свадебный Саботаж») выбрано
    как безупречно попадающее в заказ пользователя и обладающее наивысшим потенциалом
    удержания для веб- и мобильных платформ.

    1. Идеальная эргономика мобильного и браузерного управления: единый интуитивный
    жест (Drag-and-Release для катапульты и непрерывный Drag для планирования телом)
    не требует обучения, не закрывает пальцем экран и работает одинаково гладко как
    на тачскрине, так и мышью на ПК.

    2. Мгновенная петля удовольствия (0-секундный порог входа): игрок сразу видит
    грандиозную физическую сцену, запускает каскадёра и за 15 секунд получает максимальный
    визуальный и физический отклик (Slow-mo таран троса, обрушение массивной люстры,
    взрыв свадебного торта и разлёт сотен бокалов).

    3. Идеальная оптимизация под WebGL/Three.js + Rapier3D: одиночные чистые запуски
    с быстрой перезагрузкой исключают утечки памяти и просадку FPS от накопления спящих
    коллайдеров обломков на слабых мобильных устройствах, а инстансинг частиц (threejs/juice_and_vfx_pool.md)
    обеспечивает стабильные 60 FPS при масштабных разрушениях.'
  rejected_reasons:
  - 'D2 («Люстро-Пинбол: Банкетный Рикошет») отвергнут: превращение физического тарана
    в пинбол с батутными отскоками от люстр (mechanics/juggle_combo.md) искажает физическое
    ощущение массы каскадёра и банкетного погрома; требует нагромождения неестественных
    батутных триггеров под потолком, а частые тапы в тайминг создают стресс вместо
    расслабляющего зрелищного краша.'
  - 'D3 («Каскадёр: Банкетный Краш-Тест») отвергнут: кумулятивное сохранение обломков
    за 3 дубля перегружает физический движок Rapier3D в мобильном браузере сотнями
    активных коллайдеров, а переключение экранных кнопок поз («стрела/штопор/звезда»)
    перегружает UI на телефоне и отвлекает внимание игрока от созерцания катастрофы.'
  what_it_is_not:
  - 'Никаких волн врагов и арена-боевки: гости на банкете — это мирные физические
    NPC, которые комично паникуют и разбегаются от падающих люстр и брызг торта, а
    не атакуют каскадёра.'
  - 'Никаких виртуальных экранных джойстиков и кнопок атаки: всё управление построено
    на едином интуитивном свайпе/драге мыши или пальца (натяжение катапульты и аэродинамическое
    подруливание телом).'
  - 'Никаких карточек прокачки «выбери 1 из 3» и рогаликовых апгрейдов: прогрессия
    строится на открытии новых тематических банкетных залов (свадебный, королевский
    бальный, новогодний корпоратив), костюмов каскадёра и более мощных катапульт.'
  - 'Никакой абстрактной серой физической геометрии: богатый визуальный стиль рококо/неоклассицизма
    с сияющими хрустальными люстрами, бархатными скатертями, пирамидами золотистого
    шампанского и пятиъярусным кремовым тортом.'
  - 'Никакого пассивного наблюдения после выстрела: игрок активно управляет наклоном
    и планированием тряпичной куклы на протяжении всей траектории полёта вплоть до
    финального приземления.'
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - 'Непрерывный физический рэгдолл-контроль в полёте: возможность в реальном времени
    корректировать угол и планирование каскадёра свайпом или ведением мыши для точного
    попадания в тросы люстр.'
  - 'Каскадная цепная реакция разрушений на физике Rapier3D: сбитый телом трос гарантированно
    вызывает падение люстры, взрыв свадебного торта и лавинообразное опрокидывание
    банкетных столов и бокалов.'
  - 'Комичная реакция банкетной массовки: NPC-гости за столами физически реагируют
    на падающие обломки, брызги торта и летящего каскадёра, в панике разбегаясь и
    усиливая хаос.'
  - 'Мгновенный перезапуск уровня в 1 тап/клик: короткая сессия на 15–25 секунд со
    сбросом зала в исходное состояние без промежуточных экранов загрузки.'
  signature_scene: 'Широкоугольный кадр в момент кульминационного slow-mo в роскошном
    банкетном зале в стиле барокко с высокими арочными потолками и лепниной. В верхней
    трети кадра каскадёр в смокинге с растопыренными конечностями пробивает телом
    стальной трос центральной люстры: от места удара во все стороны снопом летят золотые
    искры и разорванные звенья цепи. Массивная трёхъярусная хрустальная люстра уже
    накренилась и падает вниз, преломляя тёплый золотой свет сотен горящих свечей
    и отбрасывая калейдоскоп бликов на лепной потолок. Прямо под ней — центр банкетного
    зала: огромный пятиъярусный белый свадебный торт с фигурками жениха и невесты,
    в который летят первые хрустальные подвески, во все стороны взлетают брызги розового
    крема, а пирамида из сотен бокалов шампанского на соседнем столе начинает веером
    осыпаться сверкающим стеклянным дождём. В нижней части кадра гости в вечерних
    платьях и фраках в комичном ужасе закрывают головы руками и разбегаются в стороны
    от столов с красными бархатными скатертями. Фоновый свет — мягкое золотистое сияние
    настенных бра и тёплые лучи из гигантских витражных окон, контрастирующие с падающими
    сверкающими каплями напитков и осколками хрусталя.'
  avoid_references:
  - Angry Birds (пассивный 2D-запуск птиц без 3D-рэгдолл управления в полёте)
  - Pain (PS3) (устаревшая медленная физика без каскадных цепных реакций и современных
    тач-контролов)
  - FlatOut / Ragdoll Dismount (пассивный вылет тела через лобовое стекло без подруливания
    в воздухе)
  - Turbo Dismount (статичный расчёт траектории без активного маневрирования в интерьере)
  - Goat Simulator (бесцельная бродилка без сфокусированного core-loop запуска из
    катапульты)
