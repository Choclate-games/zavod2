definition_of_done:
- Создан валидный структурированный GameConcept JSON, полностью соответствующий схеме
  schema.json.
- 'Реализована концепция направления D1 («Банкетный Краш: Свадебный Саботаж») с полным
  исключением запрещённых жанровых шаблонов (без врагов, без 3 карт апгрейда, без
  джойстиков).'
- Все описательные тексты, механики, системы и обоснования написаны на качественном
  русском языке.
- Детализированы все 4 ключевые механики с числовыми параметрами, слоями фидбека и
  псевдокодом.
- Описана полная техническая спецификация для Three.js r170 и Rapier3D с инстансингом
  и целевыми 60 FPS.
- Сформирован план интеграции Playgama Bridge SDK с облачными сохранениями, баннерами
  и рекламой.
- Сформированы QA-чеклист, матрица рисков и дорожная карта разработки на 4 фазы (8
  дней).
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Осмотр банкетного зала и выбор уязвимого подвеса люстры
  -> Натяжение катапульты и выбор стартового угла (Drag & Release) -> Полёт каскадёра
  с аэродинамическим подруливанием корпусом (Hold & Drag) -> Кинетический таран троса
  люстры и запуск Slow-Mo -> Каскадная цепная реакция обрушения (падение люстры, взрыв
  свадебного торта, разлёт бокалов и паника гостей) -> Подсчёт очков ущерба ($) и
  звёздного рейтинга -> Мгновенный перезапуск попытки в 1 клик или разблокировка нового
  банкетного зала..'
- 'Реализованы механики проекта: Натяжение свадебной катапульты (Sling Tension & Launch),
  Аэродинамическое пилотирование рэгдоллом (Aerodynamic Body Gliding), Кинетический
  таран троса и фокус Slow-Mo (Cable Snap & Slow-Mo Focus), Каскадная цепная детонация
  банкета (Banquet Cascade Chain Reaction).'
- Условие успеха (Перебить ключевой подвес люстры, обрушить её в банкетную зону, нанести
  интерьеру ущерб свыше $50,000 (1 звезда), $120,000 (2 звезды) или $250,000 (3 звезды)
  и разблокировать следующий банкетный зал или золотой смокинг.) и условие проигрыша
  (Каскадёр промахнулся мимо подвесов люстр, врезался в пустую стену или упал на пол
  до контакта с ключевыми объектами, нанеся ущерб менее $20,000 (0 звёзд), что завершает
  попытку с предложением мгновенного перезапуска.) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Банкетный Краш: Свадебный Саботаж».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- 'Rewarded-реклама выдаёт награду ровно один раз (Удвоить свадебный куш, Шампанская
  Супер-Пушка, Пробный заезд: Невеста-Торпеда); interstitial соблюдает паузу 90 с.'
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
direction:
  options:
  - id: D1
    name: 'Банкетный Краш: Свадебный Саботаж'
    pitch: Запускай каскадёра из катапульты, планируй телом сквозь банкетный зал,
      сбивай тросы хрустальных люстр и устраивай цепную реакцию грандиозного погрома.
    core_verb: Натягивать и планировать (оттягивать назад рогатку катапульты для задания
      силы/угла, а в полёте непрерывно вести пальцем/курсором для аэродинамического
      подруливания туловищем в подвесы люстр).
    genre_family: 3D Физическая рэгдолл-аркада / Катапульта-разрушитель (Physics Ragdoll
      Destruction / Slingshot Arcade)
    session_shape: Одиночный запуск-попытка длительностью 15–25 секунд (5 секунд на
      прицеливание катапульты -> 10-15 секунд полёт, таран люстр, цепная реакция обрушения
      зала и подсчёт очков погрома).
    camera: Динамическая преследующая 3D-камера от третьего лица (следует за центром
      масс каскадёра сверху-сзади по вектору полёта; при таране троса люстры плавно
      переходит в драматическое кинематографическое Slow-Mo с фокусом на эпицентр
      обрушения).
    control_scheme: 'Телефон: Drag & Release (оттянуть палец от катапульты для выбора
      силы и угла пуска), в полёте — Hold & Drag (вести пальцем по экрану для наклона
      корпуса и подруливания). ПК: Зажать ЛКМ + Drag (натянуть рогатку мышью), в полёте
      — ведение курсора мыши или клавиши W/A/S/D для аэродинамического планирования.'
    world: Роскошный неоклассический банкетный зал премиум-отеля. Бело-золотая лепнина,
      бордовый бархат скатертей, хрусталь люстр, сверкающее шампанское, пятиъярусный
      кремовый торт и нарядная массовка гостей в смокингах.
    spectacle: Летящий каскадёр в смокинге сбивает телом центральный трос гигантской
      хрустальной люстры, которая с грохотом падает прямо на пятиъярусный свадебный
      торт, разбрызгивая крем и обрушивая пирамиду из 200 бокалов на разбегающихся
      гостей.
    why_not_generic: 'Соединяет механики mechanics/ragdoll.md (активный физический
      рэгдолл с аэродинамическим сопротивлением туловища), mechanics/physics_destruction.md
      (разрушаемые крепления люстр, ломающиеся банкетные столы) и mechanics/chain_reaction.md
      (лавинообразный кинетический погром: сбитый трос -> падение люстры -> взрыв
      торта -> разлёт бокалов и столов) в рамках эталонного patterns/physics_arcade_loop.md.
      Игрок не просто пассивно смотрит на физику после выстрела, а непрерывно подруливает
      живым телом, находя ключевые уязвимые узлы интерьера для максимального урона.'
    biggest_risk: 'Сложность баланса аэродинамической управляемости рэгдолла: каскадёр
      не должен ощущаться ни невесомым самолётиком, ни неуправляемым кирпичом.'
    production_cost: 'Средний: процедурные меши банкетного зала (threejs/procedural_mesh_builder.md),
      физические сочленения Rapier3D (stack/rapier3d.md) и пул инстансированных частиц
      осколков и брызг (threejs/juice_and_vfx_pool.md) собираются в единую сцену без
      тяжёлых внешних ассетов.'
    knowledge_hints:
    - mechanics/ragdoll.md
    - mechanics/physics_destruction.md
    - mechanics/chain_reaction.md
    - patterns/physics_arcade_loop.md
    - stack/rapier3d.md
    - threejs/physics_integration.md
    - threejs/juice_and_vfx_pool.md
    - threejs/performance_guide.md
    - threejs/procedural_mesh_builder.md
    - ux/touch_controls.md
    - ux/input_scheme_switching.md
    - audio/procedural_sound_synthesizer.md
  - id: D2
    name: 'Люстро-Пинбол: Банкетный Рикошет'
    pitch: Запускай каскадёра и совершай ритмичные импульсные отскоки от люстры к
      люстре, набивая рекордные комбо-серии в воздухе над головами гостей.
    core_verb: Запускать и импульсно рикошетить (задавать стартовый вектор катапульты,
      а в полёте совершать точные тапы/клики в момент сближения с подвесами для реактивного
      толчка и отскока к следующей цели).
    genre_family: 3D Физическая комбо-головоломка / Трикшот-аркада (Physics Chain-Reaction
      Trickshot Puzzle)
    session_shape: Комбо-партия из 3 последовательных запусков общей длительностью
      45–60 секунд (каждый запуск добивает уцелевшие элементы зала на единой физической
      арене с накоплением комбо-счёта).
    camera: Высокая изометрическая 3D-камера зала (обзор банкетного зала сверху под
      углом 45 градусов с динамическим зумом и шейком в момент каждого успешного рикошета
      каскадёра).
    control_scheme: 'Телефон: Тап по стрелке траектории для пуска, в полёте — одиночный
      тап в любой точке экрана в момент сближения с люстрой для импульсного отскока.
      ПК: Клик ЛКМ для пуска катапульты, Пробел или ЛКМ для активации импульсного
      рикошета в тайминг.'
    world: Королевский бальный зал эпохи рококо с высоченными потолочными сводами,
      золотыми канделябрами-батутами, подвесными шелковыми баннерами и мерцающими
      зеркальными колоннами.
    spectacle: Каскадёр совершает третий подряд акробатический отскок от золотого
      канделябра к хрустальной люстре под потолком, активируя множитель x5, пока под
      ним по залу разлетаются сотни золотых конфетти и искр.
    why_not_generic: Соединяет механики mechanics/ragdoll.md (импульсные деформации
      тела при ударе), mechanics/juggle_combo.md (удержание рэгдолла в воздухе за
      счёт серии последовательных отскоков с нарастающим множителем очков) и patterns/score_attack_loop.md.
      Превращает разрушение зала в аркадный трикшот-челлендж на тайминг и точность
      рикошетов.
    biggest_risk: Слишком аркадный тайминг импульсов может разрушить ощущение честной
      физической симуляции падения тяжёлого тела.
    production_cost: 'Средний: требует настройки зон триггеров отскока, расчёта комбо-множителей
      и синхронизации процедурного звука через audio/procedural_sound_synthesizer.md.'
    knowledge_hints:
    - mechanics/ragdoll.md
    - mechanics/juggle_combo.md
    - mechanics/chain_reaction.md
    - patterns/score_attack_loop.md
    - stack/rapier3d.md
    - threejs/physics_integration.md
    - threejs/juice_and_vfx_pool.md
    - ux/touch_controls.md
    - audio/procedural_sound_synthesizer.md
  - id: D3
    name: 'Каскадёр: Банкетный Краш-Тест'
    pitch: Выбирай угол катапульты и переключай аэродинамические позы каскадёра в
      полёте, чтобы разрезать подвесы люстр и выполнить все пункты контракта на погром.
    core_verb: Прицеливаться и переключать позы (выставлять угол и силу на баллистической
