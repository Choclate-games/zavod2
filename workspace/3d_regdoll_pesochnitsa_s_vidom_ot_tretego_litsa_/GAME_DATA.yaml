raw_prompt: 3D рэгдолл-песочница с видом от третьего лица в роскошном банкетном зале.
  Игрок выбирает угол и силу запуска каскадёра из катапульты, а затем в полёте подруливает
  тряпичной куклой с помощью мыши или свайпов. На экране виден богато украшенный зал
  с пирамидами бокалов, длинными столами, гигантским свадебным тортом и массивными
  люстрами на потолке. Задача — врезаться в ключевые подвесы люстр телом героя, вызвав
  грандиозную цепную реакцию погрома и панику разбегающихся гостей.
title: 'Банкетный Краш: Свадебный Саботаж'
slug: 3d_regdoll_pesochnitsa_s_vidom_ot_tretego_litsa_
genre: 3D Физическая Рэгдолл-Аркада
subgenre: Катапультная Песочница Разрушений / Каскадный Саботаж
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web)
orientation: landscape
target_audience: Широкая казуальная и мидкорная аудитория веб-игроков (12–35 лет),
  любящих эффектные физические песочницы, зрелищные рэгдолл-разрушения, динамичные
  20-секундные сессии и кинематографичный комедийный хаос.
core_loop: Осмотр банкетного зала и выбор уязвимого подвеса люстры -> Натяжение катапульты
  и выбор стартового угла (Drag & Release) -> Полёт каскадёра с аэродинамическим подруливанием
  корпусом (Hold & Drag) -> Кинетический таран троса люстры и запуск Slow-Mo -> Каскадная
  цепная реакция обрушения (падение люстры, взрыв свадебного торта, разлёт бокалов
  и паника гостей) -> Подсчёт очков ущерба ($) и звёздного рейтинга -> Мгновенный
  перезапуск попытки в 1 клик или разблокировка нового банкетного зала.
hook: Момент, когда каскадёр в смокинге с растопыренными руками на полной скорости
  пробивает телом стальной трос 3-тонной хрустальной люстры, камера переходит в ультра-Slow-Mo
  со снопом золотых искр, трос с лязгом рвётся, люстра обрушивается ровно в центр
  пятиъярусного свадебного торта, взрывая облако розового крема и запуская доминообразный
  разлёт 500 бокалов шампанского под вопли разбегающихся гостей.
player_fantasy: Вы — безбашенный каскадёр-диверсант на роскошной свадьбе миллиардеров,
  чья миссия — превратить чопорный пафосный банкет в грандиозный кинематографичный
  погром, используя собственное тело как живой высокоточный снаряд.
session_model: Одиночный запуск-попытка длительностью 15–25 секунд (3–5 с на прицеливание
  катапульты, 8–15 с на полёт, аэродинамическое подруливание, таран троса и физический
  каскад разрушений, 4 с на подсчёт счёта погрома и оценку от 1 до 3 звёзд). Серия
  из 5–10 запусков формирует полноценную игровую сессию на 3–5 минут.
unique_value_proposition: Единственная браузерная 3D рэгдолл-аркада, соединяющая тактильный
  запуск из катапульты, активное аэродинамическое планирование живой тряпичной куклой
  в реальном времени и кинематографичный каскадный погром банкетного интерьера с разрушаемыми
  люстрами, взрывающимся тортом и паникующими NPC без просадок FPS.
vision: Создать самый сочный, смешной и кинематографичный браузерный симулятор свадебного
  саботажа, где каждый запуск дарит мощнейший физический отклик, идеальную читаемость
  разрушений и непреодолимое желание попробовать ещё одну траекторию ради абсолютного
  рекорда погрома.
elevator_pitch: Запустите каскадёра из катапульты в роскошный свадебный зал, подруливайте
  телом в воздухе, чтобы перебить трос гигантской хрустальной люстры, и наблюдайте
  в slow-mo, как она обрушивается в пятиъярусный торт, осыпая сотни бокалов и разгоняя
  нарядных гостей!
win_conditions: Перебить ключевой подвес люстры, обрушить её в банкетную зону, нанести
  интерьеру ущерб свыше $50,000 (1 звезда), $120,000 (2 звезды) или $250,000 (3 звезды)
  и разблокировать следующий банкетный зал или золотой смокинг.
lose_conditions: Каскадёр промахнулся мимо подвесов люстр, врезался в пустую стену
  или упал на пол до контакта с ключевыми объектами, нанеся ущерб менее $20,000 (0
  звёзд), что завершает попытку с предложением мгновенного перезапуска.
progression_summary: Линейно-узловая карта из 5 уникальных банкетных залов (Свадебный
  Шатер, Королевский Бальный Зал, Пентхаус Небоскреба, Президентский Прием, Новогодний
  Корпоратив), открытие 8 типов катапульт (Пружинная, Шампанская Пушка, Фейерверк-Лончер)
  и 12 забавных скинов каскадёра с модификаторами аэродинамики.
difficulty_curve: 'Пологая и награждающая кривая: Начальные уровни предлагают крупные
  люстры с широкими подвесами прямо по курсу выстрела; средние уровни добавляют препятствия
  (колонны, движущихся официантов, раскачивающиеся гирлянды) и требуют точного планирования;
  поздние уровни требуют сложных рикошетов для обрушения 2-3 люстр за один запуск.'
