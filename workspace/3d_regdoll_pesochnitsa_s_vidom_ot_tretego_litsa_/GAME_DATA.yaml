    biggest_risk: Переключение кнопок поз на экране смартфона в динамичном полете
      перегружает интерфейс и отвлекает игрока от визуального зрелища погрома.
    production_cost: 'Высокий: требует процедурного рига с поддержкой переключения
      аэродинамических поз на лету (threejs/procedural_character_rig.md) и системы
      контрактов с отслеживанием десятков условий.'
    knowledge_hints:
