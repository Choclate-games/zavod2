      пуска + клавиши 1, 2, 3 для смены поз рэгдолла в воздухе.'
    world: 'Кинопавильон с роскошной декорацией банкетного зала кинопремии: софиты,
      красные ковровые дорожки, столы со статуэтками, шампанским и манекены гостей
      в смокингах.'
    spectacle: Каскадёр в позе «штопор» на полной скорости срезает тросы сразу двух
      люстр подряд, которые сминают под собой декорацию сцены награждения и пирамиды
