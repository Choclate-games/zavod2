_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: 3d_regdoll_pesochnitsa_s_vidom_ot_tretego_litsa_
performance:
  target_fps: 60
  max_draw_calls: 75
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: Одиночный запуск-попытка длительностью 15–25 секунд (3–5 с на прицеливание
    катапульты, 8–15 с на полёт, аэродинамическое подруливание, таран троса и физический
    каскад разрушений, 4 с на подсчёт счёта погрома и оценку от 1 до 3 звёзд). Серия
    из 5–10 запусков формирует полноценную игровую сессию на 3–5 минут.
  win: Перебить ключевой подвес люстры, обрушить её в банкетную зону, нанести интерьеру
    ущерб свыше $50,000 (1 звезда), $120,000 (2 звезды) или $250,000 (3 звезды) и
    разблокировать следующий банкетный зал или золотой смокинг.
  lose: Каскадёр промахнулся мимо подвесов люстр, врезался в пустую стену или упал
    на пол до контакта с ключевыми объектами, нанеся ущерб менее $20,000 (0 звёзд),
    что завершает попытку с предложением мгновенного перезапуска.
  difficulty_curve: 'Пологая и награждающая кривая: Начальные уровни предлагают крупные
    люстры с широкими подвесами прямо по курсу выстрела; средние уровни добавляют
    препятствия (колонны, движущихся официантов, раскачивающиеся гирлянды) и требуют
    точного планирования; поздние уровни требуют сложных рикошетов для обрушения 2-3
    люстр за один запуск.'
mechanics:
  natyazhenie_svadebnoy_katapulty_sling_tension_laun:
    name: Натяжение свадебной катапульты (Sling Tension & Launch)
    parameters:
      maxpulldistance:
        value: 2.5 м
        note: Если увеличить до 4.0 м — катапульта перетягивает экран, игрок теряет
          обзор зала; если уменьшить до 1.2 м — пропадает ощущение упругого сопротивления
          и мощи броска.
      baselaunchvelocity:
        value: 32.0 м/с
        note: Если увеличить выше 45.0 м/с — каскадер пролетает зал за 0.3 с без возможности
          подруливания; если снизить ниже 20.0 м/с — телу не хватает кинетической
          энергии пробить трос люстры (порог 15 м/с).
      aimtrajectorylength:
        value: 30.0 % пути
        note: Если дать 100% дуги — исчезает челлендж прицеливания и пространственное
          чутье; если убрать дугу (<10%) — игрок стреляет вслепую и раздражается частыми
          промахами.
      maxelevationangle:
        value: 75.0 градусов
        note: Если разрешить 90° — каскадер врезается в потолок прямо над катапультой;
          если ограничить 45° — невозможно достать люстры верхнего яруса.
      tensionresistancecurve:
        value: Экспонента 1.35
        note: Если сделать линейной (1.0) — нет ощущения нарастающей упругости жгута;
          если выше 2.0 — последние 20% натяжения требуют слишком резкого движения
          мыши.
  aerodinamicheskoe_pilotirovanie_regdollom_aerodyna:
    name: Аэродинамическое пилотирование рэгдоллом (Aerodynamic Body Gliding)
    parameters:
      maxglideliftcoeff:
        value: 1.2 ед
        note: Если завысить (>2.0) — каскадер превращается в самолет и бесконечно
          парит под потолком; если занизить (<0.5) — планирование неощутимо, игрок
          падает камнем.
      divemaxspeed:
        value: 42.0 м/с
        note: Если увеличить (>55 м/с) — физика Rapier3D может туннелировать сквозь
          тонкие тросы; если снизить (<30 м/с) — пикирование не дает преимущества
          в пробитии.
      steerresponsiveness:
        value: 0.12 с
        note: Если сделать мгновенной (0.0 с) — рэгдолл дергается неестественно и
          теряет вес; если сделать медленной (>0.35 с) — игрок не успевает облетать
          внезапно возникшие колонны.
      criticalstallangle:
        value: 45.0 градусов
        note: Если угол сваливания слишком мал (25°) — игрок постоянно входит в штопор
          при попытке подняться; если сваливание отключить — нет наказания за чрезмерный
          задир носа.
      airresistancesmoothing:
        value: 0.85 ед/с
        note: Если коэффициент сглаживания мал (<0.4) — порывы ветра вызывают визуальный
          джиттер конечностей рэгдолла; если велик (>0.95) — реакция на ввод становится
          ватной.
  kineticheskiy_taran_trosa_i_fokus_slow_mo_cable_sn:
    name: Кинетический таран троса и фокус Slow-Mo (Cable Snap & Slow-Mo Focus)
    parameters:
      snapvelocitythreshold:
        value: 15.0 м/с
        note: Если снизить (<8 м/с) — трос рвется от любого легкого касания, теряется
          ощущение прочности стальных креплений; если поднять (>25 м/с) — 80% попыток
          заканчиваются глухим ударом без обрыва.
      slowmotimescale:
        value: 0.20 ед
        note: Если замедлить еще сильнее (<0.05x) — геймплей зависает и сбивается
          темп аркады; если сделать 0.5x — игрок не успевает рассмотреть детали взрыва
          троса и смаковать момент.
      slowmodurationreal:
        value: 1.50 с
        note: Если длительность больше 3.0 с — затягивает сессию и утомляет при частых
          рестартах; если меньше 0.6 с — мозг не успевает переключить внимание на
          кинематографичность.
      jointbreakforce:
        value: 18000.0 Н
        note: Если увеличить до 35 кН — потребуются идеальные вертикальные пике; если
          уменьшить до 5 кН — люстры падают сами от сквозняка.
      reboundmomentumretain:
        value: 0.40 ед
        note: Если каскадер теряет весь импульс (0.0) — он падает мешком вертикально
          вниз; если сохраняет 0.8 — нереалистично отскакивает как резиновый мяч.
  kaskadnaya_tsepnaya_detonatsiya_banketa_banquet_ca:
    name: Каскадная цепная детонация банкета (Banquet Cascade Chain Reaction)
    parameters:
      cakeblastradius:
        value: 3.5 м
        note: Если увеличить (>6.0 м) — крем сбивает вообще всё на уровне за один
          клик, пропадает ценность точного попадания; если уменьшить (<1.8 м) — взрыв
          торта выглядит неубедительно и не достает до столов.
      glassshattercount:
        value: 500 шт
        note: Если заспавнить 2000 частиц — проседает FPS на мобильных браузерах ниже
          30; если сделать 50 шт — теряется ощущение роскошной грандиозной пирамиды.
      chainreactionwindow:
        value: 0.45 с
        note: Если тайм-аут комбо слишком мал (<0.2 с) — серия прерывается между падением
          бокалов и столов; если больше 1.5 с — комбо превращается в автоматическое
          без чувства динамики.
      tablefractureforce:
        value: 4500.0 Н
        note: Если столы слишком прочные (15 кН) — люстра просто лежит на них как
          на полке; если слишком мягкие (500 Н) — они исчезают от легкого толчка каскадера.
      maxcombomultiplier:
        value: 3.5 x
        note: Если поднять до 10x — баланс очков ломается и перекрывает любые другие
          действия; если ограничить 1.5x — игрок не мотивирован строить сложные цепочки.
  panika_banketnoy_massovki_i_tsepnaya_davka_guest_p:
    name: Паника банкетной массовки и цепная давка (Guest Panic Stampede & Physics
      Bowling)
    parameters:
      panictriggerradius:
        value: 8.0 м
        note: Если сделать слишком большим (>15 м) — все гости на карте разбегаются
          мгновенно до падения обломков; если меньше 4 м — гости стоят как истуканы
          рядом с рушащейся люстрой.
      npcragdollthresholdimpulse:
        value: 250.0 Н*с
        note: Если порог мал (50 Н*с) — гости падают от летящей крошки торта; если
          завысить (1000 Н*с) — гости стоят неподвижно, когда в них врезается стол.
      guestchainpushforce:
        value: 180.0 Н
        note: Если сила толчка велика (>400 Н) — один падающий гость сбивает весь
          зал как кегли; если мала (<50 Н) — цепной эффект боулинга не возникает.
      guestdamagevalue:
        value: $5000.0 за VIP-наряд
        note: Если завысить — погром мебели станет невыгоден по сравнению со сбиванием
          людей; если занизить — сбивание гостей не ощущается ценным.
      maxpanicnpcsperlevel:
        value: 40 чел
        note: Если заспавнить 150 NPC — физические рэгдоллы перегрузят CPU браузера;
          если меньше 15 — зал выглядит пустым и безжизненным.
