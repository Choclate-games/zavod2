- Сцена Three.js с заснеженным каньоном, ледником и атмосферным бураном загружается
  менее чем за 2 секунды
- Снайперский FPS-контроллер поддерживает плавное наведение, зум 8x-16x и задержку
  дыхания на ПК и смартфонах
- Баллистическая система честно рассчитывает поправку на боковой ветер и отображает
  траекторию
- Попадание в критический узел ледника активирует кинематографичную Bullet-Cam и физический
  раскол на Rapier3D
- Лавина из десятков физических валунов и снежной пыли погребает титана, приводя к
  победе в раунде
- Интерфейс адаптирован под мобильный тач и десктоп, подключен SDK Playgama Bridge
  с рекламой и сохранениями
- Стабильные 60 FPS на десктопе и 50+ FPS на мобильных устройствах без утечек памяти
- 'Игра осталась тем, что просили: вид от первого лица — игрок смотрит своими глазами,
  а не с вертолёта, вышки или орбиты.'
- 'Игра осталась тем, что просили: игрок сам ходит по уровню на своих двоих.'
- 'Игра осталась тем, что просили: стрельба как главное действие игрока.'
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Оценка позиции и ветра (10–15 с) -> Выбор точки стрельбы
  на карнизе (5–10 с) -> Вход в оптику и задержка дыхания (5–8 с) -> Выверенный спуск
  курка (1 с) -> Кинематографичный Bullet-Cam и сход лавины на гиганта (5–8 с) ->
  Расчет точности, награда за чистоту контракта и переход к новому перевалу..'
- 'Реализованы механики проекта: Баллистический расчет ветра и дистанции (Wind & Range
  Ballistics), Фокусировка и задержка дыхания (Breath Hold & Focus Stabilization),
  Позиционирование на карнизе (Ledge Repositioning & Angle Cleansing), Кинетический
  раскол ледника и цепная лавина (Glacial Fracture & Avalanche Chain).'
- Условие успеха (Попадание в критический узел разлома ледника (Stress Core), вызвавшее
  сход лавины объемом не менее 80% массы и полное погребение ледяного титана до того,
  как он достигнет заставы на перевале (дистанция до рубежа > 0 м).) и условие проигрыша
  (Истечение лимита времени (90 секунд), пересечение титаном рубежа перевала или исчерпание
  боекомплекта (3 патрона) без активации критического обвала ледника.) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Лавинный снайпер: Эхо Каньона».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Дополнительный патрон 'Золотой Калибр',
  Метео-сканирование ущелья, Удвоение знаков дозорного); interstitial соблюдает паузу
  90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
direction:
  options:
  - id: D1
    name: 'Лавинный снайпер: Эхо Каньона'
    pitch: 'Тактическая высотная охота от первого лица: перемещайся по карнизу ущелья,
      вычисляй баллистику ветра и одним точным выстрелом в ледяной замок обрушивай
      мегатонные лавины на марширующего внизу колосса.'
    core_verb: Выверять (замерять дистанцию и поправку на ветер, задерживать дыхание
      и точно спускать курок в критический узел ледника)
    genre_family: Снайперский тактический экшен-пазл от первого лица / Environmental
      Destruction FPS
    session_shape: Одиночный снайперский контракт (1 заснеженное ущелье, 1 медленно
      идущий к перевалу титан, лимит времени 60–90 секунд на выбор позиции, подготовку
      и решающий выстрел).
    camera: Вид от первого лица с плавным переходом в оптический прицел (зум 8x-16x
      с сеткой Mil-Dot, параллаксом и хроматической аберрацией линзы), с кинематографичной
      bullet-cam (рапид-камера за пулей при попадании) и вибро-эффектом грохота лавины.
    control_scheme: 'ПК: A/D — выбор позиции на ледяном карнизе, ПКМ (удержание) —
      вход в оптический прицел, Движение мыши — доводка перекрестия, Shift — задержка
      дыхания (стабилизация и фокус), ЛКМ — выстрел. Телефон: Свайп в левой части
      — шаг по карнизу, Удержание в правой зоне — прицеливание через оптику с гиро-доводом,
      Кнопка «Легкие» — задержка дыхания, Тап по триггеру — спуск курка.'
    world: Древний ледниковый разлом в высокогорье Нордхейма; кристально-синий вечный
      лед, черные базальтовые скалы, слепящее арктическое солнце и клубящиеся порывы
      снежного бурана.
    spectacle: В перекрестье прицела видна светящаяся трещина ледяного купола на высоте
      300 метров; внизу по дну ущелья шагает стометровый ледяной голем, сотрясая скалы;
      вокруг пули в рапиде закручиваются вихри инея перед тем, как ледник разлетается
      на тысячи осколков.
    why_not_generic: Соединяет механику физических разрушений окружения (mechanics/physics_destruction.md)
      и кинетических цепных реакций (mechanics/chain_reaction.md) со снайперской баллистикой
      (threejs/fps_controller_and_shooting.md). Враг побеждается не монотонным ковырянием
      полоски HP пулями, а провоцированием масштабной природной катастрофы через единственный
      кинетический триггер.
    biggest_risk: 'Игрок может промазать по узкой точке раскола и потерять темп из-за
      долгой перезарядки крупнокалиберной винтовки. Решение: контрастные телеграф-маркеры
      нарастания микротрещин от ветра и щедрый радиус хитбокса критического ледяного
      замка (three-mesh-bvh).'
    production_cost: Средний. Требуется одна проработанная сцена ущелья с процедурным
      разрушением ледника через Rapier3D / InstancedMesh и шейдер снайперской оптики.
    knowledge_hints:
    - threejs/fps_controller_and_shooting.md
    - mechanics/physics_destruction.md
    - mechanics/chain_reaction.md
    - threejs/juice_and_vfx_pool.md
    - stack/rapier3d.md
    - stack/three_mesh_bvh.md
    - ux/touch_controls.md
    - audio/procedural_sound_synthesizer.md
  - id: D2
    name: 'Периметр Нулевой: Ледяной Дозор'
    pitch: 'Динамичный оборонительный FPS-рейд: бегай между защитными турелями и скальными
      ретрансляторами по флангам каньона, отстреливай ледяные наросты на шагающем
      титане для сбития его темпа и направляй обвалы на ключевые перемычки ущелья.'
    core_verb: Перебегать и подавлять (спринт между позициями с винтовкой наперевес,
