      одиночными/очередями, R — перезарядка. Телефон: Плавающий стик слева — бег,
      Правая зона — обзор камеры, Кнопка ADS — быстрый зум, Кнопка огня справа.'
    world: Научно-исследовательский аванпост в антарктической впадине; геотермальные
      трубы, металлические мостки поверх глубоких расселин, пар от генераторов и морозный
      туман.
    spectacle: Игрок бежит по вибрирующему металлическому мостику над бездной, стреляет
      на бегу по ледяной арке над головой шагающего исполина; арка трескается и обрушивает
      град ледяных глыб на плечи титана, замедляя его ход.
    why_not_generic: Соединяет механику укрытий и подавления (mechanics/cover_and_suppression.md)
