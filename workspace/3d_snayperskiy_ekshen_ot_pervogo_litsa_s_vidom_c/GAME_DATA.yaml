  avoid_references:
  - Sniper Elite (избегать буквального рентген-сканирования внутренних органов и охоты
    на пехоту; наш фокус — физика масштабного окружения и колоссы)
  - Vampire Survivors (никакого авто-огня, сбора кристаллов опыта и орды вокруг игрока)
  - Shadow of the Colossus (никакого карабканья по шерсти монстра от третьего лица;
    мы снайпер на удаленной позиции от первого лица)
  - Deer Hunter / Hunting Clash (никакого статичного тира по животным; здесь смертоносный
    титан и масштабная физика разрушения)
knowledge_plan:
