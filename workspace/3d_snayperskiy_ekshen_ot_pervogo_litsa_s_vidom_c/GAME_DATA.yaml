    Это идеальный формат для браузера и мобильных: минимальное количество управляющих
    действий (наводка, дыхание, спуск), мгновенная читаемость кадра с первой секунды
    без необходимости туториала, и колоссальный вау-эффект от зрелищного раскола ледника
