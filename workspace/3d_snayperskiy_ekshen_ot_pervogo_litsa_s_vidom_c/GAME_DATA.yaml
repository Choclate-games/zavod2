    camera: Атмосферный FPS с эффектом замерзания маски/линз по краям экрана, тепловизионный/сонарный
      режим снайперского прицела для поиска скрытых пустот в толще льда.
    control_scheme: 'ПК: WASD — скрытное передвижение, C/Ctrl — бесшумный шаг/присед,
      ПКМ — тепловизионный прицел, Мышь — наведение, ЛКМ — выстрел в такт пику бурана
      (ритм-индикатор). Телефон: Зона перемещения слева с контролем скорости шага,
      Кнопка приседа, Правая зона — оптический зум со сменой спектра, Кнопка выстрела.'
    world: Мистический каньон вечной мерзлоты в преддверии магического апокалипсиса;
      бирюзовое полярное сияние, завывающий фиолетово-серый буран, светящиеся синим
      жилы древней руды в толще льда.
    spectacle: Сквозь фильтр прицела видна пульсирующая синим резонансная жила внутри
      ледяного утеса; внизу монстр сканирует конусом ледяного взора склон каньона;
      в момент удара молнии бурана игрок стреляет, и резонансная волна раскалывает
      весь хребет.
    why_not_generic: Соединяет стелс с конусами зрения (mechanics/stealth_detection.md
