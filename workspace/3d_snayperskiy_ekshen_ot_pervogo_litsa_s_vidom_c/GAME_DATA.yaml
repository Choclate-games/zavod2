    светящаяся ультрамарином трещина циклопического ледника. В пятистах метрах внизу
    по дну ущелья шагает исполинский ледяной голем, замахиваясь ледяной глыбой, а
    из дула винтовки игрока уже вырывается конус дульного пламени, и раскаленная пуля
