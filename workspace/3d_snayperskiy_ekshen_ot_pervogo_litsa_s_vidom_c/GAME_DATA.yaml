  - 'Никакой полоски здоровья у босса (HP bar): гигант неуязвим к прямому стрелковому
    огню и уничтожается исключительно физической лавиной.'
  - 'Никаких карточек прокачки «+5% урона / +10% скорости бега» между выстрелами:
    прогрессия строится на усложнении геометрии ущелья, порывах ветра и динамических
    траекториях схода снега.'
  - 'Никакого виртуального джойстика перемещения по умолчанию: управление сосредоточено
    на точном микро-наведении прицела, дыхании и спуске, а не на суетливом беге.'
  - 'Никаких серых безликих полигонов: холодная, контрастная стилизованная палитра
    арктического высокогорья с глубокими синими тенями и слепящим белым снегом.'
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
