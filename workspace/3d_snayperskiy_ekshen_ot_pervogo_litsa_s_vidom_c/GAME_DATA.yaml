      ИИ босса (threejs/shooter_enemy_ai_and_combat.md). Это не статичная снайперская
      засада, а гонка со временем от укрытия к укрытию с постоянным расчетом тайминга
      обрушения конструкций.
    biggest_risk: 'Перегрузка внимания игрока при попытке одновременно контролировать
      спринт по мосткам и точное выцеливание уязвимостей на ходу. Решение: легкий
      Aim Assist при вскидке оружия и контрастная цветовая индикация разрушаемых опор.'
    production_cost: Средний. Требует расширенной логики навигации по мосткам, ИИ
      движения босса по вейпоинтам и физики падения мостов и скальных арок.
    knowledge_hints:
    - threejs/fps_controller_and_shooting.md
    - threejs/shooter_enemy_ai_and_combat.md
    - mechanics/cover_and_suppression.md
    - mechanics/ragdoll.md
    - threejs/game_map_and_world_design.md
