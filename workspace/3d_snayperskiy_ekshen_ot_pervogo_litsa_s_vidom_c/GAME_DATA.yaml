references:
- name: Sniper Elite Series (Rebellion)
  genre: Тактический снайперский экшен
  mechanics:
  - Баллистическая сетка прицела Mil-Dot
  - Задержка дыхания (Empty Lung) со стабилизацией
  - Кинематографичная рапид-камера пули (Kill-Cam)
  lessons: Плавное замедление времени при спуске курка и драматичное следование камеры
    за пулей создают максимальный эмоциональный пик победы.
  what_to_avoid: Избегать рентгеновского анатомического сканирования органов пехоты;
    фокус должен быть строго на расколе кристаллических структур векового льда и физике
    схода лавины.
- name: Shadow of the Colossus (Team Ico / Bluepoint)
  genre: Приключенческий экшен с гигантами
  mechanics:
  - Величественный циклопический масштаб исполинов
  - Поиск критических уязвимых точек окружения
  - Ощущение монументальности мира
  lessons: Передать колоссальную массу и поступь титана через низкочастотный грохот
    шагов, сотрясение ущелья и дрожание экрана.
  what_to_avoid: Избегать карабканья от третьего лица и аркадного ковыряния монстра
    мечом; игрок остается на удаленной снайперской позиции от первого лица.
- name: Teardown (Tuxedo Labs)
  genre: Физический симулятор разрушений
  mechanics:
  - Структурная целостность опорных конструкций
  - Цепные обрушения нависающих масс
  - Кинетическое воздействие падающих обломков
  lessons: Разрушение одного критического соединительного узла должно вызывать реалистичный
    гравитационный крах всей нависающей плиты.
  what_to_avoid: Избегать тяжелого воксельного расчета в реальном времени для WebGL;
    использовать оптимизированные выпуклые твердые тела Rapier3D и пулинг инстансированных
    мешей.
mechanics:
- name: Баллистический расчет ветра и дистанции (Wind & Range Ballistics)
  category: combat
  priority: core
  description: Честный расчет смещения пули под воздействием бокового ветра и гравитационного
    провисания на дистанциях 300–800 метров. Игрок замеряет скорость ветра по диегетическим
    флажкам и анемометру, совмещая метки шкалы Mil-Dot с точкой разлома.
  player_interaction: Мышь/правый стик — плавное наведение прицела; Колесо мыши/щипок
    пальцами — регулировка кратности оптики (8x–16x–24x); Пробел/тап по сетке — активация
    дальномерной шкалы
  feedback: 'Визуал/VFX: Диегетические красные шелковые флажки на скалах колышутся
    и вытягиваются по вектору ветра; плотные струи снежной поземки и завихрения вихрей
    показывают слои турбулентности; при полете пули виден плотный конденсационный
    след (инверсионный след) и трассирующий дымный шлейф.; Звук (Web Audio): Низкочастотный
    свист ветра с динамическим полосовым фильтром (Bandpass Filter), меняющим частоту
    среза при усилении шквала; глухой щелчок барабанчиков поправок прицела; хлесткий
    сверхзвуковой щелчок (Supersonic Crack) и раскатистое эхо выстрела в ущелье с
    задержкой 1.2 с.; Камера (импульс/зум): Плавный переход в режим прицела с эффектом
    параллакса оптической линзы; тяжелый вертикальный импульс отдачи винтовки (угол
    +4.2 градуса) с мягким возвратом за 0.45 с; микро-дрожание камеры при сильных
    порывах шквального ветра.; UI/Тактильность: Гравированная сетка Mil-Dot с микро-делениями
    (тысячные); тактильная вибрация мобильного устройства (короткий резкий импульс
    45 мс) при совпадении перекрестия с расчетной точкой упреждения; легкий пульсирующий
    виброотклик на порывы ветра.'
  technical_complexity: Medium
  strengths:
  - Высокая глубина мастерства без усложнения управления
  - Органичная связь с визуалом бурана в ущелье
  - Мгновенная читаемость ошибки при промахе
  weaknesses:
  - Требует наглядного обучения чтению меток прицела для казуальной аудитории
- name: Фокусировка и задержка дыхания (Breath Hold & Focus Stabilization)
  category: combat
  priority: core
  description: Тактическая остановка дыхания стрелка, полностью гасящая колебания
    рук и дающая легкое оптическое приближение (Focus Zoom). Ресурс ограничен 5 секундами
    объема легких, после чего наступает фаза учащенного сердцебиения и сильного тремора.
  player_interaction: 'Клавиатура: зажатие Shift или ПКМ; Тачскрин: удержание круглой
    кнопки с иконкой легких в правом нижнем углу экрана'
  feedback: 'Визуал/VFX: Края экрана плавно затемняются морозной виньеткой с ледяными
    узорами (инеем); поле зрения (FOV) сужается на 15%, создавая туннельный фокус;
    при гипоксии экран пульсирует красным размытием (Chromatic Aberration).; Звук
    (Web Audio): Окружающий рев бурана мгновенно приглушается низкочастотным фильтром
    (Low-Pass Filter 400 Гц); на передний план выходит кристально четкий звук глухого
    биения сердца (60 -> 120 уд/мин); в момент выдоха — протяжный свистящий звук морозного
    пара.; Камера (импульс/зум): Плавная остановка синусоидального покачивания камеры
    (Lissajous curve sway -> 0 за 0.18 с); мягкий оптический наплыв камеры на 12%;
    при срыве дыхания — резкий хаотичный рывок камеры вверх-вправо на 1.8 градуса.;
    UI/Тактильность: Круговой полупрозрачный индикатор объема легких вокруг прицельной
    марки, тающий от голубого к тревожному янтарному цвету; ритмичная виброотдача
    смартфона в такт ударам сердца (пульс).'
  technical_complexity: Low
  strengths:
  - Создает мощнейшее тактильное напряжение перед выстрелом
  - Интуитивно понятно любому игроку
  - Предотвращает бесконечное выцеливание, задавая темп
  weaknesses:
  - Может раздражать при слишком коротком базовом таймере (требуется баланс 4.5–5.5
    с)
- name: Позиционирование на карнизе (Ledge Repositioning & Angle Cleansing)
  category: Тактический двигатель угла обзора и источник позиционного преимущества
  priority: secondary
  description: Вместо статичной снайперской 'будки' игрок активно управляет геометрией
    линии огня в реальном 3D-пространстве уступа, превращая выбор позиции в пространственную
    головоломку.
  player_interaction: 'Клавиатура: клавиши A / D (движение влево/вправо по карнизу),
    клавиша C (присед/упор на сошки); Тачскрин: горизонтальный слайдер перемещения
    в левой нижней зоне экрана'
  feedback: 'Визуал/VFX: Игрок видит выступающие скальные пики и ледяные колонны,
    закрывающие разные сектора ущелья в перспективе (Parallax Occlusion); снежные
    хлопья срываются с карниза из-под ног; при упоре на сошки со скалы осыпается мелкая
    ледяная крошка.; Звук (Web Audio): Хруст плотного наста и металлический скрежет
    альпинистских кошек по обледенелому камню; глухой металлический лязг раскрывающихся
    титановых сошек винтовки; шелест ветрозащитного маскхалата стрелка.; Камера (импульс/зум):
    Мягкое вертикальное покачивание шага при ходьбе; плавное опускание камеры на 0.4
    м при переходе в положение ''упор на сошки''; динамическое изменение угла обзора
    ущелья, раскрывающее глубину каньона.; UI/Тактильность: Индикатор текущей позиции
    на карнизе (мини-линейка уступа); иконка статуса ''Сошки установлены (Стабильность
    +60%)''; легкая тактильная отдача при шагах стрелка.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Кинетический раскол ледника и цепная лавина (Glacial Fracture & Avalanche
    Chain)
  category: physics
  priority: core
  description: Физическая детонация критического узла напряжения (Stress Core) в ледниковой
    плите. Попадание пули высвобождает гравитационную потенциальную энергию, раскалывая
    монолит на десятки физических глыб на Rapier3D, которые увлекают за собой снежную
    лавину и хоронят шагающего титана.
  player_interaction: ЛКМ / виртуальная кнопка спуска курка (Fire) в момент точного
    наведения на Stress Core
  feedback: 'Визуал/VFX: Ослепительная ультрамариновая вспышка в точке входа пули;
    ветвящиеся неоново-сапфировые трещины с эмиссионным свечением раскалывают 100-метровый
    ледник; объемный каскад из 48 физических глыб и сотен тысяч инстансированных частиц
    снежной пудры (GPU Instanced Snow Particles), заполняющих все ущелье.; Звук (Web
    Audio): Высокочастотный хрустальный звон лопающегося под давлением кристаллического
    льда; суб-басовый дроп (Sub-Bass Drop 35 Гц) в момент обрыва несущей плиты; нарастающий
    громоподобный гул катящейся снежной лавины с реверберацией каньона.; Камера (импульс/зум):
    Рапид-камера слежения за пулей (Bullet-Cam) с замедлением до 0.15x; динамический
    переход на общий план каньона в момент удара лавины; сотрясение экрана (Screen
    Shake) с амплитудой 0.8 и затуханием 3.5 с при ударе снежной массы о дно каньона.;
    UI/Тактильность: Всплывающий бейдж ''КРИТИЧЕСКИЙ РАСКОЛ: 100% МАССЫ''; мощная
    продолжительная виброотдача (Heavy Haptic Rumble 1.2 с) на мобильном устройстве
    при падении ледниковой плиты.'
  technical_complexity: High
  strengths:
  - Главный источник катарсиса и зрелищности игры
  - Уникальный опыт победы через физику окружения вместо полоски HP
  - Высокая виральность роликов игрового процесса
  weaknesses:
  - Требует строгой оптимизации количества твердых тел на мобильных GPU
- name: Синхронизация шага титана и акустическое эхо (Titan Stride & Echo Pacing)
  category: Источник внешнего давления времени и динамический таймер перевала
  priority: secondary
  description: Снайпер решает не статическую задачу 'попади в точку', а четырехмерную
    кинематическую задачу пересечения траектории пули, схода физической лавины и инерционного
    движения 30-метрового гиганта.
  player_interaction: Визуальное наблюдение за ритмом поступи титана через оптику;
    Зажатие кнопки свистка/ложного эхо-выстрела (клавиша E / иконка эхо-патрона) для
    кратковременной остановки монстра
  feedback: 'Визуал/VFX: При каждом шаге титана с его ледяных плеч осыпается снег,
    под его стопой вздымается облако снежной пыли высотой 15 метров; земля в ущелье
    сотрясается, порождая микро-трещины на льду.; Звук (Web Audio): Мощнейший инфразвуковой
    удар шага (40 Гц), распространяющийся с эхом по всему каньону; утробный рев первобытного
    колосса; пространственный 3D-звук шагов приближается по панораме.; Камера (импульс/зум):
    Ритмичные вертикальные толчки камеры стрелка синхронно с шагами гиганта (Camera
    Bump 0.015 рад); при прохождении титана вблизи карниза — нарастающий рокот с вибрацией
    экрана.; UI/Тактильность: Диегетическая шкала дистанции титана до рубежа заставы
    на перевале (в метрах); предупреждающий пульсирующий красный сигнал ''ОПАСНАЯ
    БЛИЗОСТЬ: 50 М''.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
gameplay_systems:
- name: Система аэродинамической баллистики и ветра (WindBallisticsSystem)
  purpose: Симуляция физического полета пули в реальном времени с учетом векторного
    поля ветра, гравитации и сопротивления воздуха.
  input: Вектор взгляда камеры, скорость пули (1200 м/с), текущий вектор ветра (X,
    Z), время задержки дыхания.
  rules:
  - Смещение пули по горизонтали пропорционально боковой составляющей ветра и квадрату
    дистанции
  - Гравитационное провисание пули рассчитывается по формуле y = y0 + v0y*t - 0.5*g*t^2
  - Ветер пульсирует с частотой 0.2–0.5 Гц, меняя амплитуду в пределах ±20% от базового
    значения уровня
  state:
  - WindSpeed (м/с)
  - WindDirectionAngle (радианы)
  - CurrentBulletPosition (Vector3)
  - BulletVelocityVector (Vector3)
  interactions: Передает рассчитанную траекторию в BulletCamDirectorSystem и передает
    точку контакта в AvalanchePhysicsSystem.
  feedback: Отклонение трассера пули, частицы бурана летят строго по направлению вектора
    ветра, стрелка анемометра колышется в такт порывам.
  edge_cases:
  - Выстрел при мгновенной смене порыва ветра — честно сносит пулю в последний момент
    полета
  - Попадание в скалу мимо ледника — спавнит рикошетные искры и каменную крошку без
    вызова лавины
- name: Система физического раскола и схода лавины (AvalanchePhysicsSystem)
  purpose: Управление разрушением монолитных мешей ледника на жесткие тела Rapier3D
    и расчет кинетического урона по титану.
  input: Точка попадания пули, кинетическая энергия пули, матрица напряжений ледника.
  rules:
  - Если попадание приходится в радиус < 1.2 м от Stress Core, активируется критический
    разлом (100% сход)
  - Если попадание приходится в радиус 1.2–2.5 м, обрушивается только 40% массы (оглушение
    титана, но не гибель)
  - Спящие жесткие тела ледника мгновенно переводятся в активные (wakeUp) с импульсом
    разлета от центра
  - 'При контакте лавины с хитбоксом титана суммируется кинетическая масса: при достижении
    500 тонн титан падает и засыпается снегом'
  state:
  - IsFractured (bool)
  - ActiveRigidBodiesCount (int)
  - AccumulatedMassOnTitan (float, tons)
  - 'TitanBuriedState (enum: Free, Staggered, Buried)'
  interactions: Взаимодействует с TitanPacingSystem для перевода титана в состояние
    падения и с GameStateStore для фиксации победы.
  feedback: Оглушительный кристаллический треск, раскол полигональной сетки, спавн
    объемного фронта снежной пыли, непрерывная вибрация камеры.
  edge_cases:
  - Титан успел пройти зону обвала — лавина сходит за его спиной, вызывая поражение
    по таймингу
  - Осколки застревают в скале — принудительный импульс гравитации через 0.5 с для
    очистки заторов
- name: Система искусственного интеллекта и поступи титана (TitanPacingSystem)
  purpose: Контроль движения, анимации и пространственного тайминга ледяного титана
    по дну каньона.
  input: Сплайн маршрута по дну ущелья, базовая скорость движения (4.5 м/с), состояние
    здоровья ледников.
  rules:
  - Титан движется строго по заранее размеченному маршруту ущелья к перевалу заставы
  - Каждый шаг титана сотрясает землю в радиусе 1000 м с амплитудой, зависящей от
    дистанции до стрелка
  - При частичном обвале ледника титан переходит в фазу оглушения (Stagger) на 6 секунд,
    замедляясь на 80%
  - При достижении финального триггера перевала титан наносит сокрушительный удар
    по заставе, вызывая поражение
  state:
  - CurrentPathProgress (0.0 - 1.0)
  - TitanPosition (Vector3)
  - 'TitanMovementState (enum: Walking, Staggered, Crushed, Breached)'
  - DistanceToBreach (meters)
  interactions: Передает координаты ног и тела в звуковой модуль для шагов и в AvalanchePhysicsSystem
    для проверки коллизий с лавиной.
  feedback: Низкочастотный глухой удар в сабвуфере при каждом шаге, сброс снежных
    шапок с близлежащих елей, угрожающий рев при приближении к заставе.
  edge_cases:
  - Падение титана на краю зоны обвала — ragdoll-физика утягивает модель вниз по склону
    в бездну
- name: Система кинематографичной рапид-камеры (BulletCamDirectorSystem)
  purpose: Режиссура замедленного полета пули и эффектного ракурса разрушения скалы.
  input: Триггер успешного выстрела, текущая траектория пули, координаты точки попадания.
  rules:
  - При попадании в критическую зону активируется замедление времени (TimeScale =
    0.08)
  - 'Камера плавно перемещается за пулю на расстояние 1.5 м сбоку-сзади (Offset: [-0.5,
    0.2, -1.5])'
  - За 5 метров до ледника камера обгоняет пулю и разворачивается в ракурс 'наезд
    спереди-сбоку' на точку раскола
  - После детонации камера поднимается на верхний общий план (Cinematic Aerial View)
    для демонстрации масштаба лавины
  state:
  - IsBulletCamActive (bool)
  - CurrentTimeScale (float)
  - 'DirectorCameraPhase (enum: FollowBullet, ImpendingImpact, AvalancheOverview,
    ReturnToFPS)'
  interactions: Временно перехватывает управление у основной FPS-камеры и управляет
    глобальным FixedDeltaTime физики.
  feedback: Эффект размытия движения (Motion Blur), свист рассекаемого морозного воздуха,
    динамическое виньетирование.
  edge_cases:
  - Игрок нажал пропуск (клик) — мгновенный возврат к нормальной скорости времени
    и показ финала лавины
core_design:
  signature_moment: Снайпер на 47-й секунде перевала замечает, как 30-метровый ледяной
    титан вступает в зону ущелья 'Зев Мороза'. Ветер пульсирует с порывами 7.5 м/с
    влево. Дозорный смещается на 6 метров по карнизу, огибая ледяной сталагмит, ложится
    на упор, задерживает дыхание на 3.2 секунде (пульс 72 уд/мин, идеальная стабилизация
    сетки). Выстрел! Камера в рапиде (0.15x) следует за 12.7-мм бронебойной пулей,
    преодолевающей 620 метров сквозь снежный вихрь. Пуля вонзается точно в ультрамариновое
    кристаллическое ядро напряжения (Stress Core) нависающего глетчера. Беззвучная
    микропауза 0.2 с — затем ядро взрывается сапфировой ударной волной, сеть трещин
    рассекает ледник, и 1.2 миллиона тонн физического снега и 40-тонных монолитов
    с громоподобным инфразвуковым ревом обрушиваются прямо на замахнувшегося титана,
    погребая его в бездне ущелья в 15 метрах от рубежа заставы.
  genre_template_rejected: 'Отвергается шаблон классического мобильного снайперского
    тира с полоской здоровья босса (Boss HP Bar) и отстрелом уязвимых ''красных зон''
    на теле врага, а также шаблон случайных карточек улучшений (Rogue-lite Card Pick).

    Почему отвергаем:

    1. Стрельба по телу титана обесценивает масштаб угрозы — винтовочная пуля физически
    не может нанести урон 30-метровой ходячей ледниковой массе. Вместо ковыряния HP
    игрок использует стихию и окружающую среду (Environmental Hazard As Weapon).

    2. Карточки случайных баффов разрушают атмосферу сурового снайперского симулятора-головоломки,
    где исход зависит от расчета баллистики, чтения ветра и понимания механики хрупкости
    льда, а не от выпавшего случайного ''+15% к урону огнем''.'
  what_makes_it_different: 'В отличие от традиционных снайперских игр (Sniper Elite,
    Hitman Sniper), где цель — живая мишень, здесь мишень — статико-динамическая геологическая
    система напряжения льда. Победа достигается не попаданием в движущуюся голову
    врага, а сложным двойным расчетом: баллистическим вычислением траектории пули
    с поправкой на штормовой ветер на 600+ м и кинематическим расчетом тайминга схода
    лавины под шаг и инерцию титана. Окружающая среда — это единственный инструмент
    уничтожения, где каждый ледник просчитывается как физическая система разрушаемых
    тел на Rapier3D.'
  micro_loop:
  - step: Чтение флюгеров и расчет ветра
    player_action: Осмотр анемометрических флажков на скалах и вихрей снега в ущелье
      через бинокль/оптику
    game_response: Флажки отклоняются на угол 28 градусов, частицы бурана сносятся
      влево со скоростью 6.2 м/с
    decision: Рассчитать горизонтальную поправку по сетке Mil-Dot (3.5 деления вправо)
      или подождать спада порыва ветра
    duration: 4–8 с
  - step: Позиционирование на карнизе
    player_action: Перемещение влево/вправо по обледенелому карнизу клавишами A/D
      или свайпом
    game_response: Смещение угла обзора открывает скрытый за скалой кристаллический
      штифт ледника, звук хруста наста под кошками
    decision: Выбрать точку упора с максимальным обзором двух связанных ледников ценой
      сужения сектора отхода
    duration: 3–5 с
  - step: Вход в оптику и контроль дыхания
    player_action: Зажатие кнопки задержки дыхания (Shift / виртуальная кнопка легких)
    game_response: Оптический зум увеличивается до 16x, прицельная сетка замирает,
      звук глухого сердцебиения нарастает, виньетка сужается
    decision: Произвести спуск в идеальном окне 1.5–3.5 с до наступления кислородного
      голодания и критического тремора
    duration: 2–4 с
  - step: Спуск курка и полет пули
    player_action: Клик ЛКМ / тап по спусковому крючку
    game_response: Глухой винтовочный выстрел с эхом по каньону, активация кинематографичной
      рапид-камеры (Bullet-Cam), пуля преодолевает дистанцию с аэродинамическим сносом
    decision: 'Оценить попадание: детонация Stress Core либо рикошет/промах, требующий
      экстренной перезарядки'
    duration: 1.5–3 с
  - step: Физический каскад и оценка эффекта
    player_action: Наблюдение за распространением трещины и сходом лавинной массы
    game_response: Сапфировое свечение раскола, обрушение 40-тонных глыб на Rapier3D,
      деформация траектории титана или его погребение
    decision: Если массы лавины недостаточно (<80%), немедленно готовить второй выстрел
      по нижнему ледяному клину
    duration: 4–6 с
  meso_loop:
  - step: Тактическая рекогносцировка перевала
    player_action: Анализ топографии перевала, расположения 2–3 ледников, скорости
      шага титана и таймера рубежа (90 с)
    game_response: Маркировка дистанций до секторов ущелья (450 м, 620 м, 780 м),
      отображение пульсаций ветрового фронта
    decision: 'Определить тактику: одиночный сверхточный обвал главного ледника или
      двухэтапный каскадный подрыв'
    duration: 10–15 с
  - step: Первая фаза перехвата
    player_action: Занятие позиции на карнизе, выстрел по первичному ледяному клину
      для замедления титана
    game_response: Обрушение ледяных сталактитов перед титаном, монстр спотыкается,
      теряя скорость на 40% на 8 секунд
    decision: Использовать выигранное время для смещения на дальний край карниза ради
      чистого угла по главному глетчеру
    duration: 15–25 с
  - step: Кульминационный выстрел в критический узел
    player_action: Выверенный выстрел в ядро напряжения нависающего ледника в момент
      входа титана в точку невозврата
    game_response: Полный гравитационный коллапс ледникового козырька, лавина объемом
      1.2 млн тонн сметает титана в бездну
    decision: Контролировать остаток боекомплекта (1 патрон) на случай выживания титана
      с ледяным щитом
    duration: 10–20 с
  - step: Оценка чистоты контракта перевала
    player_action: Просмотр финального отчета перевала и начисление наград
    game_response: 'Подсчет очков: точность попадания (мм от центра ядра), сохраненные
      патроны, процент лавинной массы, дистанция до рубежа'
    decision: Перейти к следующему перевалу или переиграть для получения знака мастера
      'Ледяной Призрак' (3 звезды)
    duration: 5–10 с
  macro_loop:
  - step: Выбор контракта на карте Ледяного Хребта
    player_action: Выбор следующего перевала из 15 секторов на топографической карте
      заставы
    game_response: 'Брифинг: сводка погоды (шторм/буран), тип титана (Броненосный,
      Колосс-Маятник), дистанция (до 850 м)'
    decision: Выбрать тип снаряжения (тяжелый вольфрамовый патрон .50 BMG с низким
      сносом или бронебойно-зажигательный с термоударом)
    duration: 15–30 с
  - step: Прохождение серии перевалов сектора
    player_action: Последовательное выполнение 3–5 снайперских контрактов в секторе
      с нарастающей сложностью бурана
    game_response: Разблокировка новых скальных позиций, появление сложных многослойных
      ледников и маятниковых разломов
    decision: Адаптировать стиль стрельбы под усиливающийся боковой шквал (до 14 м/с)
    duration: 5–10 мин
  - step: Модернизация снаряжения в Арсенале Дозора
    player_action: Инвестирование кристаллов вечной мерзлоты (награда за чистые контракты)
      в улучшение снаряжения
    game_response: Установка оптического прицела с подсветкой Mil-Dot, термоизоляция
      ствола винтовки, кошки с улучшенным сцеплением
    decision: Прокачать дальность оптического зума (до 24x) или емкость легких стрелка
      (+1.5 с задержки дыхания)
    duration: 1–2 мин
  - step: Открытие элитных испытаний Око Бурана
    player_action: 'Запуск модификаторов сложности: ночной буран, нулевая видимость
      без тепловизора, один патрон на перевал'
    game_response: Увеличение множителя очков в 3 раза, глобальная таблица рекордов
      лидеров арктического дозора
    decision: Бороться за мировой топ по минимальному времени спуска и максимальной
      массе обрушенного льда
    duration: 5–15 мин
  loop_diagram: "+-------------------------------------------------------------------------------+\n\
    |                       МАКРО-ПЕТЛЯ (АРКТИЧЕСКИЙ ДОЗОР)                      \
    \   |\n|  [Карта Хребта] -> [Выбор снаряжения] -> [15 Перевалов] -> [Арсенал /\
    \ Моды]   |\n+---------------------------------------+---------------------------------------+\n\
    \                                        |\n                                 \
    \       v\n+-------------------------------------------------------------------------------+\n\
    |                        МЕЗО-ПЕТЛЯ (СНАЙПЕРСКИЙ ПЕРЕВАЛ)                    \
    \   |\n|  [Рекогносцировка] -> [Занятие позиции] -> [Выстрел по клину] -> [Коллапс]\
    \    |\n+---------------------------------------+---------------------------------------+\n\
    \                                        |\n                                 \
    \       v\n+-------------------------------------------------------------------------------+\n\
    |                      МИКРО-ПЕТЛЯ (ВЫСТРЕЛ И ОБРУШЕНИЕ)                     \
    \   |\n|                                                                     \
    \          |\n|   +-----------------------+      Смещение      +--------------------------+\
    \   |\n|   | 1. Оценка ветра       | -----------------> | 2. Позиция на карнизе\
    \    |   |\n|   |    и дистанции        |                    |    (обход слепых\
    \ зон)    |   |\n|   +-----------------------+                    +--------------------------+\
    \   |\n|               ^                                             |       \
    \          |\n|     Промах    |                                             |\
    \ Вход в оптику   |\n|   (перезарядка)|                                      \
    \      v                 |\n|   +-----------------------+                    +--------------------------+\
    \   |\n|   | 5. Оценка обвала      |                    | 3. Задержка дыхания\
    \      |   |\n|   |    и массы лавины     |                    |    (окно стабилизации)\
    \   |   |\n|   +-----------------------+                    +--------------------------+\
    \   |\n|               ^                                             |       \
    \          |\n|               |         Bullet-Cam / Рапид                  |\
    \ Спуск курка     |\n|               +---------------------------------------------+\
    \                 |\n|                                                       \
    \                        |\n+-------------------------------------------------------------------------------+"
  tension_curve: 'Кривая пилообразного напряжения с экспоненциальным финалом (Sawtooth
    with Exponential Climax):

    0:00–0:15 (Напряжение 20%): Спокойная аналитическая фаза. Величественный эмбиент
    ледяного ущелья, далекий низкий гул шагов титана. Стрелок замеряет ветер и планирует
    геометрию обвала.

    0:15–0:40 (Напряжение 45% -> 60%): Титан приближается к опасной зоне. Ветер начинает
    пульсировать рывками (3->8 м/с). Стрелок перемещается по карнизу, ища угол, секунды
    тают.

    0:40–0:65 (Напряжение 80%): Титан входит в зону поражения под ледником. Сердцебиение
    стрелка учащается, титан заносит лапу для разрушения первой опоры. Окно для выстрела
    сжимается до 5 секунд.

    0:65–0:72 (Напряжение 100% -> Пик): Задержка дыхания. Звуки ветра затихают, остается
    только биение пульса и звон кристаллов. Выстрел! Камера летит в рапиде (0.15x)
    — время почти замерло.

    0:72–0:80 (Катарсис и спад до 10%): Ослепительный ультрамариновый раскол, грохот
    обрушения 1.2 млн тонн льда, титан сметен в пропасть. Напряжение сменяется торжествующей
    тишиной и звоном оседающей ледяной пыли.

    0:80–0:90: Окно отчета, начисление очков, подготовка к следующему перевалу.'
  core_formulas:
  - 'Горизонтальное смещение пули от ветра: Deflection_X = K_wind * Wind_Speed * (Distance
    / 100)^1.35 * sin(Wind_Angle), где K_wind = 0.042 м/(м/с) (коэффициент парусности
    12.7-мм пули), Wind_Speed в м/с (от 0.0 до 15.0 м/с), Distance в метрах (300–850
    м), Wind_Angle — угол направления ветра к линии огня в радианах.'
  - 'Гравитационное провисание пули: Drop_Y = 0.5 * G_bullet * (Distance / V_muzzle)^2,
    где G_bullet = 9.81 м/с², V_muzzle = 880 м/с (начальная скорость тяжелой пули),
    дистанция Distance от 300 до 850 м. На 600 м провисание составляет ровно 2.28
    метра (3.8 деления Mil-Dot).'
  - 'Радиус тремора при дыхании: Tremor_Radius = Base_Tremor * (1.0 - Breath_Hold_Factor)
    * (1.0 + Heart_Rate_Penalty), где Base_Tremor = 0.035 рад, Breath_Hold_Factor
    = 1.0 (при удержании дыхания в окне 0–4.0 с), после 4.0 с нарастает штраф Heart_Rate_Penalty
    = ((Time_Hold - 4.0) / 1.5)^2 * 3.5.'
  - 'Объем обрушенной массы лавины: Avalanche_Mass = Base_Glacier_Mass * (1.0 - Hit_Offset
    / Core_Radius)^2 * Structural_Integrity_Multiplier, где Base_Glacier_Mass = 1
    200 000 тонн, Core_Radius = 0.45 м (радиус ядра напряжения), Hit_Offset — расстояние
    от центра ядра до точки попадания в метрах. При Hit_Offset > Core_Radius обвал
    не происходит (рикошет).'
  - 'Кинетический урон лавины титану: Impact_Force = Avalanche_Mass * Avalanche_Velocity
    * cos(Slope_Angle), где Avalanche_Velocity = 35 м/с (скорость фронта лавины),
    Slope_Angle = 52 градуса. Если Impact_Force >= Titan_Stability_Threshold (28 000
    кН), титан сбивается с ног и уносится в пропасть.'
  - 'Итоговый счет чистоты контракта: Contract_Score = (Base_Pass_Score * Star_Multiplier)
    + (Unspent_Ammo * 2500) + max(0, (Time_Limit - Elapsed_Time) * 120) + (Mass_Percentage
    >= 95 ? 5000 : 0) - (Tremor_Shots_Count * 1000).'
  run_progression:
  - 'Увеличение дистанции до критических ядер ледников: от 350 м на Перевале 1 до
    820 м на Перевале 15, увеличивающее время полета пули с 0.40 с до 0.93 с и требующее
    более строгого расчета упреждения.'
  - 'Эволюция ветровых условий: от штиля (0 м/с) до штормовых турбулентных порывов
    (12–15 м/с с частотой смены направления каждые 3.5 секунды), требующих выжидания
    затишья.'
  - 'Усложнение геометрии ледников: появление экранированных ядер напряжения, требующих
    двойного каскадного обстрела (сначала сбить навесной ледяной щит, затем взорвать
    несущий козырек).'
  - 'Повышение скорости и адаптивности титана: титаны поздних перевалов ускоряют шаг
    при звуке выстрела на 30% и закрывают уязвимые зоны ледяной дланью при шуме лавины.'
  meta_progression:
  - 'Калибровка винтовочной оптики ''Северный Дозор'': открывает переключаемую кратность
    зума (8x -> 16x -> 24x) и тонкую сетку Mil-Dot с дальномерной шкалой тысячных.'
  - 'Дыхательная гимнастика дозорного (Емкость легких): увеличивает базовое окно стабильной
    задержки дыхания с 3.5 с до 5.5 с и снижает пост-тремор на 40%.'
  - 'Термодинамические вольфрамовые пули: увеличивают эффективный радиус детонации
    ядра напряжения (Core_Radius) с 0.35 м до 0.55 м за счет кинетического гидроудара.'
  - 'Арктические кошки ''Стальной коготь'': увеличивают скорость перемещения по скользкому
    карнизу с 2.2 м/с до 3.8 м/с и снижают раскачку оружия во время ходьбы.'
  - 'Анемометрический триплекс: выводит точные диегетические данные о скорости бокового
    ветра непосредственно в нижний квадрант прицельной сетки.'
  mechanics:
  - name: Баллистический расчет ветра и дистанции (Wind & Range Ballistics)
    role_in_loop: Ядро баллистического расчета (главный двигатель сложности и источник
      точности)
    player_decision: Какую поправку по сетке Mil-Dot взять по вертикали (на провисание
      гравитации) и горизонтали (на порыв ветра), и стрелять ли сейчас или переждать
      пик шквала
    input_mapping: Мышь/правый стик — плавное наведение прицела; Колесо мыши/щипок
      пальцами — регулировка кратности оптики (8x–16x–24x); Пробел/тап по сетке —
      активация дальномерной шкалы
    states:
    - STATE_IDLE_AIMING (свободное наведение, учет базовых колебаний)
    - STATE_READING_ENVIRONMENT (анализ ветра по флажкам и частицам)
    - STATE_BALLISTIC_FLIGHT (пуля в воздухе, расчет сноса в реальном времени)
    - STATE_IMPACT_RESOLVED (фиксация попадания в лед/ядро или промаха)
    parameters:
    - name: Начальная скорость пули V_muzzle
      value: 880 м/с
      tuning_note: Если увеличить до 1200 м/с — поправка на ветер и гравитацию станет
        незаметной, игра превратится в примитивный хитскан-тир; если уменьшить до
        500 м/с — полет пули станет слишком медленным (более 1.5 с), исчезнет ощущение
        тяжелого снайперского патрона.
    - name: Базовый коэффициент сноса ветром K_wind
      value: 0.042 м/(м/с)
      tuning_note: Если снизить ниже 0.02 — игрок перестанет обращать внимание на
        флажки и буран; если поднять выше 0.08 — малейший порыв ветра выбросит пулю
        за пределы экрана, сделав стрельбу лотереей.
    - name: Максимальная скорость порыва ветра
      value: 14.5 м/с
      tuning_note: При превышении 18 м/с прицельная сетка не поместит поправку без
        потери цели из вида; при значении ниже 6 м/с отсутствует вызов адаптации.
    - name: Частота флуктуации ветра
      value: 0.28 Гц (смена фазы каждые 3.5 с)
      tuning_note: Если смена чаще 0.5 Гц — игрок физически не успевает сопоставить
        поправку и выстрелить; если реже 0.1 Гц — ветер станет статичным множителем
        без динамики тайминга.
    feedback_layers:
    - 'Визуал/VFX: Диегетические красные шелковые флажки на скалах колышутся и вытягиваются
      по вектору ветра; плотные струи снежной поземки и завихрения вихрей показывают
      слои турбулентности; при полете пули виден плотный конденсационный след (инверсионный
      след) и трассирующий дымный шлейф.'
    - 'Звук (Web Audio): Низкочастотный свист ветра с динамическим полосовым фильтром
      (Bandpass Filter), меняющим частоту среза при усилении шквала; глухой щелчок
      барабанчиков поправок прицела; хлесткий сверхзвуковой щелчок (Supersonic Crack)
      и раскатистое эхо выстрела в ущелье с задержкой 1.2 с.'
    - 'Камера (импульс/зум): Плавный переход в режим прицела с эффектом параллакса
      оптической линзы; тяжелый вертикальный импульс отдачи винтовки (угол +4.2 градуса)
      с мягким возвратом за 0.45 с; микро-дрожание камеры при сильных порывах шквального
      ветра.'
    - 'UI/Тактильность: Гравированная сетка Mil-Dot с микро-делениями (тысячные);
      тактильная вибрация мобильного устройства (короткий резкий импульс 45 мс) при
      совпадении перекрестия с расчетной точкой упреждения; легкий пульсирующий виброотклик
      на порывы ветра.'
    failure_mode: Пуля уходит в сторону от ядра напряжения ледника и врезается в монолитную
      скалу с фонтаном ледяной крошки. Игрок видит точку попадания по облаку ледяной
      пыли и звуку сухого рикошета, понимая, что не учел горизонтальный порыв ветра
      (недобор или перебор делений по Mil-Dot).
    mastery_curve: Новичок на 30-й секунде стреляет по центру перекрестия и удивляется,
      почему пуля просела на 2 метра вниз и ушла влево; эксперт на 10-м забеге мгновенно
      считывает наклон флажка, в уме берет упреждение в 4.5 мила по горизонтали и
      3.8 мила по вертикали и поражает ядро с первого выстрела за 3.2 секунды после
      входа в прицел.
    counterplay: Ветер на поздних перевалах дует слоями с разным направлением в низине
      ущелья и на вершине ледника (Wind Shear), создавая нелинейную S-образную траекторию
      сноса пули.
    synergies:
    - Связана с 'Фокусировкой и задержкой дыхания' (без задержки дыхания тремор не
      позволяет удержать вычисленную поправку на сетке)
    - Связана с 'Позиционированием на карнизе' (смена позиции меняет угол атаки к
      ветру и дистанцию до ядра)
    why_unique: Вместо аркадных светящихся дуг траектории игрок ориентируется исключительно
      на реалистичные физические индикаторы окружения (флажки, снежные вихри, звук
      ветра) и честную баллистическую сетку оптического прицела.
    pseudocode: "function tickBallistics(bullet, dt, windVector):\n    let gravityVector\
      \ = Vector3(0, -9.81, 0)\n    let airResistance = bullet.velocity.clone().multiplyScalar(-0.00015\
      \ * bullet.velocity.length())\n    let windForce = windVector.clone().multiplyScalar(0.042)\n\
      \    bullet.velocity.add((gravityVector.add(airResistance).add(windForce)).multiplyScalar(dt))\n\
      \    bullet.position.add(bullet.velocity.clone().multiplyScalar(dt))\n    if\
      \ raycastHit(bullet.lastPos, bullet.position, out hit):\n        resolveImpact(hit)\n\
      \        destroyBullet(bullet)"
  - name: Фокусировка и задержка дыхания (Breath Hold & Focus Stabilization)
    role_in_loop: Тормоз хаоса и источник тактического риска (окно идеальной точности
      с жестким лимитом времени)
    player_decision: В какой момент активировать задержку дыхания — начать ли сразу
      при грубой наводке или включить в последние 2 секунды перед шагом титана под
      козырек
    input_mapping: 'Клавиатура: зажатие Shift или ПКМ; Тачскрин: удержание круглой
      кнопки с иконкой легких в правом нижнем углу экрана'
    states:
    - STATE_NORMAL_BREATHING (естественное синусоидальное покачивание сетки)
    - STATE_HOLDING_BREATH (полный штиль сетки, легкий Focus Zoom, отсчет шкалы легких)
    - STATE_HYPOXIA_TREMOR (критический тремор рук, спазм легких, учащенный пульс
      180 уд/мин)
    - STATE_RECOVERY (восстановление дыхания в течение 2.5 с)
    parameters:
    - name: Базовая длительность задержки дыхания T_breath_max
      value: 4.5 с
      tuning_note: Если увеличить до 8.0 с — пропадает напряжение и тайм-менеджмент
        прицеливания; если снизить до 2.0 с — игрок не успеет совместить марку Mil-Dot
        с движущейся целью.
    - name: Амплитуда базового дыхательного колебания A_sway
      value: 0.024 рад
      tuning_note: При превышении 0.05 рад прицел невозможно удержать на скале даже
        для грубой наводки; при снижении ниже 0.01 рад отпадает необходимость в самой
        механике задержки.
    - name: Время восстановления дыхания T_recovery
      value: 2.5 с
      tuning_note: Если сделать дольше 4 с — темп игры падает до фрустрации при промахе;
        если меньше 1 с — игрок будет спамить задержку непрерывно.
    - name: Множитель приближения фокусировки Focus_Zoom
      value: 1.25x
      tuning_note: При значении выше 1.5x теряется обзор окружения и ветра; при значении
        1.0x отсутствует приятный визуальный фокус на цели.
    feedback_layers:
    - 'Визуал/VFX: Края экрана плавно затемняются морозной виньеткой с ледяными узорами
      (инеем); поле зрения (FOV) сужается на 15%, создавая туннельный фокус; при гипоксии
      экран пульсирует красным размытием (Chromatic Aberration).'
    - 'Звук (Web Audio): Окружающий рев бурана мгновенно приглушается низкочастотным
      фильтром (Low-Pass Filter 400 Гц); на передний план выходит кристально четкий
      звук глухого биения сердца (60 -> 120 уд/мин); в момент выдоха — протяжный свистящий
      звук морозного пара.'
    - 'Камера (импульс/зум): Плавная остановка синусоидального покачивания камеры
      (Lissajous curve sway -> 0 за 0.18 с); мягкий оптический наплыв камеры на 12%;
      при срыве дыхания — резкий хаотичный рывок камеры вверх-вправо на 1.8 градуса.'
    - 'UI/Тактильность: Круговой полупрозрачный индикатор объема легких вокруг прицельной
      марки, тающий от голубого к тревожному янтарному цвету; ритмичная виброотдача
      смартфона в такт ударам сердца (пульс).'
    failure_mode: Игрок передерживает кнопку дыхания дольше 4.5 с. Легкие спазмируют,
      прицел резко подбрасывает вверх, стрелок судорожно хватает ртом воздух, а перекрестие
      начинает хаотично дрожать с удвоенной амплитудой в течение 2.5 секунд, делая
      точный выстрел невозможным.
    mastery_curve: Новичок зажимает дыхание сразу при входе в прицел, тратит все 4.5
      с на поиск ледника и стреляет в фазе гипоксии с промахом; мастер наводит перекрестие
      в обычном режиме, нажимает дыхание ровно на 1.2 секунды в момент идеального
      шага титана, совершает выстрел и отпускает кнопку без штрафа.
    counterplay: Шаги титана вызывают сотрясение земли, которое передается на скалу
      и накладывает дополнительные высокочастотные микро-вибрации на прицел даже во
      время идеальной задержки дыхания.
    synergies:
    - Связана с 'Кинетическим расколом ледника' (позволяет поразить субпиксельное
      ядро Stress Core размером 0.45 м на дистанции 700 м)
    - Связана с 'Баллистическим расчетом ветра' (стабилизирует сетку для точного отсчета
      рисок Mil-Dot)
    why_unique: Механика дыхания диегетически объединена с оптическим зумом и звуковым
      фильтром глухоты, превращая момент прицеливания в медитативный, кинематографичный
      саспенс перед взрывным спуском.
    pseudocode: "function tickBreath(player, dt, isHoldingBreath):\n    if isHoldingBreath\
      \ and player.breathStamina > 0:\n        player.breathStamina -= dt\n      \
      \  player.aimTremor = lerp(player.aimTremor, 0.0, dt * 10.0)\n        applyAudioLowPass(400.0)\n\
      \    else if isHoldingBreath and player.breathStamina <= 0:\n        player.isHypoxic\
      \ = true\n        player.aimTremor = player.baseTremor * 3.5\n        triggerCameraJerk()\n\
      \    else:\n        player.breathStamina = min(player.maxStamina, player.breathStamina\
      \ + dt * 1.8)\n        player.aimTremor = calculateNaturalSway(player.time)"
  - name: Позиционирование на карнизе (Ledge Repositioning & Angle Cleansing)
    role_in_loop: Тактический двигатель угла обзора и источник позиционного преимущества
    player_decision: Сместиться ли на левый фланг карниза ради открытого ракурса на
      скрытое ядро верхнего глетчера, рискуя попасть под лобовой порыв бурана, или
      остаться в укрытии с ограниченным сектором обстрела
    input_mapping: 'Клавиатура: клавиши A / D (движение влево/вправо по карнизу),
      клавиша C (присед/упор на сошки); Тачскрин: горизонтальный слайдер перемещения
      в левой нижней зоне экрана'
    states:
    - STATE_STAND_MOVING (перемещение по обледенелому уступу, повышенная раскачка)
    - STATE_PRONE_BIPOD (фиксация на сошках на позиции, снижение тремора на 60%, ограничение
      подвижности)
    - STATE_SLIPPAGE_WARNING (критический наклон на краю уступа при обледенении)
    parameters:
    - name: Длина доступного карниза L_ledge
      value: 18.0 м
      tuning_note: Если сделать больше 35 м — игрок теряет темп в долгих перебежках;
        если сделать меньше 6 м — теряется вариативность углов обхода слепых зон ледника.
    - name: Скорость перемещения стрелка V_strafe
      value: 2.8 м/с
      tuning_note: При скорости выше 5 м/с стрелок скользит как в аркадном шутере,
        теряя вес снаряжения; ниже 1.5 м/с — невозможно успеть сменить позицию под
        шаг титана.
    - name: Бонус стабильности сошек Bipod_Stability_Bonus
      value: 0.60 (снижение колебаний на 60%)
      tuning_note: При значении 1.0 пропадает необходимость в задержке дыхания; при
        значении ниже 0.2 упор не имеет тактического смысла.
    - name: Время раскладывания сошек T_deploy
      value: 0.8 с
      tuning_note: Более 1.5 с делает смену стойки слишком вязкой; менее 0.3 с не
        дает ощущения тяжелого снайперского комплекса.
    feedback_layers:
    - 'Визуал/VFX: Игрок видит выступающие скальные пики и ледяные колонны, закрывающие
      разные сектора ущелья в перспективе (Parallax Occlusion); снежные хлопья срываются
      с карниза из-под ног; при упоре на сошки со скалы осыпается мелкая ледяная крошка.'
    - 'Звук (Web Audio): Хруст плотного наста и металлический скрежет альпинистских
      кошек по обледенелому камню; глухой металлический лязг раскрывающихся титановых
      сошек винтовки; шелест ветрозащитного маскхалата стрелка.'
    - 'Камера (импульс/зум): Мягкое вертикальное покачивание шага при ходьбе; плавное
      опускание камеры на 0.4 м при переходе в положение ''упор на сошки''; динамическое
      изменение угла обзора ущелья, раскрывающее глубину каньона.'
    - 'UI/Тактильность: Индикатор текущей позиции на карнизе (мини-линейка уступа);
      иконка статуса ''Сошки установлены (Стабильность +60%)''; легкая тактильная
      отдача при шагах стрелка.'
    failure_mode: 'Стрелок пытается вести огонь из слепой зоны: пуля попадает в непреодолимый
      скальный массив перед ледником. Игра показывает рикошет от гранитной породы
      с искрами и серым дымом вместо ледяного сапфирового скола, давая понять, что
      ракурс выбран неверно.'
    mastery_curve: Новичок стоит на стартовой точке и стреляет по экранированному
      льду; мастер в первые 4 секунды перевала совершает рывок на 8 метров влево,
      мгновенно падает на сошки в идеальном створе между двумя пиками и получает прямую
      линию огня на оба ядра напряжения.
    counterplay: 'Обледенение краев карниза: крайние 2 метра уступа скользкие, при
      длительном нахождении на них стрелок теряет баланс, сбивая прицел.'
    synergies:
    - Связана с 'Баллистическим расчетом ветра' (смещение вдоль карниза меняет угол
      обстрела относительно ветрового коридора ущелья)
    - Связана с 'Синхронизацией шага титана' (позиция выбирается так, чтобы точка
      обвала совпала с вектором движения монстра)
    why_unique: Вместо статичной снайперской 'будки' игрок активно управляет геометрией
      линии огня в реальном 3D-пространстве уступа, превращая выбор позиции в пространственную
      головоломку.
    pseudocode: "function tickPositioning(player, inputAxis, isBipodPressed, dt):\n\
      \    if isBipodPressed:\n        player.isDeployed = !player.isDeployed\n  \
      \      player.deployTimer = 0.8\n    if !player.isDeployed:\n        player.ledgePosition\
      \ = clamp(player.ledgePosition + inputAxis * 2.8 * dt, 0.0, 18.0)\n        updateCameraPosition(player.ledgePosition)\n\
      \    else:\n        player.swayMultiplier = 0.4\n        lockMovement()"
  - name: Кинетический раскол ледника и цепная лавина (Glacial Fracture & Avalanche
      Chain)
    role_in_loop: Источник финальной победы и зрелищной награды (кульминационный физический
      взрыв)
    player_decision: В какое именно ядро напряжения (Stress Core) стрелять — вызвать
      ли немедленный малый обвал для оглушения титана или накопить резонанс для мега-лавины
      1.2 млн тонн
    input_mapping: ЛКМ / виртуальная кнопка спуска курка (Fire) в момент точного наведения
      на Stress Core
    states:
    - STATE_INTACT_GLACIER (монолитный ледник под гравитационным напряжением)
    - STATE_CORE_DETONATION (пробитие ядра, ультрамариновое свечение, микропауза 0.2
      с)
    - STATE_FRACTURE_PROPAGATION (распространение сети процедурных трещин по ледяному
      массиву)
    - STATE_RAPIER_PHYSICS_COLLAPSE (активация десятков твердых тел Rapier3D и объемного
      потока снега)
    - STATE_TITAN_ENGULFED (физическое столкновение лавины с хитбоксом титана и его
      опрокидывание)
    parameters:
    - name: Радиус критического ядра напряжения R_core
      value: 0.45 м
      tuning_note: Если сделать больше 1.0 м — попадание станет тривиальным без необходимости
        задержки дыхания; если меньше 0.2 м — попадание на 700 м превратится в раздражающий
        пиксель-хантинг.
    - name: Количество физических монолитов обвала N_bodies
      value: 48 твердых тел (Rapier3D Convex Hulls)
      tuning_note: Более 80 тел вызовет просадку FPS на мобильных устройствах ниже
        30 кадров; менее 20 тел сделает лавину неестественно жидкой и плоской.
    - name: Скорость распространения трещины V_fracture
      value: 320 м/с
      tuning_note: Если трещина расходится мгновенно — теряется кинематографичность
        разрушения; если медленнее 100 м/с — лавина не успеет сойти до выхода титана
        из зоны.
    - name: Порог массы для погребения титана M_threshold
      value: 80% (960 000 тонн)
      tuning_note: При пороге 50% титан погибает от малейшего скола; при пороге 99%
        любая погрешность попадания приводит к непрохождению уровня.
    feedback_layers:
    - 'Визуал/VFX: Ослепительная ультрамариновая вспышка в точке входа пули; ветвящиеся
      неоново-сапфировые трещины с эмиссионным свечением раскалывают 100-метровый
      ледник; объемный каскад из 48 физических глыб и сотен тысяч инстансированных
      частиц снежной пудры (GPU Instanced Snow Particles), заполняющих все ущелье.'
    - 'Звук (Web Audio): Высокочастотный хрустальный звон лопающегося под давлением
      кристаллического льда; суб-басовый дроп (Sub-Bass Drop 35 Гц) в момент обрыва
      несущей плиты; нарастающий громоподобный гул катящейся снежной лавины с реверберацией
      каньона.'
    - 'Камера (импульс/зум): Рапид-камера слежения за пулей (Bullet-Cam) с замедлением
      до 0.15x; динамический переход на общий план каньона в момент удара лавины;
      сотрясение экрана (Screen Shake) с амплитудой 0.8 и затуханием 3.5 с при ударе
      снежной массы о дно каньона.'
    - 'UI/Тактильность: Всплывающий бейдж ''КРИТИЧЕСКИЙ РАСКОЛ: 100% МАССЫ''; мощная
      продолжительная виброотдача (Heavy Haptic Rumble 1.2 с) на мобильном устройстве
      при падении ледниковой плиты.'
    failure_mode: Пуля попадает в ледник на 0.6 м левее ядра напряжения (вне радиуса
      R_core). Откалывается лишь мелкий ледяной сталактит (15% массы), который падает
      позади титана. Титан издает торжествующий рык и продолжает движение к заставе.
    mastery_curve: Новичок сбивает ледник с запозданием, когда титан уже наполовину
      прошел опасный сектор, в результате чего лавина задевает лишь спину монстра;
      мастер рассчитывает 2.4-секундную задержку схода лавины и обрушивает эпицентр
      миллионной массы точно в момент замаха гиганта.
    counterplay: 'Ледяные титаны старших уровней обладают резонансной броней: если
      обрушить лавину не на них, а перед ними, они используют ледяной таран, чтобы
      расколоть сугроб и пройти сквозь завал.'
    synergies:
    - Связана с 'Баллистикой ветра' (требует ювелирного попадания пули точно в R_core)
    - Связана с 'Синхронизацией шага титана' (успех зависит от совпадения тайминга
      обвала с фазой шага монстра)
    why_unique: Разрушение — это не заготовленная линейная анимация, а честная физическая
      симуляция на Rapier3D, где вес каждой отдельной глыбы и угол склона влияют на
      траекторию и кинетическую силу удара по титану.
    pseudocode: "function resolveImpact(hitPoint, glacier):\n    let distanceToCore\
      \ = hitPoint.distanceTo(glacier.stressCorePosition)\n    if distanceToCore <=\
      \ glacier.coreRadius:\n        triggerBulletCamImpact(hitPoint)\n        glacier.fractureState\
      \ = FRACTURING\n        spawnCrystalShockwave(hitPoint)\n        await delay(200)\n\
      \        activateRapierRigidBodies(glacier.convexChunks)\n        applyExplosiveImpulse(glacier.convexChunks,\
      \ hitPoint, 45000.0)\n        startAvalancheFlow(glacier.massVolume)\n    else:\n\
      \        spawnIceSpallVFX(hitPoint)\n        glacier.minorDamage(10.0)"
  - name: Синхронизация шага титана и акустическое эхо (Titan Stride & Echo Pacing)
    role_in_loop: Источник внешнего давления времени и динамический таймер перевала
    player_decision: Стрелять ли в текущую фазу шага титана (опирается на правую ногу)
      или подождать следующего шага через 4.2 секунды, рискуя приближением монстра
      к финишному рубежу
    input_mapping: Визуальное наблюдение за ритмом поступи титана через оптику; Зажатие
      кнопки свистка/ложного эхо-выстрела (клавиша E / иконка эхо-патрона) для кратковременной
      остановки монстра
    states:
    - STATE_TITAN_STRIDING (размеренный шаг со скоростью 4.5 м/с)
    - STATE_TITAN_STUMBLE (кратковременная потеря равновесия от падения ледяных сосулек,
      -50% скорости на 3 с)
    - STATE_TITAN_ENRAGED_SPRINT (ускорение до 7.0 м/с на последних 50 метрах до рубежа)
    - STATE_TITAN_BURIED (полное обездвиживание и погружение в снежный завал)
    parameters:
    - name: Интервал между шагами титана T_stride
      value: 4.2 с
      tuning_note: Если сделать шаг быстрее 2.5 с — монстр кажется легковесным и суетливым;
        если медленнее 6.0 с — динамика уровня провисает.
    - name: Длина опасной зоны ущелья L_killzone
      value: 32.0 м
      tuning_note: Титан проходит ее ровно за 7.1 секунды (примерно 2 шага). Если
        зона шире 50 м — тайминг выстрела становится тривиальным; если уже 15 м —
        попасть лавиной становится почти невозможно.
    - name: Время схода лавины от выстрела до дна ущелья T_avalanche_drop
      value: 2.4 с
      tuning_note: Игрок обязан брать опережение на 2.4 секунды. Если сход мгновенный
        (0.5 с) — теряется физика падения; если дольше 4 с — расчет упреждения становится
        слишком абстрактным.
    - name: Длительность задержки титана акустическим эхом T_echo_distract
      value: 3.0 с (1 заряд на перевал)
      tuning_note: Позволяет скорректировать ошибку тайминга. Более 5 с обесценивает
        сложность тайминга; менее 1.5 с не дает времени на второй прицельный выстрел.
    feedback_layers:
    - 'Визуал/VFX: При каждом шаге титана с его ледяных плеч осыпается снег, под его
      стопой вздымается облако снежной пыли высотой 15 метров; земля в ущелье сотрясается,
      порождая микро-трещины на льду.'
    - 'Звук (Web Audio): Мощнейший инфразвуковой удар шага (40 Гц), распространяющийся
      с эхом по всему каньону; утробный рев первобытного колосса; пространственный
      3D-звук шагов приближается по панораме.'
    - 'Камера (импульс/зум): Ритмичные вертикальные толчки камеры стрелка синхронно
      с шагами гиганта (Camera Bump 0.015 рад); при прохождении титана вблизи карниза
      — нарастающий рокот с вибрацией экрана.'
    - 'UI/Тактильность: Диегетическая шкала дистанции титана до рубежа заставы на
      перевале (в метрах); предупреждающий пульсирующий красный сигнал ''ОПАСНАЯ БЛИЗОСТЬ:
      50 М''.'
    failure_mode: Игрок стреляет слишком поздно, когда титан уже прошел зону поражения
      ледника. Лавина падает за спиной монстра, отталкивая его ударной волной вперед
      и сокращая оставшуюся дистанцию до заставы на 20 метров.
    mastery_curve: Новичок ориентируется на визуальное положение титана прямо под
      ледником в момент спуска курка (и лавина опаздывает на 2.4 с); мастер нажимает
      спуск, когда титан только поднимает ногу за 12 метров ДО входа в зону поражения,
      добиваясь 100% прямого попадания лавинного ядра.
    counterplay: Титаны на уровнях 10+ умеют ускорять шаг, если слышат грохот надвигающейся
      лавины, требуя от игрока двойного упреждения.
    synergies:
    - Связана с 'Кинетическим расколом ледника' (определяет временное окно, когда
      обрушение приведет к победе)
    - Связана с 'Позиционированием на карнизе' (позволяет наблюдать титана заранее
      до его входа в слепую зону)
    why_unique: Снайпер решает не статическую задачу 'попади в точку', а четырехмерную
      кинематическую задачу пересечения траектории пули, схода физической лавины и
      инерционного движения 30-метрового гиганта.
    pseudocode: "function tickTitan(titan, dt, avalancheTriggered):\n    if !titan.isBuried:\n\
      \        titan.position.z += titan.currentSpeed * dt\n        titan.stepTimer\
      \ += dt\n        if titan.stepTimer >= 4.2:\n            titan.stepTimer = 0.0\n\
      \            triggerFootstepAudioAndCameraShake(titan.position)\n        if\
      \ avalancheTriggered and inKillzone(titan.position):\n            let avalancheProgress\
      \ = getAvalancheDropProgress()\n            if avalancheProgress >= 1.0:\n \
      \               titan.isBuried = true\n                triggerTitanDefeatSequence(titan)"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 75
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - description: Three.js сцены, шейдеры льда/снега, пост-процессинг прицела (Scope
      Overlay), партиклы бурана
    layer_name: PresentationLayer
  - description: 'WASM-модуль Rapier3D: пулинг твердых тел ледника, коллизии с рельефом
      каньона и титаном'
    layer_name: PhysicsSimulationLayer
  - description: FSM состояний матча, система баллистики ветра, ИИ движения титана,
      учет побед/поражений
    layer_name: GameLogicLayer
  - description: 'Интеграция @playgama/bridge: реклама, лидерборды, облачные сохранения,
      адаптация под экраны'
    layer_name: PlatformBridgeLayer
  modules:
  - file: src/systems/WindBallisticsSystem.ts
    module_name: WindBallisticsModule
    responsibility: Расчет баллистической кривой пули, интерполяция ветра, генерация
      трассера
  - file: src/systems/AvalanchePhysicsSystem.ts
    module_name: AvalanchePhysicsModule
    responsibility: Управление разрушением ледников в Rapier3D, детекция коллизий
      лавины с титаном
  - file: src/controllers/FPSController.ts
    module_name: FPSControllerModule
    responsibility: Обработка ввода (мышь/тач), задержка дыхания, зум оптики, перемещение
      по карнизу
  - file: src/cinematics/BulletCamDirector.ts
    module_name: BulletCamDirectorModule
    responsibility: Управление динамической камерой рапида и замедлением времени (TimeScale)
  - file: src/audio/AudioManager.ts
    module_name: AudioManagerModule
    responsibility: Воспроизведение звуков выстрелов, ветра, треска льда и низкочастотных
      фильтров через Howler.js
  - file: src/services/PlaygamaService.ts
    module_name: PlaygamaServiceModule
    responsibility: Синхронизация с SDK Playgama Bridge (сохранения, лидерборды, показ
      Interstitial и Rewarded)
monetization:
  strategy_summary: 'Этичная гибридная монетизация без элементов Pay-to-Win: добровольные
    Rewarded Video для дополнительного шанса/метео-сканирования и косметические внутриигровые
    покупки скинов винтовок и сеток оптики.'
  rewarded_placements:
  - id: second_chance_ammo
    name: Дополнительный патрон 'Золотой Калибр'
    benefit: +1 бронебойный патрон при исчерпании боезапаса на перевале
    cooldown_or_limit: 1 раз за попытку
    trigger_moment: Экран надвигающегося поражения при 0 патронов
  - id: wind_drone_scan
    name: Метео-сканирование ущелья
    benefit: Точная проекция ветрового сноса на сетке прицела на 15 секунд
    cooldown_or_limit: 1 раз за уровень
    trigger_moment: Кнопка на экране подготовки к выстрелу
  - id: double_mastery_reward
    name: Удвоение знаков дозорного
    benefit: x2 к заработанным очкам мастерства за успешный контракт
    cooldown_or_limit: Без ограничений
    trigger_moment: Экран победы
  interstitial_placements:
  - trigger_event: Завершение снайперского контракта (после победы или поражения)
    cooldown_seconds: 90
    conditions: Показывается не чаще чем раз в 90 секунд и не ранее прохождения 2-го
      перевала
  in_app_purchases:
  - sku: pack_nordic_arsenal
    name: Набор 'Арсенал Нордхейма'
    description: 3 уникальных скина винтовок (Северное Сияние, Базальтовый Клык, Ледяной
      Страж) + 5 сеток прицела
    price_tier: tier_2 (199 YAN / $2.99)
    reward: Все премиальные скины навсегда + отключение обязательной рекламы (No Ads)
  - sku: no_ads_forever
    name: Отключение рекламы (No Ads)
    description: Полное отключение межстраничных баннеров и interstitials
    price_tier: tier_1 (99 YAN / $1.49)
    reward: Отключение обязательной рекламы + 500 знаков дозорного
  fairness_rules:
  - 'Никакой платной покупки урона или мгновенной победы: все уровни на 100% проходимы
    благодаря мастерству прицеливания и расчету ветра.'
  - Межстраничная реклама никогда не прерывает процесс прицеливания, задержки дыхания
    или полет пули.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - gamepix
  - web
  initialization_flow:
  - bridge.initialize() на стартовом лоадере
  - Параллельная загрузка ассетов Three.js и инициализация WASM Rapier3D
  - Синхронизация прогресса через bridge.storage.get()
  - Старт главного меню с проверкой звукового контекста
  cloud_save_keys:
  - unlocked_passes
  - pass_stars
  - mastery_tokens
  - equipped_rifle_skin
  - equipped_reticle
  - sound_settings
  leaderboards:
  - leaderboard_mastery_score (Общий счет мастерства стрелков)
  - leaderboard_fastest_takedown (Самая быстрая ликвидация титана)
  ads_integration:
    banner_supported: false
    interstitial_cooldown: 90
    rewarded_retry: true
  lifecycle_hooks:
  - visibilitychange -> bridge.game.onVisibilityChange (пауза физики и звука)
  - game_win -> bridge.leaderboard.setScore
  - ad_start -> Howler.mute(true), ad_end -> Howler.mute(false)
art:
  style_name: Стилизованный морозный реализм (Stylized Arctic Realism) с контрастными
    холодными сине-стальными тенями и теплыми закатными лучами
  camera_perspective: Вид от первого лица (FPS) с плавным переходом в оптический прицел
    (Scope View) и динамической кинематографичной Bullet-Cam от третьего лица слежения
  camera_fov: 65
  camera_pitch_angle: -5
  environment_theme: 'Древнее высокогорное ледниковое ущелье: циклопические ледяные
    стены с трещинами, базальтовые черные утесы, заснеженное дно каньона, клубящаяся
    пурга и морозная дымка'
  character_proportions: Исполинский ледяной голем-титан высотой 45 метров, сложенный
    из глыб векового голубого льда и вмерзших базальтовых валунов, с тяжелой сокрушительной
    поступью
  lighting_setup: 'Низкое закатное арктическое солнце (Directional Light warm orange
    #FFAA55) с длинными драматичными тенями, заполняющий холодный небесный свет (Hemisphere
    Light sky #88CCFF, ground #223344) и туман ущелья (Exponential Fog #99BBDD)'
  color_palette:
    basalt_rock: '#1B263B'
