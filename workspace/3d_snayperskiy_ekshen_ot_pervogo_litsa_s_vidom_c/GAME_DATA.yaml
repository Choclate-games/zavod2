    biggest_risk: 'Игрок может устать выжидать нужного тайминга бури или потерять
      интерес при медленном темпе скрытности. Решение: динамический цикл порывов бурана
      каждые 4–6 секунд и визуальный пульсирующий индикатор акустического шума на
      HUD.'
    production_cost: Средний. Требует шейдера тепловизора, конусов зрения элементалей
      и аудио-синхронизатора Web Audio.
    knowledge_hints:
