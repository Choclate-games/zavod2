    одного идеального выстрела на суетливую беготню между укреплениями и контроль
    секторов. Это размывает ключевое обещание игроку («похоронить чудовище одним выстрелом
    лавины») и превращает медитативную снайперскую дуэль в аркадный позиционный шутер
    с полосками прочности опор.'
  - 'D3 («Охотник на Морозе: Скрытный Разлом»): добавление стелса с конусами обнаружения
    и ритмической синхронизацией выстрелов с порывами бурана создает лишний барьер
    ожидания в короткой браузерной сессии. Игрок вынужден выжидать тайминги вместо
