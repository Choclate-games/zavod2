raw_prompt: 3D снайперский экшен от первого лица с видом через оптический прицел на
  гигантское горное ущелье. Игрок наводит прицел мышью или касанием, учитывает поправку
  на боковой ветер, задерживает дыхание кнопкой и стреляет по уязвимым точкам на ледяных
  скалах. На экране виден заснеженный каньон с идущим по дну ледяным гигантом, порывы
  бурана и полет пули в рапиде. Главная цель каждого уровня — одним точным выстрелом
  расколоть ледник и похоронить чудовище под гигантской снежной лавиной.
title: 'Лавинный снайпер: Эхо Каньона'
slug: 3d_snayperskiy_ekshen_ot_pervogo_litsa_s_vidom_c
genre: 3D Снайперский Экшен от первого лица
subgenre: Физический Снайпер-Пазл / Окружающий FPS-Симулятор Разрушений
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web)
orientation: landscape
target_audience: Мужчины и женщины 16–45 лет, любители снайперских симуляторов, физических
  головоломок с масштабными разрушениями и кинематографичного экшена, ценящие короткие
  напряженные сессии с высокой ценой одного решения.
core_loop: Оценка позиции и ветра (10–15 с) -> Выбор точки стрельбы на карнизе (5–10
  с) -> Вход в оптику и задержка дыхания (5–8 с) -> Выверенный спуск курка (1 с) ->
  Кинематографичный Bullet-Cam и сход лавины на гиганта (5–8 с) -> Расчет точности,
  награда за чистоту контракта и переход к новому перевалу.
hook: Момент, когда раскаленная пуля пробивает ключевой кристаллический штифт нависающего
  ледника в 600 метрах, каньон озаряется ультрамариновой трещиной, время замедляется
  в рапиде, и миллион тонн физического снега с громоподобным ревом смывают замахнувшегося
  ледяного титана в бездну.
player_fantasy: Ты — элитный арктический стрелок-дозорный на неприступном ледяном
  карнизе. В твоих руках тяжелая крупнокалиберная винтовка, а перед глазами — километровое
  заснеженное ущелье, по которому шагает первобытный титан. Ты не ковыряешь исполина
  пулями — ты повелеваешь силами стихии, обрушивая ледники одним безупречным расчетом
  траектории и ветра.
session_model: 'Одиночный снайперский контракт на 1 заснеженном перевале длительностью
  60–90 секунд: 1 идущий к границе титан, 1–3 патрона крупного калибра, динамический
  ветер и единственная возможность спровоцировать обвал до пересечения монстром контрольного
  рубежа.'
unique_value_proposition: 'Первый мобильный WebGL снайперский FPS, где враг побеждается
  не стрельбой по хитбоксам монстра, а физическим разрушением макро-окружения: расчет
  баллистики ветра и раскол ледника на сотни кинетических обломков на движке Rapier3D
  с эффектной Bullet-Cam.'
vision: 'Превратить классический снайперский жанр в медитативный и одновременно адреналиновый
  триллер о превосходстве интеллекта и меткости над колоссальной грубой силой: игрок
  чувствует морозное дыхание высоты, читает траекторию ветра по клубящемуся бурану
  и испытывает катарсис от сокрушительной лавины, вызванной одним нажатием на спуск.'
elevator_pitch: '«Лавинный снайпер: Эхо Каньона» — кинематографичный 3D FPS снайперский
  экшен, где один точный выстрел с учетом ветра и задержки дыхания раскалывает вековой
  ледник и хоронит исполинского титана под сокрушительной лавиной физических обломков.'
win_conditions: Попадание в критический узел разлома ледника (Stress Core), вызвавшее
  сход лавины объемом не менее 80% массы и полное погребение ледяного титана до того,
  как он достигнет заставы на перевале (дистанция до рубежа > 0 м).
lose_conditions: Истечение лимита времени (90 секунд), пересечение титаном рубежа
  перевала или исчерпание боекомплекта (3 патрона) без активации критического обвала
  ледника.
progression_summary: 'Линейно-сессионная прогрессия по 15 уникальным перевалам: от
  простых статичных ледников без ветра до многоуровневых разломов со штормовым пульсирующим
  ветром, движущимися ледяными маятниками и титанами с защитными броневыми наростами,
  требующими двойного каскадного обвала.'
difficulty_curve: 'Пологая адаптивная кривая: Уровни 1–3 обучают базовому прицеливанию
  и стрельбе по крупным трещинам без ветра (попадание 90%); Уровни 4–7 вводят боковой
  ветер (3–8 м/с) и тайминг шага титана под зону обвала; Уровни 8–12 добавляют порывистый
  шквальный ветер, дистанцию 700+ м и необходимость выбора позиции на карнизе для
  преодоления слепых зон; Уровни 13–15 требуют ювелирного каскадного обвала двух ледников
  за 60 секунд.'
