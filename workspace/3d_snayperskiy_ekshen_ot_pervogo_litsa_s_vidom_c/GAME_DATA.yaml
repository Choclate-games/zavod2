  - path: stack/rapier3d.md
    role: core
    reason: Предоставляет высокопроизводительную WASM-физику твердых тел для симуляции
      кинетического удара пули, раскола ледника и массы лавины.
  - path: threejs/game_map_and_world_design.md
    role: core
    reason: Задает правила процедурной генерации протяженного заснеженного каньона,
