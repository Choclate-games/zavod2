_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: 3d_snayperskiy_ekshen_ot_pervogo_litsa_s_vidom_c
performance:
  target_fps: 60
  max_draw_calls: 75
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: 'Одиночный снайперский контракт на 1 заснеженном перевале длительностью 60–90
    секунд: 1 идущий к границе титан, 1–3 патрона крупного калибра, динамический ветер
    и единственная возможность спровоцировать обвал до пересечения монстром контрольного
    рубежа.'
  win: Попадание в критический узел разлома ледника (Stress Core), вызвавшее сход
    лавины объемом не менее 80% массы и полное погребение ледяного титана до того,
    как он достигнет заставы на перевале (дистанция до рубежа > 0 м).
  lose: Истечение лимита времени (90 секунд), пересечение титаном рубежа перевала
    или исчерпание боекомплекта (3 патрона) без активации критического обвала ледника.
  difficulty_curve: 'Пологая адаптивная кривая: Уровни 1–3 обучают базовому прицеливанию
    и стрельбе по крупным трещинам без ветра (попадание 90%); Уровни 4–7 вводят боковой
    ветер (3–8 м/с) и тайминг шага титана под зону обвала; Уровни 8–12 добавляют порывистый
    шквальный ветер, дистанцию 700+ м и необходимость выбора позиции на карнизе для
    преодоления слепых зон; Уровни 13–15 требуют ювелирного каскадного обвала двух
    ледников за 60 секунд.'
mechanics:
  ballisticheskiy_raschet_vetra_i_distantsii_wind_ra:
    name: Баллистический расчет ветра и дистанции (Wind & Range Ballistics)
    parameters:
      nachalnaya_skorost_puli_v_muzzle:
        value: 880 м/с
        note: Если увеличить до 1200 м/с — поправка на ветер и гравитацию станет незаметной,
          игра превратится в примитивный хитскан-тир; если уменьшить до 500 м/с —
          полет пули станет слишком медленным (более 1.5 с), исчезнет ощущение тяжелого
          снайперского патрона.
      bazovyy_koeffitsient_snosa_vetrom_k_wind:
        value: 0.042 м/(м/с)
        note: Если снизить ниже 0.02 — игрок перестанет обращать внимание на флажки
          и буран; если поднять выше 0.08 — малейший порыв ветра выбросит пулю за
          пределы экрана, сделав стрельбу лотереей.
      maksimalnaya_skorost_poryva_vetra:
        value: 14.5 м/с
        note: При превышении 18 м/с прицельная сетка не поместит поправку без потери
          цели из вида; при значении ниже 6 м/с отсутствует вызов адаптации.
      chastota_fluktuatsii_vetra:
        value: 0.28 Гц (смена фазы каждые 3.5 с)
        note: Если смена чаще 0.5 Гц — игрок физически не успевает сопоставить поправку
          и выстрелить; если реже 0.1 Гц — ветер станет статичным множителем без динамики
          тайминга.
  fokusirovka_i_zaderzhka_dyhaniya_breath_hold_focus:
    name: Фокусировка и задержка дыхания (Breath Hold & Focus Stabilization)
    parameters:
      bazovaya_dlitelnost_zaderzhki_dyhaniya_t_breath_ma:
        value: 4.5 с
        note: Если увеличить до 8.0 с — пропадает напряжение и тайм-менеджмент прицеливания;
          если снизить до 2.0 с — игрок не успеет совместить марку Mil-Dot с движущейся
          целью.
      amplituda_bazovogo_dyhatelnogo_kolebaniya_a_sway:
        value: 0.024 рад
        note: При превышении 0.05 рад прицел невозможно удержать на скале даже для
          грубой наводки; при снижении ниже 0.01 рад отпадает необходимость в самой
          механике задержки.
      vremya_vosstanovleniya_dyhaniya_t_recovery:
        value: 2.5 с
        note: Если сделать дольше 4 с — темп игры падает до фрустрации при промахе;
          если меньше 1 с — игрок будет спамить задержку непрерывно.
      mnozhitel_priblizheniya_fokusirovki_focus_zoom:
        value: 1.25x
        note: При значении выше 1.5x теряется обзор окружения и ветра; при значении
          1.0x отсутствует приятный визуальный фокус на цели.
  pozitsionirovanie_na_karnize_ledge_repositioning_a:
    name: Позиционирование на карнизе (Ledge Repositioning & Angle Cleansing)
    parameters:
      dlina_dostupnogo_karniza_l_ledge:
        value: 18.0 м
        note: Если сделать больше 35 м — игрок теряет темп в долгих перебежках; если
          сделать меньше 6 м — теряется вариативность углов обхода слепых зон ледника.
      skorost_peremescheniya_strelka_v_strafe:
        value: 2.8 м/с
        note: При скорости выше 5 м/с стрелок скользит как в аркадном шутере, теряя
          вес снаряжения; ниже 1.5 м/с — невозможно успеть сменить позицию под шаг
          титана.
      bonus_stabilnosti_soshek_bipod_stability_bonus:
        value: 0.60 (снижение колебаний на 60%)
        note: При значении 1.0 пропадает необходимость в задержке дыхания; при значении
          ниже 0.2 упор не имеет тактического смысла.
      vremya_raskladyvaniya_soshek_t_deploy:
        value: 0.8 с
        note: Более 1.5 с делает смену стойки слишком вязкой; менее 0.3 с не дает
          ощущения тяжелого снайперского комплекса.
  kineticheskiy_raskol_lednika_i_tsepnaya_lavina_gla:
    name: Кинетический раскол ледника и цепная лавина (Glacial Fracture & Avalanche
      Chain)
    parameters:
      radius_kriticheskogo_yadra_napryazheniya_r_core:
        value: 0.45 м
        note: Если сделать больше 1.0 м — попадание станет тривиальным без необходимости
          задержки дыхания; если меньше 0.2 м — попадание на 700 м превратится в раздражающий
          пиксель-хантинг.
      kolichestvo_fizicheskih_monolitov_obvala_n_bodies:
        value: 48 твердых тел (Rapier3D Convex Hulls)
        note: Более 80 тел вызовет просадку FPS на мобильных устройствах ниже 30 кадров;
          менее 20 тел сделает лавину неестественно жидкой и плоской.
      skorost_rasprostraneniya_treschiny_v_fracture:
        value: 320 м/с
        note: Если трещина расходится мгновенно — теряется кинематографичность разрушения;
          если медленнее 100 м/с — лавина не успеет сойти до выхода титана из зоны.
      porog_massy_dlya_pogrebeniya_titana_m_threshold:
        value: 80% (960 000 тонн)
        note: При пороге 50% титан погибает от малейшего скола; при пороге 99% любая
          погрешность попадания приводит к непрохождению уровня.
  sinhronizatsiya_shaga_titana_i_akusticheskoe_eho_t:
    name: Синхронизация шага титана и акустическое эхо (Titan Stride & Echo Pacing)
    parameters:
      interval_mezhdu_shagami_titana_t_stride:
        value: 4.2 с
        note: Если сделать шаг быстрее 2.5 с — монстр кажется легковесным и суетливым;
          если медленнее 6.0 с — динамика уровня провисает.
      dlina_opasnoy_zony_uschelya_l_killzone:
        value: 32.0 м
        note: Титан проходит ее ровно за 7.1 секунды (примерно 2 шага). Если зона
          шире 50 м — тайминг выстрела становится тривиальным; если уже 15 м — попасть
          лавиной становится почти невозможно.
      vremya_shoda_laviny_ot_vystrela_do_dna_uschelya_t_:
        value: 2.4 с
        note: Игрок обязан брать опережение на 2.4 секунды. Если сход мгновенный (0.5
          с) — теряется физика падения; если дольше 4 с — расчет упреждения становится
          слишком абстрактным.
      dlitelnost_zaderzhki_titana_akusticheskim_ehom_t_e:
        value: 3.0 с (1 заряд на перевал)
        note: Позволяет скорректировать ошибку тайминга. Более 5 с обесценивает сложность
          тайминга; менее 1.5 с не дает времени на второй прицельный выстрел.
