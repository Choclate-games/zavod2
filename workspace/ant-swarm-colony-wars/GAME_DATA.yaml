mobile:
  orientation: landscape
  touch_implementation: PixiJS EventSystem с поддержкой pointerdown, pointermove и
    pointerup, сглаживанием координат через Catmull-Rom сплайны и оптимизацией частоты
    выборки тача.
  safe_area_handling: Автоматические CSS env(safe-area-inset-*) отступы для кнопок
    интерфейса и динамический viewport без обрезки игрового поля.
  performance_throttling:
  - Динамическое снижение разрешения рендера до 0.85x при падении FPS ниже 45
  - Автоматическое объединение дальних частиц в кластеры при популяции свыше 700
  - Отключение вторичных частиц дыма и пыльцы на слабых мобильных устройствах
audio:
  bgm_style: Атмосферный природный эмбиент с органическими перкуссиями, шелестом травы
    и нарастающими ритмичными барабанами в моменты штурма.
  sfx_list:
