raw_prompt: 'Создай стратегию управления роем на PixiJS: физическая симуляция поведения
  500+ частиц-муравьев по векторным линиям феромонов (flow fields), способность муравьев
  сцепляться в живые структуры (мосты через препятствия, таранные сферы), захват вражеских
  муравейников на процедурных микро-уровнях и прокачка видов муравьев (рабочие, солдаты,
  бомбардиры).'
title: 'Муравьиный Рой: Война Колоний'
slug: ant-swarm-colony-wars
genre: Стратегия в реальном времени
subgenre: Тактический симулятор роя с векторным управлением
renderer: pixijs
renderer_reason: User explicitly specified 'pixijs'.
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK Play / Web & Mobile)
orientation: landscape
target_audience: Любители стратегий в реальном времени, микро-менеджмента, физических
  симуляций и динамичных тактических головоломок в возрасте 12-35 лет.
core_loop: Рисование феромонных троп и направление роя -> Формирование живых мостов
  и таранных сфер для преодоления преград -> Штурм и захват вражеских гнезд -> Сбор
  биомассы и феромонов -> Улучшение и эволюция классов муравьев -> Переход к следующему
  уровню.
hook: Рисуй феромонные реки пальцем или мышью и наблюдай, как сотни муравьев мгновенно
  объединяются в гигантские живые физические структуры для сокрушения вражеских цитаделей.
player_fantasy: Вы — сверхразум колонии, управляющий живой стихией из сотен разумных
  насекомых, способных как вода обтекать препятствия и как стальной кулак разрушать
  вражеские муравейники.
session_model: Быстрые тактические уровни по 2-4 минуты с мета-прогрессией колонии
  и эволюционным древом мутаций.
unique_value_proposition: Прямое векторное управление потоками частиц с процедурной
  механикой живых конструкций (Verlet-сцепка муравьев) в ультра-быстрой браузерной
  RTS без лагов.
vision: Создать самую отзывчивую и зрелищную микро-RTS на веб-рынке, сочетающую медитативное
  рисование потоков и глубокую тактику противостояния колоний.
elevator_pitch: Управляйте живой армией из 500+ муравьев! Рисуйте феромонные трассы,
  сцепляйте рабочих в живые мосты над расщелинами, швыряйте бомбардиров в укрепления
  врага и захватывайте всю экосистему на процедурных микро-аренах!
win_conditions: Уничтожение всех маток и захват всех вражеских муравейников на локации.
lose_conditions: Потеря главного муравейника игрока или гибель всей популяции колонии.
progression_summary: 'Сбор биомассы на уровнях открывает ветки эволюции: Рабочие (скорость,
  прочность мостов), Солдаты (урон, плотность построения черепахи), Бомбардиры (радиус
  взрыва, кислотный след).'
difficulty_curve: Плавный ввод базового рисования линий на уровнях 1-3, появление
  препятствий (водные преграды, шипы) на 4-7, столкновение с агрессивными вражескими
  роями и боссами-жуками на 8-15+.
scores:
  fun: 9
  originality: 9
  replayability: 8
  development_cost: 7
  visual_appeal: 9
  mobile_fit: 9
  monetization: 8
  platform_fit: 9
  overall_score: 8.5
  justification: Уникальный и крайне залипательный геймплей на базе flow fields и
    сцепки частиц дает сильный виральный потенциал и отличную конверсию на платформах
    Yandex/Playgama.
references:
- name: World of Goo
  genre: Физическая головоломка
  mechanics:
  - Сцепка живых шариков в мосты и башни
  - Физика натяжения и деформации
  lessons: Физическое соединение живых существ вызывает сильный восторг и вовлечение.
  what_to_avoid: Излишне медленный темп сборки и сложный микроконтроль каждого юнита.
- name: Mushroom Wars 2
  genre: Микро-RTS
  mechanics:
  - Быстрый захват зданий потоками юнитов
  - Контроль пропорций отправки войск
  lessons: Динамичные короткие сессии и четкая индикация численного перевеса идеальны
    для веба.
  what_to_avoid: Нехватка физического взаимодействия с окружением.
- name: Eufloria
  genre: Атмосферная стратегия роя
  mechanics:
  - Перемещение сотен спор между астероидами
  - Органическая эстетика поведения роя
  lessons: Плавное движение роя по векторным линиям создает гипнотический эффект.
  what_to_avoid: Монотонность без ярких боевых кульминаций.
mechanics:
- name: Векторные Феромонные Тропы (Flow Fields)
  category: navigation
  priority: core
  description: Игрок проводит пальцем или курсором по экрану, генерируя градиентное
    векторное поле силы, по которому мгновенно устремляются муравьи выбранного типа.
  player_interaction: Свайп/клик с зажатием для рисования трассы направления движения.
  feedback: Неоновое свечение феромонного следа, частицы испарения, шелестящий звук
    движения роя.
  technical_complexity: Medium
  strengths:
  - Интуитивное управление на тач-экранах
  - Плавное обтекание сотен юнитов без застреваний
  weaknesses:
  - Требуется затухание следа для предотвращения зацикливания роя
- name: Живые Структуры (Verlet Swarm Formations)
  category: physics
  priority: core
  description: При сближении над пропастью или перед укреплением муравьи замыкают
    связи друг с другом, образуя живые переправы или таранные шары.
  player_interaction: Направление роя в интерактивную зону препятствия или кнопка
    активации спец-структуры.
  feedback: Звук хитинового щелчка, натяжение связей между частицами, визуальная вибрация
    структуры.
  technical_complexity: High
  strengths:
  - Невероятная зрелищность и вирусный потенциал
  - Уникальный способ решения пространственных задач
  weaknesses:
  - Потенциальная нестабильность физических связей при перегрузке
- name: Захват и Экспансия Муравейников
  category: combat
  priority: core
  description: Поток муравьев окружает вражеское гнездо, нанося урон гарнизону и конвертируя
    его в собственный спавнер после истощения запасов врага.
  player_interaction: Наведение феромонной тропы на вражеский муравейник.
  feedback: Круговой индикатор захвата, взрыв частиц конфетти из пыльцы при захвате,
    звуковой фанфар победы.
  technical_complexity: Medium
  strengths:
  - Четкая стратегическая цель уровня
  - Быстрая кульминация каждого раунда
  weaknesses:
  - Риск снежного кома (snowballing) при раннем преимуществе
- name: Специализация Каст Муравьев
  category: tactics
  priority: core
  description: 'Переключение между видами муравьев: Рабочие (быстрые, строят мосты),
    Солдаты (высокий урон, защита роя), Бомбардиры (взрывной урон по зданиям).'
  player_interaction: Тап по иконке касты в нижней панели или горячие клавиши 1-2-3.
  feedback: Цветовое переключение интерфейса, изменение размера и силуэтов частиц
    в рое.
  technical_complexity: Low
  strengths:
  - Глубокая тактическая вариативность
  - Основа для долгосрочной прокачки
  weaknesses:
  - Необходимость поддерживать читаемость роя на мелких экранах
gameplay_systems:
- name: Система Векторного Поля и Поведения Роя (Boids Flow System)
  purpose: Обеспечение естественного движения 500+ частиц по алгоритмам Boids (сплочение,
    разделение, выравнивание) с наложением пользовательских феромонов.
  input: Координаты рисования игрока, позиции источников феромонов и препятствий.
  rules:
  - Каждая частица вычисляет вектор скорости на основе сетки векторного поля 32x32
  - Феромонные линии испаряются со скоростью 10% в секунду
  - Муравьи избегают препятствий с помощью Raycast-сенсоров
  state:
  - 'pheromoneGrid: Float32Array'
  - 'swarmPositions: Float32Array'
  - 'swarmVelocities: Float32Array'
  - 'activeForces: Array'
  interactions: Взаимодействует с коллизиями ландшафта и триггерами сцепки.
  feedback: Шлейф из микро-частиц пыльцы, динамическое искривление траекторий.
  edge_cases:
  - Застревание роя в тупиках (решается импульсом рассеивания)
  - Разрыв непрерывной линии феромона при быстром свайпе (решается интерполяцией кривых
    Безье)
- name: Система Процедурной Генерации Микро-Уровней
  purpose: Создание уникальных тактических аренд с реками, пропастями, нейтральными
    и вражескими гнездами.
  input: Номер уровня, модификаторы сложности, биом окружения.
  rules:
  - На каждом уровне гарантирован минимум один путь решения через мост или прямую
    атаку
  - Количество вражеских муравейников масштабируется от 1 до 4
  - Ресурсы биомассы распределяются равномерно по ключевым точкам
  state:
  - 'levelSeed: number'
  - 'nestsList: Array'
  - 'obstaclesPolygonList: Array'
  - 'resourceNodes: Array'
  interactions: Инициализирует коллизии и начальные популяции перед стартом раунда.
  feedback: Плавное появление уровня через эффект прорастания травы и раскрытия земли.
  edge_cases:
  - Непроходимая генерация ландшафта (верифицируется A* валидатором перед запуском)
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: pixijs
  renderer_version: ^8.0.0
  physics_engine: Matter.js (^0.19.0)
  state_manager: Reactive EventBus / NanoStores
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 25
  max_triangles_or_sprites: 2000
  bundle_size_budget_mb: 3.2
  layers:
  - name: BackgroundLayer
    type: TilingSprite & Static Mesh (Трава, почва, кора деревьев)
  - name: PheromoneFieldLayer
    type: RenderTexture с эффектом диффузии и блюра
  - name: StructuresLayer
    type: Graphics & Mesh (Живые мосты, цепи и сферы)
  - name: AntSwarmLayer
    type: PixiJS ParticleContainer (500+ инстансированных спрайтов муравьев)
  - name: VFXAndPropsLayer
    type: Container (Взрывы, брызги кислоты, пыльца, маркеры)
  - name: UILayer
    type: DOM/Pixi UI (Кнопки каст, индикаторы захвата, таймеры)
  modules:
  - name: SwarmEngine
    path: src/core/SwarmEngine.ts
    description: Вычисление симуляции частиц, Boids и Verlet-сцепки
  - name: FlowFieldGrid
    path: src/core/FlowFieldGrid.ts
    description: Сетка феромонных векторов и расчет затухания
  - name: LevelGenerator
    path: src/level/LevelGenerator.ts
    description: Процедурная генерация карт и валидация путей
  - name: BridgeManager
    path: src/platform/BridgeManager.ts
    description: Интеграция с Playgama Bridge SDK
monetization:
  strategy_summary: 'Мягкая гибридная модель: ненавязчивая реклама между уровнями
    с кулдауном, ценные Rewarded-видео за мгновенное подкрепление роя и x2 биомассу,
    а также IAP-наборы мутаций и скинов.'
  rewarded_placements:
  - id: rewarded_instant_swarm
    name: Королевское Подкрепление
    benefit: Мгновенный призыв +150 элитных солдат во время критической фазы боя.
    cooldown_or_limit: 1 раз за уровень
    trigger_moment: При падении численности роя игрока ниже 20%.
  - id: rewarded_double_biomass
    name: Удвоение Биомассы
    benefit: Умножает собранную за уровень биомассу на 2 для быстрой прокачки.
    cooldown_or_limit: Без ограничений
    trigger_moment: Экран победы в конце уровня.
  - id: rewarded_super_bombardier
    name: Мега-Бомбардир
    benefit: Призыв огромного муравья-титана, уничтожающего любые стены с одного удара.
    cooldown_or_limit: 2 раза за игровую сессию
    trigger_moment: Перед началом сложного уровня с боссом.
  interstitial_placements:
  - trigger_event: level_complete
    cooldown_seconds: 90
    conditions: Показывается только начиная с 3-го уровня и не чаще 1 раза в 90 секунд.
  - trigger_event: restart_level
    cooldown_seconds: 120
    conditions: Показывается при повторном поражении на уровне.
  in_app_purchases:
  - sku: no_ads_permanent
    name: Золотая Пчелиная Матка (Отключение рекламы)
    description: Навсегда отключает межуровневую рекламу и дает постоянный бонус +25%
      к приросту муравьев.
    price_tier: Tier 2 ($1.99 / 179 YAN)
    reward: no_ads + 1.25x spawn rate
  - sku: starter_mutation_pack
    name: 'Набор Эволюции: Кислотный Шторм'
    description: 5000 биомассы и эксклюзивный некро-скин для касты Бомбардиров.
    price_tier: Tier 1 ($0.99 / 99 YAN)
    reward: 5000 biomass + Necro Skin
  fairness_rules:
  - Все уровни на 100% проходимы без доната и просмотра рекламы.
  - Реклама никогда не прерывает активный бой и фазу рисования линий.
  - Таймер кулдауна межстраничной рекламы сбрасывается при просмотре Rewarded Video.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - ok
  - crazygames
  - gamepix
  - web
  initialization_flow:
  - bridge.initialize() при старте загрузчика
  - bridge.platform.getLanguage() для авто-локализации (ru/en)
  - bridge.storage.get() для загрузки прогресса прокачки и уровня
  - bridge.advertisement.showBanner() в безопасных зонах меню
  cloud_save_keys:
  - ant_player_level
  - ant_biomass_balance
  - ant_upgrades_workers
  - ant_upgrades_soldiers
  - ant_upgrades_bombers
  - ant_unlocked_skins
  - ant_sound_settings
  leaderboards:
  - high_score_levels_cleared
  - fastest_colony_domination
  ads_integration:
    banner_enabled: true
    interstitial_cooldown: 90
    rewarded_placement_tracking: true
  lifecycle_hooks:
  - bridge.game.on('visibilitychange', handleAudioAndPause)
  - bridge.advertisement.on('interstitial_state_changed', handleAdMute)
