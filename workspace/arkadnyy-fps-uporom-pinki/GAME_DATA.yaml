gameplay_systems:
- name: Система Перемещения и Физического Контроля
  purpose: Обеспечить четкое и отзывчивое управление с учетом инерции и столкновений.
  input: Плавающий виртуальный джойстик (мобильные) или WASD/Стрелки (ПК).
  rules:
  - Скорость масштабируется параметрами маневренности и массы.
  - Коллизии с препятствиями рассчитываются через физический движок с упругим отскоком.
  - При потере управления включается автоматическая стабилизация.
  state:
  - IDLE
  - MOVING
  - DRIFTING
  - IMPACT
  - RECOVERING
  interactions: Взаимодействует с физическими телами врагов, препятствиями и дропами
    наград.
  feedback: Следы на поверхности, частицы пыли, звуки мотора/шагов, динамический наклон
    камеры.
  edge_cases:
  - При застревании в геометрии объект мягко телепортируется в ближайшую свободную
    точку.
- name: Боевая Система и Расчет Урона
  purpose: Обработка ударов, тарана, хитбоксов, расчета брони и эффектов отдачи.
  input: Кнопки атаки, нитро, спец-способностей.
  rules:
  - Итоговый Урон = (БазовыйУрон * ФакторСкорости + БонусСилы) * (1 - СнижениеБроней).
  - Критические удары наносят 2.0x урона при атаке в уязвимые зоны.
  - Тяжелые попадания вызывают 40мс хит-стоп замедление времени.
  state:
  - READY
  - ATTACKING
  - HITSTOP
  - COOLDOWN
  interactions: Триггеры коллизий проверяют пересечения с хитбоксами противников.
  feedback: Заморозка кадра (40мс), фонтан искр/частиц, всплывающие цифры урона.
  edge_cases:
  - Одновременные встречные удары вызывают взаимное физическое отталкивание.
core_design:
  signature_moment: Выбивание с разбега ногой тяжелой двери, которая сносит двух автоматчиков
    вглубь комнаты, подхват в воздухе выпавшего из их рук дробовика, выстрел в летящую
    бочку и добивающий пинок горящего огнетушителя прямо в лоб бронированному боссу-пулемётчику.
  genre_template_rejected: 'Отказ от позиционной стрельбы из статичных укрытий и врагов-губок
    с полосками здоровья (Hitscan Bullet-Sponge & Cover-Shooter). В игре нет пассивного
    отсиживания за ящиками и унылого зажима гашетки: патроны строго ограничены, любое
    укрытие уничтожается пинком, а каждое тело врага и предмет мебели являются летающим
    физическим оружием массового поражения.'
  what_makes_it_different: Враги, двери и объекты окружения — это основной расходуемый
    боекомплект игрока. Огнестрельное оружие служит детонатором и катализатором инерции,
    а кинетический пинок запускает цепные физические коллизии (Ragdoll Bowling) с
    мгновенным сплэш-уроном о стены.
  micro_loop:
  - step: Сближение и оценка угла
    player_action: Игрок делает спринт-слайд к дверному проему или группе стрелков,
      выравнивая вектор атаки под углом к стене.
    game_response: Увеличивается FOV камеры, звук шагов ускоряется, враги поднимают
      оружие с задержкой реакции 0.35 с.
    decision: Ворваться через дверь с ноги для мгновенного стана или расстрелять бочку
      через окно снаружи.
    duration: 0.8 с
  - step: Кинетический удар / Выстрел
    player_action: Нажатие клавиши пинка (или выстрела из дробовика с близкой дистанции).
    game_response: Мгновенный хитстоп на 0.05 с, цель переходит в режим ragdoll и
      с ускорением 22 м/с отлетает назад, сбивая стоящих позади противников.
    decision: Пнуть тело в стену для краш-урона или направить во взрывоопасный баллон.
    duration: 0.3 с
  - step: Цепная коллизия и перехват лута
    player_action: Игрок ловит в воздухе выбитый из рук врага автомат и нажимает спуск.
    game_response: Тело врага сминается о стену с ударной волной, подхваченное оружие
      делает критический залп без траты собственного боезапаса.
    decision: Сбросить пустое оружие броском во врага или сохранить для прицельного
      выстрела.
    duration: 1.2 с
  - step: Зачистка и перезарядка импульса
    player_action: Добивание оглушенных выживших подкатом и переход к следующей двери.
    game_response: Камера выравнивается, замедление времени прекращается, начисляются
      комбо-очки и восстанавливается выносливость.
    decision: Собрать выпавшие аптечки или немедленно вломиться в следующую комнату
      для удержания комбо-таймера.
    duration: 1.5 с
  meso_loop:
  - step: Вход в боевой сектор этапа
    player_action: Игрок выбирает один из 2–3 доступных маршрутов (коридор с турелями,
      склад бочек или казарма).
    game_response: Генерация геометрии комнат, расстановка интерактивных преград (двери,
      шкафы, подвесные балки).
    decision: Выбрать маршрут с максимальным количеством физических объектов или короткий
      путь с плотным огнем.
    duration: 2.0 с
  - step: Штурм и зачистка сектора
    player_action: Последовательное преодоление 3–5 связанных комнат через выбивание
      дверей, комбо-пинки и стрельбу.
    game_response: Спавн подкреплений, нарастание темпа музыки, появление элитных
      врагов со щитами.
    decision: Экономить редкие патроны гранатомёта для элиты или расчистить толпу
      на входе.
    duration: 45–90 с
  - step: Выбор тактического модуля
    player_action: Взаимодействие с терминалом снабжения в конце сектора (выбор 1
      из 3 синергетических карт).
    game_response: Экран выбора с демонстрацией эффектов на манекене и пересчетом
      характеристик.
    decision: Усилить кинетику пинка (+ударная волна о стены) или модифицировать дробовик
      (огненный шквал).
    duration: 8.0 с
  macro_loop:
  - step: Подготовка в хабе (Гараж контрабандистов)
    player_action: Трата мета-валюты (Титановые пластины и Гильзы) на постоянные перки
      и разблокировку новых типов обуви/оружия.
    game_response: Визуальное обновление экипировки героя, активация пассивных узлов
      дерева технологий.
    decision: Инвестировать в базовую прочность и скорость слайда или открыть экспериментальный
      ботинок с пьезо-детонатором.
    duration: 30–60 с
  - step: Прохождение забега (5 этажей комплекса)
    player_action: Серия из 5 биомов с нарастающей сложностью, мини-боссами и финальным
      боссом этажа.
    game_response: Динамическая кривая спавна врагов, возрастающий урон окружения,
      дроп редких чертежей.
    decision: Идти на опциональные комнаты испытаний ради удвоенной награды или двигаться
      напрямую к боссу.
    duration: 5–8 мин
  - step: Кульминация забега (Победа / Смерть)
    player_action: Финальная дуэль с меха-боссом либо гибель от перекрестного огня
      при исчерпании HP.
    game_response: 'Экран итоговой статистики: число сплэт-убийств, средняя скорость
      прохождения, начисление валюты.'
    decision: Анализ эффективности собранного билда и выбор фокуса прокачки на следующий
      забег.
    duration: 15 с
  loop_diagram: "+-------------------------------------------------------------------------+\n\
    |                        ХАБ МЕТА-ПРОКАЧКИ                                |\n\
    |  [Улучшение ботинок] <---> [Покупка оружия] <---> [Выбор модификатора]  |\n\
    +-------------------------------------------------------------------------+\n\
    \                                     |\n                                    \
    \ v [Старт забега]\n+-------------------------------------------------------------------------+\n\
    |                        СЕКТОР ЭТАПА (MESO LOOP)                         |\n\
    |                                                                         |\n\
    |   +-----------------------------------------------------------------+   |\n\
    |   |                    КОМНАТНЫЙ ТАКТ (MICRO LOOP)                  |   |\n\
    |   |                                                                 |   |\n\
    |   |  [СПРИНТ / СЛАЙД] ---> [ПИНОК ДВЕРИ / ТАРАН]                    |   |\n\
    |   |         ^                             |                         |   |\n\
    |   |         |                             v                         |   |\n\
    |   |  [СБОР ПАТРОНОВ]            [ПОЛЕТ ТЕЛА ВО ВРАГОВ]              |   |\n\
    |   |         ^                             |                         |   |\n\
    |   |         |                             v                         |   |\n\
    |   |  [ПЕРЕХВАТ ОРУЖИЯ] <--- [СПЛЭТ О СТЕНУ / ВЗРЫВ БОЧКИ]           |   |\n\
    |   +-----------------------------------------------------------------+   |\n\
    |                                    |                                    |\n\
    |                                    v [Комната зачищена]                 |\n\
    |                     [ТАКТИЧЕСКИЙ ВЫБОР 1 ИЗ 3 КАРТ]                     |\n\
    +-------------------------------------------------------------------------+\n\
    \                                     |\n                                    \
    \ v [Завершение 5 секторов]\n+-------------------------------------------------------------------------+\n\
    |                    ФИНАЛЬНЫЙ БОСС / ЭКРАН ИТОГОВ                        |\n\
    |        [Победа / Поражение] ---> [Конвертация очков в Мета-Валюту]      |\n\
    +-------------------------------------------------------------------------+"
  tension_curve: 'Фаза 1: Взрывной пик адреналина (0–2 с) при пробитии двери и внезапном
    входе в комнату. Фаза 2: Высокое напряжение и тактическое жонглирование объектами
    (2–8 с) при уклонении от пуль и расчете траекторий пинков. Фаза 3: Разрядка и
    катарсис (8–12 с) при детонации последних бочек и физическом уничтожении врагов.
    Фаза 4: Полный покой и дофаминовый выбор награды (12–20 с) перед следующим прорывом.'
  core_formulas:
  - 'impact_wall_damage = base_kick_dmg(45) + (ragdoll_velocity_mps^1.45 * enemy_mass_kg(75)
    * 0.08) * (is_wall_splat ? 2.5 : 1.0)'
  - chain_collision_force = initial_kick_impulse(350 Ns) * (0.75 ^ chain_target_index)
  - door_breach_cone_damage = 120 * (1 - (distance_m / 4.0))
  - ammo_scavenge_chance = clamp(0.20 + (current_combo_streak * 0.08), 0.20, 0.85)
  - room_threat_budget = 100 + (run_stage_index * 45) + (player_perk_count * 15)
  run_progression:
  - 'Уровень 1: ''Титановый рант'' — пинок получает +40% к скорости запуска тел и
    пробивает деревянные перегородки насквозь.'
  - 'Уровень 2: ''Гидравлический рикошет'' — тела врагов отскакивают от стен до 2
    раз, нанося 60% урона вторичным целям.'
  - 'Уровень 3: ''Пороховой зацеп'' — перехват оружия в воздухе мгновенно заряжает
    в магазин разрывные патроны с радиусом взрыва 2.2 м.'
  - 'Уровень 4: ''Сверхзвуковой слайд-кик'' — подкат с пинком создает конусную ударную
    волну воздуха на 6 м, сбивающую все летящие пули обратно во врагов.'
  - 'Уровень 5: ''Кинетический коллапс'' — смерть врага от удара о стену вызывает
    детонацию костей и брони с уроном 150 ед по площади 3.5 м.'
  meta_progression:
  - 'Ранг 1: ''Утяжеленные армейские берцы'' — базовый урон пинка увеличен с 45 до
    75 ед, скорость отката снижена с 0.45 с до 0.32 с.'
  - 'Ранг 2: ''Магнитные перчатки контрабандиста'' — радиус автоподхвата выбитого
    из рук оружия увеличен с 1.4 м до 2.8 м.'
  - 'Ранг 3: ''Адреналиновый инжектор'' — при падении здоровья ниже 25% время замедляется
    на 50% на 2.5 с при каждом успешном пинке по врагу.'
  - 'Ранг 4: ''Штурмовой кевларовый экзоскелет'' — игрок получает 2 ед постоянной
    брони, поглощающей 35% урона от осколков собственных бочек и стен.'
  mechanics:
  - name: Кинетический пинок со сплэтом о препятствия (Kinetic Wall-Splat Kick)
    role_in_loop: Главный двигатель темпа, основной инструмент контроля пространства
      и ключевой источник физического урона.
    player_decision: Пнуть ближнего врага прямо в стену для мгновенного гарантированного
      убийства (х2.5 урон) или пнуть его в скопление стрелков позади для массового
      сбивания с ног ценой меньшего урона.
    input_mapping: 'Клавиатура/Мышь: Нажатие [F] или [Mouse4] / Мобильный тач: Кнопка-иконка
      тяжелого ботинка в правой нижней зоне экрана (радиус 48px).'
    states:
    - READY (готов к удару)
    - WINDUP (замах ноги 0.06 с)
    - ACTIVE_HITBOX (активное окно контакта 0.12 с)
    - RECOVERY (возврат ноги 0.18 с)
    - COOLDOWN (восстановление заряда 0.35 с)
    parameters:
    - name: kick_launch_velocity
      value: 22.5 м/с
      tuning_note: Если опустить ниже 16 м/с — враги вяло падают под ноги, пропадает
        ощущение нечеловеческой мощи; если поднять выше 30 м/с — рэгдолл пролетает
        сквозь коллизии стен.
    - name: wall_splat_multiplier
      value: 2.5 x
      tuning_note: Если сделать меньше 1.8х — игроки перестают целиться в углы и стены,
        скатываясь в банальный спам удара в пустоту.
    - name: kick_hitbox_cone_angle
      value: 52.0 градуса
      tuning_note: Если сузить меньше 35° — на мобильных устройствах и при быстром
        вращении камеры начинаются частые раздражающие промахи в упор.
    - name: kick_recovery_duration
      value: 0.18 с
      tuning_note: Если увеличить более 0.30 с — персонаж ощущается неповоротливым
        бревном и получает гарантированный урон от соседних стрелков.
    feedback_layers:
    - 'Визуал/VFX: Радиальное искажение экрана (Radial Screen Warp) вокруг точки удара,
      декали треснувшей штукатурки и разлетающиеся 3D-обломки кирпичей при ударе тела
      о стену.'
    - 'Звук (Web Audio API): Саб-басовый панч (Sub-bass Drop 55 Гц) при ударе ноги
      + сочный хрустящий щелчок сминания брони/костей (комбинация синтеза шума и сэмпла
      разрушения дерева на 1.8 кГц).'
    - 'Камера: Мгновенный импульсный зум FOV (90° -> 83° -> 90° за 0.14 с) с резким
      вертикальным киком вверх на 2.2° и плавным затуханием.'
    - 'UI/Тактильность: Haptic-импульс 45 мс (Heavy Impact), динамический всплывающий
      маркер ''WALL CRUSH x2.5'' ярко-оранжевого цвета над точкой сплэта.'
    failure_mode: 'Промах пинком мимо цели (Whiff): нога рассекает воздух, игрок входит
      в фазу удлиненного восстановления (0.28 с) с потерей скорости бега на 40%, сопровождаясь
      глухим свистом рассекаемого воздуха.'
    mastery_curve: Новичок на 30-й секунде пинает одиночных врагов в упор, стоя на
      месте. Эксперт на 10-м забеге в слайде на скорости 14 м/с рассчитывает рикошет
      одного тела сразу в двух автоматчиков с одновременным впечатыванием третьего
      в стенную турель.
    counterplay: 'Тяжелые щитоносцы и стационарные роботы: пинок без предварительного
      ослабления выстрелом не сдвигает их с места, а отбрасывает самого игрока назад
      на 2.5 м с микро-станом на 0.2 с.'
    synergies:
    - Тактический прорыв дверей (выбитая дверь удваивает импульс пинка)
    - Перехват оружия в воздухе (пинок по врагу гарантированно выбивает его ствол
      по дуге вверх)
    - Сверхзвуковой слайд (скорость подката суммируется со стартовой скоростью полета
      рэгдолла)
    why_unique: 'Вместо стандартного рукопашного удара с фиксированным уроном пинок
      является физическим транслятором кинетической энергии: урон рассчитывается исключительно
      из конечной скорости соударения тела с препятствием.'
    pseudocode: "function updateKickTick(dt, player, enemies, walls, input) {\n  if\
      \ (player.kickCooldown > 0) { player.kickCooldown -= dt; return; }\n  if (!input.kickPressed)\
      \ return;\n  player.kickCooldown = 0.35;\n  let target = findBestConeTarget(player.cameraPos,\
      \ player.forward, 2.4, 52.0, enemies);\n  if (target) {\n    let finalVelocity\
      \ = player.forward.clone().multiplyScalar(22.5 + player.currentSpeed * 0.4);\n\
      \    target.activateRagdollPhysics(finalVelocity);\n    applyHitstop(0.05);\n\
      \    emitScreenWarp(player.cameraPos, 0.14);\n    playSynthPunchAudio(55, 1.8);\n\
      \  } else {\n    player.applySlowdown(0.4, 0.28);\n    playAudioWhiff();\n \
      \ }\n}"
  - name: Штурмовой вылом дверей и баррикад (Tactical Breach-Ram)
    role_in_loop: Источник инициативы, инструмент безопасного вскрытия слепых зон
      и генератор массового контроля на старте комнаты.
    player_decision: Открыть дверь выстрелом издалека для безопасного обзора или выбить
      дверь ногой на полном ходу, превратив створку в летающий таран ценой телепортации
      в центр толпы.
    input_mapping: 'Клавиатура/Мышь: Нажатие [F] / [Space] в движении в упор к двери
      / Мобильный тач: Свайп вперед в сторону дверного проема при активном спринте.'
    states:
    - DOOR_LOCKED (дверь заперта/готова к вылому)
    - IMPACT_FRAME (точка контакта ноги 0.04 с)
    - PROJECTILE_FLIGHT (полет сорванного полотна 0.45 с)
    - SPLINTER_EXPLOSION (разрушение створки на щепки при контакте со стеной/врагом)
    parameters:
    - name: door_flight_speed
      value: 26.0 м/с
      tuning_note: Если сделать ниже 19 м/с — враги в комнате успевают вскинуть стволы
        и нанести игроку урон еще до прилета створки.
    - name: breach_slowdown_scale
      value: 0.3 x
      tuning_note: Если отключить слоумо — игрок не успевает сориентироваться в новой
        комнате при резкой смене ракурса и врезается в мины.
    - name: breach_slowdown_duration
      value: 0.35 с
      tuning_note: Если сделать длиннее 0.6 с — ломается аркадный флоу и игра начинает
        казаться затянутой и вязкой.
    - name: splinter_damage_radius
      value: 3.8 м
      tuning_note: Если уменьшить до 2 м — дверь превращается в одиночный снаряд и
        теряет функцию зачистки дверного фойе.
    feedback_layers:
    - 'Визуал/VFX: Срыв петель с яркими искрами, густое объемное облако древесной
      пыли (threejs particle system), разлет 8–12 физических щепок с собственной коллизией.'
    - 'Звук (Web Audio API): Резкий металлический скрежет срывающихся петель (Metal
      Tear 3.2 кГц) + мощный низкочастотный взрывной удар выбиваемого бруса (120 Гц).'
    - 'Камера: Резкий толчок вперед с кратковременным размытием движения (Motion Blur)
      и расширением угла обзора FOV до 102° на 0.35 с.'
    - 'UI/Тактильность: Двойной виброотклик (25 мс легкий пред-удар + 60 мс жесткий
      пролом), появление крупного стилизованного бейджа ''DOOR BREACH!''.'
    failure_mode: 'Попытка выбить бронированную гермодверь с кодовым замком без специального
      перка: дверь вибрирует, игрок отскакивает назад с оглушением на 0.45 с и потерей
      15 HP от отдачи.'
    mastery_curve: Новичок выбивает дверь стоя на пороге и медленно заходит следом.
      Эксперт пинает дверь в падении под углом 40°, направляя полотно точно в дальнего
      элитного снайпера на втором ярусе комнаты.
    counterplay: 'Враги могут устанавливать растяжки и лазерные мины на обратной стороне
      двери: вылом двери детонирует мину прямо в летящее полотно, требуя от игрока
      своевременного слайда назад.'
    synergies:
    - Кинетический пинок (створка двери усиливает базовый импульс пинка на +30%)
    - Жонглирование арсеналом (враги, убитые дверью, выбрасывают оружие прямо в траекторию
      движения игрока)
    why_unique: Двери в игре — это не статические порталы между комнатами, а тяжелые
      физические метательные снаряды с механикой пробития геометрии и встроенным триггером
      тактического микро-слоумо.
    pseudocode: "function updateDoorBreach(dt, player, door, kickAction) {\n  if (!door.isClosed\
      \ || !kickAction) return;\n  if (getDistance(player.pos, door.pos) <= 1.9 &&\
      \ isFacing(player, door.pos, 40.0)) {\n    door.isClosed = false;\n    let breachVector\
      \ = player.forward.clone().multiplyScalar(26.0);\n    door.launchAsProjectile(breachVector,\
      \ 120.0, 3.8);\n    triggerBreachSlowmo(0.3, 0.35);\n    spawnSplintersAndDust(door.pos,\
      \ player.forward);\n    playBreachAudioLayer();\n  }\n}"
  - name: Акробатический перехват оружия в воздухе (Airborne Disarm & Catch)
    role_in_loop: Главный регулятор расхода боеприпасов, источник тактической награды
      за агрессивный стиль и драйвер непрерывной смены пушек.
    player_decision: Тратить время на перезарядку своего пустого дробовика (1.8 с)
      или пнуть автоматчика, чтобы в воздухе поймать его заряженный ствол и сделать
      мгновенный критический выстрел.
    input_mapping: 'Клавиатура/Мышь: Нажатие [E] или [Mouse1] в момент наведения на
      силуэт летящего оружия / Мобильный тач: Тап по появившемуся золотому кольцу
      захвата вокруг летящего ствола.'
    states:
    - HOLSTERED_ON_ENEMY (оружие в руках врага)
    - DISARMED_AIRBORNE (оружие летит по параболе в воздухе)
    - MAGNET_SNAPPED (оружие захвачено в радиус перехвата)
    - EQUIPPED_TRICKSHOT (оружие в руках игрока с бонусом первого выстрела)
    parameters:
    - name: disarm_pop_height
      value: 2.8 м
      tuning_note: Если сделать ниже 1.8 м — оружие слишком быстро падает на пол,
        игрок не успевает визуально зафиксировать траекторию.
    - name: air_catch_window_duration
      value: 0.95 с
      tuning_note: Если сделать дольше 1.5 с — оружие зависает как в невесомости,
        разрушая ощущение жесткого приземленного экшена.
    - name: trickshot_crit_multiplier
      value: 2.2 x
      tuning_note: Если опустить ниже 1.5х — игроки перестают рисковать ради трюка
        и предпочитают стрелять из базового пистолета.
    - name: catch_magnet_radius
      value: 1.75 м
      tuning_note: Если сузить меньше 1.0 м — на сенсорных экранах попадание в тайминг
        становится почти невыполнимым.
    feedback_layers:
    - 'Визуал/VFX: Вращающийся золотой шлейф (Motion Trail) за летящей пушкой, яркая
      контурная подсветка (Outline Glow) и эффект вспышки при успешном захвате в руку.'
    - 'Звук (Web Audio API): Звонкий металлический щелчок досылания патрона в патронник
      (Gun Cocking 2.4 кГц) + высокий гармонический резонанс (Sine Chord 880 Гц).'
    - 'Камера: Микро-доводка прицела (Magnetic Aim Snap на 5 градусов) в сторону летящего
      оружия в момент нажатия кнопки подхвата.'
    - 'UI/Тактильность: Короткий щелкающий тактильный импульс (Haptic Tick 15 мс),
      появление всплывающей плашки ''TRICKSHOT READY x2.2'' рядом с прицелом.'
    failure_mode: 'Пропуск тайминга перехвата: оружие падает на бетон, магазин выпадает
      и разряжается, а поднятое с пола оружие имеет штраф -50% к точности на первые
      2 секунды.'
    mastery_curve: Новичок поднимает оружие с пола после боя. Эксперт выбивает пинком
      дробовик у первого врага, в прыжке ловит его над головой, делает выстрел x2.2
      в воздухе и кидает пустой корпус во второго врага.
    counterplay: 'Камикадзе и гренадеры: при выбивании их оружия они роняют активированную
      гранату с таймером детонации 0.7 с прямо под ноги игроку.'
    synergies:
    - Кинетический пинок (основной триггер выбивания оружия из рук)
    - Векторное отражение снарядов (бросок пустого оружия блокирует летящие пули)
    why_unique: Механика полностью устраняет скучную паузу на классическую перезарядку
      за укрытием, превращая смену оружия в непрерывный трюковой комбо-элемент прямо
      в гуще боя.
    pseudocode: "function updateAirCatch(dt, player, flyingWeapons, input) {\n  for\
      \ (let weapon of flyingWeapons) {\n    if (!weapon.isAirborne) continue;\n \
      \   let dist = getDistance(player.cameraPos, weapon.pos);\n    if (dist <= 1.75\
      \ && isLookAtTarget(player, weapon.pos, 35.0)) {\n      weapon.showHighlight(true);\n\
      \      if (input.interactPressed || input.firePressed) {\n        player.equipTransientWeapon(weapon.type,\
      \ weapon.loadedAmmo, 2.2);\n        weapon.destroy();\n        playAudioCockingTrill();\n\
      \        triggerHapticTick();\n        break;\n      }\n    }\n  }\n}"
  - name: Векторный редирект взрывных объектов (Hazard Redirection Kick)
    role_in_loop: Источник высокого риска и высокой награды, инструмент борьбы с дальнобойными
      скоплениями и боссами.
    player_decision: Убегать от летящей ракеты/катящейся бочки или пойти на смертельный
      риск, подбежать навстречу и в идеальный тайминг пнуть угрозу обратно во врагов.
    input_mapping: 'Клавиатура/Мышь: Нажатие [F] в окне 0.18 с до соприкосновения
      со снарядом / Мобильный тач: Тап по центральной зоне экрана при приближении
      красного индикатора опасности.'
    states:
    - INCOMING_HAZARD (снаряд/бочка движется к игроку)
    - PARRY_TIMING_WINDOW (активное окно отражения 0.18 с)
    - DEFLECTED_SUPERCHARGED (снаряд ускорен и заряжен критическим уроном)
    - DETONATION_CASCADE (финальный взрыв с цепной реакцией)
    parameters:
    - name: parry_window_duration
      value: 0.18 с
      tuning_note: Если сузить до 0.10 с — механика становится непроходимой при пинге
        в браузере и 60fps; если расширить до 0.30 с — исчезает напряжение и цена
        риска.
    - name: deflected_speed_multiplier
      value: 2.4 x
      tuning_note: Если сделать ниже 1.8х — отраженная бочка летит слишком медленно
        и враги успевают разбежаться из зоны поражения.
    - name: deflected_blast_radius
      value: 4.6 м
      tuning_note: Если уменьшить до 2.5 м — отражение одиночных ракет не окупает
        риск получения прямого урона.
    - name: hazard_kick_self_damage_immunity
      value: 0.45 с
      tuning_note: Если убрать иммунитет — игрок гарантированно взрывает сам себя
        при пинке близко расположенной бочки.
    feedback_layers:
    - 'Визуал/VFX: Вспышка белого пламени в точке контакта, огненный след (Fire Ribbon
      Trail) за отраженным объектом и эффект радиальной ударной волны при детонации.'
    - 'Звук (Web Audio API): Звонкий металлический удар наковальни (Anvil Clang 1.6
      кГц) с последующим низким гулом турбины ускорения (Pitch Slide 200 -> 800 Гц).'
    - 'Камера: Полная заморозка кадра (Hitstop Frame) на 0.06 с с последующей радиальной
      тряской камеры (Trauma Shake 0.7).'
    - 'UI/Тактильность: Двойной мощный виброудар (Impact Heavy 70 мс), крупная надпись
      ''REFLECTED! x3.0'' с эффектом вспышки интерфейса.'
    failure_mode: 'Опоздание с нажатием пинка на 0.05 с: ракета/бочка детонирует в
      момент замаха ноги, нанося игроку полный урон (50 HP) и отбрасывая его в угол
      комнаты.'
    mastery_curve: Новичок обходит взрывоопасные бочки стороной, боясь задеть их.
      Эксперт специально провоцирует ракетчиков на залп, бежит наперерез и пинком
      запускает ракету точно в скопление турелей.
    counterplay: 'Лазерные снайперы и огнеметчики: их атаки не имеют дискретного физического
      тела и не могут быть отражены кинетическим пинком, вынуждая использовать слайды.'
    synergies:
    - Кинетический пинок (использует общий тайминг и позиционирование ноги)
    - Штурмовой вылом дверей (пнутая сквозь огонь дверь превращается в горящий таран)
    why_unique: Превращает вражеские снаряды и смертоносные ловушки уровня из источника
      опасности в самый мощный разрушительный инструмент игрока при наличии чувства
      ритма.
    pseudocode: "function updateHazardRedirect(dt, player, hazards, kickAction) {\n\
      \  for (let item of hazards) {\n    let dist = getDistance(player.pos, item.pos);\n\
      \    if (dist <= 2.1 && isObjectInFront(player, item.pos, 45.0)) {\n      if\
      \ (kickAction && item.isReflectable) {\n        item.velocity = player.forward.clone().multiplyScalar(item.baseSpeed\
      \ * 2.4);\n        item.damageMultiplier = 3.0;\n        item.team = 'PLAYER';\n\
      \        applyHitstop(0.06);\n        player.grantInvulnerability(0.45);\n \
      \       playAudioAnvilReflect();\n        triggerCameraTrauma(0.7);\n      \
      \  return;\n      }\n    }\n  }\n}"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite 5.x
  renderer: threejs
  renderer_version: ^0.170.0
  physics_engine: Rapier3D (@dimforge/rapier3d-compat 0.13.x)
  state_manager: Custom TinyEventBus & Reactive GameStore
  audio_engine: Howler.js (^2.2.4) с WebAudio API
  target_fps: 60
  max_draw_calls: 75
  max_triangles_or_sprites: 40000
  bundle_size_budget_mb: 4.2
  layers:
  - name: Application Layer
    responsibility: Инициализация Vite, ресайз канваса, полноэкранный режим, прелоадер.
  - name: Platform & Ads Layer
    responsibility: Адаптер Playgama Bridge, менеджеры Interstitial и Rewarded рекламы,
      Cloud Save.
  - name: Core Engine Layer
    responsibility: Фиксированный цикл GameLoop 60Гц, EventBus, маршрутизация ввода.
  - name: Physics Simulation Layer
    responsibility: Шаги симуляции Rapier3D, фильтрация коллизий, рэгдолл-синхронизация.
  - name: Gameplay Systems Layer
    responsibility: Боевая система, спавн врагов, выбор 3 карт улучшений, расчет комбо.
  - name: Entity Management Layer
    responsibility: Пул сущностей игрока, врагов, снарядов и осколков.
  - name: Rendering Layer
    responsibility: Three.js граф сцены, InstancedMesh батчинг, тени, эмиттеры частиц.
  - name: UI & HUD Layer
    responsibility: HTML5/CSS3 оверлей, виртуальный джойстик, полосы HP, модальные
      окна.
  modules:
  - name: src/main.ts
    desc: 'Точка входа: инициализация Playgama Bridge, загрузка ассетов и запуск Game.'
  - name: src/core/Game.ts
    desc: Главный координатор, стейт-машина и управление сценами.
  - name: src/core/GameLoop.ts
    desc: Фиксированный 60Гц цикл обновления с аккумулятором дельты.
  - name: src/core/EventBus.ts
    desc: Типизированная шина событий для слабой связности систем.
  - name: src/platform/PlaygamaService.ts
    desc: Служба работы с @playgama/bridge (реклама, облачные сейвы, лидерборды).
  - name: src/physics/PhysicsWorld.ts
    desc: Обертка физического мира Rapier3D с фильтрами слоев коллизий.
  - name: src/entities/Player.ts
    desc: Контроллер игрока с расчетом физических сил и управления.
  - name: src/entities/EnemyPool.ts
    desc: Пул переиспользуемых сущностей врагов с логикой поведения.
  - name: src/systems/CombatSystem.ts
    desc: Расчет урона, хит-стопа, импульсов и комбо-бонусов.
  - name: src/ui/UIManager.ts
    desc: Управление HUD, окном выбора карт, главным меню и экраном результатов.
monetization:
  strategy_summary: Гибридная модель Free-to-Play для Яндекс Игр и веб-порталов. Высокий
    eCPM за счет полезных Rewarded видео без агрессивного навязывания.
