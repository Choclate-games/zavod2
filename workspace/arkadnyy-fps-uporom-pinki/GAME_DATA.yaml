mechanics:
- name: Кинетический пинок со сплэтом о препятствия (Kinetic Wall-Splat Kick)
  category: Главный двигатель темпа, основной инструмент контроля пространства и ключевой
    источник физического урона.
  priority: core
  description: 'Вместо стандартного рукопашного удара с фиксированным уроном пинок
    является физическим транслятором кинетической энергии: урон рассчитывается исключительно
    из конечной скорости соударения тела с препятствием.'
  player_interaction: 'Клавиатура/Мышь: Нажатие [F] или [Mouse4] / Мобильный тач:
    Кнопка-иконка тяжелого ботинка в правой нижней зоне экрана (радиус 48px).'
  feedback: 'Визуал/VFX: Радиальное искажение экрана (Radial Screen Warp) вокруг точки
    удара, декали треснувшей штукатурки и разлетающиеся 3D-обломки кирпичей при ударе
    тела о стену.; Звук (Web Audio API): Саб-басовый панч (Sub-bass Drop 55 Гц) при
    ударе ноги + сочный хрустящий щелчок сминания брони/костей (комбинация синтеза
    шума и сэмпла разрушения дерева на 1.8 кГц).; Камера: Мгновенный импульсный зум
    FOV (90° -> 83° -> 90° за 0.14 с) с резким вертикальным киком вверх на 2.2° и
    плавным затуханием.; UI/Тактильность: Haptic-импульс 45 мс (Heavy Impact), динамический
    всплывающий маркер ''WALL CRUSH x2.5'' ярко-оранжевого цвета над точкой сплэта.'
  technical_complexity: Medium
  strengths:
