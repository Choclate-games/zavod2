<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#03070d" />
    <title>Атмосферную three.js о смотрителе 3D</title>
    <style>
      /* Page lock installed before anything paints (Yandex 1.6.2.x / 1.10.x). */
      :root {
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
        --vp-h: 100dvh;
      }
      * { -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      img, canvas, svg { -webkit-user-drag: none; }
      html, :root body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
      }
      body {
        position: fixed;
        inset: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #03070d;
        color: #cfe8ff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #game-canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
