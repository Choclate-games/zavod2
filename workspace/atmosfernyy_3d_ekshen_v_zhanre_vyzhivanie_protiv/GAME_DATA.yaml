raw_prompt: Атмосферный 3D экшен в жанре выживание против орды с видом от третьего
  лица на вершину одинокого каменного маяка. Игрок с помощью мыши или касаний вращает
  прожектор на 360 градусов и удерживает кнопку фокуса луча для мгновенного испепеления
  волн наползающих морских тварей. На экране виден скалистый остров, бушующие волны
  шторма, надвигающаяся из тьмы светящаяся масса монстров и шкала нагрева линзы прожектора.
  Цель — продержаться заданное время до рассвета, сдерживая непрерывные волны ночной
  орды.
title: 'Маяк: Ночная Вахта'
slug: atmosfernyy_3d_ekshen_v_zhanre_vyzhivanie_protiv
genre: 3D Экшен-Выживание против Орды
subgenre: Термодинамический световой арена-дефенс / Светоориентированный орда-экшен
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web)
orientation: landscape
target_audience: Игроки веб- и мобильных платформ 16-40 лет, ценящие атмосферные выживачи,
  физический экшен и напряженные тактические аркады с короткими сессиями (3 минуты),
  мгновенным погружением и высокой кинематографичностью без утомительного гринда карточек.
core_loop: Круговое сканирование секторов острова на 360° -> Сдерживание и замедление
  роя широким светом -> Концентрированный термо-фокус на плотных скоплениях и альфа-тварях
  -> Запуск цепных биодетонаций -> Своевременное охлаждение линзы до критического
  перегрева -> Выживание в течение 180 секунд до наступления рассвета 06:00.
hook: На часах 05:40, штормовые волны бьют в основание башни, термометр линзы пульсирует
  красным на 92%, а с трех утесов на маяк лезет светящийся ковер глубоководных шипастых
  тварей во главе с гигантским бронированным левиафаном. Ты удерживаешь луч ровно
  две секунды в уязвимом биолюминесцентном брюхе вожака, вызывая ослепительную бирюзовую
  детонацию, которая разносит весь восточный фланг, и в долю секунды отпускаешь фокус,
  с шипением стравливая пар за миг до удара первых лучей рассветного солнца.
player_fantasy: Ты — несгибаемый смотритель маяка на краю океанской бездны, последний
  рубеж человечества в бушующей штормовой ночи, управляющий колоссальной мощью пылающего
  дугового прожектора и линзы Френеля против надвигающегося глубоководного кошмара.
session_model: Фиксированная ночная вахта длительностью ровно 180 секунд (с 00:00
  до 06:00 игрового времени со сжатием 1 минута игры = 30 секунд реальности), разбитая
  на 4 нарастающие фазы шторма с кульминацией на 150-180 секундах и победным рассветом.
unique_value_proposition: 'В отличие от шаблонных авто-шутеров с пассивными карточками
  и бесконечным бегом, игра предлагает прямое управление физическим лучом света и
  механику термодинамического риска: постоянный компромисс между широким сдерживающим
  светом без нагрева и узким испепеляющим фокусом с риском критического перегрева,
  создающий непрерывный тактический выбор каждую секунду 3-минутной смены.'
vision: 'Превратить классическую морскую готику и дизельпанк в эталонный веб-экшен:
  сочетание гипнотической визуальной эстетики (мрачный мокрый гранит, бушующий океан
  цвета индиго, ядовито-бирюзовое биолюминесцентное свечение глубоководной орды и
  ослепительный янтарный луч линзы Френеля) с острой, тактильной аркадной механикой
  теплового менеджмента и сочных цепных биодетонаций на стабильных 60 FPS на любом
  смартфоне или ПК.'
elevator_pitch: '«Маяк: Ночная Вахта» — это атмосферный 3D экшен-сурвайвал на 180
  секунд, где игрок управляет мощным вращающимся прожектором маяка, балансируя между
  широким сдерживающим светом и узким прожигающим лучом с механикой перегрева, чтобы
  отразить волны глубоководных чудовищ и дожить до спасительного рассвета.'
win_conditions: Успешно продержаться ровно 180 секунд реального времени (достичь игрового
  времени 06:00 / рассвета), сохранив целостность защитного периметра маяка (HP базы
  > 0%).
lose_conditions: Полное разрушение защитного периметра башни (HP маяка = 0%) из-за
  прорыва морских тварей к основанию скалы до наступления рассвета 06:00.
progression_summary: 'Внутри 180-секундного забега: динамическая эскалация ночи через
  расширение направлений атаки (от 90° на старте до полных 360° к финалу), появление
  новых мутаций (быстрые краулеры, светящиеся био-мины, бронированные панцирники)
  и нарастание ярости шторма. Вне забега: ранговая таблица смотрителей (время выживания,
  остаток HP башни, рекорд цепных детонаций) и коллекция наградных знаков мастерства
  за идеальное управление температурой без перегрева.'
difficulty_curve: 'Экспоненциально-ступенчатая кривая шторма: 00:00-01:30 (0-45с)
  — «Первый прилив»: атака с одного сектора, обучение термо-фокусу (интенсивность
  25%); 01:30-03:00 (45-90с) — «Двойной фронт»: спавн бронированных особей с противоположных
  утесов (интенсивность 55%); 03:00-04:30 (90-135с) — «Штормовой шквал»: появление
  взрывоопасных био-мин и быстрых роев на 270° (интенсивность 80%); 04:30-06:00 (135-180с)
  — «Рассветный натиск»: одновременный штурм со всех 360° с появлением левиафана,
  требующий ювелирного баланса нагрева и цепных реакций (интенсивность 100%).'
