mechanics:
- name: Термодинамика фокуса линзы Френеля (Thermal Lens Management)
  category: 'Главный двигатель боевой системы и ключевой источник риска: переход от
    безопасного сдерживающего света к смертоносному концентрированному прожигу ценой
    накопления тепла.'
  priority: core
  description: В отличие от традиционных пулеметов с перегревом, где нагрев лишь ограничивает
    стрельбу, здесь перегрев неразрывно связан с оптической трансформацией луча (рассеивание
    vs концентрация), меняющей тип урона и область контроля в реальном времени.
  player_interaction: ПКМ или зажатие Пробела на клавиатуре / Удержание второго пальца
    на сенсорной кнопке 'ФОКУС' на мобильном экране.
  feedback: 'Визуал / VFX: При широком луче — мягкий объемный конус света со взвесью
    капель шторма; при зажатии фокуса луч резко сужается до ослепительного бело-голубого
    лазерного копья с искрами дугового разряда и тепловым маревом (distortion shader)
    вокруг оправы линзы. При T > 80°C корпус прожектора раскаляется до багрово-красного
    свечения.; Звук (Web Audio): При фокусе — низкочастотный гул трансформатора (60
    Гц), переходящий в высокий пронзительный визг дуги (от 400 Гц до 2.5 кГц по мере
    роста температуры); при перегреве — резкий металлический щелчок термореле, шипение
    кипящей меди и прерывистый аварийный зуммер.; Камера: При зажатии фокуса — динамический
    микро-зум FOV (с 60° до 56°) с высокочастотной низкоамплитудной тряской (micro-shake
    0.3 ед.), создающей физическое ощущение колоссального давления энергии в линзе.;
    UI / Тактильность: Круговой аналоговый термометр вокруг прицела с сегментным заполнением
    от белого (20°C) через янтарный (60°C) к пульсирующему красному (85–100°C); на
    мобильных устройствах — нарастающая по частоте вибрация Haptic Feedback при нагреве
    выше 75°C.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Круговой секторный сканер и штормовая тьма (360° Perimeter Sweep & Fog of
    Storm)
  category: 'Двигатель пространственной ориентации и тактического распределения внимания:
    заставляет игрока непрерывно сканировать горизонт и выстраивать приоритеты угроз.'
  priority: secondary
  description: В отличие от большинства арена-шутеров с полным круговым обзором экрана,
    здесь свет является единственным источником видимости и безопасности, превращая
    тьму в физическую тактическую угрозу.
  player_interaction: Движение мыши / курсора (направление взгляда прожектора) на
    ПК; Однопальцевый свайп / драг по левой половине экрана на мобильных устройствах.
  feedback: 'Визуал / VFX: Мощный объемный свет (volumetric fog) с динамическими тенями
    от скал и утесов. В неосвещенных секторах — кромешная тьма шторма и десятки мерцающих
    бирюзовых точек (глаза тварей), отражающих редкие вспышки молний.; Звук (Web Audio):
    Скрип массивных чугунных шестерен поворотного механизма маяка при вращении; стереопанорамированные
    звуки шлепанья лап по мокрым камням и утробного рычания из слепых зон.; Камера:
    Камера закреплена сверху-сзади под углом 45° к башне маяка, плавно доворачивается
    за лучом с инерцией (damping 0.12 с), создавая кинематографичный объем арены.;
    UI / Тактильность: Круговой радар периметра на ободе экрана с затухающими маркерами
    последнего обнаружения контактов; легкий тактильный щелчок при пересечении лучом
    каждого 90-градусного кардинального направления.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Цепной катализ биолюминесценции (Chain Biomass Catalysis)
  category: Главный источник удовлетворения, множитель боевой эффективности и инструмент
