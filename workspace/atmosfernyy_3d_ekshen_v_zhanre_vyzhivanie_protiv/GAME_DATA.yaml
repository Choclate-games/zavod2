  rejection_reason: Игра принципиально отвергает механику Vampire Survivors с автоатакой
    и выбором 3 карт апгрейдов, элементы Tower Defense со строительством и автоприцеливанием
    турелей, мобильный FPS-контроллер и механику ближнего боя со связкой дэш/парирование,
    полагаясь на ручное круговое управление стационарным прожектором и Boids-поведение
    орды вместо навмеша Recast, а также исключает внешние 3D-модели и микротранзакции.
  loop_pattern: ''
  summary: Проект опирается на процедурную 3D-генерацию мира и монстров, физику Rapier3D
    с bitECS для управления ордой, процедурный Web Audio звук и систему термодинамического
    луча с цепными реакциями, не используя стандартные архетипы петель из-за уникального
    формата стационарной 180-секундной вахты.
