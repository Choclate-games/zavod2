definition_of_done:
- Полная 3D сцена Three.js со скалистым островом, океаном, маяком и объемным лучом
  прожектора функционирует со стабильными 60 FPS.
- Управление вращением на 360° и переключением фокуса луча работает на мыши и тач-устройствах
  без виртуальных джойстиков.
- Механика термодинамики линзы (нагрев за 3.5с, охлаждение за 2.5с, блокировка Overheat
  на 3.0с) полностью реализована с визуальным и аудио фидбеком.
- 'Орда монстров (3 типа: краулеры, панцирники, био-мины) спавнится волнами через
  bitECS + InstancedMesh.'
- Цепные биодетонации наносят радиальный урон 250 ед в радиусе 4м с сотрясением экрана
  и каскадными эффектами.
- 180-секундный таймер ночной вахты корректно переключает 4 фазы шторма и завершается
  победным рассветом 06:00.
- Интеграция Playgama Bridge 2.x поддерживает Rewarded Video (Revive), Interstitial
  между играми и сохранение очков в Leaderboard.
- Бандл игры оптимизирован под веб-стандарты (< 4.5 MB) и протестирован на мобильных
  и десктопных браузерах.
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Круговое сканирование секторов острова на 360° -> Сдерживание
  и замедление роя широким светом -> Концентрированный термо-фокус на плотных скоплениях
  и альфа-тварях -> Запуск цепных биодетонаций -> Своевременное охлаждение линзы до
  критического перегрева -> Выживание в течение 180 секунд до наступления рассвета
  06:00..'
- 'Реализованы механики проекта: Термодинамика фокуса линзы Френеля (Thermal Lens
  Management), Круговой секторный сканер и штормовая тьма (360° Perimeter Sweep &
  Fog of Storm), Цепной катализ биолюминесценции (Chain Biomass Catalysis), Световой
  стаггер и фотолитический барьер (Photolytic Barrier & Stagger).'
- Условие успеха (Успешно продержаться ровно 180 секунд реального времени (достичь
  игрового времени 06:00 / рассвета), сохранив целостность защитного периметра маяка
  (HP базы > 0%).) и условие проигрыша (Полное разрушение защитного периметра башни
  (HP маяка = 0%) из-за прорыва морских тварей к основанию скалы до наступления рассвета
  06:00.) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Маяк: Ночная Вахта».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Спасение вахты (Экстренный рассветный
  импульс), Удвоение очков смотрителя); interstitial соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
direction:
  options:
  - id: D1
    name: 'Маяк: Ночная Вахта'
    pitch: Игрок вращает мощный прожектор на 360 градусов и управляет фокусировкой
      луча, чтобы сдерживать накатывающие из океана волны биолюминесцентных тварей
      и дожить до рассвета.
    core_verb: Вращать и прожигать (круговое сканирование секторов острова и точечный
      термо-фокус луча с контролем шкалы перегрева линзы).
    genre_family: 3D Horde Survival / Light-Beam Action
    session_shape: Ночная вахта длительностью ровно 180 секунд (от 00:00 до 06:00)
      с динамическим нарастанием шторма и плотности орды к рассветному пику.
    camera: Изометрическая 3D-камера от третьего лица под углом 50° над куполом маяка,
      охватывающая круговой периметр скалистого острова и линию прибоя.
    control_scheme: 'ПК: перемещение курсора мыши вращает прожектор на 360°; зажатие
      ЛКМ / Пробела фокусирует прожигающий луч; отпускание возвращает широкий охлаждающий
      свет. Мобильные: ведение пальцем по экрану задаёт угол прожектора; удержание
      сенсорной зоны «Фокус» справа концентрирует луч и расходует шкалу нагрева. Виртуальный
      джойстик отсутствует.'
    world: Северный морской дизельпанк рубежа XIX-XX веков. Суровый мокрый гранит,
      латунная фонарная башня с линзой Френеля, штормовое море цвета индиго и ядовито-бирюзовое
      биолюминесцентное свечение глаз и панцирей глубоководной орды.
    spectacle: Ослепительно-янтарный конус света прорезает хлещущий ливень и испепеляет
      карабкающихся по мокрым утесам светящихся тварей, пока латунный корпус прожектора
      раскаляется докрасна от предельного нагрева.
    why_not_generic: Опирается на связку mechanics/wave_survival.md + mechanics/drone_swarm.md
      + mechanics/chain_reaction.md. В отличие от шаблонных авто-шутеров с пассивным
      круговым уроном, игрок непрерывно управляет физическим световым лучом. Контраст
      между безопасным широким конусом (сдерживающим рой drone_swarm.md) и узким прожигающим
      лучом (вызывающим цепные детонации биомассы chain_reaction.md при риске перегрева)
      превращает выживание wave_survival.md в напряжённую термодинамическую дуэль
      без авто-атак и карт.
    biggest_risk: Риск утомления пальца/кисти от непрерывного удержания фокуса при
      высокой плотности орды.
    production_cost: 'Низкий: одна монолитная сцена Three.js, отрисовка орды через
      InstancedMesh и bitECS, кастомный шейдер конического луча без тяжелых физических
      расчетов.'
