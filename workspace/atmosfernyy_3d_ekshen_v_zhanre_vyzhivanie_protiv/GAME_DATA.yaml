  - path: threejs/adaptive_quality.md
    role: core
    reason: Динамически масштабирует разрешение рендера и плотность визуальных эффектов
      луча во время пиковых нагрузок шторма для удержания стабильных 60 FPS.
  - path: threejs/mobile_shaders.md
    role: supporting
    reason: Оптимизирует шейдеры мокрого камня острова и биолюминесценции монстров
      под мобильные GPU без тяжелого fillrate.
  - path: threejs/physics_integration.md
    role: core
    reason: Связывает физический цикл Rapier3D с рендером Three.js для расчета столкновений
      орды, проверки попаданий луча и импульсов паровой волны.
  - path: stack/rapier3d.md
    role: core
    reason: Предоставляет быстрый WASM-движок физики для обработки коллизий массы
      тварей, лучевых проверок прожектора и физического отталкивания при сбросе пара.
  - path: threejs/procedural_mesh_builder.md
    role: core
    reason: Позволяет процедурно сгенерировать башню маяка, механизм линзы Френеля,
      скалы острова и морских тварей без использования внешних 3D-моделей.
  - path: threejs/game_map_and_world_design.md
    role: supporting
    reason: Задает принципы процедурного построения круговой арены острова с тремя
      утесами, линией прибоя и границами видимости прожектора.
  - path: threejs/procedural_character_rig.md
    role: supporting
    reason: Обеспечивает процедурную анимацию сочленений глубоководных монстров, левиафана
      и поворотного механизма прожектора с реакцией на попадания.
  - path: threejs/juice_and_vfx_pool.md
    role: core
    reason: Реализует инстанс-пулы частиц для концентрированного термо-луча, бирюзовых
      биодетонаций, пара аварийного сброса и дрожания камеры.
  - path: stack/postprocessing.md
    role: supporting
    reason: Создает выразительное свечение (bloom) луча прожектора, свечение биолюминесцентных
