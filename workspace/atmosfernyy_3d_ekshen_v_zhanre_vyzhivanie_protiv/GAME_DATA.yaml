gameplay_systems:
- name: Система термодинамики и охлаждения прожектора
  purpose: Контроль состояния дуговой лампы и линзы Френеля, расчет нагрева, остывания
    и аварийной блокировки.
  input: Булево состояние активации фокуса (isFocused), дельта времени (dt), статус
    блокировки (isOverheated).
  rules:
  - При isFocused = true шкала нагрева растет со скоростью +28.5% в секунду (полный
    нагрев за 3.5 с).
  - При isFocused = false шкала остывает со скоростью -40.0% в секунду (полное охлаждение
    за 2.5 с).
  - 'При достижении 100% срабатывает триггер Overheat: лампа гаснет до аварийного
    10% света, фокус блокируется на 3.0 секунды.'
  - После истечения 3.0 с шкала сбрасывается в 0%, и управление полностью восстанавливается.
  state:
  - heatLevel (0.0 - 1.0)
  - isOverheated (bool)
  - cooldownTimer (0.0 - 3.0)
  - ventingParticlesActive (bool)
  interactions: Передает текущий множитель урона в боевую систему и управляет свечением
    материалов башни в Art-модуле.
  feedback: Анимированный круговой термометр на HUD, изменение цвета верхушки маяка
    от золотистого к раскаленно-малиновому, звуковой сигнал нарастающей частоты при
    heat > 75%.
  edge_cases:
  - Игрок отпускает кнопку за 0.05 с до 100% (микро-риск награждается мгновенным остыванием)
  - Попытка зажать фокус во время Overheat выдает глухой металлический щелчок.
- name: Система процедурного спавна орды и фаз шторма
  purpose: Управление волнами глубоководных чудовищ в строгом соответствии с 180-секундным
    таймером ночной вахты.
  input: 'Текущее время матча (matchTime: 0..180 с), активные секторы побережья (0..360°).'
  rules:
  - 'Фаза 1 (0-45с / 00:00-01:30): Спавн 15-25 базовых краулеров из сектора 0°-90°
    (Север).'
  - 'Фаза 2 (45-90с / 01:30-03:00): Спавн 30-50 краулеров + 4 бронированных панцирника
    из секторов 0°-90° и 180°-270°.'
  - 'Фаза 3 (90-135с / 03:00-04:30): Спавн 60-80 краулеров + био-мины из трех секторов
    (270° охват), волны шторма заливают нижние камни.'
  - 'Фаза 4 (135-180с / 04:30-06:00): Пиковый штурм 120+ особей со всех 360° + выход
    Левиафана на 150-й секунде.'
  - Враги используют алгоритм поиска пути к подножию башни маяка с учетом высоты рельефа
    скалы.
  state:
  - currentPhase (1..4)
  - activeEnemiesCount
  - spawnQueue
  - stormIntensity (0.0 - 1.0)
  interactions: Взаимодействует с Three.js InstancedMesh для отрисовки до 300 монстров
    без просадки FPS.
  feedback: Звуковые раскаты грома, изменение направления ливня, появление светящихся
    глаз в океане за 3 секунды до выхода волны на сушу.
  edge_cases:
  - Если игрок уничтожает волну раньше тайминга, плотность следующей волны мягко адаптируется
    без провисания динамики.
- name: Система целостности и обороны периметра маяка
  purpose: Отслеживание прочности защитного основания маяка и регистрация урона от
    прорвавшихся тварей.
  input: Коллизии монстров с триггерной зоной основания башни (радиус 3.5 м).
  rules:
  - Базовый запас прочности маяка = 100 HP.
  - Каждый краулер, достигший основания, наносит 5 HP урона каждые 1.5 секунды.
  - Бронированный панцирник наносит 15 HP урона ударом тарана.
  - Детонация био-мины у стены наносит 20 HP урона.
  - При HP <= 0 инициируется экран поражения 'Маяк пал'.
  state:
  - currentHP (0..100)
  - isUnderAttack (bool)
  - lastHitTimestamp
  - damageVignetteAlpha
  interactions: Связывает боевую систему с условиями победы/поражения и триггерами
    Rewarded Video (Revive).
  feedback: Пульсирующая красная виньетка по краям экрана, глухие удары в гранит башни,
    осыпание каменной крошки и трещины на фундаменте.
  edge_cases:
  - При получении урона включается кратковременная неуязвимость маяка на 0.3 секунды
    для предотвращения мгновенного ваншота толпой.
- name: Система объемного света и обнаружения (Volumetric Raycast & Detection)
  purpose: Вычисление попадания светового конуса по сущностям роя и применение эффектов
    освещения/урона.
  input: 'Позиция вершины маяка, угол рыскания прожектора (yaw), режим фокусировки
    (fov: 60° или 10°), массив позиций врагов.'
  rules:
  - Каждый тик рассчитывается скалярное произведение вектора направления луча и вектора
    на каждого монстра.
  - Если угол < fov/2 и дистанция < 35 метров, монстр считается освещенным.
  - 'В режиме Wide (60°): накладывается дебафф Stagger (скорость -65%), урон = 5 ед/с.'
  - 'В режиме Focus (10°): накладывается дебафф Vaporize, урон = 180 ед/с, прогресс
    сжигания накапливается до детонации.'
  state:
  - activeConeAngle (10°..60°)
  - illuminatedEntitiesList
  - focusedEntitiesList
  interactions: Управляет геометрией кастомного Three.js Mesh конуса света и передает
    списки целей в ECS-систему урона.
  feedback: Яркое пятно света на геометрии острова, объемные световые лучи в каплях
    дождя, подсветка контуров врагов шейдером Rim-Light.
  edge_cases:
  - Монстры, скрытые за высокими скальными валунами, блокируют луч света для идущих
    позади тварей.
core_design:
  signature_moment: 'На часах 05:35, штормовая ночь на пике ярости: шкала перегрева
    линзы пульсирует на 94%, а из кипящей океанской пучины на южный утес выползает
    гигантский бронированный Абиссальный Левиафан в окружении плотного строя краулеров
    и пульсирующих био-мин. Маяк атакуют с трех сторон одновременно. Игрок зажимает
    фокус луча на 1.8 секунды ровно в брюшной световой узел био-мины в авангарде —
    происходит цепная биодетонация бирюзового пламени, которая срывает панцирь с Левиафана,
    подрывает соседние мины и испепеляет весь восточный фланг. За 0.2 секунды до критического
    заклинивания игрок отпускает фокус и бьет по клапану парового контрудара: с оглушительным
    свистом кольцо перегретого пара сдувает прорвавшихся тварей с парапета, температура
    линзы сбрасывается до 20°C, а над бушующим океаном вспыхивают первые золотые лучи
    рассвета 06:00, возвещая победу.'
  genre_template_rejected: 'Сознательно отвергнут шаблон «Vampire Survivors-подобного
    авто-батлера с выбором из трех случайных карт перков при прокачке и пассивным
    авто-огнем по площади». В стандартных орда-экшенах игрок перемещается персонажем,
    пока оружие само атакует врагов во все стороны, а глубина сводится к пассивному
    сбору меты и RNG-билдам. В «Маяк: Ночная Вахта» полностью отсутствуют авто-бой,
    случайные карточки и прокачка характеристик: весь игровой процесс построен на
    физическом контроле единственного источника света, жестком микро-менеджменте термодинамики
    (широкий сдерживающий свет против узкого смертоносного лазерного фокуса), чтении
    слепых зон 360-градусного периметра и виртуозном выстраивании цепных взрывов биомассы.'
  what_makes_it_different: 'Вместо кругового расстрела мобов снарядами, игра построена
    на асимметричной оптической дуальности одного луча: широкий сектор 60° работает
    как тактический нелетальный контроль (замедление на 65%, сбивание прыжков и подсветка
    слепых зон без нагрева), а узкий луч 10° — как сокрушительный прожигающий лазер
    с экспоненциальным риском перегрева. Пространство вне луча погружено в абсолютную
    тьму, где враги определяются только по светящимся во тьме глазам и всплескам волн.
    Враги (био-мины) служат не просто угрозой, а детонирующим оружием в руках игрока:
    один точный прогрев ядра запускает каскадный взрыв всего фланга, превращая плотность
    орды из главной опасности в главное преимущество.'
  micro_loop:
  - step: 1. Секторное сканирование периметра во тьме
    player_action: Плавное круговое вращение прожектора на 360° для инспекции слепых
      зон острова
    game_response: Конус рассеянного света 60° рассекает туман войны, высвечивая силуэты
      краулеров и пульсирующие фосфорные глаза приближающихся тварей
    decision: 'Определить приоритетный вектор атаки: сдержать быстрый рой слева или
      немедленно ликвидировать подползающую био-мину справа'
    duration: 0.5–1.2 с
  - step: 2. Световой стаггер и группировка роя
    player_action: Удержание широкого луча на авангарде наступающей группы монстров
    game_response: Свет ослепляет монстров, снижает их скорость на 65% и сбивает анимации
      прыжка, заставляя тварей сбиваться в плотную массу
    decision: Выждать ли 0.5 с для максимальной плотности роя вокруг био-мины или
      начинать прожиг немедленно
    duration: 0.8–1.5 с
  - step: 3. Концентрированный термо-фокус и прожиг
    player_action: Зажатие кнопки фокуса (сужение луча до 10°) и наведение на ядро
      био-мины или сочленения брони альфа-особи
    game_response: Узкий луч наносит 140 ед/с урона (+бонус за удержание), стрелка
      термометра линзы стремительно поднимается от 20°C к 90°C со звуком нарастающего
      дугового гула
    decision: Рискнуть удержать луч еще 0.3 секунды до разрыва ядра или отпустить
      фокус, спасаясь от 3-секундного заклинивания
    duration: 0.4–2.0 с
  - step: 4. Цепная биодетонация и зачистка фланга
    player_action: Точный дожим фокуса до критического порога термического катализа
      ядра (0.80 с непрерывного луча)
    game_response: Ядро взрывается ослепительной бирюзовой вспышкой, нанося 250 ед.
      радиального урона в радиусе 4.5 м и мгновенно детонируя соседние био-мины
    decision: Мгновенно перебросить прожектор на противоположный темный фланг или
      применить паровой сброс при критическом сближении
    duration: 0.2–0.5 с
  - step: 5. Пассивное охлаждение линзы и выбор новой цели
    player_action: Отпускание фокуса в момент разворота прожектора на новый сектор
    game_response: Линза возвращается в широкий режим 60°, температура сбрасывается
      со скоростью 35°C/с, свет высвечивает новую волну на другом утесе
    decision: Какой сектор сканировать следующим, пока температура линзы возвращается
      к безопасным 20–40°C
    duration: 0.5–1.0 с
  meso_loop:
  - step: 'Фаза I: Первый прилив (00:00–01:30 игрового времени / 0–45 с)'
    player_action: Оборона одного активного сектора (северный утес), отработка базового
      ритма нагрева и охлаждения линзы
    game_response: Накатывают одиночные волны мелких краулеров (80 HP), штормовой
      ветер умеренный (15 м/с, волны 2 м)
    decision: Освоить безопасный порог нагрева линзы (до 60°C) и научиться сбивать
      прыжки тварей рассеянным светом
    duration: 45 с
  - step: 'Фаза II: Двойной фронт (01:30–03:00 игрового времени / 45–90 с)'
    player_action: Ритмичный переброс прожектора между северным и южным утесами на
      180° с контролем двух направлений
    game_response: Появление тяжелых бронированных панцирников (280 HP) с одного фланга
      и быстрых стай краулеров с противоположного; усиление дождя
    decision: Ослепить ли быстрый рой широким светом на 2 секунды, чтобы выиграть
      время для прожига панцирника на другом фланге
    duration: 45 с
  - step: 'Фаза III: Штормовой шквал (03:00–04:30 игрового времени / 90–135 с)'
    player_action: Каскадный подрыв светящихся био-мин в скоплениях роя на трех активных
      направлениях (охват 270°)
    game_response: Массированный спавн взрывоопасных био-мин, штормовой ветер 30 м/с
      кренит луч, молнии периодически ослепляют камеру
    decision: Использовать ли детонацию био-мин для экономии тепла линзы или потратить
      первый накопленный заряд парового контрудара
    duration: 45 с
  - step: 'Фаза IV: Рассветный натиск (04:30–06:00 игрового времени / 135–180 с)'
    player_action: 'Предельная концентрация: круговое жонглирование всеми 360°, фокус
      на Абиссальном Левиафане и тепловой баланс на грани 95°C'
    game_response: Выход титанического Абиссального Левиафана (1200 HP), одновременный
      штурм со всех скал, сирена маяка воет при падении HP периметра ниже 30%
    decision: В какой момент активировать финальный заряд парового сброса ради мгновенного
      обнуления тепла и добивания босса за 5 секунд до рассвета
    duration: 45 с
  macro_loop:
  - step: 1. Выбор параметров смены и заступление на вахту
    player_action: Выбор параметров вахты в журнале маяка (стандартная смена, режим
      штормового шквала) и запуск 180-секундной сессии
    game_response: Камера облетает скалистый маяк, зажигается дуговой прожектор, на
      часах загорается 00:00, бушующий шторм обрушивается на остров
    decision: Определить начальный сектор внимания по первым раскатам грома и всплескам
      волн у подножия утесов
    duration: 5 с
  - step: 2. Отражение 180-секундной ночной вахты
    player_action: Непрерывное отражение 4 эскалирующих фаз шторма через микроконтроль
      луча, управление перегревом и выстраивание комбо детонаций
    game_response: Динамическая симуляция целостности периметра маяка, разрушение
      внешних парапетов, переход игрового времени от 00:00 к 06:00
    decision: Балансировать между агрессивным риском ради очков комбо цепных реакций
      и консервативным сдерживанием периметра ради выживания
    duration: 180 с
  - step: 3. Рассветный триумф или гибель маяка
    player_action: Финальный стравливающий залп пара на последних секундах или гибель
      при прорыве орды к основанию башни
    game_response: В 06:00 восходящее солнце заливает океан золотом, твари с визгом
      растворяются в пучине; при HP=0% — маяк гаснет и рушится во тьму
    decision: Оценить допущенные ошибки в тайминге перегрева линзы и контроле слепых
      зон
    duration: 5–8 с
  - step: 4. Итоги вахты, знаки мастерства и таблица смотрителей
    player_action: 'Анализ статистики вахты: время выживания, остаток HP маяка, рекордная
      цепочка детонаций, точность термо-контроля'
    game_response: Начисление ранговых очков Смотрителя, открытие знаков отличия (напр.
      'Хладнокровный оптик'), обновление глобальной таблицы рекордов
    decision: Повторить вахту для улучшения ранга и чистоты прохождения или перейти
      к усложненному штормовому испытанию
    duration: 15–30 с
  loop_diagram: " +========================================================================+\n\
    \ |                    МАЯК: НОЧНАЯ ВАХТА — CORE LOOP                      |\n\
    \ +========================================================================+\n\
    \                                    │\n                                    ▼\n\
    \       ┌──────────────────────────────────────────────────────────┐\n       │\
    \     1. КРУГОВОЙ СКАНИРУЮЩИЙ СВИП (360° Поворот)          │\n       │   - Рассеянный\
    \ свет 60° режет туман штормовой тьмы       │\n       │   - Обнаружение фосфорных\
    \ глаз и векторов наплыва        │\n       └────────────────────────────┬─────────────────────────────┘\n\
    \                                    │\n                  ┌─────────────────┴─────────────────┐\n\
    \                  ▼                                   ▼\n   [Одиночные быстрые\
    \ цели]                [Плотное скопление / Альфа]\n   ┌──────────────────────────────┐\
    \        ┌──────────────────────────────┐\n   │ 2A. СВЕТОВОЙ СТАГГЕР         │\
    \        │ 2B. КОНЦЕНТРИРОВАННЫЙ ФОКУС  │\n   │ - Замедление бега на 65%     │\
    \        │ - Сужение луча до 10°        │\n   │ - Сбивание прыжка краулеров  │\
    \        │ - Урон 140 ед/с              │\n   │ - Нагрев = 0°C/с (Безопасно) │\
    \        │ - Нагрев +28°C/с             │\n   └──────────────┬───────────────┘\
    \        └──────────────┬───────────────┘\n                  │               \
    \                        │\n                  │         ┌─────────────────────────────┤\n\
    \                  │         │                             ▼\n               \
    \   │         │              ┌──────────────────────────────┐\n              \
    \    │         │              │ 3. ЦЕПНАЯ БИОДЕТОНАЦИЯ       │\n             \
    \     │         │              │ - Разрыв ядра био-мины       │\n            \
    \      │         │              │ - 250 урона в R=4.5м         │\n           \
    \       │         │              │ - Каскадный подрыв фланга    │\n          \
    \        │         │              └──────────────┬───────────────┘\n         \
    \         │         │                             │\n                  ▼     \
    \    ▼                             ▼\n       ┌──────────────────────────────────────────────────────────┐\n\
    \       │ 4. ОЦЕНКА ТЕРМОМЕТРА ЛИНЗЫ (Текущая T: 0°C...100°C)      │\n       └────────────────────────────┬─────────────────────────────┘\n\
    \                  ┌─────────────────┴─────────────────┐\n                  ▼\
    \ (T < 90°C)                        ▼ (T >= 90°C / Угроза)\n   ┌──────────────────────────────┐\
    \        ┌──────────────────────────────┐\n   │ 5A. ПАССИВНЫЙ СБРОС ТЕПЛА    │\
    \        │ 5B. АВАРИЙНЫЙ ПАРОВОЙ УДАР   │\n   │ - Отпускание фокуса          │\
    \        │ - Нажатие клапана сброса     │\n   │ - Остывание со скор. 35°C/с  │\
    \        │ - Мгновенный сброс до 20°C   │\n   │ - Перевод луча на др. сектор │\
    \        │ - Кольцо пара отталкивает рой│\n   └──────────────┬───────────────┘\
    \        └──────────────┬───────────────┘\n                  │               \
    \                        │\n                  └─────────────────┬─────────────────────┘\n\
    \                                    │\n                                    ▼\n\
    \       ┌──────────────────────────────────────────────────────────┐\n       │\
    \ 6. ОБОРОНА ПЕРИМЕТРА МАЯКА (180 секунд до рассвета 06:00)│\n       │   - HP\
    \ маяка > 0% -> Смена фазы шторма (I -> II -> III -> IV)   │\n       │   - 06:00\
    \ -> Победный рассвет | HP=0% -> Падение башни   │\n       └────────────────────────────┬─────────────────────────────┘\n\
    \                                    │\n                                    └──────────────(Возврат\
    \ к шагу 1)"
  tension_curve: 'Волнообразно-эскалирующая кривая с пилообразными микро-пиками:

    - 0–45 с (Фаза I, Напряжение 20% -> 35%): Спокойное вхождение, один активный сектор.
    Напряжение нарастает плавно, позволяя освоить тайминги нагрева и остывания линзы.

    - 45–90 с (Фаза II, Напряжение 35% -> 65%): Резкий скачок при открытии атак с
    противоположных утесов (180°). Пилообразные всплески напряжения каждые 10–12 секунд
    при одновременном приближении роя краулеров слева и панцирника справа.

    - 90–135 с (Фаза III, Напряжение 65% -> 85%): Штормовой шквал. Напряжение непрерывно
    удерживается на критической отметке из-за угрозы детонации био-мин у стен башни.
    Кратковременные всплески эйфории от цепных взрывов тут же сменяются тревогой из-за
    перегрева линзы.

    - 135–170 с (Фаза IV, Напряжение 85% -> 98%): Выход Абиссального Левиафана и одновременный
    круговой штурм на 360°. Сенсорная перегрузка: вой сирены, грохот шторма, температура
    линзы балансирует на грани 90–95°C.

    - 170–180 с (Кульминация, Напряжение 100% -> 0%): Предельный пик напряжения при
    добивании Левиафана на последних каплях прочности маяка с последующим резким эмоциональным
    катарсисом при наступлении победного рассвета 06:00.'
  core_formulas:
  - 'Формула урона термо-фокуса: Damage_Tick(t) = Base_DPS * (1.0 + 0.5 * min(t_focus,
    2.0)) * dt, где Base_DPS = 140.0 ед/с, а непрерывное удержание узкого луча на
    цели увеличивает интенсивность выжигания вплоть до +100% (280.0 ед/с) через 2.0
    секунды.'
  - 'Термодинамика нагрева линзы: Temp(t+dt) = Temp(t) + (HeatRate * dt) при зажатом
    фокусе, где HeatRate = +28.0 °C/с. При отпускании фокуса: Temp(t+dt) = Temp(t)
    - (CoolRate * dt), где CoolRate = 35.0 °C/с (до базовых 20.0 °C). При достижении
    100.0 °C наступает OverheatLock на 3.0 с с принудительным остыванием 26.6 °C/с.'
  - 'Геометрия и дальность прожектора: Beam_Angle(mode) = 60.0° в режиме наблюдения
    (Wide) и 10.0° в режиме прожига (Focus) с плавным переходом lerp за 0.18 с. Дальность
    светового луча Ray_Length = 32.0 м.'
  - 'Формула светового замедления: Enemy_Speed(light) = Base_Speed * (1.0 - Stagger_Factor),
    где Stagger_Factor = 0.65 при нахождении в широком луче и 0.85 в узком фокусе.
    Задержка восстановления скорости после выхода из луча = 0.45 с.'
  - 'Радиальный урон цепной биодетонации: Blast_Damage(r) = Max_Blast_Damage * max(0.0,
    1.0 - (r / Blast_Radius)), где Max_Blast_Damage = 250.0 ед., Blast_Radius = 4.5
    м. Если цель — другая био-мина, она детонирует мгновенно при получении Blast_Damage
    > 30.0 ед.'
  - 'Процедурный спавн орды шторма: Spawn_Interval(t) = 2.4 - 1.8 * (t / 180.0)^1.4
    секунды (сжатие интервала спавна пачек с 2.4 с на старте до 0.6 с в финале). Количество
    одновременно активных секторов Sectors(t) = 1 + floor(3.0 * (t / 180.0)), расширяясь
    от 1 сектора (север) до 4 секторов (360°).'
  - 'Расчет финального счета вахты: Total_Score = (Surviving_Time_Sec * 50) + (Remaining_Lighthouse_HP
    * 10) + (Total_Chain_Kills * 120) + (No_Overheat_Bonus: 2500 if Overheat_Count
    == 0 else 0).'
  run_progression:
  - '00:00–01:30: Калибровка фокуса — игрок нащупывает тайминг прогрева био-мин (0.80
    с) и осваивает технику секторного сканирования ритмичными взмахами по 45°.'
  - '01:30–03:00: Накопление зарядов парового контрудара — за каждые 15 уничтоженных
    в цепных детонациях тварей маяк генерирует 1 заряд аварийного сброса пара (максимум
    2 заряда в запасе).'
  - '03:00–04:30: Тактическая топология взрывов — игрок использует био-мины не как
    прямую угрозу, а как расставленные игрой бесплатные термоядерные бомбы, намеренно
    пропуская их вглубь роя перед подрывом.'
  - '04:30–06:00: Режим абсолютного теплового балансирования — виртуозное чередование
    1.5-секундных прожигов и мгновенных паровых сбросов позволяет удерживать ДПС на
    максимуме без единого заклинивания в самый яростный момент штурма.'
  meta_progression:
  - 'Ранговая табель Смотрителей: градации званий от ''Ученика кочегара'' (выжито
    <90 с) и ''Младшего смотрителя'' (180 с с потерями базы >50%) до ''Легендарного
    Хранителя Бездны'' (180 с, HP базы 100%, 0 перегревов).'
  - 'Знаки Отличия Оптической Гильдии (достижения за чистое мастерство): ''Хладнокровный
    оптик'' (пережить ночь без единого заклинивания от перегрева), ''Архитектор детонаций''
    (вызвать цепную реакцию из 8+ био-мин одним лучом), ''Рассветный триумф'' (испепелить
    Абиссального Левиафана менее чем за 4 секунды до рассвета), ''Железный бастион''
    (сохранить 100% HP маяка).'
  - 'Разблокировка экстремальных модификаторов ночной вахты: ''Великий тайфун'' (скорость
    вращения прожектора снижена на 30%, но радиус цепных взрывов увеличен на 50%)
    и ''Кровавый прилив'' (спавн исключительно бронированных особей с удвоенным запасом
    прочности).'
  mechanics:
  - name: Термодинамика фокуса линзы Френеля (Thermal Lens Management)
    role_in_loop: 'Главный двигатель боевой системы и ключевой источник риска: переход
      от безопасного сдерживающего света к смертоносному концентрированному прожигу
      ценой накопления тепла.'
    player_decision: Сколько именно долей секунды удерживать узкий прожигающий луч
      на бронированной цели или ядре био-мины, балансируя между максимизацией урона
      и риском заклинивания прожектора на 100% перегреве.
    input_mapping: ПКМ или зажатие Пробела на клавиатуре / Удержание второго пальца
      на сенсорной кнопке 'ФОКУС' на мобильном экране.
    states:
    - 'IDLE_WIDE: Широкий луч 60°, нагрев 0°C/с, естественное охлаждение 35°C/с до
      базовой температуры 20°C.'
    - 'CONVERGING: Фаза сужения линзы от 60° до 10° за 0.18 с, начало нарастания акустического
      дугового гула.'
    - 'THERMAL_FOCUS: Узкий луч 10°, нанесение 140 ед/с урона (+бонус до +100% за
      время удержания), нагрев +28°C/с.'
    - 'OVERHEATED_LOCK: Аварийное заклинивание при 100°C: лампа тускнеет до 5°, урон
      = 0, блокировка фокуса на 3.0 с, принудительный сброс температуры со скоростью
      26.6°C/с.'
    parameters:
    - name: Базовый нагрев линзы
      value: 28.0 °C/с
      tuning_note: Если увеличить до 40.0 °C/с, игрок не успеет прожечь даже одну
        био-мину; если снизить до 15.0 °C/с, исчезнет риск перегрева и игра превратится
        в бездумный зажим кнопки.
    - name: Скорость естественного остывания
      value: 35.0 °C/с
      tuning_note: Если увеличить до 60.0 °C/с, паузы между атаками станут тривиальными;
        если снизить до 15.0 °C/с, темп боя станет излишне вязким и душным.
    - name: Длительность штрафной блокировки перегрева
      value: 3.0 с
      tuning_note: Если снизить до 1.5 с, перегрев перестанет быть фатальной ошибкой;
        если поднять до 5.0 с, любая ошибка на 3-й минуте гарантирует 100% поражение.
    - name: Время сведения линзы в фокус
      value: 0.18 с
      tuning_note: Если увеличить до 0.50 с, теряется ощущение хлесткости и тактильного
        отклика при стрельбе; если сделать мгновенным (0.0 с), фокус воспринимается
        неестественно резко без физики механики.
    - name: Базовый урон концентрированного фокуса
      value: 140.0 ед/с
      tuning_note: Если снизить до 80.0 ед/с, мелкие краулеры будут прорываться сквозь
        узкий луч; если поднять до 250.0 ед/с, отпадет надобность в цепных детонациях.
    feedback_layers:
    - 'Визуал / VFX: При широком луче — мягкий объемный конус света со взвесью капель
      шторма; при зажатии фокуса луч резко сужается до ослепительного бело-голубого
      лазерного копья с искрами дугового разряда и тепловым маревом (distortion shader)
      вокруг оправы линзы. При T > 80°C корпус прожектора раскаляется до багрово-красного
      свечения.'
    - 'Звук (Web Audio): При фокусе — низкочастотный гул трансформатора (60 Гц), переходящий
      в высокий пронзительный визг дуги (от 400 Гц до 2.5 кГц по мере роста температуры);
      при перегреве — резкий металлический щелчок термореле, шипение кипящей меди
      и прерывистый аварийный зуммер.'
    - 'Камера: При зажатии фокуса — динамический микро-зум FOV (с 60° до 56°) с высокочастотной
      низкоамплитудной тряской (micro-shake 0.3 ед.), создающей физическое ощущение
      колоссального давления энергии в линзе.'
    - 'UI / Тактильность: Круговой аналоговый термометр вокруг прицела с сегментным
      заполнением от белого (20°C) через янтарный (60°C) к пульсирующему красному
      (85–100°C); на мобильных устройствах — нарастающая по частоте вибрация Haptic
      Feedback при нагреве выше 75°C.'
    failure_mode: Игрок жадно держит фокус на долях секунды дольше положенного, доводит
      шкалу до 100°C и получает 3-секундный локаут (OVERHEATED_LOCK). Понимает причину
      по резкому щелчку реле, потускневшему лучу и мигающей красной надписи 'ПЕРЕГРЕВ'.
    mastery_curve: Новичок на 30-й секунде постоянно ловит перегрев, пытаясь жечь
      каждого краулера узким лучом. Эксперт на 10-м забеге использует микро-пульсации
      фокуса по 0.6–0.9 с для точечной инициации взрывов, удерживая температуру в
      рабочем диапазоне 60–85°C без единого локаута.
    counterplay: Игра выпускает бронированных панцирников с запасом прочности 280
      HP (требуют 1.6 с непрерывного фокуса) в сопровождении волн быстрых краулеров,
      вынуждая игрока рисковать перегревом или терять периметр.
    synergies:
    - 'Синергия с ''Круговым сканером'': перегрев линзы не позволяет быстро зачистить
      внезапно обнаруженный во тьме фланговый прорыв.'
    - 'Синергия с ''Цепным катализом биолюминесценции'': прогрев ядра био-мины узким
      лучом позволяет за 0.8 с тепла уничтожить пачку врагов, на которую ушло бы 4
      секунды прямого прожига.'
    - 'Синергия с ''Аварийным паровым сбросом'': сброс пара моментально обнуляет накопленное
      тепло линзы, спасая от неизбежного перегрева в критической ситуации.'
    why_unique: В отличие от традиционных пулеметов с перегревом, где нагрев лишь
      ограничивает стрельбу, здесь перегрев неразрывно связан с оптической трансформацией
      луча (рассеивание vs концентрация), меняющей тип урона и область контроля в
      реальном времени.
    pseudocode: "def update_thermal_lens(dt, is_focus_pressed, current_temp, is_locked):\n\
      \    if is_locked:\n        current_temp = max(20.0, current_temp - 26.6 * dt)\n\
      \        if current_temp <= 20.0: is_locked = False\n        return 60.0, 0.0,\
      \ current_temp, is_locked\n    if is_focus_pressed:\n        beam_angle = max(10.0,\
      \ beam_angle - (50.0 / 0.18) * dt)\n        current_temp += 28.0 * dt\n    \
      \    dps = 140.0 * (1.0 + min(focus_timer, 2.0) * 0.5)\n        if current_temp\
      \ >= 100.0: return 60.0, 0.0, 100.0, True\n        return beam_angle, dps, current_temp,\
      \ False\n    else:\n        beam_angle = min(60.0, beam_angle + (50.0 / 0.18)\
      \ * dt)\n        current_temp = max(20.0, current_temp - 35.0 * dt)\n      \
      \  return beam_angle, 0.0, current_temp, False"
  - name: Круговой секторный сканер и штормовая тьма (360° Perimeter Sweep & Fog of
      Storm)
    role_in_loop: 'Двигатель пространственной ориентации и тактического распределения
      внимания: заставляет игрока непрерывно сканировать горизонт и выстраивать приоритеты
      угроз.'
    player_decision: В какой сектор развернуть луч прожектора прямо сейчас, сколько
      секунд удерживать свет на активном направлении и когда рискнуть повернуться
      спиной к наступающему рою для проверки тыла.
    input_mapping: Движение мыши / курсора (направление взгляда прожектора) на ПК;
      Однопальцевый свайп / драг по левой половине экрана на мобильных устройствах.
    states:
    - 'SCANNING_SWEEP: Свободное вращение прожектора с угловой скоростью до 240°/с
      при широком луче.'
    - 'FOCUS_TRACKING: Замедленное прецизионное наведение с угловой скоростью до 90°/с
      при активном узком фокусе.'
    - 'BLIND_SECTOR_ALERT: Сектор вне луча скрыт во мраке; при приближении врагов
      ближе 18 м сквозь тьму начинают мерцать фосфоресцирующие глаза и подается пространственный
      аудио-сигнал всплеска.'
    parameters:
    - name: Сектор рассеянного освещения
      value: 60.0 градусов
      tuning_note: Если расширить до 120.0°, игрок перестанет чувствовать угрозу с
        флангов; если сузить до 30.0°, сканирование превратится в нервную мельтешню.
    - name: Максимальная скорость вращения прожектора
      value: 240.0 град/с
      tuning_note: Если увеличить до 720.0°, исчезнет вес массивной башенной установки;
        если снизить до 90.0°, игрок физически не успеет реагировать на атаки с двух
        противоположных сторон.
    - name: Дистанция обнаружения фосфорных глаз во тьме
      value: 18.0 м
      tuning_note: Если снизить до 6.0 м, игрок будет получать урон без шанса среагировать;
        если увеличить до 30.0 м, исчезнет страх неизвестности и штормовой саспенс.
    - name: Замедление поворота в режиме фокуса
      value: 62.5 % (до 90.0 град/с)
      tuning_note: Если убрать замедление, узкий луч превратится в лазерную саблю,
        выкашивающую экран круговым взмахом; если замедлить сильнее, невозможно будет
        вести движущуюся цель.
    feedback_layers:
    - 'Визуал / VFX: Мощный объемный свет (volumetric fog) с динамическими тенями
      от скал и утесов. В неосвещенных секторах — кромешная тьма шторма и десятки
      мерцающих бирюзовых точек (глаза тварей), отражающих редкие вспышки молний.'
    - 'Звук (Web Audio): Скрип массивных чугунных шестерен поворотного механизма маяка
      при вращении; стереопанорамированные звуки шлепанья лап по мокрым камням и утробного
      рычания из слепых зон.'
    - 'Камера: Камера закреплена сверху-сзади под углом 45° к башне маяка, плавно
      доворачивается за лучом с инерцией (damping 0.12 с), создавая кинематографичный
      объем арены.'
    - 'UI / Тактильность: Круговой радар периметра на ободе экрана с затухающими маркерами
      последнего обнаружения контактов; легкий тактильный щелчок при пересечении лучом
      каждого 90-градусного кардинального направления.'
    failure_mode: Игрок 'залипает' лучом на одном фланге более 3–4 секунд, полностью
      игнорируя тыловой сектор, в результате чего твари из слепой зоны безнаказанно
      прорываются к основанию маяка.
    mastery_curve: Новичок хаотично вращает прожектор на 360°, теряя ориентацию и
      не успевая никого убить. Эксперт выполняет ритмичные секторные свайпы ('тик-так'
      по 120°), считывая мерцание глаз во тьме и разворачиваясь ровно в момент подготовки
      био-детонаций.
    counterplay: Штормовые порывы ветра и волны временно заливают линзу брызгами (легкое
      размытие луча), а быстрые твари намеренно разделяются на две группы с интервалом
      в 180° по азимуту.
    synergies:
    - 'Синергия со ''Световым стаггером'': широкий луч во время сканирования мгновенно
      притормаживает освещенных врагов, давая 2–3 секунды форы для зачистки противоположного
      фланга.'
    - 'Синергия с ''Термодинамикой линзы'': во время поворота прожектора между секторами
      игрок отпускает фокус, эффективно совмещая наведение с пассивным охлаждением
      линзы.'
    why_unique: В отличие от большинства арена-шутеров с полным круговым обзором экрана,
      здесь свет является единственным источником видимости и безопасности, превращая
      тьму в физическую тактическую угрозу.
    pseudocode: "def update_scanner(dt, target_azimuth, current_azimuth, is_focused):\n\
      \    max_turn_speed = 90.0 if is_focused else 240.0\n    angle_diff = normalize_angle(target_azimuth\
      \ - current_azimuth)\n    step = clamp(angle_diff, -max_turn_speed * dt, max_turn_speed\
      \ * dt)\n    current_azimuth += step\n    for enemy in enemies:\n        angle_to_enemy\
      \ = get_azimuth(lighthouse_pos, enemy.pos)\n        is_lit = abs(normalize_angle(angle_to_enemy\
      \ - current_azimuth)) <= (beam_angle / 2.0)\n        enemy.set_illuminated(is_lit)\n\
      \        if not is_lit and distance(lighthouse_pos, enemy.pos) <= 18.0:\n  \
      \          enemy.show_phosphor_eyes(True)\n    return current_azimuth"
  - name: Цепной катализ биолюминесценции (Chain Biomass Catalysis)
    role_in_loop: Главный источник удовлетворения, множитель боевой эффективности
      и инструмент мгновенной зачистки перегруженных секторов.
    player_decision: Выбрать био-мину или альфа-особь в качестве приоритетной цели
      внутри роя и точно рассчитать тайминг и вектор взрывной волны для каскадного
      уничтожения окружающих врагов.
    input_mapping: Точное наведение прицела узкого фокуса на светящееся ядро био-мины
      или сочленения брони альфа-панцирника.
    states:
    - 'DORMANT_BIOMASS: Био-мина или альфа-особь ползет к маяку со стабильным ядром
      (запас фотохимической стабильности 100%).'
    - 'THERMAL_EXCITATION: При попадании под узкий луч ядро начинает пульсировать
      с нарастающей частотой и светиться бирюзовым пламенем (прогрев за 0.80 с).'
    - 'CATALYTIC_DETONATION: Разрыв ядра: ослепительная радиальная вспышка 250 ед.
      урона в радиусе 4.5 м, накладывающая горение 30 ед/с на выживших.'
    - 'CHAIN_REACTION_CASCADE: Если взрывная волна задевает соседнюю био-мину, та
      детонирует без задержки прогрева, удваивая радиус и силу следующего взрыва.'
    parameters:
    - name: Время термического катализа ядра био-мины
      value: 0.80 с
      tuning_note: Если снизить до 0.30 с, взрывы станут случайными и обесценят прицеливание;
        если поднять до 1.80 с, мины будут доходить до маяка раньше, чем успеют нагреться.
    - name: Базовый радиус биодетонации
      value: 4.5 м
      tuning_note: Если увеличить до 7.0 м, один взрыв будет зачищать весь сектор
        без усилий; если уменьшить до 2.5 м, цепные реакции перестанут доставать до
        соседних особей.
    - name: Радиальный урон взрыва био-мины
      value: 250.0 ед
      tuning_note: Если снизить до 120.0 ед, взрыв не сможет гарантированно уничтожать
        мелких краулеров (80 HP); если поднять до 600.0 ед, босс-левиафан погибнет
        от одной случайной мины.
    - name: Множитель очков за цепную реакцию
      value: 1.5x за каждое звено цепи
      tuning_note: Если убрать множитель, игрок потеряет мотивацию собирать цепочки
        из 4+ мин; если сделать 3.0x, таблица рекордов сломается в пользу одной случайной
        аномальной волны.
    feedback_layers:
    - 'Визуал / VFX: Ослепительная сферическая ударная волна ядовито-бирюзового цвета
      (shockwave ring) с разлетом биолюминесцентных искр и физическим отбрасыванием
      рэгдоллов краулеров на 6–8 метров.'
    - 'Звук (Web Audio): Сочный басовый хлопок схлопывающейся плазмы (sub-bass drop
      45 Гц), переходящий во влажный стеклянный треск разрывающегося панциря, с повышением
      тона звукового эффекта для каждого следующего звена комбо.'
    - 'Камера: Направленный радиальный толчок камеры (impulse shake 0.6 ед.) по вектору
      от эпицентра взрыва к маяку, подчеркивающий разрушительную мощь детонации.'
    - 'UI / Тактильность: Всплывающий неоновый счетчик комбо ''БИО-ВСПЛЕСК x3 -> x5
      -> x8!'' по центру экрана; плотный низкочастотный виброотклик длительностью
      80 мс при каждом взрыве цепи.'
    failure_mode: Игрок не удерживает фокус на мине требуемые 0.80 с, прерывая прогрев,
      либо взрывает мину слишком рано, когда вокруг нее еще нет скопления врагов,
      впустую тратя драгоценный тепловой ресурс.
    mastery_curve: Новичок взрывает мины хаотично сразу при появлении. Мастер намеренно
      ждет, пока био-мина заплывет в самую гущу роя или поравняется с тяжелым Левиафаном,
      и одним точным выстрелом запускает каскад из 6 детонаций.
    counterplay: Био-мины при получении урона от широкого луча ускоряются на 20% из-за
      раздражения рецепторов, стремясь сократить дистанцию до основания башни и взорвать
      защитный периметр.
    synergies:
    - 'Синергия с ''Термодинамикой линзы'': успешная цепочка взрывов экономит до 80%
      тепла прожектора, позволяя очистить фланг за 0.8 с нагрева вместо 4.0 с.'
    - 'Синергия со ''Световым стаггером'': замедление роя широким светом позволяет
      сформировать сверхплотную группу врагов ровно в зоне поражения готовящейся к
      взрыву мины.'
    why_unique: Враги служат не просто препятствиями, а интерактивными элементами
      боеприпасов на поле боя, превращая плотность орды из главной угрозы в главное
      оружие игрока.
    pseudocode: "def update_bio_catalysis(dt, enemy, is_targeted_by_focus):\n    if\
      \ enemy.type == 'BIO_MINE':\n        if is_targeted_by_focus:\n            enemy.catalysis_timer\
      \ += dt\n            enemy.set_glow_intensity(enemy.catalysis_timer / 0.80)\n\
      \            if enemy.catalysis_timer >= 0.80 or enemy.hp <= 0:\n          \
      \      trigger_chain_explosion(enemy.pos, radius=4.5, damage=250.0)\n      \
      \          enemy.destroy()\n        else:\n            enemy.catalysis_timer\
      \ = max(0.0, enemy.catalysis_timer - 0.5 * dt)"
  - name: Световой стаггер и фотолитический барьер (Photolytic Barrier & Stagger)
    role_in_loop: 'Главный тормоз наступающего роя и инструмент контроля толпы: позволяет
      безопасно удерживать несколько флангов одновременно без расхода тепла.'
    player_decision: Сколько секунд держать рассеянный свет на наступающей пачке,
      чтобы сбить подготовку прыжка и замедлить краулеров, перед тем как перевести
      внимание на другие секторы.
    input_mapping: Автоматически активно при наведении прожектора в режиме широкого
      луча (по умолчанию, без зажатия кнопки фокуса).
    states:
    - 'UNLIT_AGGRESSION: Враги вне света передвигаются с максимальной скоростью (до
      4.8 м/с) и готовят дальние прыжки (прыжок на 6.0 м через 1.2 с подготовки).'
    - 'ILLUMINATED_BLIND: Попадание в конус света 60°: мгновенный стаггер (остановка
      на 0.25 с), сбивание анимации прыжка, снижение скорости на 65% (до 1.68 м/с).'
    - 'LIGHT_ADAPTATION_DECAY: При непрерывном нахождении в широком свете более 4.0
      с эффект замедления плавно снижается с 65% до 30%, не позволяя игроку бесконечно
      удерживать рой без убийств.'
    parameters:
    - name: Коэффициент замедления в широком свете
      value: 65.0 %
      tuning_note: Если увеличить до 90.0%, игра превратится в тир по неподвижным
        мишеням; если снизить до 30.0%, широкий луч перестанет выполнять роль сдерживающего
        щита.
    - name: Длительность стаггер-шока при первом касании света
      value: 0.25 с
      tuning_note: Если увеличить до 0.80 с, твари будут комично застревать на границе
        луча; если убрать (0.0 с), свет не сможет сбивать прыжки и атаки.
    - name: Время адаптации к свету (спад эффекта)
      value: 4.0 с
      tuning_note: Если снизить до 1.5 с, игрок не успеет обработать второй фланг;
        если сделать бесконечным, можно будет выиграть вахту простым круговым вращением
        без использования фокуса.
    - name: Ширина защитного светового барьера
      value: 60.0 градусов
      tuning_note: Если расширить до 90.0°, контроль станет тривиальным; если сузить
        до 30.0°, широкий луч потеряет смысл по сравнению с узким фокусом.
    feedback_layers:
    - 'Визуал / VFX: При попадании под свет монстры прикрывают глаза костяными щитками,
      шипят и замедляются; от их тел поднимается белесый дымок фотолиза органики.
      На земле под лучом проявляются светящиеся руны древнего периметра.'
    - 'Звук (Web Audio): Приглушенный шипящий звук ожога органики (white noise filtered
      at 1.8 kHz) и визгливый сдавленный писк краулеров, теряющих темп движения.'
    - 'Камера: Плавная стабилизация камеры, легкий кинематографический контраст освещенной
      зоны (bloom boost +20%) на фоне глубоких теней.'
    - 'UI / Тактильность: Иконка замедления над головами монстров (пульсирующая бирюзовая
      иконка разорванного глаза); микро-вибрация при сбивании подготовки прыжка у
      альфа-особи.'
    failure_mode: Игрок надеется удержать весь рой только широким лучом, забывая,
      что через 4.0 секунды наступает световая адаптация и разозленная орда ускоряется
      прямо к основанию маяка.
    mastery_curve: 'Новичок панически держит свет на одной цели до ее упора в стену.
      Эксперт использует широкий луч как ''пульсирующий веер'': быстро ослепляет левый
      фланг на 2 секунды, переключается на правый для детонации, и возвращается назад
      до окончания стаггера.'
    counterplay: Глубоководные панцирники обладают частичным световым иммунитетом
      (замедление всего 25%), пробивая коридор для мелких тварей сквозь световой поток.
    synergies:
    - 'Синергия с ''Круговым сканером'': позволяет контролировать до 180° периметра
      за счет остаточного стаггера (враги медленно восстанавливают скорость еще 0.45
      с после ухода луча).'
    - 'Синергия с ''Цепным катализом биолюминесценции'': замедление сбивает врагов
      в плотный ком вокруг био-мины для идеального сокрушительного взрыва.'
    why_unique: Свет выступает не просто источником видимости, а динамической вязкой
      средой, меняющей физику движения врагов и заставляющей выстраивать пространственный
      ритм вахты.
    pseudocode: "def update_photolytic_barrier(dt, enemy, is_in_wide_beam):\n    if\
      \ is_in_wide_beam:\n        if not enemy.was_lit_last_frame:\n            enemy.apply_stagger(duration=0.25)\n\
      \            enemy.cancel_jump_attack()\n        enemy.light_exposure_time +=\
      \ dt\n        adaptation = clamp(enemy.light_exposure_time / 4.0, 0.0, 1.0)\n\
      \        current_slow = lerp(0.65, 0.30, adaptation)\n        enemy.speed =\
      \ enemy.base_speed * (1.0 - current_slow)\n    else:\n        enemy.light_exposure_time\
      \ = max(0.0, enemy.light_exposure_time - 1.5 * dt)\n        enemy.speed = lerp(enemy.speed,\
      \ enemy.base_speed, dt / 0.45)\n    enemy.was_lit_last_frame = is_in_wide_beam"
  - name: Аварийный паровой сброс и тепловой контрудар (Steam Vent Shockwave)
    role_in_loop: 'Аварийный клапан безопасности и тактический ресурс спасения: мгновенно
      обнуляет перегрев линзы и сдувает прорвавшихся к башне монстров ценой накопленного
      заряда.'
    player_decision: Использовать ли лимитированный заряд пара прямо сейчас для спасения
      периметра от прорыва и моментального сброса температуры с 95°C до 20°C, или
      сберечь заряд на финальный натиск Левиафана.
    input_mapping: Нажатие клавиши 'E' или 'F' на клавиатуре / Кнопка с иконкой манометра
      пара в правом нижнем углу экрана на мобильных устройствах.
    states:
    - 'READY: Доступен 1 или 2 заряда пара (манометр в зеленой зоне 100%).'
    - 'VENTING_BURST: Активация: выпуск колоссального кругового кольца перегретого
      пара вокруг основания башни в радиусе 6.0 м за 0.35 с.'
    - 'RECHARGING: Накопление нового заряда через уничтожение 15 врагов в цепных биодетонациях.'
    parameters:
    - name: Радиус кругового парового кольца
      value: 6.0 м
      tuning_note: Если увеличить до 12.0 м, способность станет ультимативной кнопкой
        зачистки всей карты; если снизить до 3.0 м, пар не будет доставать до занесших
        лапы врагов.
    - name: Сила физического отбрасывания паром
      value: 12.0 м/с (на 5.5 м назад)
      tuning_note: Если снизить до 3.0 м/с, монстры будут сразу продолжать атаку стены;
        если увеличить до 30.0 м/с, твари будут улетать за пределы геометрии острова.
    - name: Снижение температуры линзы при сбросе
      value: Мгновенный сброс до 20.0 °C (-100% накопленного тепла)
      tuning_note: Если сбрасывать только 30.0 °C, способность перестанет ощущаться
        спасительным клапаном; если давать неуязвимость к перегреву на 5 секунд, нарушится
        цикл термодинамики.
    - name: Требуемое число цепных убийств для перезарядки
      value: 15 уничтоженных особей
      tuning_note: Если снизить до 5, игрок сможет спамить сбросом каждые 10 секунд;
        если поднять до 40, заряд будет накапливаться слишком редко (1 раз за всю
        игру).
    feedback_layers:
    - 'Визуал / VFX: Взрывное круговое расширение густого белого облака пара с каплями
      конденсата вокруг башни маяка; все враги в радиусе 6.0 м получают физический
      импульс и опрокидываются назад.'
    - 'Звук (Web Audio): Оглушительный пневматический удар высокого давления (heavy
      air-release transient 120 дБ) с последующим протяжным шипением стравливаемого
      перегретого пара (2.5 с).'
    - 'Камера: Тяжелый вертикальный шейк камеры (trauma 0.7 ед.) с временным радиальным
      размытием (radial blur) по краям экрана на 0.4 секунды.'
    - 'UI / Тактильность: Стрелка термометра со щелчком падает на отметку 20°C; манометр
      пара опустошается; мощная длинная вибрация (Haptic Impact Heavy 150 мс).'
    failure_mode: Игрок нажимает сброс пара при низкой температуре линзы (30°C) и
      пустом периметре из-за паники, оставаясь без аварийного спасения на момент реального
      прорыва Левиафана.
    mastery_curve: Новичок забывает про кнопку пара или тратит ее случайно на первой
      минуте. Эксперт сознательно доводит линзу до 98°C, прожигая элиту, и в долю
      секунды до перегрева жмет паровой удар, одновременно обнуляя нагрев и отбрасывая
      подошедшую свиту.
    counterplay: Левиафан обладает колоссальной массой (отбрасывается всего на 1.5
      м вместо 5.5 м), вынуждая игрока использовать сброс преимущественно для сброса
      тепла и зачистки мелочи.
    synergies:
    - 'Синергия с ''Термодинамикой линзы'': позволяет легально превышать безопасные
      лимиты нагрева, выжимая 100% ДПС из луча в самые критические моменты.'
    - 'Синергия с ''Цепным катализом биолюминесценции'': каждая цепная реакция быстро
      возвращает заряд пара, создавая петлю позитивного подкрепления агрессивной игры.'
    why_unique: 'Связывает механику экстренной защиты базы с термодинамическим ресурсом
      главного оружия: кнопка обороны одновременно является кнопкой максимальной перезарядки
      атаки.'
    pseudocode: "def trigger_steam_vent(current_temp, steam_charges, lighthouse_pos):\n\
      \    if steam_charges <= 0: return current_temp, steam_charges\n    steam_charges\
      \ -= 1\n    current_temp = 20.0\n    spawn_steam_shockwave(lighthouse_pos, radius=6.0)\n\
      \    for enemy in get_enemies_in_radius(lighthouse_pos, radius=6.0):\n     \
      \   push_dir = normalize(enemy.pos - lighthouse_pos)\n        enemy.apply_knockback(push_dir\
      \ * 12.0)\n        enemy.take_damage(40.0)\n        enemy.apply_stagger(duration=1.0)\n\
      \    return current_temp, steam_charges"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / Custom Light State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 80
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - description: bitECS для позиций и состояний 300+ монстров, расчет тепловой модели
      прожектора и физика коллизий Rapier3D.
    name: Simulation Layer
  - description: 'Three.js Scene: InstancedMesh для рендеринга орды, кастомный GLSL
      шейдер конуса объемного света, шейдер мокрого камня и штормовой воды.'
    name: Rendering Layer
  - description: Легковесный Canvas2D / HTML HUD с привязкой к безопасным зонам экранов,
      обработка pointer/touch событий без задержки.
    name: Presentation & UI Layer
  - description: Playgama Bridge SDK 2.x для инициализации рекламы (Rewarded/Interstitial),
      лидербордов и сохранения рекордов в Cloud Storage.
    name: Platform & Storage Layer
  modules:
  - name: LighthouseController
    responsibility: Управление ориентацией прожектора, переключением фокуса, расчетом
      термодинамики и триггерами Overheat.
  - name: VolumetricLightSystem
    responsibility: Кастомный конический меш с процедурным шейдером затухания света,
      расчет пересечений конуса с монстрами.
  - name: SwarmECSManager
    responsibility: Высокопроизводительное управление спавном, перемещением по навигационной
      сетке скалы и здоровьем орды через InstancedMesh.
  - name: StormDirector
    responsibility: Хронометраж 180-секундной ночи, смена фаз погоды, управление освещением
      сцены от ночи к рассвету.
  - name: AudioController
    responsibility: 'Многослойный Web Audio микшер: процедурный шум шторма, гул дуговой
      лампы, звуки детонаций и победный аккорд рассвета.'
monetization:
  strategy_summary: Ненавязчивая гибридная модель с упором на Rewarded Video для спасения
    вахты, межстраничную рекламу между завершенными забегами с жестким кулдауном и
    косметические IAP-наборы стилей луча маяка.
  rewarded_placements:
  - id: revive_night
    name: Спасение вахты (Экстренный рассветный импульс)
    benefit: Мгновенное восстановление 50% HP маяка, полный сброс перегрева линзы
      и ослепительная вспышка, уничтожающая всех врагов в радиусе 10м у основания
      башни.
    cooldown_or_limit: 1 раз за забег
    trigger_moment: Экран поражения при падении HP маяка до 0% до наступления 06:00.
  - id: double_score
    name: Удвоение очков смотрителя
    benefit: Удвоение итогового счета комбо-детонаций для продвижения в глобальной
      таблице лидеров.
    cooldown_or_limit: 1 раз после успешного забега
    trigger_moment: Экран победы при встрече рассвета 06:00.
  interstitial_placements:
  - trigger_event: Возврат в главное меню после завершения или провала забега
    cooldown_seconds: 90
    conditions: Показывается только между сессиями, никогда не прерывает активный
      180-секундный геймплей.
  in_app_purchases:
  - sku: skin_pack_celestial
    name: Набор линз 'Небесный страж'
    description: 'Косметический набор: лазурный цвет луча Френеля, латунный корпус
      с гравировкой и кастомный звук дуговой лампы.'
    price_tier: Tier 1 ($0.99 / 99 YAN)
    reward: Косметический скин 'Лазурный шторм' + значок элитного смотрителя
  - sku: no_ads_bundle
    name: Пакет 'Чистый горизонт' (Отключение рекламы)
    description: Полное отключение межстраничной рекламы + бонусные косметические
      эффекты брызг волн.
    price_tier: Tier 2 ($1.99 / 199 YAN)
    reward: Отключение Interstitial Ads навсегда
  fairness_rules:
  - Никаких пейволлов и покупки преимущества в геймплее (Pay-to-Win строго запрещен).
  - Rewarded Video строго опционально и ограничено одним использованием за 3-минутную
    сессию.
  - Межстраничная реклама запускается только с кулдауном не менее 90 секунд и только
    в экранах меню.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - web
  - crazygames
  initialization_flow:
  - Инициализация SDK Playgama Bridge на старте загрузки игры (bridge.initialize()).
  - Проверка доступности платформенных сервисов (Storage, Leaderboards, Ads).
  - Загрузка сохраненных рекордов и настроек из Cloud Storage (bridge.storage.get()).
  - Скрытие платформенного сплеш-скрина и запуск заглавного меню.
  cloud_save_keys:
  - best_survival_time_sec
  - high_score_points
  - max_chain_combo
  - unlocked_beam_skins
  - sound_volume
  - music_volume
  leaderboards:
  - leaderboard_night_watch (Рейтинг лучших смотрителей по набранным очкам за вахту)
  - leaderboard_combo_masters (Топ игроков по максимальной цепной реакции за один
    взрыв)
  ads_integration:
    interstitial_cooldown: 90
    resume_context_on_ad_close: true
    rewarded_banner_support: true
    sound_mute_on_ad_open: true
  lifecycle_hooks:
  - 'onGamePause: авто-пауза таймера вахты и отключение звука при сворачивании вкладки.'
  - 'onGameResume: плавное возобновление аудиомикшера и контекста WebGL.'
  - 'onOrientationChange: динамическая адаптация Safe Area и масштаба UI.'
art:
