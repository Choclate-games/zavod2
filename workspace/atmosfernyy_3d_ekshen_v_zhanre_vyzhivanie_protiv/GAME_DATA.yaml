  feedback: 'Визуал / VFX: Ослепительная сферическая ударная волна ядовито-бирюзового
    цвета (shockwave ring) с разлетом биолюминесцентных искр и физическим отбрасыванием
    рэгдоллов краулеров на 6–8 метров.; Звук (Web Audio): Сочный басовый хлопок схлопывающейся
    плазмы (sub-bass drop 45 Гц), переходящий во влажный стеклянный треск разрывающегося
    панциря, с повышением тона звукового эффекта для каждого следующего звена комбо.;
    Камера: Направленный радиальный толчок камеры (impulse shake 0.6 ед.) по вектору
    от эпицентра взрыва к маяку, подчеркивающий разрушительную мощь детонации.; UI
    / Тактильность: Всплывающий неоновый счетчик комбо ''БИО-ВСПЛЕСК x3 -> x5 -> x8!''
    по центру экрана; плотный низкочастотный виброотклик длительностью 80 мс при каждом
    взрыве цепи.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Световой стаггер и фотолитический барьер (Photolytic Barrier & Stagger)
  category: 'Главный тормоз наступающего роя и инструмент контроля толпы: позволяет
