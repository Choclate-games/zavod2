  selected_id: D1
  selected_name: 'Маяк: Ночная Вахта'
  selection_reason: 'Вариант D1 («Маяк: Ночная Вахта») выбран как наиболее сильный,
    сфокусированный и идеально адаптированный для веб-платформ и мобильных устройств:
    1. Интуитивный и доступный геймплей с первой секунды: физическая метафора света,
    рассеивающего тьму, понятна мгновенно без обучения. Управление одной рукой (ведение
    пальцем / курсором + зажатие фокуса) идеально ложится на мышь и сенсорные экраны
    без виртуальных джойстиков. 2. Острое тактическое напряжение: термодинамика линзы
    (широкий свет сдерживает, узкий фокус испепеляет, но накапливает опасный перегрев)
    создает непрерывный цикл принятия решений каждую секунду 3-минутной ночи. 3. Высокая
    производительность: рендеринг орды через InstancedMesh + bitECS и кастомный шейдер
    объемного света гарантируют стабильные 60 FPS на любых мобильных устройствах в
    одной сцене Three.js.'
  rejected_reasons:
  - 'D2 («Маяк: Штормовой Бастион») отвергнут, так как расчет физики падения сотен
    тел и гидродинамики волн (Rapier3D) создает избыточную нагрузку на CPU мобильных
    устройств, а механика частых резких свайпов быстро утомляет игрока и уступает
    непрерывному плавному наведению луча.'
  - 'D3 («Маяк: Око Бездны») отвергнут из-за высокого когнитивного барьера: одновременное
    сканирование невидимых во тьме врагов, переключение фильтров и попадание в ритмические
    окна вспышек создает фрустрацию на экранах телефонов без звука и размывает прямое
    ощущение аркадной мощи светового луча.'
  what_it_is_not:
  - 'Никаких окон выбора из 3 карточек апгрейдов и пассивных перков а-ля Vampire Survivors
    / Brotato: глубина строится на тактике управления температурой и естественной
    динамике линзы, а не случайных картах.'
  - 'Никакого виртуального экранного джойстика движения или перемещения персонажа:
    смотритель маяка зафиксирован на вершине башни, управляя только направлением и
    фокусировкой прожектора.'
  - 'Никаких серых кубов-заглушек или нестилизованных ассетов: остров, маяк и волны
    строятся из выразительной low-poly геометрии с процедурными шейдерами мокрого
    камня и биолюминесцентными материалами.'
  - 'Никаких пассивных турелей и автоматического отстрела без участия игрока: каждый
    уничтоженный монстр является результатом прямого прицеливания и фокусировки луча
    игроком.'
  - 'Никакой абстрактной мета-прогрессии с накоплением золота за забеги ради +5% к
    урону: игра представляет собой чистый аркадный челлендж на выживание в рамках
    одной целостной 3-минутной ночи.'
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - 'Механика термодинамического баланса линзы (Thermal Management): постоянный компромисс
    между широким сдерживающим светом без нагрева и концентрированным узким прожигающим
    лучом, быстро накапливающим критический перегрев.'
  - '360-градусное круговое позиционирование угрозы: монстры лезут на остров со всех
    сторон штормового океана, требуя непрерывного мониторинга всех секторов башни.'
  - 'Цепная реакция биодетонации: испепеление крупных биолюминесцентных особей в фокусе
    луча вызывает детонацию, поражающую соседних тварей в рое.'
  - 'Фиксированная сессия выживания до рассвета: строгое ограничение времени (180
    секунд) с визуальной сменой времени суток от кромешной штормовой ночи до первых
    спасительных лучей солнца.'
  signature_scene: 'Ночной штормовой ракурс сверху-сбоку под углом 45 градусов: на
    мокрой черной базальтовой скале возвышается монолитный гранитный маяк, чья латунная
    верхушка раскалена до малинового свечения. Из линзы Френеля бьет мощный золотисто-янтарный
    конический луч света, прорезающий хлещущие диагональные струи ливня и упирающийся
    в край утеса. В пятне света с шипением, искрами и клубами пара испепеляется масса
    шипастых глубоководных тварей, разлетаясь бирюзовыми искрами, а снизу на черные
    мокрые камни с грохотом накатывает гигантский гребень пенистой волны, освещенный
    снизу сотнями фосфоресцирующих глаз надвигающейся из океанской бездны орды.'
  avoid_references:
  - Vampire Survivors (пассивный круговой авто-бой с таймером и карточками апгрейдов)
  - Brotato (аренный авто-шутер с магазином предметов между волнами)
  - Orcs Must Die! (расстановка ловушек и беготня персонажем от третьего лица)
  - Alan Wake (снятие светового щита фонариком с последующим отстрелом из огнестрельного
    оружия)
  - 'Бастион 13: Сапёр Периметра (дизельпанк-FPS с установкой мин и ремонтом турелей)'
knowledge_plan:
  selections:
  - path: threejs/performance_guide.md
    role: core
