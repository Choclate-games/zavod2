_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: atmosfernyy_3d_ekshen_v_zhanre_vyzhivanie_protiv
performance:
  target_fps: 60
  max_draw_calls: 80
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: Фиксированная ночная вахта длительностью ровно 180 секунд (с 00:00 до 06:00
    игрового времени со сжатием 1 минута игры = 30 секунд реальности), разбитая на
    4 нарастающие фазы шторма с кульминацией на 150-180 секундах и победным рассветом.
  win: Успешно продержаться ровно 180 секунд реального времени (достичь игрового времени
    06:00 / рассвета), сохранив целостность защитного периметра маяка (HP базы > 0%).
  lose: Полное разрушение защитного периметра башни (HP маяка = 0%) из-за прорыва
    морских тварей к основанию скалы до наступления рассвета 06:00.
  difficulty_curve: 'Экспоненциально-ступенчатая кривая шторма: 00:00-01:30 (0-45с)
    — «Первый прилив»: атака с одного сектора, обучение термо-фокусу (интенсивность
    25%); 01:30-03:00 (45-90с) — «Двойной фронт»: спавн бронированных особей с противоположных
    утесов (интенсивность 55%); 03:00-04:30 (90-135с) — «Штормовой шквал»: появление
    взрывоопасных био-мин и быстрых роев на 270° (интенсивность 80%); 04:30-06:00
    (135-180с) — «Рассветный натиск»: одновременный штурм со всех 360° с появлением
    левиафана, требующий ювелирного баланса нагрева и цепных реакций (интенсивность
    100%).'
mechanics:
  termodinamika_fokusa_linzy_frenelya_thermal_lens_m:
    name: Термодинамика фокуса линзы Френеля (Thermal Lens Management)
    parameters:
      bazovyy_nagrev_linzy:
        value: 28.0 °C/с
        note: Если увеличить до 40.0 °C/с, игрок не успеет прожечь даже одну био-мину;
          если снизить до 15.0 °C/с, исчезнет риск перегрева и игра превратится в
          бездумный зажим кнопки.
      skorost_estestvennogo_ostyvaniya:
        value: 35.0 °C/с
        note: Если увеличить до 60.0 °C/с, паузы между атаками станут тривиальными;
          если снизить до 15.0 °C/с, темп боя станет излишне вязким и душным.
      dlitelnost_shtrafnoy_blokirovki_peregreva:
        value: 3.0 с
        note: Если снизить до 1.5 с, перегрев перестанет быть фатальной ошибкой; если
          поднять до 5.0 с, любая ошибка на 3-й минуте гарантирует 100% поражение.
      vremya_svedeniya_linzy_v_fokus:
        value: 0.18 с
        note: Если увеличить до 0.50 с, теряется ощущение хлесткости и тактильного
          отклика при стрельбе; если сделать мгновенным (0.0 с), фокус воспринимается
          неестественно резко без физики механики.
      bazovyy_uron_kontsentrirovannogo_fokusa:
        value: 140.0 ед/с
        note: Если снизить до 80.0 ед/с, мелкие краулеры будут прорываться сквозь
          узкий луч; если поднять до 250.0 ед/с, отпадет надобность в цепных детонациях.
  krugovoy_sektornyy_skaner_i_shtormovaya_tma_360_pe:
    name: Круговой секторный сканер и штормовая тьма (360° Perimeter Sweep & Fog of
      Storm)
    parameters:
      sektor_rasseyannogo_osvescheniya:
        value: 60.0 градусов
        note: Если расширить до 120.0°, игрок перестанет чувствовать угрозу с флангов;
          если сузить до 30.0°, сканирование превратится в нервную мельтешню.
      maksimalnaya_skorost_vrascheniya_prozhektora:
        value: 240.0 град/с
        note: Если увеличить до 720.0°, исчезнет вес массивной башенной установки;
          если снизить до 90.0°, игрок физически не успеет реагировать на атаки с
          двух противоположных сторон.
      distantsiya_obnaruzheniya_fosfornyh_glaz_vo_tme:
        value: 18.0 м
        note: Если снизить до 6.0 м, игрок будет получать урон без шанса среагировать;
          если увеличить до 30.0 м, исчезнет страх неизвестности и штормовой саспенс.
      zamedlenie_povorota_v_rezhime_fokusa:
        value: 62.5 % (до 90.0 град/с)
        note: Если убрать замедление, узкий луч превратится в лазерную саблю, выкашивающую
          экран круговым взмахом; если замедлить сильнее, невозможно будет вести движущуюся
          цель.
  tsepnoy_kataliz_biolyuminestsentsii_chain_biomass_:
    name: Цепной катализ биолюминесценции (Chain Biomass Catalysis)
    parameters:
      vremya_termicheskogo_kataliza_yadra_bio_miny:
        value: 0.80 с
        note: Если снизить до 0.30 с, взрывы станут случайными и обесценят прицеливание;
          если поднять до 1.80 с, мины будут доходить до маяка раньше, чем успеют
          нагреться.
      bazovyy_radius_biodetonatsii:
        value: 4.5 м
        note: Если увеличить до 7.0 м, один взрыв будет зачищать весь сектор без усилий;
          если уменьшить до 2.5 м, цепные реакции перестанут доставать до соседних
          особей.
      radialnyy_uron_vzryva_bio_miny:
        value: 250.0 ед
        note: Если снизить до 120.0 ед, взрыв не сможет гарантированно уничтожать
          мелких краулеров (80 HP); если поднять до 600.0 ед, босс-левиафан погибнет
          от одной случайной мины.
      mnozhitel_ochkov_za_tsepnuyu_reaktsiyu:
        value: 1.5x за каждое звено цепи
        note: Если убрать множитель, игрок потеряет мотивацию собирать цепочки из
          4+ мин; если сделать 3.0x, таблица рекордов сломается в пользу одной случайной
          аномальной волны.
  svetovoy_stagger_i_fotoliticheskiy_barer_photolyti:
    name: Световой стаггер и фотолитический барьер (Photolytic Barrier & Stagger)
    parameters:
      koeffitsient_zamedleniya_v_shirokom_svete:
        value: 65.0 %
        note: Если увеличить до 90.0%, игра превратится в тир по неподвижным мишеням;
          если снизить до 30.0%, широкий луч перестанет выполнять роль сдерживающего
          щита.
      dlitelnost_stagger_shoka_pri_pervom_kasanii_sveta:
        value: 0.25 с
        note: Если увеличить до 0.80 с, твари будут комично застревать на границе
          луча; если убрать (0.0 с), свет не сможет сбивать прыжки и атаки.
      vremya_adaptatsii_k_svetu_spad_effekta:
        value: 4.0 с
        note: Если снизить до 1.5 с, игрок не успеет обработать второй фланг; если
          сделать бесконечным, можно будет выиграть вахту простым круговым вращением
          без использования фокуса.
      shirina_zaschitnogo_svetovogo_barera:
        value: 60.0 градусов
        note: Если расширить до 90.0°, контроль станет тривиальным; если сузить до
          30.0°, широкий луч потеряет смысл по сравнению с узким фокусом.
  avariynyy_parovoy_sbros_i_teplovoy_kontrudar_steam:
    name: Аварийный паровой сброс и тепловой контрудар (Steam Vent Shockwave)
    parameters:
      radius_krugovogo_parovogo_koltsa:
        value: 6.0 м
        note: Если увеличить до 12.0 м, способность станет ультимативной кнопкой зачистки
          всей карты; если снизить до 3.0 м, пар не будет доставать до занесших лапы
          врагов.
      sila_fizicheskogo_otbrasyvaniya_parom:
        value: 12.0 м/с (на 5.5 м назад)
        note: Если снизить до 3.0 м/с, монстры будут сразу продолжать атаку стены;
          если увеличить до 30.0 м/с, твари будут улетать за пределы геометрии острова.
      snizhenie_temperatury_linzy_pri_sbrose:
        value: Мгновенный сброс до 20.0 °C (-100% накопленного тепла)
        note: Если сбрасывать только 30.0 °C, способность перестанет ощущаться спасительным
          клапаном; если давать неуязвимость к перегреву на 5 секунд, нарушится цикл
          термодинамики.
      trebuemoe_chislo_tsepnyh_ubiystv_dlya_perezaryadki:
        value: 15 уничтоженных особей
        note: Если снизить до 5, игрок сможет спамить сбросом каждые 10 секунд; если
          поднять до 40, заряд будет накапливаться слишком редко (1 раз за всю игру).
