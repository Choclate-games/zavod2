gameplay_systems:
- name: Система Перемещения и Физического Контроля
  purpose: Обеспечить четкое и отзывчивое управление с учетом инерции и столкновений.
  input: Плавающий виртуальный джойстик (мобильные) или WASD/Стрелки (ПК).
  rules:
  - Скорость масштабируется параметрами маневренности и массы.
  - Коллизии с препятствиями рассчитываются через физический движок с упругим отскоком.
  - При потере управления включается автоматическая стабилизация.
  state:
  - IDLE
  - MOVING
  - DRIFTING
  - IMPACT
  - RECOVERING
  interactions: Взаимодействует с физическими телами врагов, препятствиями и дропами
    наград.
  feedback: Следы на поверхности, частицы пыли, звуки мотора/шагов, динамический наклон
    камеры.
  edge_cases:
  - При застревании в геометрии объект мягко телепортируется в ближайшую свободную
    точку.
- name: Боевая Система и Расчет Урона
  purpose: Обработка ударов, тарана, хитбоксов, расчета брони и эффектов отдачи.
  input: Кнопки атаки, нитро, спец-способностей.
  rules:
  - Итоговый Урон = (БазовыйУрон * ФакторСкорости + БонусСилы) * (1 - СнижениеБроней).
  - Критические удары наносят 2.0x урона при атаке в уязвимые зоны.
  - Тяжелые попадания вызывают 40мс хит-стоп замедление времени.
  state:
  - READY
  - ATTACKING
  - HITSTOP
  - COOLDOWN
  interactions: Триггеры коллизий проверяют пересечения с хитбоксами противников.
  feedback: Заморозка кадра (40мс), фонтан искр/частиц, всплывающие цифры урона.
  edge_cases:
  - Одновременные встречные удары вызывают взаимное физическое отталкивание.
core_design:
  signature_moment: Игрок успевает провести влажную феромонную тропу через тень, пока
    стая птиц накрывает сад, а три разные улитки синхронно доставляют хрупкие росинные
    письма в последний безопасный цветок.
  genre_template_rejected: 'Отвергаем шаблон арены с бесконечными волнами врагов и
    автоматическим ростом урона: он превращает сад в статичное поле боя и не поддерживает
    фантазию о живой почтовой колонии, где последствия возникают из маршрутов, погоды
    и распределения ролей.'
  what_makes_it_different: Игрок не управляет одной всесильной улиткой и не нажимает
    кнопку сбора. Он задаёт почтовые правила, прокладывает физически проходимые тропы,
    распределяет живых работников и заранее строит инфраструктуру, после чего колония
    самостоятельно исполняет план и раскрывает его последствия.
  micro_loop:
  - step: Разметка утренней доставки
    player_action: Игрок проводит мышью или пальцем маршрут от цветка-отправителя
      к нужной ячейке гнезда.
    game_response: На траве появляется светящаяся влажная феромонная дорожка, а подходящая
      улитка выбирает её.
    decision: Выбрать короткий солнечный путь или более длинный теневой маршрут с
      меньшим риском высыхания.
    duration: 4-12 с
  - step: Назначение раковинных ролей
    player_action: Игрок перетаскивает значки письма, капли и щита на конкретных улиток.
    game_response: 'Улитки меняют поведение: курьер несёт груз, сборщик пополняет
      склад, страж перекрывает вход.'
    decision: Оставить больше курьеров ради скорости или снять их с доставки ради
      запаса влаги и защиты.
    duration: 3-8 с
  - step: Наблюдение за движением
    player_action: Игрок тапает по листьям и лужам, чтобы временно перенаправить капли
      и открыть безопасный участок.
    game_response: Меняется сцепление раковин, скорость скольжения и доступность соседних
      ветвей маршрута.
    decision: Потратить редкую каплю на текущую доставку или сохранить её до сезонного
      события.
    duration: 20-45 с
  - step: Проверка почтового результата
    player_action: Игрок наблюдает за вручением писем и исправляет только критические
      разрывы маршрутов.
    game_response: Доставленные письма повышают доверие цветов, а ошибки создают новые
      требования и локальные проблемы.
    decision: Принять небольшой убыток сейчас или перестроить сеть ценой времени и
      феромонов.
    duration: 10-25 с
  meso_loop:
  - step: Планирование дня
    player_action: Игрок выбирает 3-7 писем, приоритеты цветов и стартовые роли колонии.
    game_response: Игра показывает прогноз влажности, тени, движения птиц и расход
      запасов.
    decision: Собрать быстрые благодарственные письма или рискнуть ради редкого письма
      сезона.
    duration: 20-40 с
  - step: Самостоятельная работа колонии
    player_action: Игрок наблюдает за сетью и вмешивается жестами в отдельные узлы.
    game_response: Улитки перемещают письма, добывают нектар, сталкиваются с паутиной
      и меняют строй при угрозе.
    decision: Исправить одну аварию вручную или сохранить внимание для более опасного
      участка.
    duration: 90-180 с
  - step: Событие сезона
    player_action: Игрок выбирает подготовленный ответ на дождь, жару, птиц или нашествие
      жуков.
    game_response: Сезон применяет последствия к влажности, запасам, постройкам и
      доверию цветов.
    decision: Закрыть почтовые ворота ради выживания или продолжить доставку ради
      редкого прироста.
    duration: 15-30 с
  - step: Распределение прироста
    player_action: Игрок размещает новые сотовые ячейки и назначает выросших улиток
      на роли.
    game_response: Изменяются пропускная способность гнезда, доступные маршруты и
      устойчивость к следующему сезону.
    decision: Увеличить склад, маточную ячейку, защиту входа или сеть теневых переходов.
    duration: 30-60 с
  macro_loop:
  - step: Почтовый забег
    player_action: Игрок проходит серию из 4-6 коротких дневных планов.
    game_response: 'Сад меняется: цветы раскрываются, лужи высыхают, птицы запоминают
      шумные маршруты.'
    decision: Стабильно обслуживать знакомые цветы или расшириться к опасной дальней
      клумбе.
    duration: 5-8 мин
  - step: Годовой перелом
    player_action: Игрок переживает главное сезонное событие и сверяет состояние колонии.
    game_response: Меняются правила движения, набор писем и доступность ресурсов следующего
      года.
    decision: Считать год успешным при устойчивом росте или пожертвовать запасом ради
      быстрого расширения.
    duration: 30-60 с
  - step: Возвращение в сад
    player_action: Игрок открывает новые виды улиток, чертежи ячеек и почтовые соглашения.
    game_response: Следующий год получает новые условия, но сохраняет результаты предыдущих
      решений.
    decision: Начать с безопасной специализации или проверить более суровый сезонный
      набор.
    duration: 1-3 мин
  loop_diagram: "[Утренний план]\n      |\n      v\n[Письма цветов] -> [Феромонные\
    \ тропы] -> [Самостоятельный ход улиток]\n      ^                            \
    \          |\n      |                                      v\n[Роли и ячейки]\
    \ <- [Нектар, влага, рост] <- [Паутина и хищники]\n      |\n      v\n[Сезонное\
    \ событие] -> [Потери или прирост] -> [Новый день]"
  tension_curve: 'Первые 30 с дают спокойное чтение сада и настройку маршрутов. К
    60-120 с одновременно появляются высыхание, пересечения троп и первые хищники.
    На 150-210 с игрок видит цену первоначального плана: запас влаги и защитные ячейки
    либо спасают сеть, либо заставляют закрыть дальние цветы. После сезонного события
    напряжение резко спадает, когда уцелевшие улитки возвращаются в гнездо и игрок
    распределяет прирост.'
  core_formulas:
  - 'Скорость улитки: speed = base_speed * (0.55 + humidity * 0.45) * shell_load_modifier;
    при влажности 100% базовая скорость составляет 0.42 м/с.'
  - 'Риск срыва доставки: failure_risk = route_length * dryness_rate * load_fragility
    * predator_pressure; если риск превышает 65%, письмо повреждается.'
  - 'Расход феромона: pheromone_cost = route_length / 6 м, округление вверх; один
    заряд обслуживает 6 м тропы.'
  - 'Прирост колонии: growth = delivered_letters * 2 улитки + stored_nectar / 12 ед;
    рост уменьшается на 50% при дефиците влаги.'
  - 'Удар хищника: predator_impact = 1 - guard_count / (guard_count + 3); при нулевой
    охране нападение блокирует 1-3 ячейки на 12 с.'
  - 'Устойчивый рост года: colony_growth >= 12 улиток и reserve_ratio >= 25% после
    четвёртого сезонного события.'
  run_progression:
  - 'День 1: доступны 2 курьера, 1 сборщик, 1 страж, 3 письма и 2 типа поверхности.'
  - 'День 2-3: открываются пересечения троп, хрупкие письма и цветы с дедлайном 45
    с.'
  - 'День 4-5: появляются паутина длиной 2-5 м, птицы с обзором 8 м и необходимость
    строить теневые переходы.'
  - 'День 6-7: игрок получает 1 сезонный приказ, который изменяет влажность, скорость
    и потребность цветов.'
  - 'Каждое повышение ранга улитки немедленно меняет одну видимую характеристику:
    +0.06 м/с к движению, +1 груз или +2 с устойчивости к паутине.'
  meta_progression:
  - Сохранённые чертежи расширяют гнездо на 1 ячейку после каждого успешно завершённого
    года.
  - Новые породы улиток открываются за доставку 20 писем одного типа и имеют уникальную
    склонность к тени, лужам или защите.
  - Дневник почтмейстера сохраняет 3 постоянных правила сада, например снижение высыхания
    на 8% или увеличение стартового запаса на 6 ед.
  - 'Улучшения не дают плоского урона: они меняют форму сети, время реакции колонии
    и доступные безопасные маршруты.'
  mechanics:
  - name: Феромонная почтовая сеть и роли
    role_in_loop: 'Двигатель петли и главный источник значимых решений: она превращает
      намерение игрока в автономную работу колонии.'
    player_decision: 'Для каждого письма выбрать маршрут, порядок остановок и роль
      улитки: курьер, сборщик, страж или проводник капель.'
    input_mapping: 'Мышь: зажать левую кнопку и провести линию между цветком и ячейкой.
      Сенсорный экран: провести пальцем по саду. Тап по улитке открывает смену роли,
      удержание на маршруте удаляет его.'
    states:
    - 'Пустая почва: маршрут не существует, улитка ищет ближайшую метку.'
    - 'Размеченная тропа: феромон действует, пока его сила выше 20%.'
    - 'Перегруженный узел: на участке стоят 3 улитки, скорость каждой снижается на
      35%.'
    - 'Разрыв тропы: сила метки ниже 20% или путь закрыт паутиной, курьер возвращается
      к последнему узлу.'
    - 'Исполненная доставка: письмо вручено, маршрут получает краткое усиление на
      6 с.'
    parameters:
    - name: Длина одной тропы
      value: 18-65 м
      tuning_note: Ниже 18 м сад ощущается как меню с кнопками, выше 65 м игрок перестаёт
        читать маршрут и планирование становится угадыванием.
    - name: Скорость курьера без груза
      value: 0.42 м/с
      tuning_note: Ниже 0.30 м/с исчезает ощущение живого ответа, выше 0.58 м/с игрок
        не успевает заметить ошибки маршрута.
    - name: Угасание феромона
      value: 0.8%/с
      tuning_note: При 0.3%/с сеть почти не требует обслуживания, при 1.5%/с игрок
        занят рисованием вместо наблюдения за колонией.
    - name: Допустимое число улиток в узле
      value: 3 улитки
      tuning_note: Лимит 1 делает пересечения слишком хрупкими, лимит 5 превращает
        дорожные пробки в незаметную косметику.
    feedback_layers:
    - 'Визуал/VFX: влажная янтарная линия пульсирует с частотой 1.2 Гц, а у выполненного
      письма вспыхивает маленькая росинная печать.'
    - 'Звук Web Audio: движение пальца создаёт тихий шорох, выбор роли звучит отдельным
      щелчком, а пробка понижает тон маршрута на 2 полутона.'
    - 'Камера: при выборе узла выполняется приближение на 6%, при вручении письма
      возникает импульс длительностью 0.12 с.'
    - 'UI/Тактильность: цвет линии показывает запас феромона, на мобильном устройство
      даёт вибрацию 18 мс при создании узла и 45 мс при разрыве.'
    - 'Информационный слой: рядом с тропой отображаются время доставки в секундах
      и прогноз расхода капель.'
    failure_mode: 'Курьер останавливается у серого разрыва, письмо теряет одну печать,
      а UI показывает конкретную причину: высохшая метка, пробка, паутина или отсутствие
      роли проводника.'
    mastery_curve: Через 30 с новичок соединяет два цветка короткой линией. К десятому
      забегу эксперт строит кольцевую сеть с одним общим узлом, разводит роли по времени
      и оставляет запас феромона на сезонное событие.
    counterplay: Солнечные пятна высушивают отдельные сегменты, птицы реагируют на
      слишком прямые маршруты, а цветы меняют приоритет после успешной доставки. Давление
      растёт не волнами, а через накопление незакрытых почтовых обязательств.
    synergies:
    - Теневая ячейка снижает угасание феромона, поэтому строительство напрямую меняет
      геометрию сети.
    - Капельное управление повышает скорость на мокрых сегментах, но лишает запас
      влаги для сезонной защиты.
    - Стражи используют пересечения троп как точки перехвата хищников.
    why_unique: 'Маршрут не является просто указателем пути: он имеет срок жизни,
      стоимость, пропускную способность и социальное значение для цветов. Игрок управляет
      правилами движения, а не каждым шагом улитки.'
    pseudocode: 'получить route_input, snail_roles и map_state

      если route_input содержит новый отрезок, проверить длину и занятость почвы

      создать pheromone_path и списать pheromone_cost

      для каждого курьера выбрать ближайшее письмо с максимальным приоритетом

      если узел перегружен, снизить speed_modifier на 35%

      если сила тропы ниже 20%, перевести курьера в состояние возврата

      при вручении письма увеличить trust_flow и вызвать mail_delivered

      обновить визуал, звук, камеру и тактильный отклик'
  - name: Влажностный рельеф и сцепление раковины
    role_in_loop: 'Физический источник риска и пространственный пазл: игрок выбирает
      между скоростью сухой дорожки и надёжностью влажной тени.'
    player_decision: Решить, провести ли письмо через лужу, тень, лист или открытый
      грунт, а также потратить ли каплю на временное увлажнение опасного сегмента.
    input_mapping: 'Мышь или палец: тап по капле переносит её на соседний участок
      почвы, свайп по листу поворачивает лист на 15 градусов и меняет тень.'
    states:
    - 'Роса: влажность 75-100%, высокая скорость и устойчивое сцепление.'
    - 'Мокрый лист: влажность 55-75%, скорость стабильна, но есть короткое скольжение.'
    - 'Сухой грунт: влажность 25-55%, скорость падает, феромон угасает быстрее.'
    - 'Перегрев: влажность ниже 25% или температура выше 31°C, улитка останавливается
      на 4 с.'
    - 'Паутина: движение замедлено, пока страж или другой курьер не очистит участок.'
    parameters:
    - name: Рабочий диапазон влажности
      value: 25-100%
      tuning_note: Если безопасная зона шире 70%, выбор поверхности исчезает; если
        уже 15%, даже хороший маршрут кажется случайным.
    - name: Глубина лужи
      value: 0.02-0.12 м
      tuning_note: Ниже 0.02 м лужа выглядит декорацией, выше 0.12 м она превращается
        в обязательный тормоз для всех писем.
    - name: Скользящий угол листа
      value: 18 градусов
      tuning_note: При 8 градусах лист не требует внимания, при 30 градусах курьеры
        часто срываются и игрок винит физику.
    - name: Высыхание на солнце
      value: 1.4%/с
      tuning_note: При 0.6%/с солнечный риск не ощущается, при 2.2%/с невозможно планировать
        маршрут дольше 30 с.
    feedback_layers:
    - 'Визуал/VFX: капли имеют объём, отражают утренний свет, а сухой грунт постепенно
      покрывается матовой пылью.'
    - 'Звук Web Audio: в луже слышно мягкое плескание, на сухом грунте усиливается
      шорох, скольжение получает короткий восходящий тон.'
    - 'Камера: срыв на листе даёт наклон на 2 градуса и импульс 0.10 с, перегрев слегка
      отдаляет камеру на 4%.'
    - 'UI/Тактильность: кольцо вокруг улитки показывает влажность, мобильная вибрация
      длительностью 25 мс предупреждает о входе в сухую зону.'
    - 'Информационный слой: при удержании на поверхности показываются влажность в
      процентах, температура в градусах Цельсия и прогноз времени перехода.'
    failure_mode: 'Улитка не исчезает и не получает абстрактный штраф: она заметно
      скользит, оставляет рваный след и останавливается. UI подписывает причину конкретным
      словом: сухо, скользко, жарко или липкая паутина.'
    mastery_curve: Через 30 с новичок выбирает лужу для одного письма. К десятому
      забегу эксперт использует поворот листьев для создания движущегося коридора
      тени и рассчитывает, какая часть тропы высохнет к моменту возвращения.
    counterplay: Солнце перемещается на 12 градусов за 30 с, ветер высушивает листья,
      а дождь временно повышает влажность, но делает поверхность скользкой. Сопротивление
      заставляет менять путь, а не просто ждать перезарядку.
    synergies:
    - Скорость по влажности определяет, успеет ли письмо до дедлайна.
    - Сотовые ячейки для росы увеличивают радиус увлажнения на 2 м.
    - Феромонный проводник может безопасно провести курьера через скользкий лист.
    why_unique: 'Сад является физической логистической картой: одна и та же феромонная
      линия имеет разную стоимость и риск в зависимости от текущей влаги, тени и наклона
      листьев.'
    pseudocode: 'получить snail_position, surface_type, humidity и temperature

      вычислить speed_modifier по влажности и типу поверхности

      если humidity < 25% или temperature > 31°C, включить состояние перегрева

      если surface_type равен листу и угол > 18 градусов, применить скольжение

      если игрок перенёс каплю, добавить 18% влажности ближайшему сегменту

      уменьшать влажность на солнце на 1.4%/с

      при входе в лужу проиграть splash_sound и обновить camera_impulse

      передать новый риск маршруту и почтовому грузу'
  - name: Хрупкие письма и живая сортировка
    role_in_loop: 'Источник награды и темпа: письма задают цели дня, связывают цветы
      с гнездом и превращают рост доверия в новые последствия.'
    player_decision: Выбрать порядок доставки, допустимый риск повреждения и письмо,
      которое будет отложено ради сохранения всей сети.
    input_mapping: Игрок перетаскивает карточки писем в почтовую ленту, тапает по
      цветку для назначения получателя и удерживает карточку для просмотра маршрута
      и срока.
    states:
    - 'Запрошено: цветок сформировал письмо и таймер ещё не запущен.'
    - 'В пути: письмо находится у курьера, его хрупкость уменьшается при сухости и
      столкновениях.'
    - 'На сортировке: письмо ждёт свободного курьера или нужную почтовую ячейку.'
    - 'Вручено: цветок повышает доверие и открывает новый ресурс.'
    - 'Испорчено: письмо теряет ценность, а цветок меняет запрос на более сложный.'
    parameters:
    - name: Количество писем в дне
      value: 3-7 писем
      tuning_note: Меньше 3 писем не создаёт маршрутизационной задачи, больше 7 перегружает
        короткую сессию и превращает её в таблицу.
    - name: Срок обычного письма
      value: 45-90 с
      tuning_note: Ниже 35 с решение зависит от реакции, выше 120 с исчезает ощущение
        срочной почты.
    - name: Вместимость курьера
      value: 1 письмо или 2 лёгких письма
      tuning_note: Одна единица делает логистику понятной, две тяжёлые посылки ломают
        чтение приоритетов.
    - name: Хрупкость росинного письма
      value: 35 единиц прочности
      tuning_note: При 20 единицах письмо слишком случайно портится, при 60 единицах
        влажность и столкновения теряют смысл.
    feedback_layers:
    - 'Визуал/VFX: печать письма трескается по сегментам прочности, а вручение создаёт
      веер из золотых пыльцевых частиц.'
    - 'Звук Web Audio: каждый приоритет имеет свой тембр, ускорение таймера повышает
      частоту тихого тика, успешная доставка звучит как короткий колокольчик.'
    - 'Камера: при передаче письма камера следует за курьером 0.35 с и мягко приближает
      цветок-получатель на 8%.'
    - 'UI/Тактильность: лента сортировки показывает срок и хрупкость, вибрация 35
      мс срабатывает за 10 с до истечения срока.'
    - 'Информационный слой: на карте появляется пунктир от текущей позиции курьера
      к следующей цели и прогноз остатка прочности.'
    failure_mode: 'Просроченное письмо не вызывает мгновенного поражения: цветок закрывается,
      доверие падает на 1 уровень, а UI показывает, где именно исчезло время или прочность.'
    mastery_curve: Через 30 с новичок доставляет обычное письмо в ближайший цветок.
      К десятому забегу эксперт комбинирует два лёгких письма, использует обратный
      путь курьера и сознательно отдаёт одно письмо, чтобы сохранить редкое сезонное.
    counterplay: Цветы меняют запросы после каждой доставки, сезонные письма имеют
      короткие сроки, а птицы увеличивают хрупкость груза на открытых участках. Давление
      создаётся конкуренцией целей, а не спавном одинаковых врагов.
    synergies:
    - Феромонные приоритеты определяют порядок выбора письма автономным курьером.
    - Влажные маршруты сохраняют прочность росинных писем.
    - Складская ячейка позволяет временно снять письмо с маршрута без запуска нового
      таймера.
    why_unique: 'Почтовый груз не является обычным ресурсом: каждое письмо меняет
      отношения с конкретным цветком и перестраивает будущий поток заказов, поэтому
      ошибка сегодня создаёт другой сад завтра.'
    pseudocode: 'получить mail_queue, courier_state и route_condition

      выбрать письмо с максимальным priority_score среди доступных

      если courier_load превышает вместимость, перевести лишнее письмо на сортировку

      уменьшать mail_durability по dryness_rate и predator_pressure

      если distance_to_target / current_speed > time_left, показать предупреждение

      если courier_reached_target, увеличить trust_level и выдать resource_reward

      если mail_durability <= 0 или time_left <= 0, пометить письмо как испорченное

      обновить ленту, таймер, звук и маршрут следующего курьера'
  - name: Сотовое гнездо и сезонный запас росы
    role_in_loop: 'Тормоз расширения и долгосрочная страховка: строительство определяет,
      какие ошибки колония может пережить.'
    player_decision: Разместить ограниченную ячейку так, чтобы усилить матку, хранение,
      тень, сортировку или входную защиту.
    input_mapping: 'Мышь или палец: выбрать контур гнезда и перетащить ячейку на соседнюю
      свободную грань. Поворот двумя пальцами меняет ориентацию переборки.'
    states:
    - 'Чертёж: ячейка показана призрачным контуром, ресурсы ещё не списаны.'
    - 'Строительство: рабочие улитки переносят нектар в течение заданного времени.'
    - 'Рабочая ячейка: её эффект активен, пока есть 1 свободный вход.'
    - 'Переполненная ячейка: запас превышает вместимость, излишек теряется.'
    - 'Сезонная трещина: сильный дождь или жук временно отключает ячейку на 8-20 с.'
    parameters:
    - name: Размер ячейки
      value: 0.8 м
      tuning_note: Ниже 0.6 м ячейки теряются на экране, выше 1.1 м гнездо становится
        слишком маленьким для модульной головоломки.
    - name: Стоимость постройки
      value: 12 ед нектара
      tuning_note: Стоимость 6 ед делает расширение автоматическим, 20 ед заставляет
        откладывать строительство слишком долго.
    - name: Вместимость ячейки росы
      value: 30 ед
      tuning_note: Ниже 18 ед сезонный запас не спасает, выше 45 ед игрок перестаёт
        планировать ежедневный расход.
    - name: Время строительства
      value: 18 с
      tuning_note: При 8 с ячейки можно переставлять без последствий, при 35 с одно
        неверное размещение портит всю короткую сессию.
    feedback_layers:
    - 'Визуал/VFX: новая ячейка собирается из полупрозрачных слоёв слюды, внутри заполняется
      голубыми каплями.'
    - 'Звук Web Audio: перенос нектара звучит ритмом мягких деревянных щелчков, завершение
      строительства даёт низкий тёплый аккорд.'
    - 'Камера: размещение ячейки вызывает подъём камеры на 0.25 м и плавный обзор
      ближайших маршрутов.'
    - 'UI/Тактильность: контур зелёный при полезном соединении и красный при блокировке
      входа, подтверждение сопровождается вибрацией 30 мс.'
    - 'Информационный слой: возле каждого контура отображаются вместимость, сезонная
      устойчивость и число связанных троп.'
    failure_mode: 'Неверная ячейка не пропадает бесследно: она блокирует одну грань,
      подсвечивает перекрытый вход и показывает прогноз потери пропускной способности
      в процентах.'
    mastery_curve: Через 30 с новичок строит склад рядом с маткой. К десятому забегу
      эксперт формирует кольцо из теневых и росинных ячеек, оставляя узкий защищённый
      вход, через который проходят все курьеры.
    counterplay: 'Каждый сезон проверяет разные стороны гнезда: жара сушит наружные
      ячейки, дождь перегружает нижние, жуки ищут самый короткий вход. Одно универсальное
      расположение не работает.'
    synergies:
    - Склад увеличивает число писем, которые можно временно отложить.
    - Теневая ячейка снижает высыхание феромонной сети в радиусе 4 м.
    - Защитная переборка даёт стражам дополнительное время реакции на входе.
    why_unique: 'Гнездо не является экраном улучшений: оно физически меняет карту
      маршрутов, тени, запасы и точки обороны, поэтому каждый год колония получает
      новую логистическую геометрию.'
    pseudocode: 'получить cell_blueprint, nest_grid и resource_stock

      если выбранная грань не соседствует с гнездом, отклонить размещение

      если resource_stock.nektar < 12, показать нехватку и не запускать стройку

      списать 12 ед нектара и добавить cell_state=building

      каждые 1 с продвигать строительство на 1/18

      после завершения активировать эффект по типу ячейки

      при сезонном ударе проверить устойчивость и временно отключить повреждённую
      ячейку

      пересчитать радиусы тени, запаса и защиты для всех маршрутов'
  - name: Следовая оборона от птиц, ос и жуков
    role_in_loop: 'Источник риска и тактического перераспределения: игрок защищает
      не абстрактные жизни, а конкретные почтовые коридоры.'
    player_decision: Выбрать, где держать стражей, какой маршрут сделать незаметным
      и какую доставку временно отменить при угрозе.
    input_mapping: 'Мышь или палец: поставить до 3 феромонных постов тревоги на узлах,
      провести дугу отвлечения вокруг листа и тапом приказать стражу перехватить цель.'
    states:
    - 'Следовая тишина: угрозы нет, стражи восстанавливают силы.'
    - 'Запах замечен: птица или насекомое обнаружило груз, но ещё не выбрало точку
      атаки.'
    - 'Перехват: страж движется к входу или отвлекает хищника на ложный феромонный
      след.'
    - 'Столкновение: хищник блокирует узел на короткий срок, груз может потерять прочность.'
    - 'Отступление: после успешного перехвата угроза покидает участок и оставляет
      временную безопасную зону.'
    parameters:
    - name: Время реакции стража
      value: 1.4 с
      tuning_note: Ниже 0.8 с оборона решает всё автоматически, выше 2.5 с игрок не
        успевает связать сигнал с действием.
    - name: Радиус обзора птицы
      value: 8 м
      tuning_note: При 4 м птица почти не создаёт маршрутизационной угрозы, при 12
        м безопасные зоны становятся слишком редкими.
    - name: Число постов тревоги
      value: 3 поста
      tuning_note: Один пост не даёт выбора, пять постов позволяют закрыть весь сад
        без жертв.
    - name: Время блокировки узла
      value: 12 с
      tuning_note: Ниже 6 с столкновение не меняет план, выше 24 с одна ошибка парализует
        короткий уровень.
    feedback_layers:
    - 'Визуал/VFX: тень птицы скользит по траве за 2.5 с до атаки, оса оставляет жёлтую
      пыльцу, а пост тревоги мигает с частотой 2 Гц.'
    - 'Звук Web Audio: птица слышна низким взмахом слева или справа, оса получает
      направленный жужжащий слой, успешный перехват заканчивается хлопком листа.'
    - 'Камера: угроза вне экрана вызывает короткий сдвиг камеры на 0.15 м в сторону
      звука, столкновение даёт импульс 0.18 с.'
    - 'UI/Тактильность: опасный узел обводится красным сектором с оставшимися секундами,
      мобильное устройство вибрирует серией 20-20-60 мс.'
    - 'Информационный слой: линия обзора птицы и вероятность обнаружения показываются
      только при удержании на посту, сохраняя чистый вид сада.'
    failure_mode: 'Игрок видит причину до потери: тень птицы показывает сектор обзора,
      оса подсвечивает запах груза, жук отмечает кратчайший вход. После ошибки блокируется
      конкретный узел, а не вся колония.'
    mastery_curve: Через 30 с новичок ставит стража у главного входа. К десятому забегу
      эксперт создаёт ложную феромонную ветку, заманивает осу к пустой ячейке и держит
      настоящие письма в движущемся теневом коридоре.
    counterplay: Птицы реагируют на открытые прямые линии, осы на хрупкие письма,
      жуки на запах нектара. Угрозы появляются из состояния сада и действий игрока,
      а не в виде одинаковых волн.
    synergies:
    - Плотная сеть феромонов привлекает больше ос, но позволяет быстрее перебросить
      стражей.
    - Защитная переборка увеличивает время реакции на 0.8 с.
    - Ложный маршрут и поворот листа позволяют вывести хищника из зоны доставки без
      прямого столкновения.
    why_unique: Оборона строится вокруг управления следами и видимостью. Игрок не
      атакует врагов кнопкой, а решает, какой запах оставить, какой путь скрыть и
      какой почтовый груз поставить под риск.
    pseudocode: 'получить predator_state, mail_trails и guard_posts

      для каждой угрозы вычислить target по запаху, видимости и ценности груза

      если угроза вошла в радиус 8 м, создать danger_signal

      если guard_distance / guard_speed <= 1.4 с, назначить перехват

      при наличии ложного следа с вероятностью 70% сменить target

      если guard_reached_target, уменьшить predator_pressure и создать safe_zone на
      6 с

      если threat_reached_node, заблокировать узел на 12 с и снизить прочность груза

      обновить тень, Web Audio, камеру, UI и тактильный отклик'
  - name: Ритмичная нарезка и подготовка
    role_in_loop: генератор ресурсов и заготовок
    player_decision: Нарезать ингредиенты сериями с риском порезать палец или работать
      медленно
    input_mapping: Тап по экрану / Пробел в такт мерцающему маркеру
    states:
    - ОЖИДАНИЕ
    - НАРЕЗКА
    - ЗОЛОТОЙ_ТАЙМИНГ
    - ЗАМЕДЛЕНИЕ
    parameters:
    - name: Окно идеального тапа
      value: 0.12 с
      tuning_note: Меньше — игрок сбивается; больше — исчезает ритм
    - name: Число кусочков на порцию
      value: 4 шт
      tuning_note: Влияет на темп прохождения заказов
    feedback_layers:
    - 'Визуал: разлетающиеся дольки, частицы пара, вспышка на комбо'
    - 'Звук: сочный стук ножа о деревянную доску, нарастающий звон комбо'
    - 'Камера: микро-акцент при закрытии целого ингредиента'
    - 'UI: множитель серии ×1.5/×2.0 над разделочным столом'
    failure_mode: Промах мимо такта сбрасывает комбо и задерживает подачу блюда на
      1.0 с
    mastery_curve: Новичок нарезает по одному клику; эксперт отбивает ритм 180 BPM
      без пауз
    counterplay: Очередь гостей уплотняется, добавляются блюда с 3 типами нарезки
    synergies:
    - Подготовленные продукты идут в «Контроль жара вока»
    why_unique: Превращает рутину в драйвовый ритм-геймплей
    pseudocode: "on_knife_tap():\n    diff = abs(now - beat_target)\n    if diff <\
      \ 0.12: combo += 1; emit_slice_vfx(); add_ingredient()\n    else: combo = 1;\
      \ knife_stuck_timer = 0.5; play_dull_sound()"
  - name: Контроль жара вока и сковороды
    role_in_loop: ключевой фактор качества блюда
    player_decision: Держать максимальный огонь ради скорости или убавить жар во избежание
      гари
    input_mapping: Удержание регулятора пламени / свайп подбрасывания
    states:
    - ХОЛОДНО
    - ИДЕАЛЬНАЯ_ОБЖАРКА
    - ПЕРЕГРЕВ
    - СГОРЕЛО
    parameters:
    - name: Время идеальной готовности
      value: 3.5 с
      tuning_note: Короче — игрок не успевает; длиннее — скука
    - name: Окно до сгорания
      value: 1.8 с
      tuning_note: Создает приятный стресс
    feedback_layers:
    - 'Визуал: шипящее масло, золотистая корочка, поднимающийся дымок'
    - 'Звук: сочное шипение, треск пламени горелки'
    - 'Камера: мягкий жар-шейдер по краям экрана при перегреве'
    - 'UI: круговой индикатор степени прожарки с зеленой зоной'
    failure_mode: Передержанное блюдо сгорает в угли и отправляется в ведро
    mastery_curve: Умение одновременно вести 3 сковороды на грани сгорания
    counterplay: Случайные скачки пламени и наплыв VIP-клиентов
    synergies:
    - Успешная обжарка кормит «Очередь и чаевые»
    why_unique: Честная физика жара вместо простого таймера ожидания
    pseudocode: "on_tick(dt):\n    temp += flame_power * dt * 15\n    if temp in IDEAL_ZONE:\
      \ cook_progress += dt * 1.5\n    elif temp > MAX_ZONE: burn_timer += dt; if\
      \ burn_timer > 1.8: set_burnt()"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite 5.x
  renderer: threejs
  renderer_version: ^0.170.0
  physics_engine: Rapier3D (@dimforge/rapier3d-compat 0.13.x)
  state_manager: Custom TinyEventBus & Reactive GameStore
  audio_engine: Howler.js (^2.2.4) с WebAudio API
  target_fps: 60
  max_draw_calls: 75
  max_triangles_or_sprites: 40000
  bundle_size_budget_mb: 4.2
  layers:
  - name: Application Layer
    responsibility: Инициализация Vite, ресайз канваса, полноэкранный режим, прелоадер.
  - name: Platform & Ads Layer
    responsibility: Адаптер Playgama Bridge, менеджеры Interstitial и Rewarded рекламы,
      Cloud Save.
  - name: Core Engine Layer
    responsibility: Фиксированный цикл GameLoop 60Гц, EventBus, маршрутизация ввода.
  - name: Physics Simulation Layer
    responsibility: Шаги симуляции Rapier3D, фильтрация коллизий, рэгдолл-синхронизация.
  - name: Gameplay Systems Layer
    responsibility: Боевая система, спавн врагов, выбор 3 карт улучшений, расчет комбо.
  - name: Entity Management Layer
    responsibility: Пул сущностей игрока, врагов, снарядов и осколков.
  - name: Rendering Layer
    responsibility: Three.js граф сцены, InstancedMesh батчинг, тени, эмиттеры частиц.
  - name: UI & HUD Layer
    responsibility: HTML5/CSS3 оверлей, виртуальный джойстик, полосы HP, модальные
      окна.
  modules:
  - name: src/main.ts
    desc: 'Точка входа: инициализация Playgama Bridge, загрузка ассетов и запуск Game.'
  - name: src/core/Game.ts
    desc: Главный координатор, стейт-машина и управление сценами.
  - name: src/core/GameLoop.ts
    desc: Фиксированный 60Гц цикл обновления с аккумулятором дельты.
  - name: src/core/EventBus.ts
    desc: Типизированная шина событий для слабой связности систем.
  - name: src/platform/PlaygamaService.ts
    desc: Служба работы с @playgama/bridge (реклама, облачные сейвы, лидерборды).
  - name: src/physics/PhysicsWorld.ts
    desc: Обертка физического мира Rapier3D с фильтрами слоев коллизий.
  - name: src/entities/Player.ts
    desc: Контроллер игрока с расчетом физических сил и управления.
  - name: src/entities/EnemyPool.ts
    desc: Пул переиспользуемых сущностей врагов с логикой поведения.
  - name: src/systems/CombatSystem.ts
    desc: Расчет урона, хит-стопа, импульсов и комбо-бонусов.
  - name: src/ui/UIManager.ts
    desc: Управление HUD, окном выбора карт, главным меню и экраном результатов.
monetization:
  strategy_summary: Гибридная модель Free-to-Play для Яндекс Игр и веб-порталов. Высокий
    eCPM за счет полезных Rewarded видео без агрессивного навязывания.
  rewarded_placements:
  - id: revive_run
    name: Второе Дыхание (Возрождение)
    benefit: Восстановление 50% HP + 3 сек неуязвимости с силовой волной, раскидывающей
      врагов.
    cooldown_or_limit: 1 раз за забег.
    trigger_moment: При получении смертельного урона.
  - id: double_gold_run
    name: Удвоение Наград (2x Золото)
    benefit: Удваивает все заработанные шестеренки и монеты за завершенный раунд.
    cooldown_or_limit: Доступно на каждом экране результатов.
    trigger_moment: Экран окончания игры.
  - id: free_card_reroll
    name: Переброс Карт Улучшений
    benefit: Обновляет список 3 карт улучшений с гарантией Редкой или Эпической карты.
    cooldown_or_limit: До 2 раз за забег.
    trigger_moment: Окно выбора 3 карт.
  interstitial_placements:
  - trigger_event: Между волнами и при возврате в Главное Меню.
    cooldown_seconds: 90
    conditions: Интервал не менее 90 секунд, не показывается во время активного геймплея.
  in_app_purchases:
  - sku: ad_free_vip_pass
    name: VIP Пропуск (Без Рекламы)
    description: Отключает межстраничные баннеры, дает вечный бонус +25% к золоту
      и эксклюзивный скин.
    price_tier: 199 YAN / 199 руб
    reward: Отключение Interstitial + VIP скин
  fairness_rules:
  - Весь игровой контент можно открыть бесплатно через геймплей.
  - Полное отсутствие рекламы во время активного боя.
  - Автоматическая пауза игры и отключение звука во время показа рекламы.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - ok
  - crazy_games
  - playgama
  - mock
  initialization_flow:
  - 1. installViewportGuards() — блокировка страницы до первой отрисовки.
  - 2. `await bridge.initialize()` (с таймаутом 10 с) + `in_game_loading_started`.
  - 3. Язык платформы (`bridge.platform.language`) до первого перевода DOM.
  - 4. Тихая авторизация на vk/ok — до чтения сейвов, с таймаутом 5 с.
  - 5. Загрузка сейва через `bridge.storage.get(key)` (без storageType).
  - '6. Выдача необработанных покупок: `getPurchases()` → выдать → потребить.'
  - 7. Предзагрузка текстур, мешей и звуков, сборка сцены и UI.
  - 8. Прогресс до 100% и пауза на затухание сплэша (~700 мс).
  - 9. `bridge.platform.sendMessage('game_ready')` — ровно один раз.
  - 10. Поднятие баннеров и старт обучения — только после game_ready.
  cloud_save_keys:
  - player_save_v1
