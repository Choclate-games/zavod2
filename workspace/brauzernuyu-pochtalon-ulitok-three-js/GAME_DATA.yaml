raw_prompt: 'Создай браузерную игру «Почтальон для улиток» на Three.js: расслабляющая
  логистическая головоломка в миниатюрном саду, где игрок мышью или свайпом прокладывает
  маршруты улиток между цветами. Учитывай влажность почвы, тень, лужи, листья, паутину
  и птиц, добавь короткие уровни на 2–4 минуты, постепенное усложнение, выразительных
  улиток-персонажей и адаптивный интерфейс для мобильных устройств. Используй тёплую
  книжную иллюстрацию, объёмные капли росы и мягкий утренний свет; не используй киберпанк
  и неон.'
title: Браузерную «почтальон улиток» three.js
