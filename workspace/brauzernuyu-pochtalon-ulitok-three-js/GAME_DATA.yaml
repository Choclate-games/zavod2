  when_to_use: При реализации ритм-механик, попадания в долю, окон Perfect/Good и
    комбо-множителей.
  rules:
  - AudioContext.currentTime — единственный источник истины времени (не Date.now()
    и не performance.now()).
  - 'Окна точности: Perfect <= 65 мс, Good <= 140 мс, Miss > 140 мс.'
  - Учитывать калибровку задержки звукового тракта (audio latency offset).
  architecture: RhythmClock отслеживает BPM и рассылает события 'rhythm:beat' через
    EventBus.
  implementation_guidance: Пульсируй параметры шейдеров и масштаб элементов UI в такт
    музыке.
  common_mistakes:
  - Синхронизация через requestAnimationFrame приводит к рассинхрону при просадках
    FPS.
  checklist:
  - Попадание в такт регистрируется точно независимо от частоты обновления монитора.
  knowledge_refs:
  - mechanics/rhythm_sync.md
- skill_id: building_skill
  name: Grid Modular Base & Power Grid Architecture
  filename: BUILDING_SKILL.md
  purpose: Реализация строительства по сетке, проверки коллизий и распространения
    энергии по пилонам.
  when_to_use: При создании модульных стен, турелей, генераторов и конвейерных цепочек.
  rules:
  - Привязка к сетке (Snap-to-Grid) с полупрозрачным превью-призраком постройки.
  - Граф смежности энергосети обновляется мгновенным поиском в ширину (BFS).
  - Все постройки регистрируются в пространственной хеш-таблице (SpatialHash).
  architecture: BuildingGridManager хранит матрицу занятости и валидирует условия
    размещения.
  implementation_guidance: Отключай турели при разрыве связи с электрогенератором.
  common_mistakes:
  - Разрешение постройки поверх спавнеров врагов или внутри геометрии игрока.
  checklist:
  - Постройки мгновенно встают по сетке, энергосеть корректно питает подключенные
    узлы.
  knowledge_refs:
  - mechanics/grid_building.md
- skill_id: experience_skill
  name: Плотность первой сессии и телеметрия
  filename: EXPERIENCE_SKILL.md
  purpose: 'Держит первую сессию в целевых показателях и делает её измеримой: ED =
    MD/min × (SF + EB + AR) / CLP.'
  when_to_use: При работе над стартом игры, обучением, HUD, экраном проигрыша, рестартом
    и при добавлении любого события телеметрии.
  rules:
  - Первое осмысленное действие доступно не позже 3.0 с после загрузки.
  - Первая награда или явный прогресс — не позже 12.0 с.
  - Целевая плотность решений — около 12 значимых решений в минуту.
  - 'Порядок улучшений: окно стимуляции → снижение когнитивной нагрузки → качество
    отклика → частота решений.'
  - 'Каждое действие игрока имеет три канала отклика: визуальный, звуковой и изменение
    состояния цели.'
  - Экран проигрыша называет причину; рестарт занимает не больше 2 секунд.
  - 'Обязательные события телеметрии: события не заданы.'
  - '`first_action` и `first_reward` отправляются ровно один раз за сессию.'
  architecture: Модуль `src/telemetry/Telemetry.ts` с методами `track` и `trackOnce`;
    системы публикуют события через EventBus, телеметрия подписывается на них и никогда
    не вызывается из горячего цикла напрямую.
  implementation_guidance: Реализуй контракт из TELEMETRY_SPEC.md, замерь тайминги
    первой сессии локально и зафиксируй результат в DEVLOG.md. Если целевые значения
    не достигаются, это не повод менять цифры в документе — это находка.
  common_mistakes:
  - Логотип, меню или загрузочный экран поверх геймплея в первые секунды — время до
    первого действия сорвано.
  - 'Полный HUD с первой секунды: игрок не понимает, на что смотреть (растёт CLP).'
  - Обучение модальным окном с текстом вместо ограничения сцены.
  - Синхронная отправка телеметрии в игровом цикле — просадки кадра.
  - Отправка `first_reward` повторно за сессию — воронка первой сессии искажается.
  checklist:
  - 'Замерено: время до первого действия ≤ 3.0 с.'
  - 'Замерено: время до первой награды ≤ 12.0 с.'
  - Все события из TELEMETRY_SPEC.md отправляются и видны в консоли dev-сборки.
  - Ни один сигнал провала из PLAYER_PROMISE.md не воспроизводится на первой сессии.
  - Отсутствие сети не вызывает исключений в геймплейном коде.
  knowledge_refs: []
