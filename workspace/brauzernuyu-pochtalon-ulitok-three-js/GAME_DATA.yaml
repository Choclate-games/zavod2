mechanics:
- name: Феромонная почтовая сеть и роли
  category: 'Двигатель петли и главный источник значимых решений: она превращает намерение
    игрока в автономную работу колонии.'
  priority: core
  description: 'Маршрут не является просто указателем пути: он имеет срок жизни, стоимость,
    пропускную способность и социальное значение для цветов. Игрок управляет правилами
    движения, а не каждым шагом улитки.'
  player_interaction: 'Мышь: зажать левую кнопку и провести линию между цветком и
    ячейкой. Сенсорный экран: провести пальцем по саду. Тап по улитке открывает смену
    роли, удержание на маршруте удаляет его.'
