  с динамическим зумом. Environment: Живая природа: травы, пыльца, свет сквозь листву.
  Central Action: Вы задаёте правила, а колония живёт сама и приносит последствия
  ваших решений. — the moment is caught mid-action, with clear cause and effect readable
  in a single frame. Visible in-game HUD overlay: Верх-Лево: Полоса прочности (HP)
