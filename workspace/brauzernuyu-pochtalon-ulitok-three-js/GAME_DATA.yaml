  монет и кнопка Паузы, Низ-Лево: Плавающий сенсорный виртуальный джойстик; touch
  controls at the bottom corners. Lighting: Мягкий рассеянный дневной свет, тёплые
  тени. Color palette: #7cb342, #f2b134, #fff3cd, #22301f, #33452c. High visual clarity,
  readable silhouettes, immersive WebGL game aesthetics.'
