<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10251f" />
    <title>Почтальон улиток</title>
  </head>
  <body>
    <main id="game-root" aria-label="Почтальон улиток">
      <canvas id="game-canvas"></canvas>
      <section id="hud" class="screen" aria-live="polite">
        <header class="topbar">
          <div>
            <p class="eyebrow">Садовая почта</p>
            <h1>День <span id="day-value">1</span></h1>
          </div>
          <div class="resource-strip">
            <div class="resource"><span class="resource-icon dew">✦</span><b id="dew-value">64</b><small>роса</small></div>
            <div class="resource"><span class="resource-icon nectar">●</span><b id="nectar-value">36</b><small>нектар</small></div>
            <div class="resource"><span class="resource-icon trust">♥</span><b id="trust-value">0</b><small>доверие</small></div>
          </div>
        </header>
        <div class="mission-card panel">
          <div class="mission-title"><span class="status-dot"></span><span id="mission-value">Соедините цветок с гнездом</span></div>
          <div class="progress-track"><span id="mission-progress"></span></div>
          <small id="weather-value">Утро: влажность 78% · тень движется</small>
        </div>
        <div class="help-card panel" id="help-card">
          <b>Проведите маршрут</b>
          <span>От цветка до гнезда. Улитки сами понесут письма.</span>
        </div>
        <button id="pause-button" class="icon-button" type="button" aria-label="Пауза">Ⅱ</button>
        <div id="event-toast" class="event-toast" role="status"></div>
      </section>
      <section id="touch-controls" aria-label="Мобильное управление">
        <div id="joystick-zone" class="joystick-zone">
          <div id="joystick-base" class="joystick-base"><div id="joystick-knob" class="joystick-knob"></div></div>
        </div>
        <div class="action-zone">
          <button id="hydrate-button" class="action-button hydrate" aria-label="Увлажнить сад"><span>✦</span><small>роса</small></button>
          <button id="guard-button" class="action-button guard" aria-label="Поставить стража"><span>◈</span><small>страж</small></button>
        </div>
      </section>
      <section id="pause-panel" class="modal screen" hidden>
        <div class="modal-card panel">
          <p class="eyebrow">Сад ждёт</p>
          <h2>Почта на паузе</h2>
          <p>Маршруты сохраняются, а улитки отдыхают в тени.</p>
          <button id="resume-button" class="primary-button" type="button">Продолжить</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
