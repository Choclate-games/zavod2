raw_prompt: Создай изометрическую 3D стелс-игру на Three.js. Игрок управляет курицей
  в пределах фермы. У патрулирующих псов есть визуализированные конусы зрения (Spotlights
  / Mesh cones). При входе в конус включается тревога. Игрок может нажимать кнопку
  'Спрятаться под коробку', чтобы замаскироваться, собирать зерна для открытия ворот
  и добегать до выхода.
title: 'Куриный Побег 3D: Стелс на Ферме'
slug: chicken-stealth-farm-escape-3d
genre: 3D Стелс-головоломка / Аркадный Экшен
subgenre: Изометрический стелс / Тактический лабиринт
renderer: threejs
renderer_reason: User explicitly specified 'threejs'.
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web)
orientation: landscape
target_audience: Широкая казуальная и мидкорная аудитория 10-35 лет на платформах
  Yandex Games и WebGL, любящая забавных животных, тактические стелс-задачи и динамичный
  аркадный геймплей.
core_loop: Скрытное исследование территории фермы -> Уклонение от патрулей собак и
  маскировка коробкой -> Сбор золотых зерен -> Открытие запертых ворот -> Побег в
  зону эвакуации -> Получение наград и разблокировка скинов/уровней.
hook: Культовая механика маскировки картонной коробкой в стиле Metal Gear Solid, перенесенная
  в комедийный сеттинг фермы с дерзкой курицей и собаками с неоновыми конусами обзора!
player_fantasy: Вы — ловкая курица-спецагент под прикрытием, способная перехитрить
  грозных сторожевых псов, мгновенно раствориться под картонной коробкой прямо перед
  носом врага и совершить легендарный побег на волю.
session_model: Быстрые напряженные сессии по 1.5–3 минуты на уровень с нарастающей
  комплексностью патрулей и мета-прогрессией скинов.
unique_value_proposition: Уникальный сплав тактического стелса с мгновенно считываемыми
  правилами (четкие светящиеся конусы обзора) и вирусного комедийного геймплея, адаптированного
  под управление одним пальцем на смартфонах и клавиатуру на ПК.
vision: Создать эталонную браузерную 3D стелс-игру с сочным геймфилом, плавной анимацией,
  процедурными спецэффектами и непрерывной кривой удовольствия от перехитрения умных
  патрульных псов.
elevator_pitch: Дерзкая курица планирует побег века! Прокрадитесь мимо патрулирующих
  фермерских псов, прячьтесь под картонную коробку при малейшей опасности, соберите
  все золотые зерна, чтобы взломать замок ворот, и вырвитесь на свободу!
win_conditions: Собрать необходимое количество золотых зерен на уровне, активировать
  механизм открытия главных ворот и пересечь финишную линию эвакуации.
lose_conditions: Попадание в освещенный конус зрения собаки в незамаскированном виде
  или совершение движения в коробке на глазах у патрульного пса, приводящее к поимке.
progression_summary: 'Последовательное прохождение 30+ уровней с возрастающим числом
  сторожевых псов, движущимися маршрутами, камерами-фонарями, сужающимися укрытиями;
  мета-прогрессия: покупка за зерна скинов курицы (Ниндзя, Спецагент, Робо-Цыпа) и
  скинов коробок (Посылка, Сейф, Арбуз).'
difficulty_curve: 'Плавное введение: Уровень 1 (1 стационарный пес, обучение коробке),
  Уровни 2-5 (линейные патрули и базовый сбор), Уровни 6-15 (пересекающиеся конусы
  зрения, собаки-гончие с высокой скоростью), Уровни 16+ (ловушки-шумелки, узкие лабиринты
  и ограниченное время на маскировку).'
scores:
  fun: 9
  originality: 8
  replayability: 8
  development_cost: 9
  visual_appeal: 9
  mobile_fit: 10
  monetization: 9
  platform_fit: 10
  overall_score: 8.9
  justification: 'Идеальное попадание в веб-формат: мгновенная читаемость визуальных
    конусов зрения, виральный юмористический сеттинг, простое управление и естественная
    интеграция рекламы за возрождение и скины.'
references:
- name: Metal Gear Solid
  genre: Тактический стелс-экшен
  mechanics:
  - Маскировка картонной коробкой
  - Индикаторы тревоги (!) над врагами
  - Секторы видимости патрулей на миникарте
  lessons: Коробка создает сильный комедийный эффект и дает игроку четкое ощущение
    контроля над риском.
  what_to_avoid: Перегруженное сложное управление и длительные катсцены.
- name: Untitled Goose Game
  genre: Комедийный стелс-песочница
  mechanics:
  - Управление дерзкой птицей
  - Сбор квестовых предметов на ферме
  - Манипуляция вниманием людей/животных
  lessons: Милые животные и яркий визуальный стиль вызывают мгновенный эмоциональный
    отклик у казуальной аудитории.
  what_to_avoid: Чрезмерно свободные и неструктурированные цели без четкого аркадного
    тайминга.
- name: Hunter Assassin / Sneak Out 3D
  genre: Гиперказуальный изометрический стелс
  mechanics:
  - Яркие полупрозрачные конусы света от врагов
  - Управление свайпами / виртуальным стиком
  - Короткие уровни-лабиринты
  lessons: Визуализация конуса зрения фонариком делает стелс 100% честным и интуитивным.
  what_to_avoid: Однообразная серая геометрия уровней без интерактивных объектов.
mechanics:
- name: Изометрическое перемещение курицы
  category: movement
  priority: core
  description: Плавное 8-направленное перемещение персонажа с физической инерцией,
    наклоном тела при поворотах и процедурной анимацией семенящих лапок.
  player_interaction: WASD / Стрелки на клавиатуре или аналоговый экранный джойстик
    на мобильных устройствах.
  feedback: Частицы пыли из-под лапок, характерный звук топота и покачивание гребешка
    курицы.
  technical_complexity: Low
  strengths:
  - Отзывчивый и мгновенный отклик
  - Идеальная адаптация под сенсорные экраны
  weaknesses:
  - Требует точной настройки коллизий с углами заборов
- name: Маскировка под коробку (Box Hide)
  category: stealth
  priority: core
  description: По нажатию кнопки курица мгновенно прячется под падающую сверху картонную
    коробку. В неподвижном состоянии под коробкой курица полностью невидима для патрульных
    псов даже внутри конуса зрения. Если игрок пытается двигаться в коробке на глазах
    у собаки, пес немедленно распознает обман и атакует.
  player_interaction: Кнопка 'Пробел' на ПК или крупная плавающая сенсорная кнопка
    с иконкой коробки справа на экране смартфона.
  feedback: Звук глухого хлопка картона, частицы облачка пыли, анимация опускания
    коробки с глазками-щелками.
  technical_complexity: Medium
  strengths:
  - Глубокий тактический выбор 'риск/награда'
  - Сильный юмористический вау-эффект
  weaknesses:
  - Игрок может бесконечно сидеть в коробке, если не ввести таймер бдительности собаки
- name: Динамический конус зрения собак (Vision Cone System)
  category: ai
  priority: core
  description: Патрулирующие псы проецируют перед собой секторный 3D-меш конуса зрения
    (Spotlight Mesh) с углом 65 градусов и дальностью 6 метров. Геометрия конуса динамически
    обрезается препятствиями (стенами, стогами сена) с помощью лучевых проверок Raycast.
  player_interaction: Визуальное считывание безопасных зон и траекторий движения охранников
    для планирования тайминга перебежек.
  feedback: Конус плавно пульсирует полупрозрачным мягким зеленым/желтым цветом в
    спокойном режиме и вспыхивает агрессивным красным светом при обнаружении.
  technical_complexity: Medium
  strengths:
  - Абсолютная честность правил игры для пользователя
  - Эффектный кинематографичный вид сцены
  weaknesses:
  - Множественные Raycast-расчеты на мобильных CPU требуют оптимизации
- name: Сбор зерен и механизм открытия ворот
  category: progression
  priority: core
  description: По всей территории уровня разбросаны золотые светящиеся зерна. Сбор
    определенного процента зерен (или всех) заряжает ключ-механизм и отпирает главные
    ворота фермы, ведущие к свободе.
  player_interaction: Перемещение курицы через триггер-зоны зерен.
  feedback: Приятный звонкий звук подбора монетки, вылетающие золотые звездочки и
    заполнение круговой шкалы ключа в HUD.
  technical_complexity: Low
  strengths:
  - Четкая промежуточная цель, мотивирующая исследовать опасные зоны
  weaknesses:
  - Может превратиться в рутину, если зерна лежат слишком кучно
- name: ИИ тревоги и погони (Alert & Pursuit AI)
  category: ai
  priority: core
  description: 'Конечный автомат собаки (FSM): Патруль (Patrol) -> Подозрение (Suspicious,
    желтый конус, поворот к источнику) -> Тревога/Погоня (Alert, красный конус, ускоренный
    бег к курице) -> Потеря цели (Search, возвращение на маршрут).'
  player_interaction: Убегание за угол или своевременная остановка под коробкой вне
    прямого контакта.
  feedback: Над головой собаки появляется анимированный знак '!' со звуком сирены
    Metal Gear, пес издает грозный лай.
  technical_complexity: Medium
  strengths:
  - Высокий уровень драматизма и адреналина в момент погони
  weaknesses:
  - Необходимо предотвратить застревание собак в углах заборов
gameplay_systems:
- name: Система стелс-детекции и конусов обзора (Stealth Detection System)
  purpose: Обеспечение математически точной проверки видимости игрока патрульными
    собаками с учетом укрытий и состояния маскировки.
  input: Координаты курицы, состояние маскировки (isHiding), вектор скорости курицы,
    координаты и поворот собаки.
  rules:
  - 'Если курица находится вне конуса зрения собаки: статус незаметен (Hidden).'
  - 'Если курица вошла в конус зрения и isHiding == false: запуск накопления шкалы
    тревоги собаки (Alert Gauge 0 -> 100% за 0.3 сек).'
  - 'Если курица вошла в конус зрения, isHiding == true и скорость == 0: собака считает
    коробку обычным объектом окружения и продолжает патруль.'
  - 'Если курица двигается под коробкой (скорость > 0.1) внутри конуса: немедленный
    переход в режим Тревоги (собака видит ползущую коробку).'
  - Препятствия (заборы, амбары, тюки сена) блокируют луч зрения (Raycast occlusion).
  state:
  - PATROL_IDLE
  - PATROL_WALK
  - SUSPICIOUS_INVESTIGATING
  - ALARM_PURSUIT
  - SEARCHING_LOST_TARGET
  interactions: Взаимодействует с PlayerController, DogAIController, LevelGeometryManager,
    UIManager (шкала тревоги).
  feedback: Цветовая смена меша конуса (Зеленый -> Желтый -> Красный), шейдерный глитч
    на краях экрана при тревоге.
  edge_cases:
  - Игрок надел коробку прямо в момент, когда собака уже бежит на него в упор (собака
    должна обнюхать коробку и успокоиться, если игрок замер вовремя)
  - Несколько собак заметили игрока одновременно (координация погони без наслоения
    мешей)
- name: Система маскировки и камуфляжа (Camouflage System)
  purpose: Управление механиками скрытности курицы, спавном коробки и физическими
    ограничениями режима укрытия.
  input: Нажатие кнопки Hide/Коробка, вектор движения игрока.
  rules:
  - При активации коробка опускается на курицу за 0.15 секунды с легким сквош-эффектом.
  - Скорость перемещения курицы под коробкой снижается на 60% от базовой (забавное
    медленное ползание).
  - При повторном нажатии или резком рывке коробка сбрасывается вверх с эффектом разлетающихся
    щепок/пыли.
  state:
  - EXPOSED_NORMAL
  - BOX_DROPPING
  - BOX_STATIONARY_STEALTH
  - BOX_CRAWLING_EXPOSED
  interactions: Взаимодействует с PhysicsController, StealthDetectionSystem, AudioSystem.
  feedback: Звук падения коробки 'Тумп!', визуальные прорези для глаз на картонке,
    светящиеся в темноте.
  edge_cases:
  - Активация коробки внутри узкого дверного проема (коробка автоматически масштабируется
    без клиппинга в стены)
- name: Система целей уровня и триггеров побега (Level Objectives & Gate System)
  purpose: Контроль прогресса уровня, подсчет собранных зерен и управление логикой
    открытия ворот.
  input: Триггер сбора зерен (GrainTrigger), триггер финишной зоны (ExitZoneTrigger).
  rules:
  - Каждый уровень содержит фиксированное количество золотых зерен (например, 10 шт).
  - Для разблокировки ворот требуется собрать 100% обязательных зерен.
  - При сборе последнего зерна ворота фермы проигрывают анимацию открытия, а маркер
    выхода подсвечивается неоновым лучом в небо.
  - Достижение зоны выхода при открытых воротах завершает уровень победой.
  state:
  - GATHERING_SEEDS
  - GATE_UNLOCKING
  - GATE_OPEN_ESCAPE_ACTIVE
  - LEVEL_COMPLETED
  interactions: Взаимодействует с HUD, AudioSystem, CameraController (кратковременный
    фокус на открывающиеся ворота).
  feedback: Камера на 1 секунду показывает распахивающиеся ворота фермы со звоном
    колокольчика, в HUD зажигается зеленый статус 'ВОРОТА ОТКРЫТЫ! БЕГИ К ВЫХОДУ!'.
  edge_cases:
  - Игрок добегает до ворот до сбора зерен (ворота заперты, выводится подсказка 'Соберите
    еще N зерен')
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.170.0
  physics_engine: Rapier3D (@dimforge/rapier3d-compat 0.13.x)
  state_manager: Zustand + TinyEventEmitter
  audio_engine: Howler.js (Web Audio API)
  target_fps: 60
  max_draw_calls: 45
  max_triangles_or_sprites: 35000
  bundle_size_budget_mb: 3.5
  layers:
  - name: Core Layer
    description: Игровой цикл, GameLoop, EventBus, управление сценой и тиками физики
      Rapier3D
  - name: Gameplay & AI Layer
    description: FSM патрулей собак, генератор конусов видимости, контроллер курицы
      и маскировки
  - name: Render & VFX Layer
    description: Three.js Scene Graph, кастомные шейдеры конуса обзора, инстансинг
      окружения, система партиклов
  - name: UI & Platform Layer
    description: DOM/Canvas UI, виртуальные контроллеры, мост Playgama Bridge SDK,
      сохранение в облако
  modules:
  - name: PlayerController
    responsibility: Обработка ввода, управление физическим телом курицы, анимации
      шага и скрытности
  - name: DogAIController
    responsibility: Навигация по путевым точкам, конечный автомат состояний (Patrol/Pursuit),
      обработка слуха и взгляда
  - name: VisionConeMesh
    responsibility: Процедурная генерация сектора конуса видимости с трассировкой
      лучей и кастомным шейдером затухания
  - name: LevelManager
    responsibility: Загрузка геометрии уровня, спавн зерен, управление коллизиями
      и триггерами ворот
  - name: PlaygamaSDKBridge
    responsibility: Взаимодействие с рекламой (Rewarded/Interstitial), лидербордами
      и облачными сохранениями
monetization:
  strategy_summary: 'Мягкая гибридная модель: ненавязчивые межстраничные баннеры между
    уровнями и высокоценные Rewarded Video за мгновенный ревайв на месте поимки, удвоение
    наград и эксклюзивные скины шпионских куриц.'
  rewarded_placements:
  - id: revive_checkpoint
    name: Мгновенное спасение (Revive)
    benefit: Возрождает курицу на безопасном расстоянии от собаки с временной 3-секундной
      неуязвимостью и сохраненным прогрессом собранных зерен.
    cooldown_or_limit: 1 раз за уровень
    trigger_moment: Экран поимки собакой (Game Over Screen)
  - id: double_grain_reward
    name: Удвоение урожая зерен
    benefit: Удваивает количество собранных на уровне золотых зерен для ускоренной
      разблокировки скинов.
    cooldown_or_limit: После каждого успешного уровня
    trigger_moment: Экран победы (Victory Screen)
  - id: unlock_ninja_skin
    name: Скин 'Курица-Ниндзя' в аренду
    benefit: Предоставляет доступ к уникальному скину с бесшумным бегом на 3 уровня.
    cooldown_or_limit: Без ограничений
    trigger_moment: Магазин скинов / Экран выбора уровня
  interstitial_placements:
  - trigger_event: Завершение каждого 3-го уровня
    cooldown_seconds: 90
    conditions: Показывается только между уровнями, никогда не прерывает активный
      геймплей или процесс маскировки.
  in_app_purchases:
  - sku: no_ads_pack
    name: Набор 'Шпионский Комфорт' (No Ads)
    description: Полное отключение обязательной межстраничной рекламы навсегда + 500
      золотых зерен в подарок.
    price_tier: Tier 2 (~150 Yans / 149 RUB)
    reward: Отключение Interstitials + 500 зерен
  - sku: skin_pack_special_ops
    name: Премиум-набор скинов 'Спецназ Курятника'
    description: 3 легендарных скина курицы (Курица 007, Кибер-Цыпленок, Курица в
      смокинге) и 3 скина коробок (Дипломат, Сейф, Металлическая бочка).
    price_tier: Tier 3 (~250 Yans / 249 RUB)
    reward: 6 эксклюзивных скинов
  fairness_rules:
  - Все уровни на 100% проходимы без доната и просмотра рекламы.
  - Реклама за ревайв доступна строго 1 раз за попытку, чтобы сохранить спортивный
    интерес стелса.
  - Никаких всплывающих баннеров во время движения под конусами зрения.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - gamedistribution
  - mobile_web
  initialization_flow:
  - '1. bridge.initialize({ platform: ''auto'' })'
  - 2. bridge.storage.get(['unlocked_levels', 'gold_grains', 'equipped_skin', 'sound_settings'])
  - 3. bridge.advertisement.checkBannerSupport()
  - 4. bridge.game.ready() после загрузки 3D-сцены и текстур
  cloud_save_keys:
  - player_progress_level
  - total_gold_grains
  - unlocked_skins_array
  - current_equipped_skin
  - sound_volume_settings
  leaderboards:
  - leaderboard_fastest_escape
  - leaderboard_total_grains
  ads_integration:
    rewarded_method: bridge.advertisement.showRewardedVideo()
    interstitial_method: bridge.advertisement.showInterstitial()
    banner_method: bridge.advertisement.showBanner()
    reward_callback_handling: Обязательная пауза физики Three.js/Rapier и приглушение
      звука Howler во время показа рекламы.
  lifecycle_hooks:
  - bridge.on('visibility_change', (state) => toggleGamePause(state))
  - bridge.on('audio_focus_change', (hasAudio) => toggleAudioMute(!hasAudio))
