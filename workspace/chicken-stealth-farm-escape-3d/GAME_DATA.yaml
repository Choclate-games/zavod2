definition_of_done:
- Курица плавно управляется с клавиатуры (WASD) и сенсорного джойстика с плавной физикой.
- Кнопка 'Коробка' мгновенно маскирует курицу; неподвижная курица в коробке не триггерит
  тревогу патрульных собак.
- Конусы зрения собак визуализированы красивыми градиентными полупрозрачными мешами
  и корректно блокируются заборами.
- При входе незамаскированной курицы в конус включается тревога (!), собака с лаем
  бросается в погоню.
- Все золотые зерна собираются, открывая запертые ворота уровня со спецэффектом.
- 'Интегрирован Playgama Bridge SDK: работают Rewarded Ads за ревайв, Interstitials
  между уровнями и сохранение прогресса.'
- Стабильные 60 FPS в мобильных и десктопных браузерах при весе бандла менее 3.5 МБ.
