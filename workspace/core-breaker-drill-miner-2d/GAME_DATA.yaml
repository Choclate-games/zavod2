raw_prompt: Разработай вертикальный 2D экшен-майнер на PixiJS с разрушаемой воксельно-пиксельной
  породой. Реализуй физику бурения, автострельбу с рикошетом лучей от породы, сбор
  редкой руды, выбор случайных улучшений каждые 50 метров глубины и эпичные битвы
  с боссами.
title: 'Бурильщик Бездны: Рикошет Руды'
slug: core-breaker-drill-miner-2d
genre: 2D Экшен-рогалик / Майнер
subgenre: Вертикальный шахтёр / Bullet Heaven
renderer: pixijs
renderer_reason: User explicitly specified 'pixijs'.
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK Games / Mobile Web)
orientation: portrait
target_audience: Любители Dome Keeper, Noita, Vampire Survivors и Mr. Mine; казуальные
  и мидкорные игроки мобильного веба 16-35 лет, ценящие сочную физику разрушений и
  быстрые сессии.
core_loop: Бурение породы вниз -> Автострельба с рикошетом по монстрам -> Сбор выпадающей
  руды -> Выбор перка каждые 50 метров -> Битва с боссом на рубеже биома -> Эвакуация
  / Гибель -> Мета-улучшение бура и лазеров в ангаре.
hook: Гипер-удовлетворяющее пиксельное разрушение породы в комбинации с лазерным авто-рикошетом,
  превращающим каждый узкий туннель в смертоносную световую ловушку для подземных
  чудовищ.
player_fantasy: Пилот тяжелобронированного высокотехнологичного бурового меха, пробивающегося
  сквозь недра враждебной планеты, расщепляющего скалы и плавящего титанических боссов
  лучами рикошета.
session_model: Быстрые вертикальные спуски по 4-8 минут с постоянным мета-прогрессом
  и открытием новых буров и лазерных модулей.
unique_value_proposition: 'Уникальный симбиоз физического майнинга в разрушаемом пиксельном
  мире и рикошетной баллистики Vampire Survivors: чем уже прорытый туннель, тем выше
  плотность лазерных отражений и сокрушительнее урон.'
vision: Создать главный веб-хит в жанре экшен-майнеров с плавной адаптацией под мобильные
  экраны, сочным тактильным откликом разрушений и глубокой вариативностью синергий
  билдов.
elevator_pitch: Вертикальный 2D рогалик-майнер, где вы управляете боевым буром, уничтожаете
  процедурную пиксельную породу и запускаете рикошетящие лазеры, испепеляющие орды
  подземных тварей. Каждые 50 метров — выбор перка, каждые 200 метров — колоссальный
  босс!
win_conditions: Пройти 5 глубинных биомов (1000 метров), победить Древнее Ядро Бездны
  и успешно эвакуировать ультра-редкое Реликтовое Ядро.
lose_conditions: Полное истощение очков прочности (HP) бурового меха или перегрев
  реактора при критическом давлении.
progression_summary: 'Внутри забега: выбор 1 из 3 случайных улучшений каждые 50 метров.
  Вне забега: покупка постоянных улучшений корпуса, систем охлаждения, лазерных матриц
  и разблокировка новых специализированных мехов за добытую руду.'
difficulty_curve: 'Экспоненциальное нарастание: плотность и прочность породы увеличиваются
  с глубиной, монстры получают броню и ядовитые снаряды, а боссы каждые 200м требуют
  постоянного движения и грамотного позиционирования.'
scores:
  fun: 9
  originality: 8
  replayability: 9
  development_cost: 7
  visual_appeal: 9
  mobile_fit: 10
  monetization: 9
  platform_fit: 10
  overall_score: 8.9
  justification: Вертикальный геймплей идеально ложится на смартфоны в портретном
    режиме. Рикошетные лазеры и разрушаемая порода создают вирусный визуальный фидбек,
    а рогаликовый драфт перков обеспечивает высокий ретеншн.
references:
- name: Dome Keeper / Wall World
  genre: Майнинг-рогалик / Защита базы
  mechanics:
  - Бурение породы
  - Сбор ресурсов
  - Ограничение грузоподъемности
  lessons: Удовлетворяющий звук крошения руды и четкое ощущение сопротивления породы
    критически важны.
  what_to_avoid: Слишком медленный бэктрекинг на базу — игра должна быть сфокусирована
    на непрерывном экшене вниз.
- name: Noita
  genre: Пиксельный рогалик с симуляцией материалов
  mechanics:
  - Разрушаемый попиксельно мир
  - Физика сыпучих веществ
  lessons: Микро-разрушения создают восторг и ощущение свободы действий.
  what_to_avoid: Избыточная процессорная нагрузка полной симуляции жидкостей — для
    веб-платформы лучше использовать легковесное чанковое маскирование/воксели.
- name: Peglin / Vampire Survivors
  genre: Roguelike / Рикошет / Auto-Shooter
  mechanics:
  - Геометрический рикошет снарядов
  - Автоматическая стрельба
  - Выбор перков 1 из 3
  lessons: Эффект каскадного урона и перемножения модификаторов рикошета дает максимальный
    всплеск дофамина.
  what_to_avoid: Загромождение экрана нечитаемыми снарядами боссов.
mechanics:
- name: Динамическое бурение и деструкция породы
  category: core_drilling
  priority: core
  description: Игрок направляет бур в скальную породу. Порода разрушается чанками
    и пиксельными масками, оказывая сопротивление и замедляя скорость в зависимости
    от плотности.
  player_interaction: Касание/джойстик в сторону движения; мех автоматически активирует
    буровую головку при контакте с породой.
  feedback: Интенсивный скриншейк, искры, разлетающиеся осколки пикселей и вибрация
    на мобильных устройствах.
  technical_complexity: High
  strengths:
  - Высочайшая тактильность
  - Свобода прокладки собственных путей
  weaknesses:
  - Нагрузка на мобильный CPU при частых обновлениях текстурных атласов
- name: Автострельба лазерами с геометрическим рикошетом
  category: combat
  priority: core
  description: Боевой модуль автоматически выпускает лучи в ближайших врагов. Лучи
    отражаются от неразрушенной породы под углом падения, нанося дополнительный урон
    за каждый отскок.
  player_interaction: 'Тактическое позиционирование: бурение узких туннелей для создания
    лазерных смертоносных ловушек.'
  feedback: Неоновое свечение, лазерные вспышки на местах излома луча, нарастающий
    звуковой питч при множественных рикошетах.
  technical_complexity: Medium
  strengths:
  - Не требует ручного прицеливания
  - Поощряет креативное бурение
  weaknesses:
  - Возможные просадки производительности при 50+ одновременных лучах
- name: Магнитный сбор руды и перегрузка
  category: economy
  priority: high
  description: Из разрушенной породы выпадают частицы руды (уголь, медь, титан, плазма,
    алмазы). Магнитный захват притягивает их к меху.
  player_interaction: Сбор ресурсов в процессе спуска для мета-апгрейдов и временных
    бустов.
  feedback: Руда летит по параболе с шлейфом, пополняя счетчик с приятным перезвоном.
  technical_complexity: Low
  strengths:
  - Мгновенное вознаграждение за майнинг
  - Стимул отклоняться от прямого спуска
  weaknesses:
  - Риск отвлечься от босса ради редкого кристалла
- name: Выбор улучшений каждые 50 метров
  category: roguelite_progression
  priority: core
  description: При пересечении контрольной глубины игра замедляется и предлагает выбрать
    1 из 3 случайных улучшений забега (число рикошетов, цепная молния, плазменный
    бур, дрон-помощник, вампиризм).
  player_interaction: Выбор карточки нажатием на экран.
  feedback: Плавный slow-motion, всплывающее неоновое окно с карточками перков и анимацией
    свечения редкости.
  technical_complexity: Medium
  strengths:
  - Бесконечная реиграбельность и вариативность билдов
  weaknesses:
  - Необходимость жесткого баланса синергий
- name: Битвы с глубинными Боссами-Стражами
  category: boss_fights
  priority: high
  description: Каждые 200 метров шахта блокируется энергобарьером, и появляется босс
    (например, Механический Землерой, Матерь Скарабеев, Кристаллический Голем). Боссы
    имеют уязвимые точки и разрушают породу своими атаками.
  player_interaction: Маневрирование в ограниченном пространстве, кайтинг, использование
    пробуренных ходов для рикошета.
  feedback: Красная тревожная индикация, полоса здоровья босса сверху экрана, эпичные
    взрывы с расколом экрана при победе.
  technical_complexity: High
  strengths:
  - Кульминационные моменты забега
  - Проверка собранного билда
  weaknesses:
  - Требуется тонкая настройка хитбоксов и паттернов атак
gameplay_systems:
- name: Система разрушаемой воксельно-пиксельной породы (Voxel-Destruction System)
  purpose: Обеспечение плавного и производительного разрушения грунта чанками с сохранением
    коллайдеров для рикошета.
  input: Координаты бура меха, радиус бурения, показатель мощности копания.
  rules:
  - Мир делится на вертикальные чанки 32x32 тайла/пикселя.
  - Каждый пиксель/тайл имеет прочность и тип материала (земля, гранит, базальт, рудная
    жила).
  - Бур наносит урон прочности вокселей в радиусе контакта.
  - При прочности <= 0 воксель стирается из RenderTarget текстуры чанка и порождает
    частицы/руду.
  - Контур оставшихся вокселей формирует полигональные коллайдеры для лазерных рикошетов.
  state:
  - chunk_grid_matrix
  - active_loaded_chunks
  - ore_spawn_table_by_depth
  - dirty_chunk_flags
  interactions: Взаимодействует с физикой меха, снарядами лазера и спавнером лута.
  feedback: Пиксельный шейдер разрушения, брызги породы, осыпание гравия.
  edge_cases:
  - Игрок пытается пробурить нерушимый барьер границы мира — бур отскакивает с искрами.
  - Быстрый спуск вниз — асинхронная фоновая подгрузка и генерация нижних чанков без
    фризов.
- name: Система рикошетной баллистики лучей (Laser Ricochet Physics)
  purpose: Расчет траектории лазеров с множественными отражениями от поверхностей
    породы и нанесением урона врагам.
  input: Позиция орудия, угол выстрела, количество отскоков (Bounces), урон, пробиваемость.
  rules:
  - Луч использует быстрый 2D Raymarching / Raycast по физической сетке чанков.
  - При попадании в породу луч отражается по формуле R = D - 2*(D·N)*N (где N - нормаль
    поверхности).
  - Каждый рикошет увеличивает урон луча на +15% (множитель синергии).
  - Луч пробивает врагов или наносит сплэш-урон в зависимости от активных перков.
  state:
  - active_beams_list
  - bounce_counter
  - beam_damage_multiplier
  - active_laser_segments
  interactions: Взаимодействует с сеткой породы и хитбоксами монстров/боссов.
  feedback: Неоновый лазерный луч с эффектом остаточного свечения (bloom), искры в
    точках нормали.
  edge_cases:
  - Луч застревает в бесконечном параллельном отражении между двумя близкими стенами
    — ограничение тайм-аута жизни луча (макс. 0.4 сек).
- name: Система рогаликового драфта улучшений (Milestone Perk System)
  purpose: Генерация 3 случайных перков каждые 50 метров с учетом синергий и текущего
    билда игрока.
  input: Событие преодоления глубины (depth % 50 == 0).
  rules:
  - Генерация 3 карт из пула (Обычные, Редкие, Эпические, Легендарные).
  - 'Пул содержит: +Отскоки луча, +Скорость бурения, Дроны-сборщики, Расщепляющий
    лазер, Замораживающее поле, Электро-цепь.'
  - Возможность 1 бесплатного реролла за просмотр Rewarded видеорекламы.
  state:
  - player_active_perks_inventory
  - perk_deck_pool
  - rerolls_available
  interactions: Модифицирует статы меха, оружия и физики в реальном времени.
  feedback: Модальное окно с сочными картами, звуки перелистывания, анимация вспышки
    при выборе.
  edge_cases:
  - Смерть игрока ровно на отметке 50м — приоритет отдается экрану поражения.
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: pixijs
  renderer_version: ^8.0.0
  physics_engine: Matter.js (^0.19.0)
  state_manager: Reactive EventBus / Modular Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 35
  max_triangles_or_sprites: 8000
  bundle_size_budget_mb: 4.5
  layers:
  - name: BackgroundParallax
    type: TilingSprite
    zIndex: 0
  - name: VoxelTerrainLayer
    type: RenderTexture / Chunk Sprites
    zIndex: 10
  - name: DroppedOreLayer
    type: ParticleContainer
    zIndex: 20
  - name: EnemiesAndBossLayer
    type: Container
    zIndex: 30
  - name: PlayerDrillLayer
    type: Container
    zIndex: 40
  - name: LaserBeamVFXLayer
    type: Graphics / Custom Mesh
    zIndex: 50
  - name: ParticlesVFXLayer
    type: ParticleContainer
    zIndex: 60
  - name: UILayer
    type: HTML / DOM Overlay or Pixi Container
    zIndex: 100
  modules:
  - name: TerrainManager
    role: Чанкование, процедурная генерация, битовые маски и деструкция породы
  - name: LaserPhysicsSystem
    role: Расчет отражений лучей, углов падения и урона
  - name: DrillController
    role: Физика движения, ускорение, бурение и перегрев
  - name: PerkManager
    role: Генерация, взвешивание пула и применение модификаторов
  - name: BossDirector
    role: Стейт-машина поведения боссов, спавн фаз и арена-лок
  - name: SaveManager
    role: Синхронизация локального прогресса и Playgama Bridge Cloud Storage
monetization:
  strategy_summary: 'Мягкая гибридная модель: просмотры Rewarded видео для спасения
    удачных забегов и удвоения добычи + ненавязчивые Interstitial между забегами +
    IAP стартовые наборы и отключение обязательной рекламы.'
  rewarded_placements:
  - id: revive_run
    name: Аварийный Квантовый Щит (Revive)
    benefit: Возрождение с 60% HP, уничтожение всех врагов и породы в радиусе 10 метров.
    cooldown_or_limit: 1 раз за забег
    trigger_moment: Экран гибели меха при глубине > 100 метров
  - id: double_ore
    name: Грузовой Дрон (2x Ore Multiplier)
    benefit: Удвоение всей добытой за забег руды для ускорения прокачки в ангаре.
    cooldown_or_limit: После каждого успешного забега или смерти
    trigger_moment: Экран завершения спуска
  - id: reroll_perks
    name: Перекалибровка Чипа (Perk Reroll)
    benefit: Полная замена трех предложенных карт улучшений на новые.
    cooldown_or_limit: 1 раз за чекпоинт 50м
    trigger_moment: Окно выбора перка
  interstitial_placements:
  - trigger_event: Возврат в главное меню / ангар после забега
    cooldown_seconds: 90
    conditions: Показывается только если забег длился более 90 секунд и игрок не смотрел
      Rewarded за последние 60 секунд.
  in_app_purchases:
  - sku: no_ads_pack
    name: Пакет 'Без Рекламы' + VIP Бур
    description: Отключает межстраничные баннеры и дает эксклюзивный Неоновый Бур
      (+10% к скорости копания).
    price_tier: $2.99 / 249 RUB
    reward: no_ads_flag, skin_neon_drill
  - sku: starter_miner_pack
    name: Набор Горного Магната
    description: 5000 титана, 50 плазменных ядер и мгновенное открытие второго меха
      'Джаггернаут'.
    price_tier: $4.99 / 399 RUB
    reward: titan_5000, plasma_50, mech_juggernaut
  fairness_rules:
  - 100% контента и всех боссов можно победить без доната и без просмотра рекламы
    за счет мастерства.
  - Никаких внезапных рекламных вставок посреди бурения или битвы с боссом.
  - Четкий визуальный индикатор длительности кулдауна рекламы.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - gamepix
  - web
  initialization_flow:
  - Инициализация PlaygamaBridge.init() на стартовом сплеше
  - Загрузка сохраненных данных игрока из Cloud Storage
  - Проверка языка интерфейса платформы (ru/en) и применение локализации
  - Инициализация баннерных и rewarded-слушателей
  - Старт рендера PixiJS сцены меню
  cloud_save_keys:
  - player_ore_inventory
  - unlocked_mechs
  - hangar_tech_tree_levels
  - max_depth_reached
  - settings_audio_vibration
  leaderboards:
  - leaderboard_max_depth
  - leaderboard_total_ore_mined
  ads_integration:
    rewarded_fallback: Локальная пауза игры и отключение аудиодорожки при показе рекламы
    banner_position: bottom-center (адаптировано под мобильный Safe Area)
  lifecycle_hooks:
  - 'onPause: автоматическая постановка физики PixiJS на паузу и глушение Howler.js'
  - 'onResume: возобновление аудио и плавный обратный отсчет 3..2..1 до старта'
