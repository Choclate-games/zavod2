roadmap:
- phase_number: 1
  title: Прототип физики и деструкции
  duration_days: 2
  tasks:
  - Инициализация проекта PixiJS 8 + Vite + TypeScript
  - Создание базовой чанковой системы разрушаемой породы
  - Реализация контроллера бура с физикой копания и камерой
  milestone_deliverable: Игрок может бурить процедурную породу вниз с корректным разрушением
    тайлов.
- phase_number: 2
  title: Боевая система и лазерный рикошет
  duration_days: 2
  tasks:
  - Разработка алгоритма Raycast-рикошета лазеров от стен
  - Создание автострельбы и механики умножения урона при отскоке
  - Базовые типы подземных врагов с поиском пути по туннелям
  milestone_deliverable: Полноценный комбат с рикошетом лазеров в узких пробуренных
    ходах.
- phase_number: 3
  title: Рогалик-цикл, Боссы и Перки
  duration_days: 2
  tasks:
  - Система чекпоинтов каждые 50м и драфт 3 случайных перков
  - Реализация первого босса 'Механо-Червь Бездны' на 200м
  - Сбор и учет редких руд, шкала глубины
  milestone_deliverable: Завершенный вертикальный забег до 200м с боссфайтом и прокачкой.
- phase_number: 4
  title: Мета-прогресс, Полировка и Playgama SDK
  duration_days: 2
  tasks:
  - Создание экрана Ангара и дерева мета-улучшений меха
  - Интеграция Playgama Bridge (облачные сейвы, лидерборды, Rewarded/Interstitials)
  - Добавление сочных VFX (свечение, партиклы, скриншейк) и звукового оформления
  milestone_deliverable: Полнофункциональный релизный билд, готовый к публикации на
    Яндекс Игры и в каталог Playgama.
risks:
- risk: Падение производительности на слабых смартфонах из-за частого обновления текстур
    разрушаемой породы.
  category: technical
  severity: High
  mitigation: Использование легковесных битовых масок на CPU и обновление текстуры
    чанка через `updateTexture` только по грязным прямоугольникам (Dirty Rects).
- risk: Игрок может застрять в замкнутом пространстве без возможности бурить.
  category: gameplay
  severity: Medium
  mitigation: Базовая прочность породы гарантирует, что даже при слабом буре порода
    медленно, но разрушается; добавлен аварийный микро-рывок.
- risk: Лазеры рикошетят слишком хаотично, создавая визуальный шум.
  category: visual
  severity: Low
  mitigation: Ограничение времени жизни луча (до 0.35 с), градиентное затухание прозрачности
    и акцент на сочных вспышках контакта.
skills:
- skill_id: pixi_voxel_destruction
  name: Высокопроизводительная 2D деструкция породы в PixiJS
  filename: skills/pixi_voxel_destruction.md
  purpose: Обеспечить 60 FPS при попиксельном и поблочном стирании грунта и расчете
    рикошетов.
  when_to_use: При реализации TerrainManager и Raycast лазеров.
  rules:
  - Никогда не создавать отдельные DisplayObject для каждого пикселя породы.
  - Использовать единую текстуру чанка (RenderTexture / Uint8ClampedArray) на 32x32
    вокселя.
  - Кешировать контуры для полигональных коллайдеров рикошета.
  architecture: ChunkManager -> GridBitmask -> ChunkTextureRenderer -> FastRaycastGrid
  implementation_guidance: Используйте алгоритм Брезенхема для быстрого трассирования
    лучей по битовой сетке 1 бит на пиксель.
  common_mistakes:
  - Пересоздание текстур каждый кадр вместо изменения байтового буфера
  - Хранение истории разрушений в тяжелых структурах объектов
  checklist:
  - Проверен Garbage Collector при быстром копании
  - Корректно рассчитывается нормаль угла столкновения
  knowledge_refs:
  - PixiJS v8 Texture Manipulation
  - 2D DDA Raycasting Algorithm
- skill_id: game_skill
  name: 'Бурильщик Бездны: Рикошет Руды Domain Architecture'
  filename: GAME_SKILL.md
  purpose: 'Defines domain rules, state machine, and core gameplay loop for Бурильщик
    Бездны: Рикошет Руды.'
  when_to_use: Use when writing or modifying core game state, loop coordination, and
    progression.
  rules:
  - Strict TypeScript strict mode without any 'any' types.
  - Fixed 60Hz delta accumulator with delta clamping.
  - Decoupled state management via typed EventBus.
  - Zero runtime object allocations inside the 60Hz game loop.
  architecture: 'Decoupled 3-layer architecture: Application/Platform -> Engine/Systems
    -> Rendering/UI.'
  implementation_guidance: Instantiate Game instance from main.ts, bootstrap PlaygamaService,
    and start GameLoop.
  common_mistakes:
  - Do not instantiate Three.js meshes or heavy objects inside tick loops.
  - Do not bypass the EventBus for cross-system communications.
  checklist:
  - Game initializes cleanly and loads within 3 seconds.
  - EventBus routes inputs and system events without memory leaks.
  - Audio auto-pauses and unpauses cleanly with browser focus changes.
  knowledge_refs: []
- skill_id: gameplay_skill
  name: Combat, Physics & Movement Systems
  filename: GAMEPLAY_SKILL.md
  purpose: Defines standards for physics simulation, combat mechanics, and tactile
    player feedback.
  when_to_use: Use when writing character controllers, weapon systems, collision listeners,
    and juice/VFX.
  rules:
  - Clamp delta time to maximum 100ms to prevent physics tunneling.
  - Use continuous collision detection (CCD) for fast projectiles.
  - Apply hitstop (40ms time dilation) on impactful strikes.
  - Always synchronize physics rigid body transforms to mesh representations.
  architecture: Physics engine (Rapier3D/Matter.js) stepped on fixed 60Hz timestep,
    meshes interpolated.
  implementation_guidance: Use EventBus to emit 'entity:hit', 'combat:parry', 'wave:cleared'
    events for sound and VFX triggers.
  common_mistakes:
  - Never modify transform matrices directly on physics-controlled entities.
  - Do not hardcode magic numbers for damage or velocities without centralized configuration.
  checklist:
  - Player movement is responsive with no input lag.
  - Hits produce satisfying sensory feedback (VFX spark, screen shake, audio impact).
  - Ragdoll or death animations trigger smoothly without physics jitter.
  knowledge_refs: []
- skill_id: renderer_skill
  name: PIXIJS WebGL Performance Guide
  filename: RENDERER_SKILL.md
  purpose: Optimization and visual standards for PIXIJS WebGL pipeline.
  when_to_use: Use when configuring scenes, cameras, lighting, materials, instanced
    meshes, and particle systems.
  rules:
  - Keep active draw calls strictly under 80.
  - Use InstancedMesh for debris, bullets, and crowd mobs.
  - Clamp pixel ratio to Math.min(window.devicePixelRatio, 1.5) on mobile.
  - Share material instances across identical geometry.
  architecture: Scene graph with pre-allocated sprite and mesh pools, dynamic shadow
    frustum optimization.
  implementation_guidance: Initialize renderer with antialias enabled on desktop,
    powerPreference 'high-performance'.
  common_mistakes:
  - Do not construct new Geometries, Textures, or Materials in the render loop.
  - Do not leave unused GPU assets without calling .dispose().
  - Do not tune quality from raw frame time — under vsync every frame reads as budget-length.
  - Do not launch in reduced quality and climb up; start optimistic and step down.
  checklist:
  - Maintains solid 60 FPS on desktop and >= 50 FPS on mobile.
  - No WebGL context loss errors on tab switches.
  - Shadow map renders crisp without artifact acne.
  - The quality auto-tuner converges and locks instead of oscillating.
  knowledge_refs:
  - pixijs/particle_systems.md
  - pixijs/sprite_batching.md
- skill_id: playgama_skill
  name: Playgama Bridge SDK Integration
  filename: PLAYGAMA_SKILL.md
  purpose: Defines implementation patterns for @playgama/bridge v2 (Ads, Cloud Storage,
    Auth, Leaderboards, Lifecycle).
  when_to_use: Use when implementing advertising triggers, cloud save/load, authorization,
    and portal lifecycle hooks.
  rules:
  - Always await bridge.initialize() (with a timeout) before any other SDK call.
  - Send game_ready exactly once, only after assets are loaded and the menu is interactive.
  - Grant a rewarded reward only on state === 'rewarded'; never when the promise resolves.
  - One save key holding one JSON object; storage.get/set take no storageType argument.
  - Call authorize() only from a player action — except the silent VK/OK path at boot.
  - 'Build UI on capability flags: an unsupported feature''s control is not rendered
    at all.'
  - Take pause and audio state from the platform's own events, not visibilitychange
    alone.
  - Auto-save on progress milestones and flush on pagehide.
  architecture: Singleton PlaygamaService wrapper exposing strongly-typed promises
    for Ads, Storage, Auth, Payments and Leaderboards, degrading to a local mock when
    window.bridge is absent.
  implementation_guidance: Subscribe to EVENT_NAME.REWARDED_STATE_CHANGED, call bridge.advertisement.showRewarded(placement),
    remove the listener in cleanup, and resolve true only for the 'rewarded' state.
    Full implementations for every module are embedded below.
  common_mistakes:
  - Sending game_ready right after initialize() — the splash lifts over an unloaded
    game.
  - Awaiting a dialog-showing authorize() inside boot — the game hangs for every guest.
  - Detecting a guest via player.id/name; they are populated for guests, use player.isGuest.
  - Showing an interstitial in the first seconds of a session or during gameplay.
  - Consuming a purchase before granting it — paid goods are destroyed.
  - Keeping settings in localStorage — it is partitioned inside the platform iframe.
  - Never assume internet connection is permanent — support local offline fallback.
  checklist:
  - Rewarded grants exactly one reward per view, even on a double click.
  - Progress survives a reload as guest and as an authorized player.
  - A corrupted save boots on defaults instead of crashing.
  - Leaderboard score submits and displays correctly.
  - Game auto-pauses on the platform's pause event, including during ads.
  knowledge_refs:
  - playgama/game_ready_and_loading.md
  - playgama/auth_and_player.md
  - playgama/storage_and_cloud.md
  - playgama/ads_integration.md
  - playgama/banners_and_layout.md
  - compliance/yandex_moderation.md
  - ux/localization_system.md
  - ux/touch_controls.md
- skill_id: controls_skill
  name: Mobile Touch & Desktop Controls
  filename: CONTROLS_SKILL.md
  purpose: 'Задаёт обязательный контракт управления: раскладку под жанр, реализацию
    на Pointer Events, отмену браузерных жестов и правила видимости.'
  when_to_use: 'Use when implementing any player input: virtual joystick, action buttons,
    driving pedals, camera gestures, or keyboard bindings.'
  rules:
  - Только Pointer Events + setPointerCapture; учитывать pointerId для каждой кнопки.
  - Движение и основное действие обязаны работать одновременно (мультитач).
  - В играх про вождение газ — отдельная кнопка, а не вертикаль стика руля.
  - 'touch-action: none, отмена contextmenu/dragstart и touchmove с passive:false.'
  - Отступы через env(safe-area-inset-*); основная кнопка >= 96 px, остальные >= 64
    px.
  - Слой управления виден только в игровом процессе и сбрасывается при скрытии.
  - Сброс всех осей и кнопок на blur и visibilitychange.
  - Флаг ?touch=1 принудительно включает мобильную раскладку на десктопе.
  architecture: Отдельный модуль TouchControls создаёт собственный DOM-слой поверх
    UI, пишет в виртуальные оси InputManager и ничего не знает об игровой логике.
    InputManager сливает клавиатуру и тач, отдавая игре единый снимок управления.
  implementation_guidance: 'UIManager владеет экземпляром TouchControls и переключает
    его видимость в showHud/showPause/hideAllModals. Джойстик — плавающий: база появляется
    под пальцем, зона захвата — половина экрана, мёртвая зона 8%.'
  common_mistakes:
  - Один стик на движение и газ — машина теряет ход в каждом повороте.
  - 'touchstart/touchend без pointerId: второй палец сбрасывает первый.'
  - Слой управления оставлен видимым в меню — он перехватывает тапы по кнопкам.
  - Забытый passive:false — страница продолжает скроллиться под игрой.
  - Кнопки прижаты к краю без safe-area — их перекрывает вырез и системный жест.
  checklist:
  - Газ/атака и направление работают одновременно, проверено тремя пальцами.
  - Свайп по игре не скроллит страницу и не вызывает pull-to-refresh.
  - Долгое нажатие не открывает контекстное меню.
  - Управление скрыто в меню и паузе, оси сброшены после сворачивания вкладки.
  - ?touch=1 показывает мобильную раскладку на десктопе и кликается мышью.
  knowledge_refs:
  - ux/touch_controls.md
