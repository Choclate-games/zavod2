definition_of_done:
- Вертикальное перемещение и бурение породы ощущаются упруго, отзывчиво и сочно с
  приятным скриншейком.
- Автострельба лазерами безошибочно рассчитывает углы отскока от пробуренных стен
  и наносит каскадный урон.
- Каждые 50 метров без сбоев открывается окно выбора 3 сбалансированных перков с возможностью
  реролла.
- На отметке 200 метров спавнится эпичный босс с уникальными фазами атак и полосой
  здоровья.
- 'Полная интеграция с Playgama Bridge: сохранение руды в облаке, показ рекламы по
  правилам и поддержка портретного мобильного режима.'
