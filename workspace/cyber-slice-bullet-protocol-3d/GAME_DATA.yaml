raw_prompt: Создай свайп-слэшер на Three.js с механикой Bullet Time и процедурным
  разрезанием 3D геометрии. Включи стильную киберпанк-эстетику, комбо-счетчик с сочными
  вспышками, ветку roguelite-талантов и динамичные боссфайты.
title: 'CYBER SLICE: BULLET PROTOCOL (Кибер Срез: Протокол Времени)'
slug: cyber-slice-bullet-protocol-3d
genre: Экшен-слэшер / Аркада
subgenre: 3D Roguelite свайп-слэшер с замедлением времени и процедурным разрушением
renderer: threejs
renderer_reason: User explicitly specified 'threejs'.
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web / Android)
orientation: landscape
target_audience: Игроки 14-35 лет, поклонники динамичных слэшеров (Ghostrunner, Metal
  Gear Rising, Fruit Ninja, Superhot), любители киберпанк-стилистики, неонового синтивейва
  и скиллозависимого аркадного геймплея.
core_loop: Вход на неоновую кибер-арену -> Замедление времени (Bullet Time) при касании/свайпе
  -> Хирургическое рассечение нападающих киборгов и снарядов свайпом -> Накопление
  комбо и перегрузки (Overdrive) -> Сбор нано-чипов и выбор roguelite-модификаторов
  -> Сражение с многофазным боссом -> Прокачка постоянных кибер-имплантов в хабе.
hook: Мгновенное тактильное рассечение 3D-врагов под любым углом в кинематографичном
  Bullet Time с физическим разлетом светящихся неоновых осколков и сочным киберпанк-звуком.
player_fantasy: Ты — элитный аугментированный кибер-ниндзя с тактическим квантовым
  клинком. Для тебя мир замирает в миллисекундах, пока ты элегантными взмахами пальца
  разрезаешь лазерные лучи, пули и элитных боевых мехов на десятки аккуратных кусков.
session_model: Быстрые сессии по 4-8 минут (3-5 волн врагов + дуэль с боссом) с глубокой
  мета-прокачкой и бесконечным рейтинговым режимом «Кибер-Бездна».
unique_value_proposition: Первый в браузерном WebGL 3D-слэшер с честным процедурным
  срезом трехмерных моделей (CSG/Plane-intersection) в замедлении времени, оптимизированный
  под 60 FPS на мобильных и десктопных устройствах без тяжелых загрузок.
vision: Создать эталонный мобильный и веб-хит в жанре свайп-экшена, соединяющий визуальный
  шик киберпанка, глубокую roguelite-реиграбельность билдов и непревзойденное ощущение
  гипер-контроля над временем и геометрией пространства.
elevator_pitch: '«Ghostrunner встречает Fruit Ninja в неоновом киберпанке»: замедляй
  время одним касанием, рассекай киборгов и летящие ракеты на светящиеся полигональные
  части, выстраивай безумные комбо и сокрушай мега-боссов с уникальными roguelite-талантами
  прямо в браузере!'
win_conditions: Уничтожить все волны кибер-агентов на арене, отразить критические
  атаки и нейтрализовать главного босса сектора, сохранив запас прочности экзоскелета.
lose_conditions: Полное истощение шкалы HP кибер-ниндзя от пропущенных ударов, взрывов
  неразрезанных ракет или падения в лазерные барьеры.
progression_summary: 'Внутри забега: выбор 1 из 3 случайных кибер-модулей после каждой
  волны (цепные молнии по срезам, взрывные волны, заморозка времени, критические мульти-слэши).
  Мета-прогрессия: покупка постоянных нейро-апгрейдов за кибер-кредиты (увеличение
  шкалы хроно-энергии, вампиризм, стартовые щиты, разблокировка легендарных катан
  с уникальными следами и эффектами).'
difficulty_curve: Плавный вход на 1-й волне с базовыми дронами, нарастание темпа за
  счет комбинированных атак (стрелки + щитовики), кульминация в фазах босса с круговыми
  лазерными атаками и проверкой тайминга парирования.
scores:
  fun: 10
  originality: 9
  replayability: 9
  development_cost: 7
  visual_appeal: 9
  mobile_fit: 10
  monetization: 9
  platform_fit: 9
  overall_score: 9.0
  justification: Механика свайп-среза с Bullet Time обладает мгновенной тактильной
    отдачей и виральным потенциалом. Roguelite-структура обеспечивает удержание D1/D7,
    а интеграция с Playgama Bridge идеально монетизируется через ревайвы, удвоение
    наград и скины оружия.
references:
- name: 'Metal Gear Rising: Revengeance (Blade Mode)'
  genre: 3D Action Hack and Slash
  mechanics:
  - Свободный угол среза геометрии
  - Замедление времени при прицеливании
  - Рассечение уязвимых точек (Zandatsu)
  lessons: Свобода выбора плоскости среза дарит непревзойденное ощущение мощи и мастерства.
  what_to_avoid: Избыточная сложность управления камерой на тачскринах.
- name: Ghostrunner
  genre: First-Person Cyberpunk Slasher
  mechanics:
  - One-hit kill динамика
  - Рывок с уклонением от пуль
  - Киберпанк синты и неоновый визуальный стиль
  lessons: Высокий темп и сочные аудио-визуальные акценты создают состояние чистого
    потока.
  what_to_avoid: Слишком высокий порог входа для казуальных веб-игроков.
- name: Fruit Ninja
  genre: Arcade Swipe
  mechanics:
  - Интуитивный свайп-контроль
  - Разрезание объектов на 2 части
  - Комбо-множители за одновременный срез
  lessons: Идеальная эргономика для мобильных экранов и мгновенное понимание геймплея.
  what_to_avoid: Монотонность без прокачки и разнообразия врагов.
- name: Superhot
  genre: Time-bending Action
  mechanics:
  - Время движется только при действии
  - Физический разлет поверженных кристаллических врагов
  lessons: Контроль над темпом боя превращает экшен в тактическую головоломку.
  what_to_avoid: Полная остановка динамики без музыкального драйва.
mechanics:
- name: Процедурный срез 3D-геометрии (Mesh Slicing)
  category: combat
  priority: core
  description: При свайпе строится секущая плоскость в мировых координатах. Three.js
    делит исходную BufferGeometry врага или снаряда на два изолированных меша, генерирует
    внутренние срезы со светящейся неоновой текстурой 'расплавленного ядра' и передает
    половинки в физический симулятор разлета.
  player_interaction: Проведение пальцем или мышью через силуэты противников под любым
    желаемым углом.
  feedback: Яркая световая линия клинка, импульсный неоновый взрыв по контуру среза,
    физическое падение обломков с затухающим свечением и сочный звуковой щелчок разрезаемого
    металла.
  technical_complexity: High
  strengths:
  - Невероятный уровень сочности и свободы действий
  - Каждый срез уникален и не использует заранее запеченные анимации смерти
  weaknesses:
  - Требуется строгий пул геометрии для предотвращения пауз сборщика мусора (GC spikes)
- name: Хроно-фокус (Bullet Time & Time Dilation)
  category: combat
  priority: core
  description: При первом касании экрана/зажатии мыши время в игре замедляется до
    10% от нормальной скорости, расходуя полосу Chrono-Energy. Вражеские пули, лазеры
    и летящие роботы плавно зависают в воздухе, позволяя выстроить траекторию идеального
    мульти-среза.
  player_interaction: Удержание пальца на экране для замедления; резкий свайп инициирует
    мгновенный удар и восстанавливает нормальный ход времени.
  feedback: Плавный хроматический сдвиг (Chromatic Aberration), приглушение звука
    с наложением низкочастотного гула (low-pass filter) и появление неоновых трассеров
    от пуль.
  technical_complexity: Medium
  strengths:
  - Снижает стресс на мобильных устройствах
  - Дает глубокий тактический контроль
  weaknesses:
  - Шкала энергии должна быстро регенерировать, чтобы не затягивать геймплей
- name: Неоновый Комбо-Множитель и Перегрев (Heat Surge)
  category: combat
  priority: core
  description: 'Серия быстрых срезов без промахов заполняет счетчик ранга (от ''D''
    до ''SSS'') и шкалу Heat. На ранге ''SSS'' активируется Overdrive: лезвие воспламеняется
    плазмой, разрезающей даже бронированные щиты с одного удара, а на экране возникают
    стильные кибер-глифы.'
  player_interaction: Поддержание непрерывного ритма нарезки врагов и снарядов до
    истечения комбо-таймера (1.8 сек).
  feedback: Увеличивающийся неоновый счетчик в центре экрана, вспышки экрана (Screen
    Flash), ускорение темпа синтивейв-саундтрека.
  technical_complexity: Low
  strengths:
  - Высокая мотивация играть технично и быстро
  - Отличная база для соревновательных лидербордов
  weaknesses:
  - Визуальные эффекты не должны перекрывать читаемость вражеских снарядов
- name: Кибер-Аугментации (Roguelite Matrix)
  category: progression
  priority: secondary
  description: 'После зачистки каждой волны игрок выбирает 1 из 3 случайных нейро-чипов:
    ''Плазменный Рикошет'' (разрезанные пули летят обратно во врагов), ''Квантовое
    Расщепление'' (один свайп создает две параллельные линии среза), ''Хроно-Вампиризм''
    (восстановление HP за комбо).'
  player_interaction: Выбор карточки таланта на голографическом интерфейсе между волнами.
  feedback: Звук установки микрочипа, изменение визуального шлейфа клинка и появление
    уникальных иконок в строке активных баффов.
  technical_complexity: Medium
  strengths:
  - Огромная вариативность билдов и высокая реиграбельность
  - Создание синергий и 'сломанных' фановых комбинаций
  weaknesses:
  - Необходим регулярный баланс коэффициентов урона
- name: Фазовые Дуэли с Мега-Боссами (Boss Slice Telegraphs)
  category: boss
  priority: core
  description: 'Боссы (напр., ''Кибер-Цербер'', ''Титанический Мех-Дракон'') обладают
    уникальными уязвимыми секторами (Weak Planes). Во время атаки босса появляется
    подсвеченная голографическая плоскость: если игрок выполнит свайп точно вдоль
    нее, босс получает критический урон и теряет конечность.'
  player_interaction: Точное сопоставление угла свайпа с подсвеченной траекторией
    уязвимости босса за отведенное время.
  feedback: Замедление камеры, сокрушительный скрежет отсекаемой брони босса, выброс
    десятков силовых искр и смена музыкальной темы на кульминационную фазу.
  technical_complexity: High
  strengths:
  - Эпичный финал каждого забега
  - Требует меткости и концентрации, а не просто спама кликов
  weaknesses:
  - Требует точной калибровки окна толерантности угла свайпа (±12 градусов)
gameplay_systems:
- name: Система процедурного рассечения мешей (Procedural Geometry Slicer)
  purpose: Осуществление мгновенного математического разделения полигональной сетки
    врагов в реальном времени с генерацией внутренних граней и физических обломков.
  input: Координаты луча свайпа (Raycast Start/End) и вектор направления камеры.
  rules:
  - Построение бесконечной секущей плоскости на основе двух точек свайпа и нормали
    взгляда камеры.
  - 'Итерация по треугольникам входного BufferGeometry: классификация вершин относительно
    плоскости (Dot Product).'
  - Интерполяция вершин, UV и нормалей на линии пересечения ребер с плоскостью.
  - Триангуляция образовавшегося среза (Cap Triangulation) с присвоением материала
    внутреннего кибер-ядра (Emissive Neon Shader).
  - Спавн физических RigidBody в Rapier3D для отсеченных частей с радиальным импульсом
    взрыва.
  state:
  - is_slicing_active (boolean)
  - active_debris_count (integer)
  - cut_plane_origin (Vector3)
  - cut_plane_normal (Vector3)
  interactions: Взаимодействует с Physics System для отталкивания половинок, с Particle
    VFX для генерации искр и с Combo System для начисления очков.
  feedback: Неоновый лазерный след свайпа, яркий сноп искр, шлейф дыма, звуковой щелчок
    рассечения.
  edge_cases:
  - Срез проходит мимо объекта -> свайп регистрируется как промах и сбрасывает часть
    комбо.
  - Объект уже слишком мал (<0.2м) -> вместо среза происходит мгновенная аннигиляция
    в частицы во избежание микро-полигонов.
- name: Система Хронодинамики и Замедления времени (Chrono-Dilation System)
  purpose: Управление глобальной временной шкалой (Time Scale) для реализации механики
    Bullet Time при прикосновении к экрану.
  input: События PointerDown / PointerUp / TouchStart / TouchEnd.
  rules:
  - При зажатии экрана time_scale плавно интерполируется от 1.0 до 0.1 за 60 мс.
  - Расход Chrono-Energy составляет 25 единиц/сек (максимум 100).
  - При исчерпании энергии time_scale принудительно возвращается к 1.0 с предупреждающим
    звуковым сигналом перегрузки.
  - При совершении успешного среза восстанавливается +15 единиц энергии.
  state:
  - current_time_scale (float 0.1..1.0)
  - chrono_energy (float 0..100)
  - is_dilation_active (boolean)
  interactions: Модифицирует dt во всех системах (перемещение врагов, полет снарядов,
    аниматоры), кроме рендерера следа клинка игрока.
  feedback: Голографический круговой индикатор энергии вокруг пальца игрока, искажение
    звукового поля, виньетка замедления.
  edge_cases:
  - Игрок держит палец и ничего не делает -> энергия заканчивается, враги наносят
    урон на нормальной скорости.
- name: Система Комбо, Ранга и Тепловой Перегрузки (Combo & Heat Engine)
  purpose: Расчет мастерства игрока, динамическое начисление очков и активация режима
    ярости Overdrive.
  input: События успешного среза врага, отражения пули или получения урона.
  rules:
  - Каждый срез дает базовые очки * текущий комбо-множитель (х1..х10).
  - Срез 3+ врагов одним свайпом дает бонус 'MULTI-SLICE' (+500 очков и заполнение
    Heat на 40%).
  - Получение урона сбрасывает ранг комбо до D и обнуляет Heat.
  - При 100% Heat активируется Overdrive на 6 секунд (х2 скорость регенерации энергии,
    взрывные срезы).
  state:
  - combo_counter (integer)
  - combo_rank (enum D, C, B, A, S, SS, SSS)
  - heat_gauge (float 0..100)
  - is_overdrive (boolean)
  interactions: Влияет на размер наград в кибер-кредитах, пост-процессинг камеры (Bloom)
    и данные таблицы лидеров.
  feedback: Голографические анимированные буквы ранга (D -> SSS), вспышка экрана при
    Overdrive, речевые оповещения ИИ-комментатора.
  edge_cases:
  - Истечение комбо-таймера во время катсцены босса блокируется.
- name: Система Роглайт-Генерации и Талантов (Cyber-Augment Draft)
  purpose: Предоставление игроку стратегического выбора аугментаций между боевыми
    волнами для создания уникальных билдов.
  input: Завершение боевой волны (Wave Cleared Event).
  rules:
  - Генерация 3 случайных чипов из общего пула с весами редкости (Common 60%, Rare
    30%, Legendary 10%).
  - 'Чипы разделены на 3 архетипа: ''Хроно-Мастер'' (управление временем), ''Плазменный
    Клинок'' (урон и AoE срезы), ''Кибер-Защита'' (щиты и контрудары).'
  - Игрок может потратить кибер-кредиты или посмотреть Rewarded Ad для реролла предложенных
    вариантов.
  state:
  - active_augments (array of Augment)
  - available_draft_cards (array of 3 AugmentCards)
  - reroll_count (integer)
  interactions: Модифицирует параметры меча, радиус среза, восстановление энергии
    и триггеры дополнительных снарядов.
  feedback: Анимация вставки голографического картриджа, звуковой аккорд успеха, визуальное
    обновление клинка.
  edge_cases:
  - Выбор взаимоисключающих перков предотвращается валидатором графа талантов.
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.170.0
  physics_engine: Rapier3D (@dimforge/rapier3d-compat 0.13.x)
  state_manager: Reactive EventBus / Zustand-like Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 65
  max_triangles_or_sprites: 38000
  bundle_size_budget_mb: 4.2
  layers:
  - name: Presentation Layer
    description: 'Three.js Scene Graph, InstancedMesh для фонового кибер-города, Custom
      Shaders (Neon Core, Blade Trail, Bullet Trails), Postprocessing (EffectComposer:
      Selective Bloom, Chromatic Aberration).'
  - name: Game Logic & Math Layer
    description: Алгоритм плоскостного рассечения BufferGeometry (Math3D Slicer),
      машина состояний боя (FSM), менеджер волн, контроллер замедления времени.
  - name: Physics & Collision Layer
    description: Rapier3D для высокоскоростной симуляции разлета обломков, трассировки
      лучей свайпа и детекции хитбоксов снарядов.
  - name: Platform & Storage Layer
    description: Адаптер Playgama Bridge для рекламы, облачных сохранений, внутриигровых
      покупок и аналитики платформы.
  modules:
  - name: GeometrySlicer
    file: src/core/slicing/GeometrySlicer.ts
    responsibility: Низкоуровневая триангуляция и генерация двух дочерних BufferGeometry
      при пересечении плоскостью.
  - name: TimeDilationManager
    file: src/core/time/TimeDilationManager.ts
    responsibility: Плавное масштабирование дельты времени, управление расходом и
      восстановлением хроно-энергии.
  - name: BladeInputController
    file: src/input/BladeInputController.ts
    responsibility: Отслеживание жестов мыши и мультитача, сглаживание траектории
      (Catmull-Rom) и генерация меша светового следа (Ribbon Trail).
  - name: EnemyWaveDirector
    file: src/gameplay/EnemyWaveDirector.ts
    responsibility: Спавн волн кибер-дронов, ниндзя-киборгов, турелей и фазовых боссов
