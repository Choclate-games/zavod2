playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - gamepix
  - telegram
  - standalone_web
  - android_capacitor
  initialization_flow:
  - Инициализация bridge.initialize() при старте загрузчика Vite.
  - Определение платформы окружения и типа управления (touch/desktop mouse).
  - Загрузка сохраненного профиля игрока через bridge.storage.get(['cyber_profile',
    'settings']).
  - Синхронизация локализации bridge.platform.language (RU/EN).
  - Отправка события bridge.game.ready() после загрузки 3D-ассетов сцены.
  cloud_save_keys:
  - cyber_profile_v1
  - unlocked_weapons
  - talent_tree_state
  - high_score_endless
  - player_settings
  leaderboards:
  - cyber_slice_high_score
  - boss_rush_time_attack
  - max_combo_streak
  ads_integration:
    rewarded_handler: bridge.advertisement.showRewardedVideo() с перехватом событий
      'rewarded', 'closed', 'failed'
    interstitial_handler: bridge.advertisement.showInterstitial() с проверкой таймера
      cooldown
    banner_support: false
  lifecycle_hooks:
  - bridge.game.on('pause', () => pauseGame())
  - bridge.game.on('resume', () => resumeGame())
  - window.addEventListener('visibilitychange', () => handleVisibilityChange())
