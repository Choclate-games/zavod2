qa:
  functional_tests:
  - 'Тест рассечения: проверка корректности генерации двух валидных BufferGeometry
    при любом угле свайпа без пропадания полигонов.'
  - 'Тест Bullet Time: подтверждение замедления перемещения врагов и снарядов ровно
    в 10 раз при сохранении 60 FPS рендеринга шлейфа пальца.'
  - 'Тест комбо: проверка корректного сброса ранга при получении урона и сохранения
    комбо при своевременном рассечении следующего врага.'
  - 'Тест роглайт-перков: проверка наложения эффектов цепной молнии и корректной модификации
    статов урона.'
  - 'Тест Playgama Bridge: проверка корректности выдачи награды после просмотра Rewarded
    Video и сохранения в Cloud Storage.'
  performance_benchmarks:
  - Стабильные 60 FPS на смартфонах уровня Xiaomi Redmi Note 10 / iPhone 11.
  - Количество Draw Calls в бою не превышает 65.
  - Потребление оперативной памяти вкладки браузера не превышает 180 МБ.
  - Время начальной загрузки и старта игры не более 2.8 секунд на 4G соединении.
  cross_browser_matrix:
  - Google Chrome (Desktop Windows/Mac)
  - Apple Safari (iOS 15+ Mobile Safari)
  - Yandex Browser (Desktop & Android Mobile App)
  - VK App WebView (Android & iOS)
  - Samsung Internet (Android)
  common_bug_checklist:
  - Отсутствие утечек памяти в Three.js (обязательный geometry.dispose() и material.dispose()
    для отсеченных частей).
  - Исключение залипания состояния замедления времени при случайном уводе пальца за
    пределы экрана.
  - Корректное возобновление аудио-контекста (AudioContext resume) после первого клика
    пользователя.
  - Корректная обработка смены ориентации экрана и изменения размеров окна (window
    resize).
roadmap:
- phase_number: 1
  title: Прототип ядра механики свайп-среза и замедления времени
  duration_days: 3
  tasks:
  - Настройка Vite + Three.js + TypeScript окружения
  - Разработка модуля математического рассечения BufferGeometry плоскостью
  - Реализация контроллера свайпа с шлейфом клинка и механики Bullet Time при тапе
  - Базовая сцена с летающими тестовыми кубами и манекенами
  milestone_deliverable: 'Играбельный веб-прототип: игрок может свайпами в замедлении
    времени разрезать падающие 3D-объекты на кусочки.'
- phase_number: 2
  title: Киберпанк-визуализация, комбо-система и боевой цикл врагов
  duration_days: 4
  tasks:
  - Интеграция 3D-моделей кибер-дронов, ниндзя и турелей с материалами расплавленного
    ядра
  - Настройка неонового пост-процессинга (Bloom, Chromatic Aberration, шлейфы)
  - Создание системы комбо-множителей, рангов (D->SSS) и режима Overdrive
  - Интеграция звукового движка Howler.js с динамической реакцией на Bullet Time
  milestone_deliverable: Полноценная боевая арена с волнами атакующих противников,
    снарядами, сочными звуками и вспышками комбо.
- phase_number: 3
  title: Боссфайт, древо Roguelite-талантов и мета-прокачка
  duration_days: 3
  tasks:
  - Разработка многофазного босса 'Кибер-Титан' с механикой направленных срезов уязвимостей
  - Создание системы драфта 15+ уникальных кибер-чипов и перков между волнами
  - Создание главного меню, додзё постоянных улучшений и арсенала смены катан
  milestone_deliverable: 'Завершенный игровой цикл: прохождение секторов, прокачка
    билда, победа над боссом и апгрейды в хабе.'
- phase_number: 4
  title: Интеграция Playgama Bridge, монетизация, оптимизация и релиз
  duration_days: 2
  tasks:
  - Подключение @playgama/bridge (Rewarded Ad для Revive, Interstitial с cooldown,
    Cloud Save)
  - Настройка глобальных лидербордов и локализации (RU/EN)
  - Мобильная оптимизация (пулинг объектов, сжатие текстур KTX2/WebP, safe-area)
  - QA тестирование на мобильных и десктопных браузерах
  milestone_deliverable: Релизный билд, готовый к публикации на Yandex Games, VK Play
    и мобильных сторах.
risks:
- risk: Просадки производительности (GC Stutter) при частом создании новых BufferGeometry
    во время интенсивной нарезки десятков врагов.
  category: technical
  severity: High
  mitigation: Использование пула предвыделенных буферов вершин/индексов (TypedArray
    Object Pooling) и мгновенное ограничение максимального числа активных осколков.
- risk: Случайные ложные свайпы на мобильных экранах при попытке просто повернуть
    камеру или нажать на экран.
  category: design
  severity: Medium
  mitigation: Камера фиксирована в динамическом изометрическом ракурсе; любое касание
    трактуется как вход в Bullet Time, а свайп длиннее 25 пикселей — как удар.
- risk: Блокировка звука браузером до первого взаимодействия с пользователем.
  category: technical
  severity: Low
  mitigation: Запуск AudioContext строго по первому пользовательскому PointerDown
    на экране приветствия.
skills:
- skill_id: threejs-geometry-slicer
  name: Процедурный 3D Слайсер Геометрии для Three.js
  filename: skills/threejs-geometry-slicer.md
  purpose: Обеспечить высокопроизводительное рассечение BufferGeometry плоскостью
    с генерацией неонового среза без утечек памяти.
  when_to_use: При создании боевой системы свайп-слэшеров и разрушаемых трехмерных
    объектов.
  rules:
  - Всегда утилизировать старые BufferGeometry через .dispose() при удалении объектов.
  - Использовать единый шейдерный материал для всех внутренних срезов для минимизации
    Draw Calls.
  - Ограничивать глубину повторного разрезания одного и того же осколка до 2 раз.
  architecture: Plane Math Intersection -> Vertex Interpolation -> Triangulation Subroutine
    -> Multi-Mesh Spawn with Rapier3D Impulses.
  implementation_guidance: Используйте алгоритм классификации вершин по знаку скалярного
    произведения с нормалью секущей плоскости. Ребра, пересекающие плоскость, делятся
    в точке интерполяции t = (d - dot(n, v1)) / dot(n, v2 - v1).
  common_mistakes:
  - Создание новых материалов в цикле рендера вместо использования общего пула материалов.
  - Забывание обновления индексного буфера geometry.setIndex().
  checklist:
  - Проверен расчет нормалей и UV-координат на срезе
  - Включен пулинг геометрии
  - Настроены коллайдеры для половинок в Rapier3D
  knowledge_refs:
  - Three.js BufferGeometry documentation
  - 'Computational Geometry: Plane-Mesh Intersection Algorithms'
- skill_id: playgama-bridge-integration
  name: Интеграция Playgama Bridge для WebGL-игр
  filename: skills/playgama-bridge-integration.md
  purpose: Обеспечить стабильную работу рекламы, облачных сохранений и лидербордов
    на всех поддерживаемых площадках (Yandex Games, VK, CrazyGames).
  when_to_use: При подготовке финальной сборки и настройке монетизации Web/Mobile
    проектов.
  rules:
  - Всегда глушить звук игры при показе рекламы и ставить игровой процесс на паузу.
  - Никогда не вызывать Interstitial без проверки таймера кулдауна (минимум 90-120
    сек).
  - Всегда обрабатывать сценарии сбоя показа рекламы (ad failed) без блокировки интерфейса
    игрока.
  architecture: Bridge Facade Pattern -> Platform Event Listeners -> Storage & Ad
    Handlers.
  implementation_guidance: Инициализируйте bridge в entry-point файле main.ts до запуска
    игрового цикла. Подписывайтесь на события паузы и отключения звука.
  common_mistakes:
  - Показ рекламы во время динамичного боя или свайпа игрока.
  - Потеря наград игрока при сетевых ошибках в Rewarded Video.
  checklist:
  - Протестированы события ad_started и ad_closed
  - Настроено сохранение прогресса в Cloud Storage
  - Проверена работа на мобильных WebView
  knowledge_refs:
  - Playgama Bridge SDK 2.x Documentation
  - Yandex Games SDK Best Practices
- skill_id: game_skill
  name: 'CYBER SLICE: BULLET PROTOCOL (Кибер Срез: Протокол Времени) Domain Architecture'
  filename: GAME_SKILL.md
  purpose: 'Defines domain rules, state machine, and core gameplay loop for CYBER
    SLICE: BULLET PROTOCOL (Кибер Срез: Протокол Времени).'
  when_to_use: Use when writing or modifying core game state, loop coordination, and
    progression.
  rules:
  - Strict TypeScript strict mode without any 'any' types.
  - Fixed 60Hz delta accumulator with delta clamping.
  - Decoupled state management via typed EventBus.
  - Zero runtime object allocations inside the 60Hz game loop.
  architecture: 'Decoupled 3-layer architecture: Application/Platform -> Engine/Systems
    -> Rendering/UI.'
  implementation_guidance: Instantiate Game instance from main.ts, bootstrap PlaygamaService,
    and start GameLoop.
  common_mistakes:
  - Do not instantiate Three.js meshes or heavy objects inside tick loops.
  - Do not bypass the EventBus for cross-system communications.
  checklist:
  - Game initializes cleanly and loads within 3 seconds.
  - EventBus routes inputs and system events without memory leaks.
  - Audio auto-pauses and unpauses cleanly with browser focus changes.
