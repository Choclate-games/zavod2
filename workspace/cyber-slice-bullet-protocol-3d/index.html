<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CYBER SLICE: BULLET PROTOCOL (Кибер Срез: Протокол Времени)</title>
  
  <!-- Cyberpunk Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <style>
    :root {
      --cyan: #00f3ff;
      --magenta: #ff0055;
      --gold: #ffd700;
      --violet: #b026ff;
      --bg-dark: #060814;
      --panel-bg: rgba(9, 14, 28, 0.85);
      --panel-border: rgba(0, 243, 255, 0.4);
      --font-title: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: var(--font-body);
      color: #ffffff;
      touch-action: none;
      position: fixed;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Common Utilities */
    .hidden {
      display: none !important;
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.6s ease-out;
      pointer-events: none;
    }

    .text-red { color: var(--magenta) !important; text-shadow: 0 0 10px var(--magenta); }
    .text-gold { color: var(--gold) !important; text-shadow: 0 0 10px var(--gold); }
    .text-cyan { color: var(--cyan) !important; text-shadow: 0 0 10px var(--cyan); }

    /* Loading Overlay */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #0e172e 0%, #05070e 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .loading-logo {
      font-family: var(--font-title);
      font-size: clamp(24px, 5vw, 44px);
      font-weight: 900;
      text-align: center;
      color: #fff;
      text-shadow: 0 0 20px var(--cyan), 0 0 40px var(--cyan);
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .loading-sub {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--cyan);
      opacity: 0.8;
      margin-bottom: 30px;
      text-align: center;
    }

    .loading-bar-wrap {
      width: min(340px, 80vw);
      height: 10px;
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid var(--cyan);
      padding: 2px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .loading-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--magenta));
      animation: pulse-glow 1.5s infinite alternate;
    }

    @keyframes pulse-glow {
      0% { opacity: 0.7; }
      100% { opacity: 1; filter: drop-shadow(0 0 8px #fff); }
    }

    /* Cyber Buttons */
    .cyber-btn {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1px;
      padding: 12px 24px;
      border: none;
      cursor: pointer;
      position: relative;
      clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
      transition: transform 0.15s, filter 0.15s, background-color 0.2s;
      outline: none;
    }

    .cyber-btn:active {
      transform: scale(0.96);
    }

    .cyber-btn.primary {
      background: linear-gradient(135deg, #00f3ff, #0088ff);
      color: #05070e;
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.5);
    }

    .cyber-btn.secondary {
      background: linear-gradient(135deg, #ff0055, #990033);
      color: #ffffff;
      box-shadow: 0 0 18px rgba(255, 0, 85, 0.5);
    }

    .cyber-btn.tertiary {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .cyber-btn.ad-glow {
      background: linear-gradient(135deg, #ffd700, #ff8800);
      color: #000;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
      animation: ad-pulse 1.8s infinite;
    }

    @keyframes ad-pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    .cyber-btn.small {
      padding: 6px 14px;
      font-size: 13px;
    }

    .cyber-btn.disabled {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(1);
    }

    /* Main Menu */
    #main-menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(20px + var(--safe-top)) calc(20px + var(--safe-right)) calc(25px + var(--safe-bottom)) calc(20px + var(--safe-left));
      background: radial-gradient(circle at center, rgba(6, 8, 20, 0.6) 0%, rgba(6, 8, 20, 0.95) 100%);
    }

    .menu-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-btn {
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid var(--cyan);
      color: #fff;
      padding: 8px 14px;
      border-radius: 4px;
      font-family: var(--font-title);
      font-size: 13px;
      cursor: pointer;
    }

    .menu-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .game-logo-title {
      font-family: var(--font-title);
      font-size: clamp(28px, 6vw, 56px);
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 15px var(--cyan), 0 0 30px var(--cyan);
      margin-bottom: 6px;
    }

    .game-logo-subtitle {
      font-family: var(--font-mono);
      font-size: clamp(12px, 2.5vw, 16px);
      color: var(--cyan);
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: min(320px, 90vw);
    }

    .menu-footer {
      font-family: var(--font-mono);
      font-size: 12px;
      opacity: 0.6;
      text-align: center;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
      padding: calc(14px + var(--safe-top)) calc(14px + var(--safe-right)) calc(14px + var(--safe-bottom)) calc(14px + var(--safe-left));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .hud-left-bars {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(280px, 45vw);
    }

    .bar-wrapper {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 2px;
      position: relative;
      height: 20px;
      clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    }

    .bar-fill {
      height: 100%;
      transition: width 0.15s ease-out;
    }

    .bar-fill.hp {
      background: linear-gradient(90deg, #ff0055, #ff4400);
      box-shadow: 0 0 10px #ff0055;
    }

    .bar-fill.chrono {
      background: linear-gradient(90deg, #00f3ff, #0088ff);
      box-shadow: 0 0 10px #00f3ff;
    }

    .bar-fill.heat {
      background: linear-gradient(90deg, #ffd700, #ff5500);
      box-shadow: 0 0 10px #ffd700;
    }

    .bar-label {
      position: absolute;
      top: 50%;
      left: 8px;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 4px #000;
    }

    .bar-value {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      font-size: 11px;
      color: #fff;
    }

    .hud-center-alerts {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .overdrive-alert {
      font-family: var(--font-title);
      font-size: clamp(16px, 3.5vw, 26px);
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 15px var(--gold), 0 0 25px #ff5500;
      animation: overdrive-flash 0.8s infinite alternate;
    }

    @keyframes overdrive-flash {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.1); filter: brightness(1.5); }
    }

    .combo-display {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .combo-rank {
      font-family: var(--font-title);
      font-size: 32px;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 4px;
      text-shadow: 0 0 12px currentColor;
    }

    .rank-d { color: #8899aa; }
    .rank-c { color: #00f3ff; }
    .rank-b { color: #00ff66; }
    .rank-a { color: #ffe600; }
    .rank-s { color: #ff0055; }
    .rank-ss { color: #b026ff; }
    .rank-sss { color: #ffffff; text-shadow: 0 0 20px #ffd700, 0 0 40px #ff0055; }

    .combo-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      font-family: var(--font-title);
    }

    .combo-count {
      font-size: 18px;
      color: #fff;
    }

    .combo-multiplier {
      font-size: 14px;
      color: var(--cyan);
    }

    .hud-right-stats {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      pointer-events: auto;
    }

    .wave-badge, .score-badge, .credit-badge-hud {
      font-family: var(--font-mono);
      font-size: 14px;
      background: rgba(9, 14, 28, 0.75);
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 4px 10px;
      border-radius: 2px;
      color: var(--cyan);
    }

    /* Boss HP Bar */
    #boss-bar-container {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: min(450px, 70vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .boss-name {
      font-family: var(--font-title);
      font-size: 13px;
      color: var(--magenta);
      letter-spacing: 2px;
      text-shadow: 0 0 8px var(--magenta);
    }

    .boss-bar-wrap {
      width: 100%;
      height: 14px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--magenta);
      padding: 1px;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
    }

    .boss-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--magenta), #ff8800);
      transition: width 0.1s;
    }

    /* Floating Combat Text */
    #floating-text-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 6;
      overflow: hidden;
    }

    .floating-combat-text {
      position: absolute;
      font-family: var(--font-title);
      font-size: 20px;
      font-weight: 800;
      transform: translate(-50%, -50%);
      animation: float-fade 0.85s forwards ease-out;
      text-shadow: 0 0 8px currentColor, 0 0 2px #000;
    }

    @keyframes float-fade {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      20% { opacity: 1; transform: translate(-50%, -80%) scale(1.3); }
      100% { opacity: 0; transform: translate(-50%, -150%) scale(1); }
    }

    /* Touch Controls Layer */
    #touch-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 7;
      pointer-events: none;
    }

    #joystick-zone {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      pointer-events: auto;
      touch-action: none;
    }

    #joystick-base {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid rgba(0, 243, 255, 0.5);
      background: rgba(0, 243, 255, 0.1);
      transform: translate(-50%, -50%);
      display: none;
      pointer-events: none;
    }

    #joystick-thumb {
      position: absolute;
      width: 50px;
      height: 50px;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 15px var(--cyan);
      transform: translate(-50%, -50%);
    }

    .touch-actions {
      position: absolute;
      right: calc(18px + var(--safe-right));
      bottom: calc(18px + var(--safe-bottom));
      display: flex;
      gap: 14px;
      align-items: flex-end;
      pointer-events: auto;
    }

    .touch-action-btn {
      background: rgba(9, 14, 28, 0.8);
      border: 2px solid var(--cyan);
      color: #fff;
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 14px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
    }

    .touch-action-btn:active, .touch-action-btn.active {
      background: var(--cyan);
      color: #000;
      transform: scale(0.92);
    }

    .touch-action-btn.btn-main {
      width: 82px;
      height: 82px;
      border-color: var(--magenta);
      box-shadow: 0 0 16px rgba(255, 0, 85, 0.4);
    }

    .touch-action-btn.btn-main:active {
      background: var(--magenta);
      color: #fff;
    }

    .touch-action-btn.btn-sub {
      width: 64px;
      height: 64px;
    }

    /* Modals & Panels */
    #modal-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      background: rgba(5, 8, 16, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .cyberpunk-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 24px;
      width: min(580px, 95vw);
      max-height: 90vh;
      overflow-y: auto;
      clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .neon-title {
      font-family: var(--font-title);
      font-size: clamp(20px, 4vw, 28px);
      color: var(--cyan);
      text-shadow: 0 0 12px var(--cyan);
      text-align: center;
    }

    .panel-subtitle {
      font-family: var(--font-mono);
      font-size: 13px;
      opacity: 0.8;
      text-align: center;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .draft-card {
      background: rgba(14, 22, 40, 0.9);
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 14px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .draft-card:hover, .draft-card:active {
      transform: translateY(-4px);
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    }

    .draft-card.rarity-legendary { border-color: var(--gold); box-shadow: 0 0 12px rgba(255, 215, 0, 0.3); }
    .draft-card.rarity-epic { border-color: var(--violet); box-shadow: 0 0 12px rgba(176, 38, 255, 0.3); }
    .draft-card.rarity-rare { border-color: var(--cyan); }
    .draft-card.rarity-common { border-color: #556677; }

    .card-rarity-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
    }

    .card-icon { font-size: 28px; margin: 4px 0; }
    .card-title { font-family: var(--font-title); font-size: 14px; color: #fff; }
    .card-desc { font-size: 12px; opacity: 0.85; line-height: 1.3; flex-grow: 1; }

    /* Hub tabs & Katana Grid */
    .hub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .credit-badge {
      font-family: var(--font-mono);
      font-size: 16px;
      color: var(--gold);
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid var(--gold);
      padding: 4px 10px;
      border-radius: 4px;
    }

    .hub-tabs {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      padding-bottom: 8px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-family: var(--font-title);
      font-size: 14px;
      cursor: pointer;
      padding: 6px 12px;
    }

    .tab-btn.active {
      color: var(--cyan);
      border-bottom: 2px solid var(--cyan);
    }

    .stats-upgrade-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .upgrade-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(14, 22, 40, 0.6);
      padding: 10px 14px;
      border-radius: 4px;
    }

    .pip-meter {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .pip {
      width: 12px;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 1px;
    }

    .pip.filled {
      background: var(--cyan);
      box-shadow: 0 0 6px var(--cyan);
    }

    .katana-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }

    .katana-card {
      background: rgba(14, 22, 40, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      text-align: center;
    }

    .katana-card.equipped {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
    }

    .katana-preview-bar {
      width: 80%;
      height: 4px;
      border-radius: 2px;
      margin-bottom: 4px;
    }

    .katana-card h4 { font-family: var(--font-title); font-size: 13px; }
    .katana-card p { font-size: 11px; opacity: 0.8; }

    /* Summary & Stats */
    .stats-summary {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 14px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
    }

    .stat-row.highlight {
      color: var(--cyan);
      font-size: 16px;
      border-top: 1px solid rgba(0, 243, 255, 0.2);
      padding-top: 6px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .modal-actions.vertical {
      flex-direction: column;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 3D WebGL Canvas Layer -->
    <div id="canvas-container"></div>

    <!-- Floating Combat Text -->
    <div id="floating-text-layer"></div>

    <!-- Loading Splash -->
    <div id="loading-overlay">
      <h1 class="loading-logo">CYBER SLICE</h1>
      <p class="loading-sub">BULLET PROTOCOL • КИБЕР СРЕЗ</p>
      <div class="loading-bar-wrap">
        <div class="loading-bar-fill"></div>
      </div>
    </div>

    <!-- Main Menu Screen -->
    <div id="main-menu" class="hidden">
      <div class="menu-header">
        <button id="btn-sound-toggle" class="ui-interactive-btn header-btn"><span id="btn-sound-icon">🔊</span></button>
        <button id="btn-lang-toggle" class="ui-interactive-btn header-btn">RU / EN</button>
      </div>

      <div class="menu-center">
        <h1 class="game-logo-title" data-i18n="app_title">CYBER SLICE: BULLET PROTOCOL</h1>
        <p class="game-logo-subtitle" data-i18n="app_subtitle">3D Свайп-Слэшер • Замедление Времени • Расщепление Материи</p>

        <div class="menu-buttons">
          <button id="btn-play-game" class="ui-interactive-btn cyber-btn primary" data-i18n="btn_play">В БОЙ</button>
          <button id="btn-open-hub" class="ui-interactive-btn cyber-btn secondary" data-i18n="btn_hub">КИБЕР-ДОДЗЁ</button>
          <button id="btn-open-settings" class="ui-interactive-btn cyber-btn tertiary" data-i18n="btn_settings">НАСТРОЙКИ</button>
        </div>
      </div>

      <div class="menu-footer">
        <span>© 2026 CYBER SLICE • PLAYGAMA BRIDGE • THREE.JS 3D ENGINE</span>
      </div>
    </div>

    <!-- Live HUD Overlay -->
    <div id="hud" class="hidden">
      <!-- Boss Bar (Top Center) -->
      <div id="boss-bar-container" class="hidden">
        <span id="boss-name-text" class="boss-name">APEX CHRONOS</span>
        <div class="boss-bar-wrap">
          <div id="boss-hp-fill" class="boss-bar-fill"></div>
        </div>
      </div>

      <div class="hud-top">
        <!-- Gauges: HP, Chrono Energy, Heat -->
        <div class="hud-left-bars">
          <div class="bar-wrapper">
            <div id="hud-hp-fill" class="bar-fill hp" style="width: 100%;"></div>
            <span class="bar-label">HP</span>
            <span id="hud-hp-text" class="bar-value">100 / 100</span>
          </div>

          <div class="bar-wrapper">
            <div id="hud-chrono-fill" class="bar-fill chrono" style="width: 100%;"></div>
            <span class="bar-label">CHRONO</span>
          </div>

          <div class="bar-wrapper">
            <div id="hud-heat-fill" class="bar-fill heat" style="width: 0%;"></div>
            <span class="bar-label">HEAT</span>
          </div>
        </div>

        <!-- Center Alerts & Combo -->
        <div class="hud-center-alerts">
          <div id="hud-overdrive-alert" class="overdrive-alert hidden" data-i18n="hud_overdrive">⚡ OVERDRIVE ACTIVE! ⚡</div>

          <div class="combo-display hidden">
            <div id="hud-combo-badge" class="combo-rank rank-d">D</div>
            <div class="combo-info">
              <span id="hud-combo-count" class="combo-count">0 SLICES</span>
              <span id="hud-combo-multiplier" class="combo-multiplier">x1.0</span>
            </div>
          </div>
        </div>

        <!-- Right stats -->
        <div class="hud-right-stats">
          <button id="btn-hud-pause" class="ui-interactive-btn header-btn">⏸️</button>
          <div id="hud-wave-text" class="wave-badge">WAVE 1</div>
          <div id="hud-score-text" class="score-badge">SCORE: 0</div>
          <div class="credit-badge-hud">🪙 <span id="hud-credits-text">0</span></div>
        </div>
      </div>

      <!-- Bottom instruction / info -->
      <div class="hud-bottom"></div>
    </div>

    <!-- Touch Controls Layer -->
    <div id="touch-layer" class="hidden">
      <!-- Left Joystick Zone -->
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-thumb"></div>
        </div>
      </div>

      <!-- Right Action Buttons -->
      <div class="touch-actions">
        <button id="btn-touch-bt" class="ui-interactive-btn touch-action-btn btn-sub">
          <span>⌛</span>
          <small style="font-size: 9px;">TIME</small>
        </button>
        <button id="btn-touch-dash" class="ui-interactive-btn touch-action-btn btn-main">
          <span>⚡</span>
          <small style="font-size: 11px;">DASH</small>
        </button>
        <button id="btn-touch-overdrive" class="ui-interactive-btn touch-action-btn btn-sub">
          <span>🔥</span>
          <small style="font-size: 9px;">OVER</small>
        </button>
      </div>
    </div>

    <!-- Modal Container (Draft, Upgrades, Game Over, Victory, Settings, Pause) -->
    <div id="modal-container" class="hidden"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
