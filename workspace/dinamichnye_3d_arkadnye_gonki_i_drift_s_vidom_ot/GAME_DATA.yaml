  interactions: 'Управляет игровыми состояниями: Start -> Racing -> CheckpointReached
    -> Finished / Crashed.'
  feedback: Звуковой сигнал чекпоинта (+секунды на таймере), анимация взвешивания
    на финише с начислением звезд.
  edge_cases:
  - Финиш задом или на двух колесах засчитывается как трюковой бонус.
core_design:
  signature_moment: 'Вход в затяжную слепую шпильку ''Чертова Петля'' на скорости
    88 км/ч: ты дергаешь ручник, 8000 кг молока в цистерне с металлическим гулом накатывают
    на внешнюю стенку, задирая внутренние колеса тягача в воздух на угол 28 градусов
    над километровой пропастью. В этот миг правые задние колеса скользят в 15 сантиметрах
    от обрыва, шкала ''Фактор Бездны'' вспыхивает множителем x4.0, синий лед срывает
    сцепление, но ты синхронным импульсом контрруления и полным газом заставляешь
    противоволну молока ударить в противоположный борт, возвращая тягач на 4 колеса
    с реактивным выбросом снежно-ледяной пыли и катапультируя 14-тонный автопоезд
    на прямую к весовой рамке.'
  genre_template_rejected: 'Отвергнут шаблон ''Аркадного рельсового дрифта с фиксированным
    центром масс и невидимыми стенами'' (типичный для Asphalt, Ridge Racer, Need for
    Speed). В стандартных аркадных гонках машина моделируется как единое абсолютно
    твердое тело с неизменным центром тяжести: нажатие кнопки дрифта мгновенно срывает
    машину в скольжение с жестко заданной траекторией, а отбойники по краям трассы
    лишь замедляют ход. В нашей игре этот шаблон отвергнут, так как он полностью уничтожает
    физическую драму управления многотонным молоковозом. 8 тонн молока внутри цистерны
    живут собственной физической жизнью маятника с фазовой задержкой 0.35 с: игрок
    побеждает не заучиванием тайминга одной кнопки, а физическим предвосхищением переката
    жидкости, превращая опасный гидроудар в рычаг скоростного прохождения поворота
    над реальной километровой бездной без спасительных невидимых стен.'
  what_makes_it_different: 'В отличие от классических аркадных гонок и тяжелых симуляторов
    (SnowRunner / CarX), здесь центр тяжести автомобиля является подвижным динамическим
    актором: 8000 кг молока внутри цистерны имеют запаздывающий импульс (фазовый сдвиг
    0.35 с). Это превращает каждую шпильку в задачу резонансного управления: если
    игрок начинает маневр в противофазе с волной, гидроудар неизбежно опрокинет грузовик
    в пропасть, но если поймать фазу удара волны о борт, молоко сработает как сверхмощный
    гидродинамический рычаг, заправляющий 14-тонную махину в апекс поворота. Вторым
    отличием является механика ''Фактора Бездны'', где близость к смертельному обрыву
    без невидимых стен не наказывает игрока, а экспоненциально накачивает турбо-буст
    и множитель очков, создавая экстремальный баланс между сохранением 100% груза
    и победой на 3 звезды.'
  micro_loop:
  - step: Оценка фазы волны молока и выбор траектории входа перед поворотом
    player_action: Удержание полного газа на снежном накате, считывание гироскопического
      инклинометра цистерны и прицеливание колеи к внешнему краю полотна
    game_response: Цистерна плавно раскачивается (крен ±4°), рокот дизеля на 2400
      об/мин, индикатор уровня молока устойчив (100%), HUD подсвечивает зону синего
      льда впереди
    decision: Начать раскачку грузовика скандинавским фликом заранее или сорвать заднюю
      ось ручником точно в апексе
    duration: 1.2 с
  - step: Инерционный срыв задней тележки и провокация волны молока
    player_action: Кратковременный зажим ручного тормоза (Space / тач-кнопка) с синхронным
      резким поворотом руля в сторону апекса
    game_response: Блокировка задней спарки колес, срыв задней оси в занос под углом
      35°, 8 тонн молока бьют во внешний борт, внутренние колеса отрываются от дороги
      на 22°
    decision: Сколько миллисекунд удерживать ручник, чтобы накренить цистерну для
      виража, но не превысить критический угол переворота 32°
    duration: 0.4 с
  - step: Балансирование угла заноса контррулением на синем льду над обрывом
    player_action: Резкий выворот руля в противоположную сторону (контрруление) с
      микро-коррекциями угла дрифта
    game_response: Колеса скользят по синему льду (mu=0.18), задний бампер цистерны
      зависает в 25 см над пропастью, множитель 'Фактор Бездны' подскакивает до x3.8,
      камера кренится с динамическим зумом
    decision: Срезать траекторию ближе к скале (безопасно, 1 звезда) или скользить
      в 20 см от обрыва ради множителя x4.0 и турбо-заряда
    duration: 1.5 с
  - step: Подача тяги и стабилизация противоволны молока на выходе из апекса
    player_action: Полное нажатие педали газа с распрямлением руля по направлению
      следующего прямого отрезка серпантина
    game_response: Турбина выбрасывает пламя из выхлопной трубы, тягач вытягивает
      нос из заноса, обратная волна молока стабилизируется, колеса прижимаются ко
      льду со шлейфом снежной пыли
    decision: Сбросить газ на мгновение при риске обратного гидроудара или вжать педаль
      в пол для реактивного разгона к следующей связке
    duration: 0.8 с
  meso_loop:
  - step: 'Сектор 1: Вводный скоростной спуск и калибровка колебаний груза'
    player_action: Прохождение вводных пологих дуг, адаптация к инерции маятника цистерны
      и разгон до 95 км/ч
    game_response: Фиксация сплит-тайма первого чекпоинта, подтверждение 100% целостности
      груза, заполнение первого сегмента шкалы нитро
    decision: Использовать ли накопленный нитро-буст на прямике или приберечь для
      стабилизации на крутом спуске Сектора 2
    duration: 20.0 с
  - step: 'Сектор 2: Каскад ледяных шпилек над обрывом и балансирование гидроудара'
    player_action: Серия агрессивных заносов по участкам синего льда с вывешиванием
      колес над обрывом ради множителя x4.0
    game_response: Срабатывание звукового зуммера критического давления, отсчет дельты
      времени (-1.6 с от золотого норматива)
    decision: Рискнуть аварийным сбросом 250 л молока для мгновенной стабилизации
      или спасать груз ювелирным контррулением
    duration: 30.0 с
  - step: 'Сектор 3: Слепой спуск, трамплины и финальный штурм весовой рамки'
    player_action: Стабилизация автопоезда после слепых трамплинов и финальный спурт
      на полном газу в финишный створ
    game_response: Вспышка лазерных датчиков весовой платформы, замедление времени
      (bullet-time на 0.5 с), мгновенная фиксация сохраненной массы груза
    decision: Притормозить перед весовой рамкой для защиты от гидроудара о переднюю
      стенку или влетать на полном ходу ради рекорда трассы
    duration: 25.0 с
  macro_loop:
  - step: Финальное взвешивание груза и подведение итогов заезда
    player_action: Ознакомление с итоговым протоколом спуска (время прохождения, %
      сохраненного молока, очки 'Фактора Бездны')
    game_response: Начисление валюты 'Крио-Рубли', присвоение 1–3 звезд за спуск,
      анимация слива сохраненного молока в приемный резервуар завода
    decision: Повторить спуск ради улучшения времени и 3 звезд или перейти в гараж
      для закупки улучшений цистерны
    duration: 12 с
  - step: Инженерная модификация цистерны и шасси тягача в гараже
    player_action: Монтаж перфорированных переборок (Baffles), ошиповка резины вольфрамовыми
      шипами и настройка рулевого редуктора
    game_response: Обновление физических характеристик тягача (снижение гидроудара
      на 35%, ускорение перекладки руля на 0.15 с), списание валюты
    decision: Инвестировать в тяжелые волнорезы (стабильность крена) или облегченную
      колбу для скоростных рекордов
    duration: 25 с
  - step: Выбор трассы экспедиции и запуск следующего спуска
    player_action: Выбор следующего высокогорного перевала на карте ледника с анализом
      профиля высот и опасных участков
    game_response: Разблокировка трассы 'Чертов Хребет', вывод погодной сводки (метель,
      боковой ветер 18 м/с, -28°C) и целевого норматива времени
    decision: Выбрать перевал с гладким синим льдом для дрифта или экстремальный хребет
      с порывами бокового ветра
    duration: 15 с
