  - physics/pendulum_slosh_model.md
- skill_id: raycast_ice_drift_controller
  name: Контроллер Лучевой Подвески и Дрифта по Льду
  filename: skills/raycast_ice_drift.md
  purpose: Симуляция сцепления 6 колес с поверхностями льда и снега, реализация контрруления
    и заноса.
  when_to_use: Для всех дорожных расчетов, взаимодействия колес с грунтом и передачи
    сил тяги/торможения.
  rules:
  - Каждое колесо пускает вертикальный луч вниз для определения длины пружины подвески
  - Сила трения шины рассчитывается по упрощенной формуле Пейджека (Pacejka Magic
    Formula)
  - При наезде на зеркальный лед поперечное сцепление снижается на 80%
  architecture: Модуль RaycastVehicle на базе Rapier3D с кастомным обработчиком бокового
