definition_of_done:
- 1. Физическая модель Rapier3D Raycast Vehicle стабильно работает на 60 FPS с честным
  расчетом 6 колес и подвески.
- 2. Реализована и откалибрована механика гидродинамического маятника (Liquid Slosh),
  влияющая на крен и опрокидывание.
- 3. Построена трасса высокогорного серпантина с тремя типами покрытий (снег, лед,
  скала) и открытым обрывом.
- 4. Реализовано двухпальцевое мобильное управление и клавиатурная раскладка с ручным
  тормозом.
- '5. Работает полный цикл спринтерского спуска: старт -> 3 чекпоинта -> дрифт-очки
  -> взвешивание молока -> победный экран.'
- '6. Интегрирован @playgama/bridge SDK: протестированы сохранения в Cloud Storage,
  лидерборды и Rewarded реклама.'
- 7. Проверена производительность на мобильных браузерах (Safari iOS и Chrome Android)
  — стабильные 60 FPS.
- 'Игра осталась тем, что просили: игрок ведёт машину: руль, газ, трасса.'
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Разгон по ледяному серпантину -> Оценка крена волны молока
  перед поворотом -> Срыв задней оси ручником и удержание угла заноса контррулением
  -> Балансировка центра масс газом для предотвращения опрокидывания в пропасть ->
  Пересечение финишной весовой рамки -> Получение наград и открытие новых перевалов..'
- 'Реализованы механики проекта: Гидродинамический Маятник и Гидроудар Цистерны, Ледяной
  Срыв Покрытия и Контрруление, Инерционный Хлыст Ручным Тормозом, Фактор Бездны и
  Турбо-Выход.'
- Условие успеха (Успешное пересечение финишной весовой рамки с сохранением не менее
  75% объема молока в цистерне за время быстрее квалификационного норматива трассы
  (менее 75 секунд для 3 звезд).) и условие проигрыша (Падение молоковоза в пропасть
  за пределы трассы ИЛИ полный переворот тягача на крышу/бок с потерей более 50% объема
  молока из-за разгерметизации люков цистерны.) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Ледяной Экспресс: Жидкий Баланс».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Мгновенный Респаун на Чекпоинте,
  Удвоение Награды за Спуск, Аренда Тяжелой Цистерны Полярный Титан); interstitial
  соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
