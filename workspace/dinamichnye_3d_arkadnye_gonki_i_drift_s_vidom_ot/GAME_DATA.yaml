raw_prompt: Динамичные 3D аркадные гонки и дрифт с видом от третьего лица на узком
  ледяном серпантине горного озера. Игрок управляет многотонным молоковозом с помощью
  стрелок или тач-кнопок, входя в управляемый занос и балансируя центр тяжести из-за
  плещущейся в цистерне физической массы. На экране отображается замерзшая извилистая
  трасса над обрывом, шкала угла заноса, индикатор баланса цистерны и вылетающие из-под
  колес осколки льда. Задача — пройти опасные повороты в непрерывном дрифте и доехать
  до финиша, не опрокинувшись в бездну.
title: 'Ледяной Экспресс: Жидкий Баланс'
slug: dinamichnye_3d_arkadnye_gonki_i_drift_s_vidom_ot
genre: 3D Аркадный Автосимулятор
subgenre: Физический Дрифт-Спуск / Горный Тайм-Аттак Тяжеловоза
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web / Mobile)
orientation: landscape
target_audience: Игроки 14–35 лет, поклонники физических автосимуляторов, дрифта и
  напряженных скоростных испытаний (Time Attack), ценящие сочный геймфил, честную
  физику тяжелой техники и короткие адреналиновые сессии по 1–2 минуты на смартфонах
  и ПК.
core_loop: Разгон по ледяному серпантину -> Оценка крена волны молока перед поворотом
  -> Срыв задней оси ручником и удержание угла заноса контррулением -> Балансировка
  центра масс газом для предотвращения опрокидывания в пропасть -> Пересечение финишной
  весовой рамки -> Получение наград и открытие новых перевалов.
hook: Момент, когда на скорости 90 км/ч в заносе над километровым обрывом ты видишь,
  как 8 тонн молока внутри хромированной цистерны с грохотом бьют в противоположный
  борт, кабина отрывает два колеса от зеркального синего льда, и ты резким контррулением
  в миллиметре от бездны ловишь горизонт и выстреливаешь из шпильки.
player_fantasy: Ты — элитный водитель-виртуоз тяжелого высокогорного молоковоза, способный
  подчинить законы гидродинамики и инерции, превращая смертоносный плеск многотонного
  жидкого груза в стабилизирующий противовес для прохождения ледяных шпилек на грани
  пропасти.
session_model: Спринтерский спуск точка-в-точку на 60–80 секунд с 3 чекпоинтами и
  финальной взвешивающей рамкой на финише.
unique_value_proposition: Первый мобильный физический автосимулятор дрифта, где управляемость
  грузовика определяется гидродинамической инерцией плещущегося груза (slosh physics),
  превращающей каждый занос из банального скольжения в тактическую битву за центр
  тяжести над обрывом.
vision: Визуально эффектная, кинематографичная и физически глубокая аркада о спуске
  молоковоза по замерзшему перевалу в лучах закатного солнца, где каждая секунда требует
  ювелирного баланса между скоростью, углом дрифта и гидроударом массы груза.
elevator_pitch: 'Удержи 15-тонный молоковоз в непрерывном заносе на зеркальном льду
  горного серпантина: используй волну молока в цистерне как стабилизатор в шпильках,
  балансируй на двух колесах над пропастью и доставь молоко в целости за 70 секунд!'
win_conditions: Успешное пересечение финишной весовой рамки с сохранением не менее
  75% объема молока в цистерне за время быстрее квалификационного норматива трассы
  (менее 75 секунд для 3 звезд).
lose_conditions: Падение молоковоза в пропасть за пределы трассы ИЛИ полный переворот
  тягача на крышу/бок с потерей более 50% объема молока из-за разгерметизации люков
  цистерны.
progression_summary: 12 авторских ледяных перевалов с нарастающей сложностью геометрии
  и участков синего льда; разблокировка 4 специализированных цистерн с различными
  перегородками-гасителями волны (Baffles) и 6 кастомных северных ливрей кабины.
difficulty_curve: 'Трассы 1–3 (Ущелье Новичков): широкий снежный накат, плавные дуги,
  отбойники по краям; Трассы 4–7 (Синий Карниз): участки чистого гладкого льда в апексах,
  связки шпилек, раскачивающие молоко; Трассы 8–12 (Чертов Хребет): слепые трамплины,
  отсутствие ограждений, шпильки с обратным уклоном полотна над бездной.'
