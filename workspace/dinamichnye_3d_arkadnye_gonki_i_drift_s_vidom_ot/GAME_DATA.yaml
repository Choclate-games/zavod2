  selected_id: D1
  selected_name: 'Ледяной Экспресс: Жидкий Баланс'
  selection_reason: 'Направление D1 идеально попадает в заказ пользователя: оно фокусируется
    на чистом физическом мастерстве удержания многотонного молоковоза в заносе на
    грани пропасти. Формат скоростного спуска точка-в-точку (тайм-аттак) на 60–80
    секунд идеально подходит для мобильного браузера: нет лишней нагрузки на физический
    движок от множества машин, мгновенный старт без обучения, интуитивно понятное
    управление перекатом центра тяжести двумя пальцами на тачскрине и максимальный
    визуальный адреналин на каждом повороте.'
  rejected_reasons:
  - 'Направление D2 (Ледовый Таран: Дуэль Цистерн) отвергнуто: контактный бой на узком
    обледенелом серпантине разрушает чистоту физического управления тяжелой фурой;
    на узкой ледяной дороге ИИ-соперники неизбежно создают глухие заторы в шпильках
    либо хаотично вылетают в пропасть сами по себе, лишая игрока ощущения личного
    водительского мастерства.'
  - 'Направление D3 (Безумный Удой: Доставка без Потерь) отвергнуто: механика наказания
    за расплескивание молока психологически противоречит природе драйвового аркадного
    дрифта; страх потерять груз заставляет игрока перестраховываться и ползти с черепашьей
    скоростью, убивая ощущение скорости и адреналина над обрывом.'
  what_it_is_not:
  - 'Не симулятор дальнобойщика: нет ручного переключения 18 передач, расхода топлива,
    медленной парковки у рампы и дорожных знаков'
  - 'Не Mario Kart / боевая аркада: на трассе нет летающих бонусов, ракет, масляных
    луж, бананов и цветных ускоряющих полос'
  - 'Не легковой спорткар-дрифт: физика не ощущается как невесомый картинг; это тяжелый
    15-тонный тягач с запаздыванием реакции и мощным гидроударом груза'
  - 'Не бесконечный раннер: трасса является фиксированным, вручную сбалансированным
    авторским серпантином со стартом и финишем, а не процедурной трубой'
  - 'Не рогалик с карточками апгрейдов: никаких пауз с выбором перков посреди заезда
    и посторонней мета-прогрессии'
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - Физическое динамическое смещение центра тяжести (CoM) из-за плещущейся в цистерне
    массы молока, влияющее на крен кузова и сцепление колес с поверхностью
  - Непрерывный скоростной занос на обледенелом горном серпантине над открытым обрывом
    без искусственных невидимых стен
  - Наглядный индикатор баланса цистерны и угла заноса прямо в интерфейсе/игровом
    пространстве для мгновенного считывания состояния инерции
  - 'Ощутимый физический контраст сцепления: зеркальный скользкий синий лед в апексе
    против снежного наката на обочине'
  signature_scene: 'Кадр на закате с низкой точки сзади и сбоку тяжелого трехосного
    молоковоза: хромированная цистерна в глубоком заносе под углом 45 градусов скользит
    в сантиметрах от обрыва замерзшего горного озера. Низкое золотисто-оранжевое солнце
    бьет контровым светом сквозь шлейф снежной пыли и фонтан сверкающих осколков синего
    льда, вылетающих из-под сдвоенных задних колес. На зеркальном боку цистерны горит
    яркий солнечный блик и четко виден уровень накренившейся волны молока, упершейся
    в верхний край бака, а впереди открывается извилистая ледяная лента серпантина
    над бездной.'
  avoid_references:
  - Euro Truck Simulator (рутинный медленный симулятор с парковкой)
  - Mario Kart (аркадные power-up бонусы, бананы и ракеты)
  - CarX Drift Racing / Initial D (дрифт на невесомых легковых спорткарах без инерции
    жидкого груза)
  - Hill Climb Racing (2D аркада с переворотами на холмах)
