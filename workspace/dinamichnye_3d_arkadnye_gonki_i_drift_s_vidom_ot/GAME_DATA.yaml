    - name: Масса перевозимого молока
      value: 8000 кг
      tuning_note: При массе выше 9000 кг тягач становится неуправляемым и мгновенно
        опрокидывается; при снижении ниже 6000 кг пропадает ощущение тяжести жидкого
        маятника.
    - name: Фазовое запаздывание волны молока
      value: 0.35 с
      tuning_note: Меньше 0.15 с — жидкость ощущается приклеенным твердым грузом;
        больше 0.6 с — игрок теряет причинно-следственную связь между рулением и ударом
        волны.
    - name: Критический угол опрокидывания шасси
      value: 32.0 градуса
      tuning_note: Ниже 25° — грузовик переворачивается слишком внезапно; выше 38°
        — игрок перестает бояться переворота и ездит на двух колесах.
    - name: Интенсивность выплеска молока при разгерметизации
      value: 350 л/с
      tuning_note: Меньше 150 л/с — потеря молока не создает угрозы поражения; больше
        600 л/с — малейший крен моментально аннулирует победу.
    feedback_layers:
    - 'Визуал/VFX: Хромированная цистерна глубоко кренится на рессорах; сквозь смотровой
      иллюминатор виден бушующий накат белой массы молока; при опасном крене из сапунов
      вырываются струи молочной пены; из-под перегруженных колес бьют снопы ледяных
      искр.'
    - 'Звук (Web Audio): Глухой низкочастотный рокот перекатывающейся жидкости (bandpass
      фильтр 80-200 Гц); звонкий металлический удар ''БОММ'' о стенку цистерны при
      гидроударе; шипение сброса воздуха из пневморессор.'
    - 'Камера: Динамический наклон камеры вслед за креном цистерны (до 14°); импульсный
      рывок камеры наружу виража в момент удара волны; шейкер камеры (амплитуда 0.35,
      частота 22 Гц) при вывешивании колес.'
    - 'UI/Тактильность: Круговой гироскопический инклинометр крена по центру капота
      с красной опасной зоной (>30°); тактильный вибро-импульс Haptic Feedback (80
      мс) при ударе волны о стенку цистерны.'
    failure_mode: 'Игрок затягивает руление в повороте и не успевает компенсировать
      фазу волны: гидроудар накладывается на центробежную силу, крен превышает 32°,
      молоко выбивает сапуны люков и тягач валится на бок.'
    mastery_curve: 'Новичок на 30-й секунде пугается первого крена, бросает газ и
      опрокидывается от запоздалого гидроудара. Эксперт на 10-м забеге использует
      гидроудар как пружину: раскачивает молоко перед входом, срывая заднюю ось точно
      в фазу удара волны для молниеносного закручивания в шпильку.'
    counterplay: Трасса предлагает череду связок поворотов с переменным радиусом и
      обратным поперечным уклоном полотна (-8° в сторону обрыва), что удваивает опрокидывающий
      момент.
    synergies:
    - 'Связана с ''Ледяным Срывом и Контррулением'': скольжение на синем льду снижает
      боковое трение, переводя опрокидывающий момент в управляемый дрифт.'
    - 'Связана с ''Инерционным Хлыстом Ручником'': блокировка задней тележки провоцирует
      мгновенный гидроудар для скоростного разворота.'
    - 'Связана с ''Фактором Бездны'': зависание накрененной цистерны над обрывом дает
      максимальный множитель очков.'
    why_unique: В стандартных автосимуляторах центр тяжести статичен. Здесь 8 тонн
      жидкости обладают собственной физической инерцией и фазовым сдвигом, превращая
      управление молоковозом в непрерывную работу с живой динамической массой.
    pseudocode: "function updateSloshDynamicBalance(dt, lateralAccel, steerInput,\
      \ bodyRoll) {\n  const targetSloshAngle = (lateralAccel / GRAVITY) * SLOSH_SENSITIVITY;\n\
      \  sloshVelocity += (targetSloshAngle - sloshAngle) * SLOSH_SPRING_K * dt;\n\
      \  sloshVelocity -= sloshVelocity * SLOSH_DAMPING * dt;\n  sloshAngle += sloshVelocity\
      \ * dt;\n  const totalRollTorque = (LIQUID_MASS * SLOSH_ARM * Math.sin(sloshAngle))\
      \ + (TRUCK_MASS * CG_HEIGHT * lateralAccel);\n  currentBodyRoll += (totalRollTorque\
      \ - currentBodyRoll * SUSPENSION_STIFFNESS) * dt;\n  if (currentBodyRoll > CRITICAL_ROLL_ANGLE_DEG\
      \ * DEG_TO_RAD) {\n    spilledMilkVolume += MILK_SPILL_RATE * dt;\n    triggerFeedback('hydro_spill_warning',\
      \ currentBodyRoll);\n  }\n}"
  - name: Ледяной Срыв Покрытия и Контрруление
    role_in_loop: Двигатель динамического скольжения и инструмент траекторного контроля
    player_decision: Выбрать безопасную траекторию по снежному накату (стабильно,
      но медленно) или забросить колеса на синий лед ради глубокого скоростного дрифта
      над обрывом.
    input_mapping: 'Клавиатура: Стрелки Влево/Вправо (A/D) для быстрого контрруления;
      Тачскрин: виртуальный рулевой диск с центрирующей пружиной.'
    states:
    - 'state_snow_grip: Снежный зацеп (mu=0.65, стабильное прямолинейное движение,
      угол скольжения < 8°)'
    - 'state_blue_ice_snap: Ледяной срыв (резкое падение mu до 0.18, потеря сцепления
      задней оси, начало заноса)'
    - 'state_active_counter_steer: Активное контрруление (руль вывернут навстречу
      заносу, баланс угла 25°–40°)'
    - 'state_spin_out: Неконтролируемое вращение (угол заноса > 60°, потеря тяги,
      вылет с трассы)'
    parameters:
    - name: Коэффициент сцепления синего льда
      value: 0.18 mu
      tuning_note: Ниже 0.10 — колеса превращаются в лыжи, теряя управление; выше
        0.28 — пропадает контраст и физическое ощущение ледяного срыва.
    - name: Окно реакции на парирование заноса
      value: 0.22 с
      tuning_note: Больше 0.4 с — занос становится казуальным и тривиальным; меньше
        0.12 с — игроки на смартфонах физически не успевают парировать срыв.
    - name: Оптимальный угол дрифта молоковоза
      value: 35.0 градусов
      tuning_note: Меньше 20° — нет ощущения скольжения тяжелой техники; больше 50°
        — тягач складывается в 'ножницы' с цистерной.
    - name: Скорость перекладки рулевого механизма
      value: 130 град/с
      tuning_note: Быстрее 220 град/с — тяжелый тягач управляется как карт; медленнее
        80 град/с — невозможно поймать ритм в S-образных связках.
    feedback_layers:
    - 'Визуал/VFX: Под колесами матовый снег сменяется зеркальным синим льдом с глубокими
      трещинами; из-под шипов вылетает густой веер ледяной стружки; передние колеса
      точно повернуты в сторону заноса.'
    - 'Звук (Web Audio): Плотный шорох снежного наката мгновенно сменяется пронзительным
      визгом шипов по гладкому льду (resonant filter 3.2 кГц) и ревом мотора в отсечке.'
    - 'Камера: Камера плавно смещается наружу поворота с демпфированием 0.25 с, ориентируя
      горизонт по вектору скольжения тягача.'
    - 'UI/Тактильность: Аналоговая дуга угла заноса (''Slip Angle Gauge'') с подсвеченной
      зеленой зоной баланса (28°–42°); серия мелких вибрационных щелчков при пересечении
      границы синего льда.'
    failure_mode: 'Запоздалое или чрезмерное контрруление: при опоздании тягач срывается
      в неконтролируемый спин-аут (разворот на 180°), при переруливании ловит резкий
      зацеп на снегу и выстреливает в скалу.'
    mastery_curve: Новичок на 30-й секунде оттормаживается перед синим льдом до 25
      км/ч или улетает в штопор. Эксперт на 10-м забеге намеренно целится колесами
      на полосы синего льда, проходя виражи на скорости 90 км/ч с ювелирным контррулением.
    counterplay: Чередование коротких островков синего льда с участками глубокого
      вязкого снега, сбивающего угол дрифта.
    synergies:
    - 'Связана с ''Гидродинамическим Маятником'': синий лед снимает сопротивление
      шин, позволяя перенаправить волну в угол заноса.'
    - 'Связана с ''Фактором Бездны'': идеальное контрруление на синем льду удерживает
      задние колеса в 20 см от обрыва.'
    - 'Связана с ''Инерционным Хлыстом'': продлевает скольжение после рывка ручника
      без падения оборотов мотора.'
    why_unique: Вместо искусственного скриптового дрифта моделируется честное дифференциальное
      сцепление осей на разных типах северного покрытия с учетом смещения нормальной
      нагрузки колес.
    pseudocode: "function updateIceSlipstream(dt, steerInput, isBlueIce, currentSpeed)\
      \ {\n  const currentFrictionCoeff = isBlueIce ? BLUE_ICE_MU : SNOW_MU;\n  const\
      \ rawSlipAngle = calculateSlipAngle(velocityVector, truckForwardVector);\n \
      \ const targetCounterSteer = -Math.sign(rawSlipAngle) * Math.min(Math.abs(rawSlipAngle),\
      \ MAX_STEER_ANGLE);\n  const steerError = Math.abs(steerInput - targetCounterSteer);\n\
      \  if (steerError < BALANCED_DRIFT_TOLERANCE && isBlueIce) {\n    driftStabilityScore\
      \ += dt * 1.5;\n    applyLateralGripForce(currentFrictionCoeff * 1.25 * TRUCK_MASS);\n\
      \  } else if (steerError > SPINOUT_THRESHOLD) {\n    spinAngularVelocity +=\
      \ Math.sign(rawSlipAngle) * SPIN_ACCEL * dt;\n    applyLateralGripForce(currentFrictionCoeff\
      \ * 0.35 * TRUCK_MASS);\n  }\n}"
  - name: Инерционный Хлыст Ручным Тормозом
    role_in_loop: Инструмент мгновенной инициации заноса и баллистического прохождения
      апекса
    player_decision: 'В какой момент перед апексом дернуть ручник: рано — молоко погасит
      скорость; поздно — инерция груза утащит тягач прямо в пропасть.'
    input_mapping: 'Клавиатура: Пробел (Space) / Клавиша S; Тачскрин: крупная кнопка
      ручника в правом нижнем углу / свайп вниз.'
    states:
    - 'state_ready: Ручник отпущен, колеса свободно передают крутящий момент'
    - 'state_clamping: Зажим задних колодок (время срабатывания 0.08 с, мгновенная
      блокировка задней спарки)'
    - 'state_whip_snap: Хлыстовой импульс (задняя тележка срывается по дуге, закручивая
      8-тонную цистерну)'
    - 'state_boost_release: Сброс ручника с подхватом газа (мгновенный выстрел тягача
      из шпильки)'
    parameters:
    - name: Окно идеального удержания ручника
      value: 0.28 с
      tuning_note: Больше 0.5 с — скорость падает более чем на 35 км/ч; меньше 0.12
        с — 14-тонный автопоезд не успевает сорвать задние колеса.
    - name: Множитель углового ускорения хлыста
      value: 2.4x
      tuning_note: Выше 3.5x — грузовик неестественно крутится волчком; ниже 1.5x
        — не хватает импульса для прохождения узких горных шпилек.
    - name: Задержка пневматического привода колодок
      value: 0.08 с
      tuning_note: Создает осязаемую механическую задержку тяжелой техники; при 0.0
        с управление кажется невесомым.
    - name: Импульс турбо-подхвата при идеальном сбросе
      value: 22.0 км/ч
      tuning_note: Меньше 15 км/ч — выход из шпильки вялый; больше 40 км/ч — тягач
        вылетает с дороги на выходе из поворота.
    feedback_layers:
    - 'Визуал/VFX: Мгновенная блокировка 4 задних колес; шипы выбивают сноп оранжевых
      искр об ледяную корку; из-под рамы вырываются клубы морозного пара пневмотормозов.'
    - 'Звук (Web Audio): Громкий металлический хлопок пневмоклапана ''ПШШ-КЛАЦ'';
      яростный скрежет заблокированного металла по льду; падение оборотов дизеля с
      последующим турбо-подхватом.'
    - 'Камера: Резкий рывок камеры назад с кратковременным увеличением угла обзора
      FOV с 75° до 86° на 0.3 с.'
    - 'UI/Тактильность: Вспышка красного значка стояночного тормоза; плотный одиночный
      тактильный удар Haptic Feedback (110 мс) в момент зажима колодок.'
    failure_mode: 'Передержка ручника дольше 0.55 с: тяжелый тягач теряет кинетическую
      энергию, волна молока бьет в переднюю стенку цистерны и полностью гасит скорость.'
    mastery_curve: 'Новичок жмет ручник посреди поворота и останавливается у обрыва.
      Эксперт использует ручник как микро-импульс на 0.25 с: легкий щелчок на входе
      посылает волну молока в контролируемый хлыст, разворачивающий тягач на 180°
      без потери скорости.'
    counterplay: Обледенелые кочки и гребни перед поворотом, подбрасывающие задний
      мост и сбивающие тайминг зажима колодок.
    synergies:
    - 'Связана с ''Гидродинамическим Маятником'': ручник выступает спусковым крючком
      для формирования резонансной волны.'
    - 'Связана с ''Фактором Бездны'': позволяет мгновенно выставить задний мост в
      20 см от обрыва.'
    - 'Связана с ''Ледяным Срывом'': гарантирует 100% срыв колес даже на участках
      плотного снега.'
    why_unique: Ручник работает не как кнопка аркадного поворота, а как механический
      спусковой крючок гидроудара, превращающий массу груза в катапульту для прохождения
      шпилек.
    pseudocode: "function updateHandbrakeSlingshot(dt, isHandbrakePressed, steerAngle,\
      \ velocity) {\n  if (isHandbrakePressed) {\n    handbrakeHoldTimer += dt;\n\
      \    rearAxleLocked = true;\n    const whipTorque = steerAngle * SLINGSHOT_MULTIPLIER\
      \ * (velocity.length() / 25.0);\n    angularVelocity.y += whipTorque * dt;\n\
      \    velocity.multiplyScalar(Math.max(0.2, 1.0 - HANDBRAKE_DRAG * dt));\n  }\
      \ else if (rearAxleLocked) {\n    rearAxleLocked = false;\n    if (handbrakeHoldTimer\
      \ >= IDEAL_WHIP_MIN && handbrakeHoldTimer <= IDEAL_WHIP_MAX) {\n      applySlingshotExitBoost(SLINGSHOT_TURBO_IMPULSE);\n\
      \      triggerFeedback('perfect_slingshot_boost', 1.0);\n    }\n    handbrakeHoldTimer\
      \ = 0.0;\n  }\n}"
  - name: Фактор Бездны и Турбо-Выход
    role_in_loop: Главный источник очков, драйвер риска и ресурс скоростного ускорения
    player_decision: Пройти вираж по безопасной внутренней траектории (1 звезда) или
      скользить в 20 см над пропастью ради множителя x4.0 и полного заряда нитро.
    input_mapping: 'Пассивно активируется позиционированием машины у кромки обрыва;
      активация турбо: Клавиша W / Shift / Тач-кнопка ''ТУРБО''.'
    states:
    - 'state_safe_zone: Безопасная зона (дистанция > 2.0 м, множитель x1.0, нитро
      не накапливается)'
    - 'state_edge_proximity: Зона риска (дистанция 0.5–1.5 м, множитель x1.5–x2.5,
      медленный прирост нитро)'
    - 'state_void_hover: Зависание над бездной (дистанция 0.1–0.4 м, множитель x4.0,
      шкала нитро кипит)'
    - 'state_catastrophic_fall: Падение в бездну (дистанция < 0.0 м, срыв тягача в
      ущелье, поражение)'
    parameters:
    - name: Дистанция зоны максимального риска
      value: 0.35 м
      tuning_note: Больше 0.8 м — пропадает страх падения в пропасть; меньше 0.15
        м — случайные неровности вызывают раздражающие вылеты с трассы.
    - name: Пиковый множитель очков дрифта
      value: x4.0
      tuning_note: Ниже x2.5 — игроки выбирают безопасную езду; выше x5.5 — обесцениваются
        все остальные элементы мастерства.
    - name: Темп накопления заряда Турбо-Буста у края
      value: 50% в секунду
      tuning_note: Дает ровно 1 полный заряд нитро за 2.0 с чистого скольжения по
        кромке обрыва.
    - name: Длительность импульса Турбо-Выхода
      value: 1.8 с
      tuning_note: Больше 3.0 с — тягач разгоняется до неуправляемой скорости перед
        следующим поворотом.
    feedback_layers:
    - 'Визуал/VFX: Внешние колеса цистерны физически висят над пропастью; вниз летят
      комья снега и ледяные глыбы; шкала множителя очков пульсирует неоновым синим
      огнем; радиальное размытие на периферии экрана.'
    - 'Звук (Web Audio): Нарастающий инфразвуковой гул бездны (sub-bass 45 Гц); звонкий
      свист ледяного ветра в ущелье; яростный свист перепускного клапана турбины.'
    - 'Камера: Смещение камеры в сторону бездны с нижнего ракурса, демонстрирующее
      пустоту под колесами цистерны.'
    - 'UI/Тактильность: Текст ''x4.0 CLIFF EDGE!'' вспыхивает над капотом; высокочастотная
      тревожная вибрация (12 Гц), предупреждающая о близости к обрыву.'
    failure_mode: 'Смещение траектории наружу всего на 15 см дальше предела: заднее
      колесо теряет опору, гравитация стягивает цистерну и тягач срывается в пропасть.'
    mastery_curve: Новичок жмется к безопасной скале, теряя 15 секунд и финишируя
      на 1 звезду. Эксперт балансирует задними колесами строго в 20 см от бездны,
      накапливая непрерывный запас закиси азота для рекордного спуска.
    counterplay: Осыпающиеся кромки льда на краю обрыва и порывы ураганного бокового
      ветра из ущелья (до 20 м/с).
    synergies:
    - 'Связана с ''Гидродинамическим Маятником'': наклонная цистерна смещает центр
      масс внутрь трассы, позволяя колесам безопасно висеть над обрывом.'
    - 'Связана с ''Ледяным Срывом'': скольжение по синему льду вдоль края дает непрерывную
      подпитку комбо.'
    - 'Связана с ''Инерционным Хлыстом'': ручник забрасывает задний свес цистерны
      прямо на кромку пропасти.'
    why_unique: Превращает смертельную опасность обрыва без невидимых стен в главный
      источник ресурса скорости и очков, поощряя осознанную игру на грани катастрофы.
    pseudocode: "function updateCliffEdgeMultiplier(dt, rearWheelPosition, cliffEdgePolylines,\
      \ isDrifting) {\n  const distanceToEdge = computeDistanceToPolyline(rearWheelPosition,\
      \ cliffEdgePolylines);\n  if (distanceToEdge < 0.0) {\n    triggerCatastrophicFallEvent();\n\
      \    return;\n  }\n  if (distanceToEdge <= MAX_EDGE_DISTANCE && isDrifting)\
      \ {\n    const proximityNorm = 1.0 - (distanceToEdge / MAX_EDGE_DISTANCE);\n\
      \    currentEdgeMultiplier = 1.0 + Math.pow(proximityNorm, 1.5) * 3.0;\n   \
      \ nitroCharge = Math.min(MAX_NITRO, nitroCharge + NITRO_GAIN_RATE * proximityNorm\
      \ * dt);\n    driftScore += BASE_DRIFT_SCORE_RATE * currentEdgeMultiplier *\
      \ dt;\n  } else {\n    currentEdgeMultiplier = 1.0;\n  }\n}"
  - name: Аварийный Сброс Давления и Волнорезы Цистерны
    role_in_loop: Инструмент экстренного спасения от переворота и цена ошибки пилотирования
    player_decision: 'При критическом крене (>30°): рискнуть переворотом или сбросить
      250 л молока ради мгновенного выравнивания тягача и спасения заезда.'
    input_mapping: 'Клавиатура: Клавиша E / F; Тачскрин: красная круглая кнопка с
      иконкой клапана в левом верхнем углу.'
    states:
    - 'state_sealed: Цистерна загерметизирована (полная масса 8000 л, максимальный
      напор волны)'
    - 'state_resonance_warning: Резонансная раскачка (крен нарастает к 30°, сигнал
      тревоги)'
    - 'state_emergency_purge: Аварийный сброс (клапан открыт на 0.5 с, выброс 250
      л, стабилизация крена на -14°)'
    - 'state_baffle_dissipation: Пассивное демпфирование переборками (поглощение кинетической
      энергии жидкости)'
    parameters:
    - name: Объем молока за один сброс
      value: 250 литров
      tuning_note: Больше 450 л — один сброс лишает игрока шанса на 3 звезды; меньше
        100 л — клапан становится бесплатной кнопкой без цены ошибки.
    - name: Стабилизирующий противоимпульс крена
      value: -14.0 градусов
      tuning_note: Меньше 8° — сброс не успевает предотвратить переворот; больше 20°
        — грузовик неестественно выпрямляется как игрушечный.
    - name: Кулдаун аварийного клапана
      value: 4.0 с
      tuning_note: Защищает от случайного двойного клика и спама кнопки спасения.
    - name: Эффективность переборок-гасителей (Baffles)
      value: 35% поглощения энергии
      tuning_note: Прокачивается в мета-прогрессии от 0% (базовая цистерна) до 60%
        (топовая цистерна 'Крио-Шторм').
    feedback_layers:
    - 'Визуал/VFX: Из боковых патрубков цистерны под давлением вырываются мощные струи
      молока, заливая снег белым шлейфом; капли молока бьют в камеру; шкала объема
      груза мгновенно падает на 250 л.'
    - 'Звук (Web Audio): Громкий пневматический свист стравливаемого пара и клокочущий
      выброс жидкости ''ПШШШ-ХЛОП''; тяжелый глухой звук оседания рессор.'
    - 'Камера: Резкий вертикальный толчок камеры с мгновенным возвратом горизонта
      в устойчивое положение.'
    - 'UI/Тактильность: Индикатор объема груза вспыхивает красным цветом (-250L);
      двойной резкий вибро-импульс Haptic Feedback (60 мс + 60 мс).'
    failure_mode: 'Панический сброс молока 3 раза подряд: объем груза падает ниже
      75%, что делает невозможным получение 3 звезд на финишной весовой рамке.'
    mastery_curve: Новичок сливает половину цистерны при первых же заносах, финишируя
      с пустой колбой. Эксперт проходит весь перевал без единого сброса, контролируя
      массу исключительно рулем и тягой.
    counterplay: Затяжные резонансные дуги с микро-трамплинами, раскачивающие цистерну
      до критических углов.
    synergies:
    - 'Связана с ''Гидродинамическим Маятником'': напрямую обнуляет накопленную энергию
      колебаний жидкости.'
    - 'Связана с условием победы: потеря груза напрямую снижает итоговый звездный
      рейтинг спуска.'
    - 'Связана с мета-прогрессией: апгрейд внутренних волнорезов снижает потребность
      в аварийном сбросе.'
    why_unique: 'Превращает груз в расходуемый ресурс выживания: игрок платит очками
      и объемом молока за спасение тягача от фатального падения в бездну.'
    pseudocode: "function updatePressurePurgeAndBaffles(dt, isPurgeTriggered, currentRollAngle)\
      \ {\n  purgeCooldownTimer = Math.max(0.0, purgeCooldownTimer - dt);\n  if (isPurgeTriggered\
      \ && purgeCooldownTimer <= 0.0 && milkVolumeRemaining > 0) {\n    milkVolumeRemaining\
      \ = Math.max(0.0, milkVolumeRemaining - PURGE_VOLUME_STEP);\n    currentBodyRoll\
      \ -= Math.sign(currentBodyRoll) * PURGE_STABILIZATION_ROLL_DEG * DEG_TO_RAD;\n\
      \    sloshVelocity *= 0.25;\n    purgeCooldownTimer = PURGE_COOLDOWN_SEC;\n\
      \    triggerFeedback('milk_purge_blast', milkVolumeRemaining);\n  }\n  sloshVelocity\
      \ -= sloshVelocity * (BASE_SLOSH_DAMPING + installedBaffleEfficiency) * dt;\n\
      }"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 80
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - desc: Управление жизненным циклом сессии, состояниями Playgama Bridge SDK, паузой,
      тайм-аттаком и сохранениями.
    name: Game Flow & State Layer
  - desc: Интеграция Rapier3D WASM, Raycast Vehicle для 6 колес, модель маятника гидроудара
      жидкого груза.
    name: Physics & Simulation Layer
  - desc: Сцена Three.js, PBR материалы льда и снега, кастомный шейдер хрома цистерны,
      система инстансинга деревьев и отбойников.
    name: Render & Scene Layer
  - desc: GPU-партиклы для снежных шлейфов, осколков синего льда, выхлопных газов
      и брызг молока при разгерметизации.
    name: VFX & Particles Layer
  - desc: DOM/Canvas гибридный оверлей интерфейса, сенсорные экранные зоны, поддержка
      клавиатуры и геймпада.
    name: UI & Input Layer
  modules:
  - desc: Расчет сил лучевой подвески, динамического трения шин на льду/снегу и смещения
      центра масс жидкости.
    name: TruckPhysicsController
  - desc: Численный интегратор движения массы молока с учетом поперечных ускорений
      и гасителей колебаний.
    name: LiquidSloshSimulator
  - desc: Быстрая выборка физических свойств поверхности (лед/снег/скала) по координатам
      колес.
    name: TrackSurfaceManager
  - desc: Сглаженная следящая камера с боковым выносом в дрифте, инерционным креном
      и эффектом скорости.
    name: ChaseCameraController
  - desc: Обертка над @playgama/bridge для рекламы, лидербордов, облачных сохранений
      и локализации.
    name: BridgeSDKService
monetization:
  strategy_summary: 'Мягкая, ненавязчивая гибридная монетизация: просмотр Rewarded
    видео за мгновенный респаун у чекпоинта при падении в обрыв, удвоение заработанных
    золотых бидонов на финише и открытие эксклюзивных скинов кабины; редкие межстраничные
    баннеры (Interstitial) строго между завершенными заездами с кулдауном не менее
    90 секунд.'
  rewarded_placements:
  - id: revive_checkpoint
    name: Мгновенный Респаун на Чекпоинте
    benefit: Возвращение молоковоза на трассу перед местом аварии с сохранением времени
      и 100% груза.
    cooldown_or_limit: 1 раз за заезд
    trigger_moment: Экран после срыва в пропасть или переворота цистерны.
  - id: double_reward
    name: Удвоение Награды за Спуск
    benefit: Умножение полученных золотых бидонов и очков опыта в 2 раза.
    cooldown_or_limit: Без ограничений
    trigger_moment: Экран победного финиша после взвешивания груза.
  - id: unlock_heavy_tanker
    name: Аренда Тяжелой Цистерны Полярный Титан
    benefit: Бесплатный заезд на продвинутом молоковозе со встроенными гасителями
      волны на 3 спуска.
    cooldown_or_limit: 1 раз в 30 минут
    trigger_moment: Меню выбора цистерны перед сложным перевалом.
  interstitial_placements:
  - trigger_event: Возврат в главное меню после завершения заезда
    cooldown_seconds: 90
    conditions: Только после успешного финиша или повторной попытки, никогда во время
      активного спуска.
  in_app_purchases:
  - sku: no_ads_vip_pass
    name: 'VIP Пропуск: Без Рекламы + Хромированный Скин'
    description: Полное отключение межстраничной рекламы навсегда + уникальный скин
      Северное Сияние.
    price_tier: Tier 2 (~$2.99 / 249 руб)
    reward: Отключение Interstitial + Скин кабины + 5000 Золотых Бидонов
  - sku: tank_pack_stabilizer
    name: Набор Спортивных Цистерн
    description: Мгновенная разблокировка 3 продвинутых цистерн с улучшенной гидродинамикой.
    price_tier: Tier 1 (~$1.49 / 129 руб)
    reward: 3 цистерны с 4-секционными перегородками
  fairness_rules:
  - 'Никаких пейволлов: все 12 трасс и базовые цистерны можно открыть за чистое мастерство
    и заработанные звезды.'
  - Реклама никогда не прерывает активный игровой процесс во время скоростного спуска.
  - При ошибке загрузки рекламы игрок все равно получает бонус респауна.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - gamedistribution
  - web
  initialization_flow:
  - Инициализация bridge.initialize() при старте HTML страницы
  - Параллельная загрузка сохраненного профиля игрока через bridge.storage.get()
  - Определение типа платформы и устройства (mobile/desktop) для авто-выбора раскладки
    управления
  - Скрытие нативного сплэш-скрина и переход в главное 3D-меню
  cloud_save_keys:
  - unlocked_tracks_mask
  - track_best_times_json
  - track_stars_json
  - milk_delivered_total
  - unlocked_tanks_array
  - selected_tank_id
  - gold_jugs_currency
  - sound_volume_settings
  leaderboards:
  - leaderboard_total_stars (Общий зачет по звездам всех перевалов)
  - leaderboard_ice_serpentine_speedrun (Лучшее время спуска на сложнейшей трассе
    Пик Левиафана)
  - leaderboard_total_milk_delivered (Суммарный объем доставленного молока в литрах)
  ads_integration:
    banner_handler: bridge.advertisement.showBanner() (опционально в меню)
    interstitial_handler: bridge.advertisement.showInterstitial()
    rewarded_handler: bridge.advertisement.showRewardedVideo()
  lifecycle_hooks:
  - bridge.game.on("pause", () => pauseGamePhysicsAndAudio())
  - bridge.game.on("resume", () => resumeGamePhysicsAndAudio())
  - window.addEventListener("visibilitychange", () => handleVisibilityChange())
