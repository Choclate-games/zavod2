    для корректного отображения на экранах с вырезами (Notch / Dynamic Island).
  performance_throttling:
  - Автоматическое масштабирование разрешения рендера (DPR от 1.0 до 1.5) при падении
    FPS ниже 55 кадров
  - Отключение динамических теней в реальном времени на слабых мобильных GPU (Mali-G52
    и аналоги)
  - Ограничение числа одновременных частиц снега и осколков льда до 350 на мобильных
    устройствах
