  tension_curve: 'Пилообразная кривая с экспоненциальным финалом. 0–10 с (Старт):
    Умеренное напряжение (35%) — разгон тяжеловоза по снежному полотну. 10–25 с (Первая
    связка шпилек): Резкий скачок до 80% — первый срыв на синем льду, молоко бьет
    в борт, колеса отрываются от дороги над обрывом; успешный выход дает кратковременный
    спад до 45% (фаза облегчения). 25–50 с (Каскад резонансных виражей): Непрерывная
    высокая нагрузка (75–90%) — связка левых и правых поворотов раскачивает цистерну
    в резонанс, требуя ювелирного контроля фазы волны. 50–70 с (Участок ''Чертов Карниз''):
    Пиковое напряжение (98%) — узкая ледяная полка без отбойников над километровой
    бездной, удержание заноса в 20 см от края ради множителя x4.0. 70–75 с (Финишный
    створ): Катарсис и взрыв эмоций (100% -> 10%) — пересечение лазерного створа весовой
    рамки, взвешивание сохраненного груза и триумфальный салют.'
  core_formulas:
  - 'Опрокидывающий момент цистерны: M_roll = (m_truck * h_cg_static + m_liquid *
    (h_cg_tank + r_slosh * sin(theta_slosh))) * (v^2 / R_turn + a_lateral) - F_suspension_stiffness
    * phi_body. При m_liquid = 8000 кг, r_slosh = 0.95 м и критическом крене phi_body
    >= 32.0° происходит отрыв колес внутреннего борта и переворот тягача.'
  - 'Динамический коэффициент сцепления шипованных шин: mu_effective = mu_base * surface_mod
    * (1.0 - clamp(slip_ratio / slip_crit, 0.0, 0.85)), где mu_base = 0.85; для снежного
    наката surface_mod = 0.65 (mu = 0.55), для зеркального синего льда surface_mod
    = 0.21 (mu = 0.18). Падение сцепления на синем льду снижает предельную боковую
    силу с 44 кН до 9.6 кН.'
  - 'Множитель очков ''Фактор Бездны'': Multiplier_edge = 1.0 + clamp((1.5 - d_edge)
    / 1.2, 0.0, 1.0) * 3.0 * (1.0 + abs(drift_angle) / 45.0), где d_edge — расстояние
    в метрах от внешнего колеса цистерны до обрыва (от 1.5 м до 0.3 м дает множитель
    от x1.0 до x4.0).'
  - 'Уравнение затухания гидродинамической волны в цистерне: d2(theta_slosh)/dt2 +
    2 * zeta * omega_n * d(theta_slosh)/dt + (g / L_pendulum) * sin(theta_slosh) =
    - (a_lateral / L_pendulum) * cos(theta_slosh), где коэффициент демпфирования zeta
    возрастает от 0.12 (базовая цистерна) до 0.58 (цистерна с 4-секционными перфорированными
    волнорезами).'
  - 'Итоговый счет заезда: Final_Score = (Base_Pass_Points * Stars_Multiplier + Drift_Points
    * Max_Edge_Multiplier) * (V_remaining / V_initial)^2.5 * max(0.0, 1.0 + (T_gold
    - T_actual) / T_gold), где V_initial = 8000 л, а сохранение объема V_remaining
    < 6000 л (75%) аннулирует победу.'
  run_progression:
  - 'Накопление нитро-буста за счет дрифта по кромке обрыва: каждые 0.5 с нахождения
    в зоне ''Фактора Бездны'' заполняют шкалу закиси азота на 25%, позволяя совершить
    до 4 реактивных ускорений за заезд.'
  - 'Динамический прогрев шипованной резины: трение в непрерывном дрифте разогревает
    шины от -20°C до рабочей температуры +40°C, увеличивая коэффициент бокового сцепления
    на синем льду с mu=0.18 до mu=0.26 к третьему сектору.'
  - 'Температурная стабилизация молока в цистерне: встречный морозный поток -25°C
    постепенно охлаждает стенки цистерны, повышая вязкость молока и снижая резкость
    гидроудара на 15% во второй половине спуска.'
  - 'Рост комбо-множителя скорости: непрерывная цепочка контрруления без полного выпрямления
    свыше 3.0 с активирует режим ''Ледяной Стрик'', повышающий максимальную скорость
    тягача со 105 км/ч до 125 км/ч.'
  meta_progression:
  - 'Разблокировка 4 типов цистерн: 1) Стандартная моно-колба (8000 л, высокая подвижность
    волны); 2) Двухсекционная с продольным волнорезом (-35% бокового гидроудара);
    3) Четырехсекционная с перфорированными перегородками ''Крио-Шторм'' (демпфирование
    60%); 4) Облегченная титановая ''Спринтер'' (-1200 кг массы, скорость +18 км/ч,
    но нулевое демпфирование для хардкорных рекордов).'
  - 'Инженерные улучшения шасси в гараже: вольфрамовые шипы ''Северный Коготь'' (+25%
    зацеп на синем льду), спортивный гидроусилитель (время перекладки колес снижается
    с 0.45 с до 0.18 с), усиленная пневмоподвеска с защитой от опрокидывания (+4°
    к критическому углу).'
  - 'Открытие 12 высокогорных перевалов 3 климатических зон: Ущелье Новичков (снежный
    накат с отбойниками), Синий Карниз (ледниковые зеркала и шпильки 180°), Чертов
    Хребет (отрицательные уклоны полотна, боковой ураганный ветер 20 м/с и отсутствие
    ограждений над километровой бездной).'
  - Коллекция 6 полярных ливрей кабины и хромированных выхлопных труб за выполнение
    экстремальных испытаний ('Пройти перевал без потери ни единой капли молока', 'Удержать
    занос в 15 см от бездны более 4 секунд').
  mechanics:
  - name: Гидродинамический Маятник и Гидроудар Цистерны
    role_in_loop: Источник риска и главный физический рычаг управления траекторией
    player_decision: Использовать ли инерционный удар волны молока для заброса тяжелой
      кормы тягача в поворот или заранее погасить раскачку контрсмещением ради безопасного
