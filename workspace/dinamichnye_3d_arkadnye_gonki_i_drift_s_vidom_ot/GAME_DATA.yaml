gameplay_systems:
- name: Система Динамического Центра Тяжести и Гидроудара
  purpose: Расчет смещения центра масс (CoM) молоковоза в реальном времени на основе
    угловых ускорений и поперечного крена.
  input: Угловая скорость шасси (yaw/roll rate), боковое ускорение (lateral G), статус
    перегородок цистерны.
  rules:
  - Масса жидкости (8000 кг) смещается по поперечной дуге с углом отклонения от -35
    до +35 градусов.
  - 'Смещение центра масс смещает вектор нормальной нагрузки на колеса: разгружает
    внутренние колеса и нагружает внешние.'
  - При превышении критического угла крена (>28 градусов) внутренние колеса отрываются
    от земли; при >38 градусах наступает опрокидывание.
  - Удар волны о край бака создает импульсный крутящий момент (гидроудар), требующий
    контрруления.
  state:
  - liquid_angle
  - liquid_angular_velocity
  - com_offset_x
  - com_offset_y
  - is_two_wheeling
  - cargo_intact_pct
  interactions: Взаимодействует с физическим телом Rapier3D и передает данные на UI-индикатор
    крена цистерны.
  feedback: Аудио гидроудара, покачивание кабины, индикатор уровня жидкости в HUD,
    тряска геймпада/экрана.
  edge_cases:
  - Резкая смена направления (перекладка заноса) удваивает амплитуду волны молока.
- name: Система Дорожных Покрытий и Сцепления
  purpose: Определение коэффициентов продольного и поперечного трения для каждого
    из 6 колес грузовика.
  input: Координаты колес, текстурная маска поверхности (снежный накат / синий зеркальный
    лед / скальная обочина).
  rules:
  - 'Снежный накат: базовый grip = 0.65, предсказуемый контролируемый снос.'
  - 'Зеркальный синий лед: базовый grip = 0.15, резкий срыв сцепления, ускоренное
    вращение вокруг CoM.'
  - 'Скальная обочина: grip = 0.85, резкое замедление и опасность зацепа с переворотом.'
  state:
  - wheel_surface_types[6]
  - wheel_slip_ratios[6]
  - surface_transition_timer
  interactions: Модифицирует параметры сил трения в лучевой подвеске RaycastVehicle.
  feedback: Смена звука качения (глухой снег -> звонкий ледяной скрежет), тип частиц
    из-под колес (белая пыль -> бирюзовые кристаллы).
  edge_cases:
  - Одно колесо на льду, другое на снегу вызывает мгновенный разворачивающий момент.
- name: Система Спринтерского Спуска и Взвешивания Груза
  purpose: Контроль игрового времени, прохождения чекпоинтов, учета сохранности молока
    и финишного ранжирования.
  input: Триггеры контрольных точек 1-3, датчик давления в цистерне, финишная весовая
    рамка.
  rules:
  - Таймер спуска стартует при пересечении стартовой линии.
  - Каждый сильный крен >30 градусов или удар о скалу выплескивает от 1% до 5% молока
    через клапаны сброса давления.
  - На финише вес оставшегося молока переводится в бонусные очки (1 литр = 10 очков).
  - 'Рейтинг: 3 звезды — время < 75 сек и груз > 90%; 2 звезды — время < 90 сек и
    груз > 75%; 1 звезда — финиш без переворота.'
