roadmap:
- phase_number: 1
  title: Физическое Ядро и Прототип Управления (Core Physics & Slosh)
  duration_days: 3
  tasks:
  - Настройка сцены Three.js и интеграция физического движка Rapier3D WASM
  - Реализация Raycast Vehicle для 3-осного грузовика с настраиваемой подвеской
  - Разработка математической модели гидродинамического маятника (Liquid Slosh) и
    смещения CoM
  - Базовая система управления (Клавиатура + Сенсорные полузоны) и следящая камера
    chase cam
  milestone_deliverable: 'Играбельный физический прототип: молоковоз входит в занос
    на ледяной площадке, цистерна накреняется, ощущается вес груза.'
- phase_number: 2
  title: Генерация Серпантина, Покрытия и Геймплейный Цикл (Track & Loop)
  duration_days: 3
  tasks:
  - Создание модульной геометрии горного серпантина с зонами снега, синего льда и
    открытого обрыва
  - Шейдеры зеркального синего льда, хромированной цистерны и снежного полотна
  - Система детекции дрифта, комбо-множителей за близость к обрыву и таймер чекпоинтов
  - Логика взвешивания молока на финише и условий победы/поражения
  milestone_deliverable: Полноценный заезд на первом перевале с чекпоинтами, таймером,
    финишным взвешиванием и подсчетом очков.
- phase_number: 3
  title: VFX, Аудио, UI и Интеграция SDK (Polish & Bridge)
  duration_days: 2
  tasks:
  - GPU-партиклы ледяных кристаллов, снежной пыли и брызг молока
  - Интеграция Howler.js звукового движка (мотор, лед, плеск, свист тормозов)
  - Верстка спортивного нео-сканди HUD и экранов меню/результатов
  - Подключение @playgama/bridge SDK (Rewarded реклама, лидерборды, облачные сейвы)
  milestone_deliverable: Завершенная игра с 12 трассами, полной монетизацией, звуковым
    оформлением и готовностью к публикации на платформах.
risks:
- risk: Слишком резкий гидроудар жидкости может приводить к случайным нечестным переворотам
    молоковоза на ровной дороге.
  category: gameplay
  severity: High
  mitigation: Введение нелинейного демпфирования колебаний волны при околонулевых
    боковых ускорениях и ограничение максимальной скорости смещения центра масс.
- risk: Просадки FPS на слабых смартфонах из-за большого количества частиц снега и
    полупрозрачных поверхностей льда.
  category: technical
  severity: Medium
  mitigation: Использование единого инстансированного буфера частиц (InstancedMesh)
    и отключение расчета отражений в реальном времени на мобильных профилях.
- risk: Высокий порог входа для казуальных игроков из-за сложного физического контрруления
    тяжелой техникой.
  category: design
  severity: Medium
  mitigation: 'Плавная кривая обучения: первые 3 трассы имеют широкие отбойники и
    прощают ошибки, а встроенный ассистент стабилизации руля мягко помогает новичкам.'
- risk: Блокировка воспроизведения звука в браузерах до первого взаимодействия пользователя.
  category: platform
  severity: Low
  mitigation: Инициализация AudioContext строго по первому тапу в главном меню (кнопка
    Старт / В Заезд).
skills:
- skill_id: liquid_slosh_physics_solver
  name: Интегратор Гидродинамического Смещения Массы Груза
  filename: skills/liquid_slosh_physics.md
  purpose: Численный расчет динамики плещущейся жидкости в цистерне и передача сил
    на твердое тело грузовика в Rapier3D.
  when_to_use: Использовать в каждом физическом тике при расчете центра масс и крутящих
    моментов подвески молоковоза.
  rules:
  - Частота физического тика строго фиксирована (60 Гц)
  - Угол отклонения маятника ограничен диапазоном [-35°, +35°]
  - При перевороте тягача расчет маятника плавно отключается во избежание физического
    взрыва
  architecture: Демпфированный маятниковый осциллятор 2-го порядка, связанный с RigidBody
    молоковоза через динамический смещаемый Center of Mass.
  implementation_guidance: Использовать метод Верле для стабильной интеграции при
    переменных временных шагах браузера.
  common_mistakes:
  - Расчет смещения жидкости в мировых координатах вместо локальной системы координат
    цистерны
  - Отсутствие ограничения максимального опрокидывающего момента
  checklist:
  - Проверена стабильность при резких разворотах на 180°
  - Центр масс возвращается в нейтраль при остановке
  - Корректно рассчитывается отрыв внутренних колес
  knowledge_refs:
