_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: dinamichnye_3d_arkadnye_gonki_i_drift_s_vidom_ot
performance:
  target_fps: 60
  max_draw_calls: 80
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: Спринтерский спуск точка-в-точку на 60–80 секунд с 3 чекпоинтами и финальной
    взвешивающей рамкой на финише.
  win: Успешное пересечение финишной весовой рамки с сохранением не менее 75% объема
    молока в цистерне за время быстрее квалификационного норматива трассы (менее 75
    секунд для 3 звезд).
  lose: Падение молоковоза в пропасть за пределы трассы ИЛИ полный переворот тягача
    на крышу/бок с потерей более 50% объема молока из-за разгерметизации люков цистерны.
  difficulty_curve: 'Трассы 1–3 (Ущелье Новичков): широкий снежный накат, плавные
    дуги, отбойники по краям; Трассы 4–7 (Синий Карниз): участки чистого гладкого
    льда в апексах, связки шпилек, раскачивающие молоко; Трассы 8–12 (Чертов Хребет):
    слепые трамплины, отсутствие ограждений, шпильки с обратным уклоном полотна над
    бездной.'
mechanics:
  gidrodinamicheskiy_mayatnik_i_gidroudar_tsisterny:
    name: Гидродинамический Маятник и Гидроудар Цистерны
    parameters:
      massa_perevozimogo_moloka:
        value: 8000 кг
        note: При массе выше 9000 кг тягач становится неуправляемым и мгновенно опрокидывается;
          при снижении ниже 6000 кг пропадает ощущение тяжести жидкого маятника.
      fazovoe_zapazdyvanie_volny_moloka:
        value: 0.35 с
        note: Меньше 0.15 с — жидкость ощущается приклеенным твердым грузом; больше
          0.6 с — игрок теряет причинно-следственную связь между рулением и ударом
          волны.
      kriticheskiy_ugol_oprokidyvaniya_shassi:
        value: 32.0 градуса
        note: Ниже 25° — грузовик переворачивается слишком внезапно; выше 38° — игрок
          перестает бояться переворота и ездит на двух колесах.
      intensivnost_vypleska_moloka_pri_razgermetizatsii:
        value: 350 л/с
        note: Меньше 150 л/с — потеря молока не создает угрозы поражения; больше 600
          л/с — малейший крен моментально аннулирует победу.
  ledyanoy_sryv_pokrytiya_i_kontrrulenie:
    name: Ледяной Срыв Покрытия и Контрруление
    parameters:
      koeffitsient_stsepleniya_sinego_lda:
        value: 0.18 mu
        note: Ниже 0.10 — колеса превращаются в лыжи, теряя управление; выше 0.28
          — пропадает контраст и физическое ощущение ледяного срыва.
      okno_reaktsii_na_parirovanie_zanosa:
        value: 0.22 с
        note: Больше 0.4 с — занос становится казуальным и тривиальным; меньше 0.12
          с — игроки на смартфонах физически не успевают парировать срыв.
      optimalnyy_ugol_drifta_molokovoza:
        value: 35.0 градусов
        note: Меньше 20° — нет ощущения скольжения тяжелой техники; больше 50° — тягач
          складывается в 'ножницы' с цистерной.
      skorost_perekladki_rulevogo_mehanizma:
        value: 130 град/с
        note: Быстрее 220 град/с — тяжелый тягач управляется как карт; медленнее 80
          град/с — невозможно поймать ритм в S-образных связках.
  inertsionnyy_hlyst_ruchnym_tormozom:
    name: Инерционный Хлыст Ручным Тормозом
    parameters:
      okno_idealnogo_uderzhaniya_ruchnika:
        value: 0.28 с
        note: Больше 0.5 с — скорость падает более чем на 35 км/ч; меньше 0.12 с —
          14-тонный автопоезд не успевает сорвать задние колеса.
      mnozhitel_uglovogo_uskoreniya_hlysta:
        value: 2.4x
        note: Выше 3.5x — грузовик неестественно крутится волчком; ниже 1.5x — не
          хватает импульса для прохождения узких горных шпилек.
      zaderzhka_pnevmaticheskogo_privoda_kolodok:
        value: 0.08 с
        note: Создает осязаемую механическую задержку тяжелой техники; при 0.0 с управление
          кажется невесомым.
      impuls_turbo_podhvata_pri_idealnom_sbrose:
        value: 22.0 км/ч
        note: Меньше 15 км/ч — выход из шпильки вялый; больше 40 км/ч — тягач вылетает
          с дороги на выходе из поворота.
  faktor_bezdny_i_turbo_vyhod:
    name: Фактор Бездны и Турбо-Выход
    parameters:
      distantsiya_zony_maksimalnogo_riska:
        value: 0.35 м
        note: Больше 0.8 м — пропадает страх падения в пропасть; меньше 0.15 м — случайные
          неровности вызывают раздражающие вылеты с трассы.
      pikovyy_mnozhitel_ochkov_drifta:
        value: x4.0
        note: Ниже x2.5 — игроки выбирают безопасную езду; выше x5.5 — обесцениваются
          все остальные элементы мастерства.
      temp_nakopleniya_zaryada_turbo_busta_u_kraya:
        value: 50% в секунду
        note: Дает ровно 1 полный заряд нитро за 2.0 с чистого скольжения по кромке
          обрыва.
      dlitelnost_impulsa_turbo_vyhoda:
        value: 1.8 с
        note: Больше 3.0 с — тягач разгоняется до неуправляемой скорости перед следующим
          поворотом.
  avariynyy_sbros_davleniya_i_volnorezy_tsisterny:
    name: Аварийный Сброс Давления и Волнорезы Цистерны
    parameters:
      obem_moloka_za_odin_sbros:
        value: 250 литров
        note: Больше 450 л — один сброс лишает игрока шанса на 3 звезды; меньше 100
          л — клапан становится бесплатной кнопкой без цены ошибки.
      stabiliziruyuschiy_protivoimpuls_krena:
        value: -14.0 градусов
        note: Меньше 8° — сброс не успевает предотвратить переворот; больше 20° —
          грузовик неестественно выпрямляется как игрушечный.
      kuldaun_avariynogo_klapana:
        value: 4.0 с
        note: Защищает от случайного двойного клика и спама кнопки спасения.
      effektivnost_pereborok_gasiteley_baffles:
        value: 35% поглощения энергии
        note: Прокачивается в мета-прогрессии от 0% (базовая цистерна) до 60% (топовая
          цистерна 'Крио-Шторм').
