  rejection_reason: Отклонены документы сурвайвор-автошутеров и выбора карточек апгрейдов,
    так как игра строится на ручных физических швырках и слиянии без статичной прокачки;
    2.5D файтинги и покадровая анимация не подходят 3D физическому браулеру с видом
    сверху; тяжелые ECS (bitECS) и ИИ/навмеш библиотеки (recast, Yuka) избыточны для
    простой арены с физическим сближением; внешние модели и гуманоидные скелеты противоречат
    процедурным упругим телам мутантов; плавучесть не требуется, так как магма является
    зоной мгновенного уничтожения (Ring-Out).
  loop_pattern: patterns/arena_combat_loop.md
  summary: Проект опирается на физическую арену Rapier3D с процедурными упругими телами
    мутантов, механику кинетического синтеза и цепных ударных волн, процедурный Web
    Audio звук, адаптивное качество для мобильных браузеров и паттерн гладиаторского
    турнира с волнами.
