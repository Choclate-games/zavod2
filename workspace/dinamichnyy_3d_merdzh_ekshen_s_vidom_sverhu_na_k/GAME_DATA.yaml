  selected_id: D1
  selected_name: 'Био-Колизей: Ударный Синтез'
  selection_reason: 'Вариант D1 идеально раскрывает первоначальный замысел гладиаторского
    мердж-экшена: управление через прямое перетаскивание и швырки интуитивно понятно
    с первой секунды на телефоне и ПК без виртуальных джойстиков. В отличие от D2
    и D3, механика кинетического мерджа с ударными волнами превращает сам процесс
    объединения в главное боевое действие, сохраняя непрерывный темп потасовки, эффектное
    выбивание врагов за борта и ощущение растущей мощи титана.'
  rejected_reasons:
  - 'D2 («Биореактор: Фабрика Симбиотов») отвергнут, так как строгий вид сверху 90°
    и механика скармливания в центр нивелируют зрелищность физических 3D-моделей комьев,
    смещают акцент с яростной гладиаторской потасовки на статичную оборону точки и
    быстро скатываются в монотонную рутину.'
  - 'D3 («Гладиаторы Бездны: Бильярд Мутаций») отвергнут, так как слингшот-прицеливание
    и расчет сложных карамболей создают избыточный фрустрирующий барьер на мобильных
    тачскринах в условиях непрерывной атаки орды врагов в реальном времени.'
  what_it_is_not:
  - Окно с выбором из 3 случайных карточек апгрейдов после каждого уровня или заполнения
    шкалы опыта
  - Виртуальный экранный джойстик слева и кнопки атак справа как схема управления
  - Пошаговая или пассивная головоломка на статической сетке в духе классического
    2048 или Merge Mansion
  - Серые нестилизованные геометрические примитивы вместо выразительных упругих зубастых
    комьев-мутантов
  - Оторванная от темы мета-прогрессия «золото за забег -> +5% к здоровью в статичном
    меню»
  - Пассивный автобатлер, где игрок безучастно наблюдает за дракой без физического
    взаимодействия руками
  - окно выбора из трёх карт апгрейда
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - Мгновенное физическое слияние одинаковых комьев при контакте прямо в реалтайм-бою
    без пауз, сеток и задержек управления
  - Кинетическая ударная волна при каждом слиянии, физически расталкивающая и оглушающая
    окружающих врагов
  - Круглая открытая арена с физическим выбиванием врагов за борт в лаву/пропасть
    как ключевой механикой зачистки ринга
  - Прямой контроль указателем (палец / мышь) для перетаскивания и швыряния комьев
    без экранных джойстиков
  - 'Выразительная визуальная эволюция титана: каждый уровень слияния кардинально
    увеличивает массу, агрессивность зубастой пасти и силу отдачи'
  signature_scene: 'Вид сверху под углом 60 градусов на круглую каменную арену, парящую
    над бурлящей оранжевой магмой. Снизу и сбоку арену заливает теплый контрастный
    свет лавы, выхватывая влажную текстуру и упругие челюсти комьев. В самом центре
    огромный изумрудный титан 4-го уровня с тремя рядами оскаленных зубов только что
    слился из двух комьев: от него во все стороны расходится неоновое кольцо ударной
    волны. Пять мелких врагов-мутантов в рапиде разлетаются в воздух через край арены
    в бездну, а палец игрока уже тянет следующий мерцающий комок навстречу титану.'
  avoid_references:
  - Merge Mansion / 2048 (статичные сетки слияния без физики и боя)
  - Vampire Survivors / Survivor.io (пассивный авто-каст и окна выбора из трех карт)
  - Agar.io / Slither.io (пассивное поедание неподвижных точек на бесконечной плоскости)
  - Gladihoppers (2D сайд-скроллерная физика дуэлей)
