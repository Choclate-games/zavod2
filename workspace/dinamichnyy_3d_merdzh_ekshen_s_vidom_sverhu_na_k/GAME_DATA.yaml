  what_to_avoid: Сложные комбо-инпуты и виртуальные кнопки геймпада.
- name: 2048 / Suika Game
  genre: Merge / Физическое слияние
  mechanics:
  - Мгновенное слияние одинаковых уровней при касании
  - Экспоненциальный рост размеров
  lessons: Слияние одинаковых объектов вызывает непреодолимое желание создать максимальный
    уровень.
  what_to_avoid: Статическая сетка, пошаговость и отсутствие внешней боевой угрозы.
- name: Knock'em All / Bumper.io
  genre: Гиперказуальный бампер-экшен
  mechanics:
  - Управление одним пальцем
  - Ринг-ауты в воду/лаву
  lessons: Прямой жестовый контроль швырком идеально ложится на мобильные тачскрины
    и мышь.
  what_to_avoid: Примитивные серые кубы и отсутствие глубины прогрессии внутри сессии.
mechanics:
- name: kinetic_strike_merge
  category: Главный двигатель прогрессии и ключевой источник взрывной силы зачистки
    ринга (награда за риск и точный расчет).
  priority: core
  description: В отличие от 2048/Suika, слияние здесь — это не статическое перемещение
    фишек по сетке, а взрывной физический граунд-паунд реального времени, использующий
    саму массу новорожденного существа для зачистки арены от наступающей орды.
  player_interaction: 'Мышь: Зажатие ЛКМ на каме, оттягивание курсора и отпускание
    для прицельного запуска во второй ком того же тира. Тач: Касание пальцем кома,
    свайп-натяжение и отрыв пальца.'
  feedback: 'Визуал / VFX: Ослепительная сферическая ударная волна с эффектом преломления
    пространства (heat distortion), разлет светящихся био-капель цвета тира, расширяющееся
    кольцо декалей на базальтовом полу, упругая деформация сжатия-расширения меша
    титана (Squash & Stretch).; Звук / Web Audio API: Низкочастотный саб-басовый удар
    (sine wave 45 Гц с экспоненциальным спадом за 0.35 с), сопровождаемый смачным
    влажным щелчком разрыва биомассы и нарастающим звоном энергии (bandpass filter
    sweep 300 Гц -> 2.4 кГц).; Камера: Радиальный импульс дрожания (Camera Shake:
    амплитуда 0.45 ед, затухание 0.25 с), мгновенный микро-зум к эпицентру взрыва
    на 4% с плавным возвратом FOV (lerp 0.3 с).; UI / Тактильность: Короткая вибрация
    мобильного устройства (Haptic Feedback: Heavy Impact 40 мс), всплывающее число
    суммарного кинетического урона золотистым шрифтом и пульсация иконки тира в верхней
    плашке.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: slingshot_fling
  category: Основной кинетический инструмент позиционирования, атаки и доставки комьев
    к цели (источник тактического риска и точности).
  priority: secondary
  description: Вместо кнопочного перемещения стиком или классического наведения курсором,
    здесь реализована упругая физическая рогатка с кинематической деформацией 3D-тела
    кома и инерционным пробиванием рядов противника.
  player_interaction: 'Мышь: Зажатие ЛКМ на каме, перемещение курсора для формирования
    вектора натяжения, отпускание ЛКМ для запуска. Тач: Касание кома, оттягивание
    пальца с отображением траекторной стрелки, отрыв пальца.'
  feedback: 'Визуал / VFX: Растягивающаяся светящаяся био-нить натяжения между центром
    кома и курсором, динамическая пунктирная дуга траектории с точкой коллизии, инверсионный
    след плотного пара и искр позади летящего кома.; Звук / Web Audio API: Нарастающий
    тон натяжения сухожилия (frequency mod synth 120 -> 480 Гц при оттяжке), резкий
    хлыстообразный свист рассекаемого воздуха при релизе (white noise bandpass 1.8
    кГц) и смачные звуки ударов кеглей при сбивании врагов.; Камера: Плавное микро-отдаление
    камеры (Zoom Out на 3%) во время натяжения для улучшения обзора ринга, импульсный
    толчок камеры по вектору броска в момент запуска.; UI / Тактильность: Нарастающая
    легкая вибрация смартфона по мере увеличения натяжения рогатки (Haptic tick),
    резкий четкий щелчок (Medium Impact 25 мс) при релизе.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: jaws_kinetic_chomping
  category: Тактический тормоз давления орды и направленный инструмент мгновенного
    силового выталкивания (спасение из окружения).
  priority: secondary
  description: В отличие от авто-атак в классических автобатлерах, челюстной захлоп
    требует строгого позиционирования вектора пасти и тайминга реакции, выступая активным
    физическим парированием лобового тарана.
  player_interaction: 'Мышь: Быстрый одиночный клик ЛКМ по кому (без перетаскивания)
    или нажатие клавиши Пробел для ближайшего титана. Тач: Быстрый тап по кому без
    свайпа.'
  feedback: 'Визуал / VFX: Мгновенная 3D-анимация раскрытия массивной зубастой пасти
    с разлетающимися каплями слюны и светящимися следами клыков, конусный фронт сжатого
    воздуха с искрами, вспышка оглушения над головами задетых врагов.; Звук / Web
    Audio API: Оглушительный хрустящий щелчок массивных костяных челюстей (атака 5
    мс, спад 80 мс, high-pass filter 800 Гц) с металлическим лязгом смыкания зубов
    и свистящим выдохом воздуха.; Камера: Мгновенный резкий микро-толчок камеры вперед
    вдоль направления укуса (Directional Impulse 0.15 м) с быстрым демпфированием.;
    UI / Тактильность: Острый двойной тактильный щелчок смартфона (Double Light Click
    15 мс + 15 мс) и круговой радиальный сектор перезарядки вокруг основания кома.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: magma_ring_fracture
  category: Эскалатор напряжения, таймер сжатия безопасного пространства и генератор
    критического риска ринг-аута (динамическая среда).
  priority: secondary
  description: Вместо банального ядовитого круга из Battle Royale, здесь арена состоит
    из дискретных физических 3D-платформ, чье разрушение меняет геометрию рикошетов
    и открывает новые бездны для Ring-Out механики.
  player_interaction: Пассивно-динамическая механика среды, управляемая игровым таймером
    и реакцией игрока через перемещение комьев швырками (Slingshot Fling).
  feedback: 'Визуал / VFX: Ярко-оранжевое раскаленное свечение линий разлома между
    базальтовыми плитами, частицы дыма и лавовых искр, физическое опрокидывание 3D-мешей
    плит вниз в кипящую лаву с объемными всплесками магмы и тепловым маревом.; Звук
    / Web Audio API: Глухой раскатистый подземный гул (low-shelf filter 60 Гц с нарастанием
    громкости), треск ломающегося камня (granulate noise burst) и громкое шипение
    лавы (white noise low-pass 1.2 кГц) при погружении плит.; Камера: Непрерывная
    низкочастотная вибрация камеры во время 3-секундной фазы предупреждения, резкий
    вертикальный толчок вниз в момент обрушения плит.; UI / Тактильность: Предупреждающая
    пульсирующая вибрация смартфона (Periodic Rumble), мигающий красный контур опасных
    секторов на мини-карте и стрелки эвакуации.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
gameplay_systems:
- name: Система Кинетического Слияния и Ударных Волн (Merge & Shockwave Engine)
  purpose: Детекция коллизий одинаковых комьев, их удаление, инстанцирование эволюционировавшей
    формы и генерация радиального импульса в физическом мире.
  input: Контакты физических коллайдеров комьев одинакового ранга в Rapier3D.
  rules:
  - Слияние происходит мгновенно при пересечении триггеров одинакового тира
  - Импульс волны затухает обратно пропорционально квадрату расстояния
  - Враги получают оглушение и вектор отталкивания от эпицентра слияния
  state:
  - active_blobs_count
  - current_max_tier
  - shockwave_queue
  interactions: Взаимодействует с PhysicsWorld, VFXManager, AudioManager и ScoreCounter.
  feedback: Hit-stop на 40 мс, радиальный меш ударной волны, шейк камеры, звуковой
    щелчок слияния.
  edge_cases:
  - Одновременное тройное касание (обрабатывается последовательно за два кадра)
  - Слияние в момент падения с края (приоритет отдается удержанию на платформе)
- name: Система Динамического Спавна и Натиска Врагов (Enemy Horde Director)
  purpose: Обеспечение постоянного нарастающего давления врагов по периметру круглой
    арены с балансировкой типов противников.
  input: Таймер волны, текущий тир сильнейшего титана игрока, свободные секторы арены.
  rules:
  - Спавн происходит за пределами видимости камеры над лавой с прыжком на край арены
  - При наличии титана 4 уровня спавнятся тяжелые таранные мутанты
  - Скорость спавна растет каждые 10 секунд
  state:
  - wave_index
  - alive_enemies_count
  - spawn_timer
  - wave_progress_percent
  interactions: Передает координаты целей врагам (ближайший ком игрока), реагирует
    на сужение арены.
  feedback: Красные предупреждающие метки на плитах арены в точках приземления мутантов.
  edge_cases:
  - Превышение лимита врагов (hard cap = 35 тел, при превышении слабые враги ускоряются
    и нападают агрессивнее)
- name: Система Разрушения и Сужения Арены (Arena Ring Shrinking System)
  purpose: Поэтапное разрушение внешнего кольца плит колизея, повышающее плотность
    контакта и риск ринг-аута.
  input: Тайм-триггеры волны (20 с, 40 с).
  rules:
  - Внешние базальтовые сегменты начинают пульсировать раскаленной лавой за 3 секунды
    до падения
  - При падении сегмента коллайдер удаляется из физического мира
  - Упавшие в лаву объекты уничтожаются
  state:
  - current_arena_radius
  - active_segments_bitmask
  - crumble_warning_active
  interactions: Физика Rapier3D (обновление статичных коллайдеров ринга), шейдер раскаленной
    лавы.
  feedback: Дым, искры из трещин, басовый гул обрушения, падение каменных блоков в
    магму со столбами огня.
  edge_cases:
  - Ком игрока стоит на падающей плите (дается 1 секунда для швырка в безопасную зону;
    если упал — активация спасения)
- name: Система Жестового Управления и Физической Катапульты (Pointer Gesture Physics
    Controller)
  purpose: Преобразование координат экрана (touch/mouse) в 3D raycast лучи на плоскость
    арены и расчет вектора броска.
  input: PointerDown, PointerMove, PointerUp / Touch events.
  rules:
  - Клик по кому инициирует режим Drag/Fling
  - Одиночный тап по пустой земле вызывает челюстной удар титана
  - Траектория броска визуализируется гибкой линией из слизи
  state:
  - selected_blob_id
  - drag_start_pos
  - current_drag_vector
  - is_dragging
  interactions: Three.js Raycaster, Rapier3D RigidBody impulses.
  feedback: Эластичное вытягивание 3D меша кома в сторону пальца, звуковой эффект
    натяжения резины.
  edge_cases:
  - Потеря указателя за пределами экрана (автоматический мягкий релиз кома на месте)
core_design:
  signature_moment: 'Момент, когда два кома 3-го уровня с разгона врезаются друг в
    друга прямо в центре кишащего кольца монстров: на 0.08 секунды время замирает
    (hit-stop), камера резко приближается к точке вспышки, затем с оглушительным басовым
    хлопком рождается 100-килограммовый Зубастый Колосс, испуская ослепительную багровую
    ударную волну, которая единым физическим импульсом сносит всех 12 окруживших врагов
    в кипящую лаву за край арены!'
  genre_template_rejected: 'Сознательно отвергаем пошаговую пассивную сетку головоломок
    2048/Suika и модальные экраны выбора карточек апгрейдов из Vampire Survivors.
    В классических мердж-играх нет физической угрозы телом и пространственного риска:
    игрок думает сколько угодно, а объекты просто лежат в стакане. В нашей игре слияние
    — это не абстрактная математика очков, а рискованный кинетический таран в реальном
    времени: комки обладают инерцией и массой, арена физически сужается и ломается,
    а единственный способ выжить — использовать взрывную волну слияния как мощнейшее
    оружие зачистки ринга против напирающей орды.'
  what_makes_it_different: В отличие от аркадных бамперов (Bumper.io) и мердж-игр,
    здесь слияние одновременно уменьшает число ваших боевых юнитов на ринге, но экспоненциально
    увеличивает их массу, инерцию и радиус ударной волны. Игрок постоянно балансирует
    между удержанием 4 юрких комков Т1 для перекрытия секторов арены и рискованным
    объединением их в одного Т4/Т5 гиганта, который снесет босса, но оставит фланги
    открытыми для быстрых прыгунов.
  micro_loop:
  - step: micro_1_scan_and_threat_assessment
    player_action: Игрок визуально оценивает дистанцию до приближающейся группы мутантов
      и позицию двух близнецов биомассы на ринге.
    game_response: Рендерит трехмерную арену с физическими телами врагов, подсвечивает
      совместимые комья одинакового тира мягким био-свечением.
    decision: Бросить ком во врага для одиночного сбивания или запустить его во второй
      ком ради слияния и радиального взрыва.
    duration: 0.3 с
  - step: micro_2_slingshot_charge
    player_action: Зажимает ком указателем мыши или пальцем и оттягивает вектор рогатки
      в противоположную сторону от цели.
    game_response: Прогибает физическое тело кома как упругую резину, отрисовывает
      динамическую дугу полета с прогнозом точки соударения.
    decision: 'Сила натяжения (от 0.5 до 4.0 м) и угол швырка: риск промахнуться и
      улететь в лаву против силы удара.'
    duration: 0.4 с
  - step: micro_3_kinetic_collision_and_merge
    player_action: Отпускает указатель, отправляя ком в полет на скорости до 22 м/с
      в точку встречи со вторым комом.
    game_response: В момент коллизии Rapier3D активирует hit-stop на 0.08 с, запускает
      частицы разрыва биомассы и спавнит существо тира Т+1.
    decision: Скорректировать следующий бросок до завершения фазы расширения родившегося
      титана.
    duration: 0.5 с
  - step: micro_4_shockwave_ringout_blast
    player_action: Наблюдает за радиальным взрывом и направляет отскочившего титана
      на добивание уцелевших монстров.
    game_response: Ударная волна радиусом до 7.3 м передает радиальный импульс до
      1200 Н·с, выбивая врагов за борт арены с всплесками лавы.
    decision: Применить мгновенный челюстной импульс для добивания прорвавшегося с
      тыла мутанта или готовить следующий мердж.
    duration: 0.6 с
  meso_loop:
  - step: meso_1_early_mass_accumulation
    player_action: Игрок активно швыряет стартовые комья Т1, сбивая набегающих мелких
      личинок и объединяя комья в форму Т2 (Зубастик) и Т3 (Мясоед).
    game_response: Спавнит легких врагов из периметра арены (1 враг в 1.8 с), удерживает
      полный диаметр арены 24.0 м.
    decision: Сохранять рассредоточенную оборону 4 комьев или форсировать сборку тяжелого
      Т3 титана.
    duration: 20.0 с
  - step: meso_2_perimeter_fracture_and_escalation
    player_action: Маневрирует комьями в сужающемся пространстве, перенаправляя броски
      подальше от трескающихся внешних базальтовых плит.
    game_response: Активирует предупреждающее свечение магмы (3.0 с) и сбрасывает
      4 внешних сектора арены, сужая ринг до 18.0 м; выпускает быстрых прыгунов.
    decision: Использовать образовавшиеся лавовые проломы как ловушки для сталкивания
      врагов или держаться строго центра ринга.
    duration: 25.0 с
  - step: meso_3_boss_clash_and_wave_clearance
    player_action: Синтезирует титана Т4 (Колосс) / Т5 (Опустошитель) и выполняет
      лобовой таран по элитному Титану Пустоты, сбрасывая его в магму.
    game_response: Замедляет время в слоу-мо (0.3x) при падении босса за борт, очищает
      арену от остатков монстров, начисляет победные очки волны.
    decision: Выбрать момент броска с максимальным разгоном для преодоления сопротивления
      220-килограммового босса.
    duration: 15.0 с
  macro_loop:
  - step: macro_1_colosseum_entry
    player_action: Игрок начинает гладиаторский забег в главном меню, выбирая разблокированный
      визуальный облик челюстей.
    game_response: Инициализирует физическую арену Three.js + Rapier3D, спавнит 2
      стартовых кома Т1 и выводит таймер выживания 180 с.
    decision: 'Выбор тактики старта: агрессивный пуш центра или выжидательная позиционная
      игра у борта.'
    duration: 5.0 с
  - step: macro_2_three_wave_gauntlet
    player_action: Проходит последовательность из трех нарастающих волн (разминка,
      сужение ринга, бронированные таранщики и босс).
    game_response: Поэтапно сжимает ринг с 24.0 м до 13.5 м, повышает плотность спавна
      монстров и обсчитывает кинетические коллизии.
    decision: Адаптация стиля бросков под критическую тесноту ринга и управление риском
      потери высокоуровневых комьев.
    duration: 180.0 с
  - step: macro_3_run_resolution_and_scoring
    player_action: 'Наблюдает экран итогов гладиаторской битвы: число выбитых в магму
      врагов (Ring-Outs), максимальный выращенный тир и время.'
    game_response: Калькулирует итоговый счет, сохраняет рекорд в Playgama Bridge
      Cloud Storage и обновляет позицию в таблице лидеров.
    decision: 'Изучить свою позицию в рейтинге и решить: начать реванш или зайти в
      меню мутаций.'
    duration: 10.0 с
  - step: macro_4_meta_unlocks_and_mutations
    player_action: Разблокирует новые косметические мутации челюстей за закрытые боевые
      достижения и запускает усложненный забег.
    game_response: Сохраняет разблокированные скины в профиле игрока и активирует
      модификатор высокой сложности (Ярость Магмы).
    decision: Выбор активного скина мутации и старт новой гладиаторской дуэли.
    duration: 15.0 с
  loop_diagram: "+-------------------------------------------------------------+\n\
    |  СПАВН: 2 комка Т1 на базальтовой арене (диаметр 24.0 м)    |\n+-------------------------------------------------------------+\n\
    \                               |\n                               v\n+-------------------------------------------------------------+\n\
    |  СКАНИРОВАНИЕ РИНГА: оценка траекторий орды и краев лавы    |\n+-------------------------------------------------------------+\n\
    \             |                                       |\n             v      \
    \                                 v\n[Одиночный отпор мутанту]              [Кинетическое\
    \ сближение пары]\nКАТАПУЛЬТНЫЙ ШВЫРОК Т1                 КАТАПУЛЬТНЫЙ ШВЫРОК\
    \ Т(n) -> Т(n)\nТраектория во вражеский строй          Упреждение и разгон > 1.2\
    \ м/с\n             |                                       |\n             v\
    \                                       v\nПрямой урон + Сбивание с ног      \
    \     УДАРНЫЙ СИНТЕЗ Т(n+1)\n             |                         Hit-Stop 0.08\
    \ с + Вспышка биомассы\n             |                                       |\n\
    \             |                         РАДИАЛЬНАЯ УДАРНАЯ ВОЛНА\n           \
    \  |                         Импульс до 1200 Н*с, радиус до 7.3 м\n          \
    \   |                                       |\n             +-------------------+-------------------+\n\
    \                                 |\n                                 v\n+-------------------------------------------------------------+\n\
    | МАССОВЫЙ СБРОС ОРДЫ ЗА БОРТ В МАГМУ (RING-OUT = МГН. СМЕРТЬ)|\n+-------------------------------------------------------------+\n\
    \                                 |\n        +------------------------+------------------------+\n\
    \        |                                                 |\n        v      \
    \                                           v\n[Угроза прорыва с фланга]     \
    \          [Таймер 20 с: разлом плит]\nЧЕЛЮСТНОЙ ИМПУЛЬС (ТАП)               \
    \  СУЖЕНИЕ РИНГА (24 -> 13.5 м)\nКонусный отброс 70 град + Стан 0.45 с   Повышение\
    \ риска ринг-аута комьев\n        |                                          \
    \       |\n        +------------------------+------------------------+\n     \
    \                            |\n                                 v\n+-------------------------------------------------------------+\n\
    | СИНТЕЗ ТИТАНА Т5 -> СБРОС ТИТАНА ПУСТОТЫ -> ЛИДЕРБОРД       |\n+-------------------------------------------------------------+"
  tension_curve: Напряжение нарастает по пилообразной синусоиде с крутым восходящим
    трендом. В первые 10 секунд каждой волны напряжение низкое (3/10) — игрок свободно
    перетаскивает первые комки на просторной арене 24 м. К 25-й секунде напряжение
    взлетает до 7/10 из-за спавна быстрых мутантов и треска первых базальтовых плит.
    Пик 9.5/10 достигается на 45-й секунде волны, когда арена сужается до 13.5 м,
    на ринге беснуется орда, а единственный промах швырка грозит выбросить собственный
    ком 4-го уровня в магму. В момент успешного кинетического синтеза Т4/Т5 и выброса
    десятка врагов взрывной волной наступает 2-секундный катарсис и спад напряжения
    (2/10), сменяющийся новым, еще более жестким циклом следующей волны.
  core_formulas:
  - 'Импульс ударной волны слияния: I_shockwave = I_base * (Tier ^ 1.45) * (1.0 +
    (V_impact / 15.0)), где I_base = 280.0 Н·с, Tier in [1..5], V_impact — относительная
    скорость столкновения комьев в м/с (от 1.2 до 24.0 м/с).'
  - 'Радиус зоны поражения ударной волны: R_shockwave = 2.4 + (Tier - 1) * 1.225 [м],
    что дает 2.4 м на Т1, 3.62 м на Т2, 4.85 м на Т3, 6.07 м на Т4 и 7.30 м на Т5.'
  - 'Дистанция отброса врага при коллизии и волне: D_knockback = (I_applied / M_enemy)
    * (1.0 - Friction_coeff) * Mass_Scale_Factor, где M_enemy: Легкий паразит = 8
    кг, Ползун = 20 кг, Таранщик = 65 кг, Титан Пустоты = 220 кг.'
  - 'Динамика сужения арены: R_arena(t) = R_max - (R_max - R_min) * (t / T_wave_duration),
    где R_max = 12.0 м (диаметр 24 м), R_min = 6.75 м (диаметр 13.5 м), T_wave_duration
    = 60.0 с.'
  - 'Итоговый гладиаторский счет сессии: Score = Sum(RingOut_Enemies * 100 * Tier_Multiplier)
    + (Surviving_Titans_Mass * 15) + (Time_Remaining_Seconds * 50) * Wave_Difficulty_Bonus.'
  run_progression:
  - 'Эволюция массы и тира комьев биомассы: Т1 Личинка (10 кг, радиус 0.6 м) -> Т2
    Зубастик (25 кг, радиус 0.9 м) -> Т3 Мясоед (55 кг, радиус 1.3 м) -> Т4 Колосс
    (100 кг, радиус 1.8 м) -> Т5 Титан-Опустошитель (160 кг, радиус 2.4 м).'
  - 'Масштабирование физической устойчивости: прирост массы делает высокоуровневые
    комья практически неуязвимыми для лобового сбивания легкими врагами (коэффициент
    сопротивления сдвигу растет от 1.0x на Т1 до 8.5x на Т5).'
  - 'Экспоненциальный охват поля боя: переход от точечных тычков одиночных личинок
    к тотальному контролю всей арены одной ударной волной Т5 (площадь поражения волны
    увеличивается в 9.2 раза от Т1 к Т5).'
  - 'Компрессия пространства ринга: от свободного маневрирования на арене 24 м в начале
    до экстремального сумо-клинча на крошечном островке 13.5 м на 3-й минуте боя.'
  meta_progression:
  - 'Гладиаторский ранг в таблице лидеров Playgama: набор очков Ring-Out и побед поднимает
    игрока по ступеням от Корм для монстров до Верховный Био-Палач с сохранением в
    облачном хранилище.'
  - 'Биоморфные скины пасти и челюстей: открытие уникальных косметических мутаций
    (Обсидиановые клыки, Лавовые наросты, Неоновый токсин, Хтиновый панцирь), выдаваемых
    за выполнение боевых достижений (например, выбить 8 врагов одной волной).'
  - 'Мутагенные модификаторы арены (Испытания): открытие хардкорных модификаций арены
    для повторных забегов (Ярость Магмы с ускоренным сужением ринга на 40%, Гравитационная
    аномалия с увеличенной отдачей отскоков).'
  mechanics:
  - name: kinetic_strike_merge
    role_in_loop: Главный двигатель прогрессии и ключевой источник взрывной силы зачистки
      ринга (награда за риск и точный расчет).
    player_decision: 'Решение: объединить два кома прямо сейчас посреди толпы врагов
      ради спасительной ударной волны ценой потери одной управляемой единицы на поле
      боя, или продолжать удерживать два независимых кома для блокирования двух разных
      флангов.'
    input_mapping: 'Мышь: Зажатие ЛКМ на каме, оттягивание курсора и отпускание для
      прицельного запуска во второй ком того же тира. Тач: Касание пальцем кома, свайп-натяжение
      и отрыв пальца.'
    states:
    - 'IDLE_SEPARATE: два кома одного тира находятся на арене раздельно, активна аура
      готовности к синтезу'
    - 'COLLISION_IMPACT: физическое соприкосновение на скорости > 1.2 м/с, триггер
      hit-stop 0.08 с'
    - 'SYNTHESIS_FLASH: вспышка биоплазмы, удаление исходных двух тел и инстанцирование
      тела тира Т+1'
    - 'SHOCKWAVE_EXPANSION: радиальное распространение силового кольца от точки синтеза
      (длительность 0.35 с)'
    - 'COOLDOWN_RECOVERY: новорожденный титан восстанавливает физическую управляемость
      (0.15 с)'
    parameters:
    - name: Порог скорости для слияния (Merge Velocity Threshold)
      value: 1.2 м/с
      tuning_note: Если поднять до 3.5 м/с, комья начнут отскакивать друг от друга
        при мягких столкновениях, вызывая фрустрацию; если опустить до 0.1 м/с, случайные
        микрокасания в покое приведут к непреднамеренному мерджу без кинетического
        кайфа.
    - name: Длительность стоп-кадра коллизии (Hit-Stop Duration)
      value: 0.08 с
      tuning_note: Если увеличить до 0.25 с, игра покажется зависшей и дерганой; если
        убрать в 0.0 с, полностью исчезнет физическая весомость и акцент на сокрушительном
        моменте синтеза.
    - name: Базовый радиус ударной волны Т1 (Base Shockwave Radius)
      value: 2.4 м
      tuning_note: Если снизить до 1.0 м, волна не достанет даже вплотную стоящих
        врагов; если поднять до 5.0 м, игра превратится в однокнопочный тривиальный
        кликер без позиционной тактики.
    - name: Прирост радиуса волны за каждый тир (Radius Step Per Tier)
      value: 1.225 м
      tuning_note: Если уменьшить до 0.3 м, рост до титанов Т4/Т5 потеряет вау-эффект
        масштаба; если поднять до 2.5 м, Т4 покроет всю арену целиком, сломав челлендж
        сужения ринга.
    - name: Базовый радиальный импульс волны (Base Shockwave Impulse)
      value: 280.0 Н·с
      tuning_note: Если снизить до 100 Н·с, тяжелые враги даже не пошатнутся; если
        поднять до 800 Н·с, первичное слияние Т1 будет выбрасывать боссов с ринга
        с одного касания.
    feedback_layers:
    - 'Визуал / VFX: Ослепительная сферическая ударная волна с эффектом преломления
      пространства (heat distortion), разлет светящихся био-капель цвета тира, расширяющееся
      кольцо декалей на базальтовом полу, упругая деформация сжатия-расширения меша
      титана (Squash & Stretch).'
    - 'Звук / Web Audio API: Низкочастотный саб-басовый удар (sine wave 45 Гц с экспоненциальным
      спадом за 0.35 с), сопровождаемый смачным влажным щелчком разрыва биомассы и
      нарастающим звоном энергии (bandpass filter sweep 300 Гц -> 2.4 кГц).'
    - 'Камера: Радиальный импульс дрожания (Camera Shake: амплитуда 0.45 ед, затухание
      0.25 с), мгновенный микро-зум к эпицентру взрыва на 4% с плавным возвратом FOV
      (lerp 0.3 с).'
    - 'UI / Тактильность: Короткая вибрация мобильного устройства (Haptic Feedback:
      Heavy Impact 40 мс), всплывающее число суммарного кинетического урона золотистым
      шрифтом и пульсация иконки тира в верхней плашке.'
    failure_mode: 'Игрок бросает ком недостаточно сильно (скорость < 1.2 м/с) или
      промахивается мимо напарника: комья упруго сталкиваются и отскакивают в разные
      стороны, один из них может рикошетом улететь за край арены. Сигнал: тусклый
      звук глухого удара резины, отсутствие световой вспышки и индикатор промаха.'
    mastery_curve: Новичок на 30-й секунде пытается сталкивать комья медленным перетаскиванием
      в упор, рискуя быть съеденным ордой. Эксперт на 10-м забеге выполняет снайперские
      рикошеты через группу врагов, рассчитывая траекторию так, чтобы точка слияния
      оказалась ровно в геометрическом центре скопления элиты для максимального Ring-Out
      мультипликатора.
    counterplay: Тяжелые бронированные таранщики и монстры со щитами клином встают
      между двумя комьями игрока, физически блокируя прямую линию видимости и поглощая
      кинетический импульс броска своими массивными телами.
    synergies:
    - 'Катапультный Швырок (slingshot_fling): задает стартовую скорость и вектор сближения
      для преодоления порога слияния 1.2 м/с.'
    - 'Магматический Разлом (magma_ring_fracture): ударная волна слияния сбрасывает
      оглушенных врагов прямо в свежие проломы базальтовой арены.'
    - 'Челюстной Импульс (jaws_kinetic_chomping): позволяет новорожденному титану
      моментально отбросить выживших монстров сразу после выхода из фазы слияния.'
    why_unique: В отличие от 2048/Suika, слияние здесь — это не статическое перемещение
      фишек по сетке, а взрывной физический граунд-паунд реального времени, использующий
      саму массу новорожденного существа для зачистки арены от наступающей орды.
    pseudocode: "def tick_kinetic_strike_merge(blob_a, blob_b, dt):\n    if blob_a.tier\
      \ != blob_b.tier or blob_a.state == MERGING or blob_b.state == MERGING:\n  \
      \      return\n    rel_vel = (blob_a.velocity - blob_b.velocity).length()\n\
      \    if distance(blob_a.pos, blob_b.pos) <= (blob_a.radius + blob_b.radius)\
      \ and rel_vel >= 1.2:\n        spawn_pos = (blob_a.pos + blob_b.pos) * 0.5\n\
      \        new_tier = min(blob_a.tier + 1, 5)\n        destroy_blob(blob_a); destroy_blob(blob_b)\n\
      \        new_titan = spawn_blob(tier=new_tier, pos=spawn_pos)\n        trigger_hit_stop(0.08)\n\
      \        emit_shockwave(pos=spawn_pos, radius=2.4 + (new_tier - 1) * 1.225,\
      \ impulse=280.0 * (new_tier ** 1.45))\n        trigger_feedback(layer_vfx=True,\
      \ layer_sfx='merge_boom', layer_haptic='heavy', shake=0.45)"
  - name: slingshot_fling
    role_in_loop: Основной кинетический инструмент позиционирования, атаки и доставки
      комьев к цели (источник тактического риска и точности).
    player_decision: 'Решение: приложить максимальную силу швырка для пробивания плотной
      толпы монстров с риском рикошета собственного кома в лаву, или сделать аккуратный
      короткий пас во фланг для безопасного сближения со вторым комом.'
    input_mapping: 'Мышь: Зажатие ЛКМ на каме, перемещение курсора для формирования
      вектора натяжения, отпускание ЛКМ для запуска. Тач: Касание кома, оттягивание
      пальца с отображением траекторной стрелки, отрыв пальца.'
    states:
    - 'IDLE_READY: ком устойчиво стоит на плите, ожидает захвата указателем'
    - 'DRAGGING_AIM: указатель удерживает ком, тело деформируется по вектору, отображается
      проекция полета'
    - 'LAUNCH_FLING: мгновенный импульс силы, переход в режим высокоскоростного баллистического
      тарана'
    - 'HEAVY_RAMMING: ком летит на скорости до 22 м/с, сбивая с ног всех мутантов
      на пути (длительность 0.65 с)'
    - 'SETTLING: затухание скорости за счет трения, возврат в состояние стандартного
      физического тела'
    parameters:
    - name: Максимальная дистанция натяжения (Max Drag Distance)
      value: 4.0 м
      tuning_note: Если увеличить до 8.0 м, вектор натяжения выйдет за границы экрана
        мобильного устройства; если снизить до 1.5 м, игрок потеряет точность тонкого
        контроля силы броска.
    - name: Множитель скорости запуска (Fling Speed Multiplier)
      value: 5.5 (м/с)/м
      tuning_note: При натяжении 4.0 м дает скорость 22.0 м/с. Если поднять выше 8.0,
        комья превратятся в неуправляемые гиперзвуковые пули; если опустить ниже 3.0,
        броски будут вялыми и не пробьют строй орды.
    - name: Время статуса Тяжелый таран (Heavy Ram Duration)
      value: 0.65 с
      tuning_note: Если снизить до 0.2 с, ком потеряет пробивной импульс при первом
        же столкновении с легким врагом; если увеличить до 2.0 с, ком станет неуязвимым
        катком, игнорирующим сопротивление среды.
    - name: Коэффициент трения о плиты арены (Linear Drag Coeff)
      value: 0.85 1/с
      tuning_note: Если снизить до 0.2, комья будут скользить как по льду и бесконтрольно
        падать в лаву; если поднять до 2.5, ком будет останавливаться через метр после
        запуска.
    - name: Мертвая зона захвата указателем (Pointer Deadzone)
      value: 0.15 м
      tuning_note: Если уменьшить до 0.02 м, любой случайный клик превратится в паразитный
        микро-швырок; если поднять до 0.6 м, управление покажется ватным и неотзывчивым.
    feedback_layers:
    - 'Визуал / VFX: Растягивающаяся светящаяся био-нить натяжения между центром кома
      и курсором, динамическая пунктирная дуга траектории с точкой коллизии, инверсионный
      след плотного пара и искр позади летящего кома.'
    - 'Звук / Web Audio API: Нарастающий тон натяжения сухожилия (frequency mod synth
      120 -> 480 Гц при оттяжке), резкий хлыстообразный свист рассекаемого воздуха
      при релизе (white noise bandpass 1.8 кГц) и смачные звуки ударов кеглей при
      сбивании врагов.'
    - 'Камера: Плавное микро-отдаление камеры (Zoom Out на 3%) во время натяжения
      для улучшения обзора ринга, импульсный толчок камеры по вектору броска в момент
      запуска.'
    - 'UI / Тактильность: Нарастающая легкая вибрация смартфона по мере увеличения
      натяжения рогатки (Haptic tick), резкий четкий щелчок (Medium Impact 25 мс)
      при релизе.'
    failure_mode: 'Игрок делает чрезмерно сильный бросок в сторону края без попадания
      во врага или союзника: комок перелетает базальтовый бордюр и падает в магму.
      Сигнал: панический крик биомассы, камера кратковременно фиксирует падение в
      лаву, на UI вспыхивает красный силуэт потерянного кома.'
    mastery_curve: Новичок стреляет только по прямой в ближайшего монстра, часто рикошетя
      в лаву. Эксперт использует угловые рикошеты от массивных базальтовых колонн
      и бронированных врагов, собирая три сбивания за один пуск и гася избыточную
      скорость точно в точке встречи с парным комом.
    counterplay: Токсичные плевуны на дистанции заливают арену едкой слизью, удваивающей
      трение и снижающей скорость полета кома на 60%, а бронированные жуки выставляют
      шипастые панцири, отражающие ком обратно в игрока.
    synergies:
    - 'Ударный Синтез (kinetic_strike_merge): является прямым инициатором слияния
      за счет разгона комьев до необходимой скорости соударения.'
    - 'Магматический Разлом (magma_ring_fracture): позволяет прицельно выбивать врагов
      на нестабильные трескающиеся плиты за секунду до их обрушения.'
    - 'Челюстной Импульс (jaws_kinetic_chomping): при подлете кома к скоплению врагов
      игрок может прервать полет челюстным ударом, меняя вектор импульса.'
    why_unique: Вместо кнопочного перемещения стиком или классического наведения курсором,
      здесь реализована упругая физическая рогатка с кинематической деформацией 3D-тела
      кома и инерционным пробиванием рядов противника.
    pseudocode: "def tick_slingshot_fling(blob, pointer_input, dt):\n    if pointer_input.is_down\
      \ and blob.contains(pointer_input.start_pos):\n        drag_vec = clamp_length(pointer_input.start_pos\
      \ - pointer_input.current_pos, max_len=4.0)\n        blob.state = DRAGGING_AIM\n\
      \        render_trajectory(blob.pos, drag_vec * 5.5)\n    elif pointer_input.just_released\
      \ and blob.state == DRAGGING_AIM:\n        fling_velocity = drag_vec * 5.5\n\
      \        blob.apply_linear_impulse(fling_velocity * blob.mass)\n        blob.state\
      \ = HEAVY_RAMMING; blob.ram_timer = 0.65\n        trigger_feedback(layer_vfx='trail_on',\
      \ layer_sfx='slingshot_snap', layer_haptic='medium', zoom_reset=True)\n    if\
      \ blob.state == HEAVY_RAMMING:\n        blob.ram_timer -= dt\n        if blob.ram_timer\
      \ <= 0: blob.state = IDLE_READY"
  - name: jaws_kinetic_chomping
    role_in_loop: Тактический тормоз давления орды и направленный инструмент мгновенного
      силового выталкивания (спасение из окружения).
    player_decision: 'Решение: потратить кулдаун челюстного импульса на мгновенный
      сброс наседающего на край врага, или приберечь его для оглушения приближающегося
      тяжелого таранщика.'
    input_mapping: 'Мышь: Быстрый одиночный клик ЛКМ по кому (без перетаскивания)
      или нажатие клавиши Пробел для ближайшего титана. Тач: Быстрый тап по кому без
      свайпа.'
    states:
    - 'READY: челюсти сомкнуты, индикатор готовности активен'
    - 'JAW_SNAP_ACTIVE: взрывное раскрытие и мгновенный захлоп пасти титана (0.12
      с)'
    - 'CONE_DISPERSAL: испускание конусной ударной волны 70 градусов, расталкивание
      и стан врагов'
    - 'DEVOUR_ABSORB: если здоровье сбитого врага < 15%, происходит мгновенное поглощение
      биомассы'
    - 'RECHARGE_COOLDOWN: таймер восстановления 2.2 с, постепенное накапливание био-энергии'
    parameters:
    - name: Угол раскрытия конуса атаки челюстей (Jaw Cone Angle)
      value: 70.0 градусов
      tuning_note: Если расширить до 140 градусов, отпадает необходимость позиционирования
        пасти; если сузить до 25 градусов, попасть по подвижным прыгунам на тачскрине
        станет невозможно.
    - name: Базовая дальность укуса Т1 (Base Bite Reach)
      value: 2.2 м
      tuning_note: Если уменьшить до 1.0 м, враги успеют нанести урон комку до срабатывания
        челюстей; если увеличить до 4.5 м, атака превратится в дальнобойное оружие,
        ломающее ближний бой.
    - name: Векторный импульс выталкивания (Jaw Knockback Impulse)
      value: 350.0 Н·с
      tuning_note: Если снизить до 120 Н·с, челюсть не сможет остановить бегущего
        таранщика; если поднять до 900 Н·с, челюсть обесценит слияние как источник
        ринг-аутов.
    - name: Длительность оглушения врагов (Stun Duration)
      value: 0.45 с
      tuning_note: Если поднять до 1.5 с, враги станут беспомощными мишенями; если
        опустить до 0.1 с, враги по инерции продолжат сдвигать ком игрока к краю лавы.
    - name: Время перезарядки челюстей (Chomp Cooldown)
      value: 2.2 с
      tuning_note: Если снизить до 0.5 с, возникнет имбалансный спам кликами по экрану;
        если поднять до 6.0 с, игроки перестанут рассчитывать на челюсти в критических
        клинчах.
    feedback_layers:
    - 'Визуал / VFX: Мгновенная 3D-анимация раскрытия массивной зубастой пасти с разлетающимися
      каплями слюны и светящимися следами клыков, конусный фронт сжатого воздуха с
      искрами, вспышка оглушения над головами задетых врагов.'
    - 'Звук / Web Audio API: Оглушительный хрустящий щелчок массивных костяных челюстей
      (атака 5 мс, спад 80 мс, high-pass filter 800 Гц) с металлическим лязгом смыкания
      зубов и свистящим выдохом воздуха.'
    - 'Камера: Мгновенный резкий микро-толчок камеры вперед вдоль направления укуса
      (Directional Impulse 0.15 м) с быстрым демпфированием.'
    - 'UI / Тактильность: Острый двойной тактильный щелчок смартфона (Double Light
      Click 15 мс + 15 мс) и круговой радиальный сектор перезарядки вокруг основания
      кома.'
    failure_mode: 'Игрок кликает челюстью в момент, когда монстры атакуют с тыла или
      находятся вне 70-градусного сектора: челюсти щелкают впустую, игрок уходит на
      2.2 с кулдауна и остается беззащитным перед боковым толчком. Сигнал: глухой
      звук клацанья зубов в воздухе и мигающая красным иконка перезарядки.'
    mastery_curve: Новичок спамит тапом при любом приближении врага, быстро оставаясь
      без кулдауна в окружении. Эксперт выжидает момент разгона вражеского таранщика
      к краю арены, встречает его челюстным импульсом в упор, разворачивая его собственный
      вектор скорости на 180 градусов прямо в лаву.
    counterplay: 'Шипастые ежи-мутанты сворачиваются в клубок при виде раскрытия челюстей:
      попытка укусить такого ежа оглушает самого титана игрока на 0.6 с.'
    synergies:
    - 'Катапультный Швырок (slingshot_fling): позволяет после приземления в толпу
      мгновенно активировать челюсть для круговой расчистки плацдарма.'
    - 'Ударный Синтез (kinetic_strike_merge): поглощение мелких врагов челюстями дает
      микро-прирост массы, увеличивая итоговый импульс следующего мерджа.'
    - 'Магматический Разлом (magma_ring_fracture): идеальный инструмент для точечного
      сталкивания оглушенных врагов в образовавшиеся дыры ринга.'
    why_unique: В отличие от авто-атак в классических автобатлерах, челюстной захлоп
      требует строгого позиционирования вектора пасти и тайминга реакции, выступая
      активным физическим парированием лобового тарана.
    pseudocode: "def tick_jaws_kinetic_chomping(blob, tap_input, dt):\n    if blob.chomp_cooldown\
      \ > 0:\n        blob.chomp_cooldown -= dt\n        return\n    if tap_input.is_tap_on(blob):\n\
      \        blob.chomp_cooldown = 2.2\n        cone_enemies = find_enemies_in_cone(blob.pos,\
      \ blob.facing_dir, angle=70.0, dist=2.2 + blob.tier * 0.6)\n        for enemy\
      \ in cone_enemies:\n            enemy.apply_impulse(dir=blob.facing_dir, force=350.0)\n\
      \            enemy.apply_stun(duration=0.45)\n            if enemy.hp_percent\
      \ < 0.15: devour_enemy(blob, enemy)\n        trigger_feedback(layer_vfx='jaw_snap_mesh',\
      \ layer_sfx='bone_crunch', layer_haptic='double_tap', cam_dir=blob.facing_dir)"
  - name: magma_ring_fracture
    role_in_loop: Эскалатор напряжения, таймер сжатия безопасного пространства и генератор
      критического риска ринг-аута (динамическая среда).
    player_decision: 'Решение: рискованно удерживать комья на краю внешнего сектора
      для заманивания врагов в зону обрушения, или эвакуировать все комья в тесный
      центр ринга, где неизбежна плотная толкотня с ордой.'
    input_mapping: Пассивно-динамическая механика среды, управляемая игровым таймером
      и реакцией игрока через перемещение комьев швырками (Slingshot Fling).
    states:
    - 'STABLE_RING: внешние плиты монолитны, диаметр арены 24.0 м'
    - 'FRACTURE_WARNING: 4 плиты внешнего сектора растрескиваются, из швов бьет магма
      (длительность 3.0 с)'
    - 'SECTOR_COLLAPSE: плиты с грохотом отламываются и падают в лаву, увлекая за
      собой стоящие объекты'
    - 'SHRUNK_PERIMETER: новый уменьшенный диаметр ринга (18.0 м -> 13.5 м), активен
      магматический край'
    - 'MAGMA_SPLASH_HAZARD: гейзеры лавы на границе периодически выбрасывают капли
      расплава'
    parameters:
    - name: Начальный диаметр базальтовой арены (Initial Arena Diameter)
      value: 24.0 м
      tuning_note: Если увеличить до 40.0 м, бой станет затянутым и вялым, враги будут
        слишком долго бежать до игрока; если уменьшить до 14.0 м на старте, новичок
        упадет в лаву на первых 5 секундах.
    - name: Минимальный диаметр ядра арены (Final Core Diameter)
      value: 13.5 м
      tuning_note: Если уменьшить до 6.0 м, крупные титаны Т4/Т5 (радиус 2.4 м) не
        поместятся на ринге; если оставить 19.0 м, в финале волны не возникнет чувства
        пиковой клаустрофобии.
    - name: Время предупреждающего растрескивания (Warning Fracture Time)
      value: 3.0 с
      tuning_note: Если снизить до 0.8 с, игрок не успеет физически среагировать и
        эвакуировать комья швырком; если растянуть до 7.0 с, угроза обрушения перестанет
        мотивировать двигаться.
    - name: Интервал обрушения секторов (Sector Collapse Interval)
      value: 20.0 с
      tuning_note: Если частить каждые 8 с, арена исчезнет до того, как игрок синтезирует
        ком Т3; если растянуть до 45 с, динамика 60-секундной волны будет потеряна.
    - name: Импульс выталкивания магматического всплеска (Magma Splash Force)
      value: 500.0 Н·с
      tuning_note: Если снизить до 50 Н·с, гибель врагов в лаве будет визуально незаметным
        падением; если поднять до 2000 Н·с, упавшие враги будут комично вылетать обратно
        на ринг.
    feedback_layers:
    - 'Визуал / VFX: Ярко-оранжевое раскаленное свечение линий разлома между базальтовыми
      плитами, частицы дыма и лавовых искр, физическое опрокидывание 3D-мешей плит
      вниз в кипящую лаву с объемными всплесками магмы и тепловым маревом.'
    - 'Звук / Web Audio API: Глухой раскатистый подземный гул (low-shelf filter 60
      Гц с нарастанием громкости), треск ломающегося камня (granulate noise burst)
      и громкое шипение лавы (white noise low-pass 1.2 кГц) при погружении плит.'
    - 'Камера: Непрерывная низкочастотная вибрация камеры во время 3-секундной фазы
      предупреждения, резкий вертикальный толчок вниз в момент обрушения плит.'
    - 'UI / Тактильность: Предупреждающая пульсирующая вибрация смартфона (Periodic
      Rumble), мигающий красный контур опасных секторов на мини-карте и стрелки эвакуации.'
    failure_mode: 'Игрок увлекается прицеливанием швырка и не замечает, что его второй
      ком стоит на растрескивающейся плите: плита обрушивается, унося ком в магму.
      Сигнал: громкий треск, звуковая сирена тревоги и визуальный индикатор Danger
      под ногами кома.'
    mastery_curve: Новичок в панике стягивает все комья в центр при первом же треске,
      попадая в клещи окружившей орды. Эксперт стоит на падающей плите до последней
      0.5 секунды, собирая вокруг себя толпу мутантов, а затем одним швырком катапультируется
      в центр, оставляя 6 врагов падать в бездну вместе с плитой.
    counterplay: Тяжелые големы-мутанты специально наносят удары по полу, ускоряя
      время растрескивания плит с 3.0 до 1.2 с и создавая локальные лавовые ловушки
      прямо под комьями игрока.
    synergies:
    - 'Ударный Синтез (kinetic_strike_merge): взрывная волна слияния эффективнее всего
      выбивает врагов именно в свежие проломы обрушенных плит.'
    - 'Катапультный Швырок (slingshot_fling): служит главным инструментом экстренной
      эвакуации комьев с падающих базальтовых платформ.'
    - 'Челюстной Импульс (jaws_kinetic_chomping): позволяет спихнуть врага с края
      плиты за доли секунды до её падения.'
    why_unique: Вместо банального ядовитого круга из Battle Royale, здесь арена состоит
      из дискретных физических 3D-платформ, чье разрушение меняет геометрию рикошетов
      и открывает новые бездны для Ring-Out механики.
    pseudocode: "def tick_magma_ring_fracture(arena, wave_timer, dt):\n    if wave_timer.time_in_wave\
      \ >= arena.next_collapse_time and arena.current_radius > 13.5:\n        sectors_to_break\
      \ = arena.get_outer_sectors()\n        for sector in sectors_to_break:\n   \
      \         sector.state = FRACTURE_WARNING\n            sector.warning_timer\
      \ = 3.0\n            trigger_feedback(layer_vfx='magma_glow', layer_sfx='sub_rumble',\
      \ layer_haptic='pulse_warning')\n    for sector in arena.get_active_warning_sectors():\n\
      \        sector.warning_timer -= dt\n        if sector.warning_timer <= 0:\n\
      \            sector.state = SECTOR_COLLAPSE\n            drop_sector_mesh_into_magma(sector)\n\
      \            arena.current_radius -= 2.83\n            kill_objects_on_sector(sector,\
      \ death_type='RING_OUT_MAGMA')\n            trigger_feedback(layer_vfx='lava_splash',\
      \ layer_sfx='stone_crack', cam_shake=0.35)"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 65
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - description: Цикл requestAnimationFrame, инициализация Three.js сцены, физического
      мира Rapier3D и адаптивного ресайза.
    name: Core/GameEngine
  - description: Синхронизация твердых тел (RigidBody), обработка контактов, лучеиспускание
      (Raycasting) и кинетические импульсы.
    name: Physics/RapierIntegration
  - description: Классы комьев-мутантов, титанов и врагов с процедурной анимацией
      колебаний (squash & stretch) и стейт-машиной.
    name: Entities/BlobsAndEnemies
  - description: Менеджер волн, спавнер, система ударных волн слияния и разрушения
      арены.
    name: Systems/GameplayDirector
  - description: Обработчик Pointer/Touch событий, проецирование лучей в 3D пространство,
      расчет векторов швырка.
    name: Input/PointerControls
  - description: 'Легковесный DOM/Canvas HUD поверх WebGL холста: волна, таймер, счетчик
      ринг-аутов, комбо.'
    name: UI/OverlayAndHUD
  - description: 'Интеграция SDK Playgama Bridge: реклама, облачные сохранения, лидерборды,
      локализация.'
    name: Platform/PlaygamaBridge
  modules:
  - file: src/gameplay/BlobManager.ts
    name: BlobManager
    role: Управление пулом комьев игрока, эволюция форм и мердж-логика.
  - file: src/gameplay/HordeDirector.ts
    name: HordeDirector
    role: Спавн вражеских мутантов по фазам волны и управление их поведением.
  - file: src/environment/ArenaController.ts
    name: ArenaController
    role: Генерация ринга, процедурное разрушение плит и шейдер магмы.
  - file: src/physics/PhysicsWorld.ts
    name: PhysicsWorld
    role: Инициализация Rapier3D, коллизии, рэйкастинг и триггеры падения.
  - file: src/vfx/ShockwaveFX.ts
    name: ShockwaveFX
    role: Инстансированные кольца ударных волн, частицы лавы и био-слизи.
  - file: src/input/TouchInputController.ts
    name: TouchInputController
    role: Детекция жестов захвата, перетаскивания и свайповых бросков.
monetization:
  strategy_summary: 'Ненавязчивая гибридная модель: вознаграждающие видео (Rewarded
    Ads) для второго шанса и спавна золотого био-кома, межстраничные объявления (Interstitial)
    с кулдауном 90 секунд строго между волнами/забегами, и внутриигровые покупки косметических
    обликов челюстей.'
  rewarded_placements:
  - id: revive_lava_rescue
    name: Магматическое Спасение (Revive)
    benefit: Мгновенное возвращение упавшего титана на арену с мощной ударной волной,
      сдувающей всех врагов
    cooldown_or_limit: 1 раз за забег
    trigger_moment: Экран поражения при падении последнего кома
  - id: spawn_golden_blob
    name: Золотой Био-Ком (Golden Catalyst)
    benefit: Призыв золотого кома, который мгновенно соединяется с комком любого ранга,
      удваивая силу волны
    cooldown_or_limit: 1 раз за волну
    trigger_moment: Перед стартом 3-й волны босса
  interstitial_placements:
  - trigger_event: Завершение полного 3-волнового забега или второй подряд проигрыш
    cooldown_seconds: 90
    conditions: Показывается только на экране подведения итогов, никогда во время
      активного боя или при выборе апгрейдов
  in_app_purchases:
  - sku: skin_pack_inferno
    name: 'Облик: Инфернальный Жнец'
    description: Пылающие обсидиановые челюсти с огненным следом при швырке и эффектом
      лавовых брызг
    price_tier: Tier 1 ($0.99 / 99 YAN)
    reward: Постоянный косметический скин титана
  - sku: no_ads_permanent
    name: Отключение межстраничной рекламы
    description: Полное отключение всех всплывающих Interstitial объявлений навсегда
    price_tier: Tier 2 ($1.99 / 199 YAN)
    reward: Отключение интерстишиалов + эксклюзивная изумрудная аура
  fairness_rules:
  - 'Никаких pay-to-win элементов: все геймплейные комья и уровни силы доступны бесплатно
    за счет мастерства слияния'
  - Реклама никогда не прерывает активное управление и физический бой на арене
  - Всегда четкое предупреждение перед показом Rewarded Video с понятной наградой
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - game distribution
  - web
  initialization_flow:
  - Вызов bridge.initialize() при старте страницы до рендера Three.js сцены
  - Загрузка сохраненного прогресса и скинов через bridge.storage.get()
  - Проверка доступности рекламы через bridge.advertisement.checkState()
  - Определение языка интерфейса и типа устройства (desktop/mobile)
  cloud_save_keys:
  - player_high_score
  - unlocked_jaw_skins
  - total_ringouts_count
  - equipped_skin_id
  - sound_settings
  leaderboards:
  - weekly_colosseum_champions (Еженедельный зачет по максимальному счету за забег)
  - all_time_ringouts (Общий рекорд по количеству выбитых за борт мутантов)
  ads_integration:
    banner: bridge.advertisement.showBanner() внизу экрана в меню (только если поддерживается
      платформой)
    interstitial: bridge.advertisement.showInterstitial() с тайм-аутом 90 с
    rewarded: bridge.advertisement.showRewarded() с обработкой коллбека награды
  lifecycle_hooks:
  - bridge.game.on('visibility_change', (visible) => toggleGamePause(!visible))
  - bridge.game.on('device_rotation', () => adjustCameraProjection())
art:
  style_name: Стилизованный темный биопанк-гладиаторский экшен (Dark Biopunk Stylized
    3D)
  camera_perspective: Фиксированная наклонная сверху (Top-Down Angled 60°)
