  environment_theme: Круглая базальтовая гладиаторская арена с трещинами и светящимися
    рунами, парящая над бурлящим озером раскаленной магмы
  character_proportions: Упругие шарообразные комья из органической биомассы с гипертрофированными
    зубастыми челюстями, выразительными выпученными глазами и пульсирующими шипами
  lighting_setup: 'Контрастный трехточечный сетап: драматичный снизу-сбоку теплый
    оранжево-красный свет магмы (Point Light), мягкий верхний изумрудный биолюминесцентный
