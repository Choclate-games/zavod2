raw_prompt: Динамичный 3D мердж-экшен с видом сверху на круглой гладиаторской арене.
  Игрок с помощью мыши или тачскрина перетаскивает и сталкивает одинаковых зубастых
  комьев-мутантов, мгновенно объединяя их в более мощных существ прямо во время непрерывной
  атаки врагов. На экране разворачивается физическая потасовка комьев с упругими столкновениями,
  выбиванием соперников за борта и сочными спецэффектами роста. Цель — создать титана
  высшего уровня и очистить ринг до того, как волна врагов сомнет оборону.
title: 'Био-Колизей: Ударный Синтез'
slug: dinamichnyy_3d_merdzh_ekshen_s_vidom_sverhu_na_k
genre: 3D Физический Мердж-Экшен
subgenre: Гладиаторский Арена-Браулер с Кинетическим Слиянием
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web)
orientation: landscape
target_audience: Игроки 12–35 лет, любящие динамичные арена-потасовки, физические
  разрушения и удовлетворяющие механики слияния (Suika, Gang Beasts, Smash Bros).
core_loop: Захват и швырок комьев указателем -> Мгновенный кинетический синтез одинаковых
  уровней -> Разрушительная ударная волна -> Массовое выбивание врагов за борт в магму
  (Ring-Out) -> Эволюция в гигантского зубастого титана -> Очистка арены и покорение
  волн.
hook: Момент, когда два кома 3-го уровня сливаются прямо в кольце окруживших тебя
  монстров, порождая сокрушительную ударную волну, которая в слоу-мо взрывом сносит
  десять врагов за край кипящей магматической бездны!
player_fantasy: Ты — повелитель живой мутирующей биомассы, управляющий зубастыми титанами-гладиаторами
  на смертельном ринге, где каждый бросок и слияние сотрясают арену и сбрасывают чудовищ
  в бездну.
session_model: 'Гладиаторский зачет: 3 нарастающие волны по 45–60 секунд с финальным
  титаном-боссом и сужающейся зоной арены (суммарная длительность забега 2.5–3 минуты).'
unique_value_proposition: Первый 3D мердж-экшен, где слияние — это не медитативная
  головоломка на сетке, а взрывное физическое супероружие в реальном времени, превращающее
  процесс синтеза в яростный кинетический бой с выбиванием противников за пределы
  арены.
vision: Создать самый тактильно сочный и динамичный браузерный 3D арена-браулер с
  физикой слияния, объединяющий интуитивное жестовое управление одним пальцем, восторг
  от кинетических ринг-аутов и глубокое мастерство контроля пространства.
elevator_pitch: '«Био-Колизей: Ударный Синтез» — это динамичный 3D мердж-экшен на
  круглой гладиаторской арене над лавой. Швыряй и сталкивай зубастых комьев-мутантов
  пальцем или мышью: каждый акт слияния порождает разрушительную ударную волну, сдувающую
  нападающую орду в бездну. Вырасти легендарного титана и очисти колизей до того,
  как арена сгорит под ногами!'
win_conditions: Успешно выдержать натиск 3 нарастающих волн мутантов (суммарно 180
  секунд боя), вырастить титана 4+ уровня и сбросить финального Титана Пустоты за
  пределы арены в лаву.
lose_conditions: Все комья игрока выбиты врагами за борт арены в раскаленную магму
  либо уничтожены до завершения таймера волны.
progression_summary: 'Внутри забега: эволюция комьев от крошечных личинок Т1 (10 кг)
  до колоссальных титанов Т5 (160 кг) с ростом радиуса ударной волны от 2.5 до 7.3
  м. Между забегами: открытие новых визуальных мутаций челюстей и восхождение в глобальном
  рейтинге гладиаторов Playgama.'
difficulty_curve: 'Пошагово нарастающая эскалация: Волна 1 (простая разминка, знакомство
  с импульсом слияния) -> Волна 2 (сужение арены на 25%, появление быстрых и прыгающих
  мутантов) -> Волна 3 (экстремальная теснота ринга, появление бронированных таранов
  и финального титана-босса).'
scores:
  fun: 9
  originality: 9
  replayability: 9
  development_cost: 7
  visual_appeal: 9
  mobile_fit: 10
  monetization: 8
  platform_fit: 9
  overall_score: 8.8
  justification: Оценки выставлены за непревзойденный тактильный кайф от прямого швыряния
    физических комьев и кинетических ринг-аутов в браузерном WebGL/Three.js. Оригинальность
    9/10 обоснована гибридизацией механики слияния как источника боевой ударной волны,
    а не пассивной головоломки. Небольшое снижение по development_cost (7/10) связано
    с необходимостью тонкого тюнинга физики Rapier3D для предотвращения случайного
    вылета комьев игрока за пределы арены при слабых бросках.
references:
- name: Smash Bros / Gang Beasts
  genre: Физический арена-браулер
  mechanics:
  - Ринг-ауты
  - Физические импульсы отталкивания
  - Сужающаяся арена
  lessons: Выбивание за пределы платформы всегда дарит в разы больше эмоций, чем простое
