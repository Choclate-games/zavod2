preview_prompt: 'Authentic in-game gameplay screenshot of ''Био-Колизей: Ударный Синтез'',
  a 3D Физический Мердж-Экшен game. Visual style: Стилизованный темный биопанк-гладиаторский
  экшен (Dark Biopunk Stylized 3D). Camera perspective: Фиксированная наклонная сверху
  (Top-Down Angled 60°). Environment: Круглая базальтовая гладиаторская арена с трещинами
  и светящимися рунами, парящая над бурлящим озером раскаленной магмы. Central Action:
  Момент, когда два кома 3-го уровня сливаются прямо в кольце окруживших тебя монстров,
  порождая сокрушительную ударную волну, которая в слоу-мо взрывом сносит десять врагов
  за край кипящей магматической бездны! — the moment is caught mid-action, with clear
  cause and effect readable in a single frame. Visible in-game HUD overlay: Индикатор
  текущей волны (Волна 1/3, 2/3, 3/3), Круговой таймер выживания волны (60 с), Счетчик
  ринг-аутов и комбо-множитель (x2, x3, x5!), Мини-индикатор тира активного Титана
  (иконка зубастой пасти с уровнем); touch controls at the bottom corners. Lighting:
  Контрастный трехточечный сетап: драматичный снизу-сбоку теплый оранжево-красный
  свет магмы (Point Light), мягкий верхний изумрудный биолюминесцентный свет (Hemisphere
  Light) и резкий контурный свет (Rim Light) для четкой читаемости силуэтов комьев.
  Color palette: #1A1A24, #00FF66, #DC143C, #FF4500, #8A2BE2, #FFD700. High visual
  clarity, readable silhouettes, immersive WebGL game aesthetics.'
