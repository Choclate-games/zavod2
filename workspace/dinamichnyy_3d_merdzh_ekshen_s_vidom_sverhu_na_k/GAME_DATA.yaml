mobile:
  orientation: landscape
  touch_implementation: One-Touch Direct Physics Manipulation через PointerEvents
    с поддержкой Multi-Touch для одновременного перетаскивания двух комьев.
  safe_area_handling: Отступы CSS env(safe-area-inset-*) для вырезов камер (notch)
    и экранных полос навигации; игровые элементы центрированы на круглой арене.
  performance_throttling:
  - Динамическое снижение разрешения рендера (DPR 1.0 на слабых мобильных GPU вместо
    2.0)
  - Лимит активных частиц в пуле (максимум 120 частиц на мобильных устройствах)
  - Отключение пост-процессинг блума на устройствах с FPS ниже 45 в течение 3 секунд
    подряд
  - Упрощенные капсульные коллайдеры для мелких мутантов
