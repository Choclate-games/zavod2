definition_of_done:
- Полностью функционирующий физический цикл слияния комьев в Rapier3D с генерацией
  кинетической ударной волны
- Реализовано бескнопочное жестовое управление (Drag & Fling) для мыши и тачскрина
- Круглая базальтовая арена с динамическим разрушением внешних плит по таймеру волны
- 3 сбалансированные волны нарастающей сложности с элитным боссом в финале
- Сочные аудио-визуальные эффекты (hit-stop, screen shake, squash & stretch, брызги
  магмы и слизи)
- 'Интеграция @playgama/bridge SDK: реклама, сохранения рекордов и лидерборды'
- Стабильные 60 FPS на десктопе и мобильных устройствах при бюджете бандла до 4.5
  МБ
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Захват и швырок комьев указателем -> Мгновенный кинетический
  синтез одинаковых уровней -> Разрушительная ударная волна -> Массовое выбивание
  врагов за борт в магму (Ring-Out) -> Эволюция в гигантского зубастого титана ->
  Очистка арены и покорение волн..'
- 'Реализованы механики проекта: kinetic_strike_merge, slingshot_fling, jaws_kinetic_chomping,
  magma_ring_fracture.'
- Условие успеха (Успешно выдержать натиск 3 нарастающих волн мутантов (суммарно 180
  секунд боя), вырастить титана 4+ уровня и сбросить финального Титана Пустоты за
  пределы арены в лаву.) и условие проигрыша (Все комья игрока выбиты врагами за борт
  арены в раскаленную магму либо уничтожены до завершения таймера волны.) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Био-Колизей: Ударный Синтез».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Магматическое Спасение (Revive),
  Золотой Био-Ком (Golden Catalyst)); interstitial соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
