_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: dinamichnyy_3d_merdzh_ekshen_s_vidom_sverhu_na_k
performance:
  target_fps: 60
  max_draw_calls: 65
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: 'Гладиаторский зачет: 3 нарастающие волны по 45–60 секунд с финальным титаном-боссом
    и сужающейся зоной арены (суммарная длительность забега 2.5–3 минуты).'
  win: Успешно выдержать натиск 3 нарастающих волн мутантов (суммарно 180 секунд боя),
    вырастить титана 4+ уровня и сбросить финального Титана Пустоты за пределы арены
    в лаву.
  lose: Все комья игрока выбиты врагами за борт арены в раскаленную магму либо уничтожены
    до завершения таймера волны.
  difficulty_curve: 'Пошагово нарастающая эскалация: Волна 1 (простая разминка, знакомство
    с импульсом слияния) -> Волна 2 (сужение арены на 25%, появление быстрых и прыгающих
    мутантов) -> Волна 3 (экстремальная теснота ринга, появление бронированных таранов
    и финального титана-босса).'
mechanics:
  kinetic_strike_merge:
    name: kinetic_strike_merge
    parameters:
      porog_skorosti_dlya_sliyaniya_merge_velocity_thres:
        value: 1.2 м/с
        note: Если поднять до 3.5 м/с, комья начнут отскакивать друг от друга при
          мягких столкновениях, вызывая фрустрацию; если опустить до 0.1 м/с, случайные
          микрокасания в покое приведут к непреднамеренному мерджу без кинетического
          кайфа.
      dlitelnost_stop_kadra_kollizii_hit_stop_duration:
        value: 0.08 с
        note: Если увеличить до 0.25 с, игра покажется зависшей и дерганой; если убрать
          в 0.0 с, полностью исчезнет физическая весомость и акцент на сокрушительном
          моменте синтеза.
      bazovyy_radius_udarnoy_volny_t1_base_shockwave_rad:
        value: 2.4 м
        note: Если снизить до 1.0 м, волна не достанет даже вплотную стоящих врагов;
          если поднять до 5.0 м, игра превратится в однокнопочный тривиальный кликер
          без позиционной тактики.
      prirost_radiusa_volny_za_kazhdyy_tir_radius_step_p:
        value: 1.225 м
        note: Если уменьшить до 0.3 м, рост до титанов Т4/Т5 потеряет вау-эффект масштаба;
          если поднять до 2.5 м, Т4 покроет всю арену целиком, сломав челлендж сужения
          ринга.
      bazovyy_radialnyy_impuls_volny_base_shockwave_impu:
        value: 280.0 Н·с
        note: Если снизить до 100 Н·с, тяжелые враги даже не пошатнутся; если поднять
          до 800 Н·с, первичное слияние Т1 будет выбрасывать боссов с ринга с одного
          касания.
  slingshot_fling:
    name: slingshot_fling
    parameters:
      maksimalnaya_distantsiya_natyazheniya_max_drag_dis:
        value: 4.0 м
        note: Если увеличить до 8.0 м, вектор натяжения выйдет за границы экрана мобильного
          устройства; если снизить до 1.5 м, игрок потеряет точность тонкого контроля
          силы броска.
      mnozhitel_skorosti_zapuska_fling_speed_multiplier:
        value: 5.5 (м/с)/м
        note: При натяжении 4.0 м дает скорость 22.0 м/с. Если поднять выше 8.0, комья
          превратятся в неуправляемые гиперзвуковые пули; если опустить ниже 3.0,
          броски будут вялыми и не пробьют строй орды.
      vremya_statusa_tyazhelyy_taran_heavy_ram_duration:
        value: 0.65 с
        note: Если снизить до 0.2 с, ком потеряет пробивной импульс при первом же
          столкновении с легким врагом; если увеличить до 2.0 с, ком станет неуязвимым
          катком, игнорирующим сопротивление среды.
      koeffitsient_treniya_o_plity_areny_linear_drag_coe:
        value: 0.85 1/с
        note: Если снизить до 0.2, комья будут скользить как по льду и бесконтрольно
          падать в лаву; если поднять до 2.5, ком будет останавливаться через метр
          после запуска.
      mertvaya_zona_zahvata_ukazatelem_pointer_deadzone:
        value: 0.15 м
        note: Если уменьшить до 0.02 м, любой случайный клик превратится в паразитный
          микро-швырок; если поднять до 0.6 м, управление покажется ватным и неотзывчивым.
  jaws_kinetic_chomping:
    name: jaws_kinetic_chomping
    parameters:
      ugol_raskrytiya_konusa_ataki_chelyustey_jaw_cone_a:
        value: 70.0 градусов
        note: Если расширить до 140 градусов, отпадает необходимость позиционирования
          пасти; если сузить до 25 градусов, попасть по подвижным прыгунам на тачскрине
          станет невозможно.
      bazovaya_dalnost_ukusa_t1_base_bite_reach:
        value: 2.2 м
        note: Если уменьшить до 1.0 м, враги успеют нанести урон комку до срабатывания
          челюстей; если увеличить до 4.5 м, атака превратится в дальнобойное оружие,
          ломающее ближний бой.
      vektornyy_impuls_vytalkivaniya_jaw_knockback_impul:
        value: 350.0 Н·с
        note: Если снизить до 120 Н·с, челюсть не сможет остановить бегущего таранщика;
          если поднять до 900 Н·с, челюсть обесценит слияние как источник ринг-аутов.
      dlitelnost_oglusheniya_vragov_stun_duration:
        value: 0.45 с
        note: Если поднять до 1.5 с, враги станут беспомощными мишенями; если опустить
          до 0.1 с, враги по инерции продолжат сдвигать ком игрока к краю лавы.
      vremya_perezaryadki_chelyustey_chomp_cooldown:
        value: 2.2 с
        note: Если снизить до 0.5 с, возникнет имбалансный спам кликами по экрану;
          если поднять до 6.0 с, игроки перестанут рассчитывать на челюсти в критических
          клинчах.
  magma_ring_fracture:
    name: magma_ring_fracture
    parameters:
      nachalnyy_diametr_bazaltovoy_areny_initial_arena_d:
        value: 24.0 м
        note: Если увеличить до 40.0 м, бой станет затянутым и вялым, враги будут
          слишком долго бежать до игрока; если уменьшить до 14.0 м на старте, новичок
          упадет в лаву на первых 5 секундах.
      minimalnyy_diametr_yadra_areny_final_core_diameter:
        value: 13.5 м
        note: Если уменьшить до 6.0 м, крупные титаны Т4/Т5 (радиус 2.4 м) не поместятся
          на ринге; если оставить 19.0 м, в финале волны не возникнет чувства пиковой
          клаустрофобии.
      vremya_preduprezhdayuschego_rastreskivaniya_warnin:
        value: 3.0 с
        note: Если снизить до 0.8 с, игрок не успеет физически среагировать и эвакуировать
          комья швырком; если растянуть до 7.0 с, угроза обрушения перестанет мотивировать
          двигаться.
      interval_obrusheniya_sektorov_sector_collapse_inte:
        value: 20.0 с
        note: Если частить каждые 8 с, арена исчезнет до того, как игрок синтезирует
          ком Т3; если растянуть до 45 с, динамика 60-секундной волны будет потеряна.
      impuls_vytalkivaniya_magmaticheskogo_vspleska_magm:
        value: 500.0 Н·с
        note: Если снизить до 50 Н·с, гибель врагов в лаве будет визуально незаметным
          падением; если поднять до 2000 Н·с, упавшие враги будут комично вылетать
          обратно на ринг.
