  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
gameplay_systems:
- name: Система динамического шторма и ветрового сноса
  purpose: Моделирование аэродинамического воздействия урагана на траектории стрельбы
    и полет обломков
  input: Вектор скорости поезда (200-250 км/ч), текущий азимут и порывы ветра (15-50
    м/с)
  rules:
  - Ветровой снос пропорционален квадрату расстояния до цели и силе бокового шквала
  - Шторм усиливается по мере продвижения от вагона 1 к локомотиву
  state:
  - 'wind_speed: float (м/с)'
  - 'wind_direction: Vector3'
  - 'gust_intensity: float (0..1)'
  - 'lightning_timer: float (с)'
  interactions: Смещает траекторию лучевого импульса карабина и физических снарядов
    дронов
  feedback: Изгиб дуги прицела на визоре, анимация капель дождя, свист ветра в аудиоканале
  edge_cases:
  - При нулевой скорости ветра маркер совпадает с центром прицела
  - При урагане свыше 45 м/с прицел получает визуальную пульсацию турбулентности
- name: Система стайного ИИ и процедурного кинематического роя
  purpose: Организация скоординированных атак воздушных звеньев с выраженными лидерами
  input: Позиция поезда, таймлайн рейда, текущая фаза шторма
  rules:
  - Ведомые дроны держат дистанцию 3-5 метров от лидера по алгоритму Boids
  - Уничтожение лидера вызывает цепной импульс с радиусом поражения 8.5 метров
  state:
  - 'swarm_formation: enum (V-Shape, Echelon, Dive-Bomb)'
  - 'active_drones_count: int'
  - 'squad_leader_id: string'
  interactions: Управляет формациями атакующих звеньев, передает триггеры урона и
    цепной детонации
  feedback: Световые маяки на корпусах дронов, групповые маневры с наклоном крыльев,
    звуки турбин
  edge_cases:
  - Если уничтожены все ведомые до лидера, лидер переходит в режим яростной таранной
    атаки
  - При разрыве дистанции более 100 метров рой перегруппировывается в новый эшелон
- name: Система физических обломков и набегающего потока
  purpose: Генерация опасных горящих фрагментов на крыше вагона, летящих навстречу
    игроку
  input: Координаты уничтоженных дронов, скорость поезда, вектор взрывного импульса
  rules:
  - Каждый сбитый дрон порождает 1-3 обломка с набегающей скоростью 55-75 м/с
  - Обломки распределяются по трем линиям крыши (Left / Center / Right)
  state:
  - 'active_debris_list: Array<DebrisItem>'
  - 'roof_hazard_zones: Bitmask (L/C/R)'
  interactions: Наносит урон энергощиту игрока и сбивает прицел при прямом столкновении
  feedback: Огненный хвост, снопы искр, предупреждающий маркер DANGER на визоре, звук
    ВУУШ
  edge_cases:
  - Обломок, пролетающий мимо вагона, падает в бездну без создания угрозы игроку
  - Два обломка на одной полосе сливаются в один крупный кинетический фрагмент
- name: Система комбо-конденсатора и тесла-энергии
  purpose: Поощрение серий точных попаданий и предоставление мощного тактического
    супероружия
  input: События попадания по упреждающему маркеру, клики активации перегрузки
  rules:
  - 5 точных попаданий по упреждению подряд дают 100% заряд конденсатора
  - Активация высвобождает 0.85-секундный луч сплошной цепной молнии
  state:
  - 'capacitor_charge: float (0..100%)'
  - 'combo_multiplier: float (1.0..4.0)'
  - 'is_overcharge_ready: boolean'
  interactions: Увеличивает множитель очков (до x4) и дает доступ к лучу Тесла-Перегрузки
  feedback: Пульсация бирюзового кольца вокруг прицела, нарастающий гул тесла-катушек
  edge_cases:
  - Промах сбрасывает серию попаданий, но не обнуляет накопленную энергию конденсатора
  - При 100% заряде включается таймер овердрайва на 10 секунд
- name: Система бесконечного процедурного окружения и параллакса поезда
  purpose: Создание гиперреалистичного ощущения непрерывного движения на скорости
    200+ км/ч
  input: Скорость состава (200-250 км/ч), пройденное расстояние (0-180 м)
  rules:
  - Модули эстакады циклически перемещаются и респавнятся за спиной игрока
  - Камера получает физическую микро-вибрацию в зависимости от скорости и стыков рельсов
  state:
  - 'current_car_index: int (1..5)'
  - 'train_speed_kmh: float (200..250)'
  - 'track_offset_z: float'
  interactions: Формирует окружение и физическую привязку крыш 5 вагонов к мировым
    координатам
  feedback: Бегущие шпалы и рельсы, опоры эстакады, снопы искр из-под колес, наклон
    горизонта
  edge_cases:
  - При переходе между климатическими зонами плавно меняется туман и палитра неба
  - Межвагонные сцепки генерируют процедурные искры при вибрации колесных тележек
core_design:
  signature_moment: На 62-й секунде рейда на скорости 250 км/ч в кромешной тьме каньона
    вспышка молнии выхватывает летящего на таран тяжелого босса «Громовержец». Ты
    делаешь диагональный прыжок над бездной межвагонной сцепки, ловишь боковым зрением
    смещение динамической ветровой метки на 42 пикселя вправо под порывом урагана
    в 50 м/с, производишь выстрел из перегруженного тесла-карабина точно в упреждающую
    точку энергоядра босса. В момент взрыва босса на куски срывает 300-килограммовую
    пылающую турбину, которая летит в замедленном времени прямо в лицо, и ты на долю
    секунды приседаешь в контр-стрейфе на мокром левом скосе крыши вагона над пропастью
    под грохот грома и сноп искр.
  genre_template_rejected: Отвергнут шаблон классического рельсового кавер-шутера
    (Time Crisis) и автобатлера/рогалика с паузами на выбор карт перков (Vampire Survivors-like).
    В стационарных тирах игрок статичен и стреляет хитсканом без учета физики среды,
    а в рогаликах динамика ломается экранами выбора улучшений. Здесь игра — непрерывный
    85-секундный кинетический спринт на крыше поезда, где баллистика карабина жестко
    завязана на аэродинамику шторма (ветер 15–50 м/с сдувает трассеры и обломки),
    а перемещение по трем линиям настила крыши является непрерывным уклонением от
    физических горящих обломков сбитых дронов.
  what_makes_it_different: 'В отличие от обычных скоростных шутеров, где прицел всегда
    совпадает с центром экрана, в «Штормовом Экспрессе» прицельная сетка непрерывно
    деформируется динамическим вектором ветрового сноса (от 15 до 50 м/с) и вибрацией
    поезда (3.2–6.8 Гц). Каждое уничтожение дрона порождает не просто взрыв, а физическое
    препятствие на крыше: горящие обломки сдувает набегающим потоком 200 км/ч прямо
    на игрока. Таким образом, меткая стрельба мгновенно создает кинетическую опасность
    под ногами, требуя непрерывного ритма: ''Упреждающий выстрел -> Каскад -> Мгновенный
    контр-стрейф -> Прыжок над сцепкой''.'
  micro_loop:
  - step: Оценка штормового сноса и траектории дрона
    player_action: Визуальное сопоставление маркера вектора ветра на визоре (смещение
      12–40 px) с траекторией пикирующего лидера роя.
    game_response: Дроны покачиваются на ветру, динамическая ветровая риска HUD вибрирует
      с частотой качки поезда (4.5 Гц).
    decision: Стрелять одиночным выстрелом по лидеру с поправкой или копить позицию
      для более чистой траектории.
    duration: 0.2–0.4 с
  - step: Спуск электромагнитного курка с упреждением
    player_action: Спуск электромагнитного курка (ЛКМ / тап огня) с выносом прицела
      на опережение траектории цели.
    game_response: Мгновенный вылет импульсного снаряда (скорость 450 м/с), световой
      трассер искривляется под действием бокового ветра.
    decision: Оставаться на текущей полосе настила крыши или заранее готовить стрейф
      в безопасный сектор.
    duration: 0.1–0.2 с
  - step: Цепная детонация звена и выброс обломков
    player_action: Фиксация попадания по лидеру и перевод взгляда на летящие навстречу
      горящие обломки.
    game_response: Лидер взрывается ослепительной вспышкой, ЭМИ-дуга разрывает 2 ведомых
      дрона; оторванная турбина с пламенем сносится набегающим потоком 210 км/ч по
      центральной полосе крыши.
    decision: 'Определить траекторию обломка (левая, центральная или правая линия)
      и выбрать метод уклонения: стрейф влево/вправо или подкат.'
    duration: 0.3–0.6 с
  - step: Контр-стрейф и уклонение на мокрой крыше
    player_action: Нажатие клавиш A/D или горизонтальный свайп для рывка на соседнюю
      полосу настила крыши вагона.
    game_response: Магнитные ботинки с искрами срываются и фиксируют стрелка на левом
      скосе крыши; горящая турбина со свистом пролетает в 0.3 м от визора.
    decision: Сохранять равновесие на краю вагона (риск сдувания) или немедленно возвращаться
      к центру для подготовки к прыжку через сцепку.
    duration: 0.3–0.5 с
  meso_loop:
  - step: Зачистка настила вагона от штурмового звена
    player_action: Последовательное уничтожение 2–3 формаций дронов (по 3 дрона в
      каждой), удержание стрейфа между выступами крыши вагона.
    game_response: Счетчик комбо растет от x1 до x3, скорость поезда ступенчато нарастает
      на +15 км/ч, плотность дождя и частота молний усиливаются.
    decision: Разрядить накопленный x3 тесла-заряд сейчас на тяжелого перехватчика
      или сохранить для гарантированного уничтожения босса на локомотиве.
    duration: 12–18 с
  - step: Подход к межвагонному разрыву и преодоление сцепки
    player_action: Тайминговый разбег и прыжок (Пробел / свайп вверх) через 3.5-метровый
      разрыв между вагонами над несущимися рельсами.
    game_response: Грохот сцепки, камера совершает вертикальный бросок с размытием
      движения, набегающий ветер пытается замедлить полет персонажа.
    decision: Стрелять в воздухе по пикирующим дронам ради бонусных очков перехвата
      или сосредоточиться на точном приземлении на безопасную полосу.
    duration: 1.5–2.5 с
  - step: Фиксация на новом вагоне и смена погодного давления
    player_action: Приземление магнитных подошв на сталь следующего вагона и мгновенная
      перекалибровка прицела.
    game_response: Звуковой щелчок захвата магнитов, HUD кратковременно глитчит от
      статического электричества, сила ветра скачкообразно меняет направление.
    decision: Оценить новую расстановку препятствий на крыше (рефрижераторные люки,
      антенны связи) и перестроиться под новый вектор сноса.
    duration: 2.0–4.0 с
  macro_loop:
  - step: Штурмовой рейд от хвостового вагона до локомотива
    player_action: Прохождение 85-секундного линейного рейда через 5 вагонов, уничтожение
      24+ дронов эскадрильи и разрушение энергоядра босса.
    game_response: Кульминационный взрыв босса «Громовержец», бронепоезд пробивает
      штормовой фронт и въезжает в защищенный туннель; экран итогов с подсчетом точности
      упреждения и комбо.
    decision: Анализировать персональный рекорд, сравнивать время и точность в мировой
      таблице лидеров Playgama Bridge.
    duration: 85 с (забег)
  - step: Получение наград и энергочипов Буревестника
    player_action: Сбор начисленных вольт-очков за чистоту уклонений и серии цепных
      детонаций.
    game_response: Разблокировка новых оптических визоров (ветровые сетки с термографией,
      компенсаторы качки) и неоновых гальванических скинов карабина «Шквал-4».
    decision: 'Выбрать специализированный визор под следующий забег: с расширенным
      углом прогноза ветра или с подсветкой энергоядер сквозь дым.'
    duration: 15–30 с
  - step: Рестарт с модификацией тактики и борьба за лидерборд
    player_action: Запуск нового штурма с экипированным высокоточным визором «Циклон-Pro»
      для максимизации комбо x4.
    game_response: Мгновенный старт на крыше 5-го вагона с обновленной сеткой визора
      и целевыми ориентирами.
    decision: Идти на агрессивный скоростной рекорд без промахов или делать ставку
      на 100% зачистку всех ведомых обломков.
    duration: 5–10 с
  loop_diagram: "+-----------------------------------------------------------------------------------+\n\
    |                           ПЕТЛЯ ШТОРМОВОГО ПЕРЕХВАТА                       \
    \      |\n+-----------------------------------------------------------------------------------+\n\
    \                                        |\n      +---------------------------------+---------------------------------+\n\
    \      |                                                                   |\n\
    \      v                                                                   v\n\
    [1. ЧТЕНИЕ ВЕТРА И ВИБРАЦИИ]                                     [2. ТРЕКИНГ РОЯ\
    \ ДРОНОВ]\n* Вектор шквала (15-50 м/с)                                      *\
    \ Поиск дрона-лидера звена\n* Смещение динамической риски сетки              \
    \                 * Прогноз траектории пике\n      |                         \
    \                                          |\n      +---------------------------------+---------------------------------+\n\
    \                                        |\n                                 \
    \       v\n                       [3. ВЫСТРЕЛ ИЗ ТЕСЛА-КАРАБИНА]\n           \
    \            * Вынос перекрестья с упреждением\n                       * Попадание\
    \ в уязвимое энергоядро лидера\n                                        |\n  \
    \                                      v\n                    [4. ЦЕПНОЙ КАСКАДНЫЙ\
    \ ИМПУЛЬС (x3/x4)]\n                    * Детонация ведомых дронов формации\n\
    \                    * Зарядка комбо-накопителя карабина (+1 стак)\n         \
    \                               |\n                                        v\n\
    \                     [5. ВЫБРОС КИНЕТИЧЕСКИХ ОБЛОМКОВ]\n                    \
    \ * Турбины и лопасти летят на игрока (v=200 км/ч)\n                     * Визуальный\
    \ маркер траектории на настиле крыши\n                                       \
    \ |\n                                        v\n                    [6. КОНТР-СТРЕЙФ\
    \ ИЛИ ПОДСКОК НА КРЫШЕ]\n                    * Смена полосы (Левая / Центр / Правая)\n\
    \                    * Скольжение под низколетящей лопастью\n                \
    \                        |\n                                        v\n      \
    \             [7. ПРЕОДОЛЕНИЕ МЕЖВАГОННОЙ СЦЕПКИ]\n                   * Тайминг\
    \ прыжка над 3.5-метровым разрывом\n                   * Вход на следующий вагон\
    \ -> Ускорение поезда\n                                        |\n           \
    \                             v\n             +--------------------------+--------------------------+\n\
    \             |                                                     |\n    [Заряд\
    \ накоплен < 100%]                               [Заряд x4 ТЕСЛА-БУСТ]\n     \
    \        |                                                     |\n           \
    \  v                                                     v\n    (Возврат к шагу\
    \ 1)                             [8. РАЗРЯД СВЕРХПРОВОДНИКА]\n               \
    \                                    * Зачистка горизонта лучом молнии\n     \
    \                                              * Снятие брони босса «Громовержец»"
  tension_curve: 'Пилообразная гиперболическая кривая с 3 выраженными фазами и финальным
    крещендо: 0–20 с (Вагоны 1–2, Спокойный шквал): Напряжение 20% -> 40%. Скорость
    160 км/ч, ветер 15 м/с. Игрок осваивает ритм упреждения и стрейфа. Легкий подъем
    адреналина. 20–25 с (Сцепка 1): Микро-пик (55%) — первый прыжок над бездной. 25–50
    с (Вагоны 3–4, Штормовой фронт): Напряжение 50% -> 75%. Скорость 210 км/ч, ветер
    35 м/с. Появляются бронедроны, перекрестные траектории обломков, турбулентные
    порывы ветра каждые 3 секунды. Ошибки стрейфа срезают щит. 50–55 с (Сцепка 2):
    Высокий пик (80%) — прыжок сквозь облако искр с горящего вагона. 55–80 с (Локомотив,
    Эпицентр бури и Босс «Громовержец»): Предельное напряжение 85% -> 100%. Скорость
    250 км/ч, ветер 50 м/с, босс заграждает пол-экрана, запуская плазменные торпеды
    и срывая люки поезда. 80–85 с (Финал): Моментальный спад напряжения до 0% («катарсис»)
    при взрыве энергоядра босса, поезд въезжает в тихий залитый неоном туннель.'
  core_formulas:
  - WindDeflection_px = Clamp(((WindSpeed_ms * sin(WindAngle_rad) * TargetDistance_m)
    / BulletVelocity_ms) * ReticleScale_k, -120.0, 120.0), где BulletVelocity_ms =
    450.0 м/с, ReticleScale_k = 18.5
  - DamageDealt = BaseShotDamage (50.0) * PrecisionMultiplier (2.5 при попадании в
    окно ±4px упреждения, иначе 1.0) * TeslaComboMultiplier (1.0 + 0.5 * ComboTier)
  - DebrisRelativeSpeed_ms = TrainSpeed_ms (44.4..69.4 м/с) + WindSpeed_ms (15.0..50.0
    м/с) * 0.4 (навстречу игроку на скорости 180–320 км/ч)
  - JumpClearance_m = (JumpInitialVel_ms (6.5) * JumpTime_s) - (0.5 * Gravity_ms2
    (18.0) * JumpTime_s^2) - (HeadwindDrag_coeff (0.08) * WindSpeed_ms)
  - SessionScore = Sum(KillBaseScore * ComboMultiplier) + (TimeRemaining_s * 150)
    + (ShieldIntegrity_pct * 20)
  run_progression:
  - Зарядка Тесла-конденсатора рангами от Tier 0 до Tier 4 за каждые 3 последовательных
    попадания в центр упреждающего маркера без промахов.
  - 'Tier 1 (3 попадания): Скорость перезарядки конденсатора карабина +25%, трассеры
    подсвечивают вихревой коридор ветра на 1.5 с.'
  - 'Tier 2 (6 попаданий): Активация пассивного магнитного захвата крыши — сопротивление
    боковому сдуванию ветром увеличивается на 40%.'
  - 'Tier 3 (9 попаданий): Кинетический рикошет — выстрел по лидеру генерирует шоковую
    волну, замедляющую встречные обломки на 35%.'
  - 'Tier 4 (12 попаданий): Режим «Штормовой Индуктор» — накопленная энергия позволяет
    выпустить гиперболоидный разряд цепной молнии, мгновенно сжигающий всю формацию
    дронов или 35% запаса прочности босса.'
  meta_progression:
  - Разблокировка калибровочных оптических визоров (Визор «Норд-Ветрочет» — отображает
    точный коридор рассеивания пуль; Визор «Тесла-Спектр» — подсвечивает энергоядра
    сквозь дым и пламя).
  - 'Кастомизация экзоскелета стрелка и карабина «Шквал-4»: гальванические неоновые
    покрытия (Грозовой Лазурит, Вольфрамовый Закат), генерирующие кастомные шлейфы
    искр при стрейфе.'
  - 'Постоянные архивы тактических данных: разблокировка записей перехвата дронов
    и профилей уязвимостей эскадрильи «Громовержец».'
  - 'Глобальная рейтинговая таблица Playgama Bridge: фиксация мировых рекордов по
    скоростному прохождению рейса (Time Attack) и максимальному набору очков зачистки
    (Score Attack).'
  mechanics:
  - name: Динамический ветровой прицел «Штормовое Упреждение»
    role_in_loop: 'Двигатель точности и источник риска: заставляет игрока постоянно
      рассчитывать траекторию пули в условиях ураганного сноса и вибрации настила.'
    player_decision: Стрелять немедленно с приблизительным выносом по дуге сноса или
      дождаться стабилизации порыва ветра ради гарантированного критического попадания
      в энергоядро.
    input_mapping: Мышь (Aim) / Сенсорный свайп в правой половине экрана — наведение
      прицела; ЛКМ / Кнопка огня на таче — импульсный выстрел.
    states:
    - 'State 1: Калибровка потока (сенсоры визора считывают вектор набегающего ветра
      15–50 м/с и рассчитывают отклонение)'
    - 'State 2: Захват упреждающей дуги (игрок совмещает перекрестье с динамической
      точкой упреждения дрона)'
    - 'State 3: Импульсный выстрел (электромагнитный разгон пули 450 м/с с физическим
      сносом по параболе ветра)'
    - 'State 4: Термальный кулдаун карабина (0.22 с блокировки курка перед следующим
      выстрелом)'
    parameters:
    - name: Скорость полета пули
      value: 450.0 м/с
      tuning_note: Если увеличить выше 600 м/с, стрельба превратится в бездумный хитскан
        и исчезнет ощущение борьбы со штормом; если снизить ниже 300 м/с, попадать
        на скорости поезда 200 км/ч станет физически невозможно.
    - name: Базовый ветровой снос пули
      value: 0.42 м на каждые 10 м/с ветра на дистанции 50 м
      tuning_note: Если увеличить снос, прицел будет улетать за край экрана при 50
        м/с шторма; если уменьшить, игрок перестанет обращать внимание на динамическую
        шкалу визора.
    - name: Амплитуда вибрации прицела от поезда
      value: 3.5 px на частоте 5.2 Гц
      tuning_note: Если поднять выше 7 px, прицеливание вызовет укачивание и фрустрацию;
        если отключить, потеряется физическое ощущение нахождения на крыше мчащегося
        состава.
    - name: Темп стрельбы карабина
      value: 4.5 выстр/с (интервал 0.22 с)
      tuning_note: При интервале < 0.12 с стрельба превращается в спам без оценки
        упреждения; при > 0.4 с промах наказывает слишком жестко в 80-секундном рейде.
    feedback_layers:
    - 'Визуал/VFX: Яркий ионизированный голубой трассер, изгибающийся по дуге ветра;
      сноп искр из дульного компенсатора, сдуваемый назад; динамическое кольцо упреждения
      на визоре меняет цвет с оранжевого на неоново-бирюзовый при идеальном совпадении.'
    - 'Звук (Web Audio): Сухой металлический щелчок электромагнитного соленоида с
      последующим хлестким ультразвуковым хлопком разрыва воздуха; нарастающий свист
      ветра в микрофоне шлема при усилении порыва.'
    - 'Камера (импульс/зум): Мгновенная микро-отдача камеры назад на 0.04 м с легким
      поворотом по оси Z на 0.8 градуса; динамический FOV сжимается с 75° до 71° при
      зажатии прицеливания.'
    - 'UI/Тактильность: Гаптический виброотклик (25 мс) на мобильных устройствах при
      спуске; мигание индикатора «LOCK» на шкале углового упреждения.'
    failure_mode: 'Игрок стреляет прямо в силуэт дрона без учета ветра: трассер уносит
      в сторону, пуля взрывает воздух позади цели, на визоре мигает красный маркер
      сноса «WIND MISS» с указанием ошибки в метрах.'
    mastery_curve: Новичок на 30-й секунде судорожно пытается поймать дрон центром
      экрана и мажет 60% выстрелов; эксперт на 10-м забеге мгновенно читает вектор
      ветра по косым струям дождя и сбивает маневрирующих дронов с первого выстрела
      на упреждение.
    counterplay: Дроны выполняют резкие штормовые бочки и противозенитные маневры
      каждые 1.8 с; турбулентные порывы ветра каждые 3.5 с мгновенно сдвигают точку
      упреждения на 25–40 пикселей.
    synergies:
    - 'Прямая синергия с «Цепной кинетической детонацией»: точное попадание с первого
      раза активирует максимальный множитель взрыва роя.'
    - 'Синергия с «Тесла-перегрузкой карабина»: серии точных попаданий по упреждению
      в 2 раза быстрее заполняют батарею индукционного луча.'
    why_unique: В большинстве FPS прицел жестко привязан к центру камеры; здесь сетка
      живая, ее кривизна физически рассчитывается от трехмерного вектора ураганного
      ветра и скорости поезда в реальном времени Three.js.
    pseudocode: "function updateAimAndShoot(dt, input, windVector, trainSpeed, reticle)\
      \ {\n  const trainJitter = Math.sin(time * 32.7) * 3.5 * (trainSpeed / 60.0);\n\
      \  const leadOffset = calculateWindDeflection(windVector, trainSpeed, 50.0);\n\
      \  reticle.position.set(input.aimX + leadOffset.x + trainJitter, input.aimY\
      \ + leadOffset.y);\n  if (input.firePressed && weapon.cooldownTimer <= 0) {\n\
      \    weapon.cooldownTimer = 0.22;\n    const bullet = spawnProjectile(player.muzzlePos,\
      \ reticle.worldTarget, 450.0, windVector);\n    triggerAudio(\"rail_shot\",\
      \ { pitch: 1.0 + Math.random() * 0.1 });\n    applyCameraKickback(0.04, 0.8);\n\
      \  }\n}"
  - name: Цепная кинетическая детонация звеньев «Лидер Роя»
    role_in_loop: 'Главный мультипликатор темпа и эффективности: превращает одиночные
      меткие выстрелы в массовую зачистку неба и генератор комбо.'
    player_decision: Тратить время на выцеливание защищенного лидера формации сквозь
      помехи или отстреливать близких ведомых дронов по одному для снижения сиюминутной
      угрозы.
    input_mapping: Наведение взгляда/прицела на золотистое энергоядро дрона-командира
      (выделено шевроном на HUD) + спуск курка (ЛКМ / Fire Button).
    states:
    - 'State 1: Формирование звена (дрон-лидер ведет 2–3 ведомых дронов в клиновидном
      строю)'
    - 'State 2: Критический пробой ядра (попадание по уязвимой точке лидера инициирует
      ЭМИ-перегрузку)'
    - 'State 3: Каскадная дуга (электрический разряд перескакивает на ведомых в радиусе
      14 метров за 0.08 с)'
    - 'State 4: Разлет кинетических обломков (корпуса взрываются, тяжелые фрагменты
      выбрасываются в поток поезда)'
    parameters:
    - name: Радиус цепного ЭМИ-захвата
      value: 14.0 м
      tuning_note: Если уменьшить до < 8 м, строй дронов будет слишком часто распадаться
        без детонации ведомых; если увеличить до > 25 м, один случайный выстрел будет
        зачищать весь экран.
    - name: Задержка каскадной дуги между дронами
      value: 0.08 с на звено
      tuning_note: Если сделать мгновенной (0.0 с), игрок не успеет насладиться зрелищем
        бегущей молнии; если растянуть до > 0.25 с, темп боя просядет и обломки прилетят
        с задержкой.
    - name: Множитель очков за цепной каскад
      value: x2 за первого ведомого, x3 за второго, x4 за полное звено
      tuning_note: Мотивирует игрока охотиться исключительно за лидерами формаций
        ради верхних строчек лидерборда Playgama Bridge.
    - name: Шанс генерации тяжелого обломка с лидера
      value: 100% (1 горящая турбина или винт на каждую формацию)
      tuning_note: 'Гарантирует прямую причинно-следственную связь: каждая успешная
        атака в воздухе немедленно создает физический вызов под ногами на крыше.'
    feedback_layers:
    - 'Визуал/VFX: Ярко-золотой взрыв ядра лидера с выбросом ветвящихся дуговых молний
      к ведомым; ведомые дроны раскалываются на горящие каркасы с густым дымным шлейфом,
      сдуваемым ветром назад.'
    - 'Звук (Web Audio): Низкочастотный басовый бум разрушения ядра (60 Гц) с последующим
      высокочастотным треском электрического каскада (''бззз-клак-клак'').'
    - 'Камера (импульс/зум): Радиальный микро-blur (Radial Blur 0.15 с) с кратковременным
      замедлением времени (Hitstop 45 мс) в момент гибели всего звена.'
    - 'UI/Тактильность: Всплывающий комбо-индикатор ''CHAIN BREAK x3!'' с золотым
      свечением; серия из трех плотных вибро-импульсов на смартфоне.'
    failure_mode: 'Игрок стреляет в ведомого дрона вместо лидера: ведомый погибает
      в одиночку без цепной реакции, дрон-лидер активирует защитный маневр и выпускает
      залп плазмоидов по крыше вагона.'
    mastery_curve: Новичок палит во все подряд и тратит 4–5 патронов на звено; мастер
      с одного выстрела срезает лидера на предельной дистанции в 80 метров, запуская
      мгновенный каскад и очищая небосвод.
    counterplay: Дроны-ведомые периодически перекрывают корпус лидера собственными
      бронещитками; в штормовых порывах строй растягивается, требуя точного момента
      сближения.
    synergies:
    - 'Синергия с «Контр-стрейфом»: направление разлета горящих обломков зависит от
      точки взрыва, вынуждая игрока заранее готовить уклонение.'
    - 'Синергия с «Тесла-перегрузкой»: каждый каскадный взрыв моментально восполняет
      25% энергии суперразряда.'
    why_unique: Каскад не просто очищает экран (как обычный smart bomb), а физически
      рождает падающие горящие препятствия, связывая меткость шутера с механикой бега
      по полосам крыши.
    pseudocode: "function onProjectileHitEnemy(projectile, targetDrone, swarmList)\
      \ {\n  if (targetDrone.isLeader) {\n    triggerHitstop(0.045);\n    createShockwaveVFX(targetDrone.position,\
      \ \"gold_lightning\");\n    const subordinates = swarmList.filter(d => d.leaderId\
      \ === targetDrone.id && d.pos.distanceTo(targetDrone.pos) <= 14.0);\n    subordinates.forEach((drone,\
      \ idx) => {\n      scheduleChainExplosion(drone, idx * 0.08);\n    });\n   \
      \ spawnDebrisObstacle(targetDrone.position, player.trainCarriageLane);\n   \
      \ addTeslaCharge(25);\n    triggerComboUI(subordinates.length + 1);\n  }\n}"
  - name: Трехполосный контр-стрейф и скольжение «Магнитный Зацеп»
    role_in_loop: 'Главный источник риска и позиционный тормоз: обеспечивает физическое
      выживание стрелка среди потока препятствий и набегающего ветра 200 км/ч.'
    player_decision: Остаться на центральной полосе крыши для идеального обзора или
      сместиться на опасный край вагона ради уклонения от горящей турбины ценой риска
      быть сдутым штормом.
    input_mapping: 'Клавиатура: A/D (влево/вправо) — переключение полос настила, S
      / Пробел (вниз/присед) — скольжение; Сенсор: Горизонтальные свайпы влево/вправо
      — смена полосы, Свайп вниз — подкат.'
    states:
    - 'State 1: Магнитная фиксация (ботинки примагничены к стальному настилу, сопротивление
      сдуванию 100%)'
    - 'State 2: Боковой импульсный стрейф (разрыв магнитов, перелет на соседнюю полосу
      за 0.16 с)'
    - 'State 3: Скольжение под настилом (присед на 0.45 с для пропуска высоколетящих
      обломков)'
    - 'State 4: Балансировка на скосе (нахождение на крайней левой/правой полосе с
      риском срыва при боковом порыве ветра)'
    parameters:
    - name: Время перестроения между полосами настила
      value: 0.16 с
      tuning_note: Если сделать медленнее (> 0.28 с), игрок физически не успеет уклониться
        от обломка, летящего на 210 км/ч; если сделать быстрее (< 0.08 с), пропадет
        ощущение массы и инерции тяжелой брони.
    - name: Ширина крыши вагона (3 полосы)
      value: '3.6 м (по 1.2 м на полосу: Левая, Центр, Правая)'
      tuning_note: 'Идеально масштабируется под Three.js камеру от 1-го лица: обеспечивает
        четкую трехполосную читаемость без потери обзора неба.'
    - name: Урон от столкновения с обломком
      value: 50% энергощита (2 столкновения = гибель)
      tuning_note: Делает каждое уклонение критически важным, не допуская безнаказанного
        спама стрельбы без оглядки на крышу.
    - name: Длительность окна скольжения (Slide)
      value: 0.45 с (кулдаун 0.6 с)
      tuning_note: Предотвращает бесконечное сидение в приседе, заставляя игрока точно
        ловить момент пролетающих над головой винтов.
    feedback_layers:
    - 'Визуал/VFX: Фонтан оранжевых и синих искр из-под магнитных подошв при каждом
      рывке; капли дождя на визоре рассекаются встречным потоком; красные проекционные
      линии настила вагона подсвечивают занятую полосу.'
    - 'Звук (Web Audio): Тяжелый лязг смыкания электромагнитов о сталь вагона (''кланк-тссс'');
      скрежет металла обломка, проносящегося в сантиметрах от уха с эффектом Доплера.'
    - 'Камера (импульс/зум): Резкий горизонтальный наклон камеры (Roll на 4.2 градуса)
      в сторону стрейфа с быстрым возвратом; вертикальное проседание камеры на 0.6
      м во время скольжения.'
    - 'UI/Тактильность: Направленный вибро-щелчок влево/вправо в руках игрока; индикатор
      позиции на нижнем крае визора (3 сегмента полос).'
    failure_mode: 'Игрок не успевает сменить полосу: обломок турбины врезается в корпус,
      экран вспыхивает красными помехами, щит визора трескается и теряет 50% прочности,
      персонажа отбрасывает назад на 1.5 м.'
    mastery_curve: Новичок мечется между полосами и падает на скосах крыши; ветеран
      исполняет микро-стрейфы в последний момент (Just-in-Time Dodge), получая бонус
      к подзарядке тесла-карабина.
    counterplay: 'Обломки летят сдвоенными линиями (например, Центр + Левая полоса),
      заставляя игрока мгновенно принимать решение: уходить вправо или скользить по
      центру.'
    synergies:
    - 'Синергия со «Штормовым Упреждением»: во время стрейфа прицел испытывает дополнительное
      инерционное смещение, проверяя навык компенсации движения.'
    - 'Синергия с «Прыжком через сцепки»: правильный выбор полосы перед концом вагона
      определяет точность попадания на следующий вагон.'
    why_unique: 'В отличие от бесконечных раннеров, где стрейф изолирован, здесь уклонение
      синхронизировано с видом от первого лица и стрельбой: игрок целится в небо,
      одновременно контролируя ногами настил.'
    pseudocode: "function updatePlayerMovement(dt, input, currentLane, obstaclesOnRoof)\
      \ {\n  if (input.strafeLeft && currentLane > -1 && player.strafeTimer <= 0)\
      \ {\n    currentLane -= 1;\n    player.strafeTimer = 0.16;\n    triggerMagneticStepFX(-1);\n\
      \    applyCameraRoll(-4.2);\n  } else if (input.strafeRight && currentLane <\
      \ 1 && player.strafeTimer <= 0) {\n    currentLane += 1;\n    player.strafeTimer\
      \ = 0.16;\n    triggerMagneticStepFX(1);\n    applyCameraRoll(4.2);\n  }\n \
      \ checkRoofCollisions(player.position, currentLane, player.isSliding, obstaclesOnRoof);\n\
      }"
  - name: Тесла-перегрузка карабина «Индукционный Залп»
    role_in_loop: 'Источник наивысшей награды и кульминационный инструмент: вознаграждает
      идеальную серию попаданий возможностью мгновенной аннигиляции элитных угроз
      и босса.'
    player_decision: Использовать накопленный разряд немедленно для спасения от плотной
      волны дронов или беречь максимальный 4-й уровень заряда для уязвимой фазы энергоядра
      босса.
    input_mapping: ПКМ / Двойной тап двумя пальцами / Кнопка «OVERLOAD» на мобильном
      интерфейсе — активация луча молнии.
    states:
    - 'State 1: Аккумуляция (накопление 0–100% энергии за счет точных выстрелов и
      идеальных уклонений)'
    - 'State 2: Готовность катушек (карабин раскаляется, дульные электроды потрескивают
      шаровыми молниями)'
    - 'State 3: Гиперболоидный разряд (непрерывный луч цепной плазмы в течение 2.2
      с с автозахватом целей в секторе 40°)'
    - 'State 4: Продувка радиаторов (0.8 с охлаждения с падением скорости ходьбы на
      20%)'
    parameters:
    - name: Емкость тесла-конденсатора
      value: 100 единиц (4 стака по 25 ед)
      tuning_note: Заполняется за 4 сбитых звена дронов или 12 идеальных попаданий
        по упреждению, давая ровно 2–3 активации за 85-секундный рейд.
    - name: Длительность луча перегрузки
      value: 2.2 с
      tuning_note: Если длительность > 3.5 с, игра теряет напряжение и превращается
        в кино; если < 1.2 с, игрок не успевает провести лучом по нескольким целям.
    - name: Суммарный урон луча
      value: 600 ед/с (сжигает тяжелого дрона за 0.3 с, снимает 35% HP босса за полный
        залп)
      tuning_note: Идеально сбалансировано под 3-фазовую структуру босса «Громовержец».
    - name: Сектор автозахвата молний
      value: 40 градусов перед стволом
      tuning_note: Дает игроку почувствовать сокрушительную мощь оружия, временно
        освобождая от необходимости ювелирного расчета ветра.
    feedback_layers:
    - 'Визуал/VFX: Ослепительный толстый ветвящийся бирюзово-белый луч молнии, прожигающий
      грозовое небо; экран заливает объемным светом (Bloom); от пораженных целей разлетаются
      снопы белых плазменных искр.'
    - 'Звук (Web Audio): Нарастающий гул тесла-трансформатора с переходом в оглушительный
      непрерывный треск сверхмощного электрического дугового разряда; приглушение
      звуков ветра на время залпа.'
    - 'Камера (импульс/зум): Непрерывный низкоамплитудный шейк (Perlin Shake 2.2 с);
      плавный наезд камеры вперед (FOV 75° -> 82°) создающий ощущение колоссальной
      кинетической тяги.'
    - 'UI/Тактильность: Пульсирующая вибрация смартфона максимальной интенсивности;
      круговая шкала заряда карабина вспыхивает неоном с надписью «OVERLOAD ACTIVE».'
    failure_mode: 'Активация луча в момент, когда босс выставил кинетический отражающий
      щит: разряд поглощается без урона, а игрок оказывается в фазе продувки радиаторов
      прямо перед залпом ракет.'
    mastery_curve: Новичок сливает заряд на одиночных рядовых дронов в первой трети
      игры; эксперт копит заряд до фазы локомотива и срезает им ракетный залп босса
      одновременно с прожигом его главного ядра.
    counterplay: Босс «Громовержец» выпускает тепловые ловушки и ставит призматический
      барьер, требующий перевода луча на вспомогательные генераторы.
    synergies:
    - 'Синергия со всеми боевыми механиками: является финальной кульминационной точкой
      боевой петли, замыкая цепочку комбо.'
    why_unique: 'Луч цепной молнии физически взаимодействует с грозовой бурей: во
      время удара молнии в небе мощность луча спонтанно подскакивает на +50% (механика
      природного резонанса).'
    pseudocode: "function updateTeslaOverload(dt, input, energyLevel, targetsInView)\
      \ {\n  if (input.altFire && energyLevel >= 100 && !weapon.isOverloading) {\n\
      \    weapon.isOverloading = true;\n    weapon.overloadDuration = 2.2;\n    energyLevel\
      \ = 0;\n    triggerAudio(\"tesla_beam_start\");\n  }\n  if (weapon.isOverloading)\
      \ {\n    weapon.overloadDuration -= dt;\n    renderLightningBeam(player.muzzlePos,\
      \ 40.0, targetsInView);\n    applyDamageToEnemiesInCone(600.0 * dt, 40.0);\n\
      \    applyContinuousCameraShake(0.02);\n    if (weapon.overloadDuration <= 0)\
      \ weapon.isOverloading = false;\n  }\n}"
  - name: Инерционный прыжок через межвагонные сцепки
    role_in_loop: 'Пространственный транзишен и пиковый модификатор риска: связывает
      вагоны в единую трассу и тестирует тайминг в условиях ураганного сопротивления
      воздуха.'
    player_decision: Прыгнуть точно с края вагона для максимальной дальности полета
      или совершить ранний прыжок с последующей корректировкой посадки на крайнюю
      полосу.
    input_mapping: 'Клавиатура: Пробел (Jump) при приближении к маркеру сцепки; Сенсор:
      Свайп вверх в зоне движения.'
    states:
    - 'State 1: Разгон по настилу (приближение к желто-черной сигнальной зоне края
      вагона)'
    - 'State 2: Отрыв и фаза полета (0.65 с нахождения над открытой бездной между
      вагонами)'
    - 'State 3: Коррекция сдувания в воздухе (боковой наклон корпуса против встречно-бокового
      шквала)'
    - 'State 4: Магнитный захват настила нового вагона (жесткая посадка с компенсацией
      перегрузки)'
    parameters:
    - name: Ширина межвагонного разрыва
      value: 3.5 м открытой бездны
      tuning_note: Если увеличить > 5 м, прыжок покажется нереалистичным без джетпака;
        если сделать < 2 м, преодоление сцепки перестанет ощущаться как смертельно
        опасное событие.
    - name: Время свободного полета над сцепкой
      value: 0.65 с
      tuning_note: Дает ровно столько времени, чтобы совершить один прицельный выстрел
        в воздухе ('Air Shot') или скорректировать полосу приземления.
    - name: Встречное штормовое торможение в воздухе
      value: Замедление горизонтальной скорости на 12% при ветре > 35 м/с
      tuning_note: Заставляет игрока совершать прыжок строго с разгона, наказывая
        за нерешительность перед краем вагона.
    - name: Штраф за промах мимо крыши вагона
      value: Мгновенная гибель (падение под колеса мчащегося поезда)
      tuning_note: Обеспечивает бескомпромиссную цену ошибки на стыках этапов забега.
    feedback_layers:
    - 'Визуал/VFX: Вспышка сигнальных фонарей сцепки внизу; размытие шпал и скрежещущих
      колесных тележек в 3 метрах под ногами; вихревые потоки конденсата срываются
      с краев вагонов.'
    - 'Звук (Web Audio): Резкий переход от глухого гула крыши к пронзительному свисту
      открытого урагана и лязгу стальных межвагонных гармошек (''вжууух-трррр'');
      глухой металлический удар магнитных подошв при посадке.'
    - 'Камера (импульс/зум): Вертикальный взлет камеры вверх на 0.25 м с последующим
      резким компрессионным толчком вниз на 0.3 м при контакте с новым вагоном.'
    - 'UI/Тактильность: Предупреждающий мигающий значок «GAP AHEAD» на визоре за 1.2
      с до обрыва; мощный одиночный тактильный импульс при успешном захвате магнитов.'
    failure_mode: 'Игрок нажимает прыжок слишком поздно (уже после срыва с края) или
      прыгает без достаточного запаса скорости против 50 м/с ветра: стрелок падает
      в межвагонный разрыв, экран уходит в помехи с сообщением «LOST IN TRANSIT».'
    mastery_curve: Новичок паникует перед разрывом и забывает стрелять; профессионал
      делает выверенный прыжок, расстреливает лидера роя в воздухе с бонусом «AIR
      INTERCEPT» и приземляется точно в стрейф.
    counterplay: Ветер на стыке вагонов создает непредсказуемый восходящий турбулентный
      вихрь, отклоняющий траекторию стрелка влево или вправо на 0.4 м.
    synergies:
    - 'Синергия со всеми системами: является ключевой связкой между мезо-циклами (вагонами)
      поезда, перезапуская цикл позиционирования.'
    why_unique: Прыжок в условиях поезда на скорости 200+ км/ч учитывает не только
      гравитацию, но и сопротивление набегающего встречно-бокового потока, превращая
      базовый платформинг в аэродинамическую задачу.
    pseudocode: "function updateCarriageLeap(dt, player, currentCarriage, windSpeed)\
      \ {\n  if (player.isGrounded && player.distToCarriageEdge <= 1.5 && input.jumpPressed)\
      \ {\n    player.isGrounded = false;\n    player.verticalVel = 6.5;\n    player.airTime\
      \ = 0.65;\n    triggerAudio(\"leap_wind_rush\");\n    applyCameraVerticalHop(0.25);\n\
      \  }\n  if (!player.isGrounded) {\n    player.verticalVel -= 18.0 * dt;\n  \
      \  player.lateralPos += windSpeed.x * 0.015 * dt;\n    if (player.airTime <=\
      \ 0 && player.distToNextCarriage <= 0) {\n      player.isGrounded = true;\n\
      \      triggerMagneticLockSound();\n      applyCameraLandingPunch(0.3);\n  \
      \  }\n  }\n}"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 45
  max_triangles_or_sprites: 35000
  bundle_size_budget_mb: 3.8
  layers:
  - description: Three.js r170 WebGL2 сцена, кастомные шейдеры встречного ветра, капель
      дождя на визоре, молний и инстансинг мешей поезда/дронов
    name: Rendering & VFX Layer
  - description: Rapier3D для коллизий игрока с крышей и детекции хитбоксов обломков
      на высокой относительной скорости
    name: Simulation & Physics Layer
  - description: FSM состояний рейда, процедурный спавнер волн дронов, контроллер
      ветрового сноса и комбо-система
    name: Game Logic & State Layer
  - description: Единая система обработки Mouse/Touch с зонированием экрана и алгоритмом
      сглаживания упреждения
    name: Input & Ergonomics Layer
  - description: Playgama Bridge 2.x интеграция (SDK init, облачные сохранения, лидерборды,
      баннеры, interstitial, rewarded ads)
    name: Platform & Bridge Layer
  modules:
  - description: Создает иллюзию движения поезда 200+ км/ч через скроллинг бесконечного
      полотна эстакады, процедурный спавн опор и инерционную тряску вагонов
    name: TrainMovementController
  - description: Симулирует векторную динамику шторма, порывы ветра и рассчитывает
      физический снос прицела и снарядов
    name: StormWindSystem
  - description: Управляет стаями дронов на базе InstancedMesh с поведением Boids,
      формированием звеньев и триггерами цепных взрывов
    name: DroneSwarmManager
  - description: Спавнит горящие физические фрагменты сбитых дронов и направляет их
      по крыше поезда навстречу игроку
    name: DebrisKinematicsEngine
  - description: 'Отрисовывает диегетический UI визора: динамическую дугу упреждения,
      индикатор ветра, заряд конденсатора и состояние щита'
    name: VisorHUDController
  - description: Обертка над Playgama Bridge SDK для показа рекламы, синхронизации
      рекордов и отслеживания жизненного цикла вкладки
    name: PlaygamaBridgeService
monetization:
  strategy_summary: 'Ориентированная на вовлечение ненавязчивая гибридная модель:
    Rewarded Video для спасения рейда и удвоения наград + межстраничная реклама (Interstitial)
    строго между завершенными забегами с жестким кулдауном 90 секунд + косметические
    микротранзакции визоров без пейволов.'
  rewarded_placements:
  - id: revive_run
    name: Аварийная перезарядка щита (Возрождение)
    benefit: Мгновенное восстановление 100% энергощита при гибели с 2-секундной неуязвимостью
      для завершения рейда
    cooldown_or_limit: 1 раз за забег
    trigger_moment: Экран критического повреждения щита на 50-80 секундах
  - id: double_rewards
    name: Удвоение тесла-шестеренок
    benefit: Умножение x2 заработанной валюты рейда для ускоренной разблокировки скинов
    cooldown_or_limit: Без ограничений
    trigger_moment: Экран успешного завершения забега (Victory Screen)
  - id: trial_visor
    name: Тест-драйв легендарного визора
    benefit: Временный доступ к элитному визору 'Громовой Компас' на 1 забег
    cooldown_or_limit: 1 раз в 15 минут
    trigger_moment: Главное меню перед стартом
  interstitial_placements:
  - trigger_event: Завершение рейда (победа или поражение без ревайва)
    cooldown_seconds: 90
    conditions: Показывается только если с момента последней рекламы прошло не менее
      90 секунд и игрок сыграл минимум 2 полных забега
  in_app_purchases:
  - sku: pack_no_ads
    name: Отключение обязательной рекламы
    description: Навсегда убирает баннеры и межстраничную рекламу, сохраняя возможность
      смотреть Rewarded Video
    price_tier: Tier 2 ($1.99 / 149 YAN)
    reward: Постоянный статус VIP + 500 тесла-шестеренок
  - sku: skin_storm_overdrive
    name: Набор 'Штормовой Овердрайв'
    description: Эксклюзивный золотой скин карабина с эффектом электрических молний
      и неоновый визор
    price_tier: Tier 3 ($2.99 / 249 YAN)
    reward: Скин оружия + Неоновый визор + 1000 шестеренок
  fairness_rules:
  - 'Никакого Pay-to-Win: все микротранзакции строго косметические (скины, визоры,
    эффекты)'
  - Никакой рекламы во время активного геймплея и стрельбы на крыше поезда
  - 'Жесткий лимит межстраничной рекламы: не чаще 1 раза в 90 секунд'
  - Возможность пропустить любой экран результатов за 1 клик
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - gamepix
  - web
  initialization_flow:
  - Bridge.initialize() на старте загрузки страницы
  - Определение типа устройства (isMobile / isDesktop) и платформы
  - Синхронизация сохраненных данных через Bridge.storage.get()
  - Инициализация баннерной рекламы (если поддерживается платформой)
  - Отправка события готовности игры Bridge.game.ready()
  cloud_save_keys:
  - player_high_score
  - unlocked_visors
  - unlocked_skins
  - total_runs_completed
  - sound_settings
  - control_sens
  leaderboards:
  - global_storm_score
  - speedrun_locomotive_time
  ads_integration:
    auto_pause_on_ad: true
    banner_supported_platforms:
    - yandex
    - crazygames
    interstitial_cooldown: 90
    rewarded_placement_ids:
    - revive_run
    - double_rewards
    - trial_visor
  lifecycle_hooks:
  - Bridge.on('visibility_change', (visible) => { if (!visible) pauseGameAudioAndPhysics();
    })
  - Bridge.on('ad_started', () => { pauseGameState(); muteAudio(); })
  - Bridge.on('ad_completed', () => { resumeGameState(); unmuteAudio(); })
art:
