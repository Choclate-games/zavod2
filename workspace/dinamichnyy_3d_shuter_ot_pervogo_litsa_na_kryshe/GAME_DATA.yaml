    Резкий горизонтальный наклон камеры (Roll на 4.2 градуса) в сторону стрейфа с
    быстрым возвратом; вертикальное проседание камеры на 0.6 м во время скольжения.;
    UI/Тактильность: Направленный вибро-щелчок влево/вправо в руках игрока; индикатор
    позиции на нижнем крае визора (3 сегмента полос).'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Тесла-перегрузка карабина «Индукционный Залп»
  category: 'Источник наивысшей награды и кульминационный инструмент: вознаграждает
    идеальную серию попаданий возможностью мгновенной аннигиляции элитных угроз и
    босса.'
  priority: secondary
  description: 'Луч цепной молнии физически взаимодействует с грозовой бурей: во время
    удара молнии в небе мощность луча спонтанно подскакивает на +50% (механика природного
    резонанса).'
  player_interaction: ПКМ / Двойной тап двумя пальцами / Кнопка «OVERLOAD» на мобильном
    интерфейсе — активация луча молнии.
  feedback: 'Визуал/VFX: Ослепительный толстый ветвящийся бирюзово-белый луч молнии,
    прожигающий грозовое небо; экран заливает объемным светом (Bloom); от пораженных
    целей разлетаются снопы белых плазменных искр.; Звук (Web Audio): Нарастающий
