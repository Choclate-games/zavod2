    - mechanics/drone_swarm.md
    - mechanics/chain_reaction.md
    - threejs/juice_and_vfx_pool.md
    - ux/touch_controls.md
    - ux/input_scheme_switching.md
    - audio/procedural_sound_synthesizer.md
  - id: D2
    name: 'Грозовой Дозор: Бронепоезд Апекс'
    pitch: Тактический позиционный шутер от первого лица на крыше бронепоезда с укрытиями
