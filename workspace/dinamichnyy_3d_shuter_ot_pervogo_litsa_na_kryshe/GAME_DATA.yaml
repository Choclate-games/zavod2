      (стрельба с поправкой на шторм). В отличие от обычного тира, цель непрерывно
      сносится шквалом, а попадание по лидеру роя вызывает цепной взрыв, превращающий
      сбитые дроны в горящие препятствия, летящие под ноги игроку на скорости 200
      км/ч.
    biggest_risk: Сложность удержания прицела на быстро летящих целях при одновременном
      уклонении от обломков на мобильных экранах
    production_cost: 'Средний: одна бесшовная сцена Three.js с движущимся окружением,
      процедурные вагоны на InstancedMesh и частицы искр/дождя через единый буфер
      Draw Call.'
    knowledge_hints:
