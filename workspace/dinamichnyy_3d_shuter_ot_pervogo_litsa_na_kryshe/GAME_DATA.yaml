    camera: Вид от первого лица с переходом в тактический оптический зум при прицеливании
      и динамическим приседанием за бронещитки крыши
    control_scheme: 'ПК: Мышь — прицеливание, ЛКМ — огонь, ПКМ — оптический зум с
      фильтром бури, A/D — смещение к левому/правому борту, S/Ctrl — присед за укрытие;
      Телефон: Свайп справа — прицеливание, кнопка огня справа, сенсорные зоны слева
      — перекат к борту и присед за надстройку'
    world: 'Дизельпанк: массивный клёпаный бронепоезд цвета ржавчины и хаки, выбрасывающий
      густой дым локомотив, свинцово-зелёное штормовое небо и тяжёлые бронированные
      летающие дроны-штурмовики.'
    spectacle: Игрок выглядывает из-за дымящегося бронещитка на крыше, пока штормовой
      вихрь срывает обшивку с соседнего вагона, а залп ракет тяжёлого дрона освещает
      стальную тушу состава багровым заревом
    why_not_generic: Связка threejs/fps_controller_and_shooting.md + mechanics/cover_and_suppression.md
      (укрытия на крыше) + mechanics/physics_destruction.md (динамическое разрушение
      надстроек). В отличие от позиционного шутера, укрытия на крыше поезда постоянно
      разрушаются штормовым ветром и осколками, вынуждая игрока регулярно совершать
      опасные перебежки под шквальным огнём.
    biggest_risk: Потеря темпа и динамики из-за пассивного отсиживания игрока за укрытиями
    production_cost: 'Средний: требуется логика динамического разрушения укрытий на
      движущейся платформе и ИИ подавления воздушных противников.'
    knowledge_hints:
    - threejs/fps_controller_and_shooting.md
    - mechanics/cover_and_suppression.md
    - mechanics/physics_destruction.md
    - threejs/shooter_enemy_ai_and_combat.md
    - ux/touch_controls.md
  - id: D3
    name: 'Штормовой Снайпер: Высоковольтный Рубеж'
    pitch: Высокоточный ритм-FPS от первого лица, где игрок ловит тайминги грозовых
      разрядов для зарядки сверхмощных выстрелов карабина и сбивает воздушных боссов
      в такт раскатам грома.
    core_verb: Таймить и разряжать (накапливать заряд карабина от вспышек молний,
      мгновенно доводить прицел с учётом поправки на шторм и производить высоковольтный
      залп)
    genre_family: Ритм-экшен 3D FPS / Precision Sniper Rail-Shooter
    session_shape: Снайперская дуэль на перегоне (интенсивный трек длительностью 60–80
      секунд с тремя актами нарастания ритма бури и ликвидацией воздушного флагмана)
    camera: Вид от первого лица с эффектом стробоскопа при ударах молний, хроматической
      аберрацией при перегрузке конденсатора карабина и замедлением времени при идеальном
      тайминге
    control_scheme: 'ПК: Мышь — наведение прицела, ЛКМ (зажатие и сброс) — зарядка
      конденсатора и выстрел в такт молнии, A/D — уклонение стрейфом от обломков;
      Телефон: Тап с удержанием — наведение и зарядка, отпускание — разряд, свайпы
      по нижнему краю — уклонение от летящих осколков'
    world: 'Киберпанк / Электро-нуар: хромированный поезд-пуля с неоновыми контурами,
      мчащийся над ночным залитым дождём мегаполисом сквозь фиолетовый шторм.'
    spectacle: Вспышка фиолетовой молнии бьёт в токоприёмник вагона, карабин в руках
      вспыхивает электрическими дугами, а лазерный прицел фиксирует критическую уязвимость
      гигантского дрона-босса над сияющим неоновым городом
    why_not_generic: 'Связка threejs/fps_controller_and_shooting.md + mechanics/rhythm_sync.md
      (Web Audio синхронизация с громом) + mechanics/drone_swarm.md (поведение роя).
      В отличие от обычного снайперского тира, здесь темп стрельбы диктуется природной
      стихией шторма: максимальный урон наносится только при выстреле точно в такт
      грозовому разряду.'
    biggest_risk: Высокий порог входа из-за жёстких требований к ритму и таймингам
      на мобильных устройствах без включенного звука
    production_cost: 'Средний: требуется Web Audio анализатор ритма, шейдерные эффекты
      молний и точная синхронизация анимаций босса с аудиодорожкой.'
    knowledge_hints:
    - threejs/fps_controller_and_shooting.md
    - mechanics/rhythm_sync.md
    - mechanics/drone_swarm.md
    - patterns/score_attack_loop.md
    - audio/procedural_sound_synthesizer.md
  selected_id: D1
  selected_name: 'Громовой Перехват: Штормовой Экспресс'
  selection_reason: 'Направление D1 («Громовой Перехват: Штормовой Экспресс») идеально
    воплощает ключевой контракт заказа и является сильнейшим для веб-браузера и мобильных
    устройств: 1) Мгновенная читаемость и флоу: бешеный темп мчащегося поезда создаёт
    непрерывную динамику скорости без сложной навигации по лабиринтам. Игрок с первой
    секунды вовлечён в цикл «прицеливание с упреждением -> отстрел роя -> мгновенный
    стрейф от падающих горящих обломков». 2) Чистая эргономика для мобильных устройств:
    прицеливание свайпом/drag с упреждающим маркером и автоспуском/тапом в сочетании
    со свайпами бокового стрейфа не требует виртуальных джойстиков. 3) Высокая производительность
    Three.js: инстансинг мешей роя дронов (InstancedMesh) и частиц шторма обеспечивает
    стабильные 60 FPS. 4) Механика ветрового сноса и цепных взрывов превращает стрельбу
    в захватывающий расчёт траекторий на лету.'
  rejected_reasons:
  - 'D2 («Грозовой Дозор: Бронепоезд Апекс») отвергнут, так как концепция позиционной
    обороны с укрытиями за надстройками вагонов гасит ураганный темп штормового боя,
    провоцирует игрока на пассивное выжидание за бронещитками вместо агрессивного
    маневрирования на крыше и перегружает мобильный экран лишними кнопками приседа
    и зума.'
  - 'D3 («Штормовой Снайпер: Высоковольтный Рубеж») отвергнут из-за чрезмерной зависимости
    от ритмических таймингов молний и аудио-синхронизации: игроки на мобильных устройствах
    часто играют без звука, а необходимость выжидать разряд ломает ощущение динамичного
    ураганного шутера от первого лица.'
  what_it_is_not:
  - Волны врагов на замкнутой стационарной арене без кинематографичного движения поезда
  - Случайные карточки апгрейдов и перков при прокачке (шаблоны roguelite / survivor)
  - Экранный виртуальный джойстик под левым пальцем и статичные кнопки огня
  - Универсальная связка 'дэш + парирование + рукопашный удар'
  - Серые однотонные кубы и примитивы вместо стилизованного теслапанк-поезда и ярких
    спецэффектов
  - Мета-прогрессия с бессмысленным фармом золота ради числовых прибавок к урону (+5%
    к статам)
  - Статичный рельсовый тир с неподвижным прицелом и отсутствием физического перемещения
    игрока по вагонам
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - Вид строго от первого лица с динамической инерцией шторма, каплями дождя и искрами
    на визоре
  - Ощущение бешеной скорости мчащегося состава (200+ км/ч) за счёт бегущего полотна,
    искр из-под колёс и встречного шквала
  - 'Физическая поправка на шторм: прицел с динамической шкалой упреждения, требующий
    стрельбы на опережение траектории дронов'
  - Физические горящие обломки сбитых дронов, летящие по крыше состава и требующие
    постоянного уклонения боковыми стрейфами на своих двоих
  signature_scene: 'Кадр от первого лица с крыши третьего вагона бронепоезда: в тёмно-синей
    грозовой ночи гигантская ветвистая молния на миллисекунду ослепляет сцену, высвечивая
    мокрый рифлёный настил крыши с летящими снопами оранжевых искр из межвагонной
    сцепки. В центре визора — светящаяся бирюзовая сетка карабина с изогнутой ветровой
    шкалой сноса, наведённая с упреждением на пылающего пикирующего дрона. В десяти
    метрах впереди прямо в лицо игроку в вихре брызг и чёрного дыма летит объятый
    пламенем оторванный турбинный винт, заставляя уходить в стрейф к самому краю несущегося
    на полной скорости вагона.'
  avoid_references:
  - Vampire Survivors
  - Brotato
  - Subway Surfers
  - Time Crisis
  - The House of the Dead
  - Beach Head
knowledge_plan:
  selections:
  - path: threejs/fps_controller_and_shooting.md
    role: core
    reason: Реализация контроллера от первого лица, баллистики прицела с поправкой
      на штормовой ветер, отдачи карабина и тряски камеры на несущемся поезде.
  - path: threejs/shooter_enemy_ai_and_combat.md
    role: core
    reason: Боевая модель штурмовых дронов, регистрация попаданий по уязвимым энергоядрам
      и механика схватки с тяжелым боссом «Громовержец».
  - path: mechanics/drone_swarm.md
    role: core
    reason: Алгоритмы поведения пикирующей эскадрильи дронов (Boids AI) с выделением
      лидера звена для фокуса игрока.
  - path: mechanics/chain_reaction.md
    role: core
    reason: Физический каскад цепной детонации дронов роя при уничтожении командира
      с разлетом опасных горящих обломков.
  - path: threejs/physics_integration.md
    role: core
    reason: Интеграция Rapier3D с Three.js для кинематики поезда, трехполосного стрейфа,
      скольжения и аэродинамических прыжков со сносом потока.
  - path: stack/rapier3d.md
    role: core
    reason: Базовый физический движок для обработки столкновений с летящими по крыше
      обломками и прыжков через межвагонные сцепки.
  - path: threejs/procedural_mesh_builder.md
    role: core
    reason: Процедурная генерация стилизованных вагонов бронепоезда «Буревестник»,
      дронов, карабина и босса без внешних 3D-моделей.
  - path: threejs/game_map_and_world_design.md
    role: supporting
    reason: Процедурное построение бесконечного скоростного окружения, рельсового
      полотна, скал и смены 3 климатических зон шторма.
  - path: mechanics/physics_destruction.md
    role: supporting
    reason: Разрушение сбитых дронов на физические обломки, превращающиеся в горящие
      препятствия на полосах движения.
  - path: threejs/juice_and_vfx_pool.md
    role: supporting
    reason: Инстансированные пулы частиц для искр на визоре, капель дождя, электрических
      дуг карабина и вспышек молний.
