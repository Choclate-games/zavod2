  feedback: 'Визуал/VFX: Фонтан оранжевых и синих искр из-под магнитных подошв при
    каждом рывке; капли дождя на визоре рассекаются встречным потоком; красные проекционные
    линии настила вагона подсвечивают занятую полосу.; Звук (Web Audio): Тяжелый лязг
    смыкания электромагнитов о сталь вагона (''кланк-тссс''); скрежет металла обломка,
