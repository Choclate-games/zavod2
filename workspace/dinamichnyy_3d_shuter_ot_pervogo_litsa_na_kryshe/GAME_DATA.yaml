definition_of_done:
- Реализован и протестирован вид от первого лица с физической тряской вагона и динамическим
  наклоном при боковых стрейфах
- Создано ощущение скорости мчащегося состава (200+ км/ч) за счет процедурного окружения
  эстакады и эффектов встречного шквала
- Работает система баллистического ветрового сноса прицела с динамической дугой упреждения
- Реализован процедурный рой дронов на InstancedMesh с выделением лидеров звеньев
  и каскадными цепными взрывами
- Функционирует физический спавн горящих обломков, требующих своевременного уклонения
  стрейфами и прыжками через сцепки
- Интегрирован финальный босс «Громовержец» с уникальными фазами атак и уязвимостью
  к Тесла-Перегрузке
- Реализовано адаптированное сенсорное управление (drag-aim + swipe-strafe) и desktop
  WASD/Mouse
- Подключен Playgama Bridge 2.x (облачные сейвы, лидерборды, баннеры, interstitial
  с кулдауном 90 с, rewarded revives)
- Обеспечена стабильная производительность 60 FPS на десктопе и смартфонах при весе
  бандла менее 4 МБ
- 'Игра осталась тем, что просили: вид от первого лица — игрок смотрит своими глазами,
  а не с вертолёта, вышки или орбиты.'
- 'Игра осталась тем, что просили: игрок сам ходит по уровню на своих двоих.'
- 'Игра осталась тем, что просили: стрельба как главное действие игрока.'
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Оценка ветрового сноса по шкале прицела -> Упреждающий
  выстрел из карабина по лидеру звена дронов -> Цепная детонация и разлет обломков
  -> Боковой контр-стрейф от летящих по крыше горящих препятствий -> Перепрыгивание
  межвагонной сцепки -> Перегрузка тесла-генератора и уничтожение босса.'
- 'Реализованы механики проекта: Динамический ветровой прицел «Штормовое Упреждение»,
  Цепная кинетическая детонация звеньев «Лидер Роя», Трехполосный контр-стрейф и скольжение
  «Магнитный Зацеп», Тесла-перегрузка карабина «Индукционный Залп».'
- Условие успеха (Преодолеть 5 крыш вагонов состава (180 метров длины поезда), ликвидировать
  не менее 24 дронов эскадрильи и полностью уничтожить энергоядро тяжелого босса-штурмовика
  «Громовержец» за 85 секунд, сохранив целостность щита визора > 0%) и условие проигрыша
  (Полное истощение прочности энергощита (3 прямых попадания плазмоидов дронов или
  2 столкновения с тяжелыми горящими обломками турбин) либо падение в межвагонную
  бездну при несвоевременном прыжке) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Громовой Перехват: Штормовой Экспресс».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Аварийная перезарядка щита (Возрождение),
  Удвоение тесла-шестеренок, Тест-драйв легендарного визора); interstitial соблюдает
  паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
direction:
  options:
  - id: D1
    name: 'Громовой Перехват: Штормовой Экспресс'
    pitch: Скоростной 3D-шутер от первого лица на крыше мчащегося поезда, где игрок
      отстреливает рои дронов с динамической поправкой на штормовой ветер и уклоняется
      от летящих горящих обломков.
    core_verb: Рассчитывать упреждение и выцеливать (вести прицел по дуге ветрового
      сноса, точечно уничтожая воздушные цели и стрейфом уходя от падающих обломков)
    genre_family: Динамичный 3D FPS / High-Speed Aerial Interceptor
    session_shape: Линейный штурмовой рейд (забег на 75–90 секунд от хвоста состава
      к локомотиву через 3 климатические зоны шторма с финальным боссом-перехватчиком)
    camera: Вид от первого лица с динамической физической тряской вагона, наклоном
      горизонта при боковых стрейфах, каплями дождя и снопами искр на визоре
    control_scheme: 'ПК: Мышь — прицеливание и свободный обзор, ЛКМ — выстрел из карабина,
      A/D — боковой стрейф по крыше вагона, Пробел — перепрыгивание межвагонных сцепок;
      Телефон: Драг по правой половине экрана — точное наведение прицела + автоспуск
      при совмещении с упреждающей меткой, Горизонтальные свайпы/тапы по левой половине
      — мгновенный стрейф влево-вправо'
    world: 'Теслапанк / Нео-индастриал: тяжёлый бронированный экспресс из воронёной
      стали и меди, несущийся по высотной эстакаде над бездной сквозь фиолетово-синий
      грозовой шторм с ветвящимися молниями.'
    spectacle: Ослепительная вспышка молнии высвечивает мокрый рифлёный настил вагона,
      сноп раскалённых оранжевых искр из межвагонной сцепки, летящий прямо в лицо
      горящий обломками дрон и бирюзовый голографический прицел с дугой ветрового
      сноса
    why_not_generic: Связка mechanics/drone_swarm.md (поведение роя с ведущими звеньями)
