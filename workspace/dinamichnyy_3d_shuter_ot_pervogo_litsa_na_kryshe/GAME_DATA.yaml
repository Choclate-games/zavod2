    круговая шкала заряда карабина вспыхивает неоном с надписью «OVERLOAD ACTIVE».'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Инерционный прыжок через межвагонные сцепки
  category: 'Пространственный транзишен и пиковый модификатор риска: связывает вагоны
