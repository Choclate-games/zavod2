raw_prompt: Динамичный 3D шутер от первого лица на крыше мчащегося на огромной скорости
  поезда во время грозовой бури. Игрок прицеливается мышью или свайпами, стреляет
  из мощного карабина и уклоняется в стороны от летящих горящих обломков клавишами
  движения. На экране видны вагоны несущегося состава, хлещущий ветер со снопами искр,
  прицел с индикатором поправки на шторм и пикирующие стаи дронов. Задача — точно
  отстреливать воздушные цели на опережение и сбивать тяжелых боссов, не упав с крыши
  поезда.
title: 'Громовой Перехват: Штормовой Экспресс'
slug: dinamichnyy_3d_shuter_ot_pervogo_litsa_na_kryshe
genre: 3D Экшен-Шутер от первого лица
subgenre: Высокоскоростной кинетический FPS / Штормовой рейд на крыше поезда
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web / Android)
orientation: landscape
target_audience: Игроки 14–35 лет, поклонники динамичных рефлекс-шутеров (Fast-Paced
  FPS), кинематографичных экшенов и эстетики теслапанка. Ценят мгновенный старт сессии
  без гринда, высокую читаемость физических траекторий, зрелищные цепные разрушения
  и оттачивание мастерства стрельбы с упреждением.
core_loop: Оценка ветрового сноса по шкале прицела -> Упреждающий выстрел из карабина
  по лидеру звена дронов -> Цепная детонация и разлет обломков -> Боковой контр-стрейф
  от летящих по крыше горящих препятствий -> Перепрыгивание межвагонной сцепки ->
  Перегрузка тесла-генератора и уничтожение босса
hook: Вспышка ветвящейся молнии в грозовой ночи ослепляет сцену на скорости 200 км/ч;
  ты сбиваешь лидера роя упреждающим выстрелом сквозь шквал, рой детонирует по цепочке,
  и пылающий оторванный винт с искрами летит прямо в лицо, заставляя уйти в миллиметровый
  стрейф на краю мокрой крыши над пропастью.
player_fantasy: Ты — стрелок-перехватчик элитного бронепоезда «Буревестник», стоящий
  на вибрирующей стальной крыше несущегося сквозь эпицентр бури состава, удерживающий
  прицел против ураганного ветра и в одиночку расстреливающий штурмовую эскадрилью
  дронов.
session_model: 'Линейный штурмовой рейд: непрерывный 80-секундный марш-бросок через
  5 бронированных вагонов (хвост -> локомотив) сквозь 3 фазы шторма с кульминационной
  дуэлью против тяжелого босса-перехватчика «Громовержец»'
unique_value_proposition: Единственный браузерный 3D FPS, объединяющий физику баллистического
  ветрового сноса прицела, процедурный рой дронов с цепными взрывами и необходимость
  физического уклонения от летящих навстречу горящих обломков на скорости 200 км/ч.
vision: Создать эталонный ультрадинамичный браузерный веб-шутер от первого лица с
  консольным качеством визуального фидбека (вспышки молний, дождь на визоре, снопы
  искр, деформация обломков) и доступным, но глубоким управлением для ПК и мобильных
  устройств без перегруженных UI-элементов.
elevator_pitch: 'Штурмуй крыши мчащегося на 200 км/ч бронеэкспресса сквозь ярость
  ночного электрического шторма: рассчитывай баллистику ветрового сноса, взрывай звенья
  дронов цепными реакциями и уворачивайся от горящих обломков в 80-секундном адреналиновом
  FPS-рейде!'
win_conditions: Преодолеть 5 крыш вагонов состава (180 метров длины поезда), ликвидировать
  не менее 24 дронов эскадрильи и полностью уничтожить энергоядро тяжелого босса-штурмовика
  «Громовержец» за 85 секунд, сохранив целостность щита визора > 0%
lose_conditions: Полное истощение прочности энергощита (3 прямых попадания плазмоидов
  дронов или 2 столкновения с тяжелыми горящими обломками турбин) либо падение в межвагонную
  бездну при несвоевременном прыжке
progression_summary: 'Внутри сессии: накопление комбо-заряда тесла-конденсатора (до
  x4) за серии попаданий по упреждающим маркерам, открывающее альтернативный режим
  цепного разряда карабина; Мета-прогрессия: разблокировка новых оптических визоров
  с ветровыми сетками, кастомизация неонового покрытия брони и карабина, глобальные
  лидерборды Playgama Bridge по очкам зачистки и времени прохождения.'
difficulty_curve: 'Фаза 1 (0–25 с, Вагоны 1–2): Скорость поезда 160 км/ч, ветер 15
  м/с, малые развед-дроны звеньями по 3 шт., мягкое обучение чтению упреждающего маркера;
  Фаза 2 (25–55 с, Вагоны 3–4): Скорость 210 км/ч, ветер 35 м/с с турбулентными порывами,
  бронированные дроны-перехватчики, плотный поток летящих обломков и необходимость
  прыжков через разрывы сцепок; Фаза 3 (55–85 с, Локомотив): Скорость 250 км/ч, эпицентр
  шторма 50 м/с, босс «Громовержец» с залпами кинетических торпед, перегрузка тесла-генератора
  состава.'
