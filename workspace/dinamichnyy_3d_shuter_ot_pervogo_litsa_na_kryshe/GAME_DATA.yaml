mechanics:
- name: Динамический ветровой прицел «Штормовое Упреждение»
  category: 'Двигатель точности и источник риска: заставляет игрока постоянно рассчитывать
    траекторию пули в условиях ураганного сноса и вибрации настила.'
  priority: core
  description: В большинстве FPS прицел жестко привязан к центру камеры; здесь сетка
    живая, ее кривизна физически рассчитывается от трехмерного вектора ураганного
    ветра и скорости поезда в реальном времени Three.js.
  player_interaction: Мышь (Aim) / Сенсорный свайп в правой половине экрана — наведение
    прицела; ЛКМ / Кнопка огня на таче — импульсный выстрел.
  feedback: 'Визуал/VFX: Яркий ионизированный голубой трассер, изгибающийся по дуге
    ветра; сноп искр из дульного компенсатора, сдуваемый назад; динамическое кольцо
    упреждения на визоре меняет цвет с оранжевого на неоново-бирюзовый при идеальном
    совпадении.; Звук (Web Audio): Сухой металлический щелчок электромагнитного соленоида
    с последующим хлестким ультразвуковым хлопком разрыва воздуха; нарастающий свист
    ветра в микрофоне шлема при усилении порыва.; Камера (импульс/зум): Мгновенная
    микро-отдача камеры назад на 0.04 м с легким поворотом по оси Z на 0.8 градуса;
    динамический FOV сжимается с 75° до 71° при зажатии прицеливания.; UI/Тактильность:
    Гаптический виброотклик (25 мс) на мобильных устройствах при спуске; мигание индикатора
    «LOCK» на шкале углового упреждения.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Цепная кинетическая детонация звеньев «Лидер Роя»
  category: 'Главный мультипликатор темпа и эффективности: превращает одиночные меткие
    выстрелы в массовую зачистку неба и генератор комбо.'
  priority: secondary
  description: Каскад не просто очищает экран (как обычный smart bomb), а физически
    рождает падающие горящие препятствия, связывая меткость шутера с механикой бега
    по полосам крыши.
  player_interaction: Наведение взгляда/прицела на золотистое энергоядро дрона-командира
    (выделено шевроном на HUD) + спуск курка (ЛКМ / Fire Button).
  feedback: 'Визуал/VFX: Ярко-золотой взрыв ядра лидера с выбросом ветвящихся дуговых
    молний к ведомым; ведомые дроны раскалываются на горящие каркасы с густым дымным
    шлейфом, сдуваемым ветром назад.; Звук (Web Audio): Низкочастотный басовый бум
    разрушения ядра (60 Гц) с последующим высокочастотным треском электрического каскада
    (''бззз-клак-клак'').; Камера (импульс/зум): Радиальный микро-blur (Radial Blur
    0.15 с) с кратковременным замедлением времени (Hitstop 45 мс) в момент гибели
    всего звена.; UI/Тактильность: Всплывающий комбо-индикатор ''CHAIN BREAK x3!''
    с золотым свечением; серия из трех плотных вибро-импульсов на смартфоне.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Трехполосный контр-стрейф и скольжение «Магнитный Зацеп»
  category: 'Главный источник риска и позиционный тормоз: обеспечивает физическое
    выживание стрелка среди потока препятствий и набегающего ветра 200 км/ч.'
  priority: secondary
