_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: dinamichnyy_3d_shuter_ot_pervogo_litsa_na_kryshe
performance:
  target_fps: 60
  max_draw_calls: 45
  max_triangles: 35000
  bundle_size_budget_mb: 3.8
session:
  model: 'Линейный штурмовой рейд: непрерывный 80-секундный марш-бросок через 5 бронированных
    вагонов (хвост -> локомотив) сквозь 3 фазы шторма с кульминационной дуэлью против
    тяжелого босса-перехватчика «Громовержец»'
  win: Преодолеть 5 крыш вагонов состава (180 метров длины поезда), ликвидировать
    не менее 24 дронов эскадрильи и полностью уничтожить энергоядро тяжелого босса-штурмовика
    «Громовержец» за 85 секунд, сохранив целостность щита визора > 0%
  lose: Полное истощение прочности энергощита (3 прямых попадания плазмоидов дронов
    или 2 столкновения с тяжелыми горящими обломками турбин) либо падение в межвагонную
    бездну при несвоевременном прыжке
  difficulty_curve: 'Фаза 1 (0–25 с, Вагоны 1–2): Скорость поезда 160 км/ч, ветер
    15 м/с, малые развед-дроны звеньями по 3 шт., мягкое обучение чтению упреждающего
    маркера; Фаза 2 (25–55 с, Вагоны 3–4): Скорость 210 км/ч, ветер 35 м/с с турбулентными
    порывами, бронированные дроны-перехватчики, плотный поток летящих обломков и необходимость
    прыжков через разрывы сцепок; Фаза 3 (55–85 с, Локомотив): Скорость 250 км/ч,
    эпицентр шторма 50 м/с, босс «Громовержец» с залпами кинетических торпед, перегрузка
    тесла-генератора состава.'
mechanics:
  dinamicheskiy_vetrovoy_pritsel_shtormovoe_uprezhde:
    name: Динамический ветровой прицел «Штормовое Упреждение»
    parameters:
      skorost_poleta_puli:
        value: 450.0 м/с
        note: Если увеличить выше 600 м/с, стрельба превратится в бездумный хитскан
          и исчезнет ощущение борьбы со штормом; если снизить ниже 300 м/с, попадать
          на скорости поезда 200 км/ч станет физически невозможно.
      bazovyy_vetrovoy_snos_puli:
        value: 0.42 м на каждые 10 м/с ветра на дистанции 50 м
        note: Если увеличить снос, прицел будет улетать за край экрана при 50 м/с
          шторма; если уменьшить, игрок перестанет обращать внимание на динамическую
          шкалу визора.
      amplituda_vibratsii_pritsela_ot_poezda:
        value: 3.5 px на частоте 5.2 Гц
        note: Если поднять выше 7 px, прицеливание вызовет укачивание и фрустрацию;
          если отключить, потеряется физическое ощущение нахождения на крыше мчащегося
          состава.
      temp_strelby_karabina:
        value: 4.5 выстр/с (интервал 0.22 с)
        note: При интервале < 0.12 с стрельба превращается в спам без оценки упреждения;
          при > 0.4 с промах наказывает слишком жестко в 80-секундном рейде.
  tsepnaya_kineticheskaya_detonatsiya_zvenev_lider_r:
    name: Цепная кинетическая детонация звеньев «Лидер Роя»
    parameters:
      radius_tsepnogo_emi_zahvata:
        value: 14.0 м
        note: Если уменьшить до < 8 м, строй дронов будет слишком часто распадаться
          без детонации ведомых; если увеличить до > 25 м, один случайный выстрел
          будет зачищать весь экран.
      zaderzhka_kaskadnoy_dugi_mezhdu_dronami:
        value: 0.08 с на звено
        note: Если сделать мгновенной (0.0 с), игрок не успеет насладиться зрелищем
          бегущей молнии; если растянуть до > 0.25 с, темп боя просядет и обломки
          прилетят с задержкой.
      mnozhitel_ochkov_za_tsepnoy_kaskad:
        value: x2 за первого ведомого, x3 за второго, x4 за полное звено
        note: Мотивирует игрока охотиться исключительно за лидерами формаций ради
          верхних строчек лидерборда Playgama Bridge.
      shans_generatsii_tyazhelogo_oblomka_s_lidera:
        value: 100% (1 горящая турбина или винт на каждую формацию)
        note: 'Гарантирует прямую причинно-следственную связь: каждая успешная атака
          в воздухе немедленно создает физический вызов под ногами на крыше.'
  trehpolosnyy_kontr_streyf_i_skolzhenie_magnitnyy_z:
    name: Трехполосный контр-стрейф и скольжение «Магнитный Зацеп»
    parameters:
      vremya_perestroeniya_mezhdu_polosami_nastila:
        value: 0.16 с
        note: Если сделать медленнее (> 0.28 с), игрок физически не успеет уклониться
          от обломка, летящего на 210 км/ч; если сделать быстрее (< 0.08 с), пропадет
          ощущение массы и инерции тяжелой брони.
      shirina_kryshi_vagona_3_polosy:
        value: '3.6 м (по 1.2 м на полосу: Левая, Центр, Правая)'
        note: 'Идеально масштабируется под Three.js камеру от 1-го лица: обеспечивает
          четкую трехполосную читаемость без потери обзора неба.'
      uron_ot_stolknoveniya_s_oblomkom:
        value: 50% энергощита (2 столкновения = гибель)
        note: Делает каждое уклонение критически важным, не допуская безнаказанного
          спама стрельбы без оглядки на крышу.
      dlitelnost_okna_skolzheniya_slide:
        value: 0.45 с (кулдаун 0.6 с)
        note: Предотвращает бесконечное сидение в приседе, заставляя игрока точно
          ловить момент пролетающих над головой винтов.
  tesla_peregruzka_karabina_induktsionnyy_zalp:
    name: Тесла-перегрузка карабина «Индукционный Залп»
    parameters:
      emkost_tesla_kondensatora:
        value: 100 единиц (4 стака по 25 ед)
        note: Заполняется за 4 сбитых звена дронов или 12 идеальных попаданий по упреждению,
          давая ровно 2–3 активации за 85-секундный рейд.
      dlitelnost_lucha_peregruzki:
        value: 2.2 с
        note: Если длительность > 3.5 с, игра теряет напряжение и превращается в кино;
          если < 1.2 с, игрок не успевает провести лучом по нескольким целям.
      summarnyy_uron_lucha:
        value: 600 ед/с (сжигает тяжелого дрона за 0.3 с, снимает 35% HP босса за
          полный залп)
        note: Идеально сбалансировано под 3-фазовую структуру босса «Громовержец».
      sektor_avtozahvata_molniy:
        value: 40 градусов перед стволом
        note: Дает игроку почувствовать сокрушительную мощь оружия, временно освобождая
          от необходимости ювелирного расчета ветра.
  inertsionnyy_pryzhok_cherez_mezhvagonnye_stsepki:
    name: Инерционный прыжок через межвагонные сцепки
    parameters:
      shirina_mezhvagonnogo_razryva:
        value: 3.5 м открытой бездны
        note: Если увеличить > 5 м, прыжок покажется нереалистичным без джетпака;
          если сделать < 2 м, преодоление сцепки перестанет ощущаться как смертельно
          опасное событие.
      vremya_svobodnogo_poleta_nad_stsepkoy:
        value: 0.65 с
        note: Дает ровно столько времени, чтобы совершить один прицельный выстрел
          в воздухе ('Air Shot') или скорректировать полосу приземления.
      vstrechnoe_shtormovoe_tormozhenie_v_vozduhe:
        value: Замедление горизонтальной скорости на 12% при ветре > 35 м/с
        note: Заставляет игрока совершать прыжок строго с разгона, наказывая за нерешительность
          перед краем вагона.
      shtraf_za_promah_mimo_kryshi_vagona:
        value: Мгновенная гибель (падение под колеса мчащегося поезда)
        note: Обеспечивает бескомпромиссную цену ошибки на стыках этапов забега.
