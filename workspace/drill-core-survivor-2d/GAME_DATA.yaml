raw_prompt: 'Разработай бесконечный вертикальный 2D рогалик на PixiJS. Игрок непрерывно
  бурит породу вниз сквозь разрушаемые блоки минералов и взрывчатки. С боков и снизу
  атакуют монстры. Сбор ресурсов заполняет шкалу крафта для выбора перков: ледяные
  охладители бура, ядерный таран, автоматические турели. Обильные искры, тряска экрана
  и сочные звуки разрушения пород.'
title: 'Бур Судного Дня: Шахтерский Рогалик'
slug: drill-core-survivor-2d
genre: Вертикальный 2D экшен-рогалик
subgenre: Шахтерский выживач / Reverse Tower Defense
renderer: pixijs
renderer_reason: User explicitly specified 'pixijs'.
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Mobile Web)
orientation: portrait
target_audience: Игроки 16-35 лет, фанаты Dome Keeper, Vampire Survivors, Motherload
  и мобильных таймкиллеров с сочной физикой разрушений.
core_loop: Бурение вниз -> Разрушение блоков и сбор кристаллов -> Отбивание волн подземных
  тварей -> Заполнение шкалы крафта -> Выбор синергетических перков -> Смерть или
  достижение рекордной глубины -> Мета-прокачка буровой машины.
hook: Безостановочный адреналиновый спуск в недра планеты, где каждый пробуренный
  метр создает лавину искр и взрывов, а ресурсы нужно добывать прямо под натиском
  орд монстров.
player_fantasy: Пилот несокрушимой высокотехнологичной буровой мехи, превращающей
  километры монолитного камня, взрывоопасных жил и чудовищных инсектоидов в пыль и
  ценные ресурсы.
session_model: Короткие, сверхплотные 4-8 минутные сессии с нарастающей интенсивностью
  и мгновенным перезапуском.
unique_value_proposition: Смесь разрушаемого процедурного террейна Motherload и авто-шутерной
  динамики Vampire Survivors с акцентом на максимальный тактильный 'juice' (screen-shake,
  искры, сочный звук).
vision: Создать главный мобильный веб-хит в жанре вертикального шахтерского экшена
  с непревзойденным ощущением разрушения и глубоким билдостроением.
elevator_pitch: Управляйте гигантским буром, прогрызающим недра чужой планеты! Взрывайте
  динамитные пласты, замораживайте перегревающийся бур, устанавливайте турели против
  роя монстров и прокачивайте свой ядерный таран прямо на лету.
win_conditions: Преодоление максимальных рубежей глубины (1000м, 2500м, 5000м) и победа
  над глубинными титанами-боссами каждого биома.
lose_conditions: Полное истощение очков прочности (HP) бура от атак монстров или детонации
  взрывоопасных блоков.
progression_summary: 'Внутри раунда: сбор ресурсов прокачивает уровень и дает выбор
  из 3 случайных перков. Мета-прогрессия: покупка постоянных модулей в ангаре (базовая
  броня, радиус магнита, стартовый урон турелей, крит-шанс бурения).'
difficulty_curve: Экспоненциальный рост плотности пород и агрессии врагов каждые 250
  метров глубины с появлением мутировавших видов монстров и нестабильных пластов магмы.
scores:
  fun: 9
  originality: 8
  replayability: 9
  development_cost: 8
  visual_appeal: 9
  mobile_fit: 10
  monetization: 9
  platform_fit: 10
  overall_score: 8.9
  justification: Портретный формат и интуитивное управление одним пальцем идеально
    подходят для мобильного веб-трафика. Мощный геймлуп и высокая реиграбельность
    обеспечивают топовое удержание и монетизацию через рекламу и IAP.
references:
- name: Dome Keeper
  genre: Шахтерский рогалик / Оборона базы
  mechanics:
  - Бурение сетки блоков
  - Сбор руды
  - Оборона от волн волн
  - Выбор веток апгрейдов
  lessons: Удовлетворение от разрушения блоков и звукового оформления добычи ресурсов.
  what_to_avoid: Медленный темп возврата на базу (в нашем проекте движение только
    вперед/вниз).
- name: Vampire Survivors
  genre: Авто-батлер / Рогалик
  mechanics:
  - Автоматическая стрельба
  - Драфт 3-х карточек при повышении уровня
  - Экспоненциальные толпы врагов
  lessons: Мгновенная дофаминовая отдача от синергии перков и уничтожения сотен врагов.
  what_to_avoid: Визуальный хаос, полностью скрывающий окружение и препятствия.
- name: Motherload / I Dig It
  genre: Вертикальная добыча ископаемых
  mechanics:
  - Спуск вглубь
  - Взрывчатка
  - Перегрев и прочность бура
  lessons: Увлекательность поиска ценных минералов и рискованных ходов сквозь взрывчатку.
  what_to_avoid: Рутинный медленный подъем обратно на поверхность.
mechanics:
- name: Непрерывное вертикальное бурение
  category: movement
  priority: core
  description: Бур непрерывно движется вниз. Игрок свайпом, джойстиком или клавишами
    A/D смещает бур влево и вправо, выбирая траекторию сквозь блоки разной твердости.
  player_interaction: Горизонтальное руление (A/D, стрелки, свайп/тач влево-вправо).
    Зажатие вниз активирует форсаж тарана.
  feedback: Импульсная тряска камеры (screen shake), фонтан искр и обломков породы,
    плотный виброотклик (haptics) и хруст крошащегося камня.
  technical_complexity: Medium
  strengths:
  - Бешеный темп
  - Легко освоить за 3 секунды
  - Высокая тактильность
  weaknesses:
  - Требует точной настройки скорости камеры, чтобы не укачивало игрока
- name: Сбор минералов и крафт-драфт
  category: progression
  priority: core
  description: Уничтоженные блоки выбрасывают руду и энерго-кристаллы. Магнит бура
    притягивает их, заполняя шкалу крафта. При заполнении шкалы игра входит в слоу-мо
    и предлагает 3 перка на выбор.
  player_interaction: Притяжение ресурсов корпусом и выбор 1 из 3 карточек перков
    нажатием пальца/кликом.
  feedback: Звонкий металлический звук подбора, яркие трассеры частиц в корпус бура,
    сочная анимация появления карточек с эффектом остановки времени.
  technical_complexity: Medium
  strengths:
  - Непрерывное чувство прогресса
  - Разнообразие билдов в каждом забеге
  weaknesses:
  - Слишком частые паузы могут сбивать динамику (решается замедлением времени вместо
    полной паузы)
- name: Оборона от подземных роев
  category: combat
  priority: core
  description: С боковых стен и снизу из недр на бур нападают подземные черви, скальные
    жуки и летающие споровики. Защита осуществляется авто-турелями, шипами корпуса
    и активными стихийными эффектами.
  player_interaction: Позиционирование бура так, чтобы турели имели линию огня, а
    нападающие снизу монстры попадали прямо под вращающиеся лезвия бура.
  feedback: Вспышки лазеров, разлетающиеся хитиновые панцири, индикаторы урона и нарастающий
    тревожный гул приближения роя.
  technical_complexity: High
  strengths:
  - Создает сильное напряжение и выбор между сбором руды и уклонением от врагов
  weaknesses:
  - Необходимо оптимизировать логику поиска пути для сотен мобов
- name: Взрывоопасные и стихийные блоки
  category: environment
  priority: secondary
  description: Порода содержит динамитные жилы, резервуары с лавой, газовые карманы
    и крио-линзы. Попадание буром или выстрелом вызывает цепные реакции разрушения.
  player_interaction: Игрок может целиться во взрывчатку, чтобы расчистить путь и
    уничтожить монстров, но рискует получить урон при близком контакте.
  feedback: Масштабная вспышка на весь экран, взрывная волна, разрушающая соседние
    блоки в радиусе, гулкий взрыв с саб-басом.
  technical_complexity: Medium
  strengths:
  - Создает зрелищные моменты риска и награды (risk-reward)
  - Быстрая очистка экрана
  weaknesses:
  - Возможные просадки FPS при взрыве 50+ блоков одновременно (нужен particle pool)
gameplay_systems:
- name: Система процедурной генерации пластов породы
  purpose: Создание бесконечной сбалансированной вертикальной шахты с блоками 5 уровней
    прочности, минералами, ловушками и пустотами.
  input: Текущая глубина бурения, сид уровня, коэффициент сложности биома.
  rules:
  - Генерация чанками по 16x16 блоков по мере спуска
  - Шанс появления ценных руд растет с глубиной
  - Взрывчатка спавнится кластерами от 2 до 6 блоков
  - Каждые 500 метров генерируется открытая арена с боссом биома
  state:
  - active_chunks
  - destroyed_blocks_mask
  - current_biome_id
  - ore_density_modifier
  interactions: Коллизия с буром отнимает прочность блока; при 0 HP блок спавнит ресурсы
    и частицы.
  feedback: Треснувшие текстуры блоков перед полным разрушением, звуковой тон повышается
    при твердой породе.
  edge_cases:
  - 'Непроходимый монолит: всегда гарантирован хотя бы 1 проходимый коридор шириной
    в бур'
  - Удаление верхних чанков из памяти для предотвращения утечек RAM
- name: Система перков и модификаций бура
  purpose: Предоставление игроку синергетических улучшений в стиле Roguelite во время
    раунда.
  input: Накопленный опыт/ресурсы, пул разблокированных перков.
  rules:
  - 3 случайных перка на драфт с шансом выпадения Редких и Легендарных
  - 'Ветви развития: Охлаждение/Лед (замедление врагов, защита от перегрева), Ядерная
    мощь (урон по площади, разрушение камня), Технологии дронов (авто-турели, сборщики)'
  - Эволюция перков при достижении 5 уровня слиянием двух базовых умений
  state:
  - equipped_perks_map
  - current_craft_xp
  - xp_to_next_perk
  - active_synergies
  interactions: Влияет на скорость бурения, количество стволов турелей, радиус крио-ауры
    и урон тарана.
  feedback: Визуальное изменение внешнего вида буровой мехи (добавление пушек, ледяной
    покров, неоновое свечение).
  edge_cases:
  - 'Исчерпание пула перков: выдавать универсальный бонус к ремонту корпуса или золоту'
- name: Система тактильного отклика и сочности (Game Feel & Juice)
  purpose: Обеспечение максимального аудиовизуального удовлетворения от каждого действия
    игрока.
  input: События коллизии бура, разрушения блоков, убийства врагов, взрывов.
  rules:
  - Screen Shake пропорционален твердости разрушенного блока и силе взрыва
  - Hitstop (микро-фриз на 1-2 кадра) при ударе по элитным врагам и крепким породам
  - Динамический зум камеры при активации ускорения/тарана
  - Пул частиц переиспользует спрайты без создания garbage collection (GC)
  state:
  - shake_intensity
  - camera_zoom_offset
  - active_particle_count
  - hitstop_timer
  interactions: Модулирует положение камеры PixiJS Container и воспроизводит аудио-сэмплы
    через Web Audio.
  feedback: Плавный и одновременно взрывной отклик экрана на кончиках пальцев.
  edge_cases:
  - Снижение интенсивности тряски на слабых устройствах через настройки
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: pixijs
  renderer_version: ^8.0.0
  physics_engine: Matter.js (^0.19.0)
  state_manager: Легковесный реактивный EventEmitter + Store на базе сигналов
  audio_engine: Howler.js с пулом Web Audio API каналов
  target_fps: 60
  max_draw_calls: 25
  max_triangles_or_sprites: 3500
  bundle_size_budget_mb: 2.8
  layers:
  - name: BackgroundLayer
    zIndex: 0
    description: Параллакс темных пластов подземных пещер и магматических жил
  - name: TerrainLayer
    zIndex: 10
    description: Блоки породы, руда, взрывчатка, отрисовываемые через ParticleContainer
      / Tilemap
  - name: DropLayer
    zIndex: 20
    description: Выпавшие кристаллы, шестеренки и подбираемые бонусы с магнитной физикой
  - name: EnemiesLayer
    zIndex: 30
    description: Спрайты подземных жуков, червей и боссов с анимацией атаки
  - name: PlayerLayer
    zIndex: 40
    description: Меха бура, анимированные фрезы, турели и лазерные лучи
  - name: VFXLayer
    zIndex: 50
    description: Искры, дым, вспышки взрывов, следы льда и ударные волны
  - name: UILayer
    zIndex: 100
    description: 'HUD: шкала глубины, HP, шкала крафта, карточки перков, оверлеи'
  modules:
  - name: GameEngine
    description: Управление главным циклом (Ticker), переключение состояний (State
      Machine)
  - name: ChunkManager
    description: Бесшовный спавн, переиспользование и очистка 2D тайловых чанков породы
  - name: DrillController
    description: Физика движения бура, расчет урона по блокам, перегрев и управление
  - name: EnemySpawner
    description: Контроль волн врагов в зависимости от пройденной глубины и событий
  - name: PerkManager
    description: Логика синергий, драфта карточек и модификаторов характеристик бура
  - name: JuiceSystem
    description: Управление Screen Shake, Hitstop, Particle Emitters и звуковыми триггерами
  - name: BridgeIntegration
    description: 'Обвязка Playgama SDK: реклама, облачные сохранения, лидерборды,
      локализация'
monetization:
  strategy_summary: 'Гибридная гипер-казуальная/мидкорная модель: мягкая ненавязчивая
    межстраничная реклама с таймером, ценные Rewarded видео (второй шанс, удвоение
    добычи) и IAP на покупку постоянных скинов и премиум-буров.'
  rewarded_placements:
  - id: revive_run
    name: Аварийный перезапуск реактора (Revive)
    benefit: Воскрешение бура с 100% HP, взрывной волной, очищающей экран от врагов
      и блоков, и 3 секундами неуязвимости.
    cooldown_or_limit: 1 раз за забег
    trigger_moment: Экран смерти при достижении глубины более 150 метров.
  - id: double_gold
    name: Удвоитель кристаллов экспедиции
    benefit: Умножение собранных за спуск мета-кристаллов на 2.
    cooldown_or_limit: После каждого успешного забега
    trigger_moment: Экран результатов забега.
  - id: starter_perk
    name: Орбитальный контейнер
    benefit: Выбор 1 бесплатного редкого перка перед началом спуска.
    cooldown_or_limit: 1 раз в 10 минут
    trigger_moment: Главное меню перед стартом забега.
  interstitial_placements:
  - trigger_event: Возврат в главное меню после гибели
    cooldown_seconds: 90
    conditions: Показывается только если игрок не воспользовался Rewarded Revive и
      забег длился более 45 секунд.
  - trigger_event: Переход между крупными биомами (после победы над боссом)
    cooldown_seconds: 120
    conditions: Только при паузе между фазами с предварительным предупреждением 'Чекпоинт
      пройден'.
  in_app_purchases:
  - sku: no_ads_pack
    name: Набор 'Комфортное бурение' (No Ads)
    description: Полное отключение межстраничной рекламы + постоянный бонус +15% к
      сбору ресурсов.
    price_tier: tier_2_usd
    reward: Отключение Interstitials, 1500 темных кристаллов, эксклюзивный золотой
      скин бура.
  - sku: titan_drill_pack
    name: Меха 'Титан Недр'
    description: Разблокировка мощного бура с предустановленными тяжелыми спаренными
      пулеметами.
    price_tier: tier_3_usd
    reward: Уникальный корпус бура, +20% к базовой скорости разрушения камней.
  - sku: crystals_chest
    name: Сундук Темной Материи
    description: Большой запас валюты для мгновенной прокачки всех модулей в ангаре.
    price_tier: tier_1_usd
    reward: 10 000 кристаллов мета-прогрессии.
  fairness_rules:
  - Любой апгрейд и скин можно открыть упорным геймплеем без доната
  - Реклама никогда не прерывает активное управление посреди геймплея
  - Смерть игрока никогда не навязывается искусственными пейволами
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - ok
  - crazygames
  - gamepix
  - telegram
  initialization_flow:
  - Инициализация PlaygamaBridge.init() при старте страницы
  - Загрузка сохраненного JSON прогресса игрока через bridge.storage.get()
  - Проверка языка интерфейса через bridge.platform.language и автоподстановка Ru/En
  - Предзагрузка рекламных баннеров и проверка готовности Rewarded видео
  - Скрытие загрузочного экрана (Loader) и запуск стартового экрана
  cloud_save_keys:
  - player_meta_upgrades
  - unlocked_drill_skins
  - max_depth_record
  - total_crystals_balance
  - audio_settings
  - onboarding_completed
  leaderboards:
  - max_depth_leaderboard
  - bosses_slain_leaderboard
  ads_integration:
    banner_supported: true
    banner_position: bottom
    rewarded_auto_reload: true
    interstitial_cooldown_sync: true
  lifecycle_hooks:
  - window.onblur / bridge.gameplay.pause -> автопауза физического мира и приглушение
    звука
  - window.onfocus / bridge.gameplay.resume -> возобновление тикера PixiJS
  - bridge.advertisement.onOpen -> глушение Master Audio Volume
  - bridge.advertisement.onClose -> восстановление звука и плавный возврат
art:
  style_name: Неоновый дизельпанк / Сочный сай-фай пиксель-арт высокого разрешения
  camera_perspective: 2D Top-Down / Скроллер сверху вниз с динамическим слежением
    за носом бура
  camera_fov: 50
  camera_pitch_angle: 0
  environment_theme: 'Мрачные подземные слои планеты: от базальтовых плит до светящихся
    кристаллических пещер, магматических разломов и древних био-гнезд.'
  character_proportions: Массивная, агрессивная бронированная буровая машина с крупными
    вращающимися роторными зубьями и видимыми модулями вооружения.
