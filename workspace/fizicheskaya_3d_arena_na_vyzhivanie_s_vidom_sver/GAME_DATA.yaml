  tension_curve: 'Кривая напряжения представляет собой экспоненциально нарастающую
    пилообразную волну с тремя драматическими пиками: 1. Старт (0–15 с, напряжение
    20–40%) — просторная арена, свободный разгон, безопасное зондирование соперников
    и легкий азарт первых фрагов. 2. Средняя фаза (15–45 с, напряжение 45–75%) — внезапный
    раскатистый треск айсберга, обрушение внешнего кольца из 8 плит, резкое сокращение
    безопасного пространства в 2 раза, хаотичные столкновения и паника при виде тонущего
    под колесами льда. 3. Кульминация (45–65 с, напряжение 80–100%) — критическая
    компрессия арены до 2.5-метрового пятачка, накрененного над бездной, оставшиеся
    2-3 гигантских тюбинга с максимальной массой непрерывно таранят друг друга на
    форсаже; ошибка в 0.05 секунды означает падение в воду. 4. Разрядка (65–75 с,
    напряжение 0%) — триумфальное замедление времени (slow-mo), ощущение абсолютного
    превосходства над стихией и сокрушенными соперниками, катарсис награждения.'
  core_formulas:
  - 'Кинетический импульс тарана: P_impact = (m_attacker * v_attacker - m_victim *
    v_victim) * k_boost_mult * (1 + 0.085 * kills_attacker), где k_boost_mult = 2.35
    при активном сопле реактивного форсажа.'
  - 'Уравнение динамического сноса ватрушки на льду: F_lateral_friction = -v_lateral
    * (mu_base * (1.0 - is_drifting * 0.88)) * m_tube * g, где mu_base = 0.65, а в
    заносе снижается до 0.078.'
  - 'Накопление заряда реактивной турбины: Nitro(t+dt) = Nitro(t) + (is_drifting ?
    (drift_slip_angle / 45.0) * 16.5 : 0.0) * dt.'
  - 'Гидродинамическое проседание и наклон ледовой плиты: Tilt_angle(t+dt) = min(26.5°,
    Tilt_angle(t) + (Total_Mass_on_plate / Mass_capacity)^2 * 14.0° * dt).'
  - 'Радиальная ударная волна контр-отскока: F_shockwave(r) = (1650.0 / max(1.0, r^1.5))
    * (is_perfect_timing ? 1.85 : 1.0) * Normal_contact.'
  - 'Рост массы и габаритов пилота: Mass_current = min(145.0 kg, 80.0 kg * (1.0 +
    0.085 * Kills)), Radius_current = 0.60 m * (1.0 + 0.045 * Kills).'
  run_progression:
  - 'Уровень Инерции I (Старт): Масса 80.0 кг, радиус 0.60 м. Базовая маневренность,
    тюбинг легко отлетает от столкновений с тяжелыми ботами, но быстро крутится на
    месте.'
  - 'Уровень Инерции II (1–2 фрага): Масса 87–94 кг (+17%), радиус 0.65 м. Тюбинг
    приобретает уверенный вес, лобовой таран уверенно сдвигает стандартных соперников
    с места, занос оставляет широкие борозды.'
  - 'Уровень Инерции III (3–4 фрага): Масса 101–108 кг (+35%), радиус 0.71 м. Тюбинг
    переходит в категорию тяжеловесов (''Ледовый Бульдозер''), турбо-рывок пробивает
    сразу двоих стоящих рядом ботов, но возрастает тормозной путь на льду.'
  - 'Уровень Инерции IV: Титан Айсберга (5+ фрагов): Масса 120–145 кг (+81%), радиус
    0.81 м. Колоссальная кинетическая мощь — любое касание на скорости превращает
    соперника в снаряд, улетающий за горизонт; однако гигантский вес требует ювелирного
    баланса, чтобы не утопить под собой последний островок льда.'
  meta_progression:
  - 'Лиговый Рейтинг (Ледовые Трофеи): 6 дивизионов от ''Снежинки Новичка'' (0-400
    кубков) до ''Владыки Арктики'' (3500+ кубков), открывающие доступ к экстремальным
    аренам с гейзерами и плавающими льдинами.'
  - 'Арсенал Тюбингов (12 моделей): Разблокировка уникальных рам — ''Молния-Спидстер''
    (максимальная скорость 28 м/с, сниженная масса), ''Мамонт-Джаггернаут'' (стартовая
    масса 110 кг, повышенная упругость бортов), ''Ледовый Вихрь'' (мгновенный вход
    в дрифт и бонус к зарядке турбины).'
  - 'Гардероб Арктических Пилотов (8 персонажей): Стилизованные рэгдолл-гонщики (Пингвин-Экстремал,
    Белый Медведь-Байкер, Йети на реактивной тяге, Морж-Капитан) с уникальными звуками
    криков при таране и падении в воду.'
  - 'Кастомные Реактивные Следы (6 VFX-шлейфов): Неоновый синий лед, раскаленная лавовая
    колея, искрящаяся плазма, северное сияние, праздничный морозный салют.'
  - 'Мастерство Морозных Клапанов (Кастомные звуки и эффекты отскока): Персонализация
    звуков ''Perfect Rebound'' (от резинового ''Бонг'' до басового взрыва гравитационной
    пушки).'
  mechanics:
  - name: Импульсный Реактивный Таран (Kinetic Boost Ram)
    role_in_loop: Двигатель агрессии и главный источник кинетического риска.
    player_decision: Рискнуть и сжечь 100% закиси азота в лобовом разгоне ради выбивания
      тяжеловеса к обрыву ИЛИ приберечь форсаж для мгновенного экстренного контрсмещения
      при собственном вылете с трескающейся льдины.
    input_mapping: 'Клавиатура: [Пробел] / [Shift] (удержание для форсажа). Тачскрин:
      Кнопка реактивного ускорителя справа внизу [BOOST] или двойной тап с удержанием
      виртуального стика.'
    states:
    - 'IDLE_GLIDE: Базовое скольжение со скоростью 6-11 м/с, пассивное накопление
      закиси азота +16.5 ед./с от чистого дрифта'
    - 'NITRO_IGNITION: Активация сопел (фаза разгона 0.25 с), скорость подскакивает
      до 24.7 м/с, вектор фиксируется с угловой жесткостью 15 град/с'
    - 'RAM_IMPACT: Контакт на скорости > 14 м/с, передача кинетического импульса P
      = m*v*1.75, микро-фриз 0.07 с, взрыв ледяных осколков'
    - 'RECOIL_VENTING: Откат после удара или исчерпания сопла (0.45 с), временная
      потеря управления на 30%, охлаждение турбины'
    parameters:
    - name: boost_multiplier
      value: 2.35x (с 10.5 м/с до 24.7 м/с)
      tuning_note: При значении < 1.8x таран не пробивает тяжелых соперников и теряет
        сочность; при > 3.0x тюбинг становится неуправляемым снарядом и вылетает с
        арены в 90% попыток.
    - name: boost_duration_max
      value: 1.8 с (при полном баллоне 100 ед.)
      tuning_note: Если увеличить до 3.0 с, игроки будут непрерывно летать по кругу
        без позиционной игры; если снизить до 0.8 с, не хватит дистанции для разгона
        через всю льдину.
    - name: boost_recharge_drift_rate
      value: 16.5 ед./с в дрифте (0 ед./с при прямолинейном качении)
      tuning_note: Если накапливать пассивно без заноса, пропадает стимул агрессивно
        нарезать дуги по тонкому льду; если сделать выше 25 ед./с, форсаж перестанет
        быть дефицитным тактическим ресурсом.
    - name: impact_freeze_frame
      value: 0.07 с (4 кадра при 60 FPS)
      tuning_note: При 0 с удар кажется плоским и 'ватным'; при > 0.15 с игра кажется
        сломанной и лагающей.
    feedback_layers:
    - 'Визуал/VFX: Яркий конус синего реактивного пламени из турбины тюбинга, частицы
      ледяного пара, радиальное искажение пост-процессинга (radial blur), веер 40+
      объемных ледяных осколков при столкновении.'
    - 'Звук (Web Audio): Синтезированный свист турбины с повышающимся питчем (200
      Гц -> 880 Гц), металлический ''дзынь'' воспламенителя, глубокий суб-басовый
      панч (45 Гц sine + white noise burst) в момент удара.'
    - 'Камера: Динамическое отдаление FOV с 60° до 74° при разгоне; резкий шейк с
      амплитудой 0.45 м и затуханием 0.22 с при таране.'
    - 'UI/Тактильность: Круговая дуговая шкала турбины вокруг тюбинга, вспышка виньетки
      экрана белым инеем, тактильная вибрация смартфона (паттерн 80 мс тяжелого удара).'
    failure_mode: 'Промах на форсаже мимо увернувшегося соперника на краю арены —
      игрок по инерции вылетает на скорости 24.7 м/с прямо в воду через трещину, не
      успев затормозить на скользком льду (сигнал: истошный свист сопла в пустоту
      и свист ветра).'
    mastery_curve: Новичок на 30-й секунде жмет буст по прямой в первого встречного
      и улетает в океан вместе с ним; эксперт на 10-м матче делает ложный разгон,
      прерывает буст контрсмещением, пропуская соперника в бездну, и использует остаток
      заряда на 0.2 с для решающего толчка в корму.
    counterplay: Тяжелые боты-джаггернауты ставят массивный борт, отражая до 50% вектора
      удара обратно в игрока, а юркие боты-скауты в последний момент уходят в занос,
      пропуская летящего на форсаже игрока по касательной в воду.
    synergies:
    - Инерционный Ледовый Дрифт (занос непрерывно заряжает баллон турбины)
    - Проламывание и Наклон Ледовых Плит (удар передает плите перегрузку, ускоряя
      раскол)
    - Поглощение Импульса Массы (большая масса делает таран сокрушительным)
    why_unique: 'В отличие от аркадных бамперов (Bumper.io), где таран — это мгновенный
      телепорт-рывок без инерции, здесь таран подчиняется полной физике твердых тел:
      вектор разгона сохраняет боковой снос на льду, а сила удара пропорциональна
      набранной кинетической энергии.'
    pseudocode: "function tickBoostRam(player, input, dt):\n    if input.boost_held\
      \ and player.nitro > 0:\n        player.nitro = max(0.0, player.nitro - 55.0\
      \ * dt)\n        let forward = player.transform.forward\n        player.rb.applyForce(forward\
      \ * 2400.0 * player.mass)\n        spawnThrusterFlame(player.position, forward)\n\
      \    else if player.is_drifting:\n        player.nitro = min(100.0, player.nitro\
      \ + 16.5 * dt)\n    if player.has_collided_this_frame(target):\n        let\
      \ rel_vel = (player.rb.velocity - target.rb.velocity).length()\n        if rel_vel\
      \ > 14.0:\n            let impulse = calculateImpulse(player, target, 1.75)\n\
      \            target.rb.applyImpulse(impulse)\n            player.rb.applyImpulse(-impulse\
      \ * 0.35)\n            triggerHitstop(0.07); triggerCameraShake(0.45)"
  - name: Инерционный Ледовый Дрифт и Контрсмещение (Inertial Drift & Counter-Steer)
    role_in_loop: Двигатель позиционирования, источник мастерства и инструмент уклонения.
    player_decision: Заложить глубокий силовой занос по внешнему радиусу для быстрой
      зарядки реактивной турбины ИЛИ выровнять тюбинг микро-подруливанием, пожертвовав
      скоростью ради безопасного удержания центрального пятачка.
    input_mapping: 'Клавиатура: [A]/[D] или [Стрелки влево/вправо] — подруливание;
      [W] — газ вперед, [S] — тормозной разворот (зарезка канта). Тачскрин: Плавающий
      виртуальный джойстик слева (отклонение пальца задает вектор тяги и угол заноса).'
    states:
    - 'GRIP_ROLL: Прямолинейное качение с высоким боковым сцеплением (lat_friction
      = 0.65) на скоростях до 7 м/с'
    - 'POWER_DRIFT: Срыв в боковое скольжение при резком повороте на скорости > 7
      м/с (lat_friction падает до 0.078), генерация ледяного шлейфа и закиси азота'
    - 'SNAP_COUNTERSTEER: Резкая перекладка руля в противоположную сторону — возврат
      сцепления с выбросом снежного веера и выравниванием вектора'
    - 'SPINOUT_LOCK: Неконтролируемое кручение при вращательном моменте > 420 град/с
      (потеря управления на 0.6 с при касательном ударе)'
    parameters:
    - name: ice_friction_dynamic
      value: 0.078 mu (в заносе) против 0.65 mu (при прямом качении)
      tuning_note: При значении < 0.04 тюбинг превращается в неуправляемое мыло на
        льду; при > 0.20 пропадает ощущение ледового скольжения и игра превращается
        в обычный картинг на асфальте.
    - name: drift_slip_angle_threshold
      value: 22.5 градуса между вектором скорости и направлением корпуса
      tuning_note: При пороге < 10° дрифт срабатывает от малейшего чиха и мешает точному
        прицеливанию; при > 40° войти в управляемый занос становится почти невозможно.
    - name: counter_steer_torque
      value: 320.0 Н·м/рад
      tuning_note: Если увеличить до 600, тюбинг мгновенно прилипает к траектории
        без инерционного риска; если занизить до 150, игрок не сможет спастись от
        соскальзывания в воду при наклоне плиты.
    - name: snow_spray_particle_rate
      value: 120 частиц/с при угловой скорости > 30 град/с
      tuning_note: Меньше 60 — траектория заноса не читается визуально; больше 250
        — просаживает FPS на мобильных устройствах.
    feedback_layers:
    - 'Визуал/VFX: Плотные снежные фонтаны из-под бортов тюбинга, динамические борозды
      на текстуре льда (decal trail), наклон персонажа внутрь поворота (body roll
      14°).'
    - 'Звук (Web Audio): Характерный хрустящий скрежет резины по плотному насту (band-pass
      filtered pink noise 1200-3400 Гц), меняющий частоту от угла заноса.'
    - 'Камера: Камера плавно доворачивает с отставанием в 0.18 с (spring-arm damper),
      подчеркивая динамический угол скольжения.'
    - 'UI/Тактильность: Мягкая непрерывная микровибрация при непрерывном срыве в занос,
      вспышка индикатора ''DRIFT CHARGE'' на корпусе.'
    failure_mode: 'Перебор с углом атаки возле края льдины — центробежная сила срывает
      тюбинг в воду через открытый разлом льда (сигнал: звук треска тонкого налипшего
      льда и резкий красный маркер срыва вектора).'
    mastery_curve: Новичок боится дрифтовать и двигается короткими тычками, теряя
      скорость; мастер использует 'скандинавский флик' (быструю перекладку) для огибания
      тонущих плит и мгновенного выхода на траекторию тарана.
    counterplay: При узких углах поворота на большой скорости центробежная сила преодолевает
      силу сцепления, заставляя ватрушку скользить к тонущему внешнему краю даже при
      полностью вывернутом руле.
    synergies:
    - Импульсный Реактивный Таран (дрифт непрерывно заряжает форсаж)
    - Проламывание и Наклон Ледовых Плит (занос распределяет вес по площади льдины)
    - Ударная Волна и Реактивный Отскок (выход из дрифта позволяет подставить защищенный
      борт)
    why_unique: Вместо стандартного аркадного 'прилипающего' дрифта из мобильных гонок,
      здесь реализована честная физика сноса задней оси ватрушки с учетом динамического
      трения льда и гидродинамической плавучести основания.
    pseudocode: "function tickIceDrift(player, steerInput, dt):\n    let vel = player.rb.velocity\n\
      \    let speed = vel.length()\n    let forward = player.transform.forward\n\
      \    let slip_angle = angleBetween(vel.normalized(), forward)\n    if speed\
      \ > 7.0 and slip_angle > 0.39:\n        player.is_drifting = true\n        let\
      \ side_friction = 0.078\n        let lat_vel = player.transform.right * dot(vel,\
      \ player.transform.right)\n        player.rb.applyForce(-lat_vel * side_friction\
      \ * player.mass * 60.0)\n        emitSnowSpray(player.position, -vel.normalized(),\
      \ slip_angle)\n    else:\n        player.is_drifting = false\n    let turn_torque\
      \ = steerInput * (player.is_drifting ? 320.0 : 180.0)\n    player.rb.applyTorque(Vector3.UP\
      \ * turn_torque)"
  - name: Проламывание и Динамический Наклон Ледовых Плит (Dynamic Ice Fracture &
      Tilting)
    role_in_loop: Главный регулятор темпа матча, сужение пространства и источник смертельной
      опасности окружения.
    player_decision: Занять рискованную внешнюю плиту, чтобы срезать путь к легкому
      фрагу ИЛИ остаться на переполненной центральной плите, где велик риск группового
      столкновения, но лед пока не тонет.
    input_mapping: Прямого ввода нет (механика окружения, управляемая позиционированием
      и весом игроков). Игрок реагирует перемещением [WASD/Стик] для балансировки
      центра масс плиты.
    states:
    - 'STABLE_FROZEN: Прочность 100%, плита параллельна горизонту (наклон 0°), бело-голубая
      текстура монолитного пакового льда'
    - 'STRESSED_CRACKING: Нагрузка > 230 кг (2+ тюбинга) или удар > 12 кН — появление
      ветвящихся трещин, звуки скрежета, прочность тает на 15%/с'
    - 'TILTING_SUBMERGE: Прочность 0% — плита отделяется от айсберга, наклоняется
      на угол до 26.5° в сторону открытого моря и тонет со скоростью 0.42 м/с'
    - 'ABYSS_FALL: Плита полностью погрузилась под воду (Y < -1.2 м), исчезает в пучине;
      любые объекты на ней смываются в океан'
    parameters:
    - name: critical_mass_threshold
      value: 230.0 кг (эквивалент 2 тяжелых тюбингов или 3 легких)
      tuning_note: Если снизить до 100 кг, плиты будут тонуть от одного игрока, делая
        бой невозможным; если повысить до 500 кг, плиты не будут реагировать на скопление
        соперников.
    - name: tilt_angle_max
      value: 26.5 градусов к горизонту
      tuning_note: При угле > 35° все тюбинги моментально соскальзывают в воду без
        шанса выехать обратно; при угле < 15° наклон не создает гравитационной угрозы.
    - name: submerge_sink_speed
      value: 0.42 м/с вертикально вниз
      tuning_note: При скорости > 0.8 м/с плита проваливается мгновенно, не оставляя
        времени на спасительный прыжок/рывок; при < 0.2 м/с фаза компрессии становится
        затянутой и скучной.
    - name: ring_collapse_interval
      value: 12.0 с на обрушение внешнего кольца из 8 сегментов
      tuning_note: Быстрее 8 с — сессия превращается в хаотичный рандом; медленнее
        20 с — игроки успевают встать в кемпинг в центре.
    feedback_layers:
    - 'Визуал/VFX: Динамический шейдер растрескивания (crack tessellation), пена и
      пузыри воды, захлестывающие край наклонившейся плиты, вздымающиеся волны.'
    - 'Звук (Web Audio): Глубокий раскатистый треск ледового массива (sub-bass transient
      + granular crackle), шипение бурлящей ледяной воды (filtered white noise 400-800
      Гц).'
    - 'Камера: Низкочастотный гулкий экранный тремор (частота 8 Гц, смещение 0.15
      м) при окончательном расколе плиты.'
    - 'UI/Тактильность: Мигающий красный контур опасной зоны под тонущей плитой, нарастающая
      пульсирующая вибрация геймпада/экрана при нахождении на тонущем льду.'
    failure_mode: 'Игрок задерживается на треснувшей плите дольше 1.5 секунд — плита
      наклоняется в море, и тюбинг неумолимо скатывается по скользкому склону в воду,
      даже газуя вперед (сигнал: экран заливает ледяными брызгами, иконка тонущей
      плиты).'
    mastery_curve: Новичок паникует и случайно заезжает на уже тонущую плиту; гроссмейстер
      арены намеренно провоцирует соперников на преследование, заманивает 3 ботов
      на надломленную плиту и катапультируется форсажем в центр за мгновение до катастрофы.
    counterplay: Гравитационный скат на наклоненной плите тянет тюбинги вниз к воде,
      ускоряя соскальзывание даже при попытке газовать в гору.
    synergies:
    - Импульсный Реактивный Таран (таран сбрасывает врага на тонущую кромку)
    - Инерционный Ледовый Дрифт (дрифт позволяет соскочить по дуге с наклоненной плоскости)
    - Поглощение Импульса Массы (тяжелый игрок быстрее топит плиту под ногами врагов)
    why_unique: 'Ледовая арена — это не просто статичная зона с сужающимся кольцом
      (как в Battle Royale), а полностью физическая гидродинамическая система: каждый
      сегмент льда плавает, покачивается от волн и кренится под суммарным вектором
      тяжести находящихся на нем объектов.'
    pseudocode: "function tickIcePlate(plate, dt):\n    let total_mass = calculateTotalMassOnPlate(plate)\n\
      \    if total_mass > plate.mass_capacity or plate.is_scripted_sinking:\n   \
      \     plate.health -= (total_mass / plate.mass_capacity) * 35.0 * dt\n     \
      \   playCracklingSound(plate.health / 100.0)\n    if plate.health <= 0.0:\n\
      \        plate.tilt_angle = min(26.5, plate.tilt_angle + 18.0 * dt)\n      \
      \  plate.position.y -= 0.42 * dt\n        applyGravitySlopeToObjects(plate,\
      \ plate.tilt_angle)\n        if plate.position.y < -1.2:\n            plate.is_destroyed\
      \ = true; destroyPlate(plate)"
  - name: Поглощение Импульса Массы и Рост Калибра (Mass Momentum Absorption)
    role_in_loop: Источник награды внутри забега, snowball-механика и изменение баланса
      сил.
    player_decision: Завалить слабого и легкого соперника на ранней стадии ради быстрой
      прибавки к массе (+8.5%) ИЛИ сразу атаковать текущего лидера раунда, рискуя
      быть отброшенным его огромной инерцией.
    input_mapping: Пассивная механика, активирующаяся в момент подтверждения фрага
      (выталкивания оппонента в океан).
    states:
    - 'BASE_WEIGHT: Стартовая масса тюбинга 80.0 кг, диаметр 1.20 м, высокая отзывчивость
      на руль (turn_rate = 180 град/с)'
    - 'MASS_SURGE_ABSORPTION: Момент устранения соперника — приток кинетической сферы
      энергии, увеличение массы на +8.5%, микро-хил турбины'
    - 'HEAVYWEIGHT_JUGGERNAUT: Максимальный ранг массы (145.0 кг, диаметр 1.55 м)
      — колоссальная инерция, сокрушительный таран, но сниженная на 18% скорость разворота'
    parameters:
    - name: mass_gain_per_kill
      value: +8.5% к текущей массе за каждый подтвержденный фраг
      tuning_note: При значении < 4% игрок не чувствует прироста силы и веса; при
        > 15% первый сделавший 2 фрага становится неуязвимым танком, ломающим соревновательный
        баланс.
    - name: scale_gain_per_kill
      value: +4.5% к геометрическому радиусу коллайдера тюбинга
      tuning_note: Если сделать больше 8%, к концу раунда тюбинг не поместится на
        2-метровый финальный ледовый пятачок; если 0% — отсутствует визуальное подтверждение
        триумфа.
    - name: inertia_handling_penalty
      value: -3.2% к угловой скорости поворота за каждый стек массы
      tuning_note: Если штраф убрать, тяжеловес не имеет слабостей; если штраф сделать
        > 8%, гигантский тюбинг становится совершенно неповоротливым бревном.
    - name: max_mass_cap
      value: 145.0 кг (+81% от базы при 7 фрагах)
      tuning_note: Жесткий потолок, гарантирующий, что даже финального босса-гиганта
        можно выбить синхронным ударом или подтапливанием льда.
    feedback_layers:
    - 'Визуал/VFX: Надувание баллона тюбинга с анимацией эластичной отдачи (squash
      & stretch), яркие золотисто-голубые арктические сферы энергии, летящие от тонущего
      врага к игроку.'
    - 'Звук (Web Audio): Звучный накачивающий щелчок насоса высокого давления (pitch-shifted
      click 520 Гц -> 780 Гц), триумфальный мажорный звон ледяного колокольчика.'
    - 'Камера: Энергичный микро-зум на тюбинг игрока (punch-in на 0.12 с) с последующим
      возвратом к более широкому обзору под возросший размер.'
    - 'UI/Тактильность: Всплывающий золотой 3D-текст ''+MASS!'', индикатор весовой
      категории (LIGHT -> MEDIUM -> HEAVY -> TITAN) возле шкалы форсажа, двойной тактильный
      вибро-импульс.'
    failure_mode: 'Игрок набрал максимальную массу, но переоценил стабильность льда
      — из-за огромного веса (145 кг) плита под ним трескается вдвое быстрее, и он
      сам топит под собой спасительный островок (сигнал: угрожающий алый индикатор
      перегруза плиты OVERLOAD).'
    mastery_curve: Новичок просто радуется росту размера и тупо таранит всех подряд;
      опытный боец понимает, что на тяжелом тюбинге нельзя стоять на месте, и непрерывно
      дрифтует по касательной, компенсируя возросшую инерцию радиусом заноса.
    counterplay: С ростом массы падает маневренность, а на тонких плитах возрастает
      риск мгновенно проломить лед под собственным весом.
    synergies:
    - Импульсный Реактивный Таран (тяжелый тюбинг передает сокрушительный импульс
      F = dp/dt)
    - Проламывание и Наклон Ледовых Плит (большой вес ускоряет затопление вражеских
      сегментов)
    why_unique: 'В отличие от Agar.io/Slither.io, где размер просто дает зону поглощения,
      здесь масса напрямую включена в уравнения механики твердых тел Rapier3D: меняется
      момент инерции вращения, тормозной путь и давление на плавающие ледяные платформы.'
    pseudocode: "function onOpponentDrowned(killer, victim):\n    if killer.is_player\
      \ or killer.is_bot:\n        let added_mass = killer.base_mass * 0.085\n   \
      \     killer.mass = min(145.0, killer.mass + added_mass)\n        killer.rb.setMass(killer.mass)\n\
      \        killer.scale = min(1.35, killer.scale + 0.045)\n        killer.mesh.scale.setScalar(killer.scale)\n\
      \        killer.turn_speed *= 0.968\n        playMassAbsorbVFX(victim.position,\
      \ killer.position)\n        playPumpSound()"
  - name: Ударная Волна и Реактивный Отскок Бортов (Shockwave Rebound Burst)
    role_in_loop: Источник спасения, инструмент комбо-защиты и контратаки в ближнем
      бою.
    player_decision: Принять лобовой удар соперника ради разрядки накопленного кинетического
      щита борта в ответную взрывную волну ИЛИ уклониться маневром, сберегая позицию
      на льду.
    input_mapping: 'Клавиатура: [Space] в момент контакта (< 0.14 с до соприкосновения)
      или автоматический выброс энергии при критической компрессии надувного борта.
      Тачскрин: Кнопка реактивного клапана [REBOUND] над кнопкой газа.'
    states:
    - 'RUBBER_COMPRESSION: Сжатие резинового баллона тюбинга при ударе на 15-35% его
      диаметра с сохранением упругой потенциальной энергии'
    - 'PERFECT_REBOUND: Идеальный тайминг контргаза в момент сжатия — выброс кольцевой
      ударной волны сжатого воздуха (радиус 3.8 м)'
    - 'DAMPED_BOUNCE: Обычный упругий отскок по закону сохранения импульса при пассивном
      столкновении (коэффициент реституции e = 0.82)'
    parameters:
    - name: rebound_timing_window
      value: 0.14 с (активное окно идеального контр-отскока)
      tuning_note: При окне > 0.25 с парирование становится элементарным спамом; при
        < 0.06 с в него невозможно попасть на сенсорном экране смартфона.
    - name: shockwave_radius
      value: 3.8 м кольцевого импульса сжатого воздуха
      tuning_note: Если увеличить до 6.0 м, один отскок будет сметать всех с арены;
        если уменьшить до 1.5 м, волна не будет задевать стоящих рядом соперников.
    - name: restitution_coefficient
      value: 0.82 (коэффициент упругости надувного борта)
      tuning_note: При e < 0.5 столкновения ощущаются пластилиновыми и вязкими; при
        e > 1.1 тюбинги без контроля разлетаются как шары в бильярде.
    - name: shockwave_force
      value: 1650.0 Н радиального отталкивания
      tuning_note: Если занизить до 700 Н, волна едва покачнет врага; если завысить
        до 3500 Н, гарантированно сбросит любого в воду вне зависимости от массы.
    feedback_layers:
    - 'Визуал/VFX: Радиальное кольцо ударной волны (белый тороидальный фронт сжатого
      воздуха), сдувающий снежную пыль со льда, резкая деформация резинового тора
      тюбинга.'
    - 'Звук (Web Audio): Громкий упругий хлопок лопнувшего воздушного пузыря (snappy
      transient 600 Гц + low boom 80 Гц), свист стравливаемого клапана высокого давления.'
    - 'Камера: Мгновенный резкий радиальный толчок камеры от эпицентра удара (radial
      kick 0.25 м).'
    - 'UI/Тактильность: Всплывающая надпись ''PERFECT REBOUND!'', яркая вспышка ореола
      вокруг тюбинга, четкий резкий щелчок Taptic Engine.'
    failure_mode: 'Игрок прожимает отскок слишком рано или поздно — тюбинг получает
      полный нескомпенсированный импульс чужого тарана и отлетает к обрыву (сигнал:
      глухой резиновый стук и потеря инерции).'
    mastery_curve: Новичок надеется только на пассивный отскок; мастер подставляет
      борт под летящего на таране гиганта, жмет 'Perfect Rebound' и силой встречной
      ударной волны отправляет атакующего обратно в воду по его же траектории.
    counterplay: При промахе тайминга контр-отскока тюбинг принимает 100% нескомпенсированного
      кинетического импульса врага и теряет управление.
    synergies:
    - Импульсный Реактивный Таран (контрит чужой форсаж)
    - Инерционный Ледовый Дрифт (позволяет подставить борт нужной стороной)
    - Проламывание и Наклон Ледовых Плит (ударная волна очищает тонущую плиту от врагов)
    why_unique: Превращает надувной тюбинг из пассивного резинового круга в динамический
      упругий резонатор, где правильный тайминг столкновения позволяет использовать
      кинетическую энергию врага против него самого.
    pseudocode: "function onTubeCollision(tubeA, tubeB, contactPoint):\n    let normal\
      \ = (tubeA.position - tubeB.position).normalized()\n    let rel_speed = (tubeA.rb.velocity\
      \ - tubeB.rb.velocity).length()\n    if tubeA.input_rebound_pressed and tubeA.rebound_timer\
      \ < 0.14:\n        triggerShockwave(contactPoint, 3.8, 1650.0)\n        tubeB.rb.applyImpulse(-normal\
      \ * (rel_speed * tubeB.mass * 1.8))\n        tubeA.rb.applyImpulse(normal *\
      \ 300.0)\n        playPerfectReboundFX(contactPoint)\n    else:\n        let\
      \ m_eff = (tubeA.mass * tubeB.mass) / (tubeA.mass + tubeB.mass)\n        let\
      \ impulse = normal * (rel_speed * 0.82 * m_eff)\n        tubeA.rb.applyImpulse(impulse);\
      \ tubeB.rb.applyImpulse(-impulse)"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 55
  max_triangles_or_sprites: 32000
  bundle_size_budget_mb: 3.8
  layers:
  - description: GameLoop, TimeStep, EventBus, StateMachine состояний матча
    name: CoreLayer
  - description: Wasm симуляция Rapier3D, RigidBodies тюбингов и 16 сегментов льда,
      сенсоры воды
    name: PhysicsLayer
  - description: Сцена Three.js, кастомные шейдеры лазурного льда и пены, инстансированные
      частицы
    name: RenderLayer
  - description: PlayerController, SumoBotAI, IceArenaFractureController, MassProgressionManager
    name: GameplayLayer
  - description: Сенсорный джойстик, HUD раунда, радар льда, экран гаража и модальные
      окна
    name: UILayer
  - description: 'Playgama Bridge SDK: Cloud Saves, Rewarded Ads, Interstitial, Leaderboards'
    name: PlatformLayer
  modules:
  - description: Инициализация Wasm Rapier3D, симуляция 60 Гц, обработка контактных
      пар и плавучести Архимеда
    name: PhysicsManager
  - description: Генерация 16-сегментной арены, расчет прочности плит, анимация крена
      и погружения
    name: IceArenaManager
  - description: Обработка ввода (Touch Joystick / WASD), расчет сил тяги, дрифта
      и реактивного форсажа
    name: PlayerController
  - description: Управление 7 AI-агентами с конечными автоматами поведения и поиском
      целей
    name: BotDirector
  - description: Инстансированные частицы для брызг воды (2000 шт), ледяной крошки
      (1500 шт) и следов в 1 Draw Call
    name: VFXParticlePool
  - description: Пространственный 3D звук ударов, треска льда, реактивного свиста
      и плеска воды на Web Audio API
    name: AudioManager
  - description: Асинхронная синхронизация прогресса через Playgama Cloud Save с локальным
      fallback в localStorage
    name: StorageService
monetization:
  strategy_summary: 'Гибридная этичная модель для гиперказуальных / аркадных WebGL-игр:
    Rewarded Video для второго шанса и мультипликатора наград, ненавязчивые Interstitial
    между завершенными раундами с таймером охлаждения (90 с), и опциональные IAP для
    мгновенной разблокировки эксклюзивных скинов тюбингов и отключения рекламы.'
  rewarded_placements:
  - id: revive_second_chance
    name: Ледовое Спасение (Revive)
    benefit: Возврат тюбинга на центральный стабильный лед с 2 секундами щита неуязвимости
    cooldown_or_limit: 1 раз за раунд (только если на арене осталось 3+ участников)
    trigger_moment: Сразу после первого падения игрока в воду
  - id: multiply_match_rewards
    name: Золотой Бур (3x Награда)
    benefit: Утроение заработанных за матч монет и +50% дополнительных очков трофейного
      прогресса
    cooldown_or_limit: Без ограничений после каждого завершенного матча
    trigger_moment: Экран завершения матча (Victory/Defeat Screen)
  - id: unlock_free_tubing_trial
    name: Тест-Драйв Премиум Тюбинга
    benefit: Временный доступ на 3 матча к легендарной ватрушке 'Полярный Дракон'
      с уникальным следом
    cooldown_or_limit: 1 раз в 4 часа
    trigger_moment: Главное меню / Гараж тюбингов
  interstitial_placements:
  - trigger_event: Завершение матча (возврат в главное меню или запуск следующего
      раунда)
    cooldown_seconds: 90
    conditions: Показывается только если игрок не смотрел Rewarded Video в текущем
      раунде и провел в игре более 90 секунд
  in_app_purchases:
  - sku: no_ads_bundle
    name: Отключение Рекламы + Скин 'Неоновый Айсберг'
    description: Навсегда убирает межстраничные баннеры и открывает неоновый светящийся
      тюбинг
    price_tier: Tier 2 (~149 YAN / 199 RUB)
    reward: Пожизненное отключение Interstitial Ads + 1000 ледовых монет + Неоновый
      тюбинг
  - sku: tubing_pack_legendary
    name: Набор Полярных Чемпионов
    description: 3 легендарных скина тюбингов ('Викинг', 'Торпеда', 'Кракен') и уникальный
      огненный след
    price_tier: Tier 3 (~299 YAN / 349 RUB)
    reward: 3 легендарных тюбинга + 2500 ледовых монет
  fairness_rules:
  - 'Никакого Pay-to-Win: все скины тюбингов и эффекты следов имеют абсолютно равные
    физические параметры (масса, скорость и сцепление идентичны)'
  - Реклама никогда не прерывает активный геймплей внутри раунда
  - Всегда доступна бесплатная альтернатива прогресса через обычную игру и победы
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazy_games
  - game_distribution
  - web
  initialization_flow:
  - 1. bridge.initialize() при старте HTML страницы до инициализации Three.js
  - 2. bridge.advertisement.showBanner() (если платформа поддерживает баннеры)
  - 3. bridge.player.loadData(['trophies', 'coins', 'unlocked_tubings', 'equipped_skin'])
  - 4. Синхронизация локального стора и запуск вступительной сцены
  cloud_save_keys:
  - player_trophies
  - player_coins
  - unlocked_tubing_ids
  - unlocked_trail_ids
  - current_equipped_tubing
  - current_equipped_trail
  - stats_total_matches
  - stats_total_wins
  - stats_total_kills
  - settings_sound_volume
  - settings_music_volume
  - settings_vibration_enabled
  leaderboards:
  - leaderboard_trophies_global (Общий рейтинг по количеству кубков)
  - leaderboard_weekly_wins (Количество побед за текущую неделю)
  ads_integration:
    banner_handler: bridge.advertisement.showBanner() для десктопных версий
    interstitial_handler: bridge.advertisement.showInterstitial() с проверкой cooldown
      (90 с)
    rewarded_handler: bridge.advertisement.showRewardedVideo() с обработкой 'rewarded'
      и 'closed'
  lifecycle_hooks:
  - bridge.platform.on('pause', () => GameEngine.pause())
  - bridge.platform.on('resume', () => GameEngine.resume())
  - window.addEventListener('beforeunload', () => GameEngine.saveCloudDataSync())
