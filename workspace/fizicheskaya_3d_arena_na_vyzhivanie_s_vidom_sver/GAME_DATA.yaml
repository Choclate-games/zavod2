raw_prompt: Физическая 3D арена на выживание с видом сверху-сзади на раскалывающейся
  посреди океана льдине. Игрок управляет снегоходом или тюбингом с помощью клавиатуры
  или экранного джойстика, разгоняясь и врезаясь в машины соперников для выталкивания
  их за край. На экране видна уменьшающаяся круглая льдина, разлетающиеся от ударов
  ватрушки, волны и брызги воды. Задача игрока — маневрировать по безопасным устойчивым
  сегментам льда, агрессивно сбивать оппонентов в воду и остаться последним выжившим
  на арене.
title: 'Ледовый Сумо-Батл: Последний Тюбинг'
slug: fizicheskaya_3d_arena_na_vyzhivanie_s_vidom_sver
genre: 3D Физический Экшен
subgenre: Ледовый Сумо-Батлер / Физический Last Man Standing
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web)
orientation: landscape
target_audience: Игроки 12–35 лет, ценящие мгновенный соревновательный экшен, выразительную
  физику столкновений, комедийный рэгдолл-эффект и короткие насыщенные сессии (45–75
  секунд) на ПК и смартфонах без необходимости длительного обучения.
core_loop: 1. Набрать инерцию и занять выгодный сектор -> 2. Разогнаться и нанести
  импульсный таран по сопернику на краю -> 3. Увернуться от встречного отскока и перейти
  на стабильный лед -> 4. Пережить раскол внешних плит и победить последнего оппонента
  в центре льдины -> 5. Получить кубки и разблокировать новые кастомные тюбинги и
  эффекты брызг.
hook: Момент, когда на последних 10 секундах матча льдина сжимается до крошечного
  пятачка на 2 метра, ты на форсаже врезаешься в лоб главному гиганту-сопернику, твоя
  ватрушка взмывает в воздух, а его тюбинг с треском уносит в воду на откалывающейся
  льдине за полсекунды до конца раунда.
player_fantasy: Ты — безбашенный арктический экстремал на сверхбыстром надувном тюбинге
  с реактивным ускорителем, который на бешеной скорости рассекает по раскалывающемуся
  айсбергу, расталкивает тяжеловесных соперников в ледяной океан и балансирует на
  грани падения в воду.
session_model: Матч на выбывание на 8 участников (Last Man Standing) длительностью
  45–75 секунд на уменьшающейся 16-сегментной льдине до последнего выжившего тюбинга.
unique_value_proposition: Единственная 3D физическая арена в браузере, объединяющая
  честную кинематику столкновения масс (p=mv) на Rapier3D с динамически разрушающимся
  монолитом льда, где каждый удар физически деформирует и топит саму арену.
vision: Создать самый динамичный, сочный и вирусный браузерный физический батлер,
  где интуитивное управление одним джойстиком дарит глубину позиционной тактики и
  комедийный восторг от физических столкновений на тающей льдине.
elevator_pitch: 'Ледовый Сумо-Батл: Последний Тюбинг — это взрывной 3D физический
  батл-рояль на 8 участников, где ты на реактивной надувной ватрушке выбиваешь соперников
  с раскалывающейся посреди океана льдины за 60 секунд чистого адреналина!'
win_conditions: Остаться единственным выжившим тюбингом на оставшихся ледовых сегментах
  арены после ликвидации всех 7 соперников в воду (1-е место в раунде).
lose_conditions: Падение тюбинга игрока в воду за пределы устойчивой льдины (погружение
  ниже ватерлинии Y < -0.8 м) или затопление вместе с отколовшимся сегментом льда
  до устранения всех оппонентов.
progression_summary: 'Внутри раунда: рост массы и силы инерции за выбитых оппонентов
  (+8% массы за фраг) и заряд форсажа. Между матчами: набор Ледового рейтинга (Трофеи),
  открытие 12 уникальных скинов тюбингов с уникальными аэродинамическими формами,
  8 скинов пилотов и 6 кастомных следов скольжения (неоновый лед, огненный след, брызги
  пены).'
difficulty_curve: 'Динамическая компрессия пространства: в первые 15 секунд арена
  широкая (радиус 18 м, 16 плит), боты совершают пробные тараны; на 25–45 секундах
  внешнее кольцо из 8 плит тонет, боты включают форсаж и агрессивный фокус игрока;
  на 50–70 секундах остаётся лишь 4 центральные плиты с минимальным сцеплением, требующие
  филигранного баланса и точных контрударов.'
