  - id: D2
    name: 'Ледорез: Охота на Трещинах'
    pitch: 'Тактический снегоходный триллер на выживание: прорезай глубокие борозды
      в хрупком льду, замыкай контуры разломов и топи соперников целыми отколотыми
      секторами.'
    core_verb: Отрезать
    genre_family: 3D Физическая Тактическая Арена / Зональный срез (Qix-like Arena)
    session_shape: Тактический матч Best-of-3 (3 быстрых раунда по 30–45 секунд со
      сменяющейся структурой ледяного щита)
    camera: Изометрическая 2.5D камера сверху под углом 60° с полным обзором всей
