    мгновенного выбивания врага или приберечь ускорение для спасения от вылета в воду
    при собственном заносе.'
  player_interaction: 'Клавиатура: [Пробел] / [Shift] (удержание для форсажа). Тачскрин:
    Кнопка реактивного ускорителя справа внизу [BOOST] или двойной тап с удержанием
    виртуального стика.'
  feedback: 'Визуал/VFX: Яркий конус синего реактивного пламени из турбины тюбинга,
