    - mechanics/mining_drill.md
    - mechanics/physics_destruction.md
    - mechanics/fluid_buoyancy.md
    - threejs/game_map_and_world_design.md
    - patterns/arena_combat_loop.md
    - ux/touch_controls.md
  - id: D3
    name: 'Ватрушечный Дрифт: Ледовый Хлыст'
    pitch: 'Скоростной аркадный дрифт-экшен: пускай снегоход в глубокий занос и используй
      прицепленный на тросе тяжелый тюбинг как центробежный хлыст для сбивания соперников.'
    core_verb: Заносить
    genre_family: 3D Аркадный Физический Дрифт-Экшен / Bumper Flail Arcade
    session_shape: 'Волновой аркадный забег на выживание (Survival Wave Flow): бесконечный
      поток прибывающих волн оппонентов с комбо-множителем за выбивания в заносе.'
    camera: Низкая динамическая камера от третьего лица с выраженным углом крена при
      заносе и акцентом на прицепленный тюбинг.
    control_scheme: 'ПК: A/D (руление) + W (газ) + Shift (ручной тормоз / срыв в занос).
      Мобильные: Две сенсорные зоны по краям экрана для поворотов + экранная кнопка
      заноса (Drift).'
    world: 'Скандинавский экстрим-фестиваль: неоновые праздничные гирлянды, прожекторы
      на льду, цветные дымовые шашки и конфетти из ледяной стружки.'
    spectacle: Снегоход закладывает вираж на 180 градусов, прицепленный тюбинг летит
      по широкой дуге веером и одним махом сносит троих оппонентов в океан, высекая
      сноп искр и ледяной пыли.
    why_not_generic: Соединяет mechanics/drift_scoring.md (накопление комбо и импульса
      при длительном угле заноса), mechanics/chain_reaction.md (цепные рикошеты сбитых
      противников) и threejs/arcade_racing_and_drift.md с физическим шарниром трос-ватрушка.
      Оружием игрока становится сама физика маятника прицепа.
    biggest_risk: 'Высокий порог входа из-за сложной кинематики сцепки двух тел: игрок
      на мобильном устройстве теряет контроль над траекторией ватрушки.'
    production_cost: 'Средний: физический шарнирный констрейнт (Joint/DistanceConstraint)
      в Rapier3D, процедурный след заноса и система комбо-счетчика.'
