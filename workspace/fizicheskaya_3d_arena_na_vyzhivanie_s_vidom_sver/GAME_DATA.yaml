    на надувных тюбингах, а не кольцевой гонкой (racing/drift), не файтингом с фрейм-датой
    и парированием (fighting), не автошутером с выбором карт апгрейда (survivor),
    и не требует колесных контроллеров машин (vehicle controller/wheel rig), ECS для
    тысяч сущностей (bitECS) или статического навмеша (recast).
  loop_pattern: patterns/arena_combat_loop.md
  summary: Физический экшен на выбывание с процедурной графикой Three.js, расчётом
    импульсов и гидродинамики плавающего льда в Rapier3D, поведением ботов Yuka AI,
    адаптивной производительностью и синтезированным Web Audio звуком.
