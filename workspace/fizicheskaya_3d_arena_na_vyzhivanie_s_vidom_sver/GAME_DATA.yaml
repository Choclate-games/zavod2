    - mechanics/chain_reaction.md
    - stack/rapier3d.md
    - threejs/vehicle_wheel_rig.md
    - patterns/score_attack_loop.md
    - ux/touch_controls.md
  selected_id: D1
  selected_name: 'Ледовый Сумо-Батл: Последний Тюбинг'
  selection_reason: 'Направление D1 идеально и точно реализует ключевой запрос пользователя,
    обеспечивая максимальную силу игры для браузера и мобильных устройств: 1) Нулевой
    порог входа (Zero-Second Onboarding): игрок с первой же секунды понимает правила
    без единого слова обучения — просто направляй джойстик/WASD, разгоняйся и выталкивай
    оппонентов с тающей льдины; 2) Чистое физическое удовольствие (Instant Juice &
    Emergent Gameplay): прямое столкновение масс на скользком льду с разлетом ватрушек,
    треском откалывающихся кусков и фонтанами брызг создает мгновенный комедийный
    и соревновательный вау-эффект; 3) Естественная динамическая компрессия сессии:
    планомерный раскол и затопление внешних сегментов льдины автоматически концентрирует
    оставшихся участников в центре, гарантируя кульминацию раунда за 45–75 секунд;
    4) Техническая надежность и производительность: симуляция жестких тел (RigidBody)
    и сегментов льда в Rapier3D в сочетании с InstancedMesh для брызг обеспечивает
    стабильные 60 FPS на любых мобильных процессорах без тяжелых рантайм-вычислений.'
  rejected_reasons:
  - 'D2 («Ледорез: Охота на Трещинах») отвергнут: превращает скоростную физическую
    сумо-арену в медленную и медитативную геометрическую головоломку на вычерчивание
    контуров (Qix-стиль). Это создает высокий когнитивный барьер для казуального мобильного
    игрока, а алгоритмическая тяжесть рантайм-слайсинга 3D-мешей несет высокий риск
    просадки производительности и глитчей физических коллайдеров в браузере.'
  - 'D3 («Ватрушечный Дрифт: Ледовый Хлыст») отвергнут: управление связкой из двух
    физических тел на эластичной сцепке (тягач + прицеп) создает слишком сложное и
    неинтуитивное управление на сенсорных экранах смартфонов в первые 3 секунды («непослушный
    хвост»), что приводит к высокому оттоку игроков на старте, а фокус на комбо-дрифте
    размывает прямое ощущение сумо-выталкивания.'
  what_it_is_not:
  - Никаких карточек прокачки из 3 вариантов и механик Vampire Survivors / авто-шутеров.
  - Никакой стрельбы пулями, лазеров, турелей и огнестрельного оружия — только честный
    кинетический таран.
  - Никаких серых кубов и унылых белых коробок — выразительная стилизованная графика
    с лазурным льдом и яркими надувными тюбингами.
  - Никакой оторванной от геймплея мета-прогрессии с бесконечной прокачкой статов
    (+1% к урону).
  - Никаких хитпоинтов (HP bar) — выживание определяется исключительно нахождением
    на устойчивом льду.
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - 'Честная кинетическая физика столкновения масс (p = mv) на движке Rapier3D: сила
    отталкивания и отскока строго зависит от вектора и скорости удара.'
  - 'Раскалывающаяся и уменьшающаяся круглая льдина: арена состоит из сегментов, которые
    трескаются, накреняются и тонут под весом и от ударов.'
  - Мгновенное выбывание при падении в океан (Ring Out / Out-of-Bounds) с гидродинамическим
    эффектом погружения.
  - 'Мгновенное управление в один жест: плавающий виртуальный джойстик на смартфонах
    и WASD на клавиатуре с мгновенным откликом без задержек.'
  signature_scene: 'Камера зафиксирована в метре над растрескавшейся лазурной льдиной
    в лучах низкого заполярного солнца: в центре кадра в яростном лобовом столкновении
    взмывают на дыбы два тюбинга с неоновыми неопреновыми пилотами, во все стороны
    веером разлетаются светящиеся осколки льда и фонтаны водяных брызг, а на заднем
    плане оторвавшийся треугольный кусок ледника кренится в темно-синюю океанскую
    бездну, увлекая за собой тонущего соперника.'
  avoid_references:
  - Vampire Survivors / Brotato (запрет на авто-атаки и карточки навыков)
  - Bumper.io (запрет на примитивную плоскую аркаду без честной физики льда и без
    раскалывания арены)
  - Snowball.io (запрет на механику накатывания снежных шаров вместо тарана корпусом)
  - 'Fall Guys: Ice Ring (запрет на платформерные прыжки персонажей-человечков)'
