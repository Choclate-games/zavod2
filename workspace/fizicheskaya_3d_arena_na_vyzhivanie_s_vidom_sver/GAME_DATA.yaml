  и Динамический Наклон Ледовых Плит (Dynamic Ice Fracture & Tilting), Поглощение
  Импульса Массы и Рост Калибра (Mass Momentum Absorption).'
- Условие успеха (Остаться единственным выжившим тюбингом на оставшихся ледовых сегментах
  арены после ликвидации всех 7 соперников в воду (1-е место в раунде).) и условие
  проигрыша (Падение тюбинга игрока в воду за пределы устойчивой льдины (погружение
  ниже ватерлинии Y < -0.8 м) или затопление вместе с отколовшимся сегментом льда
  до устранения всех оппонентов.) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Ледовый Сумо-Батл: Последний Тюбинг».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Ледовое Спасение (Revive), Золотой
  Бур (3x Награда), Тест-Драйв Премиум Тюбинга); interstitial соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
direction:
  options:
  - id: D1
    name: 'Ледовый Сумо-Батл: Последний Тюбинг'
    pitch: 'Сессионный 3D сумо-баттл на выживание: разгоняй тюбинг по обледенелой
      арене, выбивай соперников в ледяной океан и удерживай центр раскалывающегося
      айсберга.'
    core_verb: Таранить
    genre_family: 3D Физический Сумо-Экшен / Bumper Arena / Battle Royale на выживание
    session_shape: Матч на выбывание (раунд Last Man Standing на 8 участников длительностью
      45–75 секунд до последнего выжившего)
    camera: Третье лицо сверху-сзади (динамическая Chase Cam с расширением FOV при
      ускорении)
    control_scheme: 'ПК: WASD / Стрелки — руление и газ/тормоз, Space — импульсный
      форсаж разгона. Мобильные: виртуальный плавающий джойстик направления + кнопка
      импульсного разгона.'
    world: 'Заполярный арктический океан во время золотого заката: бирюзово-прозрачный
      монолит льдины, белая пена волн, темные океанские глубины и яркие неопреновые
      ватрушки.'
    spectacle: В центре кадра — взрыв ледяных осколков и брызг воды от мощного тарана
      двух тюбингов, один из которых кувырком улетает за борт, пока край льдины трескается
      и тонет.
    why_not_generic: Объединяет механики mechanics/physics_destruction.md (раскол
      льдины на физические сегменты), mechanics/fluid_buoyancy.md (плавучесть и погружение
      обломков и вылетевших участников по закону Архимеда) и mechanics/chain_reaction.md
      (каскадные столкновения нескольких тел) на базе stack/rapier3d.md. Победа строится
      не на очках здоровья, а на чистом физическом импульсе p=mv и позиционировании
      на уменьшающейся опоре.
    biggest_risk: Случайный вылет игрока из-за неконтролируемого физического рикошета
      в хаотичной свалке из нескольких тел.
    production_cost: 'Средний: процедурная сегментация круглой льдины на 12-16 физических
      секторов в Rapier3D, настройка физических материалов трения/упругости и инстансинг
