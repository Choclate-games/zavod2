gameplay_systems:
- name: Система Динамического Разрушения Льдины (Ice Arena Fracturing System)
  purpose: Управляет состоянием 16 сегментов льдины, триггерами появления трещин,
    отламыванием и погружением плит по графику раунда и от физической нагрузки.
  input: Таймер раунда, суммарный вес тел на сегменте, импульсы столкновений.
  rules:
  - Сегменты внешнего кольца (8 шт.) начинают тонуть с 20-й секунды матча
  - Перегрузка плиты (>3 тюбингов) ускоряет погружение в 3 раза
  - Затонувший сегмент отключает коллайдер пола через 2.0 с после ухода под воду
  state:
  - Целая (Intact)
  - Треснувшая (Cracked)
  - Наклоненная (Tilting)
  - Тонущая (Sinking)
  - Утонувшая (Submerged)
  interactions: Передает физические импульсы объектам на плите, наклоняет вектор нормали
    пола, генерирует частицы брызг и пены.
  feedback: Звук трескающегося льда, шейдерная трещина, брызги воды по контуру, наклон
    камеры.
  edge_cases:
  - Тюбинг находится на стыке двух плит при расколе (плавный переход коллайдера)
  - Игрок пытается заехать на тонущую плиту (соскальзывание в воду)
- name: Система Кинематики и Столкновения Масс (Kinetic Impulse Collision System)
  purpose: Вычисляет импульсы столкновения между тюбингами, передачу энергии p=mv,
    упругий отскок и начисление фрагов при выбивании за арену.
  input: Векторы скоростей RigidBody, массы тюбингов, точки контакта в Rapier3D.
  rules:
  - Импульс пропорционален произведению массы на относительную скорость с коэффициентом
    упругости 1.45
  - При контакте форсажного тюбинга с обычным накладывается дополнительный вертикальный
    подброс (Impulse_Y = 2.0 м/с)
  - Последний коснувшийся игрок признается автором выбивания при пересечении соперником
    Y < -0.8 м
  state:
  - Свободное скольжение
  - Контактный импакт
  - Фаза отскока
  - Выбывание в океан
  interactions: Информирует систему прогрессии о фраге, запускает VFX/SFX импакта,
    накладывает микро-задержку (hitstop 30 мс) для сочности.
  feedback: Тяжелый глухой удар бампера, разлет осколков льда, виброотклик, расширение
    круговой волны на воде.
  edge_cases:
  - Тройное одновременное столкновение (каскадный разлет тел по законам импульса)
  - Лобовой удар одинаковых масс на равной скорости (симметричный отскок назад)
- name: Система Искусственного Интеллекта Соперников (Sumo Bot AI System)
  purpose: Обеспечивает соревновательное поведение 7 ботов с различными архетипами
    (Агрессор, Кемпер-Тяжеловес, Сталкер, Трикстер) без сетевых задержек.
  input: Позиция игрока и других ботов, границы безопасного льда, текущее состояние
    плит.
  rules:
  - Бот оценивает вектор до центра арены и избегает треснувших плит с запасом 1.5
    м
  - При нахождении цели на одной линии включает форсаж с вероятностью 70%
  - При нахождении на краю отдает наивысший приоритет возврату в безопасную зону
  state:
  - Патрулирование центра
  - Выцеливание жертвы
  - Импульсная атака
  - Экстренное спасение от обрыва
  interactions: Взаимодействует с физической системой Rapier3D через приложение сил
    тяги и крутящих моментов.
  feedback: Анимация наклона пилота бота в сторону поворота, эмодзи-индикаторы реакции
    (удивление, злость) над тюбингом.
  edge_cases:
  - Застревание двух ботов в клинче (активация случайного бокового импульса через
    1.0 с)
  - Бот падает в воду (отключение AI логики и перевод в рэгдолл)
- name: Система Турнирного Зачета и Лиг (Match Director & League System)
  purpose: Фиксирует порядок выбывания участников, определяет победителя, начисляет
    награды и управляет переходом между дивизионами.
  input: События выбывания игроков из физической системы, статус таймера раунда.
  rules:
  - Ранг определяется в обратном порядке выбывания (первый утонувший = 8 место, последний
    = 1 место)
  - Матч мгновенно завершается при остатке 1 участника или истечении 75 с (победа
    присуждается тюбингу с наибольшей массой/фрагами)
  - За 1 место начисляется 30 кубков и 150 монет
  state:
  - Ожидание старта (3-2-1 GO)
  - Активный бой
  - Кульминация (финал 1v1)
  - Окно результатов (Victory / Defeat)
  interactions: Вызывает экраны UI, сохраняет прогресс в Playgama Cloud Save, триггерит
    показ рекламы.
  feedback: Фанфары победы, салют из ледяных кристаллов, всплывающий баннер занятого
    места с анимацией кубков.
  edge_cases:
  - Одновременное падение последних 2 участников (победа присуждается тому, кто коснулся
    воды на миллисекунду позже)
core_design:
  signature_moment: 'Финал 60-секундного раунда: от айсберга остался единственный
    скользкий пятачок диаметром 2.5 метра, который кренится на 20 градусов в бушующий
    океан. Главный бот-тяжеловес ''Морж-Титан'' массой 140 кг на полной скорости летит
    на тебя реактивным тараном. Ты заходишь в силовой занос по кромке обрыва, на последней
    десятой доле секунды прожимаешь ''Perfect Rebound'', сминаешь надувной борт и
    выпускаешь ударную волну сжатого воздуха. Твой тюбинг взмывает в воздух над океаном,
    а гиганта вместе со взрывом ледяных брызг и отломившейся плитой уносит в бездну
    за 0.3 секунды до сирены. Ты приземляешься на уцелевший монолитный лед под победный
    залп арктических фейерверков.'
  genre_template_rejected: 'Отказ от классического шаблона плоской статичной арены
    со спавном случайных карточек улучшений (Power-up Orbs / 3 Upgrade Cards), как
    в аркадных бамперах (Bumper.io). В подобных клонах сила игрока зависит от собирания
    разбросанных светящихся сфер, что превращает соревновательный сумо-экшен в хаотичный
    сбор бонусов по углам. Вместо этого в нашей игре реализована чистая физическая
    экосистема: масса, инерция и форсаж зарабатываются исключительно через контактную
    борьбу, кинетическую инерцию дрифта и позиционное выталкивание соперников, а сама
    арена является живым гидродинамическим врагом с тонущими и наклоняющимися плитами.'
  what_makes_it_different: 'В отличие от большинства мобильных сумо-игр с сухим кинематическим
    отталкиванием, здесь ядром геймплея является глубокая физика льда и гидродинамика
    плавучих тел на базе Three.js и Rapier3D: тюбинги обладают реальным моментом инерции
    и переменным трением скольжения, надувные борта работают как упругие резонаторы
    с механикой контр-отскока (Perfect Rebound), а раскалывающийся айсберг реагирует
    наклоном и затоплением на суммарный вес участников, превращая позиционирование
    и перенос центра масс в главное тактическое оружие.'
  micro_loop:
  - step: 1. Инерционный вход в поворот и занос
    player_action: Отклонить стик / нажать [A/D], сорвав ватрушку в занос по дуге
      вдоль трещины
    game_response: Снижение бокового трения до 0.078 mu, вылет снежного шлейфа, прирост
      шкалы форсажа +16.5 ед./с
    decision: Заложить глубокий радиус для максимальной зарядки турбины или прижаться
      к центру для безопасности
    duration: 0.8 - 1.5 с
  - step: 2. Выбор угла атаки и захват цели
    player_action: Довернуть нос тюбинга на соперника, балансирующего на краю накренившейся
      плиты
    game_response: Камера фокусирует траекторию сближения, звуковой свист турбины
      готовности к форсажу
    decision: Атаковать легкого оппонента ради гарантированного фрага или рискнуть
      против лидера раунда
    duration: 0.4 - 0.8 с
  - step: 3. Реактивный спурт и лобовой таран
    player_action: Зажать кнопку [BOOST / Пробел], выпуская струю реактивного пламени
    game_response: Ускорение до 24.7 м/с, размытие экрана (radial blur), сокрушительный
      импульсный удар m*v*1.75 при контакте
    decision: Держать форсаж до упора для пробития врага или прервать рывок контрсмещением
      перед обрывом
    duration: 0.5 - 1.2 с
  - step: 4. Физический отскок и стабилизация на льду
    player_action: Прожать [Perfect Rebound] в момент удара и переложить руль в сторону
      монолитного льда
    game_response: Выброс кольцевой ударной волны, отбрасывание врага в океан, микро-хитстоп
      0.07 с, возврат сцепления тюбинга
    decision: Немедленно атаковать следующую цель на отскоке или откатиться в безопасный
      сектор
    duration: 0.3 - 0.6 с
  meso_loop:
  - step: 1. Фаза Разведки и Набора Массы (0–15 сек)
    player_action: Маневрировать по широкой 16-сегментной арене, выбивая легких ботов
      на внешнем радиусе
    game_response: Арена стабильна, фоновые волны спокойны, за каждый фраг тюбинг
      получает +8.5% массы и +4.5% размера коллайдера
    decision: Собрать 2-3 быстрых фрага на периферии или занять доминирующую позицию
      в центре арены
    duration: 15 с
  - step: 2. Фаза Ледового Раскола (15–40 сек)
    player_action: Уходить с вибрирующих внешних плит, сталкивая застрявших ботов
      на тонущие сегменты
    game_response: Внешнее кольцо из 8 плит с грохотом трескается, кренится в воду
      и тонет; рабочая площадь арены падает на 50%
    decision: Рискнуть заехать на тонущую плиту ради сброса врага или бороться за
      тесный центральный лед
    duration: 25 с
  - step: 3. Фаза Дуэли на Пятачке (40–60 сек)
    player_action: Вести филигранную позиционную борьбу на последних 2-4 плитах против
      оставшихся тяжеловесов
    game_response: Лед испытывает колоссальную нагрузку, крен достигает 26.5°, боты
      включают агрессивный раш и форсаж
    decision: Пойти на лобовой таран ва-банк или поймать соперника на контр-отскоке
      'Perfect Rebound' у самого края льдины
    duration: 20 с
  - step: 4. Финал Раунда и Коронация Выжившего
    player_action: Удержать тюбинг на последней уцелевшей льдине после падения последнего
      оппонента в океан
    game_response: Замедление времени (Slow-mo 0.3x), победный фейерверк, начисление
      кубков и золотых снежинок
    decision: Оценить результат матча, перейти к прокачке тюбинга или немедленно запустить
      следующий заезд
    duration: 5 с
  macro_loop:
  - step: 1. Выбор Экипировки и Тюбинга в Ангаре
    player_action: Выбрать тюбинг (по весу и аэродинамике), скин пилота и спецэффект
      ледового шлейфа
    game_response: Отображение 3D-модели ватрушки на арктическом пьедестале, показ
      физических характеристик (масса, турбо-тяга, упругость бортов)
    decision: Выбрать маневренный легкий тюбинг для быстрого дрифта ('Арктическая
      Лиса') или тяжелый бронированный таран ('Полярный Медведь')
    duration: 10 - 25 с
  - step: 2. Соревновательный Матч (Last Man Standing)
    player_action: Участвовать в соревновательном выбывании на 8 участников на раскалывающемся
      посреди океана айсберге
    game_response: Генерация физической арены, расчет кинематики столкновений Rapier3D,
      фиксация фрагов и итогового места выживания (1-8)
    decision: Корректировать тактику под состав ботов-соперников и динамику разрушения
      ледовых сегментов арены
    duration: 45 - 75 с
  - step: 3. Награждение и Начисление Рейтинга Лиги
    player_action: Забрать призовые Кубки Лиги, сезонные очки и монеты за результативность
      в матче
    game_response: Анимация прогресса Лиги (Бронзовая Льдина -> Серебряный Торос ->
      Золотой Айсберг -> Титановый Глетчер), выдача Морозных Жетонов за фраги
    decision: Копить морозные жетоны на покупку элитного реактивного тюбинга или открывать
      сундуки со спецэффектами брызг
    duration: 8 - 15 с
  - step: 4. Мета-Прогресс и Кастомизация Оборудования
    player_action: Разблокировать новые корпуса ватрушек, модифицировать жесткость
      клапана отскока и активировать неоновые следы скольжения
    game_response: Визуальный апгрейд техники в гараже, разблокировка новых экстремальных
      ледовых локаций (Северное Сияние, Кратер Гейзеров)
    decision: Протестировать открытую конфигурацию тюбинга в более высоком соревновательном
      дивизионе
    duration: 15 - 30 с
  loop_diagram: "+-------------------------------------------------------------------------+\n\
    |                         МАКРО-ПЕТЛЯ (МЕТА-ИГРА)                         |\n\
    |  [Ангар Тюбингов] -> [Выбор Сетапа] -> [БАТЛ-РАУНД] -> [Кубки и Скины]  |\n\
    +-------------------------------------------------------------------------+\n\
    \                                     |\n                                    \
