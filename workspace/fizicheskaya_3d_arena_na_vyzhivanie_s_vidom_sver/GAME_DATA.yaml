    радиуса для кнопки форсажа справа.
  safe_area_handling: Использование CSS env(safe-area-inset-*) для отступов HUD от
    вырезов камеры (Notch) и системных индикаторов на iOS и Android.
  performance_throttling:
  - Динамическое масштабирование разрешения (Device Pixel Ratio ограничено 1.5 на
    экранах с высоким DPI)
  - Инстансинг геометрии брызг и осколков через THREE.InstancedMesh (1 Draw Call на
    все эффекты)
  - Фиксированный шаг физики Rapier3D (60 Гц) с пропуском рендеринга промежуточных
    суб-шагов при просадке производительности
  - Отключение теней в реальном времени на мобильных устройствах слабее Mali-G52 /
    Adreno 610 с заменой на мягкие текстурные блоб-тени
