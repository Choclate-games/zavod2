      и mechanics/fluid_buoyancy.md (расчет центра тяжести и затопление отколотой
      плиты). Игрок воюет не прямым контактом, а манипуляцией геометрией арены.
    biggest_risk: Сложность и вычислительная тяжесть процедурного разрезания 3D-мешей
      и пересчета коллайдеров в реальном времени на мобильных устройствах.
    production_cost: 'Высокий: сложная процедурная триангуляция меша в реальном времени,
      обновление составных коллайдеров Rapier3D и гидродинамика нестандартных полигонов.'
    knowledge_hints:
