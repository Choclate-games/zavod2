_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: fizicheskaya_3d_arena_na_vyzhivanie_s_vidom_sver
performance:
  target_fps: 60
  max_draw_calls: 55
  max_triangles: 32000
  bundle_size_budget_mb: 3.8
session:
  model: Матч на выбывание на 8 участников (Last Man Standing) длительностью 45–75
    секунд на уменьшающейся 16-сегментной льдине до последнего выжившего тюбинга.
  win: Остаться единственным выжившим тюбингом на оставшихся ледовых сегментах арены
    после ликвидации всех 7 соперников в воду (1-е место в раунде).
  lose: Падение тюбинга игрока в воду за пределы устойчивой льдины (погружение ниже
    ватерлинии Y < -0.8 м) или затопление вместе с отколовшимся сегментом льда до
    устранения всех оппонентов.
  difficulty_curve: 'Динамическая компрессия пространства: в первые 15 секунд арена
    широкая (радиус 18 м, 16 плит), боты совершают пробные тараны; на 25–45 секундах
    внешнее кольцо из 8 плит тонет, боты включают форсаж и агрессивный фокус игрока;
    на 50–70 секундах остаётся лишь 4 центральные плиты с минимальным сцеплением,
    требующие филигранного баланса и точных контрударов.'
mechanics:
  impulsnyy_reaktivnyy_taran_kinetic_boost_ram:
    name: Импульсный Реактивный Таран (Kinetic Boost Ram)
    parameters:
      boost_multiplier:
        value: 2.35x (с 10.5 м/с до 24.7 м/с)
        note: При значении < 1.8x таран не пробивает тяжелых соперников и теряет сочность;
          при > 3.0x тюбинг становится неуправляемым снарядом и вылетает с арены в
          90% попыток.
      boost_duration_max:
        value: 1.8 с (при полном баллоне 100 ед.)
        note: Если увеличить до 3.0 с, игроки будут непрерывно летать по кругу без
          позиционной игры; если снизить до 0.8 с, не хватит дистанции для разгона
          через всю льдину.
      boost_recharge_drift_rate:
        value: 16.5 ед./с в дрифте (0 ед./с при прямолинейном качении)
        note: Если накапливать пассивно без заноса, пропадает стимул агрессивно нарезать
          дуги по тонкому льду; если сделать выше 25 ед./с, форсаж перестанет быть
          дефицитным тактическим ресурсом.
      impact_freeze_frame:
        value: 0.07 с (4 кадра при 60 FPS)
        note: При 0 с удар кажется плоским и 'ватным'; при > 0.15 с игра кажется сломанной
          и лагающей.
  inertsionnyy_ledovyy_drift_i_kontrsmeschenie_inert:
    name: Инерционный Ледовый Дрифт и Контрсмещение (Inertial Drift & Counter-Steer)
    parameters:
      ice_friction_dynamic:
        value: 0.078 mu (в заносе) против 0.65 mu (при прямом качении)
        note: При значении < 0.04 тюбинг превращается в неуправляемое мыло на льду;
          при > 0.20 пропадает ощущение ледового скольжения и игра превращается в
          обычный картинг на асфальте.
      drift_slip_angle_threshold:
        value: 22.5 градуса между вектором скорости и направлением корпуса
        note: При пороге < 10° дрифт срабатывает от малейшего чиха и мешает точному
          прицеливанию; при > 40° войти в управляемый занос становится почти невозможно.
      counter_steer_torque:
        value: 320.0 Н·м/рад
        note: Если увеличить до 600, тюбинг мгновенно прилипает к траектории без инерционного
          риска; если занизить до 150, игрок не сможет спастись от соскальзывания
          в воду при наклоне плиты.
      snow_spray_particle_rate:
        value: 120 частиц/с при угловой скорости > 30 град/с
        note: Меньше 60 — траектория заноса не читается визуально; больше 250 — просаживает
          FPS на мобильных устройствах.
  prolamyvanie_i_dinamicheskiy_naklon_ledovyh_plit_d:
    name: Проламывание и Динамический Наклон Ледовых Плит (Dynamic Ice Fracture &
      Tilting)
    parameters:
      critical_mass_threshold:
        value: 230.0 кг (эквивалент 2 тяжелых тюбингов или 3 легких)
        note: Если снизить до 100 кг, плиты будут тонуть от одного игрока, делая бой
          невозможным; если повысить до 500 кг, плиты не будут реагировать на скопление
          соперников.
      tilt_angle_max:
        value: 26.5 градусов к горизонту
        note: При угле > 35° все тюбинги моментально соскальзывают в воду без шанса
          выехать обратно; при угле < 15° наклон не создает гравитационной угрозы.
      submerge_sink_speed:
        value: 0.42 м/с вертикально вниз
        note: При скорости > 0.8 м/с плита проваливается мгновенно, не оставляя времени
          на спасительный прыжок/рывок; при < 0.2 м/с фаза компрессии становится затянутой
          и скучной.
      ring_collapse_interval:
        value: 12.0 с на обрушение внешнего кольца из 8 сегментов
        note: Быстрее 8 с — сессия превращается в хаотичный рандом; медленнее 20 с
          — игроки успевают встать в кемпинг в центре.
  pogloschenie_impulsa_massy_i_rost_kalibra_mass_mom:
    name: Поглощение Импульса Массы и Рост Калибра (Mass Momentum Absorption)
    parameters:
      mass_gain_per_kill:
        value: +8.5% к текущей массе за каждый подтвержденный фраг
        note: При значении < 4% игрок не чувствует прироста силы и веса; при > 15%
          первый сделавший 2 фрага становится неуязвимым танком, ломающим соревновательный
          баланс.
      scale_gain_per_kill:
        value: +4.5% к геометрическому радиусу коллайдера тюбинга
        note: Если сделать больше 8%, к концу раунда тюбинг не поместится на 2-метровый
          финальный ледовый пятачок; если 0% — отсутствует визуальное подтверждение
          триумфа.
      inertia_handling_penalty:
        value: -3.2% к угловой скорости поворота за каждый стек массы
        note: Если штраф убрать, тяжеловес не имеет слабостей; если штраф сделать
          > 8%, гигантский тюбинг становится совершенно неповоротливым бревном.
      max_mass_cap:
        value: 145.0 кг (+81% от базы при 7 фрагах)
        note: Жесткий потолок, гарантирующий, что даже финального босса-гиганта можно
          выбить синхронным ударом или подтапливанием льда.
  udarnaya_volna_i_reaktivnyy_otskok_bortov_shockwav:
    name: Ударная Волна и Реактивный Отскок Бортов (Shockwave Rebound Burst)
    parameters:
      rebound_timing_window:
        value: 0.14 с (активное окно идеального контр-отскока)
        note: При окне > 0.25 с парирование становится элементарным спамом; при <
          0.06 с в него невозможно попасть на сенсорном экране смартфона.
      shockwave_radius:
        value: 3.8 м кольцевого импульса сжатого воздуха
        note: Если увеличить до 6.0 м, один отскок будет сметать всех с арены; если
          уменьшить до 1.5 м, волна не будет задевать стоящих рядом соперников.
      restitution_coefficient:
        value: 0.82 (коэффициент упругости надувного борта)
        note: При e < 0.5 столкновения ощущаются пластилиновыми и вязкими; при e >
          1.1 тюбинги без контроля разлетаются как шары в бильярде.
      shockwave_force:
        value: 1650.0 Н радиального отталкивания
        note: Если занизить до 700 Н, волна едва покачнет врага; если завысить до
          3500 Н, гарантированно сбросит любого в воду вне зависимости от массы.
