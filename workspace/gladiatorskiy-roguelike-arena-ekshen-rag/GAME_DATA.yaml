mechanics:
- name: Активный Рэгдолл и Инерция Оружия
  category: combat
  priority: core
  description: Удары мечом передают физический импульс, сбивая противников с ног и
    отбрасывая их на стены арены.
  player_interaction: 'Клавиатура/Мышь: WASD — шаги и позиционирование ног гладиатора;
    перемещение мыши с зажатой ЛКМ — прямое управление вектором и плоскостью вращения
    клинка; Пробел — толчок корпусом. Тач: Левый стик — перемещение; правая область
    экрана (свайп с удержанием по дуге) — круговой контроль замаха меча.'
  feedback: 'Визуал: Дуговой шлейф за лезвием меча, меняющий градиент от лазурно-стального
    к раскаленно-оранжевому при наборе скорости > 14 м/с; фонтаны пыли и песка из-под
    сандалий гладиатора при упоре ног.; Звук: Прорезающий свист рассекаемого воздуха
    с нарастающим питчем при разгоне; глухой костно-дробящий удар при входе в тело;
    звонкий хруст при столкновении со стеной арены.; Камера: Динамический импульсный
    микро-зум (Field of View сжимается на 2.5 градуса) и направленная тряска экрана
    (Screen Shake) строго по вектору финального соударения.; Тактильность: Короткая
    хлесткая вибрация (40 мс) на мобильных устройствах в точный момент регистрации
    передачи импульса в тело противника.; UI: Минималистичная круговая шкала накопленной
    кинетической энергии вокруг острия меча в момент набора скорости.'
  technical_complexity: High (Rapier3D ragdoll joints)
  strengths:
  - Невероятная зрелищность
  - Эмерджентный геймплей
  weaknesses:
  - Требует тонкой стабилизации суставов
gameplay_systems:
- name: Система Перемещения и Физического Контроля
  purpose: Обеспечить четкое и отзывчивое управление с учетом инерции и столкновений.
  input: Плавающий виртуальный джойстик (мобильные) или WASD/Стрелки (ПК).
  rules:
  - Скорость масштабируется параметрами маневренности и массы.
  - Коллизии с препятствиями рассчитываются через физический движок с упругим отскоком.
  - При потере управления включается автоматическая стабилизация.
  state:
  - IDLE
  - MOVING
  - DRIFTING
  - IMPACT
  - RECOVERING
  interactions: Взаимодействует с физическими телами врагов, препятствиями и дропами
    наград.
  feedback: Следы на поверхности, частицы пыли, звуки мотора/шагов, динамический наклон
    камеры.
  edge_cases:
  - При застревании в геометрии объект мягко телепортируется в ближайшую свободную
    точку.
- name: Боевая Система и Расчет Урона
  purpose: Обработка ударов, тарана, хитбоксов, расчета брони и эффектов отдачи.
  input: Кнопки атаки, нитро, спец-способностей.
  rules:
  - Итоговый Урон = (БазовыйУрон * ФакторСкорости + БонусСилы) * (1 - СнижениеБроней).
  - Критические удары наносят 2.0x урона при атаке в уязвимые зоны.
  - Тяжелые попадания вызывают 40мс хит-стоп замедление времени.
  state:
  - READY
  - ATTACKING
  - HITSTOP
  - COOLDOWN
  interactions: Триггеры коллизий проверяют пересечения с хитбоксами противников.
  feedback: Заморозка кадра (40мс), фонтан искр/частиц, всплывающие цифры урона.
  edge_cases:
  - Одновременные встречные удары вызывают взаимное физическое отталкивание.
core_design:
  signature_moment: Круговой замах двуручного гладиуса на пределе инерции, срезающий
    наплечник вражеского центуриона и вбивающий его тряпичное тело (ragdoll) в шипованную
    стену арены под оглушительный рев 50 000 зрителей и дождь золотых монет на окровавленный
    песок.
  genre_template_rejected: Автоматическая атака по таймеру и урон по площади вокруг
    персонажа (шаблон Vampire Survivors/Brotato) — отклонен, так как авто-бой полностью
    нивелирует тактильный расчет центра тяжести, контроль физического замаха и физику
    столкновений тел, превращая живой рэгдолл-слэшер в плоское уклонение от кругов
    хитбоксов.
  what_makes_it_different: Расчет урона и сбития с ног базируется не на статических
    числах атаки, а на честной кинетической энергии меча в Three.js (масса клинка,
    помноженная на квадрат линейной скорости острия в момент соударения) и угле приложения
    вектора силы к костям активного рэгдолла противника.
  micro_loop:
  - step: Закручивание корпуса и набор инерции
    player_action: Игрок протягивает курсор мыши или виртуальный джойстик по широкой
      дуге назад-вбок, поворачивая торс гладиатора против часовой стрелки.
    game_response: Физический двигатель суставов торса передает крутящий момент на
      руки; меч отстает по фазе из-за массы, накапливая потенциальную кинетическую
      энергию.
    decision: Раскрутить клинок по длинной дуге ради сокрушительного сбивающего удара
      (риск открыть спину) или сделать короткий резкий рубящий выпад по ногам.
    duration: 0.3 - 0.6 с
  - step: Физический контакт и передача импульса
    player_action: Резкий довод траектории в точку сочленения брони или неприкрытую
      голову набегающего противника.
    game_response: Коллизия твердого тела меча с суставом рэгдолла врага; расчет импульса
      отдачи, срыв пластины брони и перелом физического баланса оппонента.
    decision: Использовать реактивную отдачу от удара для разворота на второй круг
      или сблизиться для добивания ударом щита в лицо.
    duration: 0.15 - 0.3 с
  - step: Контроль падения и добивание у стены
    player_action: Корректировка вектора движения гладиатора, отталкивание падающего
      врага ногой в сторону кольев арены.
    game_response: Враг врезается в стену Колизея, получая вторичный урон от соударения;
      трибуны взрываются аплодисментами, осыпая песок арены очками славы.
    decision: Тратить время на полное добивание лежачего гладиатора или переключить
      внимание на замахивающегося за спиной копейщика.
    duration: 0.5 - 1.2 с
  meso_loop:
  - step: Зачистка гладиаторской когорты волны
    player_action: Тактическое маневрирование по арене, разрыв дистанции с тяжелыми
      мурмиллонами и перехват быстрых ретиариев с сетями.
    game_response: Спавн противников с возрастающей массой доспехов и разными типами
      древкового/рубящего физического оружия.
    decision: 'Кого лишить баланса и щита первым: мобильного копейщика с длинным рычагом
      атаки или бронированного танка.'
    duration: 30 - 45 с
  - step: Дуэль с Чемпионом арены (Мини-боссом)
    player_action: Встречное парирование тяжелой секиры чемпиона в верхней точке траектории
      замаха с фиксацией суставов.
    game_response: Критический звон стали, выбивание оружия из рук чемпиона, переход
      босса в состояние ошеломленного рэгдолла (stagger) на 1.4 с.
    decision: Отсечь наплечник для раскрытия уязвимого места или попытаться нанести
      подсекающий удар под колено для полного опрокидывания.
    duration: 20 - 35 с
  - step: Эдикт Цезаря (Выбор 1 из 3 гладиаторских даров)
    player_action: Анализ предложенных скрижалей с модификаторами физики, веса клинка
      и ловушек арены; подтверждение выбора кликом/тапом.
    game_response: Мгновенное изменение физических параметров персонажа (масса лезвия,
      жесткость пружин рэгдолла, шипы на налокотниках).
    decision: Увеличить массу меча на +35% ради гарантированного сбития врагов с ног
      (жертвуя скоростью поворота) или взять факельное масло для поджога песка.
    duration: 5 - 10 с
  macro_loop:
  - step: Колизейный забег (10 волн арены)
    player_action: Прохождение непрерывной цепочки гладиаторских боев, балансирование
      между сохранением HP и зрелищностью расправ для трибун.
    game_response: 'Эскалация сложности: появление щитоносцев с непарируемыми таранами,
      активация вращающихся лезвий в полу арены, бой с 3-метровым Титаном.'
    decision: Рисковать здоровьем ради зрелищных физических добиваний у стен (множитель
      золота) или методично кайтить врагов на дистанции.
    duration: 5 - 7 мин
  - step: Триумф или падение на арене
    player_action: 'Финальный экран: сбор накопленной валюты «Кровь и Золото», оценка
      титула от трибун («Мясник», «Вихрь Стали», «Любимец Цезаря»).'
    game_response: Конвертация очков восторга трибун в постоянную руду для кузницы,
      разблокировка новых чертежей физического оружия.
    decision: Потратить руду на усиление жесткости скелета гладиатора или открыть
      новый тип клинка (кривой фалькс с зацепом щитов).
    duration: 1 - 2 мин
  - step: Кузница Лудуса (Мета-кастомизация)
    player_action: 'Настройка баланса оружия: перемещение центра тяжести меча ближе
      к рукояти (контроль) или к острию (кинетический урон).'
    game_response: Пересчет инерционных матриц твердого тела в пресетах персонажа,
      сохранение билда для следующего выхода на песок.
    decision: Собрать тяжелый билд на инерционные сокрушающие удары или легкий билд
      на скоростное парирование и срез ремней брони.
    duration: 1 - 2 мин
  loop_diagram: "+-----------------------------------------------------------------------------------------+\n\
    |                                 МИКРО-ПЕТЛЯ (0.3 - 1.5 с)                  \
    \             |\n|   [Вращение корпуса / замах] ---> [Набор кинетической энергии\
    \ клинка]                    |\n|                ^                           \
    \          |                                  |\n|                |          \
    \                           v                                  |\n|   [Восстановление\
    \ баланса] <--- [Удар / Отрыв брони / Отскок от стены]                  |\n+-----------------------------------------------------------------------------------------+\n\
    \                                               |\n                          \
    \                     v (накопление экстаза трибун)\n+-----------------------------------------------------------------------------------------+\n\
    |                                 МЕЗО-ПЕТЛЯ (30 - 60 с)                     \
    \             |\n|   [Зачистка когорты] ---> [Парирование удара Чемпиона] --->\
    \ [Эдикт Цезаря (3 Дара)]     |\n|                ^                          \
    \                             |                |\n|                +-------------------\
    \ Следующая волна арены <------------+                |\n+-----------------------------------------------------------------------------------------+\n\
    \                                               |\n                          \
    \                     v (10 волн / Победа над Титаном)\n+-----------------------------------------------------------------------------------------+\n\
    |                                 МАКРО-ПЕТЛЯ (5 - 8 мин)                    \
    \             |\n|   [Забег в Колизее] ----> [Подсчет Золота и Славы] ----> [Кузница\
    \ Лудуса (Мета)]        |\n|                ^                                \
    \                       |                |\n|                +------------------\
    \ Новый выход на песок <--------------+                |\n+-----------------------------------------------------------------------------------------+"
  tension_curve: 'Волнообразная с резкими пиками: старт волны дает тактическое напряжение
    (оценка угроз и позиционирование на песке), середина волны — физический катарсис
    от серии сокрушительных столкновений и сбитий с ног, финал волны — кульминационный
    спарринг с бронированным Чемпионом, за которым следует полный эмоциональный релакс
    при выборе карт под рев одобрения трибун.'
  core_formulas:
  - kinetic_energy_joules = 0.5 * weapon_mass_kg * Math.pow(angular_velocity_rad_s
    * blade_length_m, 2)
  - final_strike_damage = Math.max(0, (kinetic_energy_joules - target_armor_absorption)
    * Math.cos(impact_angle_rad))
  - ragdoll_knockdown_impulse = (weapon_mass_kg / (weapon_mass_kg + target_mass_kg))
    * strike_contact_velocity_m_s * 14.5
  - armor_shear_durability_drop = (kinetic_energy_joules / armor_shear_threshold_joules)
    * 100.0
  - crowd_favor_points = (damage_dealt * 0.4 + wall_smash_damage * 1.8 + armor_pieces_sheared
    * 45.0 + parry_success * 35.0) * combo_time_multiplier
  - enemy_mass_wave_scale = base_enemy_mass_kg * (1.0 + wave_index * 0.08)
  run_progression:
  - 'Удлинение рычага клинка (+0.25 м длины): повышает линейную скорость острия и
    кинетический урон на +40%, но увеличивает крутящий момент сопротивления при развороте
    на +25%.'
  - 'Зазубренное закаленное лезвие: снижает порог отсечения вражеской брони на 35%,
    позволяя срывать шлемы и щиты с одного скользящего удара.'
  - 'Шипованные налокотники и наколенники: добавляют урон в 45 ед. при соударении
    рэгдолла игрока с телами врагов во время силового толчка (tackle).'
  - 'Факельное масло Весты: воспламеняет лезвие меча; при контакте на скорости выше
    12 м/с поджигает рэгдолл врага, заставляя его хаотично метаться и сбивать союзников.'
  meta_progression:
  - 'Укрепление мышечных приводов суставов (Active Ragdoll Joint Torque): повышение
    максимального крутящего момента рук и торса с 600 Н·м до 1400 Н·м (гладиатор держит
    удар тяжелых молотов без потери стойки).'
  - 'Балансировочный станок Кузницы: возможность смещать центр масс любого клинка
    к острию (+урон от круговых взмахов) или к эфесу (+мгновенный отклик парирования).'
  - 'Инженерия Колизея: разблокировка постоянных интерактивных ловушек на арене (выдвижные
    шипы, вращающиеся бревна с лезвиями, жаровни с углями).'
  - 'Благосклонность Патрициев: стартовый запас очков Ликования Трибун (+25 очков),
    гарантирующий выпадение редких эдиктов уже на 1-й волне.'
  mechanics:
  - name: Активный Рэгдолл и Инерция Оружия
    role_in_loop: Двигатель (основной генератор урона, пространственного контроля
      толпы и тактильного веса каждого движения)
    player_decision: Набирать ли полный центробежный разгон двуручника на 360° для
      раскидывания толпы (рискуя зацепить стену или потерять равновесие) или нанести
      направленный рубящий удар с короткого замаха в уязвимую точку.
    input_mapping: 'Клавиатура/Мышь: WASD — шаги и позиционирование ног гладиатора;
      перемещение мыши с зажатой ЛКМ — прямое управление вектором и плоскостью вращения
      клинка; Пробел — толчок корпусом. Тач: Левый стик — перемещение; правая область
      экрана (свайп с удержанием по дуге) — круговой контроль замаха меча.'
    states:
    - idle_stance
    - windup_torque_building
    - active_kinetic_swing
    - impact_collision_resolved
    - recoil_balance_recovery
    parameters:
    - name: weapon_mass
      value: 4.2 кг
      tuning_note: Если увеличить > 7.0 кг — гладиатор заваливается на песок от собственной
        инерции при каждом взмахе; если уменьшить < 2.0 кг — удары теряют физический
        вес и ощущаются как удары картонной палкой.
    - name: joint_motor_torque
      value: 850.0 Н·м
      tuning_note: Если поднять > 1600 Н·м — персонаж становится деревянной недеформируемой
        моделькой; если опустить < 450 Н·м — гладиатор обвисает и не может поднять
        меч над головой.
    - name: swing_angular_velocity_cap
      value: 19.5 рад/с
      tuning_note: Если поднять > 30.0 рад/с — физические коллайдеры меча проскакивают
        сквозь рэгдоллы противников (tunneling artifact); если снизить < 12.0 рад/с
        — невозможно разогнать клинок до порога сбития с ног.
    - name: wall_impact_bounce_factor
      value: '0.62'
      tuning_note: Если поднять > 0.9 — отлетающие враги скачут по арене как мячики;
        если снизить < 0.25 — тела уныло прилипают к кирпичной кладке без сочного
        звукового удара.
    feedback_layers:
    - 'Визуал: Дуговой шлейф за лезвием меча, меняющий градиент от лазурно-стального
      к раскаленно-оранжевому при наборе скорости > 14 м/с; фонтаны пыли и песка из-под
      сандалий гладиатора при упоре ног.'
    - 'Звук: Прорезающий свист рассекаемого воздуха с нарастающим питчем при разгоне;
      глухой костно-дробящий удар при входе в тело; звонкий хруст при столкновении
      со стеной арены.'
    - 'Камера: Динамический импульсный микро-зум (Field of View сжимается на 2.5 градуса)
      и направленная тряска экрана (Screen Shake) строго по вектору финального соударения.'
    - 'Тактильность: Короткая хлесткая вибрация (40 мс) на мобильных устройствах в
      точный момент регистрации передачи импульса в тело противника.'
    - 'UI: Минималистичная круговая шкала накопленной кинетической энергии вокруг
      острия меча в момент набора скорости.'
    failure_mode: 'Игрок совершает удар слишком близко к стене или щиту: клинок встречает
      непреодолимую преграду на высокой скорости, срабатывает обратная отдача (Recoil),
      суставы рук расслабляются (Ragdoll Stumble), гладиатор теряет контроль на 0.65
      с.'
    mastery_curve: Новичок на 30-й секунде хаотично водит мышью, врезается мечом в
      землю и падает сам; мастер на 10-м забеге рассчитывает эллиптические траектории,
      передает инерцию одного поверженного врага в стоящего рядом и закручивает комбо
      из трех рикошетов подряд.
    counterplay: Враги с тяжелыми скутумами (ростовыми щитами) группируются в черепаху,
      поглощая 85% кинетической энергии замаха, и выставляют длинные копья-гасты,
      наносящие игроку урон еще до входа клинка в радиус поражения.
    synergies:
    - Отсечение Брони и Парирование Инерцией (скорость замаха напрямую определяет
      преодоление порога прочности креплений доспеха)
    - Ликование Трибун и Эдикты Цезаря (каждое вбивание вражеского рэгдолла в стену
      Колизея начисляет двойные очки восторга зрителей)
    why_unique: 'Отказ от запеченных анимаций атак: движение меча и реакция тел врагов
      на 100% управляются физическими моторами сочленений (Joint Motors) и контактными
      силами в реальном времени Three.js.'
    pseudocode: "function onPhysicsTick(dt, inputVector, playerRagdoll, weaponBody):\n\
      \  let targetAngularVel = inputVector.cross(playerRagdoll.torsoForward) * ROTATION_POWER\n\
      \  weaponBody.jointMotor.setTargetVelocity(targetAngularVel)\n  let tipVelocity\
      \ = weaponBody.getBladeTipVelocity()\n  let kineticEnergy = 0.5 * weaponBody.mass\
      \ * tipVelocity.lengthSq()\n  if weaponBody.checkCollision(enemyRagdollLimb):\n\
      \    let hitImpulse = tipVelocity.clone().multiplyScalar(weaponBody.mass * STRIKE_FORCE_K)\n\
      \    enemyRagdollLimb.applyImpulseAtPoint(hitImpulse, collisionPoint)\n    if\
      \ kineticEnergy > KNOCKDOWN_ENERGY_THRESHOLD:\n      enemyRagdoll.triggerFullRagdollKnockdown(hitImpulse.length())\n\
      \    triggerImpactFeedback(kineticEnergy, collisionPoint)"
  - name: Отсечение Брони и Парирование Инерцией
    role_in_loop: Источник риска и инструмент пробития защиты (превращает неуязвимых
      бронированных центурионов в легкие рэгдолл-мишени)
    player_decision: Попытаться встретить летящий топор берсерка острием в острие
      в узкое окно тайминга ради срыва его наплечника и оглушения или увернуться шагом
      в сторону, сохранив позицию.
    input_mapping: 'Клавиатура/Мышь: ПКМ (или резкий взмах навстречу клинку врага)
      — выставление жесткой стойки блокирования суставов. Тач: Двойной тап с удержанием
      в секторе атаки нападающего гладиатора.'
    states:
    - guard_ready
    - parry_active_window
    - blade_clash_resolved
    - armor_fracture_triggered
    - riposte_stagger_window
    parameters:
    - name: parry_active_window
      value: 0.22 с
      tuning_note: Если увеличить > 0.38 с — парирование превращается в казуальный
        спам без риска; если снизить < 0.12 с — браузерный инпут-лаг и фреймрейт 60fps
        делают механику непроходимой.
    - name: armor_shear_velocity_threshold
      value: 11.2 м/с
      tuning_note: Если занизить < 6.0 м/с — доспехи осыпаются от любого случайного
        касания; если завысить > 16.0 м/с — броню невозможно отсечь без специфических
        редких карт прокачки.
    - name: enemy_stagger_duration
      value: 1.35 с
      tuning_note: Если поднять > 2.2 с — враги становятся неподвижными мешками для
        битья; если сократить < 0.6 с — игрок физически не успевает раскрутить тяжелый
        меч для ответного удара.
    feedback_layers:
    - 'Визуал: Отрыв физической пластины брони от рэгдолла с отдельным полетом коллайдера
      по параболе; ослепительный сноп металлических искр в точке контакта лезвий.'
    - 'Звук: Высокочастотный звенящий аккорд парирования (стальной колокол), сменяющийся
      скрежетом срыва металлических заклепок с кожи доспеха.'
    - 'Камера: Кратковременный эффект остановки времени (Bullet Time / Hitstop) на
      60% замедления в течение 0.16 с.'
    - 'Тактильность: Сдвоенный виброотклик (30 мс - пауза 15 мс - 60 мс) при идеальном
      отражении удара.'
    - 'UI: Индикатор раскола доспеха над головой противника и подсветка оголенного
      участка тела с маркером критического урона x2.5.'
    failure_mode: 'Игрок начинает парирование слишком рано или под скользящим углом
      (> 50 градусов к вектору атаки): меч врага соскальзывает и рассекает руки гладиатора,
      сбивая блок и нанося 100% урона.'
    mastery_curve: Новичок бегает кругами и ждет случайного шанса ударить в спину;
      эксперт хладнокровно встречает замахи элитных врагов встречными парированиями,
      за 2 секунды срезает все элементы брони и отправляет голого врага в полет одним
      пинком.
    counterplay: Гладиаторы-Ретиарии забрасывают ловчие сети, которые невозможно парировать
      мечом (сеть спутывает клинок и блокирует вращение), и гладиаторы с двуручными
      молотами, пробивающими блок через колоссальную массу.
    synergies:
    - Активный Рэгдолл и Инерция Оружия (парирование разворачивает вражеский рэгдолл
      вокруг вертикальной оси, подставляя незащищенный бок)
    - Ликование Трибун и Эдикты Цезаря (идеальное парирование на глазах у публики
      дает моментальный скачок шкалы восторга на +25 очков)
    why_unique: Броня врагов — это не абстрактная полоска прочности на UI, а отдельные
      3D-меши с физическими шарнирами (Breakable Constraints), которые отрываются
      при превышении лимита нагрузки и становятся физическим мусором на арене.
    pseudocode: "function onBladeClash(playerSword, enemySword, contactPoint):\n \
      \ let relativeVelocity = playerSword.velocity.distanceTo(enemySword.velocity)\n\
      \  let angleDiff = playerSword.forward.angleTo(-enemySword.forward)\n  if playerSword.isParryActive\
      \ && angleDiff < PARRY_MAX_ANGLE:\n    enemySword.ownerRagdoll.triggerStagger(STAGGER_TIME)\n\
      \    spawnParrySparks(contactPoint)\n    applyTimeDilation(0.4, 0.16)\n    if\
      \ relativeVelocity > ARMOR_SHEAR_THRESHOLD:\n      enemySword.ownerRagdoll.detachNearestArmorPlate(contactPoint)\n\
      \  else:\n    playerSword.ownerRagdoll.takeDamage(enemySword.calculateDamage())"
  - name: Ликование Трибун и Эдикты Цезаря
    role_in_loop: Источник награды и метаморфизма билда (переходное звено между мезо-волнами
      и масштабированием силы)
    player_decision: Выбрать карту на чистый физический вес удара (потеря скорости,
      но гарантированный нокаут) или карту на зрелищность (увеличение дропа золота
      и метательного оружия из зрительного зала).
    input_mapping: 'Клавиатура/Мышь: Клавиши 1, 2, 3 или клик ЛКМ по каменной скрижали
      с эдиктом. Тач: Прямой тап по одной из трех плит Цезаря на арене.'
    states:
    - favor_accumulating
    - crowd_ecstasy_peak
    - wave_triumph_standstill
    - caesar_edict_draft
    - physical_perk_applied
    parameters:
    - name: blood_favor_decay_rate
      value: 3.2 %/с
      tuning_note: Если увеличить > 7.0 %/с — шкала восторга обнуляется во время позиционирования;
        если снизить < 1.0 %/с — трибуны рукоплещут даже при скучном пассивном беге
        вдоль забора.
    - name: arena_gift_threshold
      value: 100.0 очков
      tuning_note: Если завысить > 200 — зрители никогда не бросают гладиатору вспомогательные
        факелы и зелья; если занизить < 50 — арена заваливается падающими предметами
        и мусором.
    - name: draft_card_count
      value: 3 шт
      tuning_note: 'Фиксированный канонический выбор: 1 модификатор клинка, 1 модификатор
        тела рэгдолла, 1 интерактив арены; увеличение ломает верстку на экранах мобильных
        телефонов.'
    feedback_layers:
    - 'Визуал: Дождь из золотых сестерциев, лавровых венков и горящих факелов, летящих
      с верхних ярусов 3D-Колизея; сноп солнечного света через навес велариума на
      фигуру игрока.'
    - 'Звук: Многоголосый гул стадиона (Colosseum Roar), ритмично скандирующий боевой
      клич при каждом зрелищном добивании; победные фанфары римских труб при завершении
      волны.'
    - 'Камера: Кинематографичный облет гладиатора по восходящей спирали с фиксацией
      на поверженных врагах при открытии скрижалей выбора.'
    - 'Тактильность: Нарастающая низкочастотная вибрация (120 мс) при заполнении шкалы
      Жажды Крови до 100%.'
    - 'UI: Динамический барометр «Милость Цезаря» в верхней части экрана с пульсирующими
      делениями рангов восторга (От презрения до Обожествления).'
    failure_mode: 'Игрок кайтит и долго бегает от врагов без ударов: трибуны начинают
      недовольно освистывать бойца и забрасывать арену камнями и тухлыми плодами,
      наносящими микро-урон и замедляющими шаг.'
    mastery_curve: Новичок выбирает карты по цвету рамки редкости; эксперт филигранно
      балансирует массу меча и силу приводов суставов, выстраивая синергии «рикошет
      от стены -> поджигание маслом -> взрывной отрыв брони».
    counterplay: 'Цезарь вводит штрафные дебаффы на определенных волнах (например,
      «Арена залита кровью: трение песка снижено на 50%» или «Бой без щитов: масса
      вражеских клинков удвоена»).'
    synergies:
    - Активный Рэгдолл и Инерция Оружия (дальность полета тел и сила соударений являются
      главным источником очков восторга трибун)
    - Отсечение Брони и Парирование Инерцией (чистый срез шлема центуриона мгновенно
      заполняет 30% шкалы оваций)
    why_unique: Карты улучшений изменяют реальные физические переменные симулятора
      (коэффициенты трения, упругости, массы тел и жесткости шарниров), а не просто
      накладывают абстрактный числовой бафф к урону.
    pseudocode: "function onCrowdActionTriggered(actionType, intensity):\n  let gain\
      \ = BASE_FAVOR_TABLE[actionType] * intensity\n  currentCrowdFavor = Math.min(MAX_FAVOR,\
      \ currentCrowdFavor + gain)\n  if currentCrowdFavor >= ARENA_GIFT_THRESHOLD:\n\
      \    spawnCrowdGiftFromTribunes(arenaCenterPosition)\n    currentCrowdFavor\
      \ -= ARENA_GIFT_THRESHOLD\n  if currentWaveEnemiesDead:\n    triggerTriumphState()\n\
      \    let offeredEdicts = rollThreePhysicalCards(playerArchetype)\n    openCaesarDraftUI(offeredEdicts)"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite 5.x
  renderer: threejs
  renderer_version: ^0.170.0
  physics_engine: Rapier3D (@dimforge/rapier3d-compat 0.13.x)
  state_manager: Custom TinyEventBus & Reactive GameStore
  audio_engine: Howler.js (^2.2.4) с WebAudio API
  target_fps: 60
  max_draw_calls: 75
  max_triangles_or_sprites: 40000
  bundle_size_budget_mb: 4.2
  layers:
  - name: Application Layer
    responsibility: Инициализация Vite, ресайз канваса, полноэкранный режим, прелоадер.
  - name: Platform & Ads Layer
    responsibility: Адаптер Playgama Bridge, менеджеры Interstitial и Rewarded рекламы,
      Cloud Save.
  - name: Core Engine Layer
    responsibility: Фиксированный цикл GameLoop 60Гц, EventBus, маршрутизация ввода.
  - name: Physics Simulation Layer
    responsibility: Шаги симуляции Rapier3D, фильтрация коллизий, рэгдолл-синхронизация.
  - name: Gameplay Systems Layer
    responsibility: Боевая система, спавн врагов, выбор 3 карт улучшений, расчет комбо.
  - name: Entity Management Layer
    responsibility: Пул сущностей игрока, врагов, снарядов и осколков.
  - name: Rendering Layer
    responsibility: Three.js граф сцены, InstancedMesh батчинг, тени, эмиттеры частиц.
  - name: UI & HUD Layer
    responsibility: HTML5/CSS3 оверлей, виртуальный джойстик, полосы HP, модальные
      окна.
  modules:
  - name: src/main.ts
    desc: 'Точка входа: инициализация Playgama Bridge, загрузка ассетов и запуск Game.'
  - name: src/core/Game.ts
    desc: Главный координатор, стейт-машина и управление сценами.
  - name: src/core/GameLoop.ts
    desc: Фиксированный 60Гц цикл обновления с аккумулятором дельты.
  - name: src/core/EventBus.ts
    desc: Типизированная шина событий для слабой связности систем.
  - name: src/platform/PlaygamaService.ts
    desc: Служба работы с @playgama/bridge (реклама, облачные сейвы, лидерборды).
  - name: src/physics/PhysicsWorld.ts
    desc: Обертка физического мира Rapier3D с фильтрами слоев коллизий.
  - name: src/entities/Player.ts
    desc: Контроллер игрока с расчетом физических сил и управления.
  - name: src/entities/EnemyPool.ts
    desc: Пул переиспользуемых сущностей врагов с логикой поведения.
  - name: src/systems/CombatSystem.ts
    desc: Расчет урона, хит-стопа, импульсов и комбо-бонусов.
  - name: src/ui/UIManager.ts
    desc: Управление HUD, окном выбора карт, главным меню и экраном результатов.
monetization:
  strategy_summary: Гибридная модель Free-to-Play для Яндекс Игр и веб-порталов. Высокий
    eCPM за счет полезных Rewarded видео без агрессивного навязывания.
  rewarded_placements:
  - id: revive_run
    name: Второе Дыхание (Возрождение)
    benefit: Восстановление 50% HP + 3 сек неуязвимости с силовой волной, раскидывающей
      врагов.
    cooldown_or_limit: 1 раз за забег.
    trigger_moment: При получении смертельного урона.
  - id: double_gold_run
    name: Удвоение Наград (2x Золото)
    benefit: Удваивает все заработанные шестеренки и монеты за завершенный раунд.
    cooldown_or_limit: Доступно на каждом экране результатов.
    trigger_moment: Экран окончания игры.
  - id: free_card_reroll
    name: Переброс Карт Улучшений
    benefit: Обновляет список 3 карт улучшений с гарантией Редкой или Эпической карты.
    cooldown_or_limit: До 2 раз за забег.
    trigger_moment: Окно выбора 3 карт.
  interstitial_placements:
  - trigger_event: Между волнами и при возврате в Главное Меню.
    cooldown_seconds: 90
    conditions: Интервал не менее 90 секунд, не показывается во время активного геймплея.
  in_app_purchases:
  - sku: ad_free_vip_pass
    name: VIP Пропуск (Без Рекламы)
    description: Отключает межстраничные баннеры, дает вечный бонус +25% к золоту
      и эксклюзивный скин.
    price_tier: 199 YAN / 199 руб
    reward: Отключение Interstitial + VIP скин
  fairness_rules:
  - Весь игровой контент можно открыть бесплатно через геймплей.
  - Полное отсутствие рекламы во время активного боя.
  - Автоматическая пауза игры и отключение звука во время показа рекламы.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - ok
  - crazy_games
  - playgama
  - mock
  initialization_flow:
  - 1. installViewportGuards() — блокировка страницы до первой отрисовки.
  - 2. `await bridge.initialize()` (с таймаутом 10 с) + `in_game_loading_started`.
  - 3. Язык платформы (`bridge.platform.language`) до первого перевода DOM.
  - 4. Тихая авторизация на vk/ok — до чтения сейвов, с таймаутом 5 с.
  - 5. Загрузка сейва через `bridge.storage.get(key)` (без storageType).
  - '6. Выдача необработанных покупок: `getPurchases()` → выдать → потребить.'
  - 7. Предзагрузка текстур, мешей и звуков, сборка сцены и UI.
  - 8. Прогресс до 100% и пауза на затухание сплэша (~700 мс).
  - 9. `bridge.platform.sendMessage('game_ready')` — ровно один раз.
  - 10. Поднятие баннеров и старт обучения — только после game_ready.
  cloud_save_keys:
  - player_save_v1
  leaderboards:
  - globalhighscore
  - highestwave
  ads_integration:
    interstitial: Взводится при завершении забега, показывается по клику на выход
