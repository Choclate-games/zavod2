  песок, бронза и мрамор. Camera perspective: Изометрическая 3D камера с динамическим
  зумом. Environment: Арена Колизея под полуденным солнцем, трибуны в дымке. Central
  Action: Тактические бои на мечах с активной рэгдолл-физикой, отсечением элементов
  брони и ликованием трибун Колизея. — the moment is caught mid-action, with clear
  cause and effect readable in a single frame. Visible in-game HUD overlay: Верх-Лево:
  Полоса прочности (HP) и щита, Верх-Центр: Номер волны и счетчик оставшихся врагов,
  Верх-Право: Количество монет и кнопка Паузы, Низ-Лево: Плавающий сенсорный виртуальный
  джойстик; touch controls at the bottom corners. Lighting: Полуденное солнце, резкие
  тени от колонн, тёплый отражённый свет песка. Color palette: #c9a227, #8c2f27, #e8dcc0,
  #2b2118, #453626. High visual clarity, readable silhouettes, immersive WebGL game
  aesthetics.'
