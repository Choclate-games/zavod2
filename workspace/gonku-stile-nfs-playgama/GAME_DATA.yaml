      и эксклюзивный скин.
    price_tier: 199 YAN / 199 руб
    reward: Отключение Interstitial + VIP скин
  fairness_rules:
  - Весь игровой контент можно открыть бесплатно через геймплей.
  - Полное отсутствие рекламы во время активного боя.
