    скорости.
  - Следы шин формируются полигональными Quad-лентами чуть выше асфальта (Y=0.02)
    без Z-fighting.
  - Звук мотора модулирует частоту и срез фильтра по шкале оборотов (RPM).
  architecture: VehicleController управляет динамикой на базе Rapier 3D DynamicRayCastVehicleController,
    TireTracksManager генерирует следы, SceneManager ведет обзор.
  implementation_guidance: Используй @dimforge/rapier3d-compat и DynamicRayCastVehicleController
    с TriMesh-коллайдером дороги.
  common_mistakes:
  - Использование упрощенной pure-JS физики без Rapier3D приводит к дерганию кузова
    и провалам.
  checklist:
  - Машина устойчиво едет по 3D рельефу, подвеска отрабатывает кочки, занос управляется
