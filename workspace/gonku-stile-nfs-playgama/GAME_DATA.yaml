  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - Активная полиция с системой уровней розыска (Heat Level), таранящая игрока и перекрывающая
    дороги
  - 'Интерактивные разрушаемые ловушки на карте (Pursuit Breakers: рекламные щиты,
    строительные леса, бензоколонки), уничтожающие преследователей при столкновении'
  - Механика мгновенного закиси азота (Nitro Burst) с визуальным эффектом туннельного
    зрения и ускорения физического тела машины
  - 'Управление, адаптированное под мгновенную реакцию на тачскрине (двухпальцевая
    схема: поворот/дрифт + свайп нитро без виртуальных стиков)'
  signature_scene: Темный тюнингованный маслкар с неоновой подсветкой днища входит
    в дрифт на мокром перекрестке ночного города, таранит опору гигантского рекламного
    щита и срезает через заправку, в то время как за ним под вой сирен обрушивающаяся
    конструкция сминает три полицейских крузера в снопах искр.
  avoid_references:
  - Traffic Rider / Highway Racer (примитивные раннеры по прямой)
  - Hill Climb Racing (2D физика подъема на холм)
  - Real Racing / Gran Turismo (душный кольцевой симулятор с симуляцией износа шин)
  - Asphalt 9 (перегруженный QTE-автопилот с переворотами через трамплины)
knowledge_plan:
  selections:
  - path: threejs/rapier_vehicle_controller.md
    role: core
    reason: Реализация физически корректного рэйкаст-контроллера броневика с настройкой
      сцепления и подвески на Rapier3D.
  - path: threejs/arcade_racing_and_drift.md
    role: core
    reason: Аркадная физика срыва в инерционный дрифт, отрисовка следов шин и накопление
      заряда нитро-ярости в заносе.
  - path: stack/rapier3d.md
    role: core
    reason: WASM-движок физики твердых тел для обработки высокоскоростных столкновений
      броневика, отлетающих тел и обломков.
  - path: mechanics/chain_reaction.md
    role: core
    reason: Расчет кинетического импульса тарана для превращения сбитых зомби в снаряды,
      поражающие ряды врагов по принципу домино.
  - path: mechanics/physics_destruction.md
    role: core
    reason: Реализация механики Pursuit Breakers с обрушением опорных городских конструкций
      на преследователей при таране.
  - path: patterns/roguelike_loop.md
    role: core
    reason: Организация структуры забега с нарастающим уровнем Heat, битвой с боссом-мутантом
      и мета-прогрессией в гараже.
  - path: mechanics/drift_scoring.md
    role: supporting
    reason: Подсчет множителя и непрерывности заноса для конвертации угла дрифта в
      шкалу нитро-ускорения.
  - path: threejs/game_map_and_world_design.md
    role: supporting
    reason: Создание процедурной городской арены постапокалипсиса со срезами через
      дворы и интерактивными объектами.
  - path: threejs/juice_and_vfx_pool.md
    role: supporting
    reason: Инстансированные частицы для закиси азота, искр заноса, динамической тряски
      камеры и слоу-мо финишеров.
  - path: threejs/procedural_mesh_builder.md
    role: supporting
    reason: Процедурная генерация стилизованного 3D-кузова броневика, модулей вооружения
      и разрушаемых балок без внешних моделей.
  - path: audio/procedural_sound_synthesizer.md
    role: supporting
    reason: Процедурный Web Audio синтез рева мотора, визга резины в дрифте, хлопков
      нитро и звуков кинетического сокрушения.
  rejected:
  - threejs/racing_track_and_opponents.md
  - mechanics/checkpoint_lap_racing.md
  - patterns/racing_event_loop.md
  - threejs/horde_survivor_core.md
  - patterns/survivor_loop.md
  - stack/bitecs.md
  - stack/recast_navigation.md
  - mechanics/rubberband_opposition.md
  - mechanics/upgrade_choices.md
  rejection_reason: Игра строится на физическом таране броневиком и дрифте в забеге
    до точки эвакуации, поэтому исключены кольцевые гоночные механики кругов и чекпоинтов,
    шаблоны пеших автошутеров, а также избыточные стеки ECS и навмеша.
  loop_pattern: patterns/roguelike_loop.md
  summary: Проект опирается на связку аркадной физики дрифта и кинетических таранов
    на Rapier3D с рогаликовым циклом сессии, разрушаемым окружением и процедурным
    визуалом.
