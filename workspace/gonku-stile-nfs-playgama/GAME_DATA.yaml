mechanics:
- name: Инерционный Дрифт-Накопитель Нитро-Ярости (Inertial Drift Rage Accumulator)
  category: Двигатель геймплея и ключевой источник боевого ресурса
  priority: core
  description: В отличие от классических авто-шутеров с плоским рулением, броневик
    атакует именно боковым смещением массы через физику твердых тел Rapier3D, превращая
    дрифт из маневра уклонения в главное ударное оружие.
  player_interaction: 'Клавиатура: [A]/[D] или [Стрелки] — подруливание, [Пробел]
    — импульсный ручной тормоз для срыва задней оси. Тач: горизонтальный виртуальный
    джойстик + динамический жест свайпа вниз для срыва в занос.'
  feedback: 'Визуал/VFX: Густые клубы черного жженого корда из-под задних покрышек,
    процедурные следы протектора на асфальте с кровавыми брызгами, сноп оранжево-синих
    искр от металлических дисков при угле заноса > 45°.; Звук (Web Audio): Синтезированный
    визг резины (Bandpass фильтр 1.8-3.2 кГц с модуляцией частоты от угла заноса),
    перегруженный низкочастотный рокот компрессора V8, нарастающий свист турбины по
    мере заполнения шкалы.; Камера: Динамическое смещение точки обзора на 12° в сторону,
    противоположную вектору заноса (counter-steer look-ahead), легкое расширение FOV
    от 60° до 68° при удержании дуги более 1.5 с.; UI/Тактильность: Дуговая неоновая
    шкала угла заноса вокруг спидометра с переходом цвета от желтого к пульсирующему
    синему; вибрация геймпада/смартфона с частотой 45 Гц при идеальном угле скольжения.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Нитро-Таранный Прорыв с Ударной Волной (Nitro Ram Shockwave)
  category: Источник взрывного снятия напряжения и преодоления критических блокад
  priority: secondary
  description: 'Таран рассчитывает кинетическую массу сбитых тел через физический
    движок Rapier3D: тела зомби превращаются в тяжелые снаряды, которые сбивают стоящих
    сзади врагов по принципу падающего домино.'
  player_interaction: 'Клавиатура: [Shift] или двойное нажатие [W]. Тач: Выделенная
    кнопка-педаль ''NITRO BURST'' в правой зоне экрана или резкий двойной тап по экрану.'
  feedback: 'Визуал/VFX: Радиальное размытие экрана (Radial Blur 0.45), синяя хроматическая
    аберрация, 2.5-метровые факелы пламени из выхлопных труб, разлет ragdoll-моделей
    зомби на 10+ метров с объемными брызгами крови.; Звук (Web Audio): Суб-басовый
    ударный дроп (35 Гц -> 80 Гц за 0.08 с), оглушительный рев инжектора закиси азота,
    звонкий скрежет деформируемого листового металла при коллизиях.; Камера: Резкий
    рывок назад с увеличением FOV от 65° до 82° за 0.15 с с последующим упругим возвратом,
    сильный высокочастотный шейк амплитудой 0.4 ед. при сокрушении тяжелых целей.;
    UI/Тактильность: Двойной тяжелый хаптик-импульс на мобильных устройствах; неоновая
    синяя вспышка по периметру экрана и счетчик комбо-сбиваний ''RAMPAGE x25''.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Обрушение Городских Конструкций (Pursuit Breakers Demolition)
  category: Источник тактического контроля арены и мгновенного уничтожения элитных
    преследователей
  priority: secondary
  description: 'Адаптация культовой механики Pursuit Breakers из NFS Most Wanted под
    изометрическую физику арены: интерактивное окружение превращается в управляемое
    супероружие игрока.'
  player_interaction: 'Физический контакт: точный таран опорных балок объекта передним
    кенгурятником или контролируемым боковым заносом (хлыстом заднего бампера).'
  feedback: 'Визуал/VFX: Кинематографичный ракурс разрушения (Look-At на падающую
    вывеску/водонапорную вышку), фонтан электро-искр от рвущихся проводов, объемные
    клубы серой пыли и взрыв с разлетом 20+ физических обломков.; Звук (Web Audio):
    Глухой металлический скрежет деформируемых двутавровых балок, резкий щелчок лопающихся
    стальных тросов, массивный низкочастотный взрыв (Lowpass 200 Гц) при ударе крыши
    о землю.; Камера: Кратковременное переключение на динамический нижний ракурс под
    углом 30° к падающему объекту, плавный зум назад с последующим возвратом за бампер
    машины.; UI/Тактильность: Всплывающая золотая плашка ''PURSUIT BREAKER: 12 ПОЛИЦЕЙСКИХ
    УНИЧТОЖЕНО'' с анимацией разбивающегося стекла; затухающая вибрация длительностью
    400 мс.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Кинетическая Эволюция Модулей Броневика (Kinetic Module Evolution)
  category: Двигатель долгосрочной силы внутри забега и вариативности билдостроения
  priority: secondary
  description: 'Модули физически монтируются на 3D-кузов броневика и зависят от кинематики
    движения: дисковые пилы режут строго по касательной траектории заноса, а огнемет
    заливает напалмом внешнюю дугу дрифта.'
  player_interaction: 'UI-модальное окно: выбор 1 из 3 карточек апгрейда кликом мыши
    или тапом по экрану во время автоматического слоу-мо (0.05x timescale) при левелапе.'
  feedback: 'Визуал/VFX: Неоновый голографический интерфейс в стилистике Most Wanted,
    вспышки дуговой сварки на кузове при установке апгрейда, лазерные трассеры и огненные
    шлейфы от работающих модулей.; Звук (Web Audio): Приглушение музыки Lowpass фильтром
    (до 400 Гц) при левелапе, сочный металлический лязг пневматического гайковерта,
    мощный басовый дроп при возврате в нормальное время.; Камера: Плавный кинематографичный
    облет машины на 45 градусов вокруг вертикальной оси во время выбора карточки,
    затем резкий динамический зум в бампер при подтверждении.; UI/Тактильность: Карточки
    модулей с анимированными 3D-иконками и неоновыми рамками редкости (Обычный, Редкий,
    Прототип); тактильный клик-виброотклик при выборе.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Слоу-мо Финишер Босса с Таранным Разломом (Boss Finisher Ram-Breaker)
  category: Кульминация заезда, источник максимального катарсиса и условие победы
  priority: secondary
  description: Превращает завершение забега из рутинного расстрела полоски здоровья
    в интерактивный кинематографичный финишер в духе автомобильного фаталити, вознаграждающий
    смелость игрока.
  player_interaction: 'Клавиатура: Удержание [Shift] + [Пробел] для фиксации вектора
    тарана. Тач: Удержание двух пальцев на экране для фокусировки кинематографичного
    удара.'
  feedback: 'Визуал/VFX: Отделение камеры от машины в кинематографичный рельсовый
    пролет Bullet-Time, рентген-вспышка точки удара кенгурятника, взрывной разрыв
    босса на куски с эффектом объемной волны.; Звук (Web Audio): Мгновенное заглушение
    всех фоновых звуков с эффектом звона в ушах (Tinnitus 4 кГц notch фильтр), раскатистый
    замедленный бас-буст взрыва и финальный тяжелый гитарный рифф.; Камера: Динамическая
    траектория Bullet-Time с облетом точки столкновения на 180 градусов, голландский
    угол наклона (Dutch Angle 18°), экстремальный зум на деформирующийся радиатор.;
    UI/Тактильность: Серия из трех нарастающих хаптик-импульсов (имитация сердцебиения)
    перед столкновением и мощнейшая непрерывная вибрация на 600 мс в момент контакта;
    титр ''TARGET ELIMINATED''.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
gameplay_systems:
- name: Система Перемещения и Физического Контроля
  purpose: Обеспечить четкое и отзывчивое управление с учетом инерции и столкновений.
  input: Плавающий виртуальный джойстик (мобильные) или WASD/Стрелки (ПК).
  rules:
  - Скорость масштабируется параметрами маневренности и массы.
  - Коллизии с препятствиями рассчитываются через физический движок с упругим отскоком.
  - При потере управления включается автоматическая стабилизация.
  state:
  - IDLE
  - MOVING
  - DRIFTING
  - IMPACT
  - RECOVERING
  interactions: Взаимодействует с физическими телами врагов, препятствиями и дропами
    наград.
  feedback: Следы на поверхности, частицы пыли, звуки мотора/шагов, динамический наклон
    камеры.
  edge_cases:
  - При застревании в геометрии объект мягко телепортируется в ближайшую свободную
    точку.
- name: Боевая Система и Расчет Урона
  purpose: Обработка ударов, тарана, хитбоксов, расчета брони и эффектов отдачи.
  input: Кнопки атаки, нитро, спец-способностей.
  rules:
  - Итоговый Урон = (БазовыйУрон * ФакторСкорости + БонусСилы) * (1 - СнижениеБроней).
  - Критические удары наносят 2.0x урона при атаке в уязвимые зоны.
  - Тяжелые попадания вызывают 40мс хит-стоп замедление времени.
  state:
  - READY
  - ATTACKING
  - HITSTOP
  - COOLDOWN
  interactions: Триггеры коллизий проверяют пересечения с хитбоксами противников.
  feedback: Заморозка кадра (40мс), фонтан искр/частиц, всплывающие цифры урона.
  edge_cases:
  - Одновременные встречные удары вызывают взаимное физическое отталкивание.
core_design:
  signature_moment: Вход в занос под углом 60 градусов сквозь толпу из сотни зомби
    на скорости 110 км/ч с последующим таранным ударом по опоре водонапорной башни,
    обрушивающейся на преследующие броневики спецназа в кинематографичном слоу-мо
    под рев V8 и тяжелый фонк-бит.
  genre_template_rejected: 'Отказ от аркадного top-down управления с мгновенным разворотом
    машины без инерции (twin-stick shooter template). В нашей игре вектор движения
    строго подчинен физической инерции массы Rapier3D: броневик невозможно мгновенно
    повернуть на месте, атака строится на контроле траектории скольжения, переносе
    центра тяжести и боковом смещении кузова.'
  what_makes_it_different: 'Вместо пассивного уклонения от мобов игрок использует
    сам дрифт как генератор ресурса агрессии: глубокий занос заряжает Нитро-Ярость,
    превращая броневик в неуязвимый таранный снаряд, а разрушаемые элементы окружения
    (Pursuit Breakers) служат локальным тактическим супероружием.'
  micro_loop:
  - step: Срыв задней оси в занос перед скоплением зомби
    player_action: Поворот руля с кратковременным зажатием ручного тормоза [Пробел]
      / резкий свайп
    game_response: Броневик срывается в скольжение, резина дымит, шкала Нитро-Ярости
      начинает стремительно заполняться с множителем x2.2
    decision: Удерживать глубокий угол заноса ради максимального заряда нитро или
      выпрямить руль для сохранения линейной скорости
    duration: 0.8 с
  - step: Контактный распил боковыми модулями в скольжении
    player_action: Корректировка угла заноса подруливанием в сторону внешнего радиуса
      толпы
    game_response: Шипованные диски и пилы кромсают зомби по дуге, из тел вылетают
      шестеренки, счетчик комбо растет
    decision: Срезать глубже в плотную толпу ради очков или держаться края, избегая
      замедления ниже 28 км/ч
    duration: 1.2 с
  - step: Выброс Нитро-Тарана сквозь блокаду
    player_action: Нажатие кнопки Нитро-Инжектора [Shift] при 100% шкале ярости
    game_response: Взрывной импульс 45000 Н, машина разгоняется до 140 км/ч с радиальным
      размытием экрана, раскидывая элитных мутантов физической ударной волной
    decision: Направить таран в толпу мутантов для сбора ресурсов или пробить заграждение
      полицейских перехватчиков
    duration: 1.85 с
  - step: Вакуумный сбор шестеренок и выбор траектории выхода
    player_action: Стабилизация машины и сбор выпавших шестеренок магнитным полем
      капота
    game_response: Шестеренки притягиваются к броневику, заполняя шкалу эволюции модуля,
      камера возвращается на стандартный угол
    decision: Начать новый дрифт в следующий карман арены или направиться к опоре
      Pursuit Breaker
    duration: 0.7 с
  meso_loop:
  - step: 'Фаза 1: Разведка и Сбор Билда (Heat 1–2, 0:00–1:30)'
    player_action: Агрессивный дрифт по периметру, сбивание легких зомби и деревянных
      барьеров
    game_response: Спавн редких патрульных седанов, быстрый набор первых 3 уровней
      модулей (пилы, турель, огнемет)
    decision: Фокусироваться на модулях кругового урона или инвестировать в скорость
      накопления нитро
    duration: 90 с
  - step: 'Фаза 2: Эскалация и Прорыв Блокад (Heat 3, 1:30–3:30)'
    player_action: Использование узких переулков и активация Pursuit Breakers против
      скоростных перехватчиков
    game_response: Полиция перекрывает широкие магистрали машинами борт-к-борту (Roadblocks),
      на арену выходят плеватели кислотой
    decision: Идти на лобовой таран блокпоста с нитро или срезать через разрушаемый
      забор промзоны
    duration: 120 с
  - step: 'Фаза 3: Охота Тяжелой Спецтехники (Heat 4–5, 3:30–5:30)'
    player_action: Маневрирование на пределе сцепления, уклонение от лобовых атак
      броневиков Rhino и лент с шипами
    game_response: Вертолет слепит прожектором, тяжелые Rhino таранят на встречных
      курсах, спавнятся мутанты-титаны
    decision: Беречь нитро исключительно для уклонения от Rhino или сжигать его для
      зачистки орд вокруг опор ловушек
    duration: 120 с
  - step: 'Фаза 4: Дуэль с Боссом-Мутантом и Эвакуация (5:30–7:00)'
    player_action: Разрушение бронепластин босса модулями и проведение финального
      кинематографичного тарана Ram-Breaker
    game_response: Босс оглушается при HP < 15%, включается слоу-мо финишер (0.1x
      timescale), открываются ворота секретного Убежища (Safehouse)
    decision: Мгновенно эвакуироваться или рискнуть добить оставшихся элитных врагов
      ради дополнительной Репутации
    duration: 90 с
  macro_loop:
  - step: Анализ Ущерба и Репутации в Сводке Заезда
    player_action: 'Просмотр итогов заезда: нанесенный ущерб городу (Cost to State),
      сбитые зомби и уничтоженные патрули'
    game_response: Начисление очков Most Wanted Репутации, рост позиции в рейтинге
      Черного Списка города
    decision: Инвестировать очки в усиление прочности кузова или разблокировку нового
      класса машин
    duration: 25 с
  - step: Тюнинг и Модернизация Броневика в Гараже
    player_action: Установка усиленных кенгурятников, расширителей колесной базы для
      резкого заноса и неоновой подсветки
    game_response: Обновление физических параметров машины (момент инерции, множитель
      урона тарана, объем баллона нитро)
    decision: Собрать тяжелый бронированный маслкар для тарана или легкий японский
      дрифт-кар для сверхбыстрого накопления ярости
    duration: 45 с
  - step: Выбор Района и Контракта на Карте Мегаполиса
    player_action: Выбор следующей зоны вылазки (Индустриальная промзона, Доки, Небоскребы)
      с уникальными модификаторами
    game_response: Отображение наград за контракт, сложности спавна копов и расположения
      секретных убежищ
    decision: Пойти в высокорисковый район с модификатором 'Шипованные заслоны' ради
      x2 чертежей или фармить безопасную промзону
    duration: 20 с
