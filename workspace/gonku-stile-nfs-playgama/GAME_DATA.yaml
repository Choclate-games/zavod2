raw_prompt: Создай гонку в стиле нфс
title: Гонку стиле нфс playgama
slug: gonku-stile-nfs-playgama
genre: 3D Экшен-Дрифт / Выживание на Арене
subgenre: Аркадный Авто-Рогалик
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web)
orientation: landscape
target_audience: Любители экшен-гонок, зомби-апокалипсиса и аркадного дрифта на Яндекс
  Играх и мобильных платформах.
core_loop: Управляемый дрифт на арене -> Таран зомби и сбор шестеренок -> Выбор 1
  из 3 рогалик-модулей -> Битва с боссом-мутантом -> Мета-прокачка гаража.
hook: Физический дрифт броневика с шипами, таран сотен зомби, нитро-ускорения и слоу-мо
  финишеры боссов.
player_fantasy: Управляйте боевым броневиком в постапокалиптической пустоши, входите
  в управляемый дрифт в толпе зомби, накапливайте нитро-ярость и улучшайте модули
  вооружения.
session_model: Короткие сессии по 5-8 минут с высоким удержанием и мета-прокачкой.
unique_value_proposition: Уникальное сочетание аркадный авто-рогалик с сочным физическим
  геймфилом и рогалик-синергиями.
vision: Создать самый сочный и динамичный 3D авто-экшен про дрифт в браузере с взрывной
  физикой и мгновенным откликом управления.
elevator_pitch: Дрифтуйте на бронированной машине, давите орды зомби, копите нитро
  и прокачивайте турели на выживание!
win_conditions: Уничтожить босса арены на 10-й минуте и эвакуироваться.
lose_conditions: Полное разрушение брони машины (HP = 0).
progression_summary: 'Между заездами растет статус в списке самых разыскиваемых гонщиков
  города (Most Wanted / Репутация) за счет успешных отрывов от полиции и суммы нанесенного
  ущербу городскому имуществу. Это открывает доступ к новым районам мегаполиса (индустриальная
  промзона, доки, небоскребы) и новым секретным убежищам (Safehouses). В гараже разблокируются
  новые классы машин (японские дрифт-кары, тяжелые американские маслкары, экзотические
  суперкары) с уникальным визуальным тюнингом (неон, обвесы, винилы) и профильными
  характеристиками: прочность кузова при таране, объем баллона нитро и резкость входа
  в занос.'
difficulty_curve: Давление растет ступенчато через шкалу розыска (Heat 1–5) на протяжении
  90–120 секунд заезда. На 0:00–0:30 (Heat 1–2) игрока преследуют редкие патрульные
  крузеры, а заграждения состоят из легко сбиваемых деревянных барьеров. На 0:30–1:00
  (Heat 3) на перехват выходят скоростные перехватчики, блокирующие перекрестки машинами
  борт-к-борту (Roadblocks) и заставляющие срезать через дворы. На 1:00–1:30 (Heat
  4–5) подключаются тяжелые броневики (Rhino), идущие на лобовой таран, вертолет с
  прожектором и ленты с шипами (Spike Strips) на скоростных трассах. Финальные 30
  секунд — марш-бросок к открывшемуся убежищу (Safehouse) сквозь заслон из спецтехники,
  где единственный шанс прорваться — прибереженный Nitro Burst или обрушение последнего
  Pursuit Breaker.
