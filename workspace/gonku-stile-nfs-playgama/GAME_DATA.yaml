- skill_id: playgama_skill
  name: Интеграция Playgama Bridge SDK
  filename: PLAYGAMA_SKILL.md
  purpose: Стандарты работы с SDK @playgama/bridge v2 (реклама, облачные сейвы, лидерборды,
    авторизация).
  when_to_use: При реализации показа видеорекламы, сохранения прогресса, авторизации
    и хуков паузы.
  rules:
  - Дожидаться bridge.initialize() (с таймаутом) перед любыми вызовами SDK.
  - game_ready отправляется ровно один раз и только после загрузки ассетов и готовности
    меню.
  - Награда за rewarded начисляется только по событию state === 'rewarded', не по
    резолву промиса.
  - Сейв — один ключ, один JSON-объект; storage.get/set вызываются без аргумента storageType.
  - authorize() вызывается только по действию игрока (кроме тихой авторизации на vk/ok).
  - 'UI строится на capability-флагах: кнопка неподдерживаемой функции не рисуется
    вовсе.'
  - Пауза и звук берутся из событий платформы, а не только из visibilitychange.
  architecture: Сервисный синглтон PlaygamaService с поддержкой локального оффлайн-мока
    (platform.id === 'mock').
  implementation_guidance: Подписаться на EVENT_NAME.REWARDED_STATE_CHANGED, вызвать
    bridge.advertisement.showRewarded(placement), снять слушателя в off() и вернуть
    true только для состояния 'rewarded'. Полный код — knowledge/playgama/ads_integration.md.
  common_mistakes:
  - Отправлять game_ready сразу после initialize() — сплэш снимается над незагруженной
    игрой.
  - Ждать `await authorize()` внутри загрузки — игра виснет у всех гостей.
  - 'Определять гостя по player.id/name: у гостя они заполнены, нужен player.isGuest.'
  - Начислять награду по резолву showRewarded() — платит за скип и закрытие.
  - Показывать межстраничную рекламу в первые секунды сессии или во время боя.
  - Потреблять покупку до её выдачи — оплаченный товар уничтожается.
  - Хранить настройки в localStorage — в iframe платформы это partitioned-хранилище.
  checklist:
  - Rewarded начисляет ровно одну награду за один ролик даже при двойном клике.
  - Прогресс переживает перезагрузку у гостя и у авторизованного игрока.
  - Битый сейв не роняет игру — старт на дефолтах.
  - Рекорды сохраняются и отправляются в таблицу лидеров.
  - game_ready уходит один раз, после него поднимаются баннеры.
  knowledge_refs:
  - playgama/game_ready_and_loading.md
  - playgama/auth_and_player.md
  - playgama/storage_and_cloud.md
  - playgama/ads_integration.md
  - playgama/banners_and_layout.md
  - compliance/yandex_moderation.md
  - ux/localization_system.md
  - ux/touch_controls.md
- skill_id: stack_skill
  name: 'Three.js Stack: Rapier3D, BVH, Yuka, Recast, bitECS, postprocessing'
  filename: STACK_SKILL.md
  purpose: The libraries the game is built on, their verified versions and the tasks
    each one owns.
  when_to_use: Use before writing physics, AI, pathfinding, mass-entity or post-processing
    code — i.e. before writing any system that a stack library already owns.
  rules:
  - Take the library. A hand-rolled A*, boids flock, character controller, broadphase
    or bloom chain is a review defect, not an optimisation.
  - Rapier3D owns rigid bodies, joints and vehicles; a physics body is never driven
    by writing setLinvel() every frame.
  - three-mesh-bvh owns raycasts against static level geometry; Raycaster over a raw
    50k-triangle mesh is not acceptable.
  - Yuka owns steering, finite state machines, fuzzy decisions and perception.
  - recast-navigation owns NPC pathfinding and crowds; walkableHeight/Climb/Radius
    are expressed in cells, not metres.
  - bitECS owns entity mass (bullets, hordes, units) rendered through InstancedMesh;
    it is not used for a handful of unique entities.
  - 'postprocessing owns screen effects: one EffectPass for all of them, renderer.render()
    is replaced by composer.render().'
  - 'Frame order is fixed: input -> AI -> vehicle/controllers -> physics.step() ->
    ECS -> transform sync -> camera -> quality -> composer.render().'
  - WASM libraries (Rapier, Recast) are initialised on the loading screen, behind
    the boot watchdog, and Recast only when the game actually needs a navmesh.
  architecture: Three.js scene as the render layer; Rapier world as the physics source
    of truth; Yuka EntityManager and a recast Crowd for smart NPCs; bitECS world for
    mass entities; one EffectComposer for post FX.
  implementation_guidance: Pin the verified versions from knowledge/stack/README.md.
    Snippets found online for bitecs 0.3 (defineComponent/defineQuery) or rapier 0.13
    will not compile against the pinned versions.
  common_mistakes:
  - Re-implementing a library feature by hand because 'it is just a few lines'.
  - Calling renderer.render() next to composer.render() — the scene is drawn twice.
  - Stepping the physics world with a variable timestep instead of a fixed one with
    a substep cap.
  - Loading the Recast WASM in a game that has no NPC navigation.
  checklist:
  - No custom pathfinding, steering, broadphase or post-processing chain exists in
    src/.
  - The frame order matches knowledge/stack/README.md section 2.
  - Every stack library used is pinned to the version in knowledge/stack/README.md.
  knowledge_refs:
  - stack/README.md
  - stack/rapier3d.md
- skill_id: controls_skill
  name: Mobile Touch & Desktop Controls
  filename: CONTROLS_SKILL.md
  purpose: 'Задаёт обязательный контракт управления: раскладку под жанр, реализацию
    на Pointer Events, отмену браузерных жестов и правила видимости.'
  when_to_use: 'Use when implementing any player input: virtual joystick, action buttons,
    driving pedals, camera gestures, or keyboard bindings.'
  rules:
  - Только Pointer Events + setPointerCapture; учитывать pointerId для каждой кнопки.
  - Движение и основное действие обязаны работать одновременно (мультитач).
  - В играх про вождение газ — отдельная кнопка, а не вертикаль стика руля.
  - 'touch-action: none, отмена contextmenu/dragstart и touchmove с passive:false.'
  - Отступы через env(safe-area-inset-*); основная кнопка >= 96 px, остальные >= 64
    px.
  - Слой управления виден только в игровом процессе и сбрасывается при скрытии.
  - Сброс всех осей и кнопок на blur и visibilitychange.
  - Флаг ?touch=1 принудительно включает мобильную раскладку на десктопе.
  architecture: Отдельный модуль TouchControls создаёт собственный DOM-слой поверх
    UI, пишет в виртуальные оси InputManager и ничего не знает об игровой логике.
    InputManager сливает клавиатуру и тач, отдавая игре единый снимок управления.
  implementation_guidance: 'UIManager владеет экземпляром TouchControls и переключает
    его видимость в showHud/showPause/hideAllModals. Джойстик — плавающий: база появляется
    под пальцем, зона захвата — половина экрана, мёртвая зона 8%.'
  common_mistakes:
  - Один стик на движение и газ — машина теряет ход в каждом повороте.
  - 'touchstart/touchend без pointerId: второй палец сбрасывает первый.'
  - Слой управления оставлен видимым в меню — он перехватывает тапы по кнопкам.
  - Забытый passive:false — страница продолжает скроллиться под игрой.
  - Кнопки прижаты к краю без safe-area — их перекрывает вырез и системный жест.
  checklist:
  - Газ/атака и направление работают одновременно, проверено тремя пальцами.
  - Свайп по игре не скроллит страницу и не вызывает pull-to-refresh.
  - Долгое нажатие не открывает контекстное меню.
  - Управление скрыто в меню и паузе, оси сброшены после сворачивания вкладки.
  - ?touch=1 показывает мобильную раскладку на десктопе и кликается мышью.
  knowledge_refs:
  - ux/touch_controls.md
- skill_id: vehicle_skill
  name: Physics Vehicle, Drift & Skidmarks
  filename: VEHICLE_SKILL.md
  purpose: 'Задаёт архитектуру аркадной машины: занос, следы шин на асфальте, нитро-ускорение
    и звук мотора.'
  when_to_use: 'Use for any drivable vehicle: truck, car, buggy, tank, mech, racing.'
  rules:
