    Heat, битвой с боссом-мутантом и мета-прогрессией в гараже.

    - `mechanics/drift_scoring.md` — Подсчет множителя и непрерывности заноса для
    конвертации угла дрифта в шкалу нитро-ускорения.'
  common_mistakes:
  - Реализовать механику по памяти, не открыв документ, который под неё выбран.
