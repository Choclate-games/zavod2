  tension_curve: Волнообразно нарастающая синусоида с резкими пиками адреналина. 0:00–1:30
    (Низкое напряжение) — ощущение превосходства, игрок крутит легкие 'пончики' в
    толпе зомби. 1:30–3:30 (Среднее напряжение) — появление быстрых копов и блокад
    сжимает безопасное пространство арены. 3:30–5:30 (Экстремальное напряжение) —
    лобовые атаки броневиков Rhino и вертолет создают постоянную угрозу мгновенной
    смерти при потере скорости. 5:30–7:00 (Кульминация) — босс-файт требует ювелирного
    балансирования между дрифтом для нитро и уворотом от спецтехники, завершаясь катарсическим
    слоу-мо финишером и спадом напряжения при прорыве в безопасную зону Safehouse.
  core_formulas:
  - 'Урон тарана броневика: Ram_Damage = BaseMass_kg * (CurrentVelocity_kmh / 10)^1.85
    * NitroMultiplier * BumperSpikeBonus'
  - 'Генерация Нитро-Ярости в секунду: Rage_Gain_Sec = 18.5 * (Clamp(SlipAngle_deg,
    22.5, 75.0) / 45.0) * (CurrentSpeed_kmh / 60.0) * ProximityEnemyMultiplier'
  - 'Множитель плотности спавна врагов от розыска: EnemyDensity = BaseSpawnRate *
    (1.0 + HeatLevel^1.45) + (ElapsedTime_sec / 90.0)^1.2'
  - 'Очки Репутации за заезд: Rep_Earned = (ZombiesCrushed * 3) + (CopVehiclesDestroyed
    * 75) + (CostToState_USD / 500) * BossFinisherBonusMultiplier'
  run_progression:
  - 'Минута 0–2: Установка 2 базовых модулей (например, Дисковые пилы на ступицах
    + Крышный пулемет 7.62-мм), броневик легко пробивает скопления зомби до 20 тел.'
  - 'Минута 2–5: Эволюция модулей до 3-го ранга (Пилы получают плазменный нагрев,
    пулемет модифицируется в спаренную автопушку 20-мм), открытие синергии ''Огненный
    След + Напалмовый Дрифт''.'
  - 'Минута 5–8: Получение легендарного прототипа (например, ''Электромагнитный Кенгурятник
    Тесла'', бьющий дуговыми молниями при каждом таране на скорости > 80 км/ч), максимизация
    объема баллона нитро до 2 зарядов.'
  meta_progression:
  - 'Ранг в Черном Списке (Blacklist #15 -> #1): Открывает новые классы авто (Маслкар
    ''Джаггернаут'', Дрифт-купе ''Сакура R34'', Пустынный Рейд-Трак ''Апокалипсис'').'
  - 'Гаражные улучшения каркаса: Перманентная прибавка к базовой прочности кузова
    (+5% за уровень, до +50%), магнитному радиусу сбора шестеренок (от 4.5 м до 9.0
    м) и охлаждению инжектора нитро.'
  - 'Кастомизация и Визуальный Тюнинг: Неоновые трубки под днищем (меняют цвет искр
    дрифта), кастомные выхлопные патрубки с цветным пламенем, уникальные граффити-винилы
    Most Wanted, дающие +10% к приросту Репутации в профильных районах.'
  mechanics:
  - name: Инерционный Дрифт-Накопитель Нитро-Ярости (Inertial Drift Rage Accumulator)
    role_in_loop: Двигатель геймплея и ключевой источник боевого ресурса
    player_decision: Рискнуть войти в глубокий занос (угол 45°-65°) вплотную к плотной
      толпе зомби ради x3.2 множителя заряда Нитро, рискуя застрять в массе врагов
      при падении скорости ниже 28 км/ч, или удерживать безопасную дугу на пустой
      периферии арены с медленной зарядкой.
    input_mapping: 'Клавиатура: [A]/[D] или [Стрелки] — подруливание, [Пробел] — импульсный
      ручной тормоз для срыва задней оси. Тач: горизонтальный виртуальный джойстик
      + динамический жест свайпа вниз для срыва в занос.'
    states:
    - 'GRIP_DRIVING: Скорость > 40 км/ч, угол скольжения < 15°, базовый прирост нитро
      0%/с, стандартное сцепление шин.'
    - 'DRIFT_ENTRY: Угловая скорость рыскания > 1.8 рад/с, срыв задней оси, старт
      генерации дыма и искр.'
    - 'SUSTAINED_DRIFT: Угол скольжения 22.5°-75.0°, скорость 28-120 км/ч, генерация
      18.5% нитро/с, множитель очков x1.5-x3.2.'
    - 'OVERSTEER_SPINOUT: Угол > 75°, критическая потеря скорости (-60%), отключение
      накопления нитро, штраф к управляемости на 1.2 с.'
    parameters:
    - name: min_drift_angle_deg
      value: 22.5 град
      tuning_note: При снижении до 10° занос триггерится случайно при любом мелком
        маневре; при повышении до 40° вход в дрифт требует чрезмерных усилий и ломает
        аркадную динамику.
    - name: rage_charge_rate_per_sec
      value: 18.5 %/с
      tuning_note: При значении > 35%/с игрок находится в бесконечном нитро-таране;
        при < 8%/с дрифт перестает ощущаться как выгодное тактическое действие.
    - name: critical_speed_stall_kmh
      value: 28.0 км/ч
      tuning_note: Если поднять до 45 км/ч, броневик намертво вязнет в любой группе
        зомби; если опустить до 10 км/ч, полностью исчезает риск остановки и окружения.
    - name: drift_multiplier_max
      value: 3.2 x
      tuning_note: Если снизить до 1.5x, игроки перестают рисковать глубоким заносом
        в толпе; если поднять до 6x, ломается ценность модулей оружия.
    feedback_layers:
    - 'Визуал/VFX: Густые клубы черного жженого корда из-под задних покрышек, процедурные
      следы протектора на асфальте с кровавыми брызгами, сноп оранжево-синих искр
      от металлических дисков при угле заноса > 45°.'
    - 'Звук (Web Audio): Синтезированный визг резины (Bandpass фильтр 1.8-3.2 кГц
      с модуляцией частоты от угла заноса), перегруженный низкочастотный рокот компрессора
      V8, нарастающий свист турбины по мере заполнения шкалы.'
    - 'Камера: Динамическое смещение точки обзора на 12° в сторону, противоположную
      вектору заноса (counter-steer look-ahead), легкое расширение FOV от 60° до 68°
      при удержании дуги более 1.5 с.'
    - 'UI/Тактильность: Дуговая неоновая шкала угла заноса вокруг спидометра с переходом
      цвета от желтого к пульсирующему синему; вибрация геймпада/смартфона с частотой
      45 Гц при идеальном угле скольжения.'
    failure_mode: 'Игрок перекручивает руль (угол > 75°) или сбрасывает скорость ниже
      28 км/ч: броневик разворачивает на 180°, машина теряет инерцию, шкала заноса
      сбрасывается с резким звуком срыва сцепления, а орда зомби мгновенно облепляет
      борта.'
    mastery_curve: Новичок на 30-й секунде заносов влетает в бетонные ограждения и
      крутит неуправляемые 'спинауты'; мастер на 10-м забеге непрерывно нарезает идеальные
      восьмерки вокруг спавнеров зомби, балансируя угол строго на 60° с максимальным
      притоком Нитро.
    counterplay: Зомби-плеватели заливают асфальт едкой кислотой (снижает коэффициент
      трения колес на 70%, провоцируя мгновенный разворот), а бронированные спецназовцы
      выставляют шипованные ленты.
    synergies:
    - Заряжает шкалу для активации Нитро-Таранного Прорыва.
    - Раскручивает боковые Шипованные Диски и Пилы, наносящие x2.5 режущий урон по
      радиусу дрифта.
    why_unique: В отличие от классических авто-шутеров с плоским рулением, броневик
      атакует именно боковым смещением массы через физику твердых тел Rapier3D, превращая
      дрифт из маневра уклонения в главное ударное оружие.
    pseudocode: "function tickDrift(car, dt) {\n  const slipAngle = calculateSlipAngle(car.velocity,\
      \ car.forwardVector);\n  if (car.speedKmH > 28.0 && slipAngle >= 22.5 && slipAngle\
      \ <= 75.0) {\n    const angleRatio = (slipAngle - 22.5) / (75.0 - 22.5);\n \
      \   const multiplier = 1.0 + angleRatio * 2.2;\n    car.nitroRage = Math.min(100.0,\
      \ car.nitroRage + 18.5 * multiplier * dt);\n    VFX.spawnDriftSparks(car.rearWheels,\
      \ slipAngle);\n    Audio.setDriftPitch(0.8 + angleRatio * 0.6);\n  } else if\
      \ (slipAngle > 75.0) {\n    car.applySpinoutPenalty(1.2);\n  }\n}"
  - name: Нитро-Таранный Прорыв с Ударной Волной (Nitro Ram Shockwave)
    role_in_loop: Источник взрывного снятия напряжения и преодоления критических блокад
    player_decision: Активировать мгновенный выброс нитро на 1.85 с для пробития плотного
      кольца мутантов, или приберечь 100% заряд для тарана тяжелого полицейского броневика
      Rhino / босса в уязвимое сочленение брони.
    input_mapping: 'Клавиатура: [Shift] или двойное нажатие [W]. Тач: Выделенная кнопка-педаль
      ''NITRO BURST'' в правой зоне экрана или резкий двойной тап по экрану.'
    states:
    - 'READY: Заряд 100%, пламя из выхлопных патрубков тлеет пульсирующим синим светом.'
    - 'IGNITION_BURST: Момент детонации смеси (0.12 с), стартовый импульс 45000 Н,
      расталкивание контактных врагов.'
    - 'OVERDRIVE_RAM: Фаза неуязвимости (1.85 с), скорость 140 км/ч, физический урон
      x4.5, фронтальный силовой барьер раскидывает врагов.'
    - 'EXHAUST_COOLDOWN: Остывание инжектора (0.8 с), шлейф белого пара, блокировка
      накопления ярости.'
    parameters:
    - name: nitro_duration_sec
      value: 1.85 с
      tuning_note: Если увеличить до 3.5 с, игра превращается в бесконечный режим
        бога без тактики; если уменьшить до 0.8 с, игрок не успевает пробить глубокий
        кордон спецтехники.
    - name: ram_damage_multiplier
      value: 4.5 x
      tuning_note: При множителе < 2.0x таран не ваншотит тяжелых зомби с щитами,
        делая лобовой удар суицидальным; при > 8.0x боссы уничтожаются за 2 нажатия.
    - name: speed_boost_multiplier
      value: 2.4 x
      tuning_note: Если сделать > 3.5x, камера теряет читаемость геометрии и броневик
        врезается в невидимые углы; при < 1.5x теряется ощущение сокрушительного рывка.
    - name: shockwave_radius_m
      value: 6.5 м
      tuning_note: При радиусе < 3 м разлет тел выглядит неубедительно; при > 12 м
        зачищается весь экран без необходимости точного наведения машины.
    feedback_layers:
    - 'Визуал/VFX: Радиальное размытие экрана (Radial Blur 0.45), синяя хроматическая
      аберрация, 2.5-метровые факелы пламени из выхлопных труб, разлет ragdoll-моделей
      зомби на 10+ метров с объемными брызгами крови.'
    - 'Звук (Web Audio): Суб-басовый ударный дроп (35 Гц -> 80 Гц за 0.08 с), оглушительный
      рев инжектора закиси азота, звонкий скрежет деформируемого листового металла
      при коллизиях.'
    - 'Камера: Резкий рывок назад с увеличением FOV от 65° до 82° за 0.15 с с последующим
      упругим возвратом, сильный высокочастотный шейк амплитудой 0.4 ед. при сокрушении
      тяжелых целей.'
    - 'UI/Тактильность: Двойной тяжелый хаптик-импульс на мобильных устройствах; неоновая
      синяя вспышка по периметру экрана и счетчик комбо-сбиваний ''RAMPAGE x25''.'
    failure_mode: 'Игрок активирует нитро прямо в монолитную бетонную стену или в
      лоб броневику Rhino без прокачанного таранного кенгурятника: машина получает
      40 урона от отдачи коллизии, а заряд нитро сгорает впустую.'
    mastery_curve: Новичок жмет нитро наугад сразу при заполнении шкалы; эксперт рассчитывает
      вектор удара так, чтобы пробить цепочку из 30 зомби, срезать угол блокпоста
      копов и влететь в уязвимый борт разворачивающегося перехватчика.
    counterplay: Появление тяжелых броневиков Rhino, идущих на встречный таран на
      скорости 100 км/ч (лобовое столкновение наносит обоюдный урон, требуется уворот
      или удар строго в борт).
    synergies:
    - Расходует ресурс, накопленный в Инерционном Дрифте.
    - Активирует цепную детонацию Напалмового Шлейфа по траектории прорыва.
    why_unique: 'Таран рассчитывает кинетическую массу сбитых тел через физический
      движок Rapier3D: тела зомби превращаются в тяжелые снаряды, которые сбивают
      стоящих сзади врагов по принципу падающего домино.'
    pseudocode: "function triggerNitroRam(car) {\n  if (car.nitroRage < 100.0 || car.isNitroActive)\
      \ return;\n  car.nitroRage = 0.0;\n  car.isNitroActive = true;\n  car.invulnerabilityTimer\
      \ = 1.85;\n  car.rigidBody.applyImpulse(car.forwardVector.clone().multiplyScalar(45000),\
      \ true);\n  PostProcess.triggerRadialBlur(0.45, 1.85);\n  Audio.playWebAudio('nitro_subdrop');\n\
      \  Physics.triggerAreaShockwave(car.position, 6.5, 3500);\n}"
  - name: Обрушение Городских Конструкций (Pursuit Breakers Demolition)
    role_in_loop: Источник тактического контроля арены и мгновенного уничтожения элитных
      преследователей
    player_decision: Сохранить на арене опорные балки гигантского рекламного щита
      или крыши заправки до появления тяжелых перехватчиков Heat 4 и босса, либо снести
      их сейчас для экстренной расчистки проезда.
    input_mapping: 'Физический контакт: точный таран опорных балок объекта передним
      кенгурятником или контролируемым боковым заносом (хлыстом заднего бампера).'
    states:
    - 'INTACT: Конструкция устойчива, подсвечена пульсирующим красным маркером разрушения
      на миникарте и в мире.'
    - 'STRUCTURAL_IMPACT: Контакт на скорости > 42 км/ч: деформация балки, замедление
      времени до 0.25x на 0.35 с.'
    - 'COLLAPSING: Физическое обрушение: спавн 15-25 обломков с активными коллайдерами,
      зона летального урона 14 м.'
    - 'DEBRIS_FIELD: Обломки остаются на земле, блокируя проезд зомби и образуя трамплин
      для машины игрока.'
    parameters:
    - name: impact_trigger_speed_kmh
      value: 42.0 км/ч
      tuning_note: Если установить < 20 км/ч, опоры будут падать от случайного касания
        бродячих зомби; если > 70 км/ч, игрок не сможет активировать ловушку в дрифте.
    - name: demolition_kill_radius_m
      value: 14.0 м
      tuning_note: При радиусе < 6 м ловушка не накрывает преследующий хвост копов;
        при > 25 м разрушается баланс арены и исчезает челлендж позиционирования.
    - name: slomo_duration_sec
      value: 0.35 с
      tuning_note: Если сделать > 1.0 с, нарушается динамика экшен-гонки и ритм саундтрека;
        если < 0.15 с, игрок не успевает зафиксировать зрелищность катастрофы.
    - name: gear_reward_bonus
      value: 45 шт
      tuning_note: При значении < 10 шт игроки игнорируют ловушки; при > 120 шт происходит
        мгновенный оверлевелинг в первые 60 секунд заезда.
    feedback_layers:
    - 'Визуал/VFX: Кинематографичный ракурс разрушения (Look-At на падающую вывеску/водонапорную
      вышку), фонтан электро-искр от рвущихся проводов, объемные клубы серой пыли
      и взрыв с разлетом 20+ физических обломков.'
    - 'Звук (Web Audio): Глухой металлический скрежет деформируемых двутавровых балок,
      резкий щелчок лопающихся стальных тросов, массивный низкочастотный взрыв (Lowpass
      200 Гц) при ударе крыши о землю.'
    - 'Камера: Кратковременное переключение на динамический нижний ракурс под углом
      30° к падающему объекту, плавный зум назад с последующим возвратом за бампер
      машины.'
    - 'UI/Тактильность: Всплывающая золотая плашка ''PURSUIT BREAKER: 12 ПОЛИЦЕЙСКИХ
      УНИЧТОЖЕНО'' с анимацией разбивающегося стекла; затухающая вибрация длительностью
      400 мс.'
    failure_mode: 'Игрок врезается в опору на недостаточной скорости (< 42 км/ч) или
      под прямым углом 90° без запаса брони: конструкция не падает, машина теряет
      30 HP и намертво застревает перед хвостом преследователей.'
    mastery_curve: Новичок сносит опоры в панике и попадает под собственные падающие
      обломки; ветеран дрифтует в миллиметре от опоры, обрушивая многотонную конструкцию
      строго на крыши преследующих маслкаров спецназа.
    counterplay: Зомби-мутанты класса 'Тяжеловес' могут блокировать проезд к опорам
      своими телами, а вертолет спецназа подсвечивает разрушенные зоны прожектором,
      сбрасывая туда десант.
    synergies:
    - Активируется на высокой скорости из Нитро-Таранного Прорыва.
    - Генерирует фонтан шестеренок для ускоренной прокачки Кинетических Модулей.
    why_unique: 'Адаптация культовой механики Pursuit Breakers из NFS Most Wanted
      под изометрическую физику арены: интерактивное окружение превращается в управляемое
      супероружие игрока.'
    pseudocode: "function onBreakerCollision(car, breakerObj, impactSpeed) {\n  if\
      \ (impactSpeed >= 42.0 && breakerObj.state === 'INTACT') {\n    breakerObj.state\
      \ = 'COLLAPSING';\n    TimeManager.triggerSlomo(0.25, 0.35);\n    Physics.spawnDebrisField(breakerObj.position,\
      \ 20);\n    dealAreaDamage(breakerObj.position, 14.0, 9999);\n    Economy.spawnGears(breakerObj.position,\
      \ 45);\n    Camera.triggerDramaticLookAt(breakerObj.position, 0.35);\n  }\n}"
  - name: Кинетическая Эволюция Модулей Броневика (Kinetic Module Evolution)
    role_in_loop: Двигатель долгосрочной силы внутри забега и вариативности билдостроения
    player_decision: Выбрать модуль ближней дрифт-зачистки (Циркулярные пилы на дисках)
      для агрессивного контакта, модуль контроля дистанции (Термический огнеметный
      шлейф) для отсечения орды, или автоматическую импульсную турель 20-мм.
    input_mapping: 'UI-модальное окно: выбор 1 из 3 карточек апгрейда кликом мыши
      или тапом по экрану во время автоматического слоу-мо (0.05x timescale) при левелапе.'
    states:
    - 'XP_ACCUMULATION: Сбор шестеренок магнитным полем капота в радиусе 4.5 м.'
    - 'LEVEL_UP_SLOMO: Замедление времени до 0.05x, появление неонового интерфейса
      выбора модулей.'
    - 'MODULE_INSTALLATION: Визуальный монтаж модуля на 3D-модель машины (анимация
      дуговой сварки и лязг пневмопистолета).'
    - 'ACTIVE_SYNERGY: Автоматическая работа модулей, синхронизированная с углами
      заноса и скоростью движения.'
    parameters:
    - name: base_pickup_radius_m
      value: 4.5 м
      tuning_note: При радиусе < 2.5 м игрок вынужден нарезать круги за каждой деталью,
        сбивая темп гонки; при > 10 м сбор ресурсов становится полностью пассивным.
    - name: slomo_selection_timescale
      value: 0.05 x
      tuning_note: Если ставить 0.0x (полную паузу), сбивается ритм фонового фонк-трека;
        если > 0.2x, броневик успевают разбить зомби во время чтения описания карт.
    - name: max_active_modules_count
      value: 4 слота
      tuning_note: При < 3 слотов билды слишком примитивны; при > 6 слотов экран перегружен
        спецэффектами и Three.js теряет стабильные 60 FPS на мобильных устройствах.
    - name: level_exp_scaling_factor
      value: 1.28 x
      tuning_note: При факторе > 1.5x прокачка стопорится на 5-й минуте заезда; при
        < 1.1x игрок максимизирует все слоты за первые 2 минуты.
    feedback_layers:
    - 'Визуал/VFX: Неоновый голографический интерфейс в стилистике Most Wanted, вспышки
      дуговой сварки на кузове при установке апгрейда, лазерные трассеры и огненные
      шлейфы от работающих модулей.'
    - 'Звук (Web Audio): Приглушение музыки Lowpass фильтром (до 400 Гц) при левелапе,
      сочный металлический лязг пневматического гайковерта, мощный басовый дроп при
      возврате в нормальное время.'
    - 'Камера: Плавный кинематографичный облет машины на 45 градусов вокруг вертикальной
      оси во время выбора карточки, затем резкий динамический зум в бампер при подтверждении.'
    - 'UI/Тактильность: Карточки модулей с анимированными 3D-иконками и неоновыми
      рамками редкости (Обычный, Редкий, Прототип); тактильный клик-виброотклик при
      выборе.'
    failure_mode: Игрок собирает несбалансированный билд (только дальнобойные пулеметы
      без модулей прочности и контактного дрифт-урона) и оказывается неспособен разорвать
      плотное кольцо бронированных мутантов на Heat 4.
    mastery_curve: Новичок берет случайные модули с наибольшим разовым уроном; эксперт
      собирает синергетический 'Vortex Drift Build' (притягивающий вихрь + дисковые
      пилы + напалмовый след), зачищающий арену за секунды.
    counterplay: Появление элитных мутантов с электромагнитными щитами (временно отключают
      турели на крыше, требуя контактного распила циркулярными пилами на ступицах).
    synergies:
    - Модули напрямую масштабируют урон от параметров Инерционного Дрифта и Нитро-Тарана.
    - Шестеренки от Pursuit Breakers ускоряют получение ключевых эволюций.
    why_unique: 'Модули физически монтируются на 3D-кузов броневика и зависят от кинематики
      движения: дисковые пилы режут строго по касательной траектории заноса, а огнемет
      заливает напалмом внешнюю дугу дрифта.'
    pseudocode: "function onCollectGear(car, gearValue) {\n  car.currentExp += gearValue\
      \ * car.expMultiplier;\n  if (car.currentExp >= car.expToNextLevel) {\n    car.currentExp\
      \ -= car.expToNextLevel;\n    car.expToNextLevel = Math.floor(car.expToNextLevel\
      \ * 1.28);\n    TimeManager.setTimescale(0.05);\n    UI.showUpgradeCards(car.getAvailableModules(),\
      \ (selectedModule) => {\n      car.installModule(selectedModule);\n      TimeManager.restoreTimescale(0.2);\n\
      \    });\n  }\n}"
  - name: Слоу-мо Финишер Босса с Таранным Разломом (Boss Finisher Ram-Breaker)
    role_in_loop: Кульминация заезда, источник максимального катарсиса и условие победы
    player_decision: Рискнуть пойти в лобовую атаку на финальной стадии босса (HP
      < 15%) на максимальной скорости с нитро, чтобы активировать кинематографичный
      финишер, или добивать его безопасными турелями с дальней дистанции.
    input_mapping: 'Клавиатура: Удержание [Shift] + [Пробел] для фиксации вектора
      тарана. Тач: Удержание двух пальцев на экране для фокусировки кинематографичного
      удара.'
    states:
    - 'BOSS_STAGGERED: Босс оглушен, его броня расколота, открыта точка критического
      удара Core-Node.'
    - 'TARGET_LOCK_IN: Игрок разгоняется по прямой, траектория подсвечивается неоновым
      коридором прицеливания.'
    - 'CINEMATIC_IMPACT_SLOMO: Замедление времени до 0.1x, динамическая камера берет
      крупный план бампера и морды мутанта.'
    - 'EXPLOSIVE_DISMEMBERMENT: Взрыв мутанта, разлет бронеплит, финальный экран победы
      с начислением Репутации.'
    parameters:
    - name: finisher_hp_threshold_pct
      value: 15.0 %
      tuning_note: Если поднять до 35%, босс-файт заканчивается слишком рано без ощущения
        тяжелой битвы; если опустить до 5%, игрок часто случайно убивает босса турелью
        без зрелищного тарана.
    - name: finisher_slomo_timescale
      value: 0.10 x
      tuning_note: При значении > 0.3x теряется эпичность и кинематографичность; при
        < 0.03x сцена кажется зависшей.
    - name: cam_orbit_distance_m
      value: 5.2 м
      tuning_note: При дистанции < 3 м геометрия босса перекрывает экран; при > 10
        м теряется детальность деформации металла кенгурятника и разлета плоти.
    - name: reputation_bonus_multiplier
      value: 2.5 x
      tuning_note: Мотивирует игрока завершать бой именно рискованным лобовым тараном,
        а не пассивной стрельбой из турелей.
    feedback_layers:
    - 'Визуал/VFX: Отделение камеры от машины в кинематографичный рельсовый пролет
      Bullet-Time, рентген-вспышка точки удара кенгурятника, взрывной разрыв босса
      на куски с эффектом объемной волны.'
    - 'Звук (Web Audio): Мгновенное заглушение всех фоновых звуков с эффектом звона
      в ушах (Tinnitus 4 кГц notch фильтр), раскатистый замедленный бас-буст взрыва
      и финальный тяжелый гитарный рифф.'
    - 'Камера: Динамическая траектория Bullet-Time с облетом точки столкновения на
      180 градусов, голландский угол наклона (Dutch Angle 18°), экстремальный зум
      на деформирующийся радиатор.'
    - 'UI/Тактильность: Серия из трех нарастающих хаптик-импульсов (имитация сердцебиения)
      перед столкновением и мощнейшая непрерывная вибрация на 600 мс в момент контакта;
      титр ''TARGET ELIMINATED''.'
    failure_mode: 'Игрок пытается протаранить босса, когда у того еще более 15% HP
      или когда босс проводит встречный бросок: броневик отлетает назад, теряя 70%
      здоровья от сокрушительного контрудара.'
    mastery_curve: Новичок боится идти на таран босса и погибает от спама его миньонов;
      ветеран рассчитывает тайминг оглушения босса, разворачивает броневик на 180°
      в дрифте и всаживает полный заряд Нитро точно в открытое ядро.
    counterplay: Босс призывает элитных миньонов-камикадзе, пытающихся закрыть собой
      уязвимую точку и принять таран на себя.
    synergies:
    - Требует 100% готовности Нитро-Таранного Прорыва.
    - Разблокирует максимальную награду Most Wanted в Мета-Прогрессии Гаража.
    why_unique: Превращает завершение забега из рутинного расстрела полоски здоровья
      в интерактивный кинематографичный финишер в духе автомобильного фаталити, вознаграждающий
      смелость игрока.
    pseudocode: "function checkBossFinisher(car, boss) {\n  if (boss.hp / boss.maxHp\
      \ <= 0.15 && car.isNitroActive && car.speedKmH >= 80.0) {\n    TimeManager.triggerSlomo(0.10,\
      \ 2.0);\n    Camera.playBulletTimeOrbit(car.position, boss.position, 5.2);\n\
      \    boss.triggerDismemberment();\n    Economy.grantReputation(boss.baseRep\
      \ * 2.5);\n    GameState.triggerVictorySequence();\n  }\n}"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite 5.x
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Custom TinyEventBus & Reactive GameStore
  audio_engine: Howler.js (^2.2.4) с WebAudio API
  target_fps: 60
  max_draw_calls: 75
  max_triangles_or_sprites: 40000
  bundle_size_budget_mb: 4.2
  layers:
  - name: Application Layer
    responsibility: Инициализация Vite, ресайз канваса, полноэкранный режим, прелоадер.
  - name: Platform & Ads Layer
    responsibility: Адаптер Playgama Bridge, менеджеры Interstitial и Rewarded рекламы,
      Cloud Save.
  - name: Core Engine Layer
    responsibility: Фиксированный цикл GameLoop 60Гц, EventBus, маршрутизация ввода.
  - name: Physics Simulation Layer
    responsibility: Шаги симуляции Rapier3D, фильтрация коллизий, рэгдолл-синхронизация.
  - name: Gameplay Systems Layer
    responsibility: Боевая система, спавн врагов, выбор 3 карт улучшений, расчет комбо.
  - name: Entity Management Layer
    responsibility: Пул сущностей игрока, врагов, снарядов и осколков.
  - name: Rendering Layer
    responsibility: Three.js граф сцены, InstancedMesh батчинг, тени, эмиттеры частиц.
  - name: UI & HUD Layer
    responsibility: HTML5/CSS3 оверлей, виртуальный джойстик, полосы HP, модальные
      окна.
  modules:
  - name: src/main.ts
    desc: 'Точка входа: инициализация Playgama Bridge, загрузка ассетов и запуск Game.'
  - name: src/core/Game.ts
    desc: Главный координатор, стейт-машина и управление сценами.
  - name: src/core/GameLoop.ts
    desc: Фиксированный 60Гц цикл обновления с аккумулятором дельты.
  - name: src/core/EventBus.ts
    desc: Типизированная шина событий для слабой связности систем.
  - name: src/platform/PlaygamaService.ts
    desc: Служба работы с @playgama/bridge (реклама, облачные сейвы, лидерборды).
  - name: src/physics/PhysicsWorld.ts
    desc: Обертка физического мира Rapier3D с фильтрами слоев коллизий.
  - name: src/entities/Player.ts
    desc: Контроллер игрока с расчетом физических сил и управления.
  - name: src/entities/EnemyPool.ts
    desc: Пул переиспользуемых сущностей врагов с логикой поведения.
  - name: src/systems/CombatSystem.ts
    desc: Расчет урона, хит-стопа, импульсов и комбо-бонусов.
  - name: src/ui/UIManager.ts
    desc: Управление HUD, окном выбора карт, главным меню и экраном результатов.
monetization:
  strategy_summary: Гибридная модель Free-to-Play для Яндекс Игр и веб-порталов. Высокий
    eCPM за счет полезных Rewarded видео без агрессивного навязывания.
  rewarded_placements:
  - id: revive_run
    name: Второе Дыхание (Возрождение)
    benefit: Восстановление 50% HP + 3 сек неуязвимости с силовой волной, раскидывающей
      врагов.
    cooldown_or_limit: 1 раз за забег.
    trigger_moment: При получении смертельного урона.
  - id: double_gold_run
    name: Удвоение Наград (2x Золото)
    benefit: Удваивает все заработанные шестеренки и монеты за завершенный раунд.
    cooldown_or_limit: Доступно на каждом экране результатов.
    trigger_moment: Экран окончания игры.
  - id: free_card_reroll
    name: Переброс Карт Улучшений
    benefit: Обновляет список 3 карт улучшений с гарантией Редкой или Эпической карты.
    cooldown_or_limit: До 2 раз за забег.
    trigger_moment: Окно выбора 3 карт.
  interstitial_placements:
  - trigger_event: Между волнами и при возврате в Главное Меню.
    cooldown_seconds: 90
    conditions: Интервал не менее 90 секунд, не показывается во время активного геймплея.
