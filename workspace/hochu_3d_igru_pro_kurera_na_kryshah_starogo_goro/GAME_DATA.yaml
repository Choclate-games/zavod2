qa:
  functional_tests:
  - Проверка корректности распознавания жестов свайпа вверх/вниз и удержания на сенсорных
    экранах
  - 'Тест расчета урона посылке: нанесение ровно 25 HP урона при жестком падении и
    30 HP при прямом ударе о трубу'
  - 'Тест множителя Флоу: корректный рост от x1.0 до x4.0 с шагом 0.25 и мгновенный
    сброс до x1.0 при столкновении'
  - 'Тест генератора крыш: отсутствие непроходимых разрывов (> 12м) на всех уровнях
    сложности'
  - 'Тест интеграции Playgama Bridge: корректное начисление награды за просмотр Rewarded
    Video и восстановление посылки'
  performance_benchmarks:
  - Стабильные 60 FPS на устройствах уровня iPhone 11 / Redmi Note 10 / Samsung Galaxy
    A52
  - Время первичной загрузки и инициализации сцены менее 2.5 секунд при 4G-соединении
  - Потребление оперативной памяти вкладки браузера не более 160 МБ
  - Количество Draw Calls в игровом цикле не превышает 65
  cross_browser_matrix:
  - Mobile Safari (iOS 15+)
  - Chrome Mobile (Android 10+)
  - Samsung Internet (Android)
  - Desktop Chrome / Edge (Windows / macOS)
  - Yandex Browser Mobile & Desktop
  common_bug_checklist:
  - Проваливание курьера сквозь геометрию на стыках процедурных модулей крыш (исправлено
    единым BVH-деревом)
  - Залипание жеста удержания (touchcancel) при входящих системных уведомлениях
  - Рассинхронизация звука Web Audio при возврате из свернутого состояния вкладки
  - Некорректное масштабирование Safe Area при повороте экрана устройства
roadmap:
- phase_number: 1
  title: Прототип ядра движения и BVH-коллизий
  duration_days: 2
  tasks:
  - Настройка Three.js сцены и камеры слежения от 3-го лица
  - Реализация кинематического контроллера курьера (бег, гравитация, свайпы)
  - Интеграция three-mesh-bvh и базовых наклонных крыш
  - Механика амортизации приземления (Cushion Roll)
  milestone_deliverable: Играбельный прототип с непрерывным бегом, прыжками и таймингом
    приземлений
- phase_number: 2
  title: Система посылки, генератор крыш и Флоу
  duration_days: 2
  tasks:
  - Разработка Parcel Integrity System с нанесением урона и визуалом трещин
  - Процедурный генератор крыш из 12 модулей с развилками
  - Система множителя скорости Flow Combo x1..x4
  - Зацеп за карнизы и подкаты под трубы
  milestone_deliverable: Полноценный геймплейный цикл забега с хрупким грузом и процедурным
    городом
- phase_number: 3
  title: Арт, освещение, VFX и викторианская эстетика
  duration_days: 2
  tasks:
  - Интеграция стилизованных моделей черепицы, мансард, дымоходов и флюгеров
  - Настройка низкого закатного освещения и объемного тумана
  - Создание партиклов (пыль, искры, трейлы плаща, дым труб)
  - Стилизованный 3D-персонаж курьера с анимациями
  milestone_deliverable: Финальный визуальный стиль заката старого города со стабильными
    60 FPS
- phase_number: 4
  title: UI/UX, звук, Playgama Bridge и полировка
  duration_days: 2
  tasks:
  - Винтажный викторианский пергаментный интерфейс и адаптивный HUD
  - Подключение Web Audio API, звуковых эффектов и адаптивной музыки
  - Интеграция Playgama Bridge SDK (сохранения, лидерборды, реклама)
  - QA-тестирование на мобильных устройствах и балансировка таймингов
  milestone_deliverable: Релизная версия игры, полностью готовая к публикации на площадках
risks:
- risk: Слишком узкое окно амортизации приземления может фрустрировать мобильных игроков
    на слабых тач-экранах
  category: gameplay
  severity: High
  mitigation: Внедрение адаптивного входного буфера жеста (Input Buffering на 120
    мс) и расширение базового окна до 0.18 с с плавным сужением по мере набора комбо
- risk: Просадка производительности на бюджетных смартфонах из-за большого количества
    черепицы и дымоходов
  category: technical
  severity: High
  mitigation: Использование Three.js InstancedMesh для повторяющейся геометрии, объединение
    статичных мешей и агрессивный Frustum Culling с лимитом 65 draw calls
- risk: Проваливание персонажа под кровлю на стыках процедурно стыкуемых модулей при
    высокой скорости
  category: technical
  severity: Medium
  mitigation: Использование непрерывного лучевого сканирования (Continuous Raycasting)
    через three-mesh-bvh с запасом по высоте 0.2м и наложением небольшого перекрытия
    геометрии модулей (0.1м overlap)
- risk: Игрок может потерять интерес после нескольких забегов из-за однообразия городского
    пейзажа
  category: design
  severity: Medium
  mitigation: Введение 5 визуально и архитектурно различных кварталов с уникальными
    препятствиями (мельницы, часовые башни, алхимические трубы) и мета-прогрессии
    экипировки
skills:
- skill_id: procedural-rooftop-builder
  name: Генератор процедурных крыш на Three.js
  filename: skills/procedural_rooftop_builder.md
  purpose: Сборка бесшовной полосы крыш из модульных заготовок с InstancedMesh и гарантированной
    проходимостью
  when_to_use: При разработке уровня, чанков зданий и системы пулинга геометрии
  rules:
  - Использовать единый буфер для черепицы каждого типа
  - Поддерживать минимальную ширину крыши не менее 4 метров
  - Ограничивать максимальный разрыв между зданиями 12 метрами
  architecture: Модульный менеджер чанков с пулом объектов (ChunkPool), фабрикой модулей
    (ModuleFactory) и генератором сидов
  implementation_guidance: Создавать чанки с запасом на 3 шага вперед по движению
    камеры и удалять позади с дистанцией 30м
  common_mistakes:
  - Создание новых инстансов Three.Geometry в цикле рендера
  - Отсутствие проверки досягаемости следующего карниза
  checklist:
  - Пул чанков не выделяет память в рантайме
  - Коллизии через BVH генерируются асинхронно при спавне
  - Draw calls не превышают 65
  knowledge_refs:
  - knowledge/threejs/procedural_mesh_builder.md
  - knowledge/stack/three_mesh_bvh.md
- skill_id: kinematic-parkour-controller
  name: Кинематический паркур-контроллер с распознаванием жестов
  filename: skills/kinematic_parkour_controller.md
  purpose: Обеспечение отзывчивого физического движения курьера, обработки свайпов
    и тайминга амортизации
  when_to_use: При программировании управления персонажем, анимаций и взаимодействия
    с поверхностями
  rules:
  - Использовать кинематический рейкастинг вместо тяжелой физики твердых тел
  - Обрабатывать тач-события с буферизацией в 120 мс
  - Плавная интерполяция высоты при скольжении по наклонным скатам
  architecture: 'Конечный автомат состояний (FSM: Run, Jump, Slide, CushionRoll, LedgeGrab,
    Fall) с событийным входом'
  implementation_guidance: Привязывать вертикальное смещение к нормалям полигонов
    черепицы для естественного бега по уклонам
  common_mistakes:
  - Использование стандартного физического трения, приводящего к спотыканиям на стыках
  - Игнорирование потери фокуса окна (touchcancel)
  checklist:
  - Все состояния FSM корректно выходят в Run или Fall
  - Управление одним пальцем работает без виртуальных джойстиков
  - FPS стабилен при непрерывных жестах
  knowledge_refs:
  - knowledge/mechanics/parry.md
  - knowledge/patterns/score_attack_loop.md
- skill_id: playgama-bridge-integration
  name: Интеграция Playgama Bridge для Web/Mobile платформ
  filename: skills/playgama_bridge_integration.md
  purpose: Подключение SDK Playgama для сохранений, лидербордов и показа Rewarded/Interstitial
    рекламы
  when_to_use: При интеграции с экосистемами Яндекс Игр, VK Play и мобильного веба
  rules:
  - Всегда проверять готовность рекламы перед вызовом
  - Ставить игру на полную паузу при показе рекламы
  - Дублировать облачные сохранения в LocalStorage
  architecture: Адаптер-синглтон PlaygamaBridgeAdapter с подпиской на события видимости
    страницы
  implementation_guidance: Использовать bridge.advertisement.showRewardedVideo() для
    Страховки и удвоения чаевых
  common_mistakes:
  - Вызов рекламы посреди активного прыжка игрока
  - Утечка звука Web Audio во время показа видеорекламы
  checklist:
  - Звук глушится во время рекламы
  - Пауза восстанавливается корректно
  - Облачные сейвы синхронизируются при старте
  knowledge_refs:
