preview_status: completed
definition_of_done:
- Полноценный 3D-контроллер курьера с управлением одним пальцем (свайпы вверх/вниз,
  удержание для амортизации) и поддержкой клавиатуры на ПК
- Механика амортизации приземления (Cushion Roll) с активным тайминг-окном 0.18 с,
  защищающая посылку от разрушения
- Физическая шкала целостности посылки (Parcel Integrity 100 HP) с нанесением урона
  при ударах и визуализацией трещин
- Множитель непрерывного темпа Flow Combo (x1.0..x4.0) с динамическим ускорением и
  эффектами скорости
- Процедурный генератор крыш старого города из 12 архитектурных модулей (скаты, мансарды,
  дымоходы, карнизы, бельевые веревки)
- Красивая стилизованная сцена старого европейского города на закате с терракотовой
  черепицей, патинированной медью и лучами заходящего солнца
- Быстрый расчет коллизий и рейкастов через three-mesh-bvh со стабильными 60 FPS на
  мобильных устройствах
- 'Полный цикл сессии: выбор контракта -> забег 45–75 секунд -> расчет гонорара и
  чаевых -> мастерская экипировки'
- Интеграция Playgama Bridge SDK 2.x (облачные сохранения, лидерборды, Rewarded Video
  для Страховки и удвоения чаевых)
- Адаптивный интерфейс под Safe Area мобильных экранов в книжной ориентации без виртуальных
  кнопок
- Звуковая подсистема на Web Audio API с процедурным ветром, сочными звуками паркура
  и динамической музыкой
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Получение курьерского контракта на доставку хрупкой посылки
  -> Скоростной паркур-забег по процедурным крышам с таймингом прыжков, подкатов и
  амортизации приземлений -> Доставка груза на балкон заказчика -> Подсчет гонорара
  и чаевых за скорость и сохранность (Flow Multiplier & Integrity) -> Кастомизация
  снаряжения (сумки с амортизацией, нескользящая обувь) и открытие новых сложных районов
  города..'
- 'Реализованы механики проекта: Амортизационный перекат по черепице (Cushion Roll
  & Kinetic Transfer), Катапультирующий зацеп за карниз (Ledge Grab & Pop-Up Vault),
  Скоростной подкат под паровые вытяжки (Slate Slide & Flue Duck), Инерционная гидродинамика
  алхимической колбы (Aetheric Parcel Fluid Inertia).'
- Условие успеха (Успешная доставка посылки на целевой балкон адресата за время таймера
  (менее 60 секунд) с сохранением целостности груза > 0% (идеально 100% для 3 звезд
  и максимальных чаевых).) и условие проигрыша (Срыв в переулок к пешеходам (падение
  с крыши), полное разрушение груза (целостность 0% от неотринутых ударов о трубы)
  или истечение лимита времени контракта (0.0 сек).) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Черепичный Спринт: Чистый Флоу».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Страховка Гильдии (Второе дыхание),
  Королевские чаевые x2, Проба элитной сумки); interstitial соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
direction:
  options:
  - id: D1
    name: 'Черепичный Спринт: Чистый Флоу'
    pitch: Адреналиновый 3D-паркур от третьего лица с управлением одной рукой, где
      игрок входит в состояние потока, соединяя прыжки, подкаты и зацепы за карнизы
      ради идеальной сохранности хрупкой посылки.
    core_verb: Таймить свайпы и амортизировать приземления (удержание ритма непрерывного
      паркур-бега с сохранением целостности хрупкого груза).
    genre_family: 3D Скоростной Паркур-Раннер / Score Attack / Флоу-платформер
    session_shape: Срочный курьерский контракт на 45–75 секунд от мансарды отправителя
      до балкона адресата с нарастающим темпом и расчетом чаевых за чистоту прохождения.
    camera: Динамическая камера от третьего лица из-за плеча курьера (Third-Person
      Chase Cam) на высоте плеча с легким креном на виражах и динамическим зумом при
      ускорении.
    control_scheme: 'Одной рукой на мобильном (One-Thumb Gestures): свайп вверх —
      прыжок через провал / зацеп за карниз; свайп вниз — подкат под трубы и воздуховоды;
      удержание пальца в воздухе — группировка и амортизация удара посылки при приземлении.
      На ПК — стрелки/WASD (вверх/вниз) и Пробел.'
    world: 'Европейский старый город XIX века на закате: терракотовая и сланцевая
      черепица, медные флюгеры, дымоходы, натянутые бельевые веревки, золотой закатный
      свет и синий сумрак в переулках внизу.'
    spectacle: Курьер в развевающемся твидовом плаще в миллиметре пролетает над кованой
      решеткой между мансардами, прижимая светящуюся стеклянную колбу к груди на фоне
      заходящего солнца.
    why_not_generic: Соединяет patterns/score_attack_loop.md, mechanics/parry.md,
      threejs/procedural_mesh_builder.md и stack/three_mesh_bvh.md. Механика парирования
      переосмыслена как тайминг амортизации приземления (cushion timing window), защищающий
      хрупкий груз от перегрузок, а скоростной цикл Score Attack завязан на непрерывный
      множитель темпа (Flow Multiplier) без дискретных полос и искусственных ограничений.
    biggest_risk: Необходимость филигранной калибровки окон тайминга и хитбоксов процедурных
      препятствий, чтобы игра ощущалась отзывчивой на 60 Гц сенсорных экранах.
    production_cost: Средний. Требуется процедурная сборка модулей крыш, контроллер
      кинематики персонажа с 4 ключевыми состояниями анимаций и система комбо-множителей.
    knowledge_hints:
    - patterns/score_attack_loop.md
    - mechanics/parry.md
    - threejs/procedural_mesh_builder.md
    - threejs/procedural_character_rig.md
    - stack/three_mesh_bvh.md
    - ux/touch_controls.md
    - audio/procedural_sound_synthesizer.md
  - id: D2
    name: 'Крышный Траекторщик: Прыжок в Окно'
    pitch: Тактический физический платформер с замедлением времени, где каждый прыжок
      над пропастью рассчитывается натяжением пальца с учетом хрупкости черепицы и
      инерции посылки.
    core_verb: Натягивать и отпускать траекторию (баллистический расчет прыжков и
      скольжений курьера между крышами).
    genre_family: Физический Экшен-Пазл / Траекторный Платформер / Precision Jumper
    session_shape: Дискретный маршрут из 6-10 сегментов крыш (60–90 секунд на доставку)
      с оценкой затраченной энергии и точности приземлений.
    camera: Изометрическая 2.5D/3D камера сверху под углом 45 градусов (Top-Down Isometric),
      охватывающая текущую позицию, пропасть и следующую точку зацепа.
    control_scheme: 'Натяжение и сброс (Drag-and-Release): касание и оттягивание пальца
      в любой точке экрана для задания вектора и силы прыжка (показывается дуга траектории
      с замедлением времени Bullet Time); отпускание — бросок тела; повторный тап
      в полете — выброс руки для зацепа за карниз.'
    world: 'Викторианский стимпанк-город: мокрые чугунные крыши, клубы пара из вентиляций,
      циферблаты башенных часов, газовые фонари и мерцающие мансардные окна.'
    spectacle: Курьер замер в воздухе в замедленном времени над пропастью переулка,
      пунктирная дуга траектории указывает на скользкий конек соседней крыши, с которого
      осыпается старая черепица.
    why_not_generic: Соединяет patterns/physics_arcade_loop.md, stack/rapier3d.md,
      threejs/orthographic_2d_and_pointer_input.md и mechanics/physics_destruction.md.
      Вместо аркадного бега игра предлагает расчет баллистики с честной физикой отскоков
      и разрушением хлипких элементов крыши под весом курьера.
    biggest_risk: Потеря ощущения стремительного паркура и адреналиновой скорости
      из-за пауз на прицеливание перед каждым прыжком.
    production_cost: Средний. Физическая симуляция траекторий и расчет коллизий на
      базе Rapier3D, проработка разрушаемых элементов декораций и траекторного UI.
    knowledge_hints:
    - patterns/physics_arcade_loop.md
    - stack/rapier3d.md
    - threejs/orthographic_2d_and_pointer_input.md
    - mechanics/physics_destruction.md
    - threejs/procedural_mesh_builder.md
    - ux/touch_controls.md
  - id: D3
    name: 'Балансир Верхолаз: Экспресс на Карнизе'
    pitch: Физический симулятор балансировки и скоростного верхолазания, где игрок
      удерживает центр тяжести тяжелой посылки на скользких балках и вручную перехватывает
      карнизы над бездной.
    core_verb: Балансировать наклон и поочередно тапать (удержание равновесия на узких
      коньках и ручной перехват карнизов).
    genre_family: Физический Симулятор Доставки / Спидран-Балансир / Вертикальный
      Экшен
    session_shape: Напряженная смена из 3 доставок по 1.5–2 минуты с нарастающей сложностью
      архитектуры, порывами ветра и накоплением усталости персонажа.
    camera: Кинематографичный 2.5D вид сбоку (Side-Scroller Cinematic Profile) с динамическим
      панорамированием и сильным акцентом на пропасть под ногами.
    control_scheme: Горизонтальный drag пальцем в нижней части экрана для балансировки
      угла наклона курьера и центра масс посылки; раздельные тапы по левой/правой
      половине экрана для поочередного перехвата руками за выступы карниза при карабканьи.
    world: 'Средиземноморский прибрежный старый город: белые известняковые фасады,
      крутые терракотовые скаты, деревянные балки, виноградные шпалеры и лазурное
      море на горизонте.'
    spectacle: Курьер на одной ноге балансирует на узком деревянном коньке под шквалистым
      ветром, посылка за спиной опасно кренится над пропастью, где внизу копошатся
      прохожие.
    why_not_generic: Соединяет patterns/score_attack_loop.md, mechanics/ragdoll.md,
      stack/rapier3d.md и threejs/physics_integration.md. Строится вокруг физики активного
      рэгдолла и динамического смещения центра масс груза, превращая каждый шаг по
      карнизу в борьбу с инерцией.
    biggest_risk: Высокий порог входа и раздражение от частых падений из-за сложного
      физического балансирования на мобильном экране.
    production_cost: Высокий. Требует активного физического рэгдолла (Active Ragdoll),
      комплексных сочленений (joints) в Rapier3D и тонкой настройки физики инерции
      переносимого груза.
    knowledge_hints:
    - patterns/score_attack_loop.md
    - mechanics/ragdoll.md
    - stack/rapier3d.md
    - threejs/physics_integration.md
    - threejs/procedural_character_rig.md
    - ux/touch_controls.md
  selected_id: D1
  selected_name: 'Черепичный Спринт: Чистый Флоу'
  selection_reason: 'Направление D1 («Черепичный Спринт: Чистый Флоу») выбрано как
    наиболее точно и выразительно воплощающее замысел пользователя об адреналиновом
    паркуре курьера. Для мобильных браузеров это идеальный формат: управление одним
    пальцем на базе свайпов и удержания без виртуальных кнопок интуитивно понятно
    с первой секунды. Направление обеспечивает мгновенный вход в состояние потока
    (Flow State), легкую процедурную геометрию на Three.js со стабильными 60 FPS,
    быстрое определение коллизий через BVH и мощную игровую петлю «чище трюки — быстрее
    доставка — выше чаевые».'
  rejected_reasons:
  - 'Направление D2 («Крышный Траекторщик: Прыжок в Окно») отвергнуто, так как пошаговое
    натяжение траекторий (slingshot) с паузами Bullet Time разрушает непрерывный ритм
    паркура и ощущение стремительной доставки, превращая динамичный экшен в медленную
    баллистическую головоломку.'
  - 'Направление D3 («Балансир Верхолаз: Экспресс на Карнизе») отвергнуто из-за перегруженности
    управления на сенсорном экране (одновременное выравнивание центра тяжести и поочередный
    перехват карнизов), высокого порога входа для мобильных игроков и избыточной вычислительной
    нагрузки от физики Active Ragdoll в браузере.'
  what_it_is_not:
  - Клон Subway Surfers или Temple Run с тремя дискретными полосами движения и перестроением
    по сетке
  - Виртуальный экранный джойстик и наэкранные кнопки управления
  - 'Боевые механики: враги на крышах, драки, холодное или огнестрельное оружие и
    стрельба'
  - Рогаликовый выбор из трех случайных карт навыков посреди забега (шаблон Survivor)
  - Невидимые стены и мгновенная гибель без физического срыва в пропасть
  - Серые нетекстурированные кубы (blockout) вместо стилизованной европейской архитектуры
    старого города (черепица, медь, кирпич, мансарды)
  - Оторванная от темы мета-прокачка статов (+5% к скорости) вместо курьерских контрактов
    разной сложности и кастомизации экипировки
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - 'Инерционная шкала целостности посылки (Parcel Integrity): удары о препятствия
    и жесткие падения без амортизации повреждают груз и снижают оплату заказа.'
  - 'Управление одной рукой естественными жестами (One-Thumb Flow): свайпы вверх/вниз
    и тап-удержание без наэкранных джойстиков и виртуальных кнопок.'
  - Процедурная генерация маршрута по крышам из модульных архитектурных блоков (скаты,
    мансарды, вентиляционные трубы, карнизы, бельевые веревки) с гарантированной проходимостью.
  - 'Множитель непрерывного темпа (Flow Combo Multiplier): преодоление препятствий
    в идеальный тайминг без торможения разгоняет курьера и увеличивает финальные чаевые.'
  - 'Фатальность падения на улицу: промах мимо крыши или срыв с карниза приводит к
    падению в переулок и провалу текущего контракта.'
  signature_scene: 'Вид от третьего лица из-за плеча курьера в кульминационной точке
    прыжка над десятиметровым разрывом между двумя мансардами: в косых лучах заходящего
    золотого солнца ярко блестит влажная терракотовая черепица и медные флюгеры, курьер
    в развевающемся твидовом плаще вытягивает руку к кованому карнизу соседнего здания,
    бережно прижимая к груди хрупкую светящуюся стеклянную колбу с посылкой, а далеко
    внизу в глубокой синей тени переулка виднеются миниатюрные крыши экипажей и зажженные
    газовые фонари.'
  avoid_references:
  - Subway Surfers
  - Mirror's Edge
  - Temple Run
  - Vector
  - Death Stranding
  - Canabalt
  - Clustertruck
knowledge_plan:
  selections:
  - path: patterns/score_attack_loop.md
    role: core
    reason: Определяет архитектуру курьерского спринт-раннера с нарастающим темпом,
      комбо-множителем флоу и финальным расчетом наград за сохранность груза.
  - path: threejs/performance_guide.md
    role: core
    reason: Обеспечивает стабильные 60 FPS на мобильных устройствах при быстром беге
      по плотному процедурному городу через инстансинг и объединение геометрии.
  - path: threejs/adaptive_quality.md
    role: supporting
    reason: Динамически масштабирует разрешение рендера и дальность прорисовки черепичных
      крыш для предотвращения троттлинга на смартфонах.
  - path: threejs/mobile_shaders.md
    role: supporting
    reason: Задает правила создания легких мобильных материалов черепицы, меди и пара
      без ресурсоемких физических шейдеров.
  - path: threejs/physics_integration.md
    role: core
    reason: Связывает Three.js с физическим движком для обработки скольжения по наклонным
      скатам крыш, амортизации перекатов и расчета перегрузок колбы.
  - path: threejs/procedural_mesh_builder.md
    role: core
    reason: Позволяет процедурно генерировать здания викторианского города, черепичные
      скаты, мансарды, дымоходы и натянутые тросы без внешних 3D-моделей.
  - path: threejs/game_map_and_world_design.md
    role: core
