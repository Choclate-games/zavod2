gameplay_systems:
- name: Система динамической целостности посылки (Parcel Integrity System)
  purpose: Отслеживание физического состояния груза, расчет повреждений от перегрузок
    и ударов, и финальный расчет гонорара и чаевых курьера.
  input: События коллизий от физического рейкастера, параметры перегрузки при приземлении,
    флаги идеальной амортизации.
  rules:
  - Удар о препятствие (труба, дымоход) наносит 30 ед. урона
  - Жесткое приземление с высоты более 3м без амортизации наносит 25 ед. урона
  - При 0 ед. целостности посылка разбивается и контракт проваливается
  - Итоговые чаевые = Базовая ставка * (Текущая целостность / 100) * Множитель Флоу
  state:
  - CurrentIntegrity (0..100 HP)
  - MaxIntegrity (100 HP)
  - TotalDamageTaken
  - PerfectCushionsCount
  interactions: Передает данные в HUD (шкала Integrity), шейдер колбы (визуализация
    трещин), аудиосистему и менеджер наград.
  feedback: 3D-модель колбы покрывается светящимися трещинами, экранная красная вспышка,
    звук бьющегося стекла, виброотклик.
  edge_cases:
  - Приземление на наклонный скат под углом более 30° снижает базовый урон на 50%
    даже без амортизации
  - Падение в пропасть мгновенно обнуляет целостность
- name: Система процедурной генерации крыш (Rooftop Procedural Generator)
  purpose: Бесшовная сборка бесконечной полосы разнообразных крыш старого города из
    модульных блоков с гарантированной проходимостью и развилками.
  input: Параметры сложности контракта, сид уровня, оставшаяся дистанция до финиша.
  rules:
  - Генерация чанками длиной 25–45 метров из пула 12 архитектурных модулей
  - Гарантированное соответствие длины провалов между зданиями (4–12м) физике прыжка
  - 'Создание развилок каждые 150 метров: верхний скоростной ярус карнизов vs нижний
    безопасный скат'
  - Удаление пройденных чанков за 30 метров позади курьера для экономии памяти
  state:
  - ActiveChunksList
  - NextSpawnZCoord
  - CurrentDistrictTheme
  - DistanceToDestination
  interactions: Взаимодействует с Three.js InstancedMesh для отрисовки черепицы и
    three-mesh-bvh для построения дерева коллизий.
  feedback: Плавное появление силуэтов особняков в золотистом закатном тумане без
    малейших фризов кадров.
  edge_cases:
  - Автоматическая калибровка высоты следующего здания при генерации развилки для
    исключения непреодолимых тупиков
- name: Система множителя потока (Flow Combo System)
  purpose: Стимулирование непрерывного скоростного движения игрока за счет экспоненциального
    роста наград и скорости.
  input: 'События успешных трюков: амортизация (Cushion), подкат (Slide), зацеп (Ledge
    Grab), бег по канату.'
  rules:
  - Каждое идеальное действие добавляет +0.25 к множителю темпа (максимум x4.0)
  - При Flow x2.0, x3.0 и x4.0 скорость курьера увеличивается на +10%, +20% и +30%
  - Любое жесткое столкновение или остановка мгновенно сбрасывает множитель до x1.0
  - Множитель напрямую умножает финальные очки репутации и чаевые за доставку
  state:
  - CurrentFlowMultiplier (1.0..4.0)
  - ComboStreakCount
  - MaxFlowDurationSeconds
  interactions: Управляет радиальным размытием камеры, динамическим углом обзора (FOV
    55° -> 68°) и слоями саундтрека.
  feedback: Огненно-золотой трейл за плащом персонажа, звуковой аккорд при повышении
    комбо, расширение поля зрения.
  edge_cases:
  - Полет на восходящем потоке теплого воздуха над дымоходом замораживает комбо-таймер
    на время полета
- name: Диспетчерская контрактов и гильдии (Guild Contract Dispatch System)
  purpose: 'Управление мета-игрой: генерация заказов разной сложности, начисление
    наград, прокачка ранга курьера и открытие районов.'
  input: Текущий ранг игрока, выбранный район города, результаты завершенного забега.
  rules:
  - 'Выбор из 3 контрактов: Обычный (стандарт), Срочный (таймер -25%, награда +50%),
    Хрупкий (урон х2, чаевые х3)'
  - 'Завершение контрактов заполняет шкалу репутации гильдии (Ранги: Новичок -> Подмастерье
    -> Скороход -> Мастер)'
  - Каждый новый ранг открывает доступ к следующему кварталу города и продвинутой
    экипировке
  state:
  - AvailableContracts
  - ActiveContractId
  - GuildReputationPoints
  - UnlockedDistrictsBitmask
  interactions: Связывает экран итогов забега, облачные сохранения Playgama Bridge
    и магазин мастерской.
  feedback: Золотая сургучная печать 'ДОСТАВЛЕНО В СРОК' на пергаменте контракта с
    анимацией начисления монет.
  edge_cases:
  - При обрыве сети результаты забега сохраняются в LocalStorage и синхронизируются
    при первом удобном случае
core_design:
  signature_moment: 'Затяжной прыжок над 12-метровым провалом между часовой башней
    и мансардой на фоне багрового заката: игрок зажимает экран за 0.2 секунды до медного
    ската, курьер в идеальной группировке впечатывается в наклонную черепицу, выполняет
    молниеносный перекат с высеканием медных искр, сохраняя 100% целостности вибрирующей
    алхимической колбы, мгновенно разгоняется до 22 м/с и взлетает на х4 Flow-множителе
    прямо в узкую террасу заказчика под звонкий свист пара и осыпание черепичной крошки.'
  genre_template_rejected: Отвергнут шаблон 3-полосного коридорного раннера (Subway
    Surfers / Temple Run) с дискретными боковыми перестроениями по дорожкам и автоматическим
    сбором парящих золотых монет. В нашей игре пространство крыш непрерывно и трёхмерно
    (smooth 3D traversal с физикой уклонов и высот Rapier3D), а мотивация исходит
    не из сбора рассыпанных монет, а из сохранения физического груза (parcel integrity)
    и удержания непрерывного кинетического импульса (flow-состояния) через тайминг
    взаимодействия с геометрией архитектуры.
  what_makes_it_different: 'В отличие от классических раннеров, где препятствие —
    это мгновенная смерть или замедление, в «Черепичном Спринте» каждое препятствие
    — это источник потенциальной кинетической энергии при правильном тайминге. Главный
    конфликт механики: максимальная скорость создаёт разрушительную перегрузку (G-force)
    для хрупкого груза в рюкзаке, требуя филигранной амортизации каждого приземления
    и подката. Ошибка не просто останавливает персонажа, а физически деформирует/разбивает
    посылку, снижая гонорар от богатых лордов города.'
  micro_loop:
  - step: Сканирование рельефа и чтение точки отрыва
    player_action: Оценка расстояния до края крыши и уклона черепицы, подготовка тапа
    game_response: Приближение медного карниза со скоростью 16 м/с, подсветка золотистым
      бликом зоны идеального толчка (0.22 с)
    decision: Прыгнуть раньше по пологой траектории на нижнюю террасу или сделать
      поздний затяжной прыжок с разгона на верхний мостик
    duration: 0.3-0.8 с
  - step: Фаза полёта и воздушная группировка (Hold-to-Cushion)
    player_action: Зажатие пальца на экране в воздухе за 0.25 с до контакта со скатом
      крыши
    game_response: Персонаж поджимает ноги к корпусу, фиксатор рюкзака натягивается,
      время слегка замедляется (0.8x timescale chromatic focus)
    decision: Удерживать ли хват для переката или отпустить палец раньше для моментального
      отскока в подкат под паровую трубу
    duration: 0.4-1.2 с
  - step: Контакт со скатом и поглощение кинетического удара (Cushion Impact)
    player_action: Удержание касания в момент соприкосновения с черепицей
    game_response: Выполнение гладкого переката (Roll), перевод вертикального падения
      в горизонтальный рывок +4.5 м/с, сохранение 100% Integrity груза
    decision: Перейти сразу в подкат по наклонному сланцу свайпом вниз или выпрямиться
      для набора шага
    duration: 0.2-0.5 с
  - step: Реакция на низкое препятствие (Dodge / Vent Slide)
    player_action: Свайп вниз перед вращающейся вытяжкой или бельевой растяжкой
    game_response: Курьер уходит в низкое скольжение на коленях, хитбокс снижается
      до 0.6 м, пролёт под трубой с искрами от медных наколенников
    decision: Завершить слайд прыжком на конце ската или продлить скольжение для удержания
      безопасного центра тяжести
    duration: 0.3-0.6 с
  meso_loop:
  - step: Вход в квартал и преодоление стартового прямого ската
    player_action: Точный тайминг первых 3 прыжков и перекатов без потери импульса
    game_response: Шкала Flow Multiplier заполняется до х2, музыка обогащается медными
      духовыми и перкуссией, скорость вырастает с 12 до 16 м/с
    decision: Сохранять осторожный темп для 100% сохранности колбы или форсировать
      риск ради бонуса за время
    duration: 5.0-10.0 с
  - step: Архитектурная развилка повышенного риска (Route Fork)
    player_action: 'Выбор траектории: свайп в воздухе в сторону узкого натянутого
      троса либо падение на широкую, но загроможденную трубами террасу'
    game_response: Камера смещается по вектору маршрута, на тросе генерируются порывы
      бокового ветра, на террасе — плотный каскад низких вытяжек
    decision: Пойти по скоростному воздушному каналу (срезка 6 сек, риск сорваться)
      или безопасному ломаному маршруту (потеря времени)
    duration: 8.0-15.0 с
  - step: Критическая связка препятствий квартала (Choke Point)
    player_action: 'Серия быстрых действий: прыжок над пропастью -> зацеп за карниз
      при недолете -> выталкивание вверх -> мгновенный подкат'
    game_response: 'Проверка физики груза на кавитацию: при идеальном исполнении колба
      светится лазурным, при ошибке — появляются трещины (-25 HP)'
    decision: Пожертвовать 15% прочности посылки ради срезания дуги прыжка или аккуратно
      карабкаться с потерей темпа
    duration: 5.0-8.0 с
  macro_loop:
  - step: Выбор срочного курьерского контракта в Диспетчерской гильдии
    player_action: 'Выбор заказа на карте города: оценка типа груза (алхимическая
      колба, оптические линзы, часовой механизм), дистанции и награды'
    game_response: 'Отображение параметров: лимит 60 с, хрупкость IV класса, прогноз
      погоды (туман/ветер), базовый гонорар 150 шиллингов + чаевые'
    decision: Взять высокооплачиваемый хрупкий контракт под риск разбить груз или
      стандартную доставку для стабильного заработка
    duration: 5.0-15.0 с
  - step: Исполнение скоростного забега по крышам (The Delivery Run)
    player_action: Паркур-забег с непрерывным управлением свайпами и удержанием пальца
      для амортизации на дистанции 500 м
    game_response: Процедурный рендеринг крыш Three.js, симуляция физики Rapier3D,
      расчёт перегрузок груза, отсчёт таймера 60.0 -> 0.0 с
    decision: Балансирование между агрессивным спидраном на х4 Flow и сохранением
      целостности колбы при прыжках с большой высоты
    duration: 45.0-75.0 с
  - step: Финальное приземление на балкон заказчика и расчет гонорара
    player_action: Финальный тач-даун в посадочный маркер на веранде особняка
    game_response: 'Курьер передает посылку дворецкому; вывод чека: базовый гонорар
      + бонус за секунды запаса + множитель чаевых за целостность груза'
    decision: Забрать награду шиллингами или удвоить бонус гильдии просмотром короткого
      рекламного контракта
    duration: 5.0-10.0 с
  - step: Мастерская экипировки и прогрессия районов (Workshop & Map)
    player_action: Инвестирование заработанных шиллингов в пневмо-подвеску сумки,
      сланцевые подошвы и разблокировку Алхимического квартала
    game_response: Повышение характеристик (амортизация +15%, окно зацепа +0.05 с),
      открытие новых контрактов с викторианскими дирижаблями
    decision: Прокачать демпфер сумки под более хрупкие грузы или купить ботинки для
      экстремального сцепления на мокрой черепице
    duration: 10.0-25.0 с
  loop_diagram: "+-----------------------------------------------------------------------+\n\
    |                 ГИЛЬДИЯ КУРЬЕРОВ (ДИСПЕТЧЕРСКАЯ)                     |\n|  \
    \    [Выбор контракта: дистанция 500м, тип груза: Эфирная Колба]      |\n+-----------------------------------------------------------------------+\n\
    \                                  |\n                                  v\n+-----------------------------------------------------------------------+\n\
    |                      КРЫШИ ВИКТОРИАНСКОГО ГОРОДА                      |\n| \
    \                                                                      |\n|  +------------------->\
    \ [ РАЗГОН ПО ЧЕРЕПИЦЕ ] --------------------+  |\n|  |                     (12\
    \ м/с -> 20 м/с, Flow x1)                |  |\n|  |                          \
    \        |                             |  |\n|  |                            \
    \      v                             |  |\n|  |                      [ ЗОНА ОТРЫВА\
    \ КАРНИЗА ]                   |  |\n|  |                     (Тап / Свайп вверх:\
    \ Прыжок)                |  |\n|  |                                  |       \
    \                      |  |\n|  |                                  v         \
    \                    |  |\n|  |                   [ ФАЗА ПОЛЕТА НАД ПРОВАЛОМ ]\
    \                 |  |\n|  |                                  |              \
    \               |  |\n|  |             +--------------------+--------------------+\
    \        |  |\n|  |             |                                         |  \
