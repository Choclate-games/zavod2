    \ заказчика)\n                                  v\n+-----------------------------------------------------------------------+\n\
    |                    ФИНАЛЬНЫЙ РАСЧЕТ И АПГРЕЙДЫ                        |\n| \
    \ [Гонорар + Чаевые за Integrity & Flow] -> [Прокачка сумок и обуви]   |\n+-----------------------------------------------------------------------+"
  tension_curve: 'Пилообразная нарастающая кривая (Sawtooth Escalation Curve):

    1. Фаза старта (0–12 с): Низкое напряжение (2/10). Широкие черепичные платформы,
    мягкий ритм, игрок входит в состояние потока и разгоняет Flow до х2.

    2. Фаза первого каскада (12–30 с): Нарастание до 6/10. Появление чередующихся
    низких дымоходов (требующих подката) и провалов в 6–8 метров. Напряжение спадает
    на 2 секунды на плоской террасе после успешной связки.

    3. Фаза критического давления (30–55 с): Взлёт до 9/10. Узкие скаты со скользким
    мокрым сланцем, натянутые бельевые стропы над глубокими улицами, перепады высоты
    в 12 метров, где ошибка в амортизации грозит мгновенным уничтожением колбы. Окна
    тайминга сжимаются до 0.16 с.

    4. Кульминация финишного рывка (55–65 с): Пик 10/10. Финальный гигантский разрыв
    между башнями: игрок на предельной скорости 22 м/с обязан совершить идеальный
    прыжок и зацеп за карниз балкона.

    5. Фаза катарсиса (65–70 с): Спад до 0/10. Мягкое скольжение на ковер балкона,
    звон шиллингов, вздох облегчения курьера и вывод идеального счета сохранности
    100%.'
  core_formulas:
  - Damage = max(0, (Impact_Velocity_Y - Cushion_Threshold) * 4.5 * (1.0 - Bag_Damping_Stat))
    — урон целостности груза при жестком падении без амортизации; при вертикальной
    скорости падения выше 7.5 м/с без зажатого переката отнимает от 15 до 60 HP целостности
    из 100 HP.
  - V_current = clamp(V_base + (Flow_Multiplier - 1) * 2.5 + Slope_Boost - Slide_Drag,
    10.0, 24.0) — горизонтальная скорость курьера в м/с в зависимости от текущего
    множителя потока, уклона ската крыши (Slope_Boost = sin(alpha) * 5.0) и трения
    подката.
  - Flow_Tier = min(4, 1 + floor(Consecutive_Perfect_Actions / 3)) — множитель потока
    (х1, х2, х3, х4), повышающийся за каждые 3 идеально скоординированных действия
    подряд (Cushion Roll, Ledge Pop-Up, Flue Slide); сбрасывается до х1 при любом
    столкновении или недолете.
  - 'Payout_Shillings = round((Base_Reward + (Time_Remaining_Sec * 3.5)) * (Parcel_Integrity_Percent
    / 100.0) * (1.0 + (Final_Flow_Tier - 1) * 0.5)) — итоговая выплата за контракт:
    включает остаток времени, процент сохранности колбы и итоговый ранг мастерства
    потока.'
  - Grab_Window_Time = clamp(0.20 + Glove_Grip_Bonus - (V_current / 100.0), 0.12,
    0.38) — окно времени в секундах, доступное для свайпа вверх при пролёте мимо выступа
    карниза; уменьшается на высоких скоростях движения.
  run_progression:
  - 'Кинетический разгон маховика курьера (Kinetic Momentum Build-Up): Первые 3 идеальных
    приземления разгоняют бег с 12.0 м/с до 18.5 м/с, удлиняя дистанцию базового прыжка
    с 6.5 м до 11.0 м.'
  - 'Активация эфирного резонанса колбы (Aetheric Vessel Stabilization): При удержании
    Flow х3 и выше люминесцентный эфир в посылке входит в фазу стабильного свечения,
    создавая вокруг курьера аэродинамический кокон, снижающий сопротивление воздуха
    на 20%.'
  - 'Инстинкт крылатой ласточки (Roofer''s Hyper-Focus): После 30 секунд чистого бега
    без повреждений активируется расширенное восприятие: визуальные маркеры оптимальной
    точки отрыва на карнизах вспыхивают ярко-бирюзовым светом за 15 метров до края.'
  - 'Тепловой форсаж медных шарниров (Copper Joint Steam Burst): Накопленный непрерывный
    поток заряжает паровой клапан на поясе курьера, превращая каждый подкат под вытяжкой
    в мини-рывок с выбросом пара на +3.0 м/с.'
  meta_progression:
  - 'Курьерские сумки с гидравлическим демпфером (Hydraulic Suspension Satchels):
    5 уровней модернизации ранца (от парусинового мешка до гироскопической подвески
    с медными амортизаторами), снижающие получаемый грузом урон от жестких контактов
    на 10%–50%.'
  - 'Сапоги с шипованными свинцово-латунными накладками (Lead-Brass Roofer Treads):
    Улучшение подошв, увеличивающее коэффициент трения на мокром сланце на 40% и расширяющее
    тайминг-окно зацепа за карниз на 0.08 с.'
  - 'Гильдейские лицензии на элитные секторы города (Guild District Warrants): Покупка
    прав на доставку в опасные богатые кварталы (Мансарды знати -> Алхимический шпиль
    -> Доки дирижаблей -> Королевский Парящий Мост) с ростом стоимости контрактов
    в 4 раза.'
  - 'Поясные пневматические стабилизаторы (Pneumatic Balance Belt): Снаряжение, дающее
    право на 1 бесплатное автоматическое гашение критической перегрузки колбы за забег
    при грубой ошибке приземления.'
  mechanics:
  - name: Амортизационный перекат по черепице (Cushion Roll & Kinetic Transfer)
    role_in_loop: Ядро двигательной системы и главный генератор наград / сохранения
      груза
    player_decision: 'В какой момент зажать палец при падении с высоты: зажать слишком
      рано — персонаж преждевременно заблокирует ноги и потеряет дальность полета;
      зажать вовремя — конвертировать вертикальный удар в молниеносный горизонтальный
      разгон; не зажать — разбить колбу о жесткую черепицу.'
    input_mapping: 'Тач: Зажатие пальца в любой точке экрана во время фазы падения
      / Клавиатура: Удержание клавиши Space или Стрелки вниз в воздухе.'
    states:
    - IN_AIR_FALLING (свободное падение, набор вертикальной скорости Vy > 6 м/с)
    - HOLD_GROUPING (зажатие ввода, группировка тела курьера, натяжение ремней сумки)
    - 'PERFECT_ROLL_EXEC (контакт с крышей в окне 0.22 с: гашение удара, горизонтальный
      буст +4.5 м/с, сохранение 100% HP)'
    - 'EARLY_TUCK_PENALTY (зажатие раньше чем за 0.45 с до земли: курьер приземляется
      жестко на полусогнутые, потеря скорости -3 м/с)'
    - 'HARD_CRASH_IMPACT (контакт без зажатия: жесткий удар о кровлю, потеря 35 HP
      груза, сброс Flow до х1, курьер спотыкается на 0.6 с)'
    parameters:
    - name: Окно идеального зажатия амортизации (Perfect Cushion Window)
      value: 0.22 с
      tuning_note: Если увеличить до 0.40 с, игра превращается в однокнопочный раннер
        без чувства мастерства; если уменьшить до 0.12 с, игроки на тачскринах с задержкой
        ввода 60 Гц будут постоянно разбивать колбу.
    - name: Буст горизонтальной скорости при идеальном перекате (Roll Velocity Boost)
      value: +4.5 м/с
      tuning_note: При значении ниже +2.0 м/с игрок не чувствует эйфории от сохранения
        кинетического потока; при значении выше +7.0 м/с камера не успевает за курьером
        и следующий скат оказывается за границей экрана.
    - name: Базовый порог опасной вертикальной скорости (Safe Fall Velocity Cap)
      value: 7.5 м/с
      tuning_note: Если поднять до 12.0 м/с, механика переката обесценится на малых
        высотах; если опустить до 4.0 м/с, курьер будет получать урон даже от микро-прыжков.
    - name: Штраф к целостности колбы при пропуске амортизации (Hard Impact Damage)
      value: 30.0 ед
      tuning_note: Значение откалибровано ровно на 3 грубые ошибки за забег (100 HP
        / 30 = 3 жизни), что держит игрока в постоянном тонусе.
    feedback_layers:
    - 'Визуал/VFX: Золотисто-медный шлейф искр из-под подошв при идеальном кувырке,
      разлетающиеся осколки черепицы, свечение колбы лазурным ореолом.'
    - 'Звук (Web Audio): Глухой упругий хлопок натянутой кожи и звонкий щелчок медного
      карабина рюкзака, переходящий в нарастающий свист рассекаемого воздуха (Low-pass
      filter открывается с 800Hz до 8000Hz).'
    - 'Камера (импульс/зум): Мгновенная динамическая просадка FOV (с 65° до 58°) в
      момент контакта с последующим кинетическим выстрелом камеры вперед и легким
      шейком по вертикали (амплитуда 0.15м).'
    - 'UI/Тактильность: Короткая сочная вибрация смартфона (35 мс, pattern: ''medium''),
      всплывающий текст ''+FLOW COMBO'' золотым тиснением над шкалой целостности.'
    failure_mode: 'Игрок отвлекается на сбор времени и касается крыши стоя на прямых
      ногах. Сигнал: оглушительный стеклянный звон трещины, вспышка красного виньетирования
      экрана, анимация спотыкания курьера и просадка шкалы Integrity на треть.'
    mastery_curve: Новичок на 30-й секунде судорожно жмет экран заранее, получая штраф
      за раннюю группировку и теряя скорость; эксперт на 10-м забеге жмет ровно за
      0.08 с до черепицы под крутым углом, выжимая максимальный разгон до 22 м/с на
      крутых скатах.
    counterplay: Игра генерирует черепичные скаты под переменными углами (от 15° до
      45°), маскирует рельеф дымом из труб и сжимает дистанцию видимости до 25 метров
      на скоростях выше 18 м/с.
    synergies:
    - 'Синергия с ''Инерционной гидродинамикой колбы'': идеальный перекат обнуляет
      накопившуюся перегрузку жидкости внутри сосуда.'
    - 'Синергия со ''Скоростным подкатом под трубы'': выход из переката позволяет
      моментально перейти в низкий слайд без потери набранного буста +4.5 м/с.'
    why_unique: В большинстве раннеров приземление пассивно и автоматизировано. Здесь
      приземление — это активный QTE-гейт физического сохранения импульса и груза,
      где игрок физически поглощает вертикальную гравитацию.
    pseudocode: "function on_physics_collision_tick(courier, surface, dt):\n  if not\
      \ courier.is_grounded and surface.is_roof:\n    if courier.vertical_velocity\
      \ < -SAFE_VELOCITY_CAP:\n      if courier.input_hold_time_before_contact in\
      \ [0.05, 0.25]:\n        courier.trigger_perfect_roll()\n        courier.horizontal_velocity\
      \ += 4.5\n        courier.flow_combo_multiplier += 0.5\n        vfx.spawn_copper_sparks(courier.feet_position)\n\
      \      else:\n        let damage = (abs(courier.vertical_velocity) - SAFE_VELOCITY_CAP)\
      \ * 4.5\n        courier.parcel_integrity -= damage * (1.0 - courier.bag_defense)\n\
      \        courier.horizontal_velocity *= 0.5\n        courier.flow_combo_multiplier\
      \ = 1.0\n        sfx.play_glass_crack()"
  - name: Катапультирующий зацеп за карниз (Ledge Grab & Pop-Up Vault)
    role_in_loop: Механика спасения от фатального падения и сохранения темпа при рискованных
      дальних прыжках
    player_decision: Использовать ли зацеп как аварийный тормоз при недолете, либо
      намеренно целиться в край крыши по низкой пологой траектории, чтобы срезать
      дугу полета и катапультироваться наверх свайпом в тайминг.
    input_mapping: 'Тач: Резкий свайп вверх в зоне триггера карниза (0.25 м от медного
      отлива) / Клавиатура: Клавиша W или Стрелка вверх в момент пересечения карниза.'
    states:
    - AIR_FREE_TRAJECTORY (полет по баллистической траектории над уличным провалом)
    - LEDGE_PROXIMITY_TRIGGER (вход коллайдера рук в зону медного отлива глубиной
      0.8 м)
    - 'PERFECT_VAULT_EJECT (свайп вверх в первые 0.18 с: курьер мгновенно забрасывает
      ноги на крышу и выбрасывает тело вперед со скоростью +6.0 м/с)'
    - 'HANG_STALL_RECOVERY (запоздалый свайп: курьер повисает на руках, карабкается
      0.7 с, полный сброс скорости до 5 м/с)'
    - 'MISS_FALL_DEATH (отсутствие ввода: курьер соскальзывает пальцами с меди и падает
      на мостовую города — Game Over)'
    parameters:
    - name: Окно идеального выброса на карниз (Perfect Pop-Up Window)
      value: 0.18 с
      tuning_note: Если сделать 0.30 с, прыжки над пропастями теряют элемент риска;
        если сделать 0.10 с, зацеп станет невозможным при частоте кадров 30-45 FPS
        на слабых телефонах.
    - name: Импульс катапультирования вперед-вверх (Pop-Up Vault Impulse)
      value: 6.2 м/с
      tuning_note: Если опустить до 3.0 м/с, игрок после зацепа будет врезаться в
        первое же препятствие на краю крыши; если задрать до 9.0 м/с, персонаж перелетит
        всю следующую секцию крыши.
    - name: Зона детекции медного карниза (Ledge Detection Bounds)
      value: 0.85 м
      tuning_note: Откалибровано под габариты персонажа (рост 1.8 м) для визуально
        правдоподобного захвата ладонями за козырек.
    - name: Потеря времени при медленном вытягивании (Hang Stall Time)
      value: 0.75 с
      tuning_note: Достаточно суровое наказание за неидеальный тайминг, ставящее под
        угрозу 3-звездочный золотой таймер контракта.
    feedback_layers:
    - 'Визуал/VFX: Яркая бирюзовая вспышка патинированной меди на кромке желоба, срыв
      капель дождевой воды/пара с карниза, динамическая анимация силового выхода на
      две руки.'
    - 'Звук (Web Audio): Металлический звонкий лязг хвата кожаных перчаток за листовую
      медь, резкий шипящий выдох персонажа, нарастающий свист ветра.'
    - 'Камера (импульс/зум): Резкий кинематографический наклон камеры вниз на 12°
      с акцентом на головокружительную глубину улицы, затем быстрый рывок вверх за
      траекторией подъема курьера.'
    - 'UI/Тактильность: Двойной тактильный импульс (haptic ''heavy-click'' 40 мс при
      хвате + ''light-pulse'' 20 мс при выталкивании), вспышка желтой стрелки вверх
      по центру экрана.'
    failure_mode: 'Игрок не рассчитывает дистанцию и не делает свайп вверх, полагая,
      что долетит на крышу ногами. Сигнал: анимация скольжения пальцев по влажной
      меди, крик курьера, отдаляющаяся крыша и затемнение экрана с надписью ''Срыв
      в переулок''.'
    mastery_curve: Новичок использует зацеп только как паническое спасение при явном
      недолете; эксперт строит спидран-траектории через намеренный низкий зацеп за
      карниз, отменяя высокую параболу прыжка и выстреливая себя вперед на бреющем
      полете.
    counterplay: Обледенелые и разрушенные карнизы на старых мансардах, где эффективное
      окно свайпа сужается до 0.12 с, а также чередование карнизов с торчащими острыми
      громоотводами.
    synergies:
    - 'Синергия с ''Амортизационным перекатом'': идеальный выброс с карниза переводит
      курьера в низкую позицию, готовую к мгновенному перекату на следующем крутом
      скате.'
    - 'Синергия с ''Ветровым балансированием'': возможность зацепиться за опору натяжного
      троса в последний момент при сдувании ветром.'
    why_unique: В большинстве платформеров ledge grab — это автоматическая пауза с
      медленным подтягиванием. Здесь это активный slingshot-механизм (катапульта),
      конвертирующий потенциальное падение в ускорение при наличии молниеносного рефлекса.
    pseudocode: "function check_ledge_grab_tick(courier, ledge_colliders, input_events):\n\
      \  for ledge in ledge_colliders:\n    if ledge.bounds.contains(courier.hands_hitbox)\
      \ and courier.is_falling:\n      if input_events.has_swipe_up():\n        if\
      \ input_events.time_since_trigger <= 0.18:\n          courier.state = STATE_PERFECT_VAULT\n\
      \          courier.apply_impulse(Vector3(6.2, 3.5, 0))\n          vfx.spawn_copper_patina_flash(ledge.position)\n\
      \          return\n        else:\n          courier.state = STATE_HANG_CLIMB\n\
      \          courier.velocity = Vector3(0, 1.2, 0)\n          courier.flow_combo_multiplier\
      \ = 1.0\n          return\n      courier.trigger_fall_death()"
  - name: Скоростной подкат под паровые вытяжки (Slate Slide & Flue Duck)
    role_in_loop: Механика уклонения от горизонтальных препятствий и конвертации уклона
      крыши в ускорение
    player_decision: Скользить ли в подкате минимальное время ровно под трубой, чтобы
      быстрее встать на ноги, либо удерживать подкат на крутом сланцевом уклоне, максимизируя
      гравитационный разгон ценой временной потери прыгучести.
    input_mapping: 'Тач: Свайп вниз с удержанием пальца для продления скольжения /
      Клавиатура: Клавиша S или Стрелка вниз.'
    states:
    - UPRIGHT_RUN (стандартный бег, высота хитбокса 1.85 м)
    - SLIDE_ENTRY (переход в скольжение на коленях за 0.08 с, уменьшение хитбокса
      до 0.60 м)
    - 'SLOPE_ACCELERATION (скольжение по скату > 20°: разгон +3.2 м/с²)'
    - 'FLAT_DECELERATION (скольжение по плоской террасе: торможение -4.0 м/с² после
      0.8 с)'
    - 'OBSTACLE_COLLISION (столкновение головой с трубой: потеря 25 HP посылки, сброс
      скорости до 0, откат назад на 2 м)'
    parameters:
    - name: Высота хитбокса в подкате (Slide Hitbox Height)
      value: 0.60 м
      tuning_note: Если увеличить до 0.85 м, персонаж будет цеплять низкие вентиляционные
        трубы и бельевые веревки; если уменьшить до 0.35 м, анимация скольжения станет
        визуально неправдоподобной (курьер 'лежит пластом').
    - name: Ускорение на наклонном сланце (Slope Gravity Acceleration)
      value: +3.2 м/с²
      tuning_note: Позволяет на длинных скатах разгоняться до предельных 24 м/с, создавая
        мощный всплеск адреналина перед обрывом.
    - name: Минимальная длительность подката (Min Slide Duration)
      value: 0.35 с
      tuning_note: Предотвращает высокочастотный спам подката и заставляет игрока
        осмысленно выбирать момент входа.
    - name: Окно отмены подката в прыжок (Slide-to-Jump Cancel Window)
      value: 0.15 с
      tuning_note: Дает возможность мастерского резкого выпрыгивания из подката прямо
        с края крыши для максимальной дистанции полета.
    feedback_layers:
    - 'Визуал/VFX: Сноп белых и медных искр от наколенников курьера по сланцу, плотный
      шлейф пара из рассекаемых выхлопов вытяжек, разлетающиеся капли сажи.'
    - 'Звук (Web Audio): Скрежет металла по камню и мокрой сланцевой плитке (высокочастотный
      фрикционный шум 4-6 kHz), сопровождаемый резким шипением горячего пара над головой.'
    - 'Камера (импульс/зум): Камера опускается ближе к кровле (с высоты 2.2 м до 0.9
      м), создавая усиленный эффект параллакса и гипертрофированное ощущение скорости
      за счет близости черепицы.'
    - 'UI/Тактильность: Непрерывная низкоамплитудная вибрация на протяжении всего
      скольжения (haptic continuous buzz), мгновенный щелчок при успешном проходе
      под трубой.'
    failure_mode: 'Игрок поздно делает свайп вниз или отпускает его раньше времени:
      голова курьера врезается в чугунную трубу. Сигнал: звонкий металлический бум
      (dull clang), курьер отлетает назад, экран покрывается сажей на 0.5 с, колба
      теряет 25 HP.'
    mastery_curve: Новичок делает подкат за 2 секунды до препятствия на ровной поверхности
      и теряет всю скорость от трения; эксперт входит в подкат на самом гребне крутого
      ската, разгоняется в узком зазоре под трубой и выпрыгивает с края с максимальным
      импульсом.
    counterplay: Двойные трубы с переменным клиренсом (высокая -> низкая) и внезапные
      паровые прорывы из вентиляции, снижающие видимость пространства под трубой.
    synergies:
    - 'Синергия с ''Инерционной гидродинамикой'': при подкате центр тяжести курьера
      снижается, что стабилизирует жидкость в колбе и временно защищает её от боковой
      тряски.'
    - 'Синергия с ''Амортизационным перекатом'': возможность войти в подкат сразу
      из завершающей фазы переката без единого промежуточного шага.'
    why_unique: Подкат здесь не просто кнопка 'проехать под препятствием', а инструмент
      динамического набора скорости за счет гравитации скатов крыш с глубокой механикой
      отмены в прыжок на срезе карниза.
    pseudocode: "function update_slide_tick(courier, ground_angle, input_events, dt):\n\
      \  if courier.is_sliding:\n    if ground_angle > 15.0:\n      courier.horizontal_velocity\
      \ += 3.2 * sin(ground_angle) * dt\n      vfx.emit_sparks_continuous(courier.knees_position)\n\
      \    else:\n      courier.horizontal_velocity -= 4.0 * dt\n    if input_events.has_swipe_up()\
      \ and courier.slide_time >= 0.15:\n      courier.exit_slide_into_super_jump(jump_boost=1.2)\n\
      \      return\n    if courier.check_head_collision():\n      courier.take_impact_damage(25.0)\n\
      \      courier.exit_slide_knockback()"
  - name: Инерционная гидродинамика алхимической колбы (Aetheric Parcel Fluid Inertia)
    role_in_loop: Главный регулятор риска, балансир жадности/осторожности и основа
      экономической оценки забега
    player_decision: Рисковать ли поддержанием предельного темпа 22 м/с на неровном
      ландшафте (где малейшая микро-колебание угрожает кавитацией и взрывом колбы),
      либо сознательно сбросить темп на опасном участке ради гарантированных 100%
      чаевых.
    input_mapping: Пассивно-реактивная механика, управляемая через чистоту выполнения
      всех активных действий (тайминги приземлений, плавность траекторий, отсутствие
      резких вертикальных перегрузок).
    states:
    - STABLE_EQUILIBRIUM (колебания жидкости < 15%, колба светится ровным лазурным
      светом, множитель чаевых 3.0x)
    - TURBULENT_SLOSHING (колебания 15–50%, жидкость пенится от неидеальных приземлений,
      предупреждающее мерцание)
    - CAVITATION_STRESS (колебания > 50%, нарастание давления пара, появление микротрещин
      на стекле, -2 HP/с)
    - 'CRITICAL_FRACTURE (удар силой > 12G: мгновенная потеря 30–50 HP, выплескивание
      светящегося эфира)'
    - 'CATASTROPHIC_BURST (целостность 0 HP: колба детонирует безвредным для курьера
      облаком пара, контракт провален)'
    parameters:
    - name: Запас прочности алхимической колбы (Max Parcel Integrity)
      value: 100.0 ед
      tuning_note: Базовый пул здоровья груза; если сделать 200 ед, ошибки перестанут
        волновать игрока; если сделать 50 ед, ни один мобильный игрок не дойдет до
        финиша.
    - name: Порог критической перегрузки кавитации (Cavitation G-Force Threshold)
      value: 3.8 G
      tuning_note: При превышении вертикального ускорения 3.8G (жесткий удар о крышу
        без амортизации) жидкость бьет по стенкам колбы изнутри.
    - name: Скорость естественного успокоения жидкости (Fluid Stabilization Rate)
      value: 18.0 %/с
      tuning_note: Определяет, как быстро колба возвращается в стабильное состояние
        при плавном беге курьера в ритме Flow.
    - name: Бонусный множитель чаевых за 100% сохранность (Pristine Tip Multiplier)
      value: 3.0x
      tuning_note: Главный экономический стимул для хардкорных игроков и спидраннеров
        стремиться к совершенству исполнения.
    feedback_layers:
    - 'Визуал/VFX: 3D-модель колбы на рюкзаке с анимированным шейдером жидкости (wobble
      shader), меняющей цвет от спокойного лазурного до тревожного оранжево-пурпурного
      при турбулентности; сетка трещин на стекле колбы.'
    - 'Звук (Web Audio): Реалистичный плеск тяжелой жидкости внутри стеклянного сосуда
      (булькающие резонансные обертоны 300–1200 Hz), звонкий нарастающий звон вибрирующего
      хрусталя при кавитации.'
    - 'Камера (импульс/зум): При критическом ударе по колбе — легкая хроматическая
      аберрация по краям экрана и микро-задержка времени (hitstop 45 мс) для осязаемости
      физического удара.'
    - 'UI/Тактильность: Индикатор целостности в виде викторианского барометра/манометра
      в левом верхнем углу; при падении Integrity — серийная тревожная вибрация (3
      коротких импульса по 20 мс).'
    failure_mode: 'Игрок развивает огромную скорость, но совершает подряд 2 жестких
      приземления без амортизации и цепляет карниз. Сигнал: оглушительный взрыв стекла
      за спиной, синий фонтан пара, звук свистка диспетчера и надпись ''Груз уничтожен''.'
    mastery_curve: Новичок постоянно трясет посылку, донося ее с 15–30% HP и получая
      копейки; мастер бежит на предельной скорости 22 м/с, идеально нейтрализуя каждый
      гравитационный импульс и принося колбу в состоянии 100% Pristine.
    counterplay: Процедурные перепады высот крыш с глубокими провалами до 15 метров,
      где неизбежна высокая скорость свободного падения, требующая ювелирного расчета
      времени амортизации.
    synergies:
    - 'Синергия со всеми активными механиками: перекат, подкат и зацеп являются единственными
      инструментами нейтрализации турбулентности жидкости.'
    - 'Синергия с ''Множителем потока (Flow)'': удержание стабильности колбы подпитывает
      шкалу Flow, не давая множителю сгорать на ровных участках.'
    why_unique: Вместо стандартного таймера или статичного HP персонажа, здесь здоровье
      груза является динамической физической переменной, реагирующей на перегрузки
      в реальном времени, превращая раннер в высокоскоростную доставку хрупкого сокровища.
    pseudocode: "function simulate_fluid_dynamics_tick(parcel, courier_accel, dt):\n\
      \  let current_g_force = courier_accel.length() / 9.81\n  if current_g_force\
      \ > CAVITATION_THRESHOLD:\n    parcel.turbulence = clamp(parcel.turbulence +\
      \ (current_g_force - CAVITATION_THRESHOLD) * 25.0 * dt, 0.0, 100.0)\n  else:\n\
      \    parcel.turbulence = max(0.0, parcel.turbulence - STABILIZATION_RATE * dt)\n\
      \  if parcel.turbulence > 75.0:\n    parcel.integrity -= 2.0 * dt\n    vfx.emit_glass_stress_particles(parcel.position)\n\
      \  if parcel.integrity <= 0.0:\n    courier.trigger_delivery_failure(reason='PARCEL_DESTROYED')"
  - name: Ветровой баланс на подвесных бельевых стропах (Skyline Cable-Sprint & Gale
      Balance)
    role_in_loop: Механика скоростных воздушных срезных путей с высоким риском срыва
      от бокового ветра
    player_decision: Свернуть ли на узкий канат между особняками ради срезания 8 секунд
      дистанции и получения бонуса х4 Flow, рискуя быть сдутым порывом ветра, или
      остаться на широкой, но длинной черепичной кровле.
    input_mapping: 'Тач: Микро-свайпы влево/вправо для компенсации крена от бокового
      ветра во время бега по канату / Клавиатура: Клавиши A/D или Стрелки влево/вправо.'
    states:
    - CABLE_MOUNT (запрыгивание на канат, фиксация ног на тросе)
    - SUPER_FLOW_SPRINT (сверхскоростной спринт по тросу со скоростью 20.0 м/с, удвоенный
      набор очков)
    - WIND_GUST_IMPACT (порыв бокового ветра 8.5 м/с, отклоняющий ось баланса курьера)
    - BALANCE_RECOVERY (успешный контр-свайп навстречу ветру, стабилизация положения)
    - 'BLOWN_OFF_FALL (крен превысил 35°: курьер теряет баланс и срывается в пропасть
      переулка)'
    parameters:
    - name: Базовая скорость спринта по канату (Cable Sprint Velocity)
      value: 20.5 м/с
      tuning_note: Дает ощутимое превосходство в скорости над обычным бегом по крыше
        (15.0 м/с), создавая огромную ценность рискованного пути.
    - name: Сила бокового порыва ветра (Crosswind Gust Force)
      value: 8.5 м/с²
      tuning_note: Если увеличить до 14.0 м/с², удержание баланса на тачскрине станет
        слишком хаотичным; если уменьшить до 4.0 м/с², игрок будет пробегать канаты
        не обращая внимания на ветер.
    - name: Критический угол срыва с каната (Max Balance Tilt Angle)
      value: 35.0 градусов
      tuning_note: Пороговый угол наклона торса, после которого физический движок
        сбрасывает персонажа с троса.
    - name: Окно реакции на порыв ветра (Wind Counter-Action Window)
      value: 0.28 с
      tuning_note: Справедливое окно реакции для мобильного игрока при внезапном шквале
        ветра.
    feedback_layers:
    - 'Визуал/VFX: Потоки белого тумана и развевающиеся простыни на бельевых веревках,
      наклон тела курьера с динамическим размахиванием руками для удержания равновесия,
      искры от трения подошв о стальной витой трос.'
    - 'Звук (Web Audio): Нарастающий низкий гул шквального ветра (White noise bandpass
      200-800 Hz), свистящий звон натянутой струны троса под ногами, хлопанье мокрой
      ткани на ветру.'
    - 'Камера (импульс/зум): Динамический крен камеры по оси Roll на угол наклона
      курьера (до ±15°), легкий зум назад для демонстрации высоты над улицей.'
    - 'UI/Тактильность: Нарастающая вибрация смартфона в сторону крена, появление
      дугового индикатора гироскопа над головой персонажа.'
    failure_mode: 'Игрок игнорирует порыв ветра и не делает компенсирующий свайп:
      курьер заваливается на бок и падает с каната. Сигнал: крик, резкий срыв камеры
      вниз, треск лопнувшей веревки, экран Game Over.'
    mastery_curve: Новичок боится заходить на канаты и оббегает их по длинной дуге
      крыш; эксперт целенаправленно ищет канаты, на ходу парируя микро-свайпами порывы
      ветра и сохраняя максимальную скорость 22 м/с.
    counterplay: Внезапные парные порывы ветра переменного направления (слева направо,
      затем справа налево) и болтающиеся на тросе тяжелые викторианские ковры, требующие
      прыжка прямо на канате.
    synergies:
    - 'Синергия с ''Катапультирующим зацепом'': сход с каната часто завершается прыжком
      на дальний карниз, требуя немедленного зацепа.'
    - 'Синергия с ''Инерционной гидродинамикой'': бег по канату очень плавный (нет
      ударов о ступени), что позволяет стабилизировать жидкость в колбе при условии
      удержания баланса.'
    why_unique: Канатные переходы превращают линейный раннер в динамический тест на
      микро-балансировку на головокружительной высоте, вознаграждая смелость максимальной
      прибавкой к таймеру.
    pseudocode: "function update_cable_balance_tick(courier, wind_vector, input_events,\
      \ dt):\n  if courier.is_on_cable:\n    courier.tilt_angle += (wind_vector.x\
      \ * 12.0) * dt\n    if input_events.has_swipe_counter_wind():\n      courier.tilt_angle\
      \ *= 0.2\n      vfx.emit_balance_spark(courier.feet_position)\n    if abs(courier.tilt_angle)\
      \ >= MAX_BALANCE_ANGLE:\n      courier.fall_from_cable_into_abyss()\n      return\n\
      \    courier.horizontal_velocity = CABLE_SPRINT_VELOCITY\n    courier.flow_combo_multiplier\
      \ = min(4.0, courier.flow_combo_multiplier + 0.1 * dt)"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / Micro-Store (Zustand-like zero-dep)
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 65
  max_triangles_or_sprites: 42000
  bundle_size_budget_mb: 3.8
  layers:
  - description: Playgama Bridge SDK, Storage (Cloud/Local), Lifecycle, Resize & Visibility
      handlers
    name: Core / Platform Layer
  - description: Three.js Scene, Third-Person Chase Cam, Custom Shaders (Roof, Sunset,
      God Rays), Postprocessing
    name: Render / Scene Layer
  - description: three-mesh-bvh spatial index, continuous raycasting, kinematic movement
      solver, obstacle triggers
    name: Physics / Collision Layer
  - description: Parcel Integrity Manager, Flow Combo System, Rooftop Procedural Generator,
      Contract Dispatcher
    name: Gameplay Systems Layer
  - description: Web Audio API manager, procedural wind synthesis via AudioWorklet,
      dynamic interactive soundtrack
    name: Audio Layer
  - description: DOM/Canvas lightweight overlays, touch gesture recognizer (One-Thumb),
      responsive safe-area layout
    name: UI / HUD Layer
  modules:
  - name: InputManager
    role: Распознавание жестов свайпа (вверх/вниз/удержание) с адаптивным буфером
      ввода на тач-экранах и клавиш стрелок на ПК
  - name: RooftopBuilder
    role: Генерация и пулинг чанков крыш через Three.js InstancedMesh для черепицы,
      дымоходов и мансардных окон
  - name: CharacterController
    role: Кинематическое движение курьера, переходы анимаций (бег, прыжок, подкат,
      амортизация, зацеп)
  - name: ParcelSystem
    role: Мониторинг физических перегрузок груза, расчет целостности и процедурная
      визуализация трещин на 3D-модели
  - name: FlowEngine
    role: Менеджмент множителя скорости x1..x4, управление пост-эффектами скорости,
      FOV камеры и динамическим саундтреком
  - name: PlaygamaBridgeAdapter
    role: Интеграция рекламы за вознаграждение, межстраничных баннеров, лидербордов
      и сохранений Yandex/VK
monetization:
  strategy_summary: 'Честная и органичная гибридная модель: добровольный просмотр
    Rewarded Ads для страховки хрупкого груза и удвоения чаевых, мягкие редкие Interstitial
    между сериями контрактов (не чаще раза в 120 с) и микротранзакции на эксклюзивные
    косметические плащи и стили посылок.'
  rewarded_placements:
  - id: courier_insurance
    name: Страховка Гильдии (Второе дыхание)
    benefit: Мгновенное восстановление разбитой посылки до 100% целостности и продолжение
      текущего забега с сохранением прогресса
    cooldown_or_limit: 1 раз за контракт
    trigger_moment: Экран аварии при разрушении груза
  - id: double_tips
    name: Королевские чаевые x2
    benefit: Удвоение заработанных за доставку шиллингов и очков репутации гильдии
    cooldown_or_limit: Неограниченно при успешной доставке
    trigger_moment: Экран победы и расчета контракта
  - id: master_gear_trial
    name: Проба элитной сумки
    benefit: Временная аренда сумки мастера с повышенным демпфированием на 3 следующих
      забега
    cooldown_or_limit: 1 раз в 15 минут
    trigger_moment: Экран мастерской перед сложным контрактом
  interstitial_placements:
  - trigger_event: Возврат на карту города после завершения серии из 3 контрактов
    cooldown_seconds: 120
    conditions: Показывается только между контрактами в меню, никогда не прерывает
      активный геймплей забега
  in_app_purchases:
  - sku: pack_royal_courier
    name: Набор Королевского Гонца
    description: Золотой плащ с частицами искр, инкрустированная колба посылки и 5000
      шиллингов
    price_tier: Tier 2 ($1.99 / 149 руб)
    reward: Эксклюзивный скин 'Королевский шелк' + 5000 валюты
  - sku: pack_no_ads
    name: Патент Почетного Гражданина
    description: Полное отключение межстраничной рекламы навсегда + постоянный пассивный
      бонус +15% к чаевым
    price_tier: Tier 3 ($2.99 / 249 руб)
    reward: Отключение Interstitial рекламы + 15% бонус монет
  fairness_rules:
  - 'Никаких пейволлов: все районы города и базовые элементы экипировки открываются
    исключительно за игровое мастерство и валюту'
  - Реклама за вознаграждение всегда добровольна и дает четкую мгновенную ценность
  - Межстраничная реклама строго заблокирована во время забега и имеет кулдаун не
    менее 120 секунд
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - telegram
  - crazy_games
  - game_distribution
  - standalone_web
  initialization_flow:
  - 1. Загрузка легковесного сплэш-скрина и вызов bridge.init()
  - 2. Параллельная инициализация Three.js контекста и загрузка текстурных атласов
  - 3. Получение данных игрока и облачных сохранений через bridge.storage.get()
  - 4. Инициализация звукового контекста Web Audio по первому тапу пользователя
  - 5. Проверка готовности рекламных провайдеров bridge.advertisement.checkAdBlock()
  - 6. Запуск главного меню с интерактивной панорамой заката старого города
  cloud_save_keys:
  - courier_rank
  - total_shillings
  - unlocked_districts
  - inventory_bags
  - inventory_boots
  - high_scores_by_district
  - settings_sound_fx
  - settings_music
  leaderboards:
  - best_delivery_time_royal_district
  - max_flow_combo_streak
  - total_parcels_delivered_intact
  ads_integration:
    banner: bridge.advertisement.showBanner() в безопасной зоне меню без перекрытия
      кнопок навигации
    interstitial: bridge.advertisement.showInterstitial() с проверкой кулдауна и фоновой
      паузой аудио/таймера
    rewarded: bridge.advertisement.showRewardedVideo() с обработкой 'rewarded' и 'closed'
      коллбэков
  lifecycle_hooks:
  - 'visibilitychange: мгновенная пауза физического цикла и приглушение Web Audio
    при сворачивании вкладки'
  - 'resize: пересчет пропорций камеры (Aspect Ratio) и безопасных зон мобильного
    экрана (SafeArea)'
  - 'error: логгирование сбоев инициализации WebGL с переключением на fallback-рендерер
    без теней'
art:
  style_name: Стилизованный викторианский стимпанк с теплым золотым освещением (Golden
    Hour Steampunk Realism Lite)
  camera_perspective: Third-Person Chase Cam (вид сзади-сверху из-за правого плеча
    на высоте 2.2м, дистанция 3.8м с динамическим отдалением при ускорении)
  camera_fov: 55
  camera_pitch_angle: 18
  environment_theme: 'Крыши европейского старого города XIX века на закате: рельефная
    терракотовая и сине-серая сланцевая черепица, медные трубы с зеленым налетом патины,
    кованые флюгеры, кирпичные дымоходы, развевающееся белье на веревках, сизый дымок
    из труб и золотисто-розовый закатный горизонт'
  character_proportions: 'Стилизованные полуреалистичные пропорции атлетичного курьера:
    динамичный развевающийся твидовый плащ, кожаные наручи и перчатки, плотный рюкзак
    с неоновым контейнером для посылки на груди'
  lighting_setup: 'Низкое закатное направленное солнце (Directional Light, теплый
    золотисто-янтарный цвет #FFA447, угол 25° к горизонту) + холодный небесный эмбиент
    (#394867) для глубоких синих теней в переулках + точечный свет от светящейся колбы
    (#4DEEEA)'
  color_palette:
    alley_shadow: '#1A1A2E'
    golden_sunset: '#F39C12'
    parcel_glow_danger: '#FF0054'
    parcel_glow_safe: '#00F5D4'
    patina_copper: '#48A9A6'
    slate_blue: '#2C3E50'
    terracotta_roof: '#C85A32'
    ui_accent_gold: '#FFD166'
    ui_parchment: '#FDF6E2'
  vfx_list:
  - Огненно-золотые трейлы ветра за спиной и плащом курьера при Flow x3..x4
  - Веер терракотовой пыли и искр из-под сапог при скольжении и идеальной амортизации
  - Неоновые трещины и вспышки на колбе посылки при получении повреждений
  - Объемный золотистый закатный туман (God Rays) между трубами и крышами
