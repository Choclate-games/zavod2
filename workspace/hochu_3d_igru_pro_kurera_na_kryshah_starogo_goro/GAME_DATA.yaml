    \  |\n|  |             |                                         |        |  |\n\
    |  |             v                                         v        |  |\n|  |\
    \   [ПОТЕРЯ ТЕМПА / СТОП FLOW]              [АМОРТИЗАЦИЯ ПРИЗЕМЛЕНИЯ] |\n|  |\
    \             |                             (Перекат, +4.5 м/с,  |  |\n|  |  \
    \           |                              100% Integrity,     |  |\n|  |    \
