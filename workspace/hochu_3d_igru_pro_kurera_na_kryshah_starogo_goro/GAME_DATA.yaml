raw_prompt: "Хочу 3D-игру про курьера на крышах старого города. Игрок бежит по кровле,\
  \ \nперепрыгивает провалы между домами, подкатом уходит под трубы и вентиляцию,\
  \ \nхватается за карнизы и подтягивается. Задача — донести посылку до адресата \n\
  за отведённое время, не уронив и не разбив её. Маршрут каждый раз новый, \nгород\
  \ собирается из кусков. Внизу улица с людьми — туда падать нельзя. \nЧем чище прошёл\
  \ (без остановок, без задетых препятствий), тем выше оплата \nи тем сложнее следующий\
  \ заказ. Играется одной рукой на телефоне."
title: 'Черепичный Спринт: Чистый Флоу'
slug: hochu_3d_igru_pro_kurera_na_kryshah_starogo_goro
genre: 3D Паркур-Раннер / Спидран-Аркада
subgenre: Флоу-Раннер / Тайминг-Платформер с Физикой Инерции Груза
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Mobile Web)
orientation: portrait
target_audience: Игроки мобильных веб-платформ (16–35 лет), ценящие ритмичные раннеры,
  состояние потока (flow state), паркур и тайм-атаку, с короткими игровыми сессиями
  по 1–2 минуты и мгновенным управлением одним пальцем.
core_loop: Получение курьерского контракта на доставку хрупкой посылки -> Скоростной
  паркур-забег по процедурным крышам с таймингом прыжков, подкатов и амортизации приземлений
  -> Доставка груза на балкон заказчика -> Подсчет гонорара и чаевых за скорость и
  сохранность (Flow Multiplier & Integrity) -> Кастомизация снаряжения (сумки с амортизацией,
  нескользящая обувь) и открытие новых сложных районов города.
hook: 'Секунда затяжного прыжка над 10-метровым разрывом между особняками на закате:
  игрок зажимает палец в воздухе, курьер группируется, идеально амортизирует приземление
  на крутой черепичный скат, сохраняя 100% целостности алхимической колбы и удерживая
  комбо-множитель скорости х4.'
player_fantasy: Ты — виртуозный руфер-курьер в викторианском городе эпохи пара и золотого
  часа, скользящий по скатам крыш на головокружительной высоте, спасающий драгоценные
  хрупкие посылки за счет безупречной грации и молниеносной реакции.
session_model: Срочный курьерский контракт длительностью 45–75 секунд на дистанцию
  350–700 метров по процедурно сгенерированным крышам с 1–2 развилками риска и моментальным
  финальным расчетом наград.
unique_value_proposition: Паркур-раннер без искусственных полос и виртуальных кнопок,
  где ключевым навыком является управление инерцией и активная амортизация приземлений
  для спасения хрупкого груза, дающая чистый кайф непрерывного потока.
vision: Превратить мобильный веб-раннер в тактильное кинематографичное приключение
  с плотным паркур-ритмом, отзывчивым управлением одним пальцем и живой эстетикой
  старого европейского города на закате.
elevator_pitch: '«Черепичный Спринт: Чистый Флоу» — это адреналиновый 3D-раннер от
  третьего лица для одного пальца. Мчись по крышам старого города, прыгай через пропасти,
  скользи под вентиляцией и амортизируй приземления, чтобы донести хрупкую посылку
  в целости и сорвать рекордный куш чаевых.'
win_conditions: Успешная доставка посылки на целевой балкон адресата за время таймера
  (менее 60 секунд) с сохранением целостности груза > 0% (идеально 100% для 3 звезд
  и максимальных чаевых).
lose_conditions: Срыв в переулок к пешеходам (падение с крыши), полное разрушение
  груза (целостность 0% от неотринутых ударов о трубы) или истечение лимита времени
  контракта (0.0 сек).
progression_summary: Завершение контрактов приносит шиллинги и репутацию гильдии курьеров
  -> открытие 5 новых районов города (Торговый квартал, Мансарды знати, Алхимический
  сектор, Доки, Королевский Холм) -> покупка специализированных сумок (с демпфированием
  ударов) и обуви (увеличенное окно зацепа за карниз) -> выполнение элитных контрактов
  с повышенной наградой.
difficulty_curve: 'Динамическая кривая внутри контракта: 0–15 с — обучение ритму,
  пологие крыши, широкие окна тайминга прыжка (0.35 с); 15–40 с — сужение опорных
  карнизов, появление низких вентиляционных труб (подкат) и скользких сланцевых скатов;
  40–75 с — разрывы между домами до 10 метров, бельевые веревки, перепады высот и
  сжатие окон амортизации до 0.15 с при максимальной скорости бега.'
