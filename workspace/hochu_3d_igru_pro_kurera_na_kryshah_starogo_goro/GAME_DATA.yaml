  2.2м, дистанция 3.8м с динамическим отдалением при ускорении). Environment: Крыши
  европейского старого города XIX века на закате: рельефная терракотовая и сине-серая
  сланцевая черепица, медные трубы с зеленым налетом патины, кованые флюгеры, кирпичные
  дымоходы, развевающееся белье на веревках, сизый дымок из труб и золотисто-розовый
  закатный горизонт. Central Action: Секунда затяжного прыжка над 10-метровым разрывом
  между особняками на закате: игрок зажимает палец в воздухе, курьер группируется,
  идеально амортизирует приземление на крутой черепичный скат, сохраняя 100% целостности
  алхимической колбы и удерживая комбо-множитель скорости х4. — the moment is caught
  mid-action, with clear cause and effect readable in a single frame. Visible in-game
  HUD overlay: Шкала целостности посылки (Parcel Integrity Gauge) в левом верхнем
  углу: полукруглая колба с процентами (100% -> 0%) и цветовой индикацией, Таймер
  контракта в верхнем центре: изящные латунные часы с обратным отсчетом (00:45.0),
  Множитель темпа (Flow Multiplier) в правом верхнем углу: динамический бейдж с эффектом
  огня (x1.0..x4.0), Индикатор расстояния до адресата внизу: миниатюрный прогресс-бар
  с иконкой курьера и финишного балкона; touch controls at the bottom corners. Lighting:
  Низкое закатное направленное солнце (Directional Light, теплый золотисто-янтарный
  цвет #FFA447, угол 25° к горизонту) + холодный небесный эмбиент (#394867) для глубоких
  синих теней в переулках + точечный свет от светящейся колбы (#4DEEEA). Color palette:
