    свайпа (минимальный порог 35px для исключения случайных дрожаний) и мгновенным
    откликом на touchstart/touchend без задержки 300ms.
  safe_area_handling: Использование CSS env(safe-area-inset-top) и env(safe-area-inset-bottom)
    для отступов HUD элементов от вырезов экрана и системной полосы жестов.
  performance_throttling:
  - Динамическое масштабирование разрешения рендера (DPI Scale 1.0 на Retina/QHD экранах
    с падением до 0.85 при просадке FPS ниже 55)
  - Отключение теней в реальном времени на мобильных GPU среднего и бюджетного уровня
    (использование запеченного градиента и простых круглых теней под ногами)
  - Лимит на количество частиц в пуле VFX (максимум 200 одновременных частиц)
  - Автоматическое усыпление физических триггеров за пределами 30 метров от камеры
