_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: hochu_3d_igru_pro_kurera_na_kryshah_starogo_goro
performance:
  target_fps: 60
  max_draw_calls: 65
  max_triangles: 42000
  bundle_size_budget_mb: 3.8
session:
  model: Срочный курьерский контракт длительностью 45–75 секунд на дистанцию 350–700
    метров по процедурно сгенерированным крышам с 1–2 развилками риска и моментальным
    финальным расчетом наград.
  win: Успешная доставка посылки на целевой балкон адресата за время таймера (менее
    60 секунд) с сохранением целостности груза > 0% (идеально 100% для 3 звезд и максимальных
    чаевых).
  lose: Срыв в переулок к пешеходам (падение с крыши), полное разрушение груза (целостность
    0% от неотринутых ударов о трубы) или истечение лимита времени контракта (0.0
    сек).
  difficulty_curve: 'Динамическая кривая внутри контракта: 0–15 с — обучение ритму,
    пологие крыши, широкие окна тайминга прыжка (0.35 с); 15–40 с — сужение опорных
    карнизов, появление низких вентиляционных труб (подкат) и скользких сланцевых
    скатов; 40–75 с — разрывы между домами до 10 метров, бельевые веревки, перепады
    высот и сжатие окон амортизации до 0.15 с при максимальной скорости бега.'
mechanics:
  amortizatsionnyy_perekat_po_cherepitse_cushion_rol:
    name: Амортизационный перекат по черепице (Cushion Roll & Kinetic Transfer)
    parameters:
      okno_idealnogo_zazhatiya_amortizatsii_perfect_cush:
        value: 0.22 с
        note: Если увеличить до 0.40 с, игра превращается в однокнопочный раннер без
          чувства мастерства; если уменьшить до 0.12 с, игроки на тачскринах с задержкой
          ввода 60 Гц будут постоянно разбивать колбу.
      bust_gorizontalnoy_skorosti_pri_idealnom_perekate_:
        value: +4.5 м/с
        note: При значении ниже +2.0 м/с игрок не чувствует эйфории от сохранения
          кинетического потока; при значении выше +7.0 м/с камера не успевает за курьером
          и следующий скат оказывается за границей экрана.
      bazovyy_porog_opasnoy_vertikalnoy_skorosti_safe_fa:
        value: 7.5 м/с
        note: Если поднять до 12.0 м/с, механика переката обесценится на малых высотах;
          если опустить до 4.0 м/с, курьер будет получать урон даже от микро-прыжков.
      shtraf_k_tselostnosti_kolby_pri_propuske_amortizat:
        value: 30.0 ед
        note: Значение откалибровано ровно на 3 грубые ошибки за забег (100 HP / 30
          = 3 жизни), что держит игрока в постоянном тонусе.
  katapultiruyuschiy_zatsep_za_karniz_ledge_grab_pop:
    name: Катапультирующий зацеп за карниз (Ledge Grab & Pop-Up Vault)
    parameters:
      okno_idealnogo_vybrosa_na_karniz_perfect_pop_up_wi:
        value: 0.18 с
        note: Если сделать 0.30 с, прыжки над пропастями теряют элемент риска; если
          сделать 0.10 с, зацеп станет невозможным при частоте кадров 30-45 FPS на
          слабых телефонах.
      impuls_katapultirovaniya_vpered_vverh_pop_up_vault:
        value: 6.2 м/с
        note: Если опустить до 3.0 м/с, игрок после зацепа будет врезаться в первое
          же препятствие на краю крыши; если задрать до 9.0 м/с, персонаж перелетит
          всю следующую секцию крыши.
      zona_detektsii_mednogo_karniza_ledge_detection_bou:
        value: 0.85 м
        note: Откалибровано под габариты персонажа (рост 1.8 м) для визуально правдоподобного
          захвата ладонями за козырек.
      poterya_vremeni_pri_medlennom_vytyagivanii_hang_st:
        value: 0.75 с
        note: Достаточно суровое наказание за неидеальный тайминг, ставящее под угрозу
          3-звездочный золотой таймер контракта.
  skorostnoy_podkat_pod_parovye_vytyazhki_slate_slid:
    name: Скоростной подкат под паровые вытяжки (Slate Slide & Flue Duck)
    parameters:
      vysota_hitboksa_v_podkate_slide_hitbox_height:
        value: 0.60 м
        note: Если увеличить до 0.85 м, персонаж будет цеплять низкие вентиляционные
          трубы и бельевые веревки; если уменьшить до 0.35 м, анимация скольжения
          станет визуально неправдоподобной (курьер 'лежит пластом').
      uskorenie_na_naklonnom_slantse_slope_gravity_accel:
        value: +3.2 м/с²
        note: Позволяет на длинных скатах разгоняться до предельных 24 м/с, создавая
          мощный всплеск адреналина перед обрывом.
      minimalnaya_dlitelnost_podkata_min_slide_duration:
        value: 0.35 с
        note: Предотвращает высокочастотный спам подката и заставляет игрока осмысленно
          выбирать момент входа.
      okno_otmeny_podkata_v_pryzhok_slide_to_jump_cancel:
        value: 0.15 с
        note: Дает возможность мастерского резкого выпрыгивания из подката прямо с
          края крыши для максимальной дистанции полета.
  inertsionnaya_gidrodinamika_alhimicheskoy_kolby_ae:
    name: Инерционная гидродинамика алхимической колбы (Aetheric Parcel Fluid Inertia)
    parameters:
      zapas_prochnosti_alhimicheskoy_kolby_max_parcel_in:
        value: 100.0 ед
        note: Базовый пул здоровья груза; если сделать 200 ед, ошибки перестанут волновать
          игрока; если сделать 50 ед, ни один мобильный игрок не дойдет до финиша.
      porog_kriticheskoy_peregruzki_kavitatsii_cavitatio:
        value: 3.8 G
        note: При превышении вертикального ускорения 3.8G (жесткий удар о крышу без
          амортизации) жидкость бьет по стенкам колбы изнутри.
      skorost_estestvennogo_uspokoeniya_zhidkosti_fluid_:
        value: 18.0 %/с
        note: Определяет, как быстро колба возвращается в стабильное состояние при
          плавном беге курьера в ритме Flow.
      bonusnyy_mnozhitel_chaevyh_za_100_sohrannost_prist:
        value: 3.0x
        note: Главный экономический стимул для хардкорных игроков и спидраннеров стремиться
          к совершенству исполнения.
  vetrovoy_balans_na_podvesnyh_belevyh_stropah_skyli:
    name: Ветровой баланс на подвесных бельевых стропах (Skyline Cable-Sprint & Gale
      Balance)
    parameters:
      bazovaya_skorost_sprinta_po_kanatu_cable_sprint_ve:
        value: 20.5 м/с
        note: Дает ощутимое превосходство в скорости над обычным бегом по крыше (15.0
          м/с), создавая огромную ценность рискованного пути.
      sila_bokovogo_poryva_vetra_crosswind_gust_force:
        value: 8.5 м/с²
        note: Если увеличить до 14.0 м/с², удержание баланса на тачскрине станет слишком
          хаотичным; если уменьшить до 4.0 м/с², игрок будет пробегать канаты не обращая
          внимания на ветер.
      kriticheskiy_ugol_sryva_s_kanata_max_balance_tilt_:
        value: 35.0 градусов
        note: Пороговый угол наклона торса, после которого физический движок сбрасывает
          персонажа с троса.
      okno_reaktsii_na_poryv_vetra_wind_counter_action_w:
        value: 0.28 с
        note: Справедливое окно реакции для мобильного игрока при внезапном шквале
          ветра.
