gameplay_systems:
- name: Система Перемещения и Физического Контроля
  purpose: Обеспечить четкое и отзывчивое управление с учетом инерции и столкновений.
  input: Плавающий виртуальный джойстик (мобильные) или WASD/Стрелки (ПК).
  rules:
  - Скорость масштабируется параметрами маневренности и массы.
  - Коллизии с препятствиями рассчитываются через физический движок с упругим отскоком.
  - При потере управления включается автоматическая стабилизация.
  state:
  - IDLE
  - MOVING
  - DRIFTING
  - IMPACT
  - RECOVERING
  interactions: Взаимодействует с физическими телами врагов, препятствиями и дропами
    наград.
  feedback: Следы на поверхности, частицы пыли, звуки мотора/шагов, динамический наклон
    камеры.
  edge_cases:
  - При застревании в геометрии объект мягко телепортируется в ближайшую свободную
    точку.
- name: Боевая Система и Расчет Урона
  purpose: Обработка ударов, тарана, хитбоксов, расчета брони и эффектов отдачи.
  input: Кнопки атаки, нитро, спец-способностей.
  rules:
  - Итоговый Урон = (БазовыйУрон * ФакторСкорости + БонусСилы) * (1 - СнижениеБроней).
  - Критические удары наносят 2.0x урона при атаке в уязвимые зоны.
  - Тяжелые попадания вызывают 40мс хит-стоп замедление времени.
  state:
  - READY
  - ATTACKING
  - HITSTOP
  - COOLDOWN
  interactions: Триггеры коллизий проверяют пересечения с хитбоксами противников.
  feedback: Заморозка кадра (40мс), фонтан искр/частиц, всплывающие цифры урона.
  edge_cases:
  - Одновременные встречные удары вызывают взаимное физическое отталкивание.
core_design:
  signature_moment: 'Игрок на полном ходу с ноги выбивает тяжелую бронедверь отсека:
    слетевшая с петель створка впечатывает пулеметчика в стену, выбивая у него в воздух
    раскаленный пулемет. Включается 0.8-секундный адреналиновый bullet-time: игрок
    на лету перехватывает пулемет, разряжает очередь в двух парящих штурмовиков, после
    чего пинком отправляет летящую навстречу взрывную бочку в толпу подкрепления,
    вызывая огненный цепной взрыв и звон комбо-ранга SSS.'
  genre_template_rejected: Отвергаем шаблон 'пассивного автошутера/рогалика с зачисткой
    открытых пустых арен и выбором скучных карточек +15% урона от пуль'. В нашем FPS
    урон и победа рождаются не из сухих DPS-статов, а из геометрии комнат, кинетических
    ragdoll-столкновений и агрессивного ближнего контакта, где пинок — главный инструмент
    контроля толпы, добычи ресурсов и запуска цепных реакций.
  what_makes_it_different: 'Вместо пассивного кайтинга врагов по кругу игра принуждает
    к агрессивному рашу вперед: дефицит патронов вынуждает регулярно сближаться для
    пинка, а любая туша врага, бочка или выбитая дверь становятся смертоносным метательным
    снарядом, экономящим боеприпасы.'
  micro_loop:
  - step: Рывок на ударную дистанцию
    player_action: Спринт и сближение с противником на расстояние менее 2.2 м
    game_response: Динамический сдвиг FOV с 85° до 95°, свист рассекаемого воздуха,
      подсветка контура цели желтым маркером кинетического захвата
    decision: Пнуть цель в глухую стену для мгновенного стана или запустить в толпу
      для кегельбана?
    duration: 0.35 с
  - step: Кинетический удар берцем
    player_action: Нажатие клавиши пинка (ПКМ / E / экранная кнопка)
    game_response: Анимация резкого удара ногой, хит-стоп замирание на 0.06 с, импульсный
      толчок камеры назад на 0.25 м, ragdoll-полет туши врага со скоростью 17.5 м/с
    decision: Сделать выстрел вдогонку по летящей мишени или уклониться от ответного
      огня с фланга?
    duration: 0.2 с
  - step: Воздушный жонгляж / Выстрел
    player_action: Прицельный выстрел из дробовика/пистолета по находящемуся в воздухе
      врагу
    game_response: Звуковой триггер звонкого щелчка Skeet-крита (урон x2.5), вспышка
      искр, выброс дополнительного боекомплекта из тела
    decision: Поймать выбитое оружие в воздухе или добить следующую цель бочкой?
    duration: 0.45 с
  - step: Каскадная детонация и сбор ресурсов
    player_action: Пинок взрывного баллона в точку приземления тел
    game_response: Глухой удар металла о металл, детонация с радиусом 4.2 м, сбор
      выпавших сфер био-плазмы
    decision: Двигаться к следующей штурмовой двери или перезарядить основной ствол?
    duration: 0.6 с
  meso_loop:
  - step: Штурмовой прорыв отсека (Breach)
    player_action: Силовой пинок во входную дверь новой комнаты
    game_response: Дверь срывается с петель и сбивает авангард, активируется bullet-time
      замедление (time_scale 0.25 на 0.8 с)
    decision: 'Кого устранить в первую очередь: снайпера на высоте или тяжелого щитовика?'
    duration: 1.2 с
  - step: Тактическая зачистка арены
    player_action: Уничтожение 6-10 врагов комбинированием пинков, рикошетов и стрельбы
    game_response: Рост комбо-множителя (C -> B -> A -> S -> SSS), сопровождаемый
      нарастанием бас-партии динамического саундтрека
    decision: Рисковать ради поддержания комбо-таймера или занять безопасную позицию
      за колонной?
    duration: 10-15 с
  - step: Выбор тактического био-чипа
    player_action: Выбор 1 из 3 синергетических модификаторов на терминале отсека
    game_response: Мгновенное применение эффекта (например, 'Электро-шипы на подошве'
      или 'Взрывные рикошеты туш')
    decision: Усилить физику пинка, повысить боезапас оружия или взять лечение при
      сминании врагов о стены?
    duration: 3-5 с
  macro_loop:
  - step: Забег по сектору (10-12 отсеков)
    player_action: Последовательное прохождение цепочки штурмовых комнат и битва с
      финальным экзо-боссом
    game_response: 'Постепенное усложнение условий: появление шипов на стенах, лазеров,
      щитовиков с анти-кик защитой'
    decision: Выбрать маршрут через оружейный склад (много патронов) или химлабораторию
      (много взрывных бочек)?
    duration: 5-7 мин
  - step: Фиксация результатов и добычи
    player_action: Завершение забега (победа над боссом сектора или гибель от полученного
      урона)
    game_response: 'Экран статистики: подсчет отправленных в полет тел, выбитых дверей,
      стиля комбо и начисление био-плазмы'
    decision: Какие постоянные узлы экзоскелета прокачать в мастерской перед следующим
      спуском?
    duration: 30 с
  - step: Мета-модернизация в мастерской
    player_action: Трата био-плазмы на перманентные апгрейды экзо-ботинок, арсенала
      и адреналиновых желез
    game_response: Разблокировка новых стартовых стволов (помповый отбойник, гвоздомет),
      усиление базового импульса
    decision: Инвестировать в силу кинетического удара (+15% к импульсу) или в магнитный
      захват выбитого оружия?
    duration: 40 с
  loop_diagram: "+---------------------------------------------------+\n|        \
    \    ВХОД В ОТСЕК / BREACH KICK            |\n|     (Вынос двери с ноги + Bullet-Time\
    \ 0.8 с)      |\n+-------------------------+-------------------------+\n     \
    \                     |\n                          v\n+---------------------------------------------------+\n\
    |                 ОЦЕНКА ДИСТАНЦИИ                  |\n|    Патроны есть?    \
    \               Патронов мало? |\n+------------+------------------------------+-------+\n\
    \             |                              |\n             v               \
    \               v\n+-----------------------+     +---------------------+\n|  ПРИЦЕЛЬНЫЙ\
    \ ВЫСТРЕЛ   |     | КИНЕТИЧЕСКИЙ ПИНОК  |\n| (Снятие брони / стан) |     |  (Полет\
    \ туши 17 м/с)|\n+------------+----------+     +----------+----------+\n     \
