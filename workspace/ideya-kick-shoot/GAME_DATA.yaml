    |       КАСКАДНЫЙ ЭФФЕКТ / ВОЗДУШНЫЙ ЖОНГЛЯЖ        |\n| (Удар о стену 300% /\
    \ Боулинг в бочку / Skeet-крит)|\n+--------------------------+------------------------+\n\
    \                           |\n                           v\n+---------------------------------------------------+\n\
    |     ВЫПАДЕНИЕ ПАТРОНОВ + РОСТ КОМБО-РАНГА (SSS)   |\n+--------------------------+------------------------+\n\
