    восторженный голосовой возглас протагониста.; Камера: Быстрый микро-доворот взгляда
    (Snapping на 10%) в сторону летящего оружия при нажатии кнопки подбора.; UI/Тактильность:
    Значок нового оружия всплывает по центру экрана с мигающим счетчиком патронов,
    резкий тактильный импульс (35 мс).'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Штурмовой вышиб дверей с адреналиновым фокусом (Breach Kick & Adrenaline Slow-Mo)
  category: Инициатор боевой ситуации, тактический переключатель комнат
  priority: secondary
  description: Превращает банальную загрузку/переход между комнатами в кульминационную
