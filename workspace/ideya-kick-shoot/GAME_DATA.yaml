  player_interaction: Прицельный пинок в правое плечо/руку + Клавиша 'F' / Автозахват
    при приближении
  feedback: 'Визуал/VFX: Золотистый силуэтный трейл за летящим в воздухе оружием,
    замедленное вращение ствола, вспышка в руках при успешном перехвате.; Звук (Web
