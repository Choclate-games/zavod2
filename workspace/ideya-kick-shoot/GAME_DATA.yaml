raw_prompt: 'Идея: Kick & Shoot


  Аркадный FPS с упором на пинки, оружие и физику. Игрок проходит короткие уровни,
  стреляя во врагов и используя мощный пинок: отправляет противников в стены, сталкивает
  их друг с другом, выбивает оружие и выбивает двери.


  Оружие разное: дробовик, пистолет, автомат, гранатомёт. Пинок помогает экономить
  патроны и создавать комбинации.


  Главная фишка: стрельба + физический пинок + интерактивное окружение.


  Например: выстрел → враг падает → пинок → отлетает в бочку → взрыв → несколько врагов
  получают урон.


  Между уровнями — улучшение оружия, силы пинка и открытие новых способностей.

  уровеней 50-100'
title: 'Идея: kick & shoot'
