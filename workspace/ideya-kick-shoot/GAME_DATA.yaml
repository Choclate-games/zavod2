mechanics:
- name: Кинетический тактический пинок (Kinetic Spartan Kick)
  category: Двигатель темпа и главный инструмент контроля дистанции/ресурсов
  priority: core
  description: В отличие от стандартного ножа/мили-удара в FPS, пинок перемещает физическое
    тело в пространстве с сохранением вектора и превращает самого врага в разрушительный
    снаряд.
  player_interaction: ПКМ / Клавиша 'E' / Тап по большой кнопке ноги справа внизу
    экрана
  feedback: 'Визуал/VFX: Появление полупрозрачного конуса сжатого воздуха shockwave,
    частицы пыли и искр из-под подошвы, мгновенный ragdoll врага с инерционным разворотом
    суставов.; Звук (Web Audio): Низкочастотный саб-басовый панч (60 Гц) в момент
    касания, хлесткий металлический щелчок сервопривода экзоскелета, свистящий звук
    рассекаемого воздуха.; Камера: Мгновенный толчок камеры назад на 0.2 м с возвратом
    за 0.15 с, угловой шейк 2.5 градуса по оси Pitch.; UI/Тактильность: Короткий вибрационный
    импульс на мобильных устройствах (45 мс), дуговой радиальный индикатор отката
    вокруг перекрестья прицела.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Воздушный жонгляж и экзекуция (Air-Skeet Juggling)
  category: Источник высокой награды, урона и стиля за меткость
  priority: secondary
  description: 'Объединяет механику стендовой стрельбы по тарелочкам (Skeet shooting)
    с аркадным FPS: игрок сам создает себе летящие мишени собственным пинком.'
  player_interaction: ЛКМ / Удержание кнопки огня / Тап по кнопке 'Выстрел'
  feedback: 'Визуал/VFX: Яркая радиальная вспышка золотисто-оранжевого цвета при попадании
    в воздухе, разлетающиеся гильзы и искры, текст ''SKEET CRIT!'' всплывает над целью.;
    Звук (Web Audio): Высокий хрустальный звук ''дзынь'' колокольчика поверх мощного
    выстрела дробовика, ускоряющийся темп музыкального сэмпла.; Камера: Микро-зум
    FOV (на 3 градуса ближе на 0.08 с) в момент результативного попадания по парящей
    мишени.; UI/Тактильность: Визуальное разрастание перекрестья прицела с красным
    индикатором ''CRITICAL HIT'', двойной тактильный тик (20 мс + 20 мс).'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Каскадный снос окружения 'Кегельбан' (Domino Bowling Collisions)
  category: Источник массового AoE-урона и цепных реакций
  priority: secondary
  description: 'Превращает врагов из источников угрозы в бесплатные боеприпасы: чем
    плотнее стоит группа противников, тем быстрее и зрелищнее они уничтожают друг
