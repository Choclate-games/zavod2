    |             ВЫБОР БИО-ЧИПА И СЛЕДУЮЩИЙ ОТСЕК      |\n+---------------------------------------------------+"
  tension_curve: 'Пилообразная кривая с 4 фазами на каждый отсек: 1. Фаза прорыва
    (Spike: 95%) — взрывной вынос двери ногой, всплеск адреналина в замедлении времени;
    2. Фаза кинетического хаоса (Plateau: 80-90%) — непрерывный бег, серия пинков,
    жонглирование в воздухе и уклонение от снарядов; 3. Фаза добивания (Decrescendo:
    40%) — ликвидация единичных оглушенных противников и сбор патронов; 4. Фаза передышки
    (Rest: 10%) — выбор перка на консоли, оценка билда и подготовка к следующей двери.'
  core_formulas:
  - KickLaunchVelocity = BaseLaunchSpeed (17.5 m/s) * (1.0 + BootBoosterUpgrade *
    0.12) * clamp(PlayerForwardSpeed / 6.0 m/s, 1.0, 1.6)
  - 'WallImpactDamage = BaseWallDamage (45 HP) + (RagdollImpactVelocity ^ 1.4) * MassFactor
    (1.15) * (IsSpikeWall ? 2.5 : 1.0)'
  - AirSkeetMultiplier = BaseCrit (2.2x) + clamp(AirHangTime / 0.8 s, 0.0, 1.5) *
    WeaponPrecisionFactor (1.3x)
  - DominoChainDamage = VictimVelocity * TargetBodyMass * 2.8 * (ChainDepth ^ 0.75)
  - 'AmmoDropChance = BaseChance (0.15) + (KilledByWallOrBarrelKick ? 0.70 : 0.0)
    + (ComboLevel * 0.05)'
  run_progression:
  - 'Отсеки 1-3 (Стартовый прорыв): Базовые берцы отбрасывают пехотинцев на 7 метров,
    пистолет с 12 патронами, редкие взрывные бочки у стен.'
  - 'Отсеки 4-7 (Разгон синергий): Получение 2-3 тактических био-чипов (например,
    зажигательный след от пинка, автоперезарядка при ударе врага о стену), появление
    тяжелых автоматчиков.'
  - 'Отсеки 8-11 (Кинетический шторм): Пинок создает ударную волну в конусе 45°, враги
    разлетаются веером, сбивая друг друга как домино; на стенах появляются стационарные
    шипы и электрощиты.'
  - 'Отсек 12 (Финальный Экзо-Колосс): Босс со сбиваемой кинетическими ударами энерго-броней;
    для нанесения урона требуется пинать в босса его собственную свиту и летящие ракеты.'
  meta_progression:
  - 'Титановые пластины экзо-берцев (0/10 рангов): +7% к силе кинетического импульса
    и +6% к урону от впечатывания в препятствия за уровень.'
  - 'Адреналиновый инжектор штурма (0/5 рангов): Увеличивает окно замедления времени
    при вышибании дверей с 0.80 с до 1.60 с.'
  - 'Магнитная перчатка перехвата (0/5 рангов): Увеличивает радиус автоматического
    подбора выбитого из рук оружия с 1.8 м до 5.5 м.'
  - 'Увеличенный разгрузочный жилет (0/8 рангов): +12% к начальному запасу патронов
    для дробовика, автомата и гранатомета.'
  - 'Мастерская модификаций обуви: Открытие альтернативных типов подошв (Шоковые подошвы,
    Пневмо-таран, Реактивные каблуки).'
  mechanics:
  - name: Кинетический тактический пинок (Kinetic Spartan Kick)
    role_in_loop: Двигатель темпа и главный инструмент контроля дистанции/ресурсов
    player_decision: Использовать пинок прямо сейчас для мгновенного контроля опасного
      врага и экономии патронов или приберечь для удара по взрывной бочке?
    input_mapping: ПКМ / Клавиша 'E' / Тап по большой кнопке ноги справа внизу экрана
    states:
    - 'READY: Нога заряжена, готовность к мгновенному удару'
    - 'WINDUP: Замах экзо-ботинка (0.07 с), блокировка стрельбы'
    - 'ACTIVE_HITBOX: Конус удара 60 градусов, длина 2.1 м (0.12 с)'
    - 'HIT_FREEZE: Микро-пауза 0.05 с при контакте для сочного импакта'
    - 'RECOVERY: Возврат ноги в исходное положение (0.16 с), возможность прерывания
      спринтом'
    parameters:
    - name: Базовая скорость запуска цели
      value: 17.5 м/с
      tuning_note: Если опустить ниже 12 м/с — враг вяло отваливается, пропадает ощущение
        супергеройской силы; если поднять выше 24 м/с — игрок не успевает среагировать
        и расстрелять цель в воздухе.
    - name: Длительность хит-стопа при попадании
      value: 0.06 с
      tuning_note: При 0 с удар кажется 'ватным' и невесомым; при значении выше 0.12
        с игра ощущается залагавшей и тормозящей.
    - name: Конус поражения удара
      value: 55 градусов
      tuning_note: Меньше 35 градусов — частые промахи в мобильной версии; больше
        80 градусов — пинок превращается в дешевую круговую атаку без необходимости
        целиться.
    - name: Урон от соударения со стеной
      value: 50 ед
      tuning_note: Меньше 30 ед — игроки перестают целиться в стены и просто стреляют;
        больше 90 ед — огнестрельное оружие становится ненужным.
    feedback_layers:
    - 'Визуал/VFX: Появление полупрозрачного конуса сжатого воздуха shockwave, частицы
      пыли и искр из-под подошвы, мгновенный ragdoll врага с инерционным разворотом
      суставов.'
    - 'Звук (Web Audio): Низкочастотный саб-басовый панч (60 Гц) в момент касания,
      хлесткий металлический щелчок сервопривода экзоскелета, свистящий звук рассекаемого
      воздуха.'
    - 'Камера: Мгновенный толчок камеры назад на 0.2 м с возвратом за 0.15 с, угловой
      шейк 2.5 градуса по оси Pitch.'
    - 'UI/Тактильность: Короткий вибрационный импульс на мобильных устройствах (45
      мс), дуговой радиальный индикатор отката вокруг перекрестья прицела.'
    failure_mode: 'Игрок пинает бронированного мини-босса с активным щитом: ботинок
      отскакивает с металлическим звоном, игрок получает стан на 0.35 с и отбрасывается
      назад.'
    mastery_curve: Новичок на 30-й секунде хаотично пинает одиночных врагов перед
      собой; эксперт на 10-м забеге пинает на бегу в прыжке под углом 45 градусов,
      отправляя одного врага рикошетом через двух других прямо в бочку с горючим.
    counterplay: Враги со штурмовыми щитами блокируют фронтальный пинок, а берсерки
      с шипованной броней наносят 15 ед ответного урона при попытке ударить их ногой
      без предварительного снятия брони выстрелом.
    synergies:
    - 'Воздушный жонгляж: подброшенный пинком враг зависает в воздухе под критические
      выстрелы'
    - 'Каскадный снос окружения: запущенное тело служит тяжелым кинетическим снарядом
      для других объектов'
    - 'Штурмовой вышиб дверей: разгон перед пинком суммирует скорость спринта с силой
      удара'
    why_unique: В отличие от стандартного ножа/мили-удара в FPS, пинок перемещает
      физическое тело в пространстве с сохранением вектора и превращает самого врага
      в разрушительный снаряд.
    pseudocode: "function onKickTick(delta):\n  if not input.kickPressed or kickCooldown\
      \ > 0: return\n  state = WINDUP; playSound('servo_kick'); yield(0.07)\n  target\
      \ = findTargetInCone(player.pos, player.forward, angle=55, dist=2.1)\n  if target:\n\
      \    triggerHitStop(0.06); triggerCameraShake(amp=0.35)\n    impulseVector =\
      \ (player.forward + Vector3(0, 0.25, 0)).normalize() * 17.5\n    target.applyRagdollImpulse(impulseVector)\n\
      \    target.addStatusEffect('AIRBORNE_SKEET', duration=1.2)\n  state = RECOVERY;\
      \ kickCooldown = 0.45"
  - name: Воздушный жонгляж и экзекуция (Air-Skeet Juggling)
    role_in_loop: Источник высокой награды, урона и стиля за меткость
    player_decision: Потратить дефицитные патроны на летящего врага ради гарантированного
      крита и дропа ресурсов или переключиться на наземные цели?
    input_mapping: ЛКМ / Удержание кнопки огня / Тап по кнопке 'Выстрел'
    states:
    - 'TARGET_AIRBORNE: Противник находится в воздухе после пинка (флаг SKEET_READY)'
    - 'AIM_LOCK: Прицел наведен на парящую тушу (динамический ромб захвата)'
    - 'EXECUTION_SHOT: Попадание пули/картечи в фазе полета'
    - 'BURST_REWARD: Дробление цели на куски, спавн патронов и начисление комбо-очков'
    parameters:
    - name: Множитель урона по парящей цели (Skeet Crit)
      value: 2.5x
      tuning_note: Ниже 1.8x — игрокам лень целиться в воздухе, проще расстрелять
        на земле; выше 3.5x — боссы и элитники ваншотаются без усилий.
    - name: Окно зависания врага в воздухе
      value: 0.95 с
      tuning_note: Меньше 0.5 с — мобильные игроки не успевают довести палец до кнопки
        огня; больше 1.5 с — враги неестественно 'плавают' как в невесомости.
    - name: Бонусный дроп патронов при Skeet-убийстве
      value: +3 патрона
      tuning_note: Если 0 — игрок быстро проседает по боекомплекту; если больше 6
        — стрельба становится бесконечной и пропадает менеджмент ресурсов.
    feedback_layers:
    - 'Визуал/VFX: Яркая радиальная вспышка золотисто-оранжевого цвета при попадании
      в воздухе, разлетающиеся гильзы и искры, текст ''SKEET CRIT!'' всплывает над
      целью.'
    - 'Звук (Web Audio): Высокий хрустальный звук ''дзынь'' колокольчика поверх мощного
      выстрела дробовика, ускоряющийся темп музыкального сэмпла.'
    - 'Камера: Микро-зум FOV (на 3 градуса ближе на 0.08 с) в момент результативного
      попадания по парящей мишени.'
    - 'UI/Тактильность: Визуальное разрастание перекрестья прицела с красным индикатором
      ''CRITICAL HIT'', двойной тактильный тик (20 мс + 20 мс).'
    failure_mode: 'Игрок стреляет мимо летящего врага: патроны потрачены впустую,
      враг приземляется на ноги без урона от падения и немедленно стреляет в ответ.'
    mastery_curve: Новичок успевает сделать лишь один неприцельный выстрел из пистолета;
      мастер производит связку 'пинок -> подброс -> переключение на дробовик -> два
      выстрела в воздухе по разным целям'.
    counterplay: Летающие дроны и тяжелые пулеметчики имеют гравитационные стабилизаторы,
      сокращающие время нахождения в воздухе на 70%.
    synergies:
    - 'Кинетический тактический пинок: основной источник подбрасывания врагов на удобную
      высоту'
    - 'Выбивание оружия: выбитый из рук ствол можно подстрелить в воздухе, вызвав
      его детонацию'
    why_unique: 'Объединяет механику стендовой стрельбы по тарелочкам (Skeet shooting)
      с аркадным FPS: игрок сам создает себе летящие мишени собственным пинком.'
    pseudocode: "function onBulletHit(target, bullet):\n  if target.hasStatus('AIRBORNE_SKEET'):\n\
      \    finalDamage = bullet.damage * 2.5\n    playSkeetAudioFeedback(); spawnParticles('gold_spark',\
      \ target.pos)\n    target.applyDamage(finalDamage)\n    if target.isDead():\n\
      \      spawnAmmoPickup(target.pos, amount=3)\n      comboSystem.addScore(points=250,\
      \ style='AIR_SKEET')\n  else:\n    target.applyDamage(bullet.damage)"
  - name: Каскадный снос окружения 'Кегельбан' (Domino Bowling Collisions)
    role_in_loop: Источник массового AoE-урона и цепных реакций
    player_decision: Пнуть ли врага напрямую в толпу за ним, в красную взрывную бочку
      или в электрический щиток на стене?
    input_mapping: Позиционирование взгляда перед пинком / Выбор угла атаки
    states:
    - 'PROJECTILE_BODY: Враг/бочка летит как активный физический снаряд с включенным
      хитбоксом урона'
    - 'PRIMARY_COLLISION: Столкновение с первой помехой (враг/стена/бочка)'
    - 'CHAIN_TRANSFER: Передача 60% импульса следующему объекту в цепочке'
    - 'EXPLOSIVE_RESOLVE: Детонация интерактивных бочек/баллонов при соприкосновении'
    parameters:
    - name: Радиус взрыва бочки от удара телом
      value: 4.2 м
      tuning_note: Меньше 3.0 м — редко задевает соседних врагов; больше 6.0 м — взрывает
        полкомнаты и самого игрока.
    - name: Коэффициент передачи импульса второму врагу
      value: '0.65'
      tuning_note: Меньше 0.4 — цепная реакция затухает на первом же враге; больше
        0.85 — один пинок сносит всю комнату как шар для боулинга.
    - name: Порог скорости для пробивания дверей/стекол
      value: 8.0 м/с
      tuning_note: Если выше 12 м/с — объекты почти никогда не пробиваются; если ниже
        4 м/с — случайные легкие касания ломают декорации.
    feedback_layers:
    - 'Визуал/VFX: Разлет осколков дерева, стекла и искр, оранжевый огненный шар при
      подрыве бочек, деформация бочек шейдером при ударе туши.'
    - 'Звук (Web Audio): Сочный металлический звон сминаемой бочки, гулкий грохот
      взрыва с динамическим low-pass фильтром на 0.4 с.'
    - 'Камера: Пространственная тряска (Radial Shake) с затуханием от эпицентра взрыва/удара.'
    - 'UI/Тактильность: Всплывающий счетчик комбо ''STRIKE! x3'', протяжная тяжелая
      вибрация (70 мс).'
    failure_mode: 'Игрок пинает взрывную бочку слишком близко к стене: бочка рикошетит
      обратно в игрока и взрывается ему под ноги.'
    mastery_curve: Новичок взрывает бочки стрельбой издалека; мастер использует пинок
      по телу врага так, чтобы туша срезала двух стрелков и в конце траектории сдетонировала
      баллон с газом у пулеметного гнезда.
    counterplay: Тяжелые стационарные турели приварены к полу и не сдвигаются телами,
      принимая урон на себя и останавливая цепочку домино.
    synergies:
    - 'Кинетический тактический пинок: первичный импульс запуска ''шара для боулинга'''
    - 'Штурмовой вышиб дверей: створка двери выступает гигантским щитом-снарядом с
      огромной массой'
    why_unique: 'Превращает врагов из источников угрозы в бесплатные боеприпасы: чем
      плотнее стоит группа противников, тем быстрее и зрелищнее они уничтожают друг
      друга.'
    pseudocode: "function onRagdollCollision(flyingBody, hitObject):\n  speed = flyingBody.velocity.length()\n\
      \  if speed < 3.0: return\n  if hitObject.isEnemy:\n    damage = speed * 4.5\n\
      \    hitObject.applyDamage(damage)\n    hitObject.applyImpulse(flyingBody.velocity\
      \ * 0.65)\n    spawnFloatingText('DOMINO!', hitObject.pos)\n  elif hitObject.isExplosive:\n\
      \    hitObject.detonate(radius=4.2, damage=120)\n  flyingBody.velocity *= 0.4"
  - name: Выбивание оружия и перехват на лету (Disarm & Mid-Air Gun Catch)
    role_in_loop: Источник тактической адаптации и мгновенного пополнения огневой
      мощи
    player_decision: Пнуть вооруженную руку врага, чтобы забрать мощный дробовик на
      4 выстрела, или просто отправить его в стену?
    input_mapping: Прицельный пинок в правое плечо/руку + Клавиша 'F' / Автозахват
      при приближении
    states:
    - 'ARMED_ENEMY: Враг ведет огонь из специализированного оружия'
    - 'DISARM_KICK: Попадание пинком в сектор оружия, оружие вылетает вверх с вращением'
    - 'MID_AIR_GRAB: Игрок ловит ствол в воздухе в радиусе 2.5 м'
    - 'OVERDRIVE_MAG: Игрок получает ствол с 1 полным магазином без перезарядки'
    parameters:
    - name: Высота подброса выбитого оружия
      value: 2.8 м
      tuning_note: Меньше 1.5 м — оружие падает под ноги и теряется в суматохе; больше
        4.5 м — оружие улетает за пределы экрана и потолка.
    - name: Радиус окна перехвата оружия
      value: 2.2 м
      tuning_note: Меньше 1.2 м — поймать на бегу в Three.js крайне сложно; больше
        3.5 м — ствол 'примагничивается' сам без чувства скилла.
    - name: Бонус к скорострельности перехваченного ствола
      value: +35%
      tuning_note: Дает ощущение яростного адреналинового овердрайва на время отстрела
        магазина.
    feedback_layers:
    - 'Визуал/VFX: Золотистый силуэтный трейл за летящим в воздухе оружием, замедленное
      вращение ствола, вспышка в руках при успешном перехвате.'
    - 'Звук (Web Audio): Звонкий лязг выбиваемого металла, щелчок взведения затвора
      в момент хвата, восторженный голосовой возглас протагониста.'
    - 'Камера: Быстрый микро-доворот взгляда (Snapping на 10%) в сторону летящего
      оружия при нажатии кнопки подбора.'
    - 'UI/Тактильность: Значок нового оружия всплывает по центру экрана с мигающим
      счетчиком патронов, резкий тактильный импульс (35 мс).'
    failure_mode: Игрок не успевает поймать оружие, оно падает на пол и взрывается
      от перегрева через 1.5 секунды, нанося легкий урон вокруг.
    mastery_curve: Новичок подбирает оружие с пола после боя; мастер выбивает ногой
      ракетомет у элитника, ловит его на лету в воздухе и тут же стреляет в толпу
      до приземления.
    counterplay: Некоторые элитные охранники пристегивают оружие к экзоскелету тросом
      — их разоружение требует предварительного сбивания силовой брони.
    synergies:
    - 'Кинетический тактический пинок: активатор механики выбивания'
    - 'Штурмовой вышиб дверей: во время bullet-time поймать оружие в воздухе намного
      проще и зрелищнее'
    why_unique: 'Избавляет от скучной паузы на перезарядку: вместо отсидки в укрытии
      самый быстрый способ получить патроны — агрессивно отобрать ствол у врага ногой.'
    pseudocode: "function onKickHitLimb(enemy, hitLimb):\n  if hitLimb == 'WEAPON_ARM'\
      \ and enemy.hasWeapon():\n    gun = enemy.dropWeapon()\n    gun.applyImpulse(Vector3(0,\
      \ 4.2, 0) + player.forward * -1.5)\n    gun.enableMidAirCatchTrigger(radius=2.2,\
      \ duration=1.4)\n    enemy.enterState('DISARMED_PANIC', duration=2.0)\nfunction\
      \ onGunTriggerEnter(player, gun):\n  if input.interactPressed or player.hasAutoMagnetPerk:\n\
      \    player.equipTempWeapon(gun.type, ammo=gun.maxMag, fireRateBonus=1.35)\n\
      \    playSound('gun_cock_fast')"
  - name: Штурмовой вышиб дверей с адреналиновым фокусом (Breach Kick & Adrenaline
      Slow-Mo)
    role_in_loop: Инициатор боевой ситуации, тактический переключатель комнат
    player_decision: Вынести дверь по центру с максимальным шумом и bullet-time или
      заглянуть сбоку, сэкономив адреналин?
    input_mapping: Спринт + Пинок (Shift + E / Свайп вперед во время бега)
    states:
    - 'APPROACH: Сближение с запертой/приоткрытой дверью отсека'
    - 'BREACH_IMPACT: Контакт подошвы с дверью, расчет разрушения петель'
    - 'DOOR_FLIGHT: Полотно двери летит вперед, сокрушая все на пути'
    - 'BULLET_TIME: Замедление игрового времени до 25% на 0.8 с для оценки угроз'
    - 'NORMAL_TIME: Плавный возврат к нормальной скорости времени (0.2 с)'
    parameters:
    - name: Коэффициент замедления времени (Time Scale)
      value: 0.25x
      tuning_note: Если ниже 0.15x — темп игры падает, становится скучно ждать; если
        выше 0.45x — игрок не успевает осмотреться и расставить приоритеты.
    - name: Длительность адреналинового фокуса
      value: 0.80 с
      tuning_note: Меньше 0.5 с — эффект не воспринимается как bullet-time; больше
        1.5 с — рушится ощущение драйвового быстрого экшена.
    - name: Урон от летящего дверного полотна
      value: 90 ед
      tuning_note: Должно гарантированно ваншотать базовых охранников первой линии,
        создавая мгновенный вау-эффект прорыва.
    feedback_layers:
    - 'Визуал/VFX: Радиальный блюр по краям экрана (Radial Speed Lines), выбивание
      щепок и петель, хроматическая аберрация в фазе Slow-Mo.'
    - 'Звук (Web Audio): Оглушительный грохот ломающегося дерева/металла, плавный
      срез высоких частот (low-pass filter) и глухой стук сердца (Heartbeat 80 BPM).'
    - 'Камера: Динамический наезд камеры вперед (Kick Zoom-In) на 0.4 м с последующим
      расширением FOV до 100°.'
    - 'UI/Тактильность: Нарастающий вибро-отклик при ударе (60 мс), силуэтная подсветка
      врагов сквозь пыль красным контуром.'
    failure_mode: 'Попытка выбить укрепленную титановую дверь без накопленного импульса
      скорости: игрок спотыкается, теряет скорость и не активирует bullet-time.'
    mastery_curve: Новичок выбивает дверь и стреляет в ближайшего охранника; мастер
      в фазе Slow-Mo успевает оценить всю комнату, выбить пистолет у левого врага,
      бросить баллон в правого и приземлиться за укрытием.
    counterplay: 'Заминированные двери с растяжками: при выбивании двери взрыв происходит
      прямо в проеме, требуя от игрока вовремя сделать подкат в сторону.'
    synergies:
    - 'Каскадный снос окружения: выбитая дверь — самый тяжелый метательный снаряд
      на арене'
    - 'Выбивание оружия: замедление времени дает идеальное окно для захвата выбитого
      оружия на лету'
    why_unique: Превращает банальную загрузку/переход между комнатами в кульминационную
      микро-сцену боевика, задающую ритм всему бою в отсеке.
    pseudocode: "function onBreachDoor(door, playerSpeed):\n  if playerSpeed < 4.0:\
      \ door.openNormal(); return\n  door.breakHinges()\n  door.applyPhysicsImpulse(player.forward\
      \ * 22.0, torque=Vector3(5,0,0))\n  timeManager.setTimeScale(0.25, duration=0.8,\
      \ easeOut=0.2)\n  postProcessing.enableBreachFX(blur=0.6, chromatic=0.4)\n \
      \ audio.playLowPassSnapshot('slowmo_heartbeat', duration=0.8)\n  camera.punchFOV(targetFOV=100,\
      \ duration=0.8)"
  - name: Динамическое перемещение и инерция
    role_in_loop: двигатель посекундной микро-петли
    player_decision: Когда и с каким запасом применять «Динамическое перемещение и
      инерция», зная цену промаха
    input_mapping: Основной жест управления на тач-экране / ЛКМ / Пробел
    states:
    - ГОТОВО
    - АКТИВНО
    - ВОССТАНОВЛЕНИЕ
    - ЗАБЛОКИРОВАНО
    parameters:
    - name: Окно исполнения
      value: 0.25 с
      tuning_note: Меньше — механика ощущается несправедливой; больше — исчезает мастерство
    - name: Восстановление
      value: 0.9 с
      tuning_note: Короче — спам действия; длиннее — игрок скучает
    feedback_layers:
    - 'Визуал: сочный шлейф частиц и явное изменение состояния цели'
    - 'Звук: двухслойный звуковой эффект (удар + подтверждение успеха)'
    - 'Камера: короткий направленный импульс тряски (shake)'
    - 'UI: микро-индикатор готовности рядом с точкой взгляда'
    failure_mode: Применение раньше времени дает осечку и оставляет персонажа открытым
    mastery_curve: Новичок нажимает наугад; мастер готовит ситуацию и применяет в
      пик тайминга
    counterplay: Игра постепенно сужает безопасные зоны применения
    synergies:
    - Успешное применение подготавливает «Тактическое применение ключевой способности»
    why_unique: Спроектировано вокруг крючка «Динамичный игровой процесс с сочным
      откликом и рогалик-прокачкой между забегами.»
    pseudocode: "on_action():\n    if state != READY: return reject_feedback()\n \
      \   state = ACTIVE; apply_action_physics()\n    emit_feedback(); start_cooldown(0.9)"
  - name: Тактическое применение ключевой способности
    role_in_loop: источник тактической вариативности и риска
    player_decision: Потратить ресурс на «Тактическое применение ключевой способности»
      сейчас или сберечь для критической ситуации
    input_mapping: Вторичная кнопка / свайп / ПКМ
    states:
    - ГОТОВО
    - ДЕЙСТВИЕ
    - ПЕРЕЗАРЯДКА
    parameters:
    - name: Расход энергии
      value: 30 ед
      tuning_note: Балансирует частоту использования
    - name: Радиус эффекта
      value: 4.5 м
      tuning_note: Определяет тактическую зону контроля
    feedback_layers:
    - 'Визуал: радиальная ударная волна и смещение окружающих объектов'
    - 'Звук: низкочастотный бас-панч с реверберацией'
    - 'Камера: мягкий зум-импульс'
    - 'UI: шкала энергии с подсветкой готовности'
    failure_mode: Активация в пустом пространстве впустую сжигает накопленный ресурс
    mastery_curve: Точный расчет тайминга для максимального охвата целей
    counterplay: Мобильные цели выходят из радиуса действия
    synergies:
    - Усиливает отдачу от «Динамическое перемещение и инерция»
    why_unique: Дает игроку инструмент перелома сложной ситуации
    pseudocode: "on_secondary():\n    if energy < 30: return energy_empty_vfx()\n\
      \    energy -= 30; apply_aoe_effect(4.5)\n    emit_bass_punch(); state = COOLDOWN"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite 5.x
  renderer: threejs
  renderer_version: ^0.170.0
  physics_engine: Rapier3D (@dimforge/rapier3d-compat 0.13.x)
  state_manager: Custom TinyEventBus & Reactive GameStore
  audio_engine: Howler.js (^2.2.4) с WebAudio API
  target_fps: 60
  max_draw_calls: 75
  max_triangles_or_sprites: 40000
  bundle_size_budget_mb: 4.2
  layers:
  - name: Application Layer
    responsibility: Инициализация Vite, ресайз канваса, полноэкранный режим, прелоадер.
  - name: Platform & Ads Layer
    responsibility: Адаптер Playgama Bridge, менеджеры Interstitial и Rewarded рекламы,
      Cloud Save.
  - name: Core Engine Layer
    responsibility: Фиксированный цикл GameLoop 60Гц, EventBus, маршрутизация ввода.
  - name: Physics Simulation Layer
    responsibility: Шаги симуляции Rapier3D, фильтрация коллизий, рэгдолл-синхронизация.
  - name: Gameplay Systems Layer
    responsibility: Боевая система, спавн врагов, выбор 3 карт улучшений, расчет комбо.
  - name: Entity Management Layer
    responsibility: Пул сущностей игрока, врагов, снарядов и осколков.
  - name: Rendering Layer
    responsibility: Three.js граф сцены, InstancedMesh батчинг, тени, эмиттеры частиц.
  - name: UI & HUD Layer
    responsibility: HTML5/CSS3 оверлей, виртуальный джойстик, полосы HP, модальные
      окна.
  modules:
  - name: src/main.ts
    desc: 'Точка входа: инициализация Playgama Bridge, загрузка ассетов и запуск Game.'
  - name: src/core/Game.ts
    desc: Главный координатор, стейт-машина и управление сценами.
  - name: src/core/GameLoop.ts
    desc: Фиксированный 60Гц цикл обновления с аккумулятором дельты.
  - name: src/core/EventBus.ts
    desc: Типизированная шина событий для слабой связности систем.
  - name: src/platform/PlaygamaService.ts
    desc: Служба работы с @playgama/bridge (реклама, облачные сейвы, лидерборды).
  - name: src/physics/PhysicsWorld.ts
    desc: Обертка физического мира Rapier3D с фильтрами слоев коллизий.
  - name: src/entities/Player.ts
    desc: Контроллер игрока с расчетом физических сил и управления.
  - name: src/entities/EnemyPool.ts
    desc: Пул переиспользуемых сущностей врагов с логикой поведения.
  - name: src/systems/CombatSystem.ts
    desc: Расчет урона, хит-стопа, импульсов и комбо-бонусов.
  - name: src/ui/UIManager.ts
    desc: Управление HUD, окном выбора карт, главным меню и экраном результатов.
monetization:
  strategy_summary: Гибридная модель Free-to-Play для Яндекс Игр и веб-порталов. Высокий
    eCPM за счет полезных Rewarded видео без агрессивного навязывания.
  rewarded_placements:
  - id: revive_run
    name: Второе Дыхание (Возрождение)
    benefit: Восстановление 50% HP + 3 сек неуязвимости с силовой волной, раскидывающей
      врагов.
    cooldown_or_limit: 1 раз за забег.
    trigger_moment: При получении смертельного урона.
  - id: double_gold_run
    name: Удвоение Наград (2x Золото)
    benefit: Удваивает все заработанные шестеренки и монеты за завершенный раунд.
    cooldown_or_limit: Доступно на каждом экране результатов.
    trigger_moment: Экран окончания игры.
  - id: free_card_reroll
    name: Переброс Карт Улучшений
    benefit: Обновляет список 3 карт улучшений с гарантией Редкой или Эпической карты.
    cooldown_or_limit: До 2 раз за забег.
    trigger_moment: Окно выбора 3 карт.
  interstitial_placements:
  - trigger_event: Между волнами и при возврате в Главное Меню.
    cooldown_seconds: 90
    conditions: Интервал не менее 90 секунд, не показывается во время активного геймплея.
  in_app_purchases:
  - sku: ad_free_vip_pass
    name: VIP Пропуск (Без Рекламы)
    description: Отключает межстраничные баннеры, дает вечный бонус +25% к золоту
      и эксклюзивный скин.
    price_tier: 199 YAN / 199 руб
    reward: Отключение Interstitial + VIP скин
  fairness_rules:
  - Весь игровой контент можно открыть бесплатно через геймплей.
  - Полное отсутствие рекламы во время активного боя.
  - Автоматическая пауза игры и отключение звука во время показа рекламы.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - ok
  - crazy_games
  - playgama
  - mock
  initialization_flow:
  - 1. installViewportGuards() — блокировка страницы до первой отрисовки.
  - 2. `await bridge.initialize()` (с таймаутом 10 с) + `in_game_loading_started`.
  - 3. Язык платформы (`bridge.platform.language`) до первого перевода DOM.
  - 4. Тихая авторизация на vk/ok — до чтения сейвов, с таймаутом 5 с.
  - 5. Загрузка сейва через `bridge.storage.get(key)` (без storageType).
  - '6. Выдача необработанных покупок: `getPurchases()` → выдать → потребить.'
  - 7. Предзагрузка текстур, мешей и звуков, сборка сцены и UI.
  - 8. Прогресс до 100% и пауза на затухание сплэша (~700 мс).
  - 9. `bridge.platform.sendMessage('game_ready')` — ровно один раз.
  - 10. Поднятие баннеров и старт обучения — только после game_ready.
  cloud_save_keys:
  - player_save_v1
  leaderboards:
  - globalhighscore
  - highestwave
  ads_integration:
    interstitial: Взводится при завершении забега, показывается по клику на выход
      с экрана результатов; floor >= платформенного минимума
    rewarded: Награда только по событию state === 'rewarded'; off() слушателя и защита
      от повторного вызова
    banner: Поднят в меню и магазине, скрыт во время игры; на vk/ok — один запрос
      за сессию
  lifecycle_hooks:
  - Пауза и звук — через `bridge.platform.on(EVENT_NAME.PAUSE_STATE_CHANGED / AUDIO_STATE_CHANGED)`.
  - 'Колбэк вызывается сразу с текущим значением: игра могла стартовать в скрытой
    вкладке.'
  - На возобновлении сбрасывается аккумулятор дельты, dt клампится до 0.1 с.
  - Сейв сбрасывается на `pagehide` и `visibilitychange`.
