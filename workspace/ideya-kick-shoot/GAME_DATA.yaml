    Сочный металлический звон сминаемой бочки, гулкий грохот взрыва с динамическим
    low-pass фильтром на 0.4 с.; Камера: Пространственная тряска (Radial Shake) с
    затуханием от эпицентра взрыва/удара.; UI/Тактильность: Всплывающий счетчик комбо
    ''STRIKE! x3'', протяжная тяжелая вибрация (70 мс).'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Выбивание оружия и перехват на лету (Disarm & Mid-Air Gun Catch)
  category: Источник тактической адаптации и мгновенного пополнения огневой мощи
  priority: secondary
  description: 'Избавляет от скучной паузы на перезарядку: вместо отсидки в укрытии
