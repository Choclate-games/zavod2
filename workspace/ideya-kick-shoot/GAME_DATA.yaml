  player_interaction: Спринт + Пинок (Shift + E / Свайп вперед во время бега)
  feedback: 'Визуал/VFX: Радиальный блюр по краям экрана (Radial Speed Lines), выбивание
    щепок и петель, хроматическая аберрация в фазе Slow-Mo.; Звук (Web Audio): Оглушительный
    грохот ломающегося дерева/металла, плавный срез высоких частот (low-pass filter)
    и глухой стук сердца (Heartbeat 80 BPM).; Камера: Динамический наезд камеры вперед
    (Kick Zoom-In) на 0.4 м с последующим расширением FOV до 100°.; UI/Тактильность:
    Нарастающий вибро-отклик при ударе (60 мс), силуэтная подсветка врагов сквозь
    пыль красным контуром.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
