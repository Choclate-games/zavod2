mechanics:
- name: Динамическая маскировка в потоке танцоров
  category: stealth
  priority: core
  description: Смешивание с плотной группой танцоров карнавала для резкого снижения
    радиуса обнаружения стражниками.
  player_interaction: 'ПК: Клавиши WASD для движения в центр группы танцоров, удержание
    Space для синхронизации скорости с потоком (2.6 м/с); Мобильные: Виртуальный джойстик
    направления + удержание зоны ''Шаг шествия'' для автоматической подстройки темпа.'
  feedback: 'Визуал/VFX: Силуэт героя окрашивается в полупрозрачный лазурный оттенок
    карнавального плаща; вокруг ног стелется золотая пыльца и кружатся маски; конусы
    стражей при наведении на замаскированную группу блекнут, теряют резкость и прозрачность
    на 70%.; Звук (Web Audio): Включение полосового low-pass фильтра (срезан верх
    выше 800 Гц), фоновый гул карнавала приглушается, а на передний план выходит пульсирующий
    саб-бас и звонкий стук кастаньет в темпе шествия.; Камера (импульс/зум): Плавное
    отдаление камеры (FOV расширяется с 50° до 56°, высота подъема +1.2 м), открывая
    панорамный обзор на следующие платформы кортежа.; UI/Тактильность: Индикатор над
    головой героя плавно переключается с раскрытого глаза на театральную полумаску;
    короткий мягкий вибро-импульс (20 мс, 40% мощности) при успешной фиксации маскировки.'
  technical_complexity: Medium
  strengths:
  - Полная невидимость для дальних патрулей
  - Поглощение толпой тел устраненных врагов
  weaknesses:
  - Теряется при разрыве строя или спринте
- name: Ритмический скрытный выпад рапирой
  category: двигатель комбо-серий и мгновенного устранения препятствий на пути к цели
  priority: secondary
  description: 'Устранение врага синхронизировано с ритм-движком шествия: попадание
    в такт превращает смертоносный удар в элемент праздничного шоу, маскируя звук
    выстрелом салюта или ударом тарелок.'
  player_interaction: 'ПК: ЛКМ (клик в сторону подсвеченного стража); Мобильные: Тап
    по иконке выпада или быстрый направленный свайп в сторону врага.'
  feedback: 'Визуал/VFX: Яркий золотисто-неоновый шлейф лезвия рапиры, рассыпание
    побежденного стража на сверкающие карнавальные конфетти и серпантин при ритмичном
    ударе; вспышка текста ''PERFECT BEAT'' золотом над головой.; Звук (Web Audio):
    Сочный хруст пробития шелка и брони, акцентированный звонким ударом оркестровой
    тарелки и малого барабана точно в сильную долю музыкального трека.; Камера (импульс/зум):
    Микро-хитстоп на 0.04 с с динамическим радиальным размытием (radial blur 0.35)
    и резким толчком камеры вперед по направлению укола на 0.25 м.; UI/Тактильность:
    Кольцевой ритм-прицел вокруг цели схлопывается в точку в момент удара; плотная
    сочная вибрация (60 мс, 90% мощности) на мобильных устройствах.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Тактическое парирование и ragdoll-сброс
  category: combat
  priority: core
  description: Отражение рубящего удара алебарды в последний момент с последующим
    силовым пинком и сбросом стража с платформы.
  player_interaction: 'ПК: ПКМ (короткое нажатие в момент атаки) -> Пробел для пинка;
    Мобильные: Кнопка ''Парирование'' по таймингу -> Свайп вверх для силового пинка.'
  feedback: 'Визуал/VFX: Взрывной сноп медных искр в точке контакта клинков, ударная
    кольцевая волна по настилу платформы, шлейф золотой пыли и разлетающиеся заклепки
    брони при полете тела в бездну.; Звук (Web Audio): Звонкий стальной лязг клинков
    (''heavy metal clash'') с мгновенным басовым саб-дропом (sub-bass 60 Гц) при пинке
    и затухающим криком улетающего вниз стража.; Камера (импульс/зум): Динамический
    зум на 15% во время хитстопа (0.06 с) с последующим кинематографичным панорамированием
    за траекторией полета ragdoll-тела.; UI/Тактильность: Яркая белая вспышка виньетки
    по периметру экрана; сдвоенный мощный виброотклик: резкий короткий (40 мс) на
    парировании и глубокий тяжелый (90 мс) на пинке.'
  technical_complexity: High
  strengths:
  - Мгновенная нейтрализация даже бронированных врагов
  - Очистка узкой платформы
  weaknesses:
  - Промах открывает вора для получения урона
- name: Инерционная транспортировка тяжелого тотема
  category: movement
  priority: core
  description: Транспортировка тяжелой реликвии с платформы сквозь шествие к точке
    эвакуации с изменением инерции движения.
  player_interaction: 'ПК: Клавиши WASD для управления вектором тяги + Shift для инерционного
    таранного рывка; Мобильные: Наклон виртуального стика с учетом заноса + кнопка
    ''Таранный рывок''.'
  feedback: 'Визуал/VFX: Золотое гравитационное свечение у основания тотема, сноп
    искр от трения о медный настил платформы, искажение горячего воздуха (heat distortion)
    при таранном разгоне.; Звук (Web Audio): Глухой тяжелый металлический скрежет
    по меди платформы, нарастающий низкочастотный гул левитационного механизма тотема
    при попадании в такт музыки.; Камера (импульс/зум): Динамическое смещение камеры
    назад и вниз для усиления ощущения кинематографичной массы, легкая вибрация экрана
    при каждом тяжелом шаге с тотемом.; UI/Тактильность: Появление шкалы кинетической
    энергии (Momentum Meter) над тотемом; пульсирующая нарастающая вибрация джойстика
    по мере набора скорости.'
  technical_complexity: Medium
  strengths:
  - Главная цель победы в забеге
  - Возможность использовать как временный щит
  weaknesses:
  - Снижает скорость на 22% и привлекает внимание вне толпы
- name: Карнавальная конфетти-завеса и хлопушки отвлечения
  category: источник тактической гибкости и аварийный предохранитель (контроль толпы
    и экстренный сброс агро)
  priority: secondary
  description: Вместо банальной военной дымовой гранаты используется праздничная хлопушка,
    которая не только ослепляет стражу, но и возбуждает толпу танцоров, превращая
    хаос в живое укрытие.
  player_interaction: 'ПК: Клавиша E или Q (бросок под себя/в точку курсора); Мобильные:
    Отдельная круглая кнопка хлопушки справа над кнопкой атаки.'
  feedback: 'Визуал/VFX: Пышный объемный взрыв сверкающих золотых и пурпурных конфетти
    с клубами цветного дыма; ослепленные стражники закрывают забрала шлемов, над ними
    кружатся искры дезориентации.; Звук (Web Audio): Громкий праздничный хлопок петарды
    с шелестом осыпающегося серпантина и восторженным ревом карнавальной толпы (''carnival
    roar & party popper pop'').; Камера (импульс/зум): Короткая радиальная встряска
    камеры (шейк 0.2 с, магнитуда 0.4), мягкое свечение bloom на частицах конфетти.;
    UI/Тактильность: Индикатор конусов стражи в радиусе облака заменяется на знаки
    вопроса ''???''; четкий щелчок и сочная вибрация (50 мс) при активации.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
gameplay_systems:
- name: Система обнаружения и конусов видимости стражи
  purpose: Расчет видимости вора с учетом угла обзора патрулей, преград и плотности
    окружающей толпы
  input: Координаты вора, луч взгляда стража, препятствия и плотность толпы вокруг
    вора
  rules:
  - Вор в толпе из 3+ танцоров снижает заметность на 88%
  - Бег на спринте удваивает дистанцию обнаружения стражниками
  state:
  - Idle (Патрулирование)
  - Suspicious (Подозрение)
  - Alert (Тревога / Преследование)
  interactions: ''
  feedback: Цвет конуса меняется с мягкого бирюзового на настороженный желтый и критический
    красный со свистком тревоги
  edge_cases:
  - 'Стражник на краю платформы: если он падает за борт, статус тревоги снимается'
  - 'Вор попадает под прожектор во время танца: плавное нарастание тревоги за 0.8с
    вместо мгновенного обнаружения'
- name: Система динамического потока толпы (Crowd Flocking System)
  purpose: Симуляция сотен танцоров, формирующих живые движущиеся укрытия для вора
  input: Векторные поля направления шествия платформ и препятствия окружения
  rules:
  - Танцоры движутся по заданным карнавальным сплайнам со скоростью 3.8 м/с
  - При падении тела стражника толпа смыкается над ним через 1.2 с, скрывая следы
  state:
  - Cohesive (Плотный строй)
  - Dispersed (Испуг / Рассеивание)
  - Cheering (Празднование)
  interactions: ''
  feedback: Плавное органическое огибание препятствий и синхронные движения рук ряженых
  edge_cases:
  - 'Разрыв строя толпы при взрыве петарды: временное рассеивание NPC на 3 секунды'
- name: Система ритмической синхронизации звука и действий (Beat Sync Engine)
  purpose: Привязка боевых таймингов, маскировки и бонусов счета к темпу музыки шествия
  input: Web Audio текущее время воспроизведения трека (currentTime)
  rules:
  - Действия, совершенные в окне +/-0.18 с от сильной доли, считаются идеальными (In-Beat)
  - Идеальные действия не создают акустического шума для стражи
  state:
  - BeatOn
  - BeatOff
  - DropClimax
  interactions: ''
  feedback: Пульсация латунных фонарей и золотистый отклик интерфейса метронома
  edge_cases:
  - 'Падение частоты кадров: тайминги не сбиваются, так как отсчитываются от AudioContext'
- name: Система физического взаимодействия и Ragdoll-сброса
  purpose: Расчет динамического отбрасывания стражников при успешном парировании и
    пинках
  input: Коллизии клинка вора с оружием стражника, триггеры границ платформ
  rules:
  - Парирование переводит врага в состояние Ragdoll с импульсом 14.5 Н*с
  - Тела, упавшие с высоты платформы в толпу, удаляются из симуляции боя
  state:
  - KinematicGuard
  - Staggered
  - DynamicRagdoll
  interactions: ''
  feedback: Металлический звон, взрыв медных искр и реалистичное падение тела в толпу
  edge_cases:
  - 'Застревание тела в бортах платформы: автоматический импульс скатывания за пределы
    геометрии'
core_design:
  signature_moment: 'Кульминационный момент забега: на пике музыкального дропа шествия
    (01:15 трека) на верхней платформе Медного Левиафана игрок в последний момент
    перед ударом алебарды элитного гвардейца прожимает идеальное парирование, время
    на 0.06 с замирает под сноп медных искр, после чего персонаж с разворота вколачивает
    сапог в раскрытую кирасу врага. Тяжелый страж срывается в ragdoll-полет через
    фальшборт прямо в танцующую толпу внизу под оглушительный взрыв салютов и золотых
    конфетти, а игрок, подхватив сияющий Золотой Тотем, на полной инерции влетает
    в темный переулок за 2 секунды до финала трека.'
  genre_template_rejected: 'Отказ от статичного «кустового» стелса с долгим выжиданием
    в укрытиях (Assassin''s Creed / Commandos) и медленного тактического микроменеджмента
    с паузой. В нашей игре платформа шествия непрерывно движется вперед со скоростью
    2.6 м/с, а толпа танцоров представляет собой динамический физический поток. Игрок
    не сидит на месте по 2 минуты, а находится в непрерывном ритмическом движении
    и ''серфит'' между группами танцоров. Также осознанно отвергнут жесткий rhythm-gate
    из традиционных ритм-игр (где промах мимо доли полностью блокирует действие или
    останавливает персонажа): базовое фехтование и перемещение работают отзывчиво
    в реальном времени, а попадание в BPM дает взрывное ускорение, бесшумность и визуальный
    стиль.'
  what_makes_it_different: 'Синтез изометрического социального стелса в динамически
    движущемся потоке танцоров (boids crowd system) и ритмического слэшера с физическим
    ragdoll-сбросом врагов с движущихся платформ. Игрок не прячется в темных углах,
    а находится в центре карнавала, превращая ограбление в хореографический фехтовальный
    танец: скрытные удары и парирования синхронизированы с BPM трека шествия, а транспортировка
    тяжелого тотема меняет физику движения героя на инерционный таран.'
  micro_loop:
  - step: 'M-01: Сканирование конусов и ритма'
    player_action: Оценка конусов видимости стражи и визуальных пульсаций ритма в
      окружении
    game_response: Отображение конусов обзора патрульных (желтый/красный), пульсация
      неоновых фонарей платформ в такт музыке
    decision: Определить безопасный коридор движения и подстроиться под ритмическую
      долю шествия (BPM 120-135)
    duration: 0.3-0.5 с
  - step: 'M-02: Вход в поток танцоров'
    player_action: Перемещение персонажа в центр группы из >=3 танцоров карнавала
    game_response: Активация лазурной ауры маскировки, приглушение звуков low-pass
      фильтром (800 Гц), снижение заметности героя на 85%
    decision: Смешаться с текущей группой танцоров или совершить рывок к следующей
      платформе
    duration: 0.5-1.0 с
  - step: 'M-03: Ритмический скрытный выпад'
    player_action: Нажатие атаки со спины точно в сильную долю музыкального трека
    game_response: Мгновенный рывок рапиры на 2.2 м, распад стражника на золотые конфетти,
      +1 заряд Карнавального Куража (Fervor)
    decision: Ударить немедленно или выждать 0.15 с до сильной доли для бесшумного
      растворения тела в конфетти
    duration: 0.2-0.4 с
  - step: 'M-04: Парирование и ragdoll-сброс'
    player_action: Реактивное нажатие блока за 0.18 с до удара алебарды с последующим
      пинком
    game_response: Хитстоп 0.06 с, вспышка медных искр, оглушение стража на 1.2 с,
      силовой пинк с импульсом 14.5 м/с и полет тела в толпу внизу
    decision: Уклониться назад или парировать в упор ради ragdoll-сброса стража за
      борт платформы
    duration: 0.3-0.6 с
  - step: 'M-05: Инерционный маневр с тотемом'
    player_action: Коррекция вектора движения с тяжелым тотемом в руках в темпе шествия
    game_response: Набор инерции разгона до 5.5 м/с, левитация тотема при шагах в
      такт музыки (-70% штрафа массы), сбивание легких стражей
    decision: Продолжать разгон по прямой сквозь заслон или свернуть на боковой помост
      платформы
    duration: 0.5-1.0 с
  meso_loop:
  - step: 'E-01: Эшелон I — Медный Авангард (Проникновение)'
    player_action: Проникновение на первый эшелон («Медный Авангард»), маскировка
      в танцорах, скрытные выпады рапирой
    game_response: Движение поезда-эшелона, редкие патрульные с широкими конусами
      обзора (60°), обучение ритму трека шествия
    decision: Двигаться скрытно в толпе для накопления комбо Fervor x4 или ликвидировать
      одиночного стража со спины для получения хлопушки
    duration: 25-35 с
  - step: 'E-02: Эшелон II — Левиафан Оркестра (Кульминация и Кража)'
    player_action: Подъем на крышу второго эшелона («Левиафан Оркестра»), парирование
      атак офицеров, взлом пьедестала и захват Золотого Тотема
    game_response: Плотные перекрестные прожекторы фонарщиков, появление тяжелых алебардщиков,
      ускорение темпа музыки до 130 BPM
    decision: Обойти элитных стражей по карнизу вагона или сбросить офицера пинком
      в толпу на музыкальном дропе ради среза пути
    duration: 35-45 с
  - step: 'E-03: Эшелон III — Транспортный Кортеж (Прорыв и Побег)'
    player_action: Транспортировка тотема через платформы третьего эшелона («Кортеж
      Гвардии»), таран заслонов и прыжок в переулок эвакуации
    game_response: Включение общей тревоги, стягивание резервов гвардии, нарастание
      финального крещендо трека с приближением переулка
    decision: Использовать хлопушку для ослепления заслона или таранить строй гвардии
      на полной инерции тотема в такт музыке
    duration: 30-40 с
  macro_loop:
  - step: 'A-01: Подготовка к вылазке в Убежище Воров'
    player_action: Экипировка клинка, карнавальной маски и плаща в Убежище Воров
    game_response: Отображение карты эшелонов шествия, модификаторов тревоги, активного
      темпа музыки (BPM) и доступных слотов снаряжения
    decision: Выбрать рапиру под узкие окна парирования или стилет с бонусом к бесшумному
      радиусу, а также маску под тип патрулей ночного маршрута
    duration: 15-25 с
  - step: 'A-02: Карнавальный забег по эшелонам'
    player_action: Прохождение 3 платформ-эшелонов, скрытные ликвидации, парирования,
      кража тотема и побег в переулок
    game_response: Динамическая симуляция трех движущихся платформ-эшелонов, физика
      толпы, конусы обзора патрулей, нарастание тревоги и звучание трека шествия
    decision: Балансировать между идеальным скрытным прохождением ради максимального
      Куража (Fervor x4) и агрессивным сбросом стражей для экономии секунд трека
    duration: 90-120 с
  - step: 'A-03: Расчет добычи и рейтинга стиля'
    player_action: Просмотр экрана итогов ограбления и подсчета карнавального золота
    game_response: Подсчет очков стиля, карнавальной добычи, расчет бонуса за идеальные
      ритмические действия и вывод итогового ранга (от 'Уличный оборванец' до 'Призрак
      Карнавала')
    decision: Оценить полученный ранг стиля и решить, на что потратить золотую пыль
      в первую очередь
    duration: 5-10 с
  - step: 'A-04: Мета-прогрессия и развитие арсенала'
    player_action: Прокачка снаряжения и открытие новых маршрутов в меню гильдии воров
    game_response: Разблокировка новых стилетов, масок мистификатора, перков левитации
      тотема и доступ к более сложным эшелонам шествия с элитной гвардией
    decision: Инвестировать ресурсы в покупку новых клинков с модификаторами импульса,
      улучшение масок или разблокировку опасных ночных маршрутов шествия
    duration: 15-30 с
  loop_diagram: "+-----------------------------------------------------------------------------------+\n\
