  filename: PROJECT_KNOWLEDGE_SKILL.md
  purpose: 'Документы базы знаний, выбранные куратором именно под эту игру: Проект
    опирается на физику Rapier3D, процедурный риг и меши стимпанк-шествия, стелс с
