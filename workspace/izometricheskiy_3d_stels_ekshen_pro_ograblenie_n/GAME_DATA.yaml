    флоу, предельно отзывчив на мобильных тапах и клавиатуре, не требует тяжелых физических
    расчетов и мгновенно вовлекает игрока с первой секунды без обучения.'
  rejected_reasons:
  - 'D2 (Тени Фестиваля: Клинок и Эшелон) отвергнут из-за риска перегрузки физического
    движка Rapier3D в браузере при одновременной симуляции рэгдоллов стражи и толпы
    на подвижных платформах, что вызывает просадки FPS на смартфонах и смещает фокус
    со стелса в хаотичный броулер.'
  - 'D3 (Теневой Кортеж: Мастер Засад) отвергнут из-за риска затянутого и пассивного
    темпа: классическое выжидание патрулей в укрытиях убивает драйв праздничного карнавала
    и приводит к провисанию динамики в коротких браузерных сессиях.'
  what_it_is_not:
  - Волны врагов на замкнутой арене и авто-атака по толпе в стиле Vampire Survivors
    / Brotato.
  - Окно выбора из трех случайных карт апгрейдов и пассивных карточных перков.
  - Шутер с огнестрельным оружием — бой ведется строго оружием ближнего боя в руках
    (стилет, клинок).
  - Пассивный стелс с бесконечным выжиданием в статичных укрытиях.
  - Серые кубы и примитивы вместо красочной стилизованной карнавальной геометрии,
    иллюминации и конфетти.
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - заимствование Vampire Survivors / Brotato как основы
  - серые кубы вместо стилизованной геометрии
  non_negotiables:
  - Оружие ближнего боя в руках вора (стилет/клинок) для скрытных добиваний со спины
    и парирования при близком контакте.
  - Система стелса с динамическими конусами видимости стражи и механикой укрытия в
    движущихся группах танцоров.
  - Синхронизация перемещения и атак холодным оружием с ритмом карнавальной музыки
    (действия на сильную долю маскируют шум и дают преимущество).
  - Изометрическая 3D-камера с читаемым обзором праздничной площади, карнавальных
    платформ и летящих конфетти.
  - Цельная цель сессии — похищение тяжелого золотого тотема и побег с ним сквозь
    процессию в переулок до окончания музыкального трека шествия.
  signature_scene: Вор в развевающемся плаще на гребне механической платформы парирует
    алебарду стражника и точным пинком сбрасывает его в бурлящую массу ряженых внизу.
  avoid_references:
  - Vampire Survivors (запрет бесконечных авто-атак по орде и окон прокачки)
  - Brotato (запрет замкнутых монотонных комнат-арен с таймером волн)
  - Assassin's Creed (запрет открытого мира и бесконечного паркура по крышам)
  - Hitman (запрет огнестрельного оружия, снайперских винтовок и смены маскировки)
  - Subway Surfers (запрет бесконечного раннера по трем выделенным линиям)
