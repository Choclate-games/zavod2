  tension_curve: 'Волнообразная кривая с 3 пиками нарастания и взрывной развязкой:

    1. Фаза внедрения (0-25 с, 1-й эшелон): Напряжение низкое (20-40%). Игрок осваивает
    ритм шествия, скользит в толпе танцоров, совершает 1-2 бесшумных выпада рапирой,
    собирая комбо Fervor x2.

    2. Фаза подъема и кульминации кражи (25-70 с, 2-й эшелон): Напряжение высокое
    (60-85%). Перекрестные прожекторы, появление офицеров с алебардами. Игрок балансирует
    между парированием и стелсом. Момент захвата тотема на 65-й секунде взвинчивает
    тревогу до 90% и запускает глобальные сирены.

    3. Фаза побега и взрывного дропа (70-120 с, 3-й эшелон): Напряжение предельное
    (90-99%). Игра переходит в динамичный ритм-раннер с тяжелым тотемом наперевес.
    Игрок сбивает заслоны на инерции, бросает хлопушки в прожекторы и на последних
    секундах трека совершает прыжок в переулок, где напряжение мгновенно падает до
    нуля в тишине победы.'
  core_formulas:
  - 'Скорость обнаружения стражей: AlertRate = BaseAlertRate * (1 - CrowdDensity *
    MaskCamouflageCoeff) * LightFactor, где BaseAlertRate = 222%/с (время до полной
    тревоги 0.45 с), CrowdDensity = min(1.0, NearbyDancers / 3), MaskCamouflageCoeff
    = 0.85 в маске, LightFactor = 1.0 (обычный) или 1.6 (луч прожектора фонарщика).'
  - 'Окно сильной доли ритма: BeatAccuracy = max(0.0, 1.0 - |t_input - t_beat| / 0.15),
    где при BeatAccuracy >= 0.8 удар признается идеальным (Perfect Beat), ликвидация
    абсолютно бесшумна, дает +1 заряд Карнавального Куража (Carnival Fervor).'
  - 'Урон и бесшумность выпада: StabDamage = BaseDamage * (1.0 + 1.5 * BeatAccuracy)
    * (IsBehind ? 3.0 : 1.0), при этом радиус шума NoiseRadius = IsBehind && BeatAccuracy
    >= 0.8 ? 0.0 м : (IsBehind ? 3.0 м : 6.0 м).'
  - 'Физика ragdoll-импульса при парировании: KickImpulse = BaseImpulse * (1.0 + ParryAccuracyBonus)
    * (1.0 / GuardMassRatio), где BaseImpulse = 14.5 м/с, ParryAccuracyBonus = 0.35
    при парировании за 0.05 с до удара, GuardMassRatio = 1.0 для стража, 1.4 для офицера,
    2.0 для автоматона.'
  - 'Скорость и инерция транспортировки тотема: CurrentSpeed = BaseSpeed * (1.0 -
    (TotemWeight * (IsBeatSynced ? 0.3 : 1.0) / MaxCarryCapacity)) * (0.6 + 0.4 *
    MomentumProgress), где BaseSpeed = 5.5 м/с, TotemWeight = 40 кг, MaxCarryCapacity
    = 100 кг, IsBeatSynced снижает штраф массы на 70%, MomentumProgress копится за
    1.4 с движения по прямой.'
  - 'Глобальная тревога эшелона: TotalAlarm = min(100%, TotalAlarm + UnmaskedKillAlert
    * (1.0 - MusicLoudnessMask) + GuardScreamAlert), где MusicLoudnessMask = 0.7 во
    время кульминации дропа трека, снижая приток тревоги.'
  run_progression:
  - 'Шкала «Карнавального Куража» (Carnival Fervor x1 -> x4): за каждую скрытную ликвидацию
    и парирование в такт музыки множитель растет, увеличивая радиус маскировки в толпе
    и наделяя шаги легким фазовым скольжением сквозь танцоров.'
  - 'Сбор карнавальных хлопушек (Confetti Charges): нахождение праздничных петард
    на платформе (до 2 зарядов) для мгновенного создания дымовой завесы и ослепления
    элитных офицеров.'
  - 'Ритмический резонанс тотема (Totem Harmony): при непрерывном беге точно в такт
    трека тотем активирует антигравитационные руны, теряя 70% веса и превращаясь в
    сокрушительный таран.'
  meta_progression:
  - 'Арсенал Дуэлянта (Клинки): Стилет «Тихий Карнавал» (+50% к окну скрытного удара
    со спины), Венецианская Рапира (+25% к импульсу ragdoll-сброса), Шпага «Вивальди»
    (расширенное окно идеального парирования в слабую долю).'
  - 'Гардероб Мистификатора (Маски и Костюмы): Маска Шута (мгновенный вход в маскировку
    при плотности толпы всего в 2 NPC), Плащ Полуночи (-40% заметности под лучами
    прожекторов), Эфирные Сапоги (-30% штрафа скорости при переноске тяжелого тотема).'
  - 'Ночные Маршруты Шествия: Открытие усложненных уровней («Парад Медного Дракона»,
    «Венецианский Затопленный Кортеж», «Ночь Инквизиции») с новыми механиками окружения
    (паровые гейзеры, фейерверки, прожекторы дирижаблей).'
  mechanics:
  - name: Динамическая маскировка в потоке танцоров
    role_in_loop: двигатель скрытности и тактического позиционирования (базовый инструмент
      выживания и преодоления зон наблюдения)
    player_decision: Влиться ли в текущую медленно движущуюся группу танцоров для
      100% маскировки перед конусом стража или совершить рискованный рывок через открытую
      платформу к стенду с тотемом.
    input_mapping: 'ПК: Клавиши WASD для движения в центр группы танцоров, удержание
      Space для синхронизации скорости с потоком (2.6 м/с); Мобильные: Виртуальный
      джойстик направления + удержание зоны ''Шаг шествия'' для автоматической подстройки
      темпа.'
    states:
    - 'unmasked_exposed: Вне толпы, видимость 100%, обнаружение стражей за 0.45 с
      при попадании в конус обзора'
    - 'entering_crowd: Переходное состояние (0.25 с), сближение с группой из минимум
      3 NPC-танцоров'
    - 'blended_in_rhythm: Полная маскировка в радиусе 1.8 м от центра группы, заметность
      снижена на 85%, конусы стражей игнорируют героя'
    - 'rhythm_desync_warning: Движение быстрее скорости шествия (>3.8 м/с) или толчки
      танцоров — подозрение стражи растет со скоростью 30%/с'
    parameters:
    - name: Минимальный размер группы танцоров
      value: 3 NPC
      tuning_note: При 2 NPC маскировка срабатывает случайно в любых углах; при 4+
        NPC на платформах не хватает места для укрытия.
    - name: Радиус эффективной зоны маскировки
      value: 1.8 м
      tuning_note: При 1.2 м игрок постоянно выпадает из толпы при маневрах; при 2.5
        м исчезает ощущение тесного праздничного потока.
    - name: Скорость движения шествия платформ
      value: 2.6 м/с
      tuning_note: При увеличении до 3.8 м/с игрок не успевает оценивать конусы стражи;
        при 1.5 м/с темп игры провисает.
    - name: Базовое время обнаружения вне толпы
      value: 0.45 с
      tuning_note: При 0.2 с игра превращается в непрощающий пиксель-хантинг; при
        1.0 с пропадает напряжение открытых зон.
    - name: Снижение заметности в маскировке
      value: 85%
      tuning_note: При 100% стража кажется слепой даже в упор; при 60% социальный
        стелс теряет смысл.
    feedback_layers:
    - 'Визуал/VFX: Силуэт героя окрашивается в полупрозрачный лазурный оттенок карнавального
      плаща; вокруг ног стелется золотая пыльца и кружатся маски; конусы стражей при
      наведении на замаскированную группу блекнут, теряют резкость и прозрачность
      на 70%.'
    - 'Звук (Web Audio): Включение полосового low-pass фильтра (срезан верх выше 800
      Гц), фоновый гул карнавала приглушается, а на передний план выходит пульсирующий
      саб-бас и звонкий стук кастаньет в темпе шествия.'
    - 'Камера (импульс/зум): Плавное отдаление камеры (FOV расширяется с 50° до 56°,
      высота подъема +1.2 м), открывая панорамный обзор на следующие платформы кортежа.'
    - 'UI/Тактильность: Индикатор над головой героя плавно переключается с раскрытого
      глаза на театральную полумаску; короткий мягкий вибро-импульс (20 мс, 40% мощности)
      при успешной фиксации маскировки.'
    failure_mode: Игрок совершает резкий рывок со спринтом (>4.2 м/с) или расталкивает
      танцоров, выбегая прямо в луч прожектора стражника. Мгновенный звуковой скрежет
      карнавальной сирены, конус обзора вспыхивает багровым цветом, статус скрытности
      сбрасывается на EXPOSED, шкала тревоги стража заполняется до 100% за 0.45 с.
    mastery_curve: Новичок на 30-й секунде жмется к статичным группам танцоров и пропускает
      тайминги движения платформ. Эксперт на 10-м забеге непрерывно 'серфит' между
      движущимися потоками на предельной скорости 3.0 м/с, меняя группы за доли секунды
      и обходя перекрестные прожекторы без единого процента тревоги.
    counterplay: Элитные офицеры с карнавальными факелами, разгоняющие танцоров в
      радиусе 3.0 м перед собой; узкие переходы между платформами, где толпа рассеивается
      на 2-3 секунды; патрульные собаки-автоматоны, чующие запах вне зависимости от
      толпы в радиусе 2.0 м.
    synergies:
    - 'Ритмический скрытный выпад: идеальный укол рапирой прямо из толпы не рассеивает
      танцоров и сохраняет статус маскировки.'
    - 'Инерционная транспортировка тотема: в плотной толпе (>5 танцоров) золотое свечение
      реликвии маскируется праздничными стягами.'
    why_unique: В отличие от классических статичных стогов сена или кустов, толпа
      представляет собой живую динамическую систему boids-частиц на движущемся стимпанк-поезде,
      пульсирующую в такте музыки карнавала.
    pseudocode: "function update_crowd_stealth(player, crowd_boids, guards, dt):\n\
      \  nearby_dancers = crowd_boids.filter(d => distance(player.pos, d.pos) <= 1.8)\n\
      \  if len(nearby_dancers) >= 3 and player.velocity.length() <= 3.0:\n    player.stealth_state\
      \ = 'BLENDED'\n    player.visibility_factor = 0.15\n    audio_engine.set_lowpass_filter(800.0)\n\
      \  else:\n    player.stealth_state = 'EXPOSED'\n    player.visibility_factor\
      \ = 1.0\n    audio_engine.reset_filter()\n  for guard in guards:\n    if guard.can_see(player.pos,\
      \ player.visibility_factor):\n      guard.alert_level += (dt / 0.45) * 100.0"
  - name: Ритмический скрытный выпад рапирой
    role_in_loop: двигатель комбо-серий и мгновенного устранения препятствий на пути
      к цели
    player_decision: Нанести удар немедленно с риском поднять локальный шум или выждать
      0.15 с до сильной доли такта для абсолютно бесшумной ликвидации с получением
      заряда Куража.
    input_mapping: 'ПК: ЛКМ (клик в сторону подсвеченного стража); Мобильные: Тап
      по иконке выпада или быстрый направленный свайп в сторону врага.'
    states:
    - 'ready_locked: Рапира наготове, цель в радиусе 2.2 м со спины подсвечена фиолетовой
      меткой уязвимости (угол атаки >120°)'
    - 'lunging_thrust: Стремительный рывок вперед на 2.2 м за 0.12 с с пронзающим
      уколом'
    - 'perfect_beat_kill: Удар совершен в окно ±0.15 с сильной доли: бесшумное растворение
      тела в конфетти, +1 заряд Куража (Fervor)'
    - 'offbeat_kill: Удар мимо доли: шумный срез, вскрик стража (радиус шума 6.0 м),
      тело падает тяжелым ragdoll''ом'
    parameters:
    - name: Окно сильной доли трека (BPM 120-135)
      value: ±0.15 с
      tuning_note: При ±0.08 с ритм становится слишком хардкорным для экшена; при
        ±0.25 с исчезает чувство ритмического мастерства.
    - name: Дистанция выпада рапиры
      value: 2.2 м
      tuning_note: При 1.4 м игрок постоянно недолетает до патрульного; при 3.5 м
        механика превращается в читерский телепорт.
    - name: Сектор атаки со спины
      value: 135 градусов
      tuning_note: При 90 градусах трудно попасть на углах обзора; при 180 градусах
        стражника можно бить почти в профиль без стелса.
    - name: Радиус шума при неритмичном ударе
      value: 6.0 м
      tuning_note: При 3.0 м ошибка не наказывается; при 10.0 м любая погрешность
        сразу поднимает тревогу всей платформы.
    - name: Длительность анимации выпада
      value: 0.18 с
      tuning_note: При 0.4 с темп боя замедляется; при 0.08 с анимация выглядит дерганной
        и неестественной.
    feedback_layers:
    - 'Визуал/VFX: Яркий золотисто-неоновый шлейф лезвия рапиры, рассыпание побежденного
      стража на сверкающие карнавальные конфетти и серпантин при ритмичном ударе;
      вспышка текста ''PERFECT BEAT'' золотом над головой.'
    - 'Звук (Web Audio): Сочный хруст пробития шелка и брони, акцентированный звонким
      ударом оркестровой тарелки и малого барабана точно в сильную долю музыкального
      трека.'
    - 'Камера (импульс/зум): Микро-хитстоп на 0.04 с с динамическим радиальным размытием
      (radial blur 0.35) и резким толчком камеры вперед по направлению укола на 0.25
      м.'
    - 'UI/Тактильность: Кольцевой ритм-прицел вокруг цели схлопывается в точку в момент
      удара; плотная сочная вибрация (60 мс, 90% мощности) на мобильных устройствах.'
    failure_mode: 'Игрок наносит удар в лицо стражу или не попадает в сильную долю
      (ошибка >0.15 с) рядом с другими патрульными: раздается металлический лязг парированной
      алебарды, стражник издает тревожный крик (радиус шума 6.0 м), а шкала глобальной
      тревоги подпрыгивает на +35%.'
    mastery_curve: Новичок наносит удары хаотично вне ритма, поднимая постоянный шум
      и вступая в затяжные драки. Эксперт за 2 музыкальных такта (3.0 с) выполняет
      каскад из 3 ритмических выпадов, зачищая весь вагон эшелона без единого звукового
      всплеска.
    counterplay: Стражи в кирасах с тыловыми зеркалами (замечают выпад со спины на
      дистанции ближе 1.0 м); патрули, идущие парами спина к спине; барабанщики, сбивающие
      ритм ложными акцентами.
    synergies:
    - 'Динамическая маскировка: атака из толпы в сильную долю не тревожит танцоров
      и сохраняет статус маскировки.'
    - 'Тактическое парирование: неудачный или замеченный выпад можно моментально сканселить
      в защитную стойку парирования.'
    why_unique: 'Устранение врага синхронизировано с ритм-движком шествия: попадание
      в такт превращает смертоносный удар в элемент праздничного шоу, маскируя звук
      выстрелом салюта или ударом тарелок.'
    pseudocode: "function execute_stealth_thrust(player, target_guard, beat_engine):\n\
      \  time_to_beat = beat_engine.get_nearest_beat_delta()\n  angle_to_back = dot(player.forward,\
      \ target_guard.forward)\n  if distance(player.pos, target_guard.pos) <= 2.2\
      \ and angle_to_back > 0.5:\n    if abs(time_to_beat) <= 0.15:\n      target_guard.silent_eliminate_vfx_confetti()\n\
      \      player.add_fervor_charge(1)\n      audio_engine.play_beat_accent('cymbals_stab')\n\
      \    else:\n      target_guard.noisy_ragdoll_kill()\n      alert_system.emit_sound_ripple(player.pos,\
      \ radius=6.0)\n      audio_engine.play_sfx('offbeat_slash')"
  - name: Тактическое парирование и ragdoll-сброс
    role_in_loop: источник риска и высокой награды (агрессивная защита и зрелищная
      зачистка тяжелых бронированных противников)
    player_decision: Уклониться назад в толпу от замаха тяжелой алебарды или подпустить
      лезвие в упор, чтобы идеальным блоком открыть окно для пинка и сбросить элитного
      офицера с платформы в бездну шествия.
    input_mapping: 'ПК: ПКМ (короткое нажатие в момент атаки) -> Пробел для пинка;
      Мобильные: Кнопка ''Парирование'' по таймингу -> Свайп вверх для силового пинка.'
    states:
    - 'guard_windup: Враг входит в фазу неблокируемого замаха алебарды (0.45 с замаха
      с красным бликом лезвия)'
    - 'parry_active_window: Активное окно парирования игрока (0.18 с до момента удара)'
    - 'guard_break_stun: Успешное отражение — страж теряет равновесие на 1.2 с, кираса
      раскрыта для добивания'
    - 'ragdoll_eject_kick: Силовой пинок сапогом с передачей импульса 14.5 м/с — враг
      улетает в ragdoll-физике через борт платформы в толпу внизу'
    parameters:
    - name: Окно идеального парирования
      value: 0.18 с
      tuning_note: При 0.10 с парировать на сенсорном экране почти невозможно; при
        0.30 с бой теряет всякий вызов и риск.
    - name: Импульс пинка ragdoll-сброса
      value: 14.5 м/с
      tuning_note: При 8.0 м/с стражник вяло падает под ноги; при 22.0 м/с улетает
        как ракета сквозь текстуры.
    - name: Длительность оглушения после блока
      value: 1.2 с
      tuning_note: При 0.6 с игрок не успевает сориентироваться на пинок; при 2.0
        с игра кажется слишком медленной.
    - name: Угол сектора отражения удара
      value: 110 градусов
      tuning_note: При 60 градусах тяжело парировать при боковых атаках; при 180 градусах
        парируются удары со спины.
    - name: Штраф замах-промаха (recovery)
      value: 0.35 с
      tuning_note: При 0.15 с спам парирования становится доминирующей стратегией;
        при 0.6 с любая ошибка гарантирует 100% смерть.
    feedback_layers:
    - 'Визуал/VFX: Взрывной сноп медных искр в точке контакта клинков, ударная кольцевая
      волна по настилу платформы, шлейф золотой пыли и разлетающиеся заклепки брони
      при полете тела в бездну.'
    - 'Звук (Web Audio): Звонкий стальной лязг клинков (''heavy metal clash'') с мгновенным
      басовым саб-дропом (sub-bass 60 Гц) при пинке и затухающим криком улетающего
      вниз стража.'
    - 'Камера (импульс/зум): Динамический зум на 15% во время хитстопа (0.06 с) с
      последующим кинематографичным панорамированием за траекторией полета ragdoll-тела.'
    - 'UI/Тактильность: Яркая белая вспышка виньетки по периметру экрана; сдвоенный
      мощный виброотклик: резкий короткий (40 мс) на парировании и глубокий тяжелый
      (90 мс) на пинке.'
    failure_mode: 'Игрок нажимает парирование слишком рано (в фазе замаха врага) и
      ловит задержку восстановления 0.35 с: алебарда наносит тяжелый урон (1 из 3
      жизней), игрок отлетает назад с оглушением на 0.5 с.'
    mastery_curve: Новичок боится тайминга и пятится назад, получая удары в спину
      от преследователей. Эксперт провоцирует двух офицеров одновременно, парирует
      удар на сильную долю и одним пинком сбивает обоих через фальшборт платформы
      прямо в танцующую толпу.
    counterplay: Капитаны гвардии с двуручными молотами, требующие парирования двух
      ударов подряд; глухие ограждения вагонов без открытых проемов для сброса; лучники
      на верхних мостиках, стреляющие во время парирования.
    synergies:
    - 'Ритмический скрытный выпад: парирование точно на сильную долю такта сохраняет
      и продлевает серию Карнавального Куража (Fervor x4).'
    - 'Инерционная транспортировка тотема: сброшенный офицер расчищает узкий мостик
      для беспрепятственного побега с реликвией.'
    why_unique: Парирование не просто вычитает здоровье из полоски врага, а переводит
      тяжелого противника в режим ragdoll-физики с возможностью направить его полет
      пинком за борт движущегося поезда-эшелона.
    pseudocode: "function handle_parry_input(player, incoming_attacks, dt):\n  for\
      \ attack in incoming_attacks:\n    if attack.time_to_impact <= 0.18 and player.is_facing(attack.origin,\
      \ 110.0):\n      player.trigger_hitstop(0.06)\n      attack.attacker.apply_stun(1.2)\n\
      \      vfx_engine.spawn_clash_sparks(player.pos, attack.impact_point)\n    \
      \  audio_engine.play_sub_drop_parry()\n      return PARRY_SUCCESS\n  player.enter_parry_recovery(0.35)\n\
      \  return PARRY_MISSED"
  - name: Инерционная транспортировка тяжелого тотема
    role_in_loop: тормоз темпа и кульминационный источник напряжения (фаза побега
      и эвакуации)
    player_decision: Тащить тотем по прямой сквозь встречный поток гвардии, используя
      инерцию как таран, или лавировать через боковые платформы, тратя драгоценные
      секунды трека.
    input_mapping: 'ПК: Клавиши WASD для управления вектором тяги + Shift для инерционного
      таранного рывка; Мобильные: Наклон виртуального стика с учетом заноса + кнопка
      ''Таранный рывок''.'
    states:
    - 'stationary_lift: Подъем тотема с пьедестала (0.8 с анимация, активация сирен
      эшелона)'
    - 'heavy_carrying: Базовое перемещение с тяжелым грузом: скорость 3.2 м/с, увеличенный
      радиус разворота'
    - 'momentum_charge: Разгон по прямой в течение 1.4 с: скорость возрастает до 5.5
      м/с, тотем таранит легких стражей'
    - 'rhythm_levitation: Перемещение строго в ритм шествия: тотем активирует левитацию,
      снижая штраф веса на 70%'
    parameters:
    - name: Штраф базовой скорости при переноске
      value: 35%
      tuning_note: При 15% тотем не ощущается тяжелой реликвией; при 60% побег превращается
        в мучительное ползание.
    - name: Время разгона до максимальной инерции
      value: 1.4 с
      tuning_note: При 0.5 с инерция превращается в обычный спринт; при 3.0 с невозможно
        разогнаться на компактных платформах.
    - name: Радиус таранного сбивания стражей на разгоне
      value: 1.6 м
      tuning_note: При 0.8 м игрок цепляется за стражей и стопорится; при 2.5 м игрок
        превращается в неуязвимый танк.
    - name: Бонус левитации при движении в такт музыки
      value: 70%
      tuning_note: При 30% ритмический бонус незаметен; при 100% полностью нивелирует
        штраф веса тотема.
    - name: Угловая скорость разворота с грузом
      value: 120 град/с
      tuning_note: При 60 град/с управление становится неотзывчивым; при 360 град/с
        исчезает физическое ощущение массы реликвии.
    feedback_layers:
    - 'Визуал/VFX: Золотое гравитационное свечение у основания тотема, сноп искр от
      трения о медный настил платформы, искажение горячего воздуха (heat distortion)
      при таранном разгоне.'
    - 'Звук (Web Audio): Глухой тяжелый металлический скрежет по меди платформы, нарастающий
      низкочастотный гул левитационного механизма тотема при попадании в такт музыки.'
    - 'Камера (импульс/зум): Динамическое смещение камеры назад и вниз для усиления
      ощущения кинематографичной массы, легкая вибрация экрана при каждом тяжелом
      шаге с тотемом.'
    - 'UI/Тактильность: Появление шкалы кинетической энергии (Momentum Meter) над
      тотемом; пульсирующая нарастающая вибрация джойстика по мере набора скорости.'
    failure_mode: 'Игрок пытается резко развернуться на 180 градусов перед заслоном
      стражи: из-за инерции тотема персонажа заносит на 1.2 м боком в конус прожектора,
      скорость падает до нуля, и игрок получает удар алебардой.'
    mastery_curve: Новичок хаотично мечется с тотемом, врезается в углы и теряет весь
      разгон. Эксперт выстраивает траекторию по широким плавным дугам строго в такт
      музыки, сбивая на полной скорости патрули и пролетая финальный эшелон за 15
      секунд.
    counterplay: Выдвижные паровые решетки на мостах эшелонов; тяжелые щитоносцы гвардии,
      выстраивающие фалангу и блокирующие лобовой таран; сброс скорости при столкновениях
      с декорациями.
    synergies:
    - 'Динамическая маскировка: в огромной толпе танцоров золотой блеск тотема сливается
      с шествием, снижая радиус обнаружения.'
    - 'Карнавальная конфетти-завеса: бросок хлопушки перед собой позволяет разогнаться
      сквозь ослепленный отряд стражи.'
    why_unique: Тотемы — это не строчка в инвентаре, а физический груз с динамической
      инерцией и ритмической левитацией, кардинально меняющий физику движения персонажа
      в финальной трети забега.
    pseudocode: "function update_totem_physics(player, totem, beat_engine, dt):\n\
      \  is_on_beat = abs(beat_engine.get_nearest_beat_delta()) <= 0.15\n  weight_penalty\
      \ = is_on_beat ? (totem.weight * 0.3) : totem.weight\n  max_speed = 5.5 - (weight_penalty\
      \ * 0.4)\n  if player.is_moving_straight:\n    player.momentum = min(player.momentum\
      \ + dt * 1.5, 1.0)\n  else:\n    player.momentum = max(player.momentum - dt\
      \ * 2.0, 0.0)\n  player.velocity = player.forward * (max_speed * (0.6 + 0.4\
      \ * player.momentum))\n  if player.momentum >= 0.8:\n    check_ram_collisions_with_guards(player.pos,\
      \ radius=1.6)"
  - name: Карнавальная конфетти-завеса и хлопушки отвлечения
    role_in_loop: источник тактической гибкости и аварийный предохранитель (контроль
      толпы и экстренный сброс агро)
    player_decision: Использовать ли ограниченный заряд хлопушки сейчас для безопасного
      прохода мимо двух элитных фонарщиков или сохранить заряд на финальный прорыв
      к переулку эвакуации.
    input_mapping: 'ПК: Клавиша E или Q (бросок под себя/в точку курсора); Мобильные:
      Отдельная круглая кнопка хлопушки справа над кнопкой атаки.'
    states:
    - 'ready_charged: В запасе есть 1-2 карнавальные хлопушки'
    - 'detonation: Мгновенный взрыв в радиусе 3.5 м с ослеплением всех стражей на
      2.5 с'
    - 'confetti_cloud: Зона плотного золотого дыма и блесток держится 4.0 с, блокируя
      все конусы видимости'
    - 'crowd_frenzy: Танцоры карнавала в радиусе облака приходят в экстаз, создавая
      искусственную зону 100% маскировки'
    parameters:
    - name: Радиус облака конфетти-завесы
      value: 3.5 м
      tuning_note: При 2.0 м облако не перекрывает ширину платформы; при 5.5 м делает
        прохождение слишком тривиальным.
    - name: Длительность действия дымовой завесы
      value: 4.0 с
      tuning_note: При 2.0 с игрок не успевает пронести тотем; при 7.0 с стражники
        полностью выключаются из игры.
    - name: Длительность ослепления стражи (stun/blind)
      value: 2.5 с
      tuning_note: При 1.0 с страж сразу атакует вслепую; при 4.5 с пропадает необходимость
        в стелсе.
    - name: Максимальный запас хлопушек в забеге
      value: 2 заряда
      tuning_note: При 1 заряде игрок боится его тратить; при 4 зарядах игра превращается
        в безостановочный спам.
    - name: Радиус привлечения патрулей звуком хлопушки
      value: 8.0 м
      tuning_note: При 4.0 м отвлечение не работает на дальних стражей; при 15.0 м
        сбегается весь эшелон.
    feedback_layers:
    - 'Визуал/VFX: Пышный объемный взрыв сверкающих золотых и пурпурных конфетти с
      клубами цветного дыма; ослепленные стражники закрывают забрала шлемов, над ними
      кружатся искры дезориентации.'
    - 'Звук (Web Audio): Громкий праздничный хлопок петарды с шелестом осыпающегося
      серпантина и восторженным ревом карнавальной толпы (''carnival roar & party
      popper pop'').'
    - 'Камера (импульс/зум): Короткая радиальная встряска камеры (шейк 0.2 с, магнитуда
      0.4), мягкое свечение bloom на частицах конфетти.'
    - 'UI/Тактильность: Индикатор конусов стражи в радиусе облака заменяется на знаки
      вопроса ''???''; четкий щелчок и сочная вибрация (50 мс) при активации.'
    failure_mode: 'Игрок бросает хлопушку прямо в конус замаха офицера без укрытия:
      офицер ослеплен, но завершает круговой удар вслепую, нанося игроку урон.'
    mastery_curve: Новичок тратит хлопушки в панике при первой же случайной тревоге.
      Эксперт бросает хлопушку в точку схождения трех маршрутов патрулей точно на
      музыкальный дроп, собирая всю стражу в одну точку и проскальзывая за спинами.
    counterplay: Офицеры в масках с угольными фильтрами (не слепнут от конфетти, но
      теряют 50% обзора); стимпанк-вентиляторы на крышах левиафанов, сдувающие завесу
      за 1.5 с.
    synergies:
    - 'Динамическая маскировка: конфетти мгновенно переводит даже разрозненных NPC
      в состояние ликующей толпы, создавая укрытие.'
    - 'Инерционная транспортировка тотема: завеса скрывает золотое сияние реликвии
      от стрелков на верхних мостиках.'
    why_unique: Вместо банальной военной дымовой гранаты используется праздничная
      хлопушка, которая не только ослепляет стражу, но и возбуждает толпу танцоров,
      превращая хаос в живое укрытие.
    pseudocode: "function deploy_confetti_bomb(player, bomb_pos, guards, crowd_boids):\n\
      \  if player.confetti_charges > 0:\n    player.confetti_charges -= 1\n    vfx_engine.spawn_confetti_cloud(bomb_pos,\
      \ radius=3.5, duration=4.0)\n    audio_engine.play_party_popper_blast()\n  \
      \  camera.apply_shake(0.2, magnitude=0.4)\n    for guard in guards.in_radius(bomb_pos,\
      \ 3.5):\n      guard.apply_blindness(duration=2.5)\n      guard.investigate_point(bomb_pos)\n\
      \    for dancer in crowd_boids.in_radius(bomb_pos, 3.5):\n      dancer.enter_frenzy_state(duration=4.0)"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 80
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - name: InputLayer
    role: Обработка жестов тача, джойстика, клавиатуры и мыши с буфером ввода 100мс
  - name: AudioBeatLayer
    role: Web Audio трекинг долей BPM и генерация событий BeatTick
  - name: CrowdSimulationLayer
    role: Векторное поле движения танцоров и инстанс-матрицы Three.js
  - name: StealthAndAILayer
    role: Расчет конусов видимости стражей и лучей окклюзии
  - name: CombatPhysicsLayer
    role: Rapier3D коллайдеры оружия, триггеры парирования и рэгдоллы
  - name: RenderSceneLayer
    role: Three.js рендер изометрической сцены, шейдер пара и конфетти
  modules:
  - name: StealthDetectionModule
    path: src/systems/StealthDetection.ts
  - name: RhythmSyncModule
    path: src/systems/RhythmSync.ts
  - name: CrowdInstancedModule
    path: src/render/CrowdInstanced.ts
  - name: CombatParryModule
    path: src/systems/CombatParry.ts
  - name: TotemPhysicsModule
    path: src/systems/TotemPhysics.ts
monetization:
  strategy_summary: 'Ненавязчивая гибридная модель: Rewarded видео для спасения при
    поимке стражей и удвоения награды с тотема, плюс косметические микротранзакции
    масок и скинов рапир.'
  rewarded_placements:
  - id: revive
    name: Второй шанс вора
    benefit: Дымовая завеса, сброс тревоги до 0% и мгновенное продолжение забега
    cooldown_or_limit: 1 раз за забег
    trigger_moment: При достижении 100% тревоги или гибели от стражи
  - id: double_gold
    name: Двойной куш карнавала
    benefit: Удвоение всего вынесенного золота и очков стиля
    cooldown_or_limit: В конце каждого успешного побега
    trigger_moment: Экран победы в переулке
  interstitial_placements:
  - trigger_event: Возвращение в хаб мастерской после 3 забегов
    cooldown_seconds: 90
    conditions: Только между сессиями в хабе мастерской, никогда во время прохождения
      эшелона
  in_app_purchases:
  - sku: pack_venetian_gold
    name: Набор Венецианского Мастера
    description: Уникальная Золотая Маска Сокола + 5000 карнавальных дукатов
    price_tier: $1.99
    reward: Золотая маска (+20% золота) и 5000 монет
  - sku: pack_stiletto_damascus
    name: Дамасский Стилет Теней
    description: Премиальный клинок с неоновым шлейфом конфетти при парировании
    price_tier: $0.99
    reward: Стилет Теней и визуальный VFX след
  fairness_rules:
  - 'Никакого Pay-to-Win: все механики парирования и стелса зависят только от реакции
    игрока'
  - Реклама никогда не прерывает геймплей внутри активного забега
  - Все виды оружия и масок доступны для открытия за внутриигровое золото
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - game distribution
  - browser mobile
  - browser desktop
  initialization_flow:
  - Инициализация Bridge.init()
  - Загрузка сохраненного прогресса из Cloud Storage
  - Синхронизация языка интерфейса и параметров платформы
  - Запуск главного меню шествия
  cloud_save_keys:
  - thief_gold
  - unlocked_blades
  - unlocked_masks
  - high_score_routes
  - audio_volume_settings
  leaderboards:
  - global_carnival_heist_score
  - weekly_shadow_thief_speedrun
  ads_integration:
    banner: false
    interstitial: true
    rewarded: true
  lifecycle_hooks:
  - 'onPause: глушение Web Audio контекста и пауза симуляции'
  - 'onResume: возобновление аудио и таймеров'
  - 'onReward: начисление дукатов или сброс тревоги'
