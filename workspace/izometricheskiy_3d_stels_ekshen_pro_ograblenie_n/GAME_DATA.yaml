  performance_throttling:
  - Автоматическое снижение плотности инстансированной толпы NPC с 150 до 80 на слабых
    мобильных устройствах
  - Отключение динамических теней в пользу предварительно запеченных контактных теней
    под персонажами
  - Ограничение разрешения рендер-таргета Three.js до 1.0x DPR на экранах с высоким
    DPI
audio:
  bgm_tracks:
  - 'Карнавальное Шествие (120 BPM): электро-свинг с живыми духовыми, тяжелым стимпанк-басом
    и четкими акцентами на сильную долю'
  - 'Кульминация на Левиафане (128 BPM): ускоренный ритм с нарастающим боем барабанов
    и медными колоколами'
