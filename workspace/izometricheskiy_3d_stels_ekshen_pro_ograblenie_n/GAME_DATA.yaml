preview_status: completed
definition_of_done:
- Изометрическая 3D сцена Three.js со стилизованной карнавальной площадью и движущимися
  платформами шествия работает на 60 FPS
- Реализовано отзывчивое управление вором на клавиатуре (WASD + мышь) и виртуальном
  сенсорном джойстике
- Функционирует механика маскировки в потоке танцоров с динамическими конусами видимости
  стражников
- Боевая система ближнего боя включает выпады рапирой со спины и парирование атак
  стражи с рэгдолл-сбросом в толпу
- Интегрирован ритмический метроном на базе Web Audio, поощряющий действия на сильную
  долю музыки
- 'Реализована цель сессии: похищение тяжелого золотого тотема и побег через 3 эшелона
  шествия в переулок за 90–120 секунд'
- Интерфейс адаптирован под мобильный и десктопный экраны, включает HUD ритма, индикатор
  скрытности и экраны результатов
- Интегрирован Playgama Bridge 2.x с сохранением прогресса, рекламой за вознаграждение
  и таблицей рекордов
- Соблюден бюджет производительности (draw calls < 80, вес бандла < 4.5 МБ)
- 'Игра осталась тем, что просили: ближний бой оружием в руках.'
- 'Игра осталась тем, что просили: скрытность: игрока не должны заметить.'
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Оценка маршрута и конусов обзора стражи -> Синхронное
  перемещение в ритм шествия внутри толпы ряженых -> Скрытный выпад рапирой со спины
  или парирование с ragdoll-сбросом стража -> Захват золотого тотема на платформе
  -> Побег с грузом через 3 эшелона шествия в темный переулок до финала музыкального
  трека..'
- 'Реализованы механики проекта: Динамическая маскировка в потоке танцоров, Ритмический
  скрытный выпад рапирой, Тактическое парирование и ragdoll-сброс, Инерционная транспортировка
  тяжелого тотема.'
- Условие успеха (Успешное похищение тяжелого золотого тотема с главной платформы
  3-го эшелона и достижение контрольной точки в переулке за 90–120 секунд с уровнем
  тревоги ниже 100%.) и условие проигрыша (Заполнение шкалы тревоги до 100% (стягивание
  элитной гвардии и блокировка выходов), гибель от 3 пропущенных ударов алебард стражи
  или истечение 120-секундного трека шествия до эвакуации.) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Тени Фестиваля: Клинок и Эшелон».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Второй шанс вора, Двойной куш карнавала);
  interstitial соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
