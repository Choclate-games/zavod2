raw_prompt: Изометрический 3D стелс-экшен про ограбление на шумной городской площади
  во время праздничного шествия. Игрок управляет ловким вором с помощью клавиш WASD
  или виртуального джойстика, укрываясь в плотных потоках движущихся танцоров и подкрадываясь
  к стендам с золотыми тотемами. На экране показаны красочные карнавальные платформы,
  зоны видимости бдительных стражей и летящие конфетти. Задача — украсть тяжелую реликвию,
  пронести её через толпу в ритм музыки и сбежать в переулок незамеченным.
title: 'Тени Фестиваля: Клинок и Эшелон'
slug: izometricheskiy_3d_stels_ekshen_pro_ograblenie_n
genre: Изометрический 3D Стелс-Экшен
subgenre: Ритмический слэшер с механикой маскировки в толпе
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web / Mobile)
orientation: landscape
target_audience: Игроки 16–35 лет, ценящие стильные изометрические экшены, динамичный
  стелс, тайминги парирования и ритм-игры в духе Hi-Fi Rush, Hotline Miami и Shadow
  Tactics.
core_loop: Оценка маршрута и конусов обзора стражи -> Синхронное перемещение в ритм
  шествия внутри толпы ряженых -> Скрытный выпад рапирой со спины или парирование
  с ragdoll-сбросом стража -> Захват золотого тотема на платформе -> Побег с грузом
  через 3 эшелона шествия в темный переулок до финала музыкального трека.
hook: Момент, когда на пике музыкального дропа ты парируешь алебарду элитного стража
  прямо на крыше медного левиафана и с разворота выбиваешь его пинком в танцующую
  толпу внизу под взрыв золотых конфетти.
player_fantasy: Ты — легендарный вор-фехтовальщик в полумаске и развевающемся плаще,
  который превращает дерзкое ограбление в завораживающий смертоносный танец посреди
  гремящего стимпанк-карнавала.
session_model: 'Каскадный прорыв: прохождение дистанции из 3 соединенных платформ-эшелонов
  шествия длительностью 90–120 секунд с финальным прыжком в переулок.'
unique_value_proposition: Синтез динамичного ритм-стелса и изометрического фехтования,
  где музыка шествия маскирует атаки, а толпа NPC служит живым укрытием и растворяет
  тела поверженных врагов.
vision: Превратить классический стелс из медленного выжидания в стремительный музыкально-акробатический
  слэшер, где каждый взмах клинка и уход в тень танцоров подчинены ритму грандиозного
  праздника.
elevator_pitch: 'Тени Фестиваля: Клинок и Эшелон — это изометрический 3D ритм-стелс
  слэшер, в котором вор-фехтовальщик грабит механизированную карнавальную процессию,
  парирует удары стражи на движущихся платформах и скрывается в танцующей толпе под
  бой праздничных барабанов.'
win_conditions: Успешное похищение тяжелого золотого тотема с главной платформы 3-го
  эшелона и достижение контрольной точки в переулке за 90–120 секунд с уровнем тревоги
  ниже 100%.
lose_conditions: Заполнение шкалы тревоги до 100% (стягивание элитной гвардии и блокировка
  выходов), гибель от 3 пропущенных ударов алебард стражи или истечение 120-секундного
  трека шествия до эвакуации.
progression_summary: Разблокировка новых стилетов и рапир с уникальными парирующими
  свойствами, костюмов и масок с бонусами к маскировке в толпе, а также открытие усложненных
  ночных маршрутов шествия с новыми типами стражей.
difficulty_curve: 'Динамическая кривая давления: от изолированных патрулей на 1-м
  эшелоне (обучение таймингам толпы) до перекрестных конусов обзора и парирования
  бронированных офицеров на 2-м и 3-м эшелонах с ускорением темпа музыки.'
