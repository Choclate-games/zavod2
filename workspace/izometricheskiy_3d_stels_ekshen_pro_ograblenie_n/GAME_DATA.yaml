preview_prompt: 'Authentic in-game gameplay screenshot of ''Тени Фестиваля: Клинок
  и Эшелон'', a Изометрический 3D Стелс-Экшен game. Visual style: Стилизованный стимпанк-маскарад
  с яркой карнавальной палитрой и динамическим светом латунных фонарей. Camera perspective:
  Изометрическая проекция под углом 60 градусов с динамическим зумом. Environment:
  Грандиозная ночная городская площадь эпохи стимпанк: брусчатка, медные заводные
  платформы-левиафаны, гирлянды латунных фонарей, клубящийся цветной пар и золотые
  конфетти. Central Action: Момент, когда на пике музыкального дропа ты парируешь
  алебарду элитного стража прямо на крыше медного левиафана и с разворота выбиваешь
  его пинком в танцующую толпу внизу под взрыв золотых конфетти. — the moment is caught
  mid-action, with clear cause and effect readable in a single frame. Visible in-game
  HUD overlay: Индикатор Ритма шествия (пульсирующий метроном внизу по центру), Круговой
  датчик скрытности / тревоги над головой персонажа (Eye Icon / Stealth Disc), Счетчик
  похищенного золота и иконка захваченного тотема, Таймер шествия платформы (обратный
  отсчет до 120 с); touch controls at the bottom corners. Lighting: Контрастное ночное
  освещение с теплым золотым светом фонарей, объемными неоново-бирюзовыми конусами
  стражи и цветным паром. Color palette: #e6a135, #b82447, #e71d36, #1a1226, #ffd166,
  #2ec4b6. High visual clarity, readable silhouettes, immersive WebGL game aesthetics.'
