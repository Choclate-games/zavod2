_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: izometricheskiy_3d_stels_ekshen_pro_ograblenie_n
performance:
  target_fps: 60
  max_draw_calls: 80
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: 'Каскадный прорыв: прохождение дистанции из 3 соединенных платформ-эшелонов
    шествия длительностью 90–120 секунд с финальным прыжком в переулок.'
  win: Успешное похищение тяжелого золотого тотема с главной платформы 3-го эшелона
    и достижение контрольной точки в переулке за 90–120 секунд с уровнем тревоги ниже
    100%.
  lose: Заполнение шкалы тревоги до 100% (стягивание элитной гвардии и блокировка
    выходов), гибель от 3 пропущенных ударов алебард стражи или истечение 120-секундного
    трека шествия до эвакуации.
  difficulty_curve: 'Динамическая кривая давления: от изолированных патрулей на 1-м
    эшелоне (обучение таймингам толпы) до перекрестных конусов обзора и парирования
    бронированных офицеров на 2-м и 3-м эшелонах с ускорением темпа музыки.'
mechanics:
  dinamicheskaya_maskirovka_v_potoke_tantsorov:
    name: Динамическая маскировка в потоке танцоров
    parameters:
      minimalnyy_razmer_gruppy_tantsorov:
        value: 3 NPC
        note: При 2 NPC маскировка срабатывает случайно в любых углах; при 4+ NPC
          на платформах не хватает места для укрытия.
      radius_effektivnoy_zony_maskirovki:
        value: 1.8 м
        note: При 1.2 м игрок постоянно выпадает из толпы при маневрах; при 2.5 м
          исчезает ощущение тесного праздничного потока.
      skorost_dvizheniya_shestviya_platform:
        value: 2.6 м/с
        note: При увеличении до 3.8 м/с игрок не успевает оценивать конусы стражи;
          при 1.5 м/с темп игры провисает.
      bazovoe_vremya_obnaruzheniya_vne_tolpy:
        value: 0.45 с
        note: При 0.2 с игра превращается в непрощающий пиксель-хантинг; при 1.0 с
          пропадает напряжение открытых зон.
      snizhenie_zametnosti_v_maskirovke:
        value: 85%
        note: При 100% стража кажется слепой даже в упор; при 60% социальный стелс
          теряет смысл.
  ritmicheskiy_skrytnyy_vypad_rapiroy:
    name: Ритмический скрытный выпад рапирой
    parameters:
      okno_silnoy_doli_treka_bpm_120_135:
        value: ±0.15 с
        note: При ±0.08 с ритм становится слишком хардкорным для экшена; при ±0.25
          с исчезает чувство ритмического мастерства.
      distantsiya_vypada_rapiry:
        value: 2.2 м
        note: При 1.4 м игрок постоянно недолетает до патрульного; при 3.5 м механика
          превращается в читерский телепорт.
      sektor_ataki_so_spiny:
        value: 135 градусов
        note: При 90 градусах трудно попасть на углах обзора; при 180 градусах стражника
          можно бить почти в профиль без стелса.
      radius_shuma_pri_neritmichnom_udare:
        value: 6.0 м
        note: При 3.0 м ошибка не наказывается; при 10.0 м любая погрешность сразу
          поднимает тревогу всей платформы.
      dlitelnost_animatsii_vypada:
        value: 0.18 с
        note: При 0.4 с темп боя замедляется; при 0.08 с анимация выглядит дерганной
          и неестественной.
  takticheskoe_parirovanie_i_ragdoll_sbros:
    name: Тактическое парирование и ragdoll-сброс
    parameters:
      okno_idealnogo_parirovaniya:
        value: 0.18 с
        note: При 0.10 с парировать на сенсорном экране почти невозможно; при 0.30
          с бой теряет всякий вызов и риск.
      impuls_pinka_ragdoll_sbrosa:
        value: 14.5 м/с
        note: При 8.0 м/с стражник вяло падает под ноги; при 22.0 м/с улетает как
          ракета сквозь текстуры.
      dlitelnost_oglusheniya_posle_bloka:
        value: 1.2 с
        note: При 0.6 с игрок не успевает сориентироваться на пинок; при 2.0 с игра
          кажется слишком медленной.
      ugol_sektora_otrazheniya_udara:
        value: 110 градусов
        note: При 60 градусах тяжело парировать при боковых атаках; при 180 градусах
          парируются удары со спины.
      shtraf_zamah_promaha_recovery:
        value: 0.35 с
        note: При 0.15 с спам парирования становится доминирующей стратегией; при
          0.6 с любая ошибка гарантирует 100% смерть.
  inertsionnaya_transportirovka_tyazhelogo_totema:
    name: Инерционная транспортировка тяжелого тотема
    parameters:
      shtraf_bazovoy_skorosti_pri_perenoske:
        value: 35%
        note: При 15% тотем не ощущается тяжелой реликвией; при 60% побег превращается
          в мучительное ползание.
      vremya_razgona_do_maksimalnoy_inertsii:
        value: 1.4 с
        note: При 0.5 с инерция превращается в обычный спринт; при 3.0 с невозможно
          разогнаться на компактных платформах.
      radius_tarannogo_sbivaniya_strazhey_na_razgone:
        value: 1.6 м
        note: При 0.8 м игрок цепляется за стражей и стопорится; при 2.5 м игрок превращается
          в неуязвимый танк.
      bonus_levitatsii_pri_dvizhenii_v_takt_muzyki:
        value: 70%
        note: При 30% ритмический бонус незаметен; при 100% полностью нивелирует штраф
          веса тотема.
      uglovaya_skorost_razvorota_s_gruzom:
        value: 120 град/с
        note: При 60 град/с управление становится неотзывчивым; при 360 град/с исчезает
          физическое ощущение массы реликвии.
  karnavalnaya_konfetti_zavesa_i_hlopushki_otvlechen:
    name: Карнавальная конфетти-завеса и хлопушки отвлечения
    parameters:
      radius_oblaka_konfetti_zavesy:
        value: 3.5 м
        note: При 2.0 м облако не перекрывает ширину платформы; при 5.5 м делает прохождение
          слишком тривиальным.
      dlitelnost_deystviya_dymovoy_zavesy:
        value: 4.0 с
        note: При 2.0 с игрок не успевает пронести тотем; при 7.0 с стражники полностью
          выключаются из игры.
      dlitelnost_oslepleniya_strazhi_stun_blind:
        value: 2.5 с
        note: При 1.0 с страж сразу атакует вслепую; при 4.5 с пропадает необходимость
          в стелсе.
      maksimalnyy_zapas_hlopushek_v_zabege:
        value: 2 заряда
        note: При 1 заряде игрок боится его тратить; при 4 зарядах игра превращается
          в безостановочный спам.
      radius_privlecheniya_patruley_zvukom_hlopushki:
        value: 8.0 м
        note: При 4.0 м отвлечение не работает на дальних стражей; при 15.0 м сбегается
          весь эшелон.
