<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡ Стенд базы знаний фабрики</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
    <!-- Один канвас и один WebGL-контекст на весь стенд: второй контекст в той
         же вкладке вытесняет первый, и режимы начинают гаснуть при переключении. -->
    <canvas id="game-canvas" class="game-canvas"></canvas>

    <div id="ui-overlay">
        <div class="header interactive">
            <div class="header-left">
                <div id="title-text" class="app-title">⚡ Стенд базы знаний фабрики</div>
            </div>

            <!-- Вкладки строятся из реестра демо в main.ts, а не руками в разметке:
                 разъезжание списка вкладок и списка режимов было отдельным багом. -->
            <div class="tabs" id="tab-bar"></div>

            <div class="header-right">
                <select class="utility-btn" id="quality-select" title="Тир качества">
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high">high</option>
                </select>
                <button class="utility-btn" id="lang-toggle">🌐 RU</button>
                <button class="utility-btn" id="mute-toggle">🔊 Звук</button>
            </div>
        </div>

        <div class="bottom-panel-container">
            <div class="hud-card interactive">
                <div id="demo-hint" class="demo-hint">Загрузка…</div>
                <div id="demo-status" class="demo-status"></div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
