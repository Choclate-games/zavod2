<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎮 Factory Knowledge Base - Ultimate Showcase</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #0d1117;
            color: #ecf0f1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #game-root {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px;
            z-index: 10;
        }
        .interactive { pointer-events: auto; }
        .header {
            background: rgba(13, 17, 23, 0.94);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #bdc3c7;
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.15s;
        }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
        .tab-btn.active {
            background: #e65c00;
            border-color: #ff771a;
            color: #fff;
            box-shadow: 0 0 14px rgba(230, 92, 0, 0.6);
        }
        .hud-card {
            background: rgba(13, 17, 23, 0.94);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            line-height: 1.5;
            color: #dcdde1;
            max-width: 480px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        }
        .hud-card b { color: #f39c12; }
        .hud-card kbd {
            background: #2f3640;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #718093;
            font-family: monospace;
            font-size: 12px;
            color: #fff;
        }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
            z-index: 5;
        }
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 4px #000;
        }
        .crosshair::before { top: 7px; left: -8px; width: 32px; height: 2px; }
        .crosshair::after { top: -8px; left: 7px; width: 2px; height: 32px; }
        #damage-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        #2d-canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            display: none;
            z-index: 2;
        }
        #speedometer {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(13, 17, 23, 0.9);
            border: 2px solid rgba(230, 92, 0, 0.8);
            border-radius: 12px;
            padding: 12px 18px;
            text-align: center;
            font-family: monospace;
            display: block;
            pointer-events: none;
        }
        #speed-val { font-size: 32px; font-weight: 900; color: #ff771a; }
    </style>
</head>
<body>
    <div id="game-root"></div>
    <canvas id="2d-canvas-overlay"></canvas>
    <div id="damage-container"></div>

    <div id="ui-overlay">
        <div class="header interactive">
            <div style="font-weight: bold; font-size: 14px; color: #f1c40f;">⚡ Factory Knowledge Showcase</div>
            <div class="tabs">
                <button class="tab-btn active" onclick="window.switchMode('truck')">🚚 ЗиЛ-130 (Rapier 3D 1:1)</button>
                <button class="tab-btn" onclick="window.switchMode('fps')">🔫 FPS & Кик (PointerLock)</button>
                <button class="tab-btn" onclick="window.switchMode('melee')">⚔️ Слэшер & Комбо</button>
                <button class="tab-btn" onclick="window.switchMode('models')">🎨 3D Модели</button>
                <button class="tab-btn" onclick="window.switchMode('gestures')">👆 Свайпы & Жесты</button>
            </div>
        </div>

        <div class="crosshair" id="fps-crosshair"></div>

        <div style="display: flex; justify-content: space-between; align-items: flex-end; width: 100%;">
            <div class="hud-card interactive" id="hud-info">
                <div style="font-weight:bold; color:#e67e22; margin-bottom:4px;">🚚 ЗиЛ-130: 100% честная физика Rapier 3D (WASM)</div>
                <div>Управление: <kbd>W</kbd>/<kbd>S</kbd> Газ / Тормоз, <kbd>A</kbd>/<kbd>D</kbd> Руль</div>
                <div>Настоящая динамическая подвеска с лучевым прощупыванием рельефа (Raycast Vehicle)!</div>
            </div>

            <div id="speedometer">
                <div style="font-size: 11px; color: #bdc3c7;">СКОРОСТЬ</div>
                <div id="speed-val">0</div>
                <div style="font-size: 10px; color: #7f8c8d;">КМ/Ч</div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
