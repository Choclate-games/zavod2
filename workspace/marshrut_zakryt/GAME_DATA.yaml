- skill_id: survivor_skill
  name: 'Horde Survivor: ECS Swarm, Auto-Attack & Upgrade Cards'
  filename: SURVIVOR_SKILL.md
  purpose: Тысяча врагов на экране, автоматическая атака, кристаллы опыта и выбор
    из трёх карточек на уровне.
  when_to_use: Для survivor/auto-shooter забегов, волновых арен и любых режимов с
    ордой однотипных врагов.
  rules:
  - 'Орда живёт в bitECS и рисуется через InstancedMesh: у InstancedMesh обязательно
    frustumCulled = false и count по числу живых.'
  - 'Потолок пула жёсткий: при переполнении спавн молча пропускается, массивы не растут.'
  - Поиск целей и попаданий — через равномерную сетку, а не перебором.
  - Урон по площади умножается на dt, иначе баланс зависит от частоты кадров.
  - 'Спавн и здоровье врага растут ЛИНЕЙНО: экспонента даёт спираль смерти.'
  - Выбор карты останавливает забег — это и есть окно решения игрока.
  architecture: RunState (опыт, статы, пул карт) отдельно от сцены; hordeAt(t) задаёт
    эскалацию; killsPerSecond(stats, hp, nearby) — модель баланса.
  implementation_guidance: Раздача карт обязана уметь вернуть МЕНЬШЕ трёх карт при
    исчерпании пула, уважать требования (requires) и лимиты стеков. Кривая опыта линейная,
    иначе во второй половине забега игрок не принимает решений.
  common_mistakes:
  - 'Раздача набирает ровно три карты из двух доступных: зацикливается или выдаёт
    дубль.'
  - Опыт начисляется через if вместо цикла — пачка кристаллов даёт один уровень вместо
    двух.
  - 'Баланс считается общим DPS без учёта площади: числа сходятся к безнадёжному забегу.'
  checklist:
  - Головной прогон подтверждает, что игрок держит орду на 1-й, 5-й и 12-й минуте.
  - Билд без единой боевой карты тонет — значит выбор карт действительно решает.
  - 'Орда не упирается в потолок пула: сложность задаёт дизайн, а не размер массива.'
  knowledge_refs:
  - threejs/horde_survivor_core.md
  - stack/bitecs.md
  - mechanics/wave_survival.md
  - mechanics/upgrade_choices.md
  - patterns/survivor_loop.md
