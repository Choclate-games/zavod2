definition_of_done:
- Есть 3D-сцена мокрого стилизованного города от первого лица.
- Стрельба является главным действием и работает через наведение и удержание цели.
- ПК использует WASD, мышь и ЛКМ; мобильная версия использует перетаскивание, удержание
  и свайп.
- Контракт состоит из 4 волн по 35–45 секунд и 4 адресных терминалов.
- Орда измеряет частоту использования сегментов и перекрывает самый частый путь после
  каждой волны.
- После перекрытия всегда остаются минимум два читаемых прохода.
- Формации орды заранее показывают направление будущего давления.
- Победа и поражение измеряются доставкой пакета, зарядами, состоянием пакета и временем
  контракта.
- Нет окна выбора из трёх карт улучшений, постоянных силовых улучшений за валюту,
  отдельного виртуального джойстика или статичной арены.
- Игра поддерживает безопасную область, паузу, жизненный цикл Playgama Bridge, облачное
  сохранение и честное размещение рекламы.
- Сцена соответствует бюджету до 80 вызовов отрисовки, 45 000 треугольников и 24 активных
  преследователей.
- Пройдены функциональные, мобильные, браузерные и производительные проверки.
- 'Игра осталась тем, что просили: стрельба как главное действие игрока.'
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Навести прицел на ближайшую угрозу, удерживать цель под
  автоматической очередью, двигаться к следующему адресу, на перекрёстке выбрать менее
  ожидаемый проход и пережить 35–45 секунд давления. После волны прочитать, какую
  улицу орда запомнила и перекрыла, затем перестроить маршрут..'
- 'Реализованы механики проекта: Подавляющая очередь, Память перекрытий, Перекресток
  на ходу, Сжатие строя.'
- Условие успеха (Доставить один светящийся пакет в 4 адресных терминала, пережив
  4 волны по 35–45 секунд. На каждом терминале нужно находиться в зоне доставки 3
  секунды, удерживая хотя бы один проход свободным от орды.) и условие проигрыша (Поражение
  наступает при потере всех 3 зарядов выносливости или при разрушении пакета. Заряд
  теряется после контакта с преследователем на 0,8 секунды; пакет разрушается, если
  орда удерживает его в контакте 2 секунды. Также поражение наступает, если таймер
  контракта достигает 240 секунд.) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Курьерский прорыв».
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Продолжить доставку, Сохранить маршрут);
  interstitial соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
direction:
  options:
  - id: D1
    name: Курьерский прорыв
    pitch: Игрок ведёт курьера через дождливый город-лабиринт, наводит автоматический
      огонь на преследователей и выбирает следующий переулок прямо под натиском орды.
    core_verb: наводить и вести огонь
    genre_family: 3D экшен-выживание против орды / маршрутный шутер от первого лица
    session_shape: Одиночный контракт на четыре волны по 35–45 секунд; после каждой
      волны орда перекрывает самый часто использованный путь, а игрок продолжает доставку
      через оставшиеся улицы.
    camera: Вид от первого лица с крупным читаемым прицелом, короткими наклонами камеры
      при поворотах и заметными силуэтами врагов в конце улиц.
    control_scheme: 'ПК: WASD задаёт движение, мышь направляет прицел, удержание ЛКМ
      включает автоматическую очередь. Телефон: палец перетаскивает прицел, удержание
      на цели включает очередь, короткий свайп на развилке выбирает улицу; отдельный
      виртуальный джойстик не используется.'
    world: Мокрый кирпичный город с янтарными окнами, красными сигнальными лампами,
      нависающими кабелями и узкими переулками. Курьер несёт единственный светящийся
      пакет, по которому орда определяет его маршрут.
    spectacle: 'Камера смотрит из-под капюшона на мокрый перекрёсток: справа в объектив
      летят трассеры по ближайшим преследователям, слева красная вывеска гаснет и
      открывает новый переулок, а в глубине улицы стая врагов уже заполняет привычный
      путь.'
    why_not_generic: 'Связка «укрытия и подавление», «волновое выживание» и «формационное
      движение» превращает стрельбу в управление потоком: огонь оттесняет орду от
      выбранного прохода, построение преследователей показывает, где скоро сомкнётся
      окружение, а волна заставляет заранее решать, какой маршрут сохранить. Это не
      статичная арена, а шутер, где память врагов меняет карту после каждого столкновения.'
    biggest_risk: Если цветовые сигналы улиц и направление движения орды будут недостаточно
      контрастными, игрок не поймёт, почему закрылся проход и какой путь ещё безопасен.
    production_cost: 'Средний: одна процедурно собранная сцена Three.js, набор модульных
      улиц и стилизованных преследователей, но потребуется тщательно настроить читаемость
      маршрутов и плотность орды.'
    knowledge_hints:
    - threejs/fps_controller_and_shooting.md
    - threejs/shooter_enemy_ai_and_combat.md
    - threejs/game_map_and_world_design.md
    - threejs/procedural_mesh_builder.md
    - mechanics/cover_and_suppression.md
    - mechanics/wave_survival.md
    - mechanics/formation_movement.md
    - ux/touch_controls.md
    - ux/input_scheme_switching.md
    - threejs/mobile_shaders.md
  - id: D2
    name: Красная линия
    pitch: Игрок срывает погоню выстрелами по преследователям и городским узлам, меняя
      направление движения орды прямо во время стремительного побега.
    core_verb: перехватывать цели и стрелять на упреждение
    genre_family: 3D экшен-выживание против орды / кинетический шутер от третьего
      лица
    session_shape: Каскадная партия из пяти связанных улиц по 25–35 секунд; каждая
      улица заканчивается сигнальными воротами, а использованный чаще всего маршрут
      остаётся разрушенным в следующих сценах.
    camera: Динамичная камера за плечом курьера, слегка возвышенная над улицей, чтобы
      одновременно видеть цель, ближайший городской узел и направление надвигающейся
      орды.
    control_scheme: 'ПК: WASD корректирует движение по улице, мышь ведёт прицел, удержание
      ЛКМ ведёт автоматический огонь. Телефон: свайп влево или вправо выбирает полосу
      на развилке, второй палец перетаскивает прицел и удержанием запускает очередь.'
    world: 'Ночной город вокруг трамвайных линий: красные светофоры, стеклянные навесы,
      рельсы, трансформаторные будки и мосты над улицами. Каждый перекрёсток содержит
      узел, который можно прострелить и превратить в новый проход или ловушку.'
    spectacle: Курьер мчится под стеклянным навесом, в воздухе зависает красный трамвайный
      сигнал, очередь рикошетит от преследователя в кабель, кабель рвётся, искры обрушивают
      перегородку и уводят орду на соседнюю улицу.
    why_not_generic: 'Связка «физические цепные реакции», «разрушаемое окружение и
      динамические опасности» и «синхронизация с тактом музыки» делает выстрел частью
      кинетической постановки: точный момент попадания запускает каскад, ритм сигналов
      подсказывает безопасное окно, а разрушение узлов физически перенаправляет орду.
      Получается не обычный бег по коридору, а шутер о перехвате погони через городскую
      инфраструктуру.'
    biggest_risk: Зрелищные разрушения могут затмить саму стрельбу и превратить выбор
      маршрута в угадывание правильного зрелищного объекта.
    production_cost: 'Высокий: понадобится несколько авторских участков улиц, система
      разрушений, синхронизация событий и плотная постановка камеры в одной сцене.'
    knowledge_hints:
    - threejs/shooter_enemy_ai_and_combat.md
    - mechanics/chain_reaction.md
    - mechanics/physics_destruction.md
    - mechanics/rhythm_sync.md
    - threejs/juice_and_vfx_pool.md
    - threejs/game_map_and_world_design.md
    - threejs/procedural_mesh_builder.md
    - ux/touch_controls.md
    - threejs/mobile_shaders.md
  - id: D3
    name: Архив последнего маршрута
    pitch: Игрок прочищает улицы выстрелами, раскрывает следы преследователей и выбирает,
      какую петлю города закрыть ради последнего выхода.
    core_verb: выявлять и расстреливать угрозы
    genre_family: 3D экшен-выживание против орды / изометрический тактический шутер
    session_shape: 'Один маршрут-дело из трёх актов: разведка улиц, волна преследования
      и эвакуация. Каждый акт длится около минуты, а после волны самый часто использованный
      коридор исчезает из схемы и открывается новый.'
    camera: Высокая изометрическая камера с ортографической проекцией, показывающая
      несколько соединённых улиц, зоны видимости врагов и светящиеся следы недавних
      перемещений.
    control_scheme: 'ПК: WASD перемещает курьера, мышь задаёт направление прицела,
      удержание ЛКМ ведёт автоматический огонь. Телефон: перетаскивание пальца направляет
      прицел и очередь, свайп через развилку выбирает следующий коридор; все новые
      проходы отмечаются световыми линиями.'
    world: Обесточенный город с фосфоресцирующей разметкой, крышами вместо тротуаров,
      прозрачными навесами и редкими окнами аварийного света. Орда оставляет видимые
      следы, но часть следов оказывается ложной приманкой.
    spectacle: 'С высоты виден весь тёмный квартал: курьер выпускает яркую очередь
      в арку, из-за стены выскакивает группа преследователей, их следы загораются
      на мостовой, а позади красная линия перечёркивает замкнувшийся старый маршрут.'
    why_not_generic: 'Связка «стелс, конусы зрения и радиусы шума», «доска улик и
      дедукция» и «контракт волны и досрочный вызов» превращает маршрутную память
      орды в читаемую улику: выстрелы раскрывают настоящих преследователей, следы
      связываются в карту, а игрок сам решает, когда вызвать следующую волну ради
      короткого пути. Стрельба остаётся центром, но каждый выстрел одновременно проверяет
      гипотезу о поведении орды.'
    biggest_risk: Слой расследования может замедлить темп и отодвинуть стрельбу на
      второй план, особенно если карта улик станет важнее непосредственной угрозы.
    production_cost: 'Средний-высокий: изометрическая сцена экономит геометрию, но
      потребует хорошей системы видимости, следов, ложных маршрутов и понятного отображения
      изменений карты.'
    knowledge_hints:
    - threejs/shooter_enemy_ai_and_combat.md
    - threejs/stealth_and_vision_cones.md
    - mechanics/evidence_board.md
    - mechanics/wave_contract.md
    - threejs/orthographic_2d_and_pointer_input.md
    - threejs/game_map_and_world_design.md
    - ux/touch_controls.md
    - threejs/mobile_shaders.md
  selected_id: D1
  selected_name: Курьерский прорыв
  selection_reason: Это направление лучше всего соединяет обещание стрельбы, выживание
    против орды и выбор улиц в одно мгновенно понятное действие. Вид от первого лица
    делает связь между прицелом, выстрелом и закрывающимся маршрутом максимально прямой,
    а управление перетаскиванием прицела и свайпом на развилке естественно переносится
    на телефон без шаблонной раскладки с виртуальным джойстиком. Одна сцена Three.js
    сразу даёт цельный город и быструю первую осмысленную секунду, а память орды остаётся
    главным отличием от обычного шутера на выживание.
  rejected_reasons:
  - 'D2 отвергнут: его цепные разрушения дают сильный кадр, но постепенно делают главным
    действием стрельбу по инфраструктуре, а не борьбу с ордой. Каскад авторских улиц
    также слабее передаёт обещание живой памяти маршрута.'
  - 'D3 отвергнут: он лучше всех объясняет следы и читаемость новых проходов, но расследование,
    скрытность и карта улик начинают конкурировать со стрельбой. Изометрический ракурс
    уменьшает непосредственное ощущение опасности и личного прорыва.'
  what_it_is_not:
  - Не окно выбора из трёх карт улучшений между волнами.
  - Не универсальная связка «дэш плюс парирование плюс удар».
  - Не основа в духе Vampire Survivors или Brotato с бездумным круговым автошутером.
  - Не раскладка «виртуальный джойстик слева плюс кнопки атаки справа».
  - Не арена, где улицы служат только декорациями и не меняются из-за поведения орды.
  - Не город из серых кубов вместо стилизованной геометрии.
  - Не мета-прогрессия «золото за забег плюс постоянные апгрейды», не связанная с
    темой доставки.
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - 'Стрельба остаётся главным действием: игрок постоянно направляет прицел, а оружие
    автоматически ведёт очередь по удерживаемой цели.'
  - После каждой волны орда действительно перекрывает самый часто использованный игроком
    маршрут.
  - Новые проходы различаются светом, цветом, силуэтами и направляющими знаками ещё
    до входа в них.
  - Курьер одновременно должен ощущаться уязвимым человеком в городе и единственным
    источником направленного огня.
  - Вся игра работает в одной стилизованной сцене Three.js и даёт понятную угрозу
    и цель в первую секунду без обучения.
  signature_scene: 'Фотография от первого лица под мокрым капюшоном: внизу кадра блестит
    красная сумка курьера, справа из дождя выпрыгивает преследователь, по нему уже
    проходит яркая автоматическая очередь, а слева на перекрёстке гаснет жёлтая вывеска
    и открывает узкий переулок. Холодный синий свет идёт из дождливого неба, тёплый
    янтарный свет льётся из окон, позади по мокрой мостовой быстро смыкается чёрная
    масса орды.'
  avoid_references:
  - '«Маяк: Ночная Вахта» - не повторять фиксированную световую арену и термодинамическую
    оборону.'
  - '«Громовой Перехват: Штормовой Экспресс» - не повторять линейный рейд от первого
    лица по движущейся платформе.'
  - '«Тени Фестиваля: Клинок и Эшелон» - не повторять стелс-прорыв по соединённым
    платформам.'
  - Vampire Survivors и Brotato - не брать за основу их шаблон кругового автошутера.
  - Трёхкарточный экран улучшений, серые кубы и бессюжетную постоянную прокачку за
    золото.
knowledge_plan:
  selections:
  - path: threejs/adaptive_quality.md
    role: core
    reason: Контракт должен удерживать стабильный FPS на телефонах во время четырёх
      волн и возвращать качество после спада нагрузки.
  - path: threejs/mobile_shaders.md
    role: supporting
    reason: Дождливые улицы, силуэты орды и эффекты очереди должны оставаться читаемыми
      на мобильном GPU без тяжёлых материалов.
  - path: threejs/physics_integration.md
    role: core
    reason: Отдача очереди, отталкивание преследователей и столкновения в узких улицах
      должны синхронно считаться с Three.js через Rapier3D.
  - path: stack/rapier3d.md
    role: core
    reason: Проекту нужен фактический API Rapier3D для физических тел игрока, орды
      и меняющихся перекрытий.
  - path: threejs/game_map_and_world_design.md
    role: core
    reason: Процедурная сеть освещённых улиц и перекрёстков должна поддерживать новые
      маршруты после каждого перекрытия.
  - path: threejs/procedural_mesh_builder.md
    role: core
    reason: Стилизованный дождливый город, терминалы, баррикады и уличные ориентиры
      нужно собрать без внешних моделей.
  - path: threejs/procedural_character_rig.md
    role: core
    reason: Игрок и преследователи должны читаться как процедурные живые тела с позой
      и реакцией на попадание, а не как кубы.
  - path: threejs/fps_controller_and_shooting.md
    role: core
    reason: Вид от первого лица должен связать WASD, мышь или тач-прицел, автоматическую
      очередь, вьюмодель и отклик выстрела.
  - path: threejs/shooter_enemy_ai_and_combat.md
    role: core
    reason: ИИ преследователей должен держать давление, строиться у дальнего прохода
      и учитывать путь к следующему адресу.
  - path: mechanics/wave_survival.md
    role: core
    reason: Четыре временные волны по 35–45 секунд задают нарастание орды и ритм одиночного
      контракта.
  - path: mechanics/formation_movement.md
    role: core
    reason: Временные строи орды должны сжиматься в улицах и заранее показывать, какой
      проход будет закрыт.
  - path: stack/recast_navigation.md
    role: core
    reason: Преследователям нужна навигация по уличной сети с временно закрытыми проходами
      и обходом нового препятствия.
  - path: stack/bitecs.md
    role: supporting
    reason: Массовые однотипные преследователи и эффекты давления требуют ориентированной
      на данные ECS вместо набора тяжёлых объектов Three.js.
  - path: threejs/juice_and_vfx_pool.md
    role: supporting
    reason: Светящийся пакет, попадания, отталкивание, закрытие переулка и короткий
      наклон камеры должны давать мгновенный визуальный отклик.
  - path: audio/procedural_sound_synthesizer.md
    role: core
    reason: Выстрелы, дождь, тревога перекрытия и доставка должны синтезироваться
      Web Audio без аудиофайлов.
  - path: audio/web_audio_and_muting.md
    role: supporting
    reason: Автозапуск и глушение звука должны безопасно работать на клавиатуре и
      таче на всех площадках.
  - path: monetization/rewarded_ads_patterns.md
    role: supporting
    reason: Опциональная награда после неудачного контракта может поддержать доставку,
      не превращая победу в обязательный просмотр рекламы.
  - path: monetization/interstitial_best_practices.md
    role: supporting
    reason: Между контрактами или после естественного завершения забега нужна реклама,
      не прерывающая четыре активные волны.
