raw_prompt: 'Ночной курьер мчится через город-лабиринт, отбивается от преследователей
  и выбирает улицы на ходу. Сделай 3D-выживание против орды на Three.js: игрок управляет
  движением клавиатурой или пальцем, атака отбивается автоматически. Орда запоминает
  маршрут и перекрывает самый часто используемый путь после каждой волны. Если идти
  привычным кругом, преследователи сомкнут его; новые проходы должны оставаться читаемыми.'
title: Курьерский прорыв
slug: marshrut_zakryt
genre: 3D экшен-выживание против орды от первого лица
subgenre: Маршрутный FPS с автоматической очередью и адаптивным перекрытием улиц
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge, Yandex Games, VK и мобильный веб
orientation: landscape
target_audience: Игроки 12+, которым нравятся короткие напряжённые шутерные сессии,
  чтение пространства и управление без виртуального джойстика.
core_loop: Навести прицел на ближайшую угрозу, удерживать цель под автоматической
  очередью, двигаться к следующему адресу, на перекрёстке выбрать менее ожидаемый
  проход и пережить 35–45 секунд давления. После волны прочитать, какую улицу орда
  запомнила и перекрыла, затем перестроить маршрут.
hook: 'Игрок замечает, что орда действительно выучила его круг: после волны знакомый
  переулок закрывается чёрной массой, и под автоматической очередью ему приходится
  на ходу выбрать новый освещённый путь к адресу.'
player_fantasy: Быть последним курьером в дождливом городе, который одной рукой ведёт
  единственный светящийся пакет к адресу, а другой удерживает преследователей на расстоянии,
  постоянно обманывая их память о маршруте.
session_model: 'Одиночный контракт длительностью 3–4 минуты: 4 волны по 35–45 секунд,
  между ними по 6 секунд на чтение перекрытой улицы и выбор следующего направления.
  Победа наступает после доставки одного пакета через 4 последовательных района.'
unique_value_proposition: 'Это шутер на выживание, где стрельба не просто уничтожает
  врагов: огонь временно оттесняет орду от выбранного прохода, а её память физически
  меняет доступную карту после каждой волны.'
vision: За одну секунду игрок видит мокрый переулок, красную сумку внизу кадра, крупный
  прицел на силуэте преследователя и закрывающуюся позади улицу. За одну сессию он
  учится не бегать по кругу, а управлять вниманием и памятью орды.
elevator_pitch: 'Вид от первого лица, автоматическая очередь и свайп на перекрёстке:
  ночной курьер пробивается через четыре волны преследователей, но после каждой волны
  орда закрывает самый часто использованный путь, заставляя доставлять пакет через
  всё более хитрый город.'
win_conditions: Доставить один светящийся пакет в 4 адресных терминала, пережив 4
  волны по 35–45 секунд. На каждом терминале нужно находиться в зоне доставки 3 секунды,
  удерживая хотя бы один проход свободным от орды.
lose_conditions: Поражение наступает при потере всех 3 зарядов выносливости или при
  разрушении пакета. Заряд теряется после контакта с преследователем на 0,8 секунды;
  пакет разрушается, если орда удерживает его в контакте 2 секунды. Также поражение
  наступает, если таймер контракта достигает 240 секунд.
progression_summary: 'Внутри контракта меняется не сила оружия, а карта риска: каждая
  волна увеличивает плотность орды и добавляет одно запомненное перекрытие. Между
  контрактами сохраняются только лучшие времена доставки, открытые районы и косметические
  варианты сумки, без постоянных усилений за валюту.'
difficulty_curve: Первая волна вводит один перекрёсток и медленных преследователей.
  Вторая добавляет боковой обход и строй, который перекрывает привычный путь. Третья
  сокращает безопасное окно до 2,5 секунд и добавляет быстрых разведчиков. Четвёртая
  смешивает два перекрытия, дождевой туман и плотный финальный сход орды, сохраняя
  минимум два визуально различимых прохода.
scores:
  fun: 9
  originality: 9
  replayability: 9
  development_cost: 8
  visual_appeal: 9
  mobile_fit: 9
  monetization: 7
  platform_fit: 9
  overall_score: 8.7
  justification: 'Игра получает высокие оценки за немедленно читаемую стрельбу, редкую
    для жанра память маршрута и сильную связь между поведением орды и изменением улиц.
    Повторные попытки имеют смысл благодаря разным решениям на перекрёстках и анализу
    собственного маршрута. Визуальная подача хорошо подходит коротким веб-сессиям
    и мобильному экрану. Самое слабое место - монетизация: честная модель допускает
    только косметику и редкое возрождение за рекламу, поэтому доходность ниже проекта
    с постоянными усилениями. Технический объём умеренный, поскольку город собирается
    из повторно используемых модулей.'
references:
- name: Left 4 Dead
  genre: Кооперативный шутер против орд
  mechanics:
  - Читаемое давление группы врагов
  - Смена безопасного пространства под воздействием угрозы
  lessons: Орда должна давать понятные сигналы направления давления, а важные моменты
    должны читаться по силуэтам и звуку до непосредственного контакта.
  what_to_avoid: Не копировать кооперативную структуру, классы персонажей и линейный
    марш по заранее заданному уровню.
- name: Mirror's Edge
  genre: Экшен от первого лица с навигацией по городу
  mechanics:
  - Цветовая маркировка маршрута
  - Читаемая архитектура на скорости
  lessons: Новый проход должен быть понятен ещё до входа в него через цвет, свет,
    силуэт и направляющий знак.
  what_to_avoid: Не превращать игру в паркур и не подменять стрельбу акробатикой.
mechanics:
- name: Подавляющая очередь
  category: стрельба
  priority: ядро
  description: Игрок удерживает прицел на силуэте, и оружие само ведёт короткую очередь.
    Попадания не только наносят урон, но и отталкивают выбранного преследователя от
    прохода, создавая временное окно для движения.
  player_interaction: 'Клавиатура и мышь: удерживать левую кнопку мыши для наведения,
    WASD для движения. Тач: вести палец по экрану для прицела и удерживать второй
    палец либо кнопку автоочереди. Отдельная кнопка переключения цели не нужна: приоритет
    выбирается направлением прицела.'
  feedback: 'Визуал/VFX: каждое попадание дает короткий янтарный импульс на силуэте,
    след дождевых искр и видимое смещение тела на 0.24 с.; Звук (Web Audio): щелчок
    захвата панорамируется к цели, очередь имеет три тембровых слоя, а успешное отбрасывание
    добавляет низкий удар с громкостью 0.8.; Камера (импульс/зум): попадание дает
    толчок камеры 0.012 м и зум на 2%, но серия из четырех попаданий ограничена общим
    толчком 0.04 м.; UI/Тактильность: вокруг прицела заполняется дуга 0.16 с, при
    отбрасывании на поддерживаемом телефоне идет вибрация 18 мс, а при потере цели
    дуга сереет.'
  technical_complexity: Средняя
  strengths:
  - Стрельба остаётся главным действием
  - Игрок одновременно выбирает цель и освобождает маршрут
  - Подходит для мыши и сенсорного удержания
  weaknesses:
  - При слабой читаемости силуэтов цель может теряться в дождевых эффектах
  - Автоматическая очередь требует точного ограничения дальности и угла захвата
- name: Память перекрытий
  category: маршрут
  priority: ядро
  description: 'Игра записывает время, проведённое игроком на каждом сегменте улицы,
    и после волны закрывает сегмент с наибольшей долей использования. Закрытие визуально
    происходит в той же сцене: из переулка выходит плотный строй орды, а доступность
    прохода меняется.'
  player_interaction: 'Прямого отдельного ввода нет: направление движения клавишами
    WASD или виртуальным свайпом изменяет запись сегментов. В шестисекундном окне
    между волнами игрок выбирает первый новый вход свайпом или A/D.'
  feedback: 'Визуал/VFX: на асфальте остается полупрозрачная световая запись времени,
    а выбранный сегмент заполняется черной жидкой массой с силуэтами строя.; Звук
    (Web Audio): чем выше memory_score, тем громче дальний гул улицы; материализация
    начинается с обратного реверсного шума длительностью 2 с.; Камера (импульс/зум):
    при выборе перекрытия камера делает медленный зум 4% на заблокированный вход,
    а при завершении закрытия получает импульс 0.025 м.; UI/Тактильность: карта памяти
    показывает две яркие стрелки и красную перечеркнутую улицу, при материализации
    телефон получает вибрацию 45 мс.'
  technical_complexity: Средняя
  strengths:
  - Поведение врагов напрямую меняет карту
  - Каждый забег оставляет собственный рисунок маршрута
  - Наказывает повторение без случайного нечитаемого штрафа
  weaknesses:
  - Нужно предотвращать закрытие единственного доступного прохода
  - Требуется аккуратно объяснить игроку, почему перекрыта именно эта улица
- name: Перекресток на ходу
  category: Источник решений и смены темпа. Он переводит давление орды в конкретный
    выбор между скоростью, видимостью, укрытием и риском памяти.
  priority: secondary
  description: Перекресток не останавливает игру и не открывает экран выбора. Это
    короткий дорожный прогноз, который игрок принимает пальцем или боковым движением,
    продолжая одновременно держать угрозу на прицеле.
  player_interaction: 'Клавиатура: A выбирает левый вход, D правый, W выбирает центральный
    проход, если он есть. Тач: свайп в сторону входа с минимальной длиной 80 пикселей
    за 0.35 с. Выбор можно изменить до фиксации.'
  feedback: 'Визуал/VFX: каждый вход получает отдельный цвет света, длину светового
    луча и контур укрытия; выбранный путь собирает капли дождя в направляющую ленту.;
    Звук (Web Audio): направления входов панорамируются влево, центр и вправо, а у
    ожидаемого ордой пути слышен ритм тяжелых шагов.; Камера (импульс/зум): при открытии
    перекрестка зум уменьшается на 5%, чтобы показать варианты, а при фиксации поворота
    камера плавно наклоняется на 3 градуса.; UI/Тактильность: над входами появляются
    только три значения: дистанция в метрах, видимость в процентах и риск памяти;
    выбранный свайп получает вибрацию 28 мс.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Сжатие строя
  category: поведение орды
  priority: ядро
  description: Преследователи движутся не только отдельными целями, но и временными
    формациями. Дальний строй показывает, какая улица будет перекрыта, а передний
    край пытается разрезать путь к следующему адресу.
  player_interaction: 'Движение задается WASD или направлением пальца. Прицел мыши
    или второго пальца выбирает край строя. Отдельные команды строю нет: его поведение
    меняется от того, сколько времени игрок провел на сегменте.'
  feedback: 'Визуал/VFX: дальний строй движется как единая черная полоса с отдельными
    мокрыми силуэтами, а при сведении на асфальте появляется клиновидная тень.; Звук
    (Web Audio): шаги строя синхронизированы в низкий ритм, направление фронта панорамируется,
    а разрез добавляет два расходящихся щелчка.; Камера (импульс/зум): при появлении
    фронта камера отдаляется на 3%, при закрытии щели получает направленный толчок
    0.035 м.; UI/Тактильность: на краю экрана появляется тонкая стрелка давления,
    ее частота пульса увеличивается от 1 Гц до 3 Гц; сжатие строя дает вибрацию 35
    мс.'
  technical_complexity: Высокая
  strengths:
  - Привносит в шутер чтение движения толпы
  - Даёт телеграф следующего перекрытия до его наступления
  - Создаёт связь между выбором цели и будущей географией уровня
  weaknesses:
  - Сложнее балансировать на маленьких экранах
  - Потребуются упрощённые формации на слабых устройствах
- name: Пакет-маяк и хрупкий груз
  category: Одновременно источник навигации, приманка для орды и главный объект поражения.
    Игрок обязан нести свет, который помогает читать новые проходы, но выдает его
    положение.
  priority: secondary
  description: Цель доставки не является пассивным предметом или полосой здоровья.
    Пакет одновременно объясняет игроку, куда идти, привлекает врага и заставляет
    принимать маршрутные решения, потому что лучший световой путь может оказаться
    самым заметным для орды.
  player_interaction: Пакет не отключается отдельной кнопкой. Клавиши WASD и свайп
    меняют его положение относительно корпуса, а удержание движения вперед направляет
    свет к следующему терминалу. На терминале игрок удерживает экран или клавишу W
    для загрузки.
  feedback: 'Визуал/VFX: пакет излучает теплый конус, на мокром асфальте появляется
    6-метровая дорожка, а при повреждении свет пульсирует от белого к красному.; Звук
    (Web Audio): маяк имеет мягкий тон каждые 1.2 с, который становится выше при приближении
    к терминалу; контакт добавляет треск и глухое сердцебиение.; Камера (импульс/зум):
    при входе в радиус терминала камера приближает пакет на 4%, а при каждом повреждении
    делает импульс 0.03 м в сторону преследователя.; UI/Тактильность: вокруг пакета
    отображается кольцо контакта 2 с, три заряда выносливости находятся в нижнем углу;
    потеря заряда дает вибрацию 90 мс, разрушение пакета - 180 мс.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
gameplay_systems:
- name: Контракт доставки
  purpose: Задаёт конечную цель, ритм волн и причину двигаться через город.
  input: Прицеливание, движение, удержание очереди и выбор улицы.
  rules:
  - Контракт состоит из 4 адресов и 4 волн
  - Каждый адрес требует 3 секунды удержания зоны доставки
  - Пакет нельзя потерять до достижения следующего терминала
  state:
  - Ожидание
  - Доставка к адресу
  - Удержание терминала
  - Переход между районами
  - Контракт завершён
  - Контракт провален
  interactions: Игрок движется между терминалами, удерживает прицел на угрозах и выбирает
    новый путь на перекрёстках.
  feedback: Прогресс доставки показывается заполнением красного индикатора на пакете
    и коротким звуковым подтверждением адреса.
  edge_cases:
  - Если орда входит в терминал во время доставки, прогресс замораживается, но не
    сбрасывается
  - Если выбранный сегмент закрывается в момент входа игрока, выход остаётся доступным
    ещё 1,5 секунды
- name: Учёт памяти улиц
  purpose: Преобразует привычки игрока в понятное изменение маршрутов.
  input: Позиция игрока и время нахождения на сегментах улиц.
  rules:
  - Учёт ведётся только во время активной волны
  - Сегмент считается использованным после 1,2 секунды пребывания
  - Самый использованный сегмент закрывается после волны, но система сохраняет минимум
    2 прохода
  state:
  - Сбор статистики
  - Определение лидирующего сегмента
  - Предупреждение о закрытии
  - Фактическое перекрытие
  - Пересчёт маршрута
  interactions: Игрок меняет собственную статистику, заранее переходя на альтернативный
    путь и не повторяя безопасный круг.
  feedback: На мини-схеме отображаются тонкие следы частоты маршрутов, а закрытый
    сегмент получает красный замок и видимое движение орды.
  edge_cases:
  - При равенстве сегментов закрывается тот, что ближе к последнему терминалу
  - Начальный и конечный сегменты не могут быть закрыты
- name: Адаптация мобильного ввода
  purpose: Сохраняет одновременно движение, прицеливание и стрельбу без виртуального
    джойстика.
  input: Перетаскивание пальца, удержание цели и короткий свайп на перекрёстке.
  rules:
  - Длинное перетаскивание управляет прицелом, а движение вперёд поддерживается автоматически
    на прямом сегменте
  - Удержание на силуэте дольше 0,12 секунды включает очередь
  - Свайп короче 180 миллисекунд на зоне перекрёстка считается выбором улицы
  state:
  - Свободный прицел
  - Захват цели
  - Автоматическая очередь
  - Окно выбора прохода
  - Подтверждённый поворот
  interactions: Палец перетаскивает прицел и удерживается на цели; отдельный короткий
    свайп влево или вправо выбирает улицу.
  feedback: При захвате вокруг силуэта появляется кольцо, при начале очереди кольцо
    пульсирует, а при свайпе камера плавно наклоняется.
  edge_cases:
  - Свайп вне перекрёстка не меняет направление и не сбивает текущую очередь
  - При касании двумя пальцами второй палец игнорируется, чтобы не вызвать случайный
    поворот
  - На узком экране указатели проходов увеличиваются, но не перекрывают прицел
core_design:
  signature_moment: На третьей волне игрок видит, как черная масса перекрывает знакомый
    круг, а автоматическая очередь отбрасывает переднего преследователя ровно настолько,
    чтобы курьер успел свернуть в новый освещенный проход; за спиной строй орды повторяет
    прежний маршрут и ошибается на перекрестке.
  genre_template_rejected: Отвергается шаблон обычного арена-выживания с неподвижной
    ареной, бесконечными волнами и постоянными улучшениями оружия. Он учит игрока
    кружить по безопасному кругу, тогда как фантазия последнего курьера требует постоянно
    менять маршрут, читать улицу и использовать очередь как средство удержания прохода,
    а не как источник наращиваемой силы.
  what_makes_it_different: Победа строится не на уничтожении всей орды, а на доставке
    груза через меняющуюся карту памяти. Игрок одновременно ведет светящийся пакет,
    выбирает менее ожидаемый путь и удерживает только критический участок улицы автоматической
    очередью. После каждой волны сама карта становится записью предыдущих решений
    игрока.
  micro_loop:
  - step: Захват силуэта
    player_action: Игрок ведет прицел по ближайшему преследователю и удерживает его
      в конусе наведения.
    game_response: Оружие фиксирует цель, подает короткий звуковой щелчок и подсвечивает
      направление отбрасывания.
    decision: Оставить переднюю угрозу для освобождения прохода или перевести прицел
      на разведчика сбоку.
    duration: 0.16 с
  - step: Подавляющая очередь
    player_action: Игрок продолжает движение и не отпускает удержание цели.
    game_response: Автоматическая очередь наносит попадания и сдвигает выбранного
      преследователя назад.
    decision: Тратить очередь на ближайший силуэт или экономить время наведения ради
      более опасной угрозы.
    duration: 0.24 с
  - step: Освобождение светового коридора
    player_action: Игрок смещается к краю свободного прохода, сохраняя пакет в направлении
      следующего адреса.
    game_response: Свет пакета прорезает дождь, показывает два ближайших входа и оставляет
      на асфальте короткую световую дорожку.
    decision: Выбрать более длинный освещенный путь или короткий путь с плохой видимостью.
    duration: 1.2 с
  - step: Проверка контакта
    player_action: Игрок меняет направление, чтобы не дать преследователю удерживаться
      рядом.
    game_response: При опасной близости камера делает импульс, а шкала выносливости
      начинает заполнять кольцо контакта.
    decision: Сделать резкий поворот через узкий проход или сохранить прямой ход и
      рискнуть зарядом.
    duration: 0.8 с
  - step: Проход перекрестка
    player_action: Игрок выполняет свайп влево или вправо либо нажимает A/D, пока
      видит подсвеченные указатели.
    game_response: Курьер плавно пересекает выбранный вход, а орда пытается продолжить
      предсказанный маршрут.
    decision: Выбрать направление с минимальной памятью орды, даже если оно требует
      дополнительного времени.
    duration: 2.5 с
  meso_loop:
  - step: Набор давления
    player_action: Игрок движется к терминалу, удерживая передний проход очередью.
    game_response: Преследователи сходятся к световому пакету, а дальний строй формирует
      силуэт будущего перекрытия.
    decision: Подавлять передний край или заранее уйти на боковой маршрут.
    duration: 12 с
  - step: Считывание строя
    player_action: Игрок на ходу смотрит на плотность фигур и слышит направление шагов.
    game_response: Улица, которую строй пересекает чаще всего, получает красный контур
      памяти.
    decision: Считать красный контур запрещенным уже сейчас или использовать его последний
      раз ради короткого пути.
    duration: 3 с
  - step: Перестройка маршрута
    player_action: Игрок пересекает перекресток через один из двух или трех входов.
    game_response: Выбранный сегмент записывает время пребывания, а два других получают
      разные значения света, укрытий и риска.
    decision: Сбалансировать скорость доставки и вероятность нового перекрытия.
    duration: 8 с
  - step: Захват терминала
    player_action: Игрок входит в зону адресного терминала и продолжает держать хотя
      бы один проход свободным.
    game_response: Запускается трехсекундная загрузка, вокруг терминала появляются
      направляющие кольца.
    decision: Оставаться в зоне и отбрасывать угрозу или выйти на метр из зоны, чтобы
      сохранить груз.
    duration: 3 с
  - step: Черное перекрытие
    player_action: Игрок читает улицу после завершения волны и выбирает новый первый
      вход.
    game_response: Самый часто использованный сегмент заполняется плотной черной массой,
      а орда меняет точку сближения.
    decision: Выбрать новый освещенный путь до следующего адреса за короткое окно
      планирования.
    duration: 6 с
  macro_loop:
  - step: Принять контракт
    player_action: Игрок выбирает район и запускает доставку одного светящегося пакета.
    game_response: Открывается маршрут из четырех последовательных терминалов, запускается
      таймер контракта.
    decision: Принять район с лучшим временем или впервые войти в еще не открытый
      район.
    duration: 10 с
  - step: Доставить через первый район
    player_action: Игрок переживает первую волну и удерживает проход у первого терминала.
    game_response: Медленные преследователи раскрывают базовое направление давления,
      затем один переулок заполняется черной массой.
    decision: Запомнить поведение орды и отказаться от привычного круга.
    duration: 41 с
  - step: Пережить четыре записи памяти
    player_action: Игрок проходит четыре волны, каждый раз меняя приоритетный вход.
    game_response: Плотность орды растет, добавляются обход, разведчики, туман и второе
      перекрытие.
    decision: Рисковать скоростью ради непредсказуемости или идти по безопасному,
      но более длинному световому пути.
    duration: 180 с
  - step: Закрыть контракт
    player_action: Игрок удерживает пакет в четвертом терминале 3 секунды.
    game_response: Терминал гасит маршрутную метку, фиксирует время и открывает следующий
      район либо косметику сумки.
    decision: Повторить контракт ради лучшего времени или завершить забег.
    duration: 3 с
  loop_diagram: "[Принять пакет] -> [Навести прицел] -> [Отбросить преследователя]\
    \ -> [Бежать к перекрестку]\n       ^                                        \
    \                |\n       |                                                 \
    \       v\n[Читать черное перекрытие] <- [Пережить волну] <- [Выбрать новый проход]\n\
    \       |\n       v\n[Удержать терминал 3 с] -> [Следующий район] -> [Четвертая\
    \ доставка]\n       ^                                           |\n       +----------------\
    \ [Победа или таймер 240 с] <-+"
  tension_curve: 'Первые 8 секунд каждой волны дают читаемый ритм очереди и медленных
    шагов. С 8 до 28 секунды давление растет за счет боковых угроз и сужения свободного
    прохода. Последние 7-17 секунд создают пик: строй показывает будущий маршрут перекрытия,
    а игрок обязан пройти перекресток под огнем. После волны напряжение резко падает
    до 6-секундного окна чтения улицы, но решение о новом направлении сохраняет тревогу.'
  core_formulas:
  - 'Урон очереди: damage_per_hit = 1 единица отбрасывания; попадание по переднему
    преследователю уменьшает его продвижение на 0.55 м и добавляет 0.24 с задержки
    строю.'
  - 'Сила отбрасывания: push_distance = 3.2 м/с × 0.24 с × hit_count; при 4 попаданиях
    проход освобождается примерно на 3.1 м.'
  - 'Память улицы: memory_score(segment) = время игрока на сегменте / 40 с + 0.15
    × число прежних посещений; сегмент с максимальным значением становится целью перекрытия.'
  - 'Выбор маршрута: route_score = 0.40 × light_visibility + 0.25 × cover_value +
    0.20 × distance_value - 0.35 × memory_risk; значения нормируются от 0 до 1.'
  - 'Скорость строя: formation_speed = 1.7 м/с + 0.25 м/с × номер волны; при плотности
    выше 70% строй получает ширину 4.5 м и блокирует один вход.'
  - 'Потеря выносливости: если контакт с преследователем длится 0.8 с, stamina_charges
    уменьшается на 1 из 3, а игрок получает 1.2 с неуязвимости.'
  - 'Разрушение пакета: если horde_contact_duration >= 2 с, package_integrity становится
    0; при timer >= 240 с контракт завершается поражением.'
  run_progression:
  - 'Волна 1 длится 35 с: один перекресток, один доступный обход и медленные преследователи
    со скоростью 1.4 м/с.'
  - 'Волна 2 длится 40 с: появляется боковой обход, строй шириной 3.5 м и первое устойчивое
    перекрытие привычного пути.'
  - 'Волна 3 длится 42 с: безопасное окно выбора уменьшается до 2.5 с, появляются
    быстрые разведчики со скоростью 2.8 м/с, которые заранее давят на невыбранный
    вход.'
  - 'Волна 4 длится 45 с: активны два перекрытия, дождевой туман снижает дальность
    видимости до 18 м, а финальный сход орды сохраняет минимум два визуально различимых
    прохода.'
  - Между волнами остается 6 с на чтение карты памяти; четыре удержания терминалов
    требуют по 3 с, поэтому полный контракт укладывается примерно в 192 с при успешном
    маршруте.
  meta_progression:
  - После победы сохраняется лучшее время доставки для каждого района, но скорость
    очереди, отбрасывание и выносливость не усиливаются.
  - Открываются новые районы с другими схемами перекрестков, светом и укрытиями, но
    они не дают постоянного численного преимущества.
  - 'За успешные контракты открываются только косметические варианты сумки: цвет светового
    корпуса, отражающая лента и форма маршрутного знака.'
  - Повторный контракт меняет начальные вероятности перекрытий и позволяет улучшить
    время, но не меняет базовые правила угроз.
  mechanics:
  - name: Подавляющая очередь
    role_in_loop: Двигатель движения и кратковременный источник контроля прохода.
      Очередь не уничтожает орду, а покупает курьеру несколько метров для смены маршрута.
    player_decision: Каждые 0.24 с игрок решает, оставлять ли прицел на ближайшем
      силуэте ради отбрасывания переднего края или переключиться на боковую угрозу,
      которая скоро коснется пакета.
    input_mapping: 'Клавиатура и мышь: удерживать левую кнопку мыши для наведения,
      WASD для движения. Тач: вести палец по экрану для прицела и удерживать второй
      палец либо кнопку автоочереди. Отдельная кнопка переключения цели не нужна:
      приоритет выбирается направлением прицела.'
    states:
    - 'Поиск: в конусе нет подходящей угрозы, оружие только отслеживает ближайший
      силуэт.'
    - 'Захват: силуэт находится в конусе наведения 0.16 с, появляется тонкая белая
      рамка.'
    - 'Очередь: каждые 0.24 с проверяется попадание и применяется отбрасывание.'
    - 'Срыв: цель вышла дальше 26 м или за пределы конуса 5 градусов; очередь замолкает
      и рамка распадается.'
    - 'Перегрузка внимания: одновременно в зоне находятся 3 и более угроз, поэтому
      прицел выбирает ближайшую, но игрок может вручную увести его на бокового разведчика.'
    parameters:
    - name: Время захвата силуэта
      value: 0.16 с
      tuning_note: Ниже 0.10 с очередь ощущается как мгновенный автоматический чит;
        выше 0.24 с игрок слишком часто теряет окно перед поворотом.
    - name: Интервал очереди
      value: 0.24 с
      tuning_note: Ниже 0.18 с проход освобождается без решений; выше 0.32 с преследователь
        успевает касаться пакета между попаданиями.
    - name: Конус наведения
      value: 5 градусов
      tuning_note: Шире 8 градусов игра сама выбирает цель за игрока; уже 3 градусов
        управление на таче становится нервным и неточным.
    - name: Дальность надежного попадания
      value: 26 м
      tuning_note: Ниже 20 м игрок поздно видит угрозу; выше 32 м очередь решает маршрут
        раньше, чем игрок успевает его прочитать.
    - name: Скорость отбрасывания
      value: 3.2 м/с
      tuning_note: Ниже 2.4 м/с очередь не создает коридор; выше 4.2 м/с передний
        край слишком легко исчезает из сцены.
    - name: Длительность импульса попадания
      value: 0.24 с
      tuning_note: При 0.12 с попадания выглядят как сухой хитскан без веса; при 0.40
        с строй начинает дергаться и теряет читаемую геометрию.
    feedback_layers:
    - 'Визуал/VFX: каждое попадание дает короткий янтарный импульс на силуэте, след
      дождевых искр и видимое смещение тела на 0.24 с.'
    - 'Звук (Web Audio): щелчок захвата панорамируется к цели, очередь имеет три тембровых
      слоя, а успешное отбрасывание добавляет низкий удар с громкостью 0.8.'
    - 'Камера (импульс/зум): попадание дает толчок камеры 0.012 м и зум на 2%, но
      серия из четырех попаданий ограничена общим толчком 0.04 м.'
    - 'UI/Тактильность: вокруг прицела заполняется дуга 0.16 с, при отбрасывании на
      поддерживаемом телефоне идет вибрация 18 мс, а при потере цели дуга сереет.'
    failure_mode: 'Игрок удерживает прицел на уже безопасной цели и не замечает бокового
      разведчика. Сигнал причины виден сразу: очередь продолжает звучать, но красный
      маркер контакта пакета появляется сбоку, а свободный коридор не расширяется.'
    mastery_curve: Новичок за первые 30 секунд удерживает ближайший силуэт и учится
      идти вперед. Эксперт к десятому забегу стреляет короткими сериями по переднему
      краю, заранее переводит прицел на угрозу у будущего перекрестка и использует
      последний импульс отбрасывания перед поворотом.
    counterplay: Орда добавляет разведчиков, которые подходят сбоку, и плотные строи,
      по которым отдельное попадание дает меньше визуального смещения. На четвертой
      волне туман сокращает надежную дальность, поэтому очередь перестает быть универсальным
      решением.
    synergies:
    - Память перекрытий записывает время на участке, пока очередь позволяет игроку
      оставаться на нем; чрезмерное использование одного коридора делает его будущей
      целью орды.
    - Перекресток на ходу требует решить, на какую угрозу тратить прицел перед свайпом.
    - Сжатие строя превращает направление отбрасывания в читаемый инструмент разрезания
      переднего края.
    - Пакет-маяк показывает ближайший вход, но его контактная зона заставляет не тратить
      всю очередь на дальние цели.
    why_unique: 'Вместо прокачки урона и зачистки экрана автоматическая стрельба работает
      как рулевое управление маршрутом: игрок буквально выталкивает угрозу из нужного
      прохода на время, достаточное для продолжения доставки.'
    pseudocode: "input_target = read_aim_direction()\nnearest_target = find_threat_in_cone(input_target,\
      \ 5 градусов, 26 м)\nif nearest_target exists and lock_timer < 0.16 с:\n   \
      \ lock_timer += delta_time\nif nearest_target exists and lock_timer >= 0.16\
      \ с and burst_timer <= 0:\n    apply_hit(nearest_target, 1 единица)\n    push_target(nearest_target,\
      \ 3.2 м/с)\n    play_burst_feedback()\n    burst_timer = 0.24 с\nburst_timer\
      \ -= delta_time\nif nearest_target missing:\n    lock_timer = 0"
  - name: Память перекрытий
    role_in_loop: Тормоз привычного круга и источник стратегического риска. Она превращает
      пройденный маршрут в угрозу следующей волны.
    player_decision: 'Игрок решает, какое время на каждом сегменте действительно стоит
      потратить: короткая остановка у знакомого укрытия помогает пережить волну, но
      увеличивает шанс, что этот сегмент станет черным перекрытием.'
    input_mapping: 'Прямого отдельного ввода нет: направление движения клавишами WASD
      или виртуальным свайпом изменяет запись сегментов. В шестисекундном окне между
      волнами игрок выбирает первый новый вход свайпом или A/D.'
    states:
    - 'Сбор: каждые 0.5 с текущий сегмент получает время присутствия.'
    - 'Сравнение: после волны сегменты сортируются по нормированной доле времени и
      числу повторных посещений.'
    - 'Предупреждение: выбранный сегмент получает красный контур на 1.5 с и звуковой
      низкий гул.'
    - 'Материализация: за 2 с черная масса выходит из переулка и блокирует проход
      минимум на 35 с.'
    - 'Стабилизация: система оставляет минимум два визуально различимых прохода к
      следующему терминалу.'
    parameters:
    - name: Шаг записи времени
      value: 0.5 с
      tuning_note: При 0.1 с случайные микроповороты слишком сильно меняют память;
        при 1.0 с игра не замечает короткую остановку у опасного укрытия.
    - name: Длительность первой волны
      value: 35 с
      tuning_note: Ниже 30 с игрок не успевает сформировать осмысленный круг; выше
        45 с первая запись начинает ощущаться наказанием за обучение.
    - name: Вес прежнего посещения
      value: 0.15 доли риска
      tuning_note: Ниже 0.10 игрок может бесконечно повторять почти одинаковый маршрут;
        выше 0.25 перекрытие становится случайным и не отражает текущий выбор.
    - name: Время материализации массы
      value: 2 с
      tuning_note: Мгновенное закрытие воспринимается как телепорт; дольше 4 с игрок
        успевает проскочить без принятия нового решения.
    - name: Минимум открытых проходов
      value: 2 прохода
      tuning_note: Один проход превращает маршрутную игру в линейный коридор; больше
        3 проходов снижает давление и размывает значение памяти.
    - name: Окно чтения после волны
      value: 6 с
      tuning_note: Ниже 4 с выбор превращается в реакцию; выше 8 с темп короткой сессии
        распадается и напряжение успевает исчезнуть.
    feedback_layers:
    - 'Визуал/VFX: на асфальте остается полупрозрачная световая запись времени, а
      выбранный сегмент заполняется черной жидкой массой с силуэтами строя.'
    - 'Звук (Web Audio): чем выше memory_score, тем громче дальний гул улицы; материализация
      начинается с обратного реверсного шума длительностью 2 с.'
    - 'Камера (импульс/зум): при выборе перекрытия камера делает медленный зум 4%
      на заблокированный вход, а при завершении закрытия получает импульс 0.025 м.'
    - 'UI/Тактильность: карта памяти показывает две яркие стрелки и красную перечеркнутую
      улицу, при материализации телефон получает вибрацию 45 мс.'
    failure_mode: Игрок повторяет знакомый круг и видит, что именно его укрытие заполняется
      черной массой. Если он игнорирует предупреждение, новый строй появляется с той
      же стороны, что и прежний маршрут, поэтому причина поражения читается как последствие
      привычки, а не случайный спавн.
    mastery_curve: Новичок замечает только последнее перекрытие и начинает менять
      направление после факта. Эксперт к десятому забегу намеренно распределяет время
      между тремя сегментами, использует укрытие короткими остановками и заранее оставляет
      низкий memory_score на нужном выходе.
    counterplay: Орда увеличивает плотность и добавляет второе перекрытие на четвертой
      волне. Быстрые разведчики заставляют иногда задержаться на сегменте вопреки
      стратегии, а терминал может временно делать самый безопасный путь самым привлекательным.
    synergies:
    - Подавляющая очередь позволяет пережить короткую остановку на новом сегменте,
      но не отменяет его запись в памяти.
    - Перекресток на ходу дает выбор, который напрямую меняет будущий memory_score.
    - Сжатие строя визуально раскрывает, какой путь орда уже считает привычным.
    - Пакет-маяк делает запись маршрута видимой через световой след и помогает отличать
      свежий путь от запомненного.
    why_unique: Карта не является заранее созданным лабиринтом с ключами. Она анализирует
      фактическое время игрока на улицах и физически выводит его привычку обратно
      в сцену в виде перекрытия.
    pseudocode: "current_segment = detect_street_segment(player_position)\nif current_segment\
      \ exists:\n    segment_time[current_segment] += delta_time\n    segment_visits[current_segment]\
      \ += delta_time / 0.5 с\nif wave_finished:\n    for segment in all_segments:\n\
      \        memory_score[segment] = segment_time[segment] / wave_duration + 0.15\
      \ × segment_visits[segment]\n    blocked_segment = max_score_segment(memory_score)\n\
      \    show_memory_warning(blocked_segment, 1.5 с)\nif warning_timer <= 0:\n \
      \   materialize_black_mass(blocked_segment, 2 с)\n    keep_at_least_open_routes(2\
      \ прохода)"
  - name: Перекресток на ходу
    role_in_loop: Источник решений и смены темпа. Он переводит давление орды в конкретный
      выбор между скоростью, видимостью, укрытием и риском памяти.
    player_decision: На каждом перекрестке игрок выбирает один из двух или трех входов
      до завершения безопасного окна, принимая, что короткий путь может быть темным
      и уже ожидаемым ордой.
    input_mapping: 'Клавиатура: A выбирает левый вход, D правый, W выбирает центральный
      проход, если он есть. Тач: свайп в сторону входа с минимальной длиной 80 пикселей
      за 0.35 с. Выбор можно изменить до фиксации.'
    states:
    - 'Подход: перекресток находится в 18 м, входы получают разные цвета световых
      указателей.'
    - 'Предпросмотр: открывается 2.5-секундное окно, видны дальность, силуэты угроз
      и уровень памяти.'
    - 'Сомнение: игрок сменил направление, предыдущий вход остается призрачным на
      0.4 с.'
    - 'Фиксация: курьер автоматически доворачивает к выбранному проходу и записывает
      вход в маршрут.'
    - 'Срыв: окно истекло или игрок столкнулся со стеной; игра выбирает центральный
      безопасный вход, но добавляет 0.5 с к пути.'
    parameters:
    - name: Дистанция предупреждения
      value: 18 м
      tuning_note: Ниже 12 м игрок видит входы слишком поздно; выше 24 м перекресток
        превращается в меню, а не в решение на бегу.
    - name: Окно выбора
      value: 2.5 с
      tuning_note: Ниже 1.8 с тач-ввод не успевает распознать жест; выше 3.5 с исчезает
        ощущение опасного решения под давлением.
    - name: Минимальная длина свайпа
      value: 80 пикселей
      tuning_note: Ниже 50 пикселей случайные касания меняют маршрут; выше 120 пикселей
        жест приходится делать слишком широко на маленьком экране.
    - name: Время фиксации поворота
      value: 0.4 с
      tuning_note: Ниже 0.25 с поворот выглядит как мгновенная смена рельсов; выше
        0.65 с игрок не чувствует контроля над направлением.
    - name: Штраф автоматического входа
      value: 0.5 с
      tuning_note: Нулевой штраф делает пропуск выбора бесплатным; выше 0.9 с ошибка
        становится сильнее, чем потеря заряда выносливости.
    - name: Количество вариантов
      value: 2 или 3 прохода
      tuning_note: Один вариант убирает решение; четыре и более варианта перегружают
        взгляд и снижают читаемость силуэтов в дождь.
    feedback_layers:
    - 'Визуал/VFX: каждый вход получает отдельный цвет света, длину светового луча
      и контур укрытия; выбранный путь собирает капли дождя в направляющую ленту.'
    - 'Звук (Web Audio): направления входов панорамируются влево, центр и вправо,
      а у ожидаемого ордой пути слышен ритм тяжелых шагов.'
    - 'Камера (импульс/зум): при открытии перекрестка зум уменьшается на 5%, чтобы
      показать варианты, а при фиксации поворота камера плавно наклоняется на 3 градуса.'
    - 'UI/Тактильность: над входами появляются только три значения: дистанция в метрах,
      видимость в процентах и риск памяти; выбранный свайп получает вибрацию 28 мс.'
    failure_mode: Игрок смотрит только на ближайший свет и не замечает красный контур
      памяти. После входа дальний строй сокращает расстояние, а UI показывает, что
      выбранный путь был коротким, но ожидаемым; ошибка объясняется сравнением параметров,
      а не скрытым броском.
    mastery_curve: Новичок выбирает самый яркий и короткий вход. Эксперт сравнивает
      свет, укрытие и memory_risk за 2.5 с, иногда берет длинный путь, если он сохраняет
      два будущих выхода и не повторяет траекторию орды.
    counterplay: Поздние волны сокращают безопасное окно, прячут часть указателей
      туманом и посылают разведчика в самый очевидный вход. При этом минимум два прохода
      остаются различимыми по цвету и силуэту.
    synergies:
    - Память перекрытий превращает выбор самого короткого входа в долгосрочный риск.
    - Подавляющая очередь может открыть время для пересечения, но не продлевает окно
      выбора.
    - Сжатие строя показывает, какой вход орда считает продолжением круга.
    - Пакет-маяк делает маршрут к терминалу видимым и позволяет читать дальний вход
      через дождь.
    why_unique: Перекресток не останавливает игру и не открывает экран выбора. Это
      короткий дорожный прогноз, который игрок принимает пальцем или боковым движением,
      продолжая одновременно держать угрозу на прицеле.
    pseudocode: "if distance_to_crossroad <= 18 м:\n    routes = reveal_routes()\n\
      \    choice_timer = 2.5 с\nwhile choice_timer > 0:\n    input_route = read_keyboard_or_swipe()\n\
      \    if input_route is valid:\n        selected_route = input_route\n      \
      \  show_route_preview(selected_route)\n    choice_timer -= delta_time\nif selected_route\
      \ exists:\n    commit_route(selected_route, 0.4 с)\nelse:\n    commit_route(safest_visible_route,\
      \ 0.4 с)\n    add_route_delay(0.5 с)"
  - name: Сжатие строя
    role_in_loop: Живой телеграф направления давления и источник пространственного
      сопротивления. Орда заранее показывает, какой проход она собирается сомкнуть.
    player_decision: Игрок решает, читать ли дальний строй как предупреждение и менять
      путь заранее или рискнуть пересечь его фронт, пока очередь удерживает узкую
      щель.
    input_mapping: 'Движение задается WASD или направлением пальца. Прицел мыши или
      второго пальца выбирает край строя. Отдельные команды строю нет: его поведение
      меняется от того, сколько времени игрок провел на сегменте.'
    states:
    - 'Дальний силуэт: 8-12 фигур движутся группой и обозначают направление будущего
      давления.'
    - 'Сведение: расстояние между крайними преследователями уменьшается, строй выбирает
      самый посещаемый сегмент.'
    - 'Фронт: строй занимает ширину улицы и оставляет щель не менее 2.2 м только при
      достаточном отбрасывании.'
    - 'Разрез: очередь или препятствие разделяет строй на две части, которые повторно
      сходятся через 1.4 с.'
    - 'Сход: при финальном давлении строй окружает терминал, но сохраняет минимум
      один свободный проход для чтения игроком.'
    parameters:
    - name: Размер дальнего строя
      value: 8-12 фигур
      tuning_note: Меньше 6 фигур не читается как формация; больше 14 фигур превращает
        силуэты в сплошную стену и скрывает проходы.
    - name: Базовая скорость строя
      value: 1.7 м/с
      tuning_note: Ниже 1.3 м/с строй не давит на маршрут; выше 2.2 м/с игрок не успевает
        использовать предупреждение до закрытия входа.
    - name: Ширина фронта
      value: 4.5 м
      tuning_note: Уже 3 м формация легко обходится без решения; шире 6 м она блокирует
        улицу целиком и ломает правило двух проходов.
    - name: Минимальная ширина щели
      value: 2.2 м
      tuning_note: Ниже 1.8 м камера и коллизии ощущаются несправедливыми; выше 3
        м строй перестает быть реальным препятствием.
    - name: Время повторного сведения
      value: 1.4 с
      tuning_note: Ниже 1.0 с разрез строя не дает награды за точность; выше 2.0 с
        игрок может постоянно держать орду разделенной.
    - name: Дистанция визуального телеграфа
      value: 32 м
      tuning_note: Ниже 24 м игрок видит перекрытие только в момент столкновения;
        выше 40 м дождь и перспектива делают направление неоднозначным.
    feedback_layers:
    - 'Визуал/VFX: дальний строй движется как единая черная полоса с отдельными мокрыми
      силуэтами, а при сведении на асфальте появляется клиновидная тень.'
    - 'Звук (Web Audio): шаги строя синхронизированы в низкий ритм, направление фронта
      панорамируется, а разрез добавляет два расходящихся щелчка.'
    - 'Камера (импульс/зум): при появлении фронта камера отдаляется на 3%, при закрытии
      щели получает направленный толчок 0.035 м.'
    - 'UI/Тактильность: на краю экрана появляется тонкая стрелка давления, ее частота
      пульса увеличивается от 1 Гц до 3 Гц; сжатие строя дает вибрацию 35 мс.'
    failure_mode: Игрок смотрит на ближайших врагов и пропускает дальний клин строя.
      Через 1.4 с боковые силуэты сходятся перед ним, а UI-стрелка показывает направление;
      причина контакта считывается как проигнорированная формация.
    mastery_curve: Новичок стреляет в первую фигуру и пытается остановить весь строй.
      Эксперт к десятому забегу читает клин за 32 м, выбирает край для разреза, оставляет
      вторую половину строя позади и не дает ему занять путь к терминалу.
    counterplay: Во второй волне строй впервые перекрывает привычный путь, в третьей
      получает поддержку быстрых разведчиков, а в четвертой смешивается с двумя черными
      массами и туманом. Сопротивление растет через геометрию пространства, а не через
      простое увеличение здоровья.
    synergies:
    - Память перекрытий выбирает сегмент, к которому строй будет сводиться, связывая
      его поведение с историей маршрута.
    - Подавляющая очередь временно раздвигает фронт и создает щель для движения.
    - Перекресток на ходу позволяет свернуть по телеграфу до того, как фронт займет
      вход.
    - Пакет-маяк подсвечивает края строя и не дает черной массе полностью исчезнуть
      в дожде.
    why_unique: Орда становится не набором целей, а читаемой подвижной картой намерения.
      Игрок реагирует на геометрию будущего перекрытия, а не только на здоровье ближайшего
      врага.
    pseudocode: "pressure_segment = choose_segment_by_memory_score()\nformation =\
      \ move_formation_toward(pressure_segment, 1.7 м/с)\nif distance_to_player <=\
      \ 32 м:\n    show_formation_telegraph(formation)\nif formation_width > 4.5 м\
      \ and player_crossing_front:\n    close_route_gap()\nif hit_count_on_front >=\
      \ 2:\n    split_formation(formation)\n    merge_timer = 1.4 с\nif merge_timer\
      \ <= 0:\n    merge_formation(formation)\nif final_wave and route_count < 2:\n\
      \    preserve_open_route(2 прохода)"
  - name: Пакет-маяк и хрупкий груз
    role_in_loop: Одновременно источник навигации, приманка для орды и главный объект
      поражения. Игрок обязан нести свет, который помогает читать новые проходы, но
      выдает его положение.
    player_decision: Игрок выбирает, направлять ли пакет к более заметному и безопасному
      входу или скрывать его за укрытием и идти через менее освещенный путь, рискуя
      потерять ориентацию.
    input_mapping: Пакет не отключается отдельной кнопкой. Клавиши WASD и свайп меняют
      его положение относительно корпуса, а удержание движения вперед направляет свет
      к следующему терминалу. На терминале игрок удерживает экран или клавишу W для
      загрузки.
    states:
    - 'Несение: пакет закреплен у курьера, светит конусом вперед и оставляет световой
      след.'
    - 'Открытый маяк: пакет освещает входы и притягивает ближайший край орды к радиусу
      света.'
    - 'Повреждение: преследователь находится в контакте, счетчик разрушения растет
      до 2 с.'
    - 'Доставка: курьер находится в зоне терминала 3 с, световой конус фиксируется
      на приемнике.'
    - 'Разрушение: контакт достиг 2 с, контракт немедленно заканчивается поражением.'
    parameters:
    - name: Радиус светового маяка
      value: 14 м
      tuning_note: Ниже 10 м новые проходы теряются в дождь; выше 18 м свет раскрывает
        слишком много пространства и убирает ценность выбора.
    - name: Угол светового конуса
      value: 42 градуса
      tuning_note: Уже 30 градусов игрок не видит боковые входы на таче; шире 55 градусов
        пакет перестает задавать направление движения.
    - name: Длина светового следа
      value: 6 м
      tuning_note: Короче 4 м путь быстро исчезает за спиной; длиннее 9 м игрок всегда
        видит безопасную историю и меньше читает сам перекресток.
    - name: Время разрушительного контакта
      value: 2 с
      tuning_note: Ниже 1.5 с потеря груза кажется случайной; выше 3 с игрок успевает
        игнорировать прямой контакт и не чувствует хрупкость пакета.
    - name: Длительность доставки
      value: 3 с
      tuning_note: Ниже 2 с терминал не создает оборонительного момента; выше 4 с
        остановка начинает доминировать над бегом по маршруту.
    - name: Запас выносливости
      value: 3 заряда
      tuning_note: Два заряда делают один случайный контакт слишком дорогим; четыре
        заряда снижают страх перед перекрестком и убирают ценность чистого движения.
    feedback_layers:
    - 'Визуал/VFX: пакет излучает теплый конус, на мокром асфальте появляется 6-метровая
      дорожка, а при повреждении свет пульсирует от белого к красному.'
    - 'Звук (Web Audio): маяк имеет мягкий тон каждые 1.2 с, который становится выше
      при приближении к терминалу; контакт добавляет треск и глухое сердцебиение.'
    - 'Камера (импульс/зум): при входе в радиус терминала камера приближает пакет
      на 4%, а при каждом повреждении делает импульс 0.03 м в сторону преследователя.'
    - 'UI/Тактильность: вокруг пакета отображается кольцо контакта 2 с, три заряда
      выносливости находятся в нижнем углу; потеря заряда дает вибрацию 90 мс, разрушение
      пакета - 180 мс.'
    failure_mode: Игрок оставляет преследователя у пакета ради стрельбы по дальней
      цели. Красное кольцо контакта доходит до 2 с, звук треска усиливается, после
      чего пакет гаснет; игрок понимает, что проиграл не из-за общего здоровья орды,
      а из-за неверного приоритета.
    mastery_curve: Новичок держит пакет открытым впереди и поздно замечает боковые
      угрозы. Эксперт к десятому забегу использует световой конус как приманку, прячет
      пакет за углом на долю секунды, затем направляет его на менее ожидаемый вход
      и заранее готовит безопасную позицию для трехсекундной доставки.
    counterplay: 'Орда стремится к свету, но не всей массой: передний край атакует
      пакет, а дальний строй перекрывает запомненный путь. Туман четвертой волны уменьшает
      дальность чтения, не отключая свет полностью, поэтому игроку приходится двигаться,
      а не ждать в укрытии.'
    synergies:
    - Подавляющая очередь освобождает пространство вокруг пакета и отбрасывает контактующую
      угрозу.
    - Память перекрытий записывает видимый световой след и делает слишком часто освещенный
      маршрут будущей целью.
    - Перекресток на ходу использует свет пакета для сравнения двух или трех входов.
    - Сжатие строя реагирует на маяк, поэтому его клин показывает, откуда орда будет
      пытаться добраться до груза.
    why_unique: Цель доставки не является пассивным предметом или полосой здоровья.
      Пакет одновременно объясняет игроку, куда идти, привлекает врага и заставляет
      принимать маршрутные решения, потому что лучший световой путь может оказаться
      самым заметным для орды.
    pseudocode: "package_position = update_package_with_player_motion()\nshow_light_cone(package_position,\
      \ 14 м, 42 градуса)\nleave_route_trace(package_position, 6 м)\nif threat_distance_to_package\
      \ <= 0.8 м:\n    package_contact += delta_time\nelse:\n    package_contact =\
      \ max(0, package_contact - delta_time × 0.5)\nif package_contact >= 2 с:\n \
      \   package_integrity = 0\n    trigger_defeat(\"package_destroyed\")\nif player_in_terminal_zone\
      \ and hold_delivery_input:\n    delivery_timer += delta_time\n    if delivery_timer\
      \ >= 3 с:\n        complete_delivery()"
tech_spec:
  language: TypeScript в строгом режиме
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Реактивное хранилище состояния и шина событий
  audio_engine: Web Audio API с процедурными короткими слоями
  target_fps: 60
  max_draw_calls: 80
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - name: Сцена
    responsibility: Модульный мокрый город, улицы, здания, вывески, дождь и терминалы.
    budget: До 35 000 треугольников
  - name: Игрок
    responsibility: Капсульное движение, камера от первого лица, прицеливание и пакет.
    budget: Одна камера и до 3 локальных эффектов
  - name: Орда
    responsibility: Пулы преследователей, навигация по сегментам и формации.
    budget: До 24 активных преследователей
  - name: Память
    responsibility: Учёт времени на сегментах, выбор перекрытия и визуальный след
      маршрута.
    budget: До 32 сегментов маршрута
  - name: Платформа
    responsibility: Playgama Bridge, пауза, реклама, сохранения и ориентация.
    budget: Асинхронная инициализация без блокировки первого кадра
  modules:
  - name: scene
    purpose: Создание городских модулей и освещения
  - name: route
    purpose: Граф улиц, перекрёстки и выбор прохода
  - name: combat
    purpose: Прицел, автоматическая очередь, урон и подавление
  - name: horde
    purpose: Навигация, формации, спавн и перекрытия
  - name: contract
    purpose: Волны, адреса, пакет и условия победы
  - name: input
    purpose: Мышь, клавиатура и сенсорные жесты
  - name: platform
    purpose: Bridge, реклама, облачное сохранение и жизненный цикл
monetization:
  strategy_summary: Монетизация не меняет силу оружия и не продаёт лучший маршрут.
    Доход строится на редком возрождении за вознаграждаемую рекламу и косметических
    наборах для сумки, плаща и городских эффектов.
  rewarded_placements:
  - id: restart_contract
    name: Продолжить доставку
    benefit: Один раз за контракт восстановить 1 заряд выносливости и вернуться к
      последнему терминалу.
    cooldown_or_limit: 1 раз за контракт
    trigger_moment: После поражения, только после показа итогов маршрута.
  - id: route_replay
    name: Сохранить маршрут
    benefit: После завершения контракта открыть подробную запись маршрута и сравнение
      с лучшим результатом.
    cooldown_or_limit: 1 раз за сессию
    trigger_moment: На экране итогов, без прерывания активной доставки.
  interstitial_placements:
  - trigger_event: Завершение контракта или окончательное поражение
    cooldown_seconds: 120
    conditions: Не показывать в первой сессии, во время волны, перед выбором улицы
      или сразу после вознаграждаемой рекламы.
  in_app_purchases:
  - sku: bag_neon_route
    name: Неоновая сумка маршрута
    description: Косметический светящийся рисунок на пакете.
    price_tier: низкий
    reward: Визуальный вариант пакета без изменения яркости, урона или дальности.
  - sku: raincoat_set
    name: Комплект дождевого плаща
    description: Три цветовых варианта плаща курьера.
    price_tier: средний
    reward: Косметический набор.
  fairness_rules:
  - Никаких покупаемых усилений урона, скорости или здоровья.
  - Вознаграждаемая реклама не отменяет память орды и не открывает закрытую улицу.
  - Реклама не должна появляться во время активной волны или окна выбора.
  - Косметика не изменяет силуэт врагов, читаемость проходов и размер прицела.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - Yandex Games
  - VK Play
  - Playgama Web
  - Мобильный браузер
  initialization_flow:
  - Запустить Three.js-загрузчик и показать статичный силуэт города.
  - Инициализировать Bridge без блокировки локального старта.
  - Получить состояние рекламы, игрока и облачного хранилища.
  - Проверить ориентацию и безопасную область.
  - После первого интерактивного кадра вызвать сигнал готовности игры.
  cloud_save_keys:
  - courier_best_delivery_time
  - courier_best_route
  - courier_completed_contracts
  - courier_cosmetic_unlocks
  - courier_settings
  leaderboards:
  - Лучшее время доставки
  - Самый длинный контракт без потери заряда
  - Наименьшая доля использованного одного маршрута
  ads_integration:
    rewarded: Вознаграждение выдаётся только после подтверждённого завершения рекламы.
    interstitial: Показывать между контрактами с ограничением по времени.
    pause_behavior: При открытии рекламы заморозить волну, таймер и положение орды.
  lifecycle_hooks:
  - При уходе приложения в фон поставить игру на паузу.
  - При возвращении проверить ориентацию и восстановить звук с учётом настроек.
  - Перед закрытием записать последний завершённый контракт.
  - Не засчитывать незавершённую доставку как победу при аварийном выходе.
art:
  style_name: Дождевой неон и мокрый кирпич
  camera_perspective: Вид от первого лица на уровне глаз курьера, с красной сумкой
    в нижней части кадра и крупным центрированным прицелом.
  camera_fov: 72
  camera_pitch_angle: 0
  environment_theme: Узкие кирпичные переулки, нависающие кабели, пожарные лестницы,
    мокрая мостовая, янтарные окна и красные сигнальные лампы.
  character_proportions: Силуэты преследователей немного выше человека, с вытянутыми
    плечами и читаемыми угловатыми позами; без мелких лицевых деталей.
  lighting_setup: Холодный синий свет неба, тёплый янтарный свет окон, красные локальные
    сигналы у опасных сегментов и мягкие отражения на мокрой земле.
  color_palette:
    небо: '#101B2D'
    кирпич: '#4A2E32'
    мокрая мостовая: '#182532'
    янтарный свет: '#FFB347'
    сигнал опасности: '#E7443E'
    пакет: '#E54B43'
    прицел: '#FFD166'
    силиэт орды: '#080B12'
  vfx_list:
  - Дождевые полосы с ограниченной плотностью на мобильных устройствах
  - Мокрые отражения в локальных лужах
  - Янтарные трассеры автоматической очереди
  - Красный импульс при закрытии сегмента
  - Короткая дымка вокруг строя орды
  - Искры от попаданий в металлические элементы
  - Следы света от пакета на мостовой
  ui_theme: 'Полевой интерфейс курьера: тонкие линии, крупные цифровые показатели,
    янтарные активные состояния и красные предупреждения.'
  menu_staging: 'Меню размещено перед мокрым перекрёстком: сумка лежит на капоте курьерского
    фургона, в дальнем переулке виден силуэт орды, а выбранный пункт меню подсвечивает
