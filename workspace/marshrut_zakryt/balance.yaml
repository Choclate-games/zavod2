_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: marshrut_zakryt
performance:
  target_fps: 60
  max_draw_calls: 80
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: 'Одиночный контракт длительностью 3–4 минуты: 4 волны по 35–45 секунд, между
    ними по 6 секунд на чтение перекрытой улицы и выбор следующего направления. Победа
    наступает после доставки одного пакета через 4 последовательных района.'
  win: Доставить один светящийся пакет в 4 адресных терминала, пережив 4 волны по
    35–45 секунд. На каждом терминале нужно находиться в зоне доставки 3 секунды,
    удерживая хотя бы один проход свободным от орды.
  lose: Поражение наступает при потере всех 3 зарядов выносливости или при разрушении
    пакета. Заряд теряется после контакта с преследователем на 0,8 секунды; пакет
    разрушается, если орда удерживает его в контакте 2 секунды. Также поражение наступает,
    если таймер контракта достигает 240 секунд.
  difficulty_curve: Первая волна вводит один перекрёсток и медленных преследователей.
    Вторая добавляет боковой обход и строй, который перекрывает привычный путь. Третья
    сокращает безопасное окно до 2,5 секунд и добавляет быстрых разведчиков. Четвёртая
    смешивает два перекрытия, дождевой туман и плотный финальный сход орды, сохраняя
    минимум два визуально различимых прохода.
mechanics:
  podavlyayuschaya_ochered:
    name: Подавляющая очередь
    parameters:
      vremya_zahvata_silueta:
        value: 0.16 с
        note: Ниже 0.10 с очередь ощущается как мгновенный автоматический чит; выше
          0.24 с игрок слишком часто теряет окно перед поворотом.
      interval_ocheredi:
        value: 0.24 с
        note: Ниже 0.18 с проход освобождается без решений; выше 0.32 с преследователь
          успевает касаться пакета между попаданиями.
      konus_navedeniya:
        value: 5 градусов
        note: Шире 8 градусов игра сама выбирает цель за игрока; уже 3 градусов управление
          на таче становится нервным и неточным.
      dalnost_nadezhnogo_popadaniya:
        value: 26 м
        note: Ниже 20 м игрок поздно видит угрозу; выше 32 м очередь решает маршрут
          раньше, чем игрок успевает его прочитать.
      skorost_otbrasyvaniya:
        value: 3.2 м/с
        note: Ниже 2.4 м/с очередь не создает коридор; выше 4.2 м/с передний край
          слишком легко исчезает из сцены.
      dlitelnost_impulsa_popadaniya:
        value: 0.24 с
        note: При 0.12 с попадания выглядят как сухой хитскан без веса; при 0.40 с
          строй начинает дергаться и теряет читаемую геометрию.
  pamyat_perekrytiy:
    name: Память перекрытий
    parameters:
      shag_zapisi_vremeni:
        value: 0.5 с
        note: При 0.1 с случайные микроповороты слишком сильно меняют память; при
          1.0 с игра не замечает короткую остановку у опасного укрытия.
      dlitelnost_pervoy_volny:
        value: 35 с
        note: Ниже 30 с игрок не успевает сформировать осмысленный круг; выше 45 с
          первая запись начинает ощущаться наказанием за обучение.
      ves_prezhnego_posescheniya:
        value: 0.15 доли риска
        note: Ниже 0.10 игрок может бесконечно повторять почти одинаковый маршрут;
          выше 0.25 перекрытие становится случайным и не отражает текущий выбор.
      vremya_materializatsii_massy:
        value: 2 с
        note: Мгновенное закрытие воспринимается как телепорт; дольше 4 с игрок успевает
          проскочить без принятия нового решения.
      minimum_otkrytyh_prohodov:
        value: 2 прохода
        note: Один проход превращает маршрутную игру в линейный коридор; больше 3
          проходов снижает давление и размывает значение памяти.
      okno_chteniya_posle_volny:
        value: 6 с
        note: Ниже 4 с выбор превращается в реакцию; выше 8 с темп короткой сессии
          распадается и напряжение успевает исчезнуть.
  perekrestok_na_hodu:
    name: Перекресток на ходу
    parameters:
      distantsiya_preduprezhdeniya:
        value: 18 м
        note: Ниже 12 м игрок видит входы слишком поздно; выше 24 м перекресток превращается
          в меню, а не в решение на бегу.
      okno_vybora:
        value: 2.5 с
        note: Ниже 1.8 с тач-ввод не успевает распознать жест; выше 3.5 с исчезает
          ощущение опасного решения под давлением.
      minimalnaya_dlina_svaypa:
        value: 80 пикселей
        note: Ниже 50 пикселей случайные касания меняют маршрут; выше 120 пикселей
          жест приходится делать слишком широко на маленьком экране.
      vremya_fiksatsii_povorota:
        value: 0.4 с
        note: Ниже 0.25 с поворот выглядит как мгновенная смена рельсов; выше 0.65
          с игрок не чувствует контроля над направлением.
      shtraf_avtomaticheskogo_vhoda:
        value: 0.5 с
        note: Нулевой штраф делает пропуск выбора бесплатным; выше 0.9 с ошибка становится
          сильнее, чем потеря заряда выносливости.
      kolichestvo_variantov:
        value: 2 или 3 прохода
        note: Один вариант убирает решение; четыре и более варианта перегружают взгляд
          и снижают читаемость силуэтов в дождь.
  szhatie_stroya:
    name: Сжатие строя
    parameters:
      razmer_dalnego_stroya:
        value: 8-12 фигур
        note: Меньше 6 фигур не читается как формация; больше 14 фигур превращает
          силуэты в сплошную стену и скрывает проходы.
      bazovaya_skorost_stroya:
        value: 1.7 м/с
        note: Ниже 1.3 м/с строй не давит на маршрут; выше 2.2 м/с игрок не успевает
          использовать предупреждение до закрытия входа.
      shirina_fronta:
        value: 4.5 м
        note: Уже 3 м формация легко обходится без решения; шире 6 м она блокирует
          улицу целиком и ломает правило двух проходов.
      minimalnaya_shirina_scheli:
        value: 2.2 м
        note: Ниже 1.8 м камера и коллизии ощущаются несправедливыми; выше 3 м строй
          перестает быть реальным препятствием.
      vremya_povtornogo_svedeniya:
        value: 1.4 с
        note: Ниже 1.0 с разрез строя не дает награды за точность; выше 2.0 с игрок
          может постоянно держать орду разделенной.
      distantsiya_vizualnogo_telegrafa:
        value: 32 м
        note: Ниже 24 м игрок видит перекрытие только в момент столкновения; выше
          40 м дождь и перспектива делают направление неоднозначным.
  paket_mayak_i_hrupkiy_gruz:
    name: Пакет-маяк и хрупкий груз
    parameters:
      radius_svetovogo_mayaka:
        value: 14 м
        note: Ниже 10 м новые проходы теряются в дождь; выше 18 м свет раскрывает
          слишком много пространства и убирает ценность выбора.
      ugol_svetovogo_konusa:
        value: 42 градуса
        note: Уже 30 градусов игрок не видит боковые входы на таче; шире 55 градусов
          пакет перестает задавать направление движения.
      dlina_svetovogo_sleda:
        value: 6 м
        note: Короче 4 м путь быстро исчезает за спиной; длиннее 9 м игрок всегда
          видит безопасную историю и меньше читает сам перекресток.
      vremya_razrushitelnogo_kontakta:
        value: 2 с
        note: Ниже 1.5 с потеря груза кажется случайной; выше 3 с игрок успевает игнорировать
          прямой контакт и не чувствует хрупкость пакета.
      dlitelnost_dostavki:
        value: 3 с
        note: Ниже 2 с терминал не создает оборонительного момента; выше 4 с остановка
          начинает доминировать над бегом по маршруту.
      zapas_vynoslivosti:
        value: 3 заряда
        note: Два заряда делают один случайный контакт слишком дорогим; четыре заряда
          снижают страх перед перекрестком и убирают ценность чистого движения.
