  сталь и копоть. Camera perspective: Изометрическая 3D камера с динамическим зумом.
  Environment: Технобаза с ангарами, кабелями и предупреждающей разметкой. Central
  Action: Уничтожение орд пришельцев боевым мехом с одновременным строительством защитных
  турелей и энергощитов. — the moment is caught mid-action, with clear cause and effect
  readable in a single frame. Visible in-game HUD overlay: Верх-Лево: Полоса прочности
  (HP) и щита, Верх-Центр: Номер волны и счетчик оставшихся врагов, Верх-Право: Количество
  монет и кнопка Паузы, Низ-Лево: Плавающий сенсорный виртуальный джойстик; touch
  controls at the bottom corners. Lighting: Холодный рабочий свет прожекторов и тёплые
  отблески сварки. Color palette: #7f8c99, #d9822b, #f0e6d2, #161b21, #252d36. High
  visual clarity, readable silhouettes, immersive WebGL game aesthetics.'
