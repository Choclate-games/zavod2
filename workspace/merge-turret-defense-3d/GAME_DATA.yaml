    координат перетаскивания через ClientBoundingRect сетки.'
  safe_area_handling: Использование CSS env(safe-area-inset-top) и env(safe-area-inset-bottom)
    для корректного отображения на iPhone с Dynamic Island / Notch и безрамочных Android.
  performance_throttling:
  - Автоматическое снижение разрешения WebGL (pixelRatio 1.0 вместо 2.0/3.0) на слабых
    мобильных GPU при просадке FPS ниже 45
  - Ограничение максимального количества одновременно активных снарядов до 60 на мобильных
    устройствах
  - Отключение динамических теней в пользу стилизованных круговых спрайтов под объектами
    (blob shadows) на мобильных
