playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - gamedistribution
  - mobile_web
  initialization_flow:
  - 1. bridge.initialize() при старте HTML страницы до создания WebGL контекста.
  - 2. bridge.storage.get(['merge_grid_save_v1']) для чтения облачного прогресса.
  - 3. bridge.advertisement.checkBannerSupport() и показ баннера внизу экрана при
    поддержке.
  - 4. Загрузка ассетов и старт сцены Three.js.
  - 5. Вызов bridge.game.ready() для уведомления платформы об окончании загрузки.
  cloud_save_keys:
  - turrets_grid_slots
  - player_coins
  - player_gems
  - highest_turret_tier
  - current_wave_index
  - meta_upgrades_levels
  - last_online_timestamp
  leaderboards:
  - highest_wave_record
  - highest_turret_unlocked
  ads_integration:
    banner: true
    interstitial: true
    rewarded: true
  lifecycle_hooks:
  - 'bridge.on(''visibility_change'', (state) => { state === ''hidden'' ? AudioManager.mute()
    : AudioManager.unmute(); })'
  - 'bridge.on(''interstitial_state_changed'', (state) => { state === ''opened'' ?
    GameLoop.pause() : GameLoop.resume(); })'
  - 'bridge.on(''rewarded_state_changed'', (state) => { state === ''opened'' ? GameLoop.pause()
    : GameLoop.resume(); })'
