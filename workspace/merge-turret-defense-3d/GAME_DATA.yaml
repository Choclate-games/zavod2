raw_prompt: 'Сделай игру на Three.js с гибридным геймплеем: нижняя половина экрана
  содержит сетку 4x4 для drag-and-drop слияния одинаковых турелей с прокачкой уровней
  (от деревянной пушки до плазменного рейлгана). Верхняя половина отображает 3D изометрическую
  базу, на которую по дорожке нападают волны цветных шаров. Авто-стрельба, оффлайн-накопление
  монет, магазин улучшений урона и скорости спавна.'
title: 'Слияние Турелей 3D: Оборона Базы'
slug: merge-turret-defense-3d
genre: Гибридная казуальная стратегия / Tower Defense
subgenre: Merge-2 головоломка + Idle Авто-батлер
renderer: threejs
renderer_reason: User explicitly specified 'threejs'.
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web / Mobile)
orientation: portrait
target_audience: Игроки 12–45 лет, ценящие аддиктивный казуальный геймплей слияния
  (Merge Games) и удовлетворяющую визуальную прогрессию башенной защиты с непрерывным
  ростом цифр урона и авто-боем.
core_loop: Покупка турелей 1-го уровня за монеты -> Drag-and-drop слияние одинаковых
  турелей на сетке 4x4 для получения более мощных орудий -> Автоматическая стрельба
  турелей с сетки по наступающим волнам цветных шаров на 3D арене -> Уничтожение шаров
  и сбор монет -> Мета-прокачка в магазине (урон, доход, скорость спавна) -> Прохождение
  волн и боссов.
hook: 'Гипнотический дуализм экрана: внизу — тактильно приятный дзен слияния орудий
  с сочным щелчком, вверху — взрывное 3D светопреставление с разлетающимися от выстрелов
  цветными сферами!'
player_fantasy: Гениальный инженер-артиллерист, создающий из примитивных деревянных
  пушек футуристическую несокрушимую батарею плазменных рейлганов и лазерных аннигиляторов.
session_model: Быстрые сессии от 1 до 5 минут для активного слияния и прокачки, поддерживаемые
  оффлайн-доходом до 8-12 часов для легкого возвращения в игру.
unique_value_proposition: 'Прямая бесшовная связь между 2D/псевдо-3D сеткой слияния
  и реальным полем боя в 3D: каждая объединенная турель мгновенно меняет свой внешний
  вид, тип снарядов, анимацию и сразу открывает сокрушительный огонь по толпе врагов.'
vision: Создать образцовый WebGL-хит для Yandex Games и Playgama с нулевым порогом
  входа, ультра-плавным 60 FPS на любых смартфонах, богатой системой прокачки 15+
  видов орудий и мощными вирусными петлями удержания.
elevator_pitch: Соединяй пушки на сетке 4х4, создавай смертоносные плазменные рейлганы
  и защищай базу от бесконечных волн неоновых сфер в сочной 3D изометрии!
win_conditions: Успешная зачистка всех волн локации, победа над гигантскими шарами-боссами
  каждые 10 волн и разблокировка ультимативного 15-го уровня турели (Квантовый Разрушитель).
lose_conditions: Прорыв цветных сфер к воротам базы и падение шкалы прочности базы
  до 0 HP (с возможностью мгновенного воскрешения за просмотр Rewarded Video или перезапуском
  волны с сохранением турелей).
progression_summary: 15 тиров турелей (от Деревянной рогатки до Плазменного рейлгана
  и Темной материи); 4 ветки глобального апгрейда (Базовый урон, Шанс крита, Скорость
  дропа ящиков, Доход монет); 50+ волн с растущей сложностью и уникальными мутаторами
  сфер.
difficulty_curve: Плавный онбординг (волны 1–5 обучают слиянию без риска проигрыша),
  ступени сложности на волнах боссов (10, 20, 30...), где требуется своевременное
  объединение в пиковый тир и применение временных бустеров.
scores:
  fun: 9
  originality: 8
  replayability: 9
  development_cost: 8
  visual_appeal: 9
  mobile_fit: 10
  monetization: 9
  platform_fit: 10
  overall_score: 9.0
  justification: 'Идеально сбалансированный казуальный гибрид: проверенный миллионами
    кор-геймплей Merge-2 + TD отлично адаптирован под вертикальный экран смартфонов
    и платформы Playgama/Yandex с высоким потенциалом вовлечения и монетизации.'
references:
- name: Ball Blast
  genre: Arcade Shooter
  mechanics:
  - Цветные сферы с числовыми счетчиками HP
  - Дробление крупных шаров на мелкие при уничтожении
  - Фонтан монет при лопании
  lessons: Удовлетворяющий физический импакт и разлетающиеся частицы создают непреодолимое
    желание лопать сферы одну за другой.
  what_to_avoid: 'Избегать утомительного ручного уклонения: авто-стрельба турелей
    должна снять микроконтроль с перемещения и сфокусировать игрока на слиянии.'
- name: 'Merge Cannon: Tower Defense'
  genre: Merge TD / Idle
  mechanics:
  - Сетка слияния орудий
  - Автоматическая атака врагов на верхней дорожке
  - Покупка ящиков с орудиями
  lessons: Авто-объединение и быстрый спавн турелей в ящиках создают ощущение постоянного
    подарка и потока действий.
  what_to_avoid: Избегать медленного темпа в начале игры и не перегружать интерфейс
    сложными неинтуитивными меню.
- name: Rush Royale
  genre: PVP / PVE Tower Defense
  mechanics:
  - Объединение юнитов для повышения ранга силы
  - Визуальная эволюция снарядов и спецэффектов
  lessons: Четкая градация цветов и эффектов для каждого ранга турелей делает прогресс
    осязаемым и желанным.
  what_to_avoid: 'Не вводить излишнюю рандомизацию при слиянии: слияние одинаковых
    турелей должно гарантированно давать следующий предсказуемый тир.'
mechanics:
- name: Drag-and-Drop Слияние (Merge 4x4)
  category: puzzle
  priority: core
  description: Игрок перетаскивает турель на другую турель точно такого же уровня
    на сетке 4x4 (16 слотов), объединяя их в одну турель на уровень выше.
  player_interaction: Касание пальцем или мышью, перетаскивание с магнитной привязкой
    к слотам и сочным тактильным откликом при совпадении уровней.
  feedback: Вспышка света, звуковой щелчок с повышением тональности, партиклы звезд
    и появление новой детальной 3D-модели турели с анимацией отдачи.
  technical_complexity: Low
  strengths:
  - Интуитивность для любого возраста
  - Сильный выброс дофамина при открытии нового тира
  - Упорядочивание пространства приносит психологическое удовлетворение
  weaknesses:
  - Возможность забивания сетки без доступных ходов (решается кнопкой продажи/мусорки)
- name: Изометрический 3D Авто-Бой
  category: combat
  priority: core
  description: Все турели, находящиеся на сетке, автоматически наводятся на ближайшие
    к базе цветные сферы и ведут непрерывный огонь уникальными снарядами.
  player_interaction: Автономная работа; игрок может тапать по приоритетному шару
    для фокуса атаки всех турелей.
  feedback: Плавный поворот стволов к цели, дульные вспышки, трассеры пуль/лазеров,
    тряска камеры при взрывах, уменьшение цифры HP на шарах.
  technical_complexity: Medium
  strengths:
  - Зрелищность происходящего на верхнем экране
  - Отсутствие усталости пальцев от постоянного кликанья
  weaknesses:
  - Необходимость оптимизации сотен снарядов и частиц (решается пулом объектов и InstancedMesh)
- name: Волновое Нашествие Цветных Сфер
  category: progression
  priority: core
  description: Шары разного цвета и размера двигаются по извилистой дорожке к базе.
    Каждый шар имеет запас здоровья. Большие шары при уничтожении раскалываются на
    2 меньших шара.
  player_interaction: Уничтожение сфер до их достижения ворот базы.
  feedback: Индикация HP над шарами, изменение цвета при получении урона (белая вспышка),
    взрыв сочного конфетти и фонтан золотых монет при гибели.
  technical_complexity: Medium
  strengths:
  - Понятный визуальный таймер опасности (расстояние до базы)
  - Цепная реакция раскалывания создает взрывной экшен
  weaknesses:
  - Риск перегрузки экрана при десятках мелких шаров (решается лимитом одновременных
    врагов)
- name: Оффлайн Доход и Мета-Магазин
  category: economy
  priority: secondary
  description: База генерирует пассивный доход монет каждую секунду даже когда игрок
    закрыл вкладку (до 8 часов). Монеты тратятся на прокачку урона, скорости спавна
    бесплатных ящиков и стартового уровня пушек.
  player_interaction: Нажатие кнопки сбора при входе в игру, прокачка перков в нижнем
    меню магазина.
  feedback: Модальное окно «С возвращением!» с анимацией сыплющихся монет и кнопкой
    удвоения за рекламу.
  technical_complexity: Low
  strengths:
  - Высокое удержание Retention Day 1 / Day 7
  - Гарантированный прогресс даже для казуальных игроков
  weaknesses:
  - Инфляция игровой валюты при неправильном балансе формулы стоимости
gameplay_systems:
- name: Система Сетки Слияния (MergeGridSystem)
  purpose: Управление состоянием 16 слотов сетки, валидация перемещений, объединение
    уровней и сохранение раскладки в LocalStorage/Cloud.
  input: Touch / Mouse Pointer события (PointerDown, PointerMove, PointerUp).
  rules:
  - Сетка фиксированного размера 4x4.
  - Перетаскивание турели уровня N на другую турели уровня N создает турель уровня
    N+1 на целевом слоте, освобождая исходный.
  - Перетаскивание на пустой слот просто перемещает турель.
  - Перетаскивание на турель другого уровня меняет их местами.
  - Перетаскивание в иконку Корзины удаляет турель и возвращает 25% стоимости.
  state:
  - 'gridArray: Array<TurretData | null> (length 16)'
  - 'activeDragIndex: number | null'
  - 'highestUnlockedTier: number'
  interactions: При объединении триггерит событие EventBus.emit('TURRET_MERGED', {
    tier, index }) для звуков, аналитики и обновления боевого урона.
  feedback: Подсветка совместимых ячеек зеленым контуром во время перетаскивания;
    красным — несовместимых.
  edge_cases:
  - Дроп за пределами сетки возвращает турель на исходную позицию с плавной tween-анимацией.
  - Попытка объединить максимальный 15-й тир блокируется с предупреждающей плашкой
    «MAX LEVEL».
- name: Боевая Система и Наведение (CombatSystem)
  purpose: Расчет баллистики, наведение стволов турелей, авто-стрельба по таймерам
    скорострельности и нанесение урона сферам.
  input: Позиции активных врагов на 3D трассе.
  rules:
  - Каждая турель на сетке суммирует свою огневую мощь на верхнем поле боя.
  - Турель выбирает целью шар, находящийся ближе всего к финишу (First Target priority)
    или шар, выбранный игроком тапом.
  - 'Урон рассчитывается по формуле: BaseDamage(Tier) * MetaDamageMultiplier * CriticalHit(if
    proc).'
  - Снаряды летят с физической интерполяцией или хитсканом в зависимости от типа (пули,
    плазма, лазерный луч).
  state:
  - 'activeProjectiles: Pool<Projectile>'
  - 'turretCooldowns: Float32Array'
  - 'currentDps: number'
  interactions: Взаимодействует с WaveManager при попадании, отнимая HP у шаров и
    вызывая VFX столкновения.
  feedback: Всплывающие цифры урона (Floating Combat Text), цветные трассеры снарядов,
    звуки выстрелов со стерео-панорамированием.
  edge_cases:
  - Если цель уничтожена другим снарядом во время полета текущего, снаряд ищет ближайшую
    сферу в радиусе 1.5м (splash) или самоуничтожается.
- name: Генератор Волн и Сфер (WaveSystem)
  purpose: Спавн очередей цветных сфер по кривой Безье в 3D пространстве с контролем
    сложности и босс-файтов.
  input: Номер текущей волны (currentWave).
  rules:
  - 'Каждая волна состоит из 15-30 сфер с нарастающим запасом HP: HP = BaseHP * (1.18
    ^ currentWave).'
  - Каждые 5 волн — мини-босс (сфера-щитовик), каждые 10 волн — Мега-Босс с уникальной
    аурой (ускорение соседей, регенерация).
  - Уничтоженная сфера размера L распадается на 2 сферы размера M, размер M — на 2
    размера S.
  - При пересечении финишной черты шар отнимает 1 HP базы за единицу своего размера.
  state:
  - 'waveNumber: number'
  - 'aliveEnemiesCount: number'
  - 'baseHealth: number (max 100)'
  - 'waveState: ''SPAWNING'' | ''IN_PROGRESS'' | ''CLEARED'' | ''DEFEAT'''
  interactions: Оповещает UI о прогрессе волны (прогресс-бар сверху экрана) и выдает
    награду за завершение.
  feedback: Звуковая сирена перед волной босса, вспышка красного света на базе при
    получении урона.
  edge_cases:
  - Если игрок не успел убить всех врагов и база уничтожена, волна перезапускается
    без потери прокачки турелей.
- name: Экономика и Оффлайн-Прогресс (EconomySystem)
  purpose: Баланс игровой валюты (золотые монеты, кристаллы), расчет оффлайн-накоплений
    и цен апгрейдов.
  input: Время последнего выхода из игры (timestamp), убийства врагов, клики по ящикам.
  rules:
  - 'Стоимость покупки новой базовой турели растет по экспоненте: Cost = BaseCost
    * (1.15 ^ PurchasesCount).'
  - 'Оффлайн доход начисляется за время отсутствия (макс. 8 часов): OfflineCoins =
    DpsPerSecond * 0.25 * ElapsedSeconds.'
  - Автоматический бесплатный дроп ящика с турелью на случайный свободный слот сетки
    каждые 15 секунд (ускоряется прокачкой).
  state:
  - 'coins: number'
  - 'gems: number'
  - 'purchasedTurretsCount: number'
  - 'lastSaveTimestamp: number'
  interactions: Связан с Playgama SDK Cloud Save для непрерывной синхронизации баланса.
  feedback: Летающие монетки от убитых шаров прямо в счетчик баланса в правом верхнем
    углу.
  edge_cases:
  - Защита от перемотки системного времени устройства через серверную валидацию времени
    Playgama.
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.170.0
  physics_engine: Rapier3D (@dimforge/rapier3d-compat 0.13.x)
  state_manager: Custom Reactive State Store with Typed EventBus
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 45
  max_triangles_or_sprites: 28000
  bundle_size_budget_mb: 3.8
  layers:
  - name: 3D_Battlefield_Layer
    description: Three.js WebGL Canvas рендерит 3D изометрическую базу, дорожку, цветные
      сферы врагов, снаряды и частицы.
    z_index: 1
  - name: 2D_MergeGrid_HUD_Layer
    description: Высокопроизводительный DOM/HTML5 Canvas оверлей с сеткой 4x4, кнопками
      магазина, таймерами ящиков и плашками уровней.
    z_index: 10
  - name: Modal_Popup_Layer
    description: Окна оффлайн-награды, поражения, победы, настроек звука и магазина
      бустеров.
    z_index: 100
  modules:
  - name: App
    path: src/App.ts
    description: Точка входа, инициализация Three.js сцены, Playgama Bridge SDK, запуск
      игрового цикла.
  - name: SceneManager
    path: src/render/SceneManager.ts
    description: Управление камерой, изометрическим освещением, тенями, туманом и
      материалами Three.js.
  - name: MergeGridController
    path: src/gameplay/MergeGridController.ts
    description: Логика Drag-and-Drop, анимации объединения (GSAP/Tween), синхронизация
      16 слотов сетки.
  - name: TurretFactory
    path: src/entities/TurretFactory.ts
    description: Создание процедурных 3D-моделей 15 тиров турелей с уникальными материалами,
      стволами и спецэффектами.
  - name: EnemyWaveManager
    path: src/entities/EnemyWaveManager.ts
    description: InstancedMesh пул цветных сфер врагов, перемещение по CatmullRomCurve3,
      расчет раскалывания.
  - name: ProjectilePool
    path: src/combat/ProjectilePool.ts
    description: Высокоэффективный пул снарядов (InstancedMesh) без аллокаций памяти
      в render loop.
  - name: SaveManager
    path: src/services/SaveManager.ts
    description: Синхронизация прогресса с Playgama Bridge Cloud Storage и LocalStorage
      фолбэком.
  - name: AudioManager
    path: src/audio/AudioManager.ts
    description: Управление синтезом звуков выстрелов, мерджа и фонового саундтрека.
monetization:
  strategy_summary: 'Мягкая гибридная модель: Rewarded Video для ускорения прогресса
    и приятных бонусов, ненавязчивые Interstitial с тайм-аутом строго между волнами,
    и IAP (Яндекс Яны) для мгновенного отключения рекламы и премиум-стартер паков.'
  rewarded_placements:
  - id: offline_x2_multiplier
    name: Удвоение оффлайн дохода
    benefit: Удваивает накопленные за время отсутствия золотые монеты (x2 Gold).
    cooldown_or_limit: При каждом входе с оффлайн-наградой
    trigger_moment: Модальное окно «С возвращением!» при запуске игры
  - id: instant_high_tier_drop
    name: Золотой Ящик с мощной турелью
    benefit: Мгновенный спавн турели высокого тира (HighestUnlockedTier - 1) на свободный
      слот.
    cooldown_or_limit: Раз в 3 минуты
    trigger_moment: Кнопка «Подарок» на панели сетки слияния
  - id: speed_frenzy_boost
    name: Режим Безумия (2x Attack Speed)
    benefit: Удваивает скорострельность всех турелей на 60 секунд.
    cooldown_or_limit: Раз в 2 минуты
    trigger_moment: Иконка бустера «Молния» в HUD
  - id: base_revive_shield
    name: Второе дыхание (Воскрешение)
    benefit: Восстанавливает 100% HP базы и взрывает все сферы на текущем экране ударной
      волной.
    cooldown_or_limit: 1 раз за попытку прохождения волны
    trigger_moment: Экран поражения при прорыве врагов к базе
