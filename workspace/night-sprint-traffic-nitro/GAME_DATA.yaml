mobile:
  orientation: landscape
  touch_implementation: Аналоговый горизонтальный Pointer Drag с динамической нейтральной
    точкой касания (исключает необходимость тянуться к фиксированному джойстику) +
    выделенная область активации нитро в правой трети экрана с поддержкой мультитача.
  safe_area_handling: Автоматический отступ 44px слева и справа с помощью CSS env(safe-area-inset-*)
    для предотвращения перекрытия HUD вырезами камер (Notch) и системными полосами
    навигации iOS/Android.
  performance_throttling:
  - Динамическое масштабирование разрешения рендера (DPR 1.0 на бюджетных мобильных
    чипах Mali/Adreno и 1.5 на десктопах)
  - Снижение количества партиклов водяных брызг и искр на 50% при падении FPS ниже
    50 на протяжении 3 секунд
  - Упрощение шейдера отражений асфальта до статичной кубической карты на устройствах
    с WebGL 1.0 / маломощных GPU
  - Ограничение частоты физического тика Rapier до фиксированных 60 Гц с субстеппингом
    1
