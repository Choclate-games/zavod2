raw_prompt: Создай гонку в стиле нфс
title: 'Ночной Спринт: Трафик и Закись'
slug: night-sprint-traffic-nitro
genre: 3D Аркадный Автосимулятор / Уличные Гонки
subgenre: Тайм-атака в плотном трафике / Хайвей-спринт с физикой заноса
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web / Android Webview)
orientation: landscape
target_audience: Игроки 16–35 лет, фанаты серии Need for Speed (Underground 1/2, Most
  Wanted), любители уличных гонок, плотного трафика, дрифта, ночной неоновой эстетики
  и динамичных спринт-заездов на 1-2 минуты в вебе и на смартфонах.
core_loop: Старт спринта -> Скоростное лавирование в плотном трафике -> Зарядка нитро
  через опасные сближения (Near Miss) и заносы -> Активация нитро-форсажа на свободных
  участках -> Прохождение чекпоинтов до истечения таймера -> Финиш заезда с фиксацией
  времени в лидерборде -> Получение репутации и кредитов -> Тюнинг спорткара в гараже
  (мощность, закись азота, управляемость, неоновая подсветка, обвесы) -> Открытие
  новых ночных маршрутов.
hook: 'Культовый дух ночного стритрейсинга NFS Underground в браузере: ревущий хамелеон-спорткар,
  мокрый асфальт, ослепляющий неон и бешеный прилив нитро от миллиметровых разъездов
  с фурами на встречке на скорости 250 км/ч.'
player_fantasy: Ты — безбашенный уличный гонщик ночного мегаполиса, пилотирующий заниженный
  кастомный спорткар на пределе сцепления, разрезающий плотный трафик миллиметровыми
  маневрами и взрывающий ночную тишину снопами синего пламени закиси азота.
session_model: Спринтерский заезд точка-в-точку длительностью 60–90 секунд с 3 чекпоинтами
  тайм-атаки и мгновенным перезапуском при аварии или победе.
unique_value_proposition: Полноценный физический 3D-контроллер спорткара с кренами
  и пробуксовкой на Three.js + Rapier 3D, где закись азота добывается исключительно
  риском миллиметровых разъездов (Near Miss) в ночном неоновом трафике без скучных
  рельс и автопилотов.
vision: Создать самый визуально и кинестетически сочный 3D веб-спринт в эстетике золотой
  эры NFS, работающий мгновенно без загрузок на смартфонах и ПК, где каждая секунда
  заезда держит в предельном напряжении благодаря динамической физике и честной механике
  риска.
elevator_pitch: '«Ночной Спринт» — это скоростной 3D-рейсинг в духе NFS Underground
  для браузеров и мобильных: управляй спорткаром на мокром ночном шоссе, лавируй между
  фурами на волосок от столкновения для мгновенной зарядки нитро и ставь рекорды времени
  в плотных 90-секундных спринтах.'
win_conditions: Пересечь финишную черту за отведенный лимит времени (уложиться в золото,
  серебро или бронзу), сохранив автомобиль от фатальных повреждений и набрав рекордные
  очки адреналина.
lose_conditions: Истечение времени таймера до достижения очередного чекпоинта ИЛИ
  лобовой фатальный таран тяжелого трафика (фура, автобус, бетонный разделитель) без
  использования спасительного билета восстановления (Revive).
progression_summary: Кампания из 12 спринт-трасс в 4 районах ночного города (Шоссе
  над заливом, Портовый тоннель, Неоновый даунтаун, Индустриальная эстакада) + автопарк
  из 6 спорткаров разных классов (от тюнингованного хэтчбека до суперкара) с прокачкой
  4 узлов (Двигатель, Нитро-инжектор, Подвеска/Шины, Облегчение кузова) и кастомизацией
  визуала (неон днища, цвет хамелеон, диски, спойлеры).
difficulty_curve: 'Динамически нарастающая кривая: Первые 15 секунд — разгон и редкий
  попутный трафик (обучение Near Miss); 15-40 сек — появление встречного движения
  и перестроений легковушек; 40-65 сек — плотные ''стены'' из фур и сужение полос
  при ремонте дорог; 65-90 сек — финальный скоростной отрезок с предельной плотностью
  трафика, требующий непрерывного нитро-буста.'
scores:
  fun: 9
  originality: 8
  replayability: 9
  development_cost: 7
  visual_appeal: 9
  mobile_fit: 9
  monetization: 8
  platform_fit: 9
  overall_score: 8.5
  justification: Проект идеально воспроизводит ностальгический опыт культовых стритрейсингов
    2000-х в компактном веб-формате. Высокий темп решений (Near Miss каждые 2-3 секунды),
    интуитивное управление drag/swipe на мобильных и стрелками на ПК, короткая сессия
    на 75 секунд и модульная архитектура трассы в Three.js гарантируют высокий ретеншн
    и легкую масштабируемость.
references:
- name: 'Need for Speed: Underground 2 / Most Wanted'
  genre: 3D Аркадный Стритрейсинг
  mechanics:
  - Закись азота с динамическим FOV и блюром
  - Визуальный и технический тюнинг в гараже
  - Ночной неоновый город с мокрым асфальтом
  lessons: Культовая атмосфера создается сочным звуком выхлопа, неоновыми отражениями
    и резким контрастом между обычной скоростью и взрывом нитро.
  what_to_avoid: Громоздкий открытый мир и длинные переезды между гонками, непригодные
    для браузерной сессии.
- name: Burnout Dominator / Revenge
  genre: Аркадный Экшен-Рейсинг
  mechanics:
  - Near Miss (опасные сближения в трафике)
  - Мгновенная зарядка шкалы буста за риск
  - Агрессивная езда по встречной полосе
  lessons: Шкала буста должна быть прямой наградой за осознанный риск и высокое мастерство
    игрока, а не пассивно восполняться со временем.
  what_to_avoid: Механика Crash Mode и сложные разрушения сотен деталей, просаживающие
    WebGL фреймрейт.
- name: Traffic Rider / Wangan Midnight
  genre: Хайвей-Спринт в Трафике
  mechanics:
  - Плотный попутный и встречный трафик
  - Тайм-атака с чекпоинтами
  - Бонусное комбо за серию непрерывных разъездов
  lessons: Трафик должен иметь предсказуемую логику движения (включение поворотников
    перед перестроением), чтобы игрок мог «читать» поток на 200+ км/ч.
  what_to_avoid: Однообразные прямые бесконечные полосы без изменения геометрии шоссе
    и без финишной цели.
mechanics:
- name: Касательный Разъезд «Razor Near Miss»
  category: Главный источник топлива (источник ресурса и риска), конвертирующий пространственную
    опасность в закись азота и множитель счета.
  priority: core
  description: В большинстве аркад Near Miss — это просто косметические очки в углу
    экрана. Здесь Near Miss — это физический кислород заезда, без которого невозможно
    поддерживать максимальную скорость и уложиться в жесткий таймер чекпоинтов.
  player_interaction: 'Клавиатура: A / D или Стрелки влево/вправо (аналоговая интерполяция
    поворота руля); Тач: горизонтальный свайп/drag пальцем по нижней трети экрана
    или экранные кнопки <- / ->.'
  feedback: 'Визуал / VFX: Резкая вспышка линзового блика (Lens Flare) фар трафика,
    сноп искр от боковых зеркал при зазоре <0.4 м, радиальное размытие и всплывающий
    неоновый текст ''RAZOR NEAR MISS +250''.; Звук / Web Audio: Доплеровский визг
    рассекаемого воздуха (свист 1.8 кГц -> 450 Гц), басовый щелчок панча сабвуфера
    (75 Гц), гудок клаксона встречной машины с панорамированием влево/вправо.; Камера:
    Микро-импульс сотрясения камеры (Spring Shake с амплитудой 0.12 м и затуханием
    0.25 с), легкий зум-толчок FOV -2° с мгновенным возвратом.; UI / Тактильность:
    Haptic-импульс 45 мс на мобильных устройствах, вспышка золотистой каймы вокруг
    шкалы закиси азота, пульсация цифры комбо-множителя на спидометре.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Двухконтурный Нитро-Всплеск «Twin-Stage N2O Burst»
  category: Главный скоростной двигатель заезда (потребитель ресурса), превращающий
    накопленный за риск ресурс во взрывное сокращение времени до чекпоинта.
  priority: secondary
  description: Двухконтурная система дает выбор между точечным ускорением для маневра
    и тотальным прострелом на пределе физики с расширением FOV и курсовой стабилизацией.
  player_interaction: 'Клавиатура: Space или Shift (удержание); Тач: кнопка ''NITRO''
    в правой нижней части экрана (одиночный тап — Stage 1, удержание более 0.4 с —
    переход в Stage 2 Overdrive).'
  feedback: 'Визуал / VFX: Снопы сине-фиолетового пламени длиной 2.5 м из сдвоенных
    патрубков, сплошные неоновые инверсионные шлейфы от габаритов, хроматическая аберрация
    по краям экрана, мокрый асфальт превращается в зеркальные линии света.; Звук /
    Web Audio: Взрывной рев инжектора закиси (пьезо-свист 3.2 кГц), низкочастотный
    рокот турбины под нагрузкой, смачный сброс давления блоу-офф (Blow-Off) при отпускании
    кнопки.; Камера: Плавный динамический откат камеры назад на 0.6 метра по оси Z,
    расширение FOV до 92°, высокочастотный тремор асфальтовой тряски.; UI / Тактильность:
    Неоновая шкала N2O пульсирует ярко-голубым светом, стрелка цифрового спидометра
    вспыхивает красным при преодолении 250 км/ч, непрерывная виброотдача 60 Гц.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Аэродинамический Зацеп «Slipstream Draft & Slingshot»
  category: Тактический разгонный мост (источник пассивного набора темпа и позиционирования),
    связывающий фазы маневрирования без траты нитро.
  priority: secondary
  description: Вместо пассивного увеличения скорости, слипстрим превращен в двухфазную
    механику накопления заряда «рогатки» (Slingshot), требующую идеального удержания
    в вихревом створе с последующим тайминговым маневром выстрела.
  player_interaction: Удержание положения спорткара строго в створе габаритов впереди
    идущего тяжелого транспорта (отклонение по оси X не более ±0.8 м) на дистанции
    1.5–8.0 м.
  feedback: 'Визуал / VFX: Полупрозрачные вихревые аэродинамические жгуты (белые неоновые
    линии потока) от задних стоек фуры к капоту спорткара, дрожание капота, вспышка
    оранжевого контура при готовности Slingshot.; Звук / Web Audio: Затухание общего
    шума ветра (эффект вакуума, Low-Pass фильтрация 800 Гц), нарастающий высокочастотный
    гул вихревого потока, резкий свистящий ''щелчок-выстрел'' при выходе из мешка.;
    Камера: Приближение камеры к спорткару на 0.3 м с ощущением засасывания в разреженную
    область, резкий боковой сдвиг при маневре обгона.; UI / Тактильность: Появление
    дугообразного индикатора воздушного потока над капотом, мягкая непрерывная микровибрация
    геймпада/экрана, переходящая в акцентированный тычок при Slingshot.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Силовой Скандинавский Щелчок «Weight Transfer Flick & Power Slide»
  category: Инструмент пространственного контроля и уклонения (механика экстремального
    маневра), позволяющий проскользнуть боком через узкие сужения трафика.
  priority: secondary
  description: В большинстве гонок дрифт предназначен только для крутых 90-градусных
    поворотов. Здесь скандинавский щелчок — это тактический микро-маневр для скоростного
    лавирования в прямом потоке шоссе, позволяющий втиснуть кузов в диагональные просветы
    между машинами.
  player_interaction: 'Клавиатура: быстрая связка A -> D (или наоборот) с кратковременным
    нажатием Пробел/Ручник; Тач: быстрый зигзагообразный жест влево-вправо по экрану.'
  feedback: 'Визуал / VFX: Плотные клубы неонового дыма из-под задних покрышек, светящиеся
    черные следы резины на мокром асфальте, искры от контакта дисков с дорожным полотном,
    динамический крен кузова на подвеске.; Звук / Web Audio: Пронзительный двухтональный
    визг горящего компаунда шин (1.2 кГц), циклические хлопки выхлопа антилага при
    перегазовке (Anti-Lag Backfire), свист дифференциала.; Камера: Крен камеры (Camera
    Roll) на ±4.5° в сторону заноса, смещение точки фокуса к внешней траектории скольжения.;
    UI / Тактильность: Индикатор угла дрифта на приборной панели с надписью ''DRIFT
    SLIDE'', вибрирующий Haptic-паттерн с частотой вращения колес.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
gameplay_systems:
- name: Система Процедурной Плотности Трафика (Traffic Density Manager)
  purpose: Управление спавном, скоростями, поведением и полосами попутного и встречного
    транспорта для создания непрерывного и ритмичного потока вызовов.
  input: Текущая дистанция игрока по трассе, скорость игрока, фаза заезда (0-30%,
    30-70%, 70-100%), сектор трассы (шоссе, мост, тоннель).
  rules:
  - 'Машины трафика делятся на 3 категории: Седаны (100-130 км/ч, плавные перестроения),
    Такси (110-140 км/ч, резкие перестроения с включением поворотника за 0.8 с), Фуры/Автобусы
    (70-90 км/ч, длинный корпус, блокируют целую полосу).'
  - Всегда гарантируется минимум один чистый геометрический коридор шириной не менее
    1.8 ширины машины игрока.
  - Машины трафика спавнятся за 180 метров впереди по трассе и удаляются за 40 метров
    позади игрока (пул объектов без аллокаций памяти).
  - Плотность трафика нарастает от 4 машин на 100м на старте до 12 машин на 100м на
    финальном отрезке.
  state:
  - active_traffic_pool
  - spawn_interval_timer
  - density_multiplier
  - lane_occupancy_matrix
  interactions: Передает координаты и габариты машин в систему коллизий Rapier и систему
    оценки Near Miss.
  feedback: Включение задних стоп-сигналов при торможении трафика, мигание оранжевых
    поворотников за 0.8 секунды до смены полосы, свет фар встречных машин.
  edge_cases:
  - Если игрок резко сбрасывает скорость до нуля, трафик впереди продолжает движение
    вперед, исключая заторы.
  - В узких тоннелях исключается одновременный спавн двух фур бок о бок, чтобы не
    блокировать 100% ширины дороги.
- name: Физическая Модель Спорткара на Dynamic Raycast (Vehicle Physics System)
  purpose: Симуляция 4 колесных лучей (Raycast), подвески с пружинами и амортизаторами,
    трения шин о мокрый асфальт, кренов кузова и сцепления с дорогой.
  input: Аналоговое значение руления [-1.0 ... 1.0], статус нажатия газа/нитро, вектор
    скорости и угловая скорость шасси в Rapier 3D.
  rules:
  - 'Raycast каждого колеса рассчитывает силу сжатия пружины: F_susp = K * (rest_length
    - current_length) - D * suspension_velocity.'
  - Продольная сила ускорения прикладывается к задним колесам с учетом кривой крутящего
    момента двигателя.
  - 'Боковая сила сцепления шин рассчитывается по упрощенной формуле Pacejka: при
    превышении критического угла скольжения колесо срывается в пробуксовку.'
  - При активации нитро коэффициент сцепления передних шин повышается на 20% для сохранения
    управляемости на скоростях 250+ км/ч.
  state:
  - chassis_rigid_body
  - wheel_raycast_states
  - engine_rpm
  - gear_current
  - lateral_slip_ratio
  - body_roll_pitch
  interactions: Взаимодействует с рендерером Three.js (позиция и наклон меша машины)
    и аудио-системой (питч звука мотора от RPM).
  feedback: Визуальный крен кузова при поворотах и торможении, пробуксовка задней
    оси с дымом, покачивание камеры на неровностях дороги.
  edge_cases:
  - При отрыве всех 4 колес от земли крутящий момент колес отсекается, предотвращая
    разгон в воздухе.
  - При касательном скользящем ударе об отбойник гасится только 15% скорости, предотвращая
    мгновенную остановку.
- name: Система Оценки Риска и Комбо-Множителя (Adrenaline Combo & Score System)
  purpose: Отслеживание качества вождения, фиксация опасных трюков и начисление очков
    репутации с прогрессивным множителем комбо.
  input: Дистанция до ближайших машин трафика, время нахождения на встречной полосе,
    скорость, активация закиси азота.
  rules:
  - Near Miss на попутной полосе дает +100 очков и +15% к шкале нитро.
  - Near Miss на встречной полосе дает +250 очков, +30% к нитро и повышает комбо-множитель
    на +1x (максимум x8).
  - 'Таймер удержания комбо равен 3.0 секундам: если за это время не совершен новый
    трюк, множитель плавно сбрасывается до x1.'
  - Любое касание трафика или отбойника мгновенно обнуляет текущий комбо-множитель.
  state:
  - current_score
  - combo_multiplier
  - combo_timer
  - near_miss_count
  - oncoming_time_total
  interactions: Передает данные в HUD (отображение комбо и всплывающих очков) и в
    систему нитро (пополнение баллона).
  feedback: Пульсирующий неоновый счетчик 'x2 -> x4 -> x8' в центре экрана, звук звона
    адреналина и нарастающая интенсивность синтвейв-бита.
  edge_cases:
  - Повторный учет одной и той же машины трафика блокируется кулдауном 1.5 секунды
    на уникальный ID автомобиля.
- name: Система Чекпоинтов и Тайм-Атаки (Checkpoint & Time Trial System)
  purpose: Контроль времени спринта, начисление бонусных секунд на контрольных отсечках
    и фиксация итоговых результатов в таблице лидеров.
  input: Пересечение автомобилем триггеров контрольных точек на 30%, 60% и 100% дистанции
    трассы.
  rules:
  - Каждый спринт начинается с базовым таймером 30.0 секунд.
  - Прохождение Чекпоинта 1 (30% трассы) добавляет +25.0 секунд к таймеру.
  - Прохождение Чекпоинта 2 (60% трассы) добавляет +25.0 секунд к таймеру.
  - При падении таймера ниже 5.0 секунд включается режим критической тревоги (пульсирующий
    красный таймер и звук сирены).
  - 'При пересечении финиша рассчитывается медаль: Золото (<70с), Серебро (<80с),
    Бронза (<90с).'
  state:
  - time_remaining
  - split_times
  - current_checkpoint_index
  - is_run_completed
  - medal_awarded
  interactions: Взаимодействует с Playgama SDK (отправка рекорда в Yandex Leaderboards)
    и экраном результатов заезда.
  feedback: Голосовое объявление 'CHECKPOINT!', замедление времени на 0.2 секунды
    (хроно-вспышка), зеленый баннер '+25 SEC' над машиной.
  edge_cases:
  - Если время истекает ровно в момент пересечения триггера, преимущество отдается
    игроку (grace period 150мс).
core_design:
  signature_moment: На последних 4 секундах таймера чекпоинта на скорости 260 км/ч
    ты влетаешь в узкий зазор между двумя попутными 18-колесными фурами, делаешь резкий
    скандинавский щелчок боком, ловишь двойной 'Razor Near Miss' с искрами от боковых
    зеркал в 5 сантиметрах от прицепов, мгновенно зажимаешь двухконтурную закись азота,
    камера вжимается в бампер с эффектом тоннельного расфокуса FOV 92°, и ты на горящем
    синем форсаже пробиваешь створ светящегося неонового чекпоинта за 0.2 секунды
    до поражения, получая +5 секунд и комбо x5.
  genre_template_rejected: 'Отказ от шаблона казуального 3-полосного бесконечного
    раннера с пассивным сбором монет и авто-восполнением нитро (Traffic Racer / Horizon
    Chase казуальный клон). Мы категорически отвергаем: 1) Дискретную ''рельсовую''
    смену полос — машина управляется через аналоговый физический рэйкаст-контроллер
    с инерцией переноса веса, углами заноса и сопротивлением шин; 2) Бесплатную регенерацию
    закиси азота со временем — нитро генерируется ТОЛЬКО за счет экстремального риска
    (миллиметровые разъезды Near Miss на 250 км/ч, слипстрим за фурами, силовой снос);
    3) Бесконечный заезд без финала — заменен на плотный напряженный спринт 60-90
    секунд с жесткими чекпоинтами тайм-атаки, где каждая ошибка в траектории стоит
    победы.'
  what_makes_it_different: В отличие от классических мобильных автосимуляторов, где
    нитро является пассивной кнопкой 'нажми для ускорения', а трафик выступает лишь
    статичной помехой, в нашей игре трафик — это топливо для скорости. Физика сжатия
    потока (Razor Squeeze) заставляет игрока намеренно целиться в узкие щели между
    фурами и выезжать на встречную полосу, так как риск конвертируется в множитель
    комбо и объем N2O с экспоненциальной отдачей. Механика 'Скандинавского щелчка'
    позволяет проходить трафик боком, используя ширину корпуса спорткара для максимального
    накопления очков риска без потери продольного импульса.
  micro_loop:
  - step: Сканирование трафика и выбор щели
    player_action: Визуальная оценка зазора между попутным седаном и встречным бензовозом
      на дистанции 70 м.
    game_response: Спорткар мчит на 190 км/ч, мигают габаритные огни легковушки, приближаются
      ослепляющие фары встречного грузовика.
    decision: Пойти на безопасный обгон справа по пустой полосе или рискнуть нырнуть
      в миллиметровый зазор по центру ради x2.2 нитро.
    duration: 0.4–0.8 с
  - step: Миллиметровый прострел (Near Miss) и перекладка массы
    player_action: Резкое подруливание влево-вправо (контрсмещение) для протискивания
      между бортами трафика.
    game_response: 'Срабатывает триггер Razor Squeeze (<0.8 м): вспышка UI ''NEAR
      MISS'', экран сотрясает импульс шейка, шкала N2O наполняется на +25%, звучит
      сочный свист разряженного воздуха.'
    decision: Задержаться в слипстриме передней фуры ради эффекта рогатки или мгновенно
      вырваться в образовавшееся окно.
    duration: 0.3–0.6 с
  - step: Впрыск двухконтурного нитро-форсажа
    player_action: Зажатие клавиши 'Пробел' / тап по зоне Boost для воспламенения
      баллонов N2O.
    game_response: Взрыв синего пламени из сдвоенного глушителя, FOV расширяется с
      68° до 92°, мокрый асфальт размывается радиальным блюром, скорость подскакивает
      до 265 км/ч.
    decision: Сжечь весь запас нитро по прямой или приберечь 30% баллона для стабилизации
      машины в следующем повороте эстакады.
    duration: 1.2–2.5 с
  - step: Стабилизация и удержание комбо-таймера
    player_action: Коррекция курса микро-подруливанием, поддержание траектории на
      пределе сцепления шин.
    game_response: Таймер адреналинового комбо тикает (2.0 с до сброса), множитель
      x3 подсвечивает HUD золотым неоном, на горизонте возникает арка чекпоинта.
    decision: Сбросить газ перед сужением дороги или пойти на таран времени в боковом
      скольжении.
    duration: 0.8–1.5 с
  meso_loop:
  - step: 'Стартовый разгон и калибровка трафика (Сектор 1: Шоссе над заливом)'
    player_action: Идеальный старт с удержанием 6000 RPM, быстрый набор 180 км/ч,
      совершение первых 2-3 Near Miss на редком попутном трафике.
    game_response: Таймер сектора 25.0 с начинает обратный отсчет, плотность трафика
      0.18 авто/сек, чистая трехполосная трасса.
    decision: Агрессивно атаковать встречную полосу ради быстрого x3 комбо или спокойно
      разогреть резину на попутных полосах.
    duration: 15–20 с
  - step: 'Преодоление затора и плотного трафика (Сектор 2: Портовый тоннель)'
    player_action: Лавирование между перестраивающимися легковыми автомобилями и спаренными
      фурами, использование слипстрима.
    game_response: Освещение сменяется на агрессивный оранжевый неон тоннеля, эхо
      выхлопа усиливается на +6 дБ, плотность трафика возрастает до 0.45 авто/сек.
    decision: Использовать узкий технологический карман слева или пробивать центр
      потока через скандинавский щелчок.
    duration: 20–25 с
  - step: 'Критическая тайм-атака и финишный створ (Сектор 3: Неоновый даунтаун)'
    player_action: Непрерывный цепной впрыск N2O, экстремальные увороты от встречных
      такси и строительных заграждений на 275 км/ч.
    game_response: Таймер мигает красным (<5 с), активируется адреналиновый Audio
      Low-Pass, проезд через голографическую арку финиша.
    decision: Рискнуть на максимальное комбо ради золотого ранга или безопасно докатиться
      до финиша с гарантированным серебром.
    duration: 25–30 с
  - step: Подведение итогов заезда и конвертация адреналина
    player_action: 'Просмотр итоговой телеметрии: время заезда, количество Near Miss,
      пиковый множитель комбо адреналина.'
    game_response: Начисление кредитов ($CASH), очков уважения улицы (REP), показ
      позиции в глобальном лидерборде дня.
    decision: Сделать мгновенный ретрай (Restart) для улучшения рекорда трассы в лидерборде
      или перейти в гараж для тюнинга.
    duration: 5–10 с
  macro_loop:
  - step: Выбор спринт-трассы и класса спорткара
    player_action: Выбор локации в меню карты города ('Портовый тоннель - Полночь'),
      выбор спорткара из гаража.
    game_response: Отображение целевого времени для Золота (72.0 с), плотности трафика
      и коэффициента награды $CASH/REP.
    decision: Поехать на легком заднеприводном купе с высоким риском заноса или на
      тяжелом полноприводном спорт-седане с высокой курсовой устойчивостью.
    duration: 10–20 с
  - step: Выполнение спринтерского заезда (Сессия 60-90 сек)
    player_action: Пилотирование на пределе реакции, совершение 15-25 опасных разъездов,
      сжигание 5-8 баллонов закиси азота.
    game_response: Динамический расчет очков стиля, фиксация времени на отсечках,
      финишный экран с начислением кредитов.
    decision: Использовать ли жетон мгновенного восстановления при случайном касании
      отбойника на 85-й секунде.
    duration: 60–90 с
  - step: 'Гараж: Глубокий технический тюнинг узлов'
    player_action: Инвестирование заработанных $CASH в модернизацию Двигателя (ECU
      Stage 2), Нитро-инжектора и Спортивных полусликов.
    game_response: 'Параметры спорткара возрастают: +35 л.с., скорость восполнения
      N2O +20%, боковое сцепление шин +15%.'
    decision: Вложить средства в чистую максимальную мощность мотора для прямых участков
      или в ускорение зарядки закиси азота через инжектор.
    duration: 30–60 с
  - step: Стайлинг и открытие элитных нелегальных турниров
    player_action: Установка неоновой подсветки днища 'Cyber Violet', покраска кузова
      в хамелеон 'Midnight Pearl', разблокировка трассы 4-го района.
    game_response: Уровень уличной репутации (Street REP) повышается до Уровня 5,
      открывается доступ к ночным трассам 4-го района.
    decision: Бросить вызов боссу района на модифицированном спорткаре или заработать
      дополнительный банк на спринтах за заливом.
    duration: 20–40 с
