    мокрый асфальт и бешеный адреналин от миллиметровых разъездов в трафике. Механика
    лавирования свайпом/drag с удержанием нитро идеально интуитивна на смартфонах
    без обучения, сессия в 60–90 секунд идеальна для удержания в вебе, а прямолинейно-модульная
    трасса гарантирует стабильные 60 FPS на любых устройствах в Three.js.'
  rejected_reasons:
  - 'Вариант D2 («Охота на Шоссе: Перехватчик») отвергнут: множественные физические
    столкновения тяжелых твердых тел на высоких скоростях в мобильном браузере несут
    риск нестабильности физики Rapier3D (застревание в геометрии) и требуют перегруженного
    интерфейса с кнопками боковых атак, что снижает мгновенную доступность игры.'
  - 'Вариант D3 («Дуэль в Каньоне: Горный Дрифт») отвергнут: механика тонкого контроля
    угла заноса и перекладки на сенсорных экранах смартфонов имеет слишком высокий
    порог входа; срыв в неконтролируемое вращение и падение с обрыва в первые 20 секунд
    приводит к высокому оттоку казуальной веб-аудитории.'
  what_it_is_not:
  - Выживание на открытой плоской арене с круговым дрифтом и сбором сфер опыта (запрет
    на формулу авто-рогалика)
  - Окно выбора из трех случайных карточек апгрейда при повышении уровня
  - Виртуальный аналоговый плавающий джойстик в углу экрана для поворота колес
  - Бесконечный раннер по трем дискретным полосам без физики подвески, массы и кренов
  - Серые бесформенные блоки вместо проработанных стилизованных спорткаров с неоновой
    подсветкой
  - Магические способности, ракетницы, лазеры и фантастическое оружие на капоте машины
  - Мета-прогрессия со сбором золота на дороге ради абстрактных числовых прибавок
    к урону
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - Физический контроллер автомобиля на базе Rapier 3D Dynamic Raycast с ощутимой
    инерцией, кренами подвески и пробуксовкой колес
  - 'Механика риска Near Miss: шкала закиси азота заряжается исключительно за опасные
    разъезды в миллиметрах от машин трафика на максимальной скорости'
  - Живой трафик из разнотипных машин (легковые, такси, тяжелые фуры) с работающей
    оптикой фар и стоп-сигналов на ночном мокром шоссе
  - 'Эффект взрывного нитро-ускорения: динамическое сужение FOV, радиальный размыв
    скорости и снопы синего пламени из выхлопных труб'
  - Короткий плотный спринт от старта до финиша (60–90 секунд) с контрольными чекпоинтами
    и тайм-атакой
  signature_scene: Ночной вид от заднего бампера заниженного тюнингованного спорткара
    цвета 'хамелеон', летящего на 250 км/ч с пылающей неоновой подсветкой днища и
    синими факелами закиси из выхлопа точно в полуметровый зазор между двумя встречными
    фурами, освещающими мокрый асфальт снопами фар.
  avoid_references:
  - Гонку стиле нфс playgama (авто-рогалик с выживанием на арене)
  - Vampire Survivors / Survivor.io (аренные волны врагов и карточки апгрейдов)
  - Subway Surfers (дискретная 3-полосная раннерная механика без физики и массы)
  - Traffic Racer (статичный бездушный 2D/2.5D кликер без динамики и заносов)
  - Asphalt 9 / Nitro Nation (автоматическое управление TouchDrive и тяжеловесный
    gacha-интерфейс)
knowledge_plan:
  selections:
  - path: patterns/racing_event_loop.md
    role: core
    reason: Определяет структуру спринтерского заезда точка-в-точку с чекпоинтами,
      тайм-атакой, финишем, гаражом и прогрессией.
  - path: threejs/rapier_vehicle_controller.md
    role: core
    reason: Реализует эталонный физический контроллер спорткара RaycastVehicle на
      базе Rapier3D для реалистичного управления и ускорения.
  - path: threejs/arcade_racing_and_drift.md
    role: core
    reason: Обеспечивает аркадную физику сцепления, механику силового заноса и генерацию
      следов покрышек на асфальте.
  - path: mechanics/vehicle_physics.md
    role: core
    reason: Задает параметры динамики спорткара, распределения массы, аэродинамики
      слипстрима и ускорения нитро-форсажа.
  - path: mechanics/checkpoint_lap_racing.md
    role: core
    reason: Управляет таймером тайм-атаки, триггерами контрольных точек спринта и
      фиксацией итогового времени заезда.
  - path: stack/rapier3d.md
    role: core
    reason: Подключает физический движок WebAssembly для симуляции рейкаст-колес спорткара
      и высокоскоростных коллизий в трафике.
  - path: threejs/vehicle_wheel_rig.md
    role: supporting
    reason: Отвечает за визуальную сборку спорткара, правильное вращение колес, их
      выворот при рулении и крен кузова при маневрах.
  - path: threejs/game_map_and_world_design.md
    role: supporting
    reason: Позволяет процедурно сгенерировать скоростное ночное шоссе с дорожной
      разметкой, ограждениями и городским окружением.
  - path: threejs/procedural_mesh_builder.md
    role: supporting
    reason: Создает процедурные 3D-модели спорткара игрока, трафика (фур и легковых
      машин) и неонового ночного мегаполиса без внешних GLTF-файлов.
  - path: threejs/juice_and_vfx_pool.md
    role: supporting
    reason: Реализует частицы синего пламени закиси азота, снопы искр от касаний,
      неоновые шлейфы и эффект тряски камеры на высокой скорости.
  - path: stack/postprocessing.md
    role: supporting
    reason: Добавляет визуальные эффекты неонового свечения (Bloom) и радиального
      размытия (Radial Blur) при активации нитро-ускорения.
  - path: audio/procedural_sound_synthesizer.md
    role: supporting
    reason: Генерирует процедурные звуки рева форсированного мотора, шипения закиси
      азота и свиста покрышек на чистом Web Audio API.
  rejected:
  - threejs/racing_track_and_opponents.md
  - mechanics/drift_scoring.md
  - mechanics/rubberband_opposition.md
  - mechanics/upgrade_choices.md
  - stack/yuka_ai.md
  - patterns/score_attack_loop.md
  rejection_reason: Проект является спринтом по шоссе на время через плотный поток
    гражданского трафика, а не кольцевой гонкой с ИИ-соперниками (threejs/racing_track_and_opponents.md,
    mechanics/rubberband_opposition.md); дрифт здесь нужен для тактического лавирования
    в потоке, а не для фарма очков (mechanics/drift_scoring.md, patterns/score_attack_loop.md);
    рогалик-карточки апгрейдов запрещены дизайном (mechanics/upgrade_choices.md),
    а прямолинейный трафик не требует комплексной ИИ-библиотеки (stack/yuka_ai.md).
  loop_pattern: patterns/racing_event_loop.md
  summary: Проект опирается на физику рейкаст-автомобиля Rapier3D, аркадный дрифт,
    спринтерскую структуру гоночного события с чекпоинтами, процедурные 3D-модели
    и визуальные эффекты скорости с закисью азота.
player_promise:
  concept_title: 'Ночной Спринт: Трафик и Закись'
  store_promise:
    claim: Культовый ночной стритрейсинг в стиле NFS Underground с мокрым асфальтом,
      ревом моторов и бешеным нитро на скорости 250 км/ч прямо в твоем браузере без
      установки.
    expected_evidence:
    - Скриншоты и видео ночного спорткара с неоновой подсветкой, летящего между фурами
      в снопах синего пламени закиси азота
    failure_signals:
    - Неподвижные скриншоты серых коробок, отсутствие мокрого асфальта и неоновых
      отражений, обещание боевого оружия
  first_session_promise:
    claim: За первые 3 секунды ты уже несешься на скорости 200 км/ч, за 10 секунд
      совершаешь первый миллиметровый разъезд с фурой и испытываешь взрывной восторг
      от удара по кнопке нитро.
    expected_evidence:
    - Мгновенный старт без обучения, интуитивный мобильный свайп, первый Near Miss
      на 4-й секунде, яркий визуал нитро-буста
    failure_signals:
    - Длинные текстовые туториалы, нечувствительное управление, задержки звука мотора,
      падение FPS ниже 45
  long_term_promise:
    claim: Мастерство идеальной траектории в плотном трафике, адреналиновые рекорды
      в глобальной таблице лидеров и сборка гаража мечты из 6 прокачанных кастомных
      спорткаров.
    expected_evidence:
    - 12 разнообразных ночных трасс с жесткими нормативами золотых медалей, глубокий
      тюнинг двигателей и кастомизация неонового стиля
    failure_signals:
    - Однообразные одинаковые трассы, отсутствие чувства прогресса в мощности машин,
      пустые таблицы лидеров
  assumptions:
  - Игроки ценят короткую адреналиновую сессию на 75 секунд выше длинных открытых
    миров в веб-формате
  - Механика Near Miss с мгновенной зарядкой нитро дает более сильный эмоциональный
    отклик, чем сбор пикапов на дороге
  - Интуитивный горизонтальный drag-контроль понятен 98% мобильных игроков без текстового
    обучения
  validation_notes:
  - Проверить процент успешного прохождения первого чекпоинта новичками в первой сессии
    (целевой показатель > 85%)
  - Замерить среднее количество Near Miss за заезд (целевой показатель 12-18 разъездов)
  - Оценить конверсию в просмотр Rewarded Video для удвоения награды (целевой показатель
    > 40%)
design_nucleus:
- id: N1
  name: Адреналиновый Риск Near Miss (Касательный Разъезд)
  tradeoff: Рисковать выездом на встречную полосу и миллиметровым сближением ради
    мгновенного нитро ИЛИ ехать безопасно по свободной полосе с риском не уложиться
    в таймер чекпоинта
  behavior_change: Игрок непрерывно сканирует плотные зазоры между машинами и осознанно
    ищет опасные сближения, входя в состояние предельного потока
  depends_on:
  - Точность хитбоксов Rapier 3D
  - Предсказуемость траекторий трафика с поворотниками
  - Четкий аудиовизуальный фидбек Near Miss
  best_fit: Широкая мобильная и десктопная аудитория поклонников аркадных гонок и
    тайм-атаки
  biggest_risk: Случайные касания и фрустрация при неточной интерполяции коллизий
  smallest_validation: Прототип из 1 трассы с 3 фурами и счетчиком Near Miss на 30
    секунд
  selected: true
- id: N2
  name: Аэродинамический Слипстрим-Слингшот
  tradeoff: Висеть на хвосте тяжелой фуры без обзора ради бесплатного разгона ИЛИ
    сразу идти на обгон с тратой драгоценного баллона нитро
  behavior_change: Игрок выстраивает цепочки перестроений от одного грузовика к другому,
    используя их как катапульты скорости
  depends_on:
  - Плотность спавна крупногабаритного транспорта
  - Четкая индикация зоны всасывания
  best_fit: Хардкорные фанаты симуляторов хайвей-рейсинга (Wangan Midnight)
  biggest_risk: Частые аварии в задний бампер фуры из-за перекрытия обзора
  smallest_validation: Тест физики снижения лобового сопротивления за движущимся кубом
    в Three.js
  selected: false
selected_nucleus: N1
assumptions:
- id: A1
  statement: Механика зарядки закиси азота исключительно через миллиметровые разъезды
    Near Miss создает более высокий уровень вовлечения, чем сбор пикапов на дороге.
  category: design
  ul_level: UL-L3
  impact: high
  confidence: high
  validation_method: 'A/B тест двух вариантов первой сессии: с зарядкой от Near Miss
    против подбора светящихся капсул нитро.'
  falsifier: Игроки в варианте Near Miss совершают на 30% меньше обгонов и показывают
    более низкий D1 retention.
  status: open
- id: A2
  statement: Прямолинейно-модульная трасса с инстансингом геометрии и Raycast-физикой
    обеспечивает стабильные 60 FPS на бюджетных смартфонах.
  category: tech
  ul_level: UL-L2
  impact: high
  confidence: high
  validation_method: Автоматический стресс-тест в headless Chrome с эмуляцией мобильного
    GPU Mali-G52 при 24 машинах трафика.
  falsifier: Средний FPS падает ниже 50 или количество Draw Calls превышает 80.
  status: open
- id: A3
  statement: Спринтерская сессия длительностью 60–90 секунд с 3 чекпоинтами максимизирует
    количество завершенных заездов и повторных запусков.
  category: player
  ul_level: UL-L3
  impact: medium
  confidence: high
  validation_method: 'Анализ когортной воронки завершения заездов: процент игроков,
    сыгравших 3+ заезда в первой сессии.'
  falsifier: Более 40% игроков закрывают вкладку до завершения первого спринта.
  status: open
experience_density:
  formula: ED = MD/min × (SF + EB + AR) / CLP
  theory_status: design_hypothesis
  metric_model: web_session
  evidence_level: UL-L3
  boredom_type: недостимуляция
  stimulation_window: 0-8 секунд (мгновенный разгон, первый Near Miss и вспышка нитро)
  md_per_min_target: 28
  time_to_first_action_sec: 1.2
  time_to_first_reward_sec: 3.5
  first_session_beats:
  - window: 0-3 сек
    player_state: Старт заезда, восторг от рева мотора и набора скорости
    required_event: Автоматический взрывной старт, приближение к первому ряду трафика
    failure_signal: Задержка старта, зависание аудио, непонимание управления
  - window: 3-8 сек
    player_state: Первое аналоговое руление, осознание механики риска
    required_event: Совершение первого успешного Near Miss, звуковой сигнал 'Whoosh!'
      и заполнение шкалы нитро на 20%
    failure_signal: Лобовое столкновение на первой секунде без понимания траектории
  - window: 8-15 сек
    player_state: Испытание сверхзвукового ускорения
    required_event: Активация закиси азота, сужение FOV, обгон колонны из 3 машин
    failure_signal: Игрок не замечает готовность нитро и не жмет кнопку буста
  - window: 15-35 сек
    player_state: Напряжение тайм-атаки и взятие первой контрольной точки
    required_event: Успешное пересечение Чекпоинта 1 с таймером в желтой зоне (+25
      сек)
    failure_signal: Истечение времени таймера до достижения отсечки
  - window: 35-75 сек
    player_state: Кульминация спринта, прорыв сквозь фуры и финиш
    required_event: Финиш заезда с золотой медалью, показ экрана наград с кредитами
    failure_signal: Выход из игры на середине дистанции
  clp_reducers:
  - Мгновенный старт заезда без длинных экранов загрузки и диалоговых окон
  - Интуитивное Drag-руление в любой точке экрана вместо поиска маленьких кнопок
  - Автоматическая коробка передач и газ — игрок фокусируется только на рулении и
    нитро
  - Четкие оранжевые световые сигналы поворотников трафика за 0.8с до перестроения
  sf_boosters:
  - Кастомный PBR-шейдер мокрого асфальта с зеркальными отражениями неоновых огней
  - Двухструйный анимированный факел синего пламени закиси с искрами и искажением
    воздуха
  - Динамический наклон камеры и сужение FOV при разгоне до 270 км/ч
  - Сочный физический звук сброса давления турбины (Blow-Off) и стерео-эффект Доплера
    при обгонах
  eb_boosters:
  - Нарастающий комбо-множитель адреналина (x1 -> x8) с пульсацией интерфейса
  - Замедление времени (хроно-вспышка) при взятии чекпоинта на последних секундах
  - Возможность виртуозно проскочить в полуметровый зазор между двумя фурами на встречке
  ar_boosters:
  - 'Кастомизация спорткара: установка яркой неоновой подсветки днища и уникальных
    дисков'
  - 'Свобода выбора траектории: безопасный правый ряд или агрессивная встречная полоса'
  - 'Прокачка узлов двигателя под свой стиль: максимальная скорость или быстрый отклик
    нитро'
  primary_lever: MD/min
  variants:
  - id: ED-V1
    primary_lever: MD/min
    change: Увеличение плотности спавна трафика на 20% с расширением гарантированного
      окна разъезда
    hypothesis: Повысит частоту Near Miss решений с 20 до 28 в минуту, усилив ощущение
      плотности потока
    success_metric: Рост D1 Retention на +4.5% и увеличение средней длины игровой
      сессии
    guardrail_metric: Количество аварий в первые 30 секунд не должно вырасти более
      чем на 5%
    rollback_rule: Если доля поражений новичков на Чекпоинте 1 превысит 20%, вернуть
      базовую плотность
  telemetry:
  - name: near_miss_triggered
    trigger: Успешный разъезд ближе 1.2м
    params:
    - distance
    - is_oncoming
    - current_speed
    - combo_level
    purpose: Оценка частоты и качества решений риска
    ties_to: A1
  - name: nitro_activated
    trigger: Нажатие кнопки закиси азота
    params:
    - duration_sec
    - speed_start
    - speed_end
    purpose: Контроль паттернов использования ускорения
    ties_to: N1
  - name: checkpoint_reached
    trigger: Пересечение контрольной точки
    params:
    - checkpoint_id
    - time_remaining_sec
    - crash_count
    purpose: Калибровка баланса таймера и сложности трассы
    ties_to: A3
  - name: sprint_finished
    trigger: Пересечение финишной черты
    params:
    - total_time_sec
    - final_score
    - medal_tier
    - revive_used
    purpose: Анализ воронки завершения заездов
    ties_to: A3
  dashboard_fields:
  - D1_Retention
  - Near_Misses_Per_Minute
  - Checkpoint_1_Pass_Rate
  - Rewarded_Revive_Conversion
  - Average_FPS_Mobile
  decision_rules:
  - Если Checkpoint_1_Pass_Rate < 80% -> добавить +3 секунды к стартовому таймеру
  - Если Near_Misses_Per_Minute < 15 -> увеличить дистанцию детектора Near Miss с
    1.2м до 1.4м
hlls:
  hook: Ночной вид от бампера заниженного хамелеон-спорткара, летящего на 250 км/ч
    с неоном под днищем точно в зазор между встречными фурами под рев прямоточного
    выхлопа.
  loop: Лавируй в миллиметрах от трафика -> Заряжай нитро риском -> Взрывай форсаж
    на 270 км/ч -> Бери чекпоинты тайм-атаки -> Прокачивай спорткар в гараже.
  link: Кредиты и репутация за идеальные заезды открывают доступ к тюнингу турбины
    и неоновому стайлингу, позволяя штурмовать более скоростные трассы.
  surprise: Внезапные динамические перестроения трафика в узких тоннелях и эффект
    рогатки (Slingshot) при выходе из слипстрима за многотонными фурами.
  weakest_layer: link (риск того, что прокачка в гараже покажется игроку недостаточно
    визуально ощутимой)
  fixes:
  - Добавить мгновенную визуализацию деталей тюнинга в 3D-гараже (новые спойлеры,
    капоты, диски, цвет неона)
  - Сделать ощутимый прирост звука выхлопа и длительности факела нитро при каждом
    апгрейде
validation:
  riskiest_assumption: 'A1: Игрокам понравится добывать нитро исключительно через
    риск миллиметровых сближений в трафике без привычных подбираемых бонусов на дороге.'
  smallest_playable_prototype: '1-минутный тестовый уровень на Three.js: 1 спорткар,
    1 прямая неоновая трасса, 10 машин трафика, механика Near Miss с пополнением шкалы
    нитро и таймер.'
  voi_note: Проверка за 1 день разработки сэкономит 3 недели работы над мета-прогрессией
    и созданием 12 трасс, если ключевой геймфил не сработает.
  experiments:
  - id: EXP-01
    targets_assumption: A1
    question: Чувствуют ли игроки адреналиновый кайф от Near Miss и используют ли
      они полученное нитро для разгона?
    prototype_scope: Минимальный WebGL-билд с 1 спорткаром, спавнером трафика и счетчиком
      Near Miss
    duration: 1 день
    method: Плейтест на выборке из 30 игроков на смартфонах и ПК с записью телеметрии
    pass_criteria: '> 80% игроков совершают 10+ Near Miss за 60 секунд и оценивают
      ощущение скорости на 8+ из 10'
    fail_criteria: Игроки избегают сближений с трафиком, едут по пустой обочине и
      жалуются на нехватку нитро
    next_step_if_pass: Переход к реализации полной системы 12 трасс, 3D-гаража и тюнинга
    next_step_if_fail: Добавить пассивную медленную регенерацию нитро (10% в сек),
      оставив Near Miss как супер-ускоритель
  stop_rule: Если после трех итераций настройки хитбоксов доля случайных аварий у
    новичков превышает 40%, пересмотреть механику позиционирования трафика.
  scope_gate:
    mvp_must:
    - Физический контроллер автомобиля на Rapier 3D с кренами кузова
    - Мобильное drag-управление и управление стрелками/WASD на ПК
    - Процедурный спавнер 3 типов трафика (седаны, такси, фуры)
    - Механика Near Miss и взрывного нитро-форсажа с эффектом тоннельного FOV
    - 3 базовые спринт-трассы с чекпоинтами и тайм-атакой
    - Гараж с 2 автомобилями и базовой прокачкой двигателя и нитро
    - Интеграция Playgama Bridge (сохранения и таблица лидеров)
    vertical_slice_should:
    - Кастомный шейдер мокрого асфальта с отражениями
    - Расширение гаража до 6 автомобилей и 4 веток тюнинга
    - 12 разнообразных ночных трасс (Шоссе, Тоннель, Мост, Даунтаун)
    - Интеграция Rewarded Video (Revive и удвоение наград)
    after_launch:
    - Режим дуэли с тенью рекорда лучшего игрока (Ghost Racing)
    - Новые кастомные боди-киты и анимированные винилы
    - Еженедельные турнирные кубки с уникальными наградами
    marketing_only:
    - Кинематографичные трейлеры с ракурсами аварий в замедлении
    - Рендеры спорткаров в высоком разрешении для витрины Yandex Games
    cut:
    - Открытый бесшовный мир с поездками между гонками
    - Полицейские погони с вертолетами и шипами (перегруз WebGL)
    - Сложная деформация кузова с отваливающимися деталями
decisions:
- id: DEC-01
  title: Выбор Raycast Vehicle на Rapier 3D вместо составного физического шасси
  context: Необходимо обеспечить стабильные 60 FPS на мобильных браузерах при сохранении
    ощущения массы, кренов подвески и сноса колес.
  decision: Реализовать единый RigidBody для корпуса и 4 математических луча Raycast
    для колес с вычислением сил подвески в коде.
  alternatives:
  - Составной Rigidbody с 4 HingeJoint шарнирами
  - Чистая аркадная кинематика без физического движка
  consequences:
  - Идеальная производительность без просадок FPS
  - Точный контроль над шинным сцеплением и кренами
  - Требуется ручная калибровка сил подвески
  reversibility: medium
  evidence_level: UL-L2
  rollback: Переключение на аркадный сплайновый контроллер с псевдофизикой
  status: accepted
- id: DEC-02
  title: Привязка шкалы нитро к риску Near Miss вместо пассивного накопления
  context: Нужно выделить проект на фоне сотен шаблонных раннеров и дать игроку постоянную
    причину для активного маневрирования.
  decision: Шкала нитро пополняется только за опасные разъезды в миллиметрах от трафика
    и за езду по встречной полосе.
  alternatives:
  - Пассивное накопление закиси со временем
  - Сбор светящихся иконок нитро на полосах дороги
  consequences:
  - Глубокий геймплей с высоким потолком мастерства
  - Трафик становится источником ресурса скорости, а не просто помехой
  reversibility: high
  evidence_level: UL-L2
  rollback: Добавление пассивного прироста +5% в секунду при сохранении бонуса за
    Near Miss
  status: accepted
- id: DEC-03
  title: Спринтерская сессия на 60–90 секунд с чекпоинтами вместо бесконечного заезда
  context: Бесконечные раннеры страдают от размытого ощущения победы и быстрого утомления
    игрока.
  decision: Фиксированная дистанция с 3 чекпоинтами тайм-атаки, медалями (золото/серебро/бронза)
    и фиксацией рекорда.
  alternatives:
  - Бесконечная прямая дорога до первой аварии
  - Кольцевые гонки на 3 круга
  consequences:
  - Четкий цикл сессии с высокой реиграбельностью
  - Идеальный тайминг под рекламные показы между заездами
  reversibility: medium
  evidence_level: UL-L2
  rollback: Введение отдельного бесконечного режима 'Survival Highway' в качестве
    дополнительного
  status: accepted
gates:
- id: GATE-01
  name: Утверждение физической калибровки Raycast-контроллера и Drag-управления
  question: Ощущается ли управление спорткаром на смартфоне достаточно отзывчивым
    и дарит ли оно приятное чувство массы и заноса?
  blocks: Создание финальных 12 трасс и расширенной линейки автомобилей
  criteria:
  - Спорткар мгновенно реагирует на drag-свайп
  - Подвеска приятно кренится в поворотах
  - Near Miss срабатывает честно без ложных столкновений
  status: pending
  decided_at: ''
  note: Тестируется на вертикальном срезе из 1 трассы
- id: GATE-02
  name: Финальная приемка баланса экономики и монетизации
  question: Сбалансирован ли доход кредитов так, чтобы игрок мог открыть все машины
    за 3-4 часа игры без обязательного доната?
  blocks: Финальный релиз и запуск маркетинговых кампаний
  criteria:
  - Открытие 2-й машины происходит на 15-й минуте игры
  - Rewarded Video ощущается желанным бонусом, а не принуждением
  status: pending
  decided_at: ''
  note: Калибруется по итогам когортного плейтеста
