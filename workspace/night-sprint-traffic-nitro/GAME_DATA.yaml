  tension_curve: 'Кривая напряжения: ''Волнообразно нарастающая синусоида со взрывной
    кульминацией (Sawtooth Escalation)''. 0-15 сек (Калибровка, Напряжение 20% ->
    40%): Плавный разгон, редкий попутный трафик на 3 полосах. Игрок входит в ритм,
    совершая первые 2-3 безопасных разъезда. 15-35 сек (Первый пик, Напряжение 40%
    -> 75%): Появление встречного потока и перестроений. Дорога сужается из-за ремонтных
    работ. Таймер первого чекпоинта поджимает (<5 сек). 35-40 сек (Разрядка после
    чекпоинта, Напряжение 75% -> 45%): Успешное взятие чекпоинта дает +15 секунд,
    звук победного звона, короткий прямой отрезок шоссе для выдоха и разгона. 40-65
    сек (Эскалация тоннеля, Напряжение 45% -> 85%): Портовый тоннель с глухими стенами,
    плотность фур удваивается, образуются ''стены'' из двух грузовиков рядом. Требуется
    лавирование через слипстрим и снос боком. 65-70 сек (Вторая микро-разрядка, Напряжение
    85% -> 60%): Чекпоинт 2, выезд из тоннеля на освещенный неоном даунтаун. 70-90
    сек (Финальный гипер-стресс, Напряжение 60% -> 100%): Дорога с плотным встречным
    движением, таймер тает до 0.1 секунды, адреналиновый множитель x5 пульсирует на
    экране, непрерывный форсаж закиси на скорости 280 км/ч среди мелькающих фар до
    пересечения финишной черты.'
  core_formulas:
  - 'Генерация закиси азота за Near Miss: N2O_Gain = Base_Gain * (1.0 + (Speed_kmh
    - 120) / 100) * Opposing_Traffic_Multiplier * Proximity_Factor, где Base_Gain
    = 18.0%, Opposing_Traffic_Multiplier = 2.2 (для встречной полосы) или 1.0 (для
    попутной полосы), Proximity_Factor = clamp((1.2 - Distance_m) / 0.8, 0.5, 1.5).
    Пример: разъезд на встречке на 220 км/ч с зазором 0.4 м дает 18.0 * 2.0 * 2.2
    * 1.0 = 79.2% объема баллона N2O.'
  - 'Динамика скорости под нитро: V_target = V_base_max + Nitro_Boost_Speed * Nitro_Stage_Coeff,
    где V_base_max = 210 км/ч, Nitro_Boost_Speed = 70 км/ч, Nitro_Stage_Coeff = 1.0
    (Stage 1) или 1.25 (Stage 2 Overdrive). Продольное ускорение: a_long = (Torque_engine
    * Gear_ratio * N2O_Torque_Mult) / (Vehicle_Mass * Wheel_Radius) - 0.5 * Cd * Rho
    * Frontal_Area * V^2.'
  - 'Спавн и плотность трафика: Traffic_Spawn_Rate(t) = Base_Rate + (Max_Rate - Base_Rate)
    * (t / Track_Duration)^1.4, где Base_Rate = 0.18 авто/сек, Max_Rate = 0.65 авто/сек,
    t — текущее время заезда (сек), Track_Duration = 75.0 сек. Вероятность встречного
    трафика: P_oncoming = min(0.45, 0.10 + 0.35 * (t / Track_Duration)).'
  - 'Счет адреналинового комбо: Score_Tick = (Base_Speed_Points * (Speed_kmh / 100)^2
    + Drift_Points + NearMiss_Bonus) * Combo_Multiplier, где Combo_Multiplier = min(5.0,
    1.0 + Current_Streak * 0.5). Окно удержания комбо: Combo_Window_Sec = max(1.2,
    2.8 - (Combo_Multiplier - 1.0) * 0.35).'
  - 'Физика скандинавского щелчка и бокового сноса: Lateral_Force = Fy_front + Fy_rear,
    где Fy = Slip_Angle * Tire_Cornering_Stiffness * (Normal_Load / Base_Load). Коэффициент
    сохранения скорости при дрифте: V_exit = V_entry * (1.0 - 0.08 * sin(Drift_Angle_Deg
    * PI / 180)) (сохранение не менее 92% скорости при угле скольжения до 28°).'
  run_progression:
  - 'Фаза 1 (Старт, 0-15 сек) — ''Холодные шины и пустой баллон'': Базовая скорость
    160-190 км/ч, комбо x1, отсутствие закиси азота. Игрок уязвим по времени и обязан
    быстро совершить 2-3 чистых сближения.'
  - 'Фаза 2 (Сектор 1, 15-40 сек) — ''Зарядка первого контура'': Накопление 100% N2O,
    выход на крейсерские 230 км/ч, множитель комбо x2-x3, расширение радиуса сканирования
    трафика.'
  - 'Фаза 3 (Сектор 2, 40-65 сек) — ''Аэродинамический разгон (Драфт-разогрев)'':
    За счет серийного слипстрима за фурами температура турбины достигает оптимума,
    открывается Stage-2 Двухконтурный Нитро-форсаж (разгон до 275 км/ч).'
  - 'Фаза 4 (Финальный спринт, 65-90 сек) — ''Адреналиновый Овердрайв'': Комбо x5
    генерирует нитро быстрее, чем оно тратится при непрерывном удержании в узких щелях
    трафика; экран в постоянном гипер-блюре, время субъективно замедляется при проезде
    миллиметровых зон.'
  meta_progression:
  - 'Форсирование Двигателя (Stage 1 -> Stage 4 ECU & Turbo): Увеличивает базовую
    мощность со 180 л.с. до 420 л.с., сокращая разгон 0-100 км/ч с 5.2 с до 2.4 с
    и повышая предельную скорость без нитро со 195 км/ч до 255 км/ч.'
  - 'Двухконтурный Нитро-Инжектор (N2O Multi-Port Injection): Увеличивает емкость
    баллонов с 1 до 3 секций, ускоряет восполнение за Near Miss на +40% и повышает
    максимальную пиковую скорость на форсаже до 300 км/ч.'
  - 'Спортивная Подвеска и Гоночные Компаунды (Suspension & Slick Tires): Увеличивает
    боковое сцепление на 30%, делает скандинавский щелчок более острым и расширяет
    допустимый угол безнаказанного бокового сноса с 18° до 38°.'
  - 'Карбоновое Облегчение Кузова (Chassis Weight Reduction): Снижает массу спорткара
    с 1450 кг до 1050 кг, уменьшая инерцию при перекладках руля и сокращая тормозной
    путь на 25%.'
  - 'Уличный Стайлинг и Репутация (Street REP & Visual mods): Неоновые трубки днища,
    диски с глубокой полкой, хамелеон-эмаль и карбоновые спойлеры увеличивают коэффициент
    уважения (REP Multiplier x1.1 .. x2.0), открывая доступ к ночным районам высшей
    лиги.'
  mechanics:
  - name: Касательный Разъезд «Razor Near Miss»
    role_in_loop: Главный источник топлива (источник ресурса и риска), конвертирующий
      пространственную опасность в закись азота и множитель счета.
    player_decision: Нырнуть ли в миллиметровый зазор между двумя попутными фурами
      (или выехать на встречную полосу) ради мгновенной зарядки 40% нитро и удержания
      комбо x4, либо безопасно притормозить и потерять драгоценные секунды таймера.
    input_mapping: 'Клавиатура: A / D или Стрелки влево/вправо (аналоговая интерполяция
      поворота руля); Тач: горизонтальный свайп/drag пальцем по нижней трети экрана
      или экранные кнопки <- / ->.'
    states:
    - 'SEARCHING: спорткар движется без опасного сближения (расстояние до машин трафика
      > 2.5 м), шкала N2O не получает бонус.'
    - 'PROXIMITY_LOCK: спорткар вошел в зону 1.2 м от трафика на скорости > 120 км/ч;
      начинается расчет траектории сближения.'
    - 'RAZOR_TRIGGERED: точка минимального сближения пройдена без контакта (зазор
      0.15–1.2 м); мгновенно начисляются N2O и очки комбо.'
    - 'COLLISION_PENALTY: дистанция упала до 0 м (касание); сброс комбо в x1, потеря
      40 км/ч скорости, сноп искр.'
    parameters:
    - name: Критическая дистанция фиксации Near Miss
      value: 1.2 м
      tuning_note: Если увеличить до 2.0 м, разъезды станут тривиальными и пропадет
        чувство смертельного риска; если уменьшить до 0.6 м, 90% игроков будут разбиваться
        из-за погрешностей ввода на смартфонах.
    - name: Минимальный порог скорости для зачета
      value: 120 км/ч
      tuning_note: Если снизить до 60 км/ч, игроки начнут фармить нитро на черепашьей
        скорости без азарта; если поднять до 180 км/ч, механика не будет работать
        на разгонной фазе после аварий.
    - name: Базовый объем восполнения закиси азота
      value: 18.0%
      tuning_note: Если сделать 35%, баллон никогда не опустеет и нитро потеряет ценность;
        если сделать 7%, игрок будет постоянно испытывать дефицит скорости и не уложится
        в таймер золота.
    - name: Множитель бонуса за встречную полосу
      value: 2.2x
      tuning_note: Если сделать 1.0x, игроки перестанут рисковать на встречке; если
        сделать 4.0x, встречная полоса станет единственной оптимальной стратой, обесценив
        лавирование в попутном потоке.
    feedback_layers:
    - 'Визуал / VFX: Резкая вспышка линзового блика (Lens Flare) фар трафика, сноп
      искр от боковых зеркал при зазоре <0.4 м, радиальное размытие и всплывающий
      неоновый текст ''RAZOR NEAR MISS +250''.'
    - 'Звук / Web Audio: Доплеровский визг рассекаемого воздуха (свист 1.8 кГц ->
      450 Гц), басовый щелчок панча сабвуфера (75 Гц), гудок клаксона встречной машины
      с панорамированием влево/вправо.'
    - 'Камера: Микро-импульс сотрясения камеры (Spring Shake с амплитудой 0.12 м и
      затуханием 0.25 с), легкий зум-толчок FOV -2° с мгновенным возвратом.'
    - 'UI / Тактильность: Haptic-импульс 45 мс на мобильных устройствах, вспышка золотистой
      каймы вокруг шкалы закиси азота, пульсация цифры комбо-множителя на спидометре.'
    failure_mode: 'Игрок не рассчитывает габариты спорткара или динамику смещения
      трафика и врезается в крыло машины. Сигнал: грохот деформации металла, звон
      разбитого стекла, экран заливает красная виньетка, потеря скорости на 40% и
      сброс комбо до x1.'
    mastery_curve: Новичок на 30-й секунде осторожно обгоняет машины с зазором 1.5
      м на попутной полосе, получая редкие бонусы. Эксперт на 10-м забеге осознанно
      вылетает на встречную полосу на скорости 250 км/ч, прошивает поток 'елочкой'
      с зазором 20 см и удерживает непрерывный множитель комбо x5 на протяжении всего
      заезда.
    counterplay: Трафик начинает хаотично перестраиваться с включением поворотников
      за 0.8 с до маневра, встречные машины моргают дальним светом, плотность потока
      сжимается до 3 машин в ряд, оставляя лишь одну узкую траекторию проезда.
    synergies:
    - Заряжает шкалу механики «Двухконтурный Нитро-Всплеск», обеспечивая бесконечный
      форсаж при чистой езде.
    - Продлевает окно удержания множителя в механике «Пульсирующий Тайм-Атак Чекпоинтов».
    - Складывается с бонусом механики «Силовой Скандинавский Щелчок», удваивая очки
      при разъезде в состоянии бокового сноса.
    why_unique: В большинстве аркад Near Miss — это просто косметические очки в углу
      экрана. Здесь Near Miss — это физический кислород заезда, без которого невозможно
      поддерживать максимальную скорость и уложиться в жесткий таймер чекпоинтов.
    pseudocode: "for (const car of trafficManager.nearbyCars) {\n  const dist = car.position.distanceTo(player.position);\n\
      \  const lateralDist = Math.abs(car.position.x - player.position.x);\n  if (lateralDist\
      \ < 1.2 && dist < 2.8 && player.speedKmh >= 120 && !car.wasNearMissed) {\n \
      \   car.wasNearMissed = true;\n    const isOpposing = car.lane.isOpposing;\n\
      \    const mult = isOpposing ? 2.2 : 1.0;\n    const proximityBonus = Math.min(1.5,\
      \ Math.max(0.5, (1.2 - lateralDist) / 0.8));\n    nitroSystem.addNitro(18.0\
      \ * mult * proximityBonus);\n    comboSystem.registerEvent('NEAR_MISS', mult);\n\
      \    audioSystem.playSpatialDoppler('whoosh_pass', car.position);\n    vfxSystem.spawnMirrorSparks(player.position,\
      \ lateralDist < 0.4);\n    cameraSystem.addTrauma(0.25);\n  }\n}"
  - name: Двухконтурный Нитро-Всплеск «Twin-Stage N2O Burst»
    role_in_loop: Главный скоростной двигатель заезда (потребитель ресурса), превращающий
      накопленный за риск ресурс во взрывное сокращение времени до чекпоинта.
    player_decision: Активировать ли короткий импульсный буст Stage 1 для быстрого
      обгона одного грузовика или продавить педаль до Stage 2 Overdrive на прямой
      ценой мгновенного сжигания всего запаса закиси азота.
    input_mapping: 'Клавиатура: Space или Shift (удержание); Тач: кнопка ''NITRO''
      в правой нижней части экрана (одиночный тап — Stage 1, удержание более 0.4 с
      — переход в Stage 2 Overdrive).'
    states:
    - 'IDLE: впрыск закиси выключен, двигатель работает на атмосферном/турбо наддуве.'
    - 'STAGE_1_BURST: активирован первый контур, прирост мощности +45%, скорость до
      245 км/ч, умеренный расход N2O (18%/с).'
    - 'STAGE_2_OVERDRIVE: активирован сдвоенный инжектор, крутящий момент +90%, максималка
      280 км/ч, агрессивный расход N2O (35%/с), гироскопическая стабилизация курса.'
    - 'EMPTY_EXHAUST: баллон пуст, кратковременный отстрел выхлопа (Backfire), сброс
      скорости до базовой.'
    parameters:
    - name: Прирост крутящего момента на Stage 2
      value: +90%
      tuning_note: Если сделать +150%, спорткар станет неуправляемой ракетой и будет
        мгновенно влетать в первый же бампер; если сделать +40%, игрок не почувствует
        разницы между обычной ездой и форсажем.
    - name: Пиковая скорость форсажа Stage 2
      value: 280 км/ч
      tuning_note: Если повысить до 340 км/ч, физический движок Three.js/Rapier начнет
        проскакивать тонкие коллайдеры трафика за 1 тик; если снизить до 230 км/ч,
        пропадает ощущение культовой скорости NFS.
    - name: Скорость расхода нитро на Stage 2
      value: 35.0% в секунду
      tuning_note: Если тратить 15%/с, закись будет бесконечной; если тратить 60%/с,
        игрок даже не успеет насладиться звуком и визуалом тоннельного зрения.
    - name: Коэффициент расширения угла обзора (FOV Shift)
      value: с 68° до 92°
      tuning_note: Если оставить фиксированный FOV 68°, скорость кажется медленной;
        если раздуть до 115°, искажение перспективы 'рыбий глаз' мешает оценивать
        расстояние до трафика.
    feedback_layers:
    - 'Визуал / VFX: Снопы сине-фиолетового пламени длиной 2.5 м из сдвоенных патрубков,
      сплошные неоновые инверсионные шлейфы от габаритов, хроматическая аберрация
      по краям экрана, мокрый асфальт превращается в зеркальные линии света.'
    - 'Звук / Web Audio: Взрывной рев инжектора закиси (пьезо-свист 3.2 кГц), низкочастотный
      рокот турбины под нагрузкой, смачный сброс давления блоу-офф (Blow-Off) при
      отпускании кнопки.'
    - 'Камера: Плавный динамический откат камеры назад на 0.6 метра по оси Z, расширение
      FOV до 92°, высокочастотный тремор асфальтовой тряски.'
    - 'UI / Тактильность: Неоновая шкала N2O пульсирует ярко-голубым светом, стрелка
      цифрового спидометра вспыхивает красным при преодолении 250 км/ч, непрерывная
      виброотдача 60 Гц.'
    failure_mode: 'Игрок жмет Stage 2 в повороте или в плотной толпе без свободного
      окна, теряет контроль и на скорости 270 км/ч врезается в задний борт фуры. Сигнал:
      экран вспыхивает белым, камера делает кувырок, звук мгновенно глушится лоупассом
      200 Гц.'
    mastery_curve: Новичок жмет нитро хаотично по готовности, врезаясь в первом же
      сужении. Эксперт использует Stage 1 для мгновенной корректировки позиции в потоке
      и включает Stage 2 исключительно в момент выхода в чистый коридор после серии
      Near Miss.
    counterplay: На сверхвысокой скорости время на реакцию сокращается до 0.18 с,
      а любая неровность мокрого асфальта или колея норовит сорвать заднюю ось спорткара.
    synergies:
    - Питается напрямую от механики «Касательный Разъезд (Razor Near Miss)» и «Воздушный
      Мешок (Slipstream)».
    - Позволяет преодолевать зоны заторов перед тайм-лимитом механики «Пульсирующий
      Тайм-Атак Чекпоинтов».
    - Снижает время восстановления устойчивости после механики «Силовой Скандинавский
      Щелчок».
    why_unique: Двухконтурная система дает выбор между точечным ускорением для маневра
      и тотальным прострелом на пределе физики с расширением FOV и курсовой стабилизацией.
    pseudocode: "if (input.nitroHold && nitroGauge.currentAmount > 0) {\n  const isOverdrive\
      \ = input.nitroHoldTime > 0.4 && nitroGauge.currentAmount >= 30.0;\n  const\
      \ burnRate = isOverdrive ? 35.0 : 18.0;\n  const torqueBoost = isOverdrive ?\
      \ 1.9 : 1.45;\n  const targetFov = isOverdrive ? 92.0 : 80.0;\n  nitroGauge.currentAmount\
      \ = Math.max(0, nitroGauge.currentAmount - burnRate * dt);\n  vehiclePhysics.applyTorqueMultiplier(torqueBoost);\n\
      \  vehiclePhysics.applyDirectionalStabilizer(isOverdrive ? 0.35 : 0.15);\n \
      \ cameraSystem.lerpFov(targetFov, 8.0 * dt);\n  vfxSystem.setExhaustFlame(isOverdrive\
      \ ? 'CYBER_BLUE_DOUBLE' : 'CYBER_BLUE_SINGLE');\n  audioSystem.setNitroEngineFilter(isOverdrive\
      \ ? 1.0 : 0.6);\n} else {\n  cameraSystem.lerpFov(68.0, 5.0 * dt);\n  vfxSystem.stopExhaustFlame();\n\
      }"
  - name: Аэродинамический Зацеп «Slipstream Draft & Slingshot»
    role_in_loop: Тактический разгонный мост (источник пассивного набора темпа и позиционирования),
      связывающий фазы маневрирования без траты нитро.
    player_decision: Пристроиться ли в опасную мертвую зону прямо за бампером 18-колесной
      фуры ради бесплатного разгона и эффекта «рогатки», рискуя не успеть вырулить
      при ее резком торможении, либо обойти ее широкой дугой.
    input_mapping: Удержание положения спорткара строго в створе габаритов впереди
      идущего тяжелого транспорта (отклонение по оси X не более ±0.8 м) на дистанции
      1.5–8.0 м.
    states:
    - 'OUT_OF_POCKET: спорткар вне зоны аэродинамической тени; стандартное лобовое
      сопротивление воздуха (Cd = 0.34).'
    - 'DRAFT_ENGAGED: спорткар зафиксирован в створе турбулентного хвоста; сопротивление
      снижено на 40%, шкала накопления Slingshot заряжается.'
    - 'SLINGSHOT_READY: накоплен максимальный кинетический заряд (удержание >1.2 с);
      активируется оранжевая подсветка аэро-линий.'
    - 'SLINGSHOT_RELEASE: резкий выход из коридора влево или вправо; взрывной импульс
      ускорения (+35 км/ч за 0.5 с) с эффектом выброса из пращи.'
    parameters:
    - name: Максимальная дистанция воздушного мешка
      value: 8.0 м
      tuning_note: Если увеличить до 20 м, игрок будет получать авторазгон находясь
        далеко позади без всякого чувства опасности; если уменьшить до 3 м, почти
        любой вход в слипстрим закончится тараном прицепа.
    - name: Снижение лобового сопротивления (Drag Reduction)
      value: -40%
      tuning_note: Если сделать -15%, эффект почти незаметен; если сделать -80%, машина
        за фурой будет разгоняться быстрее, чем на полном нитро.
    - name: Время зарядки эффекта «Рогатки» (Slingshot Charge)
      value: 1.2 с
      tuning_note: Если сделать 0.3 с, механика превратится в спам прыжками из полосы
        в полосу; если сделать 3.5 с, ни одна фура не останется на полосе так долго
        без перестроения.
    - name: Импульсный прирост скорости при Slingshot
      value: +35 км/ч
      tuning_note: Если дать +70 км/ч, рогатка сломает баланс нитро; если дать +10
        км/ч, маневр обгона не будет давать зрелищного опережения.
    feedback_layers:
    - 'Визуал / VFX: Полупрозрачные вихревые аэродинамические жгуты (белые неоновые
      линии потока) от задних стоек фуры к капоту спорткара, дрожание капота, вспышка
      оранжевого контура при готовности Slingshot.'
    - 'Звук / Web Audio: Затухание общего шума ветра (эффект вакуума, Low-Pass фильтрация
      800 Гц), нарастающий высокочастотный гул вихревого потока, резкий свистящий
      ''щелчок-выстрел'' при выходе из мешка.'
    - 'Камера: Приближение камеры к спорткару на 0.3 м с ощущением засасывания в разреженную
      область, резкий боковой сдвиг при маневре обгона.'
    - 'UI / Тактильность: Появление дугообразного индикатора воздушного потока над
      капотом, мягкая непрерывная микровибрация геймпада/экрана, переходящая в акцентированный
      тычок при Slingshot.'
    failure_mode: 'Игрок слишком увлекается удержанием слипстрима и влетает в тормозящую
      фуру сзади, не успев сместиться в сторону. Сигнал: резкий сноп красных тормозных
      огней фуры в лицо, сокрушительный удар, потеря 80% скорости.'
    mastery_curve: Новичок случайно попадает в хвост грузовика и пугается близости
      бампера. Эксперт использует цепочку из трех фур как гравитационную пращу, разгоняясь
      без капли нитро до 240 км/ч и выстреливая из-за них прямо в створ чекпоинта.
    counterplay: Фура может резко включить аварийные огни и затормозить из-за аварии
      впереди, либо выбросить из-под колес клубы дорожной грязи/воды, временно ухудшая
      видимость.
    synergies:
    - Позволяет безопасно сберечь 100% закиси азота для механики «Двухконтурный Нитро-Всплеск».
    - Идеально подготавливает позицию спорткара для выполнения механики «Касательный
      Разъезд» на выходе из-за фуры.
    - Увеличивает входную скорость для инициации механики «Силовой Скандинавский Щелчок».
    why_unique: Вместо пассивного увеличения скорости, слипстрим превращен в двухфазную
      механику накопления заряда «рогатки» (Slingshot), требующую идеального удержания
      в вихревом створе с последующим тайминговым маневром выстрела.
    pseudocode: "const leadTruck = trafficManager.findHeavyVehicleAhead(player.position,\
      \ 8.0);\nif (leadTruck && Math.abs(leadTruck.position.x - player.position.x)\
      \ < 0.8) {\n  slipstreamState.active = true;\n  slipstreamState.chargeTime +=\
      \ dt;\n  vehiclePhysics.setDragCoefficientMultiplier(0.60);\n  vfxSystem.renderAeroRibbons(leadTruck.position,\
      \ player.position);\n  audioSystem.setVacuumEffect(true);\n  if (slipstreamState.chargeTime\
      \ >= 1.2) uiSystem.showSlingshotReadyIndicator();\n} else {\n  if (slipstreamState.active\
      \ && slipstreamState.chargeTime >= 1.2) {\n    vehiclePhysics.applyImpulseSpeed(35.0\
      \ / 3.6);\n    audioSystem.playSpatial('slingshot_release', player.position);\n\
      \    vfxSystem.spawnSlingshotVortex(player.position);\n    cameraSystem.addTrauma(0.3);\n\
      \  }\n  slipstreamState.active = false;\n  slipstreamState.chargeTime = 0;\n\
      \  vehiclePhysics.setDragCoefficientMultiplier(1.0);\n  audioSystem.setVacuumEffect(false);\n\
      }"
  - name: Силовой Скандинавский Щелчок «Weight Transfer Flick & Power Slide»
    role_in_loop: Инструмент пространственного контроля и уклонения (механика экстремального
      маневра), позволяющий проскользнуть боком через узкие сужения трафика.
    player_decision: Инициировать ли резкий силовой занос контрсмещением руля, чтобы
      пролететь сужение дороги боком под углом 30° и собрать двойной Near Miss, либо
      попытаться затормозить по прямой с риском не вписаться в габарит.
    input_mapping: 'Клавиатура: быстрая связка A -> D (или наоборот) с кратковременным
      нажатием Пробел/Ручник; Тач: быстрый зигзагообразный жест влево-вправо по экрану.'
    states:
    - 'GRIP_DRIVING: колеса имеют 100% сцепление, курсовой угол совпадает с вектором
      движения.'
    - 'WEIGHT_LOADED: резкий поворот в противоположную сторону загружает переднюю
      внешнюю пружину подвески на 0.2 с.'
    - 'FLICK_INITIATED: обратный резкий рывок срывает заднюю ось; угол скольжения
      (Slip Angle) подскакивает до 25°–35°.'
    - 'CONTROLLED_SLIDE: поддержание угла заноса контррулением; боковое скольжение
      в потоке без потери продольного импульса.'
    - 'GRIP_RECOVERY: выравнивание колес, подхват сцепления, выстрел спорткара по
      прямой.'
    parameters:
    - name: Окно тайминга контрсмещения для инициации щелчка
      value: 0.28 с
      tuning_note: Если увеличить до 0.6 с, занос будет случайно срабатывать при обычном
        объезде препятствий; если уменьшить до 0.12 с, тайминг станет слишком пиксельным
        для сенсорных экранов смартфонов.
    - name: Оптимальный угол скольжения (Power Slide Angle)
      value: 28 градусов
      tuning_note: Если угол <15°, маневр не дает достаточного бокового смещения;
        если угол >45°, машина теряет скорость и превращается в неуправляемый волчок.
    - name: Коэффициент сохранения продольной скорости
      value: 92%
      tuning_note: Если сохранять 100%, исчезает вес физики автомобиля; если сохранять
        70%, дрифт станет невыгодным и игроки перестанут его использовать в тайм-атаке.
    - name: Бонус к множителю комбо за разъезд в заносе
      value: x1.5
      tuning_note: Если множитель x1.0, нет стимула рисковать боком; если x3.0, обычные
        разъезды по прямой станут мусором.
    feedback_layers:
    - 'Визуал / VFX: Плотные клубы неонового дыма из-под задних покрышек, светящиеся
      черные следы резины на мокром асфальте, искры от контакта дисков с дорожным
      полотном, динамический крен кузова на подвеске.'
    - 'Звук / Web Audio: Пронзительный двухтональный визг горящего компаунда шин (1.2
      кГц), циклические хлопки выхлопа антилага при перегазовке (Anti-Lag Backfire),
      свист дифференциала.'
    - 'Камера: Крен камеры (Camera Roll) на ±4.5° в сторону заноса, смещение точки
      фокуса к внешней траектории скольжения.'
    - 'UI / Тактильность: Индикатор угла дрифта на приборной панели с надписью ''DRIFT
      SLIDE'', вибрирующий Haptic-паттерн с частотой вращения колес.'
    failure_mode: Игрок передерживает руль в крайнем положении или ошибается с таймингом
      контрруления, вызывая 'Tank Slapper' (неконтролируемый ритмический занос) и
      разворот на 180° с ударом о бетонный разделитель.
    mastery_curve: Новичок боится срывать машину в занос на высокой скорости, объезжая
      трафик только по прямой. Эксперт использует скандинавский щелчок для одновременного
      пролета между двумя машинами боком, срезая траекторию по идеальной дуге и собирая
      двойной множитель комбо.
    counterplay: Мокрые масляные пятна на асфальте и металлические стыки эстакад мгновенно
      снижают сцепление шин на 50%, требуя ювелирной дозировки угла контрруления.
    synergies:
    - Увеличивает радиус сбора Near Miss за счет выставления борта машины поперек
      полосы движения.
    - Накапливает очки комбо адреналина с коэффициентом x1.5 в механике «Пульсирующий
      Тайм-Атак Чекпоинтов».
    - Выход из щелчка мгновенно стабилизируется нажатием механики «Двухконтурный Нитро-Всплеск».
    why_unique: В большинстве гонок дрифт предназначен только для крутых 90-градусных
      поворотов. Здесь скандинавский щелчок — это тактический микро-маневр для скоростного
      лавирования в прямом потоке шоссе, позволяющий втиснуть кузов в диагональные
      просветы между машинами.
    pseudocode: "if (vehiclePhysics.isFlickGestureDetected(input.steerHistory, 0.28))\
      \ {\n  vehiclePhysics.initiateWeightTransferSlide(28.0);\n  vfxSystem.startTireSmokeParticles(player.rearWheels);\n\
      \  audioSystem.startTireScreechSound();\n  cameraSystem.setRollAngle(input.steerDirection\
      \ * 4.5);\n}\nif (vehiclePhysics.inDriftSlide) {\n  const currentSlip = vehiclePhysics.getSlipAngle();\n\
      \  vehiclePhysics.clampVelocityLoss(0.92);\n  comboSystem.addDriftScore(currentSlip\
      \ * dt * 150);\n  if (Math.abs(currentSlip) < 5.0 || input.nitroHold) {\n  \
      \  vehiclePhysics.endDriftSlide();\n    audioSystem.stopTireScreechSound();\n\
      \    cameraSystem.setRollAngle(0);\n    vfxSystem.emitGripCatchSparks(player.position);\n\
      \  }\n}"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 80
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - name: Core Layer
    responsibility: Game Loop, State Machine, EventBus, Asset Loader, Playgama Bridge
      SDK Adapter
  - name: Physics & Simulation Layer
    responsibility: Rapier 3D World, Raycast Vehicle Controller, Traffic Spawner,
      Collision Matrix
  - name: Rendering Layer
    responsibility: Three.js Scene Graph, Highway Module Instancing, Custom Shaders
      (Wet Road, Neon Bloom), Post-processing
  - name: Audio Layer
    responsibility: Howler.js sound pools, Dynamic Engine RPM Synthesizer, Web Audio
      Filter for Nitro Whoosh, Synthwave Music Track
  - name: UI & Input Layer
    responsibility: DOM/Canvas Overlay HUD, Touch Drag Controller, Responsive Safe-Area
      Manager, Leaderboards & Garage UI
  modules:
  - description: Raycast-физика колес, подвеска, шинное трение и расчет кренов
    name: VehicleController
    path: src/simulation/VehicleController.ts
  - description: Пул и процедурный спавн разнотипного трафика с безопасными коридорами
    name: TrafficManager
    path: src/simulation/TrafficManager.ts
  - description: Бесшовное перемещение модулей трассы (инстансинг асфальта, отбойников,
      фонарей)
    name: HighwayStreamer
    path: src/rendering/HighwayStreamer.ts
  - description: Детектор Near Miss, расчет комбо-множителя и управление закисью азота
    name: AdrenalineSystem
    path: src/gameplay/AdrenalineSystem.ts
  - description: Позиционный звук, синтез оборотов двигателя и эффекты нитро-звучания
    name: AudioManager
    path: src/audio/AudioManager.ts
monetization:
  strategy_summary: 'Честная гибридная модель WebGL-игр: Rewarded Video для удвоения
    наград и мгновенного продолжения заезда (Revive), ненавязчивые Interstitial с
    кулдауном 90 секунд между заездами, и опциональные IAP для мгновенной покупки
    топовых кастомных спорткаров и уникального неонового стайлинга.'
  rewarded_placements:
  - id: revive
    name: Второй Шанс (Revive)
    benefit: Мгновенное восстановление спорткара после фатальной аварии с сохранением
      времени таймера и 3-секундной неуязвимостью
    cooldown_or_limit: 1 раз за спринт
    trigger_moment: Экран критической аварии при наличии запаса времени таймера
  - id: double_reward
    name: Двойной Куш за Заезд
    benefit: Удвоение всех заработанных кредитов и очков репутации за завершенный
      спринт
    cooldown_or_limit: Без ограничений
    trigger_moment: Экран успешного финиша заезда
  - id: test_drive
    name: Тест-Драйв Суперкара
    benefit: Бесплатный заезд на заблокированном спорткаре S-класса на любой открытой
      трассе
    cooldown_or_limit: 1 раз в 15 минут
    trigger_moment: Экран выбора машины в гараже
  interstitial_placements:
  - trigger_event: Возврат в главное меню после завершения или проигрыша заезда
    cooldown_seconds: 90
    conditions: Не показывается, если игрок только что посмотрел Rewarded Video; не
      показывается в течение первых 2 минут первой сессии
  in_app_purchases:
  - sku: pack_starter_tuner
    name: Набор Стритрейсера
    description: 50,000 кредитов + эксклюзивный хамелеон-окрас 'Midnight Purple' +
      постоянный неоновый неон 'Ice Cyan'
    price_tier: Tier 1 ($0.99 / 99 Янов)
    reward: 50000 credits + exclusive skin + neon kit
  - sku: car_gtr_monster
    name: Суперкар 'Apex GT-R 35'
    description: Мгновенная разблокировка топового полноприводного спорткара S-класса
      с максимальным тюнингом турбины
    price_tier: Tier 3 ($2.99 / 299 Янов)
    reward: Unlocked Tier-S vehicle with stage 3 upgrades
  - sku: no_ads_pass
    name: VIP Пропуск (Отключение рекламы)
    description: Полное отключение межстраничной рекламы + удвоенный пассивный доход
      кредитов навсегда
    price_tier: Tier 2 ($1.99 / 199 Янов)
    reward: Permanent Ad-Free status + 2x credit booster
  fairness_rules:
  - Все трассы и все 6 автомобилей можно открыть и максимально прокачать исключительно
    игровым путем без доната за счет мастерства тайм-атаки.
  - 'Внутри самого заезда отсутствуют любые пейволлы: результат в таблице лидеров
    зависит только от чистоты вождения и Near Miss комбо.'
  - Полный запрет на показ межстраничной рекламы во время активного геймплея и в первые
    120 секунд после старта игры.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - gamepix
  - crazygames
  - telegram
  - android_webview
  initialization_flow:
  - 1. Запуск bridge.init() на старте загрузки HTML-страницы
  - 2. Проверка состояния аудио-контекста и инициализация Web Audio
  - 3. bridge.player.isAuthorized() -> фоновая подгрузка прогресса из Cloud Storage
  - 4. bridge.platform.sendMessage('game_ready') после полной загрузки 3D-ассетов
    Three.js
  - 5. bridge.advertisement.checkBannerSupport() для адаптации высоты HUD под баннеры
  cloud_save_keys:
  - player_credits
  - player_reputation
  - unlocked_cars_bitmask
  - car_upgrades_json
  - track_records_best_times_json
  - selected_car_id
  - sound_and_control_settings
  leaderboards:
  - night_sprint_global_time_attack
  - night_sprint_track_01_highway
  - night_sprint_track_02_tunnel
  - night_sprint_weekly_adrenaline_score
  ads_integration:
    banner: bridge.advertisement.showBanner() on bottom of screen with safe area offset
    interstitial: bridge.advertisement.showInterstitial() with 90s cooldown check
    rewarded: bridge.advertisement.showRewarded() with automatic audio mute and physics
      pause
  lifecycle_hooks:
  - 'bridge.on(''visibility_change'', (visible) => visible ? resumeGameAudioPhysics()
    : pauseGameAudioPhysics())'
  - bridge.on('rewarded_reward', () => grantReviveOrCredits())
  - bridge.on('interstitial_closed', () => resumeMusicAndMenu())
