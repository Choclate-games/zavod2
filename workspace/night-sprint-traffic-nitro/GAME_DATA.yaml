definition_of_done:
- Физический контроллер Raycast Vehicle на базе Rapier 3D полностью настроен и обеспечивает
  плавное руление с инерцией и кренами
- Пул трафика из 24 машин (седаны, такси, фуры) процедурно спавнится с гарантией проходимых
  коридоров
- Механика Near Miss безошибочно определяет опасные сближения ближе 1.2м и моментально
  заряжает шкалу нитро
- Эффект взрывного нитро-форсажа реализован с динамическим сужением FOV, радиальным
  блюром и пламенем из глушителей
- Все 12 спринт-трасс протестированы, чекпоинты добавляют время, финиш фиксирует рекорд
  в таблице лидеров
- 3D-гараж позволяет покупать и прокачивать 6 спорткаров с мгновенным обновлением
  визуала и характеристик
- Playgama Bridge SDK полностью интегрирован (авторизация, сохранение в облако, баннеры,
  Interstitial и Rewarded Ads)
- Стабильные 60 FPS подтверждены на мобильных и десктопных браузерах, вес бандла не
  превышает 4.5 МБ
