raw_prompt: На съёмочной площадке стрелок стреляет по противникам и разрушает декорации
  точными попаданиями. Сделай шутер от первого лица на Three.js с прицеливанием мышью
  или пальцем и отдельной кнопкой огня. Хедшот мгновенно пополняет магазин, а промах
  уменьшает его вместимость до конца раунда. Отдача должна быть ощутимой, а оставшиеся
  патроны заметны без загромождения экрана.
title: 'Один дубль: Разбор сцены'
slug: posledniy_dubl
genre: Шутер от первого лица
subgenre: Постановочный физический FPS с разрушаемыми декорациями
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge / Yandex Games / веб-браузер / мобильные устройства
orientation: landscape
target_audience: Игроки 13–35 лет, которым нравятся короткие точные FPS-сессии, выразительные
  разрушения и понятные испытания на реакцию и пространственное мышление.
core_loop: Игрок за 90–120 секунд проходит четыре связанные павильонные точки, сам
  выбирает, по саботажнику или опоре стрелять первым, разрушает декорации для открытия
  маршрута, поддерживает магазин хедшотами и старается завершить дубль с патронами.
hook: Одна пуля одновременно убивает саботажника, возвращает магазин и обрушает фасад,
  открывая следующий кадр сцены.
player_fantasy: Быть стрелком-постановщиком, который не просто поражает цели, а монтажирует
  пространство каждым точным выстрелом.
session_model: 'Одиночный контракт-дубль длительностью 90–120 секунд: четыре павильонные
  точки, три связанных перехода, шесть саботажников и один финальный результат. После
  провала доступен мгновенный перезапуск.'
unique_value_proposition: 'Это FPS, где точность стрельбы перестраивает сцену: игрок
  ломает опоры, лишает врагов укрытий, запускает физические цепные реакции и сам создаёт
  безопасный маршрут через павильон.'
vision: 'Каждый дубль должен ощущаться короткой сценой практических спецэффектов:
  игрок видит проблему, принимает рискованный монтажный выбор, нажимает ЛКМ и в тот
  же момент получает новый обзор, укрытие или проход.'
elevator_pitch: 'В «Один дубль: Разбор сцены» игрок проходит съёмочный павильон от
  первого лица и останавливает шестерых саботажников. Хедшот возвращает весь текущий
  магазин, промах навсегда уменьшает его предел, а точные попадания в декорации меняют
  маршрут и линии обзора прямо во время перестрелки.'
win_conditions: За 90–120 секунд пройти четыре павильонные точки и три перехода, обезвредить
  6 саботажников, добраться до финальной отметки режиссёра и закончить дубль минимум
  с 1 патроном в текущем магазине.
lose_conditions: Дубль провален, если текущий магазин опустел до 0 патронов, если
  саботажник активировал 3 пиротехнических заряда или если игрок получил 3 попадания.
  Провал сопровождается отдельным звуковым сигналом причины и немедленно открывает
  перезапуск.
progression_summary: 'Внутри дубля открываются новые линии обзора и переходы после
  разрушения декораций, а давление растёт за счёт более коротких предупреждений и
  перекрывающихся входов саботажников. Между дублями нет постоянных боевых улучшений:
  сохраняются только рекорды времени, точности и косметические материалы съёмочной
  группы.'
difficulty_curve: Первые 30 секунд дают одиночную цель и очевидную опору. К 60-й секунде
  игроку приходится выбирать между быстрым хедшотом и разрушением укрытия. Последние
  30–40 секунд совмещают два входа саботажников, падающий прожектор и ограниченное
  окно для безопасного перехода.
scores:
