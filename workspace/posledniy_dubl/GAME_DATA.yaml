  safe_area_handling: Кнопка огня и счётчик магазина смещаются с учётом safe-area-inset,
    минимальный размер интерактивной зоны 56 CSS-пикселей, HUD не перекрывает системные
    жестовые области.
  performance_throttling:
  - Ограничить активные физические тела декораций до 18.
  - Использовать запечённое освещение для дальних фасадов и один динамический прожектор
    на кадр.
  - Снижать разрешение теней и количество частиц при стабильной частоте ниже 50 кадров
    в секунду.
  - Отключать дальние коллайдеры после завершения павильонной точки.
  - Сохранять трассировку попаданий и отдачу независимыми от частоты кадров.
  - 'Целевой бюджет мобильной сцены: 45–60 кадров в секунду.'
audio:
  music: Короткий пульсирующий трек с нарастающим слоем перкуссии к каждому переходу
    и резким снятием напряжения после результата.
  weapon: Один сухой выстрел с низким импульсом, отдельные варианты для попадания
