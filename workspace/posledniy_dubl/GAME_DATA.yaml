definition_of_done:
- Игрок видит себя от первого лица и свободно ходит по павильону.
- На ПК работают WASD, мышь, ПКМ и отдельная ЛКМ; на телефоне работают свайп ходьбы,
  свободное прицеливание и отдельная кнопка огня.
- Хедшот мгновенно заполняет магазин до текущего предела.
- Каждый промах уменьшает предел магазина до конца текущего дубля.
- Отдача одновременно ощущается камерой, звуком, вспышкой и вибрацией при её поддержке.
- Счётчик текущих патронов и предела виден одним компактным элементом.
- Ключевые декорации меняют обзор, укрытие или путь после точного попадания.
- Полный дубль содержит 4 павильонные точки, 3 перехода, 6 саботажников и длится 90–120
  секунд.
- Победа и три причины провала имеют ясную обратную связь.
- Мгновенный повтор не создаёт постоянной боевой прокачки.
- Павильоны читаются как конкретный театральный реквизит, а не как набор серых кубов.
- Сборка проходит мобильный и кроссбраузерный тест производительности.
- Интеграция Playgama не прерывает активный дубль рекламой и сохраняет рекорды.
- 'Игра осталась тем, что просили: вид от первого лица — игрок смотрит своими глазами,
  а не с вертолёта, вышки или орбиты.'
- 'Игра осталась тем, что просили: игрок сам ходит по уровню на своих двоих.'
- 'Игра осталась тем, что просили: стрельба как главное действие игрока.'
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Игрок за 90–120 секунд проходит четыре связанные павильонные
  точки, сам выбирает, по саботажнику или опоре стрелять первым, разрушает декорации
  для открытия маршрута, поддерживает магазин хедшотами и старается завершить дубль
  с патронами..'
- 'Реализованы механики проекта: Выстрел-монтаж, Ёмкость дубля, Цепная декорация,
  Световой блокинг.'
- Условие успеха (За 90–120 секунд пройти четыре павильонные точки и три перехода,
  обезвредить 6 саботажников, добраться до финальной отметки режиссёра и закончить
  дубль минимум с 1 патроном в текущем магазине.) и условие проигрыша (Дубль провален,
  если текущий магазин опустел до 0 патронов, если саботажник активировал 3 пиротехнических
  заряда или если игрок получил 3 попадания. Провал сопровождается отдельным звуковым
  сигналом причины и немедленно открывает перезапуск.) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Один дубль: Разбор сцены».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Повтор дубля); interstitial соблюдает
  паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
