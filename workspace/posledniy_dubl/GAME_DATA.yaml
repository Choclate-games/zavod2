    name: 'Один дубль: Разбор сцены'
    pitch: Игрок пешком проходит павильон одним дублем и точными выстрелами перестраивает
      декорации, открывая путь к саботажникам.
    core_verb: перестраивать
    genre_family: Тактический FPS с физическим разрушением
    session_shape: Одиночный маршрут-контракт на 90–120 секунд с тремя связанными
      переходами между павильонами и мгновенным перезапуском после провала.
    camera: Камера строго от первого лица на уровне глаз, с кинематографическим узким
      полем зрения; удержание прицела даёт короткий оптический зум, выстрел заметно
      сбивает горизонт.
    control_scheme: На ПК игрок ходит клавишами WASD, целится мышью и стреляет отдельной
