    name: Свет, камера, попадание
    pitch: Игрок пешком ведёт прямой эфир и синхронными выстрелами рушит реквизит
      в такт, удерживая сцену под контролем и уничтожая сценических дронов.
    core_verb: синхронизировать
    genre_family: Ритмический FPS-шутер с каскадным разрушением
    session_shape: Непрерывное выступление-скоринг на 75 секунд из трёх музыкальных
      актов; после окончания игрок получает оценку точности, темпа и сохранённых декораций.
    camera: 'Широкоугольная камера от первого лица в шлеме каскадёра: больше периферийного
      обзора, лёгкое пульсирование экспозиции в такт музыке и короткий рывок изображения
      при попадании.'
    control_scheme: На ПК игрок ходит клавишами WASD, целится мышью и стреляет отдельной
      кнопкой ЛКМ. На телефоне левая половина экрана принимает свайп для ходьбы, свободное
      перетаскивание пальца ведёт прицел, отдельная кнопка «ОГОНЬ» запускает выстрел.
    world: 'Яркий павильон прямого эфира: цветные прожекторы, вращающиеся платформы,
      картонные космические декорации и сценические дроны, которые пытаются сорвать
      трансляцию.'
    spectacle: В первом кадре камера смотрит из-за плеча стилизованной декорации на
      летающий дрон; три прожектора вспыхивают одновременно, выстрел попадает в центральный
      шарнир, и вся космическая ракета складывается в каскад реквизита.
    why_not_generic: 'Связка «синхронизация с тактом музыки» + «физические цепные
      реакции» + «активная рэгдолл-физика в бою» делает выстрелы постановкой трюка:
      попадание в правильный момент запускает каскад декораций и эффектное падение
      врага. Игрок не просто набирает комбо, а дирижирует разрушением живого эфира.'
    biggest_risk: Ритм может перетянуть внимание на тайминг и сделать точное прицеливание
      вторичным, а промахи начнут ощущаться как ошибки музыканта, а не стрелка.
    production_cost: 'Средний: нужны синхронный таймер, набор физических каскадов
      и стилизованные дроны; содержание короткого выступления ограничено одной сценой
      и небольшим числом актов.'
    knowledge_hints:
    - threejs/fps_controller_and_shooting.md
    - threejs/juice_and_vfx_pool.md
    - mechanics/rhythm_sync.md
    - mechanics/chain_reaction.md
    - mechanics/ragdoll.md
    - mechanics/physics_destruction.md
    - audio/procedural_sound_synthesizer.md
    - ux/touch_controls.md
  selected_id: A-01
  selected_name: 'Один дубль: Разбор сцены'
  selection_reason: 'Это самое сильное соединение заказа и темы: стрельба остаётся
    главным действием, но каждый точный выстрел одновременно меняет сцену, укрытия
    и маршрут. Короткий связанный дубль даёт браузеру ясную цель и быстрый повтор,
    а на телефоне экран можно оставить почти свободным для пальца, сохранив отдельную
    кнопку огня, заметную отдачу и компактный счётчик магазина. В отличие от расследования
    и ритмического выступления, точность не обслуживает другую систему, а сама является
    способом монтировать пространство.'
  rejected_reasons:
  - 'A-02 отвергнут не из-за управления или платформы: его расследовательский цикл
    рискует сделать стрельбу последним подтверждением уже найденного ответа, а не
    главным способом играть.'
  - 'A-03 отвергнут не из-за сложности реализации: ритм может подчинить прицеливание
    музыкальному таймингу, из-за чего разрушение декораций будет восприниматься как
    фон для скоринг-комбо, а не как тактический выбор.'
  - 'A-01 лучше сохраняет обещание пользователя целиком: ходьба, FPS-прицеливание,
    отдельный огонь, мгновенный хедшотный возврат магазина, наказание за промах и
    разрушение декораций работают в одной причинно-следственной петле.'
  what_it_is_not:
  - 'Не арена с волнами врагов: игрок проходит связанный маршрут с постановочными
    входами и выходами, а не переживает бесконечные атаки.'
  - 'Не шутер, где декорации служат неподвижным фоном: разрушение каждого ключевого
    объекта обязано менять укрытие, обзор или доступный путь.'
  - Не окно выбора из трёх карт апгрейда между этапами.
  - Не универсальная связка «дэш + парирование + удар» и не игра про ближний бой.
  - 'Не автоматическая стрельба и не автоатака: игрок сам наводит прицел и нажимает
    отдельную кнопку огня.'
  - Не раскладка с нарисованным джойстиком слева и россыпью кнопок атаки справа.
  - 'Не серые кубы вместо стилизованной геометрии: каждый павильонный объект должен
    читаться как конкретный реквизит.'
  - Не мета-прогрессия «золото за забег — постоянные апгрейды», не связанная с киносъёмкой.
  - Не снайперский контракт на заснеженном перевале, не рейд на крыше поезда и не
    короткая дуэль 1v1.
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - Вид от первого лица, свободная ходьба по павильону, прицеливание мышью или пальцем
    и отдельная кнопка огня.
  - Хедшот мгновенно возвращает магазин к текущей вместимости, а любой промах уменьшает
    максимальную вместимость до конца дубля.
  - Отдача должна быть ощутимой через рывок камеры, звук и визуальный импульс, а оставшиеся
    патроны должны быть видны одним компактным элементом HUD.
  - Ключевые декорации разрушаются точными попаданиями и реально меняют линии обзора,
    укрытия или маршрут.
  - 'Каждый дубль должен начинаться с осмысленной цели в первую секунду и завершаться
    одним ясным результатом: пройти сцену, сохранить магазин и остановить саботажников.'
  signature_scene: 'Фотография из глаз стрелка внутри ярко освещённого павильона:
    внизу видны руки и оружие, на переднем плане красная опорная балка расписного
    фасада, за ней в прорези декорации заметен саботажник. Холодный синий свет прожектора
    режет дым справа, тёплое контровое пламя подсвечивает края декораций слева; прямо
    сейчас пуля попадает в балку, фасад раскалывается, прожектор падает, а за открывшимся
    проходом виден второй враг.'
  avoid_references:
  - '«Лавинный снайпер: Эхо Каньона» — не повторять снежный снайперский контракт и
    роль дальнего наблюдателя.'
  - '«Громовой Перехват: Штормовой Экспресс» — не повторять штурм крыши поезда и непрерывный
    скоростной рейд.'
  - '«Ван-Тап: Дуэли на Крыше» — не повторять формат коротких дуэлей 1v1.'
  - Vampire Survivors и Brotato — не использовать как основу автошутера с ордами и
    пассивной атакой.
