mobile:
  orientation: landscape
  touch_implementation: 'Pointer Events с разделением жестов: левая половина экрана
    отвечает за направление движения, свободное перетаскивание ведёт прицел, отдельная
    кнопка «ОГОНЬ» вызывает одиночный выстрел, удержание второго пальца включает краткое
