  overall_score: 8.4
  justification: 'Самые сильные стороны проекта — мгновенно понятная стрельба, заметная
    отдача и редкая для FPS связка точного попадания с перестройкой декораций. Оригинальность
    держится на превращении павильона в монтажируемый маршрут, а не на количестве
    оружия или противников. Повторяемость обеспечивают разные безопасные порядки разрушений
    и таблицы времени, но отсутствие постоянной прогрессии ограничивает долгосрочную
    мотивацию. Слабее остальных мобильная эргономика: одновременная ходьба, свободное
    прицеливание и отдельный огонь требуют точной настройки чувствительности. Производственная
    стоимость средняя из-за физики выборочных разрушений и камеры, но контролируема
    при ограничении числа активных объектов.'
references:
- name: Тир практической стрельбы
  genre: Спортивная стрельба
  mechanics:
  - свободное наведение на конкретную цель
  - отдельное осознанное нажатие для каждого выстрела
  - ограниченный боезапас
  - мгновенная визуальная и звуковая обратная связь
  lessons: 'Сделать каждый выстрел отдельным решением: прицел должен быстро находить
    цель, отдача — ощущаться, а попадание и промах — ясно различаться без перегруженного
    интерфейса. Ограниченная вместимость магазина должна создавать напряжение уже
    перед нажатием на огонь.'
  what_to_avoid: Статичного тира с одинаковыми мишенями и повторяющимся упражнением.
    Не превращать игру в реалистичный симулятор оружия с долгим обслуживанием, сложной
    перезарядкой и ожиданием между выстрелами.
- name: Теардаун
  genre: Физический шутер с разрушаемой средой
  mechanics:
  - разрушение стен и опор выстрелами и другими воздействиями
  - изменение маршрута после разрушения
  - использование физической цепной реакции
  - планирование последовательности действий в пространстве
  lessons: 'Разрушение должно быть не украшением, а способом принимать решения: игрок
    заранее видит ослабленную опору, выбирает порядок попаданий и получает новый обзор,
    проход или укрытие. Последствия должны быть быстрыми, зрелищными и понятными.'
  what_to_avoid: Открытой песочницы с хаотичным разрушением всего подряд и универсальными
    взрывчатками. Не добавлять свободный грабительский сценарий, бесконечные испытания
    или разрушения, которые не влияют на маршрут, укрытие и цель дубля.
- name: Суперхот
  genre: Тактический шутер с поштучными действиями
  mechanics:
  - каждое нажатие на огонь имеет самостоятельное значение
  - выбор порядка поражения целей
  - композиция пространства через последовательность точных действий
  - использование окружения вместо непрерывной стрельбы
  lessons: 'Подчеркнуть паузу перед каждым выстрелом и дать игроку ощущение постановщика:
    сначала решить, что изменить в кадре, затем выполнить точное действие. Небольшое
    число врагов и ясные силуэты помогут читать цепочку «попадание — разрушение —
    новый кадр».'
  what_to_avoid: Замедление или остановку времени как главную механику, абстрактные
    красно-белые арены и одноразовые дуэли. Не копировать волны врагов, автоматизацию
    стрельбы или победу только за счёт скорости реакции.
mechanics:
- name: Выстрел-монтаж
  category: бой и навигация
  priority: ядро
  description: 'Каждое попадание выбирает, как изменится следующий кадр: поражение
    саботажника сохраняет темп, а попадание в опорную декорацию убирает укрытие, открывает
    обзор или создаёт проход.'
  player_interaction: Мышь или палец двигают прицел; левая кнопка мыши, клавиша пробела
    или отдельная экранная кнопка огня выполняют выстрел; движение не вызывает автоматическую
    стрельбу.
  feedback: 'Визуал и эффекты: тонкий трассер длительностью 0.04 с, белая вспышка
    попадания, красная искра хедшота и разный рисунок трещин на опоре.; Звук: через
    Web Audio создаются короткий выстрел, металлический щелчок промаха, глухой удар
    по фасаду и высокий подтверждающий тон хедшота.; Камера: импульс 4 градуса по
    вертикали и 1.5 градуса по горизонтали, затем возврат за 0.20 с; разрушение даёт
    отдельный микрозум 1.04x на 0.16 с.; UI и тактильность: прицел кратко меняет форму
    для головы, корпуса и опоры; на поддерживаемом телефоне хедшот даёт вибрацию 35
    мс, опора 55 мс, промах не вибрирует.'
  technical_complexity: высокая
  strengths:
  - Связывает стрельбу с пространственным решением.
  - Каждое попадание даёт понятный визуальный результат.
  - Позволяет проходить одну сцену разными порядками разрушений.
  weaknesses:
  - Нужно исключить случайное разрушение критически важного объекта.
  - Линии обзора должны быть читаемыми на маленьком экране.
- name: Ёмкость дубля
  category: ресурс риска
  priority: ядро
  description: 'Игрок решает, стоит ли стрелять по безопасной опоре или ждать гарантированного
    хедшота: промах уменьшает максимальную вместимость магазина до конца дубля, а
    хедшот мгновенно заполняет текущую вместимость.'
  player_interaction: Игрок стреляет отдельной кнопкой; на клавиатуре клавиша R не
    перезаряжает оружие, а не используется вовсе, чтобы не создавать безопасную паузу;
    на сенсорном экране патроны показываются рядом с кнопкой огня.
  feedback: 'Визуал и эффекты: патроны представлены шестью крупными световыми насечками
    на нижней рамке прицела; с уменьшением вместимости край рамки физически сжимается.;
    Звук: каждый оставшийся патрон имеет отдельный низкий щелчок при списании, возврат
    магазина даёт восходящий аккорд из трёх тонов через Web Audio, пустой магазин
    звучит как сухой металлический удар.; Камера: при одном оставшемся патроне добавляется
    едва заметное сужение поля зрения до 0.98x, а при хедшоте возврат сопровождается
    импульсом масштаба 1.03x.; UI и тактильность: текущие патроны показываются числом
    и насечками без панели; при одном патроне экранный контрол огня пульсирует раз
    в 0.8 с, а промах даёт вибрацию 20 мс с паузой 35 мс.'
  technical_complexity: средняя
  strengths:
  - Делает каждый выстрел значимым.
  - Поддерживает риск между точностью и скоростью.
  - Не требует перегруженного экрана перезарядкой.
  weaknesses:
  - Слишком суровый штраф может заставить новичка бояться стрелять.
  - Нужна ясная индикация текущего патрона и максимальной вместимости.
- name: Цепная декорация
  category: физическое окружение
  priority: ядро
  description: Некоторые расписные фасады, тросы, прожекторы и гидравлические стены
    соединены в короткие физические цепи. Игрок выбирает, какую опору нарушить первой,
    чтобы получить нужный эффект и не закрыть себе маршрут.
  player_interaction: Прицеливание мышью или пальцем выбирает видимые узлы; отдельная
    кнопка огня запускает физическую реакцию; движение вперёд, назад и в стороны выполняется
    клавишами WASD или виртуальным стиком.
  feedback: 'Визуал и эффекты: трещины бегут по звену за 0.18 с, пыль заполняет объём
    падения, а итоговая геометрия остаётся в сцене как физически убедимое укрытие
    или препятствие.; Звук: натяжение троса повышает тон на 120 Гц за 0.35 с, разрушение
    даёт низкочастотный удар, столкновение с полом и скрип гидравлики создаются слоями
    Web Audio.; Камера: при безопасном падении камера получает толчок 0.06 м и зум
    1.06x на 0.18 с; при опасном падении горизонтальный импульс направляет взгляд
    к закрытому проходу.; UI и тактильность: ослабленная опора имеет тонкий контур,
    направление падения показывается двумя короткими штрихами, а удар декорации передаётся
    вибрацией 70 мс без постоянных маркеров.'
  technical_complexity: высокая
  strengths:
  - Превращает павильон в активную часть боя.
  - Создаёт запоминающиеся каскадные моменты.
  - Делает маршрут зависимым от точности, а не от заранее заданного коридора.
  weaknesses:
  - Физические цепи должны иметь предсказуемый результат.
  - Количество активных динамических тел нужно ограничить ради мобильной производительности.
- name: Световой блокинг
  category: наблюдение и позиционирование
  priority: поддержка
  description: Павильон использует режиссёрские световые метки и звуки механизмов
    как телеграф входов. Игрок решает, ждать ли короткую подсказку для точного хедшота
    или заранее разрушить прожектор и получить более широкий, но менее безопасный
    обзор.
  player_interaction: Игрок поворачивает взгляд мышью или пальцем, движется WASD или
    виртуальным стиком и стреляет отдельной кнопкой; отдельной кнопки включения света
    нет, потому что блокинг меняется только через попадание в декорацию.
  feedback: 'Визуал и эффекты: направленный конус света, пыль в луче, краткий силуэт
    головы и световая метка на полу; после разрушения прожектора сцена получает более
    широкий, но менее контрастный заполняющий свет.; Звук: вращение механизма панорамирует
    звук слева направо, предупреждение повышает частоту с 420 до 620 Гц, а активация
    заряда использует отдельный трёхимпульсный сигнал Web Audio.; Камера: взгляд слегка
    притягивается к активной световой метке на 0.08 с, без автоповорота; падение прожектора
    даёт наклон 2 градуса и зум 1.05x на 0.12 с.; UI и тактильность: прицел получает
    тонкий сектор направления входа, оставшееся окно обозначается не таймером, а сжимающейся
    световой дугой; поздний сигнал даёт вибрацию 25 мс, активация заряда 90 мс.'
  technical_complexity: средняя
  strengths:
  - Привносит в FPS язык киносъёмки и сценического блокинга.
  - Помогает игроку читать пространство до появления угрозы.
  - Связывает выбор позиции с разрушением света.
  weaknesses:
  - Сигналы нельзя делать слишком незаметными на мобильном экране.
  - Телеграф не должен превращаться в отдельную ритмическую игру.
gameplay_systems:
- name: Режиссёр маршрута
  purpose: Управляет четырьмя павильонными точками, тремя переходами и постановочными
    входами врагов без бесконечного потока атак.
  input: Состояние разрушенных объектов, положение игрока и завершение текущего кадра.
  rules:
  - Новая точка открывается только после выполнения текущей сценической цели.
  - В каждом переходе есть один обязательный объект, меняющий линию обзора или путь.
  - Следующий вход саботажника запускается только после завершения предыдущего монтажного
    события.
  state:
  - павильон 1
  - переход 1
  - павильон 2
  - переход 2
  - павильон 3
  - переход 3
  - финальная отметка
  - провал
  - победа
  interactions: Проверяет попадания, открытие проходов, обезвреживание шести саботажников
    и достижение финальной отметки.
  feedback: Короткая надпись цели, смена света, движение камеры через открывшийся
    проход и реплика режиссёрского громкоговорителя.
  edge_cases:
  - Если декорация падает между игроком и выходом, маршрут получает альтернативную
    боковую щель.
  - При потере фокуса браузера вход врага и таймер сцены ставятся на паузу.
  - Повторный выстрел в уже разрушенный объект не расходует боеприпас.
- name: Трассировка и попадания
  purpose: Определяет попадание в саботажника, голову, опору или безопасный реквизит.
  input: Луч из центра прицела и нажатие огня.
  rules:
  - Луч проверяет только объекты текущего павильона.
  - Попадание в голову считается хедшотом при пересечении отдельной зоны диаметром
    0,12 метра.
  - Попадание в критическую опору вызывает заранее заданную физическую цепь.
  state:
  - готов к выстрелу
  - выстрел
  - попадание
  - промах
  - отдача
  interactions: Обрабатывает ЛКМ, кнопку «ОГОНЬ», задержку между выстрелами 0,22 секунды
    и переключение чувствительности при приближении.
  feedback: След трассера на 0,08 секунды, вспышка, звук материала, маркер хедшота
    и импульс камеры.
  edge_cases:
  - Пуля не проходит сквозь активную декорацию, если она не отмечена как пробиваемая.
  - При касании границы головы приоритет получает голова, а не корпус.
  - При отсутствии боеприпасов кнопка огня даёт короткий пустой щелчок.
- name: Камера и отдача
  purpose: Передаёт силу выстрела через горизонт, звук и визуальный импульс без потери
    контроля.
  input: Событие выстрела, тип попадания и состояние прицела.
  rules:
  - Обычный выстрел отклоняет камеру на 1,8 градуса.
  - Хедшот добавляет короткую положительную стабилизацию после отдачи.
  - Отклонение возвращается к исходному углу за 0,16 секунды.
  state:
  - нейтральная камера
  - прицеливание
  - отдача
  - восстановление
  interactions: Принимает движение мыши, свободное перетаскивание пальца и удержание
    приближения.
  feedback: Рывок горизонта, низкочастотный удар, вспышка по краю экрана и лёгкая
    вибрация на поддерживаемых телефонах.
  edge_cases:
  - Отдача не должна менять направление движения игрока.
  - При частоте кадров ниже 40 сила импульса сохраняется по времени, а не по числу
    кадров.
  - При выключенной вибрации мобильная версия сохраняет звук и визуальный импульс.
core_design:
  signature_moment: Игрок видит саботажника за расписным фасадом, стреляет в его голову,
    магазин мгновенно возвращается к вместимости, а отложенный импульс от той же пули
    ломает последнюю опору. Фасад падает в объектив, прожектор взрывается искрами,
    за ним открывается следующий павильонный кадр.
  genre_template_rejected: Отвергнут шаблон аренного FPS с волнами врагов, универсальными
    аптечками и обязательной перезарядкой между столкновениями. Он превращает выстрел
    в простое удаление противника, тогда как здесь каждый выстрел должен одновременно
    монтировать пространство, управлять риском магазина и менять маршрут.
  what_makes_it_different: 'Игрок не зачищает арену, а режиссирует непрерывный дубль.
    Саботажник, опора, прожектор и падающая декорация являются частями одного монтажного
    решения: точный хедшот сохраняет темп и магазин, выстрел по декорации открывает
    линию обзора, а промах делает следующий кадр опаснее.'
  micro_loop:
  - step: Считать кадр
    player_action: Игрок удерживает прицел на павильонной точке и читает силуэт саботажника,
      световую метку и ослабленную опору.
    game_response: Саботажник подсвечивает плечо или голову на 0.25 с, опора вибрирует
      с частотой 3 Гц, а механизм входа даёт направленный звук.
    decision: Стрелять по саботажнику ради сохранения магазина или по опоре ради нового
      обзора и маршрута.
    duration: 0.3-1.2 с
  - step: Поставить прицел
    player_action: Игрок двигает мышь или палец, совмещая перекрестие с головой, узлом
      опоры или тросом.
    game_response: Промежуточная линия прицела становится ярче на расстоянии до 0.08
      м от допустимой зоны.
    decision: Дождаться телеграфа и повысить точность либо выстрелить заранее, пока
      саботажник не сменил укрытие.
    duration: 0.1-0.8 с
  - step: Сделать выстрел
    player_action: Игрок нажимает отдельную кнопку огня мышью, клавишей или большим
      экранным контролом.
    game_response: Луч мгновенно проверяет пересечение с целью до 80 м, отдача сдвигает
      камеру, а патрон списывается.
    decision: После отдачи немедленно вернуть прицел на вторую угрозу или использовать
      открывшийся проход.
    duration: 0.05-0.28 с
  - step: Прочитать последствие
    player_action: Игрок наблюдает падение декорации, исчезновение саботажника или
      изменение светового рисунка.
    game_response: 'За 0.35-1.2 с сцена выдаёт ясную причинную цепочку: попадание,
      разрушение, новый обзор, новый вход.'
    decision: Перейти через открывшийся проём, занять новую линию огня или переждать
      опасное падение.
    duration: 0.4-1.5 с
  - step: Продолжить дубль
    player_action: Игрок перемещается к следующей режиссёрской отметке и снова поднимает
      прицел.
    game_response: Камера плавно возвращается из отдачи за 0.2 с, а ближайшая следующая
      угроза получает направленную подсказку.
    decision: Сохранить темп перехода или остановиться на короткую паузу ради гарантированного
      хедшота.
    duration: 1-5 с
  meso_loop:
  - step: 'Павильон 1: заявить сцену'
    player_action: Игрок поражает одного саботажника или ломает очевидную опору.
    game_response: Открывается первая боковая линия обзора, а следующий переход становится
      видимым.
    decision: Получить безопасный хедшот и полный магазин либо срезать путь разрушением.
    duration: 15-25 с
  - step: 'Переход 1: пройти под декорацией'
    player_action: Игрок пересекает проём после падения фасада.
    game_response: Падающий элемент блокирует старую линию огня, но создаёт укрытие
      шириной 2.4 м.
    decision: Пройти быстро до закрытия проёма или задержаться ради выстрела по следующей
      опоре.
    duration: 5-8 с
  - step: 'Павильон 2: выбрать порядок'
    player_action: Игрок видит саботажника за тросовой стеной и два связанных узла.
    game_response: Первый разрушенный узел либо поднимает обзор, либо обрушивает расписную
      стену на безопасный маршрут.
    decision: Сначала убрать угрозу и сохранить ресурс либо изменить геометрию кадра.
    duration: 18-28 с
  - step: 'Переход 2: сменить объектив'
    player_action: Игрок проходит через технический коридор после цепного падения.
    game_response: В течение 1.8 с коридор безопасен, затем включается встречный свет
      и появляется новый вход.
    decision: Использовать окно для быстрого перехода или занять угол для точного
      выстрела.
    duration: 6-10 с
  - step: 'Павильон 3: сломать укрытие'
    player_action: Игрок разрушает прожектор или гидравлическую стену, скрывающую
      двух последовательных входящих саботажников.
    game_response: Световой блокинг расширяет видимость, но убирает прежнюю тень и
      делает игрока открытым.
    decision: Снять первого хедшотом ради возврата магазина или принять риск открытого
      кадра ради второго.
    duration: 20-30 с
  - step: 'Переход 3: пройти сквозь падение'
    player_action: Игрок двигается между падающим прожектором и закрывающейся гидравлической
      стеной.
    game_response: Два входа саботажников перекрываются с разницей 0.7 с, а безопасная
      отметка подсвечивается только на 0.9 с.
    decision: Повернуть к ближайшему хедшоту, выстрелить в блокирующую деталь или
      рискнуть прямым переходом.
    duration: 7-12 с
  - step: 'Павильон 4: собрать финальный кадр'
    player_action: Игрок обезвреживает последних двух саботажников и достигает финальной
      отметки режиссёра.
    game_response: Все оставшиеся цепи останавливаются, камера фиксирует финальный
      пролёт, а результат считает время, точность и патроны.
    decision: Закончить дубль при 1 патроне или сделать дополнительный красивый разрушительный
      выстрел без права на ошибку.
    duration: 18-25 с
  macro_loop:
  - step: Подготовить дубль
    player_action: Игрок выбирает контракт и видит четыре павильонные точки, шесть
      саботажников и стартовую вместимость магазина.
    game_response: Площадка загружается с фиксированными связями декораций, чтобы
      порядок решений оставался честным.
    decision: Играть на безопасный результат, время или зрелищный монтаж разрушений.
    duration: 5-10 с
  - step: Снять один дубль
    player_action: Игрок проходит четыре точки и три перехода, используя каждый выстрел
      как монтажную команду.
    game_response: Сцена меняется без экранов загрузки, а давление растёт к последним
      30-40 с.
    decision: Балансировать время, патроны, входы саботажников и устойчивость маршрута.
    duration: 90-120 с
  - step: Зафиксировать результат
    player_action: Игрок достигает финальной отметки с минимум 1 патроном или проваливает
      дубль.
    game_response: Показываются время, точность, число хедшотов, остаток магазина
      и причина провала при наличии.
    decision: Принять результат или мгновенно начать повторный дубль.
    duration: 4-8 с
  - step: Сравнить постановку
    player_action: Игрок просматривает личные рекорды времени, точности и остатка
      патронов.
    game_response: 'Открываются только косметические материалы съёмочной группы: плёнка,
      цветокоррекция, накладки прицела и маркировка павильона.'
    decision: Повторить маршрут ради мастерства, а не ради постоянного боевого усиления.
    duration: 10-30 с
  loop_diagram: "[Считать свет и силуэт]\n          |\n          v\n[Выбрать: голова\
    \ или опора]\n          |\n          v\n     [Один выстрел]\n       /       \\\
    \n      /         \\\n[Хедшот]     [Монтаж опоры]\n   |              |\n[Магазин]\
    \   [Фасад падает]\n[полон]      [проход открыт]\n      \\         /\n       \\\
    \       /\n     [Новый кадр]\n          |\n          v\n[Переход к следующей отметке]\n\
    \          |\n          v\n[6 саботажников и 4 павильона]\n          |\n     \
    \     v\n[Финальная отметка] -- успех при >= 1 патроне\n          |\n        \
    \  +-- магазин 0 / 3 заряда / 3 попадания -- мгновенный повтор"
  tension_curve: '0-30 с: низкое давление, один саботажник, предупреждение 1.1 с и
    очевидная опора. 30-60 с: среднее давление, две связанные опоры, предупреждение
    0.75 с и первый выбор между хедшотом и маршрутом. 60-90 с: высокое давление, перекрывающиеся
    входы с разницей 0.7 с, предупреждение 0.5 с и падающий прожектор. 90-120 с: пик,
    безопасное окно перехода 0.9 с и финальный выбор между сохранением 1 патрона и
    рискованным зрелищным выстрелом. После финальной отметки напряжение обрывается
    звуковым стоп-кадром.'
  core_formulas:
  - 'Попадание: луч из камеры пересекает коллайдер цели на расстоянии до 80 м; зона
    головы радиусом 0.22 м считается хедшотом, зона корпуса размером 0.45 м на 0.8
    м считается обычным попаданием, отсутствие пересечения считается промахом.'
  - 'Хедшот: саботажник обезврежен за 0.04 с, текущие патроны устанавливаются равными
    текущей вместимости магазина, а цепочка следующего кадра запускается без задержки.'
  - 'Обычное попадание: саботажник получает 1 урон, текущие патроны уменьшаются на
    1, но вместимость магазина не меняется.'
  - 'Промах: текущие патроны уменьшаются на 1, вместимость магазина уменьшается на
    1 до минимума 1 патрон; если текущие патроны достигают 0, дубль немедленно провален.'
  - 'Разрушение опоры: при получении 1 попадания в узел радиусом 0.18 м звено получает
    импульс 7.5 м/с, соседнее звено активируется через 0.35 с, а итоговая геометрия
    выбирается по направлению импульса.'
  - 'Поражение игрока: каждое попадание наносит 1 отметку опасности; при 3 отметках,
    либо после активации саботажником 3 пиротехнических зарядов, дубль провален независимо
    от времени.'
  - 'Счёт точности: точность равна числу попаданий по саботажникам и опорам, делённому
    на число выстрелов; хедшот получает множитель 1.5, промах получает множитель 0.'
  - 'Итоговый рейтинг: 1000 баллов за завершение, плюс 8 баллов за каждую оставшуюся
    секунду до 120 с, плюс 120 баллов за каждый хедшот, минус 180 баллов за каждую
    отметку опасности.'
  run_progression:
  - В начале дубля магазин содержит 6 патронов при вместимости 6 патронов; к 30-й
    секунде игрок получает один безопасный хедшотный сценарий и одну очевидную опору.
  - После павильона 1 разрушение фасада открывает боковую линию обзора длиной 18 м
    и сокращает путь перехода на 4 с.
  - После павильона 2 цепная декорация добавляет выбор между обзором шириной 7 м и
    укрытием шириной 2.4 м, но каждый неверный порядок может закрыть прежний маршрут
    на 3.5 с.
  - В последней трети дубля два входа саботажников перекрываются, прожектор падает
    через 0.65 с после сигнала, а безопасное окно перехода сокращается до 0.9 с.
  meta_progression:
  - 'Боевые параметры между дублями не усиливаются: стартовая вместимость остаётся
    6 патронов, число саботажников остаётся 6, а условие успеха остаётся минимум 1
    патрон.'
  - Сохраняется лучший результат времени с точностью до 0.01 с, лучший процент точности
    и максимальный остаток патронов.
  - 'За повторные постановки открываются косметические материалы съёмочной группы:
    три плёнки цветокоррекции, четыре накладки прицела и пять маркировок павильона.'
  - Косметические материалы не меняют силу выстрела, размеры зон попадания, длительность
    предупреждений или геометрию разрушений.
  mechanics:
  - name: Выстрел-монтаж
    role_in_loop: 'Двигатель боя и навигации, источник главного риска и награды: каждый
      выстрел либо сохраняет темп через хедшот, либо физически переписывает следующий
      кадр через опору.'
    player_decision: 'Перед каждым выстрелом выбрать одну из трёх ценностей кадра:
      убрать саботажника и вернуть магазин, разрушить узел ради обзора или подождать
      телеграфа, чтобы не потерять вместимость промахом.'
    input_mapping: Мышь или палец двигают прицел; левая кнопка мыши, клавиша пробела
      или отдельная экранная кнопка огня выполняют выстрел; движение не вызывает автоматическую
      стрельбу.
    states:
    - 'Кадр готов: оружие стабильно, прицел может быть перемещён, выстрел доступен.'
    - 'Телеграф цели: голова, корпус и узел опоры различимы минимум 0.25 с.'
    - 'Луч выпущен: пересечение луча с целью проверяется за 0.01 с на дистанции до
      80 м.'
    - 'Хедшот: саботажник обезврежен, магазин возвращён к текущей вместимости, следующий
      монтажный кадр активирован.'
    - 'Попадание в опору: декорация переводится в состояние напряжения и запускает
      физическую цепь.'
    - 'Промах: патрон списан, вместимость уменьшается, а саботажник продолжает сценарий
      входа.'
    parameters:
    - name: Дальность луча
      value: 80 м
      tuning_note: При уменьшении ниже 60 м дальние опоры выглядят декоративными и
        игрок вынужден подходить вместо постановки; при увеличении выше 100 м исчезает
        ценность переходов и дальних линий обзора.
    - name: Зона хедшота
      value: радиус 0.22 м
      tuning_note: При радиусе ниже 0.16 м хедшоты ощущаются лотереей на мобильном
        экране; выше 0.28 м точный прицел теряет смысл.
    - name: Перезарядка выстрела
      value: 0.28 с
      tuning_note: Ниже 0.20 с решения сливаются в скорострельность; выше 0.40 с рушится
        ощущение одного непрерывного дубля.
    - name: Сдвиг камеры от отдачи
      value: 4 градуса
      tuning_note: Ниже 2 градусов выстрел кажется бесследным; выше 6 градусов игрок
        чаще проигрывает из-за камеры, а не из-за своего монтажного решения.
    - name: Возврат камеры
      value: 0.20 с
      tuning_note: При возврате быстрее 0.12 с отдача не читается; медленнее 0.30
        с второй точный выстрел ощущается заторможенным.
    feedback_layers:
    - 'Визуал и эффекты: тонкий трассер длительностью 0.04 с, белая вспышка попадания,
      красная искра хедшота и разный рисунок трещин на опоре.'
    - 'Звук: через Web Audio создаются короткий выстрел, металлический щелчок промаха,
      глухой удар по фасаду и высокий подтверждающий тон хедшота.'
    - 'Камера: импульс 4 градуса по вертикали и 1.5 градуса по горизонтали, затем
      возврат за 0.20 с; разрушение даёт отдельный микрозум 1.04x на 0.16 с.'
    - 'UI и тактильность: прицел кратко меняет форму для головы, корпуса и опоры;
      на поддерживаемом телефоне хедшот даёт вибрацию 35 мс, опора 55 мс, промах не
      вибрирует.'
    failure_mode: Игрок ошибается промахом или обычным попаданием, когда рассчитывал
      на хедшот. Причина видна по серому следу луча, отсутствию подтверждающего тона
      и уменьшению числа патронов; при нуле патронов звучит отдельный сухой сигнал
      пустого магазина.
    mastery_curve: На 30-й секунде новичок различает крупную голову и очевидную опору,
      делая один безопасный выбор. На 10-м забеге эксперт стреляет по узлу под углом,
      заранее учитывает отдачу 4 градуса, убирает саботажника вторым выстрелом и превращает
      одну пулю в непрерывный монтажный переход.
    counterplay: Саботажники меняют стойку каждые 1.4 с, выходят из укрытия на 0.5-1.1
      с, а опоры иногда закрывают голову ровно на 0.35 с. После 60-й секунды второй
      вход появляется через 0.7 с после первого, вынуждая выбирать порядок, а не просто
      быстрее нажимать огонь.
    synergies:
    - 'Связывает ёмкость дубля с точностью: хедшот возвращает ресурс, а промах уменьшает
      будущую свободу выбора.'
    - 'Запускает цепную декорацию: выстрел по узлу определяет, какой проход и какой
      силуэт появятся в следующем кадре.'
    - 'Использует световой блокинг: звуковая и световая метка помогает выбрать момент
      хедшота или заранее разрушить прожектор.'
    why_unique: 'В стандартном FPS попадание отвечает только за урон. Здесь попадание
      является монтажной командой: его объект выбирает композицию следующей сцены,
      порядок угроз и доступный запас точных решений.'
    pseudocode: '1. Вход: игрок нажимает отдельную кнопку огня, а перезарядка длится
      не менее 0.28 с.

      2. Проверка: луч из камеры пересекает голову, корпус, узел опоры или ничего
      на дистанции до 80 м.

      3. Если пересечена голова, саботажник обезвреживается за 0.04 с.

      4. При хедшоте текущие патроны становятся равны вместимости магазина.

      5. Иначе при пересечении корпуса списывается 1 патрон и сохраняется текущая
      вместимость.

      6. Иначе при пересечении узла запускается цепная декорация и списывается 1 патрон.

      7. Иначе фиксируется промах, списывается 1 патрон и вместимость уменьшается
      на 1.

      8. Камера получает отдачу 4 градуса, а визуал, Web Audio и UI показывают тип
      результата.'
  - name: Ёмкость дубля
    role_in_loop: 'Ресурс риска и скрытый метроном точности: текущие патроны дают
      возможность действовать, а вместимость определяет, сколько ошибок ещё можно
      пережить.'
    player_decision: Решить, потратить ли текущий патрон на гарантированное изменение
      декорации или сохранить его для хедшота, который полностью вернёт магазин к
      его уже уменьшенной вместимости.
    input_mapping: Игрок стреляет отдельной кнопкой; на клавиатуре клавиша R не перезаряжает
      оружие, а не используется вовсе, чтобы не создавать безопасную паузу; на сенсорном
      экране патроны показываются рядом с кнопкой огня.
    states:
    - 'Полная ёмкость: текущие патроны равны вместимости магазина.'
    - 'Ослабленная ёмкость: после каждого промаха вместимость уменьшена на 1 патрон
      до минимума 1 патрон.'
    - 'Дефицит: текущие патроны меньше вместимости, поэтому игрок ищет хедшот.'
    - 'Возврат магазина: хедшот мгновенно устанавливает текущие патроны равными вместимости.'
    - 'Пустой магазин: текущие патроны равны 0, дубль немедленно провален.'
    parameters:
    - name: Стартовая вместимость
      value: 6 патронов
      tuning_note: При 4 патронах первый павильон становится лотереей; при 8 патронах
        промахи слишком долго не создают давления.
    - name: Минимальная вместимость
      value: 1 патрон
      tuning_note: При минимуме 0 можно случайно лишить игрока возможности завершить
        дубль после одного промаха; выше 1 исчезает драматичный финальный патрон.
    - name: Штраф промаха
      value: минус 1 патрон вместимости
      tuning_note: Штраф в 2 патрона превращает одну ошибку в почти неизбежный провал;
        штраф в 0 убирает напряжение перед каждым выстрелом.
    - name: Стартовые текущие патроны
      value: 6 патронов
      tuning_note: При старте ниже вместимости игрок начинает с ощущением уже совершённой
        ошибки; выше вместимости нарушается логика магазина.
    - name: Минимум для победы
      value: 1 патрон
      tuning_note: Требование 0 патронов обесценивает финальное напряжение, а требование
        2 патронов делает безопасные маршруты чрезмерно обязательными.
    feedback_layers:
    - 'Визуал и эффекты: патроны представлены шестью крупными световыми насечками
      на нижней рамке прицела; с уменьшением вместимости край рамки физически сжимается.'
    - 'Звук: каждый оставшийся патрон имеет отдельный низкий щелчок при списании,
      возврат магазина даёт восходящий аккорд из трёх тонов через Web Audio, пустой
      магазин звучит как сухой металлический удар.'
    - 'Камера: при одном оставшемся патроне добавляется едва заметное сужение поля
      зрения до 0.98x, а при хедшоте возврат сопровождается импульсом масштаба 1.03x.'
    - 'UI и тактильность: текущие патроны показываются числом и насечками без панели;
      при одном патроне экранный контрол огня пульсирует раз в 0.8 с, а промах даёт
      вибрацию 20 мс с паузой 35 мс.'
    failure_mode: Игрок проигрывает, когда текущий магазин достигает 0 патронов, даже
      если саботажники ещё не активировали заряды. На экране остаётся пустая рамка
      магазина, а отдельный низкий сигнал причины отличается от сигнала трёх пиротехнических
      зарядов и сигнала трёх попаданий по игроку.
    mastery_curve: На 30-й секунде новичок старается не промахнуться и понимает, что
      хедшот возвращает ресурс. На 10-м забеге эксперт намеренно принимает один удар
      по корпусу или безопасной опоре, знает точную минимальную ёмкость после промаха
      и входит в финал с гарантированным 1 патроном.
    counterplay: 'Игра не выдаёт свободную перезарядку: единственный возврат происходит
      через хедшот. К 60-й секунде появляются короткие окна головы 0.5 с, а после
      каждого промаха следующий вход ускоряется на 0.15 с, поэтому истощение магазина
      одновременно ускоряет угрозу.'
    synergies:
    - 'Превращает выбор объекта из эстетического решения в риск: опора может открыть
      маршрут, но не вернёт патрон.'
    - 'Награждает чтение светового блокинга: игрок может дождаться более чистого хедшота
      вместо случайного выстрела в темноту.'
    - 'Поддерживает цепную декорацию: осознанный выстрел по узлу допустим только если
      открытый маршрут экономит больше времени, чем стоит патрон.'
    why_unique: 'Это не обычный магазин с перезарядкой и не таймер боеприпасов. Вместимость
      сама становится записью качества текущего дубля: промах физически уменьшает
      будущий потолок, а хедшот возвращает не абстрактные боеприпасы, а возможность
      продолжить монтаж.'
    pseudocode: '1. Вход: перед выстрелом прочитать текущие патроны и вместимость
      магазина.

      2. Проверка: если текущие патроны равны 0, немедленно открыть провал пустого
      магазина.

      3. После любого разрешённого выстрела уменьшить текущие патроны на 1.

      4. Если результатом стал хедшот, установить текущие патроны равными вместимости.

      5. Если результатом стал промах, уменьшить вместимость на 1, но не ниже 1 патрона.

      6. Ограничить текущие патроны новой вместимостью.

      7. Если текущие патроны достигли 0, проиграть сигнал причины и остановить дубль.

      8. Обновить насечки прицела, звук щелчка и короткую тактильную отдачу.'
  - name: Цепная декорация
    role_in_loop: 'Физический режиссёр маршрута и источник пространственных последствий:
      порядок разрушения короткой цепи определяет, что станет укрытием, обзором или
      проходом.'
    player_decision: Выбрать первую опору в цепи из 2-4 звеньев, чтобы направить падение
      фасада, не закрыть финальную отметку и получить нужную линию огня.
    input_mapping: Прицеливание мышью или пальцем выбирает видимые узлы; отдельная
      кнопка огня запускает физическую реакцию; движение вперёд, назад и в стороны
      выполняется клавишами WASD или виртуальным стиком.
    states:
    - 'Стабильная цепь: звенья соединены, но ослабленная опора имеет трещины и цветовую
      метку.'
    - 'Напряжённое звено: в узел попала пуля, сила передаётся соседнему звену.'
    - 'Падение: фасад, трос или прожектор движется по рассчитанной траектории от 0.35
      до 0.65 с.'
    - 'Устоявшаяся декорация: объект завершил падение и стал новым укрытием, мостом
      или стеной.'
    - 'Перекрытый кадр: неверный порядок закрыл линию огня или проход на 3.5 с.'
    - 'Разряженная цепь: все звенья остановились, а следующая точка маршрута активна.'
    parameters:
    - name: Количество звеньев
      value: 2-4 звена
      tuning_note: При одном звене исчезает решение о порядке; больше 4 звеньев перегружает
        короткую сессию и превращает чтение сцены в инженерный расчёт.
    - name: Радиус узла
      value: 0.18 м
      tuning_note: Ниже 0.12 м узел трудно выбрать на телефоне; выше 0.25 м игрок
        случайно ломает соседнюю цепь.
    - name: Импульс разрушения
      value: 7.5 м/с
      tuning_note: Ниже 5 м/с падение выглядит как медленная анимация; выше 10 м/с
        декорация пролетает сквозь читаемую траекторию и создаёт хаотичные столкновения.
    - name: Задержка передачи силы
      value: 0.35 с
      tuning_note: Ниже 0.20 с цепь выглядит мгновенным скриптовым обвалом; выше 0.55
        с игрок теряет причинную связь между первым узлом и итоговым проходом.
    - name: Ширина созданного укрытия
      value: 2.4 м
      tuning_note: Укрытие уже 1.6 м не даёт уверенно переждать вход; шире 3.2 м оно
        слишком безопасно и отменяет цену неверного порядка.
    - name: Время блокировки неверным падением
      value: 3.5 с
      tuning_note: Меньше 2 с ошибка не ощущается; больше 5 с игрок ждёт вместо принятия
        следующего монтажного решения.
    feedback_layers:
    - 'Визуал и эффекты: трещины бегут по звену за 0.18 с, пыль заполняет объём падения,
      а итоговая геометрия остаётся в сцене как физически убедимое укрытие или препятствие.'
    - 'Звук: натяжение троса повышает тон на 120 Гц за 0.35 с, разрушение даёт низкочастотный
      удар, столкновение с полом и скрип гидравлики создаются слоями Web Audio.'
    - 'Камера: при безопасном падении камера получает толчок 0.06 м и зум 1.06x на
      0.18 с; при опасном падении горизонтальный импульс направляет взгляд к закрытому
      проходу.'
    - 'UI и тактильность: ослабленная опора имеет тонкий контур, направление падения
      показывается двумя короткими штрихами, а удар декорации передаётся вибрацией
      70 мс без постоянных маркеров.'
    failure_mode: Игрок ошибается, если стреляет в опору, которая закрывает единственный
      проход, или проходит под падением. Причина читается по направлению пыли, закрытому
      силуэту отметки и звуку гидравлической блокировки; задержка не превращается
      в невидимый скриптовый штраф.
    mastery_curve: На 30-й секунде новичок ломает очевидную переднюю опору и видит
      эффект. На 10-м забеге эксперт распознаёт, что дальний узел сначала создаёт
      боковой обзор, затем ближний узел падает в укрытие, и проходит цепь без остановки
      за 1.8 с.
    counterplay: Саботажники занимают пространство, которое игрок собирается открыть,
      а часть цепей имеет два правдоподобных узла. После 60-й секунды падение прожектора
      запускается через 0.65 с, поэтому безопасная физическая последовательность должна
      быть спланирована до первого выстрела.
    synergies:
    - Ёмкость дубля заставляет сравнивать цену опоры в 1 патрон с выигрышем времени
      и обзора.
    - Выстрел-монтаж превращает физическую цепь в альтернативу хедшоту, а не в декоративный
      взрыв.
    - Световой блокинг показывает, какая часть цепи откроет силуэт, но иногда соблазняет
      разрушить прожектор раньше безопасного момента.
    why_unique: 'Разрушение не является свободной песочницей и не выдаётся универсальной
      взрывчаткой. Каждая цепь короткая, заранее читаемая и привязана к монтажной
      функции: изменить кадр, открыть маршрут или создать укрытие ценой конкретного
      выстрела.'
    pseudocode: '1. Вход: пуля пересекает ослабленный узел радиусом 0.18 м.

      2. Проверка: узел активен, цепь не разряжена и текущие патроны больше 0.

      3. Перевести узел в состояние напряжения и списать 1 патрон.

      4. Передать соседнему звену импульс 7.5 м/с через 0.35 с.

      5. Рассчитать направление падения и проверить, не закрывает ли оно финальную
      отметку.

      6. Запустить падение декорации длительностью 0.35-0.65 с.

      7. После остановки назначить объекту роль укрытия, прохода или блокировки на
      3.5 с.

      8. Показать трещины, пыль, звук столкновения, импульс камеры и новую подсветку
      маршрута.'
  - name: Световой блокинг
    role_in_loop: 'Система наблюдения, телеграфа и позиционирования: свет и механический
      звук заранее сообщают, где появится саботажник и сколько времени остаётся до
      закрытия кадра.'
    player_decision: Решить, ждать ли световой метки для точного хедшота или разрушить
      прожектор заранее, чтобы получить широкий обзор с ценой открытого положения
      и дополнительного входа.
    input_mapping: Игрок поворачивает взгляд мышью или пальцем, движется WASD или
      виртуальным стиком и стреляет отдельной кнопкой; отдельной кнопки включения
      света нет, потому что блокинг меняется только через попадание в декорацию.
    states:
    - 'Тёмная подготовка: вход саботажника скрыт, слышен механизм и видна слабая режиссёрская
      метка.'
    - 'Предупреждение: световой конус показывает силуэт на 0.85 с в ранних павильонах.'
    - 'Открытый силуэт: голова доступна для чистого хедшота на 0.5 с.'
    - 'Сорванный свет: прожектор разрушен, обзор расширен до 110 градусов, но игрок
      лишён прежнего укрытия.'
    - 'Перекрывающийся вход: второй саботажник появляется через 0.7 с после первого.'
    - 'Опасное затухание: безопасное окно перехода сокращено до 0.9 с, после чего
      активируется пиротехнический заряд.'
    parameters:
    - name: Раннее предупреждение
      value: 0.85 с
      tuning_note: Ниже 0.55 с новичок не успевает перевести взгляд; выше 1.2 с ожидание
        становится безусловно выгоднее разрушения.
    - name: Позднее предупреждение
      value: 0.35 с
      tuning_note: Ниже 0.25 с вход кажется случайным; выше 0.5 с исчезает давление
        финальной трети.
    - name: Угол светового конуса
      value: 28 градусов
      tuning_note: Уже 18 градусов игрок теряет периферийные подсказки; шире 40 градусов
        свет перестаёт направлять взгляд.
    - name: Расширенный обзор после разрушения
      value: 110 градусов
      tuning_note: Ниже 90 градусов разрушение прожектора почти не меняет чтение сцены;
        выше 125 градусов пропадает ценность укрытия и поворота камеры.
    - name: Задержка второго входа
      value: 0.7 с
      tuning_note: При задержке меньше 0.45 с два силуэта сливаются; выше 1.0 с игрок
        успевает бездумно обработать их по очереди.
    - name: Безопасное окно перехода
      value: 0.9 с
      tuning_note: Ниже 0.6 с переход зависит от случайной скорости пальца; выше 1.4
        с исчезает необходимость читать свет перед движением.
    - name: Время падения прожектора
      value: 0.65 с
      tuning_note: Ниже 0.4 с падение выглядит мгновенным наказанием; выше 0.9 с игрок
        может спокойно пройти сквозь опасную зону.
    feedback_layers:
    - 'Визуал и эффекты: направленный конус света, пыль в луче, краткий силуэт головы
      и световая метка на полу; после разрушения прожектора сцена получает более широкий,
      но менее контрастный заполняющий свет.'
    - 'Звук: вращение механизма панорамирует звук слева направо, предупреждение повышает
      частоту с 420 до 620 Гц, а активация заряда использует отдельный трёхимпульсный
      сигнал Web Audio.'
    - 'Камера: взгляд слегка притягивается к активной световой метке на 0.08 с, без
      автоповорота; падение прожектора даёт наклон 2 градуса и зум 1.05x на 0.12 с.'
    - 'UI и тактильность: прицел получает тонкий сектор направления входа, оставшееся
      окно обозначается не таймером, а сжимающейся световой дугой; поздний сигнал
      даёт вибрацию 25 мс, активация заряда 90 мс.'
    failure_mode: 'Игрок ошибается, если игнорирует механический звук и входит в сектор
      после затухания световой дуги: саботажник активирует один пиротехнический заряд,
      а при трёх зарядах дубль провален. Отдельный трёхимпульсный сигнал отличает
      эту причину от пустого магазина и трёх попаданий по игроку.'
    mastery_curve: На 30-й секунде новичок ждёт яркую метку 0.85 с и стреляет по очевидной
      голове. На 10-м забеге эксперт слышит панорамирование механизма, заранее ломает
      прожектор, использует расширенный обзор 110 градусов и проходит позднее окно
      0.9 с без потери темпа.
    counterplay: В начале свет честно показывает одиночный вход, но затем предупреждение
      сокращается с 0.85 до 0.35 с, световые конусы перекрываются, а второй саботажник
      входит через 0.7 с. Разрушение прожектора облегчает наблюдение, но снимает теневое
      укрытие и ускоряет открытый риск.
    synergies:
    - Подсказывает момент для хедшота и тем самым помогает вернуть вместимость магазина.
    - 'Меняет ценность цепной декорации: прожектор может быть безопасным источником
      информации или опорой для срочного расширения обзора.'
    - 'Связывает финальный переход с физикой: световая дуга показывает, когда падающий
      объект ещё не закрыл проход.'
    why_unique: Свет не является косметическим освещением и не заменяет карту. Это
      режиссёрский блокинг, который одновременно телеграфирует вход, задаёт композицию
      кадра и предлагает разрушить собственный источник информации ради более широкого,
      но опасного обзора.
    pseudocode: '1. Вход: таймер павильонной точки достигает момента предупреждения.

      2. Проверка: прожектор цел, световой конус активен, текущая фаза дубля определяет
      окно 0.85 или 0.35 с.

      3. Показать направление входа, механический звук и силуэт саботажника.

      4. Если игрок стреляет в голову до окончания окна 0.5 с, вызвать хедшот и возврат
      магазина.

      5. Если игрок стреляет в прожектор, запустить падение длительностью 0.65 с.

      6. После разрушения расширить обзор до 110 градусов и убрать прежнее теневое
      укрытие.

      7. Через 0.7 с создать второй вход, если павильон находится в поздней фазе.

      8. При истечении окна 0.9 с активировать пиротехнический заряд, показать причину
      и обновить звуковой сигнал.'
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: Web Audio API с короткими буферами эффектов
  target_fps: 60
  max_draw_calls: 80
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - name: ввод
    responsibility: мышь, клавиатура, сенсорные жесты и отдельная кнопка огня
  - name: игровое состояние
    responsibility: состояние дубля, патроны, цели, переходы и условия результата
  - name: трассировка
    responsibility: луч прицела, зоны головы, опоры и реквизит
  - name: физика
    responsibility: ограниченные цепи разрушения и столкновения декораций
  - name: рендер
    responsibility: камера от первого лица, стилизованные материалы, свет и эффекты
  - name: платформа
    responsibility: Playgama Bridge, пауза, реклама, сохранения и жизненный цикл
  modules:
  - name: контроллер игрока
    path: src/game/player
  - name: контроллер оружия
    path: src/game/weapons
  - name: режиссёр маршрута
    path: src/game/director
  - name: разрушаемые декорации
    path: src/game/set-pieces
  - name: система попаданий
    path: src/game/hit-detection
  - name: сцена и освещение
    path: src/rendering
  - name: HUD и экраны
    path: src/ui
  - name: адаптер Playgama
    path: src/platform
monetization:
  strategy_summary: Монетизация не меняет точность, вместимость магазина или правила
    маршрута. Она предлагает один необязательный повтор после провала и косметику,
    связанную с киношной площадкой.
  rewarded_placements:
  - id: contract_retry
    name: Повтор дубля
    benefit: Один дополнительный повтор после провала без изменения условий и итоговой
      таблицы рекордов.
    cooldown_or_limit: не более 1 раза на дубль
    trigger_moment: Экран провала после пустого магазина, трёх активированных зарядов
      или третьего попадания.
  interstitial_placements:
  - trigger_event: завершение двух дублей подряд
    cooldown_seconds: 120
    conditions: Не показывать во время активного дубля, сразу после провала или чаще
      одного раза за 120 секунд.
  in_app_purchases:
  - sku: set_dressing_pack
    name: Набор реквизита
    description: Три косметических оформления фасадов, прожекторов и хлопушки.
    price_tier: низкий
    reward: Косметическое оформление без влияния на обзор, урон или вместимость магазина.
  - sku: director_style_pack
    name: Стиль режиссёра
    description: Косметический набор прицела, перчаток и звуковых акцентов.
    price_tier: средний
    reward: Визуальные и звуковые варианты без игрового преимущества.
  fairness_rules:
  - Нельзя покупать патроны, восстановление вместимости или автоматический хедшот.
  - Реклама не прерывает активный дубль.
  - Повтор после рекламы не улучшает результат автоматически и сохраняет исходные
    правила.
  - Косметика не скрывает сигналы входа, попадания и опасные объекты.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - Playgama
  - Yandex Games
  - VK
  - мобильный веб
  - настольный веб
  initialization_flow:
  - Запустить Three.js-сцену и локальное состояние до готовности моста.
  - Инициализировать Bridge и определить поддержку рекламы, сохранений и вибрации.
  - Загрузить настройки управления и лучший результат.
  - Показать короткую цель дубля до первого ввода.
  - Поставить игру на паузу при скрытии вкладки или потере фокуса.
  cloud_save_keys:
  - best_time_ms
  - best_accuracy
  - best_remaining_ammo
  - total_completed_takes
  - unlocked_cosmetics
  - settings_sensitivity
  - settings_audio
  - settings_vibration
  leaderboards:
  - лучшее время полного дубля
  - точность без промахов
  - остаток патронов на финальной отметке
  ads_integration:
    rewarded: Только необязательный повтор после провала, не более одного раза за
      дубль.
    interstitial: После двух завершённых дублей, с паузой 120 секунд и без показа
      во время игры.
    failure_behavior: Если реклама недоступна, кнопка повтора остаётся обычным бесплатным
      перезапуском.
  lifecycle_hooks:
  - пауза при скрытии страницы
  - возобновление после возвращения фокуса
  - сохранение результата после победы
  - сохранение настроек при изменении
  - освобождение WebGL-ресурсов при закрытии
