_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: posledniy_dubl
performance:
  target_fps: 60
  max_draw_calls: 80
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: 'Одиночный контракт-дубль длительностью 90–120 секунд: четыре павильонные
    точки, три связанных перехода, шесть саботажников и один финальный результат.
    После провала доступен мгновенный перезапуск.'
  win: За 90–120 секунд пройти четыре павильонные точки и три перехода, обезвредить
    6 саботажников, добраться до финальной отметки режиссёра и закончить дубль минимум
    с 1 патроном в текущем магазине.
  lose: Дубль провален, если текущий магазин опустел до 0 патронов, если саботажник
    активировал 3 пиротехнических заряда или если игрок получил 3 попадания. Провал
    сопровождается отдельным звуковым сигналом причины и немедленно открывает перезапуск.
  difficulty_curve: Первые 30 секунд дают одиночную цель и очевидную опору. К 60-й
    секунде игроку приходится выбирать между быстрым хедшотом и разрушением укрытия.
    Последние 30–40 секунд совмещают два входа саботажников, падающий прожектор и
    ограниченное окно для безопасного перехода.
mechanics:
  vystrel_montazh:
    name: Выстрел-монтаж
    parameters:
      dalnost_lucha:
        value: 80 м
        note: При уменьшении ниже 60 м дальние опоры выглядят декоративными и игрок
          вынужден подходить вместо постановки; при увеличении выше 100 м исчезает
          ценность переходов и дальних линий обзора.
      zona_hedshota:
        value: радиус 0.22 м
        note: При радиусе ниже 0.16 м хедшоты ощущаются лотереей на мобильном экране;
          выше 0.28 м точный прицел теряет смысл.
      perezaryadka_vystrela:
        value: 0.28 с
        note: Ниже 0.20 с решения сливаются в скорострельность; выше 0.40 с рушится
          ощущение одного непрерывного дубля.
      sdvig_kamery_ot_otdachi:
        value: 4 градуса
        note: Ниже 2 градусов выстрел кажется бесследным; выше 6 градусов игрок чаще
          проигрывает из-за камеры, а не из-за своего монтажного решения.
      vozvrat_kamery:
        value: 0.20 с
        note: При возврате быстрее 0.12 с отдача не читается; медленнее 0.30 с второй
          точный выстрел ощущается заторможенным.
  emkost_dublya:
    name: Ёмкость дубля
    parameters:
      startovaya_vmestimost:
        value: 6 патронов
        note: При 4 патронах первый павильон становится лотереей; при 8 патронах промахи
          слишком долго не создают давления.
      minimalnaya_vmestimost:
        value: 1 патрон
        note: При минимуме 0 можно случайно лишить игрока возможности завершить дубль
          после одного промаха; выше 1 исчезает драматичный финальный патрон.
      shtraf_promaha:
        value: минус 1 патрон вместимости
        note: Штраф в 2 патрона превращает одну ошибку в почти неизбежный провал;
          штраф в 0 убирает напряжение перед каждым выстрелом.
      startovye_tekuschie_patrony:
        value: 6 патронов
        note: При старте ниже вместимости игрок начинает с ощущением уже совершённой
          ошибки; выше вместимости нарушается логика магазина.
      minimum_dlya_pobedy:
        value: 1 патрон
        note: Требование 0 патронов обесценивает финальное напряжение, а требование
          2 патронов делает безопасные маршруты чрезмерно обязательными.
  tsepnaya_dekoratsiya:
    name: Цепная декорация
    parameters:
      kolichestvo_zvenev:
        value: 2-4 звена
        note: При одном звене исчезает решение о порядке; больше 4 звеньев перегружает
          короткую сессию и превращает чтение сцены в инженерный расчёт.
      radius_uzla:
        value: 0.18 м
        note: Ниже 0.12 м узел трудно выбрать на телефоне; выше 0.25 м игрок случайно
          ломает соседнюю цепь.
      impuls_razrusheniya:
        value: 7.5 м/с
        note: Ниже 5 м/с падение выглядит как медленная анимация; выше 10 м/с декорация
          пролетает сквозь читаемую траекторию и создаёт хаотичные столкновения.
      zaderzhka_peredachi_sily:
        value: 0.35 с
        note: Ниже 0.20 с цепь выглядит мгновенным скриптовым обвалом; выше 0.55 с
          игрок теряет причинную связь между первым узлом и итоговым проходом.
      shirina_sozdannogo_ukrytiya:
        value: 2.4 м
        note: Укрытие уже 1.6 м не даёт уверенно переждать вход; шире 3.2 м оно слишком
          безопасно и отменяет цену неверного порядка.
      vremya_blokirovki_nevernym_padeniem:
        value: 3.5 с
        note: Меньше 2 с ошибка не ощущается; больше 5 с игрок ждёт вместо принятия
          следующего монтажного решения.
  svetovoy_bloking:
    name: Световой блокинг
    parameters:
      rannee_preduprezhdenie:
        value: 0.85 с
        note: Ниже 0.55 с новичок не успевает перевести взгляд; выше 1.2 с ожидание
          становится безусловно выгоднее разрушения.
      pozdnee_preduprezhdenie:
        value: 0.35 с
        note: Ниже 0.25 с вход кажется случайным; выше 0.5 с исчезает давление финальной
          трети.
      ugol_svetovogo_konusa:
        value: 28 градусов
        note: Уже 18 градусов игрок теряет периферийные подсказки; шире 40 градусов
          свет перестаёт направлять взгляд.
      rasshirennyy_obzor_posle_razrusheniya:
        value: 110 градусов
        note: Ниже 90 градусов разрушение прожектора почти не меняет чтение сцены;
          выше 125 градусов пропадает ценность укрытия и поворота камеры.
      zaderzhka_vtorogo_vhoda:
        value: 0.7 с
        note: При задержке меньше 0.45 с два силуэта сливаются; выше 1.0 с игрок успевает
          бездумно обработать их по очереди.
      bezopasnoe_okno_perehoda:
        value: 0.9 с
        note: Ниже 0.6 с переход зависит от случайной скорости пальца; выше 1.4 с
          исчезает необходимость читать свет перед движением.
      vremya_padeniya_prozhektora:
        value: 0.65 с
        note: Ниже 0.4 с падение выглядит мгновенным наказанием; выше 0.9 с игрок
          может спокойно пройти сквозь опасную зону.
