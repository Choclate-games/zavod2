definition_of_done:
- Игрок управляет штурмовиком от первого лица с тактическим визором и вьюмоделями
  оружия при стабильных 60 FPS на WebGL
- Пинок ноги срывает бронедвери с петель и отправляет врагов в честный динамический
  рэгдолл-полет Rapier3D с цепными столкновениями
- Карабин стреляет бронебойными пулями с физическим рикошетом от стальных балок под
  углами с бонусом к урону
- Щит позволяет парировать удары в окно 180 мс с оглушением наемников и отражением
  атак
- Реализован 120-секундный штурм через 4 модульных отсека бункера с взломом терминалов
  и финальным боссом Джаггернаутом
- Подключен @playgama/bridge 2.x с сохранением кредитов, таблицей лидеров и рекламными
  плейсментами Rewarded/Interstitial
- Управление полностью адаптировано под клавиатуру/мышь на ПК и эргономичный мультитач
  на мобильных устройствах
- 'Игра осталась тем, что просили: вид от первого лица — игрок смотрит своими глазами,
  а не с вертолёта, вышки или орбиты.'
- 'Игра осталась тем, что просили: стрельба как главное действие игрока.'
- 'Игра осталась тем, что просили: ближний бой оружием в руках.'
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Вышибание двери пинком → Тактическая оценка отсека →
  Стрельба рикошетами и парирование щитом → Кинетический рэгдолл-разнос врагов → Взлом
  терминала отсека → Эвакуация / Апгрейд экзокостюма.'
- 'Реализованы механики проекта: Кинетический Пробивной Пинок (Breach Kick), Кинетическая
  Стрельба с Рикошетом (Ricochet Carbine), Тактическое Парирование Щитом (Aegis Parry),
  Физический Взлом Терминала Локдауна (Terminal Breach).'
- Условие успеха (Успешный прорыв через 4 отсека бункера за время до 120 секунд, физический
  взлом терминала ядра охраны и эвакуация через шлюз с захваченными данными.) и условие
  проигрыша (Падение здоровья экзокостюма до 0 ед. от огня наемников или взрывов,
  либо истечение таймера блокировки бункера (120 с) до завершения взлома терминала.)
  работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Судебный Пристав: Штурм Локдауна».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Экстренная Дефибрилляция Экзокостюма,
  Удвоение Кредитов Контракта); interstitial соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
