  selected_id: D2
  selected_name: 'Судебный Пристав: Штурм Локдауна'
  selection_reason: 'Выбор перенесён на «Судебный Пристав: Штурм Локдауна»: вариант
    «Турбо-Вышибала: Кинетический Разнос» терял то, что пользователь назвал сам (ближний
    бой оружием в руках). Направление D1 («Турбо-Вышибала: Кинетический Разнос») выбрано
    как абсолютный фаворит для браузера и мобильных устройств по следующим ключевым
    причинам: 1. Максимально прямое попадание в ключевую эмоцию пользователя: «Я ударил
    врага настолько сильно, что он улетел через всю арену и сбил ещё троих». 2. Мгновенная
    понятность без обучения (0 секунд до первого удовольствия): игрок с первого кадра
    видит арену, врагов, бочки и свои руки/ноги — удар сразу даёт взрывной физический
    отклик. 3. Идеальная эргономика для мобильных экранов: отсутствие перегруженных
    контекстных меню, прямое управление через крупные зоны экрана и физическое взаимодействие,
    не требующее ювелирного пиксель-хантинга. 4. Оптимальная техническая архитектура
    для Three.js + Rapier3D: компактная сцена с фиксированным пулом рэгдоллов и частиц
    гарантирует стабильные 60 FPS на слабых смартфонах и мгновенную загрузку в WebGL.'
  rejected_reasons:
  - 'D2 («Судебный Пристав: Штурм Локдауна») отвергнут, так как тактический позиционный
    геймплей с укрытиями и выжиданием окон парирования искусственно замедляет темп
    боя и гасит ключевой драйв игры — безумную аркадную кинетику и массовый физический
    разнос врагов.'
  - 'D3 («Орбитальный Дробильщик: Грави-Спринт») отвергнут, так как высокая скорость
    перемещения, бег по стенам и жесткий таймер перегрева смещают фокус игрока с наслаждения
    физикой столкновений на сложный платформинг, создавая избыточную сенсорную нагрузку
    и риск дезориентации на мобильных экранах.'
  what_it_is_not:
  - Не клон Vampire Survivors / Brotato с авто-атаками, пассивным бегом по кругу и
    автоматическим закликиванием волн.
  - 'Не безликая серая арена из стандартных боксов: весь визуал строится на сочной
    стилизованной Low-Poly геометрии с четким цветовым кодированием угроз и интерактивных
    объектов.'
  - 'Не перегруженный виртуальный двухстиковый шутер с россыпью мелких кнопок: схема
    управления адаптирована под естественные крупные тапы и свайпы.'
  - 'Не оторванная от контекста абстрактная мета-прогрессия: деньги за волну тратятся
    внутри боевой сессии непосредственно на кинетическую мощь удара, тяжесть оружия
    и разрушительность окружения.'
  - 'Не статичный слэшер с невесомыми хитбоксами: отсутствие урона без реальной физической
    передачи импульса и честного рэгдолла в Rapier3D.'
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - Вид строго от первого лица с выразительными анимированными вьюмоделями оружия
    в руках и тяжелых ног при пинке.
  - 'Связка двух боевых действий: кинетическая стрельба/метание предметов на дистанции
    и сокрушительный ближний бой оружием с пробивными пинками.'
  - 'Честная физика Rapier3D: каждый пораженный или отброшенный враг мгновенно превращается
    в динамический RigidBody-рэгдолл с честной передачей кинетического импульса.'
  - 'Цепные кинетические реакции и интерактивное разрушаемое окружение: столкновение
    тел с бочками, ящиками и другими врагами наносит каскадный физический урон.'
  signature_scene: Игрок выбивает тяжелую гермодверь пинком ноги, дверь сминает стоящего
    за ней пулеметчика, а игрок сквозь облако пыли отстреливает двоих автоматчиков
    рикошетами от стальных балок.
  avoid_references:
  - Vampire Survivors
  - Brotato
  - Superhot
  - Dark Souls
  - Flappy Bird
