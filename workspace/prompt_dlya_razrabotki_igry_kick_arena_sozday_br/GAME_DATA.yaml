  implementation_guidance: 'Почему выбран каждый документ:

    - `patterns/arena_combat_loop.md` — Базовый игровой цикл штурма модульного бункера
    с зачисткой 4 отсеков и апгрейдом экзокостюма между фазами.

    - `mechanics/chain_reaction.md` — Кинетические цепные реакции при падении выбитых
    дверей на пулеметчиков, сбивании стоек с баллонами и взрывах.

    - `mechanics/physics_destruction.md` — Разрушаемое окружение бункера, срыв гермодверей
    с петель и метание интерактивных ящиков и бочек во врагов.

    - `audio/web_audio_and_muting.md` — Управление политиками автозапуска Web Audio
    в браузере и глушение звука при потере фокуса вкладки.

    - `monetization/rewarded_ads_patterns.md` — Rewarded-монетизация для добровольного
    получения энергоячеек, усиления экзокостюма или второго шанса при штурме.'
  common_mistakes:
  - Реализовать механику по памяти, не открыв документ, который под неё выбран.
  - 'Притащить решение из документа, который куратор для этого проекта отклонил: patterns/survivor_loop.md,
    threejs/horde_survivor_core.md, patterns/fighting_match_loop.md, threejs/fighting_game_core.md,
    stack/bitecs.md, threejs/skinned_character_models.md, threejs/stealth_and_vision_cones.md,
    mechanics/upgrade_choices.md.'
  checklist:
  - Каждая ключевая механика реализована по своему документу из этого набора.
  - Ни одна система не воспроизводит отклонённый жанровый шаблон.
  knowledge_refs:
