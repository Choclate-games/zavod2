  Stylized Low-Poly Sci-Fi. Camera perspective: First-Person Tactical Visor (Вид от
  первого лица). Environment: Укрепленный подземный командный пункт: монолитный серый
  бетон, бронированные гермодвери, аварийные маяки, искрящие кабельные трассы и стальные
  балки. Central Action: Момент, когда игрок выбивает тяжелую гермодверь пинком ноги,
  летящая дверь расплющивает пулеметчика в рэгдолл, сбивает стойку с взрывными баллонами,
  а игрок сквозь облако пыли отстреливает двоих автоматчиков рикошетами от стальных
