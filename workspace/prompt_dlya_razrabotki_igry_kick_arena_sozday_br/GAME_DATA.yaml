    и оружия
  - Создание механики пробивного пинка двери с передачей импульса 450 Нс и рэгдоллом
    врагов
  milestone_deliverable: Играбельный прототип с одной комнатой, выбиваемой дверью
    и рэгдолл-врагами
- phase_number: 2
  title: 'Боевая Система: Рикошеты, Парирование и Враги'
  duration_days: 2
