  player_interaction: 'Клавиатура: ''Space'' (на бегу или на месте); Мобильный: правая
    круговая кнопка с пиктограммой экзоботинка / свайп вперед.'
  feedback: 'Визуал/VFX: Вспышка выброса гидравлического пара из поршней экзоскелета,
    разлет искр и бетонного крошева в месте удара, трассер ударной волны конусом 45°.;
    Звук (Web Audio): Низкочастотный глухой удар гидравлического молота (85 Гц), сопровождаемый
    звонким скрежетом срываемых стальных петель и свистом рассекаемого воздуха.; Камера:
    Резкий импульсный зум (FOV с 75° до 68° за 0.08 с) с последующим сотрясением камеры
    по вертикали (амплитуда 0.35 м, затухание 0.2 с).; UI/Тактильность: Короткая вибрация
    устройства (45 мс, 100% мощности), радиальная вспышка белого виньетирования на
    визоре шлема.'
  technical_complexity: Medium
  strengths:
  - Мгновенный взрывной 'game feel'
  - Эффективное решение против толпы и щитовиков
  - Превращает двери в дальнобойные снаряды
  weaknesses:
