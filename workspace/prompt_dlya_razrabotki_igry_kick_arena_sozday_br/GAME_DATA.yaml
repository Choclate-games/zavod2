    \ ОБЪЕКТА / РЭГДОЛЛ (Q/E)] <--------------+             |\n+========================================================================================+"
  tension_curve: 'Кривая напряжения построена по принципу штурмового крещендо с жестким
    дедлайном 120 с:

    - 0–20 с (Отсек 1 — Охранный дозор): Умеренное напряжение (20–35%). Старт с мощного
    всплеска дофамина от кинетического сноса двери и первого рэгдолла. Игрок осваивает
    базовые тайминги пинка и прямых выстрелов.

    - 20–50 с (Отсек 2 — Склад боеприпасов): Нарастание напряжения (40–65%). Появление
    бронещитовиков и турелей, заставляющих отказаться от прямолинейной стрельбы в
    пользу рикошетов под углом и бросков взрывных бочек. Таймер начинает давить на
    восприятие.

    - 50–85 с (Отсек 3 — Энергоузел): Высокое напряжение (70–85%). Узкие коридоры,
    плотный огонь тяжелого пулеметчика и минные растяжки. Окно ошибки минимально:
    пропуск тайминга парирования сносит 50% щита, а взлом терминала требует изоляции
    врагов пинками.

    - 85–110 с (Отсек 4 — Главный сервер): Пиковое напряжение (90–100%). Схватка со
    штурмовым Джаггернаутом под шквальным огнем минигана. Таймер локдауна бункера
    мигает красным (<25 с). Взлом ядра данных происходит в режиме экстремального риска
    под градом рикошетов.

    - 110–120 с (Эвакуация): Взрывной катарсис и спад напряжения (100% -> 10%) при
    успешном прорыве в эвакуационный шлюз, либо резкий драматический флэтлайн за секунду
    до спасения.'
  core_formulas:
  - DAMAGE_BreachKick = BaseKickDmg(80 ед.) + DoorMass(120 кг) * (ImpulseVelocity(24
    м/с) / 10.0)^1.4 + TargetImpactVelocityBonus
  - 'RICOCHET_Damage = BaseBulletDmg(45 ед.) * (1.0 + 0.50 * RicochetBounces) * (cos(ImpactAngle)
    >= 0.2 ? 1.0 : 0.7)'
  - RAGDOLL_CollisionDmg = (ColliderMass(кг) * (ImpactVelocity(м/с))^1.8) / 120.0
  - LOCKDOWN_SectorTimeLimit = BaseTime(35.0 с) - (SectorIndex * 3.5 с) - (ActiveAlertLevel
    * 2.0 с)
  - 'PARRY_KineticReflectEnergy = AbsorbedProjectileDamage * 1.75 * (ParryWindowTime
    <= 0.18 с ? 1.0 : 0.0)'
  - HACK_ProgressRate = (BaseHackSpeed(33.3 %/с) * OverclockMultiplier) / (1.0 + ActiveSuppressionFire
    * 0.5)
  - SCORE_MissionRating = (RemainingTimeSec * 150) + (RagdollCollisions * 75) + (RicochetKills
    * 120) + (PerfectParries * 200) - (DamageTaken * 2)
  run_progression:
  - 'Захват тактических энергоячеек Синдиката (1 ячейка за взлом каждого из 4 отсеков)
    с мгновенным выбором полевой модификации:'
  - 'Модуль ''Гидравлический Поршень Mk-II'': увеличивает силу импульса пинка с 3500
    Н·с до 5500 Н·с, наделяя летящие двери пробивающим эффектом сквозь нескольких
    врагов подряд.'
  - 'Модуль ''Сверхпроводящий Сердечник Карабина'': увеличивает число возможных рикошетов
    пули с 2 до 4 и добавляет эффект шокового оглушения (1.2 с) при попадании рикошетом.'
  - 'Модуль ''Кинетический Конвертер Щита'': идеальное парирование щитом не просто
    оглушает врага, но выпускает направленную дуговую ударную волну (радиус 6 м, урон
    120 ед.).'
  - 'Модуль ''Экстренный Оверклок Визора'': замедление времени при входе в новый отсек
    увеличивается с 0.5 с до 1.2 с, подсвечивая слабые зоны врагов и взрывные объекты.'
  meta_progression:
  - 'Карьерное древо Департамента Приставов: трата служебных жетонов на постоянные
    протоколы экзокостюма.'
  - 'Протокол ''Титановые Суставы'' (5 рангов): повышает базовую прочность брони экзоскелета
    со 100 до 200 ед. (+20 ед./ранг).'
  - 'Протокол ''Баллистический Сенсор Визора'' (3 ранга): проецирует лазерные расчетные
    траектории рикошетов на стенах в реальном времени с индикатором гарантированного
    попадания.'
  - 'Протокол ''Магнитный Захват Перчаток'' (4 ранга): увеличивает дистанцию захвата
    предметов окружения с 2.5 м до 6.0 м и повышает скорость броска на 40%.'
  - 'Лицензии на Особо Опасные Контракты Бункеров: открытие новых секторов (Бункер
    Синдиката ''Цербер'', Подземная Лаборатория ''Химера'', Ядерный Арсенал ''Гелиос'')
    с уникальными боссами и модификаторами локдауна.'
  - 'Кастомизация тяжелого вооружения: скины экзокостюма, кастомные гидравлические
    накладки ботинок и модификации рикошетного карабина.'
  mechanics:
  - name: Кинетический Пробивной Пинок (Breach Kick)
    role_in_loop: Двигатель темпа и главный источник кинетического инициативного урона
      (открытие каждого отсека и контроль толпы).
    player_decision: Выбивать ли дверь на полной скорости для превращения ее в таранный
      снаряд через весь отсек или приберечь пинок для сбивания щита элитного врага
      в ближнем бою.
    input_mapping: 'Клавиатура: ''Space'' (на бегу или на месте); Мобильный: правая
      круговая кнопка с пиктограммой экзоботинка / свайп вперед.'
    states:
    - IDLE (готовность сервопривода ноги)
    - WINDUP (замах ноги 0.12 с, неуязвимость к легкому оглушению)
    - IMPACT_RELEASE (передача импульса 3500 Н·с в точку физического контакта)
    - RECOVERY (восстановление стойки 0.28 с, снижение скорости бега на 30%)
    - COOLDOWN (перезарядка гидравлики 0.65 с)
    parameters:
    - name: Импульс удара пинка
      value: 3500 Н·с
      tuning_note: Если снизить (<2500 Н·с), двери перестанут сминать врагов и застрянут
        в проеме; если завысить (>5000 Н·с), объекты улетают за пределы физической
        геометрии Three.js.
    - name: Время замаха (Windup)
      value: 0.12 с
      tuning_note: Если увеличить (>0.25 с), пинок ощущается ватным и игрок получает
        урон до удара; если снизить (<0.05 с), теряется ощущение тяжести экзокостюма.
    - name: Базовый урон прямого пинка
      value: 80 ед.
      tuning_note: Если уменьшить (<50 ед.), слабые часовые не погибают от столкновения
        со стеной; если завысить (>150 ед.), огнестрельное оружие становится ненужным.
    - name: Масса выбиваемой двери
      value: 120 кг
      tuning_note: Если уменьшить, дверь летит как фанера без ощущения массы; если
        увеличить, физический движок Rapier3D гасит скорость полета слишком быстро.
    - name: Перезарядка гидравлики
      value: 0.65 с
      tuning_note: Если убрать перезарядку (<0.2 с), игра превращается в спам пинка;
        если завысить (>1.5 с), ломается агрессивный штурмовой темп.
    feedback_layers:
    - 'Визуал/VFX: Вспышка выброса гидравлического пара из поршней экзоскелета, разлет
      искр и бетонного крошева в месте удара, трассер ударной волны конусом 45°.'
    - 'Звук (Web Audio): Низкочастотный глухой удар гидравлического молота (85 Гц),
      сопровождаемый звонким скрежетом срываемых стальных петель и свистом рассекаемого
      воздуха.'
    - 'Камера: Резкий импульсный зум (FOV с 75° до 68° за 0.08 с) с последующим сотрясением
      камеры по вертикали (амплитуда 0.35 м, затухание 0.2 с).'
    - 'UI/Тактильность: Короткая вибрация устройства (45 мс, 100% мощности), радиальная
      вспышка белого виньетирования на визоре шлема.'
    failure_mode: 'Игрок пинает неразрушимую монолитную стену или активирует пинок
      слишком далеко от цели: срабатывает анимация отдачи в ногу (Stumble 0.4 с),
      на визоре загорается желтый индикатор ''OBSTACLE_COLLISION'', игрок открыт для
      встречного огня.'
    mastery_curve: 'Новичок на 30-й секунде пинает только двери прямо перед собой.
      Эксперт на 10-м забеге выполняет ''Kick-Slide-Ricochet'': пинает дверь под острым
      углом в балку, закручивая ее траекторию в пулеметное гнездо, одновременно скользя
      под ответную очередь.'
    counterplay: Тяжелые щитовики с баллистическими якорями (Anchored Shielders) поглощают
      80% импульса пинка, контратакуя оглушающим ударом щита, если игрок не разбил
      их стойку рикошетом.
    synergies:
    - Выбитая дверь активирует цепной рэгдолл врагов для механики Environmental Weaponry
    - Оглушенные пинком враги становятся идеальными мишенями для рикошетов Ricochet
      Carbine
    - Пинок по терминалу в момент взлома сбивает замок (Terminal Breach)
    why_unique: Дверь и окружение не просто исчезают или ломаются на декоративные
      префабы, а становятся полноценным массивным физическим снарядом в Rapier3D с
      расчетом момента импульса, наносящим урон по площади.
    pseudocode: "function tickBreachKick(dt, input, player, physicsWorld):\n    if\
      \ input.kickPressed and player.kickCooldown <= 0:\n        player.state = State.KICK_WINDUP\n\
      \        player.windupTimer = 0.12\n    if player.state == State.KICK_WINDUP:\n\
      \        player.windupTimer -= dt\n        if player.windupTimer <= 0:\n   \
      \         let hit = physicsWorld.raycast(player.pos, player.forward, 2.2)\n\
      \            if hit and hit.isDoor:\n                hit.body.applyImpulse(player.forward.multiply(3500))\n\
      \                triggerFeedback('KICK_DOOR_IMPACT', hit.point)\n          \
      \  elif hit and hit.isEnemy:\n                hit.enemy.takeKineticDamage(80,\
      \ player.forward.multiply(2800))\n                triggerFeedback('KICK_ENEMY_HIT',\
      \ hit.point)\n            player.kickCooldown = 0.65\n            player.state\
      \ = State.IDLE"
  - name: Кинетическая Стрельба с Рикошетом (Ricochet Carbine)
    role_in_loop: Основной источник дистанционного урона и тактический инструмент
      зачистки укрытий без прямой линии огня.
    player_decision: Стрелять прямой наводкой со стандартным уроном (45 ед.) или целиться
      в стальные перекрытия/потолок ради угла рикошета с бонусом +50% урона и обхода
      бронещитов врагов.
    input_mapping: 'Мышь: ЛКМ (одиночный/очередь), Зажатие ПКМ (тактическая подсветка
      траектории рикошета); Мобильный: кнопка огня справа с автонаведением на близкую
      отражающую грань.'
    states:
    - READY (боеготовность)
    - FIRING (выстрел снаряда 'Импульс-9', скорострельность 450 выстр/мин)
    - BOUNCE_CALCULATION (расчет коллизии луча/снаряда со стальной поверхностью)
    - RELOAD (смена магазина 1.4 с)
    parameters:
    - name: Базовый урон пули
      value: 45 ед.
      tuning_note: Если снизить (<30 ед.), прямая стрельба становится бесполезной;
        если завысить (>70 ед.), игрок перестает использовать рикошеты.
    - name: Множитель урона за рикошет
      value: +50% за каждый отскок (до x2.0)
      tuning_note: Если снизить (<+20%), игроку лень искать углы; если завысить (>+100%),
        случайные рикошеты ваншотят боссов.
    - name: Максимальное число отскоков
      value: 2 рикошета (базово) / 4 (с модулем)
      tuning_note: Если разрешить бесконечные отскоки, в замкнутых комнатах начинается
        хаос и лаги Three.js; если 1 — мало простора для геометрии.
    - name: Скорость полета пули
      value: 120 м/с
      tuning_note: Если сделать хитскан (мгновенно), теряется зрелищность светящихся
        трассеров; если слишком медленно (<60 м/с), враги уклоняются пешком.
    - name: Емкость магазина карабина
      value: 24 патрона
      tuning_note: Если увеличить (>40), игрок спамит очередями; если уменьшить (<15),
        постоянные перезарядки ломают драйв 2-минутной сессии.
    feedback_layers:
    - 'Визуал/VFX: Яркий неоново-синий кинетический трассер, сноп раскаленных искр
      в точке контакта с металлом, кольцевая ударная волна рикошета.'
    - 'Звук (Web Audio): Сухой резкий хлопок выстрела с последующим звонким металлическим
      повизгиванием рикошетирующей пули (''пиу-дзынь'').'
    - 'Камера: Микро-толчок отдачи назад (0.05 м) и легкий наклон вверх (Pitch +0.8°)
      с возвратом за 0.06 с.'
    - 'UI/Тактильность: Динамический лазерный маркер на визоре, перекрестие вспыхивает
      золотым при попадании рикошетом с маркером ''CRIT_RICOCHET''.'
    failure_mode: Стрельба в мягкие/деревянные поверхности (где пуля застревает без
      рикошета) либо попадание под углом >85° (пуля отражается обратно в игрока, нанося
      20 ед. self-damage с красной вспышкой визора).
    mastery_curve: Новичок стреляет только во врагов по прямой. Эксперт использует
      углы 45° в потолочные двутавры, чтобы поражать пулеметчиков за сплошными амбразурами
      с максимальным бонусом урона.
    counterplay: Охранные дроны синдиката выставляют энергетические рассеивающие дымовые
      завесы, гасящие кинетическую энергию рикошетов на 60%.
    synergies:
    - Враги, сбитые пинком Breach Kick, получают удвоенный урон от рикошетов в падении
    - Парирование Aegis Parry заряжает следующий магазин карабина электрическими пулями
    - Рикошеты детонируют бочки механики Environmental Weaponry за углами
    why_unique: Рикошет здесь — не визуальный баг или редкая случайность, а ключевая
      тактическая механика с прогрессивным множителем урона и физической трассировкой
      через балки локации.
    pseudocode: "function tickBullet(bullet, dt, physicsWorld):\n    let movement\
      \ = bullet.vel.clone().multiply(dt)\n    let hit = physicsWorld.raycast(bullet.pos,\
      \ movement.normalize(), movement.length())\n    if hit:\n        if hit.isReflectiveMetal\
      \ and bullet.bouncesLeft > 0:\n            bullet.vel = reflectVector(bullet.vel,\
      \ hit.normal)\n            bullet.damage *= 1.5\n            bullet.bouncesLeft\
      \ -= 1\n            triggerFeedback('RICOCHET_SPARKS', hit.point)\n        else\
      \ if hit.isEnemy:\n            hit.enemy.applyDamage(bullet.damage, bullet.vel)\n\
      \            triggerFeedback('BULLET_ENEMY_IMPACT', hit.point)\n           \
      \ destroyBullet(bullet)\n    bullet.pos.add(movement)"
  - name: Тактическое Парирование Щитом (Aegis Parry)
    role_in_loop: Инструмент защиты, выживания и мгновенного контратакующего перехвата
      инициативы под шквальным огнем.
    player_decision: Удерживать ли щит в пассивном блоке (поглощает 60% урона, но
      тратит батарею экзоскелета) или выставить щит за 180 мс до удара/снаряда ради
      100% отражения и ударной волны.
    input_mapping: 'Клавиатура/мышь: нажатие ПКМ в тайминг атаки; Мобильный: левая
      кнопка с пиктограммой щита / тап двумя пальцами.'
    states:
    - HOLSTERED (щит сложен на предплечье)
    - ACTIVE_WINDOW (активное окно идеального парирования 0.18 с)
    - BLOCK_HOLD (удержание пассивного блока, расход энергии 15 ед/с)
    - COUNTER_BURST (взрывная кинетическая волна при идеальном парировании)
    - STAGGER (пробитие блока при перегрузке щита)
    parameters:
    - name: Окно идеального парирования
      value: 0.18 с (180 мс)
      tuning_note: Если сделать шире (>0.3 с), парирование становится тривиальным
        и игра теряет хардкорный азарт; если уже (<0.1 с), парировать в браузере с
        60 FPS становится невозможно.
    - name: Радиус ударной волны парирования
      value: 4.5 м
      tuning_note: Если уменьшить (<2.5 м), волна не достает до стрелков; если увеличить
        (>7 м), парирование зачищает всю комнату одной кнопкой.
    - name: Длительность оглушения врагов
      value: 1.5 с
      tuning_note: Если сократить (<0.8 с), игрок не успевает переключиться на карабин
        или пинок; если завысить (>2.5 с), враги превращаются в манекены.
    - name: Штраф пробития блока
      value: 0.8 с оглушения игрока при исчерпании энергии
      tuning_note: Необходим для наказания за пассивный 'черепаший' геймплей в углу
        арены.
    feedback_layers:
    - 'Визуал/VFX: Раскрытие полупрозрачного гексагонального силового щита, сферическая
      синяя ударная волна, разбрасывающая гильзы и осколки.'
    - 'Звук (Web Audio): Громоподобный металлический ''ДЗЫНЬ'' резонансной частоты
      (1.2 кГц) с последующим низким гулом силового поля.'
    - 'Камера: Мгновенный стоп-кадр (Hitstop на 0.06 с / 60 мс), радиальный блюр по
      краям экрана и толчок вперед на 0.15 м.'
    - 'UI/Тактильность: Мощный виброотклик (80 мс), вспышка бирюзового щита в центре
      HUD с надписью ''PERFECT PARRY''.'
    failure_mode: 'Слишком раннее или позднее нажатие: пуля или удар наемника пробивает
      броню, игрок получает полный урон, на экране появляется красная трещина на визоре
      и статус ''DEFENSE_BREACH''.'
    mastery_curve: Новичок жмет ПКМ наугад или прячется за блоком, теряя всю энергию.
      Эксперт парирует залпы штурмового Джаггернаута в упор, цепочкой отражая ракеты
      обратно в босса.
    counterplay: Наемники-гренадеры кидают термобарические гранаты с задержкой, которые
      нельзя парировать в упор (только отбивать пинком).
    synergies:
    - Отраженные снаряды рикошетят от окружения по правилам Ricochet Carbine
    - Волна парирования толкает врагов в радиус поражения Environmental Weaponry
    - Оглушение от парирования дает безопасное окно для Terminal Breach
    why_unique: Парирование не только блокирует ближний бой, но работает как кинетический
      отражатель баллистических пуль и ракет с конвертацией в AoE-ударную волну.
    pseudocode: "function handleIncomingDamage(player, projectile):\n    if player.isParryActive\
      \ and player.parryTimer <= 0.18:\n        triggerHitstop(0.06)\n        let\
      \ reflectDir = player.forward.clone()\n        projectile.deflect(reflectDir.multiply(1.75))\n\
      \        physicsWorld.createShockwave(player.pos, 4.5, 120)\n        triggerFeedback('PERFECT_PARRY_BOOM',\
      \ player.pos)\n        player.shieldEnergy = min(100, player.shieldEnergy +\
      \ 25)\n    elif player.isBlockHolding:\n        player.shieldEnergy -= projectile.damage\
      \ * 0.4\n        player.takeDamage(projectile.damage * 0.4)\n    else:\n   \
      \     player.takeDamage(projectile.damage)"
  - name: Физический Взлом Терминала Локдауна (Terminal Breach)
    role_in_loop: Источник прогрессии, снятие блокировки шлюзов и ключевой генератор
      тактического напряжения в отсеке.
    player_decision: Начинать взлом немедленно под огнем (рискуя получить урон ради
      сохранения драгоценных секунд общего таймера) или сначала полностью зачистить
      комнату.
    input_mapping: 'Клавиатура: удержание клавиши ''F'' рядом с терминалом; Мобильный:
      удержание виртуальной кнопки взлома в центре экрана.'
    states:
    - LOCKED (терминал активен, шлюзы заблокированы)
    - HACKING (процесс взлома в реальном времени, шкала 0–100%)
    - INTERRUPTED (взлом сбит получением урона без щита)
    - COMPLETED (терминал взломан, дроп энергоячейки, шлюз открыт)
    parameters:
    - name: Базовое время взлома консоли
      value: 3.0 с непрерывного удержания
      tuning_note: Если сократить (<1.5 с), теряется риск и напряжение; если увеличить
        (>5.0 с), игрок не укладывается в 120-секундный общий лимит штурма.
    - name: Порог сбивания взлома уроном
      value: 25 ед. неблокированного урона
      tuning_note: Если сбивать любой единицей урона, взлом под огнем невозможен;
        если не сбивать вовсе, игрок игнорирует врагов.
    - name: Бонус энергоячейки отсека
      value: +1 тактический апгрейд на выбор
      tuning_note: Дает немедленный скачок силы, мотивируя игрока обязательно взламывать
        каждый отсек.
    - name: Таймер локального локдауна отсека
      value: 35.0 с
      tuning_note: При превышении времени отсек заполняется нервно-паралитическим
        газом (-10 HP/с).
    feedback_layers:
    - 'Визуал/VFX: Голографический терминал проецирует бегущие зеленые строки кода
      декриптора, искры из кабелей, зеленый импульс открытия шлюза.'
    - 'Звук (Web Audio): Нарастающий синтетический писк частоты (от 400 Гц до 1600
      Гц по мере заполнения шкалы) и мощный клацающий звук открытия пневмошлюза.'
    - 'Камера: Легкая фокусировка взгляда на экране терминала (плавное приближение
      FOV на 5°), виньетирование краев экрана.'
    - 'UI/Тактильность: Прогресс-бар взлома над терминалом с обратным отсчетом секунд,
      тактильная пульсация телефона каждую секунду взлома.'
    failure_mode: 'Игрок получает тяжелое ранение от гранаты или пулеметной очереди:
      взлом сбрасывается на 50%, терминал издает звуковой сигнал ''ACCESS_DENIED'',
      игрок оглушен на 0.3 с.'
    mastery_curve: Новичок взламывает только после убийства всех врагов, теряя 20
      секунд. Эксперт ставит блок щитом Aegis Parry, отталкивает толпу пинком и взламывает
      терминал за 3 секунды прямо в эпицентре боя.
    counterplay: Кибер-автоматроны синдиката пытаются физически заблокировать доступ
      к терминалу своими телами и вызывают тревожные турели.
    synergies:
    - Успешный взлом дает энергоячейку для усиления Breach Kick и Ricochet Carbine
    - Идеальное парирование щитом Aegis Parry обеспечивает окно неуязвимости для безопасного
      взлома
    why_unique: Взлом — это не отдельная скучная мини-игра в меню, а физическое позиционное
      удержание точки в реальном 3D-бою под шквалом рикошетов и пуль.
    pseudocode: "function tickTerminalHacking(terminal, player, dt):\n    if player.isInteracting\
      \ and distance(player.pos, terminal.pos) < 2.0:\n        if player.recentDamageTaken\
      \ > 25.0:\n            terminal.progress = max(0.0, terminal.progress - 0.5)\n\
      \            triggerFeedback('HACK_INTERRUPTED', terminal.pos)\n        else:\n\
      \            terminal.progress += (dt / 3.0)\n            triggerFeedback('HACK_PULSE',\
      \ terminal.progress)\n            if terminal.progress >= 1.0:\n           \
      \     terminal.state = State.COMPLETED\n                unlockAirlockDoors()\n\
      \                spawnPowerCell(terminal.pos)"
  - name: Метание Предметов Окружения (Environmental Weaponry)
    role_in_loop: Источник бесплатного взрывного урона по площади и инструмент экономии
      боезапаса карабина.
    player_decision: Потратить ли 0.4 с на захват взрывной бочки ради зачистки группы
      врагов или метнуть тяжелый стальной ящик для сбивания бронещита Джаггернаута.
    input_mapping: 'Клавиатура/мышь: ''E'' — захват/притягивание магнитными перчатками,
      ''Q'' или ЛКМ — силовой бросок по направлению прицела; Мобильный: свайп от объекта
      в сторону цели.'
    states:
    - SEARCHING (поиск объекта в конусе захвата 3.5 м)
    - HELD (объект удерживается магнитным лучом перед игроком, работает как щит)
    - THROWN (физический полет объекта в Rapier3D со скоростью 22 м/с)
    - IMPACT (столкновение, урон, детонация взрывчатки)
    parameters:
    - name: Скорость метания объекта
      value: 22 м/с
      tuning_note: Если сделать медленнее (<14 м/с), враги легко отходят в сторону;
        если быстрее (>35 м/с), траектория становится нечитаемой для глаза.
    - name: Дистанция магнитного захвата
      value: 3.5 м
      tuning_note: Если уменьшить (<2 м), игроку приходится подходить в упор под пули;
        если увеличить (>8 м), захватываются случайные объекты за спиной.
    - name: Урон взрывной бочки по площади
      value: 220 ед. в радиусе 4.0 м
      tuning_note: Если снизить (<120 ед.), бочки не ваншотят легких врагов; если
        завысить (>400 ед.), игрок перестает стрелять.
    - name: Поглощение урона удерживаемым объектом
      value: До 150 ед. входящего урона
      tuning_note: Позволяет использовать удерживаемый ящик как импровизированный
        мобильный щит при сближении.
    feedback_layers:
    - 'Визуал/VFX: Магнитный синий луч притяжения между перчатками и объектом, оранжевый
      огненный шар и клубы дыма при взрыве бочки, разлет щепок и осколков.'
    - 'Звук (Web Audio): Гул магнитного поля при удержании (120 Гц), свист рассекаемого
      воздуха при броске и оглушительный взрыв (60 Гц саб-бас).'
    - 'Камера: Тряска камеры при детонации (Trauma 0.6, плавное затухание за 0.4 с),
      динамический зум на точку попадания.'
    - 'UI/Тактильность: Двойная нарастающая вибрация (захват -> бросок), маркер урона
      по площади ''EXPLOSION_KILL x3''.'
    failure_mode: 'Попадание вражеской пули в удерживаемую взрывную бочку прямо перед
      лицом игрока: преждевременный взрыв наносит игроку 60 ед. урона и ослепляет
      визор на 1.0 с.'
    mastery_curve: Новичок бросает ящики наугад. Эксперт ловит магнитными перчатками
      летящую вражескую гранату или выбитую дверь и перенаправляет ее в скопление
      врагов.
    counterplay: Снайперы синдиката специально целятся во взрывоопасные бочки, когда
      игрок находится рядом с ними.
    synergies:
    - Выбивание двери Breach Kick создает новые обломки для метания
    - Детонация бочек рикошетами Ricochet Carbine на дистанции
    - Бросок ящика сбивает стойку врагов для идеального добивания пинком
    why_unique: Каждый физический объект в Rapier3D обладает реальной массой, баллистической
      траекторией и может использоваться и как щит, и как снаряд с разрушаемостью.
    pseudocode: "function handleGrabAndThrow(player, input, physicsWorld):\n    if\
      \ input.grabPressed and player.heldObject == null:\n        let obj = physicsWorld.findNearestGrabbable(player.pos,\
      \ player.lookRay, 3.5)\n        if obj:\n            player.heldObject = obj\n\
      \            obj.attachMagneticBeam(player.handBone)\n    else if (input.throwPressed\
      \ or input.primaryFire) and player.heldObject != null:\n        let throwDir\
      \ = player.cameraForward.clone()\n        player.heldObject.applyImpulse(throwDir.multiply(22\
      \ * player.heldObject.mass))\n        player.heldObject.isLethalProjectile =\
      \ true\n        player.heldObject = null\n        triggerFeedback('THROW_RELEASE',\
      \ player.pos)"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 80
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - name: PresentationLayer
    responsibilities: Three.js рендеринг сцены, Low-Poly меши, шейдеры визора, VFX
      частиц и рикошетов
  - name: PhysicsLayer
    responsibilities: Rapier3D физический мир, RigidBody рэгдоллы, рейкасты пуль рикошета,
      коллизии дверей
  - name: GameplayLayer
    responsibilities: FSM состояний игрока (FPS контроллер, пинок, стрельба, парирование,
      взлом), спавн врагов
  - name: AudioLayer
    responsibilities: Web Audio API / Howler пространственные 3D звуки выстрелов,
      лязга щита, сирен и ударов
  - name: BridgeLayer
    responsibilities: Интеграция @playgama/bridge (авторизация, реклама, облачные
      сохранения, лидерборды)
  modules:
  - description: Обработка кинетического импульса ногой, коллизий дверей и переключения
      врагов в рэгдолл
    module: BreachKickSystem
  - description: Расчет лучей отражения пуль от металлических поверхностей и спавн
      трассеров
    module: RicochetBallistics
  - description: Фрейм-дата окон парирования (180 мс), поглощение урона и оглушение
      противников
    module: ShieldParryController
  - description: Контроль прогрессии 4 отсеков бункера, спавн подкреплений и таймер
      локдауна (120 с)
    module: CompartmentManager
  - description: Пул предсозданных физических тел Rapier3D для предотвращения аллокаций
      памяти во время боя
    module: RagdollPool
monetization:
  strategy_summary: 'Ненавязчивая гибридная монетизация для WebGL и мобильных платформ:
    Rewarded Video за тактическое воскрешение и удвоение награды контракта, Interstitial
    между завершенными штурмами с жестким кулдауном 90 с, и косметические скины визора/оружия
    за внутриигровую валюту/IAP.'
  rewarded_placements:
  - id: revive_contract
    name: Экстренная Дефибрилляция Экзокостюма
    benefit: Мгновенное воскрешение на месте гибели с 50% здоровья и кинетической
      волной отталкивания всех врагов в радиусе 5 м (1 раз за забег)
    cooldown_or_limit: 1 per run
    trigger_moment: Экран гибели до истечения таймера локдауна
  - id: double_contract_reward
    name: Удвоение Кредитов Контракта
    benefit: Удвоение полученных за успешный штурм бункера кредитов и энергоячеек
    cooldown_or_limit: После каждого успешного штурма
    trigger_moment: Экран победной эвакуации
  interstitial_placements:
  - trigger_event: Возврат в главное меню после завершения или провала контракта
    cooldown_seconds: 90
    conditions: Показывается только если с момента последнего полноэкранного показа
      прошло >= 90 секунд и игрок провел в бою не менее 60 секунд
  in_app_purchases:
  - sku: starter_pack_operator
    name: Набор Оператора Штурма
    description: Кастомный скин визора «Кибер-Пристав», золотой скин карабина и 5000
      кредитов
    price_tier: Tier 1 (99 RUB / 45 YAN)
    reward: Косметический набор + валюта
  - sku: no_ads_pass
    name: Пакет Быстрого Доступа (Без Рекламы)
    description: Отключение межстраничной рекламы Interstitial и постоянный бонус
      +25% к кредитам
    price_tier: Tier 2 (199 RUB / 90 YAN)
    reward: Отключение Interstitial + пассивный множитель
  fairness_rules:
  - 'Никакого Pay-to-Win: все штурмовые контракты и базовое оружие полностью проходимы
    на чистом скилле.'
  - Rewarded Video строго опциональны и не навязываются игроку во время активного
    боя.
  - Межстраничная реклама никогда не прерывает геймплей внутри 120-секундного штурмового
    отсека.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - game_distribution
  - generic_web
  initialization_flow:
  - Bridge.initialize() на старте загрузки игры
  - Проверка платформы и поддержка авторизации игрока
  - Загрузка сохраненного прогресса игрока через Bridge.storage.get()
  - Инициализация рекламных баннеров и готовности Rewarded/Interstitial
  - Скрытие стартового прелоадера и запуск Three.js сцены
  cloud_save_keys:
  - player_credits
  - unlocked_weapons
  - upgrades_state
  - cleared_bunkers_count
  - best_speedrun_time
  - audio_settings
  leaderboards:
  - bunker_speedrun_seconds
  - total_contracts_completed
  ads_integration:
    banner_supported: false
    interstitial_cooldown_ms: 90000
    rewarded_available_check: true
  lifecycle_hooks:
  - 'onPause: остановка физического мира Rapier3D и Web Audio при потере фокуса'
  - 'onResume: возобновление рендеринга и аудио при возврате в окно'
