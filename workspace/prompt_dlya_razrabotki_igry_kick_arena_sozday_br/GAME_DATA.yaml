gameplay_systems:
- name: Система Физического Рэгдолла и Каскадных Коллизий (Rapier3D Ragdoll System)
  purpose: Обеспечение сочного физического поведения тел врагов и разрушаемых объектов
    при получении кинетических импульсов.
  input: Импульсы от пинка ноги (450 Нс), взрывов бочек (800 Нс), выстрелов карабина
    (120 Нс) и брошенных предметов.
  rules:
  - При получении летального урона или сильного пинка враг мгновенно переключается
    из кинематического контроллера в Dynamic RigidBody Rapier3D с сохранением вектора
    атаки.
  - 'Рэгдолл при столкновении с другими врагами передает кинетическую энергию: если
    скорость > 4 м/с, стоящий враг сбивается с ног и получает урон от соударения.'
  - Столкновение рэгдолла с деревянным ящиком или дверью разрушает объект при энергии
    соударения > 150 Дж.
  - Физический пул ограничен 8 активными рэгдоллами на мобайле и 15 на десктопе; старые
    неподвижные тела засыпают (sleep).
  state:
  - Kinematic (Alive/Moving)
  - Ragdoll_Active (Dynamic physics)
  - Ragdoll_Sleeping (Frozen collider)
  - Despawned
  interactions: Взаимодействует с коллайдерами стен, гермодверей, взрывных бочек и
    пулями рикошета.
  feedback: Сочный хруст коллизий, частицы пыли и крови, легкое дрожание камеры при
    ударах тяжелых тел о стены.
  edge_cases:
  - Застревание рэгдолла в дверном проеме решается автоматическим импульсом выталкивания
    вдоль нормали проема.
- name: Система Локдауна и Модульных Отсеков (Lockdown & Compartment Progression)
  purpose: Управление структурой 120-секундного штурма через 4 герметичных отсека
    бункера с нарастающим прессингом таймера.
  input: Таймер сессии (120 с), триггеры вышибания гермодверей и события взлома терминалов.
  rules:
  - Штурм разделен на 4 последовательных отсека (Аванпост, Склад боеприпасов, Серверная
    галерея, Ядро управления Джаггернаута).
  - Переход в следующий отсек возможен только после выбивания гермодвери и/или взлома
    охранного терминала.
  - 'Таймер локдауна идет непрерывно: если игрок не завершил взлом 4-го терминала
    за 120 с, бункер блокируется (Lose).'
  - Каждый пройденный отсек выдает 1 тактическую энергоячейку для мгновенного усиления
    экзокостюма.
  state:
  - Compartment_Locked
  - Compartment_Breached
  - Combat_Active
  - Terminal_Hacked
  - Sector_Cleared
  interactions: Управляет спавном врагов, состоянием освещения (переход в тревожный
    красный) и интерфейсом таймера.
  feedback: Нарастающая сирена тревоги, мигание аварийных маяков, текстовое оповещение
    на визоре «ОТСЕК ЗАЧИЩЕН».
  edge_cases:
  - Если игрок забегает в отсек игнорируя врагов, гермодверь сзади блокируется, предотвращая
    отступление.
- name: Система Позиционных Укрытий и Подавления Огнем (Tactical Cover & Suppression)
  purpose: Создание глубокого тактического позиционирования, где бетонные колонны
    и металлические щиты дают защиту от плотного огня.
  input: Позиция игрока относительно укрытий, линия огня вражеских стрелков и попадания
    пуль в барьеры.
  rules:
  - Нахождение за укрытием снижает входящий стрелковый урон на 100% со стороны направления
    укрытия.
  - Укрытия делятся на неразрушимые (монолитный бетон, стальные опоры) и разрушаемые
    (деревянные ящики, офисные перегородки).
  - Плотный огонь пулеметчика по разрушаемому укрытию уничтожает его за 2.5 секунды,
    заставляя игрока совершать рывок к следующей позиции.
  - Подавление стрелка огнем карабина заставляет его спрятаться за укрытие на 1.5
    секунды, открывая окно для сокращения дистанции пинком.
  state:
  - Out_Of_Cover
  - In_Cover_Safe
  - In_Cover_Under_Fire
  - Cover_Destroyed
  interactions: Связана со спавном декалей пробитий, рикошетами и звуком свиста пуль
    над головой.
  feedback: Крошка бетона и искры летят от колонны при попаданиях, визор затемняется
    по краям при огневом подавлении.
  edge_cases:
  - Сбитый с ног рэгдолл врага может снести разрушаемое укрытие, за которым прятался
    другой противник.
- name: Система Тактического Визора и Аудио-Визуального Отклика (HUD Visor & Combat
    Feedback)
  purpose: Максимизация импакта каждого действия через синхронный аудио-визуальный
    отклик и диэгетический интерфейс шлема.
  input: События ударов, выстрелов, рикошетов, парирований, получения урона и взлома.
  rules:
  - Любой сильный кинетический удар запускает микро-хитстоп (30–50 мс) и сотрясение
    камеры с амплитудой, пропорциональной силе импульса.
  - При прицеливании на стальную поверхность визор рассчитывает и проецирует траекторию
    рикошета (зеленый пунктирный луч).
  - Получение урона отображается направленным красным индикатором и легким глитчем
    визора.
  - 'Звуковой движок микширует звуки с приоритетом: парирование > пинок двери > рикошет
    > шаги.'
  state:
  - HUD_Normal
  - HUD_Aiming_Ricochet
  - HUD_HitStop
  - HUD_Glitch_Damage
  - HUD_Victory_Overlay
  interactions: Управляет шейдерами пост-процессинга, положением камеры Three.js и
    каналами Web Audio API.
  feedback: Идеальная синергия зрения, слуха и тактильного ощущения от каждого движения.
  edge_cases:
  - При падении FPS ниже 45 тяжелые шейдерные глитчи автоматически отключаются.
core_design:
  signature_moment: 'Штурм отсека №3: судебный пристав на полной скорости разгоняет
    сервоприводы экзоскелета и выбивает бронированную гермодверь гидравлическим пинком
    ноги. 400-килограммовая стальная плита срывается с петель и на скорости 24 м/с
    влетает в укрепленный дот, расплющивая пулеметчика в рэгдолл и сбивая стойку со
    взрывоопасными криогенными баллонами. Комнату заволакивает взрывная волна и ледяной
    пар, а пристав в воздухе выпускает очередь из карабина ''Импульс-9'' под углом
    45° в потолочную двутавровую балку — рикошетные пули срезают двух автоматчиков
    за тяжелыми укрытиями, после чего боец на лету перехватывает магнитными перчатками
    сорванный огнетушитель и швыряет его в последнего наемника.'
  genre_template_rejected: 'Сознательно отвергнут шаблон ''бесконечного волнового
    арена-шутера со сбором монет и паузой на магазин между волнами'' (по типу Vampire
    Survivors / Crimsonland), а также шаблон ''пассивного укрывного шутера с авторегенерацией
    здоровья''. Причина: статичный отстрел волн на замкнутой площадке превращает глубокую
    физику Rapier3D в банальную фоновую декорацию и провоцирует скучный кайтинг по
    кругу. Вместо этого спроектирован жесткий линейно-прорывной штурмовой спидран-экшен:
    4 герметичных отсека, таймер локдауна (120 с), где тяжелая физика окружения (срыв
    дверей, рикошеты, броски тел) является главным атакующим инструментом прорыва.'
  what_makes_it_different: 'В отличие от большинства шутеров, где физический рэгдолл
    включается лишь постфактум как декорация смерти, в ''Судебный Пристав: Штурм Локдауна''
    рэгдолл и динамические коллизии — это основное оружие контроля и урона: выбитая
    дверь работает как тяжелый кинетический снаряд сминания, рикошеты позволяют зачищать
    мертвые зоны без прямого зрительного контакта, идеальное парирование щитом отражает
    кинетическую энергию вражеских выстрелов во взрывную ударную волну, а взлом охранного
    терминала локдауна требует физического удержания позиции прямо посреди летающих
    обломков.'
  micro_loop:
  - step: Кинетический прорыв шлюза (Breach Kick)
    player_action: Игрок на бегу жмет 'Space', активируя гидравлический поршень экзоботинка
      по гермодвери отсека
    game_response: Стальная дверь срывается с петель и на скорости 24 м/с летит в
      комнату, сминая первого наемника в рэгдолл с импульсом 3500 Н·с
    decision: Выбить дверь по центру для таранного пробития строя или выбить под углом
      для рикошета двери во фланговое укрытие
    duration: 0.35 с
  - step: Тактическая оценка отсека в слоу-мо визора
    player_action: Прицеливание карабином по металлическим поверхностям либо захват
      объекта окружения клавишей 'E'
    game_response: Визор подсвечивает проекции траекторий рикошетов (зеленые лазерные
      лучи) и статус уязвимости наемников синдиката
    decision: Стрелять прямой наводкой в уязвимого врага, выстрелить рикошетом за
      угол укрытия или метнуть криобочку
    duration: 0.5 с
  - step: Кинетический залп и парирование контратаки
    player_action: Очередь ЛКМ рикошетным карабином с мгновенным выставлением ПКМ
      баллистического щита 'Эгида' на 180 мс при ответном огне
    game_response: Пули рикошетят от потолочных балок в спины врагов (+50% урона),
      щит парирует вражеский снаряд с выбросом оглушающей ударной волны
    decision: Удерживать пассивный блок (расходуя энергию щита) или поймать тайминг
      идеального парирования ради ударной волны
    duration: 0.8 с
  - step: Физическое добивание и зачистка отсека
    player_action: Силовой бросок захваченного ящика клавишей 'Q' или добивающий пинок
      по рэгдоллу врага в сторону генератора
    game_response: 'Каскадная коллизия: ящик раскалывается, сбивает автоматчика, тело
      врезается в генератор и детонирует'
    decision: Потратить оставшиеся секунды на сбор выбитых энергоячеек или сразу бежать
      к терминалу локдауна
    duration: 1.2 с
  meso_loop:
  - step: Прорыв периметра отсека
    player_action: Штурмовое выбивание входного шлюза отсека, подавление передового
      дозора кинетическим пинком и рикошетным огнем
    game_response: Включение сирены тревоги отсека, запуск 35-секундного локального
      таймера локдауна, активация защитных турелей
    decision: Занять ближнюю баррикаду для позиционной перестрелки или совершить агрессивный
      рывок к пулеметному гнезду
    duration: 5–8 с
  - step: Тактическая зачистка гарнизона синдиката
    player_action: Маневрирование между укрытиями, отражение атак тяжелых щитовиков
      парированием и бросками взрывоопасных бочек
    game_response: Враги теряют баланс от взрывов и столкновений тел, защитный периметр
      вокруг центрального терминала разрушается
    decision: Добить всех наемников для безопасного взлома или начать взлом терминала
      под прикрытием щита прямо под огнем
    duration: 10–18 с
  - step: Физический взлом терминала локдауна
    player_action: Удержание клавиши взаимодействия 'F' у консоли терминала, отбиваясь
      одной рукой пинками от штурмовиков
    game_response: Шкала декриптора (3.0 с) заполняется; гермозатворы следующего шлюза
      открываются, выпадает тактическая энергоячейка
    decision: Вставить энергоячейку в усиление пинка (ударная волна), в карабин (двойной
      рикошет) или в экзоброню (регенерация щита)
    duration: 4–6 с
  - step: Шлюзовой переход и стабилизация экзокостюма
    player_action: Спринт через открывшийся шлюз в следующий отсек до закрытия аварийных
      бронестворок
    game_response: Герметизация зачищенной зоны, восстановление 25% прочности экзокостюма,
      обновление общего таймера локдауна бункера
    decision: Сменить тактику на осторожную (зачистка рикошетами из-за угла) или сразу
      спринтовать на таран следующей двери
    duration: 2–3 с
  macro_loop:
  - step: Выбор контракта и калибровка экзокостюма
    player_action: Игрок выбирает контракт бункера синдиката в тактическом терминале
      и настраивает конфигурацию модулей экзокостюма
    game_response: Визор загружает архитектурный план 4 отсеков бункера, состав гарнизона,
      модификаторы локдауна и награду в жетонах
    decision: Установить модуль тяжелого гидравлического поршня (+силы пинка, -скорость
      бега) или модуль баллистического отражателя (+окно парирования)
    duration: 15–30 с
  - step: Штурмовой рейд через 4 отсека бункера
    player_action: 'Непрерывный тактический прорыв сквозь 4 отсека: Охранный дозор
      → Склад боеприпасов → Энергоузел → Главный сервер синдиката'
    game_response: Динамическая эскалация плотности врагов, появление бронированного
      Джаггернаута в 4-м отсеке, нарастание напряжения таймера 120 с
    decision: Рисковать здоровьем ради сбора дополнительных ячеек данных или двигаться
      по кратчайшему пути к эвакуации
    duration: 90–120 с
  - step: Эвакуация данных / Фиксация поражения
    player_action: Финальный прыжок в шлюз эвакуации после взлома ядра данных либо
      гибель экзоскелета под перекрестным огнем
    game_response: 'Подсчет боевой эффективности: захваченные зашифрованные диски,
      множитель оставшегося времени, начисление жетонов пристава'
    decision: Зафиксировать полученные данные для разблокировки нового контракта или
      реинвестировать жетоны в древо модулей
    duration: 5–10 с
  - step: Модернизация в штурмовом депо Департамента
    player_action: 'Трата заработанных жетонов на постоянные протоколы экзокостюма:
      титановые суставы, баллистический сенсор, магнитные перчатки'
    game_response: Разблокировка новых контрактов повышенной сложности (новые типы
      врагов, лазерные турели, ядовитые испарения)
    decision: Прокачивать выживаемость (толщину брони и поглощение урона) или кинетическую
      летальность (скорость полета дверей и урон рикошета)
    duration: 20–45 с
  loop_diagram: "+========================================================================================+\n\
    |                              МАКРО-ПЕТЛЯ (ШТУРМОВОЙ КОНТРАКТ: 90-120 с)    \
    \            |\n|                                                            \
    \                            |\n|  [БРИФИНГ И КАЛИБРОВКА] ---> [ШТУРМ 4 ОТСЕКОВ\
    \ БУНКЕРА] ---> [ЭВАКУАЦИЯ / ФЛЭТЛАЙН]    |\n|            ^                  \
    \                                      |                  |\n|            |  \
    \                                                      v                  |\n\
    |            +----------------- [ДЕПО: ПРОТОКОЛЫ ЭКЗОКОСТЮМА] <-------+      \
