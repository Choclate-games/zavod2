_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: prompt_dlya_razrabotki_igry_kick_arena_sozday_br
performance:
  target_fps: 60
  max_draw_calls: 80
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: 'Линейный контрактный штурм модульного бункера: прорыв через 4 последовательных
    физических отсека за 90–120 секунд с обязательным взломом охранного терминала
    и эвакуацией.'
  win: Успешный прорыв через 4 отсека бункера за время до 120 секунд, физический взлом
    терминала ядра охраны и эвакуация через шлюз с захваченными данными.
  lose: Падение здоровья экзокостюма до 0 ед. от огня наемников или взрывов, либо
    истечение таймера блокировки бункера (120 с) до завершения взлома терминала.
  difficulty_curve: 'Отсек 1 (0–20 с): 3 легких часовых, тренировка пинка двери и
    выстрелов; Отсек 2 (20–50 с): щитовики и стрелки за укрытиями, необходимость фланкирования
    и бросков ящиков; Отсек 3 (50–85 с): пулеметчик и взрывоопасные бочки, жесткое
    позиционирование; Отсек 4 (85–120 с): штурмовой Джаггернаут-босс с миниганом и
    свитой, взлом терминала под плотным прессингом.'
mechanics:
  kineticheskiy_probivnoy_pinok_breach_kick:
    name: Кинетический Пробивной Пинок (Breach Kick)
    parameters:
      impuls_udara_pinka:
        value: 3500 Н·с
        note: Если снизить (<2500 Н·с), двери перестанут сминать врагов и застрянут
          в проеме; если завысить (>5000 Н·с), объекты улетают за пределы физической
          геометрии Three.js.
      vremya_zamaha_windup:
        value: 0.12 с
        note: Если увеличить (>0.25 с), пинок ощущается ватным и игрок получает урон
          до удара; если снизить (<0.05 с), теряется ощущение тяжести экзокостюма.
      bazovyy_uron_pryamogo_pinka:
        value: 80 ед.
        note: Если уменьшить (<50 ед.), слабые часовые не погибают от столкновения
          со стеной; если завысить (>150 ед.), огнестрельное оружие становится ненужным.
      massa_vybivaemoy_dveri:
        value: 120 кг
        note: Если уменьшить, дверь летит как фанера без ощущения массы; если увеличить,
          физический движок Rapier3D гасит скорость полета слишком быстро.
      perezaryadka_gidravliki:
        value: 0.65 с
        note: Если убрать перезарядку (<0.2 с), игра превращается в спам пинка; если
          завысить (>1.5 с), ломается агрессивный штурмовой темп.
  kineticheskaya_strelba_s_rikoshetom_ricochet_carbi:
    name: Кинетическая Стрельба с Рикошетом (Ricochet Carbine)
    parameters:
      bazovyy_uron_puli:
        value: 45 ед.
        note: Если снизить (<30 ед.), прямая стрельба становится бесполезной; если
          завысить (>70 ед.), игрок перестает использовать рикошеты.
      mnozhitel_urona_za_rikoshet:
        value: +50% за каждый отскок (до x2.0)
        note: Если снизить (<+20%), игроку лень искать углы; если завысить (>+100%),
          случайные рикошеты ваншотят боссов.
      maksimalnoe_chislo_otskokov:
        value: 2 рикошета (базово) / 4 (с модулем)
        note: Если разрешить бесконечные отскоки, в замкнутых комнатах начинается
          хаос и лаги Three.js; если 1 — мало простора для геометрии.
      skorost_poleta_puli:
        value: 120 м/с
        note: Если сделать хитскан (мгновенно), теряется зрелищность светящихся трассеров;
          если слишком медленно (<60 м/с), враги уклоняются пешком.
      emkost_magazina_karabina:
        value: 24 патрона
        note: Если увеличить (>40), игрок спамит очередями; если уменьшить (<15),
          постоянные перезарядки ломают драйв 2-минутной сессии.
  takticheskoe_parirovanie_schitom_aegis_parry:
    name: Тактическое Парирование Щитом (Aegis Parry)
    parameters:
      okno_idealnogo_parirovaniya:
        value: 0.18 с (180 мс)
        note: Если сделать шире (>0.3 с), парирование становится тривиальным и игра
          теряет хардкорный азарт; если уже (<0.1 с), парировать в браузере с 60 FPS
          становится невозможно.
      radius_udarnoy_volny_parirovaniya:
        value: 4.5 м
        note: Если уменьшить (<2.5 м), волна не достает до стрелков; если увеличить
          (>7 м), парирование зачищает всю комнату одной кнопкой.
      dlitelnost_oglusheniya_vragov:
        value: 1.5 с
        note: Если сократить (<0.8 с), игрок не успевает переключиться на карабин
          или пинок; если завысить (>2.5 с), враги превращаются в манекены.
      shtraf_probitiya_bloka:
        value: 0.8 с оглушения игрока при исчерпании энергии
        note: Необходим для наказания за пассивный 'черепаший' геймплей в углу арены.
  fizicheskiy_vzlom_terminala_lokdauna_terminal_brea:
    name: Физический Взлом Терминала Локдауна (Terminal Breach)
    parameters:
      bazovoe_vremya_vzloma_konsoli:
        value: 3.0 с непрерывного удержания
        note: Если сократить (<1.5 с), теряется риск и напряжение; если увеличить
          (>5.0 с), игрок не укладывается в 120-секундный общий лимит штурма.
      porog_sbivaniya_vzloma_uronom:
        value: 25 ед. неблокированного урона
        note: Если сбивать любой единицей урона, взлом под огнем невозможен; если
          не сбивать вовсе, игрок игнорирует врагов.
      bonus_energoyacheyki_otseka:
        value: +1 тактический апгрейд на выбор
        note: Дает немедленный скачок силы, мотивируя игрока обязательно взламывать
          каждый отсек.
      taymer_lokalnogo_lokdauna_otseka:
        value: 35.0 с
        note: При превышении времени отсек заполняется нервно-паралитическим газом
          (-10 HP/с).
  metanie_predmetov_okruzheniya_environmental_weapon:
    name: Метание Предметов Окружения (Environmental Weaponry)
    parameters:
      skorost_metaniya_obekta:
        value: 22 м/с
        note: Если сделать медленнее (<14 м/с), враги легко отходят в сторону; если
          быстрее (>35 м/с), траектория становится нечитаемой для глаза.
      distantsiya_magnitnogo_zahvata:
        value: 3.5 м
        note: Если уменьшить (<2 м), игроку приходится подходить в упор под пули;
          если увеличить (>8 м), захватываются случайные объекты за спиной.
      uron_vzryvnoy_bochki_po_ploschadi:
        value: 220 ед. в радиусе 4.0 м
        note: Если снизить (<120 ед.), бочки не ваншотят легких врагов; если завысить
          (>400 ед.), игрок перестает стрелять.
      pogloschenie_urona_uderzhivaemym_obektom:
        value: До 150 ед. входящего урона
        note: Позволяет использовать удерживаемый ящик как импровизированный мобильный
          щит при сближении.
