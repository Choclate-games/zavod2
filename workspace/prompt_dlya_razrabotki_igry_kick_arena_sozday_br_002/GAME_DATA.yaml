  selected_id: D1
  selected_name: '«Вышибала: Сброс за борт»'
  selection_reason: 'Направление D1 («Вышибала: Сброс за борт») выбрано как идеальное
    воплощение ядра заказа («ударил врага так сильно, что он улетел через всю арену
    и сбил троих») с максимальной отдачей на WebGL и смартфонах. Механика ринг-аута
    (сброса с арены) и цепных физических реакций мгновенно понятна с первой секунды
    без обучения: игрок видит край платформы, видит летящую в челюсть врага ногу или
    биту и сразу использует геометрию. В отличие от D3, здесь нет завышенного порога
    входа по ритму, а в отличие от D2, нагрузка на физический движок Rapier3D минимальна
    (одна сцена, твердые тела, без десятков сложных гидравлических сочленений ловушек),
    что гарантирует стабильные 60 FPS даже на бюджетных телефонах.'
  rejected_reasons:
  - 'D2 («Свалка Судного Дня: Пресс-Экстрим»): Отвергнуто из-за смещения фокуса с
    непосредственного ощущения силы персонажа (пинки, оружие в руках) на пассивное
    использование окружения (заманивание под прессы и ловушки), а также повышенного
    риска просадки FPS в браузере при одновременном расчете множества подвижных физических
    сочленений и разрушаемых объектов ловушек.'
  - 'D3 («Тайфун-Додзё: Ритм-Нокаут»): Отвергнуто из-за избыточной сложности управления
    и высокого порога входа: одновременное удержание рэгдолл-цели в воздухе (джагглинг),
    контроль толпы от первого лица и попадание в ритмический бит вызывают сенсорную
    перегрузку у мобильных игроков в коротких браузерных сессиях, а разработка требует
    дорогой полировки таймингов Web Audio и физики.'
  what_it_is_not:
  - Автобаттлер / Vampire Survivors-клон с автоматической стрельбой по кругу и пассивным
    уворотом от медленных врагов.
  - Слоу-пейс фехтование с полосками выносливости (stamina bar) и долгими тактическими
    перекатами (Soulslike).
  - Невидимые стены и запертые глухие коробки без возможности ринг-аута и физического
    выталкивания за пределы арены.
  - Серые нетекстурированные кубы-заглушки и безликие манекены вместо стилизованных
    неоновых low-poly моделей с читаемыми силуэтами.
  - Мета-прогрессия в виде бесконечного гринда сундуков и микро-процентов характеристик
    (+1% к шансу крита), не меняющих физику удара.
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - 'Осязаемый физический импульс от ударов и пинков: каждый контакт ноги, биты или
    кинетического выстрела мгновенно переводит противника в состояние активного Rapier3D
    рэгдолла с передачей направленного вектора силы.'
  - 'Цепные столкновения (домино-эффект): отлетающий враг обязан наносить урон и сбивать
    с ног других противников и разрушать препятствия на траектории своего полёта.'
  - 'Вид от первого лица с выразительным импактом: видимая нога при пинке, оружие
    в руках и кинетический пистолет с микро-задержкой камеры (hit-stop 60 мс) и эффектом
    сокрушительного удара.'
  - 'Ринг-аут и интерактивные границы арены: возможность сбрасывать врагов за борт
    в пропасть или впечатывать в разрушаемые ограждения как ключевой источник тактического
    преимущества.'
  signature_scene: 'Снимок от первого лица на краю сияющей неоном платформы парящего
    казино под углом 85 градусов: правый тяжелый ботинок игрока застыл в финальной
    фазе удара ''спартанский кик'', впечатанный в грудь светящегося золотом киборга-громилы.
    Корпус противника согнут от колоссального импульса, вокруг грудины вспыхивает
    яркое кольцо шейдерных частиц и брызг неонового масла. На заднем плане сбитые
    его телом двое рядовых бойцов в рэгдолле пробивают стеклянное ограждение, сотни
    сияющих осколков зависли в контровом свете неоновых вывесок, а за разрушенным
    парапетом открывается бездонная панорама ночного мегаполиса с пролетающими трассирующими
    огнями аэромобилей.'
  avoid_references:
  - Vampire Survivors / Brotato (запрет авто-атаки и пассивного выживания)
  - Dark Messiah of Might and Magic (запрет копирования средневекового темного фэнтези
    и комплексного инвентаря)
  - Anger Foot (запрет прямолинейного коридорного раннера на скорость реакции)
  - Superhot (запрет механики остановки времени при неподвижности)
  - Paint the Town Red (запрет воксельного расчленения и статичной паб-песочницы)
knowledge_plan:
  selections:
  - path: patterns/arena_combat_loop.md
    role: core
    reason: Задает структуру сессии из 4 нарастающих волн киборгов с выбором улучшений
      и финальным боссом на палубе дирижабля.
  - path: threejs/melee_combat_and_ragdoll.md
    role: core
    reason: Обеспечивает физику спартанского пинка от первого лица, микро-задержку
      hit-stop и мгновенный перевод киборгов в рэгдолл.
  - path: threejs/fps_controller_and_shooting.md
    role: core
    reason: Реализует управление камерой от первого лица, тактический рывок у края
      платформы и отдачу акустического бластера.
  - path: threejs/physics_integration.md
    role: core
    reason: Связывает мир Rapier3D с рендером Three.js для точной синхронизации летящих
      тел и разрушаемых объектов арены.
  - path: stack/rapier3d.md
    role: core
    reason: Необходим для расчета физических импульсов ударов, массы тяжелых киборгов,
      гравитации падения в бездну и рикошетов.
  - path: mechanics/ragdoll.md
    role: core
    reason: Управляет поведением сочлененных тел киборгов при сильных ударах и их
      кинематическим падением за пределы платформы.
  - path: mechanics/chain_reaction.md
    role: core
    reason: Реализует передачу импульса соударений между телами врагов по принципу
      физического кегельбана.
  - path: threejs/procedural_character_rig.md
    role: core
    reason: Создает выразительные процедурные low-poly модели киборгов-мафиози и бронированного
      босса с ригом и позами.
  - path: threejs/juice_and_vfx_pool.md
    role: core
    reason: Дает сочный импакт через динамическую тряску камеры, вспышки ударов, кик-кадры
      и частицы разлетающихся фишек казино.
  - path: threejs/game_map_and_world_design.md
    role: core
    reason: Позволяет процедурно собрать компактную парящую арену казино-дирижабля
      с открытыми краями для ринг-аута.
  - path: threejs/adaptive_quality.md
    role: supporting
    reason: Автоматически адаптирует разрешение и нагрузку на мобильных устройствах
      во время массовых рэгдолл-столкновений.
  - path: threejs/procedural_mesh_builder.md
    role: supporting
    reason: Генерирует процедурную мебель казино, столы, ящики и стеклянные парапеты
      без внешних 3D-ассетов.
  - path: mechanics/physics_destruction.md
    role: supporting
    reason: Отвечает за физическое разрушение стеклянных витрин и заграждений телами
      врагов, расширяя зону сброса за борт.
  - path: mechanics/wave_contract.md
    role: supporting
    reason: Описывает логику спавна 4 волн киборгов с эскалацией сложности и появлением
      босса-вышибалы.
  - path: audio/procedural_sound_synthesizer.md
    role: supporting
    reason: Синтезирует звуки мощных пинков, звона бьющегося стекла и кинетических
      выстрелов без загрузки аудиофайлов.
  - path: audio/web_audio_and_muting.md
    role: supporting
    reason: Обеспечивает корректную инициализацию Web Audio по клику и глушение звука
      при сворачивании вкладки.
  - path: monetization/rewarded_ads_patterns.md
    role: supporting
    reason: Интегрирует вознаграждаемую рекламу для получения бонусов между волнами
      или второго шанса при падении.
  - path: monetization/interstitial_best_practices.md
    role: supporting
    reason: Регулирует показ межстраничной рекламы в паузах между контрактами без
      прерывания динамичного боя.
