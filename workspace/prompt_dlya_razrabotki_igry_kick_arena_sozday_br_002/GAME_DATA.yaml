      дождь за стеклом.'
    spectacle: 'Вид от первого лица: игрок подсечкой и пинком подбрасывает ниндзя-киборга
      на три метра вверх, в прыжке добивает его шестом в такт вспышке бита, а звуковой
      выстрел из левой руки запускает врага как живой снаряд во вторую группу нападающих.'
    why_not_generic: 'Связка механик каталога: mechanics/juggle_combo.md (физическое
      жонглирование телами в воздухе с модификатором урона), mechanics/rhythm_sync.md
      (синхронизация физических импульсов и эффектов с таймингом Web Audio API) и
      mechanics/card_synergy.md (синергия стихийных карт улучшений: Shockwave, Bounce,
