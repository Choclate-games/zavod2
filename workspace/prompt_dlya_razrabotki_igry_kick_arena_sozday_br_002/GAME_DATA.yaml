    Золотистая контурная подсветка интерактивных предметов при наведении взгляда (на
    дистанции до 2.5 м), мощный виброотклик при броске.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: edge_tension_footwork (Балансирование у края и тактический рывок)
  category: Регулятор позиционного риска и инструмент пространственного доминирования
    (Positional Risk & Evasion Engine).
  priority: secondary
  description: Край платформы здесь является не просто невидимой стеной или зоной
    мгновенной смерти, а высокорисковой тактической зоной с механикой буфера падения
    (Coyote Time) и аэродинамическим сопротивлением.
  player_interaction: 'ПК: Клавиша Shift — направленный рывок (Dash) по вектору движения
    WASD; Двойное нажатие направления. Мобильные: Свайп в любую сторону по левой половине
    экрана.'
  feedback: 'Визуал/VFX: Хроматический аберрационный шлейф за экраном при рывке, неоновые
    полосы скорости (speedlines) и пульсирующая алая виньетка опасности при приближении
    к краю (< 1.2 м).; Звук (Web Audio): Резкий пневматический выхлоп сервоприводов
    ботинок (пшик высокого давления) и нарастающий свист ураганного высотного ветра
    в ушах.; Камера: Динамический крен камеры в сторону маневра (strafe roll ±3.5°),
    кратковременный скачок FOV (75° -> 86° на 0.2 с) для подчеркивания ускорения.;
    UI/Тактильность: Двойной короткий виброотклик при успешном отталкивании от кромки
    обрыва (Coyote Jump) и мерцающий предупреждающий значок «EDGE WARNING».'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
gameplay_systems:
- name: Система физики Rapier3D и рэгдолла
  purpose: Обеспечение честной симуляции твердых тел, перехода персонажей из кинематического
    состояния в рэгдолл и расчета цепных импульсов при ударах.
  input: Векторы ударов игрока, точки контакта коллизий, скорость движения тел.
  rules:
  - При получении кинетического импульса > 80 Н*с персонаж мгновенно переходит из
    CharacterController в Ragdoll
  - Рэгдолл состоит из 6 шарнирных тел (торс, голова, руки, ноги), связанных Revolute/Ball-сочленениями
  - Тело в рэгдолле сохраняет статус снаряда и наносит урон другим телам при относительной
    скорости > 4 м/с
  - При падении ниже координаты Y = -10 тело уничтожается, регистрируя событие Ring-Out
  state:
  - KinematicControlled
  - RagdollActive
  - RagdollGroundedRecovering
  - DespawnedRingout
  interactions: Взаимодействует с системой оружия, системой разрушаемого окружения
    и счетчиком очков.
  feedback: Hit-stop 60 мс, частицы брызг неонового масла, звуки ударов и хруста металла.
  edge_cases:
  - Предотвращение туннелирования сквозь барьеры включением CCD (Continuous Collision
    Detection) для высокоскоростных тел
  - Ограничение максимального числа одновременных рэгдоллов до 8 тел для сохранения
    стабильных 60 FPS на мобильных устройствах
- name: Система контрактных волн и комбо-рейтинга
  purpose: Управление спавном врагов по 4 волнам контракта, отслеживание условий победы
    и расчет множителя наград за ринг-ауты.
  input: События уничтожения врагов, таймер контракта, типы ринг-аутов и комбо-серии.
  rules:
  - 'Контракт состоит ровно из 4 волн: 1 (6 лакеев), 2 (6 лакеев + 4 прыгуна), 3 (8
    лакеев + 4 прыгуна + 3 громилы), 4 (Босс + 4 стрелка)'
  - Новая волна начинается после полной зачистки предыдущей и выбора модификатора
  - 'Множитель комбо растет за сбитых врагов в течение 3 секунд: x1 -> x2 -> x3 ->
    x4 -> x5 (MAX)'
  - Ринг-аут дает +100% к базовой награде фишек по сравнению с обычным добиванием
  state:
  - WavePreparing
  - WaveActive
  - UpgradeSelectionModal
  - ContractVictory
  - ContractDefeat
  interactions: Взаимодействует со спавнерами арены, HUD-счетчиками и магазином улучшений.
  feedback: Звуковой сигнал тревоги сирены казино, всплывающие неоновые плашки комбо
    'STRIKE x3', салют победы.
  edge_cases:
  - Если враг застрял на недосягаемой возвышенности более 10 секунд, срабатывает кинетический
    импульс авто-сброса
  - При одновременной гибели игрока и последнего врага победа засчитывается игроку
- name: Система разрушаемого окружения
  purpose: 'Обеспечение интерактивности арены: разрушение стеклянных ограждений, столов
    рулетки, бочек и разлет сотен осколков и фишек.'
  input: Коллизии тел и оружия с объектами арены с кинетической энергией > порога
    прочности.
  rules:
  - Стеклянные ограждения ломаются при ударе телом со скоростью > 5 м/с, открывая
    новые зоны для ринг-аута
  - Столы рулетки при ударе разламываются на 2 части и выбрасывают фонтан из 20 физических
    фишек казино
  - Искрящие распределительные щитки при ударе генерируют электро-вспышку, оглушающую
    врагов в радиусе 3 метров на 2 секунды
  - Все осколки и фишки используют легковесный инстансинг Three.js (InstancedMesh)
    без физических коллайдеров
  state:
  - Intact
  - Cracked
  - DestroyedDebris
  interactions: Взаимодействует с рэгдолл-телами, системой частиц и звуковым менеджером.
  feedback: Звон разбивающегося каленого стекла, разлет искр и фишек, вспышки неонового
    света.
  edge_cases:
  - Осколки стекла автоматически растворяются через 3.5 секунды для освобождения видеопамяти
  - Игрок не может застрять в обломках стола благодаря отключению коллизий у мелкого
    мусора
- name: Система координации и ИИ толпы
  purpose: Управление тактическим поведением врагов, предотвращение их скучивания
    в одну точку и организация скоординированных атак.
  input: Позиция игрока, геометрия арены, статус края платформы, тип противника.
  rules:
  - Лакеи идут прямо на игрока, пытаясь нанести быстрый удар дубинкой
  - Прыгуны держат дистанцию 5 метров и совершают резкие выпады с флангов
  - Тяжелые киборги закрываются щитом спереди и медленно вытесняют игрока к краю арены
  - Враги избегают открытых краев платформы, если не находятся под действием кинетического
    импульса
  - Не более 3 врагов могут атаковать игрока в ближнем бою одновременно (система атакующих
    слотов)
  state:
  - FlockingApproach
  - CirclingFlank
  - AttackWindup
  - HitStunned
  - RagdollLaunched
  interactions: Взаимодействует с физическим контроллером, хитбоксами атак и звуками
    рычания киборгов.
  feedback: Световая смена цвета глаз врагов на ярко-красный при подготовке удара,
    звуковые выкрики.
  edge_cases:
  - Если враг оказывается в воздухе над пропастью, его ИИ мгновенно отключается и
    активируется рэгдолл свободного падения
core_design:
  signature_moment: Игрок на полном спринте разгоняется по краю парящего дирижабля,
    наносит сокрушительный спартанский пинок в грудь 300-килограммового золотого киборга,
    от которого тот в рапиде сминает троих охранников, с треском проламывает панорамную
    витрину бара казино и вся четверка кубарем в рэгдолле улетает в бездну ночного
    неонового мегаполиса под оглушительный звон стекла, победный взрыв тысяч золотых
    фишек и саб-басовый панч.
  genre_template_rejected: 'Осознанно отвергнут шаблон классического арена-слэшера
    / beat ''em up с закликиванием полосок здоровья врагов (health sponge / DPS race),
    сложными комбо-листами из десятков кнопок и блокированием ударов мечом. В «Вышибале»
    HP противников вторично: ключевой метрикой является их физическая масса, инерция
    и пространственное положение относительно края палубы. Игрок побеждает не миллионами
    урона, а кинетическим расчетом векторов, рикошетами тяжелых тел и безжалостным
    сбросом в бездну (Ring-Out). Отсутствует шкала выносливости (stamina bar) и ваншоты
    игрока от случайных пуль, чтобы поддерживать драйвовый темп непрерывного сближения
    и пинков.'
  what_makes_it_different: В отличие от Anger Foot (коридорный забег с ваншотом игрока
    от первой пули) и Paint the Town Red (воксельный мордобой на закрытой плоской
    арене), в «Вышибале» действие разворачивается на открытой палубе парящего дирижабля
    с честной физикой Rapier3D, где главное оружие — не пули и не урон, а передача
    кинетической энергии через тела врагов (кегельбан) и целенаправленное выбивание
    противников в пропасть через разрушаемые стеклянные парапеты.
  micro_loop:
  - step: Сканирование угла сброса и дистанции до края
    player_action: Оценка позиции киборга относительно края палубы дирижабля и целостности
      ближайших перил.
    game_response: Отображение дистанции до обрыва, динамическая подсветка траектории
      полета врага при наведении прицела.
    decision: 'Выбрать траекторию сближения: по прямой к обрыву или по диагонали в
      сторону стеклянного парапета.'
    duration: 0.8 с
  - step: Спринтерский разгон и выбор кинетического вектора
    player_action: Вход в спринт (Shift + W) по направлению к намеченной цели с выравниванием
      вектора удара.
    game_response: Увеличение FOV с 75° до 84°, свист набегающего встречного ветра,
      появление неонового шлейфа под ногами.
    decision: Провести мгновенный пинок с места или набрать спринт для получения +45%
      кинетического импульса.
    duration: 0.4 с
  - step: Сокрушительный спартанский пинок с хит-стопом
    player_action: Нажатие клавиши Пробел (Space) в момент сближения на дистанцию
      2.0 метра.
    game_response: Микро-заморозка кадра (хит-стоп 0.06 с), саб-басовый ударный звук,
      переход модели врага в рэгдолл Rapier3D.
    decision: Ударить точно в грудь для прямого полета или подсечь по ногам для запуска
      врага по высокой дуге в бездну.
    duration: 0.2 с
  - step: Физический рэгдолл-кегельбан и сброс за борт
    player_action: Наблюдение за физическим полетом киборга-снаряда и цепным столкновением
      с группой охраны.
    game_response: Пробитие телом стеклянной витрины, каскадное сбивание двух стрелков,
      взрыв фишек и падение всех трех в бездну.
    decision: Переключить внимание на следующую цель или скорректировать полет первого
      врага акустическим выстрелом вдогонку.
    duration: 1.2 с
  - step: Перепозиционирование и уход от линии ответного огня
    player_action: Тактический рывок в сторону от края платформы и уклонение от выстрела
      вражеского снайпера.
    game_response: Восстановление кулдауна пинка (0.45 с), обновление счетчика комбо-очков
      на HUD, реакция толпы казино.
    decision: Сделать рывок назад в безопасную зону или подобрать выбитую из рук врага
      титановую биту.
    duration: 0.6 с
  meso_loop:
  - step: Оценка состава волны и геометрии парапетов
    player_action: Оценка точек появления противников, их весовой категории и целостности
      защитных ограждений арены.
    game_response: Голографическая сирена волны, открытие спавн-шлюзов казино, визуальная
      подсветка типов прибывших киборгов.
    decision: Сфокусироваться на пробитии ближайшего стеклянного парапета или занять
      позицию у уже открытого края палубы.
    duration: 4.0 с
  - step: Зачистка легких кибер-мафиози и разгон комбо
    player_action: Серия спартанских пинков и рывков, быстрый сброс легкой пехоты
      за борт для накопления заряда комбо-множителя.
    game_response: Взрывной переход врагов в рэгдолл, каскадные столкновения, звон
      осыпающихся золотых фишек и рост комбо-рейтинга.
    decision: Сбрасывать лакеев поодиночке или собрать их в плотную группу для запуска
      цепного страйка в тяжелого киборга.
    duration: 22.0 с
  - step: Устранение тяжелых киборгов и пробитие витрин
    player_action: Нейтрализация бронированных киборгов сбиванием баланса акустическим
      бластером и силовым броском мебели.
    game_response: Разрушение брони, переход громилы в состояние стаггера (шаткость),
      критический звук пробития защиты.
    decision: Швырнуть в громилу рулеточный стол для сбивания щита или зайти со спины
      через уворот на краю обрыва.
    duration: 20.0 с
  - step: Подведение итогов волны и сбор наград
    player_action: Добивание последних врагов, сбор рассыпанных золотых фишек VIP-казино
      и фиксация ранга зачистки (S/A/B).
    game_response: Кратковременное затишье, падение золотого дождя фишек, вывод статистики
      волны (время, % ринг-аутов, очки).
    decision: Подобрать фишки в центре палубы или занять выгодную позицию у шлюза
      до начала следующей волны.
    duration: 5.0 с
  - step: Тактический физический апгрейд волны
    player_action: Выбор 1 из 3 тактических физических перков в голографическом терминале
      дирижабля.
    game_response: Мгновенное применение перка к физическому движку Rapier3D, визуальное
      обновление эффекта свечения подошв.
    decision: Выбрать модификатор на чистый импульс пинка (+40%), рикошет тел от стен
      или сквозной акустический выстрел под грядущего босса.
    duration: 10.0 с
  macro_loop:
  - step: Подготовка снаряжения и выбор контракта
    player_action: Осмотр арсенала в VIP-лобби казино, выбор активных ботинок и оружия
      ближнего боя перед спуском на палубу.
    game_response: Отображение экипированного билда в неоновом зеркале гардероба,
      обновление физических параметров массы и импульса.
    decision: Выбрать тяжелые бутсы с бонусом к массе пинка или легкие спринтерские
      ботинки с двойным рывком под тип контракта.
    duration: 30.0 с
  - step: Прохождение контрактной сессии на палубе дирижабля
    player_action: 'Выполнение 4 волн контракта: зачистка кибер-мафии пинками, акустическими
      выстрелами и сбросом в бездну.'
    game_response: Динамический спавн 4 нарастающих волн киборгов, разрушение парапетов
      дирижабля, появление босса «Магната».
    decision: Атаковать агрессивно у самого обрыва ради комбо x5 или заманивать врагов
      к центру для безопасного броска мебели.
    duration: 3.5 мин
  - step: Завершение контракта и фиксация рейтинга
    player_action: Нанесение финального пинка боссу сквозь панорамное стекло палубы
      и просмотр экрана триумфа контракта.
    game_response: Взрыв золотых фишек из поверженного босса, замедление времени,
      подсчет % сброшенных за борт врагов и выдача награды.
    decision: Оценить эффективность текущего билда физических перков и решить, какие
      характеристики усилить в мета-прогрессии.
    duration: 10.0 с
  - step: Мета-прогрессия и кастомизация вышибалы
    player_action: Трата заработанных золотых VIP-фишек на разблокировку 6 видов оружия,
      5 модификаторов и 8 стилей ботинок.
    game_response: Разблокировка новых слотов модификаций, повышение базовых статов
      вышибалы, визуальное обновление неонового свечения ботинок.
    decision: Инвестировать фишки в абсолютный импульс пинка, разблокировку титановой
      биты или перманентное сопротивление отдаче.
    duration: 45.0 с
  loop_diagram: "+-----------------------------------------------------------------------------------+\n\
    |                           МАКРО-ПЕТЛЯ: VIP-КОНТРАКТ (3.5 МИН)              \
    \        |\n|  [VIP-Лобби: выбор ботинок/оружия] -> [Высадка на дирижабль] ->\
    \ [4 Волны Арены]  |\n|         ^                                            \
    \                     |       |\n|         |-- [Мета-прокачка: титан, перки, бутсы]\
    \ <-- [Сброс Босса / Золотые фишки] |\n+-----------------------------------------------------------------------------------+\n\
    \                                         |\n                                \
    \         v\n+-----------------------------------------------------------------------------------+\n\
    |                        МЕЗО-ПЕТЛЯ: ЭСКАЛАЦИЯ ВОЛНЫ (45-60 СЕК)             \
    \       |\n|  [Оценка спавна и перил] -> [Зачистка лакеев] -> [Пробитие стекла]\
    \ -> [Громилы]  |\n|         ^                                               \
    \                  |       |\n|         |------ [Выбор 1 из 3 тактических физических\
    \ перков] <------------|       |\n+-----------------------------------------------------------------------------------+\n\
    \                                         |\n                                \
    \         v\n+-----------------------------------------------------------------------------------+\n\
    |                      МИКРО-ПЕТЛЯ: СЕКУНДНЫЙ КИНЕТИЧЕСКИЙ УДАР (1-3 СЕК)    \
    \       |\n|                                                                 \
    \                  |\n|     +------------------+         +--------------------+\
    \                           |\n|     |  ПОЗИЦИОНИРОВАНИЕ| ------> |  СПРИНТ-СБЛИЖЕНИЕ\
    \  |                           |\n|     |  (угол к обрыву) |         |  (набор\
    \ импульса)  |                           |\n|     +------------------+       \
    \  +--------------------+                           |\n|               ^     \
    \                       |                                      |\n|          \
    \     |                            v                                      |\n\
    |     +------------------+         +--------------------+                    \
    \       |\n|     | ПЕРЕДАЧА ИМПУЛЬСА| <------ |  СПАРТАНСКИЙ ПИНОК |         \
    \                  |\n|     |  (РЭГДОЛЛ-СТРАЙК)|         |  (хит-стоп 0.06 с)\
    \ |                           |\n|     +------------------+         +--------------------+\
    \                           |\n|               |                             \
    \                                      |\n|               v                  \
    \                                                 |\n|     +-------------------------------------------------+\
    \                           |\n|     | СБРОС ЗА БОРТ + ЗВОН ФИШЕК + КОМБО-МНОЖИТЕЛЬ\
    \ x3 |                           |\n|     +-------------------------------------------------+\
    \                           |\n+-----------------------------------------------------------------------------------+"
  tension_curve: 'Волна 1 (0:00–0:45) — Эйфория и легкость: напряжение низкое (2/10),
    игрок упивается силой спартанского пинка, с легкостью отправляя 6 слабых лакеев
    за борт одного за другим.

    Волна 2 (0:45–1:40) — Нарастание позиционной угрозы: напряжение среднее (5/10),
    появление быстрых прыгунов заставляет оглядываться и маневрировать на краю палубы,
    избегая ударов в спину.

    Волна 3 (1:40–2:45) — Тактическое давление и риск: напряжение высокое (8/10),
    спавн 3 тяжелых киборгов весом 300 кг и разрушение большинства перил превращают
    палубу в смертоносный обрыв; цена ошибки — собственное падение в пропасть.

    Волна 4 (2:45–3:45) — Пиковый накал и триумфальный катарсис: напряжение максимальное
    (10/10) во время дуэли с бронированным боссом «Магнатом» под шквальным огнем стрелков,
    сменяющееся взрывом триумфа (0/10) в момент решающего пинка босса сквозь стекло
    в бездну.'
  core_formulas:
  - 'Impulse_kick = (V_kick * BaseMass_player * (1.0 + SprintBonus * 0.45) * PerkMultiplier)
    / TargetMass; где V_kick = 18.0 м/с, BaseMass_player = 95 кг, SprintBonus = 1.0
    (при спринте) или 0 (на месте), PerkMultiplier = [1.0..1.8] от тактических перков.
    Итоговый импульс с разбега: 2470 Н*с, отправляющий легкого лакея (70 кг) в полет
    со скоростью 35.2 м/с на дистанцию до 14 метров.'
  - Impulse_transferred = Target1_Velocity * Mass_Target1 * 0.75 * cos(CollisionAngle);
    при Impulse_transferred >= 120 кг*м/с вторичная цель принудительно переходит в
    рэгдолл Rapier3D и получает импульс сбивания. Позволяет 300-килограммовому киборгу
    сбивать до 4 лакеев позади себя по принципу кегельбана.
  - 'Damage_impact = clamp((ImpactSpeed - 4.0)^1.8 * 8.5 * SurfaceHardness, 0, 450);
    где ImpactSpeed — скорость врезания тела в препятствие (м/с), SurfaceHardness:
    бетонная колонна = 1.5, стальной борт = 1.0, стеклянный парапет = 0.4 (при уроне
    > 150 ед. стекло проламывается и открывает сквозной ринг-аут).'
  - Chips_reward = BaseEnemyChips * (1.0 + RingOutBonus * 1.5) * min(ComboMultiplier,
    5.0); где BaseEnemyChips = [10, 25, 60, 250], RingOutBonus = 1 (при сбросе в пропасть)
    или 0 (при гибели на палубе), ComboMultiplier = 1.0 + (ConsecutiveRingOuts * 0.35)
    при интервале между сбросами < 3.2 с. Мотивирует сбрасывать врагов за борт непрерывными
    сериями.
  - Boss_Poise_Damage = (ImpactForce / 100.0) + (ThrownObjectMass * ObjectVelocity
    * 0.12); шкала устойчивости босса = 500 ед. При падении устойчивости до 0 босс
    на 2.2 с теряет баланс (Stagger State), во время которого любой спартанский пинок
    гарантированно переводит его в рэгдолл и сбрасывает с палубы.
  run_progression:
  - 'Волна 1: Выбор базового перка мобильности («Пневмо-рывок: сокращение кулдауна
    на 25%» или «Титановый носок: +30% базовый импульс пинка»). Позволяет мгновенно
    зачищать легких лакеев.'
  - 'Волна 2: Выбор перка взаимодействия с окружением («Осколочный шторм: осколки
    разбитого стекла наносят 80 урона вокруг» или «Магнитный ботинок: брошенные столы
    летят на 40% быстрее»).'
  - 'Волна 3: Выбор перка цепных реакций («Голографический бильярд: +50% сохранение
    импульса при столкновении тел» или «Акустический резонанс: бластер пробивает врагов
    насквозь»). Подготовка к тяжелым киборгам.'
  - 'Волна 4 (Финал): Финальный боевой овердрайв («Ударный импульс Титана: пинок с
    разбега игнорирует устойчивость босса и сбивает его щит с одного удара»).'
  meta_progression:
  - 'Арсенал вышибалы: разблокировка 6 видов контактного оружия за фишки (Титановая
    бита с кинетическим бустом, Свинцовая труба с широким замахом 140°, Полицейский
    шокер-дубинка, Кибер-молот с грави-ударом, Разводной ключ мафиози, Двуручный топор
    вышибалы).'
  - 'Коллекция реактивных ботинок: 8 неоновых стилей обуви с уникальными физическими
    модификаторами (Титановые гриндеры — +35% к массе удара; Спринтерские турбо-бутсы
    — двойной рывок; Магнитные подошвы — иммунитет к сдуванию ветром у края; Грави-кроссовки
    — повышенная дуга полета врагов).'
  - 'Постоянные модификаторы тела киборга-вышибалы (5 уровней прокачки): Укрепление
    сервоприводов (+HP и масса), Стабилизатор инерции (снижение отдачи при ударе),
    Конденсатор бластера (ускорение перезарядки на 30%), Магнит фишек (автоматический
    сбор с расстояния 6 м).'
  - 'Контракты казино: открытие 3 парящих локаций (Открытая палуба дирижабля «Атлант»,
    VIP-зал с панорамным куполом над облаками, Крыша пентхауса Нео-Вегаса с вертолетной
    площадкой).'
  mechanics:
  - name: spartan_kick_ringout (Спартанский кинетический пинок за борт)
    role_in_loop: Главный двигатель кор-геймплея и основной источник тактильного удовлетворения
      (Primary Kinaesthetic Driver).
    player_decision: Пнуть врага прямо сейчас с места для создания дистанции или рискнуть,
      набрав спринт в сторону обрыва, чтобы нанести сокрушительный удар с максимальным
      вектором полета.
    input_mapping: 'ПК: Пробел (Space) — мгновенный пинок; Shift + Пробел — пинок
      с разбега с максимальным импульсом. Мобильные: Выделенная кнопка с иконкой тяжелого
      ботинка в правом нижнем углу экрана.'
    states:
    - IDLE (готов к удару) -> WINDUP (вынос ноги 0.12 с) -> HIT_CHECK (трассировка
      луча 2.2 м) -> HITSTOP (заморозка кадра 0.06 с при контакте) -> RECOVERY (возврат
      ноги 0.27 с) -> COOLDOWN (0.45 с)
    parameters:
    - name: Длительность замаха (Windup)
      value: 0.12 с
      tuning_note: При увеличении > 0.25 с теряется взрывная реактивность аркадного
        экшена; при уменьшении < 0.05 с анимация ноги превращается в нечитаемый телепорт.
    - name: Длительность хит-стопа (Hitstop)
      value: 0.06 с
      tuning_note: Если убрать до 0 с, пропадает ощущение сокрушительной физической
        массы; если поднять > 0.12 с, игра ощущается зависающей.
    - name: Базовый импульс пинка (Base Impulse)
      value: 450 Н*с
      tuning_note: При снижении < 250 Н*с враги не долетают до края арены (5-7 м);
        при завышении > 800 Н*с рэгдолл улетает слишком быстро без возможности оценить
        полет.
    - name: Бонус импульса от спринта (Sprint Multiplier)
      value: +45% импульса
      tuning_note: Если сделать < 15%, игрок перестает использовать разбег; если >
        70%, пинок с места становится абсолютно бесполезным.
    - name: Кулдаун удара (Kick Cooldown)
      value: 0.45 с
      tuning_note: Меньше 0.2 с провоцирует бездумный спам одной кнопки; больше 0.8
        с делает игрока беззащитным против быстрых прыгунов.
    - name: Дистанция поражения (Reach)
      value: 2.2 м
      tuning_note: Меньше 1.5 м приводит к постоянным промахам в динамике; больше
        3.0 м ощущается неестественным бесконтактным телекинезом.
    feedback_layers:
    - 'Визуал/VFX: Резкий выброс ноги с титановым носком в центр экрана, коническая
      неоновая ударная волна (shockwave бело-голубого цвета), шлейф преломления воздуха
      и фонтан золотых искр при контакте.'
    - 'Звук (Web Audio): Синтезированный саб-басовый панч (свип 130 Гц -> 35 Гц за
      80 мс), хруст сервоприводов киборга и звонкий металлический лязг подошвы о броню.'
    - 'Камера: Мгновенный толчок камеры вперед (FOV 75° -> 69° за 0.05 с с пружинящим
      возвратом), легкий голландский угол наклона (roll 2.8°) и радиальный блюр по
      краям экрана.'
    - 'UI/Тактильность: Короткий резкий виброимпульс (45 мс, сила 0.95), всплывающий
      неоновый маркер вектора отлета и вспышка счетчика комбо над прицелом.'
    failure_mode: 'Игрок промахивается по движущемуся прыгуну из-за неверной дистанции
      (> 2.2 м) или пинает тяжелого киборга в лоб без разбега. Сигнал: глухой металлический
      лязг рикошета, анимация застревания ноги (recoil stumble на 0.25 с) и контратака
      врага.'
    mastery_curve: На 30-й секунде новичок хаотично пинает врагов в упор, рискуя упасть
      сам; к 10-му забегу эксперт рассчитывает вектор с разбега под углом 35° к стеклу,
      отправляя одного киборга рикошетом в двух стрелков и выбивая тройной ринг-аут
      одним ударом.
    counterplay: 'Тяжелые золотые киборги (300 кг) имеют повышенную инерцию: фронтальный
      пинок с места лишь слегка сдвигает их на 0.8 м. Игроку необходимо предварительно
      сбить их баланс акустическим выстрелом или нанести пинок в спину на полном спринте.'
    synergies:
    - chain_ragdoll_bowling (запускает первое тело в цепную реакцию), environment_shatter_and_throw
      (пробивает телом парапет), edge_tension_footwork (комбинируется со спринтом
      и рывком).
    why_unique: В отличие от большинства FPS-игр, где пинок является второстепенным
      тычком для отталкивания, здесь это главное летальное оружие, использующее полноценную
      физику рэгдолла Rapier3D с расчетом массы и угла возвышения траектории.
    pseudocode: "function onTickKick(input, player, physicsWorld) {\n  if (input.isJustPressed('Kick')\
      \ && player.kickCooldownTimer <= 0) {\n    player.state = 'KICKING';\n    player.kickCooldownTimer\
      \ = 0.45;\n    const ray = new Ray(player.cameraPos, player.forwardVector, 2.2);\n\
      \    const hit = physicsWorld.castRay(ray, { group: ENEMY_HITBOX });\n    if\
      \ (hit) {\n      triggerHitstop(0.06);\n      const sprintBonus = player.isSprinting\
      \ ? 1.45 : 1.0;\n      const impulseVec = player.forwardVector.clone().add(new\
      \ Vector3(0, 0.25, 0)).normalize().multiplyScalar(450 * sprintBonus);\n    \
      \  hit.enemy.activateRagdoll();\n      hit.enemy.rigidBody.applyImpulse(impulseVec,\
      \ hit.point);\n      spawnVFX('kick_shockwave', hit.point);\n      playAudio('kick_impact_sub');\n\
      \      applyCameraImpulse({ fovKick: -6, roll: 2.8, duration: 0.12 });\n   \
      \ }\n  }\n}"
  - name: chain_ragdoll_bowling (Цепной кегельбан рэгдоллов)
    role_in_loop: Главный мультипликатор эффективности и источник комбо-награды (Crowd
      Control & Multiplier Engine).
    player_decision: Выбрать в качестве первичной цели легкого лакея для быстрого
      запуска по высокой дуге или тяжелого киборга для создания разрушительного низколетящего
      тарана.
    input_mapping: Пассивная физическая механика, активируемая любым кинетическим
      воздействием на тела врагов (пинок, выстрел, бросок мебели).
    states:
    - INERT (враг на ногах) -> AIRBORNE_PROJECTILE (тело летит со скоростью > 8 м/с)
      -> IMPACT_CASCADE (соударение с передачей энергии) -> SLIDING (скольжение по
      полу) -> RECOVERY_GETUP (подъем на ноги через 2.4 с)
    parameters:
    - name: Коэффициент сохранения импульса (Momentum Transfer)
      value: 75% энергии
      tuning_note: Если снизить < 50%, цепная реакция затухает на первой же цели;
        если поднять > 90%, один пинок очищает всю арену хаотичным домино.
    - name: Порог сбивания с ног (Knockdown Threshold)
      value: 120 кг*м/с
      tuning_note: При значении > 180 кг*м/с вторичные враги перестают падать; при
        < 60 кг*м/с малейшее касание роняет всю толпу, обесценивая силу удара.
    - name: Время нахождения в рэгдолле (Ragdoll Duration)
      value: 2.4 с до подъема
      tuning_note: Меньше 1.5 с — враги встают слишком мгновенно; больше 4.0 с — арена
        превращается в пассивное избиение лежачих манекенов.
    - name: Бонусный множитель комбо (Strike Multiplier)
      value: x1.5 за каждое тело
      tuning_note: 'Определяет ценность геометрического расчета: каждый сбитый враг
        в цепочке увеличивает награду золотыми фишками на +50%.'
    feedback_layers:
    - 'Визуал/VFX: Яркие вспышки неоновых искр в точках соударения тел, деформация
      скелетов киборгов, автоматический micro slow-mo (0.25x на 0.18 с) при одновременном
      сбивании 3+ противников («STRIKE!»).'
    - 'Звук (Web Audio): Сочный бильярдный щелчок соударения тяжелых металлических
      корпусов («CLACK-CRUNCH») с нарастающей высотой тона для каждого последующего
      сбитого врага.'
    - 'Камера: Горизонтальный высокочастотный шейк камеры (амплитуда 0.4, частота
      30 Гц) синхронно с каждым вторичным ударом тел в толпе.'
    - 'UI/Тактильность: Каскадная серия коротких микро-вибраций (по 20 мс на каждый
      контакт), динамический счетчик комбо «RAGDOLL STRIKE x3» с множителем фишек.'
    failure_mode: 'Запущенное тело врезается в массивную бетонную колонну в центре
      зала под прямым углом, полностью погасив кинетическую энергию без поражения
      врагов. Сигнал: глухой стук о бетон, осыпание штукатурки и надпись «MOMENTUM
      LOST».'
    mastery_curve: Новичок сбивает максимум одного случайного врага; эксперт использует
      тяжелых 300-килограммовых киборгов как гигантские бильярдные шары, направляя
      их по диагонали через всю палубу для зачистки целой шеренги стрелков.
    counterplay: Враги-прыгуны при падении союзника мгновенно совершают боковой перекат
      (sidestep evade), избегая зоны поражения летящего тела, если оно запущено по
      предсказуемой прямой траектории.
    synergies:
    - spartan_kick_ringout (первичный импульс), acoustic_pulse_blaster (дополнительное
      ускорение летящего тела в воздухе), environment_shatter_and_throw (снос мебели
      летящими телами).
    why_unique: Вместо стандартного урона по площади (AOE explosion) игра использует
      честный физический расчет передачи количества движения жестких тел Rapier3D
      с учетом угла соударения и массы каждого киборга.
    pseudocode: "function onRagdollCollision(collidingBody, targetBody, contactPoint)\
      \ {\n  const relativeVelocity = collidingBody.linvel().sub(targetBody.linvel());\n\
      \  const impactMomentum = relativeVelocity.length() * collidingBody.mass();\n\
      \  if (impactMomentum >= 120.0) {\n    if (!targetBody.isRagdoll()) {\n    \
      \  targetBody.activateRagdoll();\n    }\n    const transferImpulse = relativeVelocity.normalize().multiplyScalar(impactMomentum\
      \ * 0.75);\n    targetBody.applyImpulse(transferImpulse, contactPoint);\n  \
      \  const chainHits = registerChainEvent(collidingBody.id, targetBody.id);\n\
      \    if (chainHits >= 3) triggerSlowMotion(0.25, 0.18);\n    spawnVFX('body_impact_sparks',\
      \ contactPoint);\n    playAudio('clack_metal_impact', { pitch: 1.0 + chainHits\
      \ * 0.15 });\n  }\n}"
  - name: acoustic_pulse_blaster (Кинетический акустический бластер)
    role_in_loop: Дистанционный тактический контроль и инициатор комбо-связок (Ranged
      Setup & Disruptor).
    player_decision: Потратить заряд на добивание и сброс снайпера с карниза или приберечь
      для гарантированного сбивания щита приближающегося тяжелого киборга.
    input_mapping: 'ПК: Правая кнопка мыши (ПКМ) — кинетический акустический выстрел.
      Мобильные: Кнопка со значком звуковой волны над зоной атаки.'
    states:
    - READY (3/3 заряда) -> FIRING (выброс волны 0.08 с) -> RECOIL (отдача 0.12 с)
      -> RECHARGING (восстановление 1.2 с на слот)
    parameters:
    - name: Кинетическая сила выстрела (Concussive Force)
      value: 280 Н*с
      tuning_note: Специально слабее пинка (450 Н*с), чтобы не вытеснять ближний бой,
        но достаточно для сбивания с ног стрелка на дистанции.
    - name: Количество зарядов конденсатора (Ammo Capacity)
      value: 3 заряда
      tuning_note: Больше 4 зарядов превращает игру в чистый тир; меньше 2 не позволяет
        выполнять связку «выстрел под ноги + рикошет в спину».
    - name: Время восстановления 1 заряда (Recharge Time)
      value: 1.2 с на заряд
      tuning_note: Меньше 0.6 с обесценивает контроль ресурсов; больше 2.0 с делает
        механику слишком редкой для короткой сессии.
    - name: Скорость акустического фронта (Wave Speed)
      value: 42.0 м/с
      tuning_note: 'Определяет упреждение: при 42 м/с волна летит мгновенно, но оставляет
        игроку визуальное ощущение летящего снаряда.'
    feedback_layers:
    - 'Визуал/VFX: Коническая лазурная ударная волна искажения пространства (refraction
      shader), неоновые кольца плотного воздуха и яркая вспышка на дуле бластера.'
    - 'Звук (Web Audio): Резкий электроакустический хлопок (высокочастотный щелчок
      2.2 кГц с переходом в саб-гул 50 Гц) и эхо отражения звука от стен казино.'
    - 'Камера: Легкая вертикальная отдача вверх и назад (pitch +1.8°, punch -0.04
      м) с быстрым затуханием за 0.12 с.'
    - 'UI/Тактильность: Голографический индикатор трех секторов заряда на левой руке
      персонажа, мягкая тактильная вибрация (30 мс) при восстановлении каждого сегмента.'
    failure_mode: 'Игрок расходует все 3 заряда в пустоту на дальней дистанции и остается
      без дистанционного сбивания перед готовящимся прыжком киборга. Сигнал: сухой
      щелчок разряженного конденсатора и красный мигающий индикатор на перчатке.'
    mastery_curve: Новичок использует бластер как слабый пистолет; мастер стреляет
      в пол под ноги набегающей группе для подброса их в воздух прямо перед спартанским
      пинком или стреляет в стену под углом 45° для сброса стрелка с невидимой позиции.
    counterplay: Стрелки на балконах и возвышенностях выставляют импульсные щиты,
      отражающие акустическую волну обратно в игрока, если выстрел произведен прямо
      в лоб без рикошета.
    synergies:
    - spartan_kick_ringout (подбрасывание врага в воздух для идеального удара ногой
      с лета), chain_ragdoll_bowling (придание дополнительного ускорения катящимся
      телам).
    why_unique: Снаряд не наносит прямого урона пулей, а передает чистую направленную
      акустическую ударную волну, способную рикошетить от поверхностей и сбивать баланс
      врагов без их мгновенного уничтожения.
    pseudocode: "function onTickBlaster(input, player, physicsWorld) {\n  if (input.isJustPressed('ShootBlaster')\
      \ && player.blasterCharges > 0) {\n    player.blasterCharges--;\n    player.rechargeTimer\
      \ = 1.2;\n    const origin = player.cameraPos.clone().add(player.rightVector.clone().multiplyScalar(0.25));\n\
      \    const dir = player.forwardVector;\n    createAcousticWave(origin, dir,\
      \ {\n      speed: 42.0,\n      force: 280.0,\n      maxBounces: 1,\n      onHit:\
      \ (target, hitNormal) => {\n        target.applyConcussiveImpulse(dir.multiplyScalar(280.0));\n\
      \        spawnVFX('acoustic_shock_ring', target.position);\n        playAudio('sonic_pulse_hit');\n\
      \      }\n    });\n    applyCameraImpulse({ pitch: 1.8, duration: 0.12 });\n\
      \  }\n}"
  - name: environment_shatter_and_throw (Крушение интерьера и силовой бросок)
    role_in_loop: Преобразователь геометрии арены и источник вариативного тяжелого
      урона (Arena Shaper & Heavy Artillery).
    player_decision: Использовать уцелевший стол как укрытие от выстрелов или швырнуть
      его в толпу для мгновенного пробития парапета и тройного сброса.
    input_mapping: 'ПК: Клавиша E — захват предмета / интеракция; ЛКМ/E при удерживании
      — силовой бросок по направлению взгляда; Q — сброс предмета под ноги. Мобильные:
      Контекстная кнопка захвата/броска над кнопкой атаки.'
    states:
    - FREE_OBJECT (предмет на палубе) -> GRABBED (удерживается перед игроком) -> THROWN
      (летит как снаряд со скоростью 24 м/с) -> IMPACT_SHATTER (раскалывание на обломки
      при контакте)
    parameters:
    - name: Порог пробития парапета (Glass Break Threshold)
      value: 350 Н*с
      tuning_note: Если занизить < 150 Н*с, перила ломаются от любого случайного шага;
        если завысить > 600 Н*с, даже полет тяжелого киборга не сможет пробить стекло.
    - name: Скорость полета брошенного предмета (Throw Velocity)
      value: 24.0 м/с
      tuning_note: При скорости 24 м/с предмет настигает убегающих стрелков и гарантированно
        опрокидывает их в рэгдолл.
    - name: Радиус захвата мебели (Pickup Radius)
      value: 2.2 м
      tuning_note: Меньше 1.4 м делает подбор предметов на бегу мучительным; больше
        3.5 м ощущается нелепым притягиванием сквозь стены.
    - name: Множитель урона мебели (Furniture Impact Mult)
      value: 2.5x урона
      tuning_note: Тяжелый предмет наносит в 2.5 раза больше кинетического урона,
        чем обычный удар кулаком, вознаграждая за использование окружения.
    feedback_layers:
    - 'Визуал/VFX: Взрывное разрушение стеклянного ограждения на сотни динамических
      стеклянных осколков с физикой, фонтан золотых фишек из разбитого стола и клубы
      неоновой пыли.'
    - 'Звук (Web Audio): Оглушительный хрустальный звон разбивающегося триплекса (диапазон
      3.5–10 кГц) и тяжелый глухой треск раскалывающегося дубового массива стола.'
    - 'Камера: Сильный низкочастотный шейк (амплитуда 0.65, затухание за 0.28 с) при
      пробитии парапета и сквозном открытии бездны.'
    - 'UI/Тактильность: Золотистая контурная подсветка интерактивных предметов при
      наведении взгляда (на дистанции до 2.5 м), мощный виброотклик при броске.'
    failure_mode: 'Брошенный стул попадает в неразрушимую несущую балку, отскакивает
      обратно и наносит игроку легкий стан (stagger на 0.3 с). Сигнал: глухой металлический
      звон и надпись «DEFLECTED».'
    mastery_curve: Новичок случайно ломает перила и боится подойти к краю; мастер
      намеренно пробивает витрину броском барного стула на первых секундах волны,
      создавая готовую брешь для массового сброса киборгов.
    counterplay: Массивные рулеточные столы требуют 0.4 с на подъем, во время которых
      вышибала замедлен на 35% и уязвим для фланговых атак быстрых прыгунов.
    synergies:
    - spartan_kick_ringout (открытие новых зон для сброса путем выбивания стекол),
      chain_ragdoll_bowling (швыряние стола в летящее тело для двойного импульса).
    why_unique: 'Окружение не декоративно: стеклянные парапеты служат барьерами, сдерживающими
      ринг-аут. Разрушая их телами или мебелью, игрок буквально трансформирует закрытую
      комнату в смертоносную открытую платформу.'
    pseudocode: "function onTickInteraction(input, player, physicsWorld) {\n  if (input.isJustPressed('Interact'))\
      \ {\n    if (player.heldObject == null) {\n      const target = physicsWorld.findNearestGrabbable(player.cameraPos,\
      \ 2.2);\n      if (target) player.grabObject(target);\n    } else {\n      const\
      \ throwForce = player.forwardVector.clone().multiplyScalar(450.0);\n      player.heldObject.rigidBody.applyImpulse(throwForce,\
      \ player.heldObject.position);\n      player.heldObject.isThrownWeapon = true;\n\
      \      player.heldObject = null;\n      playAudio('furniture_throw_whoosh');\n\
      \    }\n  }\n}"
  - name: edge_tension_footwork (Балансирование у края и тактический рывок)
    role_in_loop: Регулятор позиционного риска и инструмент пространственного доминирования
      (Positional Risk & Evasion Engine).
    player_decision: Стоять у края платформы, рискуя упасть ради мгновенного сброса
      набегающих врагов, или отступить в центр зала под плотный огонь стрелков.
    input_mapping: 'ПК: Клавиша Shift — направленный рывок (Dash) по вектору движения
      WASD; Двойное нажатие направления. Мобильные: Свайп в любую сторону по левой
      половине экрана.'
    states:
    - GROUNDED (стабильное движение) -> EDGE_ZONE (в радиусе 1.2 м от обрыва, предупреждение)
      -> DASHING (рывок 0.18 с с i-frames) -> COYOTE_BUFFER (соскальзывание с шансом
      на возврат 0.18 с) -> FALLING (падение в бездну, поражение)
    parameters:
    - name: Дистанция рывка (Dash Distance)
      value: 4.5 м
      tuning_note: Если сделать > 6.5 м, игрок будет постоянно улетать за борт при
        ошибке; если < 2.5 м, рывок не позволит уйти из окружения толпы.
    - name: Кулдаун рывка (Dash Cooldown)
      value: 0.85 с
      tuning_note: Меньше 0.4 с превращает бой в спам бессмертного уклонения; больше
        1.5 с лишает игрока маневренности на тесной арене.
    - name: Окно спасения у края (Coyote Time Window)
      value: 0.18 с
      tuning_note: Позволяет выпрыгнуть обратно на платформу в течение 0.18 с после
        соскальзывания с края, прощая микро-ошибки позиционирования.
    - name: Фреймы неуязвимости (i-frames)
      value: 0.12 с
      tuning_note: Дает 0.12 с защиты от фронтального урона во время рывка для безопасного
        прорыва сквозь замах врага.
    feedback_layers:
    - 'Визуал/VFX: Хроматический аберрационный шлейф за экраном при рывке, неоновые
      полосы скорости (speedlines) и пульсирующая алая виньетка опасности при приближении
      к краю (< 1.2 м).'
    - 'Звук (Web Audio): Резкий пневматический выхлоп сервоприводов ботинок (пшик
      высокого давления) и нарастающий свист ураганного высотного ветра в ушах.'
    - 'Камера: Динамический крен камеры в сторону маневра (strafe roll ±3.5°), кратковременный
      скачок FOV (75° -> 86° на 0.2 с) для подчеркивания ускорения.'
    - 'UI/Тактильность: Двойной короткий виброотклик при успешном отталкивании от
      кромки обрыва (Coyote Jump) и мерцающий предупреждающий значок «EDGE WARNING».'
    failure_mode: 'Игрок совершает рывок прямо в сторону обрыва без учета инерции
      и срывается за борт (Ring-Out поражение). Сигнал: сирена падения, замедление
      времени и вид снизу на удаляющуюся палубу дирижабля.'
    mastery_curve: Новичок держится строго в центре зала, боясь упасть; эксперт намеренно
      танцует на самом краю обрыва, провоцируя тяжелых киборгов на таран и уходя рывком
      в последнюю долю секунды, заставляя врагов по инерции падать в бездну.
    counterplay: На краю палубы действуют сильные порывы ветра дирижабля (боковой
      снос 1.5 м/с), требующие постоянной корректировки курса и компенсирующего движения.
    synergies:
    - spartan_kick_ringout (рывок за спину врага для пинка в сторону обрыва), acoustic_pulse_blaster
      (выстрел в развороте во время рывка).
    why_unique: Край платформы здесь является не просто невидимой стеной или зоной
      мгновенной смерти, а высокорисковой тактической зоной с механикой буфера падения
      (Coyote Time) и аэродинамическим сопротивлением.
    pseudocode: "function onTickMovement(input, player, physicsWorld, dt) {\n  if\
      \ (input.isJustPressed('Dash') && player.dashCooldown <= 0) {\n    player.dashCooldown\
      \ = 0.85;\n    const moveDir = player.getMovementInputVector().normalize();\n\
      \    const dashVelocity = (moveDir.length() > 0 ? moveDir : player.forwardVector).multiplyScalar(18.0);\n\
      \    player.rigidBody.setLinvel(new Vector3(dashVelocity.x, player.rigidBody.linvel().y,\
      \ dashVelocity.z));\n    player.invulnerableTimer = 0.12;\n    spawnVFX('dash_neon_stream',\
      \ player.position);\n    playAudio('dash_pneumatic_boost');\n    applyCameraImpulse({\
      \ fovChange: 11, roll: moveDir.x * 3.5, duration: 0.2 });\n  }\n}"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 75
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - name: Core / Engine
    responsibility: Инициализация Three.js WebGLRenderer, загрузка Wasm Rapier3D,
      игровой цикл (requestAnimationFrame), обработка ресайза и видимости страницы.
  - name: Physics & Simulation
    responsibility: Симуляция твердых тел Rapier3D с фиксированным шагом (1/60 с),
      управление деревом рэгдоллов, расчет коллизий и зоны ринг-аута (Y < -10).
  - name: Gameplay & AI
    responsibility: Контроллер игрока от первого лица, логика атак и пинков, ИИ противников
      (флокинг, атака, уклонение), менеджер 4 волн контракта.
  - name: VFX & Environment
    responsibility: Инстансинг осколков стекла и фишек (InstancedMesh), шейдерные
      кольца ударных волн, неоновое освещение и разрушаемые пропсы.
  - name: UI & Platform Bridge
    responsibility: HTML5/Canvas HUD, виртуальный мобильный джойстик, интеграция Playgama
      Bridge (реклама, облачные сейвы, лидерборды).
  modules:
  - file: src/gameplay/PlayerController.ts
    name: PlayerController
    purpose: Управление перемещением от первого лица, вращением камеры, прыжками,
      рывками и связкой с кинематическим коллайдером Rapier.
  - file: src/gameplay/CombatSystem.ts
    name: CombatSystem
    purpose: Обработка спартанского пинка, кинетического выстрела, ближнего боя, расчет
      векторов отдачи и вызов hit-stop микро-задержки.
  - file: src/physics/RagdollManager.ts
    name: RagdollManager
    purpose: Пул шарнирных рэгдолл-структур, перевод мешей врагов в физические твердые
      тела и расчет цепного кегельбана.
  - file: src/gameplay/WaveContractManager.ts
    name: WaveContractManager
    purpose: Управление спавном врагов по 4 волнам, отслеживание оставшихся целей,
      начисление наград и показ модального окна улучшений.
  - file: src/environment/DestructibleManager.ts
    name: DestructibleManager
    purpose: Обработка разрушения стеклянных перил и столов с фишками с инстанс-рендерингом
      частиц.
  - file: src/ui/TouchInputManager.ts
    name: TouchInputManager
    purpose: 'Эргономичное мобильное управление: плавающий джойстик слева, свайп обзора
      и адаптивные кнопки действий справа.'
  - file: src/platform/PlaygamaSDKService.ts
    name: PlaygamaSDKService
    purpose: Обертка над @playgama/bridge для показа Rewarded Video, Interstitial
      рекламы и синхронизации прогресса.
monetization:
  strategy_summary: 'Ненавязчивая гибридная монетизация: Rewarded Video за мгновенный
    возврат на арену при случайном ринг-ауте (1 раз за забег) и удвоение фишек за
    чистую зачистку; Interstitial в меню между завершенными контрактами с кулдауном
    120 с; IAP на покупку премиальных неоновых обликов экипировки и отключение межстраничной
    рекламы.'
  rewarded_placements:
  - id: revive_ringout
    name: Спасение при падении за борт
    benefit: Возврат игрока в центр арены с полным здоровьем и 2 секундами неуязвимости
    cooldown_or_limit: 1 раз за забег
    trigger_moment: Экран падения за борт или гибели игрока
  - id: double_chips_victory
    name: Удвоение золотых фишек
    benefit: Умножение всех заработанных за контракт фишек на x2
    cooldown_or_limit: После каждого успешного контракта
    trigger_moment: Экран победы контракта
  - id: mystery_weapon_crate
    name: Элитное кинетическое оружие
    benefit: Получение мощного 'Титанового молота с турбонаддувом' на финальную 4-ю
      волну с боссом
    cooldown_or_limit: 1 раз за волну босса
    trigger_moment: Перед стартом 4-й волны босса
  interstitial_placements:
  - trigger_event: Возврат в лобби казино после завершения или проигрыша контракта
    cooldown_seconds: 120
    conditions: Не показывается во время боя, не чаще 1 раза в 2 минуты, не показывается
      если куплен No-Ads
  in_app_purchases:
  - sku: no_ads_vip_pack
    name: VIP Вышибала (Без рекламы)
    description: Полное отключение межстраничных баннеров + Золотой неоновый скин
      титановых ботинок + 2,000 фишек
    price_tier: Tier 2 (~199 RUB / 150 YAN)
    reward: Отключение Interstitial рекламы навсегда, скин 'Golden Bouncer Boots',
      2000 фишек
  - sku: chips_sack_5000
    name: Мешок золотых фишек (5000)
    description: Пакет валюты казино для мгновенной разблокировки всего арсенала оружия
    price_tier: Tier 1 (~99 RUB / 75 YAN)
    reward: 5000 золотых фишек на баланс игрока
  fairness_rules:
  - Никакой рекламы во время активного боя и волны
  - Все геймплейное оружие и улучшения доступны за фишки из чистого игрового процесса
    без доната
  - Строгий кулдаун межстраничной рекламы не менее 120 секунд
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - game_distribution
  - web
  initialization_flow:
  - Bridge.initialize() на старте страницы Vite
  - Скрытие платформенного загрузчика после инициализации Three.js сцены
  - Загрузка Cloud Save данных игрока (разблокированное оружие, фишки)
  - Определение платформы и адаптация сенсорного/клавиатурного интерфейса
  cloud_save_keys:
  - player_unlocked_weapons
  - player_chips_balance
  - player_stat_upgrades
  - player_high_scores
  - player_equipped_skin
  leaderboards:
  - high_score_contract
  - fastest_boss_knockout
  - most_ringouts_single_run
  ads_integration:
    banner_enabled: false
    interstitial_enabled: true
    rewarded_enabled: true
  lifecycle_hooks:
  - visibilitychange -> pauseAudio / freezePhysics
  - ad_started -> muteAllAudio / pauseGameLoop
  - ad_closed -> unmuteAudio / resumeGameLoop
art:
  style_name: Stylized Retro-Cyberpunk 80s Low-Poly
  camera_perspective: First-Person Dynamic Action View
  camera_fov: 85
  camera_pitch_angle: 0
  environment_theme: 'Парящее неоновое казино-дирижабль ''Золотой Дирижабль'': полированные
    латунные полы с зеркальными отражениями, разрушаемые стеклянные барьеры, столы
    для рулетки с фишками, неоновые вывески, искрящие распределительные щитки и бездонная
    панорама ночного мегаполиса с пролетающими трассирующими аэромобилями.'
  character_proportions: Стилизованные низкополигональные кибер-мафиози с гипертрофированными
    плечами и тяжелыми ногами у громил, четко читаемые светящиеся визоры и яркие неоновые
    цветовые маркеры рангов.
  lighting_setup: 'Контрастное неоновое освещение: теплый направленный свет латунных
    люстр казино (DirectionalLight), точечные неоновые споты (PointLight) бирюзового
    (#00F0FF) и пурпурного (#FF007F) цветов, динамические вспышки при взрывах и разрушении
    стекла.'
  color_palette:
    accent: '#FFE600'
    background: '#0D0A1A'
    brass: '#D4AF37'
    danger: '#FF2A55'
