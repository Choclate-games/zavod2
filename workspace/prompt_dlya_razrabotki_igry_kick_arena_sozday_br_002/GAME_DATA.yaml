preview_status: completed
definition_of_done:
- Реализовано ядро управления от первого лица (WASD + мышь на ПК, сенсорный джойстик
  + свайп на смартфонах).
- Настроен физический спартанский пинок с передачей направленного импульса и переходом
  врагов в Rapier3D рэгдолл.
- 'Реализована механика ринг-аута: враги вылетают за пределы платформы в бездну с
  подсчетом очков.'
- Работают цепные столкновения тел (домино-эффект) и разрушаемые элементы окружения
  (стеклянные ограждения, столы).
- Собрана 4-волновая сессия контракта с финальным боссом и окном выбора тактических
  улучшений между волнами.
- 'Интегрирован SDK Playgama Bridge: поддержаны межстраничные баннеры, видео за возрождение
  и сохранение прогресса.'
- Обеспечена стабильная производительность 60 FPS на ПК и мобильных браузерах в пределах
  бюджета 4.5 МБ.
- 'Игра осталась тем, что просили: вид от первого лица — игрок смотрит своими глазами,
  а не с вертолёта, вышки или орбиты.'
- 'Игра осталась тем, что просили: стрельба как главное действие игрока.'
- 'Игра осталась тем, что просили: ближний бой оружием в руках.'
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Позиционирование у края платформы → Кинетический спартанский
  пинок / выстрел / удар битой → Переход врага в рэгдолл Rapier3D → Цепные столкновения
  тел и сброс за борт (ринг-аут) → Зачистка 4 волн контракта → Выбор тактического
  модификатора → Финальный босс-вышибала.'
- 'Реализованы механики проекта: spartan_kick_ringout (Спартанский кинетический пинок
  за борт), chain_ragdoll_bowling (Цепной кегельбан рэгдоллов), acoustic_pulse_blaster
  (Кинетический акустический бластер), environment_shatter_and_throw (Крушение интерьера
  и силовой бросок).'
- Условие успеха (Зачистить все 4 волны контрактной сессии (всего 32 противника),
  сбросив за борт не менее 60% врагов, и сбросить босса-вышибалу с палубы в пропасть
  за время до 4 минут.) и условие проигрыша (Падение здоровья персонажа до 0 HP от
  атак киборгов или падение самого игрока за борт платформы в бездну (ринг-аут).)
  работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Вышибала: Сброс за борт».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Спасение при падении за борт, Удвоение
  золотых фишек, Элитное кинетическое оружие); interstitial соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
