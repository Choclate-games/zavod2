  rejection_reason: Игра является динамичным 3D-экшеном от первого лица на замкнутой
    арене с ринг-аутом, поэтому исключены механики дуэльных 2.5D файтингов с фрейм-датой
    и парированием (fighting_game_core, frame_data_combat, parry), автобаттлеры и
    бесконечные сурвайворы (horde_survivor_core, survivor_loop, wave_survival), избыточные
    тяжелые стековые библиотеки (bitecs, recast_navigation, yuka_ai), а также внешние
    FBX-модели и сложный тактический ИИ с укрытиями.
  loop_pattern: patterns/arena_combat_loop.md
  summary: Проект опирается на физический стек Three.js и Rapier3D для реализации
    контактного FPS-браулера с кинетическими пинками, цепным рэгдоллом и сбросом врагов
    за борт в рамках 4-волнового контракта арены.
