  стекла и взрыв фишек казино.
player_fantasy: Неудержимый футуристический вышибала в парящем неоновом казино, который
  превращает замкнутую арену в смертоносный физический кегельбан, выбивая киборгов
  за борт сокрушительными пинками тяжелых ботинок и кинетическими выстрелами.
