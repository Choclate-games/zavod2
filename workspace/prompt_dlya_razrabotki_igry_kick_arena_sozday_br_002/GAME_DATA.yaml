  (6, 10, 15 врагов) и 4-я волна с бронированным боссом «Магнатом-Вышибалой» и свитой
  на открытой палубе казино-дирижабля.'
unique_value_proposition: 'Первый веб-экшен от первого лица на Three.js + Rapier3D,
  где 80% урона наносит геометрия пространства: ринг-аут в бездну, сбивание врагов
  летящими рэгдоллами и разрушение стеклянных витрин вместо монотонного закликивания
  полосок здоровья.'
vision: Создать эталонный браузерный физический браулер от первого лица, дарящий мгновенное
  висцеральное удовольствие от каждого удара благодаря четкому hit-stop (60 мс), честным
  60 FPS Rapier3D твердым телам и сокрушительному ринг-ауту в стильной неоновой ретро-киберпанк
  эстетике 80-х.
elevator_pitch: '«Вышибала: Сброс за борт» — это ураганный 3D-экшен от первого лица
  в парящем неоновом казино, где вы выбиваете киборгов за борт мощными спартанскими
  пинками, битами и кинетическими выстрелами, запуская зрелищные цепные рэгдолл-реакции.'
win_conditions: Зачистить все 4 волны контрактной сессии (всего 32 противника), сбросив
  за борт не менее 60% врагов, и сбросить босса-вышибалу с палубы в пропасть за время
