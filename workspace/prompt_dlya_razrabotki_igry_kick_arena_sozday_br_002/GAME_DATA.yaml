  мегаполиса с пролетающими трассирующими аэромобилями.. Central Action: Спартанский
  пинок с разбега в грудь 300-килограммового золотого киборга на краю дирижабля, от
  которого тот сносит троих охранников, проламывает стеклянную витрину бара и вся
  четверка кубарем в рэгдолле улетает в бездну ночного мегаполиса под звон стекла
  и взрыв фишек казино. — the moment is caught mid-action, with clear cause and effect
  readable in a single frame. Visible in-game HUD overlay: Кольцевой прицел-индикатор
  кинетического вектора по центру экрана, Полоса здоровья игрока (слева вверху), Счетчик
  волны ''КОНТРАКТ: ВОЛНА 2/4'' и оставшихся врагов (по центру вверху), Индикатор
  кулдауна спартанского пинка (справа внизу); touch controls at the bottom corners.
  Lighting: Контрастное неоновое освещение: теплый направленный свет латунных люстр
  казино (DirectionalLight), точечные неоновые споты (PointLight) бирюзового (#00F0FF)
  и пурпурного (#FF007F) цветов, динамические вспышки при взрывах и разрушении стекла..
  Color palette: #FFE600, #0D0A1A, #D4AF37, #FF2A55, #00F0FF, #FF007F, #1A1528. High
  visual clarity, readable silhouettes, immersive WebGL game aesthetics.'
