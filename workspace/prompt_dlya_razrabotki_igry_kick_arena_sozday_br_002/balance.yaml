_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: prompt_dlya_razrabotki_igry_kick_arena_sozday_br_002
performance:
  target_fps: 60
  max_draw_calls: 75
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: 'Аренный контракт из 4 волн (2.5–4 минуты): 3 нарастающие волны кибер-мафиози
    (6, 10, 15 врагов) и 4-я волна с бронированным боссом «Магнатом-Вышибалой» и свитой
    на открытой палубе казино-дирижабля.'
  win: Зачистить все 4 волны контрактной сессии (всего 32 противника), сбросив за
    борт не менее 60% врагов, и сбросить босса-вышибалу с палубы в пропасть за время
    до 4 минут.
  lose: Падение здоровья персонажа до 0 HP от атак киборгов или падение самого игрока
    за борт платформы в бездну (ринг-аут).
  difficulty_curve: Волна 1 (0:00–0:45) — 6 слабых лакеев для освоения пинка и ринг-аута;
    Волна 2 (0:45–1:40) — 6 лакеев и 4 быстрых прыгуна, атакующих с флангов; Волна
    3 (1:40–2:45) — 8 лакеев, 4 прыгуна и 3 тяжелых киборга с повышенной массой (требуют
    выстрела в упор или удара в спину); Волна 4 (2:45–3:45) — Босс «Магнат» со щитом
    и 4 стрелка, требующие рикошетов миньонов в босса и разрушения парапета для его
    сброса.
mechanics:
  spartan_kick_ringout_spartanskiy_kineticheskiy_pin:
    name: spartan_kick_ringout (Спартанский кинетический пинок за борт)
    parameters:
      dlitelnost_zamaha_windup:
        value: 0.12 с
        note: При увеличении > 0.25 с теряется взрывная реактивность аркадного экшена;
          при уменьшении < 0.05 с анимация ноги превращается в нечитаемый телепорт.
      dlitelnost_hit_stopa_hitstop:
        value: 0.06 с
        note: Если убрать до 0 с, пропадает ощущение сокрушительной физической массы;
          если поднять > 0.12 с, игра ощущается зависающей.
      bazovyy_impuls_pinka_base_impulse:
        value: 450 Н*с
        note: При снижении < 250 Н*с враги не долетают до края арены (5-7 м); при
          завышении > 800 Н*с рэгдолл улетает слишком быстро без возможности оценить
          полет.
      bonus_impulsa_ot_sprinta_sprint_multiplier:
        value: +45% импульса
        note: Если сделать < 15%, игрок перестает использовать разбег; если > 70%,
          пинок с места становится абсолютно бесполезным.
      kuldaun_udara_kick_cooldown:
        value: 0.45 с
        note: Меньше 0.2 с провоцирует бездумный спам одной кнопки; больше 0.8 с делает
          игрока беззащитным против быстрых прыгунов.
      distantsiya_porazheniya_reach:
        value: 2.2 м
        note: Меньше 1.5 м приводит к постоянным промахам в динамике; больше 3.0 м
          ощущается неестественным бесконтактным телекинезом.
  chain_ragdoll_bowling_tsepnoy_kegelban_regdollov:
    name: chain_ragdoll_bowling (Цепной кегельбан рэгдоллов)
    parameters:
      koeffitsient_sohraneniya_impulsa_momentum_transfer:
        value: 75% энергии
        note: Если снизить < 50%, цепная реакция затухает на первой же цели; если
          поднять > 90%, один пинок очищает всю арену хаотичным домино.
      porog_sbivaniya_s_nog_knockdown_threshold:
        value: 120 кг*м/с
        note: При значении > 180 кг*м/с вторичные враги перестают падать; при < 60
          кг*м/с малейшее касание роняет всю толпу, обесценивая силу удара.
      vremya_nahozhdeniya_v_regdolle_ragdoll_duration:
        value: 2.4 с до подъема
        note: Меньше 1.5 с — враги встают слишком мгновенно; больше 4.0 с — арена
          превращается в пассивное избиение лежачих манекенов.
      bonusnyy_mnozhitel_kombo_strike_multiplier:
        value: x1.5 за каждое тело
        note: 'Определяет ценность геометрического расчета: каждый сбитый враг в цепочке
          увеличивает награду золотыми фишками на +50%.'
  acoustic_pulse_blaster_kineticheskiy_akusticheskiy:
    name: acoustic_pulse_blaster (Кинетический акустический бластер)
    parameters:
      kineticheskaya_sila_vystrela_concussive_force:
        value: 280 Н*с
        note: Специально слабее пинка (450 Н*с), чтобы не вытеснять ближний бой, но
          достаточно для сбивания с ног стрелка на дистанции.
      kolichestvo_zaryadov_kondensatora_ammo_capacity:
        value: 3 заряда
        note: Больше 4 зарядов превращает игру в чистый тир; меньше 2 не позволяет
          выполнять связку «выстрел под ноги + рикошет в спину».
      vremya_vosstanovleniya_1_zaryada_recharge_time:
        value: 1.2 с на заряд
        note: Меньше 0.6 с обесценивает контроль ресурсов; больше 2.0 с делает механику
          слишком редкой для короткой сессии.
      skorost_akusticheskogo_fronta_wave_speed:
        value: 42.0 м/с
        note: 'Определяет упреждение: при 42 м/с волна летит мгновенно, но оставляет
          игроку визуальное ощущение летящего снаряда.'
  environment_shatter_and_throw_krushenie_interera_i:
    name: environment_shatter_and_throw (Крушение интерьера и силовой бросок)
    parameters:
      porog_probitiya_parapeta_glass_break_threshold:
        value: 350 Н*с
        note: Если занизить < 150 Н*с, перила ломаются от любого случайного шага;
          если завысить > 600 Н*с, даже полет тяжелого киборга не сможет пробить стекло.
      skorost_poleta_broshennogo_predmeta_throw_velocity:
        value: 24.0 м/с
        note: При скорости 24 м/с предмет настигает убегающих стрелков и гарантированно
          опрокидывает их в рэгдолл.
      radius_zahvata_mebeli_pickup_radius:
        value: 2.2 м
        note: Меньше 1.4 м делает подбор предметов на бегу мучительным; больше 3.5
          м ощущается нелепым притягиванием сквозь стены.
      mnozhitel_urona_mebeli_furniture_impact_mult:
        value: 2.5x урона
        note: Тяжелый предмет наносит в 2.5 раза больше кинетического урона, чем обычный
          удар кулаком, вознаграждая за использование окружения.
  edge_tension_footwork_balansirovanie_u_kraya_i_tak:
    name: edge_tension_footwork (Балансирование у края и тактический рывок)
    parameters:
      distantsiya_ryvka_dash_distance:
        value: 4.5 м
        note: Если сделать > 6.5 м, игрок будет постоянно улетать за борт при ошибке;
          если < 2.5 м, рывок не позволит уйти из окружения толпы.
      kuldaun_ryvka_dash_cooldown:
        value: 0.85 с
        note: Меньше 0.4 с превращает бой в спам бессмертного уклонения; больше 1.5
          с лишает игрока маневренности на тесной арене.
      okno_spaseniya_u_kraya_coyote_time_window:
        value: 0.18 с
        note: Позволяет выпрыгнуть обратно на платформу в течение 0.18 с после соскальзывания
          с края, прощая микро-ошибки позиционирования.
      freymy_neuyazvimosti_i_frames:
        value: 0.12 с
        note: Дает 0.12 с защиты от фронтального урона во время рывка для безопасного
          прорыва сквозь замах врага.
