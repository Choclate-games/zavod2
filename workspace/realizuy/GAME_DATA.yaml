raw_prompt: реализуй
title: 'Kick Arena: Кинетический Рикошет'
slug: realizuy
genre: 3D Физический Бравлер / Beat 'em up
subgenre: Кинетический арена-экшен с рэгдоллом и цепными разрушениями
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Яндекс Игры, VK Play, Web, Mobile Web)
orientation: landscape
target_audience: Игроки 14–35 лет, любящие зрелищные физические браулеры, кинетические
  драки с рэгдоллом (в духе симуляторов разрушений и физического хаоса), ценящие тактильную
  отдачу, сочные удары, запуск врагов пинком через всю комнату и короткие адреналиновые
  сессии на 3–5 минут.
core_loop: Позиционирование и маневрирование -> Точный пинок или силовой удар -> Запуск
  врага-снаряда в толпу и разрушаемые объекты -> Сбор выбитых наличных и подбор оружия
  -> Модернизация бойца и арсенала на верстаке между раундами -> Сражение со следующим
  натиском и боссом-тяжеловесом.
hook: Момент, когда мощным спартанским пинком ты запускаешь 120-килограммового громилу
  через всю арену, он пробивает штабель поддонов, сбивает с ног троих набегающих бандитов,
  рикошетит в бочку с горючим, вызывая взрывную ударную волну, а игра на 0.08 секунды
  замирает в хитстопе с яростной тряской камеры и неоновыми искрами.
player_fantasy: Ты — несокрушимый уличный чемпион подпольного октагона, чьи ноги и
  кулаки обладают сокрушительной физической мощью артиллерийского орудия. Ты не просто
  дерешься, ты превращаешь нападающих бандитов в живые снаряды, круша ими стены, мебель
  и их собственных подельников в вихре кинетического хаоса.
session_model: 'Сессионный матч-заход на 3–5 минут: преодоление 4 нарастающих натисков
  уличных группировок (по 30–50 секунд каждый) с промежуточными паузами у оружейного
  верстака (15–20 секунд) и кульминационной битвой с бронированным боссом-тяжеловесом
  в 4-м раунде.'
unique_value_proposition: 'Первый браузерный 3D-бравлер на Three.js и Rapier3D, где
  тела врагов являются главным оружием массового поражения: расчет кинетического импульса,
  цепные столкновения рэгдоллов и интерактивные разрушения арены заменяют скучный
  обмен полосками здоровья на зрелищный физический кегельбан.'
vision: Создать самый тактильный, сочный и кинетически удовлетворяющий браузерный
  3D-экшен в Яндекс Играх, где каждый удар ногой дает эйфорическое чувство физического
  всемогущества за счет честного расчета импульса Rapier3D, микро-хитстопов, динамической
  follow-камеры и тотальной разрушаемости окружения.
elevator_pitch: «Kick Arena» — это взрывной 3D-бравлер от третьего лица с физикой
  Rapier3D, где спартанский пинок превращает врагов в живые кинетические тараны, сносящие
  толпы бандитов и ломающие арену в щепки.
win_conditions: Успешно зачистить все 4 натиска уличных бойцов подпольного октагона,
  разгромив в финале бронированного босса-тяжеловеса и сохранив хотя бы 1 единицу
  здоровья бойца к концу финального раунда.
lose_conditions: Падение очков здоровья бойца до 0 в результате пропущенных ударов,
  брошенных предметов или взрывных волн бочек до победы над боссом (с 1 шансом на
  мгновенное возрождение за Rewarded Video).
progression_summary: 'Внутриматчевая прогрессия: заработок уличных купюр за кинетические
  комбо и разрушения -> покупка апгрейдов силы пинка, импульса хука, скорости бега,
  прочности оружия и запаса здоровья на верстаке между 4 раундами. Мета-прогрессия:
  разблокировка новых видов оружия (арматурный молот, катана, полицейская дубинка)
  и боевых перчаток в зале славы за победные кубки арены.'
difficulty_curve: 'Ступенчато-нарастающая с пиками напряжения: 1-й натиск (легкие
  хулиганы, освоение физики пинков и ящиков), 2-й натиск (добавление быстрых фланкеров
  и вооруженных битами головорезов), 3-й натиск (смешанная толпа с тяжеловесами, требующая
  активного броска бочек и рикошетов), 4-й натиск (штурм с боссом-джаггернаутом и
  миньонами, где босса нужно оглушать рикошетом его же подручных).'
scores:
  fun: 9
  originality: 9
  replayability: 9
  development_cost: 8
  visual_appeal: 9
  mobile_fit: 9
  monetization: 9
  platform_fit: 10
  overall_score: 9.0
  justification: Оценка выставлена за максимальную кинетическую отдачу (game feel),
    виральный юмор физических рикошетов и безупречную техническую выполнимость на
    Three.js + Rapier3D. Чуть более требовательной частью является точная настройка
    рэгдолл-джоинтов и порогов импульса для мобильного WebGL, однако отказ от тяжелых
    мешей и использование low-poly геометрии с процедурным физическим разрушением
    нивелирует риски производительности.
references:
- name: Dark Messiah of Might and Magic
  genre: First-Person Action / Physics Brawler
  mechanics:
  - Спартанский пинок ногой
  - Насаживание на шипы и сброс с высоты
  - Обрушение балок на врагов
  lessons: Пинок ногой в физические объекты и врагов — один из самых аддиктивных и
    приносящих удовлетворение глаголов в видеоиграх.
  what_to_avoid: Медленный фэнтезийный темп и вид от первого лица, ограничивающий
    пространственную ориентацию на арене.
- name: Sifu
  genre: 3D Martial Arts Brawler
  mechanics:
  - Подбор и метание предметов
  - Фокусные добивания
  - Взаимодействие с окружением
  lessons: Плотный физический импакт, микропаузы при попаданиях и активное использование
    предметов окружения (стулья, биты, бутылки).
  what_to_avoid: Сложные хардкорные тайминги парирования, недоступные для казуальной
    аудитории Яндекс Игр.
- name: Hotline Miami
  genre: Top-Down Action Brawler
  mechanics:
  - Бросок оружия
  - Быстрая смена экипировки
  - Мгновенная летальность
  lessons: Молниеносный темп, мгновенный бросок оружия в лицо врагу для стана и добивание
    упавших.
  what_to_avoid: Вид строго сверху (top-down) и пиксельная графика, снижающие кинетическую
    зрелищность рэгдолла.
- name: FlatOut / Ragdoll Masters
  genre: Физический Рэгдолл Экшен
  mechanics:
  - Рэгдолл сочленения
  - Столкновения на высоких скоростях
  lessons: Чистая радость от наблюдения за физическим хаосом и кинетическими рикошетами
    тел.
  what_to_avoid: Бесконтрольный неуправляемый хаос, лишающий игрока ощущения мастерства
    и контроля.
mechanics:
- name: spartan_launch_kick
  category: 'Главный двигатель и инициатор микро-петли: переводит ближний бой в дальнобойный
    кинетический бильярд'
  priority: core
  description: Вместо стандартного нанесения урона по хитбоксу с фиксированной анимацией
    смерти, пинок пересчитывает физическую массу цели и превращает противника в динамический
    рэгдолл-снаряд с баллистической траекторией в физическом мире Rapier3D.
  player_interaction: 'Тач: Быстрый тап по кнопке ''Kick'' (правый нижний угол) —
    быстрый пинок; Зажатие кнопки ''Kick'' с отпусканием — заряженный пинок. ПК: Пробел
    или ЛКМ (быстрое нажатие / удержание). Джойстик/WASD задает вектор направления
    удара.'
  feedback: 'Визуал/VFX: Дуговой неоновый шлейф по траектории подошвы берца, вспышка
    белых искр в точке контакта, резкий переход меша врага в ragdoll с деформацией
    скелета; Звук (Web Audio): Низкочастотный басовый удар ''WHAM'' (65 Гц суб-бас
    с синтезированным щелчком кости 1.2 кГц), сопровождаемый криком отлетающего бандита;
    Камера: Импульсный шейк амплитудой 0.35G с длительностью 0.18 с и микро-зум на
    4% в сторону вектора удара; UI/Тактильность: Вибрация Haptic Feedback ''Heavy
    Impact'' (45 мс на мобильных), радиальная вспышка белого виньетирования на границах
    экрана'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: kinetic_body_bowling
  category: 'Источник мультипликативного урона и каскадной награды: масштабирует единичный
    удар в массовую зачистку'
  priority: secondary
  description: Импульс передается через реальные твердотельные коллизии Rapier3D с
    учетом закона сохранения импульса и массы тел, а не через искусственный сферический
    сплэш-триггер.
  player_interaction: 'Пассивно-активная механика: траектория задается углом взгляда
    и положением бойца в момент нанесения спартанского кика или броска предмета.'
  feedback: 'Визуал/VFX: Вспышка желто-оранжевых лучевых линий (Impact Lines) в точках
    контакта, каскадный разлет спрайтов наличных долларов и всплывающие цифры урона
    с множителем ''x2 STRIKE!'', ''x3 SPARE!''; Звук (Web Audio): Звук глухого удара
    боулинг-шара о кегли ''THUD-CRACK'', переходящий в стеклянный звон выбитых зубов
    и монет; Камера: Микро-толчки камеры по направлению рикошета (шейк 0.2G на каждое
    сбитое тело) с динамическим расширением FOV с 60° до 65°; UI/Тактильность: Серия
    быстрых виброоткликов (Light Haptic) с интервалом 0.1 с при каждом последовательном
    сбивании врага в цепочке'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: prop_tactical_hurdle
  category: 'Тактический инструмент контроля дистанции и источник взрывного урона:
    превращает окружение в оружие'
  priority: secondary
  description: 'Любой предмет окружения (от доски до 200-литровой бочки) обладает
    двойной функциональностью: полноценное контактное оружие с уникальным мувсетом
    или баллистический метательный снаряд с автодоводкой.'
  player_interaction: 'Тач: Кнопка ''Grab/Throw'' над кнопкой удара. Автоподбор при
    нахождении в радиусе 1.2 м от предмета; повторный тап — бросок в направлении прицела.
    ПК: Клавиша E — подбор, ПКМ / F — бросок.'
  feedback: 'Визуал/VFX: Вращающийся физический меш в воздухе с траекторным дымовым
    следом (Trail Renderer), вспышка огненного взрыва при детонации бочки с разлетом
    горящих обломков; Звук (Web Audio): Свист рассекаемого воздуха ''SWOOSH'' в полете,
    звонкий металлический лязг трубы о череп ''CLANG'' или оглушительный взрыв бочки
    ''KABOOM'' (80 Гц низкий бас с дисторшном); Камера: При взрыве бочки — круговой
    радиальный импульс камеры с затуханием 0.25 с и кратковременным хроматическим
    аберрационным смещением; UI/Тактильность: Двойной Haptic клик при подборе предмета
    и тяжелая отдача при броске'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: wall_splat_destruction
  category: 'Источник позиционного преимущества и генератор вторичных снарядов: вознаграждает
    за прижимание врагов к краям арены'
  priority: secondary
  description: 'Разрушение окружения является процедурным: в точке удара геометрия
    распадается на физические твердые тела Rapier3D, которые сами становятся летальным
    вторичным оружием.'
  player_interaction: 'Позиционная механика: срабатывает автоматически при столкновении
    любого рэгдолла или брошенного предмета с препятствиями и границами октагона.'
  feedback: 'Визуал/VFX: Появление трещин и разломов на текстуре стены (Decal Spawner),
    облако цементной/деревянной пыли, разлет физических досок и арматуры; Звук (Web
    Audio): Сокрушительный хруст ломающегося дерева ''CRACK-CRUNCH'' или тяжелый металлический
    резонанс удара о сетку октагона ''CLANG-RATTLE''; Камера: Однократный резкий направленный
    импульс тряски камеры от точки удара о стену (шейк 0.3G); UI/Тактильность: Мощный
    тактильный щелчок ''Heavy Splat'' на мобильных устройствах, всплывающий маркер
    ''WALL CRUSH!'''
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: pit_workbench_economy
  category: 'Регулятор темпа и двигатель внутриматчевой прогрессии: конвертирует боевые
    успехи в рост огневой мощи'
  priority: secondary
  description: Верстак — это не статичное абстрактное меню паузы, а физический интерактивный
    объект в центре октагона, который открывается строго в перерывах между натисками
    и меняет физические свойства бойца в реальном времени.
  player_interaction: 'Тач/Мышь: Тап по интерактивным карточкам верстака в межраундовом
    UI меню; кнопка ''В бой!'' для досрочного запуска следующей волны со стартовым
    бонусом $50.'
  feedback: 'Визуал/VFX: Подъем гидравлической платформы верстака с искрами и паром,
    неоновое голографическое свечение доступных апгрейдов, анимация экипировки титановых
    накладок на бойца; Звук (Web Audio): Звуковой сигнал кассового аппарата ''CHA-CHING!'',
    механический гул гидропривода и металлический стук закрепляемого на поясе молота;
    Камера: Плавный кинематографический наезд камеры на верстак (FOV 50°) во время
    фазы покупок и отъезд в боевую изометрию (FOV 60°) при старте волны; UI/Тактильность:
    Тактильный щелчок Haptic Selection при клике на карточки улучшений, динамический
    счетчик купюр с плавной анимацией начисления'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
gameplay_systems:
- name: Кинетическая боевая система Rapier3D
  purpose: Расчет сил, импульсов и бесшовный перевод врагов из кинематических анимаций
    в активный динамический рэгдолл при ударе
  input: Векторы атак игрока, физические контакты коллайдеров Rapier3D
  rules:
  - Урон прямо пропорционален массе и квадрату скорости летящего объекта
  - Каждое соударение передает 75% остаточного импульса следующей цели
  state:
  - Actor_Kinematic
  - Actor_Ragdoll_Flying
  - Actor_Ragdoll_Sliding
  - Actor_Recovering
  interactions: ''
  feedback: Хитстопы, направленные вспышки искр, динамический расчет звуков столкновений
    по формуле кинетической энергии
  edge_cases:
  - Падение рэгдолла за пределы коллизий арены -> автоматический респавн тела с нанесением
    урона бездны
  - Одновременное столкновение более 10 тел -> перераспределение импульсов через пространственное
    хеширование без просадки FPS
- name: Система процедурного разрушения и деформации окружения
  purpose: Раскалывание интерактивных ящиков, поддонов и бочек на физические осколки-коллайдеры
  input: Превышение порога кинетической энергии соударения (Break_Threshold > 180
    J)
  rules:
  - Обломки наследуют вектор движения ударившего тела и наносят остаточный урон окружающим
    мобам
  state:
  - Prop_Intact
  - Prop_Fractured
  - Debris_Active_Physics
  - Debris_Sleeping
  interactions: ''
  feedback: Звук сокрушительного треска дерева, сноп щепок и пыли, разлет обломков
    по физическим дугам
  edge_cases:
  - Превышение лимита обломков на сцене -> мгновенный деспавн самых старых обломков
    через пул
- name: Система координации уличных натисков (AI Crowd Coordinator)
  purpose: Управление спавном, фланкированием и поведением толпы уличных бойцов без
    эффекта 'кучи малы'
  input: Таймеры раунда, счетчик оставшихся противников, позиция игрока
  rules:
  - Не более 3 врагов атакуют игрока одновременно в ближнем бою; остальные окружают
    и готовят броски предметов
  state:
  - Wave_Spawning
  - Wave_Active_Combat
  - Wave_Clearing
  - Wave_Completed
  interactions: ''
  feedback: Звуковой гонг начала натиска, визуальные маркеры агрессии над головами
    врагов
  edge_cases:
  - Застревание моба за препятствием -> активация таранного режима с разрушением преграды
    мобом
- name: Система верстака и внутриматчевой экономики
  purpose: Обеспечение тактической прогрессии между 4 раундами матча за счет целевого
    улучшения характеристик и покупки оружия
  input: Выбор апгрейда игроком на экране верстака, наличие достаточной суммы наличных
  rules:
  - Наличные зарабатываются только за физические рикошеты, комбо и разрушения в бою
  - Купленные апгрейды действуют до конца текущего матча
  state:
  - Shop_Closed
  - Shop_Open
  - Transaction_Processed
  interactions: ''
  feedback: Анимация искр сварки, звон наковальни, обновление цифр в интерфейсе и
    смена визуала экипировки героя
  edge_cases:
  - Игрок не совершил покупок за 15 секунд -> автоматическое закрытие верстака и старт
    следующего раунда с сохранением налички
- name: Движок кинетического сока и обратной связи (Juice & Feedback Engine)
  purpose: Создание гипертрофированного тактильного ощущения мощи удара ('Game Feel')
  input: События критических ударов, пинков, разрушений и цепных рикошетов
  rules:
  - Каждый пинок вызывает хитстоп 0.08с и шейк камеры пропорционально переданному
    импульсу
  state:
  - Juice_Idle
  - Juice_Hitstop_Active
  - Juice_Camera_Recovering
  interactions: ''
  feedback: Временная деформация TimeScale, векторный screen shake камеры, хроматическая
    аберрация на 0.05 с, саб-басовый звуковой слой
  edge_cases:
  - Слишком частые удары подряд -> ограничение хитстопа минимальным интервалом 0.2
    с для предотвращения 'заикания' игры
core_design:
  signature_moment: В кульминации 4-го натиска 240-килограммовый босс-джаггернаут
    идет на таран через всю арену. Игрок за 0.25 с заряжает спартанский фронт-кик
    и вбивает армейский берц в грудь набегающего 80-кг хулигана. Тело хулигана с импульсом
    520 Н*с летит со скоростью 16.5 м/с, пробивает дощатый штабель поддонов с разлетом
    щепок, сбивает с ног двоих бандитов с битами, рикошетит точно в уязвимый затылок
    босса и опрокидывает бочку с горючим. В момент удара о бочку срабатывает хитстоп
    на 0.08 с, камера дает яростный импульсный зум с голландским углом 8°, бочка детонирует
    с радиусом ударной волны 4.5 м, поджигая и разбрасывая врагов по металлической
    сетке октагона, а из развороченной баррикады фонтаном вылетают 140 хрустящих купюр
    под рев экстатической толпы.
  genre_template_rejected: Отказ от классической Beat 'em up системы длинных кнопочных
    комбо-цепочек (Dial-a-Combo), губчатых полосок здоровья врагов (HP Sponges) и
    жестких анимационных блокировок игрока (Animation Lock). В традиционных браулерах
    враги выступают статичными мешками для заученных серий ударов (Light-Light-Heavy).
    В нашей игре каждый противник — это полноценное физическое тело с массой 75–240
    кг в физическом мире Rapier3D. Главный урон наносится не микроударами кулаков,
    а кинетической энергией столкновения тел с окружением, геометрией рикошетов и
    цепными разрушениями, превращая арену в адреналиновый физический бильярд живыми
    телами.
  what_makes_it_different: 'Враги здесь — не просто мишени или препятствия, а твой
    главный дальнобойный боеприпас и инструмент контроля толпы. Прямой удар ногой
    наносит минимальный урон (20 ед.), но запуск врага-снаряда в группу противников
    генерирует квадратичный кинетический урон (до 250 ед.) и активирует каскадный
    кегельбан с экспоненциальным спавном купюр. Игрок побеждает не закликиванием кнопок,
    а геометрическим расчетом траекторий: ''игрок -> легкий враг -> плотная группа
    -> взрывоопасная бочка / хрупкая стена''.'
  micro_loop:
  - step: micro_01_positioning
    player_action: Маневрирование джойстиком/WASD для выстраивания вектора удара между
      набегающим бандитом и группой врагов или баррикадой
    game_response: Враги сближаются веером, динамически отображается конус прогноза
      траектории полета цели (зеленый пунктирный вектор 12.0 м)
    decision: Выбрать легкого хулигана (80 кг) для дальнего рикошета или тяжеловеса
      (140 кг) для гарантированного сноса укрепленной баррикады
    duration: 0.4–1.2 с
  - step: micro_02_strike_execution
    player_action: Нажатие кнопки удара (клик/тап для быстрого тычка или удержание
      0.25 с для заряженного Спартанского фронт-кика)
    game_response: Срабатывает хитстоп 0.08 с, шейк камеры 0.35G, сочный звук сокрушения
      ребер, цель переходит в полный рэгдолл с начальным импульсом 480 Н*с
    decision: Провести быстрый пинок без задержки или рискнуть зарядкой силового удара
      под угрозой замаха набегающего с фланга мечника
    duration: 0.15–0.35 с
  - step: micro_03_kinetic_cascade
    player_action: Наблюдение за баллистической траекторией летящего тела и перемещение
      к точке отскока или новому укрытию
    game_response: Тело пробивает штабель ящиков, сбивает с ног двоих бандитов, детонирует
      бочку; физические обломки наносят вторичный сплэш-урон по 25 ед.
    decision: Сделать рывок в эпицентр для добивания оглушенных врагов или перехватить
      отлетевшую металлическую трубу для броска
    duration: 0.6–1.5 с
  - step: micro_04_loot_and_scavenge
    player_action: Рывок через зону разрушения со сбором выбитых уличных купюр и автоматическим
      подбором выпавшего оружия
    game_response: Счетчик комбо возрастает (х1.5 -> х3.0), купюры втягиваются магнитным
      радиусом 2.5 м, в руки берется бейсбольная бита (прочность 4 удара)
    decision: Потратить прочность биты на добивание тяжелого бойца или метнуть её
      в лицо приближающемуся метателю коктейлей Молотова
    duration: 0.5–1.0 с
  meso_loop:
  - step: meso_01_wave_assessment
    player_action: Оценка состава и точек спавна очередного уличного натиска (соотношение
      хулиганов, битоводов и бронированных громил)
    game_response: Звучит фабричная сирена, решетки боксов поднимаются, на арену выбегают
      8–14 врагов с визуальными маркерами агрессии и оружия
    decision: Занять центр возле взрывных бочек для раннего масс-урона или отступить
      к бетонной колонне для реализации отскоков от стен
    duration: 1.5–3.0 с
  - step: meso_02_crowd_control_and_combo
    player_action: Серийное применение пинков, бросков окружения и кинетических кегельбанов
      для контроля плотности нападающей толпы
    game_response: Шкала адреналина заполняется, комбо-множитель достигает х4.0, выбивая
      максимальный поток купюр из сбитых с ног врагов
    decision: Поддерживать рискованную комбо-серию непрерывными пинками или разорвать
      дистанцию при проседании здоровья ниже 30%
    duration: 25–45 с
  - step: meso_03_wave_clear_reward
    player_action: Добивание последнего элитного бойца натиска и пылесосный сбор оставшихся
      на арене денежных пачек
    game_response: Гонг завершения раунда, слоу-мо 0.3х на 1.0 с, всплывает плашка
      заработка за раунд (+$480), в центре опускается светящийся верстак
    decision: Проанализировать слабые места перед следующим натиском (не хватает урона
      пинка, дальности броска или запаса здоровья)
    duration: 2.0–4.0 с
  - step: meso_04_workbench_tuning
    player_action: 'Взаимодействие с оружейным верстаком подпольного октагона: выбор
      и покупка апгрейдов и тяжелого оружия'
    game_response: Списание наличных, мгновенный апгрейд параметров, визуальное обновление
      экипировки (титановые накладки, арматурный молот в руках)
    decision: Вложить кэш в импульс спартанского кика (+30%), купить тяжелую кувалду
      на 5 сокрушительных махов или восстановить 60 HP
    duration: 15–20 с
  macro_loop:
  - step: macro_01_arena_entry
    player_action: Старт матча в подпольном октагоне с базовой экипировкой (уличные
      армейские берцы 1-го уровня, 100 HP)
    game_response: Гул толпы зрителей за сеткой, генерация процедурной расстановки
      интерактивных поддонов, бочек и металлоконструкций
    decision: Выбрать стартовую траекторию движения к ближайшей группе легковесов
      для быстрого разгона первого комбо
    duration: 3–5 с
  - step: macro_02_run_escalation
    player_action: Последовательное преодоление 4 нарастающих натисков уличных группировок
      с кастомизацией билда на верстаке
    game_response: 'Эскалация угроз: добавление щитовиков, метателей огня и мини-боссов;
      постепенное разрушение конструкций арены'
    decision: 'Сформировать специализированный билд: ''Дальнобойный кегельбан рикошетами''
      или ''Тяжелый контактный крушитель стен'''
    duration: 3.0–4.5 мин
  - step: macro_03_boss_showdown_or_defeat
    player_action: 'Кульминационная схватка с бронированным боссом-тяжеловесом: использование
      миньонов босса в качестве живых снарядов в его спину'
    game_response: Триумфальная смерть босса с эпическим разлетом брони / либо экран
      поражения при 0 HP с предложением RV-возрождения (1 раз за матч)
    decision: Активировать мгновенное RV-возрождение с 50% HP и круговой ударной волной
      или завершить матч с текущими кубками
    duration: 40–70 с
  - step: macro_04_meta_hall_of_fame
    player_action: Переход в Зал славы подпольного октагона и распределение заработанных
      золотых кубков арены
    game_response: Разблокировка новых архетипов оружия в пуле верстака (Арматурный
      молот, Катана, Полицейский щит) и перманентных перков бойца
    decision: Разблокировать новое оружие для будущих матчей или прокачать пассивный
      стартовый импульс пинка (+15% навсегда)
    duration: 20–40 с
  loop_diagram: '+---------------------------------------------------------------------------------------------------------+

    |                                     KICK ARENA: КИНЕТИЧЕСКИЙ РИКОШЕТ                                    |

    +---------------------------------------------------------------------------------------------------------+

    |                                                                                                         |

    |  [МАКРО-ПЕТЛЯ МАТЧА (3-5 мин)]                                                                          |

    |  Вход в октагон ---> Натиски 1-3 (Эскалация) ---> Натиск 4: Босс-Джаггернаут
    ---> Зал Славы (Мета)     |

    |        ^                                                                                 |              |

    |        +------------------------- Новые типы оружия и перки кубков <--------------------+              |

    |                                                                                                         |

    |  [МЕЗО-ПЕТЛЯ РАУНДА-НАТИСКА (45-60 с)]                                                                  |

    |  +---------------------------------------------------------------------------------------------------+  |

    |  | Оценка спавна толпы ---> Кинетический контроль арены ---> Гонг победы --->
    Верстак и закупка кэшем |  |

    |  |        ^                                                                          |               |  |

    |  |        +------------------- Следующий натиск с прокачанным билдом <---------------+               |  |

    |  +---------------------------------------------------------------------------------------------------+  |

    |                                                                                                         |

    |  [МИКРО-ПЕТЛЯ УДАРА И КАСКАДА (1.5-3.0 с)]                                                              |

    |  +---------------------------------------------------------------------------------------------------+  |

    |  |  (1) ПОЗИЦИОНИРОВАНИЕ  ---> (2) СПАРТАНСКИЙ КИК  ---> (3) КИНЕТИЧЕСКИЙ  --->
    (4) СБОР КЭША И      |  |

    |  |      Выбор угла и линии         Удар берцем (480 Н*с)      КЕГЕЛЬБАН             ПОДБОР
    ОРУЖИЯ    |  |

    |  |      огня по хулигану           Хитстоп 0.08 с             Сбивание толпы,       Рост
    комбо х4.0, |  |

    |  |                                                            взрыв бочек, стены    подхват
    трубы    |  |

    |  |            ^                                                                            |         |  |

    |  |            +------------------ Смена позиции с новым оружием в руках <------------------+         |  |

    |  +---------------------------------------------------------------------------------------------------+  |

    +---------------------------------------------------------------------------------------------------------+'
  tension_curve: 'Пилообразная кривая с экспоненциальным нарастанием стресса внутри
    каждого натиска и глубокими тактическими спадами у верстака:

    - Натиск 1 (0–45 с): Низкое напряжение (20–35%). Ознакомление с физикой: 5 слабых
    хулиганов, свободное пространство для экспериментов с пинками.

    - Пауза 1 (45–60 с): Релаксация (10%). Безопасная зона у верстака, выбор первого
    апгрейда импульса (+15%).

    - Натиск 2 (60–110 с): Среднее напряжение (35–60%). Спавн быстрых фланкеров и
    вооруженных битами головорезов. Требуется активный подбор предметов.

    - Пауза 2 (110–130 с): Релаксация (15%). Покупка оружия ближнего боя и бронежилета.

    - Натиск 3 (130–185 с): Высокое напряжение (60–85%). Смешанная плотная толпа с
    тяжело бронированными громилами и метателями огня. Арена завалена опасными обломками.

    - Пауза 3 (185–205 с): Релаксация (20%). Финальная закупка перед боссом: максимальный
    импульс пинка, арматурный молот, восстановление здоровья.

    - Натиск 4 / Кульминация (205–270 с): Пиковое напряжение (85–100%). Босс-джаггернаут
    с непробиваемой лобовой броней. Опасность мгновенного нокаута. Победа достигается
    только ювелирным запуском миньонов в уязвимую спину босса.

    - Финал / Зал славы (270–300 с): Катарсис (0%). Замедление времени, победный салют
    уличных купюр, триумфальный шопинг постоянных наград.'
  core_formulas:
  - 'Импульс запуска тела: J_launch = J_base * (1.0 + 0.15 * Lvl_Kick) * Charge_Mult,
    где J_base = 350 Н*с, Lvl_Kick [0..5] (уровень прокачки на верстаке), Charge_Mult
    = 1.0 (быстрый тычок) или 1.45 (зарядка 0.25 с). Диапазон импульса: 350.0–648.4
    Н*с.'
  - 'Начальная скорость полета рэгдолла: V_0 = J_launch / M_victim, где M_victim =
    75 кг (легкий хулиган) -> V_0 = 4.67–8.65 м/с; M_victim = 140 кг (тяжеловес) ->
    V_0 = 2.50–4.63 м/с.'
  - 'Кинетический урон первичного удара о препятствие/врага: Dmg_impact = Dmg_base
    + K_kinetic * 0.5 * M_flying * (V_impact)^2, где Dmg_base = 20 ед., K_kinetic
    = 0.035 Дж^-1. При скорости V_impact = 12.0 м/с и массе 80 кг: Dmg_impact = 20
    + 0.035 * 0.5 * 80 * 144 = 20 + 201.6 = 221.6 ед.'
  - 'Каскадный урон по цепи рикошетов: Dmg_chain(i) = Dmg_impact * (Decay_Factor ^
    i), где Decay_Factor = 0.65 (базовый) или 0.85 (при прокачке кегельбана), i —
    порядковый индекс сбитого врага (i=0: 100%, i=1: 65%, i=2: 42.25%).'
  - 'Дроп уличных наличных за комбо-уничтожение: Cash_drop = Base_Bounty * (1.0 +
    Combo_Tier * 0.3) * (1 + Destroyed_Props_Count * 0.5), где Base_Bounty = $25 за
    рядового бандита, Combo_Tier [1..5], Destroyed_Props_Count — количество разбитых
    объектов окружения в рамках одного кинетического импульса.'
  - 'Порог разрушения конструкций и генерации осколков: F_impact = (M_flying * Delta_V)
    / Delta_t. При F_impact >= 1200 Н деревянный штабель поддонов разрушается, поглощая
    30% импульса снаряда и разбрасывая 4 поражающих деревянных бруса с уроном по 18
    ед. и импульсом 90 Н*с.'
  run_progression:
  - 'Уровень силы армейского берца (Kick Impact Lvl 1..5): ступенчатое увеличение
    импульса запуска на +15% за уровень (с 350 до 612.5 Н*с), позволяющее запускать
    даже 140-килограммовых громил через всю арену.'
  - 'Улучшение кинетической проводимости кегельбана (Chain Conduction Lvl 1..4): снижение
    коэффициента затухания скорости тел при рикошетах с 35% до 12% за соударение,
    открывающее каскадные страйки на 4–6 врагов подряд.'
  - 'Титановый захват и метание (Ballistic Grip Lvl 1..3): увеличение скорости броска
    предметов окружения (с 12 м/с до 22 м/с) и наделение летящих бочек эффектом сквозного
    пробития легких целей.'
  - 'Арсенал тяжелого оружия на верстаке (Weapon Slots): временная покупка сокрушительного
    оружия с ограниченной прочностью на раунд: Арматурный молот (импульс 650 Н*с,
    5 ударов), Бейсбольная бита с гвоздями (урон 80 ед., 6 ударов), Полицейский щит
    (полное блокирование 4 лобовых атак).'
  - 'Стероидный запас здоровья и полевая аптечка: увеличение максимального HP бойца
    со 100 до 220 ед. и мгновенная регенерация 60 HP между раундами за накопленные
    наличные.'
  meta_progression:
  - 'Черный рынок подпольного октагона (Кубки арены): перманентная разблокировка новых
    видов оружия в ассортименте верстака (Двуручная кувалда разрушителя, Электрошоковая
    дубинка, Зажигательный коктейль Молотова) за золотые кубки победы над боссом.'
  - 'Кованая боевая экипировка: перманентные пассивные реликвии бойца (Стальные носки
    берцев ''+12% базового импульса навсегда'', Шипованные налокотники ''+25% урона
    при отскоке от стен'', Магнитный кошелек ''+50% к радиусу сбора купюр'').'
  - 'Лицензия подпольного тотализатора: постоянное увеличение базового множителя выпадения
    наличных на +15%/+30%/+45% за успешное закрытие сессий без использования RV-возрождений.'
  - 'Контракты на элитные арены: разблокировка новых боевых локаций со специфическим
    интерактивным окружением (''Заброшенный автосервис'' с подвешенными двигателями-маятниками,
    ''Крыша небоскреба'' с возможностью сбрасывать врагов в бездну).'
  mechanics:
  - name: spartan_launch_kick
    role_in_loop: 'Главный двигатель и инициатор микро-петли: переводит ближний бой
      в дальнобойный кинетический бильярд'
    player_decision: Выбрать между мгновенным быстрым тычком (0.12 с, импульс 350
      Н*с для прерывания атаки) или заряженным ударом (0.25 с, импульс 520 Н*с для
      дальнего запуска тяжеловеса)
    input_mapping: 'Тач: Быстрый тап по кнопке ''Kick'' (правый нижний угол) — быстрый
      пинок; Зажатие кнопки ''Kick'' с отпусканием — заряженный пинок. ПК: Пробел
      или ЛКМ (быстрое нажатие / удержание). Джойстик/WASD задает вектор направления
      удара.'
    states:
    - IDLE (готовность к удару)
    - WINDUP_CHARGING (замах ногой, набор заряда от 0.0 до 0.25 с, замедление движения
      игрока на 60%)
    - STRIKE_ACTIVE (активный кадр удара коллизией берца, длительность 0.08 с)
    - HITSTOP_FREEZE (микропауза 0.08 с при успешном попадании в тело)
    - RECOVERY (возврат ноги в стойку 0.14 с, уязвимость к боковым атакам)
    parameters:
    - name: base_launch_impulse
      value: 350 Н*с
      tuning_note: Если опустить ниже 260 Н*с, тело врага пролетает меньше 3 метров
        и не долетает до стен; если поднять выше 550 Н*с, тела улетают за пределы
        экрана и игрок теряет контроль над ситуацией.
    - name: charge_time_threshold
      value: 0.25 с
      tuning_note: Если сделать меньше 0.15 с, игрок случайно запускает заряженный
        кик при быстрых тапах; если больше 0.4 с, враги успевают гарантированно ударить
        игрока во время замаха.
    - name: hitstop_duration
      value: 0.08 с
      tuning_note: Если убрать до 0.0 с, удар ощущается как ватный толчок без веса;
        если увеличить до 0.18 с, игра кажется лагающей и ломается темп драки.
    - name: kick_range_reach
      value: 1.8 м
      tuning_note: Если уменьшить до 1.2 м, игрок постоянно промахивается по набегающим
        целям; если увеличить до 2.5 м, создается эффект неестественного притягивания
        удара.
    feedback_layers:
    - 'Визуал/VFX: Дуговой неоновый шлейф по траектории подошвы берца, вспышка белых
      искр в точке контакта, резкий переход меша врага в ragdoll с деформацией скелета'
    - 'Звук (Web Audio): Низкочастотный басовый удар ''WHAM'' (65 Гц суб-бас с синтезированным
      щелчком кости 1.2 кГц), сопровождаемый криком отлетающего бандита'
    - 'Камера: Импульсный шейк амплитудой 0.35G с длительностью 0.18 с и микро-зум
      на 4% в сторону вектора удара'
    - 'UI/Тактильность: Вибрация Haptic Feedback ''Heavy Impact'' (45 мс на мобильных),
      радиальная вспышка белого виньетирования на границах экрана'
    failure_mode: 'Промах пинком по воздуху или попадание в блок тяжеловеса спереди:
      персонаж входит в штрафной Recovery на 0.35 с, проигрывается глухой звук рассекаемого
      воздуха ''WHOOSH'', и боец получает чистый урон от контратаки врагов.'
    mastery_curve: Новичок на 30-й секунде хаотично спамит быстрый пинок в ближайшего
      врага в упор. Эксперт на 10-м забеге держит дистанцию 1.8 м, заряжает кик за
      0.25 с и ювелирно отправляет хулигана по наклонной траектории 25° точно в уязвимую
      спину босса.
    counterplay: Враги со щитами блокируют лобовой импульс на 80%, а быстрые фланкеры
      с ножами уклоняются кувырком в сторону при начале фазы WINDUP_CHARGING, заставляя
      игрока целиться во время движения.
    synergies:
    - Запускает механику kinetic_body_bowling при попадании летящего тела в других
      врагов
    - Активирует механику wall_splat_destruction при контакте тела с баррикадами или
      стенами октагона
    - Выбивает купюры для механики pit_workbench_economy при разрушении объектов телом
    why_unique: Вместо стандартного нанесения урона по хитбоксу с фиксированной анимацией
      смерти, пинок пересчитывает физическую массу цели и превращает противника в
      динамический рэгдолл-снаряд с баллистической траекторией в физическом мире Rapier3D.
    pseudocode: "function on_kick_tick(player, input, dt):\n  if input.kick_pressed:\n\
      \    player.charge_timer = min(0.25, player.charge_timer + dt)\n    player.state\
      \ = 'WINDUP_CHARGING'\n  if input.kick_released:\n    let target = find_target_in_cone(player.pos,\
      \ player.forward, 1.8, 45_deg)\n    if target != null:\n      let mult = (player.charge_timer\
      \ >= 0.25) ? 1.45 : 1.0\n      let impulse = (350.0 + 52.5 * player.kick_lvl)\
      \ * mult\n      trigger_hitstop(0.08); trigger_camera_shake(0.35)\n      target.enter_ragdoll_and_launch(player.forward,\
      \ impulse)\n    player.charge_timer = 0.0; player.state = 'RECOVERY'"
  - name: kinetic_body_bowling
    role_in_loop: 'Источник мультипликативного урона и каскадной награды: масштабирует
      единичный удар в массовую зачистку'
    player_decision: Выстроить угол запуска тела так, чтобы задеть максимальное число
      стоящих за ним врагов по принципу бильярдной оттяжки, вместо одиночной ликвидации
    input_mapping: 'Пассивно-активная механика: траектория задается углом взгляда
      и положением бойца в момент нанесения спартанского кика или броска предмета.'
    states:
    - BODY_AIRBORNE (тело летит со скоростью > 3.0 м/с, активен объемный триггер поражения)
    - CHAIN_COLLISION (момент столкновения летящего тела с другим противником, расчет
      передачи импульса)
    - MULTI_KNOCKDOWN (опрокидывание сбитых врагов в рэгдолл с наложением оглушения
      на 1.2 с)
    - MOMENTUM_DAMPED (падение скорости тела ниже 1.5 м/с, переход в режим лежачего
      тела на полу)
    parameters:
    - name: chain_energy_transfer
      value: 65%
      tuning_note: Если сделать передачу выше 85%, один пинок зачищает всю арену без
        усилий игрока; если ниже 40%, кегельбан затухает на первом же столкновении
        и теряется зрелищность.
    - name: knockdown_stun_duration
      value: 1.2 с
      tuning_note: Если меньше 0.6 с, сбитые враги встают мгновенно и бьют игрока
        в спину; если больше 2.0 с, игра превращается в безнаказанное избиение лежачих.
    - name: combo_cash_multiplier
      value: 1.3x за сбитое тело
      tuning_note: Если уменьшить до 1.05x, у игрока нет стимула целиться в толпу;
        если поднять до 2.0x, экономика ломается после первой удачной волны.
    - name: min_lethal_speed
      value: 3.5 м/с
      tuning_note: Если поднять до 6.0 м/с, рикошеты перестают наносить урон вторичным
        целям; если опустить до 1.0 м/с, медленно скользящие трупы нелепо убивают
        врагов касанием.
    feedback_layers:
    - 'Визуал/VFX: Вспышка желто-оранжевых лучевых линий (Impact Lines) в точках контакта,
      каскадный разлет спрайтов наличных долларов и всплывающие цифры урона с множителем
      ''x2 STRIKE!'', ''x3 SPARE!'''
    - 'Звук (Web Audio): Звук глухого удара боулинг-шара о кегли ''THUD-CRACK'', переходящий
      в стеклянный звон выбитых зубов и монет'
    - 'Камера: Микро-толчки камеры по направлению рикошета (шейк 0.2G на каждое сбитое
      тело) с динамическим расширением FOV с 60° до 65°'
    - 'UI/Тактильность: Серия быстрых виброоткликов (Light Haptic) с интервалом 0.1
      с при каждом последовательном сбивании врага в цепочке'
    failure_mode: 'Запуск тела в пустоту или в бронированный лоб неподвижного босса:
      снаряд мгновенно останавливается, не задев никого, комбо сбрасывается до х1.0,
      а игрок теряет возможность заработать бонусный кэш.'
    mastery_curve: Новичок сбивает максимум 1 дополнительного врага случайно. Эксперт
      рассчитывает угол рикошета 45° от боковой стены октагона, сбивая за один полет
      4 врагов и направляя финальный отскок в красную бочку.
    counterplay: Тяжелые бойцы весом 140 кг обладают высоким сопротивлением опрокидыванию
      и поглощают до 70% импульса летящего тела, останавливая цепную реакцию кегельбана.
    synergies:
    - Получает начальный импульс от механики spartan_launch_kick
    - Усиливает генерацию кэша для покупок в pit_workbench_economy
    - Может быть скомбинирован с механикой prop_tactical_hurdle для двойного сбивания
    why_unique: Импульс передается через реальные твердотельные коллизии Rapier3D
      с учетом закона сохранения импульса и массы тел, а не через искусственный сферический
      сплэш-триггер.
    pseudocode: "function on_ragdoll_collision(flying_body, hit_enemy, normal):\n\
      \  let rel_speed = flying_body.velocity.length()\n  if rel_speed >= 3.5:\n \
      \   let dmg = 20.0 + 0.035 * 0.5 * flying_body.mass * (rel_speed ^ 2)\n    hit_enemy.apply_damage(dmg)\n\
      \    let chain_impulse = flying_body.velocity * flying_body.mass * 0.65\n  \
      \  hit_enemy.enter_ragdoll_and_launch(flying_body.velocity.normalize(), chain_impulse.length())\n\
      \    flying_body.velocity = reflect(flying_body.velocity, normal) * 0.5\n  \
      \  spawn_cash_and_combo_popups(hit_enemy.pos, dmg)\n    trigger_chain_feedback(hit_enemy.pos)"
  - name: prop_tactical_hurdle
    role_in_loop: 'Тактический инструмент контроля дистанции и источник взрывного
      урона: превращает окружение в оружие'
    player_decision: Использовать подобранную биту/трубу в ближнем бою для гарантированного
      нокаута (3–5 ударов) или мгновенно метнуть её через арену для сбивания опасного
      метателя коктейлей Молотова
    input_mapping: 'Тач: Кнопка ''Grab/Throw'' над кнопкой удара. Автоподбор при нахождении
      в радиусе 1.2 м от предмета; повторный тап — бросок в направлении прицела. ПК:
      Клавиша E — подбор, ПКМ / F — бросок.'
    states:
    - GROUND_PROP (предмет лежит на полу, подсвечивается неоновым контуром)
    - HELD_IN_HANDS (предмет в руках бойца, заменяет базовую атаку на усиленный взмах)
    - BALLISTIC_THROWN (предмет летит по параболе со скоростью 14–22 м/с)
    - IMPACT_DESTROYED (предмет раскалывается при ударе о врага/стену, нанося урон
      и генерируя осколки)
    parameters:
    - name: throw_velocity_base
      value: 16.0 м/с
      tuning_note: Если сделать ниже 10 м/с, бросок ощущается вялым и враги успевают
        отойти; если выше 26 м/с, бросок превращается в мгновенный хитскан без ощущения
        полета физического объекта.
    - name: explosive_barrel_radius
      value: 4.5 м
      tuning_note: Если радиус меньше 3.0 м, взрыв редко задевает больше одного врага;
        если больше 6.0 м, игрок постоянно сам попадает под собственную взрывную волну.
    - name: melee_weapon_durability
      value: 4 удара
      tuning_note: Если дать 1–2 удара, оружие кажется бесполезным мусором; если дать
        10 ударов, игрок перестает пользоваться пинками и игра скатывается в закликивание
        оружием.
    - name: auto_aim_assist_angle
      value: 20 градусов
      tuning_note: Если убрать ассист до 0°, на тачскрине невозможно попасть броском
        по бегущим врагам; если сделать 45°, прицел самовольно срывается на случайных
        второстепенных врагов.
    feedback_layers:
    - 'Визуал/VFX: Вращающийся физический меш в воздухе с траекторным дымовым следом
      (Trail Renderer), вспышка огненного взрыва при детонации бочки с разлетом горящих
      обломков'
    - 'Звук (Web Audio): Свист рассекаемого воздуха ''SWOOSH'' в полете, звонкий металлический
      лязг трубы о череп ''CLANG'' или оглушительный взрыв бочки ''KABOOM'' (80 Гц
      низкий бас с дисторшном)'
    - 'Камера: При взрыве бочки — круговой радиальный импульс камеры с затуханием
      0.25 с и кратковременным хроматическим аберрационным смещением'
    - 'UI/Тактильность: Двойной Haptic клик при подборе предмета и тяжелая отдача
      при броске'
    failure_mode: 'Бросок предмета мимо цели в пустую стену или детонация бочки вблизи
      игрока: предмет безвозвратно теряется, а взрывной волной игрок получает 35 ед.
      урона и опрокидывается на 0.8 с.'
    mastery_curve: Новичок подбирает трубу и бездумно машет ею до поломки. Эксперт
      на бегу подхватывает бочку с горючим, швыряет её навесом через толпу точно под
      ноги боссу и в полете подрывает её броском железной трубы.
    counterplay: Ловкие ниндзя-фланкеры могут сбивать летящие легкие предметы ударом
      ноги в воздухе, перенаправляя их обратно в сторону игрока.
    synergies:
    - Брошенные предметы могут подрывать бочки, создавая условия для signature_moment
    - Сломанное оружие оставляет осколки для механики wall_splat_destruction
    - Покупка тяжелого оружия на верстаке pit_workbench_economy расширяет пул доступных
      предметов
    why_unique: 'Любой предмет окружения (от доски до 200-литровой бочки) обладает
      двойной функциональностью: полноценное контактное оружие с уникальным мувсетом
      или баллистический метательный снаряд с автодоводкой.'
    pseudocode: "function on_prop_action(player, input, world):\n  if input.grab_pressed\
      \ and player.held_prop == null:\n    let prop = world.find_nearest_prop(player.pos,\
      \ 1.2)\n    if prop != null: player.held_prop = prop; prop.attach_to_hand(player)\n\
      \  else if input.throw_pressed and player.held_prop != null:\n    let target_dir\
      \ = player.get_aim_vector_with_assist(20_deg)\n    let throw_speed = 16.0 +\
      \ 3.0 * player.throw_lvl\n    player.held_prop.launch_projectile(target_dir\
      \ * throw_speed)\n    player.held_prop = null\n    trigger_throw_sound_and_haptic()"
  - name: wall_splat_destruction
    role_in_loop: 'Источник позиционного преимущества и генератор вторичных снарядов:
      вознаграждает за прижимание врагов к краям арены'
    player_decision: Направить удар во врага в сторону прочной бетонной стены для
      максимального сокрушительного урона от сплэта или в сторону деревянной баррикады
      для ее разрушения и высвобождения прохода/наличных
    input_mapping: 'Позиционная механика: срабатывает автоматически при столкновении
      любого рэгдолла или брошенного предмета с препятствиями и границами октагона.'
    states:
    - WALL_IMPACT (контакт тела/предмета с поверхностью стены или баррикады)
    - 'FORCE_CALCULATION (проверка порога прочности: деформация стены vs разрушение
      в щепки)'
    - WALL_SPLAT_PIN (кратковременное 'прилипание' врага к стене на 0.2 с с получением
      контузии)
    - SHRAPNEL_BURST (генерация 3–5 физических осколков с радиальным вектором разлета)
    parameters:
    - name: wall_splat_bonus_dmg
      value: 45 ед.
      tuning_note: Если опустить ниже 20 ед., игрок игнорирует позиционирование у
        стен; если поднять выше 90 ед., бойцы гибнут от одного случайного касания
        сетки.
    - name: destructible_force_threshold
      value: 1200 Н
      tuning_note: Если сделать порог меньше 600 Н, все укрытия и ящики разваливаются
        от малейшего тычка на первой секунде; если больше 2200 Н, баррикады кажутся
        монолитными и не ломаются.
    - name: shrapnel_fragment_count
      value: 4 осколка
      tuning_note: Если спавнить больше 8 осколков, падает FPS в Three.js на мобильных
        устройствах; если меньше 2, теряется ощущение сокрушительного взрыва конструкции.
    - name: wall_stick_duration
      value: 0.2 с
      tuning_note: Если сделать меньше 0.05 с, сплэт визуально не считывается; если
        сделать больше 0.5 с, враг неестественно висит на стене как приклеенный.
    feedback_layers:
    - 'Визуал/VFX: Появление трещин и разломов на текстуре стены (Decal Spawner),
      облако цементной/деревянной пыли, разлет физических досок и арматуры'
    - 'Звук (Web Audio): Сокрушительный хруст ломающегося дерева ''CRACK-CRUNCH''
      или тяжелый металлический резонанс удара о сетку октагона ''CLANG-RATTLE'''
    - 'Камера: Однократный резкий направленный импульс тряски камеры от точки удара
      о стену (шейк 0.3G)'
    - 'UI/Тактильность: Мощный тактильный щелчок ''Heavy Splat'' на мобильных устройствах,
      всплывающий маркер ''WALL CRUSH!'''
    failure_mode: 'Игрок сам отлетает в стену от взрыва бочки или тарана босса: боец
      получает 45 ед. сплэт-урона, теряет управление на 0.4 с и роняет оружие из рук.'
    mastery_curve: Новичок бьет врагов в центр пустой арены, нанося базовый урон.
      Эксперт загоняет тяжеловесов спиной к бетонным опорам и методично впечатывает
      их в стены серией пинков с получением 200% суммарного урона.
    counterplay: Некоторые стены октагона оборудованы шипованными панелями и электрическими
      щитками, контакт с которыми наносит взаимный урон как врагам, так и зазевавшемуся
      игроку.
    synergies:
    - Срабатывает от тел, запущенных через spartan_launch_kick
    - Осколки разрушенных стен выступают подбираемыми снарядами для prop_tactical_hurdle
    - Разбитые ящики выбрасывают дополнительные пачки наличных для pit_workbench_economy
    why_unique: 'Разрушение окружения является процедурным: в точке удара геометрия
      распадается на физические твердые тела Rapier3D, которые сами становятся летальным
      вторичным оружием.'
    pseudocode: "function on_wall_impact(body, obstacle, contact_point):\n  let impact_force\
      \ = body.mass * (body.velocity.length() / 0.016)\n  if obstacle.is_destructible\
      \ and impact_force >= 1200.0:\n    obstacle.shatter_into_pieces(4, contact_point)\n\
      \    spawn_cash_loot(contact_point, 30)\n    trigger_wall_destruction_vfx(contact_point)\n\
      \  else:\n    body.apply_damage(45.0)\n    body.stick_to_wall(contact_point,\
      \ 0.2)\n    trigger_splat_feedback(contact_point)"
  - name: pit_workbench_economy
    role_in_loop: 'Регулятор темпа и двигатель внутриматчевой прогрессии: конвертирует
      боевые успехи в рост огневой мощи'
    player_decision: Инвестировать заработанный кэш в пассивное усиление импульса
      пинка, купить тяжелое убойное оружие для быстрой зачистки или докупить восстанавливающее
      зелье/броню перед опасным натиском
    input_mapping: 'Тач/Мышь: Тап по интерактивным карточкам верстака в межраундовом
      UI меню; кнопка ''В бой!'' для досрочного запуска следующей волны со стартовым
      бонусом $50.'
    states:
    - LOCKED_DURING_WAVE (верстак спрятан под люком в центре арены во время боя)
    - UNLOCKED_BETWEEN_WAVES (верстак поднимается на гидроприводах под свет прожекторов)
    - SHOPPING_ACTIVE (игрок выбирает и оплачивает апгрейды за заработанные в раунде
      купюры)
    - ROUND_STARTING (обратный отсчет 3 с, люк закрывается, спавнятся новые враги)
    parameters:
    - name: kick_upgrade_cost_base
      value: $150
      tuning_note: Если сделать дешевле $80, игрок максимизирует силу на 2-й волне;
        если дороже $300, невозможно купить ни одного апгрейда без идеального комбо.
    - name: sledgehammer_weapon_cost
      value: $220
      tuning_note: Если поднять до $400, оружие не покупают из-за страха потерять
        деньги; если снизить до $100, игрок перестает ценить пинки и дерется только
        кувалдой.
    - name: medkit_heal_amount
      value: 60 HP
      tuning_note: Если лечить на 20 HP, цена лечения не оправдывает риск; если лечить
        на 100 HP (полный столб), игрок не боится пропускать удары в бою.
    - name: early_start_cash_bonus
      value: $50
      tuning_note: Если дать $10, никто не пропускает таймер подготовки; если дать
        $150, игроки торопятся и выходят в бой без обдуманного билда.
    feedback_layers:
    - 'Визуал/VFX: Подъем гидравлической платформы верстака с искрами и паром, неоновое
      голографическое свечение доступных апгрейдов, анимация экипировки титановых
      накладок на бойца'
    - 'Звук (Web Audio): Звуковой сигнал кассового аппарата ''CHA-CHING!'', механический
      гул гидропривода и металлический стук закрепляемого на поясе молота'
    - 'Камера: Плавный кинематографический наезд камеры на верстак (FOV 50°) во время
      фазы покупок и отъезд в боевую изометрию (FOV 60°) при старте волны'
    - 'UI/Тактильность: Тактильный щелчок Haptic Selection при клике на карточки улучшений,
      динамический счетчик купюр с плавной анимацией начисления'
    failure_mode: 'Неправильное распределение денег (например, покупка дорогого оружия
      вместо необходимого лечения при 15 HP): боец выходит на босса с низким здоровьем
      и погибает от первой шальной пули/бочки.'
    mastery_curve: Новичок тратит все деньги на лечение после каждого раунда из-за
      частых ошибок. Эксперт проходит раунды без урона, вкладывает 100% кэша в множители
      импульса и кегельбана, удваивая экономику к 4-й волне.
    counterplay: 'Инфляция черного рынка: с каждым натиском стоимость лечения возрастает
      на +20%, а новые враги начинают спавниться с экипировкой, требующей более дорогих
      контр-апгрейдов.'
    synergies:
    - Питается валютой, генерируемой механиками spartan_launch_kick и kinetic_body_bowling
    - Улучшает параметры броска для prop_tactical_hurdle
    - Повышает порог пробития стен для wall_splat_destruction
    why_unique: Верстак — это не статичное абстрактное меню паузы, а физический интерактивный
      объект в центре октагона, который открывается строго в перерывах между натисками
      и меняет физические свойства бойца в реальном времени.
    pseudocode: "function on_workbench_purchase(player, item_type, cost):\n  if player.cash\
      \ >= cost:\n    player.cash -= cost\n    match item_type:\n      'KICK_UPGRADE':\
      \ player.kick_lvl += 1; player.update_gear_visuals()\n      'BUY_HAMMER': player.equip_heavy_weapon('HAMMER',\
      \ 5_durability)\n      'MEDKIT': player.hp = min(player.max_hp, player.hp +\
      \ 60)\n    trigger_purchase_vfx_and_sound(player.pos)\n    return true\n  return\
      \ false"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 80
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - description: Rapier3D World, Rigidbody/Collider sync, Ragdoll bone controllers,
      Collision events
    name: Physics & Simulation
  - description: Three.js SceneGraph, Low-poly Mesh instances, Custom Shaders (Impact
      rings, Rim light), Particle Emitters
    name: Render & Visuals
  - description: Player Controller, Enemy AI State Machine, Wave Coordinator, Workbench
      Shop System
    name: Gameplay & Logic
  - description: Howler sound manager, Hitstop timer, Camera Shake & FOV pulse, Post-processing
      vignette
    name: Audio & Juice
  - description: HTML5/CSS Canvas Overlay, Touch Gesture Recognizer, Playgama Bridge
      SDK integration
    name: UI & Platform Bridge
  modules:
  - name: PlayerActor
    path: src/actors/PlayerActor.ts
    purpose: Управление бойцом, обработка ввода, запуск анимаций и импульсов атак
  - name: RagdollSystem
    path: src/physics/RagdollSystem.ts
    purpose: Управление переходом врагов из кинематического состояния в динамический
      рэгдолл
  - name: DestructionManager
    path: src/physics/DestructionManager.ts
    purpose: Процедурный спавн обломков разрушенных ящиков и столов при превышении
      импульса
  - name: CombatEngine
    path: src/combat/CombatEngine.ts
    purpose: Расчет векторов импульса, детекция коллизий, начисление цепного урона
  - name: WaveDirector
    path: src/systems/WaveDirector.ts
    purpose: Координация спавна 4 натисков уличных банд и спавна финального босса
  - name: WorkbenchStore
    path: src/systems/WorkbenchStore.ts
    purpose: Управление внутриматчевыми покупками апгрейдов и оружия между раундами
  - name: JuiceController
    path: src/juice/JuiceController.ts
    purpose: Управление хитстопом, тряской камеры, вспышками и деформацией времени
  - name: BridgeService
    path: src/platform/BridgeService.ts
    purpose: Интеграция с Playgama SDK (баннеры, интерстишиалы, реварды, облачные
      сейвы)
monetization:
  strategy_summary: 'Гибридная модель: мягкая ненавязчивая монетизация через Rewarded
    Video за критические бонусы (второй шанс / удвоение наличных за раунд) и тактичные
    Interstitial между матчами.'
  rewarded_placements:
  - id: revive_second_wind
    name: Второе дыхание (Revive)
    benefit: Мгновенное воскрешение бойца с 50% HP и ударной кинетической волной,
      раскидывающей всех врагов вокруг
    cooldown_or_limit: 1 раз за матч
    trigger_moment: Экран нокаута игрока при обнулении HP
  - id: double_cash_round
    name: Двойной куш (Double Cash)
    benefit: Удвоение всех собранных за завершившийся раунд уличных наличных перед
      походом к верстаку
    cooldown_or_limit: 1 раз за раунд
    trigger_moment: Экран завершения натиска перед открытием верстака
  - id: legendary_weapon_crate
    name: Контрабандный арсенал (Weapon Drop)
    benefit: Мгновенное получение золотого Арматурного Молота на текущий раунд
    cooldown_or_limit: 1 раз за матч
    trigger_moment: Кнопка на экране верстака
  interstitial_placements:
  - trigger_event: match_finish_or_game_over
    cooldown_seconds: 90
    conditions: Показ только после завершения полного матча (победа или поражение),
      не чаще 1 раза в 90 секунд, никогда не прерывает бой
  in_app_purchases:
  - sku: no_ads_vip_gloves
    name: 'VIP Набор: Без Рекламы + Неоновые Перчатки'
    description: Отключение межстраничной рекламы навсегда + эксклюзивный скин 'Неоновый
      Гладиатор' с постоянным +10% к стартовому импульсу
    price_tier: Tier 2 ($1.99 / 199 Янов)
    reward: No Ads + Skin + 500 стартовых кубков
  fairness_rules:
  - 'Никакого Pay-to-Win: все уровни и боссы проходятся исключительно за счет навыка
    рикошетов и реакции.'
  - Реклама никогда не прерывает активный бой или движение игрока.
  - Rewarded Video всегда дает понятную и мгновенную награду без скрытых условий.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - game distribution
  - web
  initialization_flow:
  - Bridge.init() на старте бандла перед загрузкой 3D ассетов
  - Определение типа платформы и устройства (ПК / Мобильный)
  - Загрузка Cloud Save данных игрока (кубки, разблокированное оружие, рекорды)
  - Инициализация баннерной рекламы в safe area (если поддерживается)
  - Старт игрового цикла Three.js и скрытие системного прелоадера
  cloud_save_keys:
  - player_cups
  - unlocked_weapons
  - best_combo_chain
  - sound_settings
  - selected_skin
  leaderboards:
  - global_champion_cups
  - max_kinetic_chain_combo
  ads_integration:
    banner_desktop_bottom: true
    interstitial_cooldown: 90
    rewarded_auto_pause: true
  lifecycle_hooks:
  - Bridge.on('pause', () => AudioEngine.muteAll() && GameEngine.pause())
  - Bridge.on('resume', () => AudioEngine.unmuteAll() && GameEngine.resume())
