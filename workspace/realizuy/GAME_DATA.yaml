qa:
  functional_tests:
  - Проверка корректной передачи кинетического импульса от пинка игрока телу врага
    (скорость отлета не менее 25 м/с при базовой силе)
  - 'Проверка срабатывания цепных столкновений: летящий рэгдолл наносит урон и сбивает
    с ног других мобов на своем пути'
  - Проверка процедурного разрушения ящиков и столов при контакте с телом или оружием
    с достаточным импульсом
  - 'Проверка работы верстака: списание наличных, корректное увеличение характеристик
    (сила пинка, HP, урон)'
  - Проверка переключения управления между клавиатурой/мышью на десктопе и тач-управлением
    на смартфонах
  - 'Проверка возрождения за Rewarded Video: корректный сброс кулдауна, восстановление
    HP и отталкивающая волна'
  performance_benchmarks:
  - Стабильные 60 FPS на ПК в Chrome/Edge/Firefox при 25 одновременно активных мобах
    и 10 разрушаемых пропсах
  - Не менее 55-60 FPS на мобильных устройствах среднего уровня (Snapdragon 778G /
    Helio G99 / iPhone 11) в WebGL
  - Время инициализации и полной загрузки 3D сцены не превышает 2.5 секунд на 4G соединении
  - Размер исходного JS/WASM бандла с Three.js и Rapier3D не превышает 4.5 МБ
  cross_browser_matrix:
  - Desktop Chrome / Edge (Windows, macOS, Linux)
  - Desktop Firefox / Safari (macOS)
  - Mobile Safari (iOS 15+)
  - Mobile Chrome / Yandex Browser (Android 10+)
  common_bug_checklist:
  - 'Застревание рэгдолла в геометрии стен (решение: непрерывное обнаружение столкновений
    CCD в Rapier3D)'
  - 'Утечка памяти при частом спавне и разрушении ящиков (решение: строгий Object
    Pooling для мешей обломков)'
  - 'Рассинхрон аудио при скрытии вкладки браузера (решение: отслеживание Page Visibility
    API и пауза звука через Bridge SDK)'
  - 'Залипание виртуального стика при мультитаче (решение: привязка touch identifier
    к конкретному пальцу)'
roadmap:
- phase_number: 1
  title: Физическое ядро и перемещение
  duration_days: 3
  tasks:
  - Настройка проекта Vite + Three.js + Rapier3D compat
  - Создание контроллера бойца от 3-го лица с динамической follow-камерой
  - Реализация плавающего сенсорного стика и раскладки клавиатуры
  milestone_deliverable: Перемещение бойца по арене с отзывчивым контролем на ПК и
    тач-устройствах, базовая сцена Three.js + Rapier3D.
- phase_number: 2
  title: Боевая система, пинки, рэгдолл и цепные реакции
  duration_days: 3
  tasks:
  - Создание сочлененного рэгдолла врагов в Rapier3D
  - Реализация механики спартанского фронт-кика с расчетом импульса
  - Программирование цепных столкновений (Body Bowling) и хитстопа 0.08с
  milestone_deliverable: Полноценный спартанский пинок с переходом врагов в рэгдолл,
    расчет цепных рикошетов и микро-хитстоп.
- phase_number: 3
  title: Разрушаемое окружение, подбор оружия и верстак
  duration_days: 3
  tasks:
  - Создание процедурно разрушаемых пропсов (ящики, столы, бочки)
  - Механика подбора (E) и метания (Q) предметов и оружия
  - Реализация интерфейса и логики верстака с прокачкой характеристик
  milestone_deliverable: Арена с интерактивными ящиками, бочками и оружием, рабочий
    экран верстака между раундами.
- phase_number: 4
  title: Натиски врагов, ИИ толпы и Босс-Джаггернаут
  duration_days: 3
  tasks:
  - Программирование AI уличных бойцов (легкие, быстрые, вооруженные, тяжеловесы)
  - Создание режиссера волн (Wave Director) и спавнера
  - Разработка паттернов поведения и фаз битвы с финальным Боссом
  milestone_deliverable: Полный сессионный цикл из 4 натисков с нарастающей сложностью
    и уникальным поведением Босса-Джаггернаута.
- phase_number: 5
  title: Полировка 'Juice', UI/UX, монетизация и релиз
  duration_days: 2
  tasks:
  - Настройка VFX (кольца удара, щепки, неоновые следы) и аудио Howler.js
  - Интеграция Playgama Bridge (Cloud Save, Rewarded Video, Interstitials, Leaderboards)
  - Оптимизация производительности WebGL и финальное тестирование на устройствах
  milestone_deliverable: Релизная сборка игры с сочными визуальными/звуковыми эффектами
    и полной интеграцией Playgama SDK.
risks:
- risk: Производительность физики Rapier3D при большом количестве одновременных рэгдоллов
    на мобильных браузерах.
  category: technical
  severity: High
  mitigation: Жесткий лимит до 8 активных рэгдоллов одновременно; перевод остальных
    упавших тел в состояние Sleep; использование упрощенных капсульных коллайдеров
    для конечностей.
- risk: Риск потери контроля и хаотичности поведения рэгдоллов ('эффект лапши').
  category: gameplay
  severity: Medium
  mitigation: Настройка высоких угловых демпфирований (damping) и ограничений углов
    сочленений; жесткий векторный импульс в центр массы с приоритетом направленного
    полета.
- risk: Читаемость боя в динамике при множестве разрушений и частиц на небольшом экране
    смартфона.
  category: design
  severity: Medium
  mitigation: Контрастная неоновая палитра, яркие силуэтные шейдеры (Rim Light) для
    врагов, динамический фокус камеры и автоматическое скрытие обломков через 3 секунды.
- risk: Ограничение бандла Яндекс Игр для быстрого старта игроков.
  category: platform
  severity: Medium
  mitigation: Использование процедурной low-poly геометрии, отказ от тяжелых текстур
    в пользу палитры вершинных цветов и сжатых WebP атласов.
skills:
- skill_id: rapier-ragdoll-physics
  name: Физический Рэгдолл и Кинетика в Rapier3D
  filename: skills/rapier_ragdoll.md
  purpose: Создание стабильного, оптимизированного и зрелищного рэгдолла с честной
    передачей импульса для браузерного 3D.
  when_to_use: При разработке физических экшенов с рукопашным боем, падениями и полетами
    персонажей от ударов.
  rules:
  - Использовать только примитивные коллайдеры (Capsule, Sphere, Box) для костей рэгдолла
  - Максимум 10 твердых тел на одного персонажа (голова, торс, таз, плечи, предплечья,
    бедра, голени)
  - Автоматический перевод спящих рэгдоллов в статический режим через 3 секунды после
    остановки
  architecture: Модульная связка Three.js SkinnedMesh с сочлененными динамическими
    твердыми телами Rapier3D через SphericalJoint и ConeTwistJoint с пороговым триггером
    перехода IsKinematic -> IsDynamic.
  implementation_guidance: При получении урона отключать костный аниматор, считывать
    текущие мировые трансформации костей, передавать их в коллайдеры Rapier3D и прикладывать
    расчетный вектор импульса в точку попадания.
  common_mistakes:
  - Использование тяжелых тримеш-коллайдеров вместо легких капсул и сфер
  - Отсутствие ограничений на суставах, приводящее к выкручиванию конечностей ('спагетти-эффект')
  - Забытое отключение обновления костей от скелетной анимации во время активной физики
    рэгдолла
  checklist:
  - Коллайдеры конечностей не пересекаются в исходной T-позе
  - Включен CCD (Continuous Collision Detection) для торса и головы
  - Настроены коэффициенты линейного и углового демпфирования (damping 1.5–2.0)
  - Реализован пулинг рэгдоллов с лимитом 8 активных тел
  knowledge_refs:
  - mechanics/ragdoll.md
  - mechanics/chain_reaction.md
- skill_id: kinetic-juice-feedback
  name: Кинетический Сок и Импакт Усиления
  filename: skills/kinetic_juice.md
  purpose: Создание сокрушительного физического отклика на каждый удар, взрыв и столкновение.
  when_to_use: При полировке боевой системы для достижения эйфорического тактильного
    чувства мощи удара.
  rules:
  - Хитстоп применяется только к мощным пинкам и критическим рикошетам (длительность
    0.06–0.09 с)
  - Тряска камеры всегда направлена по вектору удара с быстрым затуханием (0.15–0.2
    с)
  architecture: EventBus слушает события OnHit/OnKick/OnDestroy и триггерит таймер
    TimeScale, шейкер камеры и инстансированные эмиттеры частиц.
  implementation_guidance: Хитстоп реализуется через кратковременное замедление delta_time
    в основном цикле физики и анимации на 0.08с с последующим плавным возвратом к
    норме.
  common_mistakes:
  - Слишком длинный хитстоп (>0.12 с), создающий ощущение фриза и лагов игры
  - Линейная тряска камеры, вызывающая укачивание у мобильных игроков
  checklist:
  - Хитстоп не блокирует обработку ввода игрока
  - Тряска камеры затухает по экспоненциальной кривой без резких рывков
  - Частицы используют общий атлас и шейдерные инстансы
  knowledge_refs:
  - juice/hitstop_and_screenshake.md
- skill_id: procedural-destruction-pooling
  name: Процедурное Разрушение и Пул Обломков
  filename: skills/procedural_destruction.md
  purpose: Эффективное разрушение ящиков, бочек и мебели на 3D арене без падения производительности.
  when_to_use: При создании интерактивного разрушаемого окружения в браузерных 3D
    играх.
  rules:
  - Не более 6 обломков на 1 разрушаемый объект
  - Все обломки управляются через централизованный Object Pool с нулевым GC (Garbage
    Collection)
  architecture: Разбиение меша объекта на 4-6 заранее запеченных осколков в пуле,
    активируемых с приданием импульса при превышении предела прочности.
  implementation_guidance: Хранить в пуле готовые группы мешей обломков. При ударе
    скрывать целый меш ящика, активировать группу осколков на его месте и прикладывать
    радиальный импульс от точки удара.
  common_mistakes:
  - Динамическое триангулирование и нарезка геометрии в рантайме (вызывает микрофризы
    в WebGL)
  - Оставление сотен активных физических осколков на сцене, просаживающих FPS
  checklist:
  - Обломки спавнятся из пула без аллокаций памяти во время боя
  - Коллайдеры осколков используют упрощенные Convex Hull или Box геометрии
  - Включено авто-скрытие осколков через 3 секунды с плавным погружением под пол
  knowledge_refs:
  - mechanics/physics_destruction.md
- skill_id: touch-combat-gestures
  name: Жестовый Боевой Ввод для Мобильного WebGL
  filename: skills/touch_gestures.md
  purpose: Обеспечение идеальной эргономики управления и мгновенного распознавания
    пинков/ударов на сенсорных экранах.
  when_to_use: При адаптации 3D экшенов и браулеров под мобильные браузеры и платформу
    Яндекс Игр.
  rules:
  - Плавающий джойстик спавнится в точке первого касания в левой зоне экрана
  - Свайп вперед по кнопке атаки инициирует спартанский пинок, одиночный тап — комбо
    ударов
  architecture: Слушатель touchstart/touchmove/touchend с анализом вектора дельты
    и времени касания для дифференциации тапа, холда и резкого свайпа.
  implementation_guidance: Свайп детектируется при скорости перемещения пальца более
    800 px/s на дистанцию более 40 px за время менее 150 мс.
  common_mistakes:
  - Использование мышиных событий вместо Pointer/Touch Events
  - Отсутствие компенсации безопасных зон (Safe Area Insets) на экранах с вырезами
  checklist:
  - Использован touch.identifier для предотвращения сброса ввода при касании вторым
    пальцем
  - 'Установлен CSS touch-action: none на игровом canvas'
  - Радиус мертвого пространства (deadzone) стика настроен на 12–15 пикселей
  knowledge_refs:
  - platforms/yandex_games_optimization.md
- skill_id: game_skill
  name: 'Kick Arena: Кинетический Рикошет Domain Architecture'
  filename: GAME_SKILL.md
  purpose: 'Defines domain rules, state machine, and core gameplay loop for Kick Arena:
    Кинетический Рикошет.'
  when_to_use: Use when writing or modifying core game state, loop coordination, and
    progression.
  rules:
  - Strict TypeScript strict mode without any 'any' types.
  - Fixed 60Hz delta accumulator with delta clamping.
  - Decoupled state management via typed EventBus.
  - Zero runtime object allocations inside the 60Hz game loop.
  architecture: 'Decoupled 3-layer architecture: Application/Platform -> Engine/Systems
    -> Rendering/UI.'
  implementation_guidance: Instantiate Game instance from main.ts, bootstrap PlaygamaService,
    and start GameLoop.
  common_mistakes:
  - Do not instantiate Three.js meshes or heavy objects inside tick loops.
  - Do not bypass the EventBus for cross-system communications.
  checklist:
  - Game initializes cleanly and loads within 3 seconds.
  - EventBus routes inputs and system events without memory leaks.
  - Audio auto-pauses and unpauses cleanly with browser focus changes.
  knowledge_refs: []
- skill_id: gameplay_skill
  name: Combat, Physics & Movement Systems
  filename: GAMEPLAY_SKILL.md
  purpose: Defines standards for physics simulation, combat mechanics, and tactile
    player feedback.
  when_to_use: Use when writing character controllers, weapon systems, collision listeners,
    and juice/VFX.
  rules:
  - Clamp delta time to maximum 100ms to prevent physics tunneling.
  - Use continuous collision detection (CCD) for fast projectiles.
  - Apply hitstop (40ms time dilation) on impactful strikes.
  - Always synchronize physics rigid body transforms to mesh representations.
  architecture: Physics engine (Rapier3D/Matter.js) stepped on fixed 60Hz timestep,
    meshes interpolated.
  implementation_guidance: Use EventBus to emit 'entity:hit', 'combat:parry', 'wave:cleared'
    events for sound and VFX triggers.
  common_mistakes:
  - Never modify transform matrices directly on physics-controlled entities.
  - Do not hardcode magic numbers for damage or velocities without centralized configuration.
  checklist:
  - Player movement is responsive with no input lag.
  - Hits produce satisfying sensory feedback (VFX spark, screen shake, audio impact).
  - Ragdoll or death animations trigger smoothly without physics jitter.
  knowledge_refs: []
- skill_id: renderer_skill
  name: THREEJS WebGL Performance Guide
  filename: RENDERER_SKILL.md
  purpose: Optimization and visual standards for THREEJS WebGL pipeline.
  when_to_use: Use when configuring scenes, cameras, lighting, materials, instanced
    meshes, and particle systems.
  rules:
  - Keep active draw calls strictly under 80.
  - Use InstancedMesh for debris, bullets, and crowd mobs.
  - Clamp pixel ratio to Math.min(window.devicePixelRatio, 1.5) on mobile.
  - Share material instances across identical geometry.
  architecture: Scene graph with pre-allocated sprite and mesh pools, dynamic shadow
    frustum optimization.
  implementation_guidance: Initialize renderer with antialias enabled on desktop,
    powerPreference 'high-performance'.
  common_mistakes:
  - Do not construct new Geometries, Textures, or Materials in the render loop.
  - Do not leave unused GPU assets without calling .dispose().
  - Do not tune quality from raw frame time — under vsync every frame reads as budget-length.
  - Do not launch in reduced quality and climb up; start optimistic and step down.
  checklist:
  - Maintains solid 60 FPS on desktop and >= 50 FPS on mobile.
  - No WebGL context loss errors on tab switches.
  - Shadow map renders crisp without artifact acne.
  - The quality auto-tuner converges and locks instead of oscillating.
  knowledge_refs:
  - threejs/performance_guide.md
  - threejs/adaptive_quality.md
  - threejs/procedural_mesh_builder.md
  - threejs/physics_integration.md
  - threejs/procedural_character_rig.md
  - threejs/juice_and_vfx_pool.md
  - audio/procedural_sound_synthesizer.md
- skill_id: stack_skill
  name: 'Three.js Stack: Rapier3D, BVH, Yuka, Recast, bitECS, postprocessing'
  filename: STACK_SKILL.md
  purpose: The libraries the game is built on, their verified versions and the tasks
    each one owns.
  when_to_use: Use before writing physics, AI, pathfinding, mass-entity or post-processing
    code — i.e. before writing any system that a stack library already owns.
  rules:
  - Take the library. A hand-rolled A*, boids flock, character controller, broadphase
    or bloom chain is a review defect, not an optimisation.
  - Rapier3D owns rigid bodies, joints and vehicles; a physics body is never driven
    by writing setLinvel() every frame.
  - three-mesh-bvh owns raycasts against static level geometry; Raycaster over a raw
    50k-triangle mesh is not acceptable.
  - Yuka owns steering, finite state machines, fuzzy decisions and perception.
  - recast-navigation owns NPC pathfinding and crowds; walkableHeight/Climb/Radius
    are expressed in cells, not metres.
  - bitECS owns entity mass (bullets, hordes, units) rendered through InstancedMesh;
    it is not used for a handful of unique entities.
  - 'postprocessing owns screen effects: one EffectPass for all of them, renderer.render()
    is replaced by composer.render().'
  - 'Frame order is fixed: input -> AI -> vehicle/controllers -> physics.step() ->
    ECS -> transform sync -> camera -> quality -> composer.render().'
  - WASM libraries (Rapier, Recast) are initialised on the loading screen, behind
    the boot watchdog, and Recast only when the game actually needs a navmesh.
  architecture: Three.js scene as the render layer; Rapier world as the physics source
    of truth; Yuka EntityManager and a recast Crowd for smart NPCs; bitECS world for
    mass entities; one EffectComposer for post FX.
  implementation_guidance: Pin the verified versions from knowledge/stack/README.md.
    Snippets found online for bitecs 0.3 (defineComponent/defineQuery) or rapier 0.13
    will not compile against the pinned versions.
  common_mistakes:
  - Re-implementing a library feature by hand because 'it is just a few lines'.
  - Calling renderer.render() next to composer.render() — the scene is drawn twice.
  - Stepping the physics world with a variable timestep instead of a fixed one with
    a substep cap.
  - Loading the Recast WASM in a game that has no NPC navigation.
  checklist:
  - No custom pathfinding, steering, broadphase or post-processing chain exists in
    src/.
  - The frame order matches knowledge/stack/README.md section 2.
  - Every stack library used is pinned to the version in knowledge/stack/README.md.
  knowledge_refs:
  - stack/README.md
  - stack/rapier3d.md
  - stack/postprocessing.md
  - stack/yuka_ai.md
- skill_id: playgama_skill
  name: Playgama Bridge SDK Integration
  filename: PLAYGAMA_SKILL.md
  purpose: Defines implementation patterns for @playgama/bridge v2 (Ads, Cloud Storage,
    Auth, Leaderboards, Lifecycle).
  when_to_use: Use when implementing advertising triggers, cloud save/load, authorization,
    and portal lifecycle hooks.
  rules:
  - Always await bridge.initialize() (with a timeout) before any other SDK call.
  - Send game_ready exactly once, only after assets are loaded and the menu is interactive.
  - Grant a rewarded reward only on state === 'rewarded'; never when the promise resolves.
  - One save key holding one JSON object; storage.get/set take no storageType argument.
  - Call authorize() only from a player action — except the silent VK/OK path at boot.
  - 'Build UI on capability flags: an unsupported feature''s control is not rendered
    at all.'
  - Take pause and audio state from the platform's own events, not visibilitychange
    alone.
  - Auto-save on progress milestones and flush on pagehide.
  architecture: Singleton PlaygamaService wrapper exposing strongly-typed promises
    for Ads, Storage, Auth, Payments and Leaderboards, degrading to a local mock when
    window.bridge is absent.
  implementation_guidance: Subscribe to EVENT_NAME.REWARDED_STATE_CHANGED, call bridge.advertisement.showRewarded(placement),
    remove the listener in cleanup, and resolve true only for the 'rewarded' state.
    Full implementations for every module are embedded below.
  common_mistakes:
  - Sending game_ready right after initialize() — the splash lifts over an unloaded
    game.
  - Awaiting a dialog-showing authorize() inside boot — the game hangs for every guest.
  - Detecting a guest via player.id/name; they are populated for guests, use player.isGuest.
  - Showing an interstitial in the first seconds of a session or during gameplay.
  - Consuming a purchase before granting it — paid goods are destroyed.
  - Keeping settings in localStorage — it is partitioned inside the platform iframe.
  - Never assume internet connection is permanent — support local offline fallback.
  checklist:
  - Rewarded grants exactly one reward per view, even on a double click.
  - Progress survives a reload as guest and as an authorized player.
  - A corrupted save boots on defaults instead of crashing.
  - Leaderboard score submits and displays correctly.
  - Game auto-pauses on the platform's pause event, including during ads.
  knowledge_refs:
  - playgama/game_ready_and_loading.md
  - playgama/auth_and_player.md
  - playgama/storage_and_cloud.md
  - playgama/ads_integration.md
  - playgama/banners_and_layout.md
  - compliance/yandex_moderation.md
  - ux/localization_system.md
  - ux/touch_controls.md
  - ux/input_scheme_switching.md
  - ux/ui_design_system.md
  - ux/ui_implementation.md
- skill_id: controls_skill
  name: Mobile Touch & Desktop Controls
  filename: CONTROLS_SKILL.md
  purpose: 'Задаёт обязательный контракт управления: раскладку под жанр, реализацию
    на Pointer Events, отмену браузерных жестов и правила видимости.'
  when_to_use: 'Use when implementing any player input: virtual joystick, action buttons,
    driving pedals, camera gestures, or keyboard bindings.'
  rules:
  - Только Pointer Events + setPointerCapture; учитывать pointerId для каждой кнопки.
  - Движение и основное действие обязаны работать одновременно (мультитач).
  - В играх про вождение газ — отдельная кнопка, а не вертикаль стика руля.
  - 'touch-action: none, отмена contextmenu/dragstart и touchmove с passive:false.'
  - Отступы через env(safe-area-inset-*); основная кнопка >= 96 px, остальные >= 64
    px.
  - Слой управления виден только в игровом процессе и сбрасывается при скрытии.
  - Сброс всех осей и кнопок на blur и visibilitychange.
  - Флаг ?touch=1 принудительно включает мобильную раскладку на десктопе.
  architecture: Отдельный модуль TouchControls создаёт собственный DOM-слой поверх
    UI, пишет в виртуальные оси InputManager и ничего не знает об игровой логике.
    InputManager сливает клавиатуру и тач, отдавая игре единый снимок управления.
  implementation_guidance: 'UIManager владеет экземпляром TouchControls и переключает
    его видимость в showHud/showPause/hideAllModals. Джойстик — плавающий: база появляется
    под пальцем, зона захвата — половина экрана, мёртвая зона 8%.'
  common_mistakes:
  - Один стик на движение и газ — машина теряет ход в каждом повороте.
  - 'touchstart/touchend без pointerId: второй палец сбрасывает первый.'
  - Слой управления оставлен видимым в меню — он перехватывает тапы по кнопкам.
  - Забытый passive:false — страница продолжает скроллиться под игрой.
  - Кнопки прижаты к краю без safe-area — их перекрывает вырез и системный жест.
  checklist:
  - Газ/атака и направление работают одновременно, проверено тремя пальцами.
  - Свайп по игре не скроллит страницу и не вызывает pull-to-refresh.
  - Долгое нажатие не открывает контекстное меню.
  - Управление скрыто в меню и паузе, оси сброшены после сворачивания вкладки.
  - ?touch=1 показывает мобильную раскладку на десктопе и кликается мышью.
  knowledge_refs:
  - ux/touch_controls.md
- skill_id: ui_skill
  name: 'Game UI: Design System & Overlay Implementation'
  filename: UI_SKILL.md
  purpose: 'Задаёт визуальный контракт интерфейса: токены вместо литералов, один акцент
    на смысл, конечный набор компонентов, состояния экранов и слои над канвасом, которые
    не съедают игровой ввод.'
  when_to_use: Use when building any menu, HUD, modal, settings screen, shop, leaderboard
    panel or результат сессии — то есть всё, что игрок видит поверх канваса.
  rules:
  - Все значения — токенами в одном src/ui/theme.css; литерал цвета в экране запрещён.
  - 'Слои над канвасом: контейнер pointer-events: none, auto — только у листьев.'
  - Слой HUD не кликается никогда; пауза и настройки — кнопки слоя экранов.
  - Один акцент — один смысл, не больше двух акцентов на экране одновременно.
  - Одна геометрия рамки на все кнопки, карточки и модалки.
  - Две гарнитуры; меняющиеся числа — tabular-nums в слоте фиксированной ширины.
  - Три зоны экрана и ровно одно главное действие на экран.
  - У каждого экрана есть состояния загрузки, пустоты и ошибки.
  - Возможность, которой нет на площадке, не рисуется вовсе — не серой кнопкой.
  - Геометрия — от измеренного вьюпорта плюс safe-area и высота баннера, не от 100vh.
  - Запрещены alert/confirm/prompt, эмодзи вместо иконок, голые input[type=range]
    и select.
  - Анимируются только transform и opacity; переход укладывается в 300 мс.
  architecture: 'src/ui/: theme.css с токенами, UiRoot создаёт слои и меряет вьюпорт,
    ScreenRouter держит один видимый экран и общий переход, Hud пишет в закэшированные
    узлы, components/ — закрытый набор примитивов, screens/ — по файлу на экран, icons.ts
    — один инлайновый SVG-спрайт с currentColor.'
  implementation_guidance: 'Компонент — функция, которая строит элемент и возвращает
    небольшой handle с setLoading/setDisabled. Никакого фреймворка: реконсилятор и
    его бандл здесь ничего не покупают. Данные игрока (имена из таблицы лидеров, сохранения)
    идут только через textContent, никогда через innerHTML.'
  common_mistakes:
  - 'Полноэкранный оверлей на pointer-events: auto — на телефоне «не работает управление».'
  - innerHTML в кадре и querySelector в цикле — просадка кадров на ровном месте.
  - 'width вместо transform: scaleX() у полосы — пересчёт раскладки всего слоя.'
  - 100vh вместо измеренного вьюпорта — нижний ряд кнопок уезжает под хром браузера.
  - 'backdrop-filter: blur() на полноэкранном слое — дороже самой сцены на мобильном
    GPU.'
  - 'Скрытый экран на opacity: 0 вместо display: none — его кнопки продолжают ловить
    нажатия.'
  - Кнопка без состояния loading на рекламе или покупке — игрок нажмёт её ещё трижды.
  checklist:
  - Свайп по середине канваса ведёт игру, а не проваливается в оверлей.
  - grep по литералам цвета в src/ui мимо theme.css пуст.
  - Каждая видимая кнопка не меньше 64 px, основная — 96 px.
  - Таблица лидеров показывает загрузку, пустоту и ошибку, а не пустую рамку.
  - При выключенной на площадке возможности её элемента нет в DOM.
  - Скриншоты 360x640 и 1280x720 без обрезанного текста и без скроллбара.
  - С закрытым игровым полем меню узнаётся как эта конкретная игра.
  knowledge_refs:
  - ux/ui_design_system.md
  - ux/ui_implementation.md
- skill_id: melee_skill
  name: Melee Combat, Hit-Stop & Parry System
  filename: MELEE_SKILL.md
  purpose: Реализация комбо-атак холодным оружием, точного окна парирования и микро-заморозки
    времени (Hit-Stop).
  when_to_use: При разработке слэшеров, битв на мечах, рукопашных драк и дуэлей.
  rules:
  - 'Каждый удар проходит фазы: startup -> active (хитбокс) -> recovery.'
  - Вся боёвка считается в КАДРАХ фиксированного шага 1/60, а не в секундах.
  - 'Hit-Stop — счётчик кадров в fixedUpdate, НЕ setTimeout: таймер реального времени
    не знает про паузу и даёт разную длительность на разном FPS.'
  - Замах врага не короче 22 кадров, иначе парирование нечестное.
  - Идеальное парирование сопровождается звуком скрежета металла и вспышкой искр.
  - Рэгдолл включается только на смерть; живым врагом управляет автомат состояний.
  architecture: MeleeFighter — автомат состояний на кадрах (окна отмены, буфер ввода,
    память связки); рэгдолл — 7 тел Rapier на сферических суставах.
  implementation_guidance: 'Попадание считать сектором (дальность + арка), а не AABB:
    коробка промахивается мимо цели сбоку и задевает того, кто за спиной. Публикуй
    ''combat:hit'', ''combat:parry'' в EventBus для тряски камеры.'
  common_mistakes:
  - Мгновенный урон без фазы подготовки (startup) лишает игрока возможности реагировать.
  - Память связки тратится каждый кадр — тогда длинный финишный удар съедает окно
    сам собой, и третий удар связки невозможно собрать.
  - Части рэгдолла сталкиваются друг с другом — труп дрожит и уползает.
  - Импульс смерти не клампится — сферические суставы разрывает.
  checklist:
  - Удары в серии плавно переходят из одного в другой при своевременном клике.
  - Нажатие за несколько кадров до окна отмены не теряется (буфер ввода).
  - Есть головная проверка фрейм-даты и физики трупа без рендерера.
  knowledge_refs:
  - threejs/melee_combat_and_ragdoll.md
  - mechanics/ragdoll.md
  - mechanics/parry.md
  - threejs/juice_and_vfx_pool.md
  - audio/procedural_sound_synthesizer.md
