definition_of_done:
- Игрок свободно перемещается по 3D арене с отзывчивым управлением на ПК (WASD) и
  мобильных устройствах (плавающий стик).
- Спартанский пинок (Space / свайп) запускает врага в полет с честным расчетом массы
  и импульса в Rapier3D.
- Летящий в рэгдолле враг сбивает других противников на своем пути, нанося им кинетический
  урон и вызывая цепную реакцию.
- Деревянные ящики, столы и бочки процедурно разрушаются от ударов летящих тел или
  оружия с разлетом обломков.
- 'Каждый мощный удар сопровождается ощутимым соком: микро-хитстоп 0.08с, сотрясение
  камеры, вспышка кольца частиц и сочный звук.'
- Реализован цикл 4 натисков уличных банд с открытием оружейного верстака между раундами
  и финальным боссом в 4-м раунде.
- На верстаке игрок может прокачать силу пинка, хука, здоровье и приобрести оружие
  (биты, молоты, трубы) за заработанные наличные.
- 'Интегрирован SDK Playgama Bridge: сохранение прогресса в Cloud Save, показ Rewarded
  Video для воскрешения и Interstitial между матчами.'
- Производительность проекта протестирована и держит 60 FPS на целевых мобильных и
  десктопных браузерах при весе бандла менее 4.5 МБ.
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Позиционирование и маневрирование -> Точный пинок или
  силовой удар -> Запуск врага-снаряда в толпу и разрушаемые объекты -> Сбор выбитых
  наличных и подбор оружия -> Модернизация бойца и арсенала на верстаке между раундами
  -> Сражение со следующим натиском и боссом-тяжеловесом..'
- 'Реализованы механики проекта: spartan_launch_kick, kinetic_body_bowling, prop_tactical_hurdle,
  wall_splat_destruction.'
- Условие успеха (Успешно зачистить все 4 натиска уличных бойцов подпольного октагона,
  разгромив в финале бронированного босса-тяжеловеса и сохранив хотя бы 1 единицу
  здоровья бойца к концу финального раунда.) и условие проигрыша (Падение очков здоровья
  бойца до 0 в результате пропущенных ударов, брошенных предметов или взрывных волн
  бочек до победы над боссом (с 1 шансом на мгновенное возрождение за Rewarded Video).)
  работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Kick Arena: Кинетический Рикошет».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Второе дыхание (Revive), Двойной
  куш (Double Cash), Контрабандный арсенал (Weapon Drop)); interstitial соблюдает
  паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
direction:
  options:
  - id: D1
    name: 'Kick Arena: Кинетический Рикошет'
    pitch: Выбивай врагов мощными пинками и швыряй в них бочки, превращая противников
      в живые снаряды для цепного разгрома уличных банд на арене.
    core_verb: Выбивать и рикошетить (запускать тела врагов физическим пинком в толпу
      и препятствия, вызывая цепные разрушения)
    genre_family: 3D Физический Битэмап / Кинетический Арена-Экшен
    session_shape: 'Сессионный матч-заход на 3–5 минут: 4 нарастающих натиска уличных
      бойцов с финальным боссом-тяжеловесом и оружейным верстаком для прокачки характеристик
      и оружия между раундами.'
    camera: Динамическая камера от третьего лица из-за плеча (Third-Person Follow)
      с кинетическим зумом, микро-хитстопом (slow-mo на 0.08 с) и импульсной отдачей
      при сильных ударах и пинках.
    control_scheme: 'ПК: WASD — бег, ЛКМ — серия легких ударов, ПКМ — заряженный силовой
      хук, Пробел — спартанский пинок вперед, E — подбор оружия/предмета, Q — прицельный
      бросок в направлении прицела, Shift — рывок уклонения. Мобильные: динамический
      плавающий стик слева для перемещения; правая зона — крупная кнопка атаки (тап
      — комбо ударов, свайп вперед — мощный пинок), контекстная кнопка подбора/броска
      и кнопка рывка.'
    world: 'Неоновый подпольный октагон в стилистике урбан-лоуполи (ржавые двутавры,
      штабеля поддонов, искрящие щитки, бочки с горючим; контрастная палитра: глубокий
      темно-синий и мокрый асфальт с ядовито-оранжевыми и бирюзовыми вспышками).'
    spectacle: 'Физический спартанский пинок отправляет тяжелого бандита в полет через
      пол-арены: он сбивает двух автоматчиков, врезается в пирамиду деревянных ящиков
      и разносит её в щепки с облаком пыли и искрами.'
    why_not_generic: 'Опирается на связку mechanics/ragdoll.md + mechanics/chain_reaction.md
      + mechanics/physics_destruction.md в рамках patterns/arena_combat_loop.md. В
      отличие от типовых битемапов, урон наносится не абстрактными цифрами полоски
      HP, а кинетической энергией столкновений: враг слаб сам по себе, но разогнанный
      ударом становится живым тараном с импульсом от массы и скорости, крушащим окружение
      и союзников.'
    biggest_risk: Нестабильность рэгдолла Rapier3D при контакте множества тел на высоких
      скоростях (прохождение сквозь стены или застревание в геометрии). Решается включением
      непрерывного обнаружения столкновений (CCD) для летящих тел и кинематическими
      барьерами арены.
    production_cost: Средний. Процедурная геометрия арены, физические тела Rapier3D
      с ragdoll-моделями на боксах, синтез звуков через Web Audio API без тяжелых
      внешних ассетов.
    knowledge_hints:
    - threejs/melee_combat_and_ragdoll.md
    - mechanics/ragdoll.md
    - mechanics/chain_reaction.md
    - mechanics/physics_destruction.md
    - patterns/arena_combat_loop.md
    - stack/rapier3d.md
    - threejs/juice_and_vfx_pool.md
    - threejs/procedural_mesh_builder.md
    - ux/touch_controls.md
    - threejs/adaptive_quality.md
    - audio/procedural_sound_synthesizer.md
  - id: D2
    name: 'Kick Arena: Каскадный Выброс'
    pitch: Защищай узкие подвесные платформы, сбрасывая наступающие отряды пинками
      в бездну и обрушивая на них подвесные строительные грузы.
    core_verb: Сталкивать и сбрасывать (манипулировать позицией врагов и сбрасывать
      их в пропасти и активированные ловушки арены)
    genre_family: Изометрический 3D Экшен-Слэшер / Тактическая Арена Окружения
    session_shape: Поэтапная зачистка 5 подвесных секторов-платформ (по 45–60 секунд
      на сектор) с изменяемой геометрией и эвакуационным лифтом.
    camera: Фиксированная изометрическая камера под углом 45 градусов с высоты (Top-Down
      Isometric) с жестким охватом всей платформы и опасных зон по краям.
    control_scheme: 'ПК: Мышь — направление взгляда и прицеливание пинка, WASD — перемещение,
      ЛКМ — комбо-удар, Пробел — круговой удар ногой с отбрасыванием, ПКМ — бросок
      предмета. Мобильные: стик движения слева + жестовые свайпы в правой зоне для
      направленного выталкивания к краю.'
    world: Высотная стройплощадка небоскреба под грозовым небом (открытые стальные
      балки без перил, строительные леса, подвесные краны; серо-стальная палитра с
      сигнально-желтыми и предупреждающими элементами).
    spectacle: Игрок круговым пинком веером сметает четырех противников в открытую
      бездну стройплощадки, пока пятый сбивает стрелу крана, обрушивая плиту на босса.
    why_not_generic: Опирается на связку mechanics/physics_destruction.md + mechanics/chain_reaction.md
      + patterns/physics_arcade_loop.md. Акцент смещен с рукопашного размена на пространственный
      контроль и ring-out механики мгновенного устранения за счет физики падений с
      высоты.
    biggest_risk: Смещение фокуса с ближнего боя на утилитарное выталкивание в пропасть,
      что может обесценить механику подбора оружия и контактных ударов.
    production_cost: Средний. Требуется балансировка ИИ навигации вокруг опасных краев
      платформ и настройка физических триггеров падения в пропасть.
    knowledge_hints:
    - threejs/melee_combat_and_ragdoll.md
    - mechanics/physics_destruction.md
    - mechanics/chain_reaction.md
    - patterns/physics_arcade_loop.md
    - stack/rapier3d.md
    - threejs/juice_and_vfx_pool.md
    - ux/touch_controls.md
  - id: D3
    name: 'Kick Arena: Кинетический Джаггл'
    pitch: Вступай в дуэльные бои в замкнутой клетке, запуская противников в воздух
      и вбивая их ногами в стены на рекордную длину комбо.
    core_verb: Подбрасывать и жонглировать (подбрасывать врагов апперкотами и удерживать
      тела в воздухе серией пинков и ударов)
    genre_family: 2.5D Физический Файтинг-Браулер
    session_shape: 'Аркадный турнирный ладдер: 6 дуэльных раундов «1 против 3–5» в
      замкнутых клетках с начислением очков за длину комбо в воздухе.'
    camera: Боковая 2.5D рельсовая камера (Side-View 2.5D), панорамирующая вдоль плоскости
      арены и масштабирующаяся по высоте подскока рэгдоллов.
    control_scheme: 'ПК: A/D — движение по линии, W — прыжок, S — подкат, ЛКМ — апперкот/джеб,
      Пробел — дропкик в воздухе, Shift — отскок. Мобильные: двухкнопочная аркадная
      раскладка перемещения влево/вправо и кнопки приемов в правой зоне.'
    world: Гладиаторская подпольная клетка в тюремном блоке (сетка рабица, прожекторы
      арены, пыль, граффити на стенах; темно-графитовая палитра с контрастным желтым
      светом).
    spectacle: Враг подброшен апперкотом на два метра вверх, игрок в прыжке вбивает
      его ногой в стену клетки, отчего стальная сетка прогибается, а осыпающийся щиток
      бьет током стоящего рядом врага.
    why_not_generic: Опирается на связку mechanics/juggle_combo.md + mechanics/frame_data_combat.md
      + mechanics/ragdoll.md на базе threejs/fighting_game_core.md. Физика Rapier
      рассчитывает силу каждого удара в воздухе, превращая файтинг в физический джагглинг
      тел.
    biggest_risk: Ограничение перемещения до 2.5D плоскости снижает ощущение масштаба
      хаотичной потасовки против толпы, превращая игру в узкоспециализированный файтинг.
    production_cost: Средний. Требует точной настройки фрейм-даты анимаций, векторов
      подбрасывания и физических хитбоксов столкновения со стенами.
    knowledge_hints:
    - mechanics/juggle_combo.md
    - threejs/fighting_game_core.md
    - mechanics/frame_data_combat.md
    - mechanics/ragdoll.md
    - patterns/fighting_match_loop.md
    - stack/rapier3d.md
  selected_id: D1
  selected_name: 'Kick Arena: Кинетический Рикошет'
  selection_reason: 'D1 полностью и бескомпромиссно реализует заказ пользователя:
    вид от третьего лица из-за плеча дает максимальное погружение и ощущение сокрушительной
    физической силы пинка (''Я ударил врага настолько сильно, что он улетел через
    всю арену и сбил ещё троих''). Для мобильных устройств и браузера динамическая
    follow-камера с жестовыми свайпами для пинков обеспечивает мгновенный тактильный
    отклик без необходимости точного позиционирования курсора мыши, а физика Rapier3D
    в компактной 3D-арене гарантирует высокую производительность при 60 FPS.'
  rejected_reasons:
  - 'D2 («Kick Arena: Каскадный Выброс») отвергнут, так как изометрический ракурс
    сверху отдаляет игрока от эпицентра удара, нивелирует кинематографическое ощущение
    физического полета врага вдаль от камеры и смещает фокус с сочного рукопашного
    боя на рутинное сталкивание в ямы.'
  - 'D3 («Kick Arena: Кинетический Джаггл») отвергнут, так как 2.5D боковая перспектива
    ограничивает свободу маневрирования на арене одной плоскостью и не дает ощущения
    масштабной уличной потасовки против толпы врагов с использованием интерактивного
    окружения со всех сторон.'
  what_it_is_not:
  - Никакого автоматического боя или авто-атаки (auto-aim/auto-strike) — каждый удар,
    пинок и бросок инициируются исключительно ручным действием игрока.
  - Никаких окон паузы с выбором из 3 карточек апгрейдов посреди боя — прокачка происходит
    только на верстаке между раундами за заработанные наличные.
  - Никаких 'губчатых' врагов с бесконечным здоровьем — сложность нарастает за счет
    массы, экипировки и агрессивного поведения врагов, а не раздувания полосок HP.
  - Никаких невидимых стен и статичных декораций — любые бочки, ящики, столы и заборы
    на арене являются физическими телами Rapier3D с расчетом массы и разрушения.
  - Никакой шаблонной связки 'дэш + парирование по таймингу' из соулслайков — акцент
    сделан на физическую инерцию, пинки, броски предметов и цепные столкновения тел.
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - 'Кинетическая передача импульса и рэгдолл Rapier3D: отлетевший от пинка враг обязан
    обладать реальной физической массой и скоростью, сбивать с ног других противников
    и крушить окружение.'
  - 'Ощутимый физический импакт: каждый мощный силовой удар и пинок сопровождается
    микро-хитстопом (slow-mo на 0.06–0.09 с), направленной отдачей камеры (screen
    shake) и каскадом частиц пыли и искр.'
  - 'Интерактивное окружение: арена наполнена физическими объектами (ящики, бочки,
    балки, столы) и подбираемым оружием (биты, трубы, молоты), которые можно швырять
    во врагов.'
  - 'Прямой тактильный контроль без авто-боя: управление оптимизировано под мышь/клавиатуру
    на ПК и адаптивные жесты/стик на телефоне с мгновенным откликом с первой секунды.'
  signature_scene: Широкоугольный стоп-кадр из-за плеча бойца в кожаной куртке с занесенной
    в мощном фронт-кике ногой прямо в центр арены подпольного октагона. В метре от
    его подошвы в воздух взлетает громила-байкер с запрокинутой головой, переходящий
    в ragdoll; от точки удара веером разлетаются неоновые искры и клубы серой пыли.
    На заднем плане — летящий спиной вперед враг проламывает штабель деревянных ящиков,
    разбрасывая обломки во все стороны, а двое других бандитов падают от удара разлетевшихся
    досок. Сверху сквозь ржавую решетку бьет резкий конусный луч холодного бирюзового
    прожектора, выхватывающий рельеф персонажей, а снизу пол арены подсвечен ядовито-оранжевым
    светом искрящего распределительного щитка.
  avoid_references:
  - Vampire Survivors (шаблон авто-шутера с авто-атаками и пассивным накоплением урона)
  - Brotato (замкнутая 2D-арена с круговым кайтингом и окнами выбора карточек)
  - Paint the Town Red (воксельное расчленение врагов без акцента на глубокую кинетическую
    физику столкновений Rapier3D)
  - Gang Beasts (неуправляемый хаотичный рэгдолл без четкого контроля, комбо-ударов
    и боевой отдачи)
  - 'Вышибала: Сброс за борт (недавний проект фабрики)'
knowledge_plan:
  selections:
  - path: patterns/arena_combat_loop.md
    role: core
    reason: Задает структуру сессионного матча в октагоне с 4 нарастающими натисками
      уличных бойцов и паузами на апгрейд бойца у верстака.
  - path: mechanics/ragdoll.md
    role: core
    reason: Обеспечивает физику активного рэгдолла для превращения выбитых спартанским
      пинком громил и бандитов в летящие баллистические снаряды.
  - path: mechanics/chain_reaction.md
    role: core
    reason: Реализует эффект живого боулинга, при котором летящий враг сбивает с ног
      других бандитов и детонирует бочки с горючим.
  - path: mechanics/physics_destruction.md
    role: core
    reason: Управляет процедурным разрушением штабелей поддонов, ящиков и заборов
      октагона на летальные физические обломки при ударах.
  - path: threejs/physics_integration.md
    role: core
    reason: Связывает симуляцию твердых тел и рэгдоллов Rapier3D с рендером Three.js
      для точного совпадения визуализации и физических коллизий.
  - path: stack/rapier3d.md
    role: core
    reason: Выступает базовым физическим движком для детерминированного расчета масс,
      скоростей, рикошетов тел и импульсов разрушений на арене.
  - path: threejs/procedural_character_rig.md
    role: core
    reason: Позволяет собрать выразительные процедурные тела уличных бойцов и тяжеловеса
      с ригом сочленений и реакцией на физические удары без внешних ассетов.
  - path: threejs/procedural_mesh_builder.md
    role: supporting
    reason: Генерирует стилизованную Low-Poly геометрию октагона, верстака, бочек
      с горючим и деревянных поддонов без внешних 3D-моделей.
  - path: threejs/juice_and_vfx_pool.md
    role: supporting
    reason: Создает инстансированные частицы неоновых искр, взрывных волн и кинетическую
      импульсную тряску камеры при мощных ударах.
  - path: stack/postprocessing.md
    role: supporting
    reason: Объединяет графические эффекты акцентирования ударов и вспышек взрывов
      в один оптимизированный проход шейдера.
  - path: threejs/performance_guide.md
    role: supporting
    reason: Задает бюджет кадра и инстансинг повторяющихся обломков и пропов для удержания
      стабильных 60 FPS на мобильных устройствах.
  - path: threejs/adaptive_quality.md
    role: supporting
    reason: Автоматически масштабирует разрешение и плотность эффектов при массовых
      цепных взрывах и рикошетах для защиты от просадок кадров.
  - path: stack/yuka_ai.md
    role: supporting
    reason: Обеспечивает поведение сближения, окружения и агрессивного напора уличных
      бандитов на игрока внутри арены.
  - path: audio/procedural_sound_synthesizer.md
    role: supporting
    reason: Синтезирует процедурные звуки спартанского пинка, хруста ломающихся ящиков
      и взрывов бочек через Web Audio API без внешних аудиофайлов.
  - path: audio/web_audio_and_muting.md
    role: supporting
    reason: Обеспечивает корректный запуск AudioContext по первому тапу и соблюдение
