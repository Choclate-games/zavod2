_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: realizuy
performance:
  target_fps: 60
  max_draw_calls: 80
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: 'Сессионный матч-заход на 3–5 минут: преодоление 4 нарастающих натисков уличных
    группировок (по 30–50 секунд каждый) с промежуточными паузами у оружейного верстака
    (15–20 секунд) и кульминационной битвой с бронированным боссом-тяжеловесом в 4-м
    раунде.'
  win: Успешно зачистить все 4 натиска уличных бойцов подпольного октагона, разгромив
    в финале бронированного босса-тяжеловеса и сохранив хотя бы 1 единицу здоровья
    бойца к концу финального раунда.
  lose: Падение очков здоровья бойца до 0 в результате пропущенных ударов, брошенных
    предметов или взрывных волн бочек до победы над боссом (с 1 шансом на мгновенное
    возрождение за Rewarded Video).
  difficulty_curve: 'Ступенчато-нарастающая с пиками напряжения: 1-й натиск (легкие
    хулиганы, освоение физики пинков и ящиков), 2-й натиск (добавление быстрых фланкеров
    и вооруженных битами головорезов), 3-й натиск (смешанная толпа с тяжеловесами,
    требующая активного броска бочек и рикошетов), 4-й натиск (штурм с боссом-джаггернаутом
    и миньонами, где босса нужно оглушать рикошетом его же подручных).'
mechanics:
  spartan_launch_kick:
    name: spartan_launch_kick
    parameters:
      base_launch_impulse:
        value: 350 Н*с
        note: Если опустить ниже 260 Н*с, тело врага пролетает меньше 3 метров и не
          долетает до стен; если поднять выше 550 Н*с, тела улетают за пределы экрана
          и игрок теряет контроль над ситуацией.
      charge_time_threshold:
        value: 0.25 с
        note: Если сделать меньше 0.15 с, игрок случайно запускает заряженный кик
          при быстрых тапах; если больше 0.4 с, враги успевают гарантированно ударить
          игрока во время замаха.
      hitstop_duration:
        value: 0.08 с
        note: Если убрать до 0.0 с, удар ощущается как ватный толчок без веса; если
          увеличить до 0.18 с, игра кажется лагающей и ломается темп драки.
      kick_range_reach:
        value: 1.8 м
        note: Если уменьшить до 1.2 м, игрок постоянно промахивается по набегающим
          целям; если увеличить до 2.5 м, создается эффект неестественного притягивания
          удара.
  kinetic_body_bowling:
    name: kinetic_body_bowling
    parameters:
      chain_energy_transfer:
        value: 65%
        note: Если сделать передачу выше 85%, один пинок зачищает всю арену без усилий
          игрока; если ниже 40%, кегельбан затухает на первом же столкновении и теряется
          зрелищность.
      knockdown_stun_duration:
        value: 1.2 с
        note: Если меньше 0.6 с, сбитые враги встают мгновенно и бьют игрока в спину;
          если больше 2.0 с, игра превращается в безнаказанное избиение лежачих.
      combo_cash_multiplier:
        value: 1.3x за сбитое тело
        note: Если уменьшить до 1.05x, у игрока нет стимула целиться в толпу; если
          поднять до 2.0x, экономика ломается после первой удачной волны.
      min_lethal_speed:
        value: 3.5 м/с
        note: Если поднять до 6.0 м/с, рикошеты перестают наносить урон вторичным
          целям; если опустить до 1.0 м/с, медленно скользящие трупы нелепо убивают
          врагов касанием.
  prop_tactical_hurdle:
    name: prop_tactical_hurdle
    parameters:
      throw_velocity_base:
        value: 16.0 м/с
        note: Если сделать ниже 10 м/с, бросок ощущается вялым и враги успевают отойти;
          если выше 26 м/с, бросок превращается в мгновенный хитскан без ощущения
          полета физического объекта.
      explosive_barrel_radius:
        value: 4.5 м
        note: Если радиус меньше 3.0 м, взрыв редко задевает больше одного врага;
          если больше 6.0 м, игрок постоянно сам попадает под собственную взрывную
          волну.
      melee_weapon_durability:
        value: 4 удара
        note: Если дать 1–2 удара, оружие кажется бесполезным мусором; если дать 10
          ударов, игрок перестает пользоваться пинками и игра скатывается в закликивание
          оружием.
      auto_aim_assist_angle:
        value: 20 градусов
        note: Если убрать ассист до 0°, на тачскрине невозможно попасть броском по
          бегущим врагам; если сделать 45°, прицел самовольно срывается на случайных
          второстепенных врагов.
  wall_splat_destruction:
    name: wall_splat_destruction
    parameters:
      wall_splat_bonus_dmg:
        value: 45 ед.
        note: Если опустить ниже 20 ед., игрок игнорирует позиционирование у стен;
          если поднять выше 90 ед., бойцы гибнут от одного случайного касания сетки.
      destructible_force_threshold:
        value: 1200 Н
        note: Если сделать порог меньше 600 Н, все укрытия и ящики разваливаются от
          малейшего тычка на первой секунде; если больше 2200 Н, баррикады кажутся
          монолитными и не ломаются.
      shrapnel_fragment_count:
        value: 4 осколка
        note: Если спавнить больше 8 осколков, падает FPS в Three.js на мобильных
          устройствах; если меньше 2, теряется ощущение сокрушительного взрыва конструкции.
      wall_stick_duration:
        value: 0.2 с
        note: Если сделать меньше 0.05 с, сплэт визуально не считывается; если сделать
          больше 0.5 с, враг неестественно висит на стене как приклеенный.
  pit_workbench_economy:
    name: pit_workbench_economy
    parameters:
      kick_upgrade_cost_base:
        value: $150
        note: Если сделать дешевле $80, игрок максимизирует силу на 2-й волне; если
          дороже $300, невозможно купить ни одного апгрейда без идеального комбо.
      sledgehammer_weapon_cost:
        value: $220
        note: Если поднять до $400, оружие не покупают из-за страха потерять деньги;
          если снизить до $100, игрок перестает ценить пинки и дерется только кувалдой.
      medkit_heal_amount:
        value: 60 HP
        note: Если лечить на 20 HP, цена лечения не оправдывает риск; если лечить
          на 100 HP (полный столб), игрок не боится пропускать удары в бою.
      early_start_cash_bonus:
        value: $50
        note: Если дать $10, никто не пропускает таймер подготовки; если дать $150,
          игроки торопятся и выходят в бой без обдуманного билда.
