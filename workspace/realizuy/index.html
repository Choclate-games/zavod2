<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kick Arena: Кинетический Рикошет</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&family=Russo+One&display=swap" rel="stylesheet">
  <style>
    /* Critical early paint reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background-color: #0d0f14;
      color: #f0f6fc;
      font-family: 'Roboto Mono', monospace;
      overscroll-behavior: none;
      touch-action: none;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #game-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div id="hud" class="layer"></div>
    <div id="touch" class="layer"></div>
    <div id="screens" class="layer"></div>
    <div id="modals" class="layer"></div>
    <div id="toasts" class="layer"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
