raw_prompt: 'Создай 3D физическую головоломку на Three.js: игрок от первого лица целится
  лазерным лучом рикошета и стреляет одной пулей. Камера следует за пулей в режиме
  Slow-Motion. Пуля отскакивает от стен по закону отражения (векторы нормалей), взрывает
  бочки и сбивает красных ragdoll/кубических врагов. 20 уровней с нарастающей сложностью
  (порталы, движущиеся щиты), система оценки на 3 звезды и кнопка мгновенного рестарта.'
title: 'Рикошет Снайпер 3D: Замедленный Выстрел'
slug: ricochet-bullet-slowmo-3d
genre: Физическая головоломка / Тактический 3D-шутер
subgenre: Рикошет-пазл от первого лица со Slow-Motion Bullet-Cam
renderer: threejs
renderer_reason: User explicitly specified 'threejs'.
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web & Mobile)
orientation: landscape
target_audience: Игроки 12-45 лет, ценящие тактические физические головоломки, кинематографичный
  экшен в стиле Superhot / Sniper Elite и залипательный гиперказуальный геймплей с
  реиграбельностью.
core_loop: Оценка геометрии уровня -> Прицеливание лазерным лучом с расчетом рикошетов
  -> Выстрел -> Замедленный полет пули (Bullet-Cam) с физическими рикошетами и цепными
  реакциями -> Уничтожение всех врагов -> Получение 1-3 звезд -> Переход на следующий
  уровень или мгновенный рестарт.
hook: Гипнотический кинематографический Slow-Motion полет пули от первого лица с физически
  честными рикошетами, взрывами бочек и эпичным разлетом красных врагов одним точным
  выстрелом.
player_fantasy: Гениальный снайпер-трикшотер, способный одним математически выверенным
  выстрелом запустить смертоносный рикошет через порталы и щиты, уничтожив всю вражескую
  базу.
session_model: Быстрые микро-сессии по 30-90 секунд на уровень с мгновенным перезапуском
  одной кнопкой и возможностью пройти 20 уровней за 15-25 минут с последующей охотой
  за 3 звездами.
unique_value_proposition: Сочетание точного геометрического расчета траектории от
  первого лица с эффектом кинематографической камеры слежения за пулей в честном 3D-пространстве
  с интерактивной физикой Ragdoll и порталами.
vision: Создать эталонную WebGL/Mobile физическую головоломку с непревзойденным сочным
  геймфилом, где каждый успешный выстрел ощущается как сцена из блокбастера благодаря
  замедлению времени, динамической камере и цепным реакциям.
elevator_pitch: '«Superhot встречает Sniper Elite в формате 3D-головоломки»: целься
  лазерным лучом с учетом нормалей стен, жми на спуск и наблюдай в кинематографичном
  slow-mo, как твоя пуля огибает препятствия, проходит сквозь порталы, детонирует
  бочки и сокрушает красных врагов!'
win_conditions: Все красные враги на уровне нейтрализованы (убиты прямым попаданием
  пули, осколками или взрывной волной бочек).
lose_conditions: Пуля израсходована и остановилась (превышен лимит отскоков или попадание
  в поглощающую преграду), при этом хотя бы один враг остался жив.
progression_summary: '20 уровней с нарастающей комплексностью: уровни 1-4 (базовые
  углы отражения и взрывные бочки), 5-9 (движущиеся стальные щиты и стеклянные препятствия),
  10-15 (входные/выходные порталы и гравитационные ловушки), 16-20 (комбинированные
  многоступенчатые трикшоты с кнопками-триггерами и движущимися целями). Зарабатываемые
  звезды открывают кастомные скины пуль и неоновые цвета лазеров.'
difficulty_curve: 'Плавное введение базовых механик с постоянным ростом удовлетворения
  от решения задач: от простых выстрелов в 1-2 отскока до сложных многоуровневых головоломок
  с движущимися платформами и портальными петлями.'
scores:
  fun: 9
  originality: 8
  replayability: 8
  development_cost: 8
  visual_appeal: 9
  mobile_fit: 9
  monetization: 8
  platform_fit: 9
  overall_score: 8.5
  justification: Концепт обладает высочайшей вирусной привлекательностью и instant-fun
    фактором за счет bullet-cam и slow-motion. Архитектура на Three.js + Rapier3D
    гарантирует 60 FPS на смартфонах и ПК, а Playgama Bridge обеспечивает органичную
    монетизацию и сохранение прогресса в облаке.
references:
- name: Superhot
  genre: FPS / Time-bending Puzzle
  mechanics:
  - Slow-Motion при взаимодействии
  - Минималистичный визуальный стиль с красными силуэтами врагов
  - Осколочный разлет при попадании
  lessons: Минималистичный контрастный визуальный стиль (белый фон + красные враги)
    обеспечивает идеальную читаемость сцены и снижает нагрузку на рендер.
  what_to_avoid: Слишком медленный темп ожидания между уровнями.
- name: Sniper Elite (Bullet Cam)
  genre: Tactical Shooter
  mechanics:
  - Кинематографическое следование камеры за пулей
  - Динамическое замедление времени при сближении с целью
  - Сокрушительный финальный импакт
  lessons: Камера за пулей создает мощный эмоциональный отклик и превращает каждый
    удачный выстрел в зрелищную награду.
  what_to_avoid: Потеря ориентации игрока из-за хаотичных поворотов камеры при отскоках.
- name: Portal
  genre: First-Person Physics Puzzle
  mechanics:
  - Сохранение импульса при прохождении через порталы
  - Пространственная переориентация вектора скорости
  - Интерактивные кнопки и лазерные лучи
  lessons: Порталы кардинально углубляют головоломку, превращая простые рикошеты в
    многомерные тактические задачи.
  what_to_avoid: Избыточная визуальная путаница при входе в порталы под острым углом.
mechanics:
- name: Лазерный предиктивный прицел (Raycast Trajectory)
  category: combat
  priority: core
  description: Луч от оружия игрока математически рассчитывает до 3-5 отскоков от
    поверхностей по вектору отражения (R = V - 2*(V·N)*N) в реальном времени, отображая
    пунктирную неоновую линию траектории.
  player_interaction: Перемещение мыши или свайп пальцем по экрану для наведения луча.
    Прекращение удержания или клик производит выстрел.
  feedback: Неоновое свечение лазера, яркие маркеры в точках соприкосновения со стенами,
    пульсация луча при наведении на взрывную бочку или врага.
  technical_complexity: Medium
  strengths:
  - Дает игроку полный контроль и уверенность в выстреле
  - Снижает фрустрацию от слепых промахов
  weaknesses:
  - Слишком длинный предикшн может упростить игру (требуется ограничение дальности
    или числа отображаемых отскоков).
- name: Кинематографический Slow-Motion Bullet-Cam
  category: movement
  priority: core
  description: После нажатия на спуск камера плавно интерполируется за летящую пулю
    в режиме замедленного времени (0.2x от реальной скорости), динамически сглаживая
    вращение при рикошетах.
  player_interaction: Пассивное наблюдение с возможностью ускорить время (удержание
    пробела/экрана) или пропустить полет повторным тапом.
  feedback: Искажение пространства (шлейф/heat distortion), низкочастотный звук рассекаемого
    воздуха (Whoosh), замедленные звуки окружения, частицы рикошета.
  technical_complexity: High
  strengths:
  - Высочайший уровень зрелищности и вовлечения
  - Игрок видит каждую деталь трикшота
  weaknesses:
  - Риск укачивания при резких разворотах камеры (решается плавной интерполяцией кватернионов
    Slerp).
- name: Физические рикошеты и цепные реакции
  category: environment
  priority: core
  description: Пуля отскакивает от твердых поверхностей с сохранением кинетической
    энергии, детонирует красные бочки с радиусом поражения взрывной волной и активирует
    физические переключатели.
  player_interaction: Игрок целится в стены, наклонные пластины и бочки для поражения
    врагов за укрытиями.
  feedback: Вспышки искр, звуки металлических и каменных рикошетов, объемные взрывы
    бочек с разлетом обломков и толканием объектов.
  technical_complexity: Medium
  strengths:
  - Огромное поле для креативных решений головоломки
  - Сочный визуальный отклик
  weaknesses:
  - Необходимость точной физической синхронизации коллизий без проваливания сквозь
    геометрию (CCD).
- name: Разрушаемые кубические / Ragdoll-враги
  category: combat
  priority: core
  description: Враги состоят из связанных физических сегментов или составных блоков,
    которые при попадании пули или взрыве эффектно разлетаются под действием импульса
    удара.
  player_interaction: Прямое или косвенное попадание пулей/обломками бочки.
  feedback: Звук сокрушительного удара (Impact SFX), замедленный разлет частей тела
    врага, появление победного индикатора.
  technical_complexity: Medium
  strengths:
  - Невероятно приятное ощущение уничтожения цели
  - Комедийный и динамичный рэгдолл-эффект
  weaknesses:
  - Требуется оптимизация физических тел для стабильных 60 FPS на мобильных устройствах.
- name: Пространственные порталы и динамические щиты
  category: puzzle
  priority: progression
  description: Синие и оранжевые порталы мгновенно телепортируют пулю с сохранением
    скорости и трансформацией вектора направления; движущиеся щиты требуют точного
    тайминга выстрела.
  player_interaction: Выбор момента выстрела и направления входа в портал.
  feedback: Энергетическое свечение портала, звуковой хлопок телепортации, изменение
    цвета трассирующего следа пули.
  technical_complexity: High
  strengths:
  - Взрывной рост вариативности головоломок на поздних уровнях
  - Интеллектуальный вызов для игрока
  weaknesses:
  - Сложность визуализации лазерного предикшна сквозь порталы.
gameplay_systems:
- name: Система расчета лазерного предикшена (Laser Trajectory Predictor)
  purpose: Отрисовка точной траектории полета пули с учетом отражений от нормалей
    поверхностей и прохождения через порталы.
  input: Координаты прицела игрока (Vector3) и стартовая точка ствола.
  rules:
  - Raycast пускается из дула оружия в направлении взгляда
  - 'При пересечении с твердым телом вычисляется точка удара и нормаль: D_reflect
    = D - 2 * (D · N) * N'
  - Новый луч пускается из точки удара с небольшим смещением по нормали (epsilon =
    0.001) для исключения самопересечения
  - При попадании в портал луч переносится в выходной портал с трансформацией кватерниона
    направления
  - 'Лимит предикшена: до 4 последовательных отскоков'
  - При попадании во врага или бочку луч завершается ярким маркером попадания
  state:
  - origin
  - direction
  - bounce_points
  - hit_targets
  - is_valid_aim
  interactions: Передает массив точек сегментов в Three.js LineSegments / TubeGeometry
    для рендера светящегося луча.
  feedback: Анимированная пульсация лазера, смена цвета маркера при наведении на взрывные
    цели (желтый) или врагов (красный).
  edge_cases:
  - Попадание точно в острый угол между двумя стенами (разрешается выбором доминирующей
    нормали)
  - Зацикливание луча между двумя параллельными зеркальными щитами (ограничение счетчиком
    итераций)
- name: Система кинематографической камеры Slow-Motion (Bullet Time Controller)
  purpose: Управление временем и перемещением камеры во время выстрела для создания
    максимального эффекта вовлечения.
  input: Триггер выстрела, текущая позиция и скорость пули.
  rules:
  - В режиме прицеливания камера зафиксирована в позиции глаз персонажа (FOV 65)
  - В момент выстрела timescale снижается до 0.25 (slow-motion)
  - 'Камера переходит в режим слежения: позиция = bullet.pos - bullet.velocity.normalized
    * 1.5 + Vector3(0, 0.4, 0)'
  - При приближении пули к врагу на дистанцию < 2 метров timescale снижается до 0.1
    (супер-замедление)
  - После поражения последнего врага запускается 2-секундный победный ракурс с облетом
    сцены (orbit camera)
  - При промахе камера возвращается в режим прицеливания с затемнением или мгновенным
    рестартом
  state:
  - camera_mode (AIM / FOLLOW / IMPACT / VICTORY)
  - current_timescale
  - target_transform
  - lerp_factor
  interactions: Взаимодействует с Physics Engine (управление fixedDeltaTime) и Audio
    Engine (питч звуков снижается до 0.5x).
  feedback: Эффект виньетки и легкого Chromatic Aberration по краям экрана в момент
    Slow-Motion.
  edge_cases:
  - Пуля летит в узкий туннель (камера использует raycast против стен для предотвращения
    клиппинга геометрии)
  - Игрок нажимает кнопку пропуска полета (timescale мгновенно сбрасывается в 3.0x
    до завершения расчета)
- name: Физическая система разрушений и Ragdoll (Impact & Destruction Engine)
  purpose: Реалистичный просчет ударов пули, детонации бочек и физического разлета
    тел врагов.
  input: Столкновения коллайдеров Rapier3D / Three.js Raycast Hits.
  rules:
  - Прямое попадание пули передает импульс телу врага в точке контакта
  - 'Взрыв бочки генерирует радиальную силу: Force = MaxForce * (1 - Distance / Radius)'
  - Кубический враг распадается на 6-8 независимых физических блоков с рандомизированным
    вращательным моментом
  - Разрушенные объекты деактивируют свои коллайдеры через 3 секунды для экономии
    ресурсов
  state:
  - active_rigidbodies
  - destroyed_entities
  - explosion_queue
  interactions: Посылает события в Level Manager для проверки условий победы.
  feedback: Спавн облака дыма и искр (Particle System), тряска экрана (Camera Shake
    0.3s), сочный звук взрыва.
  edge_cases:
  - Обломок бочки сбивает врага (засчитывается как убийство окружением)
  - Враг падает за пределы карты (триггер KillZone снизу уровня засчитывает устранение)
- name: Система рейтинга уровней и мгновенного рестарта (Level Flow & Scoring)
  purpose: Оценка мастерства игрока, сохранение звезд и обеспечение нулевой задержки
    при повторной попытке.
  input: Количество потраченных выстрелов, время прохождения, нажатие клавиши рестарта
    (R / кнопка в UI).
  rules:
  - Каждый уровень имеет лимит выстрелов (1 выстрел = 3 звезды, 2 выстрела = 2 звезды,
    3 выстрела = 1 звезда)
  - Убийство всех врагов одним выстрелом с первого рикошета дает идеальный рейтинг
    (3 звезды)
  - Нажатие клавиши 'R' или экранной кнопки перезапускает уровень менее чем за 100
    мс без перезагрузки сцены (сброс позиций объектов через пул)
  - Результаты уровня сохраняются в Cloud Storage через Playgama Bridge
  state:
  - shots_fired
  - current_level
  - stars_awarded
  - level_status (READY/IN_FLIGHT/WON/FAILED)
  interactions: Связь с UI Manager и Playgama Bridge Save Storage.
  feedback: Анимация появления 3 сияющих звезд со звуковыми аккордами, всплывающая
    плашка 'ИДЕАЛЬНЫЙ ТРИКШОТ!'.
  edge_cases:
  - Игрок нажимает рестарт прямо во время полета пули (анимация и физика мгновенно
    прерываются, пуля возвращается в ствол)
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.170.0
  physics_engine: Rapier3D (@dimforge/rapier3d-compat 0.13.x)
  state_manager: Reactive EventBus / Custom Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 60
  max_triangles_or_sprites: 35000
  bundle_size_budget_mb: 3.8
  layers:
  - name: UI & Input Layer
    description: HTML5/Canvas оверлей, обработка тач-свайпов, мыши, виртуального прицеливания,
      HUD и экранов победы/поражения.
  - name: Game Logic & State Layer
    description: Контроллер уровней, система звезд, правила рикошетов, спавнер сущностей
      и стейт-машина игры.
  - name: Physics & Simulation Layer
    description: 'Rapier3D физический мир: непрерывная детекция столкновений (CCD)
      для скоростной пули, рэгдоллы, взрывы.'
  - name: Rendering & VFX Layer
    description: Three.js сцена, шейдеры лазерного луча, камера слежения со сглаживанием
      Slerp, партикловые системы и пост-процессинг.
  - name: Platform & Storage Layer
    description: Интеграция с @playgama/bridge (Яндекс Игры, VK), полноэкранная реклама,
      rewarded видео, облачные сохранения.
  modules:
  - name: LaserPredictor
    description: Выполняет быстрый математический raycasting для отрисовки траектории
      отражений лазера.
  - name: BulletCameraController
    description: Управляет плавной интерполяцией камеры за пулей и регулирует timescale
      в слоу-мо.
  - name: LevelManager
    description: Хранит конфигурации 20 уровней, осуществляет быстрый сброс и перезапуск
      сущностей.
  - name: RagdollSystem
    description: Управляет физическими телами составных кубических врагов и их разлетом
      при попаданиях.
  - name: PortalManager
    description: Обрабатывает телепортацию пули и трансформацию вектора скорости между
      порталами.
  - name: BridgeService
    description: Обертка над SDK Playgama для безопасных вызовов рекламы, лидербордов
      и сохранения прогресса.
monetization:
  strategy_summary: 'Ненавязчивая гибридная модель: межстраничная реклама с умным
    таймером между уровнями, просмотр Rewarded видео для разблокировки подсказки идеальной
    траектории (Laser Guide) и пропуска сложного уровня, а также косметические покупки
    скинов оружия и эффектов трассировки пули.'
  rewarded_placements:
