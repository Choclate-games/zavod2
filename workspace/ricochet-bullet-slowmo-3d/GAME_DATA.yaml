playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - gamepix
  - web
  initialization_flow:
  - 1. Инициализация Bridge.init() на этапе прелоадера
  - 2. Проверка доступности платформенного SDK и языка пользователя (ru/en)
  - 3. Загрузка данных сохранений игрока из Bridge.storage.get()
  - 4. Инициализация аудио-контекста по первому пользовательскому клику/тапу
  - 5. Скрытие загрузочного экрана и плавный показ Главного Меню
  cloud_save_keys:
  - current_unlocked_level
  - level_stars_map
  - total_stars_count
  - selected_bullet_skin
  - selected_laser_color
  - unlocked_cosmetics_list
  - sound_volume
  - music_volume
  leaderboards:
  - total_stars_rating
  - least_shots_completed
  ads_integration:
    interstitial: Bridge.advertisement.showInterstitial() с проверкой Bridge.advertisement.isInterstitialSupported()
    rewarded: Bridge.advertisement.showRewarded() с колбэками onRewarded и onClose
    banner: Bridge.advertisement.showBanner() для десктопных экранов меню
  lifecycle_hooks:
  - 'Bridge.on(''visibility_change'', (isVisible) => isVisible ? resumeGame() : pauseGameAndAudio())'
  - Bridge.on('audio_mute_request', () => muteAllAudio())
  - Bridge.on('audio_unmute_request', () => unmuteAllAudio())
