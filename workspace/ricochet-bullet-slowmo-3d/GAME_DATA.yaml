    углами.
  performance_throttling:
  - Автоматическое определение мобильного GPU и адаптивное разрешение (DPR от 1.0
    до 1.5 вместо тяжелого 3.0)
  - Пул объектов (Object Pooling) для частиц взрыва, обломков и сегментов лазерного
    луча без выделения памяти в рантайме
  - Отключение тяжелых пост-эффектов (Bloom заменяется на аддитивные спрайты) на слабых
    мобильных чипсетах
  - Фиксированный шаг физики 60 Гц с максимальным числом суб-степов не более 2
