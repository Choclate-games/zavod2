raw_prompt: Создай 3D вождение грузовика на Three.js с процедурно генерируемой ухабистой
  трассой. В кузове грузовика находятся физические объекты с расчетом коллизий. Игрок
  управляет газом и тормозом. Задача — проехать маршрут от деревни до лесопилки, потеряв
  как можно меньше груза. Добавь спидометр, индикатор целостности груза и уютную рустик-стилистику.
title: 'Тайга: Экспедиция'
slug: rustic-cargo-truck-3d
genre: Физический 3D-симулятор вождения
subgenre: Аркадная доставка груза по бездорожью
renderer: threejs
renderer_reason: User explicitly specified 'threejs'.
renderer_confidence: 1.0
platform: Playgama Bridge (Яндекс Игры / VK Play / Web & Mobile)
orientation: landscape
target_audience: Игроки от 10 до 45 лет, любители физических автосимуляторов, Hill
  Climb Racing, Spintires/MudRunner, ценящие медитативный, но азартный геймплей с
  реалистичной физикой груза.
core_loop: Старт в деревне с полным кузовом -> Преодоление ухабистой процедурной трассы
  с контролем тяги и торможения -> Балансировка на склонах для предотвращения выпадения
  брёвен и ящиков -> Финиш на лесопилке -> Подсчет доставленного груза и получение
  монет -> Прокачка грузовика и открытие новых маршрутов.
hook: Тактильная физика раскачивающихся и норовящих вылететь из кузова брёвен на непредсказуемых
  ухабах в ламповой, теплой сельской атмосфере.
player_fantasy: Мастерский шофёр винтажного грузовика, способный проехать по любым
  оврагам и доставить ценный груз в целости сквозь живописные лесные просеки.
session_model: Быстрые динамичные сессии по 2–4 минуты на один заезд с постоянным
  накоплением прогресса и апгрейдами.
unique_value_proposition: Полноценный 3D-физический автосимулятор в браузере с процедурным
  ландшафтом, честной физикой сыпучего/штучного груза и уютным визуальным стилем без
  долгих загрузок.
vision: Создать главный веб-хит в жанре перевозки грузов, сочетающий медитативную
  атмосферу русской природы, азартную физическую модель и высокую реиграбельность
  за счет процедурной генерации трасс.
elevator_pitch: Заведи старый добрый грузовик и доставь брёвна из тихой деревни на
  лесопилку! Дорога полна кочек, ям и крутых подъемов — удерживай баланс газа и тормоза,
  следи за спидометром и довези груз в целости, чтобы заработать максимум на прокачку
  машины.
win_conditions: Достижение финишных ворот лесопилки с сохранением хотя бы 1 единицы
  груза (для получения максимальных 3 звёзд требуется доставить от 80% до 100% груза).
lose_conditions: Полная потеря всех предметов из кузова (0% груза) или опрокидывание
  грузовика на крышу более чем на 3 секунды.
progression_summary: Заработанные за доставку монеты тратятся на улучшение двигателя
  (мощность на подъемах), подвески (гашение ударов на ухабах), шин (сцепление с грунтом)
  и наращивание бортов кузова. Открываются новые модели грузовиков и сложные типы
  грузов (хрупкие ящики, бочки).
difficulty_curve: Плавный рост сложности от пологих деревенских холмов до крутых таёжных
  перевалов с глубокими колеями, трамплинами и скользкими деревянными мостами.
scores:
  fun: 9
  originality: 8
  replayability: 9
  development_cost: 7
  visual_appeal: 9
  mobile_fit: 9
  monetization: 8
  platform_fit: 10
  overall_score: 8.7
  justification: Классическая механика доставки с физикой груза в сочетании с 3D Three.js
    и процедурной генерацией создает мощный виральный эффект на площадках Яндекс Игр
    и Playgama, обеспечивая высокую глубину сессий и органический интерес к мета-прогрессии.
references:
- name: MudRunner / Spintires
  genre: Heavy Off-road Simulator
  mechanics:
  - Физика преодоления бездорожья
  - Инерция тяжелой техники
  - Перевозка бревен
  lessons: Ощущение веса машины и преодоления рельефа вызывает невероятное удовлетворение.
  what_to_avoid: Излишне медленный темп и комплексное управление, неподходящее для
    быстрых веб-сессий.
- name: Hill Climb Racing
  genre: 2D Physics Driving
  mechanics:
  - Управление двумя педалями (газ/тормоз)
  - Прокачка узлов автомобиля
  - Преодоление крутых холмов
  lessons: Простое бинарное управление в сочетании с честной физикой доступно игрокам
    любого возраста.
  what_to_avoid: Плоская 2D-перспектива и однообразный фон.
- name: Truck Loader / Cargo Delivery Games
  genre: Physics Cargo Puzzle/Driving
  mechanics:
  - Физические объекты в открытом кузове
  - Индикатор сохранности груза
  - Штрафы за потерянный товар
  lessons: Вид вылетающего из кузова ящика создает яркую эмоциональную реакцию и стимулирует
    играть аккуратнее.
  what_to_avoid: Статичные повторяющиеся трассы без процедурного разнообразия.
mechanics:
- name: Двухпедальное управление тягой и торможением
  category: driving
  priority: core
  description: Игрок управляет только подачей газа (ускорение вперед) и тормозом (замедление
    / задний ход / балансировка в воздухе).
  player_interaction: Нажатие клавиш W/S, стрелок вверх/вниз на ПК или сенсорных экранных
    педалей на смартфонах.
  feedback: Звук нарастающих оборотов двигателя, дым из выхлопной трубы, наклон кузова
    грузовика при торможении.
  technical_complexity: Medium
  strengths:
  - Мгновенный порог входа
  - Идеально для мобильных тач-устройств
  weaknesses:
  - Требует тонкой настройки физического трения, чтобы машина не казалась невесомой
- name: Физическая симуляция груза в кузове
  category: physics
  priority: core
  description: В кузов загружаются отдельные твердые тела (брёвна цилиндрической формы,
    кубические ящики), которые сталкиваются между собой и бортами.
  player_interaction: Косвенное влияние через скорость и ускорение грузовика.
  feedback: Стук дерева о дерево, глухие удары о борта, визуальное смещение и вываливание
    предметов через край.
  technical_complexity: High
  strengths:
  - Максимальная наглядность и драматизм геймплея
  - Каждый заезд уникален
  weaknesses:
  - Риск застревания коллидеров на высокой скорости (требует включения CCD)
- name: Процедурная генерация ухабистого маршрута
  category: generation
  priority: core
  description: Генерация 3D-сплайна дороги с наложением шумов Перлина/Симплекс для
    создания кочек, оврагов, канав и мостов.
  player_interaction: Игрок визуально оценивает рельеф впереди и заранее сбрасывает
    или набирает скорость.
  feedback: Тряска камеры, срабатывание рессор подвески, пыль из-под колес при наезде
    на неровности.
  technical_complexity: High
  strengths:
  - Бесконечная вариативность уровней
  - Минимальный размер билда без тяжелых запеченных карт
  weaknesses:
  - Необходимость алгоритмической валидации проходимости крутых склонов
- name: Индикатор целостности и подсчет доставленного груза
  category: scoring
  priority: core
  description: Отслеживание количества оставшихся в кузове объектов в реальном времени
    и расчет финальной награды на финише.
  player_interaction: Игрок следит за шкалой на HUD и выбирает между риском ради скорости
    и осторожностью.
  feedback: Цветовая смена индикатора (зеленый -> желтый -> красный), тревожный звуковой
    сигнал при выпадении предмета.
  technical_complexity: Low
  strengths:
  - Четкая и понятная цель для игрока
  - Создает сильное напряжение на последних метрах перед финишем
  weaknesses:
  - Требуется корректная фильтрация ложных срабатываний при подпрыгивании груза внутри
    кузова
gameplay_systems:
- name: VehiclePhysicsSystem
  purpose: 'Симуляция динамики грузовика: крутящий момент, многорычажная подвеска,
    сцепление колес с грунтом и центр тяжести.'
  input: Команды газа/тормоза от контроллеров ввода (клавиатура / тач).
  rules:
  - Подача газа прикладывает крутящий момент к задней оси с учетом передаточного числа
  - Тормоз создает замедляющий момент и переносит массу на переднюю ось
  - Подвеска амортизирует вертикальные толчки от неровностей процедурного меша
  state:
  - currentSpeed
  - engineRPM
  - suspensionCompression
  - isGrounded
  - tiltAngle
  interactions: Взаимодействует с RoadMeshCollider и передает импульсы кузову, где
    находится груз.
  feedback: Спидометр на HUD, наклон шасси, частицы пыли и звуки двигателя.
  edge_cases:
  - Грузовик завис на гребне холма днищем
  - Переворот на 180 градусов
- name: CargoPhysicsSystem
  purpose: Контроль физики предметов в кузове, коллизий и фиксация факта потери груза.
  input: Физические импульсы от перемещения кузова грузовика.
  rules:
  - Каждый объект груза обладает массой, трением и упругостью
  - Если объект покидает ограничивающий триггер кузова и касается земли, он помечается
    как потерянный
  - Потерянный объект деактивируется через 5 секунд для экономии производительности
  state:
  - totalCargoCount
  - activeCargoCount
  - cargoIntegrityPercent
  - cargoObjectsList
  interactions: Передает данные в DeliveryScoringSystem и HUD.
  feedback: Всплывающий красный значок '-1 Груз!', тревожный звуковой сигнал, обновление
    шкалы целостности.
  edge_cases:
  - Бревно высоко подлетело на кочке, но приземлилось обратно в кузов (не считается
    потерянным)
- name: ProceduralRoadSystem
  purpose: Генерация бесконечного или сегментного ухабистого маршрута от точки 'Деревня'
    до 'Лесопилка'.
  input: Сид уровня, длина трассы, коэффициент холмистости и плотности препятствий.
  rules:
  - Трасса строится по 3D Catmull-Rom сплайну
  - Высота профиля модулируется несколькими октавами шума Перлина
  - Вдоль обочин процедурно расставляются сосны, березы, заборы и дорожные знаки
  - В начале трассы генерируется зона деревни с избами, в конце — лесопилка с конвейером
  state:
  - levelSeed
  - roadSpline
  - roadMesh
  - finishDistance
  - playerProgress
  interactions: Предоставляет коллизионную геометрию для физического движка Rapier3D.
  feedback: Плавная подгрузка геометрии, маркеры дистанции вдоль обочин.
  edge_cases:
  - Слишком крутой угол подъема (сглаживается авто-валидатором уклона)
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.170.0
  physics_engine: Rapier3D (@dimforge/rapier3d-compat 0.13.x)
  state_manager: Reactive EventBus / Nanostores
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 75
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 3.8
  layers:
  - name: EnvironmentLayer
    type: Three.Group
    description: Процедурный меш дороги, террейн, деревья, дома деревни и лесопилка
      с инстансингом
  - name: VehicleLayer
    type: Three.Group
    description: Модель грузовика, анимированные колеса, открытый кузов
  - name: CargoLayer
    type: Three.Group
    description: Динамические физические объекты груза (брёвна, ящики, бочки)
  - name: VFXLayer
    type: Three.Points / InstancedMesh
    description: Пыль из-под колес, выхлопной дым, искры и листопад
  - name: UILayer
    type: HTML/CSS Overlay
    description: Адаптивный спидометр, индикатор груза, педали управления и экраны
      победы/поражения
  modules:
  - name: RoadGenerator
    path: src/core/world/RoadGenerator.ts
    responsibility: Генерация сплайна, расчет триангуляции дороги и создание Rapier
      Trimesh коллидера
  - name: TruckController
    path: src/core/entities/TruckController.ts
    responsibility: Физическое управление грузовиком, обработка газа, тормоза, амортизаторов
  - name: CargoManager
    path: src/core/entities/CargoManager.ts
    responsibility: Спавн грузов в кузове, отслеживание выпадения через триггерные
      зоны и расчет целостности
  - name: BridgeService
    path: src/services/BridgeService.ts
    responsibility: 'Интеграция с Playgama Bridge: реклама, облачные сохранения и
      лидерборды'
monetization:
  strategy_summary: 'Мягкая гибридная модель: ненавязчивая межстраничная реклама между
    рейсами, ценные Rewarded видео (удвоение заработка, спасательный магнит для груза)
    и покупка эксклюзивных лесовозов/отключения рекламы.'
  rewarded_placements:
  - id: double_reward
    name: Удвоить награду за рейс
    benefit: Умножает заработанные монеты за доставленный груз на x2
    cooldown_or_limit: После каждого успешного заезда
    trigger_moment: Экран завершения рейса на лесопилке
  - id: cargo_magnet_revive
    name: Магнит груза (Возврат)
    benefit: Возвращает все выпавшие брёвна обратно в кузов и чинит целостность до
      100%
    cooldown_or_limit: 1 раз за заезд при потере >50% груза
    trigger_moment: Критическая потеря груза во время заезда
  - id: free_super_tuning
    name: Тест-драйв супер-подвески
    benefit: Дает максимальный уровень подвески и шин на один следующий рейс
    cooldown_or_limit: 1 раз в 10 минут
    trigger_moment: Экран гаража перед стартом
  interstitial_placements:
  - trigger_event: Возврат в гараж / переход к следующему рейсу
    cooldown_seconds: 90
    conditions: Показывается только между рейсами, никогда не прерывает активное вождение
  in_app_purchases:
  - sku: remove_ads_forever
    name: Отключение рекламы
    description: Полностью отключает все межстраничные баннеры навсегда
    price_tier: Tier 2 (~199 RUB / 1.99 USD)
    reward: Вечный No-Ads статус + 5000 бонусных монет
  - sku: truck_taiga_beast
    name: Тягач 'Таёжный Медведь 6x6'
    description: Эксклюзивный полноприводный трехосный грузовик с высокими бортами
    price_tier: Tier 3 (~299 RUB / 2.99 USD)
    reward: Разблокировка уникального тягача с повышенной устойчивостью
  - sku: coin_pack_large
    name: Мешок деревенского золота
    description: Большой запас монет на полную прокачку любого грузовика
    price_tier: Tier 1 (~99 RUB / 0.99 USD)
    reward: 15,000 монет
  fairness_rules:
  - Любой грузовик и трасса могут быть открыты исключительно за счет игрового процесса
    без доната
  - Реклама не прерывает заезд в процессе управления
  - Rewarded видео строго опциональны и дают комфортный бонус, не блокируя прохождение
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - game_distribution
  - crazy_games
  - mobile_web
  initialization_flow:
  - Инициализация bridge.initialize() при старте страницы
  - Определение типа платформы и языка интерфейса (RU/EN)
  - Загрузка данных игрока из облачного хранилища bridge.storage.get()
  - Инициализация баннерной рекламы и регистрация хуков видимости страницы
  cloud_save_keys:
  - player_coins
  - selected_truck_id
  - truck_upgrades_data
  - unlocked_trucks
  - high_score_cargo
  - settings_sound_volume
  leaderboards:
  - leaderboard_total_cargo_delivered
  - leaderboard_fastest_timber_run
  ads_integration:
    interstitial_enabled: true
    rewarded_enabled: true
    banner_enabled: false
  lifecycle_hooks:
  - bridge.on('gameplay_pause', () => pausePhysicsAndAudio())
  - bridge.on('gameplay_resume', () => resumePhysicsAndAudio())
  - bridge.on('visibility_change', (state) => handleVisibility(state))
art:
  style_name: Cozy Rustic Low-Poly Stylized 3D
  camera_perspective: Динамическая преследующая камера сбоку-сзади (Chase Cam 3/4)
    с плавным демпфированием
  camera_fov: 52
  camera_pitch_angle: 22
  environment_theme: 'Живописная русская глубинка: деревянные избы с резными наличниками,
    золотые сосны, березовые рощи, речной брод с деревянным мостом и дымящая лесопилка
    вдали.'
  character_proportions: Коренастый винтажный грузовик (вдохновленный ГАЗ-51/ЗИЛ-130)
    с выразительной круглой кабиной, массивными колесами и просторным деревянным кузовом.
  lighting_setup: Мягкий теплый свет 'золотого часа' (DirectionalLight под низким
    углом с теплыми оранжевыми тенями) + рассеянный небесный свет HemisphericalLight.
  color_palette:
    truck_red: '#C23B22'
    truck_chrome: '#E0E5E8'
    timber_wood: '#6B4423'
    dirt_road: '#8B5A2B'
    autumn_grass: '#5A7A32'
    golden_sunlight: '#FDE68A'
    sky_blue: '#93C5FD'
    ui_wood_panel: '#4A2E18'
  vfx_list:
  - Густые клубы пыли из-под задних колес при пробуксовке
  - Кольца сизого дизельного дыма из выхлопной трубы при нажатии на газ
  - Искры при чиркании днища о выступающие камни
  - Разлетающиеся осенние листья при быстром проезде сквозь лес
  - Праздничный салют из древесных опилок и конфетти на финише лесопилки
  ui_theme: 'Уютный рустик-стиль: текстурированные деревянные плашки, бронзовые заклепки,
    крупный винтажный спидометр со стрелкой и сочные зеленые индикаторы целостности.'
ui_ux:
  hud_elements:
  - Винтажный круглый спидометр (0-100 км/ч) со стрелкой и цифровым дублером внизу
    справа
  - 'Индикатор целостности груза: горизонтальная шкала с иконкой бревна (100% -> 0%)
    вверху по центру'
  - Индикатор прогресса маршрута (мини-линия 'Деревня [Иконка грузовика] Лесопилка')
