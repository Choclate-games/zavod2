definition_of_done:
- Грузовик плавно управляется с клавиатуры (W/S/Стрелки) и сенсорных педалей на смартфонах
- Процедурная ухабистая трасса генерируется с кочками, спусками, мостами и корректными
  коллизиями
- Физические брёвна/ящики реалистично подпрыгивают в кузове и выпадают при экстремальной
  езде
- Спидометр и индикатор целостности груза на HUD точно отражают текущую скорость и
  оставшийся товар
- Заезд завершается подсчетом доставленного груза у лесопилки с начислением монет
- Реализована система улучшений в гараже (двигатель, подвеска, шины, борта)
- Интегрирован Playgama Bridge (сохранения, лидерборды, показ рекламы)
- Стабильные 60 FPS на ПК и мобильных устройствах
