mobile:
  orientation: landscape
  touch_implementation: Большие полупрозрачные сенсорные кнопки педалей с активной
    зоной отклика и тактильной вибрацией (navigator.vibrate) при нажатии.
  safe_area_handling: Применение CSS env(safe-area-inset-left) и env(safe-area-inset-right)
    для предотвращения наложения кнопок на вырезы камер смартфонов.
  performance_throttling:
  - Динамический pixelRatio (ограничение до 1.5 на Retina/High-DPI экранах)
  - Инстансинг геометрии деревьев и заборов вдоль дороги
  - Отключение мягких теней (PCFSoftShadowMap -> BasicShadowMap) на слабых мобильных
    GPU
audio:
  bgm_track: Теплая акустическая кантри/фолк мелодия на акустической гитаре, банджо
    и губной гармошке, создающая ощущение утренней дороги.
  engine_sound: Процедурный или сэмплированный рокот дизельного двигателя с изменением
    высоты тона (pitch) в зависимости от текущей скорости и нагрузки.
  suspension_squeak: Характерный металлический скрип рессор и глухие удары амортизаторов
    при проезде глубоких ухабов.
  cargo_impacts: Реалистичные глухие стуки сталкивающихся деревянных брёвен и дребезг
    бортов кузова.
  cargo_loss_alert: Звонкий тревожный звук при выпадании бревна из кузова на дорогу.
  brakes_air_hiss: Короткий шипящий звук пневматических тормозов при резкой остановке.
  victory_fanfare: Победный гудок грузовика и радостный аккорд банджо при пересечении
    финиша на лесопилке.
qa:
  functional_tests:
  - Проверка корректности начисления монет при разном проценте доставленного груза
    (0%, 50%, 100%)
  - 'Тестирование коллизий: брёвна не должны проваливаться сквозь дно или стенки кузова
    при резком ускорении'
  - Проверка работы Rewarded видео на удвоение монет и возврат груза через мок-адаптер
    Playgama
  - Проверка сохранения прогресса и купленных улучшений при перезагрузке страницы
  performance_benchmarks:
  - Стабильные 60 FPS на ПК в разрешении Full HD
  - Не менее 50-60 FPS на мобильных устройствах среднего уровня (уровня Snapdragon
    680 / Apple A12)
  - Время первичной загрузки страницы не более 2.5 секунд при 4G соединении
  cross_browser_matrix:
  - Google Chrome (Desktop & Android)
  - Safari (iOS 15+ / macOS)
  - Yandex Browser (Desktop & Mobile)
  - Mozilla Firefox & Microsoft Edge
  common_bug_checklist:
  - Туннелирование физики груза на высокой скорости (решается включением Rapier CCD)
  - Застревание машины днищем на вершинах треугольников процедурной сетки
  - Утечки памяти WebGL при многократных перезапусках заезда без очистки Three.js
    геометрий
  - Рассинхрон аудио Web Audio API при переключении вкладок браузера
roadmap:
- phase_number: 1
  title: Физический прототип и базовый контроллер
  duration_days: 2
  tasks:
  - Настройка Three.js сцены и физического мира Rapier3D
  - Создание модели грузовика с подвижными колесами и физическим шасси
  - Реализация двухпедального управления (газ, тормоз, реверс)
  - Добавление кузова и спавн физических брёвен с расчетом массы и трения
  milestone_deliverable: Управляемый грузовик, способный перевозить подвижные брёвна
    в кузове по тестовой плоскости с трамплинами.
- phase_number: 2
  title: Процедурный генератор трассы и коллизии
  duration_days: 3
  tasks:
  - Разработка алгоритма генерации сплайна дороги с шумом Перлина
  - Построение процедурного меша трассы с UV-разверткой гравийной дороги
  - Генерация точного Rapier Trimesh коллидера для ухабистого рельефа
  - 'Инстансинг декораций: деревья, кусты, заборы, стартовая деревня и финишная лесопилка'
  milestone_deliverable: Полноценная процедурная трасса от деревни до лесопилки с
    ухабами, кочками и мостами.
- phase_number: 3
  title: Игровая логика, HUD и рустик-арт
  duration_days: 3
  tasks:
  - Индикатор целостности груза и система детекции выпавших предметов
  - 'Создание UI: спидометр с аналоговой стрелкой, полоса прогресса, педали управления'
  - Настройка теплого освещения 'золотого часа', кастомных шейдеров пыли и дыма
  - Интеграция звукового движка (мотор, стук бревен, скрип рессор, фолк-музыка)
  milestone_deliverable: Красивая и завершенная играбельная сессия доставки груза
    с полным визуальным и звуковым фидбеком.
- phase_number: 4
  title: Мета-прогрессия, Гараж и Playgama SDK
  duration_days: 2
  tasks:
  - 'Интерфейс гаража: прокачка двигателя, подвески, шин и высоты бортов кузова'
  - 'Подключение Playgama Bridge: облачные сохранения, лидерборды, межстраничная и
    rewarded реклама'
  - Тестирование на мобильных экранах, оптимизация батчинга и отрисовки (Draw Calls
    < 70)
  milestone_deliverable: Полноценный релизный билд, готовый к публикации на Яндекс
    Играх и мобильных платформах.
risks:
- risk: Выпадение или просачивание физических объектов сквозь стенки кузова при резких
    ударах о кочки
  category: technical
  severity: High
  mitigation: Использование Continuous Collision Detection (CCD) для брёвен и кузова,
    увеличение толщины невидимых стенок коллидера кузова.
- risk: Просадки FPS на слабых смартфонах из-за расчета физики большого числа объектов
    на процедурном меше
  category: performance
  severity: Medium
  mitigation: Ограничение количества активных брёвен до 8–12 штук, использование Rapier3D
    на WebAssembly, генерация физических коллидеров дороги локальными чанками вокруг
    игрока.
- risk: Игрок может застрять на слишком крутом процедурном подъеме при непрокачанном
    грузовике
  category: gameplay
  severity: Medium
  mitigation: Автоматическое сглаживание сплайна трассы (максимальный угол наклона
    не более 25 градусов) и защита от тупиковых генераций.
skills:
- skill_id: threejs-rapier-vehicle-physics
  name: Three.js & Rapier3D Vehicle and Cargo Controller
  filename: skills/threejs-rapier-vehicle-physics.md
  purpose: Обеспечить стабильную симуляцию физики грузовика с динамической подвеской
    и коллизиями груза в веб-среде.
  when_to_use: При реализации физического контроллера автомобиля, взаимодействия колес
    с неровным грунтом и симуляции предметов в кузове.
  rules:
  - Всегда использовать фиксированный шаг физики (fixed timestep 1/60s)
  - Применять CCD для быстро движущихся физических тел груза
  - Не изменять позицию Three.js мешей напрямую, синхронизировать их строго с RigidBody.translation()
    и rotation()
  architecture: TruckController связывает ввод пользователя с Rapier Raycast/RigidBody
    колес, передавая смещения в визуальную иерархию Three.js.
  implementation_guidance: Использовать составной составной коллидер (Compound Collider)
    для кузова грузовика с достаточной толщиной бортов, чтобы исключить проскальзывание
    бревен.
  common_mistakes:
  - Использование стандартного Trimesh для динамического кузова (Trimesh в Rapier
    должен быть только статическим)
  - Отсутствие деактивации выпавших за пределы экрана брёвен
  checklist:
  - Проверен отклик педалей газа и тормоза
  - Подвеска амортизирует кочки без бесконечной раскачки
  - Груз стабильно лежит в кузове при спокойной езде
  knowledge_refs:
  - Rapier3D Documentation (@dimforge/rapier3d-compat)
  - Three.js InstancedMesh Best Practices
- skill_id: procedural-road-generation-threejs
  name: Procedural Bumpy Road Spline Generator
  filename: skills/procedural-road-generation-threejs.md
  purpose: Генерация сглаженной 3D-дороги с естественными ухабами, кочками и придорожными
    декорациями.
  when_to_use: При создании бесконечных или сегментных трасс для гонок и симуляторов
    вождения на Three.js.
  rules:
  - Формировать сплайн через CatmullRomCurve3 с равномерным шагом точек
  - Модулировать высоту через 2D Simplex Noise с контролем максимальной амплитуды
  - Переиспользовать буферы геометрии для предотвращения сборок мусора (GC spikes)
  architecture: Модуль RoadGenerator создает сплайн, вычисляет нормали/бинормали (Frenet
    frames) и генерирует BufferGeometry дороги и коллидера.
  implementation_guidance: Для физики дороги создавать Rapier Trimesh коллидер на
    основе вершин сгенерированной BufferGeometry.
  common_mistakes:
  - Слишком высокая плотность вершин меша, снижающая производительность
  - Резкие перепады высоты, приводящие к подбрасыванию машины в космос
  checklist:
  - Сплайн генерируется без самопересечений
  - Коллидер дороги совпадает с визуальной поверхностью
  - Деревья и декорации не спавнятся прямо посреди проезжей части
  knowledge_refs:
  - Three.js Curve and Spline Extrusion
  - SimplexNoise.js algorithm
- skill_id: game_skill
  name: 'Лесной Рейс: Доставка на Лесопилку 3D Domain Architecture'
  filename: GAME_SKILL.md
  purpose: 'Defines domain rules, state machine, and core gameplay loop for Лесной
    Рейс: Доставка на Лесопилку 3D.'
  when_to_use: Use when writing or modifying core game state, loop coordination, and
    progression.
  rules:
  - Strict TypeScript strict mode without any 'any' types.
  - Fixed 60Hz delta accumulator with delta clamping.
  - Decoupled state management via typed EventBus.
  - Zero runtime object allocations inside the 60Hz game loop.
  architecture: 'Decoupled 3-layer architecture: Application/Platform -> Engine/Systems
    -> Rendering/UI.'
  implementation_guidance: Instantiate Game instance from main.ts, bootstrap PlaygamaService,
    and start GameLoop.
  common_mistakes:
  - Do not instantiate Three.js meshes or heavy objects inside tick loops.
  - Do not bypass the EventBus for cross-system communications.
  checklist:
  - Game initializes cleanly and loads within 3 seconds.
  - EventBus routes inputs and system events without memory leaks.
  - Audio auto-pauses and unpauses cleanly with browser focus changes.
  knowledge_refs: []
- skill_id: gameplay_skill
  name: Combat, Physics & Movement Systems
  filename: GAMEPLAY_SKILL.md
  purpose: Defines standards for physics simulation, combat mechanics, and tactile
    player feedback.
  when_to_use: Use when writing character controllers, weapon systems, collision listeners,
    and juice/VFX.
  rules:
  - Clamp delta time to maximum 100ms to prevent physics tunneling.
  - Use continuous collision detection (CCD) for fast projectiles.
  - Apply hitstop (40ms time dilation) on impactful strikes.
  - Always synchronize physics rigid body transforms to mesh representations.
  architecture: Physics engine (Rapier3D/Matter.js) stepped on fixed 60Hz timestep,
    meshes interpolated.
  implementation_guidance: Use EventBus to emit 'entity:hit', 'combat:parry', 'wave:cleared'
    events for sound and VFX triggers.
  common_mistakes:
  - Never modify transform matrices directly on physics-controlled entities.
  - Do not hardcode magic numbers for damage or velocities without centralized configuration.
  checklist:
  - Player movement is responsive with no input lag.
  - Hits produce satisfying sensory feedback (VFX spark, screen shake, audio impact).
  - Ragdoll or death animations trigger smoothly without physics jitter.
  knowledge_refs: []
- skill_id: renderer_skill
  name: THREEJS WebGL Performance Guide
  filename: RENDERER_SKILL.md
  purpose: Optimization and visual standards for THREEJS WebGL pipeline.
  when_to_use: Use when configuring scenes, cameras, lighting, materials, instanced
    meshes, and particle systems.
  rules:
  - Keep active draw calls strictly under 80.
  - Use InstancedMesh for debris, bullets, and crowd mobs.
  - Clamp pixel ratio to Math.min(window.devicePixelRatio, 1.5) on mobile.
  - Share material instances across identical geometry.
  architecture: Scene graph with pre-allocated sprite and mesh pools, dynamic shadow
    frustum optimization.
  implementation_guidance: Initialize renderer with antialias enabled on desktop,
    powerPreference 'high-performance'.
  common_mistakes:
  - Do not construct new Geometries, Textures, or Materials in the render loop.
  - Do not leave unused GPU assets without calling .dispose().
  - Do not tune quality from raw frame time — under vsync every frame reads as budget-length.
  - Do not launch in reduced quality and climb up; start optimistic and step down.
  checklist:
  - Maintains solid 60 FPS on desktop and >= 50 FPS on mobile.
  - No WebGL context loss errors on tab switches.
  - Shadow map renders crisp without artifact acne.
  - The quality auto-tuner converges and locks instead of oscillating.
  knowledge_refs:
  - threejs/adaptive_quality.md
  - threejs/mobile_shaders.md
  - threejs/performance_guide.md
  - threejs/physics_integration.md
  - threejs/vehicle_wheel_rig.md
- skill_id: playgama_skill
  name: Playgama Bridge SDK Integration
  filename: PLAYGAMA_SKILL.md
  purpose: Defines implementation patterns for @playgama/bridge v2 (Ads, Cloud Storage,
    Auth, Leaderboards, Lifecycle).
  when_to_use: Use when implementing advertising triggers, cloud save/load, authorization,
    and portal lifecycle hooks.
  rules:
  - Always await bridge.initialize() (with a timeout) before any other SDK call.
  - Send game_ready exactly once, only after assets are loaded and the menu is interactive.
  - Grant a rewarded reward only on state === 'rewarded'; never when the promise resolves.
  - One save key holding one JSON object; storage.get/set take no storageType argument.
  - Call authorize() only from a player action — except the silent VK/OK path at boot.
  - 'Build UI on capability flags: an unsupported feature''s control is not rendered
    at all.'
  - Take pause and audio state from the platform's own events, not visibilitychange
    alone.
  - Auto-save on progress milestones and flush on pagehide.
  architecture: Singleton PlaygamaService wrapper exposing strongly-typed promises
    for Ads, Storage, Auth, Payments and Leaderboards, degrading to a local mock when
    window.bridge is absent.
  implementation_guidance: Subscribe to EVENT_NAME.REWARDED_STATE_CHANGED, call bridge.advertisement.showRewarded(placement),
    remove the listener in cleanup, and resolve true only for the 'rewarded' state.
    Full implementations for every module are embedded below.
  common_mistakes:
  - Sending game_ready right after initialize() — the splash lifts over an unloaded
    game.
  - Awaiting a dialog-showing authorize() inside boot — the game hangs for every guest.
  - Detecting a guest via player.id/name; they are populated for guests, use player.isGuest.
  - Showing an interstitial in the first seconds of a session or during gameplay.
  - Consuming a purchase before granting it — paid goods are destroyed.
  - Keeping settings in localStorage — it is partitioned inside the platform iframe.
  - Never assume internet connection is permanent — support local offline fallback.
  checklist:
  - Rewarded grants exactly one reward per view, even on a double click.
  - Progress survives a reload as guest and as an authorized player.
  - A corrupted save boots on defaults instead of crashing.
  - Leaderboard score submits and displays correctly.
  - Game auto-pauses on the platform's pause event, including during ads.
  knowledge_refs:
  - playgama/game_ready_and_loading.md
  - playgama/auth_and_player.md
  - playgama/storage_and_cloud.md
  - playgama/ads_integration.md
  - playgama/banners_and_layout.md
  - compliance/yandex_moderation.md
  - ux/localization_system.md
  - ux/touch_controls.md
- skill_id: controls_skill
  name: Mobile Touch & Desktop Controls
  filename: CONTROLS_SKILL.md
  purpose: 'Задаёт обязательный контракт управления: раскладку под жанр, реализацию
    на Pointer Events, отмену браузерных жестов и правила видимости.'
  when_to_use: 'Use when implementing any player input: virtual joystick, action buttons,
    driving pedals, camera gestures, or keyboard bindings.'
  rules:
  - Только Pointer Events + setPointerCapture; учитывать pointerId для каждой кнопки.
  - Движение и основное действие обязаны работать одновременно (мультитач).
  - В играх про вождение газ — отдельная кнопка, а не вертикаль стика руля.
  - 'touch-action: none, отмена contextmenu/dragstart и touchmove с passive:false.'
  - Отступы через env(safe-area-inset-*); основная кнопка >= 96 px, остальные >= 64
    px.
  - Слой управления виден только в игровом процессе и сбрасывается при скрытии.
  - Сброс всех осей и кнопок на blur и visibilitychange.
  - Флаг ?touch=1 принудительно включает мобильную раскладку на десктопе.
  architecture: Отдельный модуль TouchControls создаёт собственный DOM-слой поверх
    UI, пишет в виртуальные оси InputManager и ничего не знает об игровой логике.
    InputManager сливает клавиатуру и тач, отдавая игре единый снимок управления.
  implementation_guidance: 'UIManager владеет экземпляром TouchControls и переключает
    его видимость в showHud/showPause/hideAllModals. Джойстик — плавающий: база появляется
    под пальцем, зона захвата — половина экрана, мёртвая зона 8%.'
  common_mistakes:
  - Один стик на движение и газ — машина теряет ход в каждом повороте.
  - 'touchstart/touchend без pointerId: второй палец сбрасывает первый.'
  - Слой управления оставлен видимым в меню — он перехватывает тапы по кнопкам.
  - Забытый passive:false — страница продолжает скроллиться под игрой.
  - Кнопки прижаты к краю без safe-area — их перекрывает вырез и системный жест.
  checklist:
  - Газ/атака и направление работают одновременно, проверено тремя пальцами.
  - Свайп по игре не скроллит страницу и не вызывает pull-to-refresh.
  - Долгое нажатие не открывает контекстное меню.
  - Управление скрыто в меню и паузе, оси сброшены после сворачивания вкладки.
  - ?touch=1 показывает мобильную раскладку на десктопе и кликается мышью.
