raw_prompt: 'Разработай 3D Tower Defense на Three.js на пляжной локации. Враги (крабы,
  чайки, морские звезды) идут по песку к замку игрока. Игрок кликом возводит песчаные
  башни разных типов: ракушечная пушка (дальний бой), поливалка (замедление) и песчаная
  стена. Реализуй систему поиска пути (A* или Flow Field) в реальном времени при изменении
  расстановки башен.'
title: 'Песочный Бастион 3D: Защита Пляжа'
slug: sandcastle-defense-3d
genre: Tower Defense (Защита башен)
subgenre: Лабиринтный 3D Tower Defense / Real-Time Strategy
renderer: threejs
renderer_reason: User explicitly specified 'threejs'.
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web & Mobile)
orientation: landscape
target_audience: Игроки от 10 до 45 лет, любители казуальных и мидкорных тактических
  стратегий, поклонники классических TD (Kingdom Rush, Bloons, Desktop Tower Defense)
  на ПК и мобильных браузерах.
core_loop: 1. Оценка береговой линии и спавна врагов -> 2. Строительство песчаных
  стен и боевых башен за ракушки -> 3. Запуск волны и динамический поиск пути врагами
  по созданному лабиринту -> 4. Уничтожение крабов, чаек и морских звёзд -> 5. Получение
  золотого песка и мета-прокачка башен между раундами.
hook: Возможность создавать собственный уникальный лабиринт из песчаных замков прямо
  на пляже, заставляя волны крабов и морских звезд плутать под перекрестным огнем
  ракушечных пушек и струй поливалок.
player_fantasy: Вы — великий архитектор песчаных замков и защитник побережья, превращающий
  хрупкий пляжный песок и морские ракушки в непреодолимую высокотехнологичную крепость
  против забавных морских захватчиков.
session_model: Быстрые сессии по 4–8 минут на уровень с возможностью мгновенного продолжения,
  сохранения прогресса в облаке и бесконечного режима выживания.
unique_value_proposition: Сочетание теплой летней пляжной атмосферы, приятной 3D-физики
  песчаных частиц и глубокой тактики лабиринтостроения (mazing) с расчетом Flow Field
  в реальном времени прямо в веб-браузере.
vision: Красочная, сочная и расслабляющая, но в то же время тактически глубокая 3D-стратегия,
  которая загружается за секунду на любом смартфоне или ПК, даря игрокам эстетическое
  удовольствие от брызг воды, рассыпающегося песка и умного перестроения вражеских
  потоков.
elevator_pitch: Постройте несокрушимый песчаный лабиринт на солнечном берегу! Расставляйте
  ракушечные пушки, поливайте наглых крабов из водяных брызгалок и не дайте чайкам
  и морским звездам разрушить ваш песчаный замок в трехмерном Tower Defense с умным
  поиском пути!
win_conditions: Успешно отразить все волны морских обитателей на локации, сохранив
  прочность главного Песчаного Замка выше 0%.
lose_conditions: Прочность главного Песчаного Замка падает до 0% из-за прорвавшихся
  к нему врагов.
progression_summary: Поуровневое открытие новых чертежей (Песчаная катапульта, Коралловый
  шокер), древо талантов за жемчуг (увеличение замедления поливалки, сплэш-урон ракушек,
  прочность стен) и косметические скины для башен.
difficulty_curve: Плавный онбординг на первых 3 волнах (медленные крабы) -> появление
  летающих чаек, игнорирующих стены (требуется расстановка ПВО-ракушек) -> быстрые
  морские звезды и бронированные крабы-отшельники -> босс Морской Кракено-Краб, разрушающий
  стены.
scores:
  fun: 9
  originality: 8
  replayability: 9
  development_cost: 8
  visual_appeal: 9
  mobile_fit: 9
  monetization: 9
  platform_fit: 10
  overall_score: 8.85
  justification: Тематика пляжа и песка выделяется на фоне стандартных фэнтези/сай-фай
    TD. Механика свободного лабиринтостроения (mazing) с Flow Field обеспечивает колоссальную
    реиграбельность при низкой нагрузке на рендеринг благодаря легковесным моделям
    и Three.js.
references:
- name: Desktop Tower Defense
  genre: Grid Mazing Tower Defense
  mechanics:
  - Свободная постройка башен на сетке без фиксированных дорожек
  - Динамический пересчет кратчайшего пути для мобов
  - Разделение на наземных и летающих юнитов
  lessons: Свобода создания лабиринта — самый захватывающий элемент геймплея; важно
    не допускать полного перекрытия пути (блокировки).
  what_to_avoid: Устаревшая визуальная подача и отсутствие визуальной индикации путей.
- name: Kingdom Rush
  genre: Casual 3D/2D Tower Defense
  mechanics:
  - 'Четкая синергия башен: замедление + фокус-урон + блокирование'
  - Яркие сочные звуковые эффекты и тактильный геймфил
  - Звездная система прогрессии уровней
  lessons: У каждой башни должна быть кристально понятная роль и аудиовизуальный отклик.
  what_to_avoid: Фиксированные слоты под башни (в нашей игре игрок строит везде).
- name: Bloons TD 6
  genre: 3D Strategy TD
  mechanics:
  - Разнообразие типов снарядов (пробивающие, замедляющие, взрывные)
  - Особые свойства врагов (быстрые, летающие, делящиеся)
  lessons: Приятные яркие цвета и понятная читаемость поля боя с высоты птичьего полета.
  what_to_avoid: Избыточная визуальная перегрузка эффектами в поздней игре.
mechanics:
- name: Динамическое лабиринтостроение (Mazing Grid)
  category: building
  priority: core
  description: Игрок кликом или тапом по песчаной сетке возводит башни и стены. Сетка
    обновляет проходимость в матрице графа.
  player_interaction: Выбор типа башни в нижнем меню -> клик/тап по ячейке песка на
    поле. Подсвечивается зеленым (разрешено) или красным (запрещено/блокирует путь).
  feedback: Звук осыпающегося песка, частицы песчинок, появление башни с плавной анимацией
    вырастания из земли.
  technical_complexity: Medium
  strengths:
  - Высокая вариативность тактических решений
  - Творческая свобода для игрока
  weaknesses:
  - Необходимость валидации отсутствия полной блокировки спавна
- name: Векторное поле путей (Flow Field & A* Pathfinding)
  category: ai
  priority: core
  description: Расчет карты высот расстояний (Dijkstra/Integration Field) и векторов
    направления (Flow Field) к замку для всех наземных существ при каждом изменении
    сетки.
  player_interaction: 'Косвенное влияние: при постройке стены векторное поле пересчитывается
    мгновенно, и все крабы плавно меняют курс.'
  feedback: Отображение легких полупрозрачных стрелок течения/следов на песке при
    включении тактического режима.
  technical_complexity: High
  strengths:
  - Поддержка сотен юнитов одновременно с нулевым падением производительности
  - Мгновенная реакция толпы на возведение преград
  weaknesses:
  - Требует аккуратной обработки краевых случаев при замуровывании юнита
- name: Ракушечная пушка (Дальний прицельный бой)
  category: combat
  priority: core
  description: Базовая башня из плотно спрессованного песка с ракушечным жерлом. Стреляет
    острыми ракушками по одиночным целям с высоким уроном.
  player_interaction: Постройка за 100 ракушек, выбор приоритета цели (Первый / Сильный
    / Близкий к замку).
  feedback: Хлопок выстрела, полет ракушки по дуге, щелчок попадания и разлетающиеся
    осколки ракушек.
  technical_complexity: Low
  strengths:
  - Эффективна против бронированных крабов и чаек
  - Большой радиус поражения
  weaknesses:
  - Низкая скорострельность, уязвима к толпам мелких врагов
- name: Водная поливалка (AOE Замедление)
  category: combat
  priority: core
  description: Башня с вращающейся детской брызгалкой, подключенной к подземным морским
    водам. Разбрызгивает воду по кругу, размачивая песок и замедляя врагов на 50%.
  player_interaction: Размещение на поворотах лабиринта для создания зон максимального
    поражения.
  feedback: Звук журчания воды, круговой водяной туман, капли воды над замедленными
    крабами и мокрый след на песке.
  technical_complexity: Medium
  strengths:
  - Удерживает врагов в зоне поражения пушек в два раза дольше
  - Накладывает статус 'Намокание'
  weaknesses:
  - Наносит минимальный прямой урон
- name: Песчаная стена (Блокиратор пути)
  category: building
  priority: core
  description: Дешевый блок из утрамбованного песка, служащий для направления потока
    врагов по длинному маршруту.
  player_interaction: Быстрая постройка всего за 20 ракушек для создания коридоров
    'змейки'.
  feedback: Глухой звук трамбовки, анимация формочки для песка.
  technical_complexity: Low
  strengths:
  - Минимальная стоимость, позволяет выстраивать длинные лабиринты
  weaknesses:
  - Не атакует сама по себе
- name: Морские захватчики с уникальным поведением
  category: combat
  priority: core
  description: 'Враги делятся на типы: Крабы (стандартная пехота), Крабы-отшельники
    (тяжелая броня), Морские звезды (при гибели делятся на 2 маленькие), Чайки (летят
    по прямой к замку, игнорируя лабиринт стен).'
  player_interaction: Игрок должен комбинировать ПВО-башни и наземные лабиринты.
  feedback: Забавное перебирание клешнями, крики чаек при пикировании, хлюпанье звезд.
  technical_complexity: Medium
  strengths:
  - Заставляет игрока не полагаться только на один тип обороны
  weaknesses:
  - Требует отдельной логики перемещения для летающих юнитов
gameplay_systems:
- name: Система Сетки и Размещения (Grid & Build System)
  purpose: Управление координатной сеткой пляжа (например, 24x16 клеток), валидация
    установки объектов и управление ресурсами строительства.
  input: Клик мыши / Тап по экрану на координаты мира Three.js с помощью Raycaster.
  rules:
  - Строительство разрешено только в пределах свободных ячеек пляжа.
  - Запрещено строить на точках спавна врагов и на ячейках самого Замка.
  - Запрещено ставить башню/стену, если это полностью блокирует единственный оставшийся
    путь от любого спавна к замку.
  state:
  - 'grid_matrix: Array2D<CellState>'
  - 'selected_tool: ''cannon'' | ''splasher'' | ''wall'' | ''sell'' | ''upgrade'''
  - 'hover_cell: {x: number, y: number} | null'
  interactions: При успешной постройке списывает ракушки, обновляет матрицу препятствий
    и триггерит событие OnGridChanged для Flow Field системы.
  feedback: Зеленый/красный голографический шейдер предпросмотра ячейки, спавн 3D
    модели с сочным эффектом пыли.
  edge_cases:
  - Попытка поставить башню в момент, когда моб стоит на этой клетке (моб плавно выталкивается
    в соседнюю свободную клетку)
  - Клик за пределами активной зоны поля (игнорируется)
- name: Система Поиска Пути Flow Field
  purpose: Обеспечение быстрого и плавного движения сотен мобов по лабиринту без индивидуальных
    тяжелых расчетов A* для каждого юнита.
  input: Событие OnGridChanged или удаление башни.
  rules:
  - Целевая ячейка — Песчаный Замок (стоимость 0).
  - Волновой алгоритм Дейкстры рассчитывает матрицу расстояний от всех ячеек к замку.
  - Для каждой ячейки вычисляется 2D-вектор градиента наискорейшего спуска.
  - Наземные мобы считывают вектор своей текущей клетки и двигаются вдоль него.
  state:
  - 'cost_field: Uint16Array'
  - 'flow_vectors: Float32Array (x, z)'
  - 'is_path_valid: boolean'
  interactions: Враги запрашивают текущий вектор смещения из буфера Float32Array в
    методе update().
  feedback: Синхронное красивое перестроение всей колонны крабов в реальном времени.
  edge_cases:
  - Если путь перекрыт — откатить постройку башни и вернуть деньги игроку с показом
    всплывающего предупреждения 'Путь заблокирован!'.
- name: Система Снарядов и Боевых Взаимодействий
  purpose: Поиск целей башнями, баллистический расчет траекторий и регистрация урона/эффектов
    замедления.
  input: Тик игрового цикла delta_time.
  rules:
  - Башни сканируют врагов в радиусе range с интервалом fire_rate.
  - Ракушечные снаряды летят с физическим упреждением к позиции цели.
  - Поливалка испускает круговой конус брызг, накладывая SlowEffect на 3 секунды.
  state:
  - 'active_projectiles: Array<ProjectileData>'
  - 'active_status_effects: Map<EnemyId, StatusEffect>'
  interactions: При попадании снаряда уменьшает HP врага; при HP <= 0 враг уничтожается,
    спавнятся наградные ракушки в общий счетчик игрока.
  feedback: Всплывающие цифры урона, партиклы брызг и осколков, мигание модели врага
    белым цветом (hit flash).
  edge_cases:
  - Цель погибает до прилета снаряда (снаряд падает на песок и оставляет след).
- name: Система Волн и Экономики Побережья
  purpose: Генерация сбалансированных волн противников и начисление внутриигровых
    ресурсов (Ракушки для раунда, Жемчуг для меты).
  input: Таймер межволнового периода или ручной клик игрока 'Начать волну'.
  rules:
  - 'Каждая волна имеет состав: тип врага, интервал спавна, множитель здоровья.'
  - За досрочный запуск волны игрок получает бонусные +25 ракушек.
  - За каждого убитого врага начисляются ракушки в зависимости от его типа.
  state:
  - 'current_wave: number'
  - 'total_waves: number'
  - 'wave_in_progress: boolean'
  - 'sand_shells: number'
  - 'pearls: number'
  interactions: Передает данные в UI HUD для обновления счетчиков и полосы прогресса
    волны.
  feedback: 'Звуковой горн старта волны, всплывающий баннер ''Волна 5: Нашествие Чаек!'''
  edge_cases:
  - Все мобы убиты до окончания таймера спавна (волна корректно завершается победой).
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.170.0
  physics_engine: Rapier3D (@dimforge/rapier3d-compat 0.13.x)
  state_manager: Reactive EventBus / NanoStores
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 45
  max_triangles_or_sprites: 35000
  bundle_size_budget_mb: 3.2
  layers:
  - name: Core & Event Engine
    responsibility: 'Главный игровой цикл, EventBus, управление временем (TimeScale:
      1x, 2x, pause)'
  - name: Grid & FlowField Subsystem
    responsibility: Дискретная сетка 24x16, расчет FlowField, валидация путей, пространственный
      хэш юнитов
  - name: Three.js Rendering Layer
    responsibility: Сцена, освещение, InstancedMesh для песка/башен/снарядов, кастомные
      шейдеры воды и песка
  - name: Entity Component System (Entities)
    responsibility: Башни, Враги, Снаряды, Замок, VFX Партиклы
  - name: Platform & Bridge SDK Layer
    responsibility: Интеграция @playgama/bridge, сохранение в облако, баннеры, interstitial
      и rewarded реклама
  - name: UI / HUD Overlay (HTML5 Canvas & CSS3)
    responsibility: Адаптивный интерфейс строительства, панель улучшений, экраны победы/поражения
  modules:
  - name: GridManager
    file: src/game/grid/GridManager.ts
    description: Хранение состояния клеток, рейкастинг кликов мыши в ячейки, валидация
      размещения.
  - name: FlowFieldSolver
    file: src/game/ai/FlowFieldSolver.ts
    description: Быстрый расчет волны Дейкстры и матрицы направлений движения на Uint8Array/Float32Array.
  - name: TowerSystem
    file: src/game/towers/TowerSystem.ts
    description: Логика поиска целей, стрельбы, типов атак (Пушка, Поливалка, Стена)
      и улучшений.
  - name: EnemySpawner
    file: src/game/enemies/EnemySpawner.ts
    description: Инстансирование и пул объектов врагов (крабы, чайки, морские звезды),
      расчет движения по FlowField.
  - name: BridgeManager
    file: src/game/platform/BridgeManager.ts
    description: 'Связь с Playgama Bridge: инициализация, показ рекламы, сохранение
      рекордов в Leaderboards.'
monetization:
  strategy_summary: Мягкая гибридная модель (Rewarded Video + Interstitial с умным
    кулдауном + опциональные IAP/Ян-валюта), не ломающая игровой баланс и стимулирующая
    игрока наградами за просмотр.
  rewarded_placements:
  - id: revive_castle
    name: 'Второй Шанс: Восстановление Замка'
    benefit: Мгновенно восстанавливает 50% прочности песчаного замка при критическом
      поражении и смывает волной текущих врагов на экране.
    cooldown_or_limit: 1 раз за матч
    trigger_moment: Экран критического урона или поражения замка.
  - id: double_shells
    name: Двойной улов ракушек
    benefit: Удваивает количество полученного за пройденный уровень Жемчуга и Ракушек.
    cooldown_or_limit: После каждого успешного уровня
    trigger_moment: Экран победы (Victory Screen).
  - id: instant_boost_tsunami
    name: Приливный Смыв (Цунами)
    benefit: 'Супер-способность: призывает мощную морскую волну, смывающую 100% слабых
      мобов и наносящую 500 урона боссам.'
    cooldown_or_limit: 1 раз за 3 волны
    trigger_moment: Кнопка паники в боевом HUD во время сложной волны.
  interstitial_placements:
  - trigger_event: Завершение уровня (Победа или окончательное Поражение)
    cooldown_seconds: 90
    conditions: Не показывается, если игрок только что посмотрел Rewarded Video; не
      чаще одного раза в 90 секунд.
  - trigger_event: Возврат в главное меню после 3+ сыгранных волн
    cooldown_seconds: 120
    conditions: Показывается только между спокойными состояниями меню.
