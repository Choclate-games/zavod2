  - Реализация FlowField алгоритма поиска пути и Raycaster кликов по клеткам
  - Базовые кубические прототипы башен и спавн тестовых мобов
  milestone_deliverable: 'Рабочий прототип: кликом ставятся блоки, мобы обходят препятствия
    в реальном времени и идут к замку.'
- phase_number: 2
  title: Боевая система и Типы Башен/Врагов
  duration_days: 3
  tasks:
  - 'Имплементация логики: Ракушечная Пушка (урон), Поливалка (slow AOE), Песчаная
    стена'
  - 'Создание врагов: Краб (наземный), Чайка (воздух), Морская звезда (сплит при смерти)'
  - Система волн, баланс HP/Урона и экономика ракушек
