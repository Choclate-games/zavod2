playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - gamepix
  - crazygames
  - standalone_web
  - mobile_browsers
  initialization_flow:
  - 1. Инициализация Bridge.init() при старте HTML страницы
  - 2. Проверка доступности платформы и получение языка интерфейса (Bridge.platform.language)
  - 3. Загрузка сохранений игрока через Bridge.storage.get()
  - 4. Вызов Bridge.advertisement.showBanner() для десктопных платформ
  - 5. Сигнал Bridge.game.ready() после загрузки Three.js ассетов
  cloud_save_keys:
  - sand_castle_progress_v1
  - unlocked_towers
  - pearl_currency
  - tower_upgrades_tree
  - audio_and_fx_settings
  leaderboards:
  - high_wave_endless_beach
  - total_stars_campaign
  ads_integration:
    banner_supported: true
    rewarded_auto_resume_audio: true
    interstitial_interval_check: true
  lifecycle_hooks:
  - Bridge.game.on('pause', () => Game.pauseEngine())
  - Bridge.game.on('resume', () => Game.resumeEngine())
  - Bridge.advertisement.on('rewarded_opened', () => AudioManager.muteAll())
  - Bridge.advertisement.on('rewarded_closed', () => AudioManager.unmuteAll())
