  selected_id: D1
  selected_name: 'Метро-Балансир: Час Пик'
  selection_reason: 'Направление D1 («Метро-Балансир: Час Пик») наиболее точно и бескомпромиссно
    реализует исходный запрос пользователя на 3D физическую аркаду с честным крутящим
    моментом и центробежными силами. Для мобильных устройств и веб-браузеров оно обладает
    абсолютными преимуществами: нулевой порог входа (игрок мгновенно считывает наклон
    башни и интуитивно двигает палец/мышь для компенсации за 0.5 секунды без туториала),
    идеальная сессионная структура (перегон 45–60 секунд органично ложится в паузы
    между рекламными показами на платформах вроде Яндекс Игр), и максимальная производительность
    (камера от 3-го лица охватывает один вагон метро, что позволяет уложить всю сцену
    в 1 draw call для окружения и 1 инстанс для предметов). Физика обратного маятника
    в Rapier3D создает потрясающий кинетический сок (juice) и неподдельный азарт при
    спасении шатающейся стопки на виражах.'
  rejected_reasons:
  - 'D2 («Багажный Экспресс: Погрузка на Ходу») отвергнут, так как смещение фокуса
    на сброс и ловлю падающих предметов превращает игру в вариацию вертикального тетриса/Tower
    Bloxx. При росте башни камера отдаляется от вагона метро, из-за чего теряется
    атмосфера поезда, ощущение перегрузок и крутящего момента, а предметы на мобильных
    экранах становятся неразличимо мелкими.'
  - 'D3 («Ритм-Метро: Экспресс-Шоу») отвергнут из-за чрезмерной зависимости от звукового
    тайминга и высоких рисков рассинхронизации Web Audio с физическим движком на мобильных
    браузерах. Ракурс от первого лица скрывает изгиб и кинетическую красоту качающейся
    башни, а необходимость следить за ритмическими метками отвлекает от чистой физики
    балансирования.'
  what_it_is_not:
  - Волны врагов, зомби или нападающие пассажиры
  - Выбор из трех случайных карточек апгрейдов
  - Универсальная боевка с дэшем, парированием и ударами
  - Абстрактный 2D-балансир с палочкой на тележке
  - Автоматическая привязка предметов к ровной сетке (Grid Snap) как в Тетрисе
  - Виртуальный экранный джойстик со статичными кнопками
  - Серые примитивные кубы без выразительных материалов и стилизации
  - Оторванная от темы мета-прокачка с покупкой абстрактных статов за золото
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - Честная 3D-симуляция составного обратного маятника на базе Rapier3D с расчетом
    крутящего момента, центра масс и трения между разнородными объектами стопки
  - Прямая физическая связь центробежных и продольных сил инерции с геометрией и ускорением
    поезда в туннеле метро
  - 'Мгновенный отклик управления без инерционной задержки ввода: перемещение пальца
    по экрану или мыши напрямую смещает точку опоры персонажа'
  - Разнородность предметов в стопке по геометрии, массе и положению центра тяжести
    (от плоских легких коробок до тяжелых массивных телевизоров и шатких ваз)
  - Физическая форма сессии — законченный перегон между двумя станциями с фазами разгона,
    виражей и торможения перед платформой
  signature_scene: 'Кадр из глубины залитого теплым янтарным светом вагона метро:
    в центре композиции курьер в горчичной куртке на полусогнутых ногах удерживает
    изогнутую дугой трехметровую стопку из винтажного пузатого телевизора, хрустального
    аквариума с плещущейся золотой рыбкой и стопки коробок с пиццей. Вагон резко закладывает
    левый вираж, верхняя коробка касается поручня на потолке, а за темным стеклом
    дверей снопом вспыхивают неоново-синие электрические искры контактного рельса,
    прорезая полумрак туннеля.'
  avoid_references:
  - Tricky Towers
  - Tower Bloxx
  - Subway Surfers
  - QWOP
  - Jenga 3D
  - Ragdoll Runners
  - Totally Reliable Delivery Service
