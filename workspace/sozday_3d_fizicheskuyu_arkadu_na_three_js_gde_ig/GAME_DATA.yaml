preview_status: completed
definition_of_done:
- Three.js сцена ретро-вагона метро загружается за < 1.5 секунды и укладывается в
  35 Draw Calls
- Физика Rapier3D честно рассчитывает центр тяжести и опрокидывающий момент составной
  стопки предметов
- Управление смещением опоры мышью и тачем реагирует с нулевой задержкой ввода (0
  ms input lag)
- 'Реализованы все 4 фазы перегона: разгон, виражи со стрелками, экстренное торможение
  и остановка'
- Внедрены механики амортизирующего приседа и аварийного захвата рукой с кулдауном
- 'Интегрирован Playgama Bridge SDK: работают Rewarded Ads (Revive / x2), межстраничная
  реклама и облачные сохранения'
- Протестировано на мобильных браузерах (Safari iOS, Chrome Android) со стабильными
  60 FPS
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Принять заказ курьера -> Сформировать шаткую стопку разнородных
  предметов в вагоне -> Удерживать равновесие составного маятника (смещением точки
  опоры, приседами и наклонами корпуса) во время разгона, стрелочных виражей и торможения
  поезда -> Довезти груз целым до платформы следующей станции -> Получить чаевые,
  открыть новые нестандартные предметы и ветки метро с более экстремальными перегонами..'
- 'Реализованы механики проекта: Инерционная компенсация опоры (Base Sway Compensation),
  Амортизирующий присед (Micro-Crouch Drop), Продольный контр-наклон корпуса (Pitch
  Counter-Lean), Аварийный захват рукой (Emergency Grip Catch).'
- Условие успеха (Успешно доехать до станции назначения (таймер перегона 45–60 с)
  и полностью остановить вагон, сохранив вертикальную устойчивость стопки предметов
  так, чтобы ни один хрупкий предмет не упал на пол вагона (сохранено минимум 70%
  исходной стопки).) и условие проигрыша (Падение критического хрупкого предмета (аквариума/телевизора)
  на пол вагона ИЛИ превышение угла наклона башни свыше 38 градусов с разрушением
  более 50% объема груза до полной остановки поезда.) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Метро-Балансир: Час Пик».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Аварийная страховка груза (Revive),
  VIP Чаевые от заказчика (2x Reward)); interstitial соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
