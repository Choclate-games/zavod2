  tension_curve: 'Кривая напряжения перегона (45–60 с): 1) Старт (0–5 с, Напряжение
    35%): Плавный разгон, калибровка веса стопки, игрок осваивается с центром тяжести
    заказа. 2) Разгон в туннеле (5–12 с, Напряжение 55%): Набор скорости 75 км/ч,
    продольная инерция назад требует наклона вперед. 3) Скоростная змейка (12–25 с,
    Напряжение 75%): Серия из двух крутых виражей с искрами за окном, раскачка воды
    в аквариуме, активная работа стопами. 4) Стрелочный перекресток (25–38 с, Пик
    1, Напряжение 90%): Резкий удар крестовины рельсов и внезапная смена знака центробежной
    силы, необходимость приседа в окно 0.18 с. 5) Затишье перед станцией (38–42 с,
    Спад до 60%): Прямой участок туннеля, возможность восстановить вертикаль и перезарядить
    хват. 6) Экстренное пневматическое торможение (42–54 с, КУЛЬМИНАЦИЯ 100%): Визг
    колодок, перегрузка -3.6 м/с² вперед, наклон назад на пределе 32°, использование
    аварийного хвата. 7) Остановка и открытие дверей (54–60 с, Катарсис и спад до
    0%): Тормозной пшик, аплодисменты пассажиров, звон падающих монет чаевых.'
  core_formulas:
  - 'Суммарный опрокидывающий крутящий момент составного многоярусного маятника: M_tilt(t)
    = \sum_{i=1}^{N} m_i \cdot [ (g \cdot \sin(\theta_i(t)) + a_{train,lat}(t) \cdot
    \cos(\theta_i(t))) \cdot h_i + F_{slosh,i}(t) \cdot h_i ] (Н·м), где N - число
    ярусов (от 3 до 7), h_i - текущая высота i-го предмета над полом вагона.'
  - 'Динамическое условие опрокидывания яруса (полигон устойчивости): |x_{cm}(t) -
    x_{base}(t)| > \frac{W_{contact}}{2} \implies \text{опрокидывание при крене }
    \theta > \theta_{crit} = \arctan\left(\frac{W_{contact}}{2 \cdot H_{tier}}\right)
    \approx 28.5^\circ..36.0^\circ.'
  - 'Нормальная сила прижима и трение при амортизирующем приседе: F_N(t) = m_{total}
    \cdot \left(g + \frac{d^2 z_{crouch}}{dt^2}\right); \; F_{friction,max} = \mu_{contact}
    \cdot F_N(t). При идеальном приседе вниз F_N кратковременно возрастает в 1.6 раза,
    блокируя горизонтальный сдвиг ярусов.'
  - 'Гидродинамическая инерция плещущейся жидкости в аквариуме: F_{slosh}(t) = m_{water}
    \cdot a_{train,lat}(t - \tau_{slosh}) \cdot \left(1 + 0.35 \cdot \sin(\omega_{wave}
    \cdot t)\right), где \tau_{slosh} = 0.25 \text{ с} - фазовая задержка волны, \omega_{wave}
    = 8.4 \text{ рад/с} - собственная частота.'
  - 'Итоговый расчет рейтинга и чаевых на станции: Score = \left[ \sum_{i=1}^{N} \left(V_i
    \cdot \left(1 - \frac{D_i}{100}\right)\right) \right] \cdot B_{balance} \cdot
    B_{speed}, где B_{balance} = 1.0 + 0.5 \cdot \max\left(0, 1 - \frac{\theta_{avg}}{15^\circ}\right),
    \; B_{speed} = \frac{T_{target}}{T_{actual}}.'
  run_progression:
  - 'Накопление потокового фокуса курьера (Flow Focus Meter): удержание наклона стопки
    в пределах идеальной зеленой зоны (< 8°) непрерывно накапливает шкалу фокуса;
    каждые 5 с чистого баланса ускоряют перезарядку ''Аварийного хвата'' на +25% и
    расширяют зону устойчивости стоп на +5%.'
  - 'Прогрессивная деформация и усталость мягких упаковок: коробки с пиццей под весом
    верхних ярусов теряют по 0.6% структурной жесткости за каждую секунду перегрузки,
    увеличивая податливость башни на изгиб к 40-й секунде перегона на 24%.'
  - 'Нарастание фазовой раскачки жидкости: каждый последующий вираж туннеля добавляет
    +10% к амплитуде стоячей волны в аквариуме, превращая верхний ярус в агрессивный
    маховик к концу перегона.'
  - 'Множитель безупречной доставки (Pristine Delivery Combo): отсутствие срабатываний
    аварийного хвата и удержание груза без падений поднимает множитель финальных чаевых
    с х1.0 до х3.0 к моменту открытия дверей.'
  meta_progression:
  - 'Разветвленная карта линий метро: Линия 1 ''Кольцевая'' (широкие виражи, поезда
    60 км/ч, базовые грузы) -> Линия 2 ''Глубокая радиальная'' (уклоны 40‰, стрелочные
    переводы, поезда 85 км/ч) -> Линия 3 ''Ночной экспресс'' (перегоны 110 км/ч, знакопеременные
    S-виражи с перегрузкой 1.8G).'
  - 'Обувь курьера (Сцепление и скорость подошв): Кеды с рифленым протектором ''Vibro-Tread''
    (+25% к скорости бокового смещения стоп курьера), Магнитные бутсы ''Mag-Grip''
    (+40% к предельному удерживающему моменту у стенки вагона).'
  - 'Перчатки и экипировка хвата: Кевларовые перчатки курьера (+0.5 с к длительности
    ''Аварийного хвата'', -2.0 с к базовому кулдауну), Стабилизирующий ортопедический
    пояс (-20% к паразитным колебаниям корпуса при смене направления).'
  - 'Контракты на капризные негабаритные грузы: открытие доступа к нестандартным заказам
    с уникальной физикой (Пирамида хрустальных фужеров с трением \mu=0.18, Двухметровый
    кактус с высоким центром масс, Кинескопный телевизор с эксцентриковой массой 28
    кг).'
  mechanics:
  - name: Инерционная компенсация опоры (Base Sway Compensation)
    role_in_loop: 'Двигатель и базовый стабилизатор микро-петли: непрерывное возвращение
      точки опоры под динамический центр масс.'
    player_decision: Куда и с какой скоростью смещать стопы курьера по ширине пола
      вагона (1.8 м доступного коридора), чтобы парировать центробежную силу без срыва
      трения между ярусами груза.
    input_mapping: Горизонтальный drag/свайп пальцем по экрану (Portrait touch) или
      движение мыши / клавиши A/D на клавиатуре.
    states:
    - idle_centered (стопы по центру вагона, крен < 3°)
    - sway_tracking (активное смещение подошв вслед за креном со скоростью до 2.4
      м/с)
    - edge_clamped (стопы уперлись в боковую стенку вагона на отметке ±0.9 м, компенсация
      заблокирована)
    - slip_recovery (выход из заноса при резкой смене знака ускорения поезда)
    parameters:
    - name: Максимальная скорость перемещения стоп курьера
      value: 2.4 м/с
      tuning_note: При >3.5 м/с игра превращается в аркадный пинпонг без ощущения
        веса; при <1.5 м/с курьер физически не успевает подбежать под башню на крутых
        виражах.
    - name: Ширина доступного коридора пола вагона
      value: 1.8 м
      tuning_note: При >2.5 м теряется клаустрофобия вагона метро; при <1.2 м игрок
        мгновенно упирается в стенки при минимальном крене.
    - name: Коэффициент трения покоя между коробками груза
      value: '0.42'
      tuning_note: При >0.70 груз ведет себя как монолитный столб; при <0.25 ярусы
        соскальзывают горизонтально при малейшем толчке до возникновения наклона.
    - name: Мертвая зона центрирования ввода
      value: 0.05 м
      tuning_note: При 0 возникают микро-рывки от естественного дрожания пальца на
        тачскрине; при >0.15 управление кажется ватным и неотзывчивым.
    feedback_layers:
    - 'Визуал / VFX: Подошвы курьера чертят резиновые следы по рифленому полу вагона;
      искры скольжения коробок при опасных углах; динамический лазерный маркер проекции
      центра масс на полу (зеленый -> желтый -> пульсирующий красный).'
    - 'Звук (Web Audio): Скрип резины обуви по металлу пола (динамический питч 180–450
      Гц в зависимости от скорости смещения); скрежет картона и звон стекла при наклоне
      ярусов.'
    - 'Камера: Плавный позиционный лаг камеры на 0.08 с с динамическим креном горизонта
      (до 6°) в сторону центробежного ускорения поезда.'
    - 'UI / Тактильность: Тактильный отклик (Haptic pulse 25 мс) при приближении к
      границе вагона (±0.85 м); дуговая шкала крена над головой курьера с цветовой
      маркировкой зон опасности.'
    failure_mode: 'Игрок совершает избыточно резкий рывок в сторону крена: стопы мгновенно
      уходят под центр масс, но из-за силы инерции покоя верхний ярус срывается со
      стопки в противоположную сторону (эффект сдергивания скатерти). Сигнал: резкий
      скрежет скольжения и красный всплеск вектора сдвига.'
    mastery_curve: Новичок на 30-й секунде судорожно дергает пальцем от стенки к стенке,
      создавая автоколебания и раскачивая башню. Эксперт на 10-м забеге совершает
      плавный упреждающий микродрейф за 0.3 с до начала виража по световым маркерам
      туннеля, удерживая отклонение башни в пределах 4°.
    counterplay: Игра генерирует S-образные стрелочные переводы, где центробежная
      сила меняет знак с +1.4G на -1.4G за 0.4 секунды, заставляя игрока мгновенно
      менять вектор смещения опоры.
    synergies:
    - Амортизирующий присед (Micro-Crouch Drop) временно увеличивает силу сцепления
      коробок во время смещения
    - Продольный контр-наклон (Pitch Counter-Lean) удерживает башню в ортогональной
      плоскости при одновременном торможении и повороте
    why_unique: Вместо управления наклоном абстрактной платформы игрок управляет кинематической
      точкой опоры живого персонажа внутри ограниченного пространства вагона с учетом
      трения скольжения между каждым отдельным ярусом.
    pseudocode: "function TickBaseSway(inputX, trainLatAcc, dt):\n  let targetFootX\
      \ = clamp(inputX * HALF_CAR_WIDTH, -0.9, 0.9)\n  footPosition.x = moveTowards(footPosition.x,\
      \ targetFootX, MAX_FOOT_SPEED * dt)\n  let totalInertiaForce = stackMass * trainLatAcc\n\
      \  let restoringTorque = stackMass * GRAVITY * (footPosition.x - centerOfMass.x)\n\
      \  let netTorque = restoringTorque + totalInertiaForce * centerOfMass.y\n  stackAngularVelocity\
      \ += (netTorque / stackMomentOfInertia) * dt\n  stackAngle += stackAngularVelocity\
      \ * dt\n  CheckTierFrictionSlip(stackAngle, trainLatAcc)\n  EmitHapticAndAudioFeedback(stackAngle,\
      \ footPosition.x)"
  - name: Амортизирующий присед (Micro-Crouch Drop)
    role_in_loop: 'Тактический амортизатор и модификатор нормальной силы: гашение
      резонанса на стыках и занижение центра масс.'
    player_decision: В какой момент прожать свайп вниз для поглощения вертикального
      удара от стрелочного перевода и насколько глубоко удерживать присед ценой замедления
      шагов курьера.
    input_mapping: Вертикальный свайп вниз / удержание свайпа вниз (Portrait touch)
      или клавиша S / Стрелка вниз.
    states:
    - standing_upright (базовая стойка, высота курьера 1.8 м, 100% скорость перемещения)
    - crouch_transition (фаза сгибания коленей, длительность 0.18 с, перегрузка вниз)
    - deep_crouch (удержание приседа, высота 1.2 м, нормальная сила +40%, скорость
      шагов снижена на 55%)
    - spring_recovery (разгибание коленей с отдачей импульса вверх, длительность 0.22
      с)
    parameters:
    - name: Глубина амортизирующего приседа
      value: 0.40 м
      tuning_note: При >0.6 м курьер визуально садится на пол и теряет баланс; при
        <0.2 м снижение центра масс неощутимо для физики башни.
    - name: Окно идеального тайминга амортизации
      value: 0.18 с
      tuning_note: При >0.35 с механика становится тривиальной однокнопочной затычкой;
        при <0.08 с попадание на мобильном экране становится случайным.
    - name: Бонус к нормальной силе прижима F_N
      value: 1.6x от веса
      tuning_note: При >2.5x стопка склеивается как монолит и физика замерзает; при
        <1.2x коробки подлетают на каждом стыке рельсов.
    - name: Штраф к скорости перемещения стоп в приседе
      value: 55%
      tuning_note: При 0% игрок будет непрерывно сидеть в приседе; при >80% присед
        становится ловушкой смерти на виражах.
    feedback_layers:
    - 'Визуал / VFX: Сжатие пружинящего силуэта курьера; появление кратковременного
      золотистого ореола компрессии под стопами при точном тайминге (Perfect Dampen);
      видимая деформация/проминание нижних коробок пиццы.'
    - 'Звук (Web Audio): Глухой низкочастотный ''thump'' (65 Гц) амортизации суставов
      вместо металлического лязга удара колес; упругий вздох сжатия воздуха.'
    - 'Камера: Быстрый импульсный микродаун-зум (fov 60 -> 57 на 0.12 с) с последующим
      упругим возвратом.'
    - 'UI / Тактильность: Тяжелый сдвоенный виброотклик (Heavy haptic tap 45 мс) в
      момент удара колес о стрелочную крестовину.'
    failure_mode: 'Игрок нажимает присед слишком рано или удерживает его непрерывно:
      курьер теряет подвижность ног (штраф 55% к скорости) и не успевает компенсировать
      внезапно начавшийся боковой вираж поезда. Сигнал: иконка ''Забитые колени''
      и залипание ног.'
    mastery_curve: Новичок жмет присед наугад после того, как коробки уже подлетели
      в воздух. Эксперт считывает стыки по ритмичному звуку перестука колес 'тук-тук...
      тук-тук' и жмет присед за 0.05 с до крестовины, получая 100% гашение вертикального
      импульса и статус 'Perfect Shock Absorption'.
    counterplay: Стрелочные переводы, расположенные прямо внутри крутого виража, заставляющие
      игрока филигранно балансировать между необходимостью сидеть (для прижима) и
      бежать (для компенсации крена).
    synergies:
    - Инерционная компенсация опоры (Base Sway Compensation) требует быстрой смены
      стойки
    - Гидродинамический демпфер аквариума гасит стоячую волну при резком прижиме
    why_unique: Присед здесь — не анимационное уклонение от препятствий (как в раннерах),
      а физический инструмент управления высотой центра масс многозвенной системы
      и динамической силой нормальной реакции опоры.
    pseudocode: "function TickCrouchDrop(isCrouchInput, railBumpImpulse, dt):\n  if\
      \ isCrouchInput and crouchState == STANDING:\n    crouchState = CROUCHING\n\
      \    crouchHeight = lerp(crouchHeight, MIN_CROUCH_HEIGHT, CROUCH_SPEED * dt)\n\
      \  if railBumpImpulse > 0:\n    let timingError = abs(railBumpTime - inputTimestamp)\n\
      \    if isCrouchInput and timingError < PERFECT_WINDOW:\n      let absorbedForce\
      \ = railBumpImpulse * ABSORPTION_EFFICIENCY\n      ApplyVerticalDampingToStack(absorbedForce)\n\
      \      TriggerPerfectDampenJuice()\n    else:\n      ApplyVerticalImpulseToStack(railBumpImpulse)\n\
      \  UpdateCharacterCenterOfMass(crouchHeight)"
  - name: Продольный контр-наклон корпуса (Pitch Counter-Lean)
    role_in_loop: 'Модификатор продольного баланса: парирование ускорения разгона
      и сокрушительного пневматического торможения поезда.'
    player_decision: На какой угол наклонить туловище курьера вперед или назад, чтобы
      компенсировать продольную перегрузку тяги/тормоза поезда без потери обзора верхней
      части башни.
    input_mapping: Вертикальный наклон гироскопа смартфона (tilt) ИЛИ вертикальный
      drag в верхней половине экрана ИЛИ клавиши W/S на клавиатуре.
    states:
    - neutral_pitch (вертикальное положение корпуса 0°)
    - lean_forward (наклон вперед до 28° для парирования разгона 0–10 с)
    - lean_backward (наклон назад до 32° для парирования торможения 38–52 с)
    - overextended_lock (критический наклон >35°, курьер теряет устойчивость стоп)
    parameters:
    - name: Максимальный угол наклона корпуса курьера
      value: 32 градуса
      tuning_note: При >45° персонаж выглядит неестественно падающим; при <15° не
        хватает физического плеча силы для удержания тяжелого сейфа при торможении.
    - name: Инерционная перегрузка торможения поезда a_brake
      value: -3.6 м/с²
      tuning_note: При >-5.0 м/с² башня гарантированно срывается вперед без шансов
        на удержание; при <-2.0 м/с² фаза торможения не создает кульминационного напряжения.
    - name: Скорость отклика наклона корпуса
      value: 110 град/с
      tuning_note: При >200 град/с наклон кажется невесомым; при <50 град/с игрок
        не успевает среагировать на экстренное торможение.
    - name: Смещение точки подвеса груза по оси Z
      value: 0.35 м
      tuning_note: При >0.6 м руки курьера визуально отрываются от груди; при <0.15
        м продольный рычаг компенсации слишком слаб.
    feedback_layers:
    - 'Визуал / VFX: Напряжение мускулатуры курьера, пар от дыхания; продольный наклон
      башни коробок с деформацией граней; сноп оранжевых искр от тормозных колодок
      за окном вагона.'
    - 'Звук (Web Audio): Оглушительный визг пневматических тормозов (гармоники 2.8
      кГц и 4.1 кГц); нарастающий гул тяговых электромоторов при разгоне.'
    - 'Камера: Динамическое изменение тангажа камеры (Pitch tilt ±5°) с приближением
      к лицу курьера в момент пиковой перегрузки торможения.'
    - 'UI / Тактильность: Нарастающая высокочастотная вибрация (Vibration sweep 40–120
      Гц) пропорционально силе замедления состава.'
    failure_mode: 'Игрок не отклоняет корпус назад при включении экстренного тормоза:
      башня под действием инерции разгоняется вперед, проскальзывает по рукам курьера
      и сокрушительно врезается в торцевую стену вагона. Сигнал: оглушительный грохот
      падения и индикатор ''Lethal Forward Inertia''.'
    mastery_curve: Новичок реагирует на торможение только когда поезд уже остановился
      на 50%, роняя груз вперед. Эксперт замечает смену огней сигнального семафора
      платформы за 1.5 с до торможения и заранее плавно закладывает корпус назад на
      25°, встречая перегрузку в идеальном упоре.
    counterplay: Комбинированное торможение на криволинейном участке пути, создающее
      вектор перегрузки под углом 45° (одновременно боковой крен влево и продольный
      рывок вперед).
    synergies:
    - Инерционная компенсация опоры (Base Sway Compensation) работает одновременно
      в поперечной плоскости
    - Аварийный захват рукой (Emergency Grip Catch) спасает верхний ярус при срыве
      продольного баланса
    why_unique: Превращает плоский 2D-балансир в полноценную 3D-задачу удержания пространственного
      маятника при сложном переменном векторе ускорения поезда (разгон, вираж, торможение).
    pseudocode: "function TickPitchLean(inputPitch, trainLongAcc, dt):\n  let targetPitchAngle\
      \ = clamp(inputPitch * MAX_PITCH_DEG, -32.0, 28.0)\n  currentPitch = moveTowards(currentPitch,\
      \ targetPitchAngle, PITCH_SPEED * dt)\n  let forwardInertiaMoment = stackMass\
      \ * trainLongAcc * centerOfMass.y\n  let playerRestoringPitchMoment = stackMass\
      \ * GRAVITY * sin(radians(currentPitch)) * LEVER_ARM\n  let netPitchTorque =\
      \ playerRestoringPitchMoment - forwardInertiaMoment\n  pitchAngularVelocity\
      \ += (netPitchTorque / stackPitchInertia) * dt\n  stackPitchAngle += pitchAngularVelocity\
      \ * dt\n  CheckZAxisSlipAndCollapse(stackPitchAngle)"
  - name: Аварийный захват рукой (Emergency Grip Catch)
    role_in_loop: 'Тактический ресурс спасения и аварийный тормоз: мгновенная фиксация
      критического яруса ценой блокировки перемещения.'
    player_decision: Потратить ли единственный 1.2-секундный заряд захвата прямо сейчас
      для предотвращения падения хрустального аквариума на вираже или сохранить его
      на финальное экстренное торможение поезда.
    input_mapping: Тап по виртуальной кнопке 'ХВАТ' в углу экрана (или двойной быстрый
      тап в верхней половине экрана) / Пробел (Spacebar) на клавиатуре.
    states:
    - ready (заряд готов, иконка руки горит неоновым синим)
    - grabbing (активная фиксация поручня/яруса, длительность 1.2 с, ноги заблокированы)
    - cooldown (перезарядка 8.0 с, шкала заполняется по мере стабильного балансирования)
    parameters:
    - name: Длительность удержания хвата
      value: 1.2 секунды
      tuning_note: При >2.5 с механика превращается в чит, нивелирующий всю физику
        виража; при <0.6 с игрок не успевает погасить кинетическую энергию соскальзывающего
        яруса.
    - name: Базовое время перезарядки (Cooldown)
      value: 8.0 секунд
      tuning_note: При <4.0 с хват жмут по кд на каждом повороте; при >15.0 с игрок
        боится использовать его вовсе.
    - name: Максимальный удерживаемый критический угол яруса
      value: 36 градусов
      tuning_note: При >50° захват выглядит нереалистичной телекинетической магией;
        при <25° захват бесполезен, так как угол еще не критический.
    - name: Бонус к ускорению кулдауна за чистый баланс
      value: +50% к скорости зарядки
      tuning_note: При 0% нет награды за мастерство; при >100% эксперты получают хват
        каждые 3 секунды.
    feedback_layers:
    - 'Визуал / VFX: Рука курьера в кевларовой перчатке выбрасывается вверх к потолочному
      поручню; силовой луч кинематической связи; частицы пыли, сбитые с поручня.'
    - 'Звук (Web Audio): Металлический звонкий лязг защелкивания карабина/хвата (двойной
      щелчок 1.2 кГц); глухой стон гашения инерции.'
    - 'Камера: Мгновенный стоп-кадр на 0.04 с (Micro hitstop) с последующим динамическим
      зумом на точку хвата.'
    - 'UI / Тактильность: Острый резонансный виброотклик (Double sharp haptic 30 мс)
      при успешном захвате поручня.'
    failure_mode: 'Игрок активирует хват в момент, когда нижняя часть башни уже вышла
      за пределы полигона устойчивости: рука удерживает верхний аквариум, но ноги
      заблокированы, и нижние коробки выбивает центробежной силой из-под руки. Сигнал:
      звук треска сустава и анимация выкручивания кисти.'
    mastery_curve: Новичок сливает хват на первой же секунде прямого участка от паники.
      Эксперт бережет хват как козырь на финальные 5 секунд перегона, активируя его
      ровно в апексе двойной S-образной стрелки с точностью до 0.1 с.
    counterplay: Затяжные виражи туннеля длительностью свыше 3.5 секунд, которые невозможно
      переждать только на одном заряде хвата (1.2 с), требующие обязательного перехода
      обратно на балансирование ногами.
    synergies:
    - Инерционная компенсация опоры блокируется на время хвата, создавая острый кризис
      управления
    - Снижает угловую скорость плещущейся воды в аквариуме до 0
    why_unique: 'Это не банальная кнопка ''неуязвимости'', а жесткий тактический компромисс:
      спасая верхнюю точку башни, игрок добровольно лишает себя подвижности нижней
      точки опоры в движущемся вагоне.'
    pseudocode: "function TickEmergencyGrip(isGripPressed, dt):\n  if isGripPressed\
      \ and gripState == READY:\n    gripState = ACTIVE_GRABBING\n    gripTimer =\
      \ GRIP_DURATION\n    LockPlayerFootMovement(true)\n    AttachKinematicHandConstraint(topCargoTier,\
      \ trainCeilingHandrail)\n  if gripState == ACTIVE_GRABBING:\n    gripTimer -=\
      \ dt\n    DampenAngularVelocity(topCargoTier, 0.95)\n    if gripTimer <= 0:\n\
      \      gripState = COOLDOWN\n      LockPlayerFootMovement(false)\n      DetachHandConstraint()\n\
      \  else if gripState == COOLDOWN:\n    let rechargeRate = (isNearZeroTilt) ?\
      \ 1.5 : 1.0\n    cooldownTimer += dt * rechargeRate\n    if cooldownTimer >=\
      \ COOLDOWN_TIME: gripState = READY"
  - name: Гидродинамический резонанс груза (Sloshing Cargo Dynamics)
    role_in_loop: 'Источник нелинейного риска и фазовой асимметрии: превращение пассивного
      груза в активный источник раскачки.'
    player_decision: 'Когда начинать контр-балансирование: сразу при входе в поворот
      или с задержкой на 0.25 с, когда масса воды в аквариуме ударит в противоположную
      стенку емкости.'
    input_mapping: Пассивно реагирует на все движения игрока (компенсация опоры, присед,
      наклон корпуса); парируется контр-ритмичным микродрейфом.
    states:
    - calm_fluid (уровень воды параллелен полу, амплитуда волны < 2 см)
    - wave_buildup (нарастание стоячей волны от боковых ускорений, фазовый сдвиг 0.25
      с)
    - slosh_impact (удар массы воды о стенку аквариума, передача точечного импульса
      на ярус)
    - spill_hazard (выплескивание воды, снижение массы груза и падение сцепления на
      полу вагона)
    parameters:
    - name: Масса подвижного объема воды в аквариуме
      value: 12.0 кг
      tuning_note: При >20 кг вода моментально опрокидывает любую башню; при <5 кг
        эффект плескания не ощущается на общем фоне массы коробок.
    - name: Фазовое запаздывание волны \tau_{slosh}
      value: 0.25 секунды
      tuning_note: При 0 с вода ведет себя как обычный твердый кирпич; при >0.6 с
        раскачка теряет связь с действиями поезда и кажется случайным багом.
    - name: Частота собственных колебаний жидкости \omega_{wave}
      value: 8.4 рад/с (1.34 Гц)
      tuning_note: При резонансе с частотой стыков рельсов (1.3–1.5 Гц) создает лавинообразный
        пик опрокидывающего момента.
    - name: Критический угол выплескивания воды
      value: 26 градусов
      tuning_note: При >35° аквариум перевернется раньше, чем выплеснется вода; при
        <15° вода разливается от малейшего толчка.
    feedback_layers:
    - 'Визуал / VFX: 3D-шейдер преломления воды с пеной и брызгами; золотая рыбка,
      бьющаяся о стенки стекла; капли воды, летящие на экран смартфона при критическом
      крене.'
    - 'Звук (Web Audio): Сочный влажный плеск воды (синтез полосовых шумов 300–1200
      Гц с модуляцией); звонкий резонанс тонкого стекла аквариума при ударе волны.'
    - 'Камера: Микро-встряска камеры с акцентом на верхнюю треть экрана в момент гидродинамического
      удара волны о стенку.'
    - 'UI / Тактильность: Скользящий виброотклик переменной частоты (Fluid haptic
      roll), симулирующий перетекание тяжести в ладонях.'
    failure_mode: 'Игрок компенсирует поворот поезда, но не учитывает отскок волны
      воды: поезд уже вышел на прямую, а отраженная от стенки вода бьет в обратную
      сторону, опрокидывая башню на прямой колее. Сигнал: громкий плеск и иконка ''Гидроудар''.'
    mastery_curve: Новичок борется только с креном самого поезда и теряет аквариум
      от вторичной волны. Эксперт совершает контр-колебание подошвами в противофазе
      за 0.25 с до удара волны, полностью гася стоячую волну в аквариуме (Wave Canceling).
    counterplay: Серия быстрых знакопеременных змеек (S-виражей) с частотой 1.3 Гц,
      попадающая в точный гидродинамический резонанс с собственной частотой волны.
    synergies:
    - Амортизирующий присед (Micro-Crouch Drop) сжимает столб жидкости и гасит амплитуду
      волны на 40%
    - Инерционная компенсация опоры должна рассчитываться с учетом фазового сдвига
      воды
    why_unique: 'Груз в игре — не статические жесткие боксы: внедрение гидродинамики
      со сдвигом фазы превращает предсказуемый маятник в живую, хаотическую нелинейную
      систему.'
    pseudocode: "function TickSloshingFluid(trainLatAcc, characterSwayAcc, dt):\n\
      \  let effectiveLatAcc = trainLatAcc + characterSwayAcc\n  sloshVelocity +=\
      \ (effectiveLatAcc - SLOSH_DAMPING * sloshVelocity - RESTORING_FORCE * sloshDisplacement)\
      \ * dt\n  sloshDisplacement += sloshVelocity * dt\n  let waveHeight = abs(sloshDisplacement)\n\
      \  let hydrodynamicForce = waterMass * (effectiveLatAcc + sloshDisplacement\
      \ * OMEGA_SQ)\n  ApplyLateralForceToTier(aquariumTierIndex, hydrodynamicForce)\n\
      \  if waveHeight > CRITICAL_SPILL_HEIGHT and aquariumAngle > 26.0:\n    SpillWaterDrops(waveHeight)\n\
      \    ReduceCargoWeight(waterMass * 0.05)"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 35
  max_triangles_or_sprites: 35000
  bundle_size_budget_mb: 3.8
  layers:
  - layer: RenderingLayer
    responsibility: Three.js WebGL2 сцена вагона, шейдеры туннеля, партиклы искр
  - layer: PhysicsLayer
    responsibility: Rapier3D WebAssembly мир, маятниковый солвер, кинематика вагона
  - layer: InputLayer
    responsibility: 'Унифицированный ввод: PointerEvents, TouchEvent tracking, Keyboard,
      DeviceOrientation'
  - layer: GameLogicLayer
    responsibility: Менеджер перегона, машина состояний сессии, расчет целостности
      груза
  - layer: PlatformBridgeLayer
    responsibility: 'Playgama Bridge SDK: реклама, облачные сейвы, лидерборды'
  modules:
  - description: Инициализация Three.js сцены, камеры, пост-процессинга и света
    module: Engine/Graphics
  - description: Инициализация Rapier3D, коллайдеров и расчет инерционных сил поезда
    module: Engine/Physics
  - description: Отслеживание угла наклона стопки, критических зон и распада тел
    module: Gameplay/BalanceSolver
  - description: Процедурная генерация трека туннеля, кривизны, стрелок и скорости
    module: Gameplay/TrackGenerator
  - description: Управление жизненным циклом перегона, таймером и подсчетом очков
    module: Gameplay/SessionManager
  - description: Адаптивный рендеринг HUD (инклинометр, спидометр, кнопки действий)
    module: UI/HUDManager
  - description: Интеграция с Playgama Bridge SDK для показа рекламы и сейвов
    module: Platform/BridgeIntegration
monetization:
  strategy_summary: 'Органичная аркадная монетизация: Rewarded Video для спасения
    разбитой стопки (Revive) и удвоения чаевых на станции, редкие Interstitial между
    успешными рейсами (кулдаун 90 сек), и косметические IAP (уникальные скины курьера
    и винтажные предметы груза).'
  rewarded_placements:
  - id: revive_catch
    name: Аварийная страховка груза (Revive)
    benefit: Восстанавливает разрушенную стопку предметов и замедляет поезд на 3 секунды
      для продолжения заезда
    cooldown_or_limit: 1 раз за перегон
    trigger_moment: Момент падения критического предмета на 15–50 секундах перегона
  - id: double_tips
    name: VIP Чаевые от заказчика (2x Reward)
    benefit: Удваивает заработанные курьерские монеты за выполненный рейс
    cooldown_or_limit: Без лимита
    trigger_moment: Экран успешного прибытия на станцию
  interstitial_placements:
  - trigger_event: Возврат в главное меню после завершения 2-го успешного перегона
      подряд
    cooldown_seconds: 90
    conditions: Показывается только между перегонами, никогда во время активного балансирования,
      игрок не совершал IAP
  in_app_purchases:
  - sku: pack_vintage_courier
    name: Набор 'Винтажный Экспресс'
    description: Золотая куртка курьера + набор ретро-предметов (граммофон, антикварные
      часы) + отключение обязательной рекламы
    price_tier: Tier 2 ($1.99)
    reward: Скин + 3 эксклюзивных предмета + No Ads
  fairness_rules:
  - Никакой рекламы во время 50-секундного физического заезда
  - 'Честный физический баланс: платные предметы не дают читерского бессмертия, только
    визуальный стиль'
  - Минимальный интервал между межстраничными баннерами — 90 секунд
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - gamepix
  - web
  initialization_flow:
  - Инициализация Bridge SDK при старте игры
  - Загрузка облачных сохранений игрока (прогресс веток, разблокированные предметы,
    монеты)
  - Проверка доступности рекламы и баннеров
  - Переход в главное меню станции
  cloud_save_keys:
  - player_coins
  - unlocked_items
  - unlocked_lines
  - courier_skin
  - high_scores_by_station
  leaderboards:
  - metro_top_couriers_global
  - rush_hour_streak_record
  ads_integration:
    banner_supported: false
    interstitial_supported: true
    rewarded_supported: true
  lifecycle_hooks:
  - onPause -> остановка физического мира Rapier3D и аудио
  - onResume -> возобновление таймеров с мягким 0.5с fade-in
