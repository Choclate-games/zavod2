      спидометр на лобовом стекле. Предметы: неоновые коробки с рамэном, игровые автоматы
      пачинко, светящиеся кибер-аквариумы, звуковые колонки.'
    spectacle: 'Вид от первого лица: хромированные перчатки удерживают вибрирующий
      поднос, на котором подпрыгивает башня из неоновых вывесок и коробок рамэна точно
      во вспышку стробоскопа туннеля на скорости 180 км/ч.'
