raw_prompt: Создай 3D физическую аркаду на Three.js, где игрок балансирует огромной
  стопкой разнородных предметов в движущемся вагоне метро. Мышь или наклон экрана
  компенсируют центробежные силы торможения поезда с реалистичной физикой крутящего
  момента.
title: 'Метро-Балансир: Час Пик'
slug: sozday_3d_fizicheskuyu_arkadu_na_three_js_gde_ig
genre: 3D Физическая Аркада
subgenre: Физический симулятор балансирования / Инерционный тайминг-челлендж
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web)
orientation: portrait
target_audience: Игроки 12–35 лет, любящие динамичные физические игры на координацию
  и реакцию (балансировщики и физические раннеры), ценящие осязаемый сок физики (juice),
  комичные физические ситуации и короткие адреналиновые сессии по 45–60 секунд во
  время поездок в транспорте.
core_loop: Принять заказ курьера -> Сформировать шаткую стопку разнородных предметов
  в вагоне -> Удерживать равновесие составного маятника (смещением точки опоры, приседами
  и наклонами корпуса) во время разгона, стрелочных виражей и торможения поезда ->
  Довезти груз целым до платформы следующей станции -> Получить чаевые, открыть новые
  нестандартные предметы и ветки метро с более экстремальными перегонами.
hook: 'Вагон закладывает крутой левый вираж со снопом синих искр за стеклом: трехметровая
  башня из пузатого телевизора, хрустального аквариума и пиццы сгибается дугой под
  35 градусов, игрок резким микродвижением пальца посылает курьера в глубокий присед
  с контрсмещением, аквариум в воздухе цепляет потолочный поручень, но с сочным стуком
  встает обратно на грань за долю секунды до открытия дверей станции!'
player_fantasy: Ты — курьер-виртуоз в час пик в подземке, способный доставить самый
  нелепый, хрупкий и несовместимый по габаритам груз через экстремальные виражи и
  торможения метрополитена, полагаясь исключительно на безупречное чувство баланса,
  молниеносные рефлексы и физику собственного тела.
session_model: '1 перегон между станциями метро длительностью ровно 45–60 секунд.
  Перегон состоит из 4 физических фаз: 1) Старт и резкий разгон (0–10 с, продольная
  инерция назад); 2) Скоростной туннель с 2–3 кривыми виражами и стрелочными переводами
  (10–38 с, боковые центробежные силы и тряска); 3) Экстренное торможение перед платформой
  (38–52 с, сильнейший инерционный толчок вперед); 4) Остановка и открытие дверей
  (52–60 с, фиксация победы и подсчет уцелевших предметов в стопке от 3 до 7 штук).'
unique_value_proposition: 'Первая 3D веб-аркада с честной физикой составного обратного
  маятника в движущемся вагоне метро: кинематографичная атмосфера ретро-подземки,
  разнородные физические свойства каждого объекта (масса, трение, упругость, центр
  масс) и ультраотзывчивое тактильное управление без задержек ввода.'
vision: Создать эталонную физическую веб-аркаду с мгновенным вовлечением (0 секунд
  на понимание правил), где каждый поворот вагона метро генерирует искренний азарт,
  балансирование ощущается кончиками пальцев благодаря симуляции Rapier3D, а стилизованный
  ретро-визуал с теплым светом ламп накаливания и неоном туннеля делает каждый 50-секундный
  заезд зрелищным микрофильмом.
elevator_pitch: Удержи трехметровую стопку из пузатого телевизора, золотой рыбки в
  аквариуме и коробок с пиццей в несущемся вагоне метро! Компенсируй центробежные
  силы на виражах и толчки торможения на стрелках одним пальцем, довези груз в целости
  и стань легендой подземной курьерской службы.
win_conditions: Успешно доехать до станции назначения (таймер перегона 45–60 с) и
  полностью остановить вагон, сохранив вертикальную устойчивость стопки предметов
  так, чтобы ни один хрупкий предмет не упал на пол вагона (сохранено минимум 70%
  исходной стопки).
lose_conditions: Падение критического хрупкого предмета (аквариума/телевизора) на
  пол вагона ИЛИ превышение угла наклона башни свыше 38 градусов с разрушением более
  50% объема груза до полной остановки поезда.
progression_summary: Линейно-разветвленная карта веток метрополитена (Кольцевая линия,
  Глубокая ветка, Экспресс-магистраль). За успешные рейсы игрок получает оплату и
  рейтинг курьера, открывая новые контракты с нестандартными и капризными предметами
  (хрустальная ваза, живой кактус, пирамида пончиков, тяжелый сейф), стильные куртки
  и перчатки курьера с уникальными микро-свойствами трения, а также ночные экспресс-рейсы
  с повышенной скоростью поезда.
difficulty_curve: 'Начальные станции: 3 предмета с широкой опорой, плавный разгон
  и 1 пологий вираж (допустимый крен 25°). Средний уровень (станции 4–8): 5 разнородных
  предметов (тяжелый низ, легкий верх, аквариум со смещающейся водой), 2 резких поворота
  и 1 стрелочный перевод. Поздние станции (9–15): 6–7 капризных предметов, S-образные
  виражи с моментальной сменой направления центробежной силы и экстренное торможение
  с перегрузкой 1.8G.'
scores:
  fun: 9
  originality: 9
  replayability: 8
  development_cost: 8
  visual_appeal: 9
  mobile_fit: 9
  monetization: 8
  platform_fit: 9
  overall_score: 8.6
  justification: 'Оценки обоснованы высоким качеством кор-геймплея: физический обратный
    маятник в Rapier3D дает мгновенный тактильный кайф и юмор при шатании стопки.
    Сессия в 50 секунд идеально вписывается в платформенные требования Яндекса и Playgama.
    Снижение по replayability (8) и development_cost (8) связано с необходимостью
    тончайшей полировки численных параметров соединений физических тел и предотвращения
    дрожания (jittering) контактов в WebAssembly при высоких угловых скоростях.'
references:
- name: QWOP / Getting Over It
  genre: Физический хардкор-платформер
  mechanics:
  - Прямой контроль конечностей
  - Честная инерция и крутящий момент
  - Высокая цена ошибки
  lessons: Физический контроль должен быть понятным, но глубоким для совершенствования
    мастерства
  what_to_avoid: Излишняя неповоротливость и фрустрирующее управление; в мобильной
    аркаде отклик должен быть мгновенным и приятным
- name: Tricky Towers
  genre: Физическая головоломка со строительством башни
  mechanics:
  - Балансировка центра тяжести
  - Разная масса и трение блоков
  - Влияние внешних возмущений (ветра)
  lessons: Разнородность форм и материалов создает бесконечную вариативность физических
