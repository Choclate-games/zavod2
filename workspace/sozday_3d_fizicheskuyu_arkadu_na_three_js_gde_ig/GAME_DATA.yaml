preview_prompt: 'Authentic in-game gameplay screenshot of ''Метро-Балансир: Час Пик'',
  a 3D Физическая Аркада game. Visual style: Stylized Retro Metro Realism (Теплый
  стилизованный ретро-реализм). Camera perspective: Third-person behind courier back
  looking forward down train aisle. Environment: Интерьер советского/европейского
  ретро-вагона метро 1980-х: мягкий свет плафонов, блестящие хромированные поручни,
  коричнево-янтарный линолеум, черные туннельные окна с проносящимися проводами и
  неоновыми семафорами. Central Action: Вагон закладывает крутой левый вираж со снопом
  синих искр за стеклом: трехметровая башня из пузатого телевизора, хрустального аквариума
  и пиццы сгибается дугой под 35 градусов, игрок резким микродвижением пальца посылает
  курьера в глубокий присед с контрсмещением, аквариум в воздухе цепляет потолочный
  поручень, но с сочным стуком встает обратно на грань за долю секунды до открытия
  дверей станции! — the moment is caught mid-action, with clear cause and effect readable
  in a single frame. Visible in-game HUD overlay: Аналоговый креномер (Inclinometer)
  вверху экрана с желтой и красной зонами опасности, Спидометр и индикатор фазы поезда
  (Разгон / Вираж / Торможение), Индикатор прогресса перегона (мини-карта туннеля),
  Иконка кнопки Аварийного захвата с индикатором кулдауна; touch controls at the bottom
  corners. Lighting: Основной теплый PointLight внутри салона (2700K, янтарный), акцентный
  холодный DirectionalLight из окон туннеля (6500K) + динамические вспышки искр (Electric
  Blue #00e5ff) при поворотах. Color palette: #FFB03A, #D4DFE8, #0D1117, #1B4958,
  #E5A93C, #E63946, #00F0FF. High visual clarity, readable silhouettes, immersive
  WebGL game aesthetics.'
