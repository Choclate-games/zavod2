mechanics:
- name: Инерционная компенсация опоры (Base Sway Compensation)
  category: physics
  priority: core
  description: Игрок перемещает точку опоры (ноги и руки курьера) в плоскости пола
    вагона влево и вправо для непрерывного возвращения центра масс всей стопки предметов
    в проекцию полигона устойчивости.
  player_interaction: Горизонтальный drag/свайп пальцем по экрану (Portrait touch)
    или движение мыши / клавиши A/D на клавиатуре.
  feedback: 'Визуал / VFX: Подошвы курьера чертят резиновые следы по рифленому полу
    вагона; искры скольжения коробок при опасных углах; динамический лазерный маркер
    проекции центра масс на полу (зеленый -> желтый -> пульсирующий красный).; Звук
    (Web Audio): Скрип резины обуви по металлу пола (динамический питч 180–450 Гц
    в зависимости от скорости смещения); скрежет картона и звон стекла при наклоне
    ярусов.; Камера: Плавный позиционный лаг камеры на 0.08 с с динамическим креном
    горизонта (до 6°) в сторону центробежного ускорения поезда.; UI / Тактильность:
    Тактильный отклик (Haptic pulse 25 мс) при приближении к границе вагона (±0.85
    м); дуговая шкала крена над головой курьера с цветовой маркировкой зон опасности.'
  technical_complexity: High
  strengths:
  - Интуитивно понятна с первой миллисекунды
  - Прямая аналогия с реальным балансированием предмета на ладони
  - Высокий потолок мастерства
  weaknesses:
  - Требует точной калибровки чувствительности ввода на разных экранах
  - Риск оверстиринга (перекомпенсации) у новичков
- name: Амортизирующий присед (Micro-Crouch Drop)
  category: movement
  priority: core
  description: Кратковременное занижение центра тяжести курьера за счет сгибания коленей.
    Увеличивает нормальную силу прижима предметов друг к другу и гасит вертикальные
    колебания стопки на стыках рельсов и стрелках.
  player_interaction: Вертикальный свайп вниз / удержание свайпа вниз (Portrait touch)
    или клавиша S / Стрелка вниз.
  feedback: 'Визуал / VFX: Сжатие пружинящего силуэта курьера; появление кратковременного
    золотистого ореола компрессии под стопами при точном тайминге (Perfect Dampen);
    видимая деформация/проминание нижних коробок пиццы.; Звук (Web Audio): Глухой
    низкочастотный ''thump'' (65 Гц) амортизации суставов вместо металлического лязга
    удара колес; упругий вздох сжатия воздуха.; Камера: Быстрый импульсный микродаун-зум
    (fov 60 -> 57 на 0.12 с) с последующим упругим возвратом.; UI / Тактильность:
    Тяжелый сдвоенный виброотклик (Heavy haptic tap 45 мс) в момент удара колес о
    стрелочную крестовину.'
  technical_complexity: Medium
  strengths:
  - Спасает в критические моменты сильной тряски
  - Дает игроку второй управляющий слой помимо горизонтального движения
  weaknesses:
  - При удержании приседа падает скорость горизонтального перемещения курьера, создавая
    тактический риск
- name: Продольный контр-наклон корпуса (Pitch Counter-Lean)
  category: 'Модификатор продольного баланса: парирование ускорения разгона и сокрушительного
    пневматического торможения поезда.'
  priority: secondary
  description: Превращает плоский 2D-балансир в полноценную 3D-задачу удержания пространственного
    маятника при сложном переменном векторе ускорения поезда (разгон, вираж, торможение).
  player_interaction: Вертикальный наклон гироскопа смартфона (tilt) ИЛИ вертикальный
    drag в верхней половине экрана ИЛИ клавиши W/S на клавиатуре.
  feedback: 'Визуал / VFX: Напряжение мускулатуры курьера, пар от дыхания; продольный
    наклон башни коробок с деформацией граней; сноп оранжевых искр от тормозных колодок
    за окном вагона.; Звук (Web Audio): Оглушительный визг пневматических тормозов
    (гармоники 2.8 кГц и 4.1 кГц); нарастающий гул тяговых электромоторов при разгоне.;
    Камера: Динамическое изменение тангажа камеры (Pitch tilt ±5°) с приближением
    к лицу курьера в момент пиковой перегрузки торможения.; UI / Тактильность: Нарастающая
    высокочастотная вибрация (Vibration sweep 40–120 Гц) пропорционально силе замедления
    состава.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Аварийный захват рукой (Emergency Grip Catch)
  category: special
  priority: tactical
  description: 'Тактическое умение с кулдауном: курьер вскидывает руку и фиксирует
    нижнюю грань верхнего съезжающего предмета на 1.2 секунды, предотвращая соскальзывание
    в обмен на временную потерю подвижности ног.'
  player_interaction: Тап по виртуальной кнопке 'ХВАТ' в углу экрана (или двойной
    быстрый тап в верхней половине экрана) / Пробел (Spacebar) на клавиатуре.
  feedback: 'Визуал / VFX: Рука курьера в кевларовой перчатке выбрасывается вверх
    к потолочному поручню; силовой луч кинематической связи; частицы пыли, сбитые
    с поручня.; Звук (Web Audio): Металлический звонкий лязг защелкивания карабина/хвата
    (двойной щелчок 1.2 кГц); глухой стон гашения инерции.; Камера: Мгновенный стоп-кадр
    на 0.04 с (Micro hitstop) с последующим динамическим зумом на точку хвата.; UI
    / Тактильность: Острый резонансный виброотклик (Double sharp haptic 30 мс) при
    успешном захвате поручня.'
  technical_complexity: Medium
  strengths:
  - Дает шанс на эпичное спасение почти проигранного раунда
  - Снижает фрустрацию от случайных микроошибок
  weaknesses:
  - Ограничен 1 применением за перегон, чтобы не ломать честный физический челлендж
- name: Гидродинамический резонанс груза (Sloshing Cargo Dynamics)
  category: 'Источник нелинейного риска и фазовой асимметрии: превращение пассивного
    груза в активный источник раскачки.'
  priority: secondary
  description: 'Груз в игре — не статические жесткие боксы: внедрение гидродинамики
    со сдвигом фазы превращает предсказуемый маятник в живую, хаотическую нелинейную
    систему.'
  player_interaction: Пассивно реагирует на все движения игрока (компенсация опоры,
    присед, наклон корпуса); парируется контр-ритмичным микродрейфом.
  feedback: 'Визуал / VFX: 3D-шейдер преломления воды с пеной и брызгами; золотая
    рыбка, бьющаяся о стенки стекла; капли воды, летящие на экран смартфона при критическом
    крене.; Звук (Web Audio): Сочный влажный плеск воды (синтез полосовых шумов 300–1200
    Гц с модуляцией); звонкий резонанс тонкого стекла аквариума при ударе волны.;
    Камера: Микро-встряска камеры с акцентом на верхнюю треть экрана в момент гидродинамического
    удара волны о стенку.; UI / Тактильность: Скользящий виброотклик переменной частоты
    (Fluid haptic roll), симулирующий перетекание тяжести в ладонях.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
gameplay_systems:
- name: physics_metro_train_simulation
  purpose: Генерация кинематических сил (продольных ускорений и центробежных сил)
    в локальной системе координат вагона
  input: Профиль кривизны и скоростной график перегона (Spline-трек)
  rules:
  - Скорость вагона v(t) меняется по гладкой кривой Безье
  - Центробежная сила F = m * v^2 / R прикладывается к каждому телу стопки
  - На стрелочных переводах генерируется короткий импульсный боковой толчок (Jerk)
  state:
  - TrainVelocity
  - CurveRadius
  - LateralForce
  - TunnelProgress
  interactions: Передает текущий вектор центробежной силы и продольного ускорения
    в compound_stack_ragdoll_solver
  feedback: Звуки двигателя, искры за окном, покачивание подвески вагона
  edge_cases:
  - Переход между туннелем и открытой станцией без скачков освещения
- name: compound_stack_ragdoll_solver
  purpose: Симуляция составного обратного маятника с расчетом крутящего момента и
    трения контактов
  input: Позиция точки опоры курьера, присед, внешние силы инерции вагона
  rules:
  - Каждый предмет имеет реальный RigidBody в Rapier3D с уникальной массой и трением
  - При превышении угла наклона 38° активируется распад стопки
  - Вода в аквариуме симулируется смещением центра масс в направлении наклона
  state:
  - StackCenterOfMass
  - CurrentTiltAngle
  - ContactPointsList
  - IsStable
  interactions: Получает силы от train_simulation и команды от InputRouter, передает
    углы наклона в UI/HUDManager
  feedback: Скрип сочленений, наклон башни, выплескивание воды из аквариума
  edge_cases:
  - Предотвращение взрыва физики при одновременном падении более 5 тел на пол вагона
- name: cargo_order_generation_system
  purpose: Процедурная генерация наборов предметов для доставки с нарастающей сложностью
    геометрии и массы
  input: Уровень игрока, текущая ветка метро, выбранный контракт
  rules:
  - Высота стопки от 3 до 7 предметов
  - Предметы классифицируются по трению (скользкие, шероховатые) и стабильности
  - Суммарный центр тяжести стопки определяет базовую сложность контракта
  state:
  - CurrentOrderItems
  - TotalCargoMass
  - CargoFragilityRating
  interactions: Формирует состав RigidBodies для спавна в физическом мире перед началом
    перегона
  feedback: Превью стопки перед стартом рейса, звуковой джингл подтверждения заказа
  edge_cases:
  - Балансировка сложности стопки для новичков (только плоские коробки)
- name: session_lifecycle_and_scoring_system
  purpose: Управление 50-секундным циклом перегона, фиксация победы/поражения и начисление
    наград
  input: Состояние стопки в момент остановки поезда на платформе
  rules:
  - Перегон длится ровно 45–60 секунд
  - 'Условие победы: сохранение вертикальной устойчивости и минимум 70% исходного
    груза'
  - 'Условие поражения: падение хрупкого предмета или наклон башни > 38°'
  state:
  - SessionTimer
  - SurvivingItemsCount
  - ScoreMultiplier
  - SessionState
  interactions: Взаимодействует с Playgama SDK для сохранения прогресса и вызова экранов
    окончания перегона
  feedback: Открытие дверей вагона, салют чаевых, звук кассового аппарата, статистика
    сохранности
  edge_cases:
  - Обработка паузы и сворачивания вкладки браузера во время перегона
core_design:
  signature_moment: 'Поезд метро на скорости 80 км/ч с оглушительным скрежетом колесных
    пар влетает в S-образный стрелочный перевод за 8 секунд до платформы: трехметровая
    башня из пузатого телевизора, хрустального аквариума с бьющейся золотой рыбкой
    и стопки из 6 коробок пиццы опасно кренится на 34.5° к окну, за которым летят
    снопы синих электрических искр. Игрок резким свайпом вниз и влево бросает курьера
    в глубокий амортизирующий присед, сбивая высоту центра масс на 40 см, а затем
    на 1.1 секунды активирует аварийный захват рукой за потолочный поручень. Волна
    воды в аквариуме с глухим плеском бьет в стекло, стопка со скрипом картона выравнивается
    до 3.2° вертикали, и поезд с шипением пневматических тормозов останавливается
    ровно у створа дверей под звон 100% чаевых от довольного заказчика!'
  genre_template_rejected: Отвергнут шаблон бесконечного 3-полосного раннера со свайпами
    влево-вправо для сбора монеток и статический 2D-балансировщик на плоской платформе
    (типа балансировки палки). В классических раннерах окружение движется на игрока
    по жесткой сетке, а аватар не имеет внутренней физической инерции; в 2D-балансировщиках
    объект является неделимым монолитным стержнем. В нашей игре вагон метро — это
    нелинейная неинерциальная система отсчета в 3D с реальными центробежными силами,
    кренами кузова и вибрацией на стыках рельсов, а груз — составной многозвенный
    маятник со скользящими контактными парами, деформацией упаковки и гидродинамическим
    плесканием жидкостей, где игрок управляет не абстрактной тележкой, а биомеханикой
    курьера (стопы, колени, корпус, хват).
  what_makes_it_different: 'В отличие от обычных аркад про балансирование, здесь центр
    масс башни не статичен: он динамически ''дышит'' и смещается из-за физики разнородных
    материалов груза (плещущаяся вода в аквариуме создает фазовый сдвиг инерции на
    0.25 с, проминающиеся коробки пиццы снижают жесткость сочленений на 30%, а тяжелый
    кинескопный телевизор внизу создает колоссальный опрокидывающий момент). Игрок
    реагирует не только постфактум на наклон, но и предвосхищает поведение поезда
    по аудиовизуальным подсказкам туннеля (наклон световых линий контактного рельса,
    частота перестука колес, предупреждающие светофоры стрелок), сочетая непрерывный
    аналоговый дрейф точки опоры с дискретными импульсами приседов и тактическим хватом
    за поручни.'
  micro_loop:
  - step: Считывание инерционного крена и предупреждающих сигналов туннеля
    player_action: Визуальное отслеживание угла отклонения лазерного маркера центра
      тяжести стопки и мигания желтого стрелочного светофора за окном вагона.
    game_response: Телеметрия поезда передает нарастание бокового ускорения a_lat
      = 4.2 м/с²; башня начинает заваливаться вправо со скоростью 18°/с, коробки издают
      предупреждающий хруст картона.
    decision: 'Оценить запас устойчивости: компенсировать крен только смещением подошв
      или подготовить амортизирующий присед под ударную нагрузку стрелки.'
    duration: 0.2–0.4 с
  - step: Инерционная компенсация опоры (Base Sway Compensation)
    player_action: Плавное непрерывное смещение пальца (drag) вправо по экрану для
      переступания ногами курьера под падающий центр масс.
    game_response: Точка контакта подошв курьера с рифленым полом смещается со скоростью
      до 2.4 м/с; проекция суммарного вектора силы тяжести и инерции возвращается
      внутрь полигона опоры.
    decision: 'Дозировать величину контрсмещения: недокомпенсация приведет к опрокидыванию,
      а избыточный резкий рывок сорвет верхние коробки силой трения покоя.'
    duration: 0.3–0.8 с
  - step: Амортизирующий присед на стрелочном стыке (Micro-Crouch Drop)
    player_action: Резкий короткий свайп вниз в момент проезда колесной пары по стрелочной
      крестовине.
    game_response: Курьер сгибает колени на 40 см, снижая высоту составного центра
      масс H_cm на 35%; нормальная сила прижима ярусов F_N возрастает на 60%, гася
      вертикальный резонанс и подскок коробок.
    decision: 'Поймать идеальный тайминг приседа (окно 0.18 с): слишком ранний присед
      потратит выносливость ног, слишком поздний допустит подлет верхнего яруса.'
    duration: 0.4–0.6 с
  - step: Тактический хват за потолочный поручень (Emergency Grip Catch)
    player_action: Тап по виртуальной кнопке хвата при критическом крене верхнего
      аквариума свыше 28°.
    game_response: Рука курьера вскидывается к поручню, накладывая кинематическую
      связь на верхний ярус на 1.2 с; угловая скорость башни падает до 0, но перемещение
      ног блокируется.
    decision: Активировать аварийный ресурс сейчас на 1.2 с с уходом в кулдаун 8 с
      или попытаться вытянуть баланс микро-наклоном корпуса.
    duration: 1.2 с
  meso_loop:
  - step: 'Фаза 1: Разгон со станции и продольная инерция тяги'
    player_action: Удержание корпуса курьера в глубоком наклоне вперед (Pitch Counter-Lean)
      для противодействия продольной перегрузке тяговых двигателей поезда (a_lon =
      2.8 м/с²).
    game_response: Поезд набирает скорость от 0 до 75 км/ч; свет платформы сменяется
      тьмой туннеля, составная башня испытывает опрокидывающий крутящий момент назад.
    decision: 'Выбрать агрессивность стартового контр-наклона с учетом массы нижнего
      яруса: не допустить сползания пиццы назад при резком наборе тяги.'
    duration: 10 с
  - step: 'Фаза 2: Скоростной туннель, виражи и стрелочные переводы'
    player_action: Комбинирование непрерывного бокового балансирования, предвосхищения
      S-образных виражей по искрам на контактном рельсе и микро-приседов на стыках.
    game_response: Чередование левых и правых центробежных сил (до 1.6G), плескание
      воды в аквариуме с фазовым запаздыванием 0.25 с, вибрация пола вагона с частотой
      14 Гц.
    decision: 'Определить приоритет риска: компенсировать амплитуду тяжелого низа
      или демпфировать высокочастотные колебания легкого хрупкого верха.'
    duration: 28 с
  - step: 'Фаза 3: Экстренное пневматическое торможение перед платформой'
    player_action: Резкий отвод корпуса назад с одновременным серийным приседом для
      удержания многоярусной башни против сокрушительного инерционного удара вперед.
    game_response: Колодки с визгом сжимают колеса (a_brake = -3.6 м/с²); за окнами
      вагона вспыхивают фонари прибытия на платформу; все ярусы стремятся сорваться
      в сторону кабины машиниста.
    decision: Использовать ли сохраненный заряд 'Аварийного хвата' для фиксации наклона
      или стабилизировать башню только предельной работой ног.
    duration: 14 с
  - step: 'Фаза 4: Полная остановка, открытие дверей и расчет целостности'
    player_action: Финальная микро-коррекция вертикали (угол < 5°) в момент срабатывания
      стояночного тормоза и ожидание распахнутых дверей.
    game_response: Пневмо-пшик открывающихся дверей вагона, физический зачет сохранности
      каждого предмета (100% целых = 3 звезды + максимальные чаевые), выгрузка заказа
      на перрон.
    decision: 'Выбрать следующий заказ в курьерском терминале: взять легкий дешевый
      груз на безопасную ветку или дорогой хрупкий негабарит на скоростную магистраль.'
    duration: 8 с
  macro_loop:
  - step: Прием контракта доставки на интерактивной карте метрополитена
    player_action: Выбор ветки метро (Кольцевая, Глубокая радиальная, Скоростной экспресс)
      и типа курьерского заказа (набор разнородных предметов с уникальными физическими
      свойствами).
    game_response: 'Отображение профиля перегона: длина, количество виражей, стрелок,
      тип рельсового полотна и гарантированная оплата с бонусом за хрупкость.'
    decision: 'Оценить соотношение риска и награды: тяжелый груз с высоким центром
      масс дает х3 чаевых, но требует идеального тайминга приседов.'
    duration: 15–30 с
  - step: Экипировка курьера и калибровка снаряжения в депо
    player_action: Покупка и экипировка обуви с высоким коэффициентом трения (Vibro-Tread),
      кевларовых перчаток хвата и стабилизирующего пояса.
    game_response: 'Модификация физических параметров: увеличение скорости перемещения
      стоп на +20%, снижение времени перезарядки хвата на 1.5 с, расширение зоны устойчивости.'
    decision: Инвестировать заработанные монеты в пассивное трение подошв или в тактическую
      емкость аварийного хвата для сложных веток.
    duration: 20–40 с
  - step: Исполнение серии перегонов и повышение курьерского разряда
    player_action: Прохождение цепочки из 3–5 связанных перегонов ветки с сохранением
      комбо безаварийности.
    game_response: Разблокировка скоростных экспресс-маршрутов с повышенной скоростью
      поездов (до 110 км/ч), ночных рейсов и элитных негабаритных грузов (5-ярусный
      торт, колбы с гелием).
    decision: Перейти к хардкорным маршрутам глубокого залегания или оттачивать 3-звездочный
      рейтинг на кольцевой линии.
    duration: 3–6 минут
