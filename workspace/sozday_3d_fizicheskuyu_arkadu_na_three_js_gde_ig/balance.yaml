_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: sozday_3d_fizicheskuyu_arkadu_na_three_js_gde_ig
performance:
  target_fps: 60
  max_draw_calls: 35
  max_triangles: 35000
  bundle_size_budget_mb: 3.8
session:
  model: '1 перегон между станциями метро длительностью ровно 45–60 секунд. Перегон
    состоит из 4 физических фаз: 1) Старт и резкий разгон (0–10 с, продольная инерция
    назад); 2) Скоростной туннель с 2–3 кривыми виражами и стрелочными переводами
    (10–38 с, боковые центробежные силы и тряска); 3) Экстренное торможение перед
    платформой (38–52 с, сильнейший инерционный толчок вперед); 4) Остановка и открытие
    дверей (52–60 с, фиксация победы и подсчет уцелевших предметов в стопке от 3 до
    7 штук).'
  win: Успешно доехать до станции назначения (таймер перегона 45–60 с) и полностью
    остановить вагон, сохранив вертикальную устойчивость стопки предметов так, чтобы
    ни один хрупкий предмет не упал на пол вагона (сохранено минимум 70% исходной
    стопки).
  lose: Падение критического хрупкого предмета (аквариума/телевизора) на пол вагона
    ИЛИ превышение угла наклона башни свыше 38 градусов с разрушением более 50% объема
    груза до полной остановки поезда.
  difficulty_curve: 'Начальные станции: 3 предмета с широкой опорой, плавный разгон
    и 1 пологий вираж (допустимый крен 25°). Средний уровень (станции 4–8): 5 разнородных
    предметов (тяжелый низ, легкий верх, аквариум со смещающейся водой), 2 резких
    поворота и 1 стрелочный перевод. Поздние станции (9–15): 6–7 капризных предметов,
    S-образные виражи с моментальной сменой направления центробежной силы и экстренное
    торможение с перегрузкой 1.8G.'
mechanics:
  inertsionnaya_kompensatsiya_opory_base_sway_compen:
    name: Инерционная компенсация опоры (Base Sway Compensation)
    parameters:
      maksimalnaya_skorost_peremescheniya_stop_kurera:
        value: 2.4 м/с
        note: При >3.5 м/с игра превращается в аркадный пинпонг без ощущения веса;
          при <1.5 м/с курьер физически не успевает подбежать под башню на крутых
          виражах.
      shirina_dostupnogo_koridora_pola_vagona:
        value: 1.8 м
        note: При >2.5 м теряется клаустрофобия вагона метро; при <1.2 м игрок мгновенно
          упирается в стенки при минимальном крене.
      koeffitsient_treniya_pokoya_mezhdu_korobkami_gruza:
        value: '0.42'
        note: При >0.70 груз ведет себя как монолитный столб; при <0.25 ярусы соскальзывают
          горизонтально при малейшем толчке до возникновения наклона.
      mertvaya_zona_tsentrirovaniya_vvoda:
        value: 0.05 м
        note: При 0 возникают микро-рывки от естественного дрожания пальца на тачскрине;
          при >0.15 управление кажется ватным и неотзывчивым.
  amortiziruyuschiy_prised_micro_crouch_drop:
    name: Амортизирующий присед (Micro-Crouch Drop)
    parameters:
      glubina_amortiziruyuschego_priseda:
        value: 0.40 м
        note: При >0.6 м курьер визуально садится на пол и теряет баланс; при <0.2
          м снижение центра масс неощутимо для физики башни.
      okno_idealnogo_tayminga_amortizatsii:
        value: 0.18 с
        note: При >0.35 с механика становится тривиальной однокнопочной затычкой;
          при <0.08 с попадание на мобильном экране становится случайным.
      bonus_k_normalnoy_sile_prizhima_f_n:
        value: 1.6x от веса
        note: При >2.5x стопка склеивается как монолит и физика замерзает; при <1.2x
          коробки подлетают на каждом стыке рельсов.
      shtraf_k_skorosti_peremescheniya_stop_v_prisede:
        value: 55%
        note: При 0% игрок будет непрерывно сидеть в приседе; при >80% присед становится
          ловушкой смерти на виражах.
  prodolnyy_kontr_naklon_korpusa_pitch_counter_lean:
    name: Продольный контр-наклон корпуса (Pitch Counter-Lean)
    parameters:
      maksimalnyy_ugol_naklona_korpusa_kurera:
        value: 32 градуса
        note: При >45° персонаж выглядит неестественно падающим; при <15° не хватает
          физического плеча силы для удержания тяжелого сейфа при торможении.
      inertsionnaya_peregruzka_tormozheniya_poezda_a_bra:
        value: -3.6 м/с²
        note: При >-5.0 м/с² башня гарантированно срывается вперед без шансов на удержание;
          при <-2.0 м/с² фаза торможения не создает кульминационного напряжения.
      skorost_otklika_naklona_korpusa:
        value: 110 град/с
        note: При >200 град/с наклон кажется невесомым; при <50 град/с игрок не успевает
          среагировать на экстренное торможение.
      smeschenie_tochki_podvesa_gruza_po_osi_z:
        value: 0.35 м
        note: При >0.6 м руки курьера визуально отрываются от груди; при <0.15 м продольный
          рычаг компенсации слишком слаб.
  avariynyy_zahvat_rukoy_emergency_grip_catch:
    name: Аварийный захват рукой (Emergency Grip Catch)
    parameters:
      dlitelnost_uderzhaniya_hvata:
        value: 1.2 секунды
        note: При >2.5 с механика превращается в чит, нивелирующий всю физику виража;
          при <0.6 с игрок не успевает погасить кинетическую энергию соскальзывающего
          яруса.
      bazovoe_vremya_perezaryadki_cooldown:
        value: 8.0 секунд
        note: При <4.0 с хват жмут по кд на каждом повороте; при >15.0 с игрок боится
          использовать его вовсе.
      maksimalnyy_uderzhivaemyy_kriticheskiy_ugol_yarusa:
        value: 36 градусов
        note: При >50° захват выглядит нереалистичной телекинетической магией; при
          <25° захват бесполезен, так как угол еще не критический.
      bonus_k_uskoreniyu_kuldauna_za_chistyy_balans:
        value: +50% к скорости зарядки
        note: При 0% нет награды за мастерство; при >100% эксперты получают хват каждые
          3 секунды.
  gidrodinamicheskiy_rezonans_gruza_sloshing_cargo_d:
    name: Гидродинамический резонанс груза (Sloshing Cargo Dynamics)
    parameters:
      massa_podvizhnogo_obema_vody_v_akvariume:
        value: 12.0 кг
        note: При >20 кг вода моментально опрокидывает любую башню; при <5 кг эффект
          плескания не ощущается на общем фоне массы коробок.
      fazovoe_zapazdyvanie_volny_tau_slosh:
        value: 0.25 секунды
        note: При 0 с вода ведет себя как обычный твердый кирпич; при >0.6 с раскачка
          теряет связь с действиями поезда и кажется случайным багом.
      chastota_sobstvennyh_kolebaniy_zhidkosti_omega_wav:
        value: 8.4 рад/с (1.34 Гц)
        note: При резонансе с частотой стыков рельсов (1.3–1.5 Гц) создает лавинообразный
          пик опрокидывающего момента.
      kriticheskiy_ugol_vypleskivaniya_vody:
        value: 26 градусов
        note: При >35° аквариум перевернется раньше, чем выплеснется вода; при <15°
          вода разливается от малейшего толчка.
