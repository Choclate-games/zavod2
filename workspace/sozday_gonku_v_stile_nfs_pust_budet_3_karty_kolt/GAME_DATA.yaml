  tension_curve: 'Пилообразная синусоида высокой частоты с кульминацией на финише:
    1. Секунды 0–10 (Старт): Резкий стартовый всплеск адреналина (80%) — борьба в
    узком горлышке первого поворота, риск завала; 2. Секунды 10–35 (Хайвей/Кольцо):
    Циклы напряжения (40% на прямых во время набора слипстрима -> 90% в апексах поворотов
    при удержании дрифта в 30 см от стены на множителе x4); 3. Секунды 35–65 (Средняя
    фаза): Плато высокой концентрации (75%) — адаптивный ИИ прессингует бампер в бампер,
    любая ошибка срывает комбо; 4. Секунды 65–85 (Техничная шпилька): Пик напряжения
    (95%) — череда двойных перекладок ручником, дефицит времени на секундомере чекпоинта;
    5. Секунды 85–90 (Финишный створ): Взрывная разрядка (100% -> катарсис) — тройной
    прожиг нитро, финиш нос к носу с лидером, замедление времени и победный фанфарный
    аккорд.'
  core_formulas:
  - 'Формула скорости накопления нитро в дрифте: dNitro/dt = BaseChargeRate * (DriftAngle
    / IdealAngle) * (CurrentSpeed / MaxSpeed) * RiskMultiplier, где BaseChargeRate
    = 25.0% в сек, IdealAngle = 45.0°, RiskMultiplier = [1.0..4.0] в зависимости от
    дистанции до отбойника.'
  - 'Формула множителя риска «Лезвие бритвы» (Razor Edge Proximity): RiskMultiplier
    = 1.0 + clamp((WallProximityThreshold - DistanceToObstacle) / WallProximityThreshold,
    0.0, 1.0) * 3.0, где WallProximityThreshold = 1.20 м. При дистанции <= 0.35 м
    множитель равен ровно 4.0x.'
  - 'Формула начисления дрифт-очков стиля: DriftScoreTick = (CurrentSpeed_kmh * 0.50)
    * sin(DriftAngle_rad) * RiskMultiplier * DeltaTime_sec * (ComboStreak + 1).'
  - 'Формула адаптивной тяги соперников (Rubberband AI): AiTorqueModifier = 1.0 +
    clamp((DistanceToPlayer_m - DesiredGap_m) * 0.035, -0.25, 0.40), где DesiredGap
    = 15.0 м. Если бот отстает на 30 м, его крутящий момент растет на +40%, если опережает
    на 30 м — падает на 25%.'
  - 'Формула динамического латерального сцепления шин (Rapier Lateral Grip): LateralGrip
    = BaseGrip * (1.0 - HandbrakeInput * 0.65) * (1.0 / (1.0 + (SlipAngle / DriftTransitionAngle)^2)),
    где DriftTransitionAngle = 18.5°.'
  - 'Формула динамического ускорения при форсаже Нитро: BoostAcceleration = (EngineTorque
    * 1.60 / VehicleMass_kg) + (NitroThrust_N / VehicleMass_kg) * NitroTierMult, где
    NitroThrust = 4500 Н, NitroTierMult = [1.0..1.5].'
  run_progression:
  - 'Стартовый статус: 0% шкалы нитро, комбо-множитель риска x1.0, холодные шины (базовый
    зацеп 100%), позиция P4/P4.'
  - 'Накопление 1-го баллона нитро (секунды 10–25): за счет прохождения первых 2 поворотов
    в заносе открывается первый тактический рывок для обгона P3.'
  - 'Разгон комбо-стрика «Лезвие бритвы» (секунды 25–50): безаварийный дрифт вблизи
    отбойников разгоняет множитель очков стиля до x3.0–x4.0, нитро восполняется за
    2.0 секунды дрифта вместо 6.0 секунд.'
  - 'Переход в состояние Overdrive (секунды 50–75): заполнение всех 3 баллонов активирует
    доступ к сдвоенному и тройному прожигу (Mega Nitro Boost с прибавкой +65 км/ч),
    позволяющему сократить отставание от лидера P1.'
  - 'Пик гоночной формы на финише (секунды 75–90): максимальная скорость болида достигает
    245 км/ч в слипстриме, финальный затяжной дрифт приносит свыше 12 000 очков стиля,
    гарантируя золотой кубок заезда.'
  meta_progression:
  - 'Ранги Репутации Синдиката (Tiers 1–5): за каждый заезд начисляется от 40 до 250
    очков репутации. Tier 1 (Новичок улиц, 0-500 rep) -> Tier 2 (Ночной призрак, 500-1500
    rep) -> Tier 3 (Теневой гонщик, 1500-3500 rep) -> Tier 4 (Мастер синдиката, 3500-7000
    rep) -> Tier 5 (Легенда полуночи, 7000+ rep).'
  - 'Техническое древо тюнинга (4 ветки по 5 уровней прокачки за кредиты): 1. Двигатель
    (ECU & Блок) — рост макс. скорости (+10 км/ч за уровень, со 190 до 240 км/ч);
    2. Турбонаддув (Твин-скролл) — сокращение турбоямы (+8% крутящего момента за уровень);
    3. Спортивные шины и Подвеска (Drift Camber) — расширение угла заноса (с 40° до
    65°) и термостойкости (+15°C); 4. Нитро-система — расширение емкости (с 1 до 3
    баллонов) и силы импульса (+20% тяги).'
  - 'Разблокировка трасс и режимов: Tier 1: Downtown Loop (Кольцевая 1.8 км, широкие
    полосы); Tier 2: Neon Highway Sprint (Спринт 3.5 км точка-в-точку, трафик); Tier
    3: Port Docks Drift Arena (Техничный трек, шпильки 180°, требование к очкам стиля
    >15 000); Tier 4-5: Дуэли «Pink Slip» 1-на-1 против боссов синдиката.'
  - 'Визуальный стайлинг и престиж: разблокировка неоновой подсветки днища (бирюзовый,
    пурпурный, кислотно-зеленый), кастомных винилов кузова и 6 оттенков цветного дыма
    из-под колес при заносе.'
  mechanics:
  - name: Аркадный Срыв в Дрифт и Инерционная Перекладка
    role_in_loop: Фундаментальный двигатель геймплея и первичный источник заряда нитро-системы
    player_decision: В какой миллисекундный момент перед апексом сорвать ось ручником,
      под каким углом удерживать занос газом и когда начать перекладку инерции в контр-поворот,
      чтобы не потерять скорость.
    input_mapping: 'Клавиатура: Вход в поворот A/D + кратковременный Пробел (ручник)
      на 0.22 с, стабилизация частыми нажатиями W (газ) и контррулением A/D. Тачскрин:
      виртуальный аналоговый стик руления влево/вправо + кнопка с иконкой ручника
      (Handbrake tap) справа.'
    states:
    - 'GRIP_RUNNING: Прямолинейное движение или плавный поворот с полным поперечным
      зацепом шин (SlipAngle < 12°)'
    - 'DRIFT_INITIATING: Кратковременный срыв задней оси при нажатии ручника, падение
      латерального трения на 65% (0.0-0.35 с)'
    - 'DRIFT_SUSTAINED: Стабильный занос под углом 25°-60°, генерация очков стиля
      и заряда нитро'
    - 'DRIFT_TRANSITION: Быстрая инерционная перекладка кузова в противоположную сторону
      (Scandi Flick) с сохранением комбо'
    - 'SPINOUT_FAIL: Критический угол заноса (>68°) или падение скорости ниже 35 км/ч
      с потерей управления и сбросом комбо'
    parameters:
    - name: Время срабатывания срыва ручником
      value: 0.22 с
      tuning_note: При >0.4 с управление ощущается ватным и неотзывчивым; при <0.1
        с машина срывается мгновенно, теряя вес кузова.
    - name: Оптимальный рабочий угол заноса
      value: 45.0 градусов
      tuning_note: При снижении до 25° дрифт перестает выглядеть эффектно; при увеличении
        до 65° игроку невозможно парировать занос без разворота.
    - name: Коэффициент падения латерального трения
      value: 0.35 (падение на 65%)
      tuning_note: При >0.55 машина не уходит в скольжение и мгновенно выравнивается;
        при <0.20 машина неуправляемо улетает с трека.
    - name: Минимальная скорость входа в дрифт
      value: 45.0 км/ч
      tuning_note: При <20 км/ч занос инициируется на парковочных скоростях без динамики;
        при >80 км/ч невозможно зайти в медленные шпильки.
    - name: Окно удержания комбо при перекладке
      value: 0.85 с
      tuning_note: При <0.4 с переложить машину между связками поворотов без сброса
        счета невозможно; при >1.5 с комбо обесценивается.
    feedback_layers:
    - 'Визуал/VFX: Густые объемные клубы бирюзового дыма из-под задних арок (particle
      emitter, 60 част/с), черные следы жженой резины на мокром асфальте (decal system),
      динамический крен кузова 6.5° на амортизаторах.'
    - 'Звук (Web Audio): Пронзительный двухтональный визг покрышек (FM-синтез с модуляцией
      частоты 520 Гц -> 740 Гц в зависимости от угла заноса), басовитый рев прямоточного
      выхлопа с отстрелами антилага при сбросе газа (Noise burst 80 мс).'
    - 'Камера (импульс/зум): Динамическое смещение точки обзора на внешнюю дугу поворота
      (Spring Arm lag 0.18 с), легкий голландский угол наклона камеры (Roll 4.5°)
      навстречу направлению заноса.'
    - 'UI/Тактильность: Полукруглая неоновая дуга угла дрифта вокруг спидометра (зеленая
      зона 35°-55°, красная критическая зона >60°), тикающий счетчик очков с плавающими
      цифрами (+250 PTS), короткая виброотдача 45 мс на мобильных устройствах при
      срыве оси.'
    failure_mode: Игрок передерживает руль без контрруления или зажимает ручник дольше
      0.5 с -> угол заноса превышает критические 68° -> разворот на 360° (Spinout),
      падение скорости до 0 км/ч и сброс комбо очков.
    mastery_curve: Новичок на 30-й секунде дрифтует короткими рывками по 1 секунде
      с частыми разворотами и ударами об отбойники; эксперт на 10-м заезде связывает
      5 поворотов подряд непрерывной перекладкой инерции, удерживая угол 52° в 20
      сантиметрах от стен.
    counterplay: Трасса сужается в апексе, внешняя дуга покрыта лужами с падением
      сцепления на 30%, а соперники физически блокируют свободную траекторию заноса.
    synergies:
    - Заряжает шкалу «Кинетический Нитро-Инжектор» со скоростью до 25% емкости за
      секунду глубокого заноса.
    - Активирует и разгоняет множитель «Лезвие бритвы» при скольжении вблизи отбойников.
    - Генерирует базовые очки стиля для выполнения дрифт-контрактов Синдиката.
    why_unique: 'В отличие от бинарного дрифта в мобильных аркадах (нажал кнопку —
      машина едет по рельсам заноса), здесь реализована честная аркадная физика с
      переносом массы: угол и радиус полностью поддаются микроконтролю газом и контррулением.'
    pseudocode: "function updateDriftMechanic(vehicle, input, dt) {\n  const slipAngle\
      \ = calculateSlipAngle(vehicle.velocity, vehicle.forwardVector);\n  if (input.handbrake\
      \ && vehicle.speedKmh > 45.0) {\n    vehicle.lateralFriction = Math.max(0.35,\
      \ vehicle.lateralFriction - dt * 2.5);\n    vehicle.isDrifting = true;\n  }\
      \ else if (!vehicle.isDrifting && slipAngle > 18.5) {\n    vehicle.isDrifting\
      \ = true;\n  }\n  if (vehicle.isDrifting) {\n    const driftAngleDeg = Math.abs(slipAngle\
      \ * (180 / Math.PI));\n    if (driftAngleDeg > 68.0) triggerSpinout(vehicle);\n\
      \    else vehicle.driftScore += (vehicle.speedKmh * 0.5) * (driftAngleDeg /\
      \ 45.0) * dt * 100;\n    vehicle.nitroCharge = Math.min(100, vehicle.nitroCharge\
      \ + (driftAngleDeg / 45.0) * 25.0 * dt);\n    spawnDriftSmoke(vehicle.rearTires,\
      \ driftAngleDeg);\n  }\n}"
  - name: Кинетический Нитро-Инжектор с Перегрузкой Турбины
    role_in_loop: Главный источник взрывного ускорения, инструмент тактического обгона
      и компенсации ошибок в заносе
    player_decision: Сжечь ли 1 баллон сразу на выходе из апекса для мгновенного набора
      скорости или накопить 3 полных баллона для активации сверхмощного режима «Overdrive
      Burn» на длинном финишном хайвее.
    input_mapping: 'Клавиатура: Зажатие клавиши Shift или клавиши E. Тачскрин: Большая
      круглая кнопка «NITRO» в правом нижнем углу экрана с визуальным индикатором
      3 секций заряда.'
    states:
    - 'NITRO_IDLE: Накопитель закиси азота пассивен, идет зарядка от дрифта и рискованной
      езды'
    - 'NITRO_IGNITING: Момент детонации (0.0–0.15 с), резкий скачок крутящего момента
      +60%'
    - 'NITRO_ACTIVE_BURNING: Постоянный форсаж, ускорение до лимита +45 км/ч, расширенный
      FOV до 85°'
    - 'NITRO_OVERDRIVE: Активация при сжигании 3 баллонов подряд: супер-ускорение
      +65 км/ч и пробивание сопротивления воздуха'
    - 'NITRO_EXHAUSTED: Опустошение баллонов, плавный возврат камеры и параметров
      тяги в норму (0.6 с)'
    parameters:
    - name: Длительность форсажа одного баллона
      value: 2.20 с
      tuning_note: При >3.5 с нитро становится слишком дешевым и стирает необходимость
        дрифта; при <1.2 с игрок не успевает совершить тактический обгон.
    - name: Прирост пиковой скорости при нитро
      value: +45.0 км/ч
      tuning_note: При <25 км/ч форсаж визуально не впечатляет; при >70 км/ч машина
        на WebGL-трассах становится неуправляемым снарядом.
    - name: Мгновенный импульс крутящего момента
      value: +60.0% к Torque
      tuning_note: При <30% на выходе из поворота сохраняется турбояма; при >100%
        срывает переднюю ось даже на прямой.
    - name: Максимальная емкость баллонов
      value: 3 заряда (100 ед/баллон)
      tuning_note: 1 заряд лишает выбора накопления; 5 зарядов перегружают интерфейс
        и делают нитро бесконечным.
    - name: Угол расширения FOV камеры
      value: с 60.0° до 85.0° (дельта +25°)
      tuning_note: При дельте <10° теряется кинематографическое ощущение гипер-скорости;
        при >35° картинка превращается в «рыбий глаз» с искажением дистанции.
    feedback_layers:
    - 'Визуал/VFX: Двухметровые бирюзовые языки пламени с искрами из сдвоенного выхлопа,
      радиальное размытие по краям экрана (Radial Blur pass strength 0.45), неоновые
      световые шлейфы за задними фонарями.'
    - 'Звук (Web Audio): Низкочастотный глухой хлопок детонации (Sub-bass drop 65
      Гц), переходящий в высокочастотный турбинный вой компрессора (Sweep 1.2 кГц
      -> 3.8 кГц) и шипение клапана сброса Wastegate.'
    - 'Камера (импульс/зум): Резкий толчок камеры назад на 0.6 м с последующим плавным
      удержанием, высокочастотная вибрация (Micro-shake frequency 40 Гц, amplitude
      0.25) для имитации перегрузки.'
    - 'UI/Тактильность: Заполнение 3 сегментов неонового резервуара с бирюзовой пульсацией,
      цифры спидометра вспыхивают ярко-голубым светом, продолжительный плотный виброотклик
      на мобильных устройствах во время удержания.'
    failure_mode: Активация нитро в середине заноса под критическим углом >50° или
      перед глухим поворотом -> спорткар теряет управляемость и впечатывается в бетонный
      отбойник на скорости 220 км/ч с потерей 80% скорости.
    mastery_curve: Новичок жжет нитро хаотично сразу после наполнения даже на входе
      в повороты; эксперт точно рассчитывает тайминг инициирования в апексе шпильки,
      используя нитро как гироскопический выпрямитель кузова с катапультированием
      на прямую.
    counterplay: Ограниченная длина прямых участков трассы, плотный трафик на узком
      хайвее и соперники, активно подрезающие траекторию ускорения.
    synergies:
    - Питается напрямую от механик «Аркадный срыв в дрифт» и «Множитель Лезвие бритвы».
    - Позволяет мгновенно ворваться в зону «Контактного слипстрима» лидирующего соперника.
    - Нивелирует потерю скорости при легких скользящих контактах с отбойниками.
    why_unique: 'Система разделена на 3 дискретных тактических заряда с синергией:
      сжигание одиночного заряда дает стабильный разгон, а удержание всех трех активирует
      скрытый режим «Overdrive», меняющий аэродинамику машины.'
    pseudocode: "function updateNitroMechanic(vehicle, input, dt) {\n  if (input.nitro\
      \ && vehicle.nitroTanks > 0) {\n    vehicle.isNitroActive = true;\n    vehicle.nitroTankCharge\
      \ -= 45.45 * dt; // Сгорание 1 баллона за 2.2 с\n    vehicle.appliedTorque *=\
      \ 1.60;\n    vehicle.maxSpeedKmh = vehicle.baseMaxSpeed + 45.0;\n    camera.targetFov\
      \ = 85.0;\n    emitNitroFlame(vehicle.exhaustPipes);\n    if (vehicle.nitroTankCharge\
      \ <= 0) {\n      vehicle.nitroTanks--;\n      vehicle.nitroTankCharge = vehicle.nitroTanks\
      \ > 0 ? 100.0 : 0.0;\n    }\n  } else {\n    vehicle.isNitroActive = false;\n\
      \    camera.targetFov = 60.0;\n  }\n}"
  - name: Множитель Риска «Лезвие Бритвы» (Razor Edge Near-Miss)
    role_in_loop: Катализатор риска и награды, определяющий разрыв между безопасной
      ездой и рекордным результатом заезда
    player_decision: Прижиматься ли бортом в заносе к бетонному ограждению на критические
      20–40 см ради множителя x4.0 и мгновенной зарядки нитро или держать безопасный
      зазор в 1.5 метра с риском проиграть заезд по таймеру.
    input_mapping: Управление траекторией через руление (A/D / виртуальный стик) и
      ювелирные микро-коррекции газа (W / Тач-зона) во время прохождения поворотов
      и обгонов.
    states:
    - 'SAFE_ZONE: Дистанция до препятствий и соперников > 1.2 м (множитель x1.0, стандартный
      темп зарядки)'
    - 'PROXIMITY_ACTIVE: Дистанция от 0.35 м до 1.2 м (множитель x2.0–x3.0, искры
      от отбойника, ускоренная зарядка)'
    - 'RAZOR_EDGE_CRITICAL: Экстремальная дистанция < 0.35 м (максимальный множитель
      x4.0, сверхбыстрая зарядка нитро +300%)'
    - 'COLLISION_RESET: Физический удар о препятствие с перегрузкой > 3.5G (сброс
      комбо до x1.0, штраф к скорости -40%)'
    parameters:
    - name: Пороговая дистанция активации риска
      value: 1.20 м
      tuning_note: При >2.0 м множитель срабатывает случайно даже на середине полосы;
        при <0.6 м окно риска становится слишком узким для 60 FPS браузера.
    - name: Критическая дистанция максимума x4.0
      value: 0.35 м
      tuning_note: При <0.15 м погрешность физических коллайдеров Rapier вызывает
        ложные столкновения; при >0.6 м риск перестает вызывать адреналин.
    - name: Максимальный комбо-множитель
      value: x4.0
      tuning_note: При значении x2.0 стимул рисковать недостаточен; при x8.0 возникает
        дисбаланс, ломающий экономику очков за один поворот.
    - name: Окно удержания множителя вне риска
      value: 1.80 с
      tuning_note: При <0.8 с множитель сгорает на прямых участках между поворотами;
        при >3.5 с множитель держится пассивно без риска.
    - name: Штрафной порог силы удара коллизии
      value: 3.50 G (34.3 м/с²)
      tuning_note: При <1.5 G легкие касания отбойника спойлером сбрасывают комбо;
        при >6.0 G даже лобовой таран не наказывает игрока.
    feedback_layers:
    - 'Визуал/VFX: Плотный каскад ярких желто-оранжевых искр из зоны сближения борта
      с бетоном (Spark emitter, 80 част/с), пульсирующая неоновая рамка вокруг экрана
      (Vignette edge glow).'
    - 'Звук (Web Audio): Нарастающий металлический скрежет и звон трения металла об
      абразив (Metal-on-concrete resonance 1.8 кГц), учащающийся пульсирующий синтезаторный
      бип комбо-множителя.'
    - 'Камера (импульс/зум): Легкое приближение камеры к корме автомобиля (зум -0.4
      м к фокусному расстоянию) с динамическим акцентом на сторону сближения.'
    - 'UI/Тактильность: Всплывающий золотой бейдж «RAZOR EDGE x4.0» по центру экрана
      с прогресс-баром затухания, серия резких микро-вибраций (Haptic ticks 25 мс)
      при удержании критической зоны.'
    failure_mode: Игрок смещает спорткар на 10 см ближе положенного -> происходит
      жесткий контакт кузова (Impulse > 3.5G) -> множитель мгновенно сбрасывается
      с x4.0 до x1.0 со звоном разбитого стекла, шкала очков гаснет.
    mastery_curve: Новичок держится строго по центру полосы, набирая скромные x1.0–x1.5;
      мастер синдиката облизывает каждый отбойник на всей длине трассы, удерживая
      постоянный x4.0 множитель и генерируя полный баллон нитро за 2 секунды.
    counterplay: Разрывы в отбойниках, выступающие бетонные опоры мостов, неожиданно
      маневрирующий городской трафик и попытки ИИ прижать игрока к стене.
    synergies:
    - Ускоряет генерацию шкалы «Кинетический Нитро-Инжектор» до 4-кратного темпа.
    - Умножает базовые очки от механики «Аркадный Срыв в Дрифт».
    - Максимизирует кредитную награду за выполнение контрактов в мета-прогрессии Синдиката.
    why_unique: Механика непрерывно считывает лучом Raycast расстояние до препятствий
      в реальном времени, создавая плавную градацию множителя (от x1.0 до x4.0) вместо
      бинарного триггера «Near Miss».
    pseudocode: "function updateRazorEdgeMechanic(vehicle, trackWalls, dt) {\n  const\
      \ minWallDist = raycastMinDistance(vehicle.bodyColliders, trackWalls);\n  if\
      \ (minWallDist < 1.20 && vehicle.speedKmh > 60.0) {\n    const riskFactor =\
      \ 1.0 - Math.min(1.0, Math.max(0.0, (minWallDist - 0.35) / 0.85));\n    vehicle.riskMultiplier\
      \ = 1.0 + riskFactor * 3.0; // от 1.0x до 4.0x\n    vehicle.riskTimer = 1.80;\
      \ // Сброс таймера затухания\n    emitWallSparks(vehicle.sidePosition, riskFactor);\n\
      \  } else {\n    vehicle.riskTimer -= dt;\n    if (vehicle.riskTimer <= 0) vehicle.riskMultiplier\
      \ = Math.max(1.0, vehicle.riskMultiplier - dt * 2.0);\n  }\n  if (vehicle.lastImpactForceG\
      \ > 3.50) {\n    vehicle.riskMultiplier = 1.0;\n    triggerComboBreakFeedback();\n\
      \  }\n}"
  - name: Адаптивный Дуэльный Прессинг и Аэродинамический Слипстрим
    role_in_loop: Драматический регулятор плотности заезда, исключающий одиночную
      езду и создающий контактную борьбу
    player_decision: Использовать ли воздушный карман впереди идущего соперника для
      набора скорости на прямой или сместиться в сторону для защиты от контратаки
      накатывающего сзади бота.
    input_mapping: Позиционирование болида точно в створе кормы соперника на дистанции
      от 2.0 до 15.0 метров с последующим выходом на обгон резким отклонением стика/клавиш
      руления (A/D).
    states:
    - 'CLEAN_AIR: Одиночное движение вне воздушных потоков соперников (стандартная
      аэродинамика)'
    - 'DRAFTING_ACTIVE: Нахождение в аэродинамическом конусе соперника (снижение сопротивления
      воздуха на 40%, пассивный разгон +18%)'
    - 'SLIPSTREAM_SLINGSHOT: Выход из кармана с накопленной кинетической энергией
      (бонус к разгону на 1.5 секунды)'
    - 'RUBBERBAND_PRESS: Адаптивная корректировка ИИ: отстающие боты получают до +40%
      тяги, оторвавшийся лидер слегка сбавляет темп'
    parameters:
    - name: Длина зоны действия слипстрима
      value: 15.0 м
      tuning_note: При >25.0 м эффект работает через пол-трассы без необходимости
        точного пристраивания; при <6.0 м попасть в зону на высокой скорости почти
        невозможно.
    - name: Снижение лобового сопротивления в кармане
      value: -40.0% Drag
      tuning_note: При значении <-60% машина ускоряется как ракета без нитро; при
        >-15% эффект слипстрима слабо ощутим игроком.
    - name: Максимальный гандикап адаптивной тяги ИИ
      value: +40.0% / -25.0%
      tuning_note: При завышении (+80%) боты неестественно телепортируются за игроком;
        при занижении (+10%) заезд теряет накал при первом же отрыве.
    - name: Ширина аэродинамического тоннеля
      value: 2.20 м
      tuning_note: При >4.0 м слипстрим ловится слишком легко; при <1.2 м малейшее
        смещение выбивает игрока из зоны потока.
    - name: Время действия эффекта выстреливания (Slingshot)
      value: 1.50 с
      tuning_note: При <0.6 с бонус пропадает до момента завершения маневра обгона;
        при >3.0 с обгон становится тривиальным.
    feedback_layers:
    - 'Визуал/VFX: Неоновые полупрозрачные вихревые струи воздуха (Aerodynamic Streamlines),
      срывающиеся со спойлера соперника, белые линии разрежения по бокам экрана.'
    - 'Звук (Web Audio): Приглушение общего гула ветра (Low-pass filter cutoff 800
      Гц в зоне разрежения) с резким свистящим «вздохом» воздуха при выходе из слипстрима.'
    - 'Камера (импульс/зум): Динамическое натяжение камеры (Camera pull-in на 0.3
      м ближе к кузову) с легким эффектом кинематографической тряски при выходе на
      обгон.'
    - 'UI/Тактильность: Индикатор наведения в виде неоновой мишени «DRAFTING» над
      машиной соперника, заполняющийся круговой прогресс-бар заряда выстреливания
      (Slingshot Ready).'
    failure_mode: Игрок слишком долго сидит в слипстриме на скорости 220 км/ч и не
      успевает сманеврировать перед торможением соперника -> таран кормы, потеря всего
      темпа и разрушение аэродинамики.
    mastery_curve: Новичок объезжает соперников по широким траекториям без использования
      драфтинга; ветеран синдиката использует слипстрим как бесплатный нитро-разгон
      перед каждой связкой, экономя баллоны закиси азота.
    counterplay: ИИ-соперники отслеживают зеркала заднего вида и совершают защитные
      блокирующие маневры (Weaving block), пытаясь перекрыть воздушный тоннель.
    synergies:
    - Компенсирует отсутствие нитро на длинных прямых участках трассы Neon Highway.
    - Сочетается с «Кинетическим Нитро-Инжектором» для совершения двойного гипер-обгона.
    - Позволяет быстро вернуться в лидирующую группу после ошибки или разворота в
      дрифте.
    why_unique: 'Слипстрим совмещен с адаптивной системой дуэльного ИИ, создавая эффект
      «натянутой резинки»: дуэль всегда решается контактной борьбой на последних 100
      метрах дистанции, исключая скучные заезды с минутным отрывом.'
    pseudocode: "function updateSlipstreamAndAI(player, aiCars, dt) {\n  for (let\
      \ ai of aiCars) {\n    const distToPlayer = player.position.distanceTo(ai.position);\n\
      \    const inDraftZone = isInsideDraftingCone(player, ai, 15.0, 2.20);\n   \
      \ if (inDraftZone && player.speedKmh > 100.0) {\n      player.aerodynamicDrag\
      \ = player.baseDrag * 0.60; // -40% сопротивления\n      player.draftTime +=\
      \ dt;\n      emitDraftStreamlines(ai.rearPosition, player.frontPosition);\n\
      \    }\n    const gapDelta = ai.trackDistance - player.trackDistance;\n    const\
      \ rubberbandMult = Math.min(1.40, Math.max(0.75, 1.0 - gapDelta * 0.025));\n\
      \    ai.engineTorque = ai.baseTorque * rubberbandMult;\n  }\n}"
  - name: Тепловой Менеджмент Сцепления Шин и Температурный Зацеп
    role_in_loop: Физический регулятор длительности непрерывного заноса, предотвращающий
      монотонное бесконечное скольжение
    player_decision: Продолжать ли скольжение на перегретых шинах с риском потерять
      контроль в пользу набора очков или кратковременно стабилизировать болид на прямой
      для охлаждения резины до оптимальных 90°C.
    input_mapping: Управление через прекращение зажатия ручника, выравнивание руля
      прямо и движение накатом для охлаждения набегающим потоком воздуха.
    states:
    - 'TIRE_COLD: Температура шин < 60°C (пониженный базовый зацеп на 15%, медленная
      инициация заноса)'
    - 'TIRE_OPTIMAL: Температура шин 70°C–105°C (идеальный баланс зацепа и скольжения,
      максимальная управляемость)'
    - 'TIRE_OVERHEAT: Температура шин > 120°C (падение латерального зацепа на 45%,
      машина «плывет», дым становится черным)'
    - 'TIRE_COOLING: Прямолинейное движение без пробуксовки, активное охлаждение встречным
      воздухом (-12°C/сек)'
    parameters:
    - name: Оптимальный диапазон температуры шин
      value: 70.0°C – 105.0°C
      tuning_note: При слишком узком диапазоне (80-90°C) игрок постоянно перегревает
        шины; при широком (40-150°C) механика теряет тактическую значимость.
    - name: Скорость нагрева шин в заносе
      value: +18.5°C в секунду
      tuning_note: При >30°C/с шины перегреваются за 2 секунды дрифта; при <8°C/с
        перегреть шины на трассе становится невозможно.
    - name: Скорость охлаждения набегающим потоком
      value: -12.0°C в секунду
      tuning_note: При <5°C/с остудить резину на коротких прямых невозможно; при >25°C/с
        температура мгновенно сбрасывается.
    - name: Коэффициент падения зацепа при перегреве (>120°C)
      value: -45.0% Lateral Grip
      tuning_note: При значении <-70% машина мгновенно улетает с трассы; при >-20%
        перегрев не создает ощутимой угрозы разворота.
    - name: Критическая температура кипения компаунда
      value: 140.0°C
      tuning_note: Потолок шкалы, при котором шины полностью теряют сцепление с асфальтом.
    feedback_layers:
    - 'Визуал/VFX: Плавное изменение цвета дыма из-под арок от полупрозрачного бирюзового
      к густому едкому серо-черному с раскаленными красными частицами корда при перегреве
      >120°C.'
    - 'Звук (Web Audio): Изменение тембра визга резины от чистого визжащего свиста
      (High resonant pitch) к хриплому рваному скрежету (Distorted low friction scrub).'
    - 'Камера (импульс/зум): Нарастающая нестабильность траектории камеры, легкое
      рыскание (Yaw wobble) при потере сцепления задней оси.'
    - 'UI/Тактильность: Термальный индикатор шин в углу спидометра (4 пиктограммы
      колес, меняющие цвет от синего к зеленому, затем к пульсирующему оранжево-красному),
      предупреждающий звуковой зуммер при 125°C.'
    failure_mode: Игрок непрерывно дрифтует по кругу дольше 6 секунд -> температура
      шин достигает 135°C -> машина теряет поперечное сопротивление и центробежной
      силой выносится во внешнее ограждение.
    mastery_curve: Новичок игнорирует температуру и перегревает шины во втором повороте,
      теряя управление; мастер синдиката чередует глубокий дрифт с секундными прокатами
      по прямой, удерживая температуру ровно в зеленой зоне 90°C.
    counterplay: Длинные затяжные дуги поворотов на трассе Port Docks Drift вынуждают
      игрока балансировать между риском перегрева и удержанием комбо очков.
    synergies:
    - Ограничивает бесконечное удержание механики «Аркадный Срыв в Дрифт».
    - Заставляет грамотно использовать «Кинетический Нитро-Инжектор» для быстрого
      прострела прямых и охлаждения шин.
    - Прокачка спортивных шин в мета-гараже увеличивает термостойкость компаунда на
      +15°C за уровень.
    why_unique: Вместо абстрактной полоски выносливости игра симулирует термодинамику
      трения, где управляемость динамически меняется в зависимости от агрессивности
      вождения.
    pseudocode: "function updateTireThermals(vehicle, dt) {\n  const isSlipping =\
      \ vehicle.isDrifting || Math.abs(vehicle.wheelSlip) > 0.2;\n  if (isSlipping)\
      \ {\n    const heatRate = 18.5 * (vehicle.speedKmh / 100.0) * (vehicle.driftAngle\
      \ / 45.0);\n    vehicle.tireTemp = Math.min(140.0, vehicle.tireTemp + heatRate\
      \ * dt);\n  } else {\n    const coolRate = 12.0 * (vehicle.speedKmh / 120.0);\n\
      \    vehicle.tireTemp = Math.max(25.0, vehicle.tireTemp - coolRate * dt);\n\
      \  }\n  if (vehicle.tireTemp > 120.0) {\n    const overheatFactor = (vehicle.tireTemp\
      \ - 120.0) / 20.0;\n    vehicle.lateralGrip = vehicle.baseLateralGrip * (1.0\
      \ - overheatFactor * 0.45);\n    setTireSmokeColor(vehicle, 'BURNT_BLACK');\n\
      \  } else {\n    vehicle.lateralGrip = vehicle.baseLateralGrip;\n    setTireSmokeColor(vehicle,\
      \ 'NEON_CYAN');\n  }\n}"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 75
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - description: Модели состояния гонки, профиля игрока, гаража и настроек
    name: Domain / State Layer
  - description: Симуляция твердых тел, контроллер авто, коллизии и лучи подвески
    name: Physics Engine (Rapier3D)
  - description: Сцена Three.js, кастомные шейдеры, инстансинг, свет и чейз-камера
    name: Rendering Engine (Three.js r170+)
  - description: Glassmorphism HUD, экранные контроллеры ввода и интерфейс Гаража
    name: UI / Presentation Layer (HTML5/DOM & Canvas Overlay)
  - description: Адаптер интеграции с Playgama Bridge 2.x (Auth, Cloud Storage, Ads,
      Leaderboards)
    name: Platform Bridge Layer
  modules:
  - description: Инициализация сцены, освещения, рендерера и шейдеров мокрого асфальта
    name: RenderManager
  - description: Управление физическим миром Rapier3D и контроллером автомобиля RaycastVehicle
    name: VehiclePhysicsController
  - description: Построение сплайнов трассы, навигация ботов, расчет слипстрима и
      раббербендинга
    name: TrackAIMaster
  - description: Обработка дрифта, начисление очков, комбо-множители и управление
      зарядами нитро
    name: DriftAndNitroSystem
  - description: Управление партиклами дыма, пламени выхлопа, следами шин и динамикой
      камеры
    name: FXAndCameraRig
  - description: Взаимодействие с Playgama Bridge SDK, сохранение данных, реклама
      и лидерборды
    name: PlaygamaBridgeAdapter
monetization:
  strategy_summary: 'Гибридная этичная модель монетизации для HTML5/Web: ненавязчивый
    Rewarded Video за удвоение наград и реванш + Interstitial между заездами с кулдауном
    90+ секунд + IAP на покупку кредитов и эксклюзивного неонового стайлинга.'
  rewarded_placements:
  - id: double_rewards
    name: Удвоение Награды за Заезд
    benefit: Удвоение всех заработанных за заезд кредитов и очков репутации (x2)
    cooldown_or_limit: Без лимита (1 раз за завершенный заезд)
    trigger_moment: Экран победы/результатов заезда
  - id: instant_revive
    name: Мгновенный Реванш
    benefit: Мгновенный рестарт заезда без потери накопленного комбо-множителя очков
    cooldown_or_limit: 1 раз за заезд
    trigger_moment: Экран поражения при провале заезда
  interstitial_placements:
  - trigger_event: Выход в главное меню после завершения гонки
    cooldown_seconds: 90
    conditions: Показывается только если игрок сыграл не менее 2 полных заездов и
      не смотрел Rewarded Ad в течение последних 90 сек
  in_app_purchases:
  - sku: iap_credits_small
    name: Пакет Кредитов 'Стритрейсер'
    description: Стартовый капитал 25 000 кредитов для мгновенной прокачки двигателя
      до Stage 2
    price_tier: $0.99
    reward: 25 000 игровых кредитов
  - sku: iap_credits_large
    name: Пакет Кредитов 'Синдикат'
    description: Большой запас 100 000 кредитов для полной прокачки всех узлов спорткара
    price_tier: $2.99
    reward: 100 000 игровых кредитов
  - sku: iap_skin_phantom
    name: Премиум Набор Стайлинга 'Midnight Phantom'
    description: Эксклюзивный неоновый винил 'Midnight Phantom' + золотая подсветка
      днища + фиолетовый дым покрышек
    price_tier: $1.99
    reward: Уникальный скин кузова, золотой неон, фиолетовый дым
  fairness_rules:
  - 'Никакой энергии, бензина или платного ожидания ремонта: заезды доступны бесконечно
    без ограничений'
  - Все 3 трассы и ключевые апгрейды можно открыть исключительно за счет игрового
    мастерства и заработанных кредитов
  - Рекламные ролики полностью добровольны и предлагают понятную ценность (удвоение
    выигрыша, моментальный реванш)
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - gamepix
  - telegram
  - standalone_web
  initialization_flow:
  - 1. Инициализация Bridge.init() с автоопределением платформы (Yandex / VK / Web)
  - 2. Загрузка сохраненного профиля игрока из Cloud Storage (Bridge.storage.get)
  - 3. Синхронизация звуковых настроек и локализации (Bridge.game.getLanguage)
  - 4. Инициализация баннерной и полноэкранной рекламы (Bridge.advertisement)
  - 5. Скрытие прелоадера и запуск главного меню Гаража
  cloud_save_keys:
  - player_profile
  - unlocked_tracks
  - car_upgrades
  - customization_slots
  - best_lap_times
  - drift_high_scores
  leaderboards:
  - leaderboard_downtown_loop
  - leaderboard_neon_highway
  - leaderboard_port_drift
  ads_integration:
    interstitial_cooldown: 90
    rewarded_ad_available_check: true
  lifecycle_hooks:
  - Bridge.game.on('pause', () => pauseGamePhysics())
  - Bridge.game.on('resume', () => resumeGamePhysics())
  - Bridge.storage.set() при каждой покупке тюнинга и завершении заезда
art:
  style_name: Cyber-Neon Stylized Low-Poly / Wet Asphalt Realism
  camera_perspective: Third-Person Dynamic Chase Camera (шейк при ускорении, наклон
    при дрифте, расширение FOV до 85° при нитро)
  camera_fov: 65
  camera_pitch_angle: 15
  environment_theme: 'Ночной залитый дождем мегаполис: отражающие неоновые вывески,
    мокрый асфальт, подвесные мосты, эстакады и портовые краны'
  character_proportions: Реалистичные спортивные пропорции купе (длина 4.4м, ширина
    1.85м, высота 1.28м) с заниженным клиренсом, широким боди-китом и антикрылом
  lighting_setup: 'Контрастное ночное освещение: направленный лунный свет (DirectionalLight,
    intensity 0.4), точечные цветные неоны (PointLights), прожекторы фар (SpotLights
    с объемным конусом) и световые отражения на мокром асфальте'
  color_palette:
    background_night: '#0B0C16'
    hazard_amber: '#FFB800'
    neon_cyan: '#00F0FF'
    neon_magenta: '#FF0055'
    nitro_flame: '#00E5FF'
    ui_dark_glass: '#0D0E15E6'
    wet_asphalt: '#15171F'
  vfx_list:
  - Густой процедурный дым из-под колес при заносе с подсветкой неоном днища
