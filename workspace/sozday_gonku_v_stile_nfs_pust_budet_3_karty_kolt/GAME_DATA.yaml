  - path: threejs/game_map_and_world_design.md
    role: supporting
    reason: 'Позволяет процедурно собрать три разнообразные трассы: ночное городское
      кольцо, прямое шоссе и техничный портовый трек.'
  - path: threejs/procedural_mesh_builder.md
    role: supporting
    reason: Генерирует стилизованные low-poly здания ночного мегаполиса, отбойники
