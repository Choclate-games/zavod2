  selected_id: D1
  selected_name: 'Ночной Синдикат: Дуэли и Контракты'
  selection_reason: Направление D1 максимально точно и бескомпромиссно реализует исходный
    заказ пользователя на гонку в духе Need for Speed с 3 картами. Чейз-камера от
    третьего лица создает глубокое погружение и идеальное ощущение скорости на мокром
    неоновом асфальте. Аркадный цикл 'занос заряжает нитро -> нитро дает мощный рывок'
    моментально понятен с первой секунды на телефоне и ПК без обучения. Все три запрошенные
    карты (Кольцо по даунтауну, Спринт по шоссе, закрытый дрифт-Трек) органично раскрывают
    разные аспекты управления машиной на базе проверенной физики Rapier3D с высокой
    частотой кадров.
  rejected_reasons:
  - 'D2 (Апекс-Мастер: Скоростной Тайм-Атак) отвергнуто из-за смещения в строгий симуляторный
    тайм-триал с жестким требованием точного торможения; бамперная камера скрывает
    внешний вид и кастомизацию автомобиля (визитная карточка NFS), а высокий порог
    входа снижает удержание казуальной аудитории на мобильных устройствах.'
  - 'D3 (Перехват: Прорыв из Окружения) отвергнуто из-за отдаления камеры в изометрию
    сверху: ракурс с высоты птичьего полета нивелирует чувство скорости и драйв от
    управления машиной от третьего лица, превращая гонку в аркадный тактический боевик
    с разрушением окружения вместо аутентичного стрит-рейсинга.'
  what_it_is_not:
  - Никаких волн врагов, зомби или авторогаликов с карточками в стиле Vampire Survivors.
  - 'Никаких серых кубов вместо графики: весь мир собирается из стилизованной low-poly
    архитектуры с неоновым свечением и шейдером мокрого асфальта.'
  - 'Никакого экранного плавающего джойстика: управление четко разделено на удобные
    зоны тапов и удержания без потери контроля над машиной.'
  - 'Никакого рельсового автопилота со свайпами (как в мобильных спиноффах): игрок
    полностью и непрерывно контролирует физику, траекторию и газ машины.'
  - Никаких громоздких меню и искусственных таймеров ожидания на ремонт или бензин
    — мгновенный рестарт и переход между трассами.
  - волны врагов на арене
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - Физический контроллер автомобиля на базе RAPIER.DynamicRayCastVehicleController
    с дифференцированным сцеплением колес и управляемым ручником для срыва в занос.
  - Механика накопления нитро за счет поддержания угла дрифта и рискованного вождения
    с эффектным расширением FOV камеры и пламенем из выхлопа.
  - 'Полноценная реализация всех 3 заявленных карт: городское кольцо (Circuit), загородный
    спринт точка-в-точку (Sprint) и техничный автодром (Track).'
  - Адаптивный ИИ соперников (rubberband opposition), поддерживающий плотную контактную
    борьбу на протяжении всей дистанции заезда.
  signature_scene: Ночь, мокрый глянцевый асфальт под эстакадой ночного мегаполиса.
    Тюнингованный японский спорткар цвета полуночного ультрамарина запечатлен в глубоком
    управляемом заносе под 45 градусов, пролетая в сантиметрах от бетонного отбойника
    с неоновой рекламой. Задние колеса размыты от вращения и окутаны плотными клубами
    дыма, подсвеченными снизу фиолетовым неоном днища, а из двух сопел титанового
    глушителя вырывается яркое бирюзовое пламя закиси азота. Слева в контровом свете
    фар виден силуэт обгоняемого черного маслкара, а на мокрой дороге идеально отражаются
    вертикальные неоновые иероглифы и высотные башни на заднем плане.
  avoid_references:
  - 'Need for Speed: No Limits (запрещено копировать автопилот со свайпами и таймеры
    энергии)'
  - Asphalt 9 (запрещено превращать вождение в рельсовый раннер с акробатическими
    трюками в воздухе)
  - Traffic Racer (запрещено делать бесконечную прямую без поворотов и физики заноса)
  - Vampire Survivors (запрещено использовать сурвайвор-лупы с выбором карточек прокачки)
