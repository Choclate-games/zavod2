definition_of_done:
- Все 3 трассы (Downtown Loop, Neon Highway, Port Docks Drift) полностью реализованы,
  оптимизированы и проходимы от старта до финиша
- Контроллер автомобиля на RAPIER.DynamicRayCastVehicleController обеспечивает стабильную
  физику, управляемый дрифт ручником и четкий отклик на управление
- Реализовано раздельное сенсорное управление для мобильных устройств (лево/право,
  газ/тормоз/дрифт, нитро) и клавиатурная раскладка WASD/Space/Shift
- Механика дрифта корректно аккумулирует закись азота, а прожиг нитро сопровождается
  расширением FOV (65°->85°) и эффектами пламени/блюра
- 3 машины соперников под управлением адаптивного ИИ держат плотную контактную борьбу,
  огибают препятствия и ведут честный спринт на финише
- Система гаража позволяет улучшать 4 технических узла автомобиля и настраивать неоновую
  кастомизацию с сохранением в Cloud Storage
- 'Интегрирован Playgama Bridge 2.x: сохранение прогресса, показ Interstitial/Rewarded
  рекламы и 3 глобальные таблицы лидеров'
- Обеспечены стабильные 60 FPS на средних мобильных устройствах и в браузерах при
  строгом лимите Draw Calls < 75
- 'Игра осталась тем, что просили: игрок ведёт машину: руль, газ, трасса.'
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Выбор контракта и трассы -> Заезд на 60–90 сек (дрифт
  заряжает нитро -> мощный рывок на прямой -> контактный обгон соперников) -> Финиш
  в топ-3 -> Награда (кредиты + репутация) -> Тюнинг авто в гараже -> Доступ к новым
  трассам и сложным дуэлям.'
- 'Реализованы механики проекта: Аркадный Срыв в Дрифт и Инерционная Перекладка, Кинетический
  Нитро-Инжектор с Перегрузкой Турбины, Множитель Риска «Лезвие Бритвы» (Razor Edge
  Near-Miss), Адаптивный Дуэльный Прессинг и Аэродинамический Слипстрим.'
- Условие успеха (Занять 1-е место в кольцевой гонке (Downtown Loop, 2 круга по 1.8
  км быстрее 1:25.00), прийти первым в шоссейном спринте (Neon Highway, 3.5 км быстрее
  1:15.00) или набрать более 15 000 очков стиля в дрифт-режиме (Port Docks Drift,
  3 круга).) и условие проигрыша (Прийти к финишу ниже 3-го места в спринте или кольцевой
  гонке, не успеть доехать до контрольного чекпоинта до истечения таймера (0.00 сек)
  или набрать менее 8 000 очков дрифта на закрытом треке.) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Ночной Синдикат: Дуэли и Контракты».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Удвоение Награды за Заезд, Мгновенный
  Реванш); interstitial соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
