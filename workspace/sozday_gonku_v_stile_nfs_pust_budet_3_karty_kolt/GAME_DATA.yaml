  - path: stack/rapier3d.md
    role: core
    reason: Единый WebAssembly-движок физики для честных твердотельных столкновений
      спорткаров с отбойниками и симуляции колес.
  - path: threejs/vehicle_wheel_rig.md
    role: supporting
    reason: Задает корректный визуальный риг 4 колес с правильными осями вращения,
