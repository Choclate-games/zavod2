raw_prompt: Создай гонку в стиле нфс пусть будет 3 карты кольцевая спринт и трек
title: 'Ночной Синдикат: Дуэли и Контракты'
slug: sozday_gonku_v_stile_nfs_pust_budet_3_karty_kolt
genre: 3D Аркадный Автосимулятор
subgenre: Уличные ночные гонки с физикой дрифта и нитро
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web)
orientation: landscape
target_audience: 'Мужчины и женщины 12–35 лет, поклонники Need for Speed: Underground/Most
  Wanted, любители эффектных управляемых заносов, быстрых аркадных дуэлей и неоновой
  эстетики ночных мегаполисов.'
core_loop: Выбор контракта и трассы -> Заезд на 60–90 сек (дрифт заряжает нитро ->
  мощный рывок на прямой -> контактный обгон соперников) -> Финиш в топ-3 -> Награда
  (кредиты + репутация) -> Тюнинг авто в гараже -> Доступ к новым трассам и сложным
  дуэлям
hook: Выход из затяжной шпильки под 50 градусов в метре от бетонного отбойника с мгновенным
  подрывом бирюзового нитро, когда камера расширяет FOV до 85°, а соперник эффектно
  обходится по внутренней кромке в клубах подсвеченного неоном дыма!
player_fantasy: Неуловимый ночной уличный гонщик, виртуозно контролирующий мощный
  японский спорткар в миллиметровых заносах на мокром неоновом асфальте спящего мегаполиса.
session_model: Сессия состоит из 2–4 заездов длительностью по 60–90 секунд каждый
  в 3 различных форматах (Кольцо Downtown Loop на 2 круга по 1.8 км, Шоссейный Спринт
  Neon Highway на 3.5 км точка-в-точку, Техничный Дрифт-Трек Port Docks на 3 круга
  до 15 000 очков) с общим временем игровой сессии 4–7 минут.
unique_value_proposition: Полноценный аркадный стрит-рейсинг в браузере с 3 контрастными
  типами трасс, честной физикой сцепления колес Rapier3D, где занос — это не просто
  зрелище, а ключевой генератор закиси азота для победы над адаптивным контактным
  ИИ соперников.
vision: 'Создать самый сочный, визуально стильный и тактильно приятный аркадный автосимулятор
  на Playgama Bridge, передающий дух золотой эры уличных гонок: мокрый асфальт с отражениями,
  яркий неон, клубы дыма из-под колес, свист турбины и бешеное чувство скорости.'
elevator_pitch: Аркадная ночная гонка в духе классических NFS, где вы управляете заряженным
  японским спорткаром на трех контрастных трассах (Кольцо, Спринт, Дрифт-Трек), заряжаете
  закись азота управляемыми заносами и вырываете победу у агрессивных соперников на
  скоростях свыше 220 км/ч!
win_conditions: Занять 1-е место в кольцевой гонке (Downtown Loop, 2 круга по 1.8
  км быстрее 1:25.00), прийти первым в шоссейном спринте (Neon Highway, 3.5 км быстрее
  1:15.00) или набрать более 15 000 очков стиля в дрифт-режиме (Port Docks Drift,
  3 круга).
lose_conditions: Прийти к финишу ниже 3-го места в спринте или кольцевой гонке, не
  успеть доехать до контрольного чекпоинта до истечения таймера (0.00 сек) или набрать
  менее 8 000 очков дрифта на закрытом треке.
progression_summary: 'Линейно-ветвящаяся мета-прогрессия репутации Синдиката (Tiers
  1–5): победы в заездах приносят кредиты и очки репутации, открывая 4 ветки технических
  улучшений авто (Двигатель, Турбина, Спортивные шины, Нитро-система), 3 трассы возрастающей
  сложности и визуальный тюнинг (неон днища, кастомные винилы, цветной дым).'
difficulty_curve: Плавный вход на широком кольце Downtown Loop с предсказуемыми дугами
  поворотов -> резкий скачок динамики и плотности трафика на узком хайвее Neon Highway
  -> пик виртуозности на техничном Port Docks Drift, требующем ювелирной работы ручником
  и непрерывной перекладки машины.
scores:
  fun: 9
  originality: 8
  replayability: 9
  development_cost: 7
  visual_appeal: 9
  mobile_fit: 9
  monetization: 8
  platform_fit: 9
  overall_score: 8.5
  justification: Высокий балл за увлекательность (fun 9) и мобильную эргономику (mobile_fit
    9) обеспечен мгновенным тактильным кайфом от физики дрифта и нитро на разделенном
    тач-управлении. Отличный визуальный стиль (visual_appeal 9) достигается шейдером
    мокрого асфальта, неоновым освещением и эффектами скорости Three.js. Разработка
    трех контрастных трасс и адаптивного ИИ на Rapier3D укладывается в браузерный
    бюджет (development_cost 7). Оценки полностью оправданы строгой фокусировкой на
    проверенных механиках NFS без лишней перегруженности.
references:
- name: 'Need for Speed: Underground 2'
  genre: Arcade Street Racing
  mechanics:
  - Управляемый занос с ручника
  - Накопление нитро за рискованное вождение
  - Ночной город с мокрым асфальтом и неоном
  lessons: Идеальный игровой цикл аркадного вождения, где дрифт заряжает нитро, а
    победа в заезде приносит кредиты на визуальный и технический тюнинг.
  what_to_avoid: Избыточно сложная навигация по открытому миру без мгновенного старта
    гонок.
- name: 'Need for Speed: Carbon'
  genre: Canyon & City Street Racing
  mechanics:
  - Дрифт-дуэли на закрытых трассах
  - Соперничество бампер-в-бампер
  - Динамическая чейз-камера с изменением FOV
  lessons: Дрифт как отдельный зрелищный соревновательный режим с подсчетом очков
    за угол, скорость и близость к отбойникам.
  what_to_avoid: Перегруженная система командных напарников (wingmen), отвлекающая
    от личного контроля машины.
- name: Ridge Racer Unbounded / Split/Second
  genre: Action Arcade Racing
  mechanics:
  - Power drift зарядка шкалы ускорения
  - Агрессивный контактный ИИ
  - Импульсный буст
  lessons: Мгновенная читаемость шкалы буста и взрывной эффект ускорения при его активации.
  what_to_avoid: Избыточные скриптовые разрушения трассы, утяжеляющие браузерный движок.
mechanics:
- name: Аркадный Срыв в Дрифт и Инерционная Перекладка
  category: Фундаментальный двигатель геймплея и первичный источник заряда нитро-системы
  priority: core
  description: 'В отличие от бинарного дрифта в мобильных аркадах (нажал кнопку —
    машина едет по рельсам заноса), здесь реализована честная аркадная физика с переносом
    массы: угол и радиус полностью поддаются микроконтролю газом и контррулением.'
  player_interaction: 'Клавиатура: Вход в поворот A/D + кратковременный Пробел (ручник)
    на 0.22 с, стабилизация частыми нажатиями W (газ) и контррулением A/D. Тачскрин:
    виртуальный аналоговый стик руления влево/вправо + кнопка с иконкой ручника (Handbrake
    tap) справа.'
  feedback: 'Визуал/VFX: Густые объемные клубы бирюзового дыма из-под задних арок
    (particle emitter, 60 част/с), черные следы жженой резины на мокром асфальте (decal
    system), динамический крен кузова 6.5° на амортизаторах.; Звук (Web Audio): Пронзительный
    двухтональный визг покрышек (FM-синтез с модуляцией частоты 520 Гц -> 740 Гц в
    зависимости от угла заноса), басовитый рев прямоточного выхлопа с отстрелами антилага
    при сбросе газа (Noise burst 80 мс).; Камера (импульс/зум): Динамическое смещение
    точки обзора на внешнюю дугу поворота (Spring Arm lag 0.18 с), легкий голландский
    угол наклона камеры (Roll 4.5°) навстречу направлению заноса.; UI/Тактильность:
    Полукруглая неоновая дуга угла дрифта вокруг спидометра (зеленая зона 35°-55°,
    красная критическая зона >60°), тикающий счетчик очков с плавающими цифрами (+250
    PTS), короткая виброотдача 45 мс на мобильных устройствах при срыве оси.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Кинетический Нитро-Инжектор с Перегрузкой Турбины
  category: Главный источник взрывного ускорения, инструмент тактического обгона и
    компенсации ошибок в заносе
  priority: secondary
  description: 'Система разделена на 3 дискретных тактических заряда с синергией:
    сжигание одиночного заряда дает стабильный разгон, а удержание всех трех активирует
    скрытый режим «Overdrive», меняющий аэродинамику машины.'
  player_interaction: 'Клавиатура: Зажатие клавиши Shift или клавиши E. Тачскрин:
    Большая круглая кнопка «NITRO» в правом нижнем углу экрана с визуальным индикатором
    3 секций заряда.'
  feedback: 'Визуал/VFX: Двухметровые бирюзовые языки пламени с искрами из сдвоенного
    выхлопа, радиальное размытие по краям экрана (Radial Blur pass strength 0.45),
    неоновые световые шлейфы за задними фонарями.; Звук (Web Audio): Низкочастотный
    глухой хлопок детонации (Sub-bass drop 65 Гц), переходящий в высокочастотный турбинный
    вой компрессора (Sweep 1.2 кГц -> 3.8 кГц) и шипение клапана сброса Wastegate.;
    Камера (импульс/зум): Резкий толчок камеры назад на 0.6 м с последующим плавным
    удержанием, высокочастотная вибрация (Micro-shake frequency 40 Гц, amplitude 0.25)
    для имитации перегрузки.; UI/Тактильность: Заполнение 3 сегментов неонового резервуара
    с бирюзовой пульсацией, цифры спидометра вспыхивают ярко-голубым светом, продолжительный
    плотный виброотклик на мобильных устройствах во время удержания.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Множитель Риска «Лезвие Бритвы» (Razor Edge Near-Miss)
  category: Катализатор риска и награды, определяющий разрыв между безопасной ездой
    и рекордным результатом заезда
  priority: secondary
  description: Механика непрерывно считывает лучом Raycast расстояние до препятствий
    в реальном времени, создавая плавную градацию множителя (от x1.0 до x4.0) вместо
    бинарного триггера «Near Miss».
  player_interaction: Управление траекторией через руление (A/D / виртуальный стик)
    и ювелирные микро-коррекции газа (W / Тач-зона) во время прохождения поворотов
    и обгонов.
  feedback: 'Визуал/VFX: Плотный каскад ярких желто-оранжевых искр из зоны сближения
    борта с бетоном (Spark emitter, 80 част/с), пульсирующая неоновая рамка вокруг
    экрана (Vignette edge glow).; Звук (Web Audio): Нарастающий металлический скрежет
    и звон трения металла об абразив (Metal-on-concrete resonance 1.8 кГц), учащающийся
    пульсирующий синтезаторный бип комбо-множителя.; Камера (импульс/зум): Легкое
    приближение камеры к корме автомобиля (зум -0.4 м к фокусному расстоянию) с динамическим
    акцентом на сторону сближения.; UI/Тактильность: Всплывающий золотой бейдж «RAZOR
    EDGE x4.0» по центру экрана с прогресс-баром затухания, серия резких микро-вибраций
    (Haptic ticks 25 мс) при удержании критической зоны.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Адаптивный Дуэльный Прессинг и Аэродинамический Слипстрим
  category: Драматический регулятор плотности заезда, исключающий одиночную езду и
    создающий контактную борьбу
  priority: secondary
  description: 'Слипстрим совмещен с адаптивной системой дуэльного ИИ, создавая эффект
    «натянутой резинки»: дуэль всегда решается контактной борьбой на последних 100
    метрах дистанции, исключая скучные заезды с минутным отрывом.'
  player_interaction: Позиционирование болида точно в створе кормы соперника на дистанции
    от 2.0 до 15.0 метров с последующим выходом на обгон резким отклонением стика/клавиш
    руления (A/D).
  feedback: 'Визуал/VFX: Неоновые полупрозрачные вихревые струи воздуха (Aerodynamic
    Streamlines), срывающиеся со спойлера соперника, белые линии разрежения по бокам
    экрана.; Звук (Web Audio): Приглушение общего гула ветра (Low-pass filter cutoff
    800 Гц в зоне разрежения) с резким свистящим «вздохом» воздуха при выходе из слипстрима.;
    Камера (импульс/зум): Динамическое натяжение камеры (Camera pull-in на 0.3 м ближе
    к кузову) с легким эффектом кинематографической тряски при выходе на обгон.; UI/Тактильность:
    Индикатор наведения в виде неоновой мишени «DRAFTING» над машиной соперника, заполняющийся
    круговой прогресс-бар заряда выстреливания (Slingshot Ready).'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Тепловой Менеджмент Сцепления Шин и Температурный Зацеп
  category: Физический регулятор длительности непрерывного заноса, предотвращающий
    монотонное бесконечное скольжение
  priority: secondary
  description: Вместо абстрактной полоски выносливости игра симулирует термодинамику
    трения, где управляемость динамически меняется в зависимости от агрессивности
    вождения.
  player_interaction: Управление через прекращение зажатия ручника, выравнивание руля
    прямо и движение накатом для охлаждения набегающим потоком воздуха.
  feedback: 'Визуал/VFX: Плавное изменение цвета дыма из-под арок от полупрозрачного
    бирюзового к густому едкому серо-черному с раскаленными красными частицами корда
    при перегреве >120°C.; Звук (Web Audio): Изменение тембра визга резины от чистого
    визжащего свиста (High resonant pitch) к хриплому рваному скрежету (Distorted
    low friction scrub).; Камера (импульс/зум): Нарастающая нестабильность траектории
    камеры, легкое рыскание (Yaw wobble) при потере сцепления задней оси.; UI/Тактильность:
    Термальный индикатор шин в углу спидометра (4 пиктограммы колес, меняющие цвет
    от синего к зеленому, затем к пульсирующему оранжево-красному), предупреждающий
    звуковой зуммер при 125°C.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
gameplay_systems:
- name: Система физики автомобиля (Rapier Raycast Vehicle System)
  purpose: Обеспечение стабильного и отзывчивого аркадного поведения машины с дифференцированным
    сцеплением шин
  input: Управляющие сигналы газа, тормоза, ручника и угла поворота колес
  rules:
  - 4 луча подвески рассчитывают силу упругости и демпфирования на каждом тике физики
  - Задняя ось теряет до 70% бокового сцепления при зажатии ручника
  - Антиблокировочная система стабилизирует выход из заноса при отпускании ручника
  state:
  - Position, Velocity, AngularVelocity, WheelGrip, SteerAngle, IsGrounded
  interactions: Передает скорость и угол скольжения в систему нитро и дрифт-скоринга
  feedback: Динамика крена кузова, анимация вращения и выворота колес, след шин на
    асфальте
  edge_cases:
  - Падение сквозь геометрию (решается непрерывной детекцией CCD в Rapier)
  - Переворот на крышу (автоматический сброс ориентации кузова через 1.5 сек на колеса)
- name: Система 3 типов трасс и режимов заездов (Track & Race Mode System)
  purpose: Управление геометрией, чекпоинтами и логикой победы на Кольце, Спринте
    и Дрифт-Треке
  input: Координаты машины относительно вейпоинтов и триггеров трассы
  rules:
  - 'Кольцо Downtown Loop: 2 круга по 1.8 км со сквозным хронометражем круга'
  - 'Спринт Neon Highway: 3.5 км точка-в-точку с промежуточными чекпоинтами тайм-атаки
    (+15 сек)'
  - 'Дрифт-Трек Port Docks: 3 круга с аккумуляцией суммарного скора дрифта до 15 000
    очков'
  state:
  - CurrentLap, CurrentCheckpointIndex, TotalCheckpoints, LapTimes, RaceTimer, Placement
  interactions: Определяет текущую позицию в гонке (1st..4th), оставшееся время и
    условия победы/поражения
  feedback: Анимация пролета сквозь неоновые арки чекпоинтов, звуковой сигнал отсечки
    времени
  edge_cases:
  - Пропуск чекпоинта срезанием трассы (автоматическое предупреждение и штрафной возврат)
  - Одновременное пересечение финиша с ботом (сравнение таймстемпов с точностью до
    0.001с)
- name: Система адаптивного ИИ соперников (Rubberband AI System)
  purpose: Поддержание постоянной соревновательной интриги и контактной борьбы бампер-в-бампер
  input: Координаты игрока, геометрия трассы, плотность трафика
  rules:
  - 3 бота-соперника следуют по сглаженным сплайнам трассы с динамическим выбором
    траектории
  - Скорость ботов масштабируется в пределах [0.85; 1.20] в зависимости от отрыва
    игрока
  - Боты используют слипстрим и предпринимают попытки блокировки обгона при сближении
  state:
  - AIPosition, CurrentSplineProgress, TargetSpeed, AggressionLevel, CollisionState
  interactions: Создает соревновательное давление на игрока на всех участках трассы
  feedback: Искры при контакте, звуковые сигналы клаксона, агрессивное перестроение
    ботов
  edge_cases:
  - Застревание бота в геометрии (автоматический респавн на трассу через 2 секунды)
  - Финальный отрезок 150м (отключение раббербендинга для честной борьбы)
- name: Система нитро и дрифт-скоринга (Nitro Dynamics & Drift Scoring System)
  purpose: Конвертация мастерского скольжения и рискованной езды в мощный ресурс ускорения
  input: Угол заноса, скорость авто, дистанция до отбойников, кнопка активации нитро
  rules:
  - Удержание угла заноса 20°-65° аккумулирует шкалу закиси азота (до 3 зарядов)
  - Каждый заряд нитро дает +60% к ускорению и +45 км/ч к максимальной скорости на
    2.5 сек
  - Чистый дрифт без ударов накапливает комбо-множитель очков стиля от x1 до x4
  state:
  - NitroTanks (0..3), NitroProgress (0..100%), IsNitroActive, DriftScore, ComboMultiplier
  interactions: Модифицирует физический крутящий момент двигателя и максимальную скорость
    болида
  feedback: Расширение FOV 65°->85°, вспышка бирюзового пламени, блюр, неоновый скор-бонус
  edge_cases:
  - Активация нитро на 0 зарядов (игнорируется с миганием пустой шкалы)
  - Удар об стену во время дрифта (мгновенный сброс комбо-множителя до x1)
- name: Система гаража и мета-прогрессии (Garage & Progression System)
  purpose: Управление накоплением валюты, покупкой улучшений и кастомизацией спорткара
  input: Клики по кнопкам магазина тюнинга и палитре кастомизации
  rules:
  - '4 технических узла: Двигатель, Турбина, Шины, Нитро (каждый имеет 4 стадии прокачки)'
  - Каждый апгрейд повышает физические параметры болида на 8–15%
  - Прогресс сохраняется в Cloud Storage Playgama Bridge при каждом изменении
  state:
  - PlayerCredits, ReputationTier, UpgradesPurchased, ActiveCosmetics, UnlockedTracks
  interactions: Записывает купленные улучшения в профиль игрока и передает параметры
    в физику машины
  feedback: Звуки щелчка трещотки гайковерта, неоновая подсветка установленного узла,
    всплывающий тост
  edge_cases:
  - Покупка при нехватке кредитов (блокировка кнопки с визуальным шейком)
  - Конфликт облачных сохранений (приоритет наибольшего значения прогресса репутации)
core_design:
  signature_moment: 'Ночной спринт по хайвею: на скорости 195 км/ч на мокром асфальте
    игрок закладывает спорткар в поворот под 48 градусов в 0.3 метра от бетонного
    отбойника, искры от касания дисков осыпают асфальт, множитель риска подскакивает
    до x4.0, мгновенно заполнив 3-й баллон бирюзового нитро; игрок сбрасывает ручник,
    вдавливает кнопку форсажа — камера рывком отдаляется с расширением FOV с 60° до
    85°, радиальный блюр смазывает неоновые небоскребы, и болид с ревом перегруженной
    турбины на 240 км/ч протискивается в 50-сантиметровый зазор между лидирующим маслкаром
    соперника и фурой трафика, пересекая финишную черту за 0.12 секунды до соперника
    под взрыв неона и фанфары репутации Синдиката!'
  genre_template_rejected: 'Отвергнут шаблон «бесцельного открытого мира с рутинными
    переездами между маркерами» (NFS Underground 2 / Forza Horizon) и шаблон «стерильного
    кольцевого симулятора с замедлением на газоне» (Gran Turismo). Причина отказа:
    для 3D WebGL-сессии (Playgama / Яндекс Игры) открытый мир размывает фокус, перегружает
    оперативную память браузера фоновыми ассетами и создает простои до 70% времени
    без адреналина. Вместо этого выбрана концентрированная аркадная структура сессий
    по 60–90 секунд на 3 характерных трассах (Downtown Loop, Neon Highway, Port Docks),
    где 100% времени игрок находится в состоянии плотной дуэли, непрерывного управляемого
    дрифта и рискованного накопления нитро без холостой езды.'
  what_makes_it_different: 'В отличие от стандартных аркад, где нитро восстанавливается
    по пассивному таймеру или подбором пикапов с трассы, в «Ночном Синдикате» нитро
    — это конвертируемая валюта риска и мастерства. Заряд генерируется только через
    два сопряженных действия: удержание предельного угла заноса (угол 35°–60° на скорости
    выше 90 км/ч) и экстремальное сближение с отбойниками и трафиком («Лезвие бритвы»,
    <1.2 м). Риск катастрофичен: малейшее касание сбрасывает комбо-множитель и прерывает
    закись азота, но идеальный тайминг выхода из заноса с прострелом нитро катапультирует
    спорткар из апекса поворота быстрее любого ИИ.'
  micro_loop:
  - step: MICRO_01_APPROACH
    player_action: Держит газ в пол (W / Тач-кнопка «Газ») на прямой, нагоняет соперника
      в воздушном кармане (слипстрим).
    game_response: Спидометр растет до 180 км/ч, шум ветра усиливается (WhiteNoise
      gain 0.35), за кормой соперника отрисовывается неоновый след разрежения.
    decision: Атаковать соперника по внешней дуге для широкого дрифта или нырнуть
      во внутренний радиус на торможении.
    duration: 1.5–2.5 с
  - step: MICRO_02_DRIFT_INITIATION
    player_action: Кратковременно жмет Пробел / Тач-ручник на 0.22 с и отклоняет руль
      (A/D или Стик) в сторону поворота.
    game_response: Задняя ось теряет 65% латерального сцепления, кузов разворачивается
      под углом 35°, задние покрышки дымят бирюзовым дымом, звучит визг резины.
    decision: Сколько миллисекунд удерживать ручник, чтобы сорвать заднюю ось, но
      не уйти в неуправляемый разворот на 360 градусов.
    duration: 0.2–0.4 с
  - step: MICRO_03_DRIFT_BALANCING_RISK
    player_action: Контррулит в противоположную сторону (D при левом заносе), дозируя
      газ импульсами для удержания угла 45.0°.
    game_response: Растет шкала угла (45°), счетчик очков заноса крутит +150 pts/сек.
      При дистанции <1.0 м до отбойника вспыхивает индикатор «RAZOR EDGE x2.5» и сыплются
      искры.
    decision: Прижаться еще на 20 см ближе к бетону ради множителя x4.0 или отойти
      на безопасную траекторию.
    duration: 2.0–4.0 с
  - step: MICRO_04_NITRO_BLAST
    player_action: Выравнивает колеса на прямую и зажимает Shift / Кнопку «NITRO».
    game_response: Взрыв синего пламени из выхлопа, FOV рывком расширяется с 60° до
      85°, физический импульс толкает машину вперед (+45 км/ч за 0.8 с), экран сотрясает
      вибрация.
    decision: Сжечь весь баллон сразу для гарантированного обгона или сберечь заряд
      на финальную прямую.
    duration: 1.5–2.5 с
  - step: MICRO_05_OVERTAKE_EXIT
    player_action: Прорезает траекторию соперника, блокируя его контратаку корпусом
      болида.
    game_response: Срабатывает событие «CLEAN OVERTAKE» (+500 очков стиля), ИИ соперника
      уходит на торможение, на табло обновляется позиция (P1).
    decision: Занять защитную траекторию перед следующим связным поворотом.
    duration: 1.0–2.0 с
  meso_loop:
  - step: MESO_01_GRID_LAUNCH
    player_action: Ловит идеальные обороты двигателя (Green Zone 6200 RPM) на обратном
      отсчете старта и пробивается сквозь стартовую решетку из 4 машин.
    game_response: Идеальный старт дает мгновенный рывок Perfect Launch (+15% ускорения
      без пробуксовки) и 0.5 баллона нитро.
    decision: Идти на жесткий контакт с соперниками слева или безопасно занять внешнюю
      линию для раннего дрифта.
    duration: 10–15 с
  - step: MESO_02_HIGHWAY_SLIPSTREAM
    player_action: Маневрирует в потоке трафика, пристраивается в хвост лидеру гонки
      для набора скорости в аэродинамическом слипстриме.
    game_response: Сопротивление воздуха снижается на 40%, скорость вырастает со 170
      до 210 км/ч, активно заполняя баллоны нитро.
    decision: Рискнуть на обгон в миллиметрах от встречного трафика ради множителя
      x4 или выждать безопасный карман.
    duration: 25–35 с
  - step: MESO_03_TECHNICAL_CHICANE
    player_action: Выполняет быструю связку из трех перекладок заноса (S-turn drift
      combo) с ювелирным контролем инерции возле контейнеров.
    game_response: Комбо очков дрифта удерживается, множитель достигает x4.0, баллоны
      нитро заполняются до максимума (3/3).
    decision: Связать связку поворотов непрерывным дрифтом через ручник или стабилизировать
      машину для набора чистой скорости.
    duration: 25–30 с
  - step: MESO_04_FINAL_NITRO_DUEL
    player_action: Активирует тройной прожиг нитро (Triple Burn) на финишной прямой
      под прессингом накатывающего сзади соперника.
    game_response: Звучит кульминационный рев турбины, включается замедление времени
      на 0.5 с при пересечении финиша (Finishing Cam), фиксируется победа.
    decision: Блокировать правый борт от тарана ИИ или сосредоточиться на идеальной
      траектории финишного створа.
    duration: 10–15 с
  macro_loop:
  - step: MACRO_01_CONTRACT_SELECTION
    player_action: Выбирает контракт Синдиката в меню карты ночного города (напр.
      «Дуэль за набережную», сложность Tier-2, награда 4 500 кредитов + 120 репутации).
    game_response: Отображает требования к классу автомобиля, погодные условия (мокрый
      неоновый асфальт) и бонусные условия начисления очков репутации.
    decision: Выбрать прибыльный высокорискованный контракт со ставкой кредитов или
      надежную кольцевую гонку для стабильного фарма.
    duration: 10–20 с
  - step: MACRO_02_RACE_EXECUTION
    player_action: Проходит 3D заезд в реальном времени, комбинируя срыв в занос ручником,
      форсаж нитро на прямых и контактный обгон соперников.
    game_response: Физический движок Rapier3D рассчитывает коллизии и сцепление колес,
      адаптивный ИИ навязывает контактную дуэль, фиксируется итоговый результат заезда.
    decision: Балансировать риск между чистой победной траекторией 1-го места и рискованным
      скольжением возле стен ради дрифт-бонуса контракта.
    duration: 60–90 с
  - step: MACRO_03_REWARD_PAYOUT
    player_action: Просматривает экран итогов заезда, собирает базовые кредиты, дрифт-бонусы
      за стиль и очки уважения синдиката.
    game_response: Анимирует начисление кредитов, заполняет шкалу репутации Синдиката
      до нового ранга (Tier 3) и разблокирует новые детали в каталоге.
    decision: Потратить заработанные кредиты немедленно на апгрейд турбины Stage-2
      или накопить на спортивные шины повышенной термостойкости.
    duration: 10–15 с
  - step: MACRO_04_GARAGE_TUNING
    player_action: Устанавливает в гараже спортивный дифференциал, прокачивает турбину,
      монтирует бирюзовый неон под днище и кастомный спойлер.
    game_response: Пересчитывает физические характеристики авто в реальном времени
      (Drift Control 72 -> 85, Top Speed 210 -> 228 км/ч) и обновляет 3D-модель с
      неоновой подсветкой.
    decision: Сконфигурировать спорткар в чистый дрифт-корч с широким углом выворота
      или в скоростной хайвей-снаряд с максимальной тягой нитро.
    duration: 20–40 с
  - step: MACRO_05_TIER_UNLOCK
    player_action: Принимает вызов босса Синдиката на дуэль за право контроля центрального
      шоссе.
    game_response: Открывает доступ к элитной дуэли «Pink Slip» 1-на-1 и разблокирует
      сложную закрытую трассу Port Docks Drift Arena.
    decision: Бросить вызов боссу района немедленно или провести тренировочный заезд
      на новой конфигурации деталей.
    duration: 10–15 с
  loop_diagram: "  +-----------------------------------------------------------------------+\n\
    \  |                   ПОДЗЕМНЫЙ ГАРАЖ СИНДИКАТА                           |\n\
