qa:
  functional_tests:
  - Тест инициализации и переключения всех 3 трасс (Downtown Loop, Neon Highway, Port
    Docks)
  - 'Тест физического контроллера автомобиля: разгон, торможение, срыв в занос ручником,
    стабилизация'
  - 'Тест механики нитро: прирост скорости, расширение FOV камеры, списание баллона,
    перезарядка в дрифте'
  - 'Тест адаптивного ИИ: следование по вейпоинтам, слипстрим, коррекция раббербендинга,
    отсутствие застреваний'
  - 'Тест интеграции Playgama Bridge: сохранение кредитов в Cloud Storage, показ рекламы
    и отправка рекордов в лидерборды'
  performance_benchmarks:
  - Стабильные 60 FPS на десктопных браузерах с разрешением 1920x1080
  - Не менее 55-60 FPS на мобильных устройствах среднего уровня (Snapdragon 7xx /
    Apple A13)
  - Количество Draw Calls в кадре не более 75 на всех 3 трассах
  - Суммарный объем используемой оперативной памяти JS Heap < 180 МБ
  - Время первой загрузки ассетов и старта сцены < 3.0 секунд
  cross_browser_matrix:
  - Google Chrome (Windows, macOS, Android) - Основной целевой браузер (WebGL 2.0)
  - Yandex Browser (Windows, Android) - Приоритет платформы Yandex Games
  - Safari (iOS 15+, iPadOS) - Тестирование Web Audio API и Touch-событий
  - Mozilla Firefox (Windows, Linux) - Проверка производительности WASM Rapier3D
  common_bug_checklist:
  - Застревание машины в отбойниках при боковом ударе на высокой скорости
  - Проваливание колес сквозь полигоны трассы при приземлении после трамплина
  - Несрабатывание начисления нитро при дрифте с малым углом скольжения
  - Потеря фокуса ввода при клике за пределами канваса WebGL на ПК
  - Залипание звука визга шин при резкой паузе во время заноса
roadmap:
- phase_number: 1
  title: 'Фаза 1: Физическое ядро, контроллер машины и камера'
  duration_days: 2
  tasks:
  - Интеграция Rapier3D и Three.js r170+
  - Реализация RAPIER.DynamicRayCastVehicleController с дифференцированным сцеплением
    колес
  - Настройка динамической чейз-камеры с креном и расширением FOV
  - Базовая схема ввода для клавиатуры (WASD/Space/Shift) и тач-скрина
  milestone_deliverable: Прототип управляемого автомобиля в заносе с чейз-камерой
    на тестовой площадке
- phase_number: 2
  title: 'Фаза 2: Архитектура 3 трасс и адаптивный ИИ соперников'
  duration_days: 3
  tasks:
  - 'Моделирование и сборка 3 трасс: Downtown Loop, Neon Highway, Port Docks Drift'
  - Создание системы чекпоинтов, хронометража кругов и зон респавна
  - Разработка адаптивного ИИ соперников с поддержкой слипстрима и раббербендинга
  - Оптимизация геометрии трассы через Three.js InstancedMesh
  milestone_deliverable: Все 3 играбельные трассы с чекпоинтами, сплайнами ИИ и контактными
    соперниками
- phase_number: 3
  title: 'Фаза 3: Нитро, дрифт-скоринг, VFX и аудио-движок'
  duration_days: 2
  tasks:
  - Реализация механики накопления нитро в дрифте и впрыска с эффектом FOV 85°
  - Создание системы дрифт-скоринга с множителем x1..x4 и Near-Miss бонусами
  - Разработка кастомного GLSL-шейдера мокрого асфальта с отражениями
  - Интеграция партиклов дыма, пламени выхлопа и Web Audio эффектов (Howler.js)
  milestone_deliverable: Полноценный аркадный геймплейный цикл с нитро-бустом, дымом,
    неоном и звуком
- phase_number: 4
  title: 'Фаза 4: Гараж, мета-прогрессия, Playgama SDK и релизная полировка'
  duration_days: 2
  tasks:
  - 'Создание UI Гаража: покупка 4 веток апгрейдов и неоновой кастомизации'
  - 'Интеграция Playgama Bridge 2.x: сохранение в Cloud, Interstitial/Rewarded реклама,
    лидерборды'
  - Полировка мобильного touch-управления, SafeArea и адаптация верстки HUD
  - Финальное профилирование FPS, балансировка цен апгрейдов и QA-тестирование
  milestone_deliverable: Релизный билд игры с интеграцией Playgama Bridge, готовый
    к публикации на площадках
risks:
- risk: Просадки FPS на бюджетных мобильных устройствах из-за физики коллизий и партиклов
    дыма
  category: performance
  severity: High
  mitigation: Использование Rapier3D WASM, фиксированный timestep 60Hz, пулинг партиклов
    с лимитом 250 шт. и инстансинг мешей трассы.
- risk: Сложность контроля дрифта на сенсорных экранах для казуальных игроков
  category: gameplay
  severity: Medium
  mitigation: Введение мягкого ассистента стабилизации траектории при выходе из заноса
    (Steering Assist) и четкое зонирование тач-кнопок без плавающих стиков.
- risk: Нечестное ощущение поведения адаптивного ИИ (Rubberbanding)
  category: design
  severity: Medium
  mitigation: Ограничение модификатора скорости ИИ диапазоном [0.85; 1.20] и полное
    отключение буста ИИ на последних 150 метрах дистанции.
skills:
- skill_id: rapier-vehicle-physics
  name: Физика автомобиля и управляемый дрифт на Rapier3D
  filename: skills/rapier-vehicle-physics.md
  purpose: Реализация отзывчивой и стабильной физики аркадного автомобиля с управляемым
    срывом в занос и выходом из него на базе Rapier3D DynamicRayCastVehicle.
  when_to_use: При настройке физического поведения болида, параметров сцепления шин,
    подвески и рулевого управления.
  rules:
  - Физический шаг строго фиксирован на 60 Гц (dt = 1/60)
  - Трансформы мешей Three.js интерполируются между тиками физики для плавности 120+
    Гц экранов
  - Ручник снижает боковое сцепление только задней оси, сохраняя управляемость передних
    колес
  architecture: Модуль VehiclePhysicsManager инициализирует RAPIER.DynamicRayCastVehicleController,
    привязывает 4 луча подвески к коллайдеру кузова и обновляет коэффициенты трения
    шин в физическом цикле stepSimulation(1/60).
  implementation_guidance: Для реализации эффекта дрифта при зажатии ручника боковое
    сцепление задних колес wheel.sideFriction плавно снижается до 0.30, а угловая
    скорость вращения вокруг вертикальной оси (Yaw) поддерживается крутящим моментом
    двигателя.
  common_mistakes:
  - Использование аркадного Transform.translate вместо честных сил колес Rapier3D
  - Мгновенный возврат трения шин к 100%, вызывающий резкий дерганый толчок машины
    при выходе из заноса
  checklist:
  - Коэффициенты сцепления колес переключаются плавно без рывков физического тела
  - Коллайдер кузова имеет заниженный центр масс для исключения неконтролируемых переворотов
  - Сенсорные зоны и клавиатура опрашиваются с минимальной задержкой без создания
    мусора в памяти
  knowledge_refs:
  - mechanics/drift_scoring.md
  - patterns/racing_event_loop.md
- skill_id: racing-track-and-ai
  name: Архитектура трасс, чекпоинты и адаптивный ИИ соперников
  filename: skills/racing-track-and-ai.md
  purpose: Создание и управление логикой 3 контрастных трасс, расстановкой триггеров
    чекпоинтов и поведением соревновательного ИИ.
  when_to_use: При создании геометрии трасс, настройке ИИ противников и логики победы
    в заезде.
  rules:
  - Каждая трасса обязана иметь замкнутый или сквозной сплайн вейпоинтов с шагом не
    более 10 метров
  - ИИ модификатор скорости ограничен строгими рамками [0.85; 1.20]
  - Чекпоинты проверяются строго последовательно по индексам с запретом зачета в обратном
    направлении
  architecture: Модуль TrackAIManager содержит наборы вейпоинтов для каждой из 3 трасс,
    строит CatmullRom-сплайны траекторий и рассчитывает целевые скорости ботов с учетом
    раббербендинга и контактных коллизий.
  implementation_guidance: ИИ боты используют Raycast вперед и по диагоналям для обнаружения
    других машин и препятствий, плавно отклоняясь от центральной линии сплайна и активируя
    ускорение слипстрима при нахождении позади игрока.
  common_mistakes:
