_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: sozday_gonku_v_stile_nfs_pust_budet_3_karty_kolt
performance:
  target_fps: 60
  max_draw_calls: 75
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: Сессия состоит из 2–4 заездов длительностью по 60–90 секунд каждый в 3 различных
    форматах (Кольцо Downtown Loop на 2 круга по 1.8 км, Шоссейный Спринт Neon Highway
    на 3.5 км точка-в-точку, Техничный Дрифт-Трек Port Docks на 3 круга до 15 000
    очков) с общим временем игровой сессии 4–7 минут.
  win: Занять 1-е место в кольцевой гонке (Downtown Loop, 2 круга по 1.8 км быстрее
    1:25.00), прийти первым в шоссейном спринте (Neon Highway, 3.5 км быстрее 1:15.00)
    или набрать более 15 000 очков стиля в дрифт-режиме (Port Docks Drift, 3 круга).
  lose: Прийти к финишу ниже 3-го места в спринте или кольцевой гонке, не успеть доехать
    до контрольного чекпоинта до истечения таймера (0.00 сек) или набрать менее 8
    000 очков дрифта на закрытом треке.
  difficulty_curve: Плавный вход на широком кольце Downtown Loop с предсказуемыми
    дугами поворотов -> резкий скачок динамики и плотности трафика на узком хайвее
    Neon Highway -> пик виртуозности на техничном Port Docks Drift, требующем ювелирной
    работы ручником и непрерывной перекладки машины.
mechanics:
  arkadnyy_sryv_v_drift_i_inertsionnaya_perekladka:
    name: Аркадный Срыв в Дрифт и Инерционная Перекладка
    parameters:
      vremya_srabatyvaniya_sryva_ruchnikom:
        value: 0.22 с
        note: При >0.4 с управление ощущается ватным и неотзывчивым; при <0.1 с машина
          срывается мгновенно, теряя вес кузова.
      optimalnyy_rabochiy_ugol_zanosa:
        value: 45.0 градусов
        note: При снижении до 25° дрифт перестает выглядеть эффектно; при увеличении
          до 65° игроку невозможно парировать занос без разворота.
      koeffitsient_padeniya_lateralnogo_treniya:
        value: 0.35 (падение на 65%)
        note: При >0.55 машина не уходит в скольжение и мгновенно выравнивается; при
          <0.20 машина неуправляемо улетает с трека.
      minimalnaya_skorost_vhoda_v_drift:
        value: 45.0 км/ч
        note: При <20 км/ч занос инициируется на парковочных скоростях без динамики;
          при >80 км/ч невозможно зайти в медленные шпильки.
      okno_uderzhaniya_kombo_pri_perekladke:
        value: 0.85 с
        note: При <0.4 с переложить машину между связками поворотов без сброса счета
          невозможно; при >1.5 с комбо обесценивается.
  kineticheskiy_nitro_inzhektor_s_peregruzkoy_turbin:
    name: Кинетический Нитро-Инжектор с Перегрузкой Турбины
    parameters:
      dlitelnost_forsazha_odnogo_ballona:
        value: 2.20 с
        note: При >3.5 с нитро становится слишком дешевым и стирает необходимость
          дрифта; при <1.2 с игрок не успевает совершить тактический обгон.
      prirost_pikovoy_skorosti_pri_nitro:
        value: +45.0 км/ч
        note: При <25 км/ч форсаж визуально не впечатляет; при >70 км/ч машина на
          WebGL-трассах становится неуправляемым снарядом.
      mgnovennyy_impuls_krutyaschego_momenta:
        value: +60.0% к Torque
        note: При <30% на выходе из поворота сохраняется турбояма; при >100% срывает
          переднюю ось даже на прямой.
      maksimalnaya_emkost_ballonov:
        value: 3 заряда (100 ед/баллон)
        note: 1 заряд лишает выбора накопления; 5 зарядов перегружают интерфейс и
          делают нитро бесконечным.
      ugol_rasshireniya_fov_kamery:
        value: с 60.0° до 85.0° (дельта +25°)
        note: При дельте <10° теряется кинематографическое ощущение гипер-скорости;
          при >35° картинка превращается в «рыбий глаз» с искажением дистанции.
  mnozhitel_riska_lezvie_britvy_razor_edge_near_miss:
    name: Множитель Риска «Лезвие Бритвы» (Razor Edge Near-Miss)
    parameters:
      porogovaya_distantsiya_aktivatsii_riska:
        value: 1.20 м
        note: При >2.0 м множитель срабатывает случайно даже на середине полосы; при
          <0.6 м окно риска становится слишком узким для 60 FPS браузера.
      kriticheskaya_distantsiya_maksimuma_x4_0:
        value: 0.35 м
        note: При <0.15 м погрешность физических коллайдеров Rapier вызывает ложные
          столкновения; при >0.6 м риск перестает вызывать адреналин.
      maksimalnyy_kombo_mnozhitel:
        value: x4.0
        note: При значении x2.0 стимул рисковать недостаточен; при x8.0 возникает
          дисбаланс, ломающий экономику очков за один поворот.
      okno_uderzhaniya_mnozhitelya_vne_riska:
        value: 1.80 с
        note: При <0.8 с множитель сгорает на прямых участках между поворотами; при
          >3.5 с множитель держится пассивно без риска.
      shtrafnoy_porog_sily_udara_kollizii:
        value: 3.50 G (34.3 м/с²)
        note: При <1.5 G легкие касания отбойника спойлером сбрасывают комбо; при
          >6.0 G даже лобовой таран не наказывает игрока.
  adaptivnyy_duelnyy_pressing_i_aerodinamicheskiy_sl:
    name: Адаптивный Дуэльный Прессинг и Аэродинамический Слипстрим
    parameters:
      dlina_zony_deystviya_slipstrima:
        value: 15.0 м
        note: При >25.0 м эффект работает через пол-трассы без необходимости точного
          пристраивания; при <6.0 м попасть в зону на высокой скорости почти невозможно.
      snizhenie_lobovogo_soprotivleniya_v_karmane:
        value: -40.0% Drag
        note: При значении <-60% машина ускоряется как ракета без нитро; при >-15%
          эффект слипстрима слабо ощутим игроком.
      maksimalnyy_gandikap_adaptivnoy_tyagi_ii:
        value: +40.0% / -25.0%
        note: При завышении (+80%) боты неестественно телепортируются за игроком;
          при занижении (+10%) заезд теряет накал при первом же отрыве.
      shirina_aerodinamicheskogo_tonnelya:
        value: 2.20 м
        note: При >4.0 м слипстрим ловится слишком легко; при <1.2 м малейшее смещение
          выбивает игрока из зоны потока.
      vremya_deystviya_effekta_vystrelivaniya_slingshot:
        value: 1.50 с
        note: При <0.6 с бонус пропадает до момента завершения маневра обгона; при
          >3.0 с обгон становится тривиальным.
  teplovoy_menedzhment_stsepleniya_shin_i_temperatur:
    name: Тепловой Менеджмент Сцепления Шин и Температурный Зацеп
    parameters:
      optimalnyy_diapazon_temperatury_shin:
        value: 70.0°C – 105.0°C
        note: При слишком узком диапазоне (80-90°C) игрок постоянно перегревает шины;
          при широком (40-150°C) механика теряет тактическую значимость.
      skorost_nagreva_shin_v_zanose:
        value: +18.5°C в секунду
        note: При >30°C/с шины перегреваются за 2 секунды дрифта; при <8°C/с перегреть
          шины на трассе становится невозможно.
      skorost_ohlazhdeniya_nabegayuschim_potokom:
        value: -12.0°C в секунду
        note: При <5°C/с остудить резину на коротких прямых невозможно; при >25°C/с
          температура мгновенно сбрасывается.
      koeffitsient_padeniya_zatsepa_pri_peregreve_120_c:
        value: -45.0% Lateral Grip
        note: При значении <-70% машина мгновенно улетает с трассы; при >-20% перегрев
          не создает ощутимой угрозы разворота.
      kriticheskaya_temperatura_kipeniya_kompaunda:
        value: 140.0°C
        note: Потолок шкалы, при котором шины полностью теряют сцепление с асфальтом.
