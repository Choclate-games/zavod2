  is caught mid-action, with clear cause and effect readable in a single frame. Visible
  in-game HUD overlay: Прицельная сетка тепловизора (динамически меняется под выбранный
  калибр 25/40/105мм), Панель селектора калибров с круговыми индикаторами перезарядки
  и счетчиком снарядов, Телеметрия ганшипа: высота 1000м, азимут орбиты, режим FLIR
  White-Hot, кратность зума (1x/2x/4x), Статус союзного отряда спецназа: 4 иконки
  здоровья бойцов и расстояние до зоны эвакуации; touch controls at the bottom corners.
  Lighting: Глобальное ночное рассеянное освещение низкой интенсивности с акцентом
  на термо-эмиссионные источники (тела людей, двигатели машин, вспышки взрывов). Color
  palette: #4AF626 (классический военный люминесцентный зеленый цвет прицела и данных),
  #141618 (холодный темный фон конструкций и земли), #FFFFFF (раскаленный двигатель
  техники с интенсивным блумом), #FFFFFF (ослепительная вспышка детонации боеприпасов),
  #E6E8EA (горячая сигнатура живого человека), #3A3F45 (холодные железобетонные стены).
  High visual clarity, readable silhouettes, immersive WebGL game aesthetics.'
