raw_prompt: создай игру по типу call of duty
title: 'AC-130: Ночной Тепловизор'
slug: sozday_igru_po_tipu_call_of_duty
genre: 3D Тактический Рельсовый Авиа-Шутер
subgenre: FLIR-симулятор огневой поддержки / Аркадный ганшип
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web)
orientation: landscape
target_audience: Мужчины 16–45 лет, поклонники Call of Duty (культовая миссия «Death
  From Above»), фанаты военной авиации, тактических шутеров и игр с зрелищной физикой
  разрушений.
core_loop: Сканирование сектора в тепловизор FLIR -> Выбор калибра (25мм / 40мм /
  105мм) -> Расчет баллистического упреждения и радиуса поражения -> Залп по технике
  и живой силе противника -> Физическая цепная детонация укрытий -> Обеспечение безопасного
  прохода союзного спецназа к эвакуации -> Получение боевого рейтинга.
hook: 'Залп 105-мм гаубицы с высоты 1000 метров с баллистической задержкой в 2 секунды:
  ослепительно белая тепловая вспышка в монохромном тепловизоре разрывает вражескую
  колонну на горящие обломки ровно в 10 метрах от укрытия союзного спецназа под хладнокровный
  радиодоклад «Direct hit, target destroyed!».'
player_fantasy: Ты — оператор бортового комплекса вооружения тяжелого самолета огневой
  поддержки AC-130 Spectre, кружащего на высоте 1000 метров над ночной зоной боевых
  действий. В твоих руках — абсолютное превосходство в воздухе и сокрушительная мощь
  трех калибров, от своевременных и точных выстрелов которой зависит выживание союзного
  отряда «Браво» на земле.
session_model: 'Спецоперация огневой поддержки длительностью 60–90 секунд: эскорт
  союзного отряда спецназа из 4 бойцов через 3 тактических сектора до зоны вертолетной
  эвакуации.'
unique_value_proposition: Аутентичная атмосфера боевой работы оператора AC-130 с честной
  орбитальной баллистикой трех калибров, монохромной FLIR-стилизацией White-Hot и
  физическими цепными реакциями, оптимизированная для мгновенного запуска в браузере
  и на смартфонах с управлением в один свайп.
vision: 'Воссоздать легендарный опыт миссии «Death From Above» в современном веб-формате:
  бескомпромиссная тактическая глубина за счет трех орудий с разным временем подлета
  снарядов, драматичное спасение союзников под шквальным огнем и визуальное совершенство
  ночного тепловизора при стабильных 60 FPS.'
elevator_pitch: 'Стань оператором ночного ганшипа AC-130: уничтожай вражескую бронетехнику
  и зачищай здания из 25-мм пулемета, 40-мм автопушки и 105-мм гаубицы через прицел
  тепловизора. Рассчитывай упреждение снарядов с высоты 1000м и спаси союзный спецназ
  за 90 секунд напряженного боя!'
win_conditions: Успешная эвакуация союзного отряда спецназа (минимум 1 выживший боец
  достиг зоны посадки вертолета на 90-й секунде) и полная ликвидация тяжелой техники
  противника.
lose_conditions: Гибель всех 4 бойцов союзного отряда от огня противника ИЛИ дружественный
  огонь (попадание снаряда 105мм/40мм в радиус союзников, уничтожившее отряд) ИЛИ
  истечение лимита времени (100 секунд) до выхода к эвакуации.
progression_summary: 'За успешные миссии начисляются тактические кредиты и боевой
  ранг на основе комбо-серий, точности и спасенных бойцов. За кредиты модернизируются
  системы ганшипа: стабилизация гироскопа (уменьшение дрожания при зуме), скорость
  перезарядки 105-мм орудия, охлаждение 25-мм пулемета и термосенсоры повышенной четкости.
  Открываются новые спецоперации: «Ночная Промзона», «Перевал в Руинах», «Осада Нефтебазы».'
difficulty_curve: 'Фаза 1 (0:00–0:25): Разрозненные группы пехоты на открытых улицах
  — игрок осваивает 25-мм пулемет и свайп-наведение. Фаза 2 (0:25–0:55): Скоростные
  пикапы и враги на крышах зданий — подключение 40-мм автопушки, необходимость упреждения
  в 1.5 сек. Фаза 3 (0:55–1:25): Массированная атака танков Т-72 и БТР в непосредственной
  близости от союзного отряда — ювелирное применение 105-мм гаубицы с контролем радиуса
  поражения (Friendly Fire danger).'
