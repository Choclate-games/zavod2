  selected_id: D1
  selected_name: 'AC-130: Ночной Тепловизор'
  selection_reason: 'Направление «AC-130: Ночной Тепловизор» — сильнейший выбор для
    браузера и мобильных устройств. Оно берет самую узнаваемую и зрелищную миссию
    в истории Call of Duty («Death From Above») и идеально адаптирует её под специфику
    платформы:

    1. Идеальный мобильный UX: Устранена главная проблема мобильных шутеров — неуклюжие
    виртуальные джойстики перемещения. Игрок целится естественным свайпом и нажимает
    на иконки калибров, получая мгновенный тактический отклик.

    2. Безупречная производительность: Монохромный FLIR-шейдер тепловизора с эффектом
    White-Hot выдает стабильные 60 FPS на любом бюджетном смартфоне, выглядя при этом
    предельно стильно и реалистично без тяжелых PBR-материалов.

    3. Мгновенный вау-эффект: С первой секунды игрок слышит радиопереговоры («Angel
    2-0, cleared hot»), видит термо-сигнатуры вражеской техники и разносит укрепления
    105-мм гаубицей с честной баллистикой и физикой взрывных цепных реакций.'
  rejected_reasons:
  - 'D2 (Гонка Вооружений: Ближний Бой): Отвергнут из-за высокого порога входа и неудобства
    мобильного управления: одновременный контроль перемещения, прицеливания, прыжков
    и стрельбы на сенсорном экране смартфона создает высокий фрустрационный барьер
    в браузере и проигрывает нативным мобильным шутерам.'
  - 'D3 (Снайперский Рубеж: Невидимый Выстрел): Отвергнут из-за слишком медленного
    медитативного темпа сессии и долгих пауз между выстрелами: случайный промах нарушает
    стелс и требует перезапуска, что снижает динамику и адреналин, характерные для
    бренда Call of Duty.'
  what_it_is_not:
  - 'Никаких виртуальных джойстиков ходьбы и прыжков: самолет AC-130 движется по заданной
    орбите автоматически, игрок управляет только прицельным комплексом и вооружением.'
  - Никаких карточек случайных апгрейдов (+15% к урону пули), клонов Vampire Survivors
    / Brotato и автострельбы.
  - 'Никаких бесконечных волн безликих монстров на замкнутой арене: только конкретная
    срежиссированная боевая операция с фазами прикрытия союзного спецназа.'
  - 'Никаких серых прототипных кубов: локация и техника стилизованы под аутентичную
    картинку военного тепловизора FLIR с шумом матрицы и CRT-сканлайнами.'
  - 'Никаких полосок здоровья над головами врагов и цветных цифр урона: повреждения
    рассчитываются через радиус сплеша, кинетический импульс и рэгдолл.'
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - 'Три калибра с принципиально разной баллистикой и тактической ролью: 25-мм скорострельный
    пулемет Гатлинга (против разрозненной пехоты), 40-мм автопушка Бофорс (против
    легких пикапов) и 105-мм гаубица (против танков и зданий с долгой перезарядкой).'
  - 'Аутентичный визуальный стиль тепловизора FLIR (White-Hot): монохромная картинка
    с ярко светящимися силуэтами живой силы, горячими двигателями техники и тепловыми
    следами от взрывов.'
  - Союзный отряд спецназа под управлением ИИ с инфракрасными стробоскопами и строгим
    запретом на Friendly Fire (попадание тяжелым калибром по союзникам проваливает
    операцию).
  - 'Баллистическое время полета снарядов: снаряды летят с орбиты 1000м с задержкой
    1.2–2.5 секунды, требуя от игрока брать упреждение по движущейся технике.'
  signature_scene: 'Ночной вид через монохромный тепловизор бортового комплекса AC-130
    под углом 50 градусов вниз на перекресток разрушенного ближневосточного города.
    В центре экрана в зеленовато-белом прицельном перекрестии 105-мм гаубицы ярко
    светится раскаленный силуэт вражеского БТР в момент детонации боекомплекта: во
    все стороны разлетаются белые контрастные осколки брони и гусеницы, освещая темные
    руины зданий. Слева за бетонным забором укрылись три яркие фигурки союзного спецназа
    с мерцающими ИК-стробоскопами на шлемах, а справа по улице к ним наперерез мчится
    вражеский пикап с пулеметом, двигатель которого раскален добела.'
  avoid_references:
  - 'Dust 2: Ретейк и Дуэли (соревновательный тактический FPS-ретейк)'
  - 'Тактика Прорыва: CQB Штурм (тактический симулятор покомнатного штурма)'
  - Аркадный fps упором пинки / kick & shoot (рогалик-шутер с упором на пинки)
  - Vampire Survivors / Brotato (автошутеры на выживание с карточками улучшений)
  - Sniper 3D / Hitman Sniper (статичные мобильные снайперские галереи)
knowledge_plan:
  selections:
  - path: stack/postprocessing.md
    role: core
    reason: Критически необходим для шейдерного пайплайна тепловизора FLIR с режимами
      White-Hot/Black-Hot, шумом матрицы и сканлайнами.
  - path: stack/rapier3d.md
    role: core
    reason: Физический движок для симуляции орбитальной баллистики снарядов 25/40/105мм,
      кинетического сплеша взрывов и цепных реакций.
  - path: threejs/physics_integration.md
    role: core
    reason: Интеграция Three.js и Rapier3D для синхронизации физических тел снарядов,
      обломков разрушенных укрытий и рэгдоллов с рендером.
  - path: mechanics/chain_reaction.md
    role: core
    reason: Расчет радиусов поражения, кинетического сплеша взрывов и пространственных
      ограничений Danger Close возле отряда спецназа.
  - path: mechanics/physics_destruction.md
    role: core
    reason: Честный физический расчет динамического обрушения укрытий, стен и блокпостов
      от попаданий тяжелых калибров 40мм и 105мм.
  - path: mechanics/cover_and_suppression.md
    role: core
    reason: Тактическое поведение врагов в укрытиях и подавление живой силы пулеметным
      огнем 25мм для прикрытия продвижения отряда «Браво».
  - path: threejs/performance_guide.md
    role: supporting
    reason: Бюджет кадра и инстансинг снарядов, взрывных эффектов и обломков для удержания
      стабильных 60 FPS на мобильных устройствах.
  - path: threejs/adaptive_quality.md
    role: supporting
    reason: Адаптивное масштабирование разрешения и тяжести пост-шейдеров FLIR под
      нагрузкой во время массированных детонаций.
  - path: threejs/mobile_shaders.md
    role: supporting
    reason: Оптимизация кастомных тепловизионных шейдеров и материалов техники под
      ограничения мобильных GPU.
  - path: threejs/procedural_mesh_builder.md
    role: supporting
    reason: Процедурная генерация построек боевой зоны, техники конвоя и элементов
      окружения без внешних 3D-моделей.
  - path: threejs/game_map_and_world_design.md
    role: supporting
    reason: Структурирование трех тактических секторов зоны спецоперации с учетом
      высотной орбитальной перспективы под углом 50 градусов.
  - path: threejs/procedural_character_rig.md
    role: supporting
    reason: Процедурный риг и контрастные тепловые силуэты бойцов союзного спецназа
      «Браво» и вражеской пехоты.
  - path: threejs/vehicle_wheel_rig.md
    role: supporting
    reason: Процедурная сборка и риг колесной техники вражеских моторизованных колонн
      и пикапов.
  - path: mechanics/ragdoll.md
    role: supporting
    reason: Физическая реакция тел бойцов и рэгдолл-отлет при воздействии ударных
      волн и кинетических импульсов 105мм снарядов.
  - path: threejs/juice_and_vfx_pool.md
    role: supporting
    reason: Инстансированный пул частиц для ослепительно белых тепловых вспышек, дыма,
      трассеров и отдачи камеры при выстрелах.
  - path: audio/procedural_sound_synthesizer.md
    role: supporting
    reason: Процедурный Web Audio синтез залпов трех калибров, взрывов, радиопереговоров
      и низкочастотного гула двигателей AC-130.
  - path: audio/web_audio_and_muting.md
    role: supporting
    reason: Корректная инициализация Web Audio по первому взаимодействию и автоглушение
      звука при потере вкладкой фокуса.
  - path: monetization/interstitial_best_practices.md
    role: supporting
    reason: Показ межстраничной рекламы в естественных сюжетных паузах между секторами
      эскорта и на экране финального дебрифинга.
  rejected:
  - threejs/fps_controller_and_shooting.md
  - threejs/shooter_enemy_ai_and_combat.md
  - threejs/horde_survivor_core.md
  - patterns/survivor_loop.md
  - patterns/rts_skirmish_loop.md
  - threejs/rts_selection_and_command.md
  - mechanics/upgrade_choices.md
  - threejs/rapier_vehicle_controller.md
  - stack/recast_navigation.md
  - patterns/physics_arcade_loop.md
  rejection_reason: Отклонены шаблоны FPS и RTS, так как управление ведется только
    бортовой турелью AC-130 с орбиты 1000м; исключены механики орды, карточных апгрейдов
    и автострельбы типа Vampire Survivors, запрещенные ТЗ; отброшены тяжелый навмеш
    Recast и полный контроллер машин, так как техника и пехота двигаются по срежиссированным
    тактическим маршрутам.
  loop_pattern: ''
  summary: Проект опирается на связку Rapier3D и postprocessing для орбитальной баллистики
    и аутентичного FLIR-тепловизора, процедурную геометрию и физику разрушений укрытий
    при эскорте спецназа; готовый архетип петли в patterns отсутствует из-за специфики
    рельсового авиа-шутера.
