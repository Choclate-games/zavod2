  - Проверка застревания рэгдоллов в разрушаемой геометрии стен
  - Проверка утечек WebGL буферов при рестарте миссии без перезагрузки страницы
  - Проверка сохранения аудио-контекста после показа Interstitial рекламы
roadmap:
- phase_number: 1
  title: Орбитальное Ядро и FLIR Шейдер
  duration_days: 2
  tasks:
  - Настройка сцены Three.js с орбитальной камерой на высоте 1000м и углом 50 градусов
  - Разработка кастомного шейдера постобработки FLIR White-Hot с термо-эмиссией и
    шумом
  - Реализация прицельного комплекса с баллистическим расчетом подлета снарядов 25/40/105мм
  - Интеграция сенсорного свайп-управления и мыши
  milestone_deliverable: Рабочий прототип прицеливания и стрельбы тремя калибрами
    по мишеням в режиме ночного тепловизора.
- phase_number: 2
  title: Физика Разрушений, Цепные Взрывы и ИИ Спецназа
  duration_days: 3
  tasks:
  - 'Интеграция Rapier3D: сплеш-урон, импульсы взрывов, рэгдоллы пехоты и разрушаемые
    стены'
  - Создание цепных реакций детонации техники и взрывоопасных объектов
  - Реализация ИИ союзного спецназа с маршрутом движения и зоной Danger Close
  - Система Friendly Fire и проверка условий победы/поражения
  milestone_deliverable: Полноценный геймплейный цикл спецоперации с прикрытием спецназа
    и разрушаемым окружением.
- phase_number: 3
  title: HUD, Радиопереговоры, Звуковой Дизайн и Сок
  duration_days: 2
  tasks:
  - Создание аутентичного военного HUD с индикаторами калибров, таймером и комбо-счетчиком
  - Озвучка орудийных выстрелов, взрывов и интеграция радиореплик экипажа AC-130
  - 'Полировка визуала: CRT-сканлайны, частицы дыма, тепловое свечение от эпицентров
    взрывов'
  - Настройка кривой нарастания сложности в 90-секундной миссии
  milestone_deliverable: Кинематографичная готовая боевая миссия с полным аудиовизуальным
    погружением.
- phase_number: 4
  title: Мета-прогрессия, Монетизация и Релиз на Playgama Bridge
  duration_days: 2
  tasks:
  - Реализация меню ангара и системы модернизации орудий за тактические кредиты
  - Интеграция Playgama Bridge SDK (Rewarded реклама ревайва и удвоения, облачные
    сохранения, лидерборды)
  - Кроссплатформенная оптимизация для мобильных браузеров и Safari iOS
  - Финальное QA-тестирование и сборка релизного бандла
  milestone_deliverable: Релизная версия игры, готовая к публикации на платформах
    Яндекс Игры, VK и Web.
risks:
- risk: Сложность освоения баллистического упреждения (задержка 1.2–2.5 с) для казуальных
    игроков на смартфонах.
  category: game_design
  severity: Medium
  mitigation: 'Добавление визуальных дальномерных меток на прицельной сетке и плавная
    кривая обучения: в первые 25 секунд появляются только медленные пехотинцы на открытых
    пространствах.'
- risk: Падение производительности на бюджетных мобильных GPU при одновременных взрывах
    нескольких единиц техники.
  category: technical
  severity: Medium
  mitigation: Использование инстансинга для геометрии обломков, пулинг частиц и жесткий
    лимит на количество активных физических тел Rapier3D (максимум 30).
- risk: Фрустрация игрока от случайного дружественного огня по спецназу в финале миссии.
  category: game_design
  severity: Medium
  mitigation: Яркие пульсирующие стробоскопы на шлемах союзников, предупреждающая
    красная рамка прицела при наведении ближе 15м к спецназу и возможность мгновенного
    ревайва за просмотр рекламы.
skills:
- skill_id: flir_thermal_shader
  name: FLIR Thermal Post-Processing Shader
  filename: skills/flir_thermal_shader.md
  purpose: Создание монохромного шейдера тепловизора White-Hot с термо-эмиссией, CRT-сканлайнами
    и шумом матрицы для Three.js.
  when_to_use: При настройке рендерера и постобработки боевой сцены AC-130.
  rules:
  - Использовать однопроходный ShaderPass в EffectComposer
  - Рендерить горячие объекты с Emissive > 1.0 для последующего теплового свечения
  - Оптимизировать шум матрицы через UV псевдорандом без ресурсоемких математических
    функций
  architecture: 'Three.js EffectComposer -> Custom ThermalShaderMaterial (Uniforms:
    tDiffuse, uTime, uNoiseIntensity, uZoom) -> Output to Canvas.'
  implementation_guidance: Скомпилировать GLSL фрагментный шейдер, рассчитывающий
    градиент яркости от температуры материала и накладывающий динамическую зернистость.
  common_mistakes:
  - Использование тяжелых многослойных шумов Перлина, просаживающих FPS на мобильных
    устройствах
  - Отсутствие маскирования интерфейса HUD (HUD должен оставаться четким и не зашумляться
    шейдером сцены)
  checklist:
  - Шейдер выдает стабильные 60 FPS на мобильном Safari
  - Горячие двигатели и взрывы имеют ослепительно белый цвет
  - Союзные стробоскопы отчетливо мерцают с частотой 2 Гц
  knowledge_refs:
  - tech/threejs_shaders.md
- skill_id: orbital_ballistics_engine
  name: Orbital Ballistics & Splash Engine
  filename: skills/orbital_ballistics_engine.md
  purpose: Математический расчет полета снарядов с высоты 1000м, баллистического упреждения,
    радиусов сплеша и цепных реакций.
  when_to_use: При реализации орудийных систем 25мм, 40мм, 105мм и физических детонаций.
  rules:
  - Скорость снарядов и время подлета фиксированы для каждого калибра
  - Сплеш рассчитывается через сферические запросы к физическому миру Rapier3D
  - Вторичные детонации транспорта происходят с задержкой 0.3-0.5с для создания каскадного
    эффекта
  architecture: BallisticsManager -> Projectile Entities -> Rapier3D Physics World
    -> DestructionSystem -> ScoreManager.
  implementation_guidance: Использовать аналитическую параболическую/линейную формулу
    расчета точки падения с проверкой коллизии на высоте ландшафта.
  common_mistakes:
  - Использование честной физической пули на каждом кадре для скорострельного 25мм
    пулемета (нужно использовать рейкасты с отложенным уроном)
  - Забывание про учет орбитального вращения самолета при расчете вектора выстрела
  checklist:
  - Гаубица 105мм имеет честную задержку 2.3с
  - Автопушка 40мм имеет сплеш 6м и задержку 1.6с
  - Friendly Fire корректно триггерится при взрыве рядом со спецназом
  knowledge_refs:
  - mechanics/chain_reaction.md
  - mechanics/cover_and_suppression.md
- skill_id: game_skill
  name: 'AC-130: Ночной Тепловизор Domain Architecture'
  filename: GAME_SKILL.md
  purpose: 'Defines domain rules, state machine, and core gameplay loop for AC-130:
    Ночной Тепловизор.'
  when_to_use: Use when writing or modifying core game state, loop coordination, and
    progression.
  rules:
  - Strict TypeScript strict mode without any 'any' types.
  - Fixed 60Hz delta accumulator with delta clamping.
  - Decoupled state management via typed EventBus.
  - Zero runtime object allocations inside the 60Hz game loop.
  architecture: 'Decoupled 3-layer architecture: Application/Platform -> Engine/Systems
    -> Rendering/UI.'
  implementation_guidance: Instantiate Game instance from main.ts, bootstrap PlaygamaService,
    and start GameLoop.
  common_mistakes:
  - Do not instantiate Three.js meshes or heavy objects inside tick loops.
  - Do not bypass the EventBus for cross-system communications.
  checklist:
  - Game initializes cleanly and loads within 3 seconds.
  - EventBus routes inputs and system events without memory leaks.
  - Audio auto-pauses and unpauses cleanly with browser focus changes.
  knowledge_refs: []
- skill_id: gameplay_skill
  name: Combat, Physics & Movement Systems
  filename: GAMEPLAY_SKILL.md
  purpose: Defines standards for physics simulation, combat mechanics, and tactile
    player feedback.
  when_to_use: Use when writing character controllers, weapon systems, collision listeners,
    and juice/VFX.
  rules:
  - Clamp delta time to maximum 100ms to prevent physics tunneling.
  - Use continuous collision detection (CCD) for fast projectiles.
  - Apply hitstop (40ms time dilation) on impactful strikes.
  - Always synchronize physics rigid body transforms to mesh representations.
  architecture: Physics engine (Rapier3D/Matter.js) stepped on fixed 60Hz timestep,
    meshes interpolated.
  implementation_guidance: Use EventBus to emit 'entity:hit', 'combat:parry', 'wave:cleared'
    events for sound and VFX triggers.
  common_mistakes:
  - Never modify transform matrices directly on physics-controlled entities.
  - Do not hardcode magic numbers for damage or velocities without centralized configuration.
  checklist:
  - Player movement is responsive with no input lag.
  - Hits produce satisfying sensory feedback (VFX spark, screen shake, audio impact).
  - Ragdoll or death animations trigger smoothly without physics jitter.
  knowledge_refs: []
- skill_id: renderer_skill
  name: THREEJS WebGL Performance Guide
  filename: RENDERER_SKILL.md
  purpose: Optimization and visual standards for THREEJS WebGL pipeline.
  when_to_use: Use when configuring scenes, cameras, lighting, materials, instanced
    meshes, and particle systems.
  rules:
  - Keep active draw calls strictly under 80.
  - Use InstancedMesh for debris, bullets, and crowd mobs.
  - Clamp pixel ratio to Math.min(window.devicePixelRatio, 1.5) on mobile.
  - Share material instances across identical geometry.
  architecture: Scene graph with pre-allocated sprite and mesh pools, dynamic shadow
    frustum optimization.
  implementation_guidance: Initialize renderer with antialias enabled on desktop,
    powerPreference 'high-performance'.
  common_mistakes:
  - Do not construct new Geometries, Textures, or Materials in the render loop.
  - Do not leave unused GPU assets without calling .dispose().
  - Do not tune quality from raw frame time — under vsync every frame reads as budget-length.
  - Do not launch in reduced quality and climb up; start optimistic and step down.
  checklist:
  - Maintains solid 60 FPS on desktop and >= 50 FPS on mobile.
  - No WebGL context loss errors on tab switches.
  - Shadow map renders crisp without artifact acne.
  - The quality auto-tuner converges and locks instead of oscillating.
  knowledge_refs:
  - threejs/performance_guide.md
  - threejs/adaptive_quality.md
