gameplay_systems:
- name: Орбитальная Баллистическая Система (Orbital Ballistics)
  purpose: Расчет траекторий, времени подлета (1.2–2.5 с) и точек импакта снарядов
    с высоты 1000м с учетом орбитального движения самолета.
  input: Координаты точки прицеливания на поверхности земли, тип выбранного оружия.
  rules:
  - Снаряд 25мм летит со скоростью 830 м/с (задержка 1.2 с, нулевой разлет в прицельном
    круге)
  - Снаряд 40мм летит со скоростью 620 м/с (задержка 1.6 с, сплеш 6м)
  - Снаряд 105мм летит со скоростью 435 м/с (задержка 2.3 с, сплеш 18м, перезарядка
    4.2 с)
  state:
  - active_projectiles_in_air
  - weapon_cooldown_timers
  - heat_accumulation_levels
  interactions: Передает координаты детонации в Физическую Систему Взрывов при достижении
    высоты поверхности Y=0.
  feedback: Трассирующие маркеры падения, звуки выстрелов и свиста снарядов, тряска
    прицела.
  edge_cases:
  - Стрельба в край экрана при быстром повороте камеры (снаряд должен честно приземлиться
    в рассчитанную мировую координату даже вне текущего обзора)
- name: FLIR Тепловизионный Шейдерный Комплекс (Thermal Vision)
  purpose: Отрисовка монохромной высококонтрастной картинки White-Hot с подсветкой
    термо-сигнатур, шумом матрицы, виньетированием и CRT-сканлайнами.
  input: Буфер рендера Three.js, значения температуры материалов объектов (холодный
    бетон = серый/черный, тепло тела = чистый белый, горячий двигатель = ослепительно
    белый с блумом).
  rules:
  - Все живые союзники и враги рендерятся с максимальной яркостью эмиссии (Emissive
    White 1.0)
  - 'Остывание подбитой техники: температура спадает по экспоненте в течение 15 секунд'
  - Мерцание ИК-стробоскопов спецназа с частотой 2 Гц
  state:
  - thermal_palette_mode (White-Hot / Black-Hot)
  - crt_noise_intensity
  - zoom_level (1x / 2x / 4x)
  interactions: Интегрируется как Three.js EffectComposer ShaderPass, обрабатывая
    всю сцену за один полноэкранный проход.
  feedback: Специфический тепловой шум матрицы, тепловое послесвечение от взрывов,
    цифровой зум с переключением сетки.
  edge_cases:
  - 'Низкая производительность на мобильных GPU: шейдер скомпилирован без тяжелых
    циклов и шумов Перлина, используется легковесный псевдослучайный шум по UV.'
- name: ИИ Союзного Отряда Спецназа (Friendly Escort AI)
  purpose: Управление движением 4 бойцов отряда «Браво» по контрольным точкам миссии
    с реакцией на врагов, занятием укрытий и запросами огневой поддержки.
  input: Навигационная сетка (NavMesh/Waypoints), позиции врагов в радиусе видимости.
  rules:
  - Отряд движется вперед только тогда, когда впередилежащий сектор зачищен или враги
    подавлены
  - При появлении врагов бойцы занимают ближайшие бетонные укрытия и ведут ответный
    огонь
  - При гибели всех 4 бойцов инициируется поражение миссии
  state:
  - squad_alive_count (1..4)
  - current_waypoint_index
  - squad_combat_state (Moving, InCover, PinnedDown, Evacuating)
  interactions: Взаимодействует с системой радиопереговоров, отправляя фразы запроса
    огневой поддержки и предупреждения об опасности.
  feedback: Мерцающие термо-маячки на шлемах, анимации бега и стрельбы из-за укрытий,
    радиодиалоги.
  edge_cases:
  - 'Боец застрял в геометрии разрушенного здания: автоматический сдвиг на ближайшую
    валидную точку навигационной сетки.'
- name: Физическая Система Разрушений и Цепных Реакций (Destruction & Physics)
  purpose: Симуляция кинетических импульсов, взрывных волн, рэгдоллов пехоты и разрушения
    модульных укрытий на базе Rapier3D.
  input: Эпицентры детонаций снарядов, радиус и мощность взрыва.
  rules:
  - Пехота в радиусе летального поражения мгновенно переходит в режим ragdoll с импульсом
    от центра взрыва
  - Техника теряет прочность; при 0 HP спавнится модель остова и генерируется вторичный
    взрыв боеукладки
  - Стены зданий разрушаются на заранее подготовленные низкополигональные обломки
    с ограничением жизни (4 секунды)
  state:
  - active_rigid_bodies_pool
  - destructible_objects_registry
  - active_secondary_explosions
  interactions: Передает события уничтожения врагов в Систему Комбо и Подсчета Очков.
  feedback: Разлет белых светящихся обломков, физическая волна, пылевое тепловое облако.
  edge_cases:
  - 'Превышение лимита в 30 активных физических тел: немедленное удаление старейших
    мелких обломков.'
core_design:
  signature_moment: 'На 72-й секунде ночной миссии союзный отряд Bravo-6 зажат в тупике
    узкой улочки под перекрестным огнем двух тяжелых БТР и гранатометчиков с крыш;
    ИК-стробоскопы спецназовцев мигают в 14 метрах от брони врага. Игрок переключается
    на 105-мм гаубицу, свайпом закладывает 2.2-секундное баллистическое упреждение
    перед ведущим БТР и жмет спуск. Грохот отдачи сотрясает FLIR-камеру, 2 секунды
    гробовой радиотишины в наушниках — и ослепительно белая вспышка White-Hot превращает
    БТР в огненный шар, взрывная волна сносит угол кирпичного здания прямо на второй
    БТР, вызывая вторичную детонацию боекомплекта, а в рации на фоне свиста осколков
    хрипит капитан Прайс: «Danger close! Direct hit, hostiles wiped, Bravo-6 moving
    out!».'
  genre_template_rejected: 'Отвергаем шаблон ''Hitscan-тир с автодоводкой и аркадным
    овердрайвом'' (характерный для казуальных рельсовых шутеров, где пули попадают
    мгновенно по тапу в силуэт врага, а урон масштабируется полосками HP). Причина
    отказа: мгновенный урон полностью уничтожает фундаментальное ощущение высоты (1000
    метров), веса орудий и тактического напряжения оператора ганшипа. Мы заменяем
    хитскан на честную орбитальную баллистику с физическим временем подлета снарядов
    (1.2–2.2 с), радиусами разлета осколков и опасностью дружественного огня, превращая
    каждый выстрел из бездумного закликивания в расчетную баллистическую дуэль.'
  what_makes_it_different: 'В отличие от Zombie Gunship и аркадных тиров, где игрок
    отстреливает волны безликой биомассы, идущей по прямой, здесь петля строится на
    асимметричной эскорт-тактике в условиях жесткого ''Danger Close'' (риска уничтожить
    союзников собственным сплешем). Игрок управляет не летающим танком с бесконечной
    пальбой, а хладнокровным термооптическим комплексом: 25-мм пулемет мгновенно подавляет
    стрелков и расчищает пехоту, 40-мм автопушка ''шьет'' легкобронированные пикапы
    с упреждением по курсу движения, а 105-мм гаубица используется как хирургический
    инструмент с 2-секундным таймингом для обрушения зданий на технику врага. Успех
    определяется не скоростью закликивания, а чтением теплового контраста (White-Hot/Black-Hot),
    контролем температуры стволов и расчетом цепных физических взрывов в трехмерной
    городской среде Three.js/Rapier3D.'
  micro_loop:
  - step: Термосканирование сектора и захват тепловых сигнатур
    player_action: Плавное панорамирование FLIR-прицела свайпом/мышью и переключение
      оптического зума (2x/4x/8x) по вспышкам выстрелов и горячим двигателям техники.
    game_response: 'Рендеринг тепловой контрастности White-Hot: горячие двигатели
      пикапов и силуэты пехоты светятся белым (85–350°C), холодный бетон окружения
      остается темно-серым (15°C); ИК-стробоскопы спецназа пульсируют с частотой 2
      Гц.'
    decision: 'Идентифицировать вектор главной угрозы: гранатометчик на крыше (цель
      для 25мм) или колонна джипов на перекрестке (цель для 40мм/105мм).'
    duration: 0.8–1.5 с
  - step: Селекция калибра и расчет баллистического упреждения
    player_action: Тап по иконке калибра (1 / 2 / 3) с учетом таймера перезарядки
      и вынос перекрестья прицела вперед по вектору движения цели.
    game_response: Смена прицельной сетки (милы, поправка на орбитальный снос 3.5
      м/с), звуковой щелчок затвора механизма подачи и звуковая индикация готовности
      орудия.
    decision: Выбрать быстрый 25-мм пулемет с нулевым риском сплеша или мощный 105-мм
      снаряд с 2.2-секундной задержкой подлета и риском накрыть своих.
    duration: 0.3–0.8 с
  - step: Залп и баллистический полет снаряда в невесомости
    player_action: Нажатие гашетки (Fire / Space / Тап по кнопке огня) с фиксацией
      точки падения снаряда.
    game_response: Тяжелый акустический импульс выстрела с эхо-шлейфом в ночном небе,
      вспышка дульного пламени, трассер уходит по крутой баллистической дуге с высоты
      1000м к земле (время подлета t = 1.2–2.2 с).
    decision: Удерживать сектор огня для корректировки очереди или перенести внимание
      на соседний фланг обороны Bravo-6.
    duration: 1.2–2.2 с
  - step: Кинетический удар, детонация и разлет осколков
    player_action: Визуальный контроль точки попадания через термооптику FLIR.
    game_response: Ослепительная тепловая вспышка на сенсоре (bloom 1.8x), физический
      разлет рэгдоллов и обломков в Rapier3D, детонация баков техники (радиус 12м),
      радиоклик 'Target neutralized!'.
    decision: Требуется ли добивание остатков пехоты 25-мм очередью или сектор зачищен
      и союзники могут продолжить бег.
    duration: 0.5–1.0 с
  meso_loop:
  - step: 'Прорыв через Сектор 1: Уличная засада пехоты (0:00–0:25)'
    player_action: Подавление пулеметных огневых точек и снайперов на балконах короткими
      очередями 25-мм GAU-12 без перегрева ствола.
    game_response: Вражеская пехота вжимается в укрытия (suppression 100%), отряд
      Bravo-6 ускоренным маршем преодолевает первые 80 метров улицы под прикрытием
      трассеров.
    decision: Экономить ресурс нагрева 25-мм пулемета или отсекать наступающие группы
      плотным подавляющим огнем.
    duration: 25 с
  - step: 'Оборона Сектора 2: Моторизованный перехват и блокпост (0:25–0:55)'
    player_action: Стрельба отсечками по 3 снаряда из 40-мм Bofors по скоростным техничкам
      и разрушение кирпичного забора блокпоста.
    game_response: Прямые попадания подрывают пикапы, обломки стен погребают засевших
      стрелков; союзный отряд занимает круговую оборону у баррикады, запрашивая расчистку
      пути.
    decision: Стрелять прямо в пикап на полной скорости с упреждением 35 метров или
      обрушить водонапорную башню на дорогу перед ним.
    duration: 30 с
  - step: 'Кульминация Сектора 3: Танковый прорыв Danger Close и эвакуация (0:55–1:30)'
    player_action: Прицельный залп 105-мм гаубицы по танку Т-72 в 18 метрах от позиции
      спецназа с точным контролем границы поражения союзников.
    game_response: Катастрофический взрыв боеукладки танка, отрыв башни физическим
      импульсом 85000 Н, посадка вертолета MH-60 Black Hawk с дымовой завесой, посадка
      выживших бойцов на борт.
    decision: Рискнуть выстрелом 105-мм гаубицы на грани радиуса поражения спецназа
      или попытаться разобрать тяжелую броню серией 40-мм снарядов за 6 секунд.
    duration: 35 с
  macro_loop:
  - step: Брифинг спецоперации и выбор подвеса вооружения
    player_action: Изучение тепловой спутниковой карты миссии, выбор активных модификаций
      калибров (осколочно-фугасные / бронебойные снаряды).
    game_response: Отображение маршрута эскорта Bravo-6, плотности вражеской техники,
      расчетного бонуса за спасенных бойцов и целевых таймингов.
    decision: Сфокусировать билд на скорострельности 25-мм пулемета для плотной городской
      застройки или на радиусе поражения 105-мм гаубицы для открытых пространств.
    duration: 10–15 с
  - step: Боевой вылет огневой поддержки (60–90 с)
    player_action: Выполнение боевой задачи по сопровождению, зачистке угроз, набиванию
      комбо-серий и спасению всех 4 оперативников.
    game_response: Динамическая генерация волн противника, расчет точности, начисление
      боевого рейтинга (Accuracy, Collateral, Bravo Survival) и тактических кредитов.
    decision: Балансировать между агрессивной зачисткой ради максимального комбо-счета
      и осторожной защитой союзников от случайного сплеша.
    duration: 60–90 с
  - step: Дебрифинг, начисление кредитов и оружейная мастерская
    player_action: 'Инвестирование заработанных кредитов в апгрейды ганшипа: стабилизация
      гироскопа камеры, тепловые матрицы FLIR Gen-4, титановый автомат заряжания M102.'
    game_response: Разблокировка новых ТВД (Ночная Промзона, Нефтяной Терминал, Горный
      Перевал), повышение ранга оператора (от Second Lieutenant до Master Gunner)
      и прирост боевых ТТХ.
    decision: Вложить ресурсы в уменьшение дрожания прицела при зуме 8x или сократить
      время перезарядки 105-мм орудия на 0.4 с.
    duration: 15–30 с
  loop_diagram: "+-------------------------------------------------------------------------------+\n\
    |                      AC-130 SPECTRE: FLIR TACTICAL LOOP                    \
    \   |\n+-------------------------------------------------------------------------------+\n\
    \                                        |\n                                 \
    \       v\n                       [ 1. FLIR ТЕРМОСКАНИРОВАНИЕ ]\n            \
    \           - Сканирование White-Hot (2x/4x/8x Zoom)\n                       -\
    \ Поиск тепловых контрастов (пикапы/пехота)\n                       - Мониторинг\
    \ ИК-стробоскопов отряда Bravo-6\n                                        |\n\
    \                                        v\n                       [ 2. ТАКТИЧЕСКИЙ\
    \ ВЫБОР КАЛИБРА ]\n                       +----------------+----------------+\n\
    \                       | 25мм GAU-12    | 40мм Bofors    | 105мм Howitzer |\n\
    \                       | (Пехота/Крыши) | (Техника/Стены)| (Танки/Завалы) |\n\
    \                       +----------------+----------------+----------------+\n\
    \                                        |\n                                 \
    \       v\n                       [ 3. РАСЧЕТ БАЛЛИСТИКИ И УПРЕЖДЕНИЯ ]\n    \
    \                   - Упреждение по скорости цели (v = 8..22 м/с)\n          \
    \             - Время подлета снаряда (t = 1.2..2.2 с)\n                     \
    \  - Проверка Danger Close (дистанция до союзников)\n                        \
    \                |\n                                        v\n              \
    \         [ 4. ОГНЕВОЙ ЗАЛП И ФИЗИЧЕСКИЙ УДАР ]\n                       - Кинетический\
    \ импакт Three.js/Rapier3D\n                       - Разрушение зданий и обрушение\
    \ завалов\n                       - Вторичные цепные детонации бензовозов/БК\n\
    \                                        |\n                                 \
    \       v\n                       [ 5. ПРОДВИЖЕНИЕ ЭСКОРТА BRAVO-6 ]\n       \
    \                - Спецназ делает рывок по зачищенной улице\n                \
    \       - Подавление ответного огня противника\n                       - Спасены\
    \ 4/4 бойцов -> Эвакуация на вертолете\n                                     \
    \   |\n                                        v\n                       [ 6.\
    \ ОРУЖЕЙНАЯ МОДЕРНИЗАЦИЯ AC-130 ]\n                       - Прокачка охлаждения\
    \ GAU-12, гиростабилизатора,\n                         автомата заряжания 105мм\
    \ и FLIR матрицы Gen-4\n                                        |\n          \
    \                              +-----> (Возврат на новый ТВД)"
  tension_curve: 'Кривая напряжения представляет собой трехступенчатую пилообразную
    синусоиду с нарастающей амплитудой и взрывным пиком на 80-й секунде: 1) 0:00–0:15
    (Напряжение 20%): Спокойное сканирование ночного города, одиночные патрули пехоты,
    игрок пристреливается из 25-мм пулемета, спецназ спокойно выдвигается из точки
    высадки. 2) 0:15–0:30 (Напряжение 50%): Внезапная засада на перекрестке — гранатометчики
    на крышах открывают огонь, здоровье спецназа начинает таять; игрок лихорадочно
    переключается между 25мм и 40мм, подавляя угрозы. Спад напряжения (30%) после
    зачистки перекрестка. 3) 0:30–0:60 (Напряжение 75%): В сектор врываются 3 скоростных
    пикапа с крупнокалиберными пулеметами ДШК. Требуется расчет упреждения в 1.5–2.0
    секунды и обрушение придорожных построек для блокировки проезда. Спецназ укрывается
    за бетонными блоками. 4) 0:60–0:85 (Напряжение 100% — Апогей): Прорыв тяжелого
    танка Т-72 и двух БТР в непосредственной близости (12–15м) от союзного отряда.
    Режим Danger Close: малейшая ошибка в наведении 105-мм гаубицы убьет спецназ,
    а промедление на 3 секунды приведет к расстрелу отряда танковым орудием. 5) 0:85–0:90
    (Спад до 0% -> Катарсис): Детонация танка, посадка эвакуационного вертолета Black
    Hawk, доклад ''All Bravo teams aboard, dustoff!'', триумфальный взлет под звуки
    радиоэфира и подсчет боевых наград.'
  core_formulas:
  - 'Время подлета снаряда к земле: t_flight = H_alt / V_proj = 1000м / V_proj (для
    25мм: 1000 / 850 = 1.18 с; для 40мм: 1000 / 600 = 1.67 с; для 105мм: 1000 / 455
    = 2.20 с)'
  - 'Баллистическое упреждение точки прицеливания: Lead_pos = Target_pos + Target_velocity
    * t_flight + Orbit_drift_offset (где Orbit_drift_offset = 3.5 м/с * t_flight по
    касательной траектории виража AC-130)'
  - 'Урон от фугасного сплеша по расстоянию r: Dmg(r) = Base_Dmg * max(0, 1 - (r /
    Splash_Radius)^1.5) [для 105мм: Base_Dmg = 2500 ед, Splash_Radius = 18.0 м; для
    40мм: Base_Dmg = 450 ед, Splash_Radius = 6.5 м]'
  - 'Проверка протокола Friendly Fire (Danger Close check): Friendly_Casualty = (Distance(Impact_pos,
    Bravo_pos) < Ally_Danger_Radius) && (Caliber_Index >= 2) [где Ally_Danger_Radius_105mm
    = 14.5 м, Ally_Danger_Radius_40mm = 5.2 м]'
  - 'Термодинамика нагрева и охлаждения ствольного блока GAU-12: Heat_t = clamp(Heat_prev
    + Shots * 1.85°C - 18.0°C/с * dt, 20°C, 100°C); при Heat >= 100°C наступает Jam_Lockout
    на 3.5 с'
  - 'Физический импульс ударной волны Rapier3D: Impulse_Vector = normalize(Entity_pos
    - Blast_Center) * (Blast_Force / max(1.0, Distance^2)) [для 105мм: Blast_Force
    = 120000 Н*с; для бензовоза: Blast_Force = 180000 Н*с]'
  - 'Итоговый боевой рейтинг спецоперации: Total_Score = (Enemies_Killed * 150 + Armor_Destroyed
    * 500 + Chain_Explosions * 300) * Accuracy_Multiplier * (Bravo_Survivors / 4)
    + Time_Bonus_Credits'
  run_progression:
  - 'Заряд орбитального лазерного целеуказателя Pave Penny: за каждые 5 точных попаданий
    подряд накапливается 1 тактический маркер мгновенной подсветки упреждения (HUD
    показывает точную точку падения для 105мм снаряда).'
  - 'Температурный овердрайв FLIR-сенсора: комбо-серия x10 активирует режим ультра-контрастности
    ''Super White-Hot'' на 8 секунд, подсвечивающий врагов сквозь тонкие перекрытия
    крыш с 1.25x множителем очков.'
  - 'Экстренный запрос сброса ИК-дымовой завесы спецназом Bravo-6 (1 заряд на миссию):
    союзники активируют термо-маскировочный блок, снижая меткость вражеских стрелков
    на 85% в течение 6.0 секунд.'
  - 'Огневой раж расчета гаубицы: уничтожение 3 единиц тяжелой техники снижает базовое
    время ручной перезарядки 105-мм орудия с 4.5 с до 3.2 с до конца текущей спецоперации.'
  meta_progression:
  - 'Гиростабилизированный кардан FLIR Mark IV: 5 уровней апгрейда, снижающих амплитуду
    рыскания и дрожания прицельной сетки при 8x зуме с 0.45° до 0.08° за 1200–8500
    кредитов.'
  - 'Титановый гидропневматический досылатель 105-мм гаубицы M102: сокращение базового
    времени перезарядки орудия с 5.2 с до 3.8 с (шаг 0.28 с за уровень) за 2500–15000
    кредитов.'
  - 'Криогенное охлаждение ствольного блока GAU-12/U Equalizer: увеличение порога
    перегрева с 28 непрерывных выстрелов до 65 выстрелов и ускорение сброса температуры
    с 12°C/с до 28°C/с.'
  - 'Высокочувствительная неохлаждаемая тепловизионная матрица HD-FLIR Gen-4: открывает
    режим фильтрации ложных тепловых помех и подсвечивает контуры бронетехники желтым
    термоконтуром.'
  - 'Разблокировка оперативных театров боевых действий (ТВД): ''Нефтяной Терминал
    Басра'' (обилие взрывоопасных резервуаров для цепных реакций), ''Горная Застава
    Кандагар'' (многоярусный серпантин) и ''Ночная Промзона''.'
  mechanics:
  - name: Баллистическое жонглирование тройным калибром (Triple-Caliber Orbital Ballistics)
    role_in_loop: Двигатель боевого темпа и основной инструмент решения огневых задач
    player_decision: 'Какой калибр применить по текущему типу угрозы: мгновенно подавить
      пехоту 25-мм пулеметом, выдать серию 40-мм снарядов по быстрому пикапу или выпустить
      105-мм гаубичный снаряд по танку/зданию с учетом 2.2-секундного упреждения и
      4.5-секундного кулдауна.'
    input_mapping: 'Клавиатура: Клавиши 1, 2, 3 — мгновенный выбор калибра; Пробел
      / ЛКМ — стрельба; Колесо мыши — оптический зум 2x/4x/8x. Мобильный тач: Крупные
      боковые плашки выбора калибров ''25mm'', ''40mm'', ''105mm'' под правый палец;
      тап/удержание правой зоны экрана — ведение огня; свайп левой зоны — наведение
      турели.'
    states:
    - 'CALIBER_READY: выбранный калибр заряжен, прицельная марка активна, орудие готово
      к открытию огня.'
    - 'FIRING_BURST: ведется стрельба (25мм — непрерывная очередь до отпускания гашетки;
      40мм — полуавтоматическая отсечка по 1-3 выстрела; 105мм — одиночный залп).'
    - 'RELOADING_COOLDOWN: орудие на перезарядке (105мм — 4.5 с, 40мм — 1.8 с на кассету);
      доступно мгновенное переключение на другие калибры.'
    - 'OVERHEAT_JAM: ствольный блок 25мм нагрелся до 100°C; принудительная блокировка
      огня на 3.5 с с воспроизведением аварийного зуммера.'
    parameters:
    - name: Скорость полета 105-мм снаряда (V_105)
      value: '455 м/с (время подлета с 1000м: 2.20 с)'
      tuning_note: Если увеличить скорость выше 700 м/с, пропадет магия предвкушения
        попадания и расчет упреждения; если уменьшить ниже 350 м/с, попадать по движущейся
        технике станет невозможно без чистого везения.
    - name: Радиус сплошного поражения 105-мм ОФС
      value: 18.0 м (Base Damage 2500 ед)
      tuning_note: Если сделать больше 25 м, гаубица будет зачищать весь экран в один
        клик и постоянно взрывать спецназ; если меньше 12 м, попадание покажется слабым
        и не оправдает 4.5-секундную перезарядку.
    - name: Скорострельность 25-мм пулемета GAU-12
      value: 1800 выстр/мин (30 выстр/с, 85 ед урона/пуля)
      tuning_note: При занижении ниже 1200 выстр/мин пулемет теряет тактильный кайф
        лазерной 'пилы'; при завышении выше 2500 выстр/мин перегрев наступает мгновенно
        за 0.8 с.
    - name: Время перезарядки 105-мм гаубицы
      value: 4.50 с
      tuning_note: Если снизить до 2.0 с, игрок перестанет использовать 40мм и 25мм;
        если поднять выше 6.5 с, темп игры в 90-секундной сессии провисает в мучительное
        ожидание.
    feedback_layers:
    - 'Визуал/VFX: Для 25мм — сплошная трассирующая белая нить в тепловизоре с россыпью
      микро-вспышек на бетоне; для 40мм — пульсирующие яркие вспышки разрывов диаметром
      4м; для 105мм — гигантская ослепительно белая термическая вспышка с эффектом
      FLIR-засветки сенсора (bloom 2.2x), огненный шар диаметром 22м и столб раскаленной
      пыли.'
    - 'Звук (Web Audio): Приглушенный тяжелый грохот выстрела внутри фюзеляжа ганшипа
      с пространственной реверберацией, глухой свист рассекаемого воздуха, через 2.2
      с — низкочастотный басовый удар (45 Гц sub-bass) детонации на земле и радиодоклад
      штурмана: ''Kaboom! Direct hit!''.'
    - 'Камера (импульс/зум): Для 105мм — резкий вертикальный угловой толчок виртуальной
      камеры (шейк 0.35° с затуханием 0.4 с) в момент выстрела и вторичный легкий
      микро-шейк при детонации на земле.'
    - 'UI/Тактильность: Для мобильных устройств — мощный короткий виброотклик (45
      мс) при выстреле 105мм и пульсирующая вибрация (12 мс) при стрельбе из 25мм;
      динамическая смена прицельной сетки с отображением термошкалы нагрева ствола
      и таймера заряжания.'
    failure_mode: 'Игрок стреляет 105-мм снарядом в быструю технику без упреждения
      — снаряд падает в пустоту позади машины, орудие уходит на 4.5-секундную перезарядку,
      а техничка безнаказанно подъезжает к спецназу и открывает огонь. Сигнал: радиодоклад
      ''Splash, no hit! Lead the target!'' и маркер падения в 20 метрах за целью.'
    mastery_curve: 'Новичок на 30-й секунде судорожно палит из 105мм по одиночным
      пехотинцам, перегревает 25мм пулемет и оказывается безоружным перед танком.
      Эксперт на 10-м забеге непрерывно жонглирует оружием: удерживает пехоту короткими
      отсечками 25мм (3–5 пуль), 40мм кассетами срезает пикапы на виражах с упреждением
      в 1.8 с, а 105мм оставляет строго для тяжелой брони и узловых зданий.'
    counterplay: Противник выпускает скоростные пикапы 'Тойота' (скорость до 22 м/с),
      которые резко меняют траекторию движения на перекрестках при звуках близких
      разрывов, сбивая прицельное упреждение.
    synergies:
    - 'Связь с Механикой 2 (Danger Close): выбор калибра жестко лимитируется дистанцией
      до отряда Bravo-6 (вблизи своих разрешен только точечный 25-мм пулемет).'
    - 'Связь с Механикой 3 (Физическая детонация): 105-мм снаряд подрывает цистерны
      с топливом, создавая вторичные волны поражения без расхода боеприпасов.'
    why_unique: В отличие от большинства мобильных тиров с мгновенным уроном, здесь
      реализована честная физическая задержка орбитальной баллистики (2.2 с для 105мм),
      требующая мышления на 2 секунды вперед и дарящая эйфорический выброс дофамина
      при точном попадании.
    pseudocode: "function tickWeapons(dt, input) {\n  if (input.switchCaliber) currentCaliber\
      \ = input.selectedCaliber;\n  if (currentCaliber.isOverheated) {\n    currentCaliber.heatTimer\
      \ -= dt;\n    if (currentCaliber.heatTimer <= 0) currentCaliber.isOverheated\
      \ = false;\n    return;\n  }\n  if (input.firePressed && currentCaliber.cooldown\
      \ <= 0) {\n    currentCaliber.cooldown = currentCaliber.baseCooldown;\n    currentCaliber.heat\
      \ += currentCaliber.heatPerShot;\n    spawnBallisticProjectile(camera.getAimRay(),\
      \ currentCaliber.speed, currentCaliber.splashRadius);\n    triggerRecoilCameraShake(currentCaliber.shakeIntensity);\n\
      \    playWebAudioShot(currentCaliber.soundId);\n  }\n  currentCaliber.cooldown\
      \ = Math.max(0, currentCaliber.cooldown - dt);\n  currentCaliber.heat = Math.max(0,\
      \ currentCaliber.heat - currentCaliber.coolingRate * dt);\n}"
  - name: Протокол Danger Close и ИК-стробоскопы Bravo-6 (Danger Close & IR Beacon
      Protocol)
    role_in_loop: Главный источник тактического риска, напряжения и регулятор точности
      стрельбы
    player_decision: Стрелять ли тяжелым 105-мм/40-мм калибром по врагам, подошедшим
      вплотную к союзному спецназу, рискуя мгновенно уничтожить отряд дружественным
      огнем, или ювелирно вырезать врагов точечным 25-мм пулеметом за счет драгоценного
      времени.
    input_mapping: Визуальное позиционирование прицела вдали от пульсирующего маркера
      союзников. Двойной клик/быстрый тап по кнопке '25mm' для мгновенного безопасного
      переключения при входе врагов в зону Danger Close.
    states:
    - 'SAFE_CLEARANCE: союзники находятся на дистанции > 25 метров от точки прицеливания;
      HUD горит нейтральным белым цветом, все калибры разрешены.'
    - 'DANGER_CLOSE_WARNING: точка прицеливания тяжелого калибра (40мм/105мм) находится
      в 10–24 метрах от отряда; на прицеле пульсирует красный индикатор ''DANGER CLOSE'',
      радио возглас оператора ''Friendly footprint in splash zone!''.'
    - 'FRIENDLY_FIRE_INCIDENT: снаряд 40мм/105мм сдетонировал в радиусе поражения
      союзников; мгновенная гибель бойцов, радиотишина с помехами, оперативный провал
      миссии.'
    parameters:
    - name: Радиус запрета огня 105-мм гаубицы (Danger Radius)
      value: 14.5 м от ИК-маяка Bravo-6
      tuning_note: Если уменьшить радиус ниже 8 м, опасность дружественного огня перестает
        ощущаться и игрок начинает бездумно спамить 105мм по своим; если увеличить
        свыше 22 м, стрелять в 3-й фазе становится некуда.
    - name: Частота мерцания ИК-стробоскопа CID-01
      value: 2.0 Гц (2 вспышки в секунду)
      tuning_note: При частоте менее 1 Гц маяк теряется на фоне ночных пожаров и взрывов;
        при постоянном свечении без мерцания игрок путает спецназовцев с вражеской
        пехотой.
    - name: Здоровье одного бойца спецназа
      value: 150 HP (выдерживает до 4 попаданий из АК-47)
      tuning_note: Если дать больше 300 HP, игрок перестает защищать союзников; если
        дать меньше 75 HP, спецназ погибает от случайной шальной пули за 0.5 с.
    - name: Скорость движения отряда Bravo-6 на марше
      value: '4.2 м/с (при спринте: 6.5 м/с)'
      tuning_note: Если замедлить ниже 2.5 м/с, миссия становится затянутой и скучной;
        если ускорить выше 8.0 м/с, баллистические снаряды 105мм отстают от темпа
        группы.
    feedback_layers:
    - 'Визуал/VFX: Нашлемные стробоскопы 4 бойцов спецназа вспыхивают ярко-белым тепловым
      импульсом с мягким ореолом; при наведении 105мм в опасную зону на земле проецируется
      пульсирующий пунктирный круг Danger Close с перечеркнутым черепом.'
    - 'Звук (Web Audio): Предупреждающий прерывистый сигнал зуммера (частота 880 Гц
      / 440 Гц ''бип-бип''), тревожные доклады в радиоэфире командира спецназа: ''Bravo-6
      to Spectre, you are Danger Close, watch your splash!''.'
    - 'Камера (импульс/зум): Автоматическое легкое натяжение виньетки с красным хроматическим
      смещением по краям экрана при попадании прицела в зону Danger Close.'
    - 'UI/Тактильность: Мерцающая надпись ''DANGER CLOSE: 12.4m'' в центре HUD рядом
      с перекрестьем прицела; частая тактильная микро-вибрация смартфона (по 20 мс
      каждые 150 мс) как тактильный сигнал опасности.'
    failure_mode: 'Игрок выпускает 105-мм снаряд в группу врагов, но спецназ успевает
      добежать до зоны поражения до момента приземления снаряда через 2.2 с. Сигнал:
      ослепительный взрыв накрывает стробоскопы, радиоканал заполняется белым шумом,
      экран покрывается статическими помехами с надписью ''MISSION FAILED: FRIENDLY
      FIRE CASUALTY''.'
    mastery_curve: Новичок на 30-й секунде либо взрывает собственный отряд фугасом,
      либо боится стрелять тяжелым калибром и смотрит, как спецназ расстреливают враги.
      Мастер на 10-м забеге кладет 105-мм снаряд ровно в 15.5 метрах от головы бегущей
      колонны спецназа с идеальным расчетом упреждения, расчищая путь секунда-в-секунду
      без единой царапины союзникам.
    counterplay: Вражеские камикадзе-штурмовики и бронированные багги целенаправленно
      таранят позиции спецназа, сокращая дистанцию до 5–8 метров и вынуждая игрока
      отказываться от артиллерии.
    synergies:
    - 'Связь с Механикой 4 (Термодинамика FLIR и подавление): игрок заливает зону
      контакта 25-мм очередью, подавляя штурмовиков, пока союзники разрывают дистанцию
      до безопасных 15 метров.'
    - 'Связь с Механикой 1 (Калибры): мгновенное тактическое переключение на 25-мм
      пулемет как единственное безопасное хирургическое оружие в радиусе 10 метров.'
    why_unique: Friendly Fire в игре — это не банальный штраф по очкам, а фундаментальное
      пространственное ограничение физического сплеша оружия с отложенным баллистическим
      таймингом, создающее киношную драму 'на волоске от гибели'.
    pseudocode: "function checkDangerClose(impactPoint, alliesList) {\n  for (let\
      \ ally of alliesList) {\n    let dist = impactPoint.distanceTo(ally.position);\n\
      \    if (dist < currentCaliber.dangerRadius) {\n      hud.setWarningState(true,\
      \ dist);\n      audio.playDangerWarningBeep();\n      if (projectileExploded)\
      \ {\n        ally.applyDamage(calculateSplashDamage(dist));\n        if (ally.health\
      \ <= 0) triggerGameOver('FRIENDLY_FIRE');\n      }\n      return true;\n   \
      \ }\n  }\n  hud.setWarningState(false, 0);\n  return false;\n}"
  - name: Физическая цепная детонация и разрушение укрытий (Physics Chain Reactions
      & Structural Collapse)
    role_in_loop: Главный источник взрывного удовлетворения (награды), мультипликатор
      боевого счета и инструмент контроля толпы
    player_decision: Стрелять ли напрямую во вражескую бронетехнику или поразить расположенную
      рядом топливную цистерну / опору моста / угол двухэтажного здания, вызвав обвал
      тонн бетона на головы врагов и цепную детонацию всего сектора.
    input_mapping: Наведение прицела на интерактивные объекты окружения (подсвечиваются
      горячим термоконтуром на FLIR) и выстрел калибром 40мм или 105мм.
    states:
    - 'STRUCTURAL_INTACT: здание или топливный резервуар целы, имеют 100% запас прочности
      (HP_structure = 800–2000 ед).'
    - 'CHAIN_IGNITING: прямое попадание снаряда пробивает корпус резервуара; начинается
      фаза утечки горящего топлива (0.4 с с нарастающим термо-свечением).'
    - 'CATASTROPHIC_DETONATION: взрыв бензовоза/склада боеприпасов с генерацией мощной
      ударной волны Rapier3D (радиус 16м, урон 3500 ед) и разлетом 15–25 физических
      обломков.'
    - 'STRUCTURAL_COLLAPSE: обрушение геометрии здания; падающие плиты наносят кинетический
      урон всей технике и пехоте под ними, блокируя улицу для подкреплений.'
    parameters:
    - name: Радиус вторичной детонации топливной цистерны
      value: 16.5 м (Урон 3500 ед)
      tuning_note: Если сделать больше 22 м, взрыв цистерны уничтожит полкарты включая
        спецназ; если сделать меньше 10 м, цепные реакции потеряют зрелищность и тактический
        смысл.
    - name: Физическая сила взрывного импульса (Rapier3D Impulse)
      value: 85000 Н*с для техники, 14000 Н*с для рэгдоллов
      tuning_note: При занижении техника просто исчезает на месте без ощущения мощи;
        при завышении обломки улетают за пределы скайбокса на первой миллисекунде.
    - name: Количество физических осколков разрушения (Debris chunks)
      value: 18 физических мешей на Three.js инстансинге
      tuning_note: Оптимальный баланс между кинематографичностью и стабильными 60
        FPS на мобильных GPU (Mali/Adreno/WebGL).
    - name: Множитель очков за комбо цепной реакции (Chain Combo)
      value: x1.5 за каждый последующий сдетонировавший объект в цепочке (до x5.0)
      tuning_note: Стимулирует игрока искать неочевидные взрывные связки вместо унылого
        расстрела врагов поодиночке.
    feedback_layers:
    - 'Визуал/VFX: Взрыв резервуара окрашивает тепловизор в экстремальный белый цвет
      с радиальным разлетом раскаленных белых точек-осколков; обрушение фасада здания
      порождает густое облако объемной термопыли в Three.js с физической осыпью обломков.'
    - 'Звук (Web Audio): Глубокий резонирующий взрыв с металлическим скрежетом рвущихся
      баков, треск ломающихся железобетонных перекрытий, звуки вторичных хлопков взрывающихся
      патронов и восторженный крик наводчика: ''Whole building coming down, multiple
      targets confirmed!''.'
    - 'Камера (импульс/зум): Горизонтально-вертикальный импульс сотрясения камеры
      (шейк 0.42° длительностью 0.6 с) с кратковременным падением резкости термооптики
      (имитация расфокусировки линз от ударной волны).'
    - 'UI/Тактильность: Всплывающий анимированный баннер ''CHAIN REACTION x3: +1500
      PTS'', серия из трех быстрых мощных тактильных вибраций (60 мс каждая) с интервалом
      в 100 мс.'
    failure_mode: 'Игрок подрывает цистерну рядом с узким проходом, когда спецназ
      уже начал в него входить — ударная волна цистерны сносит союзников. Сигнал:
      телеметрия фиксирует причину поражения ''ENVIRONMENTAL_FRIENDLY_FIRE''.'
    mastery_curve: Новичок на 30-й секунде игнорирует окружение и тратит 3 снаряда
      105мм на 3 отдельных БТР. Эксперт на 10-м забеге одним выстрелом 40-мм автопушки
      в бочку с горючим запускает каскадный подрыв заправки, уничтожающий колонну
      из 4 бронемашин и перекрывающий улицу обломками.
    counterplay: Вражеская бронетехника на третьей фазе объезжает взрывоопасные объекты
      по широким дугам, а снайперы занимают укрепленные железобетонные бункеры, требующие
      точного попадания 105мм прямо в амбразуру.
    synergies:
    - 'Связь с Механикой 1 (Калибры): легкий 40-мм снаряд идеально подходит для дистанционного
      подрыва цистерн без траты 105-мм гаубицы.'
    - 'Связь с Механикой 4 (Подавление): обрушенные стены создают постоянные физические
      баррикады в Rapier3D, через которые пехота врага не может вести огонь по отряду
      Bravo.'
    why_unique: Разрушаемость здесь — это не запеченная анимация, а честный физический
      расчет Three.js + Rapier3D, где обломки стен и ударные волны становятся органическим
      оружием игрока.
    pseudocode: "function onExplosionImpact(epicenter, blastPower, blastRadius) {\n\
      \  let nearbyPhysicsBodies = physicsWorld.querySphere(epicenter, blastRadius);\n\
      \  for (let body of nearbyPhysicsBodies) {\n    let dir = body.position.clone().sub(epicenter);\n\
      \    let dist = dir.length();\n    let forceMagnitude = blastPower / Math.max(1.0,\
      \ dist * dist);\n    body.applyImpulse(dir.normalize().multiplyScalar(forceMagnitude));\n\
      \    if (body.isExplosive && !body.isDetonated) {\n      scheduleDelayedDetonation(body,\
      \ 0.25);\n    }\n    if (body.isDestructible) {\n      body.takeStructuralDamage(blastPower\
      \ * 0.8);\n    }\n  }\n  vfx.spawnThermalShockwave(epicenter, blastRadius);\n\
      }"
  - name: Термодинамика FLIR и подавление живой силы (FLIR Thermal Contrast & Kinetic
      Suppression)
    role_in_loop: Тормоз/регулятор темпа стрельбы и механика тактического сдерживания
      противника
    player_decision: Поливать ли сектор непрерывным огнем 25-мм пулемета для 100%
      подавления вражеских гранатометчиков (не давая им прицелиться в спецназ), рискуя
      словить заклинивание от перегрева ствола (Jam Lockout), или стрелять короткими
      расчетными отсечками.
    input_mapping: Удержание кнопки/зоны огня для непрерывной очереди; отпускание
      гашетки для принудительного охлаждения ствольного блока. Тап по переключателю
      тепловых палитр 'W-HOT / B-HOT' для смены контраста в дыму.
    states:
    - 'COOL_NOMINAL: температура стволов 20–60°C; максимальная кучность стрельбы (разброс
      0.15°), стандартный термоконтраст FLIR.'
    - 'HIGH_HEAT_WARNING: температура 61–99°C; стволы раскалены докрасна, разброс
      увеличивается до 0.45°, звучит предупредительный сигнал температурного датчика.'
    - 'OVERHEAT_JAM: температура достигла 100°C; орудие блокируется на 3.5 с; оператор
      вынужден ждать сброса тепла или переключаться на другие калибры.'
    - 'ENEMY_SUPPRESSED: вражеский отряд пехоты под воздействием близких разрывов
      25мм (дистанция < 4м) падает ничком, меткость снижается на 90% на 3.0 секунды.'
    parameters:
    - name: Прирост температуры за 1 выстрел 25мм
      value: 1.85°C за выстрел (перегрев за 43 непрерывных выстрела ~ 1.4 с огня)
      tuning_note: Если сделать более 3.0°C, пулемет перегревается моментально и раздражает
        игрока; если сделать менее 0.8°C, механика перегрева теряет смысл и превращается
        в зажатую гашетку.
    - name: Скорость охлаждения ствольного блока GAU-12
      value: 18.0°C / сек в покое
      tuning_note: При занижении ниже 10°C/с игрок слишком долго скучает без пулемета;
        при завышении выше 40°C/с перегрев сбрасывается мгновенно.
    - name: Радиус зоны подавления пули 25мм
      value: 3.8 м от точки попадания пули
      tuning_note: Позволяет эффективно прижимать к земле группы пехоты даже без прямого
        попадания в силуэт.
    - name: Длительность эффекта подавления пехоты (Suppression duration)
      value: 2.8 с после прекращения обстрела
      tuning_note: Дает союзному отряду Bravo ровно столько времени, чтобы безопасно
        пробежать простреливаемый перекресток.
    feedback_layers:
    - 'Визуал/VFX: По мере нагрева 25-мм блока пушка на HUD раскаляется от белого
      к ярко-оранжевому свечению; при стрельбе трассеры выбивают фонтаны термопыли;
      подавленная пехота падает на живот и закрывает голову руками (анимация ''hit_the_deck'').'
    - 'Звук (Web Audio): Непрерывный низкий гул вращения блока стволов Гатлинга (звук
      ''BRRRRT''), при критическом нагреве — нарастающий высокочастотный вой перегретого
      ротора и щелчок защитного соленоида при заклинивании.'
    - 'Камера (импульс/зум): Высокочастотный мелкий дрожащий зуд камеры (шейк амплитудой
      0.08° на частоте 30 Гц) при зажатой гашетке пулемета.'
    - 'UI/Тактильность: Вертикальный секторный датчик HEAT GAU-12 с градиентным заполнением;
      непрерывная нарастающая по частоте виброотдача на мобильном устройстве (от 10
      Гц до 50 Гц по мере приближения к 100°C).'
    failure_mode: 'Игрок зажимает гашетку пулемета, ловит перегрев стволов на 100°C,
      в этот момент из-за угла выбегает гранатометчик РПГ-7 и стреляет по спецназу,
      пока игрок беспомощно ждет 3.5 секунды охлаждения. Сигнал: звуковой сигнал тревоги
      ''GUN OVERHEAT, LOCKOUT ACTIVE''.'
    mastery_curve: Новичок на 30-й секунде постоянно ловит клин пулемета от паники.
      Эксперт стреляет четкими микро-отсечками по 4–6 патронов (0.15 с), удерживая
      температуру в идеальном диапазоне 50–75°C и одновременно подавляя 3 огневые
      точки на разных крышах.
    counterplay: Элитные снайперы и расчеты тяжелых пулеметов противника в бетонных
      дотах обладают 50% резистом к подавлению и возобновляют огонь уже через 1.0
      с после окончания очереди.
    synergies:
    - 'Связь с Механикой 1 (Калибры): во время 4.5-секундной перезарядки 105-мм гаубицы
      игрок удерживает поле боя под контролем короткими очередями 25мм.'
    - 'Связь с Механикой 2 (Danger Close): подавление — главный инструмент спасения
      спецназа в ближнем бою, когда взрывные калибры применять запрещено.'
    why_unique: Подавление огнем превращает пулемет из примитивного инструмента нанесения
      урона в тактический щит для союзного отряда, моделируя реальную тактику непосредственной
      авиационной поддержки CAS (Close Air Support).
    pseudocode: "function updateGatlingSuppression(dt, isFiring, hitPoint) {\n  if\
      \ (isFiring && !gatling.isJammed) {\n    gatling.heat += gatling.heatPerShot\
      \ * (dt * 30);\n    if (gatling.heat >= 100.0) {\n      gatling.isJammed = true;\n\
      \      audio.playJamAlarm();\n    }\n    suppressEnemiesInRadius(hitPoint, 3.8,\
      \ 2.8);\n  } else {\n    gatling.heat = Math.max(0, gatling.heat - gatling.coolingRate\
      \ * dt);\n    if (gatling.isJammed && gatling.heat <= 30.0) {\n      gatling.isJammed\
      \ = false;\n    }\n  }\n  hud.updateHeatGauge(gatling.heat, gatling.isJammed);\n\
      }"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 80
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - description: Игровой цикл, обработка тиков, управление состоянием сущностей (снаряды,
      враги, спецназ).
    name: Core / ECS Layer
  - description: Three.js сцена, инстансинг техники/пехоты, кастомный FLIR White-Hot
      постобработочный шейдерный проход.
    name: Rendering & Shader Layer
  - description: Rapier3D симуляция баллистических траекторий, сплеш-лучей и кинетических
      импульсов обломков.
    name: Physics & Collision Layer
  - description: Web Audio пространственные звуки выстрелов, взрывов и очередь радиопереговоров
      с эффектом рации.
    name: Audio & Radio Layer
  - description: 'Интеграция Playgama Bridge: реклама (Rewarded/Interstitial), облачные
      сохранения, лидерборды, локализация.'
    name: Platform & Bridge Layer
  modules:
  - file: src/game/ballistics/BallisticsManager.ts
    name: BallisticsManager
    role: Расчет полета снарядов 25/40/105мм, упреждения и вызов взрывов.
  - file: src/game/shaders/ThermalShaderPass.ts
    name: ThermalShaderPass
    role: Монохромный FLIR White-Hot пост-процессинг с шумом и сканлайнами.
  - file: src/game/ai/SquadAIController.ts
    name: SquadAIController
    role: Управление союзным отрядом спецназа и логика контрольных точек.
  - file: src/game/ai/EnemySpawnDirector.ts
    name: EnemySpawnDirector
    role: Срежиссированный спавн пехоты, пикапов и бронетехники по фазам миссии.
  - file: src/game/physics/DestructionSystem.ts
    name: DestructionSystem
    role: Физические взрывы, цепные реакции и обрушение укрытий в Rapier3D.
  - file: src/platform/PlaygamaService.ts
    name: PlaygamaService
    role: Связь с Playgama Bridge SDK, показ рекламы и синхронизация сейвов.
monetization:
  strategy_summary: 'Ненавязчивая гибридная монетизация: Rewarded Video для получения
    ценных тактических преимуществ (вызов тяжелой артподдержки, мгновенный ревайв
    спецназа, удвоение боевых кредитов) и Interstitial между успешными спецоперациями
    с мягким кулдауном 90 секунд.'
  rewarded_placements:
  - id: revive_squad
    name: Экстренная Реанимация Спецназа
    benefit: Воскрешает погибших бойцов отряда 'Браво' с полным здоровьем и вызывает
      заградительный дымовой экран.
    cooldown_or_limit: 1 раз за операцию
    trigger_moment: Экран поражения при гибели всех бойцов спецназа.
  - id: double_credits
    name: Удвоение Боевых Кредитов
    benefit: Удваивает полученные за операцию тактические кредиты и боевой опыт.
    cooldown_or_limit: После каждой успешной операции
    trigger_moment: Экран победы и подсчета боевого рейтинга.
  - id: supply_crate
    name: Армейский Контейнер Снаряжения
    benefit: Мгновенно выдает 500 тактических кредитов и случайный чертеж улучшения
      орудий.
    cooldown_or_limit: 1 раз в 10 минут
    trigger_moment: Кнопка в главном меню / окне арсенала.
  interstitial_placements:
  - trigger_event: Завершение спецоперации (победа или поражение)
    cooldown_seconds: 90
    conditions: Показывается только между миссиями при переходе в меню арсенала; никогда
      во время активного боя.
  in_app_purchases:
  - sku: no_ads_vip
    name: VIP Оператор (Отключение межстраничной рекламы)
    description: Навсегда отключает обязательные межстраничные баннеры и дает постоянный
      бонус +25% к опыту.
    price_tier: Tier 2 (~199 RUB / 2.99 USD)
    reward: Отключение Interstitial рекламы + 1000 кредитов
  - sku: tactical_crate_large
    name: Тактический Набор Снаряжения
    description: Большой запас кредитов для мгновенной прокачки всех орудийных систем
      ганшипа.
    price_tier: Tier 1 (~99 RUB / 1.49 USD)
    reward: 2500 тактических кредитов + эксклюзивная сетка прицела FLIR Red-Hot
  fairness_rules:
  - Никаких рекламных пауз во время 90-секундной спецоперации — полное погружение
    в бой.
  - Любое улучшение орудий можно открыть исключительно за игровой процесс без доната.
  - Реклама с вознаграждением всегда опциональна и дает четкую понятную награду.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - gamedistribution
  - web
  initialization_flow:
  - 1. Запуск Playgama Bridge SDK при старте приложения
  - 2. Определение языка платформы (RU/EN) и адаптация локализации интерфейса и радиопереговоров
  - 3. Загрузка облачного сохранения игрока (прокачка, кредиты, открытые миссии)
  - 4. Инициализация аудио-контекста по первому пользовательскому взаимодействию
  - 5. Показ экрана главного меню и готовность к запуску первой спецоперации
  cloud_save_keys:
  - player_credits
  - gun_upgrades_state
  - unlocked_missions
  - best_scores_per_mission
  - audio_settings
  - user_control_sensitivity
  leaderboards:
  - leaderboard_high_score_global
  - leaderboard_perfect_evacuations
  - leaderboard_combo_masters
  ads_integration:
    banner_supported: false
    interstitial_handler: bridge.advertisement.showInterstitial()
    rewarded_handler: bridge.advertisement.showRewardedVideo()
  lifecycle_hooks:
  - bridge.game.on('pause', () => GameEngine.pauseBattle())
  - bridge.game.on('resume', () => GameEngine.resumeBattle())
  - bridge.storage.on('save_success', () => UI.showSaveIndicator())
