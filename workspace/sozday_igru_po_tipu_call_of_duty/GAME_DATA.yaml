preview_status: completed
definition_of_done:
- Орбитальная камера на высоте 1000м с плавным гиростабилизированным наведением через
  мышь и мобильный свайп
- Монохромный FLIR White-Hot шейдер постобработки со сканлайнами, шумом матрицы и
  термо-подсветкой целей
- Три полностью функционирующих калибра (25мм пулемет, 40мм автопушка, 105мм гаубица)
  с честной баллистической задержкой полета (1.2–2.5 с)
- ИИ союзного отряда спецназа, продвигающегося по 3 фазам до точки эвакуации, со строгим
  правилом Friendly Fire
- Физическая система взрывов, цепных детонаций техники и разрушения укрытий на базе
  Rapier3D
- Аутентичный военный HUD с индикацией калибров, шкалами перезарядки, комбо-счетчиком
  и радиопереговорами экипажа
- 'Интеграция Playgama Bridge SDK: Rewarded Video для ревайва и удвоения очков, Interstitial
  реклама, облачные сохранения и лидерборды'
- Стабильные 60 FPS на мобильных устройствах и в десктопных браузерах
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Сканирование сектора в тепловизор FLIR -> Выбор калибра
  (25мм / 40мм / 105мм) -> Расчет баллистического упреждения и радиуса поражения ->
  Залп по технике и живой силе противника -> Физическая цепная детонация укрытий ->
  Обеспечение безопасного прохода союзного спецназа к эвакуации -> Получение боевого
  рейтинга..'
- 'Реализованы механики проекта: Баллистическое жонглирование тройным калибром (Triple-Caliber
  Orbital Ballistics), Протокол Danger Close и ИК-стробоскопы Bravo-6 (Danger Close
  & IR Beacon Protocol), Физическая цепная детонация и разрушение укрытий (Physics
  Chain Reactions & Structural Collapse), Термодинамика FLIR и подавление живой силы
  (FLIR Thermal Contrast & Kinetic Suppression).'
- Условие успеха (Успешная эвакуация союзного отряда спецназа (минимум 1 выживший
  боец достиг зоны посадки вертолета на 90-й секунде) и полная ликвидация тяжелой
  техники противника.) и условие проигрыша (Гибель всех 4 бойцов союзного отряда от
  огня противника ИЛИ дружественный огонь (попадание снаряда 105мм/40мм в радиус союзников,
  уничтожившее отряд) ИЛИ истечение лимита времени (100 секунд) до выхода к эвакуации.)
  работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «AC-130: Ночной Тепловизор».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Экстренная Реанимация Спецназа,
  Удвоение Боевых Кредитов, Армейский Контейнер Снаряжения); interstitial соблюдает
  паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
