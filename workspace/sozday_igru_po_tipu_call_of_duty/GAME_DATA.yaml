    в любой свободной зоне экрана (абсолютное или относительное смещение) и выделенная
    зона крупных кнопок огня калибрами под большой палец правой руки (размер кнопок
    не менее 64x64px с отступом от края экрана).
  safe_area_handling: Все критические элементы HUD (кнопка паузы, статус союзников,
    кнопки калибров) смещены внутрь экрана с учетом Safe Area Insets (вырезы под камеру,
    закругления углов дисплея).
  performance_throttling:
  - Динамическое масштабирование разрешения рендера (Resolution Scale 0.85x при падении
    FPS ниже 50)
  - Лимит одновременно активных физических обломков в Rapier3D (максимум 30 тел)
  - Упрощенный шейдер дыма и взрывов без тяжелых попиксельных циклов
  - Отключение пост-процессингового блума на ультра-бюджетных устройствах с сохранением
    монохромного FLIR шейдера
