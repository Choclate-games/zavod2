_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: sozday_igru_po_tipu_call_of_duty
performance:
  target_fps: 60
  max_draw_calls: 80
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: 'Спецоперация огневой поддержки длительностью 60–90 секунд: эскорт союзного
    отряда спецназа из 4 бойцов через 3 тактических сектора до зоны вертолетной эвакуации.'
  win: Успешная эвакуация союзного отряда спецназа (минимум 1 выживший боец достиг
    зоны посадки вертолета на 90-й секунде) и полная ликвидация тяжелой техники противника.
  lose: Гибель всех 4 бойцов союзного отряда от огня противника ИЛИ дружественный
    огонь (попадание снаряда 105мм/40мм в радиус союзников, уничтожившее отряд) ИЛИ
    истечение лимита времени (100 секунд) до выхода к эвакуации.
  difficulty_curve: 'Фаза 1 (0:00–0:25): Разрозненные группы пехоты на открытых улицах
    — игрок осваивает 25-мм пулемет и свайп-наведение. Фаза 2 (0:25–0:55): Скоростные
    пикапы и враги на крышах зданий — подключение 40-мм автопушки, необходимость упреждения
    в 1.5 сек. Фаза 3 (0:55–1:25): Массированная атака танков Т-72 и БТР в непосредственной
    близости от союзного отряда — ювелирное применение 105-мм гаубицы с контролем
    радиуса поражения (Friendly Fire danger).'
mechanics:
  ballisticheskoe_zhonglirovanie_troynym_kalibrom_tr:
    name: Баллистическое жонглирование тройным калибром (Triple-Caliber Orbital Ballistics)
    parameters:
      skorost_poleta_105_mm_snaryada_v_105:
        value: '455 м/с (время подлета с 1000м: 2.20 с)'
        note: Если увеличить скорость выше 700 м/с, пропадет магия предвкушения попадания
          и расчет упреждения; если уменьшить ниже 350 м/с, попадать по движущейся
          технике станет невозможно без чистого везения.
      radius_sploshnogo_porazheniya_105_mm_ofs:
        value: 18.0 м (Base Damage 2500 ед)
        note: Если сделать больше 25 м, гаубица будет зачищать весь экран в один клик
          и постоянно взрывать спецназ; если меньше 12 м, попадание покажется слабым
          и не оправдает 4.5-секундную перезарядку.
      skorostrelnost_25_mm_pulemeta_gau_12:
        value: 1800 выстр/мин (30 выстр/с, 85 ед урона/пуля)
        note: При занижении ниже 1200 выстр/мин пулемет теряет тактильный кайф лазерной
          'пилы'; при завышении выше 2500 выстр/мин перегрев наступает мгновенно за
          0.8 с.
      vremya_perezaryadki_105_mm_gaubitsy:
        value: 4.50 с
        note: Если снизить до 2.0 с, игрок перестанет использовать 40мм и 25мм; если
          поднять выше 6.5 с, темп игры в 90-секундной сессии провисает в мучительное
          ожидание.
  protokol_danger_close_i_ik_stroboskopy_bravo_6_dan:
    name: Протокол Danger Close и ИК-стробоскопы Bravo-6 (Danger Close & IR Beacon
      Protocol)
    parameters:
      radius_zapreta_ognya_105_mm_gaubitsy_danger_radius:
        value: 14.5 м от ИК-маяка Bravo-6
        note: Если уменьшить радиус ниже 8 м, опасность дружественного огня перестает
          ощущаться и игрок начинает бездумно спамить 105мм по своим; если увеличить
          свыше 22 м, стрелять в 3-й фазе становится некуда.
      chastota_mertsaniya_ik_stroboskopa_cid_01:
        value: 2.0 Гц (2 вспышки в секунду)
        note: При частоте менее 1 Гц маяк теряется на фоне ночных пожаров и взрывов;
          при постоянном свечении без мерцания игрок путает спецназовцев с вражеской
          пехотой.
      zdorove_odnogo_boytsa_spetsnaza:
        value: 150 HP (выдерживает до 4 попаданий из АК-47)
        note: Если дать больше 300 HP, игрок перестает защищать союзников; если дать
          меньше 75 HP, спецназ погибает от случайной шальной пули за 0.5 с.
      skorost_dvizheniya_otryada_bravo_6_na_marshe:
        value: '4.2 м/с (при спринте: 6.5 м/с)'
        note: Если замедлить ниже 2.5 м/с, миссия становится затянутой и скучной;
          если ускорить выше 8.0 м/с, баллистические снаряды 105мм отстают от темпа
          группы.
  fizicheskaya_tsepnaya_detonatsiya_i_razrushenie_uk:
    name: Физическая цепная детонация и разрушение укрытий (Physics Chain Reactions
      & Structural Collapse)
    parameters:
      radius_vtorichnoy_detonatsii_toplivnoy_tsisterny:
        value: 16.5 м (Урон 3500 ед)
        note: Если сделать больше 22 м, взрыв цистерны уничтожит полкарты включая
          спецназ; если сделать меньше 10 м, цепные реакции потеряют зрелищность и
          тактический смысл.
      fizicheskaya_sila_vzryvnogo_impulsa_rapier3d_impul:
        value: 85000 Н*с для техники, 14000 Н*с для рэгдоллов
        note: При занижении техника просто исчезает на месте без ощущения мощи; при
          завышении обломки улетают за пределы скайбокса на первой миллисекунде.
      kolichestvo_fizicheskih_oskolkov_razrusheniya_debr:
        value: 18 физических мешей на Three.js инстансинге
        note: Оптимальный баланс между кинематографичностью и стабильными 60 FPS на
          мобильных GPU (Mali/Adreno/WebGL).
      mnozhitel_ochkov_za_kombo_tsepnoy_reaktsii_chain_c:
        value: x1.5 за каждый последующий сдетонировавший объект в цепочке (до x5.0)
        note: Стимулирует игрока искать неочевидные взрывные связки вместо унылого
          расстрела врагов поодиночке.
  termodinamika_flir_i_podavlenie_zhivoy_sily_flir_t:
    name: Термодинамика FLIR и подавление живой силы (FLIR Thermal Contrast & Kinetic
      Suppression)
    parameters:
      prirost_temperatury_za_1_vystrel_25mm:
        value: 1.85°C за выстрел (перегрев за 43 непрерывных выстрела ~ 1.4 с огня)
        note: Если сделать более 3.0°C, пулемет перегревается моментально и раздражает
          игрока; если сделать менее 0.8°C, механика перегрева теряет смысл и превращается
          в зажатую гашетку.
      skorost_ohlazhdeniya_stvolnogo_bloka_gau_12:
        value: 18.0°C / сек в покое
        note: При занижении ниже 10°C/с игрок слишком долго скучает без пулемета;
          при завышении выше 40°C/с перегрев сбрасывается мгновенно.
      radius_zony_podavleniya_puli_25mm:
        value: 3.8 м от точки попадания пули
        note: Позволяет эффективно прижимать к земле группы пехоты даже без прямого
          попадания в силуэт.
      dlitelnost_effekta_podavleniya_pehoty_suppression_:
        value: 2.8 с после прекращения обстрела
        note: Дает союзному отряду Bravo ровно столько времени, чтобы безопасно пробежать
          простреливаемый перекресток.
