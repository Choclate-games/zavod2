  selected_id: D3
  selected_name: 'Гангейм: Контейнерный Прорыв'
  selection_reason: 'Направление D3 идеально переносит формулу Call of Duty в браузер
    и мобильный формат: сессия на 60–90 секунд дарит непрерывный адреналин, мгновенный
    респаун устраняет ожидание, смена оружия за фраги дает понятную цель на раунд,
    а тесная арена из контейнеров гарантирует 60 FPS даже на слабых смартфонах за
    счет низкого числа полигонов и минимальных дистанций отрисовки.'
  rejected_reasons:
  - 'D1 (Киллхаус: Рекорд Зачистки) отвергнут, так как тир со статичными и откидными
    мишенями лишен сопротивления живого противника и превращается в заучивание таймингов,
    уступая полноценному динамичному бою по глубине вовлечения.'
  - 'D2 (Припять: Невидимый Выстрел) отвергнут, так как медленный позиционный стелс
    с длительным выжиданием окон шума создает избыточный простой и фрустрацию на сенсорных
    экранах, где аудитория браузерных игр требует мгновенного экшена с первых секунд.'
  what_it_is_not:
  - Никаких серых прототипных кубов вместо стилизованных текстурированных контейнеров
    и оружия.
  - Никаких окон выбора из 3 карточек апгрейда и рогаликовых способностей (никаких
    фаерболов, ядовитых аур и авто-стрельбы).
  - Никаких медленных тактических разминирований бомб и кемпинга на точках в стиле
    Counter-Strike.
  - Никаких гигантских пустых пространств королевской битвы с долгим сбором лута и
    бронежилетов.
  - Никакого плавающего экранного джойстика, перекрывающего обзор — строго раздельные
    зоны касания и свайпов.
  - Никаких бесконечных волн одинаковых зомби, идущих по прямой линии на игрока.
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - 'Мгновенная смена класса оружия в руках бойца при каждом совершении фрага (лестница
    Gun Game: Пистолет -> Дробовик -> ПП -> Автомат -> Снайперка -> РПГ) без пауз
    и открытия меню.'
  - Динамический подкат (Slide) на бегу с сохранением импульса скорости и возможностью
    непрерывной стрельбы от бедра.
  - 'Тактильный аудиовизуальный отклик попадания: хитмаркер (белый крестик с сочным
    щелчком «тик-клак»), вспышки дульного пламени и вылетающие гильзы.'
  - 'Система наград за серию фрагов (Киллстрики): 3 убийства без смерти активируют
    тактический дрон-разведчик БПЛА (UAV), подсвечивающий противников сквозь контейнеры
    на 8 секунд.'
  - Компактная симметричная арена в стиле Shipment из грузовых контейнеров, обеспечивающая
    первый огневой контакт уже на 2-й секунде после старта матча.
  signature_scene: Вид от первого лица из глаз бойца спецназа в тактических перчатках,
    находящегося в низком подкате по мокрому мощеному асфальту между двумя темно-красными
    грузовыми контейнерами. В руках — черный укороченный пистолет-пулемет с коллиматором,
    из дула которого вырывается оранжевая вспышка выстрела, а вбок летит латунная
    гильза с дымным следом. В трех метрах впереди оседает фигура вражеского бойца,
    окруженная белым крестиком хитмаркера и искрами. Сверху сквозь морось пробивается
    свет складского прожектора, выхватывая лужи с отражениями и силуэт парящего в
    небе разведывательного БПЛА с мерцающим зеленым огоньком.
  avoid_references:
  - Counter-Strike 2 (медленный тактический шутер с закупкой снаряжения и разминированием
    бомбы)
  - 'Call of Duty: Warzone (масштабная королевская битва на 100 человек с лутанием
    и парашютами)'
  - Vampire Survivors (авто-шутер с бесконечной ордой монстров и выбором магических
    навыков)
  - Escape from Tarkov (хардкорный эвакуационный симулятор с инвентарем и лечением
    конечностей)
  - Sniper Elite (медленный позиционный снайперский стелс с X-Ray камерой)
knowledge_plan:
  selections:
  - path: patterns/arena_combat_loop.md
    role: core
    reason: Задает цикл сессионного матча арена-шутера на 60–90 секунд с гонкой до
      12 фрагов и мгновенным респауном.
  - path: threejs/fps_controller_and_shooting.md
    role: core
    reason: Реализует управление от первого лица, механику боевого подката с занижением
      хитбокса, мгновенную трансформацию оружия и стрельбу.
  - path: threejs/shooter_enemy_ai_and_combat.md
    role: core
    reason: Определяет поведение ботов-противников на арене, регистрацию урона по
      хит-зонам и мгновенный респаун за одну секунду.
  - path: threejs/game_map_and_world_design.md
    role: core
    reason: Необходим для процедурной сборки компактной арены контейнерного терминала
      с вертикальными ярусами и укрытиями.
  - path: threejs/procedural_mesh_builder.md
    role: supporting
    reason: Позволяет процедурно сгенерировать стилизованную 3D-геометрию грузовых
      контейнеров, окружения и 12 видов оружия без внешних моделей.
  - path: threejs/procedural_character_rig.md
    role: supporting
    reason: Обеспечивает процедурный риг и анимации моделей бойцов спецназа с четким
      разделением хитбоксов головы и тела.
  - path: threejs/juice_and_vfx_pool.md
    role: core
    reason: 'Создает сочный боевой отклик: вспышки выстрелов, хитмаркеры попаданий,
      тряску камеры при подкатах и эффекты через пул инстансов.'
  - path: threejs/physics_integration.md
    role: supporting
    reason: Связывает физические капсулы игроков и коллизии контейнеров в Rapier3D
      с рендером Three.js.
  - path: threejs/adaptive_quality.md
    role: core
    reason: Удерживает стабильные 60 FPS на смартфонах во время динамичных перестрелок
      за счет адаптивного масштабирования.
  - path: threejs/performance_guide.md
    role: supporting
    reason: Оптимизирует рендеринг множества контейнеров и декалей через InstancedMesh
      для минимизации вызовов отрисовки.
  - path: threejs/mobile_shaders.md
    role: supporting
    reason: Предоставляет оптимизированные мобильные шейдеры для материалов контейнеров
      и оружия без перегрева устройства.
  - path: stack/rapier3d.md
    role: core
    reason: Обеспечивает физику перемещения персонажа, расчет инерции скольжения в
      подкате и коллизии с контейнерами.
  - path: stack/three_mesh_bvh.md
    role: core
    reason: Обеспечивает сверхбыстрый raycast для мгновенной хитскан-стрельбы по зонам
      уязвимости и детекции уступов при перелазе.
  - path: stack/postprocessing.md
    role: supporting
    reason: Реализует шейдерную подсветку силуэтов врагов сквозь стены для БПЛА «Оверлорд»
      и эффект радиального размытия при спринте.
  - path: audio/procedural_sound_synthesizer.md
    role: core
    reason: Синтезирует через Web Audio звуки выстрелов для всей цепочки оружия, звон
      попадания в голову и сигнал активации БПЛА.
  - path: audio/web_audio_and_muting.md
    role: supporting
    reason: Гарантирует корректную инициализацию Web Audio по первому тапу и глушение
      звуков при потере вкладкой фокуса.
  - path: monetization/interstitial_best_practices.md
    role: supporting
    reason: Определяет показ полноэкранной рекламы строго на экране итогов матча без
      прерывания 90-секундного игрового флоу.
  - path: monetization/rewarded_ads_patterns.md
    role: supporting
    reason: Реализует опциональный просмотр рекламы за удвоение наград после победы
      без нарушения соревновательного баланса.
  rejected:
  - threejs/horde_survivor_core.md
  - patterns/survivor_loop.md
  - mechanics/upgrade_choices.md
  - patterns/roguelike_loop.md
  - mechanics/drone_swarm.md
  - mechanics/cover_and_suppression.md
  - stack/bitecs.md
  - threejs/melee_combat_and_ragdoll.md
  rejection_reason: В игре нет механик ордынского выживания, рогаликового выбора карточек
    способностей и медленного позиционного кемпинга в укрытиях; оружие сменяется автоматически
    по цепочке Gun Game в быстром арена-матче, БПЛА является экранным визором через
    шейдерный контур, а не физическим роем дронов, и для малого числа бойцов не требуется
    архитектура bitECS.
  loop_pattern: patterns/arena_combat_loop.md
  summary: Проект опирается на связку высокоскоростного FPS-контроллера с механикой
    подкатов и процедурной генерацией арены терминала на Three.js/Rapier3D, быстрый
    хитскан через three-mesh-bvh, шейдерный визор БПЛА через postprocessing, процедурный
    Web Audio синтез и оптимизацию под мобильные браузеры.
