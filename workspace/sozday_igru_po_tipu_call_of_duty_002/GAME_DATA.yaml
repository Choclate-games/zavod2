raw_prompt: создай игру по типу call of duty
title: 'Гангейм: Контейнерный Прорыв'
slug: sozday_igru_po_tipu_call_of_duty_002
genre: 3D Экшен-Шутер от первого лица
subgenre: Аркадный Гангейм / Арена-Шутер / Fast-Paced FPS
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK Play / Web & Mobile)
orientation: landscape
target_audience: Любители динамичных сессионных шутеров (Call of Duty, Gun Game, CS
  DM) от 12 до 35 лет, ценящие мгновенный тактильный отклик, скоростной ганплей, скольжение
  в подкатах и матчи на 1–2 минуты в браузере или на смартфоне.
core_loop: Спринт и подкат в узкий коридор контейнеров -> Захват цели и точный отстрел
  противника -> Мгновенная автоматическая смена оружия на следующий уровень лестницы
  -> Активация разведывательного БПЛА за серию фрагов -> Достижение 12-го финального
  фрага и победа в матче.
hook: Вы скользите в низком подкате прямо под очередью врага, ваншотите его в упор
  из дробовика, оружие мгновенно превращается в снайперку, вы в прыжке без прицела
  снимаете второго на крыше контейнера и активируете дрон-разведчик, видя оставшихся
  противников сквозь стены.
player_fantasy: Вы — неудержимый элитный оперативник спецназа в эпицентре бешеной
  перестрелки на закрытом терминале, где каждое убийство мгновенно меняет оружие в
  ваших руках, превращая бой в непрерывный хореографический танец смерти на сверхскоростях.
session_model: Интенсивная гонка вооружений (Gun Game) на компактной арене длительностью
  60–90 секунд до 12 фрагов с мгновенным респауном за 1.0 секунды.
unique_value_proposition: Первый браузерный 3D-шутер с аутентичной физикой динамического
  подката (slide-cancel), мгновенной сменой оружия лестницы Gun Game в реальном времени
  и тактическими киллстриками разведки в стиле Shipment без лагов и долгих загрузок.
vision: Создать самый сочный, динамичный и оптимизированный веб-шутер от первого лица,
  воссоздающий адреналиновый темп мультиплеера Call of Duty в формате мгновенных браузерных
  сессий с идеальным тактильным откликом на ПК и смартфонах.
elevator_pitch: 'Контейнерный Прорыв — это сверхдинамичный 3D FPS в стиле Shipment,
  где бойцы сходятся в 90-секундной гонке вооружений: каждый фраг мгновенно меняет
  ваш ствол (от пистолета до РПГ), скольжение в подкатах спасает от пуль, а серия
  из 3 фрагов вызывает БПЛА с подсветкой врагов сквозь контейнеры.'
win_conditions: Совершить 12 фрагов быстрее всех соперников, пройдя полную цепочку
  из 12 видов оружия и сделав финальное убийство из золотого РПГ/ножа за отведенные
  90 секунд.
lose_conditions: Если другой боец на арене совершает 12-й фраг первым, либо по истечении
  таймера в 90 секунд игрок не занимает 1-е место по числу фрагов.
progression_summary: 'Внутри раунда: последовательное продвижение по 12 рангам оружия
  за каждый фраг (Пистолет -> Револьвер -> Дробовик -> Дробовик-автомат -> ПП MP5
  -> ПП P90 -> Автомат M4 -> Автомат АК -> Пулемет -> Марксманка -> Снайперка -> РПГ-7)
  + запуск БПЛА за серию из 3 фрагов. Мета-прогрессия: разблокировка камуфляжей оружия
  (Неон, Карбон, Золото), тактических перчаток и званий в таблице лидеров за счет
  заработанных звезд побед.'
difficulty_curve: 'Динамический адаптивный пейсинг: первые 3 фрага (пистолеты/дробовики)
  проходятся на ближней дистанции за 10–15 секунд; середина (ПП и автоматы) требует
  контроля отдачи и смены флангов против поумневших ботов; финальные 3 фрага (снайперка
  и РПГ) повышают цену промаха, требуя тайминга подкатов и максимальной концентрации
  в условиях плотного перекрестного огня.'
