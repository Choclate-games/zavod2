definition_of_done:
- Разработан отзывчивый FPS-контроллер от первого лица с тактическим подкатом (Slide)
  и прицеливанием (ADS)
- Собрана компактная симметричная 3D арена из грузовых контейнеров с мокрым асфальтом
  и прожекторами
- Реализована детерминированная лестница из 12 видов оружия с мгновенной сменой за
  фраги
- Внедрена система киллстриков БПЛА с подсветкой силуэтов врагов сквозь стены на 8
  секунд
- Настроен агрессивный ИИ ботов с реакцией на шаги и мгновенным респауном за 1.0 сек
- Сделан сочный хитмаркер и пространственный 3D-звук выстрелов и попаданий
- Реализовано адаптированное двухзонное мобильное управление без джойстика
- Интегрирован Playgama Bridge SDK 2.x (сохранения, лидерборды, реклама)
- Обеспечен стабильный фреймрейт 60 FPS на мобильных устройствах и бандл < 3.8 МБ
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Спринт и подкат в узкий коридор контейнеров -> Захват
  цели и точный отстрел противника -> Мгновенная автоматическая смена оружия на следующий
  уровень лестницы -> Активация разведывательного БПЛА за серию фрагов -> Достижение
  12-го финального фрага и победа в матче..'
- 'Реализованы механики проекта: Лестница Вооружений с Мгновенной Трансформацией (Instant
  Gun Ladder Morph), Боевой Подкат с Инерцией и Низкопрофильной Стрельбой (Combat
  Slide & Hipfire), Тактический БПЛА Разведчик «Оверлорд» (Tactical UAV Killstreak),
  Дифференцированный Хит-Отклик с Зонами Уязвимости (Precision Hit-Zone & Stagger
  Dynamics).'
- Условие успеха (Совершить 12 фрагов быстрее всех соперников, пройдя полную цепочку
  из 12 видов оружия и сделав финальное убийство из золотого РПГ/ножа за отведенные
  90 секунд.) и условие проигрыша (Если другой боец на арене совершает 12-й фраг первым,
  либо по истечении таймера в 90 секунд игрок не занимает 1-е место по числу фрагов.)
  работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Гангейм: Контейнерный Прорыв».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Удвоение награды за победу, Тактическое
  подкрепление); interstitial соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
