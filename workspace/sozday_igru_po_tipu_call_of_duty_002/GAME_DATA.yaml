  tension_curve: 'Кривая напряжения представляет собой агрессивную пилообразную синусоиду
    с экспоненциальным взлетом в финале: 0–15 с (Ранги 1–3) — быстрый старт на 60%
    напряжения, разгоняющий ритм; 15–45 с (Ранги 4–8) — пик флоу на 75–80% с активацией
    БПЛА и доминированием на арене; 45–75 с (Ранги 9–11) — зона максимального тактического
    стресса на 90% напряжения (снайперки повышают цену промаха); 75–90 с (Ранг 12,
    РПГ-7) — финальный катарсис на 100% напряжения, когда все боты атакуют лидера,
    а единственный точный залп приносит мгновенную триумфальную победу.'
  core_formulas:
  - 'Урон с учетом зон попадания: Damage_Final = Base_Weapon_Damage * Zone_Multiplier
    (где Head = 2.0, Torso = 1.0, Legs = 0.7)'
  - 'Скорость перемещения: V_Current = V_Base * Slide_Factor * Stagger_Penalty (где
    V_Base = 8.0 м/с, Slide_Factor = 1.35 в окне скольжения 0.90 с, Stagger_Penalty
    = 0.70 на 0.35 с при получении урона)'
  - 'Таймер мгновенной трансформации ствола: T_Morph = 0.08 с (мгновенный swap 3D-модели
    в руках и пополнение обоймы до 100% Capacity_Max без паузы на перезарядку)'
  - 'Эффективность БПЛА «Оверлорд»: UAV_Duration = 8.0 с, Pulse_Freq = 1.5 с, Stencil_Outline_Radius
    = 1.8 м вокруг меша врага с альфа-прозрачностью 0.85'
  - 'Итоговый боевой счет матча: Match_Score = (Frags * 100) + (Headshot_Count * 50)
    + (Killstreaks * 150) + max(0, (90 - Elapsed_Time) * 10)'
  - 'Адаптивный радиус спавна ботов: Spawn_Distance = clamp(12.0 + (Rank * 0.8), 12.0,
    22.0) метров от игрока вне прямого конуса видимости камеры (FOV 80°)'
  run_progression:
  - 'Ранг 1: Тактический пистолет P99 (высокая точность, 3 выстрела в тело / 1 хедшот
    + 1 тело)'
  - 'Ранг 2: Тяжелый револьвер Magnum .44 (высокий урон 70 ед, 1 хедшот — мгновенный
    фраг, отдача +40%)'
  - 'Ранг 3: Помповый дробовик SPAS-12 (ваншот на дистанции до 4 метров, разлет 8
    дробин по 15 урона)'
  - 'Ранг 4: Автоматический тактический дробовик AA-12 (высокий темп стрельбы в подкатах,
    зачистка групп в упор)'
  - 'Ранг 5: Пистолет-пулемет MP5 (сбалансированная отдача, идеален для скоростных
    фланговых зачисток)'
  - 'Ранг 6: Скорострельный ПП P90 (обойма 50 патронов, скорострельность 900 выстр/мин
    для непрерывного пуша)'
  - 'Ранг 7: Штурмовая винтовка M4A1 (универсальный баланс дальности и контроля кучности)'
  - 'Ранг 8: Тяжелый автомат AK-47 (высокий урон 38 ед, жесткая вертикальная отдача,
    1 тап в голову = 76 урона)'
  - 'Ранг 9: Ручной пулемет LMG SAW (огневая мощь, замедление бега на -10%, прострел
    фанерных укрытий)'
  - 'Ранг 10: Марксманская винтовка DMR-14 (полуавтомат, 2 выстрела в корпус, высокая
    скорость пули 600 м/с)'
  - 'Ранг 11: Крупнокалиберная снайперская винтовка AWP (ваншот в грудь и голову,
    огромный разброс от бедра)'
  - 'Ранг 12: Золотой РПГ-7 (1 финальный снаряд со сплешем 3.5 м для завершения матча
    триумфальным взрывом)'
  meta_progression:
  - 'Оружейные скины: Разблокировка камуфляжей (Городской Цифра, Кибер-Неон, Дамасская
    Сталь, Чистое Золото) за фраги из каждого конкретного типа оружия (50 / 150 /
    300 / 500 фрагов).'
  - 'Тактические перчатки и жетоны оперативника: Покупка кастомизации рук за заработанные
    в победах звезды терминала (дает уникальные визуальные эффекты искр при подкате).'
  - 'Рейтинговая лига терминала: Продвижение по рангам (Рекрут -> Оперативник -> Ветеран
    -> Элита -> Легенда Терминала) на основе победных серий и процента матчей на 1-м
    месте.'
  - 'Звания и карточки игрока (Callsigns): Эксклюзивные анимированные баннеры профиля
    за мастерские достижения («Завершить матч без смертей», «3 фрага в одном подкате»).'
  mechanics:
  - name: Лестница Вооружений с Мгновенной Трансформацией (Instant Gun Ladder Morph)
    role_in_loop: Главный двигатель темпа, динамический регулятор дистанции боя и
      источник адаптации игрока.
    player_decision: Мгновенная перестройка тактики боя (от упора и CQB-спрея к precision-тэппингу
      на дальней дистанции) в долю секунды после совершения фрага прямо на открытом
      пространстве.
    input_mapping: 'ПК: ЛКМ — огонь, ПКМ — тактический зум, Q — удар прикладом; Тач:
      Правая половина экрана — плавающая кнопка огня с трекингом пальца, кнопка зума,
      свайп вниз для подката.'
    states:
    - STATE_READY
    - STATE_FIRING
    - STATE_RECOIL_RECOVERY
    - STATE_INSTANT_MORPH
    - STATE_LADDER_MAX
    parameters:
    - name: morph_transition_duration
      value: 0.08 с
      tuning_note: При >0.25 с теряется ощущение бешеного потока и разрывается комбо-серия
        фрагов; при <0.02 с игрок не успевает среагировать на изменение физики отдачи
        нового ствола.
    - name: ladder_tier_count
      value: 12 рангов
      tuning_note: При <8 рангах матч завершается слишком быстро (до 40 с) без демонстрации
        контраста классов; при >16 рангах сессия затягивается свыше 120 с, вызывая
        усталость пальцев на тачскрине.
    - name: frag_refill_ammo
      value: 100% обоймы
      tuning_note: При неполном боезапасе игрок наказывается пустой обоймой за успешный
        фраг, что вызывает фрустрацию; при бесконечной стрельбе обесценивается точность
        попаданий.
    - name: headshot_skip_ladder
      value: 0 рангов бонусного перескока
      tuning_note: Сознательно отключен перескок через ранг за хедшот (0 рангов),
        чтобы гарантировать полное прохождение 12 контрастных паттернов стрельбы каждым
        участником гонки.
    feedback_layers:
    - 'Визуал/VFX: Вспышка сине-белой голографической декомпиляции ствола за 80 мс,
      разлет неоновых искр из затвора, мгновенная смена 3D-модели оружия в руках (Three.js
      mesh swap).'
    - 'Звук (Web Audio): Резкий металлический лязг досылания патрона (850 Гц полосовой
      фильтр, 95 мс) + нарастающий синус-тон подтверждения ранга (от 440 Гц на 1 ранге
      до 1760 Гц на 12 ранге).'
    - 'Камера: Мгновенный импульс приближения FOV (-3° на 60 мс с плавным возвратом
      lerp 0.15) и микро-встряска по оси Z (амплитуда 0.015 м, затухание 0.08 с).'
    - 'UI/Тактильность: Всплывающий золотой баннер над прицелом «+1 РАНГ: M4A1», заполнение
      деления шкалы 1..12 в верхней части экрана, вибрация 45 мс на мобильных устройствах.'
    failure_mode: Игрок по инерции зажимает гашетку после фрага из автомата, получая
      снайперскую винтовку с огромным разбросом от бедра в движении — выстрел уходит
      в молоко, игрок погибает от ответного огня; сигнал — глухой щелчок одиночного
      выстрела снайперки и резкий увод ствола вверх.
    mastery_curve: Новичок на 30-й секунде замирает на 0.5 с после каждого фрага,
      чтобы осознать полученный ствол; эксперт на 10-м матче наизусть помнит очередность
      12 видов оружия и заранее начинает движение на нужную дистанцию еще до завершения
      анимации трансформации.
    counterplay: 'Боты и соперники адаптируют дистанцию боя под текущий ранг игрока:
      заметив снайперскую винтовку в руках игрока, боты сокращают дистанцию низкими
      подкатами, а против дробовика удерживают дальние прострелы.'
    synergies:
    - Боевой Подкат (трансформация оружия происходит прямо в скольжении без потери
      скорости)
    - БПЛА-Разведчик (позволяет заранее оценить дистанцию до следующего врага под
      полученный ствол)
    - Дифференцированный Хит-Отклик (хедшоты ускоряют прохождение трудных рангов со
      снайперками)
    why_unique: В отличие от традиционных Gun Game с долгой сменой оружия (0.6–1.2
      с анимации доставания), здесь трансформация занимает 0.08 с с мгновенным пополнением
      патронов, удерживая игрока в непрерывном высокооктановом флоу.
    pseudocode: "function onWeaponLadderTick(player, dt):\n  if player.state == STATE_INSTANT_MORPH:\n\
      \    player.morphTimer -= dt\n    if player.morphTimer <= 0:\n      player.state\
      \ = STATE_READY\n      player.currentWeapon = WeaponLadder[player.ladderRank]\n\
      \      player.ammo = player.currentWeapon.magazineCapacity\n  if player.hasPendingFrag:\n\
      \    player.hasPendingFrag = false\n    player.ladderRank = min(player.ladderRank\
      \ + 1, 12)\n    player.morphTimer = 0.08\n    player.state = STATE_INSTANT_MORPH\n\
      \    triggerFeedback('weapon_morph_fx', player.ladderRank)"
  - name: Боевой Подкат с Инерцией и Низкопрофильной Стрельбой (Combat Slide & Hipfire)
    role_in_loop: Двигатель маневренности, инструмент агрессивного сближения (gap-closer)
      и уклонения от хедшотов.
    player_decision: Срезать угол контейнера на форсажной скорости с риском влететь
      в засаду или войти шагом с сохранением максимальной кучности стрельбы.
    input_mapping: 'ПК: Зажатый Shift (Спринт) + Нажатие C / Ctrl (Подкат); Тач: Свайп
      вниз по правой половине экрана во время движения виртуального стика вперед.'
    states:
    - SLIDE_INACTIVE
    - SLIDE_ACCELERATING
    - SLIDE_GLIDING
    - SLIDE_BRAKING
    - SLIDE_COOLDOWN
    parameters:
    - name: slide_velocity_multiplier
      value: 1.35x (10.8 м/с от базы 8.0 м/с)
      tuning_note: При >1.6x игрок теряет контроль на поворотах между ящиками и врезается
        в стены; при <1.15x подкат теряет смысл как инструмент уклонения от пуль.
    - name: hitbox_height_reduction
      value: 50% (с 1.80 м до 0.90 м)
      tuning_note: При <30% снижения вражеский огонь на уровне груди продолжает попадать
        в игрока; при >70% игрок визуально проваливается под геометрию сцены.
    - name: slide_duration
      value: 0.90 с
      tuning_note: При <0.5 с подкат ощущается дерганым спамом; при >1.3 с игрок становится
        легкой предсказуемой мишенью на прямолинейной траектории.
    - name: slide_cooldown
      value: 0.35 с
      tuning_note: При 0 с возникает абуз непрерывного слайд-кансела, ломающий баланс;
        при >0.8 с теряется текучесть паркур-движения.
    - name: slide_spread_penalty
      value: +25% к разбросу от бедра
      tuning_note: При 0% отпадает надобность в прицельной стрельбе; при >60% стрельба
        в подкате превращается в бесполезный визуальный трюк.
    feedback_layers:
    - 'Визуал/VFX: Сноп оранжевых искр из-под подошв об мокрый асфальт (Three.js particle
      emitter, 35 частиц/с), динамическое радиальное размытие краев экрана, наклон
      3D-модели оружия на 15° влево.'
    - 'Звук (Web Audio): Характерный визгливый скрежет трения кевларовых наколенников
      о гранулированный бетон (белый шум через Bandpass 1200 Гц с затуханием 0.85
      с).'
    - 'Камера: Падение высоты взгляда с 1.65 м до 0.75 м за 0.12 с (smoothstep), расширение
      FOV с 80° до 92° во время движения, наклон камеры Roll на 3.5°.'
    - 'UI/Тактильность: Иконка подката в центре экрана загорается лазурным неоном,
      ритмичная тактильная пульсация 20 мс каждые 150 мс скольжения на смартфонах.'
    failure_mode: Игрок активирует подкат без достаточной стартовой скорости бега
      (стоя на месте или при движении назад), вместо скольжения выполняя обычный присед
      — мгновенная потеря мобильности и гибель от хедшота; сигнал — глухой звук провалившегося
      приседания и красный значок перечеркнутого спидометра.
    mastery_curve: Новичок на 30-й секунде скользит по прямой в центр арены и ловит
      пули в конце анимации; мастер на 10-м матче входит в подкат за 1 метр до угла
      контейнера, срезает 90° с разворотом камеры на 180° и сносит врага в спину.
    counterplay: Узкая геометрия контейнерных проходов (ширина 2.2 м) ограничивает
      угол маневра; боты при звуке подката мгновенно опускают сектор прицеливания
      с высоты 1.6 м до 0.8 м.
    synergies:
    - Лестница Вооружений (подкат позволяет безопасно пережить 0.08 с трансформации
      оружия на скорости)
    - Вертикальный Перелаз (плавный переход из подката в прыжок-зацеп на ящик без
      потери импульса)
    why_unique: Сохраняет полноценную возможность ведения прицельного огня от бедра
      с динамическим расширением FOV и занижением высоты хитбокса на 50%, оптимизированный
      под Three.js/Rapier3D raycast-контроллер.
    pseudocode: "function onSlidePhysicsTick(player, input, dt):\n  if player.isGrounded\
      \ and input.slidePressed and player.velocity.length() > 6.0 and player.slideCooldown\
      \ <= 0:\n    player.slideTimer = 0.90\n    player.slideCooldown = 0.35 + 0.90\n\
      \    player.state = SLIDE_GLIDING\n    player.cameraTargetHeight = 0.75\n  \
      \  player.targetFOV = 92.0\n    triggerFeedback('slide_spark_vfx', player.position)\n\
      \  if player.state == SLIDE_GLIDING:\n    player.slideTimer -= dt\n    player.velocity\
      \ = player.slideDirection * (8.0 * 1.35 * (player.slideTimer / 0.90 + 0.2))\n\
      \    if player.slideTimer <= 0 or input.jumpPressed:\n      player.state = SLIDE_INACTIVE\n\
      \      player.cameraTargetHeight = 1.65\n      player.targetFOV = 80.0"
  - name: Тактический БПЛА Разведчик «Оверлорд» (Tactical UAV Killstreak)
    role_in_loop: Источник тактического превосходства, мультипликатор темпа и инструмент
      ускоренного поиска целей на арене.
    player_decision: Активировать сканер немедленно для агрессивного пуша кластера
      врагов или сохранить его на сложный ранг лестницы (снайперская винтовка / РПГ-7).
    input_mapping: 'ПК: Клавиша E / Цифра 4; Тач: Большая светящаяся кнопка «БПЛА
      РАЗВЕДКА» в правой верхней части интерфейса при наборе 3 фрагов.'
    states:
    - UAV_CHARGING
    - UAV_READY
    - UAV_ACTIVE
    - UAV_SWEEP_PULSE
    parameters:
    - name: killstreak_cost
      value: 3 фрага без смертей
      tuning_note: При 2 фрагах радар работает непрерывно весь раунд, убивая интригу
        позиционирования; при 5 фрагах в коротком 90-секундном матче большинство игроков
        ни разу его не вызовут.
    - name: uav_active_duration
      value: 8.0 с
      tuning_note: При <4 с игрок не успевает добежать до обнаруженных врагов; при
        >14 с контейнеры теряют смысл как тактическое укрытие.
    - name: radar_pulse_interval
      value: 1.5 с
      tuning_note: При 0 с (постоянный рентген) теряется ценность предугадывания траектории;
        при >3.0 с враг успевает сменить позицию и метка дезинформирует.
    - name: wallhack_outline_alpha
      value: 0.85 непрозрачность
      tuning_note: При <0.4 метки теряются на фоне ярких текстур контейнеров; при
        1.0 плотная заливка перекрывает прицельное перекрестие.
    feedback_layers:
    - 'Визуал/VFX: Появление красных голографических силуэтов врагов сквозь геометрию
      контейнеров (Three.js custom stencil outline shader), расходящаяся зеленая волна
      сканирования по миникарте.'
    - 'Звук (Web Audio): Радиосообщение штаба («UAV Recon Online», 24 кГц комколл)
      + низкочастотный сонарный пинг (320 Гц с реверберацией 1.2 с) каждые 1.5 с.'
    - 'Камера: Кратковременный глитч-эффект хроматической аберрации (0.008 на 0.15
      с) в момент активации сканера.'
    - 'UI/Тактильность: Разворачивание расширенной сетки радара в левом верхнем углу
      интерфейса со стрелками направления взглядов врагов, двойной вибро-импульс (60
      мс + 60 мс).'
    failure_mode: Игрок активирует БПЛА, слепо бежит за силуэтом через 3 ряда контейнеров
      и не замечает врага, выскочившего из бокового переулка прямо в упор; сигнал
      — звуковой маркер шагов вблизи и резкий красный индикатор урона с фланга.
    mastery_curve: Новичок на 30-й секунде жмет БПЛА сразу при получении и бежит по
      прямой на ближайшую точку; мастер копит БПЛА до сложного 10–11 ранга (снайперка)
      и производит точнейший префайр через щели между контейнерами ровно в тайминг
      выхода силуэта.
    counterplay: Боты при активации БПЛА не стоят на открытых прострелах, а занимают
      глухие углы в контейнерах и берут прострелы на опережение с перекрестным сектором
      обзора.
    synergies:
    - Лестница Вооружений (упрощает прохождение сложных рангов снайперок через знание
      позиций врагов)
    - Вертикальный Перелаз (позволяет заранее забраться на контейнер над обнаруженной
      группой врагов)
    why_unique: Синхронизирован с шейдерной подсветкой контуров врагов прямо в 3D-сцене
      от первого лица (а не только точками на плоской 2D-миникарте), сохраняя концентрацию
      игрока в прицеле.
    pseudocode: "function onUAVSystemTick(player, enemies, dt):\n  if player.killstreakCount\
      \ >= 3 and player.uavState == UAV_CHARGING:\n    player.uavState = UAV_READY\n\
      \    triggerFeedback('uav_ready_hud')\n  if player.uavState == UAV_ACTIVE:\n\
      \    player.uavTimer -= dt\n    player.radarSweepTimer -= dt\n    if player.radarSweepTimer\
      \ <= 0:\n      player.radarSweepTimer = 1.5\n      for enemy in enemies:\n \
      \       enemy.applyHighlightOutline(duration=1.4, color='#FF2A2A')\n      triggerFeedback('sonar_pulse_audio')\n\
      \    if player.uavTimer <= 0:\n      player.uavState = UAV_CHARGING"
  - name: Дифференцированный Хит-Отклик с Зонами Уязвимости (Precision Hit-Zone &
      Stagger Dynamics)
    role_in_loop: Источник микро-мастерства (skill ceiling), регулятор риска и мгновенная
      тактильная награда за меткость.
    player_decision: Потратить 0.15 с на доводку прицела в голову ради ваншота или
      залить корпус безопасным спреем с риском получить ответный урон.
    input_mapping: 'ПК: Высокоточное позиционирование мыши; Тач: Сенсорный аим-ассист
      малого радиуса (15 пикселей) с доводом в область шеи/головы при микро-коррекции
      пальцем.'
    states:
    - HIT_NONE
    - HIT_BODY
    - HIT_HEAD
    - HIT_LEGS
    parameters:
    - name: headshot_damage_multiplier
      value: 2.0x
      tuning_note: При 1.2x игроки перестают целиться в голову и спамят в туловище;
        при >3.0x любое оружие превращается в случайный мгновенный ваншот от шальной
        пули.
    - name: stagger_slowdown_duration
      value: 0.35 с (замедление цели на 30%)
      tuning_note: При <0.1 с противник игнорирует урон в движении; при >0.8 с бойцы
        превращаются в недвижимые мишени, ломая динамику перестрелок.
    - name: hitmarker_duration
      value: 0.18 с
      tuning_note: При <0.08 с мозг не успевает зафиксировать подтверждение попадания;
        при >0.4 с визуальный мусор перекрывает цель.
    - name: hit_audio_pitch_headshot
      value: 1320 Гц (против 880 Гц в тело)
      tuning_note: Разница частот в 1.5 раза дает мгновенный интуитивный аудио-отчет
        о критическом попадании без отвлечения взгляда на интерфейс.
    feedback_layers:
    - 'Визуал/VFX: 4 белые диагональные риски при обычном попадании; золотисто-красный
      увеличенный хитмаркер со вспышкой искр и вылетом гильз при хедшоте (Three.js
      canvas overlay).'
    - 'Звук (Web Audio): Звонкий щелчок «Hit-Beep» (FM-синтез 880 Гц, атака 2 мс,
      затухание 45 мс) + сочный металлический звон каски на частоте 1320 Гц при хедшоте.'
    - 'Камера: Микро-толчок отдачи камеры вверх-назад (pitch +0.8°, z -0.01 м) и кратковременное
      радиальное затухание размытия при смертельном попадании.'
    - 'UI/Тактильность: Всплывающее число урона над головой цели (белый «50», золотой
      «100 КРИТ»), короткий резкий виброотклик (15 мс тело, 35 мс с двойным ударом
      хедшот).'
    failure_mode: Игрок пытается выцеливать исключительно голову на бегу со скорострельного
      дробовика, пули разлетаются мимо узкого хитбокса головы, и игрок погибает от
      плотного спрея в корпус; сигнал — отсутствие хитмаркера и свист пуль по стенке
      контейнера за спиной врага.
    mastery_curve: Новичок на 30-й секунде стреляет длинными очередями по ногам и
      корпусу, затрачивая по 1.5–2.0 с на фраг; эксперт делает короткие отсечки по
      2 выстрела ровно в верхний срез хитбокса, совершая фраги за 0.25–0.4 с.
    counterplay: Боты в перестрелке используют резкие стрейфы (strafe-jiggle 4.5 м/с)
      и приседания в момент получения урона, сбивая прицел с головы.
    synergies:
    - Лестница Вооружений (хедшоты позволяют мгновенно проходить ранги револьверов
      и снайперок)
    - Боевой Подкат (подкат занижает собственный хитбокс головы, усложняя попадание
      врагу)
    why_unique: Четкая дифференциация частоты Web Audio FM-синтеза формирует рефлекс
      «услышал звон — мгновенно перевел прицел на следующую цель», экономя доли секунды.
    pseudocode: "function processBulletImpact(raycastHit, weaponDamage):\n  hitZone\
      \ = raycastHit.colliderZone\n  multiplier = (hitZone == 'head') ? 2.0 : (hitZone\
      \ == 'legs' ? 0.7 : 1.0)\n  finalDamage = weaponDamage * multiplier\n  raycastHit.targetEntity.applyDamage(finalDamage)\n\
      \  if hitZone == 'head':\n    triggerFeedback('headshot_audio_chink', 1320)\n\
      \    triggerFeedback('headshot_golden_crosshair')\n    vibrateDevice([15, 30,\
      \ 35])\n  else:\n    triggerFeedback('body_hit_beep', 880)\n    triggerFeedback('white_hitmarker')\n\
      \    vibrateDevice([15])"
  - name: Вертикальный Перелаз Контейнеров и Срез Высоты (Rapid Container Vault &
      Flanking)
    role_in_loop: Инструмент вертикальной мобильности, захода во фланг и неожиданного
      изменения угла атаки.
    player_decision: Лезть на крышу контейнера с риском стать открытой мишенью на
      0.4 с ради обзора всей карты или оставаться в узком коридоре в относительной
      безопасности.
    input_mapping: 'ПК: Пробел (Прыжок) в упор к контейнеру высотой до 2.6 м; Тач:
      Двойной тап по кнопке прыжка или свайп вверх при приближении к препятствию.'
    states:
    - VAULT_IDLE
    - VAULT_LATCH
    - VAULT_PULL_UP
    - VAULT_RECOVERY
    parameters:
    - name: max_vault_obstacle_height
      value: 2.60 м (высота стандартного контейнера)
      tuning_note: При <2.2 м игрок не может забраться на стандартный 20-футовый контейнер;
        при >3.2 м теряется реализм тактического спецназа.
    - name: vault_animation_duration
      value: 0.40 с
      tuning_note: При <0.2 с действие выглядит неестественной телепортацией; при
        >0.75 с игрок гарантированно погибает в процессе анимации от любого стрелка.
    - name: fall_damage_threshold
      value: 6.0 м
      tuning_note: Спрыгивание с одинарного контейнера 2.6 м не наносит урона и не
        замедляет бег, сохраняя динамику потока.
    feedback_layers:
    - 'Визуал/VFX: Тактические перчатки бойца хватаются за рифленый кант контейнера,
      ствол временно опускается в правый угол, легкая пыль слетает с края ящика.'
    - 'Звук (Web Audio): Глухой тяжелый удар ботинок и ладоней о полый металлический
      лист контейнера (НЧ удар 140 Гц + скрежет металла 2400 Гц).'
    - 'Камера: Двухфазная траектория: наклон вверх на +12° при зацепе, затем рывок
      вперед-вниз на -8° при выходе на крышу с возвратом в нейтраль за 0.15 с.'
    - 'UI/Тактильность: Кратковременный индикатор высоты «[ВЕРХНИЙ ЯРУС: КРЫША]»,
      тактильный виброотклик с нарастанием силы (10 мс -> 30 мс).'
    failure_mode: Игрок пытается залезть на контейнер под огнем двух врагов, зависает
      в безоружной фазе подтягивания на 0.35 с и погибает до возвращения оружия в
      боевое положение; сигнал — красные стрелки входящего урона и прерванный звук
      рывка.
    mastery_curve: Новичок на 30-й секунде перемещается только по нижним коридорам;
      мастер использует подкат для разгона, влетает в перелаз, уничтожает врага сверху
      в прыжке и без остановки продолжает движение.
    counterplay: 'На крышах контейнеров отсутствуют укрытия: забравшийся боец виден
      со всех четырех сторон терминала и уязвим для перекрестного снайперского огня.'
    synergies:
    - Боевой Подкат (вход в зацеп контейнера на полной инерции скольжения)
    - БПЛА-Разведчик (атака обнаруженных за углом врагов сверху через открытый верх
      контейнера)
    why_unique: Скоростной контекстный климбинг без потери инерции взгляда, оптимизированный
      под Three.js коллизии без застревания в геометрии ящиков.
    pseudocode: "function onVaultCheck(player, input, dt):\n  if player.state == VAULT_IDLE\
      \ and input.jumpPressed:\n    obstacle = raycastLedgeCheck(player.position,\
      \ player.forward, maxDist=1.2, maxHeight=2.6)\n    if obstacle.isValidLedge:\n\
      \      player.state = VAULT_PULL_UP\n      player.vaultTimer = 0.40\n      player.vaultTargetPos\
      \ = obstacle.topPosition\n      triggerFeedback('vault_metal_impact')\n  if\
      \ player.state == VAULT_PULL_UP:\n    player.vaultTimer -= dt\n    t = 1.0 -\
      \ (player.vaultTimer / 0.40)\n    player.position = vectorLerp(player.position,\
      \ player.vaultTargetPos, t)\n    if player.vaultTimer <= 0:\n      player.state\
      \ = VAULT_IDLE"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 65
  max_triangles_or_sprites: 38000
  bundle_size_budget_mb: 3.8
  layers:
  - description: Физическая симуляция Rapier3D, логика оружия, таймеры и ИИ ботов
    name: Core Gameplay Engine
  - description: Three.js рендерер, шейдеры контуров БПЛА, частицы выстрелов и гильз
    name: Graphics & VFX Layer
  - description: Адаптивный двухзонный тач и клавиатурно-мышиный ввод PointerLock
    name: Input Management Layer
  - description: HTML5/Canvas HUD, хитмаркеры, радар и экраны результатов
    name: UI/UX Presentation Layer
  - description: Интеграция SDK Playgama Bridge, сохранения и показ рекламы
    name: Platform SDK Layer
  modules:
  - description: Управление камерой, спринтом, подкатом и стрельбой
    name: FPSController
  - description: Детерминированная смена 12 видов оружия за фраги
    name: WeaponLadderManager
  - description: Логика обнаружения врагов и рендеринг контуров сквозь стены
    name: UAVKillstreakSystem
  - description: Конечный автомат поведения ботов и навигация NavMesh
    name: EnemyAIManager
  - description: Хранение профиля, рангов и интеграция с Playgama Bridge
    name: StorageAndAdService
monetization:
  strategy_summary: 'Гибридная гипер-честная модель: просмотр Rewarded Video для удвоения
    опыта/золота после матча и мгновенного возрождения с сохранением киллстрика 1
    раз за матч; Interstitial реклама строго между матчами с кулдауном 90 секунд;
    ненавязчивые IAP для покупки эксклюзивных скинов оружия.'
  rewarded_placements:
  - id: double_match_rewards
    name: Удвоение награды за победу
    benefit: Удваивает заработанные за матч монеты и опыт ранга в 2 раза
    cooldown_or_limit: После каждого матча
    trigger_moment: Экран результатов матча
  - id: revive_keep_streak
    name: Тактическое подкрепление
    benefit: Мгновенное возрождение на месте с сохранением текущего набранного киллстрика
    cooldown_or_limit: 1 раз за матч
    trigger_moment: Экран гибели при серии >= 2 фрагов
  interstitial_placements:
  - trigger_event: match_end_defeat_or_victory
    cooldown_seconds: 90
    conditions: Показывается между матчами на экране результатов только если прошло
      не менее 90 секунд с предыдущего показа
  in_app_purchases:
  - sku: starter_operator_pack
    name: Стартовый Набор Оперативника
    description: Набор из 3 эксклюзивных скинов (Неон, Карбон, Граффити) и 500 золотых
      монет
    price_tier: $1.99 / 149 YAN
    reward: 3 камуфляжа + 500 монет
  - sku: gold_arsenal_bundle
    name: Золотой Арсенал Gun Game
    description: Премиальный золотой камуфляж на все 12 видов оружия лестницы
    price_tier: $3.99 / 299 YAN
    reward: Золотые скины на все стволы
  fairness_rules:
  - 'Ноль Pay-to-Win: все оружие в матче выдается строго по лестнице Gun Game в абсолютно
    равных условиях'
  - Реклама никогда не прерывает активный бой и показывается строго после завершения
    матча
  - Кулдаун межстраничной рекламы строго зафиксирован на 90 секундах
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - gamedistribution
  - web
  initialization_flow:
  - bridge.initialize()
