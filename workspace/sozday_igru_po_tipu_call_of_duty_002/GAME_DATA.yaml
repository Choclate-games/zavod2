gameplay_systems:
- name: Weapon Ladder & Progression System
  purpose: Управление детерминированной последовательностью смены оружия (12 рангов)
    при совершении фрагов.
  input: Событие OnEnemyEliminated от боевой подсистемы.
  rules:
  - Каждый фраг повышает ранг оружия ровно на 1 ступень.
  - Оружие мгновенно заменяется в руках игрока без возможности ручного выбора.
  - Совершение фрага на 12-м ранге немедленно запускает процедуру победы в матче.
  state:
  - 'currentRank: number (1..12)'
  - 'currentWeaponId: string'
  - 'isMaxRankReached: boolean'
  interactions: Передает актуальные параметры оружия (урон, скорострельность, разброс)
    в FPS Controller.
  feedback: Мгновенная смена модели оружия в руках, звук взвода затвора, всплывающий
    баннер нового ранга.
  edge_cases:
  - Одновременное убийство двух врагов одной пулей/взрывом (пропуск через 1 ступень)
  - Смерть игрока в момент совершения победного 12-го фрага
- name: Slide & FPS Movement Physics System
  purpose: Расчет кинематики перемещения, ускорения спринта и баллистики скольжения
    в подкате.
  input: Клавиши WASD, Shift (спринт), C/Ctrl (подкат), пробел (прыжок) / Тач-свайпы.
  rules:
  - Подкат возможен только из состояния активного спринта.
  - Длительность подката составляет 0.85 секунды с постепенным затуханием скорости.
  - Во время подката профиль хитбокса игрока уменьшается на 50%.
  - Стрельба от бедра остается активной во время всего цикла скольжения.
  state:
  - 'isGrounded: boolean'
  - 'isSprinting: boolean'
  - 'isSliding: boolean'
  - 'slideTimer: number'
  - 'velocity: Vector3'
  interactions: Взаимодействует с физическим миром Rapier3D и коллайдерами контейнеров.
  feedback: Опускание камеры на 50%, наклон FOV, эффект скорости (motion blur) и брызги
    воды.
  edge_cases:
  - Попытка подката в прыжке (блокируется)
  - Завершение подката под низким препятствием (принудительное положение приседа)
- name: Killstreak & Drone Radar System
  purpose: Отслеживание серий фрагов и активация тактического БПЛА с подсветкой сквозь
    стены.
  input: Клавиша E / Кнопка БПЛА на экране при killstreak >= 3.
  rules:
  - Серия из 3 фрагов без смертей активирует готовность БПЛА.
  - БПЛА подсвечивает силуэты всех противников на арене сквозь препятствия на 8 секунд.
  - Гибель игрока сбрасывает счетчик текущей серии, если БПЛА еще не был накоплен.
  state:
  - 'currentStreak: number'
  - 'isUAVReady: boolean'
  - 'isUAVActive: boolean'
  - 'uavTimeRemaining: number'
  interactions: Управляет шейдером кастомного контурного рендеринга (Outline Material)
    моделей врагов.
  feedback: Зеленое голографическое свечение силуэтов врагов, аудио-пинг радара и
    голос диктора.
  edge_cases:
  - Повторный набор 3 фрагов при уже активном БПЛА (продление таймера на 4 секунды)
  - Уничтожение БПЛА вражеским выстрелом (редкое событие)
- name: Aggressive CQB Combat AI System
  purpose: Управление поведением соперников-ботов на арене для создания плотного соревновательного
    темпа.
  input: Позиция игрока, звуки шагов и выстрелов в пространстве арены.
  rules:
  - Боты используют навигационную сетку NavMesh между контейнерами.
  - Боты умеют скользить в подкатах на углах и использовать укрытия при получении
    урона.
  - Респаун убитого бота происходит ровно через 1.0 секунды на наиболее удаленной
    безопасной точке.
  state:
  - 'aiState: ''PATROL'' | ''SLIDE_ATTACK'' | ''COVER'' | ''ENGAGE'''
  - 'targetEntity: Entity | null'
  - 'reactionTimer: number'
  interactions: Вызывает методы урона у игрока и других ботов, участвует в общем ладдере
    фрагов.
  feedback: Анимации перебежек, приседов, стрельбы и голосовые выкрики ботов.
  edge_cases:
  - Спавн бота в поле зрения игрока (фильтрация точек спавна по радиусу видимости)
  - Потеря пути ботом при динамическом столкновении с контейнером
- name: Match Flow & Victory Resolution System
  purpose: Контроль длительности матча (90 сек), отслеживание лидерборда и фиксация
    победы/поражения.
  input: Тики игрового таймера и события достижения максимального ранга оружия.
  rules:
  - Матч длится максимум 90 секунд.
  - Первый игрок/бот, совершивший 12 фрагов, немедленно побеждает.
  - Если время истекло, побеждает боец с максимальным числом фрагов.
  state:
  - 'matchTimeRemaining: number'
  - 'leaderboard: Array<{id: string, frags: number}>'
  - 'matchState: ''WARMUP'' | ''ACTIVE'' | ''FINISHED'''
  interactions: Передает финальные результаты в Playgama Bridge для сохранения лидербордов
    и начисления наград.
  feedback: Обратный отсчет последних 10 секунд, победная сирена, замедление времени
    (Slow-Mo).
  edge_cases:
  - Истечение таймера при равном счете фрагов (овертайм до золотого фрага)
  - Выход игрока из вкладки браузера (авто-пауза таймера матча)
core_design:
  signature_moment: Скользя на мокром асфальте в низком подкате между двумя ржавыми
    контейнерами, вы разносите врага в упор из дробовика; оружие в руках со звонким
    щелчком мгновенно трансформируется в снайперскую винтовку — вы не прерывая скольжения
    выпрыгиваете на крышу ящика, без прицела в воздухе снимаете второго врага, зарабатываете
    3-й фраг в серии, и небо озаряется сигналом БПЛА, подсвечивающим оставшихся соперников
    сквозь стальные стены.
  genre_template_rejected: 'Шаблон классического FPS с ручной перезарядкой обоймы
    (кнопка R), покупкой оружия в бай-меню и кемперским отсиживанием в укрытиях для
    регенерации здоровья.

    ПОЧЕМУ ОТВЕРГНУТ: В сессионном веб/мобильном шутере длительностью 90 секунд любая
    3-секундная пауза на перезарядку или пассивное стояние за ящиком разрушает темп
    адреналинового флоу. Здесь перезарядка полностью заменена мгновенной трансформацией
    оружия за совершение фрага, что превращает матч в непрерывный скоростной танец
    смерти без единой секунды простоя.'
  what_makes_it_different: В отличие от классических Gun Game с задержкой смены оружия
    в 0.6–1.2 с и мобильных шутеров с автострельбой, здесь реализована бесшовная нулевая
    задержка смены ствола (0.08 с), инерционная физика подкатов со стрельбой от бедра
    и тактический 3D-рентген БПЛА за серию убийств, превращающий лабиринт из контейнеров
    в прозрачную арену для непрерывного скоростного спидрана.
  micro_loop:
  - step: 1. Сканирование коридора и позиционирование
    player_action: Спринт по узкому проходу между контейнерами с контролем углов поворотом
      камеры
    game_response: Отображение теней врагов на асфальте, звуки шагов за углом, маркеры
      на миникарте
    decision: Атаковать в лоб через агрессивный боевой подкат или залезть на контейнер
      для атаки сверху
    duration: 1.0–2.0 с
  - step: 2. Инициация контакта и боевой подкат
    player_action: Вход в боевой подкат под линию прицела врага со смещением корпуса
    game_response: Снижение высоты камеры до 0.75 м, искры из-под подошв об асфальт,
      разгон скорости на +35%
    decision: Стрелять от бедра в скольжении или выждать момент для точной наводки
      в голову
    duration: 0.5–0.9 с
  - step: 3. Огневой контакт и ликвидация цели
    player_action: Точный выстрел в верхнюю зону хитбокса противника с компенсацией
      отдачи
    game_response: Золотой хитмаркер, Web Audio FM-клик попадания, рэгдолл врага,
      регистрация фрага
    decision: Продолжить движение вперед по инерции или резко развернуть камеру на
      180° для проверки спины
    duration: 0.2–0.5 с
  - step: 4. Мгновенная трансформация оружия
    player_action: Мгновенная адаптация хвата и прицела под новый тип оружия лестницы
      без паузы на перезарядку
    game_response: Голографическая вспышка декомпиляции за 0.08 с, новый ствол в руках
      со 100% патронов, +1 к рангу лестницы
    decision: Сокращать дистанцию под дробовик/ПП или занять длинный прострел под
      снайперку/марксманку
    duration: 0.08–0.3 с
  meso_loop:
  - step: '1. Стартовый прорыв ближнего боя (Ранги 1–4: Пистолеты и Дробовики)'
    player_action: Сверхскоростные подкаты и дуэли в упор в центральном узле контейнеров
      из пистолетов и дробовиков
    game_response: Высокая плотность спавна врагов в центре, быстрый набор первых
      3–4 фрагов, переход на автоматическое оружие
    decision: Агрессивно фармить первые фраги в узком центре арены или обойти по внешнему
      периметру терминала
    duration: 15–20 с
  - step: '2. Тактическая серия и активация БПЛА (Ранги 5–8: ПП и Штурмовые Винтовки)'
    player_action: Контроль отдачи на средних дистанциях (MP5, P90, M4, AK), набор
      серии из 3 фрагов и вызов БПЛА «Оверлорд»
    game_response: Звук сонара, подсветка силуэтов врагов сквозь контейнеры на 8.0
      с, рост плотности ответного огня ботов
    decision: Использовать подсветку БПЛА для штурма плотной группы врагов или занять
      контейнер для отстрела сверху
    duration: 25–35 с
  - step: '3. Финальная дуэль на точность и триумфальный залп (Ранги 9–12: DMR, AWP,
      РПГ-7)'
    player_action: Выцеливание уязвимых зон из DMR и снайперки AWP, уклонение от перекрестного
      огня и финальный выстрел из Золотого РПГ-7
    game_response: Таймер матча тикает (<20 с), звуковые сирены финала, боты стягиваются
      к позиции лидера гонки
    decision: Рискнуть выстрелом ноу-скопом в прыжке с подката или занять выжидательную
      позицию на контейнере под таймер матча
    duration: 20–30 с
  macro_loop:
  - step: 1. Участие в рейтинговой гонке вооружений Gun Game
    player_action: Выбор режима матча и участие в 90-секундной рейтинговой гонке вооружений
      на выбывание
    game_response: Динамичный матч 1 vs 7 на арене из контейнеров, регистрация фрагов
      в реальном времени, финальный экран победы с фейерверком или поражения по таймеру
    decision: Оценить эффективность стиля игры (агрессивный пуш в подкатах vs позиционный
      отстрел со снайперки) на основе итоговой статистики точности и фрагов
    duration: 60–90 с
  - step: 2. Подведение итогов, расчет очков и сбор трофеев
    player_action: Просмотр экрана итогов матча, сбор наград боевого пропуска и жетонов
      терминала
    game_response: Начисление опыта аккаунта, выдача звезд победы (+100 жетонов за
      1-е место), обновление позиции в таблице лидеров терминала
    decision: Потратить заработанные жетоны на новый неоновый камуфляж для дробовика/снайперки
      или копить на престижный золотой скин РПГ-7
    duration: 10–15 с
  - step: 3. Кастомизация арсенала в оружейной и подготовка к реваншу
    player_action: Экипировка разблокированных камуфляжей и тактических перчаток в
      оружейной, запуск нового раунда
    game_response: Отображение кастомизированного 3D-оперативника и оружия с PBR-материалами
      в главном меню, обновление рангового звания
    decision: Сменить раскладку камуфляжей оружия и тактических перчаток для следующего
      матча или запустить реванш для побития рекорда времени (<50 с)
    duration: 15–30 с
  loop_diagram: "+-------------------------------------------------------------------------------+\n\
    |                       ГАНГЕЙМ: КОНТЕЙНЕРНЫЙ ПРОРЫВ                         \
    \  |\n+-------------------------------------------------------------------------------+\n\
