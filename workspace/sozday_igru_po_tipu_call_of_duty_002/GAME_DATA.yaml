qa:
  functional_tests:
  - Проверка корректной смены оружия строго после каждого фрага в соответствии с лестницей
    1..12
  - 'Проверка физики подката: срабатывание только в движении, сохранение инерции 0.85
    сек, снижение высоты коллайдера на 50%'
  - Проверка вызова БПЛА при достижении серии в 3 фрага и подсветки ботов сквозь контейнеры
    на 8 секунд
  - Проверка условия победы при совершении 12-го фрага и корректного завершения раунда
  - Проверка мгновенного респауна игрока и ботов за 1.0 секунды на безопасных точках
    спавна
  performance_benchmarks:
  - Стабильные 60 FPS на средних смартфонах (Mali-G57 / Adreno 610)
  - Время первой загрузки WebGL сцены менее 2.5 секунд
  - Количество Draw Calls не более 65 в любой точке арены
  - Потребление оперативной памяти не более 180 МБ
  cross_browser_matrix:
  - Chrome Mobile / Desktop (Windows, Android)
  - Safari Mobile / Desktop (iOS 15+, macOS)
  - Yandex Browser Mobile / Desktop
  - VK In-App Browser (Android / iOS)
  common_bug_checklist:
  - Застревание игрока внутри геометрии контейнеров при завершении подката
  - Потеря фокуса мыши (PointerLock) при нажатии Esc или открытии рекламы
  - Несрабатывание тач-событий при одновременном скольжении и прицеливании на iOS
  - Утечка памяти при многократных перезапусках матчей без перезагрузки страницы
roadmap:
- phase_number: 1
  title: Прототип FPS-контроллера и физики подката
  duration_days: 2
  tasks:
  - Интеграция Three.js сцены и физики Rapier3D
  - Реализация FPS-контроллера с инерцией спринта и подкатом
  - Настройка камеры от первого лица с эффектом покачивания и наклона
  milestone_deliverable: Рабочий прототип перемещения бойца с плавным подкатом и вскидкой
    оружия
- phase_number: 2
  title: Арена из контейнеров, стрельба и лестница Gun Game
  duration_days: 2
  tasks:
  - Построение 3D геометрии контейнерной арены с материалами мокрого асфальта
  - Хитскан система стрельбы, разброс пуль и дифференцированные хитбоксы
  - Логика лестницы Gun Game с мгновенной заменой моделей оружия
  milestone_deliverable: Собранная арена Shipment и работающая лестница смены 12 стволов
    за фраги
- phase_number: 3
  title: ИИ ботов, киллстрики БПЛА и тактильный аудио-фидбек
  duration_days: 2
  tasks:
  - Навигация NavMesh и боевой ИИ ботов с подкатами и укрытиями
  - Система киллстрика БПЛА с шейдерной подсветкой силуэтов сквозь стены
  - Интеграция аудио Web Audio API (выстрелы, щелчки хитмаркера, рация)
  milestone_deliverable: Умные боты на NavMesh, летающий БПЛА с подсветкой врагов
    и сочные хитмаркеры
- phase_number: 4
  title: Мобильное управление, UI/HUD, оптимизация 60 FPS и SDK
  duration_days: 2
  tasks:
  - Двухзонный тач-интерфейс со свайпом подката для мобильных
  - HUD интерфейс (радар, лестница оружия, таймер, хитмаркер)
  - Подключение Playgama Bridge SDK 2.x (сохранения, лидерборды, реклама)
  - Оптимизация дроуколлов, инстансинг гильз и финальное тестирование
  milestone_deliverable: Полноценная игра 60 FPS со звуком, двухзонным тачем и SDK
    Playgama Bridge
risks:
- risk: Падение производительности на слабых мобильных GPU при частых вспышках выстрелов
    и эффектах дыма.
  category: performance
  severity: High
  mitigation: Использование инстансированных мешей для гильз, пула спрайтов для дульного
    огня и запеченных лайтмапов без реалтайм-теней.
- risk: Сложность мобильного управления при совмещении спринта, подката и точной стрельбы.
  category: controls
  severity: High
  mitigation: Разделение экрана на четкие зоны, свайп вниз для подката и умный ассист
    прицеливания (Aim Assist) в пределах 5 градусов.
- risk: Прострелы сквозь углы контейнеров из-за ошибок хитбокса в физике Rapier3D.
