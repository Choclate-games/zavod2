_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: sozday_igru_po_tipu_call_of_duty_002
performance:
  target_fps: 60
  max_draw_calls: 65
  max_triangles: 38000
  bundle_size_budget_mb: 3.8
session:
  model: Интенсивная гонка вооружений (Gun Game) на компактной арене длительностью
    60–90 секунд до 12 фрагов с мгновенным респауном за 1.0 секунды.
  win: Совершить 12 фрагов быстрее всех соперников, пройдя полную цепочку из 12 видов
    оружия и сделав финальное убийство из золотого РПГ/ножа за отведенные 90 секунд.
  lose: Если другой боец на арене совершает 12-й фраг первым, либо по истечении таймера
    в 90 секунд игрок не занимает 1-е место по числу фрагов.
  difficulty_curve: 'Динамический адаптивный пейсинг: первые 3 фрага (пистолеты/дробовики)
    проходятся на ближней дистанции за 10–15 секунд; середина (ПП и автоматы) требует
    контроля отдачи и смены флангов против поумневших ботов; финальные 3 фрага (снайперка
    и РПГ) повышают цену промаха, требуя тайминга подкатов и максимальной концентрации
    в условиях плотного перекрестного огня.'
mechanics:
  lestnitsa_vooruzheniy_s_mgnovennoy_transformatsiey:
    name: Лестница Вооружений с Мгновенной Трансформацией (Instant Gun Ladder Morph)
    parameters:
      morph_transition_duration:
        value: 0.08 с
        note: При >0.25 с теряется ощущение бешеного потока и разрывается комбо-серия
          фрагов; при <0.02 с игрок не успевает среагировать на изменение физики отдачи
          нового ствола.
      ladder_tier_count:
        value: 12 рангов
        note: При <8 рангах матч завершается слишком быстро (до 40 с) без демонстрации
          контраста классов; при >16 рангах сессия затягивается свыше 120 с, вызывая
          усталость пальцев на тачскрине.
      frag_refill_ammo:
        value: 100% обоймы
        note: При неполном боезапасе игрок наказывается пустой обоймой за успешный
          фраг, что вызывает фрустрацию; при бесконечной стрельбе обесценивается точность
          попаданий.
      headshot_skip_ladder:
        value: 0 рангов бонусного перескока
        note: Сознательно отключен перескок через ранг за хедшот (0 рангов), чтобы
          гарантировать полное прохождение 12 контрастных паттернов стрельбы каждым
          участником гонки.
  boevoy_podkat_s_inertsiey_i_nizkoprofilnoy_strelbo:
    name: Боевой Подкат с Инерцией и Низкопрофильной Стрельбой (Combat Slide & Hipfire)
    parameters:
      slide_velocity_multiplier:
        value: 1.35x (10.8 м/с от базы 8.0 м/с)
        note: При >1.6x игрок теряет контроль на поворотах между ящиками и врезается
          в стены; при <1.15x подкат теряет смысл как инструмент уклонения от пуль.
      hitbox_height_reduction:
        value: 50% (с 1.80 м до 0.90 м)
        note: При <30% снижения вражеский огонь на уровне груди продолжает попадать
          в игрока; при >70% игрок визуально проваливается под геометрию сцены.
      slide_duration:
        value: 0.90 с
        note: При <0.5 с подкат ощущается дерганым спамом; при >1.3 с игрок становится
          легкой предсказуемой мишенью на прямолинейной траектории.
      slide_cooldown:
        value: 0.35 с
        note: При 0 с возникает абуз непрерывного слайд-кансела, ломающий баланс;
          при >0.8 с теряется текучесть паркур-движения.
      slide_spread_penalty:
        value: +25% к разбросу от бедра
        note: При 0% отпадает надобность в прицельной стрельбе; при >60% стрельба
          в подкате превращается в бесполезный визуальный трюк.
  takticheskiy_bpla_razvedchik_overlord_tactical_uav:
    name: Тактический БПЛА Разведчик «Оверлорд» (Tactical UAV Killstreak)
    parameters:
      killstreak_cost:
        value: 3 фрага без смертей
        note: При 2 фрагах радар работает непрерывно весь раунд, убивая интригу позиционирования;
          при 5 фрагах в коротком 90-секундном матче большинство игроков ни разу его
          не вызовут.
      uav_active_duration:
        value: 8.0 с
        note: При <4 с игрок не успевает добежать до обнаруженных врагов; при >14
          с контейнеры теряют смысл как тактическое укрытие.
      radar_pulse_interval:
        value: 1.5 с
        note: При 0 с (постоянный рентген) теряется ценность предугадывания траектории;
          при >3.0 с враг успевает сменить позицию и метка дезинформирует.
      wallhack_outline_alpha:
        value: 0.85 непрозрачность
        note: При <0.4 метки теряются на фоне ярких текстур контейнеров; при 1.0 плотная
          заливка перекрывает прицельное перекрестие.
  differentsirovannyy_hit_otklik_s_zonami_uyazvimost:
    name: Дифференцированный Хит-Отклик с Зонами Уязвимости (Precision Hit-Zone &
      Stagger Dynamics)
    parameters:
      headshot_damage_multiplier:
        value: 2.0x
        note: При 1.2x игроки перестают целиться в голову и спамят в туловище; при
          >3.0x любое оружие превращается в случайный мгновенный ваншот от шальной
          пули.
      stagger_slowdown_duration:
        value: 0.35 с (замедление цели на 30%)
        note: При <0.1 с противник игнорирует урон в движении; при >0.8 с бойцы превращаются
          в недвижимые мишени, ломая динамику перестрелок.
      hitmarker_duration:
        value: 0.18 с
        note: При <0.08 с мозг не успевает зафиксировать подтверждение попадания;
          при >0.4 с визуальный мусор перекрывает цель.
      hit_audio_pitch_headshot:
        value: 1320 Гц (против 880 Гц в тело)
        note: Разница частот в 1.5 раза дает мгновенный интуитивный аудио-отчет о
          критическом попадании без отвлечения взгляда на интерфейс.
  vertikalnyy_perelaz_konteynerov_i_srez_vysoty_rapi:
    name: Вертикальный Перелаз Контейнеров и Срез Высоты (Rapid Container Vault &
      Flanking)
    parameters:
      max_vault_obstacle_height:
        value: 2.60 м (высота стандартного контейнера)
        note: При <2.2 м игрок не может забраться на стандартный 20-футовый контейнер;
          при >3.2 м теряется реализм тактического спецназа.
      vault_animation_duration:
        value: 0.40 с
        note: При <0.2 с действие выглядит неестественной телепортацией; при >0.75
          с игрок гарантированно погибает в процессе анимации от любого стрелка.
      fall_damage_threshold:
        value: 6.0 м
        note: Спрыгивание с одинарного контейнера 2.6 м не наносит урона и не замедляет
          бег, сохраняя динамику потока.
