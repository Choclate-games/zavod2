title: 'Снайпер: Призрачный Контракт'
slug: sozday_igru_po_tipu_call_of_duty_003
genre: Тактический 3D Снайперский Экшен
subgenre: Снайперский стелс-симулятор / Тактическая головоломка от первого лица
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web)
orientation: landscape
target_audience: Мужчины и подростки 16–45 лет, фанаты серии Call of Duty (в особенности
  снайперских спецопераций уровня «All Ghillied Up»), Sniper Elite и Hitman. Игроки,
  ценящие кинематографичный милитари-реализм, тактическое планирование и выверенные
  одиночные выстрелы без утомительного виртуального перемещения на сенсорных экранах.
core_loop: Изучение базы через оптический прицел и выявление маршрутов целей -> Планирование
  скрытного порядка устранения и цепных реакций -> Задержка дыхания со слоу-мо (Time
  Dilation 50%) и выверенный выстрел -> Скрытная нейтрализация или саботаж до поднятия
  тревоги -> Получение контрактной награды за бесшумность -> Открытие новых винтовок,
  оптики и высокорисковых контрактов.
hook: 'Выстрел в трос подвесного прожектора на высоте 30 метров в момент прохода офицера:
  лампа падает в замедленном времени, гасит освещение сектора и погребает цель под
  снопом искр, пока часовые в панике озираются в темноте, списывая смерть на аварию
  трансформатора.'
player_fantasy: Вы — элитный снайпер-диверсант глубокого внедрения в заполярном камуфляже.
  Затаившись на заснеженном склоне, вы в одиночку нейтрализуете охраняемый гарнизон
  секретной радарной базы, превращая каждый выстрел в произведение тактического искусства
  и маскируя ликвидации под цепь несчастных случаев.
session_model: 'Снайперский контракт: скрытная ликвидация 3–4 приоритетных целей на
  военном объекте за 60–90 секунд до поднятия общей тревоги'
unique_value_proposition: 'Культовый снайперский опыт Call of Duty («All Ghillied
  Up») в браузере: кинематографичная оптика Mil-Dot с замедлением времени задержкой
  дыхания, интерактивное разрушаемое окружение для скрытных цепных аварий и умный
  стелс-ИИ, управляемый одним скольжением пальца без виртуального джойстика.'
vision: 'Создать лучший браузерный тактический снайперский экшен с эталонным тактильным
  ощущением выстрела: кристальная оптика с физическим параллаксом, кинематографичный
  Kill-Cam, динамическая метель и сочная физика рэгдоллов, запускающиеся за 1 секунду
  на смартфонах и ПК.'
elevator_pitch: '«Снайпер: Призрачный Контракт» — тактический 3D-снайперский стелс-экшен
  от первого лица. Ликвидируйте офицеров и часовых на заполярной военной базе за 60–90
  секунд: задерживайте дыхание для замедления времени, перебивайте силовые кабели,
  взрывайте щитки и обрушивайте прожекторы, выполняя контракты без единой сирены.'
win_conditions: Устранены все 3–4 назначенные контрактом приоритетные цели без поднятия
  общей тревоги базы (или ликвидация завершена до истечения 5-секундного таймера тревоги
  после обнаружения тела).
lose_conditions: Поднята общая тревога базы (истек 5.0-секундный таймер тревоги после
  поднятия паники часовыми), либо VIP-цель скрылась в бронированном бункере, либо
  израсходован весь лимитированный боекомплект снайпера (5–7 патронов).
progression_summary: Выполнение контрактов приносит армейские кредиты и очки скрытности.
  В арсенале открываются 6 снайперских винтовок (от бесшумного ВСС «Винторез» до крупнокалиберной
  Barrett .50), 5 типов прицелов (Mil-Dot, шеврон, ночной/тепловизор), сошки и патроны
  специального назначения (дозвуковые, бронебойные, зажигательные), а также 12 контрактов
  в нарастающих погодных условиях (штормовой ветер, густая метель, полярная ночь).
difficulty_curve: 'Контракты 1–3 (Обучение): изолированные статичные часовые, широкие
  слепые зоны, явные подвесные прожекторы и бочки. Контракты 4–7 (Спецоперация): спаренные
  патрули, пересекающиеся конусы зрения, бронированные каски (требующие выстрела в
  шею/лицо), таймеры смены караула и боковой ветер. Контракты 8–12 (Элита): движущиеся
  бронемашины, снайперы-контрснайперы на вышках, замаскированные VIP в сопровождении
  личной охраны и сильная пурга со сниженной видимостью.'
