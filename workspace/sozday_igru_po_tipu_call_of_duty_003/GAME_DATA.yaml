  ветра (скорость в м/с и стрелка направления); touch controls at the bottom corners.
  Lighting: Контрастное ночное освещение: холодный лунный свет индиго (DirectionalLight
  0.3) в сочетании с яркими желто-оранжевыми конусами патрульных прожекторов (SpotLight
  с динамическими тенями).. Color palette: #e63946, #d8e2dc, #2b2d42, #0a1128, #38b000,
  #ffb703. High visual clarity, readable silhouettes, immersive WebGL game aesthetics.'
