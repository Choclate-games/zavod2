definition_of_done:
- Снайперский контракт запускается за 1 секунду без долгого обучения и работает при
  стабильных 60 FPS на WebGL/Three.js.
- Управление на смартфонах идеально адаптировано под свайп-наведение и удержание кнопки
  задержки дыхания без виртуального джойстика ходьбы.
- Механика задержки дыхания замедляет время на 50%, стабилизирует прицел и сопровождается
  звуком сердцебиения.
- На карте присутствуют интерактивные объекты (прожекторы, кабели, бочки), позволяющие
  устранять цели скрытными цепными реакциями окружения.
- Система стелс-детекции запускает 5-секундный таймер тревоги при обнаружении тела
  патрульным, давая шанс на экстренный перехват.
- Поражение финальной цели контракта сопровождается замедленной кинематографичной
  камерой Kill-Cam.
- Интеграция с Playgama Bridge SDK обеспечивает сохранение прогресса, лидерборды и
  монетизацию через rewarded/interstitial рекламу.
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Изучение базы через оптический прицел и выявление маршрутов
  целей -> Планирование скрытного порядка устранения и цепных реакций -> Задержка
  дыхания со слоу-мо (Time Dilation 50%) и выверенный выстрел -> Скрытная нейтрализация
  или саботаж до поднятия тревоги -> Получение контрактной награды за бесшумность
  -> Открытие новых винтовок, оптики и высокорисковых контрактов..'
- 'Реализованы механики проекта: Тактическая задержка дыхания и фокус-дилатация времени,
  Кинетический саботаж окружения и цепные аварии, Двухфазная стелс-детекция ИИ и паника
  гарнизона, Баллистика Mil-Dot, снос метелью и упреждение звукового барьера.'
- Условие успеха (Устранены все 3–4 назначенные контрактом приоритетные цели без поднятия
  общей тревоги базы (или ликвидация завершена до истечения 5-секундного таймера тревоги
  после обнаружения тела).) и условие проигрыша (Поднята общая тревога базы (истек
  5.0-секундный таймер тревоги после поднятия паники часовыми), либо VIP-цель скрылась
  в бронированном бункере, либо израсходован весь лимитированный боекомплект снайпера
  (5–7 патронов).) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Снайпер: Призрачный Контракт».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Тактическая Перемотка Времени, Двойной
  Гонорар Контракта, Ящик Спецбоеприпасов); interstitial соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
direction:
  options:
  - id: D1
    name: 'Снайпер: Призрачный Контракт'
    pitch: Ликвидируй офицеров и сорви эвакуацию колонны точными выстрелами с дальней
      дистанции, управляя дыханием и сбивая окружение на головы врагам.
