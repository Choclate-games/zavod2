  rejection_reason: Игра является тактическим снайперским стелс-симулятором и физической
    головоломкой с фиксированной снайперской позиции, а не экшеном на выживание в
    толпе или рогаликом. Механики орды, ближнего боя, карточных апгрейдов и тяжелый
    ECS/Recast избыточны и навязывают чуждые жанровые паттерны, так как на базе находится
    всего несколько часовых с фиксированными маршрутами.
  loop_pattern: ''
  summary: Проект опирается на связку высокоточного снайперского прицеливания (ThreeMeshBVH),
    стелс-детекции и физического саботажа окружения (Rapier3D) с процедурной милитари-геометрией,
    синтезом звука и эффектами оптики; стандартные архетипы петель из patterns не
    выбраны, так как игра строится вокруг уникальной структуры коротких тактических
    стелс-контрактов.
