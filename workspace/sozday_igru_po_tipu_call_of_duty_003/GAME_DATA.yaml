gameplay_systems:
- name: Система стелса и искусственного интеллекта базы (AI Stealth & Alert System)
  purpose: Управление состояниями патрулей, маршрутами, обнаружением тел и эскалацией
    тревоги гарнизона.
  input: Позиции рэгдолл-тел, точки попадания пуль, прямые лучи видимости между охранниками
    и целями.
  rules:
  - Каждый ИИ имеет конус зрения 75 градусов и дальность обнаружения 120 метров в
    ясную погоду (60 метров в метель).
  - Обнаружение тела павшего часового переводит ИИ в статус «Подозрение» на 1.5 секунды,
    после чего включается 5-секундный таймер бега к пульту тревоги.
  - Ликвидация бегущего часового до нажатия кнопки сбрасывает общую тревогу, но переводит
    базу в режим настороженности (патрули останавливаются и осматриваются).
  - Убийство из оружия без глушителя мгновенно демаскирует позицию снайпера и запускает
    таймер тревоги на 3 секунды.
  state:
  - idle_patrol
  - suspicious_investigating
  - running_to_alarm
  - alarm_raised_failed
  - eliminated_ragdoll
  interactions: Взаимодействует с системой баллистики (получение урона) и системой
    окружения (гибель от падающих объектов).
  feedback: Иконки статуса над головами ботов, голосовые реплики по рации на русском
    ('Пост 2, ответьте...', 'У нас двухсотый!'), нарастающий саундтрек сирены.
  edge_cases:
  - Тело падает с крыши прямо под ноги офицеру — мгновенный переход в бег к сирене
  - Два часовых смотрят друг на друга — ликвидация требует двойного попадания или
    цепной реакции
- name: Система баллистики, оптики и управления временем (Ballistics & Time Dilation
    System)
  purpose: Расчет траектории полета пули, хитбоксов уязвимых зон, управления замедлением
    времени и стабильностью прицела.
  input: Координаты перекрестия прицела, состояние задержки дыхания, вектор ветра,
    дистанция до цели.
  rules:
  - Задержка дыхания замедляет deltaTime физики и анимаций на 50% (коэффициент 0.5x).
  - Запас воздуха ограничен 4.0 секундами, восстановление занимает 3.0 секунды после
    отпускания.
  - Скорость пули составляет 850 м/с, время полета на 425 м равно 0.5 секунды (в слоу-мо
    — 1.0 с).
  - Хитбокс головы дает множитель урона 3.0x и мгновенную бесшумную нейтрализацию;
    хитбокс туловища — 1.0x.
  state:
  - normal_aiming
  - holding_breath_slowmo
  - exhausted_breathing
  - bullet_flying
  - kill_cam_cinematic
  interactions: Передает импульс рэгдоллу врага или триггерит физический разлом интерактивного
    объекта.
  feedback: Дыхание снайпера, размытие периферии линзы, стабилизация сетки прицела,
    кинематографичная камера полета пули (Kill-Cam) на финальной цели.
  edge_cases:
  - Выстрел в момент полного исчерпания воздуха — прицел резко дергается вверх из-за
    судорожного вдоха
- name: Система разрушаемого окружения и цепных аварий (Environmental Hazard & Chain
    Reaction System)
  purpose: Обработка попаданий в специфические узлы инфраструктуры базы и запуск физических
    аварий.
  input: Raycast попадания пули в зарегистрированный коллайдер интерактивного объекта.
  rules:
  - Попадание в трос подвесного прожектора отсоединяет шарнир Rapier3D — прожектор
    падает вниз с гравитацией 9.8 м/с2, убивая всех в радиусе 3 метров и отключая
    свет.
  - Попадание в распределительный щит вызывает короткое замыкание, поражая током стоящего
    рядом часового и временно ослепляя сектор на 6 секунд.
  - Попадание в бочку с горючим поджигает топливо (задержка взрыва 0.8 с, радиус поражения
    5 метров, маскируется под производственную аварию при отсутствии прямых свидетелей
    выстрела).
  state:
  - intact_armed
  - triggered_falling
  - destroyed_spent
  - hazard_active
  interactions: Наносит физический и кинетический урон ИИ-агентам, меняет освещение
    Three.js на сцене.
  feedback: Искры, динамические тени от качающегося падающего фонаря, грохот металла,
    клубы пара и дыма.
  edge_cases:
  - Падающий прожектор сбивает стоящую внизу бочку — каскадная цепная реакция
- name: Система контрактов, экономики и арсенала (Contract Economy & Arsenal System)
  purpose: Оценка качества выполнения контракта, начисление валюты, разблокировка
    оружия и кастомизация оптики.
  input: 'Статистика завершенного контракта: время, количество выстрелов, хедшоты,
    скрытность, аварии окружения.'
  rules:
  - 'Базовая награда за контракт: 1000 кредитов.'
  - 'Бонус за идеальный стелс (0 тревог): +500 кредитов.'
  - 'Бонус за убийства окружением: +250 кредитов за каждый несчастный случай.'
  - 'Штраф за промах: -50 кредитов за выстрел мимо цели.'
  - Покупка винтовки открывает ее навсегда в облачном сохранении Playgama.
  state:
  - contract_briefing
  - contract_active
  - contract_debriefing_win
  - contract_failed
  - arsenal_menu
  interactions: Сохраняет данные прогресса через Playgama Cloud Save, синхронизирует
    рекорды с лидербордом.
  feedback: Штамп 'КОНТРАКТ ВЫПОЛНЕН' с сургучной печатью, звон монет, анимация разблокировки
    новой оптики.
  edge_cases:
  - Игрок закрыл вкладку во время миссии — сохранение фиксирует статус до старта контракта
core_design:
  signature_moment: 'Выстрел с дистанции 420 метров в стальной трос подвесного прожектора
    на 30-метровой мачте: пуля 7.62x54mm перебивает крепление в момент прохода командира
    гарнизона. В замедленном времени (Time Dilation 50%) полутонный прожектор срывается
    вниз, обрывает силовой кабель с фонтаном ослепительных электрических искр и насмерть
    погребает цель под обломками. Вся база погружается в аварийную тьму, а часовые
    в радиоэфире кричат о коротком замыкании из-за метели, не поднимая боевой тревоги.'
  genre_template_rejected: 'Отвергнут шаблон «Аркадный тир с волнами бегущих врагов
    и автоприцеливанием» (а-ля мобильные клоны Sniper 3D / аркадные рельсовые шутеры)
    и шаблон «Случайные карты перков после убийства». В нашей игре нет открытого штурмового
    боя с автоматом в руках и нет абстрактных бонусов вроде «+10% к урону от магии».
    Вместо этого реализован чистый тактический стелс-пазл от первого лица: цена каждого
    патрона предельно высока, стрельба подчиняется физической баллистике и полярному
    ветру, а любая ошибка карается 5-секундным таймером общей тревоги и провалом контракта.'
  what_makes_it_different: 'В отличие от классических снайперских игр, где игрок просто
    методично отстреливает головы статичным часовым, здесь каждый выстрел — это физический
    триггер для цепной аварии (Kinetic Environmental Sabotage) или синхронизированный
    с громом/дизелем скрытный трюк (Acoustic Masking). Ликвидация через падение прожектора,
    разрыв паропровода или утечку азота не считается убийством для ИИ: враги воспринимают
    это как производственную аварию в условиях сурового Заполярья, что позволяет зачистить
    охраняемый военный объект без единого выстрела в человека.'
  micro_loop:
  - step: Оценка сектора и баллистических условий
    player_action: Игрок наводит оптический прицел на часового, считывает дистанцию
      дальномера (380 м) и ветроуказатель метели (боковой ветер 8.5 м/с слева).
    game_response: Прицел плавно покачивается с амплитудой ±16 px/s, аудиомикс транслирует
      порывы пурги и пульсирующий акустический спектрограф базы.
    decision: Стрелять напрямую с выносом на 2.5 мила по сетке Mil-Dot или искать
      объект окружения для бесшумного саботажа.
    duration: 1.5–3.0 с
  - step: Тактическая задержка дыхания и выбор окна
    player_action: Игрок зажимает сенсорную кнопку фокуса (или клавишу Shift/Space),
      активируя задержку дыхания.
    game_response: Время замедляется на 50%, покачивание прицела за 0.25 с замирает
      в нуле, звук ветра приглушается, сменяясь глухим стуком пульса, шкала легких
      убывает (25%/с).
    decision: Произвести выстрел сейчас с риском детекции звука или дождаться раската
      грома/вспышки дизель-генератора через 1.2 секунды для 100% акустической маскировки.
    duration: 1.0–2.5 с
  - step: Спуск курка и полет пули
    player_action: Игрок нажимает кнопку выстрела по уязвимому узлу (трос подвеса
      / вентиль пара / шея офицера).
    game_response: Сухой щелчок бойка, глухой хлопок выстрела, отдача подбрасывает
      прицел на 1.8 градуса вверх, камера сопровождает пулю в кинематографичном ракурсе
      Bullet-Cam.
    decision: Немедленно отпустить задержку дыхания для предотвращения гипервентиляции
      и перевести взгляд на соседних часовых.
    duration: 0.35–0.7 с
  - step: Кинетический импакт и оценка реакции гарнизона
    player_action: Игрок наблюдает за падением конструкции или цели, контролируя конусы
      зрения ближайших солдат.
    game_response: Цель нейтрализована без шума (Accident Kill / Silent Headshot),
      над соседним часовым загорается желтый маркер подозрения (0–40%), затем сбрасывается
      из-за списания на аварию.
    decision: Остаться на текущей прицельной позиции или сместить оптику на вторую
      цель маршрута.
    duration: 1.0–2.0 с
  meso_loop:
  - step: Тактическая рекогносцировка сектора базы
    player_action: Игрок переключает кратность оптики (4x -> 8x -> 16x) и сканирует
      маршруты 3–4 контрактных целей и часовых в секторе.
    game_response: Интерфейс подсвечивает цели контракта золотыми маркерами VIP, отображает
      тайминг смены караула (18.0 с) и физические интерактивные объекты (тросы, бочки,
      генераторы).
    decision: 'Определить оптимальный порядок устранения: ликвидировать ли сначала
      изолированного снайпера на вышке или подготовить ловушку для офицера.'
    duration: 10.0–15.0 с
  - step: Изоляция и устранение внешнего периметра
    player_action: Игрок совершает синхронный тихий выстрел в момент раската полярного
      грома, снимая контрснайпера на вышке.
    game_response: Тело контрснайпера падает внутрь закрытой кабины вышки (вне зоны
      видимости патрулей), сектор лишается верхнего наблюдательного поста.
    decision: Использовать освободившийся угол обзора для отстрела клапана криогенного
      трубопровода или прострела кабеля электроснабжения.
    duration: 8.0–12.0 с
  - step: Провокация цепной аварии по приоритетной цели
    player_action: Игрок перебивает крепежный трос подвесного груза/прожектора над
      маршрутом движения офицера гарнизона.
    game_response: Груз падает, ликвидирует VIP-цель со статусом 'Несчастный случай',
      патрульные сбегаются к месту крушения на 8.0 секунд в состоянии замешательства.
    decision: Воспользоваться хаосом и сгруппированностью врагов для пробития топливного
      бака генератора или быстро снять оставшегося радиста.
    duration: 6.0–10.0 с
  - step: Ликвидация последнего свидетеля и контроль таймера тревоги
    player_action: Игрок точным попаданием в шею нейтрализует офицера связи, начавшего
      движение к рубильнику тревоги.
    game_response: Желтая шкала тревоги 85% мгновенно гаснет, в рации звучит подтверждение
      'Все чисто, продолжайте патрулирование', контрактный счетчик целей достигает
      100%.
    decision: Зафиксировать завершение контракта и запросить эвакуационный протокол.
    duration: 3.0–5.0 с
  macro_loop:
  - step: Брифинг спецоперации и выбор контракта
    player_action: Игрок открывает тактическую карту полярного архипелага и выбирает
      контракт повышенного уровня риска.
    game_response: Штаб выводит метеорологическую сводку (штормовой ветер 12 м/с,
      густая пурга, температура -32°C), схему охраны радарного узла и список 4 приоритетных
      VIP.
    decision: Взять контракт на скрытную диверсию с бонусом за 'Все смерти от несчастных
      случаев' или контракт на ликвидацию на сверхдальней дистанции (550 м).
    duration: 15.0–30.0 с
  - step: Конфигурация оружейной платформы и боекомплекта
    player_action: Игрок выбирает снайперскую винтовку (напр. DVL-10 'Урбана' или
      Т-5000), монтирует оптику Horus H59, сошки и заряжает 5 дозвуковых бронебойных
      патронов 7.62x51 мм AP.
    game_response: 'Меняются базовые ТТХ оружия: снижается скорость звука выстрела
      (-80%), падает базовое покачивание ствола (-40%), увеличивается вертикальное
      падение пули на 300 м (+0.8 м).'
    decision: Пожертвовать настильностью траектории ради абсолютной бесшумности или
      взять мощный .338 Lapua Magnum с акустической маскировкой.
    duration: 20.0–40.0 с
  - step: Выполнение боевого контракта на объекте
    player_action: 'Игрок проводит 60–90 секундную сессию: расчет баллистики, саботаж
      инфраструктуры базы, нейтрализация 4 целей без поднятия тревоги.'
    game_response: 'Динамическая симуляция мира: патрули ИИ, порывы ветра, физика
      обрушения конструкций Rapier3D, расчет очков скрытности и точности попаданий.'
    decision: Действовать медленно и наверняка или уложиться в 60-секундный спидран-норматив
      спецуры для получения максимального золотого жетона ССО.
    duration: 60.0–90.0 с
  - step: Эвакуация, выплата контрактного гонорара и оружейный апгрейд
    player_action: Игрок забирает армейские кредиты, очки репутации 'Призрак' и открывает
      доступ к новой крупнокалиберной винтовке Barrett .50 и тепловизору.
    game_response: 'Экран дебрифинга детализирует статистику: 0 тревог, 3 несчастных
      случая, 1 хедшот через бурю, выплата 12,500 кредитов, открыт контракт ''Радарный
      купол Скала-4''.'
    decision: Инвестировать кредиты в установку титанового глушителя на Т-5000 или
      разблокировать тепловизионную оптику с распознаванием целей сквозь пургу.
    duration: 20.0–30.0 с
  loop_diagram: "+-----------------------------------------------------------------------------------+\n\
    |                            МАКРО-ПЕТЛЯ (ШТАБ / ПРОГРЕССИЯ)                 \
    \       |\n|  [Выбор полярного контракта] -> [Кастомизация винтовки и оптики]\
    \ -> [Эвакуация /  |\n|  Награда ГРУ] -> [Покупка спецпатронов, сошек, тепловизоров]\
    \                      |\n+-----------------------------------------------------------------------------------+\n\
    \                                          |  Старт контракта (60-90 с)\n    \
    \                                      v\n+-----------------------------------------------------------------------------------+\n\
    |                            МЕЗО-ПЕТЛЯ (СЕКТОР / VIP-ЦЕЛИ)                  \
    \       |\n|  [Сканирование базы] -> [Выбор порядка целей] -> [Изоляция снайперов]\
    \ ->          |\n|  [Провокация цепных аварий] -> [Устранение свидетелей] -> [Контроль\
    \ сирены 5.0с]   |\n+-----------------------------------------------------------------------------------+\n\
    \                                          |  Каждый отдельный выстрел\n     \
    \                                     v\n+-----------------------------------------------------------------------------------+\n\
    |                         МИКРО-ПЕТЛЯ (ПОСЕКУНДНАЯ СТРЕЛЬБА)                 \
    \       |\n|                                                                 \
    \                  |\n|  +-----------------------------------------------------------------------------+\
    \  |\n|  | 1. НАВЕДЕНИЕ: Считывание ветра (0-14 м/с) и дистанции (300-600 м) \
    \          |  |\n|  |                                      |                 \
    \                     |  |\n|  |                                      v      \
    \                                |  |\n|  | 2. ФОКУС: Задержка дыхания (Time Dilation\
    \ 50%, sway -> 0, легкие 4.0 с)      |  |\n|  |                              \
    \        |                                      |  |\n|  |                   \
    \                   v                                      |  |\n|  | 3. СИНХРОНИЗАЦИЯ:\
    \ Ожидание акустического окна (гром / дизель базы)          |  |\n|  |       \
    \                               |                                      |  |\n\
    |  |                                      v                                  \
    \    |  |\n|  | 4. ВЫСТРЕЛ: Спуск бойка, поправка Mil-Dot, полет пули (0.35-0.70\
    \ с)         |  |\n|  |                                      |               \
    \                       |  |\n|  |                                      v    \
    \                                  |  |\n|  | 5. ИМПАКТ: Разрыв троса/хедшот ->\
    \ Accident Kill / Паника ИИ 1.8 с           |  |\n|  +-----------------------------------------------------------------------------+\
    \  |\n+-----------------------------------------------------------------------------------+"
  tension_curve: 'Кривая напряжения строится по волновой тактической схеме: 0–15 с
    (Холодный расчет, напряжение 20%) — спокойное изучение базы, чтение ветра, маркировка
    целей и поиск уязвимых тросов; 15–40 с (Нарастание давления, напряжение 55%) —
    первая ликвидация часового на вышке, тело падает на грани зоны обзора патруля,
    запуск первого тайминга акустической маскировки; 40–70 с (Пиковая кульминация,
    напряжение 95%) — выстрел в подвесной прожектор над офицером, лампа обрушивается,
    перерубленный провод искрит, соседний часовой входит в фазу подозрения (желтый
    маркер 80%), игрок за 1.8 секунды в режиме задержки дыхания обязан снять бегущего
    к сирене свидетеля; 70–85 с (Катарсис и триумф, напряжение 15%) — все 4 цели ликвидированы
    без тревоги, в эфире тишина, вертолет эвакуации забирает снайпера с заснеженного
    гребня; 85–90 с — спокойное распределение наград в оружейной.'
  core_formulas:
  - 'Формула вертикального падения пули (Bullet Drop): y_drop = 0.5 * g * (distance
    / v_muzzle)^2, где g = 9.81 м/с^2, v_muzzle = 850.0 м/с (для 7.62x54mmR). Вертикальная
    поправка по сетке Mil-Dot: mil_elevation = (y_drop / distance) * 1000 [милы].
    На дистанции 450 м падение составляет 1.37 м (поправка 3.05 мила вниз).'
  - 'Формула горизонтального ветрового сноса (Wind Deflection): x_drift = 0.5 * a_wind
    * (distance / v_muzzle)^1.45, где a_wind = wind_speed_mps * sin(wind_angle_rad).
    При боковом ветре метели 10.0 м/с под углом 90° на дистанции 450 м снос пули составляет
    1.82 м (поправка 4.04 мила по горизонту).'
  - 'Формула накопления тревоги гарнизона (AI Awareness Accumulation): awareness_delta
    = (base_alert_rate * (1.0 - distance / max_vision_range) * posture_mod * weather_mod)
    * dt. При значении awareness >= 100% за 1.80 с часовой переходит в режим ''Паника''
    и начинает 5.00-секундный забег к сирене со скоростью 5.20 м/с.'
  - 'Формула акустической заметности выстрела (Audible Footprint): audible_radius
    = base_gun_noise * suppressor_mod * (1.0 - env_noise_mask_factor). При выстреле
    во время раската грома (env_noise_mask_factor = 1.0) эффективный радиус шума падает
    со 120.0 м до 0.0 м даже для крупнокалиберной винтовки без глушителя.'
  - 'Формула финальной награды за контракт (Contract Bounty Multiplier): total_credits
    = base_contract_reward * (1.0 + 0.5 * is_ghost_stealth) * (1.0 + 0.25 * accident_kills_count)
    * (headshot_accuracy_percent / 100.0) * difficulty_tier_mult.'
  run_progression:
  - 'Тактическая радиодешифровка: каждая бесшумная ликвидация часового без тревоги
    открывает радиоперехват следующей VIP-цели, подсвечивая точное время остановки
    под опасными объектами (тросы, цистерны).'
  - 'Акустическая синхронизация: после 2 успешных выстрелов в окне маскировки прицельный
    комплекс рассчитывает и отображает предиктивный таймер следующих 3 раскатов полярного
    грома с точностью до 0.1 с.'
  - 'Менеджмент лимитированного спецбоекомплекта: внутри 90-секундного контракта игроку
    доступно ровно 5–7 патронов (включая 2 бронебойных и 2 дозвуковых); каждый промах
    безвозвратно сокращает вариативность тактического решения.'
  meta_progression:
  - 'Оружейный арсенал ССО: разблокировка 6 снайперских винтовок различных классов
    (бесшумный ВСС ''Винторез'' 9x39 мм, общевойсковая СВДМ, высокоточная Т-5000 .338
