      на военном объекте за 60–90 секунд до поднятия общей тревоги'
    camera: Вид от первого лица через высокократный оптический прицел (Sniper Scope
      POV) с черным виньетированием, параллаксом линзы, шкалой Mil-Dot и замедлением
      времени при задержке дыхания.
    control_scheme: 'Телефон: скольжение пальцем по экрану — плавное наведение прицельной
      сетки; удержание второго пальца или специальной зоны — задержка дыхания (замедление
      времени на 50% и стабилизация колебаний оптики); отпускание кнопки спуска —
      выстрел. ПК: мышь — наведение прицела; удержание Shift или Пробела — задержка
      дыхания; ЛКМ — выстрел; колесо мыши — кратность зума. Виртуальный джойстик ходьбы
      отсутствует.'
    world: 'Заснеженная закрытая радиолокационная база в заполярных горах: массивные
      бетонные купола радаров, ржавые вышки связи, колючая проволока, патрульные прожекторы,
      прорезающие метель, холодная палитра индиго, стали и сигнального оранжевого
      света прожекторов.'
    spectacle: Крупный план оптического прицела с запотевшей линзой и сеткой Mil-Dot,
      через которую на дистанции 400 метров виден вражеский часовой у бочки с топливом;
      в момент задержки дыхания мир замирает, пролетают отдельные снежинки, а на выстреле
      пуля с вихревым следом разносит подвешенный прожектор прямо на патрульный пикап.
    why_not_generic: Опирается на связку механик mechanics/stealth_detection.md +
      mechanics/chain_reaction.md + mechanics/ragdoll.md. В отличие от бездумных снайперских
      тиров, устранение часового на виду у напарника мгновенно активирует конусы зрения
      врагов (stealth_detection), поэтому игрок обязан вызывать кинетические цепные
      реакции (chain_reaction) — перебивать выстрелом силовые кабели, взрывать распределительные
      щиты и обрушивать подвесные балки, маскируя ликвидации под несчастные случаи
      с рэгдолл-физикой (ragdoll).
