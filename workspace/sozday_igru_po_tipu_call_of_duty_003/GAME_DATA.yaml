  selected_id: D1
  selected_name: 'Снайпер: Призрачный Контракт'
  selection_reason: 'Вариант D1 («Снайпер: Призрачный Контракт») идеально решает главную
    проблему мобильных и браузерных 3D-шутеров — неудобство одновременного перемещения
    и прицеливания виртуальными стиками на сенсорных экранах. Исключая ходьбу, направление
    концентрирует 100% внимания игрока на главном триумфе Call of Duty: кинематографичном,
    высокоточном снайперском расчете с задержкой дыхания и замедлением времени (культовый
    опыт миссии «All Ghillied Up»). Игра запускается за 1 секунду без долгого обучения:
    скольжение пальцем мгновенно двигает прицельную сетку, удержание включает замедление
    времени, а отпускание производит выстрел. Это обеспечивает максимальное удержание
    на мобильных устройствах, стабильные 60 FPS на одной сцене Three.js и глубокую
    тактическую вариативность за счет кинетических цепных реакций с объектами окружения.'
  rejected_reasons:
  - 'Вариант D2 («Конвой: Турельный Прорыв») отвергнут, так как рельсовый турельный
    шутер на высокой скорости создает риск визуального укачивания на мобильных экранах
    при тряске камеры, а непрерывная стрельба по набегающему транспорту быстро приедается
    без большого объема контента, требуя высоких затрат на процедурную трассу и физику
    техники.'
  - 'Вариант D3 («Спецназ: Тактический Ордер») отвергнут из-за высокой когнитивной
    нагрузки и неудобства точного микроконтроля трех отдельных оперативников на тачскринах
    смартфонов в реальном времени, а также из-за избыточной сложности продакшена (навмеш
    Recast, координация отряда, поиск пути для нескольких юнитов).'
  what_it_is_not:
  - 'Не бесконечный отстрел волн на арене: враги не спавнятся из воздуха за спиной,
    их количество и маршруты на объекте строго фиксированы на старте контракта.'
  - 'Не аркадный тир со статичными мишенями-болванчиками: противники реагируют на
    звук выстрелов, вспышки и обнаружение тел павших часовых, поднимая общую тревогу.'
  - 'Не стандартный FPS с виртуальным джойстиком ходьбы: игрок находится на замаскированной
    снайперской позиции, что устраняет неудобное управление перемещением на тачскрине.'
  - 'Не рогалик с выбором случайных карт апгрейдов и сбором золота: прогрессия строится
    на открытии новых оптических прицелов, снайперских винтовок и контрактов разной
    сложности.'
  - 'Не футуристический sci-fi шутер: визуальный стиль и баллистика выдержаны в строгой
    милитари-эстетике Modern Warfare.'
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - Механика задержки дыхания с замедлением времени (Time Dilation на 50%) и стабилизацией
    колебаний прицела при удержании пальца на экране или клавиши на ПК.
  - 'Интерактивное окружение для скрытных цепных реакций: минимум 3 типа взрывоопасных
    или разрушаемых объектов на карте (бочки с горючим, подвесные прожекторы, генераторы
    питания).'
  - 'Конусы зрения и система тревоги ИИ: обнаружение тела павшего часового патрулем
    запускает 5-секундный обратный отсчет до поднятия общей тревоги и провала контракта.'
  - Управление прицелом в одно касание без виртуального джойстика ходьбы на смартфонах
    (100% фокус на ведении цели и тайминге выстрела).
  - Физический рэгдолл (Active Ragdoll) и замедленная кинематографичная камера полета
    пули (Kill-Cam) при поражении финальной цели контракта.
  signature_scene: Ночь, продуваемая метелью заполярная радарная станция. В центре
    кадра — круглая темная виньетка высокократного оптического прицела с запотевшими
    краями линзы и светящейся зеленым тритиевой сеткой Mil-Dot. Сквозь перекрестие
    на дистанции 450 метров виден офицер в зимнем камуфляже под желтым конусом света
    патрульного прожектора, заносящий ногу на металлическую лестницу вышки. Справа
    за сеткой прицела в холодном контровом свете пролетают трассирующие искры от перебитого
    кабеля трансформатора, а в воздухе застыли отдельные подсвеченные луной снежинки
    во время замедления времени.
