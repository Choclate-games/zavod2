    .50 BMG).'
  - 'Модульные оптические комплексы: открытие 5 сеток прицелов (классический Mil-Dot,
    тактическая ''елочка'' Horus H59, шевронная сетка ПСО-1, ночной ЭОП Gen 3+ и тепловизионный
    модуль Flir с чувствительностью NETD < 25 мК).'
  - 'Специализированная номенклатура патронов: открытие дозвуковых патронов УС (нулевой
    звук, но крутая траектория), бронебойных патронов 7Н13/Б-32 (пробитие бронестекол
    вышек и касок 4-го класса) и зажигательных патронов МДЗ (подрыв цистерн с одного
    попадания).'
  - 'Карта контрактов Заполярья: прогрессия по 12 усложняющимся военным объектам (радиолокационные
    посты, арктические аэродромы, подземные бункеры подводных лодок, плавучие газовые
    платформы) с нарастанием экстремальных погодных факторов (шторм до 18 м/с, полярная
    ночь, контрснайперские дуэли).'
  mechanics:
  - name: Тактическая задержка дыхания и фокус-дилатация времени
    role_in_loop: Тормоз времени и стабилизатор прицельной марки (источник предельной
      точности и окно тактического выбора).
    player_decision: Активировать ли задержку дыхания прямо сейчас для рискованного
      выстрела по движущейся цели или приберечь запас легких на критический момент
      прикрытия саботажа.
    input_mapping: 'Тачскрин: удерживание пальца на сенсорной кнопке ''Легкие'' в
      правой нижней зоне экрана; ПК: зажатие клавиши Shift или Пробел.'
    states:
    - 'STATE_NORMAL_BREATHING: свободное прицеливание, естественное покачивание ствола
      (sway ±16 px/s), шкала легких полная (100%).'
    - 'STATE_HOLDING_BREATH: время замедлено на 50% (Time Dilation 0.5x), покачивание
      за 0.25 с снижается до 0 px/s, расход запаса кислорода 25.0%/с.'
    - 'STATE_RECOVERY: плавный выдох, восстановление шкалы легких со скоростью 33.3%/с
      (полный цикл 3.0 с), замедление времени отключается.'
    - 'STATE_HYPERVENTILATION: штрафное состояние при полном исчерпании шкалы (0%),
      хаотическое покачивание ствола ±40 px/s на 2.50 с, запрет на повторную задержку.'
    parameters:
    - name: Максимальное время задержки дыхания
      value: 4.00 с
      tuning_note: Если увеличить до 6.0 с, пропадает напряжение и цена ошибки; если
        снизить до 2.5 с, игрок не успевает рассчитать боковой снос ветром.
    - name: Коэффициент замедления времени (Time Dilation)
      value: 0.50x
      tuning_note: Если сделать 0.2x (слишком медленно), игра превращается в тир для
        детей; если 0.8x, мобильный игрок не успеет среагировать на движение троса.
    - name: Время стабилизации прицельной сетки
      value: 0.25 с
      tuning_note: Если мгновенно (0.0 с), теряется ощущение физического веса винтовки;
        если больше 0.6 с, игрок раздражается задержкой отклика.
    - name: Штрафное время гипервентиляции при срыве
      value: 2.50 с
      tuning_note: 'Критическое наказание: за 2.5 секунды паникующий часовой успевает
        добежать полпути до сирены базы.'
    - name: Скорость восстановления кислорода в легких
      value: 33.3 %/с
      tuning_note: Полное восстановление за 3.0 с формирует ритмичный темп между выстрелами
        без избыточного ожидания.
    feedback_layers:
    - 'Визуал/VFX: Края экрана виньетируются ледяным инеем и темным туннельным эффектом;
      контрастность силуэтов врагов повышается на 20%; уязвимые интерактивные точки
      (тросы, клапаны) подсвечиваются мягким янтарным контуром.'
    - 'Звук (Web Audio): Звук воющей метели срезается низкочастотным фильтром (LPF
      350 Hz); на передний план выходит стереофонический глухой стук пульса (60 BPM,
      ускоряющийся до 110 BPM к концу шкалы).'
    - 'Камера: FOV оптического прицела плавно сужается на 4.0 градуса (эффект оптического
      приближения фокуса сознания); покачивание камеры интерполируется в абсолютный
      ноль по кривой easeOutQuad.'
    - 'UI/Тактильность: Круговой индикатор легких вокруг сетки прицела сжимается с
      белого до тревожно-красного; на мобильных устройствах срабатывает микровибрация
      (haptic pulse 15 ms) на каждый удар виртуального сердца.'
    failure_mode: 'Игрок передерживает кнопку фокуса дольше 4.00 секунд: легкие опустошаются,
      снайпер делает резкий судорожный вдох, прицел резко подбрасывает вверх-вправо
      на ±40 px, а выстрел уходит в молоко, пугая охрану рикошетом от бетона.'
    mastery_curve: Новичок на 30-й секунде жмет фокус хаотично, срывается в гипервентиляцию
      и мажет по встревоженным целям. Эксперт на 10-м контракте включает фокус микроимпульсами
      по 0.8–1.2 секунды строго под прохождение пули через порыв ветра, ликвидируя
      4 цели за 4 выстрела без единой секунды гипервентиляции.
    counterplay: Патрульные периодически останавливаются и меняют темп шага; порывы
      полярного ветра внезапно усиливаются с 4 до 14 м/с, вынуждая игрока удерживать
      фокус дольше и рисковать срывом дыхания.
    synergies:
    - 'Баллистика Mil-Dot: нулевой sway позволяет точно наложить перекрестие с выносом
      на 3.5 мила на трос прожектора.'
    - 'Кинетический саботаж: замедление времени 0.5x дает возможность попасть в падающий
      трос ровно в миллисекундное окно прохода офицера под лампой.'
    - 'Акустическая маскировка: тайминг легких совмещается с таймингом вспышки дизель-генератора.'
    why_unique: В отличие от большинства мобильных снайперов с бесконечной статической
      паузой, здесь фокус — это динамический ресурс с жестким физическим штрафом гипервентиляции,
      заставляющий игрока чувствовать физиологию снайпера в экстремальном холоде.
    pseudocode: "function tick_breath_focus(dt, is_input_pressed, state):\n    if\
      \ is_input_pressed and state.stamina > 0.0 and not state.is_exhausted:\n   \
      \     state.time_scale = 0.50\n        state.stamina = max(0.0, state.stamina\
      \ - 0.25 * dt)\n        state.sway_amount = lerp(state.sway_amount, 0.0, dt\
      \ / 0.25)\n        play_heartbeat_haptic(state.stamina)\n        if state.stamina\
      \ == 0.0:\n            trigger_hyperventilation(state)\n    else:\n        state.time_scale\
      \ = 1.00\n        state.sway_amount = calculate_ambient_sway(state.is_exhausted)\n\
      \        state.stamina = min(1.0, state.stamina + 0.333 * dt)\n        if state.stamina\
      \ >= 0.50: state.is_exhausted = false"
  - name: Кинетический саботаж окружения и цепные аварии
    role_in_loop: Главный источник бестревожной ликвидации и манипуляции маршрутами
      охраны (тактическая головоломка и источник максимальной награды).
    player_decision: Потратить ли патрон на перебивание троса 30-метровой мачты освещения
      для зачистки сразу 2 часовых под ней или устранить их поодиночке выстрелами
      в голову.
    input_mapping: 'Тачскрин / Мышь: наведение перекрестия на подсвеченные интерактивные
      элементы конструкции и одиночный тап/клик выстрела.'
    states:
    - 'STATE_INTACT: объект стабилен (натяжение троса 1200 Н, давление в трубе 16
      бар), подсвечивается при задержке дыхания.'
    - 'STATE_TRIGGERED: пуля попадает в коллидер крепежа (hitbox 0.15 м), включается
      физический рэгдолл и падение Rapier3D.'
    - 'STATE_CASCADING: обрушение конструкции на землю, генерация зоны поражения (радиус
      3.5 м), искры и обрыв электросети.'
    - 'STATE_INSPECTION: враги в радиусе 15.0 м переходят в режим осмотра аварии на
      8.0 с, списывая происшествие на шторм.'
    parameters:
    - name: Радиус поражения падающим прожектором
      value: 3.50 м
      tuning_note: Если увеличить до 6.0 м, головоломка становится тривиальной; если
        уменьшить до 1.5 м, шанс подловить патруль в движении стремится к нулю.
    - name: Время физического падения конструкции
      value: 0.45 с
      tuning_note: 'Задает точный тайминг упреждения: игрок обязан стрелять в трос
        за 0.45 с до входа офицера в зону поражения.'
    - name: Длительность замешательства часовых (Inspection)
      value: 8.00 с
      tuning_note: Идеальное тактическое окно, чтобы спокойно перевести прицел и поразить
        вторую цель со спины.
    - name: Прирост боевой тревоги при несчастном случае
      value: 0.0 %
      tuning_note: 'Ключевое свойство: ликвидация через аварию никогда не активирует
        таймер тревоги базы.'
    - name: Бонус очков контракта за аварию (Accident Bounty)
      value: +250 XP
      tuning_note: Мотивирует игрока искать инженерные решения вместо прямолинейных
        хедшотов.
    feedback_layers:
    - 'Визуал/VFX: Трос лопается со снопом металлических искр и отдачей струны; прожектор
      падает с реалистичной физикой ускорения свободного падения; при ударе о землю
      взрывается лампа, ослепляя сектор и поднимая снежное облако particle-эффектов.'
    - 'Звук (Web Audio): Звонкий визг рвущегося стального троса (сэмпл ''cable_snap.wav''),
      тяжелый металлический грохот удара полутонной рамы о бетон, треск короткого
      замыкания 380V и панический возглас часового в рации: ''Трансформатор накрылся!''.'
    - 'Камера: Микро-импульс сотрясения камеры (Camera Shake с амплитудой 0.35 ед
      на 0.20 с) в момент удара прожектора о землю; динамическое переключение фокуса
      освещения.'
    - 'UI/Тактильность: Всплывающая плашка ''НЕСЧАСТНЫЙ СЛУЧАЙ +100% БОНУС'' золотым
      шрифтом; глубокая тактильная отдача (двойной haptic kick 45 ms).'
    failure_mode: 'Игрок стреляет в трос слишком рано или слишком поздно (ошибка в
      0.45-секундном тайминге падения): лампа падает перед носом патруля, не задев
      его. Враг пугается упавшего объекта, входит в желтую фазу настороженности и
      ускоряет шаг, покидая зону поражения.'
    mastery_curve: Новичок стреляет в людей, накапливает шкалу тревоги и проигрывает
      по таймеру. Эксперт за один выстрел перебивает провод питания, обесточивает
      радарную вышку, вызывает падение подвесного прожектора на двух офицеров и за
      3 секунды решает задачу без единой капли крови на прицеле.
    counterplay: Враги на старших контрактах носят каски, экранирующие случайные осколки,
      а тросы защищены бронированными муфтами, требующими бронебойного патрона 7Н13
      или строго перпендикулярного попадания.
    synergies:
    - 'Двухфазная стелс-детекция: авария сбрасывает накопившуюся желтую шкалу подозрения
      свидетелей в ноль.'
    - 'Задержка дыхания: позволяет с идеальной точностью попасть в тонкий хитбокс
      троса толщиной 15 мм на дистанции 400 метров.'
    - 'Акустическая маскировка: грохот падающей мачты маскирует одновременный выстрел
      в дальнего часового.'
    why_unique: 'Каждый уровень построен не как тир, а как кинетическая машина Голдберга:
      окружение — это главное оружие диверсанта, позволяющее обходить лимит патронов
      и правила стелса.'
    pseudocode: "function on_bullet_hit_hazard(bullet, hazard_object):\n    if hazard_object.type\
      \ == 'STEEL_CABLE' and bullet.damage >= hazard_object.hp:\n        hazard_object.is_severed\
      \ = true\n        play_sound('cable_snap_metal', hazard_object.position)\n \
      \       physics_body = spawn_falling_rigidbody(hazard_object.fixture_prefab)\n\
      \        physics_body.on_impact = function(impact_point):\n            play_impact_effects(impact_point)\n\
      \            targets = find_enemies_in_radius(impact_point, 3.50)\n        \
      \    for enemy in targets: kill_enemy_accident(enemy, 'CRUSHED_BY_LIGHT')\n\
      \            alert_nearby_guards_inspection_only(impact_point, radius=15.0,\
      \ duration=8.0)"
  - name: Двухфазная стелс-детекция ИИ и паника гарнизона
    role_in_loop: Источник постоянного риска, напряжения и жесткий динамический таймер
      ошибки игрока.
    player_decision: Устранить ли мгновенно встревоженного часового, заметившего труп,
      или рискнуть и перевести ствол на VIP-цель, пока таймер тревоги тикает.
    input_mapping: Пассивное отслеживание маркеров над головами ботов; при панике
      — экстренное наведение и выстрел на опережение бегущей цели.
    states:
    - 'STATE_UNAWARE: регулярное патрулирование по заданному маршруту (скорость 1.4
      м/с), конус зрения 75 градусов на 45 метров.'
    - 'STATE_SUSPICIOUS: обнаружено тело/подозрительный шум, маркер желтеет и заполняется
      от 0 до 100% за 1.80 с, бот замирает на месте.'
    - 'STATE_PANIC_SPRINT: маркер загорается красным, бот кричит и совершает 5.00-секундный
      спринт (скорость 5.20 м/с) к рубильнику тревоги.'
    - 'STATE_ALARM_TRIGGERED: сирена базы активирована, прожекторные вышки светят
      на снайперскую позицию, контракт провален.'
    parameters:
    - name: Время заполнения шкалы подозрения (Suspicion Time)
      value: 1.80 с
      tuning_note: 'Окно реакции игрока: если уменьшить до 0.8 с, мобильный игрок
        не успеет среагировать; если увеличить до 3.0 с, стелс теряет остроту.'
    - name: Таймер панического спринта до кнопки тревоги
      value: 5.00 с
      tuning_note: 'Жесткий дедлайн: дает ровно один шанс произвести сложный выстрел
        по быстро бегущей мишени с упреждением.'
    - name: Скорость панического спринта часового
      value: 5.20 м/с
      tuning_note: Высокая скорость требует точного расчета упреждения (вынос перекрестия
        на 2–3 мила вперед по курсу бега).
    - name: Дальность обзора часового в ясную погоду
      value: 45.0 м
      tuning_note: Определяет безопасные расстояния между часовыми при планировании
        порядка ликвидации.
    - name: Снижение дальности обзора во время полярной метели
      value: -50.0 %
      tuning_note: Позволяет игроку использовать плохую погоду как естественное тактическое
        укрытие.
    feedback_layers:
    - 'Визуал/VFX: Над головой ИИ разворачивается круговой HUD-индикатор: плавное
      заполнение желтым цветом (0–100%), сменяющееся пульсирующим красным восклицательным
      знаком; траектория бега часового подсвечивается красной пунктирной линией паники.'
    - 'Звук (Web Audio): При подозрении — нарастающий диссонирующий синтезаторный
      тон (глухое глиссандо 200–600 Гц); при панике — крик часового в рацию ''У нас
      двухсотый, врубаю тревогу!'' и нарастающий пульс сирены.'
    - 'Камера: При активации красной фазы камера получает легкий динамический Zoom-in
      (+5% масштаба) в сторону бегущего радиста, привлекая периферийное внимание игрока.'
    - 'UI/Тактильность: В центре экрана появляется 5-секундный таймер обратного отсчета
      красного цвета; частая пульсирующая вибрация (30 ms каждые 0.5 с).'
    failure_mode: 'Игрок не замечает, что убитый часовой упал в конус зрения напарника:
      свидетель за 1.8 с заполняет шкалу подозрения, срывается в бег и за 5.0 секунд
      нажимает тревожный рубильник на стене КПП — звучит общая сирена, контракт аннулирован.'
    mastery_curve: Новичок в панике мажет по бегущему солдату из-за отсутствия упреждения
      и проигрывает миссию. Мастер заранее рассчитывает векторы падения тел за укрытия,
      а в случае непредвиденного паникера хладнокровно делает вынос на 2.5 мила по
      ходу движения и поражает цель в шею за 0.8 с до тревоги.
    counterplay: Враги перемещаются парами спина-к-спине (Cross-Watch Patrols), а
      офицеры гарнизона носят персональные радиостанции, сокращающие время передачи
      сигнала тревоги до 3.5 секунд.
    synergies:
    - 'Задержка дыхания: критически необходима для поражения быстро бегущего со скоростью
      5.2 м/с радиста.'
    - 'Баллистика Mil-Dot: требует мгновенного ввода бокового упреждения на бег врага
      и ветер.'
    - 'Кинетический саботаж: позволяет отвлечь патруль до того, как они дойдут до
      лежащего тела.'
    why_unique: 'В отличие от большинства мобильных шутеров с бинарным агро (''увидел
      — сразу стреляет в игрока''), здесь ИИ ведет себя органично: бежит спасать базу
      через рубильник, давая игроку кинематографичный шанс на ''выстрел последней
      секунды''.'
    pseudocode: "function tick_ai_stealth(ai_bot, dt, world_state):\n    target_body\
      \ = scan_for_corpses(ai_bot, ai_bot.vision_cone * world_state.weather_visibility_mod)\n\
      \    if target_body != null and ai_bot.state == 'UNAWARE':\n        ai_bot.suspicion\
      \ += (dt / 1.80)\n        if ai_bot.suspicion >= 1.0:\n            ai_bot.state\
      \ = 'PANIC_SPRINT'\n            ai_bot.alarm_timer = 5.00\n            play_voice_line(ai_bot,\
      \ 'CORPSE_FOUND_ALARM')\n    if ai_bot.state == 'PANIC_SPRINT':\n        move_towards(ai_bot,\
      \ world_state.alarm_switch_pos, speed=5.20 * dt)\n        ai_bot.alarm_timer\
      \ -= dt\n        if ai_bot.alarm_timer <= 0.0 or distance_to(ai_bot, world_state.alarm_switch_pos)\
      \ < 1.0:\n            trigger_base_alarm_failure()"
  - name: Баллистика Mil-Dot, снос метелью и упреждение звукового барьера
    role_in_loop: Главный двигатель мастерства и физический калькулятор каждого выстрела.
    player_decision: Какую точку прицельной сетки совместить с головой врага с учетом
      дистанции 420 м, падения пули на 3.1 мила вниз и сноса ветром на 2.8 мила вправо.
    input_mapping: 'Тачскрин: плавный свайп пальцем для прецизионного наведения сетки;
      ПК: движение мыши с пониженным DPI при приближении.'
    states:
    - 'STATE_CALCULATION: игрок считывает дальномер, порывы снега и флюгеры, определяя
      поправки по сетке Mil-Dot.'
    - 'STATE_FIRING: нажатие спуска, спавн пули как физического рейкаст/сферического
      тела с начальной скоростью v0 = 850 м/с.'
    - 'STATE_FLIGHT: баллистическая симуляция полета (0.35–0.70 с) с гравитацией g
      = 9.81 м/с² и вектором сноса ветра.'
    - 'STATE_HIT_RESOLVE: проверка зоны попадания анатомического манекена (Голова
      x4.0 / Шея x3.0 / Торс x1.0 / Конечности x0.5).'
    parameters:
    - name: Начальная скорость пули (7.62x54mmR 7Н1)
      value: 850.0 м/с
      tuning_note: Если увеличить до 1500 м/с, стрельба превратится в аркадный луч;
        если снизить до 400 м/с, пуля будет лететь нереалистично долго.
    - name: Диапазон силы полярного ветра
      value: 0.0–14.0 м/с
      tuning_note: Динамический ветер заставляет игрока постоянно пересчитывать поправку
        прямо во время прицеливания.
    - name: Цена деления сетки Mil-Dot на 400 м дистанции
      value: 0.40 м/мил
      tuning_note: 'Классическая математика оптики: 1 мил = 1/1000 дистанции. Соответствует
        реальной армейской снайперской науке.'
    - name: Множитель урона при попадании в шею/лицо
      value: x3.0
      tuning_note: Гарантирует мгновенную тихую нейтрализацию даже целей в тяжелых
        титановых шлемах 4-го класса.
    - name: Радиус предсмертного стона при ранении в корпус
      value: 8.00 м
      tuning_note: Выстрел в корпус не убивает мгновенно, жертва стонет и выдает позицию
        ближайшим часовым.
    feedback_layers:
    - 'Визуал/VFX: Трассер пули оставляет закручивающийся конденсационный вихревой
      след в морозном воздухе; при попадании в голову — сочный сноп брызг и резкий
      отброс рэгдолла назад; при промахе — фонтанчик снега и осколков бетона в точке
      импакта.'
    - 'Звук (Web Audio): Сухой резкий хлопок сверхзвукового выстрела у дульного среза,
      нарастающий свист рассекаемого воздуха в полете пули, глухой мясной ''шлепок''
      при попадании в мягкие ткани (сэмпл ''flesh_hit.wav'') или звонкий рикошет о
      металл.'
    - 'Камера: Оптический прицел подбрасывает вверх-вправо на 1.8 градуса отдачей
      (Recoil Impulse) с плавным возвратом за 0.40 с; при финальном убийстве контракта
      включается слоу-мо Bullet-Cam слежения за пулей.'
    - 'UI/Тактильность: На сетке Mil-Dot загорается тонкий золотой маркер попадания
      (Hitmarker); на мобильном устройстве срабатывает хлесткий тактильный щелчок
      выстрела (Haptic Heavy Click 60 ms).'
    failure_mode: 'Игрок не учитывает боковой ветер 10 м/с и стреляет точно в перекрестие:
      пуля сносится на 1.8 метра в сторону, выбивает искры из бетонной стены за спиной
      часового, враг вздрагивает, оборачивается и мгновенно активирует тревогу.'
    mastery_curve: Новичок целится 'в крест' и не понимает, почему пули падают под
      ноги врагам. Опытный стрелок мгновенно считывает дальномер (450 м = 3 мила вниз)
      и дым из трубы (ветер 8 м/с вправо = 3.2 мила влево), производя смертоносный
      выстрел за 1.5 секунды навскидку.
    counterplay: Сильные порывы метели меняют направление ветра каждые 8–12 секунд,
      а цели периодически останавливаются за пуленепробиваемыми стеклами постов, требуя
      бронебойных боеприпасов.
    synergies:
    - 'Задержка дыхания: фиксирует прицел в расчетной точке сетки Mil-Dot.'
    - 'Акустическая маскировка: позволяет применить мощный неглушеный патрон .338
      LM с высокой настильностью без риска быть услышанным.'
    - 'Кинетический саботаж: позволяет с 500 метров поразить миниатюрную защелку троса
      диаметром всего 10 см.'
    why_unique: Честная физическая баллистика с реальной угловой сеткой Mil-Dot и
      динамическим полярным ветром, адаптированная под интуитивное сенсорное и мышечное
      управление без лишней духоты.
    pseudocode: "function simulate_bullet_trajectory(origin, direction, v0, wind_vec,\
      \ dt):\n    pos = origin\n    vel = direction * v0\n    while bullet_is_alive:\n\
      \        vel.y -= 9.81 * dt\n        vel.x += wind_vec.x * 0.12 * dt\n     \
      \   vel.z += wind_vec.z * 0.12 * dt\n        new_pos = pos + vel * dt\n    \
      \    hit = raycast_check(pos, new_pos)\n        if hit:\n            resolve_ballistic_hit(hit,\
      \ vel)\n            break\n        pos = new_pos"
  - name: Контрактная акустическая маскировка и тайминг грома
    role_in_loop: Источник тактических окон возможности для применения мощного крупнокалиберного
      оружия.
    player_decision: Ждать ли 6.0 секунд следующего раската грома/вспышки дизеля базы,
      чтобы сделать мощный выстрел из бронебойной винтовки, или использовать тихий,
      но слабый 'Винторез'.
    input_mapping: Акустический мониторинг через верхнюю шкалу HUD (Noise Masking
      Bar) и тайминг выстрела в момент зеленой зоны индикатора.
    states:
    - 'STATE_SILENT_AMBIENT: фоновый шум ветра (30 дБ), выстрел из громкого оружия
      слышен на 120.0 м вокруг.'
    - 'STATE_MASKING_BUILDUP: нарастание внешнего звука (гул дизеля / приближение
      громового фронта), индикатор заполняется желтым.'
    - 'STATE_MASKING_ACTIVE: зеленое окно акустической маскировки (длительность 1.40
      с), внешнее звуковое давление 110 дБ, радиус слышимости выстрела падает до 0.0
      м.'
    - 'STATE_COOLDOWN: спад внешнего шума, возврат к стандартной акустической обстановке
      на 6.0–18.0 с.'
    parameters:
    - name: Длительность активного окна громовой маскировки
      value: 1.40 с
      tuning_note: Если увеличить до 3.0 с, теряется напряжение ритм-тайминга; если
        сделать меньше 0.6 с, мобильный игрок не успеет нажать спуск.
    - name: Подавление акустической заметности выстрела в окне
      value: -100.0 %
      tuning_note: Позволяет стрелять из крупного калибра .50 BMG в упор к гарнизону
        без малейшей реакции часовых.
    - name: Интервал между циклами природного грома метели
      value: 18.0 с
      tuning_note: Задает размеренный тактический темп для планирования серии выстрелов.
    - name: Интервал вспышек выхлопа базы (дизель-генератор)
      value: 6.0 с
      tuning_note: Быстрое, но короткое окно маскировки (0.8 с) для динамичной быстрой
        стрельбы.
    - name: Базовый радиус обнаружения неглушеного выстрела
      value: 120.0 м
      tuning_note: Выстрел вне окна маскировки мгновенно поднимает на ноги весь сектор
        базы.
    feedback_layers:
    - 'Визуал/VFX: В верхней части экрана спектральный анализатор шума (Аудио-эквалайзер)
      пульсирует зелеными волнами; в момент пика грома экран на 0.15 с озаряется ветвистой
      вспышкой полярной зарницы.'
    - 'Звук (Web Audio): Нарастающий низкий гул приближающегося громового удара (Sub-bass
      45 Hz), переходящий в оглушительный треск раската грома (115 dB SPL), полностью
      поглощающий звук винтовочного выстрела.'
    - 'Камера: Легкая ритмичная вибрация камеры (rumble effect) при работе тяжелого
      дизель-генератора базы.'
    - 'UI/Тактильность: Индикатор маскировки в HUD вспыхивает неоново-зеленым щитом
      ''ЗВУК ЗАМАСКИРОВАН''; тактильный виброотклик подтверждает идеальное попадание
      в тайминг окна.'
    failure_mode: 'Игрок не выдерживает напряжения и спускает курок за 0.3 секунды
      до удара грома: громкий выстрел разносится эхом по всему ущелью, радиус тревоги
      120 метров охватывает весь гарнизон, все часовые переходят в режим боевой тревоги.'
    mastery_curve: Новичок стреляет невпопад, пугает базу и не понимает назначения
      шкалы шума. Профессионал слушает ритм дизеля, отсчитывает 6-секундный цикл и
      методично снимает бронированные цели крупным калибром строго в пиковые миллисекунды
      грохота.
    counterplay: Порывы ветра могут глушить дизель-генератор, временно отключая короткие
      окна маскировки и вынуждая ждать редкого раската грозы.
    synergies:
    - 'Баллистика Mil-Dot: позволяет без опаски использовать тяжелые патроны с максимальной
      настильностью.'
    - 'Задержка дыхания: игрок выходит на задержку дыхания заранее, удерживая легкие
      ровно до момента открытия зеленого акустического окна.'
    - 'Двухфазная детекция: даже если враг упадет на глазах у напарника, звук выстрела
      не выдаст позицию снайпера.'
    why_unique: 'Интеграция ритм-механики в тактический снайпинг: звук окружения становится
      союзником снайпера, превращая стрельбу в синхронизированное с природой искусство
      диверсии.'
    pseudocode: "function tick_acoustic_masking(world_audio, dt):\n    world_audio.timer\
      \ += dt\n    mask_level = calculate_ambient_noise_level(world_audio.timer)\n\
      \    is_masked = mask_level >= 0.85\n    update_masking_hud_bar(mask_level,\
      \ is_masked)\n    return is_masked\n\nfunction on_weapon_fired(gun, is_masked):\n\
      \    if not is_masked and not gun.has_silencer:\n        emit_sound_stimulus(gun.muzzle_pos,\
      \ radius=120.0, alert_level='FULL_ALERT')\n    else:\n        emit_sound_stimulus(gun.muzzle_pos,\
      \ radius=0.0, alert_level='NONE')"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 75
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - description: Three.js WebGLRenderer с поддержкой теней ShadowMap, пост-процессингом
      оптического прицела, шейдером метели и системой инстансинга снежинок.
    name: Rendering Layer
  - description: Rapier3D WASM для рэгдоллов врагов, динамических разрушаемых кабелей
      и прожекторов; отдельный математический модуль баллистики пули.
    name: Physics & Ballistics Layer
  - description: Машина состояний противников (FSM), система расчета конусов зрения
      Raycast, менеджер тайминга тревоги и цепных реакций.
    name: Gameplay & AI Layer
  - description: DOM/Canvas оверлей оптической сетки Mil-Dot, обработчики Touch/Mouse
      жестов, экранные виджеты задержки дыхания и таймера.
    name: UI & Input Layer
  - description: Playgama Bridge SDK для облачных сохранений прогресса, интерстициальной
      и rewarded рекламы, лидербордов.
    name: Platform & Save Layer
  modules:
  - file: src/systems/ScopeSystem.ts
    name: ScopeSystem
    purpose: Рендеринг оптического зума, шейдера линзы, эффекта виньетирования и дрейфа
      прицела.
  - file: src/systems/BallisticsSystem.ts
    name: BallisticsSystem
    purpose: Расчет траектории полета пули, хитбоксов урона и триггеров Kill-Cam.
  - file: src/systems/StealthAISystem.ts
    name: StealthAISystem
    purpose: Логика патрулей, зрение ИИ, поиск тел и эскалация тревоги базы.
  - file: src/systems/HazardEnvironmentSystem.ts
    name: HazardEnvironmentSystem
    purpose: Обработка разрушаемых объектов окружения, падения прожекторов и цепных
      реакций.
  - file: src/managers/ContractManager.ts
    name: ContractManager
    purpose: Учет целей контракта, подсчет очков, победа/поражение, интеграция с Playgama
      SDK.
monetization:
  strategy_summary: Мягкая гибридная модель (Rewarded Ads + ненавязчивый Interstitial
    + косметические IAP), ориентированная на высокий комфорт игрока без пейволлов
    энергии и без пейтувина.
  rewarded_placements:
  - id: rewind_alarm
    name: Тактическая Перемотка Времени
    benefit: Откат времени на 5 секунд назад при поднятии тревоги (второй шанс спасти
      контракт без перезапуска).
    cooldown_or_limit: 1 раз за контракт
    trigger_moment: Экран срабатывания тревоги базы
  - id: double_contract_payout
    name: Двойной Гонорар Контракта
    benefit: Удвоение всех полученных за успешную миссию кредитов и очков репутации.
    cooldown_or_limit: После каждого успешного контракта
    trigger_moment: Экран победы и дебрифинга
  - id: special_ammo_crate
    name: Ящик Спецбоеприпасов
    benefit: Получение 3 бронебойно-зажигательных патронов с увеличенным радиусом
      взрыва на текущий контракт.
    cooldown_or_limit: 1 раз в 10 минут
    trigger_moment: Экран подготовки к контракту
  interstitial_placements:
  - trigger_event: contract_completed_or_failed
    cooldown_seconds: 90
    conditions: Показывается только между контрактами при переходе в оружейную, не
      чаще 1 раза в 90 секунд; никогда не прерывает геймплей внутри миссии.
  in_app_purchases:
  - sku: bundle_arctic_ghost
    name: Набор «Полярный Призрак»
    description: Крупнокалиберная винтовка Barrett M82 в арктическом камуфляже + Тепловизионный
      прицел FLIR + 5000 кредитов.
    price_tier: Tier 3 ($2.99 / 249 руб)
    reward: Винтовка Barrett M82 Arctic + FLIR Thermal Scope + 5000 кредитов
  - sku: no_ads_pass
    name: Тактический Пропуск (Отключение Рекламы)
    description: Полное отключение межстраничной рекламы навсегда + постоянный бонус
      +20% к гонорарам контрактов.
    price_tier: Tier 2 ($1.99 / 179 руб)
    reward: Отключение межстраничных баннеров + 1.2x множитель кредитов
  fairness_rules:
  - Все снайперские винтовки и прицелы можно открыть исключительно за игровое мастерство
    и контракты.
  - Реклама ни при каких условиях не прерывает процесс прицеливания и выстрела.
  - Награда за просмотр rewarded video выдается гарантированно и мгновенно.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - gamepix
  - web
  initialization_flow:
  - Инициализация Playgama Bridge при загрузке страницы (bridge.initialize()).
  - Определение типа устройства (платформа мобильная / ПК) для адаптации схемы управления.
  - Загрузка сохраненного прогресса из облака (bridge.storage.get()).
  - Скрытие нативного загрузочного экрана и показ меню брифинга.
  cloud_save_keys:
  - player_credits
  - unlocked_rifles
  - unlocked_scopes
  - completed_contracts_mask
  - high_scores_table
  - settings_sound_sensitivity
  leaderboards:
  - global_stealth_score
  - contracts_completed_count
  ads_integration:
    banner_enabled: false
    interstitial_enabled: true
    preload_rewarded: true
    rewarded_enabled: true
  lifecycle_hooks:
  - 'onPause: автоматическая постановка физики и таймеров на паузу при сворачивании
    вкладки.'
  - 'onResume: возобновление аудиоконтекста Howler.js и рендеринга Three.js.'
  - 'onAdOpen: отключение звука игры на время просмотра рекламного ролика.'
  - 'onAdClose: мгновенное включение звука и выдача награды.'
art:
  style_name: Стилизованный кинематографичный милитари-реализм (Modern Warfare Aesthetic)
  camera_perspective: First-Person Sniper Scope POV (Вид от первого лица сквозь оптический
    прицел)
  camera_fov: 45
  camera_pitch_angle: 10
  environment_theme: 'Секретная заснеженная радиолокационная база в заполярных горах:
    бетонные бункеры, радары, мачты связи, патрульные вышки и кружащая метель.'
  character_proportions: Реалистичные анатомические пропорции бойцов в зимней штурмовой
    экипировке, меховых капюшонах и бронежилетах.
  lighting_setup: 'Контрастное ночное освещение: холодный лунный свет индиго (DirectionalLight
    0.3) в сочетании с яркими желто-оранжевыми конусами патрульных прожекторов (SpotLight
    с динамическими тенями).'
  color_palette:
    alert_danger_red: '#e63946'
    arctic_snow: '#d8e2dc'
    concrete_military: '#2b2d42'
    primary_night_sky: '#0a1128'
    scope_tritium_green: '#38b000'
    spotlight_amber: '#ffb703'
  vfx_list:
  - Инстансинг 1500 частиц снега и метели с динамическим сносом по ветру
  - Шейдер оптического прицела с запотеванием краев линзы и тритиевой сеткой
  - Сноп трассирующих искр и клубы дыма при разрыве силового кабеля
  - Эффект замедления времени (Time Dilation Chromatic Aberration)
  - Трассер пули с воздушным тепловым следом (Heat Distortion Ribbon)
  - Вспышка дульного пламени с дымным кольцом из глушителя
  ui_theme: 'Армейский тактический интерфейс в стиле Modern Warfare: моноширинные
    шрифты, матовые полупрозрачные темные плашки, неоново-зеленые и янтарные акценты.'
  menu_staging: 'Главное меню: снайперская винтовка крупным планом на заснеженном
    ящике с боеприпасами в лучах контрового света под звуки ветра.'
ui_ux:
  hud_elements:
  - Круглая маска оптического прицела с затемнением периферии и шкалой Mil-Dot
  - Сегментированная дуговая шкала запаса воздуха (Breath Meter)
  - Индикатор текущей кратности зума (4x / 8x / 16x)
  - Мини-индикатор бокового ветра (скорость в м/с и стрелка направления)
  - 'Список целей контракта в правом верхнем углу (аватар, имя, статус: ЖИВ / УСТРАНЕН)'
  - Таймер обратного отсчета до тревоги (появляется только при обнаружении)
  screens:
  - id: briefing_screen
    desc: 'Тактическая карта базы, досье на цели, выбор оружия и кнопка «НАЧАТЬ ОПЕРАЦИЮ».;
      name: Экран Брифинга Контракта'
    composition: 'Три зоны: чем экран себя называет, единственное главное действие,
      второстепенный ряд одним весом. Меню лежит поверх живой сцены.'
    primary_action: ''
  - id: gameplay_hud
    desc: 'Минималистичный интерфейс стрельбы с фокусом на перекрестии и индикаторах
      дыхания.; name: Игровой HUD Прицела'
    composition: 'Три зоны: чем экран себя называет, единственное главное действие,
      второстепенный ряд одним весом. Меню лежит поверх живой сцены.'
    primary_action: ''
  - id: debriefing_win
    desc: 'Детализация выплат за скрытность, кнопка удвоения за рекламу и переход
      в оружейную.; name: Экран Завершения Контракта'
    composition: 'Три зоны: чем экран себя называет, единственное главное действие,
      второстепенный ряд одним весом. Меню лежит поверх живой сцены.'
    primary_action: ''
  - id: arsenal_screen
    desc: '3D-просмотр винтовок, установка оптических прицелов, глушителей и покупка
      патронов.; name: Оружейная Мастерская'
    composition: 'Три зоны: чем экран себя называет, единственное главное действие,
      второстепенный ряд одним весом. Меню лежит поверх живой сцены.'
    primary_action: ''
  mobile_controls_layout: Правая рука (свайп по правой половине экрана) — свободное
    плавное наведение прицела; Левая рука (кнопка в левом нижнем углу) — удержание
    задержки дыхания; Правый край (крупная кнопка спуска) — выстрел; Правая верхняя
    зона — переключение зума.
  keyboard_controls:
    Escape / P: Пауза / Меню настроек
    Left Mouse Button: Выстрел
    Mouse Move: Наведение прицельной сетки
    Mouse Wheel / 1-3: Изменение кратности оптического зума
    R: Перезарядка затвора
    Shift / Space: Задержка дыхания (замедление времени)
  touch_controls:
    Fire Trigger Button: Произвести выстрел
    Left Bottom Hold Button: Задержка дыхания (Slow-Mo + Стабилизация)
    Right Half Drag: Плавное наведение перекрестия
    Zoom Toggle Icons: Быстрое переключение 4x / 8x / 16x
  wireframes_ascii: '+-------------------------------------------------------------------------+

    | [=] ЦЕЛИ: 3/4  [!] ВЕТЕР: 3.2 м/с ->                   ВРЕМЯ: 01:14     |

    |                                                                         |

    |                         /=============\                                 |

    |                       /   .     |     . \                               |

    |                      /    .     |     .  \                              |

    |                     |  ---+-----+-----+--- |                            |

    |                     |     .     |     .    |   (O) ЗУМ: 8x                  |

    |                      \    .     |     .   /                                 |

    |                       \   .     |     .  /     [ * ] СПУСК               |

    |                         \=============//                                |

    |                           ( ДЫХАНИЕ )                                   |

    | [ ДЕРЖАТЬ ДЫХАНИЕ ]       |||||||||||               [ 5/7 ПАТРОНОВ ]     |

    +-------------------------------------------------------------------------+'
  visual_language: 'Холодный высокотехнологичный милитари-интерфейс: темное стекло,
    приглушенный сине-стальной фон, контрастный зеленый тритиевый свет и аварийный
    оранжево-красный сигнал тревоги.'
  accent_roles:
    alert_danger: '#e63946'
    hud_neutral: '#d8e2dc'
    interactive_hazard: '#ffb703'
    positive_stealth: '#38b000'
  typography: Chakra Petch / Rajdhani — четкие военные рубленые шрифты с отличной
    читаемостью цифр.
  components:
  - ScopeVignetteOverlay
  - BreathHoldBar
  - TargetStatusCard
  - WindDirectionWidget
  - AlertCountdownBanner
  hud_anchors:
    bottom_left: BreathHoldTouchZone
    bottom_right: FireButtonAndAmmoCounter
    center: ScopeCrosshairAndVignette
    top_left: TargetObjectivesList
    top_right: WindAndTimerWidget
  screen_flow: Загрузка -> Главное меню -> Брифинг контракта -> Геймплей (Выцеливание/Слоу-мо/Выстрел)
    -> Kill-Cam финальной цели -> Дебрифинг контракта -> Оружейная -> Следующий контракт.
  feedback_moments:
  - Прикосновение к кнопке дыхания -> мгновенный глухой звук пульса и визуальное размытие
    краев экрана
  - Нажатие на спуск -> яркая вспышка, сотрясение прицела вверх, выброс гильзы со
    звоном
  - Попадание в цель -> хруст попадания, кинематический отлет тела и появление маркера
    'ХИТ'
  - Срабатывание тревоги -> пульсирующий красный свет по краям экрана и нарастающий
    вой сирены
  diegetic_elements:
  - Физическая сетка Mil-Dot, выгравированная на стекле оптической линзы
  - Запотевание и капли конденсата по контуру окуляра при тяжелом дыхании
  - Флажки и дым из труб на зданиях базы, показывающие реальное направление ветра
  state_coverage:
  - Состояние идеального стелса (чистый зеленый HUD, спокойная музыка ветра)
  - Состояние подозрения (желтые маркеры над ботами, затухание эмбиента)
  - Состояние критической тревоги (красный мигающий баннер обратного отсчета)
  - Состояние паузы (затемнение с тактической картой и настройками чувствительности)
mobile:
  orientation: landscape
  touch_implementation: 'Раздельная схема управления под два больших пальца: правая
    зона экрана отведена под мультитач-свайп для наведения перекрестия с плавной фильтрацией
    рывков пальца (exponential smoothing), левая зона — большая кнопка задержки дыхания.
    Отдельная плавающая кнопка выстрела справа.'
  safe_area_handling: Динамические отступы (CSS env(safe-area-inset-*)) для предотвращения
    перекрытия прицела и кнопок вырезом камеры и закругленными углами современных
    смартфонов.
  performance_throttling:
  - 'Динамическое масштабирование разрешения (DPR clamp: 1.0 на слабых GPU, 1.5 на
    средних/мощных)'
  - Снижение количества снежных частиц с 1500 до 600 при просадке FPS ниже 50
  - Отключение динамических теней от точечных источников света на мобильных устройствах
    низкого профиля
  - Ограничение одновременных активных рэгдолл-тел до 3 (остальные засыпают в статику)
audio:
  ambient_tracks:
  - 'Звуковой ландшафт полярной метели: завывание ветра в металлических конструкциях
    вышек'
  - Напряженный тактический синт-эмбиент в стиле Modern Warfare Stealth Ops
  mix_rules: При задержке дыхания громкость фоновой метели плавно приглушается на
    70%, а громкость ударов сердца и щелчка спуска поднимается на передний план.
  sound_effects:
  - Глухой хлопок снайперского выстрела с глушителем и эхо в горах
  - Звонкий металлический щелчок продольно-скользящего затвора при досылании патрона
  - 'Звук замедления времени: низкочастотный фильтр (Low-Pass Filter) и ритмичный
    стук сердца снайпера'
  - Звук разрыва троса прожектора со снопом электрических искр
  - Глухой удар падающего тела о снег и скрежет металла
  - Сигнал боевой тревоги военной базы (тревожная сирена)
qa:
  functional_tests:
  - Проверка точности попадания Raycast по хитбоксам головы, туловища и конечностей
    на дистанциях 200–600 м.
  - Проверка корректности работы 5-секундного таймера тревоги при обнаружении тела
    патрульным.
  - Проверка физического отрыва подвесного прожектора и нанесения урона целям в радиусе
    3.5 м.
  - Проверка расхода и восстановления шкалы задержки дыхания со слоу-мо 0.5x.
  - Проверка сохранения прогресса и кредитов в Playgama Cloud Storage.
  performance_benchmarks:
  - Стабильные 60 FPS на iPhone 11 / Samsung Galaxy A52 в ландшафтном режиме.
  - Количество Draw Calls не превышает 75 во всех ракурсах оптического прицела.
  - Общее число полигонов на сцене не превышает 45 000 треугольников.
  - Время начальной загрузки страницы до интерактивного кадра — менее 2.5 секунд.
  cross_browser_matrix:
  - Chrome 120+ (Desktop & Android)
  - Safari 16+ (iOS 16+ & macOS)
  - Firefox 120+ (Desktop)
  - Yandex Browser (Desktop & Mobile)
  common_bug_checklist:
  - Залипание задержки дыхания при одновременном отпускании пальца и потере фокуса
    окна
  - Двойной учет урона при одновременном падении прожектора и попадании пули
  - Застревание рэгдолл-конечностей врагов в геометрии перил вышки
  - Рассинхронизация звука выстрела и анимации гильзы при включенном замедлении времени
roadmap:
- phase_number: 1
  title: Прототип оптики, баллистики и задержки дыхания
  duration_days: 2
  tasks:
  - Настройка сцены Three.js с полярным окружением и освещением прожекторов
  - Создание шейдера оптического прицела Mil-Dot с виньетированием и зумом
  - Реализация механики задержки дыхания со слоу-мо 0.5x и стабилизацией прицела
  - Интеграция Rapier3D для попаданий пуль и рэгдолл-падений манекенов
  milestone_deliverable: Играбельный прототип снайперской стрельбы с тактильным ощущением
    выстрела и слоу-мо.
- phase_number: 2
  title: Стелс-ИИ и интерактивные аварии окружения
  duration_days: 2
  tasks:
  - Разработка конусов зрения и слуха патрульных ИИ с машиной состояний (FSM)
  - Реализация обнаружения тел и 5-секундного таймера тревоги до сирены
  - 'Создание разрушаемых объектов: подвесных прожекторов, кабелей и бочек'
  - Настройка логики несчастных случаев без объявления тревоги
  milestone_deliverable: Полноценный уровень-головоломка со стелс-патрулями и физическими
    цепными реакциями.
- phase_number: 3
  title: Контент, Арсенал и Интеграция Playgama SDK
  duration_days: 2
  tasks:
  - Создание 12 контрактов с нарастающей сложностью и сменой погоды (метель)
  - Разработка меню оружейной мастерской с 6 винтовками и 5 типами оптики
  - 'Подключение Playgama Bridge: сохранение прогресса, лидерборды, реклама'
  - Реализация кинематографичной камеры Kill-Cam на финальной цели
  milestone_deliverable: Завершенная игра со сквозной прогрессией, арсеналом и рабочей
    экономикой.
- phase_number: 4
  title: Полировка, Звук, Мобильная Оптимизация и Релиз
  duration_days: 1
  tasks:
  - Настройка Web Audio API (Howler.js), затухания звука при слоу-мо и сердцебиения
  - Оптимизация производительности под 60 FPS на мобильных устройствах
  - Тестирование Safe Area, адаптации touch-контролов и кроссбраузерный QA
  - Подготовка финального билда и публикация в каталогах игр
  milestone_deliverable: Релизный билд коммерческого качества, готовый к публикации
    на платформе Yandex Games.
risks:
- risk: Слишком высокая сложность попадания на смартфонах при малейшем дрожании пальца
  category: design
  severity: Medium
  mitigation: Внедрение экспоненциального сглаживания ввода touch-свайпа, расширение
    хитбоксов уязвимых зон (головы) на 15% на тачскринах и полная стабилизация при
    задержке дыхания.
- risk: Просадка производительности Three.js из-за системы частиц метели и расчетов
    видимости ИИ
  category: technical
  severity: Medium
  mitigation: Использование InstancedMesh для снежинок, ограничение частоты Raycast-проверок
    зрения ИИ до 10 Гц вместо каждого кадра и клэмп разрешения рендера (DPR).
- risk: Игрок может игнорировать ловушки окружения и просто быстро отстреливать всех
    в голову
  category: design
  severity: Low
  mitigation: Введение бронированных касок на старших уровнях, рикошетирующих прямые
    пули, и спаренных патрулей, требующих одновременного устранения через прожекторы.
skills:
- skill_id: playgama_bridge_integration
  name: Playgama Bridge Integration Skill
  filename: skills/playgama_bridge.md
  purpose: Обеспечение бесшовной интеграции с Playgama SDK для сохранения прогресса,
    монетизации и лидербордов.
  when_to_use: При настройке платформенного слоя, сохранения оружия и показа рекламы
    между контрактами.
  rules:
  - Никогда не вызывать рекламу во время активного прицеливания игрока.
  - Всегда обрабатывать ошибки инициализации SDK с бесшовным фоллбэком на LocalStorage.
  architecture: PlatformManager -> PlaygamaBridgeWrapper -> Storage & Ads Modules.
  implementation_guidance: Инициализировать SDK до рендера 3D-сцены, синхронизировать
    кредиты после каждого успешного контракта.
  common_mistakes:
  - Вызов рекламы без проверки cooldown
  - Блокировка UI при медленном ответе рекламного сервера
  checklist:
  - Проверены rewarded ads
  - Проверено сохранение прогресса
  - Проверена пауза звука
  knowledge_refs:
  - knowledge/platform/playgama.md
- skill_id: threejs_sniper_scope_shaders
  name: Three.js Sniper Scope & Optics Shader Skill
  filename: skills/threejs_sniper_scope.md
  purpose: Создание кинематографичного шейдера оптического прицела с виньетированием,
    искажением линзы и сеткой Mil-Dot.
  when_to_use: При разработке системы камеры от первого лица и эффектов задержки дыхания.
  rules:
  - Использовать единый полноэкранный проход шейдера для минимизации оверхенда GPU.
  - Сетка Mil-Dot должна масштабироваться процедурно в шейдере без потери резкости.
  architecture: PostProcessingPass -> ScopeShaderMaterial -> Vignette & Reticle Uniforms.
  implementation_guidance: Передавать фактор задержки дыхания в униформу шейдера для
    плавного изменения хроматической аберрации.
  common_mistakes:
  - Использование тяжелых текстурных масок вместо математических шейдерных функций
  checklist:
  - 60 FPS на мобильных устройствах
  - Отсутствие артефактов на экранах с разным соотношением сторон
  knowledge_refs:
  - knowledge/rendering/scope_shaders.md
- skill_id: rapier_ragdoll_chain_reaction
  name: Rapier3D Active Ragdoll & Environmental Hazards Skill
  filename: skills/rapier_ragdoll_hazards.md
  purpose: Реализация физических рэгдолл-падений врагов с вышек и разрушаемых элементов
    базы.
  when_to_use: При программировании попаданий пуль, падения прожекторов и детонации
    бочек.
  rules:
  - Переводить врага в режим рэгдолла только в момент получения смертельного урона.
  - Усыплять (sleep) физические тела через 3 секунды после остановки движения для
    экономии CPU.
  architecture: PhysicsWorld -> RagdollManager & HazardSystem -> Rapier RigidBodies
    & Joints.
  implementation_guidance: Применять импульс от пули к конкретной кости скелета для
    реалистичного отлета тела назад.
  common_mistakes:
  - Слишком много активных динамических коллайдеров на сцене одновременно
  checklist:
  - Плавное падение тел с перил
  - Корректное срабатывание триггеров урона от падающих грузов
  knowledge_refs:
  - knowledge/physics/ragdoll.md
  - knowledge/mechanics/chain_reaction.md
- skill_id: game_skill
  name: 'Снайпер: Призрачный Контракт Domain Architecture'
  filename: GAME_SKILL.md
  purpose: 'Defines domain rules, state machine, and core gameplay loop for Снайпер:
    Призрачный Контракт.'
  when_to_use: Use when writing or modifying core game state, loop coordination, and
    progression.
  rules:
  - Strict TypeScript strict mode without any 'any' types.
  - Fixed 60Hz delta accumulator with delta clamping.
  - Decoupled state management via typed EventBus.
  - Zero runtime object allocations inside the 60Hz game loop.
  architecture: 'Decoupled 3-layer architecture: Application/Platform -> Engine/Systems
    -> Rendering/UI.'
  implementation_guidance: Instantiate Game instance from main.ts, bootstrap PlaygamaService,
    and start GameLoop.
  common_mistakes:
  - Do not instantiate Three.js meshes or heavy objects inside tick loops.
  - Do not bypass the EventBus for cross-system communications.
  checklist:
  - Game initializes cleanly and loads within 3 seconds.
  - EventBus routes inputs and system events without memory leaks.
  - Audio auto-pauses and unpauses cleanly with browser focus changes.
  knowledge_refs: []
- skill_id: gameplay_skill
  name: Combat, Physics & Movement Systems
  filename: GAMEPLAY_SKILL.md
  purpose: Defines standards for physics simulation, combat mechanics, and tactile
    player feedback.
  when_to_use: Use when writing character controllers, weapon systems, collision listeners,
    and juice/VFX.
  rules:
  - Clamp delta time to maximum 100ms to prevent physics tunneling.
  - Use continuous collision detection (CCD) for fast projectiles.
  - Apply hitstop (40ms time dilation) on impactful strikes.
  - Always synchronize physics rigid body transforms to mesh representations.
  architecture: Physics engine (Rapier3D/Matter.js) stepped on fixed 60Hz timestep,
    meshes interpolated.
  implementation_guidance: Use EventBus to emit 'entity:hit', 'combat:parry', 'wave:cleared'
    events for sound and VFX triggers.
  common_mistakes:
  - Never modify transform matrices directly on physics-controlled entities.
  - Do not hardcode magic numbers for damage or velocities without centralized configuration.
  checklist:
  - Player movement is responsive with no input lag.
  - Hits produce satisfying sensory feedback (VFX spark, screen shake, audio impact).
  - Ragdoll or death animations trigger smoothly without physics jitter.
  knowledge_refs: []
- skill_id: renderer_skill
  name: THREEJS WebGL Performance Guide
  filename: RENDERER_SKILL.md
  purpose: Optimization and visual standards for THREEJS WebGL pipeline.
  when_to_use: Use when configuring scenes, cameras, lighting, materials, instanced
    meshes, and particle systems.
  rules:
  - Keep active draw calls strictly under 80.
  - Use InstancedMesh for debris, bullets, and crowd mobs.
  - Clamp pixel ratio to Math.min(window.devicePixelRatio, 1.5) on mobile.
  - Share material instances across identical geometry.
  architecture: Scene graph with pre-allocated sprite and mesh pools, dynamic shadow
    frustum optimization.
  implementation_guidance: Initialize renderer with antialias enabled on desktop,
    powerPreference 'high-performance'.
  common_mistakes:
  - Do not construct new Geometries, Textures, or Materials in the render loop.
  - Do not leave unused GPU assets without calling .dispose().
  - Do not tune quality from raw frame time — under vsync every frame reads as budget-length.
  - Do not launch in reduced quality and climb up; start optimistic and step down.
  checklist:
  - Maintains solid 60 FPS on desktop and >= 50 FPS on mobile.
  - No WebGL context loss errors on tab switches.
  - Shadow map renders crisp without artifact acne.
  - The quality auto-tuner converges and locks instead of oscillating.
  knowledge_refs:
  - threejs/performance_guide.md
  - threejs/adaptive_quality.md
  - threejs/procedural_mesh_builder.md
  - threejs/fps_controller_and_shooting.md
  - threejs/stealth_and_vision_cones.md
  - threejs/physics_integration.md
  - threejs/game_map_and_world_design.md
  - threejs/procedural_character_rig.md
  - threejs/juice_and_vfx_pool.md
  - audio/procedural_sound_synthesizer.md
- skill_id: stack_skill
  name: 'Three.js Stack: Rapier3D, BVH, Yuka, Recast, bitECS, postprocessing'
  filename: STACK_SKILL.md
  purpose: The libraries the game is built on, their verified versions and the tasks
    each one owns.
  when_to_use: Use before writing physics, AI, pathfinding, mass-entity or post-processing
    code — i.e. before writing any system that a stack library already owns.
  rules:
  - Take the library. A hand-rolled A*, boids flock, character controller, broadphase
    or bloom chain is a review defect, not an optimisation.
  - Rapier3D owns rigid bodies, joints and vehicles; a physics body is never driven
    by writing setLinvel() every frame.
  - three-mesh-bvh owns raycasts against static level geometry; Raycaster over a raw
    50k-triangle mesh is not acceptable.
  - Yuka owns steering, finite state machines, fuzzy decisions and perception.
  - recast-navigation owns NPC pathfinding and crowds; walkableHeight/Climb/Radius
    are expressed in cells, not metres.
  - bitECS owns entity mass (bullets, hordes, units) rendered through InstancedMesh;
    it is not used for a handful of unique entities.
  - 'postprocessing owns screen effects: one EffectPass for all of them, renderer.render()
    is replaced by composer.render().'
  - 'Frame order is fixed: input -> AI -> vehicle/controllers -> physics.step() ->
    ECS -> transform sync -> camera -> quality -> composer.render().'
  - WASM libraries (Rapier, Recast) are initialised on the loading screen, behind
    the boot watchdog, and Recast only when the game actually needs a navmesh.
  architecture: Three.js scene as the render layer; Rapier world as the physics source
    of truth; Yuka EntityManager and a recast Crowd for smart NPCs; bitECS world for
    mass entities; one EffectComposer for post FX.
  implementation_guidance: Pin the verified versions from knowledge/stack/README.md.
    Snippets found online for bitecs 0.3 (defineComponent/defineQuery) or rapier 0.13
    will not compile against the pinned versions.
  common_mistakes:
  - Re-implementing a library feature by hand because 'it is just a few lines'.
  - Calling renderer.render() next to composer.render() — the scene is drawn twice.
  - Stepping the physics world with a variable timestep instead of a fixed one with
    a substep cap.
  - Loading the Recast WASM in a game that has no NPC navigation.
  checklist:
  - No custom pathfinding, steering, broadphase or post-processing chain exists in
    src/.
  - The frame order matches knowledge/stack/README.md section 2.
  - Every stack library used is pinned to the version in knowledge/stack/README.md.
  knowledge_refs:
  - stack/README.md
  - stack/rapier3d.md
  - stack/three_mesh_bvh.md
  - stack/postprocessing.md
- skill_id: playgama_skill
  name: Playgama Bridge SDK Integration
  filename: PLAYGAMA_SKILL.md
  purpose: Defines implementation patterns for @playgama/bridge v2 (Ads, Cloud Storage,
    Auth, Leaderboards, Lifecycle).
  when_to_use: Use when implementing advertising triggers, cloud save/load, authorization,
    and portal lifecycle hooks.
  rules:
  - Always await bridge.initialize() (with a timeout) before any other SDK call.
  - Send game_ready exactly once, only after assets are loaded and the menu is interactive.
  - Grant a rewarded reward only on state === 'rewarded'; never when the promise resolves.
  - One save key holding one JSON object; storage.get/set take no storageType argument.
  - Call authorize() only from a player action — except the silent VK/OK path at boot.
  - 'Build UI on capability flags: an unsupported feature''s control is not rendered
    at all.'
  - Take pause and audio state from the platform's own events, not visibilitychange
    alone.
  - Auto-save on progress milestones and flush on pagehide.
  architecture: Singleton PlaygamaService wrapper exposing strongly-typed promises
    for Ads, Storage, Auth, Payments and Leaderboards, degrading to a local mock when
    window.bridge is absent.
  implementation_guidance: Subscribe to EVENT_NAME.REWARDED_STATE_CHANGED, call bridge.advertisement.showRewarded(placement),
    remove the listener in cleanup, and resolve true only for the 'rewarded' state.
    Full implementations for every module are embedded below.
  common_mistakes:
  - Sending game_ready right after initialize() — the splash lifts over an unloaded
    game.
  - Awaiting a dialog-showing authorize() inside boot — the game hangs for every guest.
  - Detecting a guest via player.id/name; they are populated for guests, use player.isGuest.
  - Showing an interstitial in the first seconds of a session or during gameplay.
  - Consuming a purchase before granting it — paid goods are destroyed.
  - Keeping settings in localStorage — it is partitioned inside the platform iframe.
  - Never assume internet connection is permanent — support local offline fallback.
  checklist:
  - Rewarded grants exactly one reward per view, even on a double click.
  - Progress survives a reload as guest and as an authorized player.
  - A corrupted save boots on defaults instead of crashing.
  - Leaderboard score submits and displays correctly.
  - Game auto-pauses on the platform's pause event, including during ads.
  knowledge_refs:
  - playgama/game_ready_and_loading.md
  - playgama/auth_and_player.md
  - playgama/storage_and_cloud.md
  - playgama/ads_integration.md
  - playgama/banners_and_layout.md
  - compliance/yandex_moderation.md
  - ux/localization_system.md
  - ux/touch_controls.md
  - ux/ui_design_system.md
  - ux/ui_implementation.md
- skill_id: controls_skill
  name: Mobile Touch & Desktop Controls
  filename: CONTROLS_SKILL.md
  purpose: 'Задаёт обязательный контракт управления: раскладку под жанр, реализацию
    на Pointer Events, отмену браузерных жестов и правила видимости.'
  when_to_use: 'Use when implementing any player input: virtual joystick, action buttons,
    driving pedals, camera gestures, or keyboard bindings.'
  rules:
  - Только Pointer Events + setPointerCapture; учитывать pointerId для каждой кнопки.
  - Движение и основное действие обязаны работать одновременно (мультитач).
  - В играх про вождение газ — отдельная кнопка, а не вертикаль стика руля.
  - 'touch-action: none, отмена contextmenu/dragstart и touchmove с passive:false.'
  - Отступы через env(safe-area-inset-*); основная кнопка >= 96 px, остальные >= 64
    px.
  - Слой управления виден только в игровом процессе и сбрасывается при скрытии.
  - Сброс всех осей и кнопок на blur и visibilitychange.
  - Флаг ?touch=1 принудительно включает мобильную раскладку на десктопе.
  architecture: Отдельный модуль TouchControls создаёт собственный DOM-слой поверх
    UI, пишет в виртуальные оси InputManager и ничего не знает об игровой логике.
    InputManager сливает клавиатуру и тач, отдавая игре единый снимок управления.
  implementation_guidance: 'UIManager владеет экземпляром TouchControls и переключает
    его видимость в showHud/showPause/hideAllModals. Джойстик — плавающий: база появляется
    под пальцем, зона захвата — половина экрана, мёртвая зона 8%.'
  common_mistakes:
  - Один стик на движение и газ — машина теряет ход в каждом повороте.
  - 'touchstart/touchend без pointerId: второй палец сбрасывает первый.'
  - Слой управления оставлен видимым в меню — он перехватывает тапы по кнопкам.
  - Забытый passive:false — страница продолжает скроллиться под игрой.
  - Кнопки прижаты к краю без safe-area — их перекрывает вырез и системный жест.
  checklist:
  - Газ/атака и направление работают одновременно, проверено тремя пальцами.
  - Свайп по игре не скроллит страницу и не вызывает pull-to-refresh.
  - Долгое нажатие не открывает контекстное меню.
  - Управление скрыто в меню и паузе, оси сброшены после сворачивания вкладки.
  - ?touch=1 показывает мобильную раскладку на десктопе и кликается мышью.
  knowledge_refs:
  - ux/touch_controls.md
- skill_id: ui_skill
  name: 'Game UI: Design System & Overlay Implementation'
  filename: UI_SKILL.md
  purpose: 'Задаёт визуальный контракт интерфейса: токены вместо литералов, один акцент
    на смысл, конечный набор компонентов, состояния экранов и слои над канвасом, которые
    не съедают игровой ввод.'
  when_to_use: Use when building any menu, HUD, modal, settings screen, shop, leaderboard
    panel or результат сессии — то есть всё, что игрок видит поверх канваса.
  rules:
  - Все значения — токенами в одном src/ui/theme.css; литерал цвета в экране запрещён.
  - 'Слои над канвасом: контейнер pointer-events: none, auto — только у листьев.'
  - Слой HUD не кликается никогда; пауза и настройки — кнопки слоя экранов.
  - Один акцент — один смысл, не больше двух акцентов на экране одновременно.
  - Одна геометрия рамки на все кнопки, карточки и модалки.
  - Две гарнитуры; меняющиеся числа — tabular-nums в слоте фиксированной ширины.
  - Три зоны экрана и ровно одно главное действие на экран.
  - У каждого экрана есть состояния загрузки, пустоты и ошибки.
  - Возможность, которой нет на площадке, не рисуется вовсе — не серой кнопкой.
  - Геометрия — от измеренного вьюпорта плюс safe-area и высота баннера, не от 100vh.
  - Запрещены alert/confirm/prompt, эмодзи вместо иконок, голые input[type=range]
    и select.
  - Анимируются только transform и opacity; переход укладывается в 300 мс.
  architecture: 'src/ui/: theme.css с токенами, UiRoot создаёт слои и меряет вьюпорт,
    ScreenRouter держит один видимый экран и общий переход, Hud пишет в закэшированные
    узлы, components/ — закрытый набор примитивов, screens/ — по файлу на экран, icons.ts
    — один инлайновый SVG-спрайт с currentColor.'
  implementation_guidance: 'Компонент — функция, которая строит элемент и возвращает
    небольшой handle с setLoading/setDisabled. Никакого фреймворка: реконсилятор и
    его бандл здесь ничего не покупают. Данные игрока (имена из таблицы лидеров, сохранения)
    идут только через textContent, никогда через innerHTML.'
  common_mistakes:
  - 'Полноэкранный оверлей на pointer-events: auto — на телефоне «не работает управление».'
  - innerHTML в кадре и querySelector в цикле — просадка кадров на ровном месте.
  - 'width вместо transform: scaleX() у полосы — пересчёт раскладки всего слоя.'
  - 100vh вместо измеренного вьюпорта — нижний ряд кнопок уезжает под хром браузера.
  - 'backdrop-filter: blur() на полноэкранном слое — дороже самой сцены на мобильном
    GPU.'
  - 'Скрытый экран на opacity: 0 вместо display: none — его кнопки продолжают ловить
    нажатия.'
  - Кнопка без состояния loading на рекламе или покупке — игрок нажмёт её ещё трижды.
  checklist:
  - Свайп по середине канваса ведёт игру, а не проваливается в оверлей.
  - grep по литералам цвета в src/ui мимо theme.css пуст.
  - Каждая видимая кнопка не меньше 64 px, основная — 96 px.
  - Таблица лидеров показывает загрузку, пустоту и ошибку, а не пустую рамку.
  - При выключенной на площадке возможности её элемента нет в DOM.
  - Скриншоты 360x640 и 1280x720 без обрезанного текста и без скроллбара.
  - С закрытым игровым полем меню узнаётся как эта конкретная игра.
  knowledge_refs:
  - ux/ui_design_system.md
  - ux/ui_implementation.md
