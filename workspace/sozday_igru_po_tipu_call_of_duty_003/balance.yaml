_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: sozday_igru_po_tipu_call_of_duty_003
performance:
  target_fps: 60
  max_draw_calls: 75
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: 'Снайперский контракт: скрытная ликвидация 3–4 приоритетных целей на военном
    объекте за 60–90 секунд до поднятия общей тревоги'
  win: Устранены все 3–4 назначенные контрактом приоритетные цели без поднятия общей
    тревоги базы (или ликвидация завершена до истечения 5-секундного таймера тревоги
    после обнаружения тела).
  lose: Поднята общая тревога базы (истек 5.0-секундный таймер тревоги после поднятия
    паники часовыми), либо VIP-цель скрылась в бронированном бункере, либо израсходован
    весь лимитированный боекомплект снайпера (5–7 патронов).
  difficulty_curve: 'Контракты 1–3 (Обучение): изолированные статичные часовые, широкие
    слепые зоны, явные подвесные прожекторы и бочки. Контракты 4–7 (Спецоперация):
    спаренные патрули, пересекающиеся конусы зрения, бронированные каски (требующие
    выстрела в шею/лицо), таймеры смены караула и боковой ветер. Контракты 8–12 (Элита):
    движущиеся бронемашины, снайперы-контрснайперы на вышках, замаскированные VIP
    в сопровождении личной охраны и сильная пурга со сниженной видимостью.'
mechanics:
  takticheskaya_zaderzhka_dyhaniya_i_fokus_dilatatsi:
    name: Тактическая задержка дыхания и фокус-дилатация времени
    parameters:
      maksimalnoe_vremya_zaderzhki_dyhaniya:
        value: 4.00 с
        note: Если увеличить до 6.0 с, пропадает напряжение и цена ошибки; если снизить
          до 2.5 с, игрок не успевает рассчитать боковой снос ветром.
      koeffitsient_zamedleniya_vremeni_time_dilation:
        value: 0.50x
        note: Если сделать 0.2x (слишком медленно), игра превращается в тир для детей;
          если 0.8x, мобильный игрок не успеет среагировать на движение троса.
      vremya_stabilizatsii_pritselnoy_setki:
        value: 0.25 с
        note: Если мгновенно (0.0 с), теряется ощущение физического веса винтовки;
          если больше 0.6 с, игрок раздражается задержкой отклика.
      shtrafnoe_vremya_giperventilyatsii_pri_sryve:
        value: 2.50 с
        note: 'Критическое наказание: за 2.5 секунды паникующий часовой успевает добежать
          полпути до сирены базы.'
      skorost_vosstanovleniya_kisloroda_v_legkih:
        value: 33.3 %/с
        note: Полное восстановление за 3.0 с формирует ритмичный темп между выстрелами
          без избыточного ожидания.
  kineticheskiy_sabotazh_okruzheniya_i_tsepnye_avari:
    name: Кинетический саботаж окружения и цепные аварии
    parameters:
      radius_porazheniya_padayuschim_prozhektorom:
        value: 3.50 м
        note: Если увеличить до 6.0 м, головоломка становится тривиальной; если уменьшить
          до 1.5 м, шанс подловить патруль в движении стремится к нулю.
      vremya_fizicheskogo_padeniya_konstruktsii:
        value: 0.45 с
        note: 'Задает точный тайминг упреждения: игрок обязан стрелять в трос за 0.45
          с до входа офицера в зону поражения.'
      dlitelnost_zameshatelstva_chasovyh_inspection:
        value: 8.00 с
        note: Идеальное тактическое окно, чтобы спокойно перевести прицел и поразить
          вторую цель со спины.
      prirost_boevoy_trevogi_pri_neschastnom_sluchae:
        value: 0.0 %
        note: 'Ключевое свойство: ликвидация через аварию никогда не активирует таймер
          тревоги базы.'
      bonus_ochkov_kontrakta_za_avariyu_accident_bounty:
        value: +250 XP
        note: Мотивирует игрока искать инженерные решения вместо прямолинейных хедшотов.
  dvuhfaznaya_stels_detektsiya_ii_i_panika_garnizona:
    name: Двухфазная стелс-детекция ИИ и паника гарнизона
    parameters:
      vremya_zapolneniya_shkaly_podozreniya_suspicion_ti:
        value: 1.80 с
        note: 'Окно реакции игрока: если уменьшить до 0.8 с, мобильный игрок не успеет
          среагировать; если увеличить до 3.0 с, стелс теряет остроту.'
      taymer_panicheskogo_sprinta_do_knopki_trevogi:
        value: 5.00 с
        note: 'Жесткий дедлайн: дает ровно один шанс произвести сложный выстрел по
          быстро бегущей мишени с упреждением.'
      skorost_panicheskogo_sprinta_chasovogo:
        value: 5.20 м/с
        note: Высокая скорость требует точного расчета упреждения (вынос перекрестия
          на 2–3 мила вперед по курсу бега).
      dalnost_obzora_chasovogo_v_yasnuyu_pogodu:
        value: 45.0 м
        note: Определяет безопасные расстояния между часовыми при планировании порядка
          ликвидации.
      snizhenie_dalnosti_obzora_vo_vremya_polyarnoy_mete:
        value: -50.0 %
        note: Позволяет игроку использовать плохую погоду как естественное тактическое
          укрытие.
  ballistika_mil_dot_snos_metelyu_i_uprezhdenie_zvuk:
    name: Баллистика Mil-Dot, снос метелью и упреждение звукового барьера
    parameters:
      nachalnaya_skorost_puli_7_62x54mmr_7n1:
        value: 850.0 м/с
        note: Если увеличить до 1500 м/с, стрельба превратится в аркадный луч; если
          снизить до 400 м/с, пуля будет лететь нереалистично долго.
      diapazon_sily_polyarnogo_vetra:
        value: 0.0–14.0 м/с
        note: Динамический ветер заставляет игрока постоянно пересчитывать поправку
          прямо во время прицеливания.
      tsena_deleniya_setki_mil_dot_na_400_m_distantsii:
        value: 0.40 м/мил
        note: 'Классическая математика оптики: 1 мил = 1/1000 дистанции. Соответствует
          реальной армейской снайперской науке.'
      mnozhitel_urona_pri_popadanii_v_sheyu_litso:
        value: x3.0
        note: Гарантирует мгновенную тихую нейтрализацию даже целей в тяжелых титановых
          шлемах 4-го класса.
      radius_predsmertnogo_stona_pri_ranenii_v_korpus:
        value: 8.00 м
        note: Выстрел в корпус не убивает мгновенно, жертва стонет и выдает позицию
          ближайшим часовым.
  kontraktnaya_akusticheskaya_maskirovka_i_tayming_g:
    name: Контрактная акустическая маскировка и тайминг грома
    parameters:
      dlitelnost_aktivnogo_okna_gromovoy_maskirovki:
        value: 1.40 с
        note: Если увеличить до 3.0 с, теряется напряжение ритм-тайминга; если сделать
          меньше 0.6 с, мобильный игрок не успеет нажать спуск.
      podavlenie_akusticheskoy_zametnosti_vystrela_v_okn:
        value: -100.0 %
        note: Позволяет стрелять из крупного калибра .50 BMG в упор к гарнизону без
          малейшей реакции часовых.
      interval_mezhdu_tsiklami_prirodnogo_groma_meteli:
        value: 18.0 с
        note: Задает размеренный тактический темп для планирования серии выстрелов.
      interval_vspyshek_vyhlopa_bazy_dizel_generator:
        value: 6.0 с
        note: Быстрое, но короткое окно маскировки (0.8 с) для динамичной быстрой
          стрельбы.
      bazovyy_radius_obnaruzheniya_neglushenogo_vystrela:
        value: 120.0 м
        note: Выстрел вне окна маскировки мгновенно поднимает на ноги весь сектор
          базы.
