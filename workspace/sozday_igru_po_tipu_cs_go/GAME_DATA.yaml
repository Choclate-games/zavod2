raw_prompt: Создай игру по типу cs go
title: 'Ван-Тап: Дуэли на Крыше'
slug: sozday_igru_po_tipu_cs_go
genre: Тактический 3D FPS-Шутер
subgenre: Соревновательные дуэли 1v1 / Высотный контр-стрейф арена-шутер от первого
  лица
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK Play / CrazyGames / Web & Mobile)
orientation: landscape
target_audience: Игроки 14–35 лет, поклонники CS:GO, Valorant и соревновательных тактических
  шутеров, ценящие чистый механический скилл, мгновенный отклик, тайминг контр-стрейфа
  и триумф хедшотов, играющие в короткие сессии по 1–3 минуты на ПК и смартфонах.
core_loop: Оценка позиции противника на крыше -> Стрейф-выход из-за укрытия -> Мгновенный
  контр-стрейф (полная остановка с обнулением разброса) -> Точечный Ван-Тап в голову
  соперника за доли секунды -> Звонкий срыв каски и победа в раунде -> Закупка/смена
  оружия на следующий раунд серии Best of 5.
hook: Момент, когда на 7-й секунде раунда ты выходишь из-за строительной балки на
  свайпе, жмешь противоположный стрейф, ловишь идеальный ноль скорости и за 120 миллисекунд
  ставишь противнику ван-тап из Desert Eagle — его каска со снопом золотых искр улетает
  в бездну заката над мегаполисом под оглушительный металлический 'ДЗЫНЬ!'.
player_fantasy: 'Ты — элитный дуэлянт-наемник на вершине недостроенного небоскреба.
  Никаких хаотичных очередей и слепого зажима: один патрон, идеальная остановка, выверенный
  щелчок курка — и враг повержен до того, как успеет моргнуть.'
session_model: Матч Best of 5 (до 3 побед) из 5 раундов по 10–15 секунд каждый; суммарная
  длительность полной сессии — ровно 60–90 секунд с моментальной сменой сторон и позиций
  спавна.
unique_value_proposition: Единственный браузерный и мобильный 3D тактический FPS с
  чистой физикой контр-стрейфа и бескомпромиссными 1v1 дуэлями на крышах небоскребов,
  где каждый раунд решается за 10 секунд одним выверенным ван-тапом без случайного
  разброса и RPG-гринда.
vision: Создать бескомпромиссный соревновательный микро-шутер нового поколения для
  Playgama Bridge, который переносит культовое ощущение скиллового ван-тапа и контр-стрейфа
  из CS:GO в молниеносный веб-формат с идеальной эргономикой управления и киношной
  эстетикой заката на крыше высотки.
elevator_pitch: 'CS:GO, сжатый до абсолютного концентрата: дуэли 1v1 на крыше строящегося
  небоскреба, где раунд длится 12 секунд. Сделай контр-стрейф, поймай точку нулевой
  инерции и поставь ван-тап в голову врага со звоном сорванного шлема!'
win_conditions: Выиграть 3 раунда из 5 в дуэльной серии (Best of 5), уничтожив противника
  точным выстрелом в голову или корпус быстрее, чем истечет 15-секундный таймер раунда.
lose_conditions: Погибнуть от выстрела противника в 3 раундах серии, упасть с края
  крыши небоскреба в бездну или допустить истечение 15-секундного таймера (при ничьей
  по времени оба дуэлянта получают поражение за пассивность).
progression_summary: 'Внутри матча (Run): Выбор арсенала между раундами (Deagle ->
  AK-47 -> AWP -> SSG 08 -> Револьвер) с ростом дистанции и сменой укрытий. Межсессионная
  прогрессия (Meta): Открытие визуальных кастомизаций оружия (скины, гравировки, эффекты
  выстрела), дуэльных перчаток, титулов и продвижение по рейтинговой таблице дуэлянтов
  (Ранг ''Крыша Мегаполиса'').'
difficulty_curve: 'Экспоненциально-адаптивная кривая реакции: в первых матчах боты
  реагируют с задержкой 450–600 мс с базовым контр-стрейфом; по мере роста победной
  серии противники сокращают окно прицеливания до 180–220 мс, активно используют ложные
  стрейфы (джог-пики) и прострелы через легкие профлисты строительных лесов.'
scores:
