definition_of_done:
- Мгновенная летальность хедшота (One-Tap Kill) реализована с гарантированным уроном
  220 HP и физическим срывом каски
- Механика контр-стрейфа с детерминированным обнулением разброса пули строго при нулевой
  скорости персонажа
- Компактная арена 'Крыша небоскреба на закате' со стабильными 60 FPS на десктопе
  и мобильных устройствах
- Дуэльный матч Best of 5 с 15-секундным таймером раунда и наказанием за пассивность
- 'Адаптивное раздельное управление: клавиатура/мышь на ПК и Dual-Zone Touch со свайп-стрейфом
  на смартфонах'
- Связка Three.js и three-mesh-bvh для прецизионного расчета попаданий в хитбоксы
  головы
- 'Интеграция Playgama Bridge: облачные сохранения ELO-рейтинга, межраундовая реклама
  и лидерборды'
- 'Полноценный аудиовизуальный сок: сочный металлический звон каски, вылет гильз,
  дульная вспышка и замедление времени Slow-mo'
- 'Игра осталась тем, что просили: вид от первого лица — игрок смотрит своими глазами,
  а не с вертолёта, вышки или орбиты.'
- 'Игра осталась тем, что просили: игрок сам ходит по уровню на своих двоих.'
- 'Игра осталась тем, что просили: стрельба как главное действие игрока.'
- 'Игру узнают как то, о чём просили (cs go): жанр и главное действие те же, мир и
  твист — свои.'
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Оценка позиции противника на крыше -> Стрейф-выход из-за
  укрытия -> Мгновенный контр-стрейф (полная остановка с обнулением разброса) -> Точечный
  Ван-Тап в голову соперника за доли секунды -> Звонкий срыв каски и победа в раунде
  -> Закупка/смена оружия на следующий раунд серии Best of 5..'
- 'Реализованы механики проекта: Контр-стрейф с активным гашением инерции (Precision
  Counter-Strafe), Ван-Тап хедшот со срывом каски (One-Tap Helmet Knockoff), Позиционный
  пик и пред-прицеливание (Angle Peeking & Pre-Aim), Таймер форсированного контакта
  (15-Second Rooftop Pressure).'
- Условие успеха (Выиграть 3 раунда из 5 в дуэльной серии (Best of 5), уничтожив противника
  точным выстрелом в голову или корпус быстрее, чем истечет 15-секундный таймер раунда.)
  и условие проигрыша (Погибнуть от выстрела противника в 3 раундах серии, упасть
  с края крыши небоскреба в бездну или допустить истечение 15-секундного таймера (при
  ничьей по времени оба дуэлянта получают поражение за пассивность).) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Ван-Тап: Дуэли на Крыше».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Удвоение награды за матч, Дуэльный
  кейс со скином, Защита рейтинга (Shield)); interstitial соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
