  selected_id: D1
  selected_name: 'Ван-Тап: Дуэли на Крыше'
  selection_reason: Направление D1 берет самую эмоциональную и вирусную суть CS:GO
    — триумф точного выстрела в голову (one-tap headshot) и микро-тайминг контр-стрейфа
    — и упаковывает её в идеальный для браузера и мобильных устройств формат. Короткие
    10–15 секундные дуэли дают мгновенную петлю обратной связи без простоя и ожидания.
    Минималистичная компактная сцена на крыше небоскреба гарантирует стабильные 60
    FPS на любом телефоне за счет низкого числа Draw Calls, а эргономичное управление
    со свайп-стрейфом и точечным спуском идеально ложится под сенсорный экран без
    перегрузки виртуальными кнопками.
  rejected_reasons:
  - '«Конвой: Эвакуация под Огнём» (D2) отвергнут, так как смещает фокус с соревновательного
    мастерства стрельбы и личного аима на сопровождение уязвимого ИИ-союзника; гибель
    подопечного от шальной пули вызывает раздражение, а не соревновательный драйв.'
  - '«Одиночный Клатч: Зачистка Склада» (D3) отвергнут, так как асимметричный бой
    1v5 на закрытой арене неизбежно поощряет пассивное сидение в засаде и кемперство,
    что разрушает быструю динамику сессии и делает геймплей затянутым.'
  what_it_is_not:
  - Авто-стрельба без отдачи и без штрафа за движение (игрок обязан останавливаться
    для точного выстрела и сам жать спуск).
  - Волны зомби или бегущей орды (никакого бездумного отстрела толп мяса; только дуэли
    с вооруженными стрелками).
  - 'Случайный разброс пуль (механика полностью детерминирована: первый выстрел из
    неподвижного состояния всегда летит в центр перекрестия).'
  - RPG-прокачка урона или брони за монеты (все оружие имеет честные соревновательные
    ТТХ; скилл игрока выше гринда).
  - Огромные запутанные лабиринты с долгим поиском врагов (только концентрированные
    дуэльные дистанции с моментальным визуальным контактом).
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - Мгновенная летальность при попадании в голову (One-Tap Kill) со звонким звуком
    сбитой металлической каски.
  - 'Механика контр-стрейфа: разброс оружия жестко привязан к текущей скорости персонажа
    (высокий на бегу, нулевой при полной остановке).'
  - 'Жесткий таймер дуэли (15 секунд): истечение времени наказывает обоих дуэлянтов,
    форсируя активный выход на огневой контакт.'
  - Вид строго от первого лица с честной отдачей ствола, дульной вспышкой и вылетом
    гильз в кадре.
