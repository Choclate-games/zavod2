mechanics:
- name: Контр-стрейф с активным гашением инерции (Precision Counter-Strafe)
  category: двигатель
  priority: core
  description: В отличие от большинства мобильных шутеров, где персонаж стреляет с
    автонаводкой или на полном ходу, здесь реализована бескомпромиссная физическая
    модель контр-импульса source-шутеров, адаптированная под сверхбыстрый веб-геймплей.
  player_interaction: 'Клавиатура: отпускание A + мгновенный тап D (или наоборот);
    Тачскрин: резкий свайп стика локомоции в противоположную сторону с отпусканием
    в центр'
  feedback: 'Визуал/VFX: Динамическое 4-сегментное перекрестие прицела сжимается с
    легким эффектом магнитной привязки; под ногами персонажа на металлонастиле высекаются
    короткие искры торможения подошв; Звук (Web Audio): Приглушенный металлический
    скрежет подошв о стальной настил крыши (частота 1200 Гц, спад за 60 мс) и щелчок
    готовности затвора; Камера (импульс/зум): Микро-толчок FOV камеры (FOV 90° ->
    88° -> 90° за 70 мс) с мгновенной стабилизацией горизонта без покачивания; UI/Тактильность:
    Короткий виброотклик (haptic pulse 15 мс) на мобильных устройствах при достижении
    0.0 м/с и подсветка центральной точки прицела неоновым зеленым цветом'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
- name: Ван-Тап хедшот со срывом каски (One-Tap Helmet Knockoff)
  category: combat
  priority: core
  description: Мгновенная ликвидация соперника с одного патрона при попадании в миллиметровый
    хитбокс головы, сопровождаемая физическим срывом каски, снопом золотых искр и
    замедлением времени Slow-mo.
  player_interaction: 'ПК: Клик Левой Кнопки Мыши (ЛКМ); Мобильные: Тап по правой
    половине экрана / выделенной кнопке огня'
  feedback: 'Визуал/VFX: Физическая 3D-модель каски срывается с головы бота и кружится
    в воздухе; сноп из 45 золотых PBR-искр и вспышка пороховых газов на дульном срезе;
    Звук (Web Audio): Сокрушительный металлический звон ''ДЗЫНЬ!'' (с резонансом на
    2.4 кГц и эхом высотки) + сочный басовый панч выстрела Deagle (70 Гц); Камера
    (импульс/зум): Резкий кинематографичный микро-зум (FOV 90° -> 84° за 40 мс) с
    радиальным размытием (Radial Blur 0.25) по краям экрана; UI/Тактильность: Мощный
    сдвоенный виброотклик (haptic kick 45 мс) и появление золотого черепа с надписью
    ''ONE-TAP'' по центру экрана'
  technical_complexity: High
  strengths:
  - Максимальный всплеск дофамина у игрока
  - Мгновенное завершение раунда без нудного ковыряния полоски здоровья
  - Вирусный потенциал игровых моментов
  weaknesses:
  - Требует предельно честного и точного Raycast через BVH
- name: Позиционный пик и пред-прицеливание (Angle Peeking & Pre-Aim)
  category: tactics
  priority: core
  description: Тактический выход из-за строительных конструкций (двутавровых балок,
    вентиляционных коробов) с удержанием прицела строго на уровне горизонта головы
    противника.
  player_interaction: 'Клавиатура: сочетание A/D с кратковременным Shift (медленный
    бесшумный подход) или пробелом; Тачскрин: амплитуда отклонения аналогового стика'
  feedback: 'Визуал/VFX: Тени от конструкций крыши динамически падают на оружие; при
    появлении силуэта врага срабатывает легкое контурное свечение краев модели (Rim
    Light); Звук (Web Audio): Направленное 3D-аудио шагов (PannerNode): глухой стук
    по бетону сменяется звонким гулом по стальному настилу у кромки; Камера (импульс/зум):
    Легкий наклон камеры на 1.5° (Cam Roll) в сторону направления стрейфа для усиления
    кинематики выхода; UI/Тактильность: Микро-щелчок тактильности при пересечении
    линии видимости (LOS) с противником'
  technical_complexity: Medium
  strengths:
  - Поощряет чтение карты и тактическое позиционирование
  - Создает психологическую дуэль умов перед каждым выстрелом
  weaknesses:
  - Требует грамотно сбалансированной геометрии укрытий на крыше
- name: Таймер форсированного контакта (15-Second Rooftop Pressure)
  category: system
  priority: core
  description: 'Жесткое 15-секундное ограничение длительности раунда: пассивное высиживание
    в засаде карается автоматическим поражением обоих дуэлянтов (Draw-Loss), вынуждая
    активно выходить на огневой контакт.'
  player_interaction: 'Пассивно-системная механика: управляет динамикой матча через
    визуальный и аудио-пейсинг'
  feedback: 'Визуал/VFX: Цифровой неоновый таймер по центру вверху экрана; при t <
    4 с цифры вспыхивают алым пламенем с эффектом глитча; Звук (Web Audio): Учащающийся
    стук сердца (BPM растет с 80 до 160) + нарастающий высотный гул ветра и тиканье
    часового механизма; Камера (импульс/зум): Пульсирующее виньетирование (Vignette
    intensity 0.0 -> 0.5) в такт ударам сердца; UI/Тактильность: Нарастающая ритмичная
    вибрация устройства на последних 3 секундах раунда'
  technical_complexity: Low
  strengths:
  - Полностью исключает кемперство и затягивание матча
  - Гарантирует ультра-динамичный темп сессии (до 90 секунд на весь матч)
  weaknesses:
  - Новички могут паниковать на последних секундах
- name: Прострел легких укрытий и джог-пик (Wallbang & Jiggle-Bait)
  category: источник риска
  priority: secondary
  description: Материалоемкая физическая модель прострелов превращает укрытия на крыше
    из бинарных 'стенок' в динамические тактические слои.
  player_interaction: 'Клавиатура: мгновенное микро-касание A с последующим D без
    открытия силуэта; клик ЛКМ в контур за профлистом; Тачскрин: двойной микро-тап
    по краю экрана'
  feedback: 'Визуал/VFX: Отверстие от пули в профлисте с эффектом разлетающейся стружки/щепок
    и клубов строительной пыли; трассер пули искрит на выходе; Звук (Web Audio): Глухой
    треск пробиваемого дерева / звонкий скрежет прошиваемого тонкого металла с демпфированием
    свиста пули; Камера (импульс/зум): Легкий низкочастотный импульс дрожания камеры
    (Shake 0.15) при попадании пули рядом с игроком сквозь стену; UI/Тактильность:
    Индикатор маркера попадания сквозь преграду (полупрозрачный перечеркнутый крестик
    Wallbang Hit)'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
gameplay_systems:
- name: Система расчета баллистики и хитбоксов (Raycast BVH Ballistics Engine)
  purpose: Мгновенный детерминированный расчет траектории пули, попаданий в микро-хитбоксы
    головы/тела и рикошетов на 60 FPS через three-mesh-bvh.
  input: Координаты камеры игрока, вектор направления прицела, текущий коэффициент
    разброса ствола, BVH-дерево мешей сцены.
  rules:
  - Первый выстрел из неподвижного состояния имеет нулевой разброс (Spread = 0)
  - Попадание в зону 'HEAD' наносит гарантированные 220 HP урона (мгновенный ван-тап)
  - Попадание в корпус наносит 45–65 HP урона и накладывает 30% замедление на 0.3
    секунды
  - Прострел сквозь тонкие металлические профили снижает урон на 40%
  state:
  - WeaponSpreadState
  - ActiveBulletTracersPool
  - LastHitZone
  - DecalPool
  interactions: Передает событие ликвидации в MatchDirector, запускает спавн гильз
    и отлет модели каски в физический движок.
  feedback: Золотистый трассер в воздухе, вспышка дульного пламени, отдача ствола,
    декаль пулевого отверстия в бетоне с искрами.
  edge_cases:
  - Стрельба в упор (ноль дистанции) — лучевая проверка стартует с упреждением отсечения
    ближней плоскости камеры
  - Одновременный выстрел — приоритет первого зарегистрированного луча по временной
    метке кадра
- name: Система физики контр-стрейфа и локомоции (Inertia & Deceleration Controller)
  purpose: Реализация точного соревновательного перемещения от первого лица с физикой
    инерции, стрейфа и активного торможения.
  input: Вектор ввода клавиатуры/тач-свайпа, флаг тихого шага Shift, дельта времени
    dt.
  rules:
  - Максимальная скорость бега — 5.8 м/с
  - При нажатии противоположной клавиши ускорение торможения возрастает в 2.5 раза
    (остановка за 0.08 с против 0.24 с накатом)
  - 'Разброс оружия линейно привязан к нормализованной скорости: Spread = Velocity
    / MaxVelocity * MaxSpreadAngle'
  - Прыжки заблокированы для исключения аркадного баннихопа и сохранения фокуса на
    прицеле
  state:
  - PlayerVelocityVector
  - IsCounterStrafing
  - CurrentSpreadAngle
  - FootstepTimer
  interactions: Модифицирует разброс в BallisticsEngine и передает параметры перемещения
    в AudioCore для синтеза звука шагов.
  feedback: Динамическое сжатие прицела, наклон оружия при резкой остановке, шорох
    подошвы по бетону.
  edge_cases:
  - Касание края крыши — скольжение вдоль невидимой кромки или падение в бездну при
    выходе за пределы рабочей зоны
- name: Система соревновательного ИИ дуэлянта (Adaptive Bot Duelist Engine)
  purpose: Обеспечение напряженных 1v1 дуэлей против ботов различного ранга с имитацией
    реального поведения киберспортсменов.
  input: Позиция игрока, звук шагов, таймер раунда, текущий ELO-ранг игрока.
  rules:
  - Бот использует стрейф-пики из-за укрытий и делает контр-стрейф перед выстрелом
  - Время реакции бота масштабируется от 550 мс (ранг 1) до 180 мс (ранг 10)
  - Бот реагирует только на прямую видимость или пространственный звук бега (тихий
    шаг игрока делает подход незаметным)
  - При таймере < 6 секунд бот переходит в режим агрессивного штурма позиции
  state:
  - AI_State (Patrol/JigglePeek/AimLock/Fired/Push)
  - ReactionTimer
  - TargetAimAngles
  - StrafeCycleTimer
  interactions: Вызывает выстрелы в BallisticsEngine, проигрывает скелетные анимации
    стойки и наклона корпуса.
  feedback: Контрастный силуэт противника, наклон модели при стрейфе, вылет гильз
    из ствола оружия бота.
  edge_cases:
  - Игрок стоит неподвижно в слепой зоне — бот методично чекает углы по очереди
- name: Система управления матчем Best of 5 и раундовой экономикой (Match Director
    & Flow)
  purpose: Управление циклом матча, сменой позиций спавна на крыше, закупкой оружия
    и начислением соревновательного рейтинга.
  input: События смертей, таймер раунда 15 секунд, выбор оружия игроком.
  rules:
  - Матч играется до 3 побед одного из участников (максимум 5 раундов)
  - После каждого раунда спавны зеркально меняются для честности условий
  - За победу ван-тапом начисляется +50 бонусных дуэльных слитков
  - При счете 2:2 активируется решающий раунд 'Match Point' с драматичной звуковой
    темой
  state:
  - ScorePlayer
  - ScoreEnemy
  - CurrentRoundIndex
  - SelectedWeapon
  - MatchPhase (Warmup/Live/SlowMo/RoundEnd/MatchEnd)
  interactions: Интеграция с Playgama Bridge для сохранения ELO, обновления таблицы
    лидеров и показа межраундовой рекламы.
  feedback: Инфографика счета вверху экрана (плашки раундов), экран Victory/Defeat
    с анимацией изменения ELO.
  edge_cases:
  - Разрыв соединения или потеря фокуса вкладки — автоматическая пауза матча с сохранением
    состояния
core_design:
  signature_moment: 'Момент на 7-й секунде раунда: ты на микро-стрейфе выскальзываешь
    из-за стального двутавра, мгновенно прожимаешь противоположный вектор, фиксируя
    скорость в абсолютный 0.0 м/с за 80 мс; перекрестие Desert Eagle сжимается в точку,
    ты производишь один выверенный клик в голову выходящего из-за вентшахты соперника
    — его тактическая каска с ослепительным снопом золотых искр и звонким ''ДЗЫНЬ!''
    улетает в закатную бездну мегаполиса с высоты 70-го этажа в режиме 0.3-секундного
    Slow-mo.'
  genre_template_rejected: 'Отвергнут шаблон «Спрей-контроль длинных очередей и позиционный
    холд (CS/Valorant full-buy round)»: В игре полностью отсутствуют хаотичные длинные
    зажимы на 30 патронов, заучивание паттернов отдачи, 2-минутные раунды с кемпингом
    за углами и сложная экономика гранат. Вместо этого — бескомпромиссная культура
    ван-тапов (1 выстрел — 1 труп или срыв каски), жесткий таймер на 15 секунд с обоюдным
    поражением за пассивность и мгновенная проверка микро-тайминга контр-стрейфа.'
  what_makes_it_different: 'В отличие от стандартных мобильных/браузерных шутеров
    с автострельбой или аркадным бегом без штрафа на точность, здесь физика инерции
    и баллистический разброс жестко завязаны на состояние контр-стрейфа: малейшее
    движение (скорость > 0.5 м/с) дает 100% промах в сторону, а идеальная остановка
    клавишей противохода за 80 мс дарит лазерную точность. Компактная дуэльная арена
    на недостроенной крыше превращает каждый 15-секундный раунд в напряженную дуэль
    майндгеймсов и таймингов пика.'
  micro_loop:
  - step: 01_pre_aim_hold
    player_action: Позиционирование прицела на уровне головы у кромки укрытия соперника
      из-за стальной балки
    game_response: Отображение статического укрытия, рендеринг теней и звуков шагов
      приближающегося противника по металлонастилу
    decision: Выходить широким пиком (wide-peek) или сделать быстрый короткий джог-чек
      (jiggle-peek) для сбора инфы
    duration: 1.5–3.0 с
  - step: 02_counter_strafe_peek
    player_action: Резкий стрейф вбок (A/D) на открытую линию огня с мгновенным нажатием
      контр-клавиши для торможения
    game_response: Вектор скорости игрока падает с 6.2 м/с до 0.0 м/с за 80 мс; динамический
      прицел мгновенно схлопывается в точку 0 MoA
    decision: Стрелять префайром в расчетную точку или скорректировать микро-флик
      под фактическую позицию врага
    duration: 0.15–0.35 с
  - step: 03_one_tap_trigger
    player_action: Одиночный клик ЛКМ / тап по экрану точно в силуэт каски соперника
      в момент нулевой скорости
    game_response: Мгновенный Raycast-расчет попадания в хитбокс головы, срыв каски
      физ-импульсом, сноп искр, звук 'ДЗЫНЬ!', триггер Slow-mo
    decision: 'В случае промаха: мгновенно уйти обратным стрейфом за балку или попытаться
      добить вторым выстрелом с учетом задержки сброса отдачи'
    duration: 0.08–0.2 с
  - step: 04_round_resolution
    player_action: Оценка результата выстрела, переход в позицию готовности к следующему
      раунду
    game_response: Фиксация победы в раунде, обновление счета серии Best of 5, начисление
      дуэльных очков
    decision: Какое оружие взять на следующий раунд под увеличившуюся дистанцию дуэли
    duration: 1.0–2.0 с
  meso_loop:
  - step: 01_round_loadout_choice
    player_action: Выбор дуэльного ствола (Desert Eagle / AK-47 / SSG 08 / AWP / Magnum)
      на фазе подготовки (3 с)
    game_response: Смена спавна на противоположную сторону крыши, адаптация стартовых
      укрытий под выбранное оружие
    decision: Выбрать скорострельный Deagle для ближней перестрелки или SSG 08 для
      пика на дальней дистанции
    duration: 3.0 с
  - step: 02_tactical_skirmish
    player_action: Реализация тактического плана раунда с контролем 15-секундного
      таймера крыши
    game_response: Динамический рост давления таймера (учащенный пульс звука), адаптивное
      поведение бота под стиль игрока
    decision: Агрессивно форсировать контакт на 5-й секунде или переиграть оппонента
      на ошибке позиционирования к 12-й секунде
    duration: 8.0–15.0 с
  - step: 03_series_score_swing
    player_action: Анализ паттерна движения соперника в предыдущих раундах и адаптация
      тактики пика
    game_response: Изменение психологического статуса дуэли (Match Point, Clutch,
      Comeback), адаптация тайминга реакции ИИ
    decision: Повторить успешный тайминг пика или сменить угол выхода для создания
      эффекта неожиданности
    duration: 1.5 с
  - step: 04_match_finish
    player_action: Финальный решающий выстрел при счете 2:2 и фиксация победы в серии
      Best of 5
    game_response: Кинематографичный облет камеры вокруг крыши, подсчет точности ван-тапов
      (Headshot %), начисление рангового рейтинга
    decision: Начать следующий матч на повышение ранга или зайти в оружейную для примерки
      скинов
    duration: 3.0–5.0 с
  macro_loop:
  - step: 01_ranked_matchmaking
    player_action: Поиск соперника в дуэльной лиге «Крыша Мегаполиса» с выбором дивизиона
    game_response: Подбор оппонента с соответствующим MMR / генерация бота с адаптивным
      окном реакции (180–400 мс)
    decision: Играть стандартный рейтинговый матч или дуэльный контракт на стрике
      побед
    duration: 3.0–5.0 с
  - step: 02_match_execution
    player_action: Отыгрыш серии дуэлей Best of 5 с демонстрацией точности и скорости
      контр-стрейфа
    game_response: Стриминг телеметрии выстрелов (время реакции, точность нулевой
      скорости, попадания в каску)
    decision: Рисковать ради зрелищных ноузумов/джамп-шотов или играть на гарантированный
      сухой счет 3:0
    duration: 60.0–90.0 с
  - step: 03_reward_and_craft
    player_action: Получение дуэльных кредитов, разблокировка скинов, перчаток и редких
      звуковых эффектов хедшота
    game_response: Анимация вскрытия кейса со скинами, демонстрация 3D-осмотра оружия
      на закатном фоне
    decision: Экипировать кастомный скин на Desert Eagle или копить кредиты на элитную
      снайперскую винтовку
    duration: 15.0–30.0 с
  - step: 04_rank_ascension
    player_action: Переход в высший дивизион (Бронза -> Алмаз -> Властелин Крыш) и
      открытие усложненных дуэльных арен
    game_response: Обновление таблицы лидеров, разблокировка новых погодных условий
      (ночной дождь, закатный туман)
    decision: Продолжить подъем в топ-100 или закрепить винрейт в тренировочном тире
    duration: 5.0–10.0 с
  loop_diagram: "+-----------------------------------------------------------------------------------+\n\
    |                           MACRO LOOP: РЕЙТИНГ И АРСЕНАЛ                    \
    \       |\n|  [Поиск дуэли] -> [Серия Best of 5 (60-90с)] -> [Награды / Скины]\
    \ -> [Ранг 'Крыша'] |\n+------------------------------------------+----------------------------------------+\n\
    \                                           |\n+------------------------------------------v----------------------------------------+\n\
    |                      MESO LOOP: СЕРИЯ РАУНДОВ BEST OF 5 (до 3 побед)       \
    \       |\n|  +-----------------------------------------------------------------------------+\
    \  |\n|  | [Выбор ствола: Deagle/AK/AWP] -> [Спавн на крыше] -> [Дуэль 15с] ->\
    \ [Счет]   |  |\n|  +---------------------------------------+-------------------------------------+\
    \  |\n+------------------------------------------|----------------------------------------+\n\
    \                                           |\n+------------------------------------------v----------------------------------------+\n\
    |                     MICRO LOOP: 15-СЕКУНДНЫЙ ОГНЕВОЙ КОНТАКТ               \
    \       |\n|                                                                 \
    \                  |\n|    [1. Пре-эим из укрытия]                           \
    \                             |\n|             |                             \
    \                                        |\n|             v                  \
    \                                                   |\n|    [2. Стрейф-выход (A/D:\
    \ 6.2 м/с)] ---> [Промах тайминга -> Разброс 12° -> Смерть]|\n|             |\
    \                                                                     |\n|   \
    \          v                                                                 \
    \    |\n|    [3. Контр-стрейф (активный тормоз: V=0.0 м/с за 80 мс, прицел в точку)]\
    \        |\n|             |                                                  \
    \                   |\n|             v                                       \
    \                              |\n|    [4. Ван-Тап в голову (Raycast 120 мс, срыв\
    \ каски, 'ДЗЫНЬ!', Slow-mo 0.3с)]     |\n|             |                     \
    \                                                |\n|             v          \
    \                                                           |\n|    [5. Победа\
    \ в раунде / Смена позиции укрытия]                                   |\n+-----------------------------------------------------------------------------------+"
  tension_curve: '0–3 сек: Фаза саспенса и позиционирования — тишина на высоте 70-го
    этажа, слышен лишь свист ветра и эхо шагов соперника, пульс игрока умеренный (напряжение
    20%); 3–7 сек: Фаза сближения и пре-пика — игроки подходят к углам укрытий, напряжение
    резко взлетает до 85%, перекрестие наведено на миллиметровую щель между балками;
    7–8 сек: Взрывной пик контакта — стрейф, контр-стрейф, щелчок выстрела за 120
    мс (пик напряжения 100%); 8–8.5 сек: Катарсис и разрядка — Slow-mo, звонкий срыв
    каски, золото искр, напряжение спадает до 10%; 9–15 сек (в случае затяжки): Паническая
    клаустрофобия — пульсирующий красный экран и тиканье таймера, вынуждающее идти
    ва-банк под угрозой Draw-Loss (напряжение 95%).'
  core_formulas:
  - 'Формула скорости контр-стрейфа: V(t) = max(0, V_current - (a_base + a_counter
    * input_opposed) * dt), где a_base = 18.0 м/с², a_counter = 54.0 м/с², время полной
    остановки при контр-нажатии t_stop = 0.08 с (против 0.34 с при пассивном накате).'
  - 'Формула разброса при стрельбе: Spread_deg = Base_Spread + (V_player / V_max)^1.8
    * Max_Move_Spread + Recoil_Penalty * (1 - e^(-t_since_last_shot / t_recovery)),
    где для Desert Eagle: Base_Spread = 0.05°, Max_Move_Spread = 14.5°, t_recovery
    = 0.42 с.'
  - 'Формула модификатора урона по зонам: Damage_Final = Base_Damage * Hitbox_Multiplier
    * Armor_Penetration, где для головы Multiplier = 4.0 (ван-тап 140 HP с гарантированным
    срывом каски), корпус Multiplier = 1.0 (35 HP), конечности Multiplier = 0.75 (26
    HP).'
  - 'Формула времени реакции адаптивного ИИ: T_bot_reaction = clamp(T_base * (1.0
    - WinStreak * 0.08) + random(-0.03, +0.03), 0.18, 0.55) секунд, где на ранге ''Новичок''
    T_bot = 0.50 с, на ранге ''Властелин Крыш'' T_bot = 0.19 с.'
  - 'Формула очков дуэли: Score_Round = 1000 * (Headshot ? 1.5 : 1.0) * max(0.2, (15.0
    - Round_Time) / 15.0) + (CounterStrafe_Quality > 0.95 ? 300 : 0).'
  run_progression:
  - 'Раунд 1 (Пистолетный контакт): Desert Eagle — дистанция 12–18 метров, 1 патрон
    в голову для победы, максимальная зависимость от контр-стрейфа.'
  - 'Раунд 2 (Автоматический пик): AK-47 — дистанция 18–25 метров, возможность поставить
    ван-тап первым патроном или наказать противника короткой отсечкой в 2 пули при
    микро-ошибке позиционирования.'
  - 'Раунд 3 (Снайперский дуэльный рубеж): SSG 08 / AWP — дистанция 25–38 метров,
    открываются длинные прострелы через строительные леса, зум-прицеливание требует
    идеального тайминга остановки до щелчка затвора.'
  - 'Раунд 4–5 (Матч-пойнт и экстремальные углы): Свободный выбор оружия + динамическое
    смещение зоны укрытий на край крыши с риском падения в бездну.'
  meta_progression:
  - 'Рейтинговая лестница ''Крыша Мегаполиса'': 6 ранговых лиг (Стажер высотки ->
    Монтажник -> Стрелок шпиля -> Снайпер заката -> Мастер контр-стрейфа -> Властелин
    Крыш) с открытием новых дуэльных небоскребов.'
  - 'Арсенал кастомизации оружия: 24 уникальных скина на Desert Eagle, AK-47 и AWP
    (текстуры карбона, дамасской стали, неонового хрома с физическими PBR-бликами
    закатного солнца).'
  - 'Косметика триумфа: Разблокировка кастомных шлемов соперников (золотой шлем, шлем
    спецназа, кибер-визор) и уникальных звуковых эффектов хедшота (''Хрустальный звон'',
    ''Тяжелый наковальный удар'', ''Лазерный щелчок'').'
  - 'Перчатки и часы дуэлянта: Тактические перчатки с кастомной анимацией осмотра
    оружия (Inspect Weapon) при нажатии клавиши F / свайпе вверх.'
  mechanics:
  - name: Контр-стрейф с активным гашением инерции (Precision Counter-Strafe)
    role_in_loop: двигатель
    player_decision: В какой миллисекундный тайминг нажать противоположную клавишу
      движения (D при движении влево на A), чтобы зафиксировать скорость в 0.0 м/с
      ровно на линии прицела головы
    input_mapping: 'Клавиатура: отпускание A + мгновенный тап D (или наоборот); Тачскрин:
      резкий свайп стика локомоции в противоположную сторону с отпусканием в центр'
    states:
    - 'STATE_MOVING: Игрок движется вбок со скоростью 6.2 м/с, разброс оружия 14.5°,
      прицел расширен'
    - 'STATE_ACTIVE_BRAKING: Нажата противоположная клавиша, ускорение торможения
      54.0 м/с², таймер 0.08 с'
    - 'STATE_PINPOINT_ZERO: Скорость < 0.2 м/с, перекрестие мгновенно сжимается в
      точку 0.05 MoA, активировано окно ван-тапа'
    - 'STATE_OVERSHOOT: Игрок передержал контр-клавишу более 0.12 с, началось движение
      в обратную сторону, разброс вновь вырос до 14.5°'
    parameters:
    - name: Время активного гашения скорости (t_counter_stop)
      value: 0.08 с
      tuning_note: Если увеличить до 0.20 с — игра превратится в «ватный» медленный
        шутер; если уменьшить до 0.02 с — исчезнет скилл-чекинг тайминга контр-стрейфа.
    - name: Максимальная скорость стрейфа (V_max)
      value: 6.2 м/с
      tuning_note: Если увеличить — пикающий игрок получит непреодолимое преимущество
        (peeker's advantage); если уменьшить — пики станут легкой добычей для стоячего
        кемпера.
    - name: Порог точности нулевой скорости (V_accuracy_threshold)
      value: 0.35 м/с
      tuning_note: Если сделать строже (<0.1 м/с) — на тачскрине будет невозможно
        стрелять; если сделать мягче (>1.5 м/с) — обесценится механика остановки.
    - name: Окно идеального выстрела после остановки (t_perfect_window)
      value: 0.22 с
      tuning_note: Время до того, как стоячего дуэлянта срежет реакция противника.
        Увеличение делает игру казуальной, уменьшение — хардкорным пиксель-хантингом.
    feedback_layers:
    - 'Визуал/VFX: Динамическое 4-сегментное перекрестие прицела сжимается с легким
      эффектом магнитной привязки; под ногами персонажа на металлонастиле высекаются
      короткие искры торможения подошв'
    - 'Звук (Web Audio): Приглушенный металлический скрежет подошв о стальной настил
      крыши (частота 1200 Гц, спад за 60 мс) и щелчок готовности затвора'
    - 'Камера (импульс/зум): Микро-толчок FOV камеры (FOV 90° -> 88° -> 90° за 70
      мс) с мгновенной стабилизацией горизонта без покачивания'
    - 'UI/Тактильность: Короткий виброотклик (haptic pulse 15 мс) на мобильных устройствах
      при достижении 0.0 м/с и подсветка центральной точки прицела неоновым зеленым
      цветом'
    failure_mode: 'Игрок нажимает спуск на бегу (до завершения контр-стрейфа) -> пуля
      улетает в небо с отклонением 12°, трассер рисует дугу мимо врага, а на прицеле
      загорается красный индикатор ''INACCURATE: MOVING''.'
    mastery_curve: Новичок на 30-й секунде останавливается по инерции (накатом за
      0.34 с) и умирает от бота; мастер на 10-м матче инстинктивно жмет контр-тап
      за 80 мс и поражает цель первым же кадром после остановки.
    counterplay: 'Адаптивный бот читает монотонный ритм стрейфов: если игрок пикает
      из одной точки с одинаковым таймингом, бот ставит префайр в кромку укрытия ровно
      на 80-й миллисекунде выхода.'
    synergies:
    - 'Ван-Тап хедшот со срывом каски: идеальный контр-стрейф — единственное условие
      для 100% точности попадания в хитбокс каски'
    - 'Позиционный пик и пред-прицеливание: контр-стрейф завершает фазу выхода из-за
      строительной балки'
    why_unique: В отличие от большинства мобильных шутеров, где персонаж стреляет
      с автонаводкой или на полном ходу, здесь реализована бескомпромиссная физическая
      модель контр-импульса source-шутеров, адаптированная под сверхбыстрый веб-геймплей.
    pseudocode: "function tickMovement(input, player, dt):\n  if input.opposite_strafe_pressed\
      \ and player.speed > 0.0:\n    player.velocity -= player.strafe_dir * (54.0\
      \ * dt)\n    if dot(player.velocity, player.strafe_dir) <= 0:\n      player.velocity\
      \ = Vector3.Zero()\n      player.is_perfect_stop = true\n      triggerHaptic(15)\n\
      \      playAudio('foot_brake_steel', 0.6)\n  player.current_spread = lerp(0.05,\
      \ 14.5, player.velocity.length() / 6.2)"
  - name: Ван-Тап хедшот со срывом каски (One-Tap Helmet Knockoff)
    role_in_loop: источник награды
    player_decision: Произвести ли выстрел в рискованный хитбокс головы (100% мгновенный
      килл со срывом каски) или надежно выстрелить в корпус (потребуется 3 попадания,
      высокий риск погибнуть от ответного ван-тапа)
    input_mapping: 'ПК: Клик Левой Кнопки Мыши (ЛКМ); Мобильные: Тап по правой половине
      экрана / выделенной кнопке огня'
    states:
    - 'STATE_READY: Оружие готово к выстрелу, патрон в патроннике'
    - 'STATE_RAYCAST_CHECK: Мгновенная трассировка луча по BVH-модели противника с
      разделением хитбоксов (Head, Torso, Legs)'
    - 'STATE_HELMET_DETACH: Попадание в Head: генерация физ-объекта шлема с импульсом
      от вектора пули, запуск снопа золотых искр'
    - 'STATE_SLOWMO_TRIUMPH: Активация замедления времени 0.3x на 0.35 секунды для
      наслаждения моментом триумфа'
    parameters:
    - name: Радиус хитбокса головы (r_head_hitbox)
      value: 0.11 м
      tuning_note: Если увеличить до 0.16 м — хедшоты станут случайными и обесценят
        скилл; если уменьшить до 0.07 м — дуэли превратятся в бесконечную фрустрацию.
    - name: Длительность Slow-mo триумфа (t_slowmo)
      value: 0.35 с
      tuning_note: Если увеличить — собьется динамика сверхбыстрого матча; если убрать
        — игрок не успеет рассмотреть отлетающую в бездну каску.
    - name: Урон в голову Desert Eagle (dmg_headshot)
      value: 140 HP
      tuning_note: Гарантирует 1-hit-kill против базовых 100 HP противника даже через
        легкую преграду.
    - name: Физический импульс отрыва каски (p_helmet_impulse)
      value: 18.5 кг*м/с
      tuning_note: Задает кинематографичную параболу полета каски в сторону заката
        над крышей.
    feedback_layers:
    - 'Визуал/VFX: Физическая 3D-модель каски срывается с головы бота и кружится в
      воздухе; сноп из 45 золотых PBR-искр и вспышка пороховых газов на дульном срезе'
    - 'Звук (Web Audio): Сокрушительный металлический звон ''ДЗЫНЬ!'' (с резонансом
      на 2.4 кГц и эхом высотки) + сочный басовый панч выстрела Deagle (70 Гц)'
    - 'Камера (импульс/зум): Резкий кинематографичный микро-зум (FOV 90° -> 84° за
      40 мс) с радиальным размытием (Radial Blur 0.25) по краям экрана'
    - 'UI/Тактильность: Мощный сдвоенный виброотклик (haptic kick 45 мс) и появление
      золотого черепа с надписью ''ONE-TAP'' по центру экрана'
    failure_mode: Попадание в корпус вместо головы наносит лишь 35 урона -> враг не
      умирает, каска остается на месте, а противник мгновенно ставит ответный хедшот
      в открывшегося игрока.
    mastery_curve: Новичок целится в центр силуэта и проигрывает по таймингу; мастер
      держит микро-прицел строго на уровне горизонта голов (Head-Level Y=1.65м) и
      щелкает ван-тапы за 120 мс.
    counterplay: Соперник использует микро-приседания (crouch-peek) и джог-движения,
      сбивая фиксированную высоту головы на 0.35 метра.
    synergies:
    - 'Контр-стрейф с гашением инерции: без нулевой скорости разброс не позволит попасть
      в хитбокс 0.11 м'
    - 'Позиционный пик и пред-прицеливание: обеспечивает первичное наведение на точку
      появления каски'
    why_unique: Каждый хедшот — это физический мини-спектакль с отрывом экипировки,
      кинематографичным звуком и слоу-мо в духе лучших хайлайтов профессиональной
      сцены.
    pseudocode: "function processShotRaycast(ray, enemy):\n  hit = raycastBVH(ray,\
      \ enemy.mesh)\n  if hit and hit.bone == 'HEAD':\n    detachHelmetWithImpulse(enemy,\
      \ ray.direction * 18.5)\n    spawnSparks(hit.point, count=45, color=0xffd700)\n\
      \    playAudio('headshot_dzyнь_heavy', 1.0)\n    startSlowMotion(scale=0.3,\
      \ duration=0.35)\n    triggerHapticPulse('heavy_double')\n    enemy.takeDamage(140)\n\
      \    return ROUND_WIN"
  - name: Позиционный пик и пред-прицеливание (Angle Peeking & Pre-Aim)
    role_in_loop: источник риска
    player_decision: 'Какой угол выхода выбрать: узкий пик от балки с минимальным
      открытием тела или широкий стрейф-выход (Wide-Peek), чтобы сорвать пре-эим кемперящего
      противника'
    input_mapping: 'Клавиатура: сочетание A/D с кратковременным Shift (медленный бесшумный
      подход) или пробелом; Тачскрин: амплитуда отклонения аналогового стика'
    states:
    - 'STATE_CONCEALED: Игрок полностью скрыт за геометрией балки/вентшахты, линия
      видимости (LOS) разорвана'
    - 'STATE_PEEKING_EDGE: Камера пересекает край укрытия, открывается обзор на расчетную
      позицию противника'
    - 'STATE_EXPOSED: Полный выход на открытое пространство крыши, игрок виден сопернику'
    - 'STATE_JIGGLE_BAIT: Быстрый микро-шаг наружу и мгновенный возврат назад для
      провокации выстрела соперника в молоко'
    parameters:
    - name: Ширина стандартного укрытия (w_pillar)
      value: 1.2 м
      tuning_note: Определяет дистанцию стрейфа, необходимую для полного выхода из
        тени укрытия.
    - name: Высота линии горизонта голов (y_head_level)
      value: 1.65 м
      tuning_note: Фиксированная константа арены; малейшее отклонение прицела по вертикали
        требует времени на доводку.
    - name: Тайминг jiggle-пика (t_jiggle_cycle)
      value: 0.24 с
      tuning_note: Если увеличить — игрок не успеет спрятаться до ответного выстрела
        бота; если уменьшить — плечо персонажа не покажется из-за угла.
    - name: Штраф к скорости при задевании края укрытия
      value: 0.0 м/с (скользящий коллайдер)
      tuning_note: Идеально гладкие физические материалы предотвращают застревание
        игрока в геометрии при стрейфе.
    feedback_layers:
    - 'Визуал/VFX: Тени от конструкций крыши динамически падают на оружие; при появлении
      силуэта врага срабатывает легкое контурное свечение краев модели (Rim Light)'
    - 'Звук (Web Audio): Направленное 3D-аудио шагов (PannerNode): глухой стук по
      бетону сменяется звонким гулом по стальному настилу у кромки'
    - 'Камера (импульс/зум): Легкий наклон камеры на 1.5° (Cam Roll) в сторону направления
      стрейфа для усиления кинематики выхода'
    - 'UI/Тактильность: Микро-щелчок тактильности при пересечении линии видимости
      (LOS) с противником'
    failure_mode: Игрок выходит на широкий пик без предварительного наведения прицела
      в точку спавна -> тратит 250 мс на поиск цели глазами и получает ван-тап от
      готового соперника.
    mastery_curve: Новичок выходит из-за стены с прицелом в пол и начинает целиться
      после выхода; мастер ставит прицел сквозь стену в расчетную точку головы еще
      до нажатия клавиши стрейфа.
    counterplay: Бот меняет глубину укрытия (глубокий холд / агрессивный пик в упор)
      и использует ложные звуковые шаги.
    synergies:
    - 'Контр-стрейф с гашением инерции: пик без контр-стрейфа гарантирует промах из-за
      накопленной скорости'
    - 'Таймер форсированного контакта: не позволяет бесконечно стоять за укрытием'
    why_unique: Геометрия крыши и расстановка двутавровых балок спроектированы по
      золотому стандарту соревновательных дуэльных аим-карт, исключая случайные слепые
      зоны.
    pseudocode: "function updateAnglePeeking(player, obstacles, enemy):\n  los = checkLineOfSight(player.eye_pos,\
      \ enemy.head_pos, obstacles)\n  if los.clear and not player.was_visible:\n \
      \   player.was_visible = true\n    playSpatialAudio('enemy_breath_wind', enemy.position)\n\
      \    if player.aim_vector.angleTo(los.direction) < 0.04:\n      player.is_pre_aimed\
      \ = true"
  - name: Таймер форсированного контакта (15-Second Rooftop Pressure)
    role_in_loop: тормоз
    player_decision: Форсировать агрессивный пик на первых секундах или выждать ошибку
      оппонента, рискуя попасть под катастрофический прессинг последних 3 секунд
    input_mapping: 'Пассивно-системная механика: управляет динамикой матча через визуальный
      и аудио-пейсинг'
    states:
    - 'STATE_CALM (15–10 с): Стандартное состояние, фоновый эмбиент ветра на крыше'
    - 'STATE_URGENCY (10–4 с): Звук учащенного сердцебиения дуэлянта, нарастание тревожной
      виолончели'
    - 'STATE_CRITICAL (4–0 с): Экран пульсирует красным виньетированием, бот идет
      в ва-банк, при 0.00 с — фиксация Draw-Loss для обоих'
    parameters:
    - name: Длительность раунда (t_round_max)
      value: 15.0 с
      tuning_note: Если увеличить до 30 с — дуэли потеряют адреналин и станут скучными;
        если уменьшить до 8 с — игроки не успеют выполнить даже один тактический маневр.
    - name: Порог критического давления (t_critical_threshold)
      value: 4.0 с
      tuning_note: Запускает панический звуковой таймер и активирует агрессивный раш
        бота.
    - name: Штраф за ничью по таймеру (Draw-Loss Penalty)
      value: -50 очков рейтинга обоим
      tuning_note: Исключает стратегию пассивного затягивания времени и кемпинга.
    feedback_layers:
    - 'Визуал/VFX: Цифровой неоновый таймер по центру вверху экрана; при t < 4 с цифры
      вспыхивают алым пламенем с эффектом глитча'
    - 'Звук (Web Audio): Учащающийся стук сердца (BPM растет с 80 до 160) + нарастающий
      высотный гул ветра и тиканье часового механизма'
    - 'Камера (импульс/зум): Пульсирующее виньетирование (Vignette intensity 0.0 ->
      0.5) в такт ударам сердца'
    - 'UI/Тактильность: Нарастающая ритмичная вибрация устройства на последних 3 секундах
      раунда'
    failure_mode: Игрок боится выходить из-за укрытия и ждет до 0.0 с -> звучит гонг
      поражения за пассивность, раунд засчитывается как проигрыш.
    mastery_curve: Новичок паникует на 5-й секунде и совершает суицидальный забег;
      мастер точно знает, что на выход и ван-тап требуется ровно 0.35 с, и хладнокровно
      пикает на 14.2 секунде.
    counterplay: При приближении к 0 с ИИ бота переходит в режим отчаянного пуша,
      меняя позицию с предсказуемой на агрессивную.
    synergies:
    - 'Контр-стрейф с гашением инерции: таймер заставляет исполнять контр-стрейф под
      колоссальным психологическим давлением'
    - 'Позиционный пик и пред-прицеливание: ограничивает время на поиск идеального
      угла'
    why_unique: Правило Draw-Loss (поражение обоим за пассивность) полностью уничтожает
      бич дуэльных шутеров — бесконечный позиционный кемпинг.
    pseudocode: "function tickRoundTimer(match, dt):\n  match.time_left -= dt\n  if\
      \ match.time_left <= 4.0 and not match.is_critical:\n    match.is_critical =\
      \ true\n    startHeartbeatAudio(bpm=140)\n  if match.time_left <= 0.0:\n   \
      \ match.time_left = 0.0\n    triggerDrawLossBothPlayers()\n    playAudio('buzzer_defeat_shame',\
      \ 1.0)"
  - name: Прострел легких укрытий и джог-пик (Wallbang & Jiggle-Bait)
    role_in_loop: источник риска
    player_decision: Попытаться пробить тонкий профлист строительных лесов префайром
      (нанеся 65% урона) или сохранить боезапас и выманить соперника на ложный шаг
      (джог-пик)
    input_mapping: 'Клавиатура: мгновенное микро-касание A с последующим D без открытия
      силуэта; клик ЛКМ в контур за профлистом; Тачскрин: двойной микро-тап по краю
      экрана'
    states:
    - 'STATE_BEHIND_PENETRABLE: Игрок за деревянным щитом / профлистом толщиной до
      0.15 м'
    - 'STATE_PENETRATION_RAY: Выстрел сквозь материал: пуля теряет 35% скорости и
      40% урона, но сохраняет летальность в голову'
    - 'STATE_BAIT_TRIGGERED: Противник среагировал на мелькнувшее плечо и выстрелил
      в молоко, войдя в кулдаун сброса отдачи'
    parameters:
    - name: Коэффициент пробития легких материалов (k_wallbang)
      value: 0.65 (65% урона)
      tuning_note: Ван-тап через профлист из Deagle наносит 140 * 0.65 = 91 HP (критично
        ранит, требуя добивания), из AWP — 100% летально.
    - name: Максимальная толщина пробиваемого объекта (d_max_penetration)
      value: 0.20 м
      tuning_note: Стальные двутавры непробиваемы (0% урона), строительные фанерные
        щиты и профнастил пробиваемы.
    - name: Задержка сброса отдачи Deagle после выстрела (t_deagle_reset)
      value: 0.42 с
      tuning_note: Окно уязвимости промахнувшегося врага, которое наказывает забайтивший
        игрок.
    feedback_layers:
    - 'Визуал/VFX: Отверстие от пули в профлисте с эффектом разлетающейся стружки/щепок
      и клубов строительной пыли; трассер пули искрит на выходе'
    - 'Звук (Web Audio): Глухой треск пробиваемого дерева / звонкий скрежет прошиваемого
      тонкого металла с демпфированием свиста пули'
    - 'Камера (импульс/зум): Легкий низкочастотный импульс дрожания камеры (Shake
      0.15) при попадании пули рядом с игроком сквозь стену'
    - 'UI/Тактильность: Индикатор маркера попадания сквозь преграду (полупрозрачный
      перечеркнутый крестик Wallbang Hit)'
    failure_mode: Игрок пытается прострелить бетонную колонну или стальной двутавр
      -> 0 урона, демаскировка позиции, трата драгоценного патрона и раскрытие тайминга
      пика.
    mastery_curve: Новичок прячется за любым объектом, считая его монолитом; мастер
      читает материалы крыши и уничтожает кемперов префайром сквозь деревянные настилы.
    counterplay: Опытный дуэлянт не ведется на первое мелькание плеча (джог) и стреляет
      только при подтверждении полного контр-стрейфа цели.
    synergies:
    - 'Позиционный пик и пред-прицеливание: дает понимание, куда именно за тонким
      щитом направлен прострел'
    - 'Ван-Тап хедшот со срывом каски: позволяет сорвать каску даже через легкую преграду
      мощным калибром'
    why_unique: Материалоемкая физическая модель прострелов превращает укрытия на
      крыше из бинарных 'стенок' в динамические тактические слои.
    pseudocode: "function checkPenetrationShot(ray, obstacle, enemy):\n  if obstacle.material.is_penetrable\
      \ and obstacle.thickness <= 0.20:\n    exit_ray = calculateRayExit(ray, obstacle)\n\
      \    spawnDebrisVFX(exit_ray.origin, obstacle.material.type)\n    playAudio('wallbang_penetrate_'\
      \ + obstacle.material.type, 0.8)\n    hit_enemy = raycastBVH(exit_ray, enemy.mesh)\n\
      \    if hit_enemy:\n      dmg = (hit_enemy.bone == 'HEAD' ? 140 : 35) * 0.65\n\
      \      enemy.takeDamage(dmg)"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 60
  max_triangles_or_sprites: 35000
  bundle_size_budget_mb: 4.0
  layers:
  - description: Three.js Scene, Camera, PBR Shaders, Post-processing (Vignette, Bloom
      for sunset), HUD Canvas
    name: Presentation
  - description: Movement Controller, Counter-Strafe Math, Weapon Recoil, Ballistics
      BVH Raycasting, AI Duelist FSM
    name: Simulation
  - description: Match BestOf5 State, Player Profile, Economy, Weapon Stats, ELO Calculator
    name: Domain
  - description: Playgama Bridge SDK, Storage Adapter (Local + Cloud), Web Audio Synthesizer,
      Input Manager
    name: Infrastructure
  modules:
  - name: FPSController
    purpose: Управление камерой от первого лица, обработка ввода мыши/тача, физика
      контр-стрейфа
  - name: WeaponSystem
    purpose: Модели оружия от первого лица (Viewmodel), анимации отдачи, выброс гильз,
      расчет точности и разброса
  - name: BVHCollision
    purpose: Пространственное индексирование хитбоксов через three-mesh-bvh для честных
      хедшотов на 60 FPS
  - name: AIDuelist
    purpose: Конечный автомат поведения соперника с реалистичным временем реакции,
      стрейфами и пре-аимом
  - name: AudioCore
    purpose: Пространственный 3D звук выстрелов, шагов и сочный звон сбития каски
      через Web Audio API
  - name: MatchDirector
    purpose: Контроль раундов Best of 5, таймера 15 секунд, начисления очков и смены
      позиций
  - name: BridgeService
    purpose: 'Взаимодействие с Playgama SDK: реклама, сохранения, лидерборды, баннеры'
monetization:
  strategy_summary: 'Гибридная ненавязчивая монетизация: косметика оружия (скины,
    гравировки), кастомизация перчаток, дуэльный баттл-пасс и просмотр вознаграждаемой
    рекламы (Rewarded Video) для удвоения наград за победные серии и открытия редких
    кейсов.'
  rewarded_placements:
  - id: double_victory_reward
    name: Удвоение награды за матч
    benefit: Удваивает заработанные золотые слитки за выигранный матч Best of 5
    cooldown_or_limit: Без ограничений
    trigger_moment: Экран финальной победы в матче
  - id: free_weapon_case
    name: Дуэльный кейс со скином
    benefit: Бесплатное открытие элитного оружейного кейса с редким скином Desert
      Eagle или AK-47
    cooldown_or_limit: 1 раз в 10 минут
    trigger_moment: Главное меню / Раздел 'Оружейная'
  - id: rank_shield
    name: Защита рейтинга (Shield)
    benefit: Предотвращает потерю ELO-рейтинга при поражении в решающем 5-м раунде
      (счет 2:3)
    cooldown_or_limit: 2 раза в день
    trigger_moment: Экран поражения при счете 2:3
  interstitial_placements:
  - trigger_event: Завершение матча Best of 5
    cooldown_seconds: 90
    conditions: Показывается только между матчами, не чаще 1 раза в 90 секунд, никогда
      не прерывает активный раунд дуэли.
  in_app_purchases:
  - sku: vip_duelist_pass
    name: Пропуск Элитного Дуэлянта
    description: Доступ ко всем уникальным скинам оружия, золотым гильзам и отключению
      обязательной рекламы
    price_tier: Tier 2 ($2.99 / 249 руб)
    reward: VIP статус + 500 золотых слитков + скин 'Кровавый Закат' для Deagle
  - sku: gold_pack_medium
    name: Мешочек Золотых Слитков (1200)
    description: Пакет валюты для покупки любых скинов и перчаток в оружейной
    price_tier: Tier 1 ($0.99 / 99 руб)
    reward: 1200 золотых слитков
  fairness_rules:
  - Все оружие доступно бесплатно и обладает строго одинаковыми боевыми характеристиками
    для всех игроков (Pay-to-Skin, no Pay-to-Win).
  - Реклама никогда не запускается во время активного 15-секундного раунда дуэли.
  - Игрок всегда может закрыть экран предложения награды за 1 клик без скрытых таймеров.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - game distribution
  - web
  initialization_flow:
  - 1. bridge.initialize() при старте HTML-страницы
  - 2. Проверка доступности платформы и авторизации игрока
  - 3. Загрузка облачных данных игрока через bridge.storage.get() (ранг, инвентарь
    скинов, статистика)
  - 4. Инициализация звукового контекста по первому пользовательскому взаимодействию
  - 5. bridge.platform.sendMessage('game_ready') после готовности 3D сцены
  cloud_save_keys:
  - player_elo_rating
  - unlocked_skins
  - equipped_weapon_skin
  - total_wins
  - total_headshots
  - duelist_coins
  - audio_settings
  - touch_sensitivity
  leaderboards:
  - global_elo_ladder (Рейтинг дуэлянтов)
  - most_headshots_all_time (Топ стрелков по хедшотам)
  - win_streak_record (Рекорд победных серий подряд)
  ads_integration:
    banner_supported: true
    interstitial_cooldown: 90
    rewarded_retry_count: 3
  lifecycle_hooks:
  - bridge.game.on('visibility_change', (isVisible) => handlePause(isVisible))
  - bridge.advertisement.on('rewarded_reward', () => grantPlayerReward())
  - bridge.advertisement.on('interstitial_state_change', (state) => muteAudioOnAd(state))
