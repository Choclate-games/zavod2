gameplay_systems:
- name: Баллистика и регистрация попаданий (Raycast Hitscan & Hitboxes)
  purpose: Расчет траекторий пуль, спрея, пробития укрытий и мгновенной регистрации
    хэдшотов
  input: Координаты прицела, вектор взгляда камеры, скорость движения персонажа, клик
    огня
  rules:
  - Кучность выстрела максимальна в состоянии покоя и резко падает при движении
  - Попадание в голову наносит 4x урон (one-tap lethal damage для AK-47 и AWP)
  - Пробитие дерева снижает урон на 40%
  state:
  - Текущий разброс (Spread)
  - Счетчик непрерывной очереди (BurstCount)
  - Таймер восстановления точности
  interactions: Взаимодействует с физическими хитбоксами ботов и разрушаемыми деревянными
    укрытиями
  feedback: Вспышка дула, выброс гильзы, звук попадания/рикошета, появление отверстия
    от пули на поверхности
  edge_cases:
  - Выстрел в край препятствия при движении персонажа (суб-шаговая интерполяция луча)
  - Одновременное попадание двух пуль при размене (оба игрока получают урон в один
    кадр)
- name: Искусственный интеллект тактических ботов (Tactical Cover & Peeking AI)
  purpose: Управление поведением союзников и противников в формате 3v3 ретейка
  input: Координаты звуков шагов, маркеры союзников, таймер C4, точки укрытий на карте
    Dust 2
  rules:
  - Боты удерживают прицел на высоте головы в ожидании выхода противника (Crosshair
    Placement)
  - Боты реагируют на шум шагов и звук начала дефьюза бомбы C4
  - Боты распределяют сектора обороны точки A/B и не толпятся в одной точке
  state:
  - Патрулирование/Оборона
  - Выход на угол (Peeking)
  - Огневой контакт (Combat Spray)
  - Штурм C4 / Дефьюз
  interactions: Взаимодействует с навигационной сеткой NavMesh, системой звука и объектом
    C4
  feedback: Звуки шагов ботов, голосовые радиокоманды («Enemy spotted», «Covering
    Plant A»), дульные вспышки
  edge_cases:
  - Потеря прямой видимости игрока при броске дымовой шашки (переход на стрельбу по
    звуку)
  - Остался 1 бот против 3 врагов (переход в режим скрытного перетягивания)
- name: Система таймера и обезвреживания C4 (Bomb & Objective System)
  purpose: Управление 35-секундным таймером бомбы, механикой дефьюза и фейк-дефьюза
  input: Удержание клавиши действия 'E' / кнопки дефьюза в радиусе 2 метров от бомбы
  rules:
  - Таймер бомбы C4 составляет ровно 35.0 секунд от момента спавна в ретейке
  - Время разминирования составляет 10.0 секунд без набора и 5.0 секунд с Defuse Kit
  - Начало разминирования издает отчетливый звуковой сигнал, слышимый всем игрокам
    поблизости
  state:
  - Бомба активирована (Plant Active)
  - Процесс разминирования (Defusing)
  - Обезврежена (Defused)
  - Взорвана (Detonated)
  interactions: Взаимодействует с таймером раунда, контроллером игрока и системой
    условий победы
  feedback: Ускоряющийся писк зуммера C4, круговой прогресс-бар разминирования, яркая
    вспышка взрыва
  edge_cases:
  - Попытка дефьюза за 0.1 секунды до взрыва (детонация прерывает дефьюз)
  - Убийство сапёра на 4.9 секунде дефьюза (прогресс мгновенно сбрасывается)
- name: Адаптивное мобильное управление и контр-стрейф (Touch FPS Controller)
  purpose: Обеспечение соревновательного комфорта и честного контр-стрейфа на тачскринах
  input: Сенсорные координаты левой половины (движение) и правой половины (обзор/огонь)
  rules:
  - Левая зона отвечает за перемещение; отрыв пальца мгновенно останавливает персонажа
    (авто-контр-стрейф)
  - Правая зона обеспечивает плавное наведение прицела без виртуального стика
  - Кнопка огня плавает в удобной зоне большого пальца правой руки
  state:
  - Сенсорный ввод активен
  - Фаза мгновенной остановки
  - Стрельба с удержанием кнопки
  interactions: Транслирует сенсорные жесты в углы поворота камеры Three.js и вектор
    движения Rapier3D
  feedback: Визуальный отклик нажатия кнопок, вибрация устройства при стрельбе, маркер
    контр-стрейфа
  edge_cases:
  - Выход пальца за пределы экрана при быстром повороте камеры (бесшовный захват тача)
  - Одновременное касание перемещения, прицела и кнопки огня (мультитач до 3 пальцев)
core_design:
  signature_moment: Спецназовец остаётся 1v2 на точке A карты Dust 2. Таймер C4 отсчитывает
    последние 7 секунд до взрыва (зуммер пищит с частотой 4 Гц). Игрок запускает фейк-дефьюз
    (клик 'Е' на 0.2 с со звуком щелчка проводов), мгновенно прерывает его, делает
    контр-стрейф влево и ван-тапом из AK-47 ставит хэдшот выбежавшему из-за ящиков
    Гуся террористу (хруст шлема, красная плашка в киллфиде). Не теряя ни доли секунды,
    он зажимает дефьюз с набором сапёра (5.0 с) сквозь клубы рассеивающегося серого
    дыма и обезвреживает бомбу на отметке 0.4 секунды до детонации под триумфальный
    победный аккорд раунда!
  genre_template_rejected: 'Отвергнут шаблон длительной экономической меты (Full Eco
    / Save раунды, покупка брони/оружия в меню магазина 15 секунд, 45-минутные матчи)
    и аркадный ''Run-and-Gun'' с мобильным авто-аимом. В веб-3D шутере долгая закупка
    и беготня от спавна убивают динамику сессии. Вместо этого используется мгновенный
    спавн сразу в боевую ретейк-позицию на точке A или B Dust 2 с фиксированным сбалансированным
    лоадаутом (AK-47 / M4A4 / AWP, гранаты, дефьюз-кит) и бескомпромиссная баллистика:
    попадание на бегу невозможно из-за колоссального разброса, требуя от игрока чистого
    навыка контр-стрейфа и дисциплины стрельбы.'
  what_makes_it_different: 'Концентрация 100% игрового времени на кульминации раунда
    — 30-секундном штурме/защите установленной бомбы C4 (Retake Scenario). В отличие
    от классических клонов CS, где 70% времени уходит на раскидки и перетяжки, здесь
    каждый раунд начинается с готовой тактической геометрии: террористы удерживают
    плент (Crossfire, Goose, Catwalk), спецназ атакует с двух направлений (Short,
    Long, CT-Spawn), C4 уже тикает (35.0 с). Высокоточная физика контр-стрейфа (сброс
    скорости с 250 units/s до 0 за 0.08 с), динамический прицел, учитывающий ускорение
    игрока, и честный Raycast-прострел укрытий с учетом плотности материалов создают
    аутентичный соревновательный микро-скилл CS прямо в WebGL.'
  micro_loop:
  - step: Выход на угол и звуковая локализация
    player_action: Движение стрейфом (клавиши A/D или левый стик) к срезу угла (например,
      Long Doors или A-Short), слушая шаги врага
    game_response: Стерео-звук шагов террориста по песку/бетону (3D Spatial Audio),
      увеличение перекрестия динамического прицела из-за скорости
    decision: Выйти широким пиком (Wide Peek) или аккуратно чекнуть ближний угол коротким
      шагом (Jiggle Peek)
    duration: 1.0–2.0 с
  - step: Контр-стрейф и мгновенная стабилизация
    player_action: Резкое нажатие противоположной клавиши движения (D при движении
      влево) для экстренного гашения скорости до 0
    game_response: Скорость падает ниже порога 34 units/s (0.85 м/с), перекрестие
      прицела схлопывается в точку, разброс первого выстрела снижается до 0 MOA
    decision: Стрелять одиночным ван-тапом в голову или зажать контролируемую отсечку
      из 3-4 пуль
    duration: 0.08–0.2 с
  - step: Прицельный выстрел и контроль спрея
    player_action: Клик ЛКМ / тап кнопки огня с одновременным микро-ведением мыши/пальца
      вниз-влево для компенсации подъема ствола
    game_response: Raycast-трассировка пули, вылет гильзы, дульная вспышка, отдача
      камеры (Pitch +1.8°), попадание в хитбокс головы с хрустом шлема (108 урона)
    decision: Продолжить спрей во второго врага или уйти за укрытие на перезарядку/смену
      угла
    duration: 0.3–1.0 с
  - step: Реакция на результат дуэли и смена позиции
    player_action: Уход за ящик/стену, оценка мини-карты и оставшегося времени C4
    game_response: Красная плашка в киллфиде (+1 килл), учащение тиканья зуммера C4
      (звуковой сигнал дедлайна)
    decision: Бросить смок на простреливаемую позицию или сразу начать сближение с
      C4 для дефьюза
    duration: 1.5–3.0 с
  meso_loop:
  - step: Инициализация ретейк-сценария
    player_action: Оценка выданной позиции спавна (A-Long / Short / CT-Spawn) и лоадаута
      (AK-47 / Defuse Kit / Smoke)
    game_response: Обратный отсчет 1.5 с фризтайма, звуковой сигнал запуска таймера
      C4 (35.0 с до детонации), отрисовка маркера бомбы на пленте
    decision: По какому тактическому вектору штурмовать точку и какую гранату отдать
      первой
    duration: 1.5–3.0 с
  - step: Зонирование и размен позиций
    player_action: Бросок дымовой гранаты для отсечения снайпера на CT-Spawn / Ramp
      и синхронный вход в плент
    game_response: Развертывание 12-секундной плотной дымовой завесы, подавление видимости,
      размен тиммейтов и ботов (3v3 -> 2v1)
    decision: Зачистить дальние укрытия (Goose/Pit) или форсировать борьбу за зону
      бомбы
    duration: 10.0–18.0 с
  - step: Клатч-кульминация и разминирование C4
    player_action: Ликвидация последнего защитника точки и удержание клавиши взаимодействия
      на C4
    game_response: Прогресс-бар дефьюза (5.0 с с китами / 10.0 с без), нарастающий
      высокочастотный писк зуммера бомбы
    decision: Дефьюзить до конца на тайминге или сделать фейк-дефьюз для провокации
      скрытого врага
    duration: 5.0–10.0 с
  - step: Финал раунда и смена счёта
    player_action: Просмотр статистики раунда (урон, хэдшоты, MVP)
    game_response: Оповещение 'Bomb Defused / Terrorists Win', обновление общего счёта
      матча (например, 2:1), начисление ранговых очков
    decision: Скорректировать тактику на следующий раунд с учетом поведения ботов
      соперника
    duration: 3.0–5.0 с
  macro_loop:
  - step: Вход в соревновательный матч
    player_action: Выбор стороны (Спецназ / Террористы) и запуск поиска матча формата
      Best of 5
    game_response: Генерация сида ретейк-сценариев на плентах A и B Dust 2, калибровка
      MMR ботов под ранг игрока
    decision: Выбрать агрессивный стиль штурмовика или позиционную роль замыкающего
      сапёра
    duration: 5.0–10.0 с
  - step: Серия из 5 тактических раундов до 3 побед
    player_action: 'Отыгрыш раундов со сменой точек закладки (раунд 1: Плент A, раунд
      2: Плент B, раунд 3: Плент A...)'
    game_response: 'Адаптация ИИ: боты начинают чаще контр-стрейфить, шифтить и простреливать
      дерево при росте счёта в пользу игрока'
    decision: Скорректировать выбор оружия при респавне (например, взять AWP для дальнего
      контроля Long)
    duration: 2.5–4.0 мин
  - step: Матч-поинт и итог матча
    player_action: Решающий клатч 5-го раунда, финальный выстрел или взрыв/дефьюз
      C4
    game_response: Экран триумфа 'VICTORY / DEFEAT', сводная таблица K/D/A, процент
      попаданий в голову (HS%)
    decision: Забрать награду за выполненные тактические контракты и открыть кейс
      мастерства
    duration: 10.0–20.0 с
  - step: Мета-прогрессия и кастомизация
    player_action: Осмотр разблокированных скинов (AK-47 'Desert Rebel', AWP 'Dragon
      Lore (WebGL Edition)'), повышение ранга (от Silver IV до Global Elite)
    game_response: Анимация повышения рангового дивизиона, обновление таблиц лидеров,
      выдача новых контрактов
    decision: Запустить следующий матч для удержания победного винстрика или осмотреть
      инвентарь
    duration: 15.0–45.0 с
  loop_diagram: "       +-----------------------------------------------------------+\n\
    \       |             СПАВН В РЕТЕЙК-ПОЗИЦИИ (3v3)                  |\n      \
    \ |  Лоадаут: AK-47 / M4A4 / Смок / Дефьюз-кит | C4: 35.0 с   |\n       +-----------------------------+-----------------------------+\n\
    \                                     |\n                                    \
    \ v\n       +-----------------------------------------------------------+\n  \
    \     |             ТАКТИЧЕСКИЙ ВЫХОД И ЗОНИРОВАНИЕ               |\n       |\
    \  Бросок Smoke на Long/CT -> Звуковая разведка шагов       |\n       +-----------------------------+-----------------------------+\n\
    \                                     |\n                                    \
    \ v\n       +-----------------------------------------------------------+\n  \
    \     |         ДУЭЛЬ: КОНТР-СТРЕЙФ + КОНТРОЛЬ СПРЕЯ              |\n       |\
    \  Остановка (D/A) -> Сброс разброса -> Ван-тап в голову    |\n       +-----------------------------+-----------------------------+\n\
    \                                     |\n                                    \
    \ v\n       +-----------------------------------------------------------+\n  \
    \     |           КЛАТЧ: ФЕЙК-ДЕФЬЮЗ / ОБЕЗВРЕЖИВАНИЕ C4          |\n       |\
    \  Клик 'E' (звуковой блеф) -> Добивание -> Дефьюз за 5.0 с |\n       +-----------------------------+-----------------------------+\n\
    \                                     |\n                                    \
    \ v\n       +-----------------------------------------------------------+\n  \
    \     |             ИТОГИ РАУНДА И МАТЧА (Best of 5)              |\n       |\
    \  +1 Очко раунда -> Анализ HS% -> Ранг и Скины за скилл    |\n       +-----------------------------------------------------------+"
  tension_curve: 'Напряжение стартует с умеренно-высокого уровня (40%) на фризтайме
    благодаря тикающему таймеру C4 и мгновенной близости врага. В первые 5-12 секунд
    штурма при взаимном разбросе смоков и первых перестрелках напряжение подскакивает
    до 70%. Если погибают тиммейты и игрок остаётся в ситуации 1v2 (Clutch State)
    с менее чем 12 секундами на таймере C4, напряжение достигает пиковых 100%: звуковое
    окружение заглушается низкочастотным фильтром, пульс зуммера C4 бьет с частотой
    4 Гц, каждый промах смертелен. В момент успешного дефьюза бомбы на последних миллисекундах
    или ликвидации последнего врага напряжение мгновенно падает до 10%, сменяясь эйфорическим
    катарсисом победного джингла и экраном MVP.'
  core_formulas:
  - 'Скорость и точность контр-стрейфа: AccuracyPenalty = clamp((CurrentVelocity /
    MaxVelocity - 0.136) / 0.864, 0.0, 1.0) * BaseInaccuracy (где MaxVelocity = 250
    units/s, остановка за 0.08 с дает AccuracyPenalty = 0).'
  - 'Баллистический урон и множитель хитбоксов: FinalDamage = BaseWeaponDamage * HitboxMultiplier
    * ArmorPenetrationRatio * (1.0 - DistanceMeters * DistanceDropoffPerMeter) (AK-47:
    Base 36, Headshot x4.0 = 144 урона, мгновенный kill сквозь шлем).'
  - 'Прострел препятствий (Wallbang): PenetratedDamage = InitialDamage * SurfacePenetrationModifier^MaterialLayers
    * max(0.0, 1.0 - WallThicknessMeters / MaxPenetrationDepthMeters) (Деревянные
    двери Dust 2: удержание 60% урона, пробитие до 0.35 м).'
  - 'Тайминг детонатора и разминирования C4: RemainingTime = 35.0s - ElapsedTime;
    DefusalTimeRequired = HasDefuseKit ? 5.0s : 10.0s; ClutchMargin = RemainingTime
    - DefusalProgress (дефьюз успешен только если RemainingTime >= DefusalTimeRequired).'
  - 'Динамическая адаптация реакции ботов (MMR AI Scaling): BotReactionTimeMs = clamp(450.0
    - (PlayerWinStreak * 45.0) - (PlayerRankTier * 25.0), 180.0, 500.0) ms.'
  - 'Ранговый ELO-расчет за матч: DeltaRating = (MatchWon ? +25 : -20) + (HeadshotKillCount
    * 2) + (SuccessfulDefuseCount * 5) + (ClutchWonCount * 10).'
  run_progression:
  - 'Раундовая адаптация позиции: Выбор и закрепление приоритетного угла выхода (Long
    / Short / B-Tunnels) на основе разведки перемещений ботов в прошлых раундах.'
  - 'Тактический пул снаряжения раунда: Ротация случайных сбалансированных лоадаутов
    (Раунд 1: AK-47 + Smoke + Flash; Раунд 2: M4A4 + Defuse Kit + HE; Раунд 3: AWP
    + Desert Eagle).'
  - 'Накопление тактической уверенности (Momentum Meter): За серию из 2 хэдшотов подряд
    время визуального восстановления прицела после отдачи субъективно считывается
    чище за счёт более чёткого аудио-хитмаркера.'
  - 'Эволюция паттернов ИИ внутри матча: При счёте 2:0 в пользу игрока боты переходят
    из пассивного кемпинга в агрессивный контр-пик с префаером и флешками.'
  meta_progression:
  - 'Ранговая лестница мастерства (Competitive Tiers): 6 дивизионов (Silver -> Gold
    Nova -> Master Guardian -> Eagle -> Supreme -> Global Elite), рассчитываемых по
    честному ELO без пейтувина.'
  - 'Тактические контракты на мастерство: Задания типа ''Поставить 3 хэдшота с контр-стрейфа
    за один раунд'', ''Разминировать C4 за <1.0 с до взрыва'', ''Оформить Wallbang-килл
    сквозь двери мида''.'
  - 'Оружейный арсенал скинов (Skin Showcase): Разблокировка скинов оружия различной
    степени редкости (Covert, Classified, Mil-Spec) со счетчиком убийств StatTrak™.'
  - 'Шевроны и нашивки ветерана ретейка: Косметические знаки отличия в профиле игрока
    за серии побед (5, 10, 25 побед подряд) и клатчи 1v3.'
  mechanics:
  - name: Контр-стрейф и фиксация ствола (Counter-Strafing & Velocity Zeroing)
    role_in_loop: Фундаментальный двигатель боевой точности и тайминга дуэли.
    player_decision: В какой микро-момент прекратить движение и нажать противоположный
      стрейф, чтобы обнулить разброс строго перед нажатием на спуск.
    input_mapping: 'ПК: Нажатие клавиши ''D'' при беге влево (''A'') или отпускание
      ''A'' с тапом ''D''. Мобильные: Резкий свайп стика движения в противоположную
      сторону с отпусканием в центр.'
    states:
    - moving_full_speed (250 u/s, разброс max)
    - counter_strafing (активное торможение противоходом)
    - zero_velocity_locked (<34 u/s, разброс 0 MOA)
    - firing_spread_cooldown (восстановление стабильности)
    parameters:
    - name: Тайминг идеального контр-стрейфа
      value: 0.08 с
      tuning_note: Если увеличить до 0.25 с — стрельба станет вязкой и 'мыльной';
        если уменьшить до 0.02 с — исчезнет механический скилл остановки, игра превратится
        в аркадный run-and-gun.
    - name: Порог скорости нулевой неточности
      value: 34.0 units/s (0.85 м/с)
      tuning_note: Если поднять до 100 units/s — игроки смогут стрелять на бегу без
        наказания; если опустить до 5 units/s — любое микро-касание стика будет портить
        выстрел.
    - name: Максимальная скорость бега с AK-47
      value: 215.0 units/s (5.38 м/с)
      tuning_note: Если увеличить — пики из-за угла станут нечеловечески быстрыми
        (peeker's advantage); если уменьшить — персонаж покажется неповоротливым.
    - name: Штраф неточности на бегу
      value: 85.0 MOA
      tuning_note: Если уменьшить — пули будут случайно залетать в голову на бегу;
        если увеличить — при стрельбе на бегу пули будут улетать строго в пол/небо.
    feedback_layers:
    - 'Визуал/VFX: Динамические риски перекрестия прицела резко сжимаются в компактную
      точку при достижении порога остановки; на бегу прицел расширяется в 4 раза.'
    - 'Звук (Web Audio): Мгновенный тихий глухой шуршащий звук трения подошвы о песок/плитку
      (''scuff step'') в момент идеального торможения.'
    - 'Камера: Мгновенное гашение покачивания камеры (head bobbing) с легким микро-толчком
      вперед на 0.05 единиц по оси Z.'
    - 'UI/Тактильность: Короткий тактильный микро-отклик вибрации (10 мс) на мобильных
      устройствах в момент входа в зону нулевого разброса.'
    failure_mode: Игрок нажимает огонь до полной остановки (на скорости >34 u/s) —
      первая же пуля летит мимо цели на 1.5 метра в сторону, перекрестие прицела широко
      распахнуто, выдавая визуальный маркер ошибки тайминга.
    mastery_curve: Новичок на 30-й секунде стреляет во время бега и недоумевает, почему
      пули летят в молоко. Эксперт на 10-м матче делает jiggle-peek из-за угла с точностью
      до 2 кадров (33 мс), моментально выстреливая ровно одну пулю в пиксель головы
      врага и сразу уходя обратно в укрытие.
    counterplay: Боты высокой сложности считывают предсказуемые тайминги контр-стрейфа
      игрока и ставят прицел с пре-аимом на угол выхода, наказывая за повторный выход
      в той же позиции.
    synergies:
    - Компенсация спрей-паттерна и темповые отсечки
    - Баллистический прострел укрытий и физика материалов
    - Обезвреживание C4, звуковой блеф и клатч-тайминги
    why_unique: Честная физическая эмуляция механики Counter-Strike Source/GO с физикой
      трения и сбросом разброса без авто-наводки и искусственного занижения мобильной
      динамики.
    pseudocode: "function updateCounterStrafe(player, dt) {\n  const vel = player.body.velocity.length();\n\
      \  const isOppositePressed = (player.input.x * player.prevVelocity.x < 0);\n\
      \  if (isOppositePressed) player.body.velocity.multiplyScalar(0.2);\n  player.isInaccuracyZero\
      \ = (vel < 34.0);\n  player.crosshairSpread = player.isInaccuracyZero ? 0 :\
      \ (vel / 250.0) * 85.0;\n  if (player.isInaccuracyZero && !player.wasStable)\
      \ playScuffSound();\n  player.wasStable = player.isInaccuracyZero;\n}"
  - name: Компенсация спрей-паттерна и темповые отсечки (Recoil Spray Pattern & Burst
      Fire)
    role_in_loop: Источник риска при затяжной стрельбе и главный инструмент нанесения
      взрывного урона на средней дистанции.
    player_decision: Сделать ван-тап в голову, выпустить точную отсечку из 3 пуль
      или начать зажимать полный спрей с контролем формы 'семерки' при встрече с двумя
      врагами.
    input_mapping: 'ПК: Зажатие ЛКМ с плавным смещением мыши вниз (пули 1-6), затем
      влево (пули 7-15) и вправо (пули 16-30). Мобильные: Удержание правой кнопки
      огня с одновременным свайпом правого пальца по контуру отдачи.'
    states:
    - idle_weapon
    - tapping_single (1-я пуля, 100% точность)
    - burst_firing (2-4 пули, линейный подъем)
    - full_spray_control (5-30 пуль, горизонтальные колебания)
    - recoil_recovery (восстановление исходного угла ствола)
    parameters:
    - name: Вертикальный подъем ствола AK-47
      value: 2.4 градуса/выстрел
      tuning_note: Если увеличить до 4.5° — экран будет мгновенно задираться в небо,
        делая зажим невозможным; если уменьшить до 0.8° — пропадет необходимость вести
        мышь вниз.
    - name: Время восстановления отдачи (Recoil Decay)
      value: 0.32 с
      tuning_note: Если увеличить — стрельба одиночными станет слишком медленной;
        если уменьшить — зажим превратится в спам ван-тапами без пауз.
    - name: Темп стрельбы AK-47
      value: 600 выстр/мин (10 выстр/с)
      tuning_note: Если ускорить — враги будут умирать за 100 мс без шанса на реакцию;
        если замедлить — оружие потеряет соревновательную хватку.
    - name: Горизонтальный размах спрея
      value: 1.8 градуса
      tuning_note: Если убрать — отдача станет одномерной и примитивной; если сделать
        хаотичной — исчезнет механический навык заучивания паттерна.
    feedback_layers:
    - 'Визуал/VFX: Яркие конические вспышки дульного пламени с динамическим светом
      на стенах, трассеры пуль Three.js, вылетающие дымящиеся латунные гильзы 7.62
      мм.'
    - 'Звук (Web Audio): Сочный басовитый выстрел AK-47 с эхом в закрытых зонах (B-Tunnels)
      и сухим щелчком затвора при окончании патронов.'
    - 'Камера: Процедурный толчок камеры вверх с последующим затухающим покачиванием
      по оси Pitch/Yaw (Spring Physics Euler).'
    - 'UI/Тактильность: Динамическое смещение перекрестия прицела вверх вслед за спреем
      и нарастающая пульсирующая виброотдача каждого выстрела.'
    failure_mode: Игрок не уводит прицел вниз при зажиме — пули с 4-й по 30-ю улетают
      на 2 метра выше головы врага, оставляя следы декалей на стене за спиной соперника.
    mastery_curve: Новичок панически зажимает всю обойму в тело и попадает только
      первой пулей. Эксперт за доли секунды компенсирует отдачу первых 5 пуль строго
      в грудь и голову, оформляя фраги за 300 мс.
    counterplay: Враги используют укрытия и стрейфят между вашими очередями, вынуждая
      сбрасывать зажим и тратить 0.32 с на восстановление точности.
    synergies:
    - Контр-стрейф и фиксация ствола
    - Баллистический прострел укрытий и физика материалов
    - Тактическое зонирование дымовой завесой
    why_unique: Детерминированный математический спрей-паттерн (фиксированная траектория
      смещения пуль), идентичный соревновательным ПК-шутерам, а не случайный конус
      разброса (Cone of Fire).
    pseudocode: "function processRecoil(weapon, isShooting, dt) {\n  if (isShooting\
      \ && weapon.ammo > 0) {\n    weapon.shotIndex++;\n    const patternOffset =\
      \ getRecoilPattern(weapon.id, weapon.shotIndex);\n    camera.pitch += patternOffset.pitch\
      \ * dt;\n    camera.yaw += patternOffset.yaw * dt;\n    spawnBulletRaycast(camera.direction.add(patternOffset));\n\
      \  } else {\n    weapon.shotIndex = Math.max(0, weapon.shotIndex - dt * 15);\n\
      \    camera.pitch = lerp(camera.pitch, 0, dt * 12.0);\n  }\n}"
  - name: Обезвреживание C4, звуковой блеф и клатч-тайминги (C4 Defusal & Audio Bluff
      Clutch)
    role_in_loop: Главный источник финального напряжения, риска и эмоциональной кульминации
      раунда.
    player_decision: Зажать дефьюз до конца, надеясь на укрытие в дыму, или сделать
      фейк-дефьюз на 0.15 с, спровоцировать врага на пик и встретить его префаером.
    input_mapping: 'ПК: Зажатие и удержание клавиши ''E'' (или F) при наведении на
      C4. Мобильные: Удержание большой круглой кнопки ''DEFUSE'' по центру экрана.'
    states:
    - bomb_ticking (свободный таймер 35.0 с)
    - defusing_active (игрок прикован к радиусу бомбы)
    - fake_defuse_cancelled (мгновенная отмена для стрельбы)
    - bomb_defused_victory
    - bomb_detonated_loss
    parameters:
    - name: Базовое время разминирования C4
      value: 10.0 с
      tuning_note: Если уменьшить до 5.0 с — спецназу не понадобятся саперные наборы;
        если увеличить до 15.0 с — шансы на ретейк упадут до нуля.
    - name: Время разминирования с набором сапёра (Kit)
      value: 5.0 с
      tuning_note: Если уменьшить до 3.0 с — террористы не успеют среагировать на
        звук; если увеличить до 7.0 с — ценность набора сапёра нивелируется.
    - name: Таймер детонатора C4
      value: 35.0 с
      tuning_note: Если сделать 45 с — раунд станет слишком затянутым для браузера;
        если сделать 20 с — спецназ не успеет зайти на точку.
    - name: Радиус взаимодействия с C4
      value: 2.2 метра
      tuning_note: Если увеличить — можно будет дефьюзить из-за глухих углов; если
        уменьшить — придется стоять вплотную на открытом месте.
    feedback_layers:
    - 'Визуал/VFX: Голографический круговой прогресс-бар дефьюза на экране, синие
      искры разрезаемых проводов C4, мигающий красным диод бомбы с нарастающей частотой.'
    - 'Звук (Web Audio): Громкий характерный металлический щелчок открытия кейса C4
      (слышен на 20 метров всем игрокам), ускоряющийся писк зуммера (1 Гц -> 2 Гц
      -> 4 Гц -> 8 Гц).'
    - 'Камера: Ограничение угла поворота камеры до 70 градусов во время удержания
      дефьюза, фокусировка взгляда на объективе бомбы.'
    - 'UI/Тактильность: Нарастающая частая пульсирующая вибрация смартфона в последние
      5 секунд до взрыва, крупный таймер обратного отсчета.'
    failure_mode: Игрок начинает дефьюз без набора сапёра на 7-й секунде до взрыва
      (требуется 10 с) — бомба детонирует прямо в руках на 50% прогресса, сотрясая
      экран вспышкой взрыва.
    mastery_curve: Новичок боится подойти к бомбе или сидит на дефьюзе 'намертво',
      погибая от первой пули. Эксперт по звуку шагов определяет позицию террориста,
      дает фейк-клик дефьюза (0.1 с), разворачивается и мгновенно убивает выбежавшего
      врага.
    counterplay: Террористы не выходят на первый звук щелчка C4, выжидая 2.5 секунды,
      или простреливают дым по позиции установки бомбы.
    synergies:
    - Тактическое зонирование дымовой завесой
    - Баллистический прострел укрытий и физика материалов
    - Контр-стрейф и фиксация ствола
    why_unique: 'Глубокая психологическая игра на слух (Mind Games): звук начала дефьюза
      слышен на весь плент и является главным катализатором дуэли 1v1.'
    pseudocode: "function updateDefusal(c4, player, dt) {\n  if (player.isHoldingDefuseKey\
      \ && distance(player, c4) <= 2.2) {\n    if (!c4.isDefusing) { c4.isDefusing\
      \ = true; broadcast3DSound('defuse_start', c4.pos); }\n    const rate = player.hasKit\
      \ ? (dt / 5.0) : (dt / 10.0);\n    c4.defuseProgress += rate;\n    if (c4.defuseProgress\
      \ >= 1.0) triggerRoundWin('CT', 'bomb_defused');\n  } else {\n    if (c4.isDefusing)\
      \ { c4.isDefusing = false; broadcast3DSound('defuse_abort', c4.pos); }\n  }\n\
      }"
  - name: Тактическое зонирование дымовой завесой (Smoke Screen Tactical Denial)
    role_in_loop: Инструмент временной блокады углов обзора и безопасного пересечения
      простреливаемых зон (Long/Cross).
    player_decision: Бросить смок в двери Long для блокировки AWP врага или положить
      смок прямо на C4 для скрытного дефьюза под прикрытием.
    input_mapping: 'ПК: Выбор клавишей ''4'' (или колесом мыши) -> бросок на ЛКМ (дальний
      навес) или ПКМ (короткий подброс под ноги). Мобильные: Тап по иконке гранаты
      -> кнопка броска.'
    states:
    - grenade_in_hand
    - projectile_flight (баллистическая дуга Three.js)
    - smoke_expanding (раскрытие сферы 1.2 с)
    - smoke_active_full (непроницаемая зона 12.0 с)
    - smoke_dissipating (рассеивание 2.5 с)
    parameters:
    - name: Длительность плотной фазы дыма
      value: 12.0 с
      tuning_note: Если увеличить до 25 с — раунд превратится в стояние вслепую; если
        уменьшить до 5 с — спецназ не успеет пересечь опасную зону.
    - name: Радиус дымового облака
      value: 4.2 метра
      tuning_note: Если увеличить — один смок перекроет весь плент; если уменьшить
        — останутся зазоры (One-way gaps), ломающие баланс.
    - name: Время полного раскрытия сферы
      value: 1.2 с
      tuning_note: Если сделать мгновенным — граната превратится в читерский сейв-щит;
        если сделать 4 с — враги расстреляют игрока до раскрытия.
    - name: Задержка детонации после приземления
      value: 1.5 с
      tuning_note: Если убрать таймер — смоки будут раскрываться в воздухе, ломая
        расчет рикошетов от стен.
    feedback_layers:
    - 'Визуал/VFX: Густая объемная серая сфера частиц (Volumetric Particle Cloud)
      Three.js с эффектом полного затемнения экрана при заходе внутрь (Fog of War).'
    - 'Звук (Web Audio): Громкий шипящий звук выброса углекислотного газа (''hiss-whoosh'')
      при раскрытии и фоновое приглушение внешних звуков внутри облака.'
    - 'Камера: Мягкое размытие (DoF/Blur) периферийного зрения при приближении к границе
      смока.'
    - 'UI/Тактильность: Индикатор на миникарте, скрывающий маркеры противников, находящихся
      внутри или за дымовой завесой.'
    failure_mode: Игрок криво кидает смок в край ящика — граната рикошетит обратно
      под ноги спецназу, закрывая обзор собственной команде и открывая спину террористам.
    mastery_curve: Новичок бросает смок наугад под ноги и бежит сквозь него вслепую,
      умирая от зажима. Эксперт знает точные ориентиры броска от текстур Dust 2 (Lineup),
      идеально отрезая снайперские позиции CT-Spawn.
    counterplay: Враги начинают спамить очередями и простреливать центр дымового облака
      по характерным точкам или закидывают осколочную гранату HE для рассеивания.
    synergies:
    - Обезвреживание C4, звуковой блеф и клатч-тайминги
    - Баллистический прострел укрытий и физика материалов
    - Контр-стрейф и фиксация ствола
    why_unique: 'Плотная физическая геометрия видимости Raycast: внутри дыма дистанция
      обзора падает до 0.8 метра, превращая дуэль в контактный бой в упор.'
    pseudocode: "function updateSmokeGrenade(smoke, dt) {\n  if (smoke.state === 'flying')\
      \ {\n    smoke.pos.addScaledVector(smoke.velocity, dt);\n    smoke.velocity.y\
      \ -= 9.81 * dt;\n    checkWallBounces(smoke);\n  } else if (smoke.state ===\
      \ 'active') {\n    smoke.timer -= dt;\n    applyVisibilityOcclusion(smoke.pos,\
      \ smoke.radius);\n    if (smoke.timer <= 0) smoke.state = 'dissipating';\n \
      \ }\n}"
  - name: Баллистический прострел укрытий и физика материалов (Wallbang & Material
      Penetration)
    role_in_loop: Тактический тормоз для кемперов за ящиками и источник награды за
      знание карты и позиционирование врага.
    player_decision: Потратить 5 патронов на прострел деревянных дверей/ящиков по
      интуиции или поберечь магазин для прямого визуального контакта.
    input_mapping: 'ПК: Прицеливание в текстуру стены/двери/ящика по звуку шагов +
      ЛКМ. Мобильные: Удержание прицела на ребре деревянного препятствия + кнопка
      стрельбы.'
    states:
    - solid_impact (рикошет от бетона, 0 урона сквозь)
    - wood_penetration (пробитие до 0.35 м со снижением урона на 40%)
    - metal_penetration (пробитие до 0.12 м со снижением на 70%)
    - kill_confirmed_wallbang
    parameters:
    - name: Коэффициент сохранения урона сквозь дерево
      value: 60.0%
      tuning_note: Если поднять до 90% — укрытия потеряют смысл, игроков будут убивать
        через любые ящики; если опустить до 20% — прострелы станут бесполезны.
    - name: Максимальная толщина пробития дерева
      value: 0.35 метра
      tuning_note: Если увеличить — пули будут шить двойные бетонные стены; если уменьшить
        — даже тонкие створки дверей Dust 2 перестанут простреливаться.
    - name: Коэффициент пробития тонкого металла (двери B)
      value: 30.0%
      tuning_note: Если увеличить — пулеметы сломают баланс на пленте B; если уменьшить
        — позиция за дверью станет неуязвимой.
    - name: Снижение скорости пули после препятствия
      value: 45.0%
      tuning_note: Если не снижать — дистанционное падение урона за препятствием не
        будет ощущаться.
    feedback_layers:
    - 'Визуал/VFX: Сноп летящих щепок и древесной пыли с лицевой стороны, точка выхода
      пули с тыльной стороны укрытия, желтая иконка сквозного пробития в киллфиде.'
    - 'Звук (Web Audio): Глухой треск раскалываемого дерева (''wood splinter crack'')
      с последующим глухим звуком попадания в тело за стеной.'
    - 'Камера: Микро-вибрация прицела при попадании пули в твердое препятствие высокой
      плотности.'
    - 'UI/Тактильность: Отдельный звуковой и визуальный маркер хитмаркера (красный
      шеврон пробития) при успешном нанесении урона через стену.'
    failure_mode: Игрок тратит весь магазин AK-47 на стрельбу в толстую бетонную стену
      (где урон 0%), выдавая свою позицию грохотом и оставаясь с пустым магазином
      перед выходящим врагом.
    mastery_curve: Новичок стреляет только в видимых противников и боится ящиков.
      Эксперт знает префайр-точки деревянных дверей Mid и коробок на пленте A, нанося
      урон врагам ещё до того, как они покажутся из-за угла.
    counterplay: Защитники укрытий постоянно меняют позицию за ящиком при первых звуках
      прострела или делают контр-выход в момент перезарядки стреляющего.
    synergies:
    - Контр-стрейф и фиксация ствола
    - Компенсация спрей-паттерна и темповые отсечки
    - Тактическое зонирование дымовой завесой
    why_unique: Двухсегментный Raycast с расчетом точки входа, точки выхода и толщины
      коллайдера Three.js/Rapier3D, рассчитывающий реальную толщину материала.
    pseudocode: "function checkWallbangRay(origin, dir, maxDist) {\n  const hit =\
      \ raycastFirst(origin, dir, maxDist);\n  if (!hit) return null;\n  if (hit.material.penetrable)\
      \ {\n    const exitHit = raycastReverse(hit.point.add(dir.clone().multiplyScalar(hit.material.maxDepth)),\
      \ dir.negate());\n    const thickness = hit.point.distanceTo(exitHit.point);\n\
      \    if (thickness <= hit.material.maxDepth) {\n      const remainingDmg = baseDamage\
      \ * hit.material.dmgModifier * (1.0 - thickness / hit.material.maxDepth);\n\
      \      return applyDamageBehindWall(exitHit.point, dir, remainingDmg);\n   \
      \ }\n  }\n  spawnSparkDecal(hit.point, hit.normal);\n}"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 75
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 4.5
  layers:
  - description: Three.js сцены точек A и B карты Dust 2, PBR-материалы, частицы дыма
      и вспышек
    name: Rendering Layer
  - description: Rapier3D для коллизий геометрии, рэгдоллов и прострелов укрытий
    name: Physics & Collision Layer
  - description: Контроллер персонажа, спрей оружия, логика ботов и таймер C4
    name: Gameplay & AI Layer
  - description: HTML5 HUD, Playgama Bridge SDK, адаптивные тач-элементы управления
    name: UI & Platform Layer
  modules:
  - description: Расчёт траекторий пуль, спрей-паттернов, перезарядки и отдачи ствола
    name: WeaponSystem
  - description: 'Дерево поведений ботов: удержание секторов, реакция на шаги, ретейк
      точки'
    name: BotController
  - description: Логика установки, звукового таймера 35с и дефьюза C4 с набором сапёра
    name: BombManager
  - description: Трансляция свайпов в поворот камеры и авто-контр-стрейф при отпускании
    name: TouchInputMapper
monetization:
  strategy_summary: 'Гибридная ненавязчивая монетизация: просмотр Rewarded видео для
    открытия оружейных кейсов со скинами и удвоения ELO-очков победы, интерстишиалы
    между матчами с кулдауном 90 сек, а также IAP наборы скинов и боевой пропуск без
    влияния на игровой баланс (Zero Pay-to-Win).'
  rewarded_placements:
  - id: case_unlock
    name: Бесплатный оружейный кейс
    benefit: Открытие оружейного кейса с шансом выбить редкий скин Covert
    cooldown_or_limit: 3 раза в день
    trigger_moment: Экран победы / Меню арсенала
  - id: elo_double
    name: Удвоение ранговых очков ELO
    benefit: Удваивает полученные очки рейтинга ELO за победу в матче
