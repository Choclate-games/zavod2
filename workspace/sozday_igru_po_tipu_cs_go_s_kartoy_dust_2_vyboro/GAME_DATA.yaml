preview_prompt: 'Authentic in-game gameplay screenshot of ''Dust 2: Ретейк и Дуэли'',
  a Тактический 3D FPS-Шутер game. Visual style: Стилизованный тактический реализм
  (Semi-realistic PBR). Camera perspective: First-Person (Камера от первого лица с
  динамическим покачиванием оружия). Environment: Культовая карта Dust 2: залитый
  ярким солнцем ближневосточный городок с охристыми песчаными стенами, синим небом,
  простреливаемыми деревянными дверями и ящиками с граффити «A» и «B». Central Action:
  На последних 4 секундах до детонации C4 сквозь рассеивающийся смок ставишь ван-тап
  в голову врагу и успеваешь обезвредить бомбу с купленным набором сапёра! — the moment
  is caught mid-action, with clear cause and effect readable in a single frame. Visible
  in-game HUD overlay: Индикатор здоровья (HP: 100) и брони в нижнем левом углу, Счётчик
  патронов (30 / 90) и иконка оружия в нижнем правом углу, Таймер раунда / статус
  бомбы C4 по центру вверху экрана, Счёт матча по раундам (CT 2 : 1 T) по центру сверху;
  touch controls at the bottom corners. Lighting: Яркий направленный солнечный свет
  (Directional Light) тёплого золотистого оттенка с чёткими контрастными тенями и
  мягким рассеянным небесным светом (Ambient Skylight). Color palette: #4A90E2, #FF2A2A,
  #1C2D42, #D2B48C, #A0AAB2, #5C4033. High visual clarity, readable silhouettes, immersive
  WebGL game aesthetics.'
