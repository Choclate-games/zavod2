    control_scheme: 'ПК: ЛКМ — выбор бойца и черчение пути кликом/перетаскиванием,
      клавиши 1-3 — выбор гранаты (Flash/Smoke/HE), Пробел — синхронный старт штурма
      / пауза; Мобильные: прямой тап по бойцу и рисование пальцем линии движения к
      пленту, круговое меню выбора раскидки гранаты, кнопка «ШТУРМ» внизу экрана.'
