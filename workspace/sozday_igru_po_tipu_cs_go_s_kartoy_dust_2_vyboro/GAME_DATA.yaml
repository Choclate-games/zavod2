playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - telegram
  - gamepix
  - web
  initialization_flow:
  - Инициализация bridge.initialize() при старте приложения
  - Проверка доступности платформы и загрузка сохранений cloud_storage
  - Подключение обработчиков паузы звука при показе рекламы (visibilitychange)
  cloud_save_keys:
  - player_elo_rating
  - unlocked_skins_array
  - equipped_loadout
  - match_statistics
  - sound_settings
  leaderboards:
  - global_elo_rating_board
  - weekly_headshot_masters
  - total_clutches_won
  ads_integration:
    banner_supported: true
    interstitial_cooldown_managed: true
    rewarded_available_check: true
  lifecycle_hooks:
  - onPause -> глушение звуков WebAudio и пауза физики
  - onResume -> восстановление контекста WebAudio и синхронизация таймеров
  - onAdStart -> блокировка ввода мыши/тача
  - onAdClose -> разблокировка управления
