definition_of_done:
- Полная 3D-геометрия точек A и B карты Dust 2 оптимизирована под WebGL с 60 FPS на
  ПК и мобильных
- Реализован контроллер персонажа от первого лица с механикой контр-стрейфа на клавиатуре
  и сенсорном экране
- 'Настроена баллистика оружия: спрей-паттерны AK-47, M4A4, AWP, Deagle и хитбоксы
  с 1-tap headshot'
- Работает тактический ИИ ботов 3v3 с поиском укрытий, реакцией на шаги и удержанием
  секторов плента
- Реализована система бомбы C4 с таймером 35 секунд и механикой дефьюза за 5/10 секунд
- Реализована система матчей из 5 раундов до 3 побед со сменой сторон и подсчётом
  статистики K/D
- Интегрирован SDK Playgama Bridge с сохранением ELO-рейтинга и рекламными плейсментами
- Успешно пройден чек-лист QA на Chrome, Safari iOS и мобильных браузерах
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Выбор позиции и оружия -> Тактический выход с контр-стрейфом
  -> Прицельная перестрелка короткими отсечками -> Закладка/Обезвреживание бомбы C4
  -> Завершение раунда и анализ тактики -> Победа в матче из 5 раундов..'
- 'Реализованы механики проекта: Контр-стрейф и фиксация ствола (Counter-Strafing
  & Velocity Zeroing), Компенсация спрей-паттерна и темповые отсечки (Recoil Spray
  Pattern & Burst Fire), Обезвреживание C4, звуковой блеф и клатч-тайминги (C4 Defusal
  & Audio Bluff Clutch), Тактическое зонирование дымовой завесой (Smoke Screen Tactical
  Denial).'
- 'Условие успеха (Одержать победу в 3 раундах из 5 за Спецназ (обезвредить C4 или
  ликвидировать всех террористов до закладки) либо за Террористов (успешно взорвать
  C4 после 35 секунд таймера или ликвидировать всех бойцов спецназа).) и условие проигрыша
  (Проиграть 3 раунда сопернику: детонация C4 при игре за спецназ, успешный дефьюз
  бомбы спецназом при игре за террористов, либо полная гибель вашей команды в раунде.)
  работают.'
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Dust 2: Ретейк и Дуэли».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Бесплатный оружейный кейс, Удвоение
  ранговых очков ELO); interstitial соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
