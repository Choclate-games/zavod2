raw_prompt: Создай игру по типу cs go с картой dust 2 выбором команды и так далее
title: 'Dust 2: Ретейк и Дуэли'
slug: sozday_igru_po_tipu_cs_go_s_kartoy_dust_2_vyboro
genre: Тактический 3D FPS-Шутер
subgenre: Соревновательный тактический ретейк-шутер от первого лица
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web)
orientation: landscape
target_audience: Поклонники тактических соревновательных шутеров (CS:GO, CS2, Standoff
  2) в возрасте 14-35 лет, ценящие честный скилл стрельбы, контр-стрейф и моментальный
  вход в бой прямо в браузере.
core_loop: Выбор позиции и оружия -> Тактический выход с контр-стрейфом -> Прицельная
  перестрелка короткими отсечками -> Закладка/Обезвреживание бомбы C4 -> Завершение
  раунда и анализ тактики -> Победа в матче из 5 раундов.
hook: На последних 4 секундах до детонации C4 сквозь рассеивающийся смок ставишь ван-тап
  в голову врагу и успеваешь обезвредить бомбу с купленным набором сапёра!
player_fantasy: Ты — элитный боец спецназа или хладнокровный террорист, решающий исход
  напряжённого 30-секундного штурма точки Dust 2 благодаря выверенному таймингу, точному
  контр-стрейфу и хэдшоту.
session_model: Матч из 5 быстрых раундов до 3 побед; каждый раунд длится 25–45 секунд
  в формате 3v3 со спавном в боевой позиции на точке A или B карты Dust 2.
unique_value_proposition: Аутентичный тактический шутер со стрельбой на механике контр-стрейфа,
  баллистикой спрея и честной дуэлью спецназа и террористов на Dust 2 прямо в браузере
  за 2 минуты без лагов и лобби.
vision: Создать самый динамичный и точный браузерный FPS в духе классических ретейк-серверов
  CS:GO, где нет лишней ходьбы по пустой карте, а каждый раунд — это концентрированная
  30-секундная проверка скилла стрельбы, позиционирования и взаимодействия с бомбой
  C4.
elevator_pitch: 'Dust 2: Ретейк и Дуэли — это быстрый тактический 3D-шутер от первого
  лица в браузере, в котором спецназ и террористы сходятся в матчах 3v3 на точках
  A и B карты Dust 2 с честным контр-стрейфом, отдачей оружия, прострелами и таймером
  бомбы C4.'
win_conditions: Одержать победу в 3 раундах из 5 за Спецназ (обезвредить C4 или ликвидировать
  всех террористов до закладки) либо за Террористов (успешно взорвать C4 после 35
  секунд таймера или ликвидировать всех бойцов спецназа).
lose_conditions: 'Проиграть 3 раунда сопернику: детонация C4 при игре за спецназ,
  успешный дефьюз бомбы спецназом при игре за террористов, либо полная гибель вашей
  команды в раунде.'
progression_summary: Разблокировка скинов оружия за мастерство и победные серии (ранговая
  система от Silver до Global Elite), выполнение тактических контрактов (например,
  '3 хэдшота за раунд', 'дефьюз за 1 сек до взрыва') и накопление тактических шевронов
  без изменения баланса.
difficulty_curve: 'Динамический подбор сложности ботов: первые матчи боты имеют время
  реакции 450 мс и базовый разброс, с ростом побед время реакции уменьшается до 180
  мс, боты начинают использовать контр-стрейф, прострелы ящиков и закидывать дымовые
  гранаты в узкие проходы.'
