  selected_id: D2_RETAKE_FPS
  selected_name: 'Dust 2: Дуэль и Ретейк'
  selection_reason: 'Вариант D2 сохраняет главную суть и драйв CS:GO — прямое управление
    оружием от первого лица, выбор стороны спецназа или террористов, установку/обезвреживание
    бомбы C4 и честную баллистику со спреем и хэдшотами. В отличие от долгой 45-минутной
    оригинальной игры, формат ''Ретейк'' идеально адаптирован под браузер и мобильные
    экраны: игрок сразу спавнится в гуще боя на точке плента без 40 секунд пустой
    ходьбы, а управление с авто-остановкой дает интуитивный контр-стрейф без перегрузки
    кнопками.'
  rejected_reasons:
  - 'Вариант D1 (Dust 2: Тактический Штаб 5v5) отвергнут, так как превращение шутера
    в изометрическую RTS с непрямым управлением отрядом лишает игрока личного тактильного
    ощущения стрельбы, отдачи и сочных хэдшотов, ради которых ищут CS. Кроме того,
    микроконтроль 5 бойцов на сенсорном экране перегружает интерфейс.'
  - 'Вариант D3 (Dust 2: Дуэль Снайперов на Миду) отвергнут из-за сильной ограниченности
    геймплея: снайперская дуэль через щель дверей исключает механику бомбы C4, командные
    тактики штурма плентов и всё разнообразие стрелкового оружия (AK-47, M4A4, пистолеты),
    что приводит к быстрой потере интереса игрока через 3-4 минуты.'
  what_it_is_not:
  - Бесконечные волны зомби или бегущей толпы врагов (это соревновательный раундовый
    тактический шутер спецназа против террористов 3v3 / 5v5, а не horde survivor).
  - Автоматическая стрельба и авто-наведение с круговой автоатакой (игрок лично контролирует
    прицел, спрей оружия и момент спуска курка).
  - Виртуальный плавающий аналоговый джойстик в левом углу и россыпь мелких кнопок
    (управление адаптировано под прямое наведение пальцем / свайп-движение с мгновенной
    остановкой).
  - 'Процедурно генерируемые лабиринты и фэнтези-подземелья (строго узнаваемая топология
    карты Dust 2: Long, Short, Plant A/B, Mid, Tunnels).'
  - Мета-прокачка в стиле рогаликов вида '+5% к здоровью, +10% к урону пули' (все
    персонажи равны по базовому здоровью и урону, решает скилл позиционирования, тайминг
    и точность попадания в голову).
  - волны врагов на арене
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - Аутентичная геометрия точек карты Dust 2 (коробка, Long, ящики плента A/B, двойные
    двери) с читаемыми углами и укрытиями.
  - 'Выбор стороны (Террористы / Спецназ) с соответствующей целью раунда: закладка
    и защита C4 против штурма и обезвреживания (дефьюза).'
  - 'Характерная баллистика стрельбы: зависимость кучности от движения (контр-стрейф),
    разброс при зажиме (спрей) и мгновенное летальное попадание в голову (one-tap
    headshot).'
  - Командные боты союзников и противников с поведением прикрытия секторов, реакцией
    на шум шагов и закладку бомбы.
  signature_scene: 'Кадр от первого лица в золотистом свете закатного солнца на точке
    A карты Dust 2: на переднем плане детализированный автомат AK-47 со следами потертостей
    на ствольной коробке и вылетающей дымящейся гильзой. По центру кадра сквозь рассеивающееся
    серое облако дымовой шашки виден силуэт спецназовца в темно-синем шлеме с забралом,
    вскидывающего винтовку M4A4. Справа за песчаным ящиком с граффити «A» лежит таймер
    бомбы C4 с горящим красным светодиодом и связкой проводов, а на заднем плане в
    глубоком небе над песчаными арками медленно тают трассеры рикошетов.'
  avoid_references:
  - '«Тактика Прорыва: CQB Штурм»'
  - 'Counter-Strike: Global Offensive'
  - Vampire Survivors
  - Brotato
  - Standoff 2
knowledge_plan:
  selections:
  - path: threejs/fps_controller_and_shooting.md
    role: core
    reason: Управление от первого лица, расчет контр-стрейфа, математика отдачи и
      спрей-паттерна оружия, а также покачивание вьюмодели.
  - path: threejs/shooter_enemy_ai_and_combat.md
    role: core
    reason: Тактический ИИ ботов для формата 3v3 ретейка, секторы обзора, хитбоксы
      и регистрация урона при попаданиях.
  - path: threejs/physics_integration.md
    role: core
    reason: Синхронизация физического мира Rapier3D с графикой Three.js для точного
      движения бойцов и бросков гранат.
  - path: threejs/game_map_and_world_design.md
    role: core
    reason: Создание соревновательной геометрии плентов карты Dust 2 с ящиками, укрытиями
      и зонами закладки бомбы.
  - path: threejs/procedural_mesh_builder.md
    role: core
    reason: Процедурная сборка 3D-моделей оружия, бомбы C4 и окружения без загрузки
      внешних ассетов.
  - path: threejs/procedural_character_rig.md
    role: core
    reason: Создание процедурных низкополигональных моделей спецназа и террористов
      с ригом удержания оружия.
  - path: stack/rapier3d.md
    role: core
    reason: Физический движок WASM для коллизий персонажей, трения при остановке и
      физики полета гранат.
  - path: stack/three_mesh_bvh.md
    role: core
    reason: Ускорение рейкастов для мгновенной регистрации попаданий (hitscan) и расчета
      баллистического прострела стен (wallbang).
  - path: audio/procedural_sound_synthesizer.md
    role: core
    reason: Процедурный синтез звуков выстрелов, шагов, пиканья таймера бомбы C4 и
      звука начала обезвреживания через Web Audio.
  - path: threejs/adaptive_quality.md
    role: supporting
    reason: Динамическая подстройка разрешения и дальности прорисовки для удержания
      стабильных 60 FPS на мобильных устройствах.
  - path: threejs/performance_guide.md
    role: supporting
    reason: Оптимизация количества вызовов отрисовки (Draw Calls) и инстансинг повторяющихся
      элементов арены.
  - path: threejs/mobile_shaders.md
    role: supporting
    reason: Легковесные шейдеры материалов окружения Dust 2 для исключения перегрева
      мобильных устройств.
  - path: threejs/juice_and_vfx_pool.md
    role: supporting
    reason: Инстансированные частицы для создания дымовой завесы смока, вспышек выстрелов
      и шейка камеры при взрыве C4.
  - path: mechanics/cover_and_suppression.md
    role: supporting
    reason: Тактическая оценка укрытий ботами при штурме плента и поведение под подавляющим
      огнем.
  - path: mechanics/ragdoll.md
    role: supporting
    reason: Физический рэгдолл при гибели бойцов от хэдшотов и детонации бомбы для
