    session_shape: Тактический матч из коротких раундов по 60 секунд (15 сек закупка
      и планирование маршрутов, 45 сек динамическая фаза штурма/защиты плента A или
      B).
    camera: Тактическая изометрическая камера сверху под углом 60° с плавным панорамированием
