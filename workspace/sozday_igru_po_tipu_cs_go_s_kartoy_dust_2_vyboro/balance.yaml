_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: sozday_igru_po_tipu_cs_go_s_kartoy_dust_2_vyboro
performance:
  target_fps: 60
  max_draw_calls: 75
  max_triangles: 45000
  bundle_size_budget_mb: 4.5
session:
  model: Матч из 5 быстрых раундов до 3 побед; каждый раунд длится 25–45 секунд в
    формате 3v3 со спавном в боевой позиции на точке A или B карты Dust 2.
  win: Одержать победу в 3 раундах из 5 за Спецназ (обезвредить C4 или ликвидировать
    всех террористов до закладки) либо за Террористов (успешно взорвать C4 после 35
    секунд таймера или ликвидировать всех бойцов спецназа).
  lose: 'Проиграть 3 раунда сопернику: детонация C4 при игре за спецназ, успешный
    дефьюз бомбы спецназом при игре за террористов, либо полная гибель вашей команды
    в раунде.'
  difficulty_curve: 'Динамический подбор сложности ботов: первые матчи боты имеют
    время реакции 450 мс и базовый разброс, с ростом побед время реакции уменьшается
    до 180 мс, боты начинают использовать контр-стрейф, прострелы ящиков и закидывать
    дымовые гранаты в узкие проходы.'
mechanics:
  kontr_streyf_i_fiksatsiya_stvola_counter_strafing_:
    name: Контр-стрейф и фиксация ствола (Counter-Strafing & Velocity Zeroing)
    parameters:
      tayming_idealnogo_kontr_streyfa:
        value: 0.08 с
        note: Если увеличить до 0.25 с — стрельба станет вязкой и 'мыльной'; если
          уменьшить до 0.02 с — исчезнет механический скилл остановки, игра превратится
          в аркадный run-and-gun.
      porog_skorosti_nulevoy_netochnosti:
        value: 34.0 units/s (0.85 м/с)
        note: Если поднять до 100 units/s — игроки смогут стрелять на бегу без наказания;
          если опустить до 5 units/s — любое микро-касание стика будет портить выстрел.
      maksimalnaya_skorost_bega_s_ak_47:
        value: 215.0 units/s (5.38 м/с)
        note: Если увеличить — пики из-за угла станут нечеловечески быстрыми (peeker's
          advantage); если уменьшить — персонаж покажется неповоротливым.
      shtraf_netochnosti_na_begu:
        value: 85.0 MOA
        note: Если уменьшить — пули будут случайно залетать в голову на бегу; если
          увеличить — при стрельбе на бегу пули будут улетать строго в пол/небо.
  kompensatsiya_sprey_patterna_i_tempovye_otsechki_r:
    name: Компенсация спрей-паттерна и темповые отсечки (Recoil Spray Pattern & Burst
      Fire)
    parameters:
      vertikalnyy_podem_stvola_ak_47:
        value: 2.4 градуса/выстрел
        note: Если увеличить до 4.5° — экран будет мгновенно задираться в небо, делая
          зажим невозможным; если уменьшить до 0.8° — пропадет необходимость вести
          мышь вниз.
      vremya_vosstanovleniya_otdachi_recoil_decay:
        value: 0.32 с
        note: Если увеличить — стрельба одиночными станет слишком медленной; если
          уменьшить — зажим превратится в спам ван-тапами без пауз.
      temp_strelby_ak_47:
        value: 600 выстр/мин (10 выстр/с)
        note: Если ускорить — враги будут умирать за 100 мс без шанса на реакцию;
          если замедлить — оружие потеряет соревновательную хватку.
      gorizontalnyy_razmah_spreya:
        value: 1.8 градуса
        note: Если убрать — отдача станет одномерной и примитивной; если сделать хаотичной
          — исчезнет механический навык заучивания паттерна.
  obezvrezhivanie_c4_zvukovoy_blef_i_klatch_taymingi:
    name: Обезвреживание C4, звуковой блеф и клатч-тайминги (C4 Defusal & Audio Bluff
      Clutch)
    parameters:
      bazovoe_vremya_razminirovaniya_c4:
        value: 10.0 с
        note: Если уменьшить до 5.0 с — спецназу не понадобятся саперные наборы; если
          увеличить до 15.0 с — шансы на ретейк упадут до нуля.
      vremya_razminirovaniya_s_naborom_sapera_kit:
        value: 5.0 с
        note: Если уменьшить до 3.0 с — террористы не успеют среагировать на звук;
          если увеличить до 7.0 с — ценность набора сапёра нивелируется.
      taymer_detonatora_c4:
        value: 35.0 с
        note: Если сделать 45 с — раунд станет слишком затянутым для браузера; если
          сделать 20 с — спецназ не успеет зайти на точку.
      radius_vzaimodeystviya_s_c4:
        value: 2.2 метра
        note: Если увеличить — можно будет дефьюзить из-за глухих углов; если уменьшить
          — придется стоять вплотную на открытом месте.
  takticheskoe_zonirovanie_dymovoy_zavesoy_smoke_scr:
    name: Тактическое зонирование дымовой завесой (Smoke Screen Tactical Denial)
    parameters:
      dlitelnost_plotnoy_fazy_dyma:
        value: 12.0 с
        note: Если увеличить до 25 с — раунд превратится в стояние вслепую; если уменьшить
          до 5 с — спецназ не успеет пересечь опасную зону.
      radius_dymovogo_oblaka:
        value: 4.2 метра
        note: Если увеличить — один смок перекроет весь плент; если уменьшить — останутся
          зазоры (One-way gaps), ломающие баланс.
      vremya_polnogo_raskrytiya_sfery:
        value: 1.2 с
        note: Если сделать мгновенным — граната превратится в читерский сейв-щит;
          если сделать 4 с — враги расстреляют игрока до раскрытия.
      zaderzhka_detonatsii_posle_prizemleniya:
        value: 1.5 с
        note: Если убрать таймер — смоки будут раскрываться в воздухе, ломая расчет
          рикошетов от стен.
  ballisticheskiy_prostrel_ukrytiy_i_fizika_material:
    name: Баллистический прострел укрытий и физика материалов (Wallbang & Material
      Penetration)
    parameters:
      koeffitsient_sohraneniya_urona_skvoz_derevo:
        value: 60.0%
        note: Если поднять до 90% — укрытия потеряют смысл, игроков будут убивать
          через любые ящики; если опустить до 20% — прострелы станут бесполезны.
      maksimalnaya_tolschina_probitiya_dereva:
        value: 0.35 метра
        note: Если увеличить — пули будут шить двойные бетонные стены; если уменьшить
          — даже тонкие створки дверей Dust 2 перестанут простреливаться.
      koeffitsient_probitiya_tonkogo_metalla_dveri_b:
        value: 30.0%
        note: Если увеличить — пулеметы сломают баланс на пленте B; если уменьшить
          — позиция за дверью станет неуязвимой.
      snizhenie_skorosti_puli_posle_prepyatstviya:
        value: 45.0%
        note: Если не снижать — дистанционное падение урона за препятствием не будет
          ощущаться.
