definition_of_done:
- Реализованы 3 последовательные комнаты штурма (Периметр, Офис, Серверная) с физическим
  разрушением преград
- Механика бричинга C4 с разлетом обломков и переходом в Slow-Mo работает со стабильными
  60 FPS
- Баллистический щит блокирует выстрелы, механика наклонов Lean (Q/E и тач) позволяет
  вести прицельный огонь
- 'Летальная система попаданий: 1 выстрел в голову нейтрализует любого врага без полосок
  здоровья'
- 'Playgama Bridge SDK полностью интегрирован: работают облачные сохранения, реклама
  и лидерборды'
- Управление адаптировано под смартфоны (тач-стрельба в slow-mo) и ПК (клавиатура/мышь)
