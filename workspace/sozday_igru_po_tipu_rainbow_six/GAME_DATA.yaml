  - 'Притащить решение из документа, который куратор для этого проекта отклонил: patterns/arena_combat_loop.md,
    patterns/survivor_loop.md, patterns/roguelike_loop.md, threejs/horde_survivor_core.md,
    mechanics/upgrade_choices.md, mechanics/wave_survival.md, stack/recast_navigation.md,
    stack/bitecs.md, mechanics/parry.md.'
  checklist:
  - Каждая ключевая механика реализована по своему документу из этого набора.
  - Ни одна система не воспроизводит отклонённый жанровый шаблон.
