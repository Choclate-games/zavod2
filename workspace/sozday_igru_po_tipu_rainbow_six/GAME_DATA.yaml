raw_prompt: Создай игру по типу rainbow six
title: 'Тактика Прорыва: CQB Штурм'
slug: sozday_igru_po_tipu_rainbow_six
genre: Тактический 3D CQB-Шутер
subgenre: Тактический симулятор штурма / Бричинг и зачистка
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web)
orientation: landscape
target_audience: Игроки 16–35 лет, увлеченные тактическими шутерами (Rainbow Six,
  Ready or Not), ценящие атмосферу спецназа, планирование штурма, летальный CQB и
  зрелищное разрушение укрытий без утомительного виртуального бега.
core_loop: Тактическая разведка эндоскопом -> Выбор слабой зоны и установка C4 ->
  Детонация с физическим проломом стены -> Вход в штурмовой Slow-Mo -> Ликвидация
  угроз точными выстрелами из-за щита -> Обезвреживание бомбы / переход к следующей
  комнате -> Получение тактических кредитов и улучшение снаряжения.
hook: 'Мгновенное превращение глухой стены в тактический пролом: взрыв разносит гипсокартон
  в щепки, время замирает, и за 2 секунды кинематографичного slow-mo вы решаете исход
  операции одним точным хедшотом.'
player_fantasy: Вы — элитный оперативник штурмовой группы спецназа 'Радуга'. За вашими
  плечами титановый баллистический щит и бричинг-заряды. Вы диктуете геометрию боя,
  пробивая стены там, где враг уверен в своей безопасности, и ликвидируете террористов
  за доли секунды без права на промах.
session_model: Штурм захваченного объекта из 3 последовательных комнат (Периметр ->
  Офисный холл -> Серверное хранилище) длительностью 90–120 секунд с нарастающей сложностью
  укреплений и вооружения врагов.
unique_value_proposition: 'Первый браузерный 3D-шутер с процедурным физическим разрушением
  преград и акцентом на фазе бричинга в slow-mo: управление оптимизировано под тач-скрин
  без виртуальных джойстиков, а летальность попаданий возвращает истинный хардкорный
  дух тактического спецназа.'
vision: Создать эталонный веб-шутер ближнего боя, где каждый штурм — это короткая,
  но предельно насыщенная адреналином тактическая головоломка с физическим взрывом
  стен, тактическим щитом и бескомпромиссной стрельбой на дистанции вытянутой руки.
elevator_pitch: 'Тактический 3D-шутер от первого лица в духе Rainbow Six: пробивайте
  стены зарядами C4, прикрывайтесь баллистическим щитом и зачищайте захваченное посольство
  в замедленном времени за 90 секунд!'
win_conditions: Успешная нейтрализация всех террористов во всех 3 помещениях объекта
  и обезвреживание взрывного устройства без критического разрушения баллистического
  щита.
lose_conditions: Гибель оперативника от ответного огня боевиков, подрыв на скрытой
  растяжке или детонация бомбы по истечении таймера штурма.
progression_summary: Разблокировка новых типов взрывчатки (термический заряд, направленная
  клеймор), штурмового арсенала (дробовики M870, пистолеты-пулеметы MP5, бронебойные
  револьверы), тактических модификаций щита и камуфляжей спецподразделений.
difficulty_curve: 'Комната 1 (Периметр): 2 боевика без брони, деревянная дверь, 3.0
  сек slow-mo, обучение взлому. Комната 2 (Холл): 3 боевика за столами, светошумовая
  защита, 2.0 сек slow-mo, растяжка у прохода. Комната 3 (Хранилище): 4 бронированных
  наемника, армированная стена (требует термозаряд), лазерные мины, 1.5 сек slow-mo
  и моментальный ответный огонь.'
scores:
  fun: 9
  originality: 9
  replayability: 8
  development_cost: 7
  visual_appeal: 9
  mobile_fit: 9
  monetization: 8
  platform_fit: 9
  overall_score: 8.5
  justification: Концепт идеально заполняет пустующую нишу качественных тактических
    CQB-шутеров на веб-платформах. Замена свободного бега на сфокусированные фазы
    бричинга и slow-mo решает главную проблему мобильного управления и гарантирует
    высокий retention.
references:
- name: Rainbow Six Siege
  genre: Тактический соревновательный FPS
  mechanics:
  - Разрушение стен и перекрытий зарядами
  - Использование баллистических щитов
  - Летальный урон в голову с одного выстрела
  - Тактические наклоны камеры (Lean Q/E)
  lessons: Ощущение напряжения перед штурмом и эйфория от успешного тактического прорыва
    создают сильнейшее игровое ядро.
  what_to_avoid: Перегруженность десятками сложных операторов и огромные запутанные
    карты, не подходящие для коротких веб-сессий.
- name: Ready or Not
  genre: Тактический симулятор спецназа
  mechanics:
  - Штурм закрытых помещений CQB
  - Оптический эндоскоп под двери
  - Светошумовые гранаты и дезориентация
  lessons: Аутентичный вес снаряжения, ценность предварительной разведки и цена каждого
    ошибочного шага.
  what_to_avoid: Медленные 40-минутные миссии и хардкорная баллистика, отпугивающие
