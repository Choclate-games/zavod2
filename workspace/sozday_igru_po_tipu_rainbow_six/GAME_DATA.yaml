  tension_curve: '0–10 с (Тишина и напряженное планирование): Полный штиль. Слышно
    только тяжелое дыхание оперативника и жужжание сервопривода эндоскопа. Напряжение
    копится из-за неизвестности за дверью. 10–13 с (Взрывной пик и кинематографичный
    штурм Комнаты 1): Детонация C4, резкий звуковой удар, выброс адреналина, 3 секунды
    идеального тайминга в Slow-Mo. Эйфория от первого чистого хедшота. 13–20 с (Спад
    и переходная зачистка): Короткая передышка, звук падающих гильз, оценка повреждений
    щита, перезарядка. 20–45 с (Офисный холл — среднее напряжение и скрытая угроза):
    Боевики за укрытиями уже настороже, натянут трипвайр растяжки. Напряжение возрастает:
    ошибка при наклоне стоит половины здоровья щита. Бричинг через окно/стену, 2.0
    секунды Slow-Mo, ликвидация 3 целей в перекрестном огне. 45–55 с (Тактическая
    пауза и менеджмент ресурсов): Обезвреживание мины, выбор между сохранением гранаты
    или ремонтом смотрового стекла. 55–90 с (Кульминация — Серверное хранилище с бомбой):
    Максимальное давление. Тикающий таймер бомбы (25 секунд), бронированные наемники
    с дробовиками, армированная стена требует 4 секунды прожига термолентой. 1.5 секунды
    Slow-Mo, мгновенный хардкорный размен выстрелами, блокирование шквального огня
    щитом на последних единицах прочности, обезвреживание СВУ за 2 секунды до детонации.
    90–100 с (Катарсис и награда): Снятие напряжения, победный рапорт командования,
    водопад тактических кредитов и разблокировка новой экипировки.'
  core_formulas:
  - Damage_Taken = Raw_Incoming_Damage * (1.0 - Shield_Block_Factor) * Armor_Piercing_Mod,
    где при попадании в титановый щит Shield_Block_Factor = 1.0 (полный блок), при
    попадании в смотровое окно Shield_Block_Factor = 0.85 с расходом прочности стекла
    Glass_HP = Glass_HP - (Bullet_Caliber * 12.5), а при открытии плеча во время наклона
    Shield_Block_Factor = 0.0.
  - SlowMo_Duration_Seconds = Base_SlowMo * (1.0 + Adrenaline_Perk_Level * 0.15) *
    Breach_Quality_Multiplier, где Base_SlowMo составляет 3.0 с (Комната 1), 2.0 с
    (Комната 2), 1.5 с (Комната 3), а Breach_Quality_Multiplier = 1.25 при установке
    заряда точно в центр слабого узла стены.
  - Breach_Destruction_Impulse = Explosive_Mass_Kg * 450.0 / (Distance_To_Debris_M
    + 0.5)^1.8, передающий линейный импульс (Н*с) и угловую скорость каждому из 24-36
    полигональных осколков стены в физическом движке Rapier3D.
  - Enemy_Stun_Duration_Seconds = clamp(Base_Stun * (Explosive_Power / Distance_To_Breach_M),
    0.5, 4.0) * (1.0 - Enemy_Armor_Resist), определяющий время дезориентации террориста
    (выпадение оружия из рук, анимация контузии).
  - Tactical_Score_Points = (Headshot_Count * 500 + Breach_Kills * 350 + Speed_Bonus_Seconds
    * 50 + Shield_Integrity_Percent * 10) * Accuracy_Multiplier * Difficulty_Mod,
    формирующий финальный рейтинг операции (ранги D, C, B, A, S).
  run_progression:
  - 'Комната 1 -> Комната 2 (Тактический адреналин): успешная зачистка первой комнаты
    без повреждений дает оперативнику статус ''В Фокусе'' (+15% к скорости перезарядки
    и подсветка капсюлей вражеских мин через гипсокартон).'
  - 'Комната 2 -> Комната 3 (Штурмовой арсенал): зачистка офисного холла позволяет
    подобрать с оружейной стойки синдиката подкалиберные патроны 9x19mm AP (+40% пробития
    брони наемников) или термитную шашку для мгновенного прожига армированной стены.'
  - 'Экстренное усиление щита: замена треснувшего триплекс-стекла смотрового окна
    на запасную бронепанель перед финальным штурмом серверной (+100 ед. прочности
    баллистического экрана).'
  - 'Серийный комбо-множитель штурма: каждый непрерывный хедшот в фазе Slow-Mo увеличивает
    окно замедления времени на +0.3 с для следующей комнаты объекта.'
  meta_progression:
  - 'Взрывной арсенал инженерного корпуса: Открытие тяжелых зарядов C4 (увеличенный
    радиус осколков), термических лент Thermite-X (бесшумный прожиг армированной стали)
    и направленных зарядов ''Кумулятивный молот'' (пробивают сразу две смежные комнаты).'
  - 'Модификации штурмового щита: Апгрейд базового щита спецназа до щита ''Вулкан-М''
    со встроенным стробоскопическим фонарем (ослепляет врагов на 2.0 с при входе)
    и титановым карнизом с отражением рикошетов.'
  - 'Штурмовое стрелковое вооружение: Разблокировка компактного дробовика Breaching-12
    (мгновенный отстрел дверных петель), тактического пистолета-пулемета MP5-SD с
    глушителем и крупнокалиберного револьвера Rhino .357 (пробивает укрытия навылет).'
  - 'Тактические перки оперативника: Пассивные навыки спецподразделения ''Радуга''
    — ускорение наклонов (Lean Speed +35%), снижение отдачи при стрельбе с одной руки
    на 25%, замедление скорости расхода таймера бомбы на 20%.'
  - 'Оружейные скины и камуфляжи спецназа: Камуфляжи ''Городской штурм'', ''Черный
    монолит'', ''Ночной рейд'', открываемые за ранги ''S'' на всех операциях.'
  mechanics:
  - name: Взрывной Бричинг Укреплений (Breach Dynamics)
    role_in_loop: Двигатель штурма и трансформатор геометрии арены
    player_decision: 'Куда и какой заряд установить: пробить деревянную дверь по центру
      или наложить C4 на слабую гипсокартонную стену сбоку, чтобы зайти во фланг террористам
      и поразить их разлетающимися обломками.'
    input_mapping: ПКМ / Тап по подсвеченной зоне стены — прикрепить заряд C4; Пробел
      / Кнопка кликера детонатора — дистанционный подрыв; Свайп двумя пальцами вниз
      — отмена и снятие заряда.
    states:
    - READY_TO_DEPLOY (оперативник держит заряд, зоны стен подсвечены желтым/зеленым)
    - ATTACHED_ARMED (заряд на стене, диод мигает зеленым с частотой 2 Гц, активна
      кнопка подрыва)
    - DETONATION_IMPACT (триггер подрыва, спавн взрывной волны, фрагментация полигональной
      сетки на 32 твердых тела Rapier3D)
    - BREACH_SMOKE_CLEARING (рассеивание пылевого облака в течение 3.5 с, образование
      постоянного проема)
    parameters:
    - name: charge_placement_time
      value: 0.65 с
      tuning_note: Если уменьшить до 0.2 с — теряется вес и уязвимость установки;
        если увеличить до 1.5 с — ломается динамика мобильной сессии.
    - name: blast_radius_lethal
      value: 2.2 м
      tuning_note: Если увеличить до 4.0 м — взрыв убивает всех врагов за стеной без
        участия игрока; если уменьшить до 1.0 м — осколки не задевают прилегающие
        укрытия.
    - name: wall_fragment_count
      value: 32 шт
      tuning_note: Если сделать 8 шт — разрушение выглядит дешево и плоско; если сделать
        больше 60 шт — просаживается FPS в браузере Three.js на мобильных устройствах.
    - name: safe_standoff_distance
      value: 2.5 м
      tuning_note: Если игрок стоит ближе 2.5 м к стене без щита — получает 45 ед.
        урона и контузию на 1.8 с; если дистанция 0 м — исчезает необходимость тактического
        отхода.
    feedback_layers:
    - 'Визуал/VFX: Вспышка взрыва с объемным дымовым грибом, разлет 32 трехмерных
      фрагментов штукатурки и арматуры с расчетом коллизий Rapier3D, оседающая белая
      взвесь строительной пыли.'
    - 'Звук (Web Audio): Низкочастотный саб-басовый взрыв (45 Гц sine-drop) с последующим
      высокочастотным свистом в ушах (Tinnitus notch-filter на 4.2 кГц) и грохотом
      падающих обломков.'
    - 'Камера: Травматический импульсный шейк (амплитуда 0.35 м, затухание 0.4 с),
      динамический зум FOV с 75 градусов до 62 градусов в момент вспышки и плавный
      возврат.'
    - 'UI/Тактильность: Короткая двойная вибрация (Haptic feedback 80 мс / 120 мс)
      на мобильных устройствах, красный индикатор радиуса ударной волны на полу, маркер
      BREACH SUCCESS.'
    failure_mode: 'Игрок подрывает стену, находясь слишком близко без поднятого щита
      (получает контузию и потерю 45 HP), либо устанавливает C4 на армированную сталь
      без термоленты (заряд детонирует вхолостую). Сигнал: красный крест на детонаторе
      и металлический звон.'
    mastery_curve: Новичок на 30-й секунде взрывает только центральные двери и попадает
      под встречный огонь. Эксперт на 10-м забеге использует накладной заряд для кинетического
      рикошета обломков стены, убивая зазевавшегося наемника физикой летящего куска
      бетона без единого выстрела.
    counterplay: Враги укрепляют стены титановыми кевларовыми щитами (требуют термического
      прожига 4.0 с) и устанавливают сейсмические датчики движения, открывая огонь
      насквозь через стену при шуме установки C4.
    synergies:
    - 'Штурмовой Slow-Mo Фокус: детонация стены автоматически триггерит окно замедления
      времени 0.2x.'
    - 'Эндоскопическая Разведка: эндоскоп подсвечивает точные стыки арматуры для максимального
      радиуса разлета обломков.'
    - 'Баллистический Щит: щит полностью поглощает фронтальную взрывную волну при
      близком подрыве.'
    why_unique: 'В отличие от скриптовых взрывов в обычных шутерах, здесь разрушение
      является честным физическим процессом на Rapier3D: выбитая дверь превращается
      в тяжелый физический снаряд, сбивающий врагов с ног.'
    pseudocode: "function onBreachDetonate(charge: C4Charge, wall: DestructibleWall):\
      \ void {\n  if (wall.isReinforced && !charge.hasThermite) { playDudSparks(charge.pos);\
      \ return; }\n  const fragments = RapierPhysics.fractureMesh(wall.mesh, 32);\n\
      \  fragments.forEach(f => f.applyImpulse(calcBlastVector(charge.pos, f.pos,\
      \ 450)));\n  const enemiesInRadius = SpatialGrid.queryRadius(charge.pos, 3.5);\n\
      \  enemiesInRadius.forEach(e => e.applyStun(calcStunDuration(e.distance, 2.5)));\n\
      \  TimeDilationSystem.triggerSlowMo(2.0, 0.2);\n  AudioEngine.playSpatialSubBoom(charge.pos,\
      \ 1.0);\n}"
  - name: Штурмовой Slow-Mo Фокус (Breach-Focus Time)
    role_in_loop: Двигатель точности и источник тактического превосходства (высокая
      награда за мастерство)
    player_decision: 'Как распределить 2.0 секунды замедления: сделать 3 быстрых хедшота
      по открытым целям или потратить время на поиск и отстрел капсюля лазерной мины-растяжки.'
    input_mapping: Активируется автоматически при детонации пролома; Повторный клик
      Shift / Тап по индикатору пульса — досрочный выход из Slow-Mo для сохранения
      энергии фокуса.
    states:
    - REALTIME_ACTIVE (время течет 1.0x, прицел стандартного размера)
    - SLOWMO_ENTER (плавная интерполяция таймскейла от 1.0x до 0.2x за 0.12 с, включение
      хроматической аберрации)
    - SLOWMO_RUNNING (посекундный расход шкалы адреналина, подсветка трассеров пуль
      и уязвимых зон врагов)
    - SLOWMO_EXIT (щелчок затвора, возврат таймскейла в 1.0x за 0.18 с, восстановление
      звукового спектра)
    parameters:
    - name: time_dilation_scale
      value: 0.20x
      tuning_note: Если сделать 0.05x (Superhot) — бой превращается в пошаговую головоломку
        без адреналина; если сделать 0.5x — мобильные игроки не успевают навестись
        пальцем.
    - name: base_focus_duration
      value: 2.0 с
      tuning_note: Если уменьшить до 0.8 с — игрок успевает сделать лишь 1 выстрел;
        если увеличить до 4.5 с — пропадает напряжение и цена промаха.
    - name: headshot_time_refund
      value: 0.35 с
      tuning_note: Если убрать — нет стимула стрелять точно в голову; если сделать
        1.0 с — опытный игрок находится в бесконечном Slow-Mo.
    - name: player_turn_speed_multiplier
      value: 1.8x
      tuning_note: Враги замедлены в 5 раз, но прицел игрока сохраняет высокую чувствительность
        (1.8x) для удобной микро-доводки на тачскрине.
    feedback_layers:
    - 'Визуал/VFX: Эффект радиального размытия по краям экрана (Radial Blur), яркие
      замедленные трассеры выстрелов с дымовым следом, зависшие в воздухе гильзы и
      крупицы штукатурки.'
    - 'Звук (Web Audio): Приглушение всех высоких частот через Low-Pass Filter (срез
      400 Гц), ритмичный тяжелый стук сердца (Heartbeat 55 BPM), выстрелы звучат как
      раскатистые басовые удары.'
    - 'Камера: Плавный кинематографичный наезд камеры вперед (Dolly Zoom +0.3 м),
      динамическая стабилизация прицельной марки.'
    - 'UI/Тактильность: Пульсирующая полоса адреналина в центре экрана, замедленное
      тиканье таймера штурма, легкая непрерывная микровибрация устройства.'
    failure_mode: 'Игрок паникует, делает хаотичные выстрелы в корпус, не убивает
      ключевых врагов за отведенные 2.0 секунды и оказывается в реальном времени под
      перекрестным огнем с пустым магазином. Сигнал: резкий срыв звукового фильтра
      в 1.0x, визг врагов и красный экран попаданий.'
    mastery_curve: Новичок за время замедления убивает 1 врага и тратит весь магазин.
      Эксперт за 1.8 с делает 3 выверенных хедшота с компенсацией отдачи и выбивает
      мину, продлевая Slow-Mo бонусами точности.
    counterplay: Элитные наемники в Комнате 3 экипированы тактическими шлемами со
      стимуляторами адреналина — их время реакции замедляется лишь до 0.6x (они открывают
      ответный огонь прямо в Slow-Mo).
    synergies:
    - 'Взрывной Бричинг: качественный подрыв в центр стены дает +25% к длительности
      Slow-Mo.'
    - 'Баллистический Щит: возможность безопасно оценить траектории пуль противников
      во время замедления.'
    - 'Эндоскопическая Разведка: заранее размеченные цели подсвечиваются яркими силуэтами
      в Slow-Mo.'
    why_unique: Slow-Mo здесь не бесконечное и не включается кнопкой когда угодно
      — это строго регламентированное тактическое окно кинематографичной зачистки,
      открываемое только успешным бричингом.
    pseudocode: "function updateSlowMoTick(dt: number, focusState: FocusData): void\
      \ {\n  if (!focusState.isActive) return;\n  focusState.remainingTime -= dt;\n\
      \  AudioEngine.setLowPassCutoff(THREE.MathUtils.lerp(400, 20000, 1.0 - focusState.remainingTime\
      \ / 2.0));\n  if (PlayerWeapon.onEnemyHit(HitZone.HEAD)) {\n    focusState.remainingTime\
      \ = Math.min(focusState.remainingTime + 0.35, 3.0);\n    VFXEngine.spawnHeadshotSpark(PlayerWeapon.targetPos);\n\
      \  }\n  if (focusState.remainingTime <= 0) {\n    TimeDilationSystem.setTimeScale(1.0);\n\
      \    focusState.isActive = false;\n  }\n}"
  - name: Баллистический Щит и Тактические Наклоны (Tactical Shield & Lean)
    role_in_loop: Защитный стабилизатор и регулятор риска (баланс между неуязвимостью
      и открытием для стрельбы)
    player_decision: Оставаться в глухой фронтальной защите, принимая пули на бронесталь,
      или выглянуть вправо (Lean E) на 0.4 секунды для прицельного выстрела, подставив
      открытое плечо.
    input_mapping: Клавиши Q / E (или кнопки-стрелки по краям экрана на мобильных)
      — наклон влево/вправо; Зажатие ПКМ — поднятие щита в глухую оборону; ЛКМ — выстрел
      из пистолета с упора.
    states:
    - FULL_GUARD (щит закрывает 80% экрана, скорость движения -40%, 100% защита от
      пуль спереди)
    - LEAN_PEEKING (камера и ствол вынесены в сторону на 0.45 м, открыта уязвимая
      зона руки/плеча)
    - GLASS_CRACKED (смотровое стекло получило критический урон, обзор затруднен паутиной
      трещин)
    - SHIELD_STAGGER (попадание тяжелой пули/гранаты выбивает щит в сторону на 0.65
      с)
    parameters:
    - name: shield_hp_max
      value: 350 ед
      tuning_note: Если сделать 100 ед — щит разбивается за 2 выстрела и теряет смысл;
        если сделать 1000 ед — игрок становится бессмертным танком.
    - name: lean_angle_deg
      value: 14 градусов
      tuning_note: Если уменьшить до 5 градусов — наклон не дает угла обзора за угол;
        если увеличить до 30 градусов — моделька неестественно падает вбок.
    - name: lean_transition_time
      value: 0.18 с
      tuning_note: Если уменьшить до 0.05 с — нет ощущения массы титанового щита;
        если увеличить до 0.5 с — игрок не успевает стрелять между очередями врагов.
    - name: glass_durability_shots
      value: 12 пуль
      tuning_note: После 12 попаданий в триплекс стекло покрывается плотной сеткой
        трещин, вынуждая выглядывать из-за щита вслепую.
    feedback_layers:
    - 'Визуал/VFX: Искры и вмятины на бронеплите щита при попаданиях, нарастающая
      паутина трещин на баллистическом стекле, дым от пороховых газов при выстреле
      с упора.'
    - 'Звук (Web Audio): Звонкий металлический лязг рикошетов пуль о сталь (Bell-metallic
      ping), глухой стук попаданий в титан, механический скрежет фиксаторов щита при
      наклоне.'
    - 'Камера: Смещение оси камеры на 0.45 м вбок с креном 14 градусов, легкий толчок
      назад (0.05 м) при поглощении тяжелых пуль щитом.'
    - 'UI/Тактильность: Индикатор целостности щита (Shield Durability bar) и смотрового
      окна, сильная прерывистая виброотдача при пулеметном обстреле щита.'
    failure_mode: 'Игрок жадничает, задерживает наклон (Lean) дольше 0.5 с во время
      очереди пулеметчика и ловит летальные пули в открытое плечо. Сигнал: кровавый
      всплеск на экране и стон ранения бойца.'
    mastery_curve: Новичок сидит в глухой обороне, пока враги не разобьют стекло щита.
      Эксперт ритмично использует Quick-Lean Peek за 0.18 с в паузах между выстрелами
      террористов, не получая урона в тело.
    counterplay: Враги бросают гранаты под ноги за щит и заходят с двух флангов одновременно,
      перегружая фронтальный сектор блокирования.
    synergies:
    - 'Штурмовой Slow-Mo: в замедлении наклоны позволяют филигранно уворачиваться
      от летящих трассеров.'
    - 'Взрывной Бричинг: щит полностью блокирует осколки собственной взрывчатки при
      близком подрыве.'
    - 'Обезвреживание СВУ: возможность одной рукой держать щит в сторону врага во
      время разрезания проводов.'
    why_unique: 'Щит — это не пассивная прибавка к броне, а физический трехмерный
      объект в пространстве: игрок вручную позиционирует его плоскость относительно
      вражеских дул.'
    pseudocode: "function processShieldBlock(incomingBullet: Bullet, shield: BallisticShield,\
      \ isLeaning: boolean): HitResult {\n  if (isLeaning && isHitExposedArm(incomingBullet.ray))\
      \ {\n    return PlayerHealth.applyDirectDamage(incomingBullet.damage);\n  }\n\
      \  if (shield.bounds.intersectsRay(incomingBullet.ray)) {\n    shield.durability\
      \ -= incomingBullet.caliberPower;\n    VFXEngine.spawnSparks(incomingBullet.impactPoint,\
      \ shield.normal);\n    AudioEngine.playMetalRicochet(incomingBullet.caliber);\n\
      \    if (shield.isGlassHit(incomingBullet.impactPoint)) shield.addGlassCrack();\n\
      \    return HitResult.BLOCKED;\n  }\n  return PlayerHealth.applyDirectDamage(incomingBullet.damage);\n\
      }"
  - name: Эндоскопическая Разведка (Optic-Wand Recon)
    role_in_loop: Информационный двигатель и тактический предвестник штурма (снижение
      неопределенности)
    player_decision: Потратить 3 секунды на детальный осмотр комнаты через щель, чтобы
      выявить растяжки и расстановку наемников, или пойти на быстрый слепой штурм
      ради сохранения таймера миссии.
    input_mapping: Удержание клавиши 'F' / Кнопка 'Камера' на экране — опустить кабель
      эндоскопа под дверь; Перемещение мыши / Джойстик — вращение микрокамеры на 120
      градусов; Клик ЛКМ — расстановка тактических меток.
    states:
    - RECON_INACTIVE (вид от первого лица перед запертой дверью)
    - CABLE_DEPLOYING (анимация просовывания гибкого зонда под дверное полотно 0.8
      с)
    - OPTIC_SCANNING (монохромный интерфейс ночного видения/тепловизора, маркировка
      угроз)
    - RECON_RETRACTING (быстрый возврат камеры в штурмовую позицию 0.4 с)
    parameters:
    - name: scan_field_of_view
      value: 120 градусов
      tuning_note: Если уменьшить до 45 градусов — игрок не видит засады по углам
        комнат; если сделать 360 градусов — теряется необходимость крутить камеру
        зонда.
    - name: recon_time_cost
      value: 3.5 с
      tuning_note: Время штурмового таймера продолжает тикать во время разведки, создавая
        баланс между безопасностью и спешкой.
    - name: max_threat_tags
      value: 4 метки
      tuning_note: Ограничение на количество подсвечиваемых сквозь стену целей (приоритезация
        самых опасных врагов).
    - name: recon_noise_level
      value: 15 дБ
      tuning_note: Если держать камеру под дверью дольше 6 секунд, патрульный боевик
        может заметить зонд и прострелить дверь сверху.
    feedback_layers:
    - 'Визуал/VFX: Зернистый монохромный зеленый интерфейс микрокамеры (Night-Vision
      CRT-noise), красные тепловые силуэты наемников сквозь дым, желтые контуры растяжек
      C4.'
    - 'Звук (Web Audio): Высокочастотный электронный писк включения ночного видения
      (12 кГц beep), приглушенные радиопереговоры террористов за дверью, звук жужжания
      микромотора кабеля.'
    - 'Камера: Переключение на широкоугольный объектив типа ''рыбий глаз'' (Fisheye
      distorsion 0.35) с легким виньетированием.'
    - 'UI/Тактильность: Наложение тактической сетки с дальномером, появление постоянных
      3D-маркеров врагов над дверным полотном после выхода из режима.'
    failure_mode: 'Игрок задерживается в режиме эндоскопа слишком долго, террорист
      замечает объектив под дверью, кричит Контакт! и стреляет очередью сквозь дверь
      в лицо оперативнику. Сигнал: резкий треск помех на экране сканера и падение
      HP.'
    mastery_curve: Новичок осматривает только середину комнаты и пропускает растяжку
      у порога. Эксперт за 1.5 секунды сканирует углы, ставит метку на пулеметчика
      и сразу переходит к установке C4 точно напротив головы командира.
    counterplay: Боевики устанавливают глушилки радиосигнала (создающие артефакты
      на экране эндоскопа) и прячут растяжки за мебелью вне прямого сектора обзора
      щели.
    synergies:
    - 'Взрывной Бричинг: метки эндоскопа позволяют разместить заряд C4 с идеальным
      поражением врагов за стеной.'
    - 'Штурмовой Slow-Mo: заранее размеченные цели подсвечиваются в замедлении, экономя
      доли секунды на прицеливание.'
    - 'Обезвреживание СВУ: разведка серверной заранее показывает световую схему верного
      провода детонатора.'
    why_unique: Разведка эндоскопом дает осязаемое преимущество, перенося тактическую
      информацию в основную фазу боя в виде сквозных AR-маркеров (Augmented Reality)
      на Three.js.
    pseudocode: "function updateOpticRecon(opticCable: OpticWand, dt: number): void\
      \ {\n  if (!opticCable.isDeployed) return;\n  opticCable.exposureTimer += dt;\n\
      \  const visibleThreats = FrustumCuller.getObjectsInCone(opticCable.headPos,\
      \ opticCable.lookDir, 120);\n  visibleThreats.forEach(threat => {\n    if (threat.isSpottedByPlayerRay())\
      \ threat.addPersistentARMarker();\n  });\n  if (opticCable.exposureTimer > 6.0\
      \ && Math.random() < 0.25) {\n    EnemyAI.triggerDoorWallbangAlert(opticCable.doorRef);\n\
      \    opticCable.forceRetract();\n  }\n}"
  - name: Обезвреживание СВУ под Огнем и Разрезание Проводов (Defusal Tension QTE)
    role_in_loop: Финальный тормоз и кульминационный источник напряжения миссии
    player_decision: Приступить к обезвреживанию бомбы прямо сейчас, прикрываясь щитом
      от выжившего стрелка, или сначала добить врага, рискуя опоздать по таймеру детонатора.
    input_mapping: Удержание 'E' / Тап по корпусу бомбы — открыть панель взрывателя;
      ЛКМ / Свайп кусачками по нужному проводу (Красный/Синий/Желтый); ПКМ — удерживать
      щит свободной рукой.
    states:
    - BOMB_ARMED_COUNTDOWN (таймер бомбы пищит с нарастающей частотой, до взрыва 15-25
      с)
    - DEFUSAL_PANEL_OPEN (открытие электронной схемы с 3 цветными проводами и микрочипом)
    - 'WIRE_SNIP_VERIFICATION (анализ логической схемы: провод питания, заземление,
      триггер детонации)'
    - BOMB_DEFUSED_SUCCESS (отключение звука таймера, зеленый светодиод, победа в
      операции)
    parameters:
    - name: bomb_timer_limit
      value: 25.0 с
      tuning_note: Если сделать 10 с — игрок физически не успевает зачистить комнату;
        если сделать 60 с — таймер перестает создавать нерв и спешку.
    - name: wire_cut_reaction_window
      value: 1.2 с
      tuning_note: Время на выбор верного провода по подсказке из эндоскопа (соответствие
        цвета маркировке на стене).
    - name: one_handed_shield_coverage
      value: 55%
      tuning_note: Во время обезвреживания бомбы щит прикрывает только торс сбоку,
        оставляя спину и ноги уязвимыми.
    - name: wrong_wire_penalty
      value: -8.0 с от таймера
      tuning_note: Ошибка при срезе провода мгновенно сжигает 8 секунд на таймере
        детонатора, вводя игрока в критический стресс.
    feedback_layers:
    - 'Визуал/VFX: Крупный план цифрового дисплея СВУ с быстро меняющимися красными
      цифрами, искры от кусачек при перерезании медной жилы, зеленый залп светодиодов
      успеха.'
    - 'Звук (Web Audio): Ускоряющийся частый писк зуммера бомбы (от 1 Гц до 8 Гц на
      последних секундах), металлический щелчок инструмента, облегченный выдох бойца.'
    - 'Камера: Жесткий динамический фокус на электронный блок бомбы с размытием заднего
      плана (Depth of Field), тревожное покачивание при близких выстрелах.'
    - 'UI/Тактильность: Пульсирующий красный оверлей тревоги, частые короткие виброимпульсы
      в такт таймеру бомбы, кнопка CUT WIRE.'
    failure_mode: 'Игрок в спешке перерезает провод-ловушку (Trigger wire) вместо
      провода питания или не успевает обезвредить заряд до истечения таймера. Сигнал:
      непрерывный гудок зуммера, белый экран взрыва и провал миссии.'
    mastery_curve: Новичок пытается сначала полностью убить всех врагов, теряет время
      и взрывается на последних секундах. Эксперт блокирует огонь щитом в угол, за
      2.5 секунды считывает схему и обезвреживает бомбу прямо под градом пуль.
    counterplay: Последний бронированный наемник в серверной бросает дымовую шашку
      перед бомбой, ослепляя оперативника и мешая разглядеть цветовую маркировку проводов.
    synergies:
    - 'Эндоскопическая Разведка: разведка серверной заранее показывает световую схему
      верного провода на мониторе схем.'
    - 'Баллистический Щит: возможность одной рукой держать щит в сторону врага, пока
      вторая орудует кусачками.'
    why_unique: Обезвреживание бомбы — это не скучное стояние с зажатой кнопкой на
      5 секунд (как в Counter-Strike), а микро-тактическая головоломка в реальном
      времени под звуки боя.
    pseudocode: "function onCutWire(bomb: C4BombLogic, wireColor: WireColor): DefusalResult\
      \ {\n  if (wireColor === bomb.disarmTargetWire) {\n    bomb.isArmed = false;\n\
      \    AudioEngine.playDisarmSuccessJingle();\n    GameState.triggerMissionVictory();\n\
      \    return DefusalResult.SUCCESS;\n  } else {\n    bomb.remainingTimeSec =\
      \ Math.max(0, bomb.remainingTimeSec - 8.0);\n    AudioEngine.playWarningBuzzer();\n\
      \    VFXEngine.spawnShortCircuitSparks(bomb.panelPos);\n    if (bomb.remainingTimeSec\
      \ <= 0) GameState.triggerBombExplosionDefeat();\n    return DefusalResult.TIME_PENALTY;\n\
      \  }\n}"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 65
  max_triangles_or_sprites: 40000
  bundle_size_budget_mb: 4.0
  layers:
  - name: Core Layer
    responsibility: Game loop, Time manager, State machine, EventBus
  - name: Physics Layer
    responsibility: Rapier3D integration, Raycasting for bullets, Debris collision
      rigidbodies
  - name: Rendering Layer
    responsibility: Three.js Scene Graph, Mesh Batching, Custom shaders for slowmo/smoke,
      Dynamic lighting
  - name: Gameplay Systems
    responsibility: Breach controller, Tactical AI FSM, Weapon ballistic raycaster,
      Shield dynamics
  - name: Audio Layer
    responsibility: Web Audio API procedural sound synthesizer, Spatial audio nodes,
      Low-pass filter for concussion
  - name: Platform Layer
    responsibility: Playgama Bridge SDK wrapper, Storage, Ads manager, Responsive
      canvas handler
  modules:
  - description: Обрабатывает детонацию зарядов, замену цельной геометрии стены на
      разрушенную и спавн физических осколков
    name: BreachManager
  - description: Контролирует шкалу замедления времени, плавный lerp Time.scale и
      аудио-питч
    name: TimeDilationManager
  - description: Обрабатывает позицию щита, стойку оперативника, наклоны lean (Q/E)
      и расчет попаданий в броню
    name: ShieldController
  - description: Конечный автомат поведения врагов (укрытия, реакция на оглушение,
      прицеливание и стрельба)
    name: CombatAIController
  - description: Расчет баллистических лучей, разброса, отдачи оружия и регистрации
      хедшотов
    name: WeaponSystem
  - description: 'Связь с SDK Playgama: сохранение прогресса в облако, показ рекламы
      и лидерборды'
    name: PlaygamaBridgeService
monetization:
  strategy_summary: 'Гибридная этичная модель: вознаграждающие видео (Rewarded Video)
    для получения удвоенных кредитов рейда и второй попытки штурма (Второе дыхание
    / бронепластина), интерстишиалы между завершенными операциями с соблюдением таймера,
    а также косметические IAP-наборы оперативников.'
  rewarded_placements:
  - id: tactical_revive
    name: Экстренный Медпакет (Второе Дыхание)
    benefit: Мгновенное воскрешение оперативника с восстановленным щитом для завершения
      текущей комнаты
    cooldown_or_limit: 1 раз за операцию
    trigger_moment: Экран поражения при гибели бойца
  - id: double_mission_reward
    name: Удвоение Тактических Кредитов
    benefit: Умножение заработанных за зачистку объекта средств на 2
    cooldown_or_limit: После каждого успешного рейда
    trigger_moment: Экран победы и подсчета очков
  - id: supply_airdrop
    name: Премиум Боезапас Спецсредств
    benefit: Дополнительный термозаряд и светошумовая граната перед сложным штурмом
    cooldown_or_limit: 1 раз в 10 минут
    trigger_moment: Экран планирования экипировки
  interstitial_placements:
  - trigger_event: Завершение полного рейда (3 комнаты)
    cooldown_seconds: 90
    conditions: Показывается только между рейдами при переходе в главное меню; никогда
      не прерывает геймплей внутри комнаты
  in_app_purchases:
  - sku: pack_special_forces_elite
    name: Элитный Набор Оперативника 'Черный Монолит'
    description: Уникальный тактический скин бойца, оружия и щита из карбона + 5000
      кредитов
    price_tier: Tier 2 ($1.99)
    reward: Скин 'Black Monolith', 5000 credits
  - sku: pack_breacher_pro
    name: Тактический Арсенал Бричера
    description: Мгновенная разблокировка дробовика M870 и коллиматорного прицела
      Holo-Dot
    price_tier: Tier 1 ($0.99)
    reward: Оружие M870, прицел Holo-Dot
  fairness_rules:
  - Реклама никогда не показывается во время активной перестрелки или бричинга
  - Весь арсенал и улучшения щита доступны за обычную внутриигровую валюту без доната
  - Минимальный интервал между полноэкранными баннерами строго ограничен 90 секундами
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - Yandex Games
  - VK Play
  - CrazyGames
  - GameDistribution
  - Standalone Web
  initialization_flow:
  - 1. Bridge.init() на старте загрузки игры
  - 2. Проверка состояния платформы и доступности SDK
  - 3. Загрузка данных сохранения игрока через Bridge.storage.get()
  - 4. Инициализация аудио-контекста по первому взаимодействию с экраном
  - 5. Вызов Bridge.platform.sendMessage('game_ready')
  cloud_save_keys:
  - player_credits
  - unlocked_weapons
  - shield_upgrade_level
  - completed_missions_mask
  - player_settings
  leaderboards:
  - best_assault_time_sec
  - total_terrorists_neutralized
  - headshot_master_rating
  ads_integration:
    banner_support: false
    interstitial_support: true
    rewarded_support: true
    sound_auto_pause: true
  lifecycle_hooks:
  - Bridge.advertisement.on('interstitial_state_changed', handleAdState)
  - Bridge.advertisement.on('rewarded_state_changed', handleRewardState)
  - Bridge.game.on('visibility_changed', handleVisibilityChange)
art:
  style_name: Тактический Полуреализм (Low-Poly / Hard-Surface CQB)
  camera_perspective: First-Person (Вид от первого лица) с динамическим FOV и покачиванием
    при отдаче
  camera_fov: 75
  camera_pitch_angle: 0
  environment_theme: 'Захваченное дипломатическое посольство: бетонные колонны, офисные
    перегородки из гипсокартона, серверные стойки, армированные двери и тактическое
    освещение'
  character_proportions: Реалистичные анатомические пропорции бойцов спецназа и боевиков
    в бронежилетах и шлемах
  lighting_setup: 'Контрастное интерьерное освещение: холодный рассеянный свет офисных
    ламп, теплые лучи тактических подствольных фонарей, яркие объемные вспышки от
    выстрелов и детонации C4'
  color_palette:
    breach_orange_fire: '#ff6a00'
    concrete_grey: '#525960'
    laser_sight_red: '#ff1e27'
    nvg_thermal_green: '#00ff66'
    shield_glass_cyan: '#4deeea'
    tactical_kevlar: '#1a1e24'
  vfx_list:
  - Разлет 3D-обломков и осколков штукатурки при детонации стены
  - Объемные клубы дымовой завесы и пыли с плавным рассеиванием
  - Вспышки дульного пламени (muzzle flash) с динамической подсветкой стен
  - Светящиеся трассеры пуль с размытием в движении (motion trail)
  - Искры от рикошетов пуль по баллистическому щиту
  - 'Пост-процессинг Slow-Mo: хроматическая аберрация и радиальное размытие'
  ui_theme: 'Mil-Spec HUD: высокотехнологичный минималистичный интерфейс тактического
    шлема с бирюзовыми и янтарными акцентами, четкой типографикой и индикацией прочности
    щита'
ui_ux:
  hud_elements:
  - Индикатор прочности баллистического щита (Shield Integrity Bar)
  - Шкала тактического фокуса Slow-Mo (Breach Focus Gauge)
  - Счетчик патронов в магазине и резерве
  - Мини-схема помещений с отметками зачищенных секторов
  - Динамический тактический прицел-перекрестие с индикатором хедшота
  - Индикатор направления входящего огня (Damage Indicator)
  screens:
  - name: MainMenuScreen
    purpose: Выбор спецопераций, вход в оружейную, настройки звука и графики
  - name: ArmoryScreen
    purpose: Кастомизация оружия, установка коллиматоров, прокачка баллистического
      щита и покупка скинов
  - name: BreachPlanningScreen
    purpose: Предварительный выбор точки штурма и типа взрывчатки перед входом в комнату
  - name: GameplayHUDScreen
    purpose: 'Интерфейс боя: прицел, здоровье щита, медленное время, индикаторы наклона'
  - name: AfterActionReportScreen
    purpose: 'Итоги штурма: время прохождения, меткость, хедшоты, награды и кнопка
      удвоения'
  mobile_controls_layout: Зона прицеливания и стрельбы — правая половина экрана (точечные
    тапы по врагам); Кнопки наклона щита Lean Q/E — плавающие полупрозрачные иконки
    по левому краю; Кнопка детонатора C4 — крупная акцентная кнопка внизу по центру.
  keyboard_controls:
    Left Click (ЛКМ): Прицельный выстрел
    Q / E: Тактический наклон влево / вправо из-за щита
    R: Тактическая перезарядка магазина
    Right Click (ПКМ): Вскидка оружия / фиксация щита в глухой обороне
    Space / F: Детонация пробивного заряда C4 / бросок гранаты
    Tab: Просмотр тактической схемы объекта
    W / A / S / D: Смена тактической позиции укрытия
  touch_controls:
    Кнопка 'Щит': Переход в глухую фронтальную защиту
    Свайп детонатора вверх: Подрыв заряда и мгновенный штурм
    Тап по иконкам Lean L/R: Наклон корпуса из-за щита
    Тап по силуэту врага: Мгновенный выстрел в указанную анатомическую зону в slow-mo
    Тап по стене: Установка пробивного заряда на подсвеченную слабую зону
  wireframes_ascii: '+---------------------------------------------------------------------+

    | [ROOM 2/3]                      [TIME 01:24]           [RECON: SAFE] |

    |                                                                     |

    |                      /~~~~~~~~~~~~~~~~~~~~~\                        |

    |                     |   [ПРОЛОМ В СТЕНЕ]    |                       |

    |    [LEAN L]         |      (БОЕВИК 1)       |        [FIRE: TAP]    |

    |                     |      /         \      |                       |

    |    [LEAN R]         |  (БОЕВИК 2) (БОЕВИК 3)|                       |

    |                      \~~~~~~~~~~~~~~~~~~~~~/                        |

    |                                                                     |

    | [SHIELD: 85%]             [C4 DETONATE]             [AMMO: 24/72]   |

    |  ||||||||||                (SWIPE UP)                 [RELOAD (R)]  |

    +---------------------------------------------------------------------+'
  visual_language: 'Интерфейс спецназа: матовые темно-серые плашки с 1px неоновой
    рамкой, моноширинные шрифты тактических приборов, контрастные индикаторы опасности.'
  accent_roles:
    critical_danger: '#ff1e27 (Красный - маркеры врагов и растяжек)'
    primary_action: '#ff6a00 (Оранжевый взрывной - для кнопок детонации и штурма)'
    safe_success: '#00ff66 (Зеленый - индикатор зачищенной зоны)'
    tactical_info: '#4deeea (Бирюзовый - для статуса щита и фокуса)'
  typography: Roboto Mono / Orbitron (чистый military-tech гротеск высокой читаемости)
  components:
  - TacticalButton
  - ShieldHealthGauge
  - SlowMoFocusBar
  - AmmoCounterHUD
  - ThreatMarker3D
  - RewardSummaryCard
  hud_anchors:
    bottom_center: Кнопка детонации C4 / шкала Slow-Mo Focus
    bottom_left: Индикатор прочности баллистического щита и кнопки Lean
    bottom_right: Счетчик патронов и кнопка перезарядки
    center: Динамическое прицельное перекрестие
    top_center: Таймер операции и статус комнат (1/3, 2/3, 3/3)
  screen_flow: MainMenu -> Armory (снаряжение) -> BreachPlanning (выбор точки взлома)
    -> GameplayLoop (Штурм комнат 1-3) -> AfterActionReport (награды) -> MainMenu
  feedback_moments:
  - 'При наведении на уязвимую точку стены: контур подсвечивается неоновым оранжевым'
  - 'При попадании в голову врага: сочный щелчок каски и появление красного перекрестия
    ''Headshot Kill'''
  - 'При попадании вражеской пули в щит: вспышка искр, звук удара по металлу и микро-сотрясение
    камеры'
  diegetic_elements:
  - Трещины и сколы на стекле баллистического щита, отражающие реальное состояние
    брони
  - Лазерные целеуказатели врагов, рисующие красные точки на стенах и щите
  - Светодиодный таймер детонатора на руке бойца
  state_coverage:
  - Экран паузы при потере фокуса окна браузера
  - Индикация потери соединения с облаком сохранений
  - Экран окончания патронов с визуальной подсказкой перезарядки
mobile:
  orientation: landscape
  touch_implementation: 'Мультитач-обработка без плавающих виртуальных джойстиков:
    зоны тапа с увеличенным радиусом хитбокса (48x48 dp), мгновенный отклик тача без
    300ms задержки, поддержка одновременного удержания щита и тапов стрельбы.'
  safe_area_handling: Динамический отступ UI-элементов от вырезов камеры (notches)
    и закруглений экрана через CSS env(safe-area-inset-*).
  performance_throttling:
  - Автоматическое снижение количества физических осколков с 24 до 12 на слабых GPU
  - Отключение эффекта объемного размытия в Slow-Mo на мобильных устройствах
  - Пул статических мешей (Object Pooling) для гильз, пуль и декалей выстрелов
  - Динамическое масштабирование разрешения рендера (0.85x при просадке ниже 50 FPS)
audio:
  engine: Web Audio API + Howler.js
  music_tracks:
  - Ambient Tactical Tension (фаза планирования и разведки)
  - Adrenaline Breach Rush (фаза штурма в slow-mo)
  - Mission Accomplished Victory Theme (экран победы)
  sfx_list:
  - Глухой суб-басовый взрыв заряда C4 (45-60 Гц)
  - Звон контузии (Tinnitus high-pitch sine wave) после светошумовой гранаты
  - Хлесткие выстрелы с пространственной реверберацией закрытого помещения
  - Звук рикошета и ударов пуль по металлу щита
  - Щелчок перезарядки затворной задержки
  - Замедленный глухой стук сердца (Heartbeat) в режиме Slow-Mo
  spatial_audio: true
  web_audio_synthesizer: Процедурная генерация низкочастотных басовых ударов и шума
    контузии через Web Audio BiquadFilterNode и OscillatorNode.
qa:
  functional_tests:
  - 'Тест детонации C4: стена корректно разрушается, спавнятся физические осколки,
    генерируется проход'
  - 'Тест замедления времени: Time.scale плавно переходит в 0.2 и возвращается в 1.0
    по истечении таймера'
  - 'Тест баллистики: попадание в голову мгновенно уничтожает врага, попадание в тело
    снимает броню'
  - 'Тест баллистического щита: щит блокирует 100% фронтального урона при активной
    стойке'
  - Тест переходов между 3 комнатами штурма без утечек памяти Three.js
  performance_benchmarks:
  - Стабильные 60 FPS на iPhone 11 / Redmi Note 9 и выше в разрешении 1080p
  - Не более 65 Draw Calls в момент взрыва стены с 24 физическими осколками
  - Время полной загрузки ассетов первого уровня менее 2.5 секунд на 4G-соединении
  - Потребление оперативной памяти вкладки браузера не более 180 МБ
  cross_browser_matrix:
  - Google Chrome (Windows, macOS, Android) - WebGL 2.0 / Web Audio
  - Safari (iOS 15+, iPadOS, macOS) - WebGL / Touch Events
  - Yandex Browser (Desktop / Mobile) - Интеграция Playgama SDK
  - Mozilla Firefox (Desktop) - WebGL 2.0
  common_bug_checklist:
  - Залипание звука контузии при закрытии вкладки или потере фокуса
  - Прохождение пули сквозь стены при низком FPS (решено через Continuous Raycast)
  - Некорректная ориентация экрана при повороте смартфона во время штурма
  - Утечки материалов Three.js при многократном перезапуске уровней
roadmap:
- phase_number: 1
  title: Core Prototype (Бричинг и Slow-Mo)
  duration_days: 2
  tasks:
  - Настройка сцены комнаты Three.js и контроллера камеры FPS
  - Интеграция Rapier3D и прототипа разрушаемой стены
  - Реализация замедления времени (Slow-Mo) при детонации C4
  milestone_deliverable: Играбельный прототип подрыва стены и ликвидации 2 манекенов
    в замедленном времени.
- phase_number: 2
  title: Combat & Shield System (Щит и Перестрелка)
  duration_days: 2
  tasks:
  - Реализация баллистического щита и механики наклонов Lean Q/E
  - Система точечной летальной баллистики (ваншот в голову)
  - 'ИИ противников: укрытия, оглушение от взрыва, ответный огонь'
  milestone_deliverable: Полноценный боевой контакт в комнате с блокированием пуль
    щитом и наклонами.
- phase_number: 3
  title: Level Flow & Tactics (3 Комнаты и Разведка)
  duration_days: 2
  tasks:
  - Создание 3 последовательных комнат посольства с нарастающей сложностью
  - Механика эндоскопической разведки и растяжек
  - Система подсчета очков, звезд и таймеров комнат
  milestone_deliverable: Полная цепочка штурма объекта на 90-120 секунд с переходом
    между секторами.
- phase_number: 4
  title: Polish, Audio & Playgama SDK (Релизная полировка)
  duration_days: 1
  tasks:
  - Интеграция Playgama Bridge SDK (сохранения, реклама, лидерборды)
  - Внедрение пространственного звука Web Audio и фильтра контузии
  - Оптимизация для мобильных устройств (Object pooling, Lod)
  milestone_deliverable: Готовый релизный билд v1.0, оптимизированный под Яндекс Игры
    и мобильные браузеры.
risks:
- risk: Падение FPS на бюджетных мобильных устройствах при одновременном расчете физики
    24 осколков стены
  category: technical
  severity: High
  mitigation: Использование инстансинга (InstancedMesh) для осколков, лимит 12 физических
    тел на мобилках и быстрое засыпание (sleep) тел через 1.5 сек
- risk: Сложность точного прицеливания на смартфонах без мыши в динамичном шутере
  category: gameplay
  severity: Medium
  mitigation: Механика тактического замедления времени (Slow-Mo) и увеличенные зоны
    регистрации попаданий (hitbox magnifiers) по силуэтам
- risk: Блокировка аудио-контекста политикой браузеров до первого клика
  category: technical
  severity: Medium
  mitigation: Отложенная инициализация Web Audio AudioContext по первому тапу по экрану
    в главном меню
skills:
- skill_id: threejs-destructible-breach-physics
  name: Three.js & Rapier3D Разрушаемые Преграды
  filename: skills/threejs_destructible_breach.md
  purpose: Создание процедурно разрушаемых стен и дверей с генерацией динамических
    физических осколков
  when_to_use: При реализации механики бричинга C4 и разрушения дверных баррикад
  rules:
  - Заменять цельный меш стены на составной разбитый каркас в момент детонации
  - Использовать InstancedMesh для обломков с общим материалом для экономии Draw Calls
  - Удалять или отключать физику мелких осколков через 1.5 секунды после взрыва
  architecture: Модуль BreachPhysicsManager подписывается на событие ON_BREACH_DETONATED,
    деактивирует статический коллайдер стены и активирует пул динамических Rigidbody
    Rapier3D с радиальным импульсом.
  implementation_guidance: Применять предварительно разбитые фрагменты геометрии (Voronoi
    fracture) вместо вычислений CSG в реальном времени в браузере.
  common_mistakes:
  - Использование сложной физической сетки для каждого мелкого осколка
  - Неосвобожденная память геометрий при частых перезапусках уровня
  checklist:
  - Меш стены разделен на фрагменты
  - Коллайдер прохода открывается мгновенно
  - FPS стабилен в момент подрыва
  knowledge_refs:
  - physics/rapier3d-destructible-mesh.md
  - rendering/threejs-instanced-mesh-optimization.md
- skill_id: tactical-slowmo-time-controller
  name: Тактический Менеджер Замедления Времени
  filename: skills/tactical_slowmo_time.md
  purpose: Плавная модуляция шкалы времени Time.scale, синхронизация шейдеров и питча
    Web Audio
  when_to_use: При активации фазы штурма после подрыва стены или броска светошумовой
    гранаты
  rules:
  - Интерполяция delta time через плавный lerp для устранения рывков анимации
  - Синхронное изменение скорости воспроизведения звуков и частоты среза фильтра контузии
  - Корректный учет независимого от slowmo таймера UI
  architecture: Класс TimeManager управляет timeScale глобального цикла, рассылая
    события в RenderingEngine, PhysicsStep и AudioManager.
  implementation_guidance: Для физики Rapier3D передавать scaledDeltaTime в метод
    physicsWorld.step(dt).
  common_mistakes:
  - Замедление работы систем UI и обработки тача вместе с геймплеем
  - Резкий скачок timeScale без сглаживания
  checklist:
  - Физика и анимация замедляются корректно
  - Тач-управление остается отзывчивым
  - Звуковой фильтр отключается по окончании slowmo
  knowledge_refs:
  - gameplay/time-dilation-patterns.md
  - audio/web-audio-pitch-modulation.md
- skill_id: game_skill
  name: 'Тактика Прорыва: CQB Штурм Domain Architecture'
  filename: GAME_SKILL.md
  purpose: 'Defines domain rules, state machine, and core gameplay loop for Тактика
    Прорыва: CQB Штурм.'
  when_to_use: Use when writing or modifying core game state, loop coordination, and
    progression.
  rules:
  - Strict TypeScript strict mode without any 'any' types.
  - Fixed 60Hz delta accumulator with delta clamping.
  - Decoupled state management via typed EventBus.
  - Zero runtime object allocations inside the 60Hz game loop.
  architecture: 'Decoupled 3-layer architecture: Application/Platform -> Engine/Systems
    -> Rendering/UI.'
  implementation_guidance: Instantiate Game instance from main.ts, bootstrap PlaygamaService,
    and start GameLoop.
  common_mistakes:
  - Do not instantiate Three.js meshes or heavy objects inside tick loops.
  - Do not bypass the EventBus for cross-system communications.
  checklist:
  - Game initializes cleanly and loads within 3 seconds.
  - EventBus routes inputs and system events without memory leaks.
  - Audio auto-pauses and unpauses cleanly with browser focus changes.
  knowledge_refs: []
- skill_id: gameplay_skill
  name: Combat, Physics & Movement Systems
  filename: GAMEPLAY_SKILL.md
  purpose: Defines standards for physics simulation, combat mechanics, and tactile
    player feedback.
  when_to_use: Use when writing character controllers, weapon systems, collision listeners,
    and juice/VFX.
  rules:
  - Clamp delta time to maximum 100ms to prevent physics tunneling.
  - Use continuous collision detection (CCD) for fast projectiles.
  - Apply hitstop (40ms time dilation) on impactful strikes.
  - Always synchronize physics rigid body transforms to mesh representations.
  architecture: Physics engine (Rapier3D/Matter.js) stepped on fixed 60Hz timestep,
    meshes interpolated.
  implementation_guidance: Use EventBus to emit 'entity:hit', 'combat:parry', 'wave:cleared'
    events for sound and VFX triggers.
  common_mistakes:
  - Never modify transform matrices directly on physics-controlled entities.
  - Do not hardcode magic numbers for damage or velocities without centralized configuration.
  checklist:
  - Player movement is responsive with no input lag.
  - Hits produce satisfying sensory feedback (VFX spark, screen shake, audio impact).
  - Ragdoll or death animations trigger smoothly without physics jitter.
  knowledge_refs: []
- skill_id: renderer_skill
  name: THREEJS WebGL Performance Guide
  filename: RENDERER_SKILL.md
  purpose: Optimization and visual standards for THREEJS WebGL pipeline.
  when_to_use: Use when configuring scenes, cameras, lighting, materials, instanced
    meshes, and particle systems.
  rules:
  - Keep active draw calls strictly under 80.
  - Use InstancedMesh for debris, bullets, and crowd mobs.
  - Clamp pixel ratio to Math.min(window.devicePixelRatio, 1.5) on mobile.
  - Share material instances across identical geometry.
  architecture: Scene graph with pre-allocated sprite and mesh pools, dynamic shadow
    frustum optimization.
  implementation_guidance: Initialize renderer with antialias enabled on desktop,
    powerPreference 'high-performance'.
  common_mistakes:
  - Do not construct new Geometries, Textures, or Materials in the render loop.
  - Do not leave unused GPU assets without calling .dispose().
  - Do not tune quality from raw frame time — under vsync every frame reads as budget-length.
  - Do not launch in reduced quality and climb up; start optimistic and step down.
  checklist:
  - Maintains solid 60 FPS on desktop and >= 50 FPS on mobile.
  - No WebGL context loss errors on tab switches.
  - Shadow map renders crisp without artifact acne.
  - The quality auto-tuner converges and locks instead of oscillating.
  knowledge_refs:
  - threejs/performance_guide.md
  - threejs/adaptive_quality.md
  - threejs/procedural_mesh_builder.md
  - threejs/fps_controller_and_shooting.md
  - threejs/physics_integration.md
  - threejs/shooter_enemy_ai_and_combat.md
  - threejs/juice_and_vfx_pool.md
  - threejs/stealth_and_vision_cones.md
  - audio/procedural_sound_synthesizer.md
- skill_id: stack_skill
  name: 'Three.js Stack: Rapier3D, BVH, Yuka, Recast, bitECS, postprocessing'
  filename: STACK_SKILL.md
  purpose: The libraries the game is built on, their verified versions and the tasks
    each one owns.
  when_to_use: Use before writing physics, AI, pathfinding, mass-entity or post-processing
    code — i.e. before writing any system that a stack library already owns.
  rules:
  - Take the library. A hand-rolled A*, boids flock, character controller, broadphase
    or bloom chain is a review defect, not an optimisation.
  - Rapier3D owns rigid bodies, joints and vehicles; a physics body is never driven
    by writing setLinvel() every frame.
  - three-mesh-bvh owns raycasts against static level geometry; Raycaster over a raw
    50k-triangle mesh is not acceptable.
  - Yuka owns steering, finite state machines, fuzzy decisions and perception.
  - recast-navigation owns NPC pathfinding and crowds; walkableHeight/Climb/Radius
    are expressed in cells, not metres.
  - bitECS owns entity mass (bullets, hordes, units) rendered through InstancedMesh;
    it is not used for a handful of unique entities.
  - 'postprocessing owns screen effects: one EffectPass for all of them, renderer.render()
    is replaced by composer.render().'
  - 'Frame order is fixed: input -> AI -> vehicle/controllers -> physics.step() ->
    ECS -> transform sync -> camera -> quality -> composer.render().'
  - WASM libraries (Rapier, Recast) are initialised on the loading screen, behind
    the boot watchdog, and Recast only when the game actually needs a navmesh.
  architecture: Three.js scene as the render layer; Rapier world as the physics source
    of truth; Yuka EntityManager and a recast Crowd for smart NPCs; bitECS world for
    mass entities; one EffectComposer for post FX.
  implementation_guidance: Pin the verified versions from knowledge/stack/README.md.
    Snippets found online for bitecs 0.3 (defineComponent/defineQuery) or rapier 0.13
    will not compile against the pinned versions.
  common_mistakes:
  - Re-implementing a library feature by hand because 'it is just a few lines'.
  - Calling renderer.render() next to composer.render() — the scene is drawn twice.
  - Stepping the physics world with a variable timestep instead of a fixed one with
    a substep cap.
  - Loading the Recast WASM in a game that has no NPC navigation.
  checklist:
  - No custom pathfinding, steering, broadphase or post-processing chain exists in
    src/.
  - The frame order matches knowledge/stack/README.md section 2.
  - Every stack library used is pinned to the version in knowledge/stack/README.md.
  knowledge_refs:
  - stack/README.md
  - stack/rapier3d.md
- skill_id: playgama_skill
  name: Playgama Bridge SDK Integration
  filename: PLAYGAMA_SKILL.md
  purpose: Defines implementation patterns for @playgama/bridge v2 (Ads, Cloud Storage,
    Auth, Leaderboards, Lifecycle).
  when_to_use: Use when implementing advertising triggers, cloud save/load, authorization,
    and portal lifecycle hooks.
  rules:
  - Always await bridge.initialize() (with a timeout) before any other SDK call.
  - Send game_ready exactly once, only after assets are loaded and the menu is interactive.
  - Grant a rewarded reward only on state === 'rewarded'; never when the promise resolves.
  - One save key holding one JSON object; storage.get/set take no storageType argument.
  - Call authorize() only from a player action — except the silent VK/OK path at boot.
  - 'Build UI on capability flags: an unsupported feature''s control is not rendered
    at all.'
  - Take pause and audio state from the platform's own events, not visibilitychange
    alone.
  - Auto-save on progress milestones and flush on pagehide.
  architecture: Singleton PlaygamaService wrapper exposing strongly-typed promises
    for Ads, Storage, Auth, Payments and Leaderboards, degrading to a local mock when
    window.bridge is absent.
  implementation_guidance: Subscribe to EVENT_NAME.REWARDED_STATE_CHANGED, call bridge.advertisement.showRewarded(placement),
    remove the listener in cleanup, and resolve true only for the 'rewarded' state.
    Full implementations for every module are embedded below.
  common_mistakes:
  - Sending game_ready right after initialize() — the splash lifts over an unloaded
    game.
  - Awaiting a dialog-showing authorize() inside boot — the game hangs for every guest.
  - Detecting a guest via player.id/name; they are populated for guests, use player.isGuest.
  - Showing an interstitial in the first seconds of a session or during gameplay.
  - Consuming a purchase before granting it — paid goods are destroyed.
  - Keeping settings in localStorage — it is partitioned inside the platform iframe.
  - Never assume internet connection is permanent — support local offline fallback.
  checklist:
  - Rewarded grants exactly one reward per view, even on a double click.
  - Progress survives a reload as guest and as an authorized player.
  - A corrupted save boots on defaults instead of crashing.
  - Leaderboard score submits and displays correctly.
  - Game auto-pauses on the platform's pause event, including during ads.
  knowledge_refs:
  - playgama/game_ready_and_loading.md
  - playgama/auth_and_player.md
  - playgama/storage_and_cloud.md
  - playgama/ads_integration.md
  - playgama/banners_and_layout.md
  - compliance/yandex_moderation.md
  - ux/localization_system.md
  - ux/touch_controls.md
  - ux/ui_design_system.md
  - ux/ui_implementation.md
- skill_id: controls_skill
  name: Mobile Touch & Desktop Controls
  filename: CONTROLS_SKILL.md
  purpose: 'Задаёт обязательный контракт управления: раскладку под жанр, реализацию
    на Pointer Events, отмену браузерных жестов и правила видимости.'
  when_to_use: 'Use when implementing any player input: virtual joystick, action buttons,
    driving pedals, camera gestures, or keyboard bindings.'
  rules:
  - Только Pointer Events + setPointerCapture; учитывать pointerId для каждой кнопки.
  - Движение и основное действие обязаны работать одновременно (мультитач).
  - В играх про вождение газ — отдельная кнопка, а не вертикаль стика руля.
  - 'touch-action: none, отмена contextmenu/dragstart и touchmove с passive:false.'
  - Отступы через env(safe-area-inset-*); основная кнопка >= 96 px, остальные >= 64
    px.
  - Слой управления виден только в игровом процессе и сбрасывается при скрытии.
  - Сброс всех осей и кнопок на blur и visibilitychange.
  - Флаг ?touch=1 принудительно включает мобильную раскладку на десктопе.
  architecture: Отдельный модуль TouchControls создаёт собственный DOM-слой поверх
    UI, пишет в виртуальные оси InputManager и ничего не знает об игровой логике.
    InputManager сливает клавиатуру и тач, отдавая игре единый снимок управления.
  implementation_guidance: 'UIManager владеет экземпляром TouchControls и переключает
    его видимость в showHud/showPause/hideAllModals. Джойстик — плавающий: база появляется
    под пальцем, зона захвата — половина экрана, мёртвая зона 8%.'
  common_mistakes:
  - Один стик на движение и газ — машина теряет ход в каждом повороте.
  - 'touchstart/touchend без pointerId: второй палец сбрасывает первый.'
  - Слой управления оставлен видимым в меню — он перехватывает тапы по кнопкам.
  - Забытый passive:false — страница продолжает скроллиться под игрой.
  - Кнопки прижаты к краю без safe-area — их перекрывает вырез и системный жест.
  checklist:
  - Газ/атака и направление работают одновременно, проверено тремя пальцами.
  - Свайп по игре не скроллит страницу и не вызывает pull-to-refresh.
  - Долгое нажатие не открывает контекстное меню.
  - Управление скрыто в меню и паузе, оси сброшены после сворачивания вкладки.
  - ?touch=1 показывает мобильную раскладку на десктопе и кликается мышью.
  knowledge_refs:
  - ux/touch_controls.md
- skill_id: ui_skill
  name: 'Game UI: Design System & Overlay Implementation'
  filename: UI_SKILL.md
  purpose: 'Задаёт визуальный контракт интерфейса: токены вместо литералов, один акцент
    на смысл, конечный набор компонентов, состояния экранов и слои над канвасом, которые
    не съедают игровой ввод.'
  when_to_use: Use when building any menu, HUD, modal, settings screen, shop, leaderboard
    panel or результат сессии — то есть всё, что игрок видит поверх канваса.
  rules:
  - Все значения — токенами в одном src/ui/theme.css; литерал цвета в экране запрещён.
  - 'Слои над канвасом: контейнер pointer-events: none, auto — только у листьев.'
  - Слой HUD не кликается никогда; пауза и настройки — кнопки слоя экранов.
  - Один акцент — один смысл, не больше двух акцентов на экране одновременно.
  - Одна геометрия рамки на все кнопки, карточки и модалки.
  - Две гарнитуры; меняющиеся числа — tabular-nums в слоте фиксированной ширины.
  - Три зоны экрана и ровно одно главное действие на экран.
  - У каждого экрана есть состояния загрузки, пустоты и ошибки.
  - Возможность, которой нет на площадке, не рисуется вовсе — не серой кнопкой.
  - Геометрия — от измеренного вьюпорта плюс safe-area и высота баннера, не от 100vh.
  - Запрещены alert/confirm/prompt, эмодзи вместо иконок, голые input[type=range]
    и select.
  - Анимируются только transform и opacity; переход укладывается в 300 мс.
  architecture: 'src/ui/: theme.css с токенами, UiRoot создаёт слои и меряет вьюпорт,
    ScreenRouter держит один видимый экран и общий переход, Hud пишет в закэшированные
    узлы, components/ — закрытый набор примитивов, screens/ — по файлу на экран, icons.ts
    — один инлайновый SVG-спрайт с currentColor.'
  implementation_guidance: 'Компонент — функция, которая строит элемент и возвращает
    небольшой handle с setLoading/setDisabled. Никакого фреймворка: реконсилятор и
    его бандл здесь ничего не покупают. Данные игрока (имена из таблицы лидеров, сохранения)
    идут только через textContent, никогда через innerHTML.'
  common_mistakes:
  - 'Полноэкранный оверлей на pointer-events: auto — на телефоне «не работает управление».'
  - innerHTML в кадре и querySelector в цикле — просадка кадров на ровном месте.
  - 'width вместо transform: scaleX() у полосы — пересчёт раскладки всего слоя.'
  - 100vh вместо измеренного вьюпорта — нижний ряд кнопок уезжает под хром браузера.
  - 'backdrop-filter: blur() на полноэкранном слое — дороже самой сцены на мобильном
    GPU.'
  - 'Скрытый экран на opacity: 0 вместо display: none — его кнопки продолжают ловить
    нажатия.'
