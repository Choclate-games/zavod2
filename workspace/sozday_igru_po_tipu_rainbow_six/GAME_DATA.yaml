- name: Superhot
  genre: Стилизованный Slow-Mo FPS
  mechanics:
  - Манипуляция шкалой времени
  - Точечное распределение выстрелов по целям
  - Мгновенная смерть от одного попадания
  lessons: Замедление времени позволяет совершать филигранные тактические действия
    на сенсорных экранах без паники и спама кнопок.
  what_to_avoid: Абстрактный минималистичный визуал без спецназовской милитари-эстетики
    и отсутствие разрушаемых укрытий.
mechanics:
- name: Взрывной Бричинг Укреплений (Breach Dynamics)
  category: combat
  priority: core
  description: Установка направленного бричинг-заряда C4 или термической ленты на
    слабую зону стены/двери с последующим дистанционным подрывом, физическим разломом
    преграды и оглушением противников за ней.
  player_interaction: ПКМ / Тап по подсвеченной зоне стены — прикрепить заряд C4;
    Пробел / Кнопка кликера детонатора — дистанционный подрыв; Свайп двумя пальцами
    вниз — отмена и снятие заряда.
  feedback: 'Визуал/VFX: Вспышка взрыва с объемным дымовым грибом, разлет 32 трехмерных
    фрагментов штукатурки и арматуры с расчетом коллизий Rapier3D, оседающая белая
    взвесь строительной пыли.; Звук (Web Audio): Низкочастотный саб-басовый взрыв
    (45 Гц sine-drop) с последующим высокочастотным свистом в ушах (Tinnitus notch-filter
    на 4.2 кГц) и грохотом падающих обломков.; Камера: Травматический импульсный шейк
    (амплитуда 0.35 м, затухание 0.4 с), динамический зум FOV с 75 градусов до 62
    градусов в момент вспышки и плавный возврат.; UI/Тактильность: Короткая двойная
    вибрация (Haptic feedback 80 мс / 120 мс) на мобильных устройствах, красный индикатор
    радиуса ударной волны на полу, маркер BREACH SUCCESS.'
  technical_complexity: Medium
  strengths:
  - Невероятная зрелищность и кинематографичность первого контакта
  - Тактическая свобода выбора вектора атаки
  weaknesses:
  - Требует строгого контроля пула физических мешей для удержания 60 FPS
- name: Штурмовой Slow-Mo Фокус (Breach-Focus Time)
  category: combat
  priority: core
  description: В момент детонации время замедляется до 20% на 1.5–3.0 секунды. Ослепленные
    террористы медленно роняют оружие или пытаются вскинуть стволы, пока игрок методично
    распределяет прицельные выстрелы.
  player_interaction: Активируется автоматически при детонации пролома; Повторный
    клик Shift / Тап по индикатору пульса — досрочный выход из Slow-Mo для сохранения
    энергии фокуса.
  feedback: 'Визуал/VFX: Эффект радиального размытия по краям экрана (Radial Blur),
    яркие замедленные трассеры выстрелов с дымовым следом, зависшие в воздухе гильзы
    и крупицы штукатурки.; Звук (Web Audio): Приглушение всех высоких частот через
    Low-Pass Filter (срез 400 Гц), ритмичный тяжелый стук сердца (Heartbeat 55 BPM),
    выстрелы звучат как раскатистые басовые удары.; Камера: Плавный кинематографичный
    наезд камеры вперед (Dolly Zoom +0.3 м), динамическая стабилизация прицельной
    марки.; UI/Тактильность: Пульсирующая полоса адреналина в центре экрана, замедленное
    тиканье таймера штурма, легкая непрерывная микровибрация устройства.'
  technical_complexity: Medium
  strengths:
  - Идеальная точность прицеливания на мобильных устройствах без виртуальных стиков
  - Устраняет хаотичный спам выстрелов, превращая бой в тактическую головоломку
  weaknesses:
  - Требует точной калибровки таймера замедления для сохранения челленджа
- name: Баллистический Щит и Тактические Наклоны (Tactical Shield & Lean)
  category: defense
  priority: core
  description: Использование ростового бронещита со смотровым окном. Защищает от фронтального
    огня, позволяя выглядывать влево/вправо (Lean Q/E) для ведения беглого прицельного
    огня.
  player_interaction: Клавиши Q / E (или кнопки-стрелки по краям экрана на мобильных)
    — наклон влево/вправо; Зажатие ПКМ — поднятие щита в глухую оборону; ЛКМ — выстрел
    из пистолета с упора.
  feedback: 'Визуал/VFX: Искры и вмятины на бронеплите щита при попаданиях, нарастающая
    паутина трещин на баллистическом стекле, дым от пороховых газов при выстреле с
    упора.; Звук (Web Audio): Звонкий металлический лязг рикошетов пуль о сталь (Bell-metallic
    ping), глухой стук попаданий в титан, механический скрежет фиксаторов щита при
    наклоне.; Камера: Смещение оси камеры на 0.45 м вбок с креном 14 градусов, легкий
    толчок назад (0.05 м) при поглощении тяжелых пуль щитом.; UI/Тактильность: Индикатор
    целостности щита (Shield Durability bar) и смотрового окна, сильная прерывистая
    виброотдача при пулеметном обстреле щита.'
  technical_complexity: Medium
  strengths:
  - Глубокий позиционный геймплей с контролем углов обзора
  - Дает игроку инструмент защиты от мгновенного ваншота
  weaknesses:
  - Сужает угол периферийного зрения, делая игрока уязвимым с флангов
- name: Эндоскопическая Разведка (Optic-Wand Recon)
  category: tactics
  priority: supporting
  description: Просовывание гибкого кабеля с камерой под дверную щель или в технологическое
    отверстие перед штурмом для обнаружения позиций террористов и растяжек с взрывчаткой.
  player_interaction: Удержание клавиши 'F' / Кнопка 'Камера' на экране — опустить
    кабель эндоскопа под дверь; Перемещение мыши / Джойстик — вращение микрокамеры
    на 120 градусов; Клик ЛКМ — расстановка тактических меток.
  feedback: 'Визуал/VFX: Зернистый монохромный зеленый интерфейс микрокамеры (Night-Vision
    CRT-noise), красные тепловые силуэты наемников сквозь дым, желтые контуры растяжек
    C4.; Звук (Web Audio): Высокочастотный электронный писк включения ночного видения
    (12 кГц beep), приглушенные радиопереговоры террористов за дверью, звук жужжания
    микромотора кабеля.; Камера: Переключение на широкоугольный объектив типа ''рыбий
    глаз'' (Fisheye distorsion 0.35) с легким виньетированием.; UI/Тактильность: Наложение
    тактической сетки с дальномером, появление постоянных 3D-маркеров врагов над дверным
    полотном после выхода из режима.'
  technical_complexity: Low
  strengths:
  - Награждает вдумчивое планирование и устраняет элемент случайной гибели
  - Усиливает атмосферу спецоперации спецназа
  weaknesses:
  - Расходует драгоценные секунды общего таймера операции
- name: Обезвреживание СВУ под Огнем и Разрезание Проводов (Defusal Tension QTE)
  category: Финальный тормоз и кульминационный источник напряжения миссии
  priority: secondary
  description: Обезвреживание бомбы — это не скучное стояние с зажатой кнопкой на
    5 секунд (как в Counter-Strike), а микро-тактическая головоломка в реальном времени
    под звуки боя.
  player_interaction: Удержание 'E' / Тап по корпусу бомбы — открыть панель взрывателя;
    ЛКМ / Свайп кусачками по нужному проводу (Красный/Синий/Желтый); ПКМ — удерживать
    щит свободной рукой.
  feedback: 'Визуал/VFX: Крупный план цифрового дисплея СВУ с быстро меняющимися красными
    цифрами, искры от кусачек при перерезании медной жилы, зеленый залп светодиодов
    успеха.; Звук (Web Audio): Ускоряющийся частый писк зуммера бомбы (от 1 Гц до
    8 Гц на последних секундах), металлический щелчок инструмента, облегченный выдох
    бойца.; Камера: Жесткий динамический фокус на электронный блок бомбы с размытием
    заднего плана (Depth of Field), тревожное покачивание при близких выстрелах.;
    UI/Тактильность: Пульсирующий красный оверлей тревоги, частые короткие виброимпульсы
    в такт таймеру бомбы, кнопка CUT WIRE.'
  technical_complexity: Medium
  strengths:
  - Высокая вовлеченность
  - Глубокая кривая мастерства
  weaknesses:
  - Требует точной калибровки таймингов
gameplay_systems:
- name: Система Физического Разрушения Преград (Destruction System)
  purpose: Процедурный расчет взлома стен и дверей, генерация пролома и физических
    осколков на Rapier3D.
  input: Координаты точки детонации C4, нормаль поверхности и тип материала стены
    (гипсокартон/дерево/армированный бетон).
  rules:
  - При детонации цельный меш стены скрывается и заменяется каркасом с отверстием
    пролома
  - В точке взрыва спавнится пул из 15-25 осколков с радиальным импульсом и случайным
    вращением
  - Осколки переходят в спящий режим (sleep) через 1.5 секунды для экономии ресурсов
    CPU
  - Открывается сквозная линия видимости (Raycast) для стрельбы и видимости врагов
  state:
  - intact
  - primed_with_c4
  - breached
  - destroyed
  interactions: Триггерит систему Slow-Mo и накладывает оглушение (Stun) на врагов
    в радиусе 3.5 метров.
  feedback: Вспышка взрыва, инфразвуковой хлопок, клубы объемного дыма, разлетающиеся
    куски штукатурки.
  edge_cases:
  - Подрыв на границе стены — ограничение разлета осколков коллизией боковых колонн
  - Повторный подрыв — объединение радиусов разрушения без создания дублирующих мешей
- name: Система Тактического ИИ Врагов (Tactical AI System)
  purpose: 'Управление поведением боевиков: секторы наблюдения, реакция на оглушение,
    укрытия и прицельный ответный огонь.'
  input: События шума, визуальный контакт с оперативником, радиус поражения взрыва
    C4.
  rules:
  - Враги удерживают статичные секторы за столами, колоннами и баррикадами
  - При взрыве C4 рядом переходят в состояние Stunned на 1.5–2.5 секунды (теряют ориентацию)
  - После выхода из оглушения наводятся на игрока за 0.8 сек и открывают летальный
    огонь очередями
  - Попадание пули врага в щит наносит урон прочности щита, попадание в открытое тело
    смертельно
  state:
  - guarding
  - alerted
  - stunned
  - shooting
  - neutralized
  interactions: Взаимодействует с системой баллистики и коллизией баллистического
    щита.
  feedback: Лазерные целеуказатели врагов, анимации падения ragdoll при ликвидации,
    выкрики тревоги.
  edge_cases:
  - Игрок полностью скрыт за щитом — враг целится в выступающие ноги/плечи
  - Враг за спиной заложника — усложнение линии огня для игрока
- name: Система Временной Дилатации и Оценки Штурма (Time-Dilation & Scoring System)
  purpose: Модуляция шкалы времени во время прорыва и расчет тактического рейтинга
    выполнения миссии.
  input: Триггер детонации C4, остаток шкалы Breach-Focus, точность выстрелов, хедшоты,
    время прохождения.
  rules:
  - Time.scale снижается до 0.2 за 0.1 секунды при взрыве и плавно восстанавливается
    по окончании шкалы
  - Шкала фокуса расходуется со скоростью 1 ед/сек реального времени
  - Убийство врага в голову возвращает +0.5 сек к длительности замедления
  - Рейтинг операции (1-3 звезды) вычисляется на основе меткости, скорости и сохранности
    щита
  state:
  - realtime
  - slowmo_active
  - slowmo_depleted
  interactions: Синхронизирует частоту дискретизации и питч Web Audio с коэффициентом
    замедления Time.scale.
  feedback: Виньетка замедления, звук замедленного сердцебиения, шкала Focus Bar на
    HUD.
  edge_cases:
  - Все цели уничтожены раньше окончания Slow-Mo — мгновенный кинематографичный возврат
    времени в 1.0
core_design:
  signature_moment: 'Подведение оптоволоконного эндоскопа под щель армированной двери
    серверного хранилища: на экране сканера видны силуэты 3 наемников за стойками
    и лазерная растяжка у порога. Игрок решает не идти через заминированную дверь,
    а смещается к прилегающей стене, лепит термо-бричинг заряд C4. Клик детонатора
    — глухой кинематографичный ''БАМ'', трехмерные обломки бетона и арматуры на физике
    Rapier3D разлетаются внутрь комнаты, сбивая с ног крайнего боевика. Время мгновенно
    сжимается в 0.2x Slow-Mo: звук переходит в низкочастотный басовый гул и звон контузии
    в ушах, в воздухе зависают клубы штукатурки и искр. Игрок за 1.8 секунды замедления
    делает резкий наклон из-за титанового щита (Lean Right), ставит два выверенных
    хедшота из пистолета-пулемета MP5 по дезориентированным целям, в падении сбивает
    третью выстрелом по ногам под столом, и время с сочным щелчком затвора возвращается
    в 1.0x прямо в момент падения гильз на пол.'
  genre_template_rejected: 'Отвергаем шаблон ''Традиционного коридорного шутера со
    свободным блужданием, сбором ключ-карт и врагами-губками для пуль (Bullet Sponges)''.
    В браузерных и мобильных сессиях (90–120 секунд) 5 минут беготни по пустым лабиринтам
    убивают концентрацию. Вместо поиска ключей игрок сам создает проходы взрывчаткой,
    а вместо врагов с полосками здоровья по 1000 HP здесь работает хардкорная CQB-летальность:
    1 выстрел в голову или 2 в грудь гарантированно нейтрализуют цель.'
  what_makes_it_different: 'В отличие от классических аркадных рельсовых шутеров (Time
    Crisis, Virtua Cop) или хаотичных арена-батлеров, здесь игрок управляет не просто
    стрельбой из укрытия, а полным циклом тактического штурма в замкнутом микро-пространстве:
    1) Фаза сбора разведданных через эндоскоп с маркировкой угроз и ловушек; 2) Тактический
    выбор точки взлома (дверь, гипсокартон или армированная перегородка); 3) Физический
    импакт бричинга (разрушение геометрии через физику твердых тел Rapier3D и поражение
    осколками); 4) Менеджмент ограниченного ресурса кинематографичного Slow-Mo и углов
    наклона баллистического щита (Lean Q/E) без права на лишнее движение.'
  micro_loop:
  - step: Оценка сектора через смотровое окно щита
    player_action: Удерживает стойку за ростовым щитом, наводит прицел на дверной
      проем / щель в стене.
    game_response: Отображение маркеров траекторий пуль противника (искры рикошетов
      от титановой пластины щита, падение стойкости щита на 12 ед.).
    decision: Принять огонь на щит или выполнить резкий наклон вправо (Lean E) для
      контрудара.
    duration: 0.8 с
  - step: Выбор окна для наклона (Tactical Lean)
    player_action: Нажатие кнопки 'E' (или свайп вправо на тачскрине) для полушага
      из-за щита.
    game_response: Камера сдвигается на 0.45 м вправо под углом 14 градусов, ствол
      пистолета выносится в открытую линию огня, открывая плечо оперативника.
    decision: Стрелять навскидку по ближайшей угрозе или выцелить голову командира
      за укрытием.
    duration: 0.4 с
  - step: Тактический выстрел в уязвимую зону
    player_action: Клик ЛКМ / тап по зоне головы террориста.
    game_response: Выстрел 9x19mm с отдачей 4.2 градуса, трассер пробивает деревянную
      перегородку, рэгдолл врага отбрасывается назад импульсом 380 Н*с.
    decision: Добить второго противника одиночным или уйти обратно в глухую защиту
      щитом на перезарядку.
    duration: 0.3 с
  - step: Возврат в укрытие и парирование огня
    player_action: Отпускание клавиши наклона, фронтальная перегруппировка.
    game_response: Щит снова закрывает центр экрана, звук глухих попаданий пуль 7.62mm
      в бронесталь, легкий блюр от вибрации.
    decision: Начать перезарядку магазина (1.4 с) или метнуть светошумовую гранату
      вслепую через верхний край щита.
    duration: 1.2 с
  - step: Контроль сектора и зачистка
    player_action: Быстрый досыл патрона, проверка углов комнаты.
    game_response: Снятие статуса угрозы в секторе, аудио-подтверждение 'Sector Clear'
      по рации, начисление комбо-очков за скорость.
    decision: Перезарядить оружие перед следующим проломом или сразу подойти к следующей
      точке входа.
    duration: 1.5 с
  meso_loop:
  - step: Разведка и планирование точки входа
    player_action: Активация гибкого эндоскопа под дверью или сканирование стены тепловизором.
    game_response: Рендер силуэтов террористов (красные контуры), обнаружение растяжки
      с C4 у двери и слабой гипсокартонной секции слева.
    decision: Штурмовать заминированную дверь через обезвреживание или пробить слабую
      гипсокартонную стену зарядом бричинга.
    duration: 4.0 с
  - step: Установка бричинг-заряда и позиционирование
    player_action: Размещение накладного заряда C4 на выбранную стену, отход на безопасную
      дистанцию (2.5 м) и поднятие щита.
    game_response: Светодиод на детонаторе мигает зеленым, звучит предупреждающий
      писк таймера 0.5 с, маркер готовности к подрыву.
    decision: Взорвать мгновенно или дождаться, пока патрульный террорист подойдет
      вплотную к стене для поражения осколками.
    duration: 3.0 с
  - step: Детонация, физический пролом и активация Slow-Mo
    player_action: Нажатие кнопки детонатора на кликере.
    game_response: Физический взрыв разрушает меш стены на 32 обломка (Rapier3D rigidbodies),
      ударная волна глушит врагов на 2.5 с, таймскейл падает до 0.2x.
    decision: 'Приоритет целей в Slow-Mo: сначала ликвидировать террориста с гранатой,
      затем стрелка за пулеметом, затем сбить лазерную мину.'
    duration: 2.0 с
  - step: Динамическая зачистка в замедленном темпе
    player_action: Серия прицельных выстрелов по уязвимым зонам противников во время
      полета обломков.
    game_response: Кинематографичные хедшоты, физика разрушения столов и мониторов
      от шальных пуль, счетчик комбо Breach & Clear x3.
    decision: Израсходовать остаток Slow-Mo на обезвреживание растяжки выстрелом в
      капсюль или на добивание бронированного наемника.
    duration: 2.5 с
  - step: Обезвреживание бомбы / Фиксация рубежа
    player_action: Подход к терминалу взрывного устройства, срезание контрольных проводов
      по цветовой схеме.
    game_response: Звуковой сигнал разрядки таймера, открытие бронедвери в следующий
      штурмовой сектор, пополнение 1 бричинг-заряда.
    decision: Использовать аптечку (+50 HP) сейчас или сохранить бронепластину щита
      на финальное серверное хранилище.
    duration: 5.0 с
  macro_loop:
  - step: Выбор тактического контракта и брифинг операции
    player_action: Выбор объекта на глобальной тактической карте (Банковское хранилище,
      Посольство, Серверный узел синдиката).
    game_response: Отображение плана этажей, модификаторов сложности (тяжелая броня
      у врагов, лазерные сенсоры, ограниченное время).
    decision: Взять дробовик M870 для мгновенного разлома дверей или бесшумный MP5-SD
      с увеличенным запасом Slow-Mo.
    duration: 8.0 с
  - step: Трехфазный CQB-штурм объекта (3 комнаты)
    player_action: Последовательное прохождение Периметра, Офисного холла и Серверного
      хранилища с зачисткой всех угроз.
    game_response: Динамическая симуляция комнат, нарастающее сопротивление ИИ, проверка
      прочности щита и таймера детонатора.
    decision: Рисковать ради идеального счета (все хедшоты, 0 урона щиту) или играть
      надежно от глухой обороны.
    duration: 90.0 с
  - step: Дебрифинг, оценка эффективности и выплата тактических кредитов
    player_action: 'Просмотр итоговой статистики: точность попаданий, время зачистки,
      процент сохранения щита, заработанные кредиты.'
    game_response: Начисление кредитов спецназа (Credits), опыта оперативника (XP)
      и тактических жетонов за выполнение доп. условий.
    decision: Потратить кредиты на покупку термо-бричинг ленты или инвестировать в
      титановое напыление баллистического стекла.
    duration: 12.0 с
  - step: Оружейная и кастомизация снаряжения (Armory & Loadout)
    player_action: Установка коллиматорного прицела Holo-1, лазерного ЛЦУ, покупка
      усиленного щита Вулкан-М с ослепляющей LED-вспышкой.
    game_response: 'Обновление статов оперативника: увеличение угла защиты щита на
      +10 градусов, продление базового Slow-Mo на +0.4 с.'
    decision: Начать штурм объекта повышенной сложности (Хардкор / Ночной рейд) или
      перепройти миссию на ранг S.
    duration: 15.0 с
