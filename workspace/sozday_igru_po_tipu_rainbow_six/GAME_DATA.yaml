  / Hard-Surface CQB). Camera perspective: First-Person (Вид от первого лица) с динамическим
  FOV и покачиванием при отдаче. Environment: Захваченное дипломатическое посольство:
  бетонные колонны, офисные перегородки из гипсокартона, серверные стойки, армированные
  двери и тактическое освещение. Central Action: Мгновенное превращение глухой стены
  в тактический пролом: взрыв разносит гипсокартон в щепки, время замирает, и за 2
  секунды кинематографичного slow-mo вы решаете исход операции одним точным хедшотом.
