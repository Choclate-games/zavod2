  selected_id: D1
  selected_name: 'Тактика Прорыва: CQB Штурм'
  selection_reason: 'Выбрано направление D1 («Тактика Прорыва: CQB Штурм»), так как
    оно напрямую воплощает главное эмоциональное ядро Rainbow Six — напряжение тактического
    взлома укреплений (breaching) и взрывную зачистку помещения за доли секунды. На
    смартфонах и в браузере D1 избавляет от громоздкого управления одновременным бегом,
    прицеливанием и наклонами (lean) на экранном джойстике, концентрируя геймплей
    на четких тактических действиях: выбор точки бричинга, детонация и прицельный
    огонь в slow-mo. Это обеспечивает понятный и эффектный старт с первой секунды
    без многоминутного обучения и стабильную производительность Three.js в рамках
    одной детально проработанной комнаты.'
  rejected_reasons:
  - 'D2 («Спецплан: Синхронный Штурм») отвергнут, поскольку изометрическое планирование
    траекторий превращает адреналиновый тактический штурм в сухую головоломку типа
    Door Kickers, теряя ощущение личного присутствия на острие атаки и перегружая
    мобильный экран мелкими путевыми точками.'
  - 'D3 («Дрон-Разведчик: Точка Входа») отвергнут, так как исключает стрелковый экшен
    и кульминацию штурма, сводя формулу Rainbow Six лишь к вспомогательной фазе разведки
    на радиоуправляемой машинке без финальной развязки.'
  what_it_is_not:
  - Никаких бесконечных волн наступающих врагов на открытой арене — только статично
    укрепившиеся противники в закрытых комнатах
  - Никаких случайных карточек апгрейдов (+5% к урону) после зачистки — выбор снаряжения
    только перед рейдом
  - Никакого свободного бега с виртуальным джойстиком и прыжками — перемещение привязано
    к тактическим позициям и точкам штурма
  - Никаких шкал здоровья врагов-губок — летальный урон с одного точного попадания
    в голову или двух в корпус
  - Никаких монохромных серых коробок вместо интерьера — стилизованное окружение с
    разрушаемым гипсокартоном, баррикадами и световыми эффектами
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - 'Разрушаемость поверхностей: обязательный физический пролом стен/дверей при детонации
    пробивного заряда с разлетом осколков'
  - 'Летальный CQB: мгновенная цена ошибки, отсутствие полосок здоровья у врагов,
    нейтрализация с одного точного попадания'
  - 'Фазовость штурма: четкое разделение на выбор точки проникновения (заряд/светошумовая)
    и фазу зачистки в замедленном времени'
  - 'Тактический звук: глухой направленный бас подрыва, звон в ушах после светошумовой
    гранаты и щелчки затвора на чистом Web Audio'
  signature_scene: 'Камера от первого лица из-за баллистического щита: в стене взрывом
    выбит неровный пролом, сквозь летящие во все стороны куски штукатурки и клубы
    дыма пробиваются лучи тактических фонарей, а впереди в замедленном времени ослепленный
    боевик роняет автомат на фоне развороченного офисного стола.'
  avoid_references:
  - Vampire Survivors
  - Brotato
  - Gladihoppers
  - Door Kickers
  - Hotline Miami
