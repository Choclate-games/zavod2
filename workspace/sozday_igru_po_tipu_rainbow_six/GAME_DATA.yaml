- skill_id: stealth_skill
  name: Stealth Vision Cones & Noise Shadows
  filename: STEALTH_SKILL.md
  purpose: 'Реализация системы скрытности: секторы обзора ИИ, расчет шума шагов и
    шкала тревоги.'
  when_to_use: При разработке логики патрулирования, конусов зрения, укрытий и реакции
    ИИ на звук.
  rules:
  - FOV-проверка угла (dot product) каждый кадр; физический Raycast — только при прохождении
    сектора (10 Гц).
  - Радиус шума шагов генерируется динамически от скорости перемещения (0 для крадучись,
    9 м для бега).
  - Шкала тревоги растет плавно с буфером реакции 0.25 с (grace period).
  architecture: StealthManager регистрирует источники шума и проверяет видимость через
    Raycast к позиции игрока.
  implementation_guidance: Публикуй события 'stealth:noise_emitted', 'guard:alerted'
    в EventBus.
  common_mistakes:
  - Raycast каждый кадр для всех мобов — просадки FPS.
  - Мгновенное обнаружение сквозь угол без задержки реакции.
  checklist:
  - Укрытия полностью блокируют прямую видимость патрульных.
  - Шаг крадучись не поднимает тревогу за спиной врага.
  knowledge_refs:
  - mechanics/stealth_detection.md
