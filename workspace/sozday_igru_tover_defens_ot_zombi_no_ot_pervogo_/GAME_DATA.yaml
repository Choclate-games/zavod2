  selected_id: D1
  selected_name: 'Бастион 13: Сапёр Периметра'
  selection_reason: 'Направление D1 («Бастион 13: Сапёр Периметра») выбрано как самое
    точное и сильное воплощение заказа «Tower Defense от первого лица против зомби»
    для браузера и мобильных платформ.

    1. Чистота жанра: 80% урона наносят сами турели, а игрок в виде от первого лица
    выполняет критическую роль полевого инженера (монтаж, подача энергии, крио-охлаждение
    стволов от перегрева и ремонт). Это сохраняет суть классического TD, усиливая
    её эффектом личного присутствия на передовой.

    2. Безупречная эргономика для мобильных устройств: управление строится вокруг
    перемещения и контекстного взаимодействия (кнопка обслуживания турели вблизи),
    избавляя игрока от утомительного микро-прицеливания по головам зомби на тачскрине.

    3. Высокая производительность WebGL/Three.js: стабильные маршруты зомби и фиксированные
    сектора огня турелей позволяют эффективно использовать InstancedMesh и инстансинг
    частиц, обеспечивая стабильные 60 FPS даже при 100+ зомби на экране.

    4. Выразительный визуальный стиль и атмосфера: контраст раскаленного металла турелей,
    ледяного бурана и толпы зомби в лучах прожекторов мгновенно считывается на скриншоте
    и удерживает игрока с первой секунды.'
  rejected_reasons:
  - 'D2 («Лабиринт Мертвецов: Архитектор Ловушек») отвергнут, поскольку частое перестроение
    лабиринта игроком требует постоянного динамического ребейка навмеша Recast WASM
    в реальном времени, что на смартфонах в браузере приводит к просадкам частоты
    кадров и риску застревания (softlock) зомби; кроме того, манипуляция только рычагами
    уводит геймплей от динамичной обороны базы в неторопливую позиционную головоломку.'
  - 'D3 («Токсичный Дозор: Полевой Командир») отвергнут из-за перегруженности внимания
    игрока: необходимость одновременно метко стрелять из дробовика и управлять лазерным
    целеуказателем турелей на тачскрине создает конфликт раскладки управления, а также
    провоцирует игрока игнорировать турели в пользу обычной шутерной стрельбы, размывая
    ключевую ценность Tower Defense.'
  what_it_is_not:
  - Никаких всплывающих модальных окон с выбором из трёх случайных карт апгрейдов,
    прерывающих течение боя.
  - Никакого превращения в обычный коридорный зомби-шутер с отстрелом волн исключительно
    из личного автомата игрока.
  - Никакого автоматического кликера/айдлера, где турели справляются без физического
    участия и перемещения игрока по периметру.
  - Никакого виртуального курсора мыши и перетаскивания иконок по экрану пальцем во
    время активной битвы от первого лица.
  - Никаких серых прототипных кубов и нестилизованной сырой геометрии вместо атмосферного
    дизельпанк-бастиона.
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - Вид строго от первого лица с физическим перемещением персонажа-инженера по уровню
    своими ногами.
  - Основную огневую мощь по сдерживанию орды зомби обеспечивают автоматические модульные
    турели, а игрок лично отвечает за их возведение, питание, охлаждение и ремонт.
  - Орда зомби численностью не менее 50–100 одновременных врагов в кадре, наступающая
    волнами по секторам периметра.
  - Тактильный инструментарий в руках игрока (мультитул/крио-кулер/энергоблок) с физическим
    радиусом взаимодействия с турелями на расстоянии вытянутой руки.
  signature_scene: Сквозь узкую смотровую амбразуру железобетонного дизельпанк-дота
    камера смотрит прямо на раскаленный до оранжевого свечения ствол трехствольной
    турели, извергающей снопы дульного пламени в снежную метель. В трех метрах впереди,
    в холодном белом свете прожектора, десятки окоченевших зомби в рваных шинелях
    карабкаются по обледенелому брустверу, а правая рука игрока в тяжелой клепаной
    рукавице прижимает к корпусу турели шипящее крио-сопло, окутывающее пулемет клубами
    морозного пара под разлетающиеся искры гильз.
  avoid_references:
  - Orcs Must Die! (запрещено делать экшен от третьего лица с аркадными прыжками и
    акробатикой)
  - Sanctum (запрещено делать затянутое лабиринтное планирование и стерильный sci-fi
    шутер)
  - 7 Days to Die (запрещено уходить в воксельный сурвайвал с долгим крафтом и сбором
    ресурсов)
  - Vampire Survivors (запрещено делать авто-шутер со сбором кристаллов опыта и карточками
    улучшений)
  - Left 4 Dead (запрещено делать линейный коридорный шутер без строительства и обслуживания
    стационарной обороны)
