gameplay_systems:
- name: Система термического баланса и перегрева турелей
  purpose: Создание непрерывного динамического давления на игрока через необходимость
    физически обслуживать раскаленные орудия на передовой.
  input: Непрерывная стрельба турелей (авто) / Зажатие крио-сопла игроком (ЛКМ или
    контекстная кнопка).
  rules:
  - Каждый выстрел увеличивает теплоемкость турели на фиксированный процент.
  - При достижении 100% тепла турель переходит в статус Jammed и прекращает огонь
    на 8 секунд.
  - Крио-спрей инженера снижает температуру на 35%/сек при прямом контакте на расстоянии
    до 2.5 метров.
  state:
  - CurrentHeat (0.0-100.0)
  - IsJammed (boolean)
  - CryoSprayActive (boolean)
  - HeatDissipationRate (float)
  interactions: Влияет на скорострельность турелей; пар от охлаждения накладывает
    40% замедление на зомби в радиусе 3м.
  feedback: Плавная смена накала текстуры ствола, звук закипающего металла, выброс
    объемного морозного пара при охлаждении.
  edge_cases:
  - Если игрок охлаждает турель с 0% тепла, крио-агент не расходуется, а сопло выпускает
    предупредительный щелчок.
  - Если турель заклинило в момент атаки босса, крио-спрей сбрасывает клин за 2 секунды
    вместо 8 секунд пассивного ожидания.
- name: Система спавна и волновой координации орды зомби
  purpose: Генерация масштабных волн мутантов (60–120 единиц) с распределением по
    3 штурмовым секторам периметра.
  input: Таймер волны и алгоритм волновой интенсивности смены.
  rules:
  - Зомби спавнятся за пределами видимости метели и двигаются по оптимизированным
    путям (Flow Field) к ближайшим амбразурам.
  - Рендеринг толпы осуществляется через Three.js InstancedMesh с вычислением костей
    в вершинном шейдере.
  - При потере конечности зомби меняет анимацию на ползание с сохранением инстанса.
  state:
  - ActiveZombiesCount (int)
  - WavePhase (Spawning / Assault / Climax)
  - SectorThreatLevels (array of floats)
  interactions: Зомби получают урон от секторов огня турелей, наносят урон баррикадам
    и реактору при достижении финишных точек.
  feedback: Свечение глаз в темноте метели, синхронный рев орды при начале волны,
    анимация карабкания по брустверу.
  edge_cases:
  - При скоплении зомби у одной точки настила включается алгоритм локального расталкивания
    (boids separation) для предотвращения проваливания сквозь геометрию.
  - Если все турели заклинили, зомби ускоряются на 15%, усиливая давление на бруствер.
- name: Система высоковольтного оверчарджа и энергоячеек
  purpose: Предоставление игроку мощного тактического инструмента для ликвидации критических
    прорывов за счет риска ручной доставки.
  input: Клавиша E / контекстный тап по стойке генератора и платформе турели.
  rules:
  - Генератор производит 1 готовую ячейку каждые 40 секунд (максимум 2 на стойке).
  - Переноска ячейки снижает скорость спринта игрока на 25% и блокирует использование
    крио-спрея на время переноски.
  - Установка ячейки в слот турели активирует Overcharge на 25 секунд.
  state:
  - GeneratorAvailableCores (0-2)
  - CoreRechargeTimer (float)
  - PlayerCarryingCore (boolean)
  - ActiveOverchargedTurrets (list)
  interactions: Увеличивает урон турели на 80%, скорострельность на 50% и замедляет
    нагрев вдвое.
  feedback: Пульсирующее бирюзовое свечение батареи в руках инженера, высоковольтные
    дуги молний на корпусе заряженной турели.
  edge_cases:
  - Если игрок бросает батарею в снег, она разряжается через 15 секунд, если не установлена
    в слот.
  - При падении здоровья реактора ниже 25% генераторная стойка выдает аварийную мгновенную
    супер-ячейку.
core_design:
  signature_moment: 'Финал 3-й волны: Ворота Северного бруствера трещат под ударами
    3-метрового Хладо-Громилы, оба тяжелых автопулемета на турелях ревут и входят
    в критический перегрев (110°C, металл пылает ослепительно белым, сирена орет).
    Игрок хватает со стойки искрящуюся Overcharge-ячейку, делает слайд под струей
    кислоты ползуна, вбивает ячейку в левый слот турели (DPS x1.8, калибр переходит
    в режим сплошного огненного луча), разворачивается и в упор заливает ствол второй
    турели шипящей струей крио-спрея из ранца. Огромный клуб белого пара закрывает
    обзор, пулемет с лязгом разгоняется до 1200 выстр/мин, инженер швыряет сигнальный
    фаер в стоящую в толпе бочку с жидким азотом — взрыв мгновенно замораживает Громилу
    в ледяную статую, и шквал бронебойных пуль за секунду раскалывает его на тысячи
    ледяных осколков за 2 метра до реактора при оставшихся 4% прочности ворот.'
  genre_template_rejected: 'Шаблон «Пассивный Tower Defense / AFK-лабиринт с авто-ремонтом
    (Sanctum/Kingdom Rush)». В классических TD игрок после расстановки башен превращается
    в пассивного зрителя или обычного стрелка, пока турели автономно зачищают коридоры.
    В «Бастионе 13» мы полностью исключаем автономность: турели — это капризные высокотемпературные
    дизельпанк-агрегаты. Без личного обслуживания инженера (ручной сброс тепла крио-соплом,
    физическая доставка энергоблоков на спринте, заваривание пробитых решеток бруствера
    клепальником под ударами зомби) орудия клинят и выходят из строя за 10-15 секунд.
    Оборона держится не на мертвом лабиринте, а на непрерывном тактильном кризис-менеджменте
    от первого лица.'
  what_makes_it_different: 'Главное отличие — физический менеджмент тепла и логистика
    энергоблоков на спринте от первого лица. В отличие от Sanctum (где игрок просто
    стреляет из оружия, пока башни бьют врагов) или Orcs Must Die (аркадный слэшер
    с ловушками), здесь боевая эффективность на 85% зависит от физического обслуживания
    орудийного парка: 1) Термический тайм-менеджмент: непрерывная стрельба турелей
    генерирует тепло (до 100°C), перегретый ствол клинит на 8 секунд; игрок жертвует
    мобильностью и обзором, подходя в упор для охлаждения крио-струей (риск быть окруженным).
    2) Физическая доставка Overcharge-ячеек: батареи весят тяжело, замедляют инженера
    на 30%, заставляя рассчитывать маршрут через сектора обороны. 3) Цепные термо-реакции:
    комбинация крио-заморозки из бочек/спрея с кинетическим картечным огнем наносит
    х3 урон по хрупкому промороженному панцирю мутантов.'
  micro_loop:
  - step: Оценка индикатора нагрева турели
    player_action: Сканирование периметра взглядом, фиксация мигающей красной термо-иконки
      над Северной турелью (нагрев 88°C).
    game_response: Нарастающий свист стравливания давления, ствол пулемета светится
      вишневым калением, частота выстрелов падает на 20%.
    decision: Бросить текущую позицию и бежать охлаждать пулемет прямо сейчас или
      успеть добить ползуна клепальником.
    duration: 0.8 с
  - step: Тактический спринт к раскаленному орудию
    player_action: Зажатие спринта с огибанием баррикады в сторону раскаленной амбразуры.
    game_response: Камера кренится вперед с эффектом FOV 90->100, глухой топот кованых
      сапог, счетчик выносливости расходуется на 25%.
    decision: Срезать путь через опасный сектор под кислотными плевками или обежать
      по безопасной траншее.
    duration: 1.5 с
  - step: Крио-залп по ствольной коробке
    player_action: Наведение сопла ранца на радиатор турели в упор (дистанция < 2.0
      м) и удержание ПКМ / кнопки крио-струи.
    game_response: Оглушительный пшик сжатого фреона, экран застилает густой белый
      пар, датчик температуры падает со 100°C до 10°C за 1.2 с, турель издает сигнал
      готовности.
    decision: Охладить до 0°C полным залпом (тратя 30% запаса ранца) или отсечь на
      35°C для экономии хладагента на вторую турель.
    duration: 1.2 с
  - step: Кинетический раскол промороженной волны
    player_action: Бросок сигнального термо-фаера нажатием клавиши [Q] в группу покрытых
      инеем зомби.
    game_response: Детонация рядом стоящей крио-бочки, ударная волна 450 кПа, 6 мутантов
      превращаются в хрупкие ледяные статуи и мгновенно крошатся от залпа пулемета
      на скрап.
    decision: Потратить последний фаер на пачку бегунов или сохранить его для детонации
      дизель-бочки под ногами босса.
    duration: 0.5 с
  - step: Подбор выбитого скрапа на лету
    player_action: Пробежка через сектор поражения с активным магнитным коллектором
      ранца.
    game_response: Звонкий металлический щелчок во впускной клапан, всплывающие цифры
      +45 Скрапа в правом углу HUD, шкала готовности апгрейда заполняется.
    decision: Немедленно вложить скрап в полевую починку бруствера (50 скрапа) или
      копить на T2 ствол (120 скрапа).
    duration: 1.0 с
  meso_loop:
  - step: Анализ векторов угрозы перед волной (Preparation)
    player_action: Изучение голографического планшета рубежа, определение направлений
      прорыва и монтаж первых орудий.
    game_response: Подсветка активных монтажных гнезд периметра, таймер обратного
      отсчета сирены (15 с), маркеры направлений спавна мутантов.
    decision: Смонтировать скорострельный автопулемет на фланге бегунов или тяжелый
      картечный дробовик в центральном шлюзе.
    duration: 15.0 с
  - step: Старт штурма и фокус первого рубежа (Early Wave)
    player_action: Запуск первой линии турелей, занятие командной высоты на помосте
      бруствера.
    game_response: Зомби входят в сектор (дистанция 35 м), турели открывают огонь,
      индикаторы тепла ползут вверх со скоростью 4.5°C/с.
    decision: Поддерживать темп легким превентивным охлаждением или сразу нести Overcharge-ячейку
      для зачистки авангарда.
    duration: 25.0 с
  - step: Пиковое давление и перегрузка периметра (Mid Wave)
    player_action: Перенос тяжелого энергоблока на фланг с одновременным завариванием
      пробитой решетки бруствера.
    game_response: Наплыв броненосцев, разрушающих внешний забор; одновременная сирена
      перегрева на двух турелях, HP сектора падает до 30%.
    decision: Спасать разрушающийся бруствер своим телом и клепальником или бежать
      спасать пулемет от необратимого клина при 100°C.
    duration: 30.0 с
  - step: Кульминация и ликвидация элитного монстра (Wave Climax)
    player_action: Активация режима Overcharge на Т3-Орудии, комбо-подрыв дизельной
      цистерны под ногами элитного Громилы.
    game_response: Ослепительная вспышка пламени и электрических дуг, колоссальный
      DPS турели срезает полосу HP босса, взрыв отбрасывает остатки свиты.
    decision: Сфокусировать весь огонь на боссе или отстреливать просачивающихся к
      реактору ползунов.
    duration: 20.0 с
  - step: Фаза зачистки и модернизации (Inter-wave Refit)
    player_action: Заливка баков хладагента на станции заправки, монтаж улучшенного
      ствола Т2/Т3 на заработанный скрап.
    game_response: Звук открытия пневмо-замков, анимация смены ствольного блока турели
      (пар, лязг гидравлики), пополнение крио-ранца до 100%.
    decision: Прокачать один ключевой пулемет до максимального Т3 или распределить
      скрап на установку двух новых Т1 турелей.
    duration: 20.0 с
  macro_loop:
  - step: Выбор тактического контракта смены
    player_action: Выбор тактического контракта смены на голографическом столе бункера
      Бастиона-13.
    game_response: Генерация карты рубежа, подсветка 3 секторов обороны, начисление
      стартовых 150 ед. скрапа и 1 энергоячейки на стойке.
    decision: 'Выбрать контракт с модификатором высокого риска («Снежный буран: турели
      греются на 20% медленнее, но видимость 25 м») ради х1.5 чертежей или стабильную
      стандартную смену.'
    duration: 10.0 с
  - step: Боевая смена обороны рубежа
    player_action: Прохождение 3 боевых волн смены с удержанием целостности реактора
      выше 0% HP.
    game_response: Последовательный запуск трех волн нарастающей сложности (60 с ->
      75 с -> 90 с), кульминация с боссом-Громилой, финальный победный гудок цитадели.
    decision: Приоритезировать спасение внешнего рубежа или отступить к ядру реактора
      при критическом давлении.
    duration: 225.0 с
  - step: Подведение итогов и расчет жалованья
    player_action: Просмотр итоговой боевой статистики смены и конвертация трофейного
      скрапа в чертежи.
    game_response: Отображение экрана дебрифинга, подсчет ранга обороны (S/A/B/C)
      и начисление от 50 до 180 чертежей патентов.
    decision: Оценить узкие места прошедшей смены (дефицит хладагента vs разрушения
      бруствера) для выбора направления мета-прокачки.
    duration: 15.0 с
  - step: Инженерный цех и постоянная прогрессия
    player_action: Посещение Инженерного цеха в бункере и покупка постоянных патентов
      за чертежи.
    game_response: Разблокировка постоянных пассивных узлов в древе технологий и обновление
      визуального ранга брони инженера.
    decision: Инвестировать чертежи в расширение оружейного арсенала (Тесла/Крио-миномет)
      или в мобильность и ранец инженера.
    duration: 25.0 с
  - step: Повторный выход на рубеж повышенной сложности
    player_action: Запуск следующего сектора обороны повышенной сложности.
    game_response: Инициализация следующего сектора цитадели с повышенным тиром врагов
      и новыми погодными условиями.
    decision: Адаптировать стартовый сетап турелей под узкие проходы или открытые
      зоны нового сектора.
    duration: 5.0 с
  loop_diagram: "+-------------------------------------------------------------------------+\n\
