  player_interaction: 'Клавиатура/мышь: [E] при взгляде на слот (дистанция < 2.5 м)
    для вызова радиального меню + движение мыши и [ЛКМ] для подтверждения. Тач: экранная
    кнопка «Монтаж» над слотом + тап по сектору меню.'
  feedback: 'Визуал/VFX: Пневматический поршень с грохотом вонзает титановые опоры
    в бетон, сноп оранжевых искр от сварки, на корпусе зажигается аналоговый циферблат
    с янтарной подсветкой.; Звук (Web Audio): Низкочастотный металлический удар 65
