qa:
  functional_tests:
  - Проверка монтажа всех 4 типов турелей на свободные слоты периметра.
  - 'Проверка физики перегрева: авто-клин при 100% тепла и сброс температуры крио-спреем.'
  - 'Проверка логистики батарей: взятие с генератора, снижение скорости бега, активация
    Overcharge на 25 сек.'
  - Проверка условий победы при отражении 3 волн и условий поражения при разрушении
    реактора.
  - Проверка сохранения прогресса чертежей в Playgama Cloud Save.
  performance_benchmarks:
  - 'Десктоп: 60 FPS при 120 одновременных зомби и 4 активных турелях на экране'
  - 'Мобильные (средний сегмент): стабильные 45-60 FPS при dpr 1.0-1.25'
  - 'Потребление оперативной памяти: не более 180 МБ в пике сражения'
  - 'Количество Draw Calls: не более 65 в самом насыщенном кадре с метелью и партиклами'
  cross_browser_matrix:
  - Google Chrome 115+ (Windows, macOS, Android)
  - Apple Safari 16+ (iOS 15+, macOS)
  - Mozilla Firefox 118+ (Windows, Linux)
  - Yandex Browser Mobile (Android / iOS)
  - Microsoft Edge 115+ (Windows)
  common_bug_checklist:
  - Крио-спрей не должен расходовать ресурс при наведении в пустоту.
  - InstancedMesh зомби не должны 'залипать' в геометрии бруствера при массовом спавне.
  - Контекстная кнопка на мобильных должна мгновенно переключаться между 'Монтаж',
    'Охладить', 'Зарядить'.
  - При сворачивании браузера (VisibilityChange) игра обязана корректно вставать на
    паузу и глушить аудио.
  - Энергоячейка не должна пропадать сквозь пол при получении урона игроком.
roadmap:
- phase_number: 1
  title: 'M1: Базовый FPS-контроллер и Слот-Монтаж'
  duration_days: 2
  tasks:
  - Настройка Three.js сцены и камеры от первого лица (FPS контроллер)
  - Создание сетки монтажных слотов периметра бастиона
  - Базовый AI навигации зомби к брустверу
  milestone_deliverable: Перемещение инженера от первого лица, базовая арена со слотами
    периметра и авто-стреляющий пулемет.
- phase_number: 2
  title: 'M2: Термодинамика, Крио-спрей и Энергоячейки'
  duration_days: 2
  tasks:
  - Математика перегрева и клина турелей при стрельбе
  - Инструмент крио-охлаждения инженера с VFX морозного пара
  - Механика переноски энергоячеек со стойки генератора в слоты турелей
  milestone_deliverable: Полноценная система нагрева стволов, крио-спрей с выбросом
    пара и переноска энергоячеек в руках.
- phase_number: 3
  title: 'M3: Инстансинг Орды и Сессионный Луп Смены'
  duration_days: 2
  tasks:
  - InstancedMesh рендеринг орды зомби (100+ врагов)
  - Архитектура 3-волновой смены с условиями победы и поражения реактора
  - Экономика металлолома (Scrap) и апгрейды турелей до T2/T3
  milestone_deliverable: 3 волны с нарастающей сложностью, зомби-бегуны, бронированные
    мутанты и босс-громила.
- phase_number: 4
  title: 'M4: Дизельпанк Арт, VFX, Аудио и Мобильный HUD'
  duration_days: 2
  tasks:
  - Дизельпанк материалы, раскаление стволов и партиклы метели/искр
  - Двухзонный мобильный тач-интерфейс с контекстными кнопками действия
  - Интеграция Howler.js аудио (3D позиционирование выстрелов и крио-спрея)
  milestone_deliverable: Атмосферный ледяной дизельпанк, снежная буря, дульное пламя,
    3D звуки и эргономичный мобильный HUD.
- phase_number: 5
  title: 'M5: Интеграция SDK, Монетизация и Релиз'
  duration_days: 2
  tasks:
  - Интеграция @playgama/bridge 2.x (Rewarded, Interstitial, Cloud Storage)
  - Таблица рекордов выживания и бункер мета-модернизации чертежей
  - Финальное профилирование памяти и замеры FPS на слабых мобильных устройствах
  milestone_deliverable: Релизный WebGL билд с монетизацией, облачными сохранениями
    и лидербордами на Playgama / Yandex Games.
risks:
- risk: Просадки FPS на мобильных устройствах при спавне 100+ зомби одновременно.
  category: technical
  severity: Medium
  mitigation: Использование Three.js InstancedMesh с вычислением анимаций в вершинном
    шейдере и пулингом партиклов.
- risk: Сложность одновременного контроля нескольких перегревающихся орудий на тачскрине.
  category: gameplay
  severity: Medium
  mitigation: Контекстное автоматическое наведение крио-спрея при нахождении в 2 метрах
    от орудия и увеличенные зоны тача.
- risk: Риск превращения геймплея в однообразный симулятор пожарного.
  category: design
  severity: Low
  mitigation: Введение 4 уникальных классов турелей (Пулемет, Огнемет, Крио, Тесла)
    и синергий перегрева с крио-спреем.
skills:
- skill_id: threejs-instanced-zombie-horde
  name: Three.js Instanced Zombie Horde Optimization
  filename: skills/instanced_zombie_horde.md
  purpose: Обеспечение стабильных 60 FPS при отрисовке 100+ зомби в WebGL.
  when_to_use: При реализации спавна масштабных волн противников в 3D браузерных играх.
  rules:
  - Не более 2 Draw Calls на всю орду зомби
  - Отсутствие аллокаций памяти внутри анимационного цикла requestAnimationFrame
  architecture: Three.js InstancedMesh + Custom Vertex Shader для скелетной анимации
    толпы в один draw call.
  implementation_guidance: Используйте матричные трансформации инстансов для передачи
    координат, направления взгляда и кадра походки зомби.
  common_mistakes:
  - Создание отдельных Mesh для каждого зомби вместо InstancedMesh
  - Тяжелые расчеты путей на каждом кадре вместо статической сетки Flow Field
  checklist:
  - Все зомби используют один общий атлас текстур и единый инстанс-меш
  - Frustum culling отсекает невидимых зомби за спиной игрока
  - Пул объектов для мгновенной переинициализации без сборщика мусора
  knowledge_refs:
  - threejs/instanced_mesh_crowds.md
- skill_id: mobile-fps-touch-controller
  name: Mobile Touch Dual-Zone FPS Controller
  filename: skills/mobile_fps_touch_controls.md
  purpose: Идеальная эргономика управления от первого лица на смартфонах без физической
    клавиатуры.
  when_to_use: Для всех 3D экшенов и шутеров от первого лица на мобильных браузерах.
  rules:
  - 'Никаких микроскопических кнопок: размер зоны действия не менее 80x80dp'
  - Плавная интерполяция кватерниона камеры для устранения рывков
  architecture: Event-driven Touch Controller с раздельной обработкой виртуального
    стика и зоны свайпа камеры.
  implementation_guidance: Реализуйте плавающий стик, центрирующийся в точке первого
    касания пальца в левой половине экрана.
  common_mistakes:
  - Фиксированный джойстик вместо динамического плавающего в левой зоне
  - Отсутствие сглаживания вращения камеры при резких тачах
  checklist:
  - Проверка touch.identifier для предотвращения конфликта пальцев
  - Deadzone 8px для исключения микро-дрожания стика
  - Контекстная кнопка действия реагирует на расстояние до турели < 2.5 м
  knowledge_refs:
  - mobile/dual_stick_fps_touch.md
- skill_id: playgama-bridge-integration
  name: Playgama Bridge SDK Integration & Lifecycle
  filename: skills/playgama_bridge_integration.md
  purpose: Бесшовная интеграция платформенных фичей (реклама, сейвы, лидерборды) для
    Yandex Games и VK.
  when_to_use: При подготовке релизной сборки WebGL игры для платформ Playgama/Yandex/VK.
  rules:
  - Строго соблюдать кулдаун межстраничной рекламы (120 сек)
  - Никогда не блокировать загрузку игры ожиданием ответа рекламного SDK
  architecture: Обертка над @playgama/bridge с поддержкой промисов, авто-восстановлением
