  tension_curve: '0:00–0:20 (Низкое/Спокойствие, 15%): Фаза монтажа. Тихий гул генератора,
    расстановка первых турелей на слоты, осмотр коридоров схода орды. -> 0:20–1:20
    (Волна 1, Нарастание 15% -> 45%): Появление разведчиков зомби. Пулеметы легко
    сбивают цели, игрок делает первые охлаждения (1-2 раза за волну), осваивая физику
    крио-ранца. -> 1:20–1:40 (Передышка 1, Спад до 25%): Звучит сигнал паузы. Быстрый
    сбор скрапа, заправка ранца, апгрейд первой турели до Т2. -> 1:40–2:55 (Волна
    2, Высокое напряжение 45% -> 75%): Двухфланговый наплыв бегунов и броненосцев.
    Орудия греются в 2 раза чаще, игрок мечется между флангами, физически тащит Overcharge-ячейку,
    первый прорыв решетки бруствера. -> 2:55–3:15 (Передышка 2, Локальный спад до
    40%): Напряженная тишина, тревожное мерцание аварийных ламп, экстренная починка
    бруствера и закупка тяжелых калибров. -> 3:15–4:45 (Волна 3, Кульминация/Пик 75%
    -> 100%): В бой вступает 3-метровый Хладо-Громила с плотной свитой ползунов. Критический
    перегрев всех секторов, непрерывные аварийные сирены, игрок влетает в подкатах,
    бросает фаеры в бочки, заваривает бреши под кислотным огнем. Реактор под угрозой.
    -> 4:45–5:00 (Разрядка/Победный триумф, Спад до 0%): Взрыв босса, разлетающиеся
    осколки льда, отключение боевой сирены, мощный рев защитных орудий цитадели и
    победная сводка смены.'
  core_formulas:
  - 'Формула термического баланса и нагрева ствола: Heat_gain = Base_Heat_Rate * (1.0
    + Overcharge_Multiplier * 0.75) * Fire_Rate_RPS * dt. Для Т1 пулемета Base_Heat_Rate
    = 4.2°C/с, при Overcharge_Multiplier = 1.8 нагрев достигает 7.35°C/с. При Heat
    >= 100.0°C орудие входит в статус JAMMED на 8.0 с.'
  - 'Формула крио-охлаждения ствола: Heat_loss = Cryo_Power * (1.0 + Engineer_Patent_Level
    * 0.15) * dt. Где Cryo_Power = 75.0°C/с при расходе крио-хладагента 25.0 ед/с.
    Полный сброс температуры со 100°C до 10°C занимает ровно 1.2 с непрерывного полива
    соплом в упор (дистанция <= 2.2 м).'
  - 'Формула комбинированного крио-термического урона (Cryo-Shatter Combo): Damage_Final
    = Base_Damage * (Is_Frozen ? 3.0 : 1.0) * (Is_Overcharged ? 1.8 : 1.0) * Armor_Reduction.
    Заморозка наступает при накоплении 100 ед. холода (взрыв крио-бочки или 2.0 с
    сопла спрея) и длится 4.0 с, утраивая входящий урон.'
  - 'Формула спавна и плотности орды по волнам смены: Zombie_Count(W) = Floor(25 *
    (W ^ 1.35) + Modifier_Bonus). W1 = 25 зомби (интервал спавна 2.4 с, 1 шлюз), W2
    = 62 зомби (интервал спавна 1.2 с, 2 фланга), W3 = 110 зомби + 1 Элитный Хладо-Громила
    (интервал спавна 0.8 с, 3 шлюза).'
  - 'Формула скорости перемещения инженера: Speed = Base_Sprint_Speed * (1.0 - (Carrying_Cell
    ? 0.30 : 0.0)) * (Stamina > 0 ? 1.0 : 0.65). Base_Sprint_Speed = 7.5 м/с, Base_Walk_Speed
    = 4.2 м/с. Переноска тяжелой Overcharge-ячейки снижает спринт до 5.25 м/с и блокирует
    прыжки.'
  - 'Формула расчета боевого жалованья и чертежей за смену: Score = (Kills * 10) +
    (Remaining_Reactor_HP% * 50) + (Heat_Clean_Bonus * 200) - (Breaches_Count * 150);
    Blueprints_Earned = Floor(Score / 250) * Patent_Multiplier.'
  run_progression:
  - T1 -> T2 Модернизация Ствольного Блока (120 скрапа) — базовый пулемет «Корд-М»
    заменяется на двуствольную автопушку «Шквал-23» (урон 35 -> 65 DPS, магазин 150
    -> 300 снарядов, сектор обстрела 120° -> 140°).
  - T2 -> T3 Установка Индустриального Ротора (250 скрапа) — орудие превращается в
    шестиствольный роторный пулемет «Вулкан-Дизель» с бронебойной лентой (DPS 65 ->
    145, эффект разрыва тел мутантов, время раскрутки ротора 0.4 с).
  - Интеграция Радиатора с Жидким Азотом (80 скрапа на слот) — пассивный теплоотвод
    турели увеличивается с 1.5°C/с до 5.0°C/с, продлевая время непрерывной стрельбы
    до перегрева с 12 с до 22 с.
  - Энерго-Сплиттер Overcharge (150 скрапа) — позволяет одной вставленной энергоячейке
    питать сразу 2 соседние турели в радиусе 6 метров с эффективностью +50% DPS на
    каждую.
  - Усиление Бруствера Титановыми Листами (60 скрапа за секцию) — увеличивает прочность
    секции забора с 500 до 1200 HP и добавляет шипы обратного урона (30 ед/удар мутанта).
  meta_progression:
  - 'Патент: Крио-Баллон Увеличенного Объема (Уровни 1-5) — постоянное увеличение
    емкости ранцевого крио-баллона инженера со 100 до 220 единиц (+24 ед. за уровень).'
  - 'Патент: Гидравлический Серво-Экзоскелет (Уровни 1-5) — снижение штрафа к скорости
    при переноске Overcharge-ячеек с -30% до -5% и увеличение запаса стамины инженера
    на 50%.'
  - 'Патент: Разработка Спец-Турелей (Новые чертежи в арсенал) — разблокировка доступа
    к установке на слотах крио-пушки «Абсолютный Ноль» (AoE замедление 70%) и тесла-генератора
    «Дуговой Разряд» (цепная молния по 5 целям).'
  - 'Патент: Пневматический Клепальник МК-3 (Уровни 1-3) — ускорение полевого ремонта
    бруствера на 40% и добавление ударной пневмо-волны при завершении починки, сбивающей
    мутантов с ног в радиусе 3.5 м.'
  - 'Патент: Армированное Ядро Главного Реактора (Уровни 1-5) — повышение базовой
    прочности реактора цитадели с 1000 до 2500 HP и установка автоматической защитной
    электро-вспышки при падении HP ниже 20% (очищает реакторный зал раз в смену).'
  mechanics:
  - name: Монтаж и Модульный Апгрейд Турелей по Слотам
    role_in_loop: Двигатель (построение тактической линии огня и инвестиция заработанного
      скрапа)
    player_decision: 'Куда именно направить ограниченный скрап: занять пустой фланг
      дешевым T1-пулеметом для прикрытия или влить ресурсы в T3-монстра на центральном
      направлении с риском пропустить бегунов с фланга.'
    input_mapping: 'Клавиатура/мышь: [E] при взгляде на слот (дистанция < 2.5 м) для
      вызова радиального меню + движение мыши и [ЛКМ] для подтверждения. Тач: экранная
      кнопка «Монтаж» над слотом + тап по сектору меню.'
    states:
    - 'SLOT_EMPTY: слот свободен, мигает голографическая проекция контура турели и
      стоимость в скрапе'
    - 'ASSEMBLING: 1.5-секундный монтаж пневмо-манипулятором со снопом искр и лязгом
      шестерен'
    - 'OPERATIONAL_T1: турель активна, авто-наведение в секторе 120°, накопление тепла
      при огне'
    - 'UPGRADING: 2.0-секундная замена ствольной коробки на ходу с блокировкой стрельбы'
    - 'OPERATIONAL_T2_T3: усиленный режим с повышенной скорострельностью, бронепробитием
      и модифицированным тепловыделением'
    parameters:
    - name: Время базового монтажа T1
      value: 1.5 с
      tuning_note: Если уменьшить ниже 0.8 с, исчезает ощущение тяжелой дизельпанк-техники;
        если поднять выше 2.5 с, игрок не успевает реагировать на смену флангов.
    - name: Стоимость T1 турели в скрапе
      value: 75 ед.
      tuning_note: Рассчитана ровно на 5 убитых мутантов первой волны; увеличение
        до 100 ед. ломает старт волны, делая оборону невозможной.
    - name: Сектор автозахвата целей
      value: 120 градусов
      tuning_note: Ограниченный сектор заставляет продумывать угол монтажа; 360° превратило
        бы игру в тривиальный автошутер без слепых зон.
    - name: Дальность эффективного огня T1
      value: 28.0 м
      tuning_note: Соответствует длине коридора рубежа; увеличение до 40 м обесценит
        сближение орды.
    feedback_layers:
    - 'Визуал/VFX: Пневматический поршень с грохотом вонзает титановые опоры в бетон,
      сноп оранжевых искр от сварки, на корпусе зажигается аналоговый циферблат с
      янтарной подсветкой.'
    - 'Звук (Web Audio): Низкочастотный металлический удар 65 Гц при посадке на слот,
      шипение сброса пневматики (White Noise с Lowpass-фильтром 1.8 кГц), лязг досылания
      патронной ленты.'
    - 'Камера: Импульсный толчок камеры вниз на 0.05 м (шейк с амплитудой 1.2, затухание
      0.25 с) в момент фиксации турели на платформе.'
    - 'UI/Тактильность: Круговой селектор с бронзовой гравировкой и отображением остатка
      скрапа, короткая виброотдача 45 мс на мобильных устройствах при подтверждении
      установки.'
    failure_mode: Игрок начинает длительный 2.0-секундный апгрейд турели прямо перед
      несущейся пачкой бегунов (орудие блокируется, сектор остается без огня) либо
      пытается установить орудие без достаточного количества скрапа (раздается сухой
      лязг пустой кассы).
    mastery_curve: Новичок хаотично застраивает первые попавшиеся слоты слабыми T1
      пулеметами и тратит весь скрап. Эксперт держит тайминги волн, создает перекрестные
      сектора огня двух T2 орудий с полным перекрытием слепых зон и проводит апгрейды
      ровно в 3-секундные паузы между пачками зомби.
    counterplay: Мутанты-камикадзе (Кислотные подрывники) целенаправленно бегут на
      звук монтируемой турели, взрываясь в радиусе 4.0 м и нанося 250 ед. урона по
      конструкции.
    synergies:
    - 'Крио-охлаждение стволов: апгрейд до T2/T3 увеличивает скорострельность и ускоряет
      нагрев, требуя более частых подбегов с крио-спреем.'
    - 'Энергетическая логистика: на T2/T3 турелях открывается высоковольтный порт
      для Overcharge-ячеек.'
    - 'Цепная детонация бочек: турели автоматически поджигают дизельные бочки при
      скоплении 4+ врагов в их секторе.'
    why_unique: Вместо мгновенного появления башни из воздуха, турель монтируется
      как тяжелый физический механизм на силовой слот с ограниченным сектором обстрела
      и механической уязвимостью в момент переоснащения.
    pseudocode: "function tick_turret_mounting(slot, player, dt):\n  if player.press_action\
      \ and slot.is_empty and player.scrap >= T1_COST:\n    player.scrap -= T1_COST\n\
      \    slot.state = ASSEMBLING\n    slot.timer = 1.5\n    play_audio('pneumatic_install',\
      \ volume=0.8)\n    camera_kick(pitch=-0.05, duration=0.25)\n  elif slot.state\
      \ == ASSEMBLING:\n    slot.timer -= dt\n    spawn_particles('weld_sparks', slot.position)\n\
      \    if slot.timer <= 0:\n      slot.state = OPERATIONAL_T1\n      slot.turret\
      \ = create_turret(type='HMG_23MM', heat=0.0)"
  - name: Крио-Охлаждение Стволов и Термо-Менеджмент
    role_in_loop: Источник риска и Тормоз (заставляет покидать безопасные позиции
      и контролировать тепловой темп)
    player_decision: Подбежать и охладить орудие превентивно на 70°C (потратив 1.0
      с времени и 20 ед. фреона) или рискнуть ради добивания пачки зомби, допустив
      100°C клин на 8 секунд с риском потери сектора.
    input_mapping: 'Клавиатура/мышь: Зажатие [ПКМ] / [F] при наведении сопла ранца
      на радиатор перегретой турели (дистанция <= 2.2 м). Тач: Удержание экранной
      кнопки «Крио-Залп» в зоне досягаемости орудия.'
    states:
    - 'OPTIMAL_TEMP (0-60°C): зеленый/янтарный индикатор, штатная скорострельность
      100%, авто-огонь'
    - 'WARNING_HEAT (60-89°C): оранжевое каление кожуха, предупреждающий прерывистый
      зуммер 800 Гц'
    - 'CRITICAL_HEAT (90-99°C): ярко-вишневое свечение металла, свист пара из клапанов,
      падение темпа стрельбы на 25%'
    - 'JAMMED (100°C): аварийный стопор орудия на 8.0 с, черный дым, сирена тревоги,
      турель полностью беззащитна'
    - 'ACTIVE_COOLING: струя жидкого азота сбивает нагрев со скоростью 75°C/с, генерируя
      плотное паровое облако'
    parameters:
    - name: Скорость нагрева ствола T1 при непрерывной стрельбе
      value: 4.2°C/с
      tuning_note: При 2.0°C/с механика становится незаметной; при 8.0°C/с игрок превратится
        в пожарного без возможности взглянуть на поле боя.
    - name: Скорость сброса тепла крио-спреем
      value: 75.0°C/с
      tuning_note: Позволяет за 1.2 с полностью снять критический нагрев; увеличение
        дольше 2.0 с делает спрей смертельной ловушкой для инженера.
    - name: Штраф клина при 100°C (Jammed Duration)
      value: 8.0 с
      tuning_note: Жесткое наказание за невнимательность, заставляющее зомби подойти
        вплотную к брустверу.
    - name: Дистанция применения сопла охлаждения
      value: 2.2 м
      tuning_note: Требует входа в зону ближнего боя рядом с амбразурой; увеличение
        до 6 м убило бы весь физический риск.
    - name: Запас крио-хладагента в ранце
      value: 100.0 ед.
      tuning_note: Хватает ровно на 4 полных цикла охлаждения до необходимости дозаправки
        на стационарном баке.
    feedback_layers:
    - 'Визуал/VFX: Прогрессивный шейдер раскаленного металла (от темно-серого к ослепительно
      бело-оранжевому накалу), густые клубы белого объемного пара при подаче крио-спрея,
      оседающий на кожухе иней.'
    - 'Звук (Web Audio): Пронзительный шипящий звук вскипающего жидкого азота (Bandpass-фильтр
      3.5 кГц с модуляцией LFO), щелчок термо-реле при сбросе температуры, затихающий
      свист давления.'
    - 'Камера: Динамическое размытие по краям экрана (Radial Blur) и легкая высокочастотная
      дрожь рук инженера от ледяного сопла (шейк 0.8, частота 25 Гц).'
    - 'UI/Тактильность: Круговой сегментный термометр над башней с цветовой градацией
      (Зеленый -> Желтый -> Оранжевый -> Мигающий красный) + пульсирующая вибрация
      геймпада/смартфона при входе в зону 90°C+.'
    failure_mode: Игрок увлекается расстрелом вдалеке и пропускает момент, когда оба
      фланговых пулемета ловят клин на 100°C (звучит оглушительный вой клаксона JAMMED,
      турели замирают с дымящимися дулами, орда беспрепятственно врывается в проход).
    mastery_curve: 'Новичок бежит охлаждать только после полной остановки и клина
      башни, теряя драгоценные секунды. Эксперт держит тепловой ритм: дает короткие
      отсечки крио-спрея (0.4 с) в паузах между перезарядками ленты, удерживая температуру
      орудий в «золотом окне» 50-70°C без падения DPS.'
    counterplay: Огненные зомби-кочегары при гибели разбрызгивают горючую смолу, мгновенно
      нагревая близлежащие турели на +35°C и поджигая позицию.
    synergies:
    - 'Монтаж турелей: Т3 роторные пулеметы накапливают тепло в 1.8 раза быстрее базовых
      Т1, требуя непрерывного надзора.'
    - 'Энергетическая логистика: турель в режиме Overcharge генерирует +75% тепла,
      сокращая время до критического перегрева до 6.5 секунд.'
    - 'Цепная детонация бочек: облако пара от крио-спрея при рассеивании замораживает
      мелких ползунов на 1.5 секунды.'
    why_unique: В большинстве TD башни стреляют бесконечно без ограничений. Здесь
      охлаждение орудия — это тактильный физический акт обслуживания от первого лица,
      требующий личного присутствия и расхода ресурса ранца прямо под носом у врагов.
    pseudocode: "function tick_cryo_cooling(turret, player, dt):\n  if player.is_spraying\
      \ and distance(player.pos, turret.pos) <= 2.2 and player.cryo_fuel > 0:\n  \
      \  fuel_used = 25.0 * dt\n    player.cryo_fuel = max(0.0, player.cryo_fuel -\
      \ fuel_used)\n    turret.heat = max(0.0, turret.heat - 75.0 * dt)\n    if turret.state\
      \ == JAMMED and turret.heat < 50.0:\n      turret.state = OPERATIONAL\n    spawn_volumetric_steam(turret.pos,\
      \ intensity=turret.heat / 100.0)\n    play_loop_sound('cryo_hiss', pitch=1.0\
      \ + (turret.heat / 100.0))\n  elif turret.is_firing:\n    turret.heat += turret.heat_rate\
      \ * dt\n    if turret.heat >= 100.0:\n      turret.state = JAMMED; play_sound('alarm_jammed')"
  - name: Энергетическая Логистика и Overcharge-Ячейки
    role_in_loop: Источник награды и Двигатель урона (кратковременный колоссальный
      взрыв силы ценой физической доставки)
    player_decision: 'В какой именно сектор доставить единственную заряженную энергоячейку:
      усилить пулемет против толпы бегунов или приберечь для Т3-гаубицы при появлении
      босса, рискуя медленно тащить ее под обстрелом.'
    input_mapping: 'Клавиатура/мышь: [E] на генераторной стойке для захвата ячейки
      в обе руки; [E] на турели для монтажа ячейки в силовой отсек. [G] — бросить
      ячейку. Тач: экранная кнопка «Взять батарею» / «Вставить Overcharge».'
    states:
    - 'CHARGING_IN_RACK: ячейка заряжается на базовом генераторе (цикл зарядки 20.0
      с)'
    - 'READY_FOR_PICKUP: ячейка светится неоново-синим светом, готова к транспортировке'
    - 'CARRIED_BY_PLAYER: инженер несет тяжелый блок в руках (скорость -30%, оружие
      заблокировано)'
    - 'OVERCHARGE_ACTIVE: ячейка установлена в турель (+80% DPS, светящиеся синие
      молнии, длительность 25.0 с)'
    - 'DEPLETED: ячейка разряжена, с шипением выбрасывается из турели на землю как
      пустой корпус'
    parameters:
    - name: Длительность режима Overcharge
      value: 25.0 с
      tuning_note: Достаточно, чтобы выкосить плотную группу или элитного врага; свыше
        40 с убило бы ценность логистического цикла.
    - name: Бонус к скорострельности и урону в Overcharge
      value: +80% DPS
      tuning_note: Превращает турель в аннигилятор; значение ниже +40% не оправдывает
        риск медленной переноски батареи через поле боя.
    - name: Штраф к скорости инженера при переноске ячейки
      value: -30%
      tuning_note: Создает напряжение «тяжелого груза»; при -60% игрок становится
        легкой мишенью для кислотных плевков.
    - name: Время перезарядки генератора на базе
      value: 20.0 с
      tuning_note: Ограничивает количество супероружия до 2-3 применений за всю волну
        смены.
    - name: Количество доступных ячеек на рубеже
      value: 2 шт.
      tuning_note: Заставляет делать выбор между одновременной поддержкой двух флангов
        или непрерывной ротацией на одном секторе.
    feedback_layers:
    - 'Визуал/VFX: Корпус турели окутывают высоковольтные электрические дуги Теслы,
      дульное пламя меняет цвет с желтого на ослепительно ярко-синий, гильзы вылетают
      сплошным потоком.'
    - 'Звук (Web Audio): Нарастающий гул турбины (Sine wave с частотной модуляцией
      от 120 Гц до 850 Гц), металлический лязг пневмо-замка батарейного отсека, треск
      электрических разрядов.'
    - 'Камера: Тяжелое раскачивание камеры при беге с ячейкой в руках (Bobbing с амплитудой
      0.08 м, частота 3.2 Гц), эффект Chromatic Aberration при нахождении рядом с
      оверчардж-турелью.'
    - 'UI/Тактильность: На таймере турели появляется синяя светящаяся шкала обратного
      отсчета (25.0 с), тяжелый вибро-импульс длительностью 120 мс при защелкивании
      ячейки в слот.'
    failure_mode: Игрок берет ячейку и пытается бежать наперерез орде зомби; из-за
      сниженной на 30% скорости его настигают быстрые бегуны, сбивают с ног и выбивают
      энергоблок из рук прямо в толпу.
    mastery_curve: Новичок забывает про ячейки на генераторе и тащит их только в панике,
      когда реактор уже грызут. Эксперт заранее выносит заряженную ячейку на средний
      помост до старта волны и вставляет ее в Т3 турель ровно за 0.5 с до появления
      бронированного авангарда.
    counterplay: ЭМИ-ползуны (мутировавшие кабельщики) при приближении к турели с
      оверчарджем разряжают ячейку за 3 секунды, вызывая короткое замыкание.
    synergies:
    - 'Крио-охлаждение: турель в Overcharge греется на 75% быстрее, поэтому после
      установки батареи инженер обязан стоять наготове с крио-соплом.'
    - 'Монтаж турелей: оверчардж турели Т3 класса разблокирует пробивание врагов навылет
      (до 3 зомби одной пулей).'
    - 'Полевой ремонт: разряженную пустую ячейку можно разобрать клепальником на 25
      единиц экстренного скрапа.'
    why_unique: Вместо нажатия кнопки «Ультануть» в интерфейсе с кулдауном, бафф является
      осязаемым физическим предметом на арене, который нужно вручную донести ногами,
      рискуя жизнью под огнем.
    pseudocode: "function tick_overcharge_logistics(player, rack, turret, dt):\n \
      \ if player.press_interact and distance(player.pos, rack.pos) <= 2.0 and rack.has_ready_cell:\n\
      \    rack.has_ready_cell = false; player.carrying_cell = true\n    player.speed_modifier\
      \ = 0.70; play_sound('cell_pickup')\n  elif player.press_interact and player.carrying_cell\
      \ and distance(player.pos, turret.pos) <= 2.2:\n    player.carrying_cell = false;\
      \ player.speed_modifier = 1.0\n    turret.is_overcharged = true; turret.overcharge_timer\
      \ = 25.0\n    turret.dps_multiplier = 1.8; turret.heat_rate *= 1.75\n    play_sound('overcharge_engage');\
      \ screen_shake(intensity=1.5)"
  - name: Цепная Термо-Детонация Крио- и Дизель-Бочек
    role_in_loop: Источник риска и Награда за точность (тактический инструмент мгновенной
      зачистки скоплений)
    player_decision: Взорвать бочку сейчас ради уничтожения 5 обычных зомби или подпустить
      ближе тяжелого Громилу, рискуя получить взрывную волну по собственному брустверу.
    input_mapping: 'Клавиатура/мышь: [Q] — бросок сигнального термического фаера по
      баллистической дуге. [ЛКМ] — точный выстрел турели/ручного карабина по бочке.
      Тач: тап по бочке для прицельного броска фаера.'
    states:
    - 'PRISTINE: бочка герметична, индикатор давления в норме'
    - 'DAMAGED: утечка газа/топлива при получении урона, шипение струи'
    - 'CRYO_DETONATION: взрыв жидкого азота, радиус 6.0 м, мгновенная заморозка всех
      врагов на 4.0 с, 150 ед. крио-урона'
    - 'DIESEL_DETONATION: огненный фугас, радиус 7.5 м, 400 ед. урона + поджигание
      земли на 6.0 с'
    - 'THERMAL_SHOCK_COMBO: одновременный подрыв крио + дизель бочек, вызывающий термоудар
      (х3.0 урон и раскол брони мутантов)'
    parameters:
    - name: Радиус поражения крио-бочки
      value: 6.0 м
      tuning_note: Идеально перекрывает ширину стандартного коридора рубежа; увеличение
        до 10 м сделает зачистку слишком легкой.
    - name: Длительность заморозки мутантов (Freeze Stun)
      value: 4.0 с
      tuning_note: Дает инженеру окно для передышки или заливки спреем орудий; ниже
        2.0 с игрок не успевает среагировать.
    - name: Урон от термического шока (Комбо Крио + Дизель)
      value: 1200 ед.
      tuning_note: Мгновенно уничтожает любого бронированного зомби и сносит 40% HP
        боссу-Громиле.
    - name: Дальность броска сигнального фаера
      value: 18.0 м
      tuning_note: Позволяет подрывать бочки на безопасном удалении без входа в зону
        поражения.
    - name: Количество бочек на волну
      value: 4 шт.
      tuning_note: Строго лимитированный стратегический ресурс арены, требующий вдумчивого
        использования.
    feedback_layers:
    - 'Визуал/VFX: Вспышка ультрамаринового света при крио-взрыве с радиальной волной
      инея по земле; огненный гриб дизельного взрыва с клубами черного масляного дыма;
      тела мутантов покрываются толстой ледяной коркой.'
    - 'Звук (Web Audio): Глухой объемный хлопок имплозии (низкие частоты 45 Гц с реверберацией
      ангара), звонкий хрустальный треск раскалывающегося льда, шипение горящего топлива.'
    - 'Камера: Мощный сотрясающий импульс камеры (Trauma 0.6, плавное затухание за
      0.45 с), кратковременная радиальная ударная волна (Shockwave Post-Processing).'
    - 'UI/Тактильность: Всплывающие золотые маркеры «КРИО-РАСКОЛ x3» над замороженными
      врагами, резкая двойная вибрация геймпада/смартфона (80 мс).'
    failure_mode: Игрок случайно подрывает бочку выстрелом или фаером слишком близко
      к брустверу (дистанция < 3 м), в результате чего ударная волна разрушает 50%
      защитной решетки и сбивает самого инженера с ног на 1.5 секунды.
    mastery_curve: Новичок взрывает бочки хаотично при первом приближении любого зомби.
      Эксперт заманивает толпу в узкий коридор между крио- и дизельной бочкой, подрывает
      их одновременно одним фаером и получает мгновенный каскадный термо-раскол всей
      группы.
    counterplay: Зомби-плеватели целятся кислотой в бочки издалека, пытаясь сдетонировать
      их до того, как орда войдет в зону поражения.
    synergies:
    - 'Монтаж турелей: шквал картечи от Т2 пулемета раскалывает замороженных крио-бочкой
      зомби с одного попадания.'
    - 'Крио-охлаждение: если у инженера закончился хладагент в ранце, он может разбить
      пустую крио-бочку и восстановить 50% запаса ранца.'
    - 'Полевой ремонт: бруствер, разрушенный своим же неосторожным взрывом, требует
      немедленной заварки клепальником.'
    why_unique: 'Вместо обычных красных бочек со статичным взрывом, реализована термодинамическая
      модель: крио-бочка промораживает плоть и броню, а последующий дизельный огонь
      раскалывает замерзших мутантов на осколки.'
    pseudocode: "function trigger_barrel_explosion(barrel, all_zombies, dt):\n  if\
      \ barrel.health <= 0 or barrel.ignited_by_flare:\n    if barrel.type == CRYO:\n\
      \      spawn_shockwave(barrel.pos, radius=6.0, color='cyan')\n      for z in\
      \ get_zombies_in_radius(barrel.pos, 6.0):\n        z.apply_freeze(duration=4.0);\
      \ z.take_damage(150)\n    elif barrel.type == DIESEL:\n      spawn_shockwave(barrel.pos,\
      \ radius=7.5, color='orange')\n      for z in get_zombies_in_radius(barrel.pos,\
      \ 7.5):\n        mult = z.is_frozen ? 3.0 : 1.0\n        z.take_damage(400 *\
      \ mult)\n    destroy_barrel(barrel); play_sound('deep_explosion')"
  - name: Полевой Ремонт Бруствера и Пневмо-Клепальник
    role_in_loop: Тормоз падения и Защитный рубеж (предотвращение прямого прорыва
      к реактору ценой личного времени)
    player_decision: Стоять и заваривать трещащую решетку под ударами зомби (рискуя
      собственным HP) или отступить ко второму эшелону обороны, сдав внешнюю позицию
      ради спасения турели.
    input_mapping: 'Клавиатура/мышь: Удержание [ЛКМ] при экипированном пневмо-клепальнике
      в упор к поврежденной секции бруствера (дистанция < 1.8 м). Клавиша [V] — силовой
      пневмо-удар клепальником для отталкивания мутантов. Тач: Удержание кнопки «Ремонт»
      / свайп для пневмо-удара.'
    states:
    - 'INTACT (100% HP): решетка цела, зомби не могут преодолеть рубеж'
    - 'DAMAGED (1-99% HP): погнутые балки, искры, сквозь щели лезут когти мутантов'
    - 'BREACHED (0% HP): секция разрушена, зомби свободно устремляются по коридору
      к главному реактору'
    - 'REPAIRING: инженер вбивает пневмо-заклепки со скоростью 120 HP/с, расходуя
      5 скрапа за цикл'
    - 'PNEUMATIC_BURST: сброс избыточного давления клепальника, отбрасывающий врагов
      на 3.5 м'
    parameters:
    - name: Прочность секции бруствера
      value: 500 HP
      tuning_note: Выдерживает около 12 секунд атак обычной толпы; ниже 300 HP баррикада
        падает слишком быстро, не давая шанса на ремонт.
    - name: Скорость ремонта клепальником
      value: 120 HP/с
      tuning_note: Полное восстановление бреши занимает около 4.2 секунды непрерывной
        работы.
    - name: Расход скрапа на ремонт
      value: 10 ед. за каждые 100 HP
      tuning_note: Создает прямую конкуренцию между вложениями в новые турели и поддержанием
        целостности забора.
    - name: Радиус и сила отталкивания пневмо-удара
      value: 3.5 м (импульс 450 Н)
      tuning_note: Позволяет разорвать дистанцию и выиграть 2 секунды безопасного
        ремонта.
    - name: Кулдаун силового пневмо-удара
      value: 6.0 с
      tuning_note: Предотвращает спам отталкиванием вместо стрельбы и тактики.
    feedback_layers:
    - 'Визуал/VFX: Ритмичные ослепительные вспышки заклепочника, сноп раскаленных
      металлических заклёпок, появление стальных армирующих полос на текстуре забора,
      конусообразный выброс сжатого воздуха при пневмо-ударе.'
    - 'Звук (Web Audio): Тяжелый ритмичный стук пневмо-молота 140 BPM (компрессированный
      удар 110 Гц + звон стали), шипение пневмо-клапана, визг отлетающих когтей зомби.'
    - 'Камера: Ритмичная мелкая отдача камеры при каждом ударе молота (0.02 м вверх-вниз),
      резкий кик назад при силовом пневмо-выбросе (FOV 90->85 с быстрым возвратом).'
    - 'UI/Тактильность: Полоса прочности над секцией забора плавно заполняется зеленым
      цветом с цифровым счетчиком HP (например, 340/500), ритмичная тактильная вибро-пульсация
      в такт каждому удару заклепочника (60 мс).'
    failure_mode: Игрок начинает варить решетку, когда у него закончился скрап (клепальник
      издает щелкающий холостой звук, ремонт не идет) или стоит на ремонте до последнего,
      пока его не убивают перелезшие через соседнюю дыру зомби.
    mastery_curve: Новичок паникует при виде сломанной решетки и бросает огневые позиции.
      Эксперт встречает прорыв силовым пневмо-ударом, сбивая с ног авангард, за 2
      секунды заваривает 50% прочности и переключается на заливку турели хладагентом.
    counterplay: Тяжелые мутанты-тараны (Громилы) наносят тройной урон по брустверу
      (150 урона за удар) и игнорируют отталкивание пневмо-удара.
    synergies:
    - 'Монтаж турелей: восстановленный бруствер задерживает зомби в узком горлышке
      прямо в фокусе огня Т2 пулемета.'
    - 'Энергетическая логистика: силовой пневмо-удар можно зарядить от энергоячейки,
      превратив его в AoE электро-шок на 8 метров.'
    - 'Цепная детонация бочек: ремонт забора позволяет запереть зомби в зоне готовящегося
      подрыва бочки.'
    why_unique: 'Вместо пассивного авторемонта через меню базы, это агрессивный ближний
      бой на переднем крае: инженер буквально держит рубеж собственными руками, вбивая
      заклепки под ударами монстров и расталкивая их пневматикой.'
    pseudocode: "function tick_barricade_repair(player, barricade, dt):\n  if player.press_heavy_hit\
      \ and player.pneumo_cooldown <= 0:\n    player.pneumo_cooldown = 6.0; push_enemies_in_cone(player.pos,\
      \ radius=3.5, force=450)\n    play_sound('pneumo_burst'); screen_kick(pitch=0.08)\n\
      \  elif player.is_repairing and distance(player.pos, barricade.pos) <= 1.8 and\
      \ player.scrap >= 5:\n    repaired_amount = 120.0 * dt\n    barricade.hp = min(barricade.max_hp,\
      \ barricade.hp + repaired_amount)\n    player.scrap -= (repaired_amount / 100.0)\
      \ * 10.0\n    spawn_particles('rivet_sparks', barricade.pos); play_loop_sound('riveter_hammer')"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / State Store
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 65
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 3.5
  layers:
  - description: Обработка низкоуровневого рендеринга Three.js, мешей бастиона, инстансинга
      зомби и шейдеров пара/огня
    name: Rendering & VFX Layer
  - description: Расчет термодинамики турелей, наведения орудий, состояний Overcharge
      и AI орды
    name: Simulation & Logic Layer
  - description: Адаптивный тач/клавиатурный контроллер и диегетические индикаторы
      HUD
    name: Interaction & UI Layer
  - description: Взаимодействие с Playgama Bridge, Cloud Save, звуковой шиной и аналитикой
    name: Platform & Audio Layer
  modules:
  - description: Рендеринг и анимация 100+ зомби через единый InstancedMesh с шейдерными
      костями
    name: HordeRenderer
  - description: Расчет температуры, клина, крио-спрея и параметров стрельбы всех
      орудий периметра
    name: ThermalTurretSystem
  - description: Логика генератора, перенос батарей в руках и таймеры режима Overcharge
    name: PowerGridManager
  - description: Управление волнами, таймингами смен и спавном мутантов по секторам
    name: ShiftWaveDirector
  - description: Синхронизация прогресса с облаком Playgama и вызовы монетизации
    name: BridgeAdapter
monetization:
  strategy_summary: 'Честная гибридная монетизация: Rewarded Video для экстренного
    охлаждения/второго шанса смены и удвоения инженерных чертежей, ненавязчивые Interstitial
    между сменами, IAP для косметических скинов мультитула и турелей.'
  rewarded_placements:
  - id: revive_reactor
    name: Аварийная перезагрузка реактора (Второй шанс)
    benefit: Восстанавливает 35% HP реактора и мгновенно остужает все турели на периметре
      до 0% тепла.
    cooldown_or_limit: 1 раз за смену
    trigger_moment: Экран критического прорыва реактора при поражении
  - id: double_blueprints
    name: Удвоение чертежей смены
    benefit: Удваивает количество заработанных инженерных чертежей для перманентной
      прокачки в бункере.
    cooldown_or_limit: Каждую успешную смену
    trigger_moment: Экран победного завершения смены обороны
  - id: airdrop_supplies
    name: Срочная доставка припасов
    benefit: Сбрасывает на базу контейнер с 2 готовыми энергоячейками и полным запасом
      крио-агента.
    cooldown_or_limit: 1 раз за смену
    trigger_moment: Пауза перед финальной 3-й волной смены
  interstitial_placements:
  - trigger_event: shift_completed_menu
    cooldown_seconds: 120
    conditions: Показывается только между сменами после экрана подведения итогов;
      не чаще 1 раза в 120 секунд; не показывается после поражения на 1-й волне.
  in_app_purchases:
  - sku: iap_engineer_starter
    name: Стартовый набор инженера
    description: Уникальный визуальный стиль 'Хром и Медь' для мультитула + 500 чертежей
      модернизации.
    price_tier: $1.99
    reward: 500 чертежей + скин 'Хром и Медь'
  - sku: iap_turret_black_frost
    name: Набор скинов 'Черный Мороз'
    description: Комплект премиальных дизельпанк-скинов 'Черный Мороз' для всех 4
      типов турелей.
    price_tier: $3.99
    reward: 4 скина турелей + иконка профиля
  - sku: iap_no_ads_veteran
    name: Пропуск ветерана (No Ads)
    description: Полное отключение межстраничной рекламы Interstitial навсегда + постоянный
      бонус +25% к скрапу.
    price_tier: $4.99
    reward: Отключение Interstitial + 25% Scrap Boost
  fairness_rules:
  - 'Никакого Pay-to-Win: все турели, апгрейды и чертежи открываются исключительно
    за игровое мастерство.'
  - Реклама никогда не прерывает активный бой во время волны; показ возможен только
    в паузах между сменами.
  - Rewarded-бонусы дают приятное ускорение прогресса или второй шанс, но не являются
    обязательными для победы.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - crazygames
  - gamepix
  - web
  initialization_flow:
  - 1. Bridge.init() с таймаутом 3.0 сек
  - 2. Параллельная загрузка CloudStorage и баннера
  - 3. Определение типа ввода (тач/мышь) и ориентации экрана
  - 4. Старт главного меню без блокировки рендера
  cloud_save_keys:
  - player_blueprints
  - unlocked_turret_types
  - gear_upgrade_levels
  - best_shift_survived
  - audio_settings
  leaderboards:
  - best_shift_score
  - endless_waves_record
  ads_integration:
    banner_enabled: false
    interstitial_auto_precharge: true
    rewarded_callback_handling: Надежная обработка onSuccess с мгновенной выдачей
      наград даже при сетевых задержках
  lifecycle_hooks:
  - Bridge.on(EVENT_GAME_PAUSE, () => Game.pauseEngine())
  - Bridge.on(EVENT_GAME_RESUME, () => Game.resumeEngine())
  - Bridge.on(EVENT_VOLUME_CHANGE, (v) => AudioManager.setMasterVolume(v))
art:
  style_name: Стилизованный Дизельпанк в Ледяной Пустоши (Stylized Frozen Dieselpunk)
  camera_perspective: Вид от первого лица (высота глаз 1.7 м, динамический шаг, наклон
    при спринте)
  camera_fov: 75
  camera_pitch_angle: 0
  environment_theme: 'Обледенелый железобетонный форпост «Бастион-13»: тяжелые бронеплиты,
    заклепки, замерзшая колючая проволока, клубящаяся снежная метель и лучи прожекторов'
  character_proportions: Тяжелые клепаные терморукавицы инженера с медными трубками
    охладителя, массивный индустриальный мультитул со стрелочными манометрами
  lighting_setup: 'Контрастное атмосферное освещение: холодный лунный свет и белые
    прожекторы периметра против теплого оранжево-красного свечения раскаленных стволов
    и дульного пламени'
  color_palette:
    frost_blue: '#7692FF'
    glowing_amber: '#FF9F1C'
