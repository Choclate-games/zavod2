raw_prompt: Создай игру товер дефенс от зомби но от первого лица
title: 'Бастион 13: Сапёр Периметра'
slug: sozday_igru_tover_defens_ot_zombi_no_ot_pervogo_
genre: 3D Экшен-Стратегия / Tower Defense от первого лица
subgenre: Дизельпанк Тактический FPS-Инженер / Оборона Периметра / Thermal Management
  TD
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web)
orientation: landscape
target_audience: Мужчины и женщины 16–45 лет, фанаты Tower Defense, дизельпанка и
  динамичных зомби-экшенов, ценящие тактическую глубину, управление ресурсами в реальном
  времени и напряженную атмосферу выживания.
core_loop: Оценка секторов атаки -> Монтаж турелей по слотам -> Отражение волны зомби
  -> Спринт для крио-охлаждения стволов и замены батарей -> Полевой ремонт прорывов
  -> Сбор трофейного скрапа -> Апгрейд модулей до T2/T3.
hook: В разгар боя пулеметная турель раскаляется докрасна и вот-вот взорвется прямо
  перед мордами десятков зомби; инженер на спринте влетает в амбразуру, заливает ствол
  шипящим крио-спреем под оглушительный выброс пара и в последний миг спасает сектор
  от прорыва.
player_fantasy: Ты — боевой сапёр-инженер гарнизона Бастиона-13, последней цитадели
  среди ледяной пустоши. Только твоя хладнокровная логистика, точный расчет энергосетей
  и своевременное обслуживание раскаленных орудий стоят между ордой мутантов и полным
  крахом обороны.
session_model: Смена обороны (3 сжатые волны по 60–90 секунд с паузами на монтаж укреплений,
  суммарно 3.5–4.5 минуты на сессию)
unique_value_proposition: Первый в веб-играх честный Tower Defense от первого лица
  с фокусом на физическое обслуживание орудий (термо-менеджмент, подача энергоячеек,
  полевой ремонт), где игрок побеждает не прицельным отстрелом из винтовки, а грамотным
  распределением инженерных усилий между огневыми точками на передовой.
vision: Создать атмосферный, тактически глубокий и высокодинамичный WebGL 3D экшен-TD,
  объединяющий эстетику сурового дизельпанка, масштабные волны зомби и инновационный
  геймплей боевого инженера от первого лица, безупречно работающий на смартфонах и
  ПК.
elevator_pitch: 'Бастион 13: Сапёр Периметра — это 3D Tower Defense от первого лица
  в атмосфере сурового дизельпанка. Вы не просто стреляете, а командуете огневой мощью
  бастиона: возводите пулеметные, огнеметные и крио-турели по слотам периметра, разносите
  энергоблоки, охлаждаете раскаленные докрасна стволы крио-спреем прямо под носом
  у накатывающей орды зомби и удерживаете рубеж до рассвета.'
win_conditions: Успешно отразить все 3 волны смены (суммарно 150+ зомби), сохранив
  целостность главного реактора Бастиона выше 0%.
lose_conditions: Зомби прорывают рубежи и полностью разрушают реакторный блок Бастиона
  (HP реактора падает до 0), либо инженер погибает под натиском орды.
progression_summary: 'Внутри смены: сбор трофейного металлолома с зомби для апгрейда
  турелей на слотах (T1 -> T2 -> T3). Между сменами в бункере: инвестирование чертежей
  в постоянные патенты инженера (новые классы турелей, емкость крио-ранца, скорость
  спринта и прочность реактора).'
difficulty_curve: 'Волна 1 (Ознакомление, 60 с): Медленные одиночные зомби по центру,
  1-2 пулемета легко справляются, игрок учится сбивать нагрев крио-спреем. Волна 2
  (Напряжение, 75 с): Наплыв бегунов и бронированных зомби с двух флангов, орудия
  греются быстрее, требуется перенос энергоблока. Волна 3 (Кульминация, 90 с): Плотная
  орда во главе с тяжелым мутантом-громилой, критический перегрев всех секторов, непрерывный
  спринт и полевой ремонт под огнем.'
