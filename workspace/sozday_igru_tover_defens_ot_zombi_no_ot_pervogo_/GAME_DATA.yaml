  a 3D Экшен-Стратегия / Tower Defense от первого лица game. Visual style: Стилизованный
  Дизельпанк в Ледяной Пустоши (Stylized Frozen Dieselpunk). Camera perspective: Вид
  от первого лица (высота глаз 1.7 м, динамический шаг, наклон при спринте). Environment:
  Обледенелый железобетонный форпост «Бастион-13»: тяжелые бронеплиты, заклепки, замерзшая
  колючая проволока, клубящаяся снежная метель и лучи прожекторов. Central Action:
  В разгар боя пулеметная турель раскаляется докрасна и вот-вот взорвется прямо перед
  мордами десятков зомби; инженер на спринте влетает в амбразуру, заливает ствол шипящим
  крио-спреем под оглушительный выброс пара и в последний миг спасает сектор от прорыва.
