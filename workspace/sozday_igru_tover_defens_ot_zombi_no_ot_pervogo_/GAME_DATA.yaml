definition_of_done:
- Игрок плавно перемещается от первого лица по периметру с полноценным управлением
  на ПК (WASD + мышь) и смартфонах (двойной тач-стик).
- На слотах периметра возводятся, функционируют и стреляют модульные турели 3 типов
  (пулемет, огнемет, крио).
- 'Реализована честная физическая система нагрева орудий: стрельба нагревает ствол
  до клина, крио-спрей игрока мгновенно сбивает температуру с выбросом пара.'
- Энергоячейки переносятся в руках с физическим замедлением персонажа и активируют
  режим Overcharge в слотах турелей.
- Three.js рендерит 80-120 зомби в кадре через InstancedMesh со стабильными 60 FPS
  на десктопе и 45-60 FPS на мобильных устройствах.
- Реализована 3-волновая структура 'Смена обороны' с условиями победы (выживание реактора)
  и поражения (прорыв к реактору/гибель инженера).
- 'Playgama Bridge SDK интегрирован: показ Rewarded Video для экстренного охлаждения,
  Interstitial между сменами, облачные сохранения прогресса.'
- 'Полный отказ от серых кубов: стилизованный ледяной дизельпанк с партиклами метели,
  искр, пара и раскаленного металла.'
- 'Игра осталась тем, что просили: вид от первого лица — игрок смотрит своими глазами,
  а не с вертолёта, вышки или орбиты.'
- 'Игра осталась тем, что просили: игрок сам ходит по уровню на своих двоих.'
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Оценка секторов атаки -> Монтаж турелей по слотам ->
  Отражение волны зомби -> Спринт для крио-охлаждения стволов и замены батарей ->
  Полевой ремонт прорывов -> Сбор трофейного скрапа -> Апгрейд модулей до T2/T3..'
- 'Реализованы механики проекта: Монтаж и Модульный Апгрейд Турелей по Слотам, Крио-Охлаждение
  Стволов и Термо-Менеджмент, Энергетическая логистика и Overcharge-ячейки, Цепная
  Термо-Детонация Крио- и Дизель-Бочек.'
- Условие успеха (Успешно отразить все 3 волны смены (суммарно 150+ зомби), сохранив
  целостность главного реактора Бастиона выше 0%.) и условие проигрыша (Зомби прорывают
  рубежи и полностью разрушают реакторный блок Бастиона (HP реактора падает до 0),
  либо инженер погибает под натиском орды.) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Бастион 13: Сапёр Периметра».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Аварийная перезагрузка реактора
  (Второй шанс), Удвоение чертежей смены, Срочная доставка припасов); interstitial
  соблюдает паузу 90 с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
direction:
  options:
  - id: D1
    name: 'Бастион 13: Сапёр Периметра'
    pitch: 'Инженерный экшен-Tower Defense от первого лица: возводи, запитывай и охлаждай
      турели на заснеженном аванпосту прямо перед наступающей ордой зомби.'
    core_verb: Монтировать и подпитывать
    genre_family: FPS Tower Defense / Инженерный экшен-дефенс
    session_shape: Смена обороны (3 сжатые волны по 60–90 секунд с паузами на монтаж
      укреплений, суммарно 3.5–4.5 минуты на сессию)
    camera: Вид от первого лица на высоте 1.7 м; в кадре виден строительно-сервисный
      мультитул с индикатором нагрева и кабельная катушка; легкий крен при спринте
