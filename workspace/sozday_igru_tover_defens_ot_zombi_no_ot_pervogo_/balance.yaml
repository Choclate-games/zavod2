_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: sozday_igru_tover_defens_ot_zombi_no_ot_pervogo_
performance:
  target_fps: 60
  max_draw_calls: 65
  max_triangles: 45000
  bundle_size_budget_mb: 3.5
session:
  model: Смена обороны (3 сжатые волны по 60–90 секунд с паузами на монтаж укреплений,
    суммарно 3.5–4.5 минуты на сессию)
  win: Успешно отразить все 3 волны смены (суммарно 150+ зомби), сохранив целостность
    главного реактора Бастиона выше 0%.
  lose: Зомби прорывают рубежи и полностью разрушают реакторный блок Бастиона (HP
    реактора падает до 0), либо инженер погибает под натиском орды.
  difficulty_curve: 'Волна 1 (Ознакомление, 60 с): Медленные одиночные зомби по центру,
    1-2 пулемета легко справляются, игрок учится сбивать нагрев крио-спреем. Волна
    2 (Напряжение, 75 с): Наплыв бегунов и бронированных зомби с двух флангов, орудия
    греются быстрее, требуется перенос энергоблока. Волна 3 (Кульминация, 90 с): Плотная
    орда во главе с тяжелым мутантом-громилой, критический перегрев всех секторов,
    непрерывный спринт и полевой ремонт под огнем.'
mechanics:
  montazh_i_modulnyy_apgreyd_tureley_po_slotam:
    name: Монтаж и Модульный Апгрейд Турелей по Слотам
    parameters:
      vremya_bazovogo_montazha_t1:
        value: 1.5 с
        note: Если уменьшить ниже 0.8 с, исчезает ощущение тяжелой дизельпанк-техники;
          если поднять выше 2.5 с, игрок не успевает реагировать на смену флангов.
      stoimost_t1_tureli_v_skrape:
        value: 75 ед.
        note: Рассчитана ровно на 5 убитых мутантов первой волны; увеличение до 100
          ед. ломает старт волны, делая оборону невозможной.
      sektor_avtozahvata_tseley:
        value: 120 градусов
        note: Ограниченный сектор заставляет продумывать угол монтажа; 360° превратило
          бы игру в тривиальный автошутер без слепых зон.
      dalnost_effektivnogo_ognya_t1:
        value: 28.0 м
        note: Соответствует длине коридора рубежа; увеличение до 40 м обесценит сближение
          орды.
  krio_ohlazhdenie_stvolov_i_termo_menedzhment:
    name: Крио-Охлаждение Стволов и Термо-Менеджмент
    parameters:
      skorost_nagreva_stvola_t1_pri_nepreryvnoy_strelbe:
        value: 4.2°C/с
        note: При 2.0°C/с механика становится незаметной; при 8.0°C/с игрок превратится
          в пожарного без возможности взглянуть на поле боя.
      skorost_sbrosa_tepla_krio_spreem:
        value: 75.0°C/с
        note: Позволяет за 1.2 с полностью снять критический нагрев; увеличение дольше
          2.0 с делает спрей смертельной ловушкой для инженера.
      shtraf_klina_pri_100_c_jammed_duration:
        value: 8.0 с
        note: Жесткое наказание за невнимательность, заставляющее зомби подойти вплотную
          к брустверу.
      distantsiya_primeneniya_sopla_ohlazhdeniya:
        value: 2.2 м
        note: Требует входа в зону ближнего боя рядом с амбразурой; увеличение до
          6 м убило бы весь физический риск.
      zapas_krio_hladagenta_v_rantse:
        value: 100.0 ед.
        note: Хватает ровно на 4 полных цикла охлаждения до необходимости дозаправки
          на стационарном баке.
  energeticheskaya_logistika_i_overcharge_yacheyki:
    name: Энергетическая Логистика и Overcharge-Ячейки
    parameters:
      dlitelnost_rezhima_overcharge:
        value: 25.0 с
        note: Достаточно, чтобы выкосить плотную группу или элитного врага; свыше
          40 с убило бы ценность логистического цикла.
      bonus_k_skorostrelnosti_i_uronu_v_overcharge:
        value: +80% DPS
        note: Превращает турель в аннигилятор; значение ниже +40% не оправдывает риск
          медленной переноски батареи через поле боя.
      shtraf_k_skorosti_inzhenera_pri_perenoske_yacheyki:
        value: -30%
        note: Создает напряжение «тяжелого груза»; при -60% игрок становится легкой
          мишенью для кислотных плевков.
      vremya_perezaryadki_generatora_na_baze:
        value: 20.0 с
        note: Ограничивает количество супероружия до 2-3 применений за всю волну смены.
      kolichestvo_dostupnyh_yacheek_na_rubezhe:
        value: 2 шт.
        note: Заставляет делать выбор между одновременной поддержкой двух флангов
          или непрерывной ротацией на одном секторе.
  tsepnaya_termo_detonatsiya_krio_i_dizel_bochek:
    name: Цепная Термо-Детонация Крио- и Дизель-Бочек
    parameters:
      radius_porazheniya_krio_bochki:
        value: 6.0 м
        note: Идеально перекрывает ширину стандартного коридора рубежа; увеличение
          до 10 м сделает зачистку слишком легкой.
      dlitelnost_zamorozki_mutantov_freeze_stun:
        value: 4.0 с
        note: Дает инженеру окно для передышки или заливки спреем орудий; ниже 2.0
          с игрок не успевает среагировать.
      uron_ot_termicheskogo_shoka_kombo_krio_dizel:
        value: 1200 ед.
        note: Мгновенно уничтожает любого бронированного зомби и сносит 40% HP боссу-Громиле.
      dalnost_broska_signalnogo_faera:
        value: 18.0 м
        note: Позволяет подрывать бочки на безопасном удалении без входа в зону поражения.
      kolichestvo_bochek_na_volnu:
        value: 4 шт.
        note: Строго лимитированный стратегический ресурс арены, требующий вдумчивого
          использования.
  polevoy_remont_brustvera_i_pnevmo_klepalnik:
    name: Полевой Ремонт Бруствера и Пневмо-Клепальник
    parameters:
      prochnost_sektsii_brustvera:
        value: 500 HP
        note: Выдерживает около 12 секунд атак обычной толпы; ниже 300 HP баррикада
          падает слишком быстро, не давая шанса на ремонт.
      skorost_remonta_klepalnikom:
        value: 120 HP/с
        note: Полное восстановление бреши занимает около 4.2 секунды непрерывной работы.
      rashod_skrapa_na_remont:
        value: 10 ед. за каждые 100 HP
        note: Создает прямую конкуренцию между вложениями в новые турели и поддержанием
          целостности забора.
      radius_i_sila_ottalkivaniya_pnevmo_udara:
        value: 3.5 м (импульс 450 Н)
        note: Позволяет разорвать дистанцию и выиграть 2 секунды безопасного ремонта.
      kuldaun_silovogo_pnevmo_udara:
        value: 6.0 с
        note: Предотвращает спам отталкиванием вместо стрельбы и тактики.
