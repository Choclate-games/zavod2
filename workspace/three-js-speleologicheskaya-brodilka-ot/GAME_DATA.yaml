mechanics:
- name: Основная механика и управление
  category: core
  priority: core
  description: Интуитивное управление с мгновенным откликом, честными коллизиями и
    растущей глубиной мастерства.
  player_interaction: Виртуальный джойстик и кнопки действий на экране, на ПК — клавиатура
