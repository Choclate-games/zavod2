raw_prompt: 'Three.js 3D спелеологическая бродилка от первого лица с механикой LiDAR-сканирования.
  Игрок кликает мышью, чтобы издать звуковой импульс: волна распространяется сферически,
  сталкивается с невидимой геометрией пещеры и спавнит PointCloud частицы на поверхностях
  стен и сталактитов. Частицы живут 5-10 секунд, затухая по альфе. Цель — найти выход
  из лабиринта и редкие кристаллы, не упав в ямы.'
