  feedback: 'Визуал: Частицы при попадании, лёгкая тряска камеры и звуковой акцент
    на важном событии.; Звук: отдельный слой для успеха и для промаха; Камера: короткий
    импульс, не мешающий читать сцену; UI: индикатор готовности рядом с точкой внимания,
