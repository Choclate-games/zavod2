gameplay_systems:
- name: Система Перемещения и Физического Контроля
  purpose: Обеспечить четкое и отзывчивое управление с учетом инерции и столкновений.
  input: Плавающий виртуальный джойстик (мобильные) или WASD/Стрелки (ПК).
  rules:
  - Скорость масштабируется параметрами маневренности и массы.
  - Коллизии с препятствиями рассчитываются через физический движок с упругим отскоком.
  - При потере управления включается автоматическая стабилизация.
  state:
  - IDLE
  - MOVING
  - DRIFTING
  - IMPACT
  - RECOVERING
  interactions: Взаимодействует с физическими телами врагов, препятствиями и дропами
    наград.
  feedback: Следы на поверхности, частицы пыли, звуки мотора/шагов, динамический наклон
    камеры.
  edge_cases:
  - При застревании в геометрии объект мягко телепортируется в ближайшую свободную
    точку.
- name: Боевая Система и Расчет Урона
  purpose: Обработка ударов, тарана, хитбоксов, расчета брони и эффектов отдачи.
  input: Кнопки атаки, нитро, спец-способностей.
  rules:
  - Итоговый Урон = (БазовыйУрон * ФакторСкорости + БонусСилы) * (1 - СнижениеБроней).
  - Критические удары наносят 2.0x урона при атаке в уязвимые зоны.
  - Тяжелые попадания вызывают 40мс хит-стоп замедление времени.
  state:
  - READY
  - ATTACKING
  - HITSTOP
  - COOLDOWN
  interactions: Триггеры коллизий проверяют пересечения с хитбоксами противников.
  feedback: Заморозка кадра (40мс), фонтан искр/частиц, всплывающие цифры урона.
  edge_cases:
  - Одновременные встречные удары вызывают взаимное физическое отталкивание.
core_design:
  signature_moment: 'Игрок замирает на краю невидимой бездны в абсолютной тьме пещеры.
    Слыша приближающийся стрекот слепого хтонического хищника, он посылает узкий конический
    импульс сонара: темнота вспыхивает десятками тысяч изумрудных точек, очерчивая
    узкий сталактитовый карниз слева и распахнутую пасть твари в двух метрах впереди.
    Игрок совершает рискованный прыжок вслепую по затухающим в памяти координатам
    карниза, а эхо от брошенного в пропасть звукового маячка уводит чудовище в бездну.'
  genre_template_rejected: 'Отказ от классического фонарика/динамического света и
    автоматического отстрела волн врагов (шаблон Vampire Survivors / Crimsonland).
    В игре нет постоянных источников света и огнестрельного оружия: всё пространство
    существует как абсолютная черная пустота, пока акустическая волна не ударит в
    3D-геометрию. Окружающая среда — главный враг и пространственная головоломка,
    а эхолокация — единственный способ видеть, который одновременно привлекает смертоносных
    слепых хищников пещеры.'
  what_makes_it_different: 'Визуализация мира через дискретный PointCloud вокселей/частиц
    на Three.js: игрок перемещается по ментальной карте затухающего эхо. Каждое физическое
    действие (шаг, прыжок, импульс сонара) излучает звук разной частоты и радиуса,
    порождая точки рельефа, но выдавая позицию спелеолога. Рогалик-прокачка модифицирует
    физику и спектр звуковой волны (ультразвуковой срез, термальный эхо-импульс, ложные
    акустические приманки), превращая сканер в инструмент выживания и управления поведением
    пещеры.'
  micro_loop:
  - step: Акустический импульс LiDAR
    player_action: Клик ЛКМ / тап в направлении движения для пуска акустической волны
      сонара
    game_response: Сферическая волна со скоростью 28 м/с разлетается от игрока, рождая
      до 15 000 светящихся частиц PointCloud на стенах, сталактитах и обрывах
    decision: 'Выбрать направление и мощность импульса: раскрыть широкий сектор рельефа
      ценой высокого шума и батареи или послать узкий луч для проверки ближайшей опоры'
    duration: 0.2-0.5 с
  - step: Чтение рельефа и оценка опасности
    player_action: Движение камеры (мышь/свайп), запоминание траектории и расщелин
    game_response: Точки PointCloud мерцают и начинают экспоненциально затухать (время
      жизни 6.0 с), обнажая провалы, острые сталагмиты и жилы кристаллов
    decision: По какому маршруту двигаться — по безопасному длинному обходу или по
      узкому карнизу над пропастью с ценным кристаллом
    duration: 1.0-2.5 с
  - step: Инерционный маневр во тьме
    player_action: Спелеологический рывок вперед (W + Shift) и прыжок (Space) через
      расщелину по затухающим точкам
    game_response: Персонаж перемещается с учетом инерции, шаги выбивают слабое эхо
      (радиус 2.0 м), регистрируются коллизии с геометрией
    decision: Прыгать сейчас по памяти или потратить еще один импульс сонара для перепроверки
      зоны приземления
    duration: 1.5-3.0 с
  meso_loop:
  - step: Разведка пещерного биома
    player_action: Исследование разветвленного лабиринта с помощью импульсов сонара
      и расстановки акустических маячков
    game_response: Обнаружение резонирующих жил с кристаллами, сейсмических ловушек
      и спящих на сводах эхо-хищников
    decision: Рискнуть углубиться в логово чудовища ради редкого фиолетового кристалла
      или идти по маркеру стабильного давления к выходу
    duration: 45-90 с
  - step: Резонансная добыча и уклонение от хищников
    player_action: Настройка частоты сонара на резонанс кристалла, сбор выпавших осколков,
      бросок звуковой приманки в сторону
    game_response: Кристалл взрывается снопом фотонов, порождая громкий треск; привлеченный
      слепой охотник бросается на источник шума
    decision: Бежать во тьме по памяти или замереть в приседе, прекратив любые импульсы
    duration: 30-60 с
  - step: Активация сейсмостанции биома (Выбор модификации сканера)
    player_action: Взаимодействие с геотермальным терминалом на границе яруса пещеры
    game_response: Открывается выбор из 3 протоколов настройки LiDAR (напр. 'Доплеровский
      сдвиг', 'Ультразвуковой резонанс', 'Фосфорный след')
    decision: 'Выбрать модификацию под текущий билд: выживание, дальность картографирования
      или контроль чудовищ'
    duration: 10-20 с
  macro_loop:
  - step: Подготовка и калибровка оборудования в лагере
    player_action: Распределение кристаллов в хабе на пассивные ветки спелеокостюма
      и покупка стартовых расходников
    game_response: Увеличение емкости батареи сонара, снижение шума шагов, открытие
      новых типов акустических сенсоров
    decision: Инвестировать в энергоэффективность для долгих импульсов или в прочность
      каркаса против падений
    duration: 30-60 с
  - step: Спелеологическая экспедиция (Забег по 3-5 пещерным ярусам)
    player_action: Последовательное прохождение ярусов (Карстовые провалы -> Кристаллические
      гроты -> Абиссальная бездна)
    game_response: Нарастание плотности аномалий, появление подвижных лавовых рек
      и агрессивных эхо-сталкеров
    decision: Завершить забег на аварийном лифте с текущей добычей или рискнуть спуском
      в глубокий ярус за древней реликвией
    duration: 5-8 минут
  - step: Эвакуация или фатальный срыв
    player_action: Выход через барокамеру с трофеями или гибель от падения в бездну/атаки
      монстра
    game_response: Конвертация собранных кристаллов в постоянный спелеологический
      опыт, расчет статистики забега
    decision: Анализ ошибок маршрута и выбор новой сборки на следующий забег
    duration: 15-30 с
  loop_diagram: "+-----------------------------------------------------------------------+\n\
    |                       МАКРО-ПЕТЛЯ (МЕТАХАБ)                           |\n| \
    \ [Лагерь спелеологов: Прокачка сонара, брони и сканеров за Кристаллы]  |\n+-----------------------------------+-----------------------------------+\n\
    \                                    | Старт экспедиции (5-8 мин)\n          \
    \                          v\n+-----------------------------------------------------------------------+\n\
    |                    МЕЗО-ПЕТЛЯ (ЯРУС ПЕЩЕРЫ: 1.5-2 мин)                 |\n|\
    \  +-----------------------------------------------------------------+  |\n| \
    \ |                МИКРО-ПЕТЛЯ (ТАКТИЧЕСКИЙ ШАГ: 2-4 сек)           |  |\n|  |\
    \  [Темнота/Слух]                                                |  |\n|  |  \
    \     |                                                        |  |\n|  |    \
    \   v                                                        |  |\n|  |  (Импульс\
    \ сонара ЛКМ) ---> [Генерация PointCloud рельефа]       |  |\n|  |       |   \
    \                            |                        |  |\n|  |       | Шум привлекает\
    \ хищников       v                        |  |\n|  |       |                 \
    \       (Чтение карты и ям)             |  |\n|  |       v                   \
    \            |                        |  |\n|  |  [Угроза атаки монстра]     \
    \          v                        |  |\n|  |       |                       \
    \ (Прыжок/Шаг во тьме по памяти)  |  |\n|  |       +-------------> [Коллизия /\
    \ Сбор кристаллов] <-----------+  |\n|  +-----------------------------------------------------------------+\
    \  |\n|                                   | Зачистка сектора                 \
    \ |\n|                                   v                                   |\n\
    |  [Сейсмическая станция] ---> (Выбор 1 из 3 модулей LiDAR)             |\n| \
    \                                  | Переход на нижний ярус            |\n+-----------------------------------+-----------------------------------+\n\
    \                                    | Победа / Смерть в пропасти\n          \
    \                          v\n                     [Итог экспедиции -> Мета-прогресс]"
  tension_curve: Волнообразная пилообразная кривая с нарастающей базовой тревогой.
    В начале сектора напряжение низкое (тишина, осмотр стен первыми импульсами). Напряжение
    подскакивает до пика (85-90%), когда точки гаснут посреди сложного прыжка через
    бездну или при эхо-ответе от приближающегося в темноте сталкера. Спад напряжения
    (30%) происходит при нахождении геотермального терминала или активации сейсмостанции.
    Финальный спуск яруса создает предельное напряжение (100%) из-за необходимости
    эвакуироваться в условиях дефицита энергии сонара.
  core_formulas:
  - wave_radius(t) = wave_speed * t, где wave_speed = 28.0 м/с, t — время с момента
    пуска импульса в секундах
  - particle_alpha(t_age) = clamp(1.0 - (t_age / particle_lifetime)^1.8, 0.0, 1.0),
    где particle_lifetime = 6.0 с
  - point_count = round(base_density * (1.0 - hit_distance / max_scan_range) * surface_reflectivity),
    где base_density = 450 точек/м², max_scan_range = 35.0 м, surface_reflectivity
    ∈ [0.4, 1.2]
  - noise_level = (velocity.length() / max_speed) * step_noise_weight + ping_charge
    * ping_noise_weight, где step_noise_weight = 12.0 дБ, ping_noise_weight = 48.0
    дБ
  - stalker_alert = (noise_level / (distance^1.5 + 1.0)) >= stalker_sensitivity_threshold,
    где stalker_sensitivity_threshold = 0.75
  - fall_damage = max(0.0, (impact_vertical_velocity - safe_velocity_threshold) *
    fall_damage_multiplier), где safe_velocity_threshold = 7.5 м/с, fall_damage_multiplier
    = 18.0 ед/ (м/с)
  - crystals_yield = base_crystal_value * (1.0 + resonance_frequency_match * 0.5)
    * (1.0 + 0.25 * floor_index), где resonance_frequency_match ∈ [0.0, 1.0]
  run_progression:
  - 'Установка Доплеровского фильтра: движущиеся объекты и хищники подсвечиваются
    ярко-красным спектром точек с увеличенным на 40% временем жизни.'
  - 'Фосфорная катализация: точки на неподвижных монолитах стен тлеют на 3.5 секунды
    дольше (время жизни возрастает с 6.0 с до 9.5 с).'
  - 'Акустический резонатор: пуск сонара на частоте кристаллов мгновенно дробит жилы
    на расстоянии до 15 метров, притягивая осколки к игроку.'
  - 'Сверхпроводящий конденсатор: время восстановления заряда сонара снижается на
    35%, позволяя спамить узкими конусами разведки.'
  - 'Инфразвуковая ударная волна: при падении с высоты более 3 метров генерируется
    мощный круговой импульс, оглушающий ближайших хищников на 2.5 секунды.'
  meta_progression:
  - 'Кевларовые демпферы ботинок (Уровни 1-5): снижают шум шагов на 8-40% и повышают
    порог безопасной скорости приземления с 7.5 м/с до 11.0 м/с.'
  - 'Нейроинтерфейс картирования (Уровни 1-5): увеличивает максимальный лимит одновременно
    отрисовываемых PointCloud частиц в Three.js с 30 000 до 120 000 без потери FPS.'
  - 'Высоковольтный аккумулятор сканера (Уровни 1-4): увеличивает пул энергии сонара
    со 100 до 220 единиц, позволяя совершать серию импульсов без ожидания регенерации.'
  - 'Геоакустический спектрометр (Уровни 1-3): добавляет цветовое кодирование точек
    в зависимости от материала (бирюзовый — надежный гранит, красный — осыпающаяся
    порода, фиолетовый — ценный кристалл).'
  mechanics:
  - name: Основная механика и управление (core/core)
    role_in_loop: двигатель
    player_decision: 'Определить темп и вектор перемещения во тьму: двигаться медленно
      и бесшумно вприсядку или совершить скоростной прыжок через расщелину по тающим
      в памяти координатам.'
    input_mapping: WASD / Левый экранный стик — перемещение с физической инерцией;
      Space / Кнопка прыжка — отталкивание от поверхности; Shift / Двойной тап вперед
      — спелео-рывок (спринт); Ctrl / Кнопка приседа — бесшумная ходьба на корточках;
      Мышь / Правая половина экрана — свободный обзор камеры 360°.
    states:
    - 'STATE_IDLE: спелеолог неподвижен, нулевой шум шагов, микро-эхо дыхания (радиус
      0.5 м каждые 3.0 с)'
    - 'STATE_WALKING: скорость 3.8 м/с, шум 12 дБ, спавн слабого следа точек под ногами'
    - 'STATE_SPRINTING: скорость 6.5 м/с, расход стамины 20 ед/с, шум 32 дБ'
    - 'STATE_AIRBORNE: полет по баллистической траектории, пониженный контроль в воздухе
      (0.25x), подготовка к приземлению'
    - 'STATE_LANDING: гашение вертикального импульса, проверка порога урона от падения,
      акустический всплеск'
    parameters:
    - name: walk_speed
      value: 3.8 м/с
      tuning_note: Если увеличить >5.0 м/с, игрок перестанет бояться пропастей и потеряет
        осторожность; если снизить <2.8 м/с, перемещение станет мучительно вязким.
    - name: sprint_speed
      value: 6.5 м/с
      tuning_note: При >8.0 м/с игрок будет перелетать ямы без сканирования; при <5.0
        м/с рывок перестанет спасать от преследующего хищника.
    - name: jump_force
      value: 5.2 м/с
      tuning_note: При >6.5 м/с ломается дизайн расщелин (перепрыгиваются любые пропасти);
        при <4.2 м/с невозможно преодолеть базовые каньоны шириной 2.5 м.
    - name: fall_damage_threshold
      value: 7.5 м/с
      tuning_note: Если поднять >10 м/с, исчезнет страх высоты; если опустить <5 м/с,
        игрок начнет получать урон от обычных спрыгиваний с карнизов.
    - name: crouch_noise_mult
      value: 0.15x
      tuning_note: При >0.4x стелс вокруг спящих монстров станет невозможен; при 0.0x
        полностью обесценится акустический менеджмент.
    feedback_layers:
    - 'Визуальный: Легкий покачивающийся bobbing камеры при шагах; динамический FOV
      (расширение с 75° до 82° при спринте); частицы пыли, выбиваемые из-под подошв.'
    - 'Звуковой: Пространственный 3D-звук шагов по разным поверхностям (мокрый камень,
      гравий, кристаллический настил) с пещерной реверберацией; тяжелое дыхание при
      расходе стамины.'
    - 'Камера: Вертикальная компрессия и легкий наклон при жестком приземлении; микро-встряска
      при отталкивании в прыжке.'
    - 'Тактильность: Короткий виброотклик (25 мс) на мобильных устройствах при касании
      земли и длительный виброимпульс (120 мс) при получении урона от падения.'
    - 'UI: Минималистичный дуговой индикатор стамины и здоровья в нижней части экрана
      с низкой контрастностью, не засвечивающий темноту.'
    failure_mode: 'Игрок не рассчитывает инерцию разгона и срывается в темную расщелину
      либо приземляется с критической высоты. Сигнал: свист рассекаемого воздуха,
      глухой хруст и красный спайк на индикаторе здоровья.'
    mastery_curve: 'Новичок на 30-й секунде: медленно крадется на корточках, боится
      отпустить клавишу приседа, часто падает в ямы из-за паники в темноте. Эксперт
      на 10-м забеге: перемещается серией выверенных прыжков по карнизам, точно знает
      длину прыжка в слепой зоне и использует скольжение для бесшумного сближения
      с кристаллами.'
    counterplay: Осыпающиеся уступы (разрушаются через 0.8 с после наступания), скользкие
      наледи в глубине пещер, сужающиеся лазы, требующие снижения скорости, и узкие
      мостики над бездной с боковым ветром.
    synergies:
    - Связана с механикой LiDAR-эхолокации (шаги сами генерируют микро-точки под ногами,
      а прыжок требует предварительного сканирования зоны приземления).
    - Взаимодействует с механикой шума (бег и прыжки издают звук, привлекающий эхо-хищников).
    why_unique: Честная спелеологическая инерция от первого лица в Three.js в абсолютной
      темноте, где пол и препятствия известны лишь по недавним вспышкам затухающих
      точек PointCloud.
    pseudocode: "input_dir = get_movement_vector()\nis_grounded = raycast_down(player.pos,\
      \ player.height + 0.1)\nif is_grounded:\n    if input.jump_pressed and player.stamina\
      \ >= 15.0:\n        player.velocity.y = JUMP_FORCE\n        player.stamina -=\
      \ 15.0\n        emit_acoustic_noise(player.pos, noise_level=25.0)\n    else:\n\
      \        target_vel = input_dir * (SPRINT_SPEED if input.sprint else WALK_SPEED)\n\
      \        player.velocity = lerp(player.velocity, target_vel, ACCEL_RATE * dt)\n\
      \        if player.velocity.length() > 0.5:\n            spawn_footstep_particles(player.pos,\
      \ count=24, radius=1.5)\nelse:\n    player.velocity.y -= GRAVITY * dt\n    player.velocity.x_z\
      \ = lerp(player.velocity.x_z, target_vel, AIR_CONTROL * dt)\nplayer.pos += player.velocity\
      \ * dt"
  - name: LiDAR-эхолокация и PointCloud-картографирование (core/scan)
    role_in_loop: источник награды
    player_decision: 'Выбрать частоту, ширину конуса и момент выпуска импульса: осмотреть
      широкий сектор вокруг ценой 30% батареи и высокого шума или выстрелить узким
      лучом вглубь тоннеля.'
    input_mapping: ЛКМ / Правая экранная кнопка действия — пуск направленного импульса
      сканера; Удержание ЛКМ / Долгий тап — накопление мощности для сферического эхо-всплеска
      на 360°; Колесо мыши / Слайдер на тачскрине — регулировка угла раскрытия луча
      (от 15° до 180°).
    states:
    - 'SCANNER_READY: конденсатор заряжен (100%), сканер готов к отправке импульса'
    - 'SCANNER_CHARGING: удержание кнопки, накапливается мощность волны, нарастает
      высокочастотный гул'
    - 'WAVE_PROPAGATING: сферическая/коническая волна распространяется в пространстве
      со скоростью 28 м/с'
    - 'POINTCLOUD_ACTIVE: частицы сгенерированы на поверхностях геометрии, идет фаза
      свечения и альфа-затухания'
    - 'SCANNER_COOLDOWN: конденсатор восстанавливает энергию со скоростью 25 ед/с'
    parameters:
    - name: wave_speed
      value: 28.0 м/с
      tuning_note: Если ускорить >60 м/с, эффект сканирования станет мгновенным и
        пропадет визуальный кайф 'наплыва' мира; если замедлить <15 м/с, игрок будет
        врезаться в стены до прихода эхо.
    - name: particle_lifetime
      value: 6.0 с
      tuning_note: При >12.0 с игра превращается в обычную освещенную бродилку без
        саспенса; при <3.0 с игрок физически не успевает проанализировать путь и спланировать
        прыжок.
    - name: max_particles_limit
      value: 65000 шт
      tuning_note: При >150000 падает WebGL/Three.js производительность на мобильных
        устройствах; при <15000 мир кажется дырявым и абстрактным.
    - name: pulse_energy_cost
      value: 30 ед
      tuning_note: При <10 ед игрок непрерывно спамит кликом, уничтожая менеджмент
        темноты; при >60 ед игрок слишком долго стоит парализованным в темноте.
    - name: base_scan_range
      value: 35.0 м
      tuning_note: При >70 м теряется клаустрофобия пещер; при <18 м невозможно увидеть
        противоположный край пропасти.
    feedback_layers:
    - 'Визуальный: Расширяющийся полупрозрачный неоновый фронт волны; рождение тысяч
      светящихся точек в Three.js с шейдерным градиентом от ярко-изумрудного (свежие)
      до тускло-синего (угасающие); легкая хроматическая аберрация на периферии экрана.'
    - 'Звуковой: Сочный высокотехнологичный щелчок сонара (''пинг'') с последующим
      многослойным пространственным эхом, частота которого зависит от объема зала.'
    - 'Камера: Микро-толчок отдачи камеры (0.01 рад) назад при пуске мощного импульса.'
    - 'Тактильность: Короткий двойной тактильный клик (15 мс + 15 мс) на мобильном
      устройстве в момент отправки импульса.'
    - 'UI: Круговой секторный прицел с уровнем заряда аккумулятора и счетчиком активных
      точек в поле зрения.'
    failure_mode: 'Игрок расходует весь заряд батареи непрерывными импульсами в безопасной
      зоне и оказывается в полной темноте перед внезапным обрывом без возможности
      просканировать путь. Сигнал: сухой треск разряженного конденсатора и мигающий
      красный индикатор батареи.'
    mastery_curve: 'Новичок на 30-й секунде: пускает импульсы во все стороны, быстро
      сливает батарею и теряет ориентацию в хаосе точек. Эксперт на 10-м забеге: сканирует
      строго под углом 45° к полу узким лучом, экономя 70% энергии, считывает рельеф
      по единичным отражениям и держит в голове 3D-карту тоннеля после одного импульса.'
    counterplay: Поглощающие звук моховые наросты (не отражают точки), зеркальные
      базальтовые плиты (искажают угол отражения волны) и акустические помехи от подземных
      водопадов.
    synergies:
    - Дает данные для Системы Перемещения (проявляет платформы и пропасти).
    - Взаимодействует с механикой Хищников (звук импульса регистрируется слухом врагов).
    why_unique: Пространство визуализируется исключительно на Three.js GPU BufferGeometry
      PointCloud без использования полигональных мешей со стандартными материалами
      и текстурами.
    pseudocode: "if input.scan_trigger and scanner.energy >= PULSE_COST and not scanner.in_cooldown:\n\
      \    scanner.energy -= PULSE_COST\n    wave = spawn_spherical_wave(player.eye_pos,\
      \ speed=28.0, max_dist=35.0)\n    play_spatial_sonar_ping(player.eye_pos)\n\
      \    broadcast_noise_event(player.eye_pos, radius=wave.max_dist * 1.2)\n   \
      \ hits = raycast_sector_gpu(player.eye_pos, player.look_dir, wave.angle, wave.max_dist)\n\
      \    for hit in hits:\n        pointcloud.add_particle(pos=hit.point, normal=hit.normal,\
      \ lifetime=6.0, color=hit.mat_color)\n    scanner.cooldown_timer = 0.4"
  - name: Акустический резонанс кристаллов и угроза эхо-хищников (combat/risk)
    role_in_loop: источник риска
    player_decision: Издать ли резонансный перегруженный импульс для срезания ценного
      кристалла со свода пещеры, зная, что шум мгновенно сагрит ближайшего слепого
      сталкера.
    input_mapping: ПКМ / Вторая кнопка действия — пуск перегруженного резонансного
      импульса (Overcharge); E / Кнопка сбора — мгновенный сбор выпавших кристаллических
      осколков в радиусе 2.5 м; F / Кнопка гранаты — бросок отвлекающего звукового
      маячка-ловушки.
    states:
    - 'STALKER_DORMANT: хищник спит на потолке, реагирует только на шум >40 дБ'
    - 'STALKER_ALERT: хищник насторожился, медленно перемещается к точке последнего
      звука'
    - 'STALKER_HUNT: хищник развивает скорость 7.2 м/с, бежит на игрока, атакуя в
      ближнем бою (урон 35 ед)'
    - 'CRYSTAL_DORMANT: кристалл неактивен, излучает слабый ультрафиолетовый блеск'
    - 'CRYSTAL_RESONATING: кристалл вибрирует от звука, испускает фотонный взрыв и
      распадается на 3-6 ценных осколков'
    parameters:
    - name: stalker_aggro_speed
      value: 7.2 м/с
      tuning_note: При >9.0 м/с убежать невозможно без звуковой приманки; при <5.0
        м/с монстр перестает представлять угрозу для бегущего спелеолога.
    - name: stalker_damage
      value: 35.0 ед
      tuning_note: При >50 ед игрок погибает за 2 удара, что слишком жестко для веб-сессии;
        при <20 ед монстров начинают игнорировать.
    - name: resonance_hold_time
      value: 1.2 с
      tuning_note: При >2.5 с игрок становится легкой добычей; при <0.5 с резонанс
        превращается в обычный мгновенный клик.
    - name: decoy_lifetime
      value: 8.0 с
      tuning_note: При >15.0 с монстры полностью выключаются из геймплея; при <4.0
        с игрок не успевает проскользнуть мимо угрозы.
    - name: crystal_value
      value: 15 ед биолюминола
      tuning_note: Основная валюта забега, сбалансированная под покупку 2-3 мета-апгрейдов
        за успешную 6-минутную сессию.
    feedback_layers:
    - 'Визуальный: Кристаллы пульсируют ярким неоново-пурпурным светом при входе в
      резонанс; слепой сталкер отображается в PointCloud зловещими багровыми точками
      со шлейфом движения.'
    - 'Звуковой: Нарастающий хрустальный звон резонирующего минерала; низкий утробный
      скрежет и щелканье челюстей приближающегося монстра в 3D-панораме.'
    - 'Камера: Искажение взгляда (линзовый эффект и хроматическая аберрация) при близком
      присутствии хищника.'
    - 'Тактильность: Нарастающая непрерывная вибрация мобильного устройства по мере
      приближения сталкера к игроку.'
    - 'UI: Направленный индикатор акустической угрозы (звуковой радар) по краям экрана,
      показывающий вектор источника опасности.'
    failure_mode: 'Игрок жадничает, пытаясь срезать кристалл рядом со спящим сталкером,
      создает критический шум и оказывается загнанным в угол без звуковых приманок.
      Сигнал: истошный рев монстра, багровое мерцание экрана и резкая потеря HP.'
    mastery_curve: 'Новичок на 30-й секунде: в панике стреляет сонаром во все стороны,
      привлекает сразу трех сталкеров и погибает в расщелине. Эксперт на 10-м забеге:
      с ювелирной точностью бросает звуковой маяк в противоположную стену над пропастью,
      дожидается, пока сталкер прыгнет на шум и разобьется, после чего спокойно собирает
      резонансные кристаллы.'
    counterplay: Сталкеры перемещаются по трехмерной геометрии (стены, потолок), могут
      устраивать засады над узкими проходами и адаптируются к частоте сонара, сокращая
      дистанцию реакции.
    synergies:
    - Кристаллы служат ресурсом для выбора улучшений на сейсмостанциях и мета-прокачки
      в лагере.
    - Монстры реагируют на шум шагов из механики перемещения и импульсы из механики
      сканирования.
    why_unique: Боевая система построена не на стрельбе по врагам, а на акустическом
      позиционировании, управлении вниманием слепых хищников через звук и физических
      ловушках окружения.
    pseudocode: "for stalker in active_stalkers:\n    dist = distance(player.pos,\
      \ stalker.pos)\n    perceived_noise = current_acoustic_noise / (dist * dist\
      \ + 1.0)\n    if perceived_noise > stalker.hearing_threshold:\n        stalker.target_pos\
      \ = player.pos\n        stalker.state = STALKER_HUNT\n    if stalker.state ==\
      \ STALKER_HUNT:\n        stalker.move_towards(stalker.target_pos, speed=7.2,\
      \ dt=dt)\n        if dist < 1.8 and stalker.attack_ready:\n            player.hp\
      \ -= 35.0\n            stalker.attack_ready = false\n            trigger_screen_shake(intensity=0.8)"
  - name: Основная механика и управление
    role_in_loop: двигатель петли
    player_decision: Когда и с каким запасом применять «Основная механика и управление»,
      зная цену промаха
    input_mapping: Виртуальный джойстик и кнопки действий на экране, на ПК — клавиатура
      и мышь.
    states:
    - ГОТОВО
    - ИСПОЛНЕНИЕ
    - ВОССТАНОВЛЕНИЕ
    - ЗАБЛОКИРОВАНО
    parameters:
    - name: Окно исполнения
      value: 0.25 с
      tuning_note: Меньше — механика ощущается несправедливой; больше — исчезает мастерство
    - name: Восстановление
      value: 1.2 с
      tuning_note: Короче — спам действия; длиннее — игрок простаивает и скучает
    feedback_layers:
    - 'Визуал: Частицы при попадании, лёгкая тряска камеры и звуковой акцент на важном
      событии.'
    - 'Звук: отдельный слой для успеха и для промаха'
    - 'Камера: короткий импульс, не мешающий читать сцену'
    - 'UI: индикатор готовности рядом с точкой внимания, а не в углу экрана'
    failure_mode: Игрок применяет «Основная механика и управление» слишком рано; игра
      показывает причину промаха до конца анимации
    mastery_curve: На 30-й секунде игрок просто нажимает вовремя; к десятому забегу
      — готовит ситуацию заранее
    counterplay: Игра постепенно ограничивает удобные условия для механики, требуя
      подготовки
    synergies:
    - Работает в связке с основным ресурсом забега
    why_unique: Интуитивное управление с мгновенным откликом, честными коллизиями
      и растущей глубиной мастерства.
    pseudocode: "on_input(action):\n    if state != READY: return reject_feedback()\n\
      \    quality = evaluate_timing(now, window)\n    apply_effect(base_power * quality)\n\
      \    state = RECOVERY; start_timer(recovery)\n    emit_feedback(quality)"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite 5.x
  renderer: threejs
  renderer_version: ^0.170.0
  physics_engine: Rapier3D (@dimforge/rapier3d-compat 0.13.x)
  state_manager: Custom TinyEventBus & Reactive GameStore
  audio_engine: Howler.js (^2.2.4) с WebAudio API
  target_fps: 60
  max_draw_calls: 75
  max_triangles_or_sprites: 40000
  bundle_size_budget_mb: 4.2
  layers:
  - name: Application Layer
    responsibility: Инициализация Vite, ресайз канваса, полноэкранный режим, прелоадер.
  - name: Platform & Ads Layer
    responsibility: Адаптер Playgama Bridge, менеджеры Interstitial и Rewarded рекламы,
      Cloud Save.
  - name: Core Engine Layer
    responsibility: Фиксированный цикл GameLoop 60Гц, EventBus, маршрутизация ввода.
  - name: Physics Simulation Layer
    responsibility: Шаги симуляции Rapier3D, фильтрация коллизий, рэгдолл-синхронизация.
  - name: Gameplay Systems Layer
    responsibility: Боевая система, спавн врагов, выбор 3 карт улучшений, расчет комбо.
  - name: Entity Management Layer
    responsibility: Пул сущностей игрока, врагов, снарядов и осколков.
  - name: Rendering Layer
    responsibility: Three.js граф сцены, InstancedMesh батчинг, тени, эмиттеры частиц.
  - name: UI & HUD Layer
    responsibility: HTML5/CSS3 оверлей, виртуальный джойстик, полосы HP, модальные
      окна.
  modules:
