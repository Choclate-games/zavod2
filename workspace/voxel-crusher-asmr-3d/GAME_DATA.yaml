raw_prompt: 'Создай расслабляющую ASMR 3D игру на Three.js: два вращающихся зубчатых
  вала затягивают воксельные 3D модели. При соприкосновении воксели отрываются от
  модели и падают вниз как частицы с гравитацией в приемную корзину, принося монеты.
  Клики по экрану временно удваивают скорость вращения. Прокачка: ширина валов, острота
  зубьев, ценность вокселей, открытие новых коллекций предметов.'
title: Воксельный Измельчитель ASMR 3D
slug: voxel-crusher-asmr-3d
genre: Казуальный симулятор / Кликер
subgenre: ASMR Дробилка / Физический Idle-разрушитель
renderer: threejs
renderer_reason: User explicitly specified 'threejs'.
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web / Android / iOS)
orientation: portrait
target_audience: Игроки всех возрастов, любители расслабляющих ASMR-видео с гидравлическим
  прессом/дробилками, поклонники idle/clicker игр и медитативного геймплея уничтожения
  вокселей.
core_loop: Подача воксельного объекта в зубчатые валы -> Разрушение модели на воксели
  с приятным ASMR-звуком -> Сбор частиц в корзину и начисление монет -> Клики для
  турбо-ускорения -> Покупка улучшений валов и ценности вокселей -> Открытие новых
  коллекций предметов.
hook: Гипнотический визуальный и звуковой ASMR-эффект от послойного физического распада
  ярких объемных моделей при затягивании в тяжелые зубчатые валы.
player_fantasy: Владелец непреодолимого промышленного супер-измельчителя, способного
  перемолоть любой сложный 3D объект в красочный водопад монет и расслабляющих звуков.
session_model: Короткие медитативные сессии от 2 до 8 минут с частым получением наград
  и пассивным накоплением прогресса между игровыми циклами.
unique_value_proposition: Плавная физическая симуляция повоксельного разрушения в
  60 FPS прямо в веб-браузере, сопровождаемая процедурным тактильным ASMR-звуком и
  сочной визуальной отдачей без лагов на смартфонах.
vision: Создать главный веб-хит в жанре ASMR-разрушения, совмещающий премиальный визуальный
  лоск, сочнейший саунд-дизайн и аддиктивную прогрессию с десятками детализированных
  воксельных коллекций.
elevator_pitch: Наблюдайте, как мощные стальные валы по вокселю перемалывают игрушки,
  электронику, замки и монстров! Кликайте для бешеного ускорения, собирайте золотые
  крошки и прокачивайте свою дробилку до максимума.
win_conditions: Успешное 100% измельчение текущего объекта, разблокировка всех уровней
  улучшений и полное завершение всех тематических коллекций воксельных моделей.
lose_conditions: Проигрыш отсутствует (безопасный расслабляющий дзен-геймплей); замедление
  прогресса при недостаточной прокачке мощности против твердых объектов.
progression_summary: 'Экспоненциальный рост дохода: прокачка ширины захвата, остроты
  зубьев (урон по слоям), множителя цены вокселей и скорости автоматической подачи.
  Переход по тематическим коллекциям (Еда -> Гаджеты -> Ретро-игры -> Здания -> Монстры).'
difficulty_curve: Плавное увеличение плотности, размера и прочности вокселей новых
  объектов, мотивирующее регулярно распределять заработанные монеты между разными
  ветками прокачки.
scores:
  fun: 9
  originality: 8
  replayability: 9
  development_cost: 8
  visual_appeal: 9
  mobile_fit: 10
  monetization: 9
  platform_fit: 10
  overall_score: 9.0
  justification: Жанр ASMR-дробилок обладает вирусным потенциалом и сверхвысоким удержанием.
    Механика идеально ложится на вертикальный мобильный экран и модель вознаграждений
    за рекламу в Playgama/Yandex Games.
references:
- name: Will It Shred? / Hydraulic Press Games
  genre: ASMR Simulation
  mechanics:
  - Подача предметов под пресс/валы
  - Физика разрушения
  - Прокачка силы и скорости
  lessons: Ключ к успеху — идеальный тактильный звук треска и плавность анимации осыпания
    частиц.
  what_to_avoid: Слишком медленный старт без интерактивного кликабельного ускорения.
- name: Teardown (Voxel Physics)
  genre: Voxel Sandbox
  mechanics:
  - Повоксельная сегментация
  - Динамические воксельные частицы
  lessons: Воксели создают непревзойденное ощущение материальности и объема при разрушении.
  what_to_avoid: Избыточные расчеты коллизий для тысяч мелких частиц, приводящие к
    падению FPS.
mechanics:
- name: Зубчатый механизм захвата (Dual Roller Grinder)
  category: core
  priority: core
  description: Два параллельных цилиндрических вала с встречным вращением и зубьями
    затягивают 3D-модель в точку контакта.
  player_interaction: Автоматическое действие; наблюдение за процессом и визуализация
    силы трения.
  feedback: Искры, анимация вращения шестеренок, покачивание модели при захвате зубьями.
  technical_complexity: Medium
  strengths:
  - Понятная физическая модель
  - Привлекательный визуальный центр экрана
  weaknesses:
  - Необходима точная настройка зоны детекции коллизий вокселей с геометрией зубьев
- name: Воксельное скалывание и физика частиц
  category: core
  priority: core
  description: При соприкосновении с валами воксели отделяются от основной матрицы
    модели и переходят в пул активных частиц с гравитацией.
  player_interaction: Косвенное воздействие через силу и скорость валов.
  feedback: Каждый оторвавшийся воксель воспроизводит микро-щелчок ASMR звука и летит
    вниз с реалистичным разлетом.
  technical_complexity: High
  strengths:
  - Максимальное ASMR-удовлетворение
  - Красочный поток разноцветных частиц
  weaknesses:
  - Требуется оптимизация пула инстансов (InstancedMesh + GPU particle updates)
- name: Турбо-тап ускорение (Tap Boost)
  category: input
  priority: core
  description: Нажатия и клики по любой области экрана временно удваивают/утраивают
    скорость вращения валов и силу перемалывания.
  player_interaction: Активный клик / тап пальцем по экрану.
  feedback: Эффект размытия движения (motion trail), учащенный звук дробления, шкала
    Turbo Combo и вибрация устройства.
  technical_complexity: Low
  strengths:
  - Превращает пассивный просмотр в активный вовлекающий кликер
  - Дает контроль над темпом игры
  weaknesses:
  - Усталость пальцев при отсутствии автоматического буста
- name: Приемная корзина и конвертация в доход
  category: economy
  priority: core
  description: Воксели падают сквозь валы в нижнюю корзину, где мгновенно конвертируются
    в золотые монеты с множителем ценности.
  player_interaction: Наблюдение за ростом баланса и всплывающими цифрами дохода.
  feedback: Звон монет, эффект подсветки корзины, всплывающие золотые числа (+10,
    +50, +100).
  technical_complexity: Low
  strengths:
  - Четкая причинно-следственная связь между разрушением и наградой
  weaknesses:
  - Необходимо группировать начисление чисел для предотвращения захламления UI
- name: Многоуровневая система прокачки дробилки
  category: progression
  priority: high
  description: 'Улучшение характеристик: ''Ширина валов'' (площадь охвата), ''Острота
    зубьев'' (урон/скорость отрыва), ''Ценность вокселей'' (доход xN), ''Скорость
    подачи''.'
  player_interaction: Нажатие на кнопки карточек апгрейдов в нижней панели интерфейса.
  feedback: Визуальное изменение геометрии валов (становятся шире, зубья крупнее и
    золотистее), всплывающий победный эффект уровня.
  technical_complexity: Medium
  strengths:
  - Долгосрочная мотивация
  - Наглядный визуальный апгрейд техники
  weaknesses:
  - Требует тщательного баланса формулы стоимости
- name: Коллекции и галерея трофеев
  category: meta
  priority: medium
  description: Разблокировка новых тематических наборов 3D-моделей по мере прохождения
    уровней (Фрукты, Игрушки, Электроника, Скульптуры).
  player_interaction: Выбор следующего предмета или запуск бесконечного режима перемалывания.
  feedback: Экран триумфа с конфетти, 100% карточка завершения модели, открытие новой
    витрины.
  technical_complexity: Low
  strengths:
  - Коллекционирование и азарт открытий
  weaknesses:
  - Необходим достаточный объем готовых воксельных пресетов
gameplay_systems:
- name: Система вокселизации и деконструкции модели
  purpose: Представление 3D моделей в виде 3D матрицы вокселей и послойный расчет
    их уничтожения при пересечении с плоскостью валов.
  input: Координаты высоты модели Y, текущая скорость вращения валов, параметр остроты
    зубьев.
  rules:
  - Каждый шаг времени валы опускают модель вниз со скоростью, пропорциональной силе
    затягивания.
  - Все воксели в диапазоне высоты контакта валов [Y_min, Y_max] отделяются от родительского
    меша.
  - Отделившиеся воксели становятся динамическими частицами со случайным импульсом
    разлета и ускорением свободного падения.
  state:
  - current_model_id
  - total_voxels_count
  - destroyed_voxels_count
  - model_feed_y_offset
  interactions: Взаимодействует с генератором частиц, звуковым менеджером и начислением
    валюты.
  feedback: Плавное таяние 3D модели сверху вниз, вспышки на границе соприкосновения.
  edge_cases:
  - Модель полностью уничтожена -> Запуск следующей модели из очереди.
  - Слишком высокая плотность вокселей -> Батчинг обновления сетки для предотвращения
    просадки кадров.
- name: Система физических частиц (GPU/Instanced Particle Pool)
  purpose: Высокопроизводительная отрисовка и анимация сотен одновременно падающих
    кубиков-частиц.
  input: Точки спавна оторвавшихся вокселей, исходный цвет вокселя, вектор начальной
    скорости.
  rules:
  - Использование предварительно аллоцированного Three.InstancedMesh на 1500 частиц.
  - Обновление позиций в кастомном вершинном шейдере или через плоский Float32Array.
  - Удаление частицы и начисление очков при достижении плоскости корзины Y <= Y_basket.
  state:
  - active_particles_count
  - free_instance_indices
  interactions: Связана с корзиной наград и аудио-триггерами.
  feedback: Яркий фонтан сыплющихся кубиков с сохранением их оригинальных цветов от
    модели.
  edge_cases:
  - Переполнение пула частиц -> Автоматическое ускорение старых частиц без потери
    начисления монет.
- name: Экономика и баланс улучшений (Idle Economy)
  purpose: Расчет стоимости апгрейдов и генерации монет по законам инкрементальных
    игр.
  input: Уровни улучшений игрока, события уничтожения вокселей, клики игрока.
  rules:
  - Стоимость апгрейда = BaseCost * (1.15 ^ CurrentLevel).
  - Доход за воксель = BaseVoxelValue * SharpnessMultiplier * ValueMultiplier.
  - Каждый клик дает множитель скорости x2 на 0.6 секунды с возможностью поддержания
    комбо.
  state:
  - player_coins
  - roller_width_lvl
  - roller_sharpness_lvl
  - voxel_value_lvl
  - auto_speed_lvl
  interactions: Связывает UI апгрейдов с боевой математикой дробилки.
  feedback: Анимация летящих монет в счетчик баланса, звуки покупок, подсветка доступных
    к покупке кнопок.
  edge_cases:
  - Большие числа баланса -> Форматирование в суффиксы (1.2K, 3.4M, 5.6B).
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.170.0
  physics_engine: Rapier3D (@dimforge/rapier3d-compat 0.13.x)
  state_manager: Custom Reactive EventBus & State Store (Zero-dependency)
  audio_engine: 'Web Audio API (Howler.js with html5: false, procedural pitch shift)'
  target_fps: 60
  max_draw_calls: 35
  max_triangles_or_sprites: 45000
  bundle_size_budget_mb: 3.8
  layers:
  - name: Presentation & Three.js Scene
    description: Камера, свет, рендер валов, шейдеры частиц, сетка воксельной модели
  - name: Simulation & Voxel Core
    description: Алгоритм послойного скалывания вокселей, расчет коллизий и пула частиц
  - name: Game Logic & Progression
    description: Стейт уровней, формулы экономики, менеджер коллекций и сохранений
  - name: Platform & Monetization Bridge
    description: Интеграция @playgama/bridge (Реклама, Cloud Storage, Аналитика, Полноэкранный
      режим)
  - name: UI & Overlay HUD
    description: HTML5/CSS3 производительный оверлей с поддержкой мобильного тач-ввода
  modules:
  - VoxelModelLoader: Парсинг воксельных структур (.vox / JSON 3D array) в оптимизированный
      Three.InstancedMesh
  - RollerMechanism: Управление мешами зубчатых валов, вращением, анимацией зубьев
      и визуальным масштабированием
  - ParticleStream: Пул инстансированных частиц для отрывающихся вокселей с расчетом
      баллистики и сбора
  - ASMRSoundManager: Генерация звуков хруста, треска, кликов и звона монет с динамической
      вариацией питча
  - UpgradeSystem: Логика цен, уровней и применения модификаторов к механике валов
  - BridgeAdapter: Слой работы с SDK Playgama (сохранения, реклама, баннеры, лидерборд)
monetization:
  strategy_summary: 'Мягкая гибридная модель: вознаграждающие видео (Rewarded Video)
    для ускорения прогресса и умножения наград + редкие межстраничные объявления (Interstitial)
    между успешными завершениями коллекций + внутриигровые покупки (IAP) для отключения
    рекламы и покупки премиальных скинов.'
  rewarded_placements:
  - id: x2_stage_reward
    name: Удвоение монет за предмет
    benefit: Умножает все заработанные с текущего объекта монеты на 2
    cooldown_or_limit: После каждого завершенного предмета
    trigger_moment: Экран успешного уничтожения модели (Victory Popup)
  - id: mega_turbo_boost
    name: Мега-Турбо Дробилка (30 сек)
    benefit: Включает авто-кликер на максимальной скорости x5 и золотые валы на 30
      секунд
    cooldown_or_limit: Кулдаун 3 минуты
    trigger_moment: Плавающая кнопка-бонус на основном игровом экране
  - id: free_instant_upgrade
    name: Бесплатный уровень прокачки
    benefit: Мгновенно дает +1 уровень самому дорогому текущему улучшению без траты
      монет
    cooldown_or_limit: 2 раза за игровую сессию
    trigger_moment: Иконка подарка рядом с карточкой апгрейда
  interstitial_placements:
  - trigger_event: Завершение уничтожения 3-го предмета подряд
    cooldown_seconds: 90
    conditions: Не показывается во время активного клика или воспроизведения ASMR-эффекта
  - trigger_event: Переход в новую тематическую коллекцию предметов
    cooldown_seconds: 120
    conditions: Только при переключении мира/категории в меню
  in_app_purchases:
  - sku: no_ads_permanent
    name: Отключение рекламы (No Ads)
    description: Навсегда убирает межстраничные баннеры и дает пассивный бонус +20%
      к доходу
    price_tier: Tier 2 ($1.99 / 149 YAN)
    reward: Отключение Interstitial рекламы навсегда + 5000 монет
  - sku: golden_crusher_pack
    name: Набор 'Золотой Измельчитель'
    description: Эксклюзивный скин валов из чистого золота + утроенный стартовый капитал
    price_tier: Tier 3 ($2.99 / 249 YAN)
    reward: Золотой скин валов + x1.5 множитель монет навсегда + 25000 монет
  - sku: huge_coin_chest
    name: Сундук Воксельного Золота
    description: Огромный запас монет для мгновенной прокачки всех характеристик
    price_tier: Tier 1 ($0.99 / 79 YAN)
    reward: 50000 монет
  fairness_rules:
  - Любой предмет и улучшение можно открыть без реальных денег и без обязательного
    просмотра рекламы.
  - Звук рекламы строго глушит игровой звук, а после закрытия плавно восстанавливает
    аудио-сессию.
  - Первые 2 минуты геймплея полностью свободны от межстраничных баннеров.
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - yandex
  - vk
  - game_distribution
  - crazy_games
  - mobile_web
  - standalone_android
  initialization_flow:
  - bridge.initialize() на этапе предзагрузки ассетов
  - Загрузка сохраненного стейта через bridge.storage.get()
  - Инициализация баннеров и проверка доступности рекламы bridge.advertisement.checkAdblock()
  - Старт рендера Three.js сцены и скрытие загрузочного экрана (SplashScreen.hide())
  cloud_save_keys:
  - player_coins
  - upgrades_state
  - unlocked_collections
  - current_collection_index
  - current_model_index
  - sound_enabled
  - haptic_enabled
  leaderboards:
  - total_voxels_crushed_leaderboard
  - completed_collections_count
  ads_integration:
    rewarded: bridge.advertisement.showRewardedVideo()
    interstitial: bridge.advertisement.showInterstitial()
    banner: bridge.advertisement.showBanner() внизу экрана на десктопе
  lifecycle_hooks:
  - bridge.on('game_pause', () => pauseGameAndAudio())
  - bridge.on('game_resume', () => resumeGameAndAudio())
  - window.addEventListener('beforeunload', () => autoSaveCloudState())
art:
  style_name: Stylized Low-Poly / Minimalist Voxel ASMR
  camera_perspective: Perspective (Изометрический ракурс сверху-спереди на дробилку)
  camera_fov: 42
  camera_pitch_angle: 38
  environment_theme: Уютная футуристическая студия-мастерская с мягким студийным фоном,
    подчеркивающим сочность ярких вокселей.
  character_proportions: 'N/A (Объекты: детализированные воксельные 3D-модели в сетках
    16x16x16 до 48x48x48)'
