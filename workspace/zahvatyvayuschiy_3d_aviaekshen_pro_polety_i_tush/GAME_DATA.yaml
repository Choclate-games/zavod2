gameplay_systems:
- name: Система очагов возгорания и тушения (Wildfire & Extinguish System)
  purpose: Управление состоянием пожаров, расчетом попаданий воды, генерацией пара
    и регистрацией ликвидации очагов
  input: Координаты и объем водяного сброса, вектор падения струи
  rules:
  - Очаги имеют запас стойкости (100–500 HP). Водяной залп наносит урон по площади
    в зависимости от расстояния и точности накрытия. Попадание в ядро очага вызывает
    "Критическое тушение" с бонусом комбо.
  state:
  - FireIntensity (интенсивность огня)
  - AcreageBurned (площадь горения)
  - ExtinguishProgress (прогресс тушения)
  - ActiveThermalPillars (координаты восходящих потоков)
  interactions: ''
  feedback: Огонь уменьшается, парктиклы гаснущих углей, победный звуковой гонг и
    фанфары при ликвидации
  edge_cases:
  - Сброс воды в реку (штраф за нецелевой расход)
  - Неполное тушение очага (пожар продолжает тлеть и требует второго захода)
- name: Гидроаэродинамическая физическая система (Aero-Hydro Simulation Engine)
  purpose: Расчет подъемной силы, гидродинамического глиссирования, лобового сопротивления
    и изменения массы в реальном времени
  input: Входные команды пилота, контакт поплавков с рекой, объем воды в баках
  rules:
  - Масса гидроплана плавно растет при контакте поплавков с водой. Увеличение массы
    снижает скороподъемность и маневренность. При сбросе воды масса мгновенно возвращается
    к базовой с импульсом подброса вверх.
  state:
  - CurrentMass (текущая масса)
  - AirSpeed (воздушная скорость)
  - WaterPenetrationDepth (глубина погружения поплавков)
  - LiftDragRatio (аэродинамическое качество)
  interactions: ''
  feedback: След на воде, отклонение рулевых плоскостей, изменение тангажа от набранной
    массы
  edge_cases:
  - Касание скалы по касательной (рикошет с потерей скорости вместо мгновенного краша)
  - Заход на воду с креном >30 градусов (капотирование)
- name: Система слаломного коридора и темпа (Canyon Slalom & Pacing System)
  purpose: Структурирование маршрута ущелья на 3 сектора, контроль чекпоинтов и нарастание
    динамики вылета
  input: Позиция гидроплана в каньоне, таймер вылета
  rules:
  - Каньон разделен на 3 сектора. Прохождение створов открывает оптимальную траекторию
    захода на очаг и продлевает комбо-таймер.
  state:
  - CurrentSector (текущий сектор 1..3)
  - CheckpointsCleared (пройдено чекпоинтов)
  - TimeRemaining (остаток времени спринта)
  interactions: ''
  feedback: Голографические ветровые маркеры, звуковой сигнал прохождения контрольного
    створа
  edge_cases:
  - Срез маршрута через верх скал пресекается мощным нисходящим турбулентным потоком
- name: Система рангов и комбо-оценки (Pilot Rating & Combo System)
  purpose: Оценка мастерства пилота по итогам 60-секундного вылета и начисление очков
    модернизации
  input: Точность попадания водой, время прохождения секторов, чистота пилотирования
  rules:
  - Комбо растет за идеальные сбросы без пауз и аварий (x1 -> x2 -> x3). Итоговый
    ранг (S/A/B/C) формируется из суммы очков скорости, точности и спасенного леса.
  state:
  - ScoreTotal (общий счет)
  - ComboMultiplier (текущий множитель)
  - AccuracyPercent (процент попадания)
  - MissionGrade (итоговый ранг)
  interactions: ''
  feedback: Всплывающие золотые плашки «PERFECT DROP!», «SCOOP x3!», звуковые джинглы
    ранга
  edge_cases:
  - Сброс комбо при прямом столкновении со скалой или проливе 100% воды мимо цели
core_design:
  signature_moment: 'Момент, когда на 42-й секунде вылета перегруженный 4.5 тоннами
    воды гидроплан со скрежетом и воем моторов проносится в 1.5 метрах над огненной
    стеной реликтового леса, вы прожимаете рычаг залпового сброса: гигантская белая
    стена воды мгновенно гасит бушующий ад, экран заливает густой пар, а облегченный
    самолет от отдачи и восходящего термика пушечным ядром выстреливает вертикально
    вверх в чистое лазурное небо над гребнем каньона с утроением комбо-очков!'
  genre_template_rejected: 'Отвергнут стандартный аркадный шаблон «рельсового 3D-раннера
    с неизменной физикой и абстрактными монетами/бустерами». В обычных раннерах вес
    и физическая модель транспорта статичны, а манёвры сводятся к выбору одной из
    трёх полос. Мы полностью отвергаем дискретные полосы и статичную массу: гидроплан
    подчиняется непрерывной гидроаэродинамике, где масса непрерывно меняется от 4500
    кг (пустой) до 9000 кг (полный бак), радикально изменяя радиус разворота, скорость
    сваливания и просадку по высоте. Забор воды — это не мгновенный подбор сферы-бонуса,
    а рискованное физическое глиссирование по реке с гидросопротивлением и риском
    зарывания поплавков в пороги.'
  what_makes_it_different: 'В отличие от классических авиасимуляторов (со сложными
    приборами и долгим заходом на цель) и казуальных раннеров (без инерции и физики
    массы), здесь ядро построено на циклической пульсации массы и баллистической отдачи:
    ''забор воды утяжеляет штурвал и прижимает к земле -> слалом требует раннего упреждения
    траектории -> сброс воды даёт мощный вертикальный импульс отдачи''. Игрок использует
    огонь не только как цель для тушения, но и как тактический лифт: раскаленный воздух
    над пожаром создает восходящий термик, компенсирующий возросшую массу самолета
    перед сбросом.'
  micro_loop:
  - step: Сканирование водной глади и прижимание к реке
    player_action: Наклон штурвала от себя (W / Стрелка вниз / свайп вниз), выравнивание
      поплавков параллельно течению реки
    game_response: Снижение гидроплана до бреющего эшелона (1.2–1.8 м), появление
      водяных бурунов под днищем, свист рассекаемого воздуха
    decision: Начать глиссирование сейчас на прямом участке реки или рискнуть зайти
      на забор в повороте ради экономии 1.5 секунд
    duration: 0.8–1.2 с
  - step: Глиссирование и скоростной водозабор
    player_action: Удержание высоты глиссирования (1.5 м) и корректировка крена рулями
      направления (A/D / мышь)
    game_response: Включение ковшевых водозаборников, заполнение баков (1800 л/с),
      замедление самолета со 190 до 140 км/ч от гидросопротивления, потяжеление штурвала
    decision: Забрать полный бак (4500 л) с риском не успеть набрать высоту до скального
      мыса или оборвать забор на 3000 л для легкого виража
    duration: 1.5–2.5 с
  - step: Тяжелый слалом и набор высоты к очагу
    player_action: Ранняя закладка виража с упреждением (угол крена 45°), активация
      форсажа (Space / Тап Boost) при входе в восходящий термик
    game_response: Инерционный занос тяжелого фюзеляжа, подхват крыла горячим потоком
      термика (+9.5 м/с вертикальной скорости), выход на прицельную метку очага
    decision: Срезать угол через узкую дымовую расщелину на риске перегрева двигателей
      или облететь по широкой дуге с потерей комбо-таймера
    duration: 1.5–3.0 с
  - step: Залповый водосброс и реактивный взмыв
    player_action: Нажатие кнопки залпового сброса (Пробел / Левый клик / Кнопка сброса)
      строго в створе огненного сектора
    game_response: Распах створок бомболюка, сброс лавины воды 4.5 т, генерация облака
      пара, мгновенная ликвидация очага, резкий реактивный толчок гидроплана вверх
      на +14.5 м
    decision: Сбросить весь объем залпом для 100% тушения главного очага и максимального
      комбо или разделить сброс на два очага
    duration: 0.5–1.0 с
  meso_loop:
  - step: Тактическая оценка сектора каньона
    player_action: Визуальный выбор коридора захода на речной участок перед очередным
      очагом пожара
    game_response: Отображение маркера очага №1/2/3, плотности пламени (HP очага 3000–5000
      ед.) и направления дымовых шлейфов
    decision: Выбрать скоростной левый рукав реки с порогами или спокойный правый
      рукав с низкими скальными арками
    duration: 2.0–3.0 с
  - step: Цикл водозабора и борьба с гидродинамическим торможением
    player_action: Погружение ковшей в реку, удержание глиссирования до наполнения
      баков до необходимого уровня
    game_response: Рост индикатора заполнения бака (0 -> 4500 л), снижение маневренности,
      вибрация корпуса от течения
    decision: Заполнить бак до максимума для гарантированного закрытия 3-звездочного
      очага или ограничиться 70% для прохода под нависающей скалой
    duration: 3.0–5.0 с
  - step: Штурм огненного фронта и баллистический сброс
    player_action: Прорыв сквозь термический восходящий поток, точный сброс воды по
      баллистической траектории в ядро пламени
    game_response: 'Эффект ''Огнетушение: ИДЕАЛЬНО'', начисление комбо-множителя (x1
      -> x2 -> x3), превращение пламени в пар, очистка сектора каньона'
    decision: Использовать полученный импульс отдачи для перелета через гребень к
      следующему речному плесу или остаться в низине каньона
    duration: 4.0–6.0 с
  - step: Переход в следующий сектор каньона
    player_action: Стабилизация гидроплана на форсаже, выравнивание курса вдоль изгиба
      ущелья
    game_response: Смена зоны каньона (от широкого русла к теснине с огненными смерчами),
      обновление таймера вылета (+5 с бонус за чистый сброс)
    decision: Сохранить накопленный форсаж для экстренного уклонения от скалы или
      активировать его для ускорения захода на второй очаг
    duration: 3.0–4.0 с
  macro_loop:
  - step: Предполетный выбор гидроплана и модификаций на авиабазе
    player_action: Выбор класса самолета (напр. 'Лесной Коршун' vs 'Озерный Титан'),
      установка гидравлических створок и титановых поплавков
    game_response: 'Обновление ТТХ: базовая скорость 180 км/ч, вместимость 4500 л,
      скорость забора 1800 л/с, прочность поплавков 100 HP'
    decision: Взять скоростной легкий гидроплан для рекорда по времени или тяжелый
      трехбаковый танкер для надежного тушения за один проход
    duration: 5.0–10.0 с
  - step: Спринтерский боевой вылет в Огненный Каньон
    player_action: Выполнение скоростного прорыва сквозь 3 сектора ущелья, тушение
      3 очагов возгорания за 60 секунд
    game_response: Динамический счетчик оставшихся очагов (3 -> 2 -> 1 -> 0), рост
      множителя комбо (до x3), таймер обратного отсчета
    decision: Идти на экстремальный рекордный маршрут в метре от скал ради ранга 'S'
      (Ас-Ликвидатор) или лететь безопаснее ради гарантированной победы
    duration: 45.0–60.0 с
  - step: Итоги вылета, разбор телеметрии и награды
    player_action: Просмотр экрана триумфального выхода из каньона, фиксация сохраненных
      гектаров леса и комбо-очков
    game_response: Начисление пожарных кредитов (Fire Rescue Credits), опыта ранга
      пилота, открытие новых чертежей гидропланов и трасс
    decision: Потратить заработанные кредиты на расширение водозаборных ковшей или
      разблокировать следующее ущелье 'Пепельный Разлом'
    duration: 5.0–10.0 с
  - step: Мета-прокачка и запуск следующего контракта
    player_action: Покупка апгрейда 'Турбо-насосы забора воды (+30% скорости)' и старт
      вылета в усложненный каньон
    game_response: Применение постоянных перков к флоту, запуск загрузки новой генерации
      препятствий и очагов каньона
    decision: Перепройти текущий каньон на ранг S-Gold или отправиться на новую карту
      с дымовыми смерчами и узкими расщелинами
    duration: 5.0–10.0 с
  loop_diagram: "+-----------------------------------------------------------------------------------+\n\
    |                             МЕТА-ПЕТЛЯ (АВИАБАЗА)                          \
    \       |\n|  [Выбор гидроплана] -> [Прокачка баков/ковшей] -> [Контракт: Огненный\
    \ Каньон]     |\n+----------------------------------------+------------------------------------------+\n\
    \                                         | Старт вылета (60 сек)\n          \
    \                               v\n+-----------------------------------------------------------------------------------+\n\
    |                           МЕЗО-ПЕТЛЯ (СЕКТОР / ОЧАГ 1..3)                  \
    \       |\n|  +-----------------------------------------------------------------------------+\
    \  |\n|  |                       МИКРО-ПЕТЛЯ (ПОСЕКУНДНО: 1-3 сек)           \
    \          |  |\n|  |                                                        \
    \                     |  |\n|  |   [1. Бреющий полет] --------> [2. Глиссирование\
    \ по реке]                   |  |\n|  |     (h < 1.8м над водой)         (Забор\
    \ воды: 1800 л/с, штурвал тяжелеет)   |  |\n|  |             ^               \
    \                    |                           |  |\n|  |             |    \
    \                               v                           |  |\n|  |   [4. Реактивный\
    \ взмыв] <------ [3. Баллистический сброс на очаг]           |  |\n|  |     (Облегчение\
    \ -4.5т,            (Ликвидация пламени, +Комбо x3,           |  |\n|  |     \
    \ подхват термиком +15м)        шлейф густого пара)                      |  |\n\
    |  +-----------------------------------------------------------------------------+\
    \  |\n|                                        | Очаг ликвидирован (+5 сек бонус)\
    \          |\n|                                        v                     \
    \                      |\n|         [Слалом в узкую теснину к следующему очагу\
    \ пожара]                         |\n+----------------------------------------+------------------------------------------+\n\
    \                                         | Все 3 очага потушены / Выход из каньона\n\
    \                                         v\n+-----------------------------------------------------------------------------------+\n\
    |                             ЭКРАН ПОБЕДЫ И НАГРАДЫ                         \
    \       |\n|     [Ранг S: Ас-Ликвидатор] -> [Кредиты спасения] -> [Новые гидропланы/перки]\
    \     |\n+-----------------------------------------------------------------------------------+"
  tension_curve: 'Волнообразная пилообразная кривая с 3 нарастающими пиками напряжения
    внутри 60-секундного спринта: Секунды 0–5 (Низкое): Старт вылета, пикирование
    в каньон, прицеливание на речную гладь; Секунды 5–15 (Пик 1): Первый забор воды
    на бреющем полете (напряжение удержания высоты 1.5 м) -> тяжелый вираж -> первый
    залповый сброс и эйфорический взмыв облегченного самолета; Секунды 15–35 (Пик
    2): Вход во второй S-образный сектор ущелья с дымовыми смерчами; баки быстро тяжелеют
    в порожистом русле, сброс на второй очаг на грани столкновения со скалой; Секунды
    35–55 (Пик 3 — Кульминация): Финальная узкая теснина, таймер мигает красным (<15
    с), третий гигантский очаг требует 100% заполнения бака; самолет предельно инертен,
    игрок на бреющем полете проносится под падающей горящей сосной, ловит восходящий
    термик прямо перед пламенем и сбрасывает лавину воды на последней секунде; Секунды
    55–60 (Катарсис): Финальный взмыв сквозь пар над гребнем каньона в лучи заката,
    подсчет спасенного леса и начисление комбо-ранга.'
  core_formulas:
  - 'Масса гидроплана: M_total = M_empty (4500 кг) + V_water (литры) * 1.0 кг/л (максимум
    9000 кг при полном баке 4500 л).'
  - 'Гидродинамическое торможение при заборе: F_drag_water = 0.42 * V_plane^2 * min(1.0,
    depth / 0.8м), замедляет самолет с 190 км/ч до предела глиссирования 130 км/ч
    за 2.5 секунды.'
  - 'Инерция тангажа и крена: Angular_Accel = Base_Torque / (1.0 + (M_total - M_empty)
    / M_empty * 1.25), снижает угловую приемистость штурвала на 55% при полной загрузке
    баков.'
  - 'Эффективность тушения очага: Extinguish_Power = (V_dropped / Target_Required_Water)
    * Overlap_Factor * (1.0 + Current_Speed / 200), где идеальный сброс (Overlap >
    0.85) наносит 100% урон очагу и начисляет комбо-ранг ''ИДЕАЛЬНО''.'
  - 'Реактивный вертикальный импульс сброса (Recoil Lift): Delta_V_y = (M_dropped
    / M_empty) * 9.81 * 1.35 + Thermal_Boost (8.0 м/с при наличии термика), мгновенно
    подбрасывает самолет вверх на 12–18 метров за 0.6 секунды.'
  - 'Формула комбо-очков: Score_Drop = Base_Points (1000) * Combo_Multiplier (1.0..3.0)
    * Speed_Factor (V / 150) * Altitude_Bonus (1.0 + max(0, (25м - Alt) / 20)).'
  - 'Перегрев двигателя в дыму: Temp_Engine = Temp_Base (75°C) + Smoke_Density * 35°C/с
    * dt - Air_Cooling (15°C/с * (V_plane / 180)), при Temp > 115°C падает тяга на
    40%.'
  run_progression:
  - 'Рост комбо-множителя вылета: успешное идеальное тушение очага без повреждений
    поплавков повышает комбо с x1.0 до x2.0 и x3.0, увеличивая дальность реактивного
    взмыва на +20% и начисляемые кредиты.'
  - 'Накопление форсажного давления (Water-Steam Boost): каждая успешно сброшенная
    тонна воды в центр пламени мгновенно заполняет шкалу парового форсажа на 33%,
    позволяя прожать экстренный 3.5-секундный турбо-рывок (скорость +45 км/ч).'
  - 'Бонус времени за точность (Time Extension): идеальный сброс (оценка ''АС'') добавляет
    +5.0 секунд к общему 60-секундному таймеру вылета, компенсируя задержки на сложных
    виражах.'
  - 'Аэродинамический кураж пилота: непрерывный полет на высоте < 3 метров над руслом
    реки в течение 3 секунд активирует пассивный экранный эффект, повышающий скорость
    набора воды на +25%.'
  meta_progression:
  - 'Флот гидропланов: открытие 4 уникальных классов самолетов (1. ''Лесной Стриж''
    — легкий и маневренный на 2500 л; 2. ''Канадский Альбатрос'' — сбалансированный
    на 4500 л; 3. ''Озерный Титан'' — сверхтяжелый четырехмоторный на 7500 л; 4. ''Огненный
    Буревестник'' — реактивный экраноплан с турбо-заборниками).'
  - 'Прокачка ковшей гидрозабора (Уровни 1-5): увеличение пропускной способности заборных
    каналов с 1800 л/с до 3200 л/с (сокращение времени глиссирования с 2.5 с до 1.4
    с).'
  - 'Створки бомболюка быстрого сброса (Уровни 1-4): сокращение времени открытия створок
    с 0.6 с до 0.18 с и увеличение площади водяного пятна на +35%.'
  - 'Титановое бронирование днища поплавков (Уровни 1-5): запас прочности от ударов
    о речные камни и пороги возрастает с 1 столкновения (100 HP) до 3 столкновений
    (300 HP).'
  - 'Атлас каньонов: разблокировка 4 экстремальных пожарных зон (''Огненная Подкова'',
    ''Серный Разлом'', ''Чертово Ущелье'', ''Вулканический Каньон'').'
  mechanics:
  - name: Бреющее глиссирование и водозабор
    role_in_loop: Двигатель цикла подготовки ресурса и главный источник динамического
      риска у поверхности воды
    player_decision: Коснуться реки на высокой скорости (190 км/ч) на безопасном прямом
      участке или начать забор в узкой дуге поворота, рискуя зацепить поплавками каменистую
      косу ради экономии 2 секунд
    input_mapping: 'Клавиатура: удерживать W / Стрелку вниз (прижать нос к воде) +
      A/D для коррекции курса. Мышь: плавное ведение курсора вниз к горизонту воды.
      Тач: плавный свайп/удержание пальца в нижней зоне виртуального штурвала.'
    states:
    - 'AIRBORNE_APPROACH: Снижение к реке, высота 2.0–5.0 м, забор неактивен, аэродинамическое
      сопротивление стандартное.'
    - 'SKIMMING_CONTACT: Касание поплавками воды на высоте 0.8–1.8 м, активация заборных
      ковшей, темп набора 1800 л/с, включение гидродинамического торможения (-20 км/ч
      за сек).'
    - 'TANK_FULL_LIMIT: Бак заполнен на 100% (4500 л), автоматическое закрытие створок
      ковша, срыв глиссирования с риском зарывания носа.'
    - 'HYDRO_IMPACT_CRASH: Критическое погружение глубже 0.5 м от поверхности или
      столкновение с порогом/скалой (потеря 40 HP поплавков и срыв курса).'
    parameters:
    - name: Окно высоты глиссирования
      value: 1.2–1.8 м
      tuning_note: Если увеличить до 3.0 м — исчезает страх касания воды и напряжение
        бреющего полета; если снизить до 0.5 м — 80% игроков разобьют самолет в первой
        же попытке.
    - name: Темп забора воды
      value: 1800 л/с
      tuning_note: Если сделать выше (3500 л/с) — забор станет мгновенным и потеряет
        фазу удержания глиссирования; если снизить (800 л/с) — таймер вылета 60 с
        закончится до первого сброса.
    - name: Гидродинамическое замедление
      value: 18.5 м/с²
      tuning_note: Если завысить — самолет быстро свалится в штопор на воде; если
        занизить — игрок не почувствует колоссальное сопротивление забираемой массы
        воды.
    - name: Максимальная емкость бака
      value: 4500 л
      tuning_note: Если уменьшить до 2000 л — одного сброса не хватит на ликвидацию
        очага; если увеличить до 10000 л — самолет станет неподъемным утюгом.
    feedback_layers:
    - 'Визуал/VFX: Плотные белые фонтаны брызг и пенистый кильватерный след из-под
      двух поплавков; капли воды заливают нижнюю треть экрана; шейдер искажения воды.'
    - 'Звук (Web Audio): Резкий переход от свиста ветра к низкочастотному бурлящему
      реву рассекаемой воды (розовый шум с LowPass фильтром 400 Гц) + металлический
      гул наполняющихся баков.'
    - 'Камера: Камера плавно опускается ближе к хвосту самолета, FOV динамически сужается
      с 75° до 62° для усиления чувства стремительной скорости над зеркалом реки.'
    - 'UI/Тактильность: Нарастающая круговая шкала цистерны по центру HUD с делениями
      литров (0..4500); на мобильных — нарастающая высокочастотная вибрация (haptic
      pulse 25 мс с частотой 40 Гц).'
    failure_mode: Игрок слишком резко дает штурвал от себя и зарывает поплавки глубже
      0.5 м, либо не успевает среагировать на изгиб русла и на скорости 160 км/ч врезается
      поплавком в гранитный мыс каньона.
    mastery_curve: Новичок на 30-й секунде боится подойти к воде, забирает по 1000
      л за три захода на прямых участках. Эксперт на 10-м забеге ныряет в поворот
      реки, скользит по дуге на одном поплавке, забирает 4500 л за 2.5 секунды и выпрыгивает
      из воды в 5 метрах от скалы.
    counterplay: Речное русло имеет каменистые пороги, упавшие горящие бревна поперек
      течения и крутые изгибы, заставляющие игрока непрерывно балансировать между
      забором и уклонением.
    synergies:
    - 'Динамическая трансформация массы: каждый набранный литр напрямую утяжеляет
      фюзеляж, заставляя давить штурвал на себя для отрыва.'
    - 'Паровой форсаж и слаломный граунд-эффект: глиссирование над водой активирует
      экранный эффект, дающий +15% к подъемной силе крыла.'
    why_unique: Вместо шаблонного сбора парящих светящихся сферок забор воды реализован
      как честный гидродинамический контакт с поверхностью реки, создающий физическое
      трение и перегрузку корпуса.
    pseudocode: "function tickWaterSkimming(plane, riverSurface, dt) {\n  const altitude\
      \ = plane.position.y - riverSurface.getHeightAt(plane.position.x, plane.position.z);\n\
      \  if (altitude > 0.3 && altitude <= 1.8) {\n    const scoopRate = 1800 * dt;\n\
      \    plane.waterTank = Math.min(plane.maxWaterTank, plane.waterTank + scoopRate);\n\
      \    plane.velocity.z -= plane.hydroDragCoefficient * plane.velocity.z * dt;\n\
      \    spawnWaterSprayVFX(plane.leftFloatPos, plane.rightFloatPos);\n    triggerHapticFeedback(plane.waterTank\
      \ / plane.maxWaterTank);\n  } else if (altitude <= 0.3) {\n    plane.applyImpactDamage(40);\n\
      \    spawnCrashSplashVFX(plane.position);\n  }\n}"
  - name: Динамическая трансформация массы и инерции
    role_in_loop: Главный регулятор сложности управления и физический тормоз маневренности,
      создающий контраст ощущений
    player_decision: Рассчитать траекторию виража заранее с упреждением в 2.0 секунды
      с тяжелым баком или сбросить часть воды раньше времени, чтобы вписаться в крутой
      скальный створ
    input_mapping: 'Клавиатура: глубокое зажатие A/D (крен) + S (руль высоты на себя
      для компенсации проседания). Мышь/Тач: широкие упреждающие отклонения курсора
      влево/вправо с удержанием тангажа.'
    states:
    - 'LIGHT_AGILE: Бак пуст (0–1000 л, масса 4500 кг), отзывчивый крен 60°/с, минимальная
      просадка высоты, скоростной разгон.'
    - 'MEDIUM_LOADED: Бак наполовину полон (1000–3000 л, масса ~6500 кг), заметное
      утяжеление отклика рулей, просадка в вираже -2 м/с.'
    - 'HEAVY_CRITICAL: Полный бак (3000–4500 л, масса 9000 кг), радиус разворота увеличен
      в 2.2 раза, высокая скорость сваливания (135 км/ч), штурвал требует постоянного
      натяжения на себя.'
    - 'STALL_WARNING: Скорость упала ниже 130 км/ч при полном весе, тряска фюзеляжа,
      сваливание носа вниз к скалам.'
    parameters:
    - name: Базовая сухая масса
      value: 4500 кг
      tuning_note: Определяет стартовую резвость и базовую маневренность пустого гидроплана.
    - name: Коэффициент деградации тангажа
      value: 0.55 (на 45% медленнее отклик)
      tuning_note: Если снизить деградацию — игрок не почувствует вес 4.5 тонн воды;
        если завысить — самолет станет неуправляемым бревном.
    - name: Скорость сваливания под нагрузкой
      value: 135 км/ч
      tuning_note: Если установить слишком высокой (160 км/ч) — самолет будет падать
        в штопор при каждом выходе из воды; если занизить (90 км/ч) — исчезнет риск
        потери скорости.
    - name: Радиус виража полного гидроплана
      value: 85 м (против 38 м у пустого)
      tuning_note: 'Задает жесткую геометрию коридора ущелья: игрок обязан выбирать
        внешнюю дугу траектории.'
    feedback_layers:
    - 'Визуал/VFX: Прогиб элеронов и закрылков на максимум, микро-деформация и дрожь
      крыльев под нагрузкой, срыв воздушных вихрей с законцовок крыла (белые шнуры
      спутной струи).'
    - 'Звук (Web Audio): Натужный низкий рев спаренных турбовинтовых моторов под нагрузкой,
      скрип силовых шпангоутов в кабине, пульсирующий сигнал зуммера угла атаки.'
    - 'Камера: Камера медленнее следует за поворотом носа самолета (увеличение lerp-запаздывания
      с 0.08 до 0.22), подчеркивая тяжелый занос хвоста.'
    - 'UI/Тактильность: Индикатор перегрузки G-метра на HUD уходит в желто-красную
      зону (до +3.8G); сильное сопротивление виртуального джойстика / тяжелая непрерывная
      вибрация.'
    failure_mode: Игрок пытается заложить резкий поворот перед скалой так же поздно,
      как на пустом самолете; тяжелый гидроплан не успевает довернуть из-за возросшего
      радиуса виража и врезается крылом в утес.
    mastery_curve: Новичок паникует от потяжелевшего управления, теряет высоту и врезается
      в скалы на выходе из реки. Эксперт начинает закладывать крен еще во время забора
      воды, используя инерцию заноса для идеального дрифта вокруг скального выступа.
    counterplay: 'Сужения каньона сразу после водных плесов: игра намеренно ставит
      узкие расщелины ровно в тех местах, где самолет максимально тяжел и неповоротлив.'
    synergies:
    - 'Бреющее глиссирование и водозабор: источник непрерывного нарастания массы прямо
      во время движения.'
    - 'Термические восходящие потоки: тяжелый гидроплан использует тепловые потоки
      как бесплатный лифт для компенсации просадки высоты.'
    why_unique: В аркадных играх вес обычно статичен или чисто визуален. Здесь физическая
      масса — это динамический модификатор пространства состояний управления в реальном
      времени.
    pseudocode: "function tickDynamicMassInertia(plane, dt) {\n  const currentMass\
      \ = plane.emptyMass + plane.waterTank;\n  const massRatio = currentMass / plane.emptyMass;\n\
      \  plane.pitchSensitivity = plane.basePitchSensitivity / (1.0 + (massRatio -\
      \ 1.0) * 0.85);\n  plane.rollSensitivity = plane.baseRollSensitivity / (1.0\
      \ + (massRatio - 1.0) * 1.1);\n  plane.stallSpeed = plane.baseStallSpeed * Math.sqrt(massRatio);\n\
      \  const gravitySag = (massRatio - 1.0) * 4.2 * dt;\n  plane.velocity.y -= gravitySag;\n\
      \  if (plane.velocity.length() < plane.stallSpeed) {\n    plane.triggerStallShake(massRatio);\n\
      \  }\n}"
  - name: Залповый баллистический водосброс и реактивный взмыв
    role_in_loop: Кульминационный источник награды, инструмент победы над очагами
      и мгновенный сброс тяжести с катапультированием вверх
    player_decision: Открыть створки точно над эпицентром пожара на предельно малой
      высоте (15 м) ради 100% покрытия и комбо x3 или сбросить воду с безопасных 40
      м с риском рассеивания капель ветром
    input_mapping: 'Клавиатура: Пробел (Space) / Левый клик мыши. Тач: крупная светящаяся
      кнопка ''DROP / СБРОС'' в правом нижнем углу экрана.'
    states:
    - 'BOMB_BAY_CLOSED: Створки заперты, гидроплан несет массу воды, на земле проецируется
      расчетный баллистический эллипс сброса.'
    - 'SALVO_RELEASE: Мгновенное распахивание гидравлических створок (0.22 с), выброс
      водяной лавины 4500 л под действием гравитации и давления наддува.'
    - 'RECOIL_UPWARD_POP: Мгновенная потеря 4.5 тонн массы + аэродинамический толчок
      отдачи: вертикальное ускорение +14.5 м/с, взмыв самолета вверх.'
    - 'TARGET_VAPORIZATION: Водяной массив накрывает очаг: мгновенное гашение огня,
      генерация взрывного столба пара, расчет очков и фиксация комбо.'
    parameters:
    - name: Время раскрытия створок
      value: 0.22 с
      tuning_note: Если сделать медленным (1.5 с) — вода размажется тонкой полосой
        и не потушит концентрированный очаг; если 0 с — пропадет механика створчатого
        механизма.
    - name: Ширина пятна водяного удара
      value: 28 м (с высоты 20 м)
      tuning_note: Определяет допустимую погрешность прицеливания пилота по ширине
        каньона.
    - name: Вертикальный импульс отдачи (Recoil Lift)
      value: +14.5 м/с
      tuning_note: Если уменьшить — игрок не ощутит контраста легкости; если завысить
        (+30 м/с) — самолет будет мгновенно биться о своды пещер и верхние мосты.
    - name: Порог идеального перекрытия (Ace Drop)
      value: 85% площади очага
      tuning_note: Четкая грань между обычной оценкой и рангом 'Ас-Ликвидатор' с начислением
        бонусных секунд.
    feedback_layers:
    - 'Визуал/VFX: Из брюха самолета вырывается колоссальная белая лавина воды с объемным
      шлейфом тумана; при ударе о землю пламя взрывается гигантским грибом белого
      пара; экран кратковременно заволакивает дымкой.'
    - 'Звук (Web Audio): Мощный металлический глухой хлопок створок бомболюка (''КЛАЦ-БУМ'')
      -> оглушительный низкочастотный свист падающей массы воды -> шипящий грохот
      мгновенно испаряющегося пламени (Steam Hiss).'
    - 'Камера: Резкий вертикальный толчок камеры вверх с последующим кинематографичным
      отдалением (zoom-out FOV с 65° до 80°) для демонстрации масштаба потушенного
      пожара.'
    - 'UI/Тактильность: Всплывающая плашка ''ИДЕАЛЬНЫЙ СБРОС! +1500 PTS (x3 COMBO)'';
      мощный одиночный виброудар (haptic heavy impact 120 мс).'
    failure_mode: Игрок нажимает сброс слишком рано (вода падает в реку перед пожаром)
      или слишком поздно (перелетает очаг), в результате чего огонь не потушен, бак
      пуст, а драгоценные секунды таймера потрачены впустую.
    mastery_curve: Новичок сбрасывает воду наугад с большой высоты, распыляя ее по
      верхушкам скал. Эксперт заходит на бреющем полете под углом 30°, сбрасывает
      4.5 тонны в эпицентр и на реактивном импульсе отдачи перепрыгивает через горящий
      скальный хребет.
    counterplay: Очаги пожаров окружены дымовыми завесами, скрывающими точные границы
      эпицентра, и восходящими турбулентными вихрями, сдувающими струю воды.
    synergies:
    - 'Динамическая трансформация массы: сброс моментально возвращает самолет в легкое
      маневренное состояние LIGHT_AGILE.'
    - 'Паровой форсаж: сброс на очаг генерирует пар, заряжающий шкалу нитро-ускорителя.'
    why_unique: Сброс воды — это не просто выстрел ракетой, а физическое разделение
      двух гигантских масс, кардинально меняющее аэродинамику носителя в долю секунды.
    pseudocode: "function tickSalvoWaterDrop(plane, wildfireTargets, dt) {\n  if (plane.inputDropPressed\
      \ && plane.waterTank > 500) {\n    const droppedAmount = plane.waterTank;\n\
      \    plane.waterTank = 0;\n    plane.velocity.y += (droppedAmount / plane.emptyMass)\
      \ * 14.5;\n    spawnWaterBombCascadeVFX(plane.bombBayPosition, droppedAmount);\n\
      \    triggerHeavyHapticImpact();\n    const hitTarget = wildfireTargets.find(target\
      \ => target.isUnderTrajectory(plane.bombBayPosition, plane.velocity));\n   \
      \ if (hitTarget) {\n      const accuracy = hitTarget.calculateOverlap(plane.bombBayPosition,\
      \ droppedAmount);\n      hitTarget.extinguish(droppedAmount * accuracy);\n \
      \     plane.addComboScore(accuracy > 0.85 ? 3 : 1);\n      spawnSteamMushroomVFX(hitTarget.position);\n\
      \    }\n  }\n}"
  - name: Термические восходящие потоки и дымовой фронт
    role_in_loop: Тактический элемент окружения, работающий как вертикальный лифт-ускоритель
      и зона термической опасности
    player_decision: Направить тяжелый самолет прямо сквозь раскаленный термик над
      огнем для мгновенного набора высоты к верхнему очагу или обойти дымовую стену
      стороной, избегая перегрева моторов
    input_mapping: 'Клавиатура: выравнивание крыльев по горизонту (A/D) внутри столба
      потока для максимального захвата термика. Мышь/Тач: плавное удержание курса
      по центру теплового вихря.'
    states:
    - 'CLEAR_AIR: Чистый холодный воздух каньона, стандартная температура двигателей
      (80°C), нормальная видимость.'
    - 'THERMAL_LIFT_CAPTURE: Вход в восходящий столб горячего воздуха над пожаром,
      прирост вертикальной тяги (+9.5 м/с), легкая турбулентная болтанка.'
    - 'SMOKE_OVERHEAT_ZONE: Пребывание в плотном черном дыму более 2.0 секунд, рост
      температуры моторов до 120°C, кашель двигателей и падение горизонтальной тяги
      на 35%.'
    - 'THERMAL_EXIT_APEX: Выброс гидроплана на вершину термического потока с набором
      максимальной кинетической энергии.'
    parameters:
    - name: Вертикальная скорость термика
      value: +9.5 м/с
      tuning_note: Если сделать слабой (+3 м/с) — тяжелый самолет не сможет набрать
        высоту над пламенем; если слишком сильной (+25 м/с) — самолет выбросит за
        пределы каньона.
    - name: Радиус тепловой колонны
      value: 32 м вокруг эпицентра
      tuning_note: Задает ширину безопасного коридора подхвата перед сбросом воды.
    - name: Скорость нагрева двигателей в дыму
      value: +22°C в секунду
      tuning_note: Определяет жесткий лимит времени (не более 2.5 с) нахождения в
        плотном дымовом фронте.
    - name: Порог критического перегрева
      value: 115°C
      tuning_note: При превышении активирует детонационный стук моторов и потерю тяги.
    feedback_layers:
    - 'Визуал/VFX: Оранжево-красное марево горячего воздуха (Heat Haze шейдер); летящие
      горящие угли и хлопья пепла вдоль фонаря кабины; потемнение краев экрана от
      копоти.'
    - 'Звук (Web Audio): Глухой рокот восходящего огненного шторма, треск горящих
      деревьев, учащенный писк датчика температуры масла (EGT Alarm).'
    - 'Камера: Камера испытывает ритмичную вертикальную микро-тряску (турбулентность
      термика) с легким креном вслед за воздушными завихрениями.'
    - 'UI/Тактильность: Термометр двигателей на приборной панели пульсирует красным;
      прерывистая тревожная вибрация на геймпаде/смартфоне.'
    failure_mode: Игрок зависает в дымовом шлейфе слишком долго, двигатели перегреваются
      и теряют тягу, в результате чего тяжелый гидроплан проседает в огненные верхушки
      деревьев.
    mastery_curve: Новичок шарахается от дыма и огня, теряя высоту и не успевая занять
      позицию для сброса. Эксперт намеренно ныряет в термический шлейф на 1.5 секунды,
      используя подъемную силу для бесплатного взлета на 25 метров прямо к верхнему
      очагу на скальной полке.
    counterplay: Огненные смерчи и турбулентные сдвиги ветра на границах термика стремятся
      накренить гидроплан и сбросить его на скальную стену.
    synergies:
    - 'Динамическая трансформация массы: термик нивелирует штраф к тяжести полного
      бака, превращая уязвимость в тактическое преимущество.'
    - 'Залповый баллистический водосброс: сброс воды мгновенно гасит очаг и схлопывает
      термический поток, прекращая турбулентность.'
    why_unique: Огонь выступает не просто статичной текстурой урона или преградой,
      а динамической аэродинамической средой с восходящей тягой и тепловым менеджментом.
    pseudocode: "function tickThermalUpdraft(plane, fireZones, dt) {\n  for (const\
      \ zone of fireZones) {\n    const dist = plane.position.distanceTo(zone.position);\n\
      \    if (dist < zone.radius && zone.intensity > 0) {\n      const liftForce\
      \ = (1.0 - dist / zone.radius) * 9.5;\n      plane.velocity.y += liftForce *\
      \ dt;\n      plane.engineTemp += 22.0 * zone.smokeDensity * dt;\n      applyTurbulenceJitter(plane,\
      \ 0.4);\n      if (plane.engineTemp > 115) {\n        plane.engineThrustModifier\
      \ = 0.65;\n        triggerOverheatWarningUI();\n      }\n    }\n  }\n  plane.engineTemp\
      \ = Math.max(80, plane.engineTemp - 14.0 * dt);\n}"
  - name: Паровой форсаж и слаломный граунд-эффект
    role_in_loop: Двигатель темпа, инструмент скоростного спасения в критических ситуациях
      и награда за чистое пилотирование
    player_decision: Использовать накопленный паровой форсаж для мгновенного прорыва
      через опасный узкий завал или приберечь его для скоростного финишного рывка
      к выходу из каньона
    input_mapping: 'Клавиатура: Shift / Двойной клик Space. Мышь: Правая кнопка мыши.
      Тач: кнопка ''STEAM BOOST'' слева от штурвала.'
    states:
    - 'BOOST_ACCUMULATING: Накопление пара в ресиверах за счет тушения огня и бреющего
      полета над рекой (0..100%).'
    - 'BOOST_READY: Заряд полон (100%), готов к активации на 3.5 секунды форсированной
      тяги.'
    - 'STEAM_INJECTION_ACTIVE: Впрыск перегретого пара в турбины: прирост скорости
      +45 км/ч, иммунитет к сваливанию, шлейф белого пара за соплами.'
    - 'GROUND_EFFECT_PASSIVE: Пассивный аэродинамический экран при полете на высоте
      < 3 м от русла: подъемная сила +20%, сопротивление -15%.'
    parameters:
    - name: Прирост скорости на форсаже
      value: +45 км/ч (до 235 км/ч)
      tuning_note: Если завысить (+90 км/ч) — игрок не среагирует на поворот скалы;
        если занизить (+15 км/ч) — форсаж не ощутится как спасительный рывок.
    - name: Длительность форсажа
      value: 3.5 с
      tuning_note: Идеальное окно для преодоления одной S-образной связки каньона.
    - name: Потолок высоты экранного эффекта
      value: 3.0 м
      tuning_note: Мотивирует игрока рисковать и лететь максимально близко к воде
        и дну ущелья.
    - name: Заряд за идеальное тушение
      value: 50% от емкости ресивера
      tuning_note: Два идеальных сброса гарантируют полный заряд нитро-пара.
    feedback_layers:
    - 'Визуал/VFX: Двойной мощный конический шлейф белого пара из сопел за хвостом;
      радиальное размытие (radial blur) по краям экрана; эффект сжатия пространства.'
    - 'Звук (Web Audio): Резкий шипящий гидроудар клапана впрыска -> басовитый свист
      реактивной струи пара, перекрывающий шум винтов.'
    - 'Камера: Динамический откат камеры назад с расширением угла обзора (FOV увеличивается
      с 75° до 90°), подчеркивающий взрывное ускорение.'
    - 'UI/Тактильность: Индикатор давления пара на приборной доске загорается неоново-голубым
      пламенем; непрерывная нарастающая вибрация высокой частоты (60 Гц).'
    failure_mode: Активация форсажа прямо перед крутым изгибом скалы без предварительного
      крена приводит к мгновенному тарану гранитной стены на скорости 235 км/ч.
    mastery_curve: Новичок забывает про форсаж или активирует его в скалу. Эксперт
      включает форсаж в нижней точке виража, используя экранный эффект для молниеносного
      прострела через теснину прямо на следующий речной забор.
    counterplay: Узкие скальные арки и падающие горящие сосны поперек ущелья требуют
      филигранного микроконтроля направления во время действия бешеного ускорения.
    synergies:
    - 'Бреющее глиссирование и водозабор: форсаж позволяет мгновенно компенсировать
      потерю скорости после забора 4.5 тонн воды.'
    - 'Залповый баллистический водосброс: успешное тушение заряжает ресивер пара.'
    why_unique: Форсаж заправляется не абстрактными аркадными канистрами с нитро,
      а термодинамическим продуктом тушения — паром от контакта сброшенной воды с
      бушующим пламенем.
    pseudocode: "function tickSteamBoostAndGroundEffect(plane, riverSurface, dt) {\n\
      \  const altitude = plane.position.y - riverSurface.getHeightAt(plane.position.x,\
      \ plane.position.z);\n  if (altitude < 3.0 && altitude > 0) {\n    plane.liftCoefficient\
      \ = plane.baseLiftCoeff * 1.2;\n    plane.dragCoefficient = plane.baseDragCoeff\
      \ * 0.85;\n  }\n  if (plane.inputBoostPressed && plane.steamCharge >= 100 &&\
      \ !plane.isBoosting) {\n    plane.isBoosting = true;\n    plane.boostTimer =\
      \ 3.5;\n    plane.steamCharge = 0;\n    triggerSteamBoostVFX(plane.engineExhaustPos);\n\
      \  }\n  if (plane.isBoosting) {\n    plane.velocity.z += 12.5 * dt;\n    plane.boostTimer\
      \ -= dt;\n    if (plane.boostTimer <= 0) plane.isBoosting = false;\n  }\n}"
tech_spec:
  language: TypeScript (strict mode)
  bundler: Vite
  renderer: threejs
  renderer_version: ^0.185.1
  physics_engine: Rapier3D (@dimforge/rapier3d-compat ^0.20.0)
  state_manager: Reactive EventBus / Nanostores State Architecture
  audio_engine: 'Web Audio API (Howler.js with html5: false)'
  target_fps: 60
  max_draw_calls: 65
  max_triangles_or_sprites: 38000
  bundle_size_budget_mb: 4.2
  layers:
  - description: Инициализация, загрузчик ассетов, интеграция Playgama Bridge
    name: Application Layer
  - description: Физика полета, гидродинамика, система пожаров, спавн каньона
    name: Core Simulation Layer
  - description: Three.js сцена, кастомные шейдеры, инстансинг партиклов, пост-эффекты
    name: Rendering Layer
  - description: Реактивный HUD, тач-контроллеры, приборные шкалы, меню ангара
    name: UI / Presentation Layer
  modules:
  - description: Физическая модель гидроплана, расчет подъемной силы, сопротивления
      и массы
    name: FlightPhysicsModule
  - description: Глиссирование по реке, забор воды в баки и генерация кильватерного
      следа
    name: WaterScoopModule
  - description: Управление очагами огня, расчет баллистики сброса и генерация пара
    name: FireExtinguishModule
  - description: Генерация процедурного ущелья, расстановка термиков и чекпоинтов
    name: CanyonSlalomModule
  - description: Высокопроизводительный инстансинг эффектов огня, брызг и дыма
    name: VFXParticleModule
  - description: Адаптивный сенсорный штурвал и приборный авиационный HUD
    name: UIControllerModule
monetization:
  strategy_summary: 'Игроко-центричная гибридная монетизация: добровольные Rewarded
    видео за второй шанс при аварии и удвоение наград вылета, плюс редкие Interstitial
    между заездами со строгим кулдауном в 100 секунд.'
  rewarded_placements:
  - id: revive
    name: Второй шанс / Огнетушащая пена
    benefit: Мгновенный подъем гидроплана на безопасную высоту перед текущим очагом
      с полным баком воды
    cooldown_or_limit: 1 раз за вылет
    trigger_moment: Экран аварии при столкновении со скалой (таймер 5 секунд)
  - id: double_reward
    name: Двойная премия спасателя
    benefit: Удвоение заработанных очков модернизации и престижа за проведенный вылет
    cooldown_or_limit: Без ограничений
    trigger_moment: Экран успешного завершения вылета (Debriefing)
  - id: plane_trial
    name: Тест-драйв ТИТАН-800
    benefit: Бесплатный вылет на тяжелом самолете «ТИТАН-800» с увеличенным баком
      на 1 раунд
    cooldown_or_limit: Раз в 10 минут
    trigger_moment: Главное меню / Ангар при выборе заблокированного борта
  interstitial_placements:
  - trigger_event: Переход в ангар с экрана итогов вылета (Debriefing)
    cooldown_seconds: 100
    conditions: Показ только после завершения минимум 2 успешных вылетов, не чаще
      одного раза в 100 секунд
  in_app_purchases:
  - sku: sku_starter_pack
    name: Набор ветерана авиалесоохраны
    description: Эксклюзивная пламенная окраска «Красный Феникс» + 5000 очков модернизации
      ангара
    price_tier: Tier 1 ($0.99 / 99 Янов)
    reward: Уникальная ливрея + стартовые очки
  - sku: sku_plane_titan
    name: Гидросамолет ТИТАН-800
    description: Тяжелый двухпалубный гидроплан с баками 7000 литров и титановыми
      поплавками
    price_tier: Tier 3 ($2.99 / 299 Янов)
    reward: Премиум самолет ТИТАН-800
  - sku: sku_no_ads
    name: Отключение межстраничной рекламы
    description: Полное отключение межстраничных баннеров между вылетами
    price_tier: Tier 2 ($1.99 / 199 Янов)
    reward: Отключение Interstitial Ad
  fairness_rules:
  - Никакой принудительной рекламы посреди 45-60 секундного полета
  - Любой гидроплан в ангаре можно открыть за чистое игровое мастерство и престиж
  - Просмотр Rewarded Video всегда дает гарантированный и ощутимый бонус
playgama:
  sdk_version: '@playgama/bridge 2.x'
  supported_platforms:
  - Yandex Games
  - VK Play
  - CrazyGames
  - Mobile Web
  - Desktop Web
  initialization_flow:
  - Bridge.init() на старте загрузчика
  - Проверка платформы и типа устройства (Desktop/Mobile)
  - Загрузка облачных сохранений игрока (Cloud Storage)
  - Инициализация баннеров и проверка готовности Rewarded видео
  - Старт рендера 3D-сцены ангара
  cloud_save_keys:
  - pilot_level
  - unlocked_planes
  - canyon_stars
  - high_scores
  - hangar_upgrades
  leaderboards:
  - canyon_speedrun_s1
  - global_extinguish_score
  ads_integration:
    interstitial_enabled: true
    rewarded_enabled: true
    sticky_banner_enabled: false
  lifecycle_hooks:
  - 'При старте рекламы: заглушить Web Audio API и поставить физику на паузу'
  - 'При закрытии рекламы: возобновить звук и вернуть управление'
  - 'При сворачивании вкладки браузера: авто-пауза вылета'
art:
  style_name: Стилизованный кинематографичный Low-Poly / Stylized Semi-Realism с акцентными
    шейдерами огня и воды
  camera_perspective: Third-person chase camera (вид от третьего лица строго позади
    фюзеляжа с пружинным стабилизатором Spring Arm и динамическим FOV)
  camera_fov: 65
  camera_pitch_angle: 12
  environment_theme: Глубокий каньон из красного слоистого песчаника на закате, охваченный
    яростным верховым лесным пожаром, с бирюзовой бурной рекой на дне и горящими соснами
    на уступах
  character_proportions: Гидроплан-амфибия с характерными массивными поплавками, широким
    верхним крылом, красно-бело-желтой пожарной окраской и детализированным водяным
    баком
  lighting_setup: 'Драматичный закатный контраст: теплое золотисто-оранжевое контровое
    солнце, зловещее алое свечение пылающих лесов и холодные голубоватые тени в расщелинах
    ущелья'
  color_palette:
