      строится на пространственном планировании защитных рубежей прямо в полете.
    biggest_risk: Сложность оценки игроком скорости распространения огня на открытой
      местности; решается четкими маркерами вектора ветра и тепловой подсветкой.
    production_cost: 'Высокий: клеточная симуляция распространения огненного фронта,
