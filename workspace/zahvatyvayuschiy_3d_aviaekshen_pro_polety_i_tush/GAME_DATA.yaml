      через узкие тоннели и ущелья, где скольжение по воде дает бесконечный гидро-буст
      для разгона и прыжков над огненными ловушками.'
    core_verb: Дрифтовать по воде и бустить (входить в затяжные дуги глиссирования
      по изгибам реки для зарядки супер-ускорения и выстреливать водяной пушкой по
      огненным гейзерам).
    genre_family: 3D Аркадный Флайт-Раннер / Трюковая Спидран-Гонка
    session_shape: Быстрый трюковой забег на 40–50 секунд с комбо-множителем за непрерывное
      скольжение по реке и разрушение огненных препятствий.
    camera: Низкая динамическая экшен-камера прямо над хвостом гидроплана (Close Tail
