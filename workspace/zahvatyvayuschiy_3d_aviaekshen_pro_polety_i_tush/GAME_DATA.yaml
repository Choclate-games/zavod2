  category: Двигатель цикла подготовки ресурса и главный источник динамического риска
    у поверхности воды
  priority: core
  description: Вместо шаблонного сбора парящих светящихся сферок забор воды реализован
    как честный гидродинамический контакт с поверхностью реки, создающий физическое
    трение и перегрузку корпуса.
  player_interaction: 'Клавиатура: удерживать W / Стрелку вниз (прижать нос к воде)
