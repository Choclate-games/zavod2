    control_scheme: 'ПК: A/D — резкий крен и занос (дрифт по воде), Пробел — водяной
      залп, Shift — гидро-буст. Телефон: Свайпы влево/вправо для стрейфа и дрифта,
      быстрый тап — водяной залп, свайп вверх — форсажный буст.'
    world: 'Вулканический остров в тропиках: черные базальтовые скалы, потоки лавы,
      светящиеся бирюзовые лагуны, водопады и геотермальные гейзеры.'
    spectacle: Сверхзвуковой гидроплан с неоновой подсветкой крыльев дрифтует боком
      по зеркальной глади вулканического озера, поднимая две светящиеся дуги брызг,
      и на форсаже вылетает сквозь огненное кольцо гейзера.
    why_not_generic: Связка mechanics/drift_scoring.md (накопление комбо-буста за
