  selected_id: D1
  selected_name: 'Огненный Каньон: Водный Сброс'
  selection_reason: 'Вариант D1 («Огненный Каньон: Водный Сброс») идеально воплощает
    замысел пользователя: передает физический контраст между легким маневренным гидропланом
    и тяжелеющим от воды бортом при бреющем контакте с рекой. Для браузера и мобильных
    устройств это направление дает мгновенный «флоу» в первой же секунде без обучения
    благодаря интуитивному управлению одним пальцем (прямое отклонение штурвала и
    кнопка сброса), а компактная 45–60 секундная сессия прорыва через ущелье обеспечивает
    высочайшую реиграбельность и кинематографичный визуальный ряд.'
  rejected_reasons:
  - 'D2 (Тайфун-10: Огненный Шторм) отвергнут, так как тактический оборонительный
    геймплей с прокладкой противопожарных барьеров смещает фокус с кинестетического
    удовольствия от пилотирования и бреющего полета в сторону менеджмента карты, что
    снижает динамику короткой сессии.'
  - 'D3 (Турбо-Всплеск: Горный Спидран) отвергнут, так как превращение пожаротушения
    в трюковой дрифт-раннер со сбором комбо-очков разрушает драматургию борьбы с огненной
    стихией и обесценивает ощущение тяжести набранной воды, заявленное в первоначальном
    заказе.'
  what_it_is_not:
  - Волны врагов, боевые дроны и турели на арене — единственный противник это стихия,
    перепады высот и турбулентность
  - Окно выбора из трех карт апгрейда и мета-прогрессия в стиле Vampire Survivors
  - Виртуальный экранный джойстик с россыпью мелких кнопок — управление строится на
    прямом интуитивном ведении самолета свайпом или курсором
  - Серые кубы и примитивы без шейдинга — мир каньона стилизован с яркими шейдерами
    огня, дыма и водной глади
  - Бесконечная плоская процедурная карта без выраженного рельефа — уровень представляет
    собой выразительный каньон с вертикальным геймплеем
  - волны врагов на арене
  - окно выбора из трёх карт апгрейда
  - универсальная связка «дэш + парирование + удар»
  - заимствование Vampire Survivors / Brotato как основы
  - джойстик слева + кнопки атаки справа как раскладка по умолчанию
  - серые кубы вместо стилизованной геометрии
  - мета-прогрессия «золото за забег -> постоянные апгрейды» без связи с темой
  non_negotiables:
  - 'Физическая трансформация летной модели: пустой гидроплан легкий и отзывчивый,
    набравший тонны воды — тяжелый, с проседанием по высоте и высокой инерцией'
  - 'Механика бреющего глиссирования: непрерывный физический контакт киля с рекой
    для забора воды с генерацией брызг и кильватерного следа'
  - 'Прицельный баллистический водосброс: залповое раскрытие створок и мгновенное
    тушение очага с выбросом клубов белого пара при точном попадании'
  - 'Ограниченное пространство извилистого ущелья: стены каньона, огненные смерчи
    и клубы дыма формируют естественный коридор пилотирования'
  signature_scene: Вид сзади-сверху на красно-белый гидроплан-амфибию, который на
    бреющем полете в метре над водой несется по зеркальной бирюзовой реке на дне каньона;
    два мощных веера брызг вздымаются из-под поплавков, освещенные ослепительным оранжевым
    заревом лесного пожара, бушующего на отвесных скалах по бокам, а впереди над изгибом
    ущелья поднимается исполинский столб черного дыма, прорезанный лучами закатного
    солнца.
  avoid_references:
  - Microsoft Flight Simulator (хардкорный симулятор со сложными приборными панелями)
  - Ace Combat (военные догфайты и стрельба ракетами)
  - Vampire Survivors (автошутер с выбором карточек)
  - Subway Surfers (коридорный трехполосный раннер без физики полета)
