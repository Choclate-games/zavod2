preview_status: completed
definition_of_done:
- Полностью реализована летная модель с физическим изменением массы гидроплана от
  4.5т до 9.0т при заборе воды
- Работает гидродинамическое глиссирование по реке с генерацией брызг и кильватерного
  следа
- Реализован залповый водосброс с тушением очагов, расчетом площади поражения и клубами
  белого пара
- Создан процедурный / модульный каньон из 3 секторов с горящими соснами, дымом и
  термиками
- Встроена система комбо и подсчета очков вылета с присвоением рангов S/A/B
- Полная поддержка клавиатуры/мыши на ПК и сенсорного свайп-управления на смартфонах
- 'Интегрирован Playgama Bridge SDK: баннеры, Rewarded за второй шанс, межстраничная
  реклама, лидерборд и Cloud Saves'
- Стабильные 60 FPS на целевых мобильных и десктопных браузерах при весе бандла до
  4.5 МБ
- 'Игра осталась тем, что просили: полёт: игрок управляет летящим аппаратом.'
- Project builds cleanly with zero TypeScript errors (`npm run build`).
- Playgama Bridge initializes and dispatches GAME_READY platform message.
- 'Петля играбельна целиком: Бреющий забор воды на реке -> Слалом через ущелье с тяжелым
  фюзеляжем -> Залповый сброс на очаг пожара -> Получение очков и модернизация гидроплана.'
- 'Реализованы механики проекта: Бреющее глиссирование и водозабор, Динамическая трансформация
  массы и инерции, Залповый баллистический водосброс и реактивный взмыв, Термические
  восходящие потоки и дымовой фронт.'
- Условие успеха (Ликвидация всех 3 очагов лесного пожара в каньоне за отведенные
  60 секунд вылета с успешным выходом из ущелья.) и условие проигрыша (Крушение гидроплана
  о скалы каньона при критической потере управления или истечение 60-секундного таймера
  вылета до ликвидации всех 3 очагов возгорания.) работают.
- Тач-управление отвечает без задержки, страница под игрой не скроллится.
- 'Интерфейс собран из токенов одного `src/ui/theme.css`: в экранах нет литералов
  цвета, шрифта и `z-index`.'
- Слои интерфейса прозрачны для игрового ввода — управление работает под всеми оверлеями,
  слой HUD не кликается.
- У каждого экрана работают состояния загрузки, пустоты и ошибки; возможность, которой
  нет на площадке, не нарисована вовсе.
- 'Меню и HUD помещаются в измеренный вьюпорт с учётом safe-area и баннера, а с закрытым
  игровым полем меню узнаётся как «Огненный Каньон: Водный Сброс».'
- 'За меню и экраном итога видна живая игровая сцена: полноэкранной непрозрачной заливки
  поверх канваса нет, подложка только под текстом и кнопками.'
- 'Ни одного эмодзи в подписях интерфейса: иконки — инлайновый SVG с `currentColor`.'
- Rewarded-реклама выдаёт награду ровно один раз (Второй шанс / Огнетушащая пена,
  Двойная премия спасателя, Тест-драйв ТИТАН-800); interstitial соблюдает паузу 90
  с.
- Audio and physics automatically pause/resume on tab blur and ad display.
- Persistent progress saves and loads from Playgama Cloud Storage.
- Runs at steady 60 FPS on desktop and >= 50 FPS on mobile.
