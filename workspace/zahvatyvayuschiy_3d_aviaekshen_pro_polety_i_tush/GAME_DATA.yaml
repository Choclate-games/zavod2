      Горизонтальный штурвал внизу слева для поворота, кнопка-тумблер распыления справа,
      наклон устройства для управления высотой.'
    world: 'Бескрайняя хвойная тайга ночью: темно-синий ночной лес, ослепительно-оранжевые
      расходящиеся линии низового и верхового пожара, подсвечивающие дымные облака
      снизу.'
    spectacle: Тяжелый двухмоторный самолет-танкер проносится над верхушками горящих
      елей, оставляя за собой широкий шлейф красно-розового антипирена, который мгновенно
      гасит стену огня перед деревянной вышкой лесничества.
    why_not_generic: Связка mechanics/chain_reaction.md (распространение огня по сетке
