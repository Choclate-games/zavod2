preview_prompt: 'Authentic in-game gameplay screenshot of ''Огненный Каньон: Водный
  Сброс'', a 3D Авиаэкшен game. Visual style: Стилизованный кинематографичный Low-Poly
  / Stylized Semi-Realism с акцентными шейдерами огня и воды. Camera perspective:
  Third-person chase camera (вид от третьего лица строго позади фюзеляжа с пружинным
  стабилизатором Spring Arm и динамическим FOV). Environment: Глубокий каньон из красного
  слоистого песчаника на закате, охваченный яростным верховым лесным пожаром, с бирюзовой
  бурной рекой на дне и горящими соснами на уступах. Central Action: Тяжелеющий от
  тонн воды штурвал, когда вы глиссируете в метре над бурлящей рекой, и мгновенный
  взмыв в небо при залповом сбросе лавины воды на бушующий пожар! — the moment is
  caught mid-action, with clear cause and effect readable in a single frame. Visible
  in-game HUD overlay: Изогнутая круговая шкала емкости водяного бака (0–100%) по
  правому борту прицела, Авиационный вариометр / индикатор высоты над водой (Radar
  Altimeter) слева, Центральная динамическая марка упреждения водосброса (Bomb/Drop
  Reticle), Индикатор оставшихся очагов возгорания (3/3 Очагов) по центру сверху;
  touch controls at the bottom corners. Lighting: Драматичный закатный контраст: теплое
  золотисто-оранжевое контровое солнце, зловещее алое свечение пылающих лесов и холодные
  голубоватые тени в расщелинах ущелья. Color palette: #C85A32, #FF4D00, #FFD23F,
  #E63946, #F1FAEE, #1FA7A8, #2B262D, #E8F1F5. High visual clarity, readable silhouettes,
  immersive WebGL game aesthetics.'
