raw_prompt: Захватывающий 3D авиаэкшен про полёты и тушение пожаров с видом от третьего
  лица позади гидроплана. Игрок управляет штурвалом самолета мышью, клавишами или
  свайпами, маневрируя по извилистому ущелью, охваченному огненной бурей. На экране
  виден тяжелеющий от набранной воды самолет, огненные стены на склонах, бурлящая
  река внизу и шкала запаса воды. Игрок должен на бреющем полете коснуться поверхности
  реки для набора воды, набрать высоту и метко сбросить тонны воды на главный очаг
  возгорания.
title: 'Огненный Каньон: Водный Сброс'
slug: zahvatyvayuschiy_3d_aviaekshen_pro_polety_i_tush
genre: 3D Авиаэкшен
subgenre: Физический авиасимулятор тушения пожаров / Каньон-раннер с инерцией груза
renderer: threejs
renderer_reason: 'Three.js + Rapier3D: пространственный геймплей, физика и освещение.
  Перспективная камера.'
renderer_confidence: 1.0
platform: Playgama Bridge (Yandex Games / VK / Web & Mobile)
orientation: landscape
target_audience: Мужчины и женщины 12–45 лет, любители авиаэкшенов, динамичных раннеров,
  симуляторов спасателей и зрелищных физических 3D-аркад
core_loop: Бреющий забор воды на реке -> Слалом через ущелье с тяжелым фюзеляжем ->
  Залповый сброс на очаг пожара -> Получение очков и модернизация гидроплана
hook: Тяжелеющий от тонн воды штурвал, когда вы глиссируете в метре над бурлящей рекой,
  и мгновенный взмыв в небо при залповом сбросе лавины воды на бушующий пожар!
player_fantasy: Вы — элитный пилот пожарной авиации, ведущий тяжелый гидроплан сквозь
  пылающий ад узкого каньона, где от вашего хладнокровия на бреющем полете и точности
  сброса зависят тысячи гектаров леса!
session_model: 'Спринтерский вылет на 45–60 секунд: прорыв через ущелье с 2–3 циклами
  «бреющий забор воды на реке -> набор высоты над пламенем -> залповый сброс на очаг»
  до полной ликвидации пожара.'
unique_value_proposition: Первый 3D авиаэкшен в браузере, сочетающий гидродинамику
  забора воды на бреющем полете, реальную физическую смену массы самолета и зрелищное
  тушение лесных пожаров в узком каньоне.
vision: Создать эталонный ультра-динамичный 3D авиаэкшен для веба и мобильных платформ,
  где каждый 60-секундный вылет дарит кинематографичный адреналин бреющего полета,
  тактильное ощущение тяжелеющего от воды самолета и радость спасения природы от огненной
  бури.
elevator_pitch: Динамичный 3D авиаэкшен, в котором вы на пожарном гидроплане бреющим
  полетом черпаете воду из бурной реки на дне пылающего каньона, преодолеваете тяжесть
  набранных тонн и точным залпом гасите лесные пожары за 60 секунд!
win_conditions: Ликвидация всех 3 очагов лесного пожара в каньоне за отведенные 60
  секунд вылета с успешным выходом из ущелья.
lose_conditions: Крушение гидроплана о скалы каньона при критической потере управления
  или истечение 60-секундного таймера вылета до ликвидации всех 3 очагов возгорания.
progression_summary: 'Внутри 60-секундного вылета: набор комбо (x1->x3) и форсажа.
  Между вылетами: открытие 4 типов гидропланов, прокачка вместимости баков, скорости
  забора воды и открытие новых экстремальных ущелий.'
difficulty_curve: 'Плавная ступенчатая кривая: первый сектор каньона широкий и прямой
  для легкого освоения глиссирования; второй сектор добавляет S-образные изгибы и
  дымовые смерчи; финальный сектор требует идеального расчета массы, использования
  термиков и точного сброса на скорости.'
