_readme: 'Числа этой игры. Код читает их отсюда и не содержит литералов: правка баланса
  не должна быть правкой кода. Поле value хранит значение с единицей измерения так,
  как его задал дизайнер; note объясняет, что ломается при отклонении.'
slug: zahvatyvayuschiy_3d_aviaekshen_pro_polety_i_tush
performance:
  target_fps: 60
  max_draw_calls: 65
  max_triangles: 38000
  bundle_size_budget_mb: 4.2
session:
  model: 'Спринтерский вылет на 45–60 секунд: прорыв через ущелье с 2–3 циклами «бреющий
    забор воды на реке -> набор высоты над пламенем -> залповый сброс на очаг» до
    полной ликвидации пожара.'
  win: Ликвидация всех 3 очагов лесного пожара в каньоне за отведенные 60 секунд вылета
    с успешным выходом из ущелья.
  lose: Крушение гидроплана о скалы каньона при критической потере управления или
    истечение 60-секундного таймера вылета до ликвидации всех 3 очагов возгорания.
  difficulty_curve: 'Плавная ступенчатая кривая: первый сектор каньона широкий и прямой
    для легкого освоения глиссирования; второй сектор добавляет S-образные изгибы
    и дымовые смерчи; финальный сектор требует идеального расчета массы, использования
    термиков и точного сброса на скорости.'
mechanics:
  breyuschee_glissirovanie_i_vodozabor:
    name: Бреющее глиссирование и водозабор
    parameters:
      okno_vysoty_glissirovaniya:
        value: 1.2–1.8 м
        note: Если увеличить до 3.0 м — исчезает страх касания воды и напряжение бреющего
          полета; если снизить до 0.5 м — 80% игроков разобьют самолет в первой же
          попытке.
      temp_zabora_vody:
        value: 1800 л/с
        note: Если сделать выше (3500 л/с) — забор станет мгновенным и потеряет фазу
          удержания глиссирования; если снизить (800 л/с) — таймер вылета 60 с закончится
          до первого сброса.
      gidrodinamicheskoe_zamedlenie:
        value: 18.5 м/с²
        note: Если завысить — самолет быстро свалится в штопор на воде; если занизить
          — игрок не почувствует колоссальное сопротивление забираемой массы воды.
      maksimalnaya_emkost_baka:
        value: 4500 л
        note: Если уменьшить до 2000 л — одного сброса не хватит на ликвидацию очага;
          если увеличить до 10000 л — самолет станет неподъемным утюгом.
  dinamicheskaya_transformatsiya_massy_i_inertsii:
    name: Динамическая трансформация массы и инерции
    parameters:
      bazovaya_suhaya_massa:
        value: 4500 кг
        note: Определяет стартовую резвость и базовую маневренность пустого гидроплана.
      koeffitsient_degradatsii_tangazha:
        value: 0.55 (на 45% медленнее отклик)
        note: Если снизить деградацию — игрок не почувствует вес 4.5 тонн воды; если
          завысить — самолет станет неуправляемым бревном.
      skorost_svalivaniya_pod_nagruzkoy:
        value: 135 км/ч
        note: Если установить слишком высокой (160 км/ч) — самолет будет падать в
          штопор при каждом выходе из воды; если занизить (90 км/ч) — исчезнет риск
          потери скорости.
      radius_virazha_polnogo_gidroplana:
        value: 85 м (против 38 м у пустого)
        note: 'Задает жесткую геометрию коридора ущелья: игрок обязан выбирать внешнюю
          дугу траектории.'
  zalpovyy_ballisticheskiy_vodosbros_i_reaktivnyy_vz:
    name: Залповый баллистический водосброс и реактивный взмыв
    parameters:
      vremya_raskrytiya_stvorok:
        value: 0.22 с
        note: Если сделать медленным (1.5 с) — вода размажется тонкой полосой и не
          потушит концентрированный очаг; если 0 с — пропадет механика створчатого
          механизма.
      shirina_pyatna_vodyanogo_udara:
        value: 28 м (с высоты 20 м)
        note: Определяет допустимую погрешность прицеливания пилота по ширине каньона.
      vertikalnyy_impuls_otdachi_recoil_lift:
        value: +14.5 м/с
        note: Если уменьшить — игрок не ощутит контраста легкости; если завысить (+30
          м/с) — самолет будет мгновенно биться о своды пещер и верхние мосты.
      porog_idealnogo_perekrytiya_ace_drop:
        value: 85% площади очага
        note: Четкая грань между обычной оценкой и рангом 'Ас-Ликвидатор' с начислением
          бонусных секунд.
  termicheskie_voshodyaschie_potoki_i_dymovoy_front:
    name: Термические восходящие потоки и дымовой фронт
    parameters:
      vertikalnaya_skorost_termika:
        value: +9.5 м/с
        note: Если сделать слабой (+3 м/с) — тяжелый самолет не сможет набрать высоту
          над пламенем; если слишком сильной (+25 м/с) — самолет выбросит за пределы
          каньона.
      radius_teplovoy_kolonny:
        value: 32 м вокруг эпицентра
        note: Задает ширину безопасного коридора подхвата перед сбросом воды.
      skorost_nagreva_dvigateley_v_dymu:
        value: +22°C в секунду
        note: Определяет жесткий лимит времени (не более 2.5 с) нахождения в плотном
          дымовом фронте.
      porog_kriticheskogo_peregreva:
        value: 115°C
        note: При превышении активирует детонационный стук моторов и потерю тяги.
  parovoy_forsazh_i_slalomnyy_graund_effekt:
    name: Паровой форсаж и слаломный граунд-эффект
    parameters:
      prirost_skorosti_na_forsazhe:
        value: +45 км/ч (до 235 км/ч)
        note: Если завысить (+90 км/ч) — игрок не среагирует на поворот скалы; если
          занизить (+15 км/ч) — форсаж не ощутится как спасительный рывок.
      dlitelnost_forsazha:
        value: 3.5 с
        note: Идеальное окно для преодоления одной S-образной связки каньона.
      potolok_vysoty_ekrannogo_effekta:
        value: 3.0 м
        note: Мотивирует игрока рисковать и лететь максимально близко к воде и дну
          ущелья.
      zaryad_za_idealnoe_tushenie:
        value: 50% от емкости ресивера
        note: Два идеальных сброса гарантируют полный заряд нитро-пара.
